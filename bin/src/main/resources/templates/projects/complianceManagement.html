var prjId ='';

function rowSelect(){
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(selectedRow, index) {
		rowCount = rowCount + 1;
	});
	for (var i = 0; i < selectedRows.length; i++) {
		prjId = prjId  + selectedRows[i].projectId; 
	}
	callThrghProject(prjId);
	
	$("#projectId").val(prjId);

	if (rowCount > 0) {
		$('#deleteId').attr('disabled', true);
		$("#addId").attr('disabled', false);
	} else {
		$('#deleteId').attr("disabled", false);
		$("#addId").attr('disabled', true);
	}
	
	prjId ='';
	pId ='';
}



function onSelectionChanged(){
	var selectedRows = gridOptionsCom.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(selectedRow, index) {
		rowCount = rowCount + 1;
	});
	
	if (rowCount > 0) {
		$('#deleteId').attr('disabled', false);
		$("#addId").attr('disabled', true);
	} else {
		$('#deleteId').attr("disabled", true);
		$("#addId").attr('disabled', false);
	}
	
	prjId ='';
	pId ='';
}

	agGrid.simpleHttpRequest({

		console.log('len',len)

		}
		
	});
	
}

function saveFileParent(){

	var uFile = $(uploadDoc_0Parent)[0].files[0];
	var fileName = event.currentTarget.value;
	var lastIndex = fileName.lastIndexOf("\\");
	if (lastIndex >= 0) {
		fileName = fileName.substring(lastIndex + 1);
	}
	var extension = fileName.split(".");
	var iURL = URL.createObjectURL(uFile);
	$("#uploadedBillDiv_0Parent").html("");

	if (extension[1] == "jpg" || extension[1] == "png"|| extension[1] == "jpeg"|| extension[1] == "JPG") {
		var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-picture-o' style='color: blue'></i></a></div>";
	}else if (extension[1] == "pdf") {
		var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-file-pdf-o' style='color: red'></i></a></div>";
	} else {
		var LightImg = "<div class='uploadicon position-l'> </div>";
	}
	$("#uploadedBillDiv_0Parent").html(LightImg);
	$("#fileAttachParent").html(fileName);
	var fileData = new FormData();
	fileData.append('file', uFile);
	fileData.append('path', 'none');
	console.log("aaaaaaaaa",fileData);
	
	$("#editFileAttachParent").val("");

	$.ajax({
		type : "POST",
		url : "compliance-management-upload-file",
		enctype : "multipart/form-data",
		contentType : false,
		data : fileData,
		processData : false,
		cache : false,
		success : function(response) {

		},
		error : function(e) {

		}
	});
	fileName="";
	
}

function saveCompliance(){
		var item = {};
		var datas = [];
		
		if (item.complianceNo == null || item.complianceNo == "") {
			validation = validationUpdated("Compliance No Required", 'complianceNo');
		}
		if (item.complianceName == null || item.complianceName == "") {
			validation = validationUpdated("Compliance Name Required", 'complianceName');
		}
		if (item.purpose == null || item.purpose == "") {
			validation = validationUpdated("Purpose Required", 'purpose');
		
		}
	
		if (item.fromdate == null || item.fromdate == "") {
			validation = validationUpdated("Date Required", 'fromdate');
		}
		if (item.toDate == null || item.toDate == "") {
			validation = validationUpdated("Date Required", 'toDate');
		}

		if (validation) {
			item.complianceId = $('#complianceId').val();
			item.complianceNo = $('#complianceNo').val();
			item.complianceName = $('#complianceName').val();
			item.fileAttach = $("#editFileAttachParent").val();
			item.projectId = $("#projectId").val();
			item.purpose = $('#purpose').val();
			item.fromdate = $('#fromdate').val();
			item.toDate = $('#toDate').val();
			item.status = $('#status').val();
			item.noOfPeoples = $('#noOfPeoples').val();

			
	        var editorInstance = CKEDITOR.instances.comDescription;
	        // Get content from CKEditor instance
	        if (editorInstance) {
	            var content = editorInstance.getData();
	            item.comDescription = content;
	        } else {
	            console.error("CKEditor instance not found or not initialized");
	        }
			
			
		}
		console.log(item);
		datas.push(item);
		  $.ajax({
				type : "POST",
				url : "compliance-management-add",
				dataType : "json",
				contentType : "application/json",
				data : JSON.stringify(datas),

				success : function(response) {
					if (response.message == "Success") {
						var pjId = $("#projectId").val();
						callThrghProject(pjId);
						
						cancelModalBtn();
					}

				},
				error : function(response) {
					console.log(response);

				}
				
			}); 

}

function editCompliance(id){
	$("#myModalSelected").modal('show');
	
 
	agGrid.simpleHttpRequest({
		url : "compliance-management-edit?id=" + id,
	}).then(function(data) {
		
		var jsonData = JSON.parse(data.body);
		console.log(jsonData);
		
		$("#prjstsParent").val(jsonData[0].projectstatus);
		
		$('#complianceId').val(jsonData[0].complianceId);
		$('#complianceNo').val(jsonData[0].complianceNo);
		$('#complianceName').val(jsonData[0].complianceName);
		$("#projectId").val(jsonData[0].projectId);
		$('#purpose').val(jsonData[0].purpose);
		$('#fromdate').val(jsonData[0].fromdate);
		$('#toDate').val(jsonData[0].toDate);
		$('#noOfPeoples').val(jsonData[0].nos);
		CKEDITOR.instances['comDescription'].setData(jsonData[0].comDescription);
		$("#editFileAttachParent").val(jsonData[0].fileAttach);
		editFileAttachParent = jsonData[0].fileAttach;
		var fileName=jsonData[0].fileAttach;
    	
		if (fileName != null) {
		var ext = fileName.split(".");

       if (ext[1] == "jpg" || ext[1] == "png") {
			var LightImg = '<div class ="uploadicon position-l"><a class="example-image-link" target="_balnk"><i class="fa fa-picture-o" style="color: blue" onclick=viewImage("'
				+ fileName + '")></i></a> </div>';
		}else if (ext[1] == "pdf") {
			var LightImg = '<div class ="uploadicon position-l"><a class="example-image-link" target="_balnk"><i class="fa fa-file-pdf-o" style="color: red" onclick=viewImage("'
				+ fileName + '")></i></a> </div>';
		} else {
			var LightImg = "<div class='uploadicon position-l'> </div>";
		}  
       console.log("parent"+LightImg);
		$("#uploadedBillDiv_0Parent").html(LightImg);
	}
	fileName="";
		
		$('#status').val(jsonData[0].status);
	}); 
	
}

										</div>

												</label>
												<div class="controls">
													<input type="file" class="document" id="uploadDoc_0Parent"

												</div>
											</div>
												<input type="hidden" id="editFileAttachParent">
												<input type="hidden" id="uploadHiddenParent_0"
													class="uploadHidCls" >
												<div id="uploadedBillDiv_0Parent" align="center"

												<div id="fileAttachParent" class="imageName"

										</div>
									</div>


										<div class="col-lg-3">
											<div class="form-group">

											</div>
										</div>


										<div class="col-lg-4">

													id="calculatefromdate"></i>
											</div>
										</div>

										<div class="col-lg-4">
											<div class="form-group calendar_box">
												<label> Valid To Date</label> <input type="text" id="toDate"

													th:attr="onkeyup=|formatDate('toDate','${session.DATEFORMAT_JS}')|">
												<i class="ti-calendar picker_calendar" id="calculatetoDate"></i>
											</div>
										</div>
										<div class="col-lg-3">
											<div class="form-group">

										</div>
										<div class="col-lg-4">

												</div>
											</div>
										</div>
										
										<div class="col-lg-12">

											</div>

									</div>
								</div>
								
									<div class="modal-footer">

						</div>
					</div>
				</div>


				</div>
			</div>
		</div>
