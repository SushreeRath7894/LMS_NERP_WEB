function saveMultiFile(event) {
	var AssignItemQty = event.currentTarget.value;

	var lastIndex = fileName.lastIndexOf("\\");
	if (lastIndex >= 0) {
		fileName = fileName.substring(lastIndex + 1);
	}
	extension = fileName.split(".");
	console.log(extension,'extension')
	extension = extension && extension?.length ? extension[extension.length - 1] : "";
	console.log(extension,'extension')
	var iURL = URL.createObjectURL(uFile);
	$("#uploadedBillDiv_" + counter).html("");

function saveAttachment() {
    var datas = [];
    var uploadList = [];
    var isValid = true;

    $("#doctbodyData > tr").each(function() {
        var documentInput = $(this).find(".document");
        var docNoInput = $(this).find(".docNoclss");
        var dateInput = $(this).find(".cal-input");

        var uFile = documentInput[0].files[0];
        var fileName = documentInput.val();
        var docDate = dateInput.val();
        var x = []; 

        documentInput.siblings(".error-message").remove();
        docNoInput.siblings(".error-message").remove();
        dateInput.siblings(".error-message").remove();

        if (!fileName) {
            isValid = false;
            documentInput.after('<span class="error-message" style="color:red;">Document Required</span>');
        }

        if (!docNoInput.val()) {
            isValid = false;
            docNoInput.after('<span class="error-message" style="color:red;">Document Name Required</span>');
        }

        if (!docDate) {
            isValid = false;
            dateInput.after('<span class="error-message" style="color:red;">Date Required</span>');
        }

        if (fileName) {
            var lastIndex = fileName.lastIndexOf("\\");
            if (lastIndex >= 0) {
                fileName = fileName.substring(lastIndex + 1); 
            }

            var reader = new FileReader();
            reader.readAsDataURL(uFile);

            reader.onload = function() {
                var data = reader.result.split(",");
                x.push(data[1]); 
            };
        } else {
            if ($("#prjDocumentId").val()) {
                fileName = $(this).find(".uploadHidCls").val(); 
            } else {
                x = []; 
            }
        }

        var uploadData = {};
        uploadData['prjDocumentId'] = $("#prjDocumentId").val();
        uploadData['documnentName'] = docNoInput.val();
        uploadData['docDate'] = docDate;
        uploadData['documentFile'] = x;
        uploadData['fileName'] = fileName;
        uploadData['imageNameEdit'] = $(this).find(".uploadHidCls").val();

        uploadList.push(uploadData); 
        console.log('DOC', uploadData);
    });

    if (!isValid) {
        return;
    }

    setTimeout(function() {
        var obj = {};
        obj.projectId = $("#prjId").val();
        obj.documentTypeId = $("#typeId").val();
        obj.documentList = uploadList;

        datas.push(obj);
        saveAllDocument(datas); 
    }, 1000);
}


function saveAllDocument(datas) {

	console.log("dataset-------------------" + JSON.stringify(datas));

	$.ajax({
		type : "POST",
		url : "technical-datasheet-add",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			if (response.message == "Success") {
				
				$("#messageParagraph").text("Data Saved Successfully");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
								
				
				location.reload();
				 
			}

		},
		error : function(datas) {
			console.log(datas)
		}
	})

}
