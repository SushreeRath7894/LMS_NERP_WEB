<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<script>
var  jsonData = "";
document.addEventListener('DOMContentLoaded', function() {

	var gridDiv = document.querySelector('#myGrid');
	new agGrid.Grid(gridDiv, gridOptions);
	 
	let currentURL = window.location.href;
	let url = new URL(currentURL );
	let params = new URLSearchParams(url.search);
	let encid = params.get('id');
	let projectid = window.atob(encid);
	
	gridOptions.api.setRowData();
	agGrid.simpleHttpRequest({
		url : "project-execution-monitoring-view?id="+projectid,
	}).then(function(data) {
		jsonData = JSON.parse(data.body);
		console.log(jsonData,'json')
		var len = jsonData.length;
			let arr = [];
				let dataset = [];
				jsonData.forEach(e => {
					if(!arr.includes(e.planning_name)) {
						arr.push(e.planning_name);
						let obj = {};
						obj.planning_name = e.planning_name;
						obj.activityId = '';
					//	obj.amount = e.totalamount;
						
						dataset.push(obj);
					}
					e.planning_name = '';
					dataset.push(e);
				});
				//dataset.push(new Object({"activityName":allData[0].activityName}))
				console.log(dataset)
				
				$('#totalReqs').find('span').html(len);
				gridOptions.api.setRowData(dataset);
	
		
	}); 

});

var columnDefs = [
	 {
		headerCheckboxSelection: false,
		headerCheckboxSelectionFilteredOnly: false,
		checkboxSelection: true,
		width: 10,
		sortable: false,
		filter: false,
		resizable: true

	},  {
		headerName: 'Planning Name',
		width: 250,
		field: "planning_name",
	},
	{
		headerName: 'Activity Name',
		width: 250,
		field: "activityId",
	/*  cellRenderer : function(params) {
					return '<a onclick=editCrop("'
					+ params.data.cropId
					+ '") href="javascript:void(0)">'
					+ params.data.cropId + '</a>';
		}  */
		
	}, {
		headerName: 'Actual Start Date',
		width: 250,
		field: "asDate",
	}, {
		headerName: 'Actual End Date',
		width: 250,
		field: "aeDate",
	}, {
		headerName: 'Status',
		width: 350,
		field: "monitoringStatus",
	},

];
var gridOptions = {
		columnDefs: columnDefs,
		defaultColDef: {
			sortable: true,
			filter: true,
			resizable: true,
			width: 200,
			height: 20
		},
		rowSelection: 'single',
		//onSelectionChanged : onSelectionChangeData
	};
	

function onQuickFilterChanged() {
	gridOptions.api
			.setQuickFilter(document.getElementById('quickFilter').value);
	}

	

function downloadData() {
	var dataset = [];
	gridOptions.api
				.forEachNodeAfterFilterAndSort(function(rowNode, index) {
					dataset.push(rowNode.data);

				});
	gridOptions.api.exportDataAsCsv(dataset);
}



</script>
</head>

<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">
						<div class="row" id="categoryDiv">
							<div class="col-md-4 " id="totalReqs">
								<h3>
									Plans(<span></span>)
								</h3>
							</div>
					
							<div class="col-md-4 btn-hs" id="searchRowDiv1">
								<div class="input-style">
									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput"
										oninput="onQuickFilterChanged()" id="quickFilter"
										autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey"
											onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter1').val('');document.getElementById('closeKey').style.display='none';"
											class="close_i"><i class="ti-close srchicon"></i></span></a><a
											href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
									</div>
								</div>
							</div>

							<div class="col-md-4 buttonsec btn-hs" id="btndiv">
								<button class="btn4" id="downloadBtn" onclick="downloadData()">DOWNLOAD</button>
							</div>
							<div id="myGrid" style="width: 100%; height: 250px;"
								class="ag-theme-alpine"></div>

						</div>


					</div>
				</div>
				
				
			</div>
		</div>
	</div>
</body>
</html>
