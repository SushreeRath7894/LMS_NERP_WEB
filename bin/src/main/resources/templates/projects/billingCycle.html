		$('#totalReq').find('span').html(len);

			  }

var gridOptionsGrn = {
		columnDefs : columnDefsGrn,
		rowSelection : 'single',

		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 251,
			height : 10
		},
		//onSelectionChanged : rowSelect,

	};
var prjId ='';
function rowSelect() {
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(selectedRow, index) {
		rowCount = rowCount + 1;
	});
	for (var i = 0; i < selectedRows.length; i++) {
		prjId = prjId  + selectedRows[i].projectId; 
	}
	callThrghProject(prjId);

	if (rowCount > 0) {
		$('#delete').attr('disabled', false);
		$("#reject").attr('disabled', false);
		$("#approve").attr('disabled', false);
		$("#add").attr('disabled', true);
	} else {
		$('#delete').attr('disabled', true);
		$("#reject").attr('disabled', true);
		$("#approve").attr('disabled', true);
		$("#add").attr('disabled', false);
	}
	
	prjId ='';
	
}



function onQuickFilterChanged() {
	gridOptions.api
			.setQuickFilter(document.getElementById('quickFilter').value);
	  var displayedRowCount = gridOptions.api.getDisplayedRowCount();
	    var len = displayedRowCount;
		$('#totalReq').find('span').html(len);
}


function onQuickFilterChangedGrn() {
	gridOptionsGrn.api
			.setQuickFilter(document.getElementById('quickFilterGrn').value);
	  var displayedRowCount = gridOptionsGrn.api.getDisplayedRowCount();
	    var len = displayedRowCount;
		$('#totalGrn').find('span').html(len);
}


function cancelBar() {
	var id = document.getElementById("closeKey");
	id.style.display = "block";
	if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
		id.style.display = "none";
	}
}

function cancelBarGrn() {
	var id = document.getElementById("closeKeyGrn");
	id.style.display = "block";
	if ($('#quickFilterGrn').val() == null || $('#quickFilterGrn').val() == "") {
		id.style.display = "none";
	}
}


function callThrghProject(prjId){
	
	agGrid.simpleHttpRequest({
		url : "billing-cycle-grn?id=" + prjId,
	}).then(function(data) {
		var jsonData = JSON.parse(data.body);
		if(jsonData == null){
			gridOptionsGrn.api.setRowData();
		}else{
			var len = jsonData.length;
			console.log('len',len)
			$('#totalGrn').find('span').html(len);
			gridOptionsGrn.api.setRowData(jsonData);
		}
		
		
	});
	
}
