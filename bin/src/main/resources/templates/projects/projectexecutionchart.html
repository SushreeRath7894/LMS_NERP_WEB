<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}">
<head>
  <meta charset="UTF-8">
  <title>Gantt</title>
  <!--<script src="https://code.highcharts.com/gantt/highcharts-gantt.js"></script>
  <script src="https://code.highcharts.com/gantt/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/gantt/modules/accessibility.js"></script>-->
  <style>
    #container {
      max-width: 1200px;
      margin: 1em auto;
    }
  </style>
  <script>



  
    $(document).ready(function() {
              
          let currentURL = window.location.href;
          let url = new URL(currentURL );
          let params = new URLSearchParams(url.search);
          let encid = params.get('id');
          let projectid = window.atob(encid);
              
            getexecutiondata(projectid);

            //  getexecutiondataedit(projectid);
              });

              function getexecutiondata(projectid){	
               
                  $.ajax({
                          type: "GET",
                          url : 'project-execution-ganttChartList?id='+ projectid,
                          contentType: "application/json",
                          success: function (data) {
          
                            var jsonData = JSON.parse(data.body);
                            // var allData = jsonData.viewProjectData;

                            let dataset = [];
                            let uniquePlanId = [];
                            jsonData.forEach(e => {
                              console.log(e)
                              if(!uniquePlanId.includes(e.planningId)) {
                                uniquePlanId.push(e.planningId);
                                let o = {};
                                o.name = e.planningName;
                                o.id = e.planningId;
                                o.owner = 'N/A';
                                o.start = parseInt(e.startDate);
                                o.end = parseInt(e.maxDate);
                                dataset.push(o);

                                let o1 = {};
                                o1.name = e.categoryName;
                                o1.id = e.categoryid;
                                o1.owner = e.assignedTo;
                                o1.start = parseInt(e.startDate);
                                o1.end = parseInt(e.endDate);
                                o1.parent = e.planningId;

                                dataset.push(o1);
                              } else {
                                let o1 = {};
                                o1.name = e.categoryName;
                                o1.id = e.categoryid;
                                o1.owner = e.assignedTo;
                                o1.start = parseInt(e.startDate);
                                o1.end = parseInt(e.endDate);
                                if(e.categoryid == e.parentId) {
                                  o1.parent = e.planningId;
                                } else {
                                  o1.parent = e.parentId;
                                }

                                dataset.push(o1);
                              }
                            })
                            
                            createGanttChart(dataset)

                          }, error: err => {
                            console.log(err)
                          }
                        })
                     
                 }


        
                 function createGanttChart(dataset) {
                	 const day = 24 * 36e5,
                	    today = Math.floor(Date.now() / day) * day;
					console.log('before==>',dataset)
                	// Adjust data to ensure tasks with same start and end date are displayed
                	const adjustedDataset = dataset.map(point => {
                	    if (point.start === point.end) {
                	        point.end += 9 * 36e5; // Adding one hour
                	    }
                	    return point;
                	});
                	
                	console.log(adjustedDataset)

                	const options = {
                	    chart: {
                	        plotBackgroundColor: 'rgba(128,128,128,0.02)',
                	        plotBorderColor: 'rgba(128,128,128,0.1)',
                	        plotBorderWidth: 1
                	    },

                	    plotOptions: {
                	        series: {
                	            borderRadius: '50%',
                	            connectors: {
                	                dashStyle: 'ShortDot',
                	                lineWidth: 2,
                	                radius: 5,
                	                startMarker: {
                	                    enabled: false
                	                }
                	            },
                	            groupPadding: 0,
                	            dataLabels: [{
                	                enabled: true,
                	                align: 'left',
                	                format: '{point.name}',
                	                padding: 10,
                	                style: {
                	                    fontWeight: 'normal',
                	                    textOutline: 'none'
                	                }
                	            }, {
                	                enabled: true,
                	                align: 'right',
                	                format: '{#if point.completed}{(multiply ' +
                	                    'point.completed.amount 100):.0f}%{/if}',
                	                padding: 10,
                	                style: {
                	                    fontWeight: 'normal',
                	                    textOutline: 'none',
                	                    opacity: 0.6
                	                }
                	            }]
                	        }
                	    },

                	    series: [{
                	        name: 'Offices',
                	        data: adjustedDataset
                	    }],

                	    tooltip: {
                	        pointFormat: '<span style="font-weight: bold">{point.name}</span><br>' +
                	            '{point.start:%e %b}' +
                	            ' → {point.end:%e %b}<br>' +
                	            '{#if point.completed}' +
                	            'Completed: {multiply point.completed.amount 100}%<br>' +
                	            '{/if}' +
                	            'Owner: {#if point.owner}{point.owner}{else}unassigned{/if}'
                	    },

                	    title: {
                	        text: 'Gantt Project Management'
                	    },
                	    
                	    exporting: {
                	        buttons: {
                	            contextButton: {
                	                enabled: false
                	            }
                	        }
                	    },

                	    xAxis: [{
                	        currentDateIndicator: {
                	            color: '#2caffe',
                	            dashStyle: 'ShortDot',
                	            width: 2,
                	            label: {
                	                format: ''
                	            }
                	        },
                	        dateTimeLabelFormats: {
                	            day: '%e<br><span style="opacity: 0.5; font-size: 0.7em">%a</span>'
                	        },
                	        grid: {
                	            borderWidth: 0
                	        },
                	        gridLineWidth: 0.5,
                	        custom: {
                	            today,
                	            weekendPlotBands: true
                	        }
                	    }],

                	    yAxis: {
                	        grid: {
                	            borderWidth: 0
                	        },
                	        gridLineWidth: 0,
                	        labels: {
                	            symbol: {
                	                width: 8,
                	                height: 6,
                	                x: -4,
                	                y: -2
                	            }
                	        },
                	        staticScale: 30
                	    },

                	    accessibility: {
                	        keyboardNavigation: {
                	            seriesNavigation: {
                	                mode: 'serialize'
                	            }
                	        },
                	        point: {
                	            descriptionFormatter: function (point) {
                	                const completedValue = point.completed ?
                	                        point.completed.amount || point.completed : null,
                	                    completed = completedValue ?
                	                        ' Task ' + Math.round(completedValue * 1000) / 10 +
                	                            '% completed.' :
                	                        '',
                	                    dependency = point.dependency &&
                	                        point.series.chart.get(point.dependency).name,
                	                    dependsOn = dependency ?
                	                        ' Depends on ' + dependency + '.' : '';

                	                return Highcharts.format(
                	                    '{point.yCategory}.{completed} Start ' +
                	                    '{point.x:%Y-%m-%d}, end {point.x2:%Y-%m-%d}. Owner: ' +
                	                    '{point.owner}.{dependsOn}',
                	                    { point, completed, dependsOn }
                	                );
                	            }
                	        }
                	    },

                	    lang: {
                	        accessibility: {
                	            axis: {
                	                xAxisDescriptionPlural: 'The chart has a two-part X axis ' +
                	                    'showing time in both week numbers and days.'
                	            }
                	        }
                	    }
                	};

                	Highcharts.ganttChart('container', options);

	}
       
   </script>
</head>
<body>

<div layout:fragment="content" class="maincontent">
  <!-- Main content -->
  <div class="container-fluid">
    <div class="row">
      <div class="maincontentsec">
        <div class="content_padding">
          <div id="container"> </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>

</html>
