<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/project-v1/project.css">
<script type="text/javascript" src="/javaScript/project-v1/project-creation.js"></script>
</head>


<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition">
			<div class="tab-content">

				<!--Tabbination 1 Start-->
				<div id="tab1" class="tab-pane active">
					<div class="d-flex flex-column flex-lg-row">
						<!--Left Sec Start-->
						<div class="box-sec" id="collapseWidthR1">
							<div class="out-box">
								<div class="d-flex justify-content-between border-bottom p-2">
									<div class="col-md-8 col-12">
										<div class="d-flex gap-2 search-sec">
											<input class="form-control search_input_bar"
												placeholder="Search..." type="text" name="search"
												id="quickFilter" autocomplete="off">
											<button class="btn go-btn" onclick="onQuickFilterChanged()"
												id="SearchBtn" type="button">Go</button>
											<button class="btn go-btn" type="reset" onclick="resetBtn()">Reset</button>
										</div>
									</div>
									<div class="col-md-2 text-end">
										<button class="btn btn-primary max-btn" id="collapseButtonR1"
											onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
											data-bs-placement="top" title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
										</button>
									</div>
								</div>
								<div class="card m-2 p-2">
									<div id="myGrid" class="ag-theme-alpine"
										style="height: 100vh; width: 100%;"></div>
								</div>
							</div>
						</div>
						<!--Left Sec End-->

						<!--Right Sec Start-->
						<div class="box-sec" id="collapseWidthL1">
							<div class="out-box">
								<div
									class="d-flex justify-content-between border-bottom align-items-center p-2">
									<!--Right Inner Tab Start-->
									<ul class="nav nav-pills newtab" role="tablist">
										<li class="nav-item"><a class="nav-link active"
											data-bs-toggle="pill" href="#vital">Basic Information</a></li>
									</ul>
									<button class="btn btn-primary max-btn" id="collapseButtonL1"
										type="button" onclick="triggerExpansionL(1)"
										data-bs-toggle="tooltip" data-bs-placement="top"
										title="Expand">
										<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
											class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
									</button>
								</div>


								<!-- Tab panes -->
								<div class="tab-content flex-fill">
									<div id="vital" class="tab-pane fade show active p-2 h-100">
										<div class="d-flex gap-2 h-100 flex-column">
											<!--<div class="requisition-tbl">
												<table class="table table-bordered mb-0" width="100%">
													<tr valign="middle">
														<td>
															<div class="col-md-12 voucher-info d-none">
																Project Id :<span id="projectId"></span>
															</div>
															<div class="col-md-12">
																<span class="head-user-name" id="project-name-header"></span>
															</div>
														</td>
														<td>
															<div class="d-flex gap-2 flex-wrap justify-content-end">
                                <button class="btn btn-primary m-0 edit-btn" id="addProjectBtn" onclick="addNewProject();" type="button">Add</button>
                                <button class="btn btn-primary m-0 edit-btn" id="editProject" onclick="editProject();" type="button">Edit</button>
                                <button class="btn btn-primary m-0 edit-btn" id="save" type="button">Save</button>
															</div>
														</td>
													</tr>
												</table>
											</div>-->

                      <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                        <div class="project-name flex-1"><span class="head-user-name" id="project-name-header"></span></div>
                        <div class="d-flex justify-content-end gap-2 flex-1">
                          <button class="btn btn-primary m-0 edit-btn" id="addProjectBtn" onclick="addNewProject();" type="button">Add</button>
                          <button class="btn btn-primary m-0 edit-btn" id="editProject" onclick="editProject();" type="button">Edit</button>
                          <button class="btn btn-primary m-0 edit-btn" id="save" type="button">Save</button>
                        </div>
                      </div>

											<div class="card p-2">
												<div class="d-flex flex-column h-100 gap-2" id="addProject">
													<div class="d-flex justify-content-end">
														<div class="text-danger fw-bold">
															Note: All fields marked with <span>*</span> are
															mandatory.
														</div>
													</div>

													<div class="d-flex flex-column h-100 gap-2 form-top">
														<div class="row g-3">
															<input type="hidden" id="projectId">
															<div class="col-lg-4">
																<div class="form-group">
																	<label>Project Name <span class="mandatory">*</span></label>
																	<input type="text" id="projectName"
																		class="form-control">
																</div>
															</div>
															<div class="col-lg-4">
																<div class="form-group">
																	<label> Project In-charge</label> <input type="text"
																		id="projectIncharge" class="form-control">
																</div>
															</div>
															<div class="col-lg-4">
																<div class="form-group calendar_box">
																	<label>Date</label> <span class="mandatory">*</span>
																	<div class="position-relative">
																		<input type="text" id="date"
																			class="form-control"
																			onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('date','${session.DATEFORMAT_JS}')|"
																			readonly> <i
																			class="ti-calendar picker_calendar" id="DateCalendar"></i>
																	</div>
																</div>
															</div>
															<div class="col-lg-4">
																<div class="form-group">
																	<label>Status <span class="mandatory">*</span></label> <select id="status"
																		class="form-select border">
																		<option value="">Select</option>
																		<option value="1">Active</option>
																		<option value="0">Inactive</option>
																	</select> <span class="focus"></span>
																</div>
															</div>
															<div class="col-lg-4">
																<div class="form-group">
																	<label>Project Type</label>
																	<select class="form-select border" id="projectType"
																		onblur="removeValid(event)">
																		<option value="">Select</option>
																		<option th:each="c,iter:${projectList}"
																			th:value="${c.key}" th:text="${c.name}"></option>
																	</select>
																</div>
															</div>
															<div class="col-lg-4">
																<div class="form-group">
																	<label>Pin</label> <input
																		type="text" id="pinCode" maxLength="6"
																		onkeyup="mobVal4();checkNumeric('pinCode');"
																		onbur="removeValid(event)" class="form-control">
																	<span id="error3" clalss="formValidation3"></span>
																</div>
															</div>
															<div class="col-md-12">
																<label for="location">Address <span
																	class="mandatory">*</span></label>
																<textarea id="address" name="location"
																	class="form-control" rows="3"></textarea>
															</div>
														</div>
                            <div class="form-group d-flex flex-column h-100">
                              <div class="disableEditDoc d-flex flex-column h-100 gap-2" id="meetingDtls">
                                <div class="d-flex w-100 justify-content-between align-items-center">
                                  <label>Documents</label>

                                  <div class="d-flex gap-1 task-btn-sec">
                                    <button class="btn go-btn" id="addDocBtn"
                                            title="Add" onclick="addDocument();">
                                      <i class="fa fa-plus-square" aria-hidden="true"></i>
                                    </button>
                                    <button class="btn go-btn" id="cancelBtn"
                                            title="Clear Field" onclick="cancelDocForm();">
                                      <i class="fa fa-window-close" aria-hidden="true"></i>
                                    </button>
                                    <button class="btn go-btn" id="editBtn"
                                            title="Edit" onclick="editDocDtls()">
                                      <i class="fa fa-pencil-square" aria-hidden="true"></i>
                                    </button>
                                    <button class="btn go-btn" id="deleteBtn"
                                            title="Delete" onclick="deleteDoc();">
                                      <i class="fa fa-trash"></i>
                                    </button>
                                    <button class="btn go-btn" id="docSaveBtn"
                                            title="Save" onclick="saveDoc();">
                                      <i class="fa-solid fa-floppy-disk"></i>
                                    </button>
                                  </div>
                                </div>
                                <div class="grid-container">
                                  <div class="ag-theme-alpine grid-size" id="docDtlsGrid"></div>
                                </div>
                                <div class="" id="toggleSection" style="display: none;">
                                  <div class="d-flex justify-content-end"></div>
                                  <div class="row">

                                    <div class="col-md-12">
                                      <h5 class="sub-header-new">Attach File To
                                        Projects</h5>
                                    </div>


                                    <div class="col-lg-12">
                                      <div class="row">
                                        <div class="col-md-10 btn-hs1">
                                          <div class="font-design"></div>
                                        </div>
                                        <div class="col-md-2 butttonsec"></div>
                                      </div>

                                      <table id="docTbl" cellspacing="7" cellpadding="7">
                                        <thead>
                                        <tr class="tr_clone">
                                          <th width="620">Document Name</th>
                                          <th width="480">Attachment</th>
                                        </tr>
                                        </thead>

                                        <tbody id="doctbodyData">
                                        </tbody>
                                      </table>
                                      <input type="hidden" id="docSlNo">
                                    </div>

                                  </div>
                                </div>
                              </div>
                            </div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>
</body>
</html>
