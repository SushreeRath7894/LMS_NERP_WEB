<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<link rel="stylesheet" href="../css/project/budget-estimate-new.css">
<script type="text/javascript"
	src="../javaScript/project/budget-estimate-new.js"></script>

</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition mt-3 mb-3">

			<!-- Tab panes -->
			<div class="tab-content">

				<!--Tabbination 1 Start-->
				<div id="ipd" class="tab-pane active mt-5">
					<div class="row">

						<!--Left Sec Start-->
						<div class="col-md-6 pd-r tab-width-css">
							<div class="out-box">
								<div class="row d-flex  mb-20" id="upperOne">

									<div class="col-md-10" id="searchRowDiv1">
										<div class="input-style">
											<input type="text" placeholder="Search.." name="search"
												class="searchboxinput" onkeyup="cancelBar()"
												oninput="onQuickFilterChanged()" id="quickFilter"
												autocomplete="off">
											<div class="searchicon">
												<a href="javascript:void(0)"><span
													style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
													id="closeKey"
													onclick="gridOptions1.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalPrj').find('span').html(gridOptions1.api.getModel().getRowCount());"
													class="close_i"><i class="ti-close srchicon"></i></span></a><a
													href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
											</div>
										</div>

										<div class="col-md-2 d-flex justify-content-end">
											<div class="btn btn-primary max-btn">
												<!-- <i class="fas fa-arrow-up"></i>-->
												<i class="fas fa-arrows-alt"></i>
											</div>
										</div>

									</div>


									<div class="requisition-tbl table-responsive">
										<div id="myGrid1" style="height: 500px;"
											class="ag-theme-alpine"></div>

									</div>
								</div>
							</div>
						</div>

						<!--Left Sec End-->



						<!--Right Sec Start-->
						<div class="col-md-6 pd-l">
							<div class="out-box">

								<div class="btn btn-primary max-btn">
									<!-- <i class="fas fa-arrow-up"></i>-->
									<i class="fas fa-arrows-alt"></i>
								</div>



								<!--Right Inner Tab Start-->
								<ul class="nav nav-pills newtab mb-20" role="tablist">
									<li class="nav-item wd-11" role="presentation"><a
										class="nav-link active" data-bs-toggle="pill" href="#basic"
										aria-selected="true" role="tab">Budget Information</a></li>


								</ul>

								<div class="tab-content"
									style="height: 500px; overflow-y: scroll;">
									<div id="basic" class="tab-pane active">
										<div class="mb-2">
											<input type="hidden" id="pID">
											<table class="table  mb-0" width="100%">
												<tr valign="middle">
													<td width="50%"></td>

													<td>
														<div class="d-flex justify-content-end gap-2">



															<div class="">
																<button class="btn edit-btn" id="enableFields1"
																	onclick="enableFields1()">Edit</button>

															</div>

															<div class="">
																<button class="btn edit-btn" id="saveTableData"
																	onclick="saveTableData()">SAVE</button>

															</div>

															<div class="">
																<button class="btn edit-btn" id="delete"
																	onclick="deleteModalfun()">DELETE</button>

															</div>






														</div>

													</td>
												</tr>
											</table>
										</div>

										<div class="row">

											<div id="myGrid" style="width: 100%; height: 200px;"
												class="ag-theme-alpine"></div>


										</div>





										<div class="bdr-btn d-flex justify-content-between">
											<div
												style="text-align: right; color: red; font-weight: bold;">
												Note: All fields marked with <span>*</span> are mandatory.
											</div>
										</div>


										<div class="row">
											<div class="col-md-12">
												<input type="hidden" id="budgetId"> <input
													type="hidden" id="parentSlNo">

											</div>
											<div class="form-group">
												<span id="projectId1" class="slide-span-text"></span>
											</div>
											<div class="col-md-4">
												<div class="form-group mb-10">
													<label>Activity</label><span class="mandatory">*</span>

													<div class="select">
														<select class="" id="budgetCategory" onchange="subCat()"
															onblur="removeValid(event);"  disabled>
															<option th:value="NULL">Select</option>
															<option th:each="c,iter:${budgetCategoryList}"
																th:value="${c.key}" th:text="${c.name}"></option>
														</select>
													</div>
												</div>
											</div>
											<div class="col-md-4">
													<div class="form-group mb-10">
														<label>Task</label><span class="mandatory">*</span>

														<div class="select">
															<select class="" id="item" onblur="removeValid(event);">
																<option th:each="c,iter:${budgetSubCategoryList}"
																	th:value="${c.key}" th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>
												<div class="col-md-4">
												<div class="form-group mb-10">
													<label>Unit</label><span class="mandatory">*</span>
													<div class="select">
														<select id="unit" onblur="removeValid(event)">
															<option value="">Select</option>
															<option th:each="c,iter:${unitList}" th:value="${c.key}"
																th:text="${c.name}"></option>
														</select>
													</div>
												</div>
											</div>

											<div class="row">
												<!-- <div class="col-md-12">
													<div class="form-group mb-10">
														<label>Task</label><span class="mandatory">*</span>

														<div class="select">
															<select class="" id="item" onblur="removeValid(event);">
																<option th:each="c,iter:${budgetSubCategoryList}"
																	th:value="${c.key}" th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div> -->
												<!-- <div class="col-md-2">
													<div class="form-group">
														<label class="custom-file-upload"
															style="margin-top: 18px;" onclick="addSubCategory()">
															<i class="ti-plus"></i> Add
														</label>
													</div>
												</div> -->
											</div>

											<div class="col-md-6">
												<div class="form-group mb-10">
													<label>Extra Amount</label> <input type="text" id="actual"
														class="form-control" onkeyup="calculateTotal();">
												</div>
											</div>
											<!-- <div class="col-md-6">
												<div class="form-group mb-10">
													<label>Unit</label><span class="mandatory">*</span>
													<div class="select">
														<select id="unit" onblur="removeValid(event)">
															<option value="">Select</option>
															<option th:each="c,iter:${unitList}" th:value="${c.key}"
																th:text="${c.name}"></option>
														</select>
													</div>
												</div>
											</div> -->
											<div class="col-md-6">
												<div class="form-group mb-10">
													<label>Quantity</label><span class="mandatory">*</span> <input
														type="hidden" id="cropAmnt"> <input type="text"
														id="qty" onblur="removeValid(event)" class="form-control"
														onkeyup="calculateTotal();">
												</div>
											</div>

											<div class="col-md-6">
												<div class="form-group mb-10">
													<label>Rate</label><span class="mandatory">*</span> <input
														type="text" id="rate" onblur="removeValid(event)"
														class="form-control" onkeyup="calculateTotal();">
												</div>
											</div>
											<div class="col-md-6">
												<div class="form-group mb-10">
													<label>Duration</label><span class="mandatory">*</span> <input
														type="text" id="nos" onblur="removeValid(event)"
														class="form-control" onkeyup="calculateTotal();">
												</div>
											</div>
											<!-- <div class="col-md-6">
										<div class="form-group">
											<label>Mob/Demob</label> <input type="text" id="mob"
												class="form-control">
										</div>
									</div> -->
											<div class="col-md-6">
												<div class="form-group mb-10">
													<label>Total Amount</label><span class="mandatory">*</span>
													<input type="text" id="amount" class="form-control"
														readonly>
												</div>
											</div>
											<div class="col-md-6">
												<div class="form-group mb-10">
													<label>Projected Expenses</label> <span class="mandatory">*</span>
													<input type="text" id="projected" class="form-control"
														readonly>
												</div>
											</div>

										</div>

									</div>


								</div>


							</div>
						</div>




					</div>
				</div>



			</div>
		</div>
	</div>



</body>
</html>
