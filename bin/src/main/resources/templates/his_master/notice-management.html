<body>

													<button class="btn go-btn" type="button"
														onclick="onQuickFilterChanged()">Go</button>
													<button class="btn go-btn" type="button"
														onclick="reset()">Reset</button>
												</div>
											</div>
											<button class="btn max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>

										</div>
										<div class="card m-2 p-2">
							    	  <input type="hidden" id="sessionId" th:value="${userId}" /> 
										<input type="hidden" id="sessionName" th:value="${userName}" />
									  <input type="hidden" id="sessionOrganization" th:value="${organization}" />
								    	<input type="hidden" id="sessionOrgDivision" th:value="${orgDivision}" /> 
										<input type="hidden" id="baseURL" th:value="${baseURL}" />
										<input type="hidden" id="sessionLogo" th:value="${logo}" />
										
						                <div id="myGrid" style="width: 100%; height: 100vh;" class="ag-theme-alpine"></div>
									  
						          </div>
							   </div>
					        </div>
							<!--Left Sec End--> <!--Right Sec Start-->
						      <div class="box-sec" id="collapseWidthL1">
						        <div class="out-box">
									<div class="d-flex justify-content-between flex-row-reverse p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1" type="button"
											onclick="triggerExpansionL(1)" data-bs-toggle="tooltip"  title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i>
											<i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>
										<!--Right Inner Tab Start-->
								        <ul class="nav nav-pills newtab" role="tablist">
								          <li class="nav-item" role="presentation"><a class="nav-link active" data-bs-toggle="pill" href="#noticeTab" aria-selected="true" role="tab" id="infoBtn">Notice Details</a></li>
								      </ul>
									</div>
							        <!-- Tab panes -->
							        <div class="tab-content flex-fill">
							          <div id="noticeTab" class="tab-pane active p-2 h-100" role="tabpanel">
								          <div class="requisition-tbl d-flex flex-column h-100 gap-2">

														</td>
														  <td>
														  <div class="d-flex justify-content-end gap-2">

																<button class="btn btn-primary  edit-btn" type="button" id="downloadNotice" onclick="downloadNotice();">Download</button>
														  	</div>
														  </td>
									                	</tr>
													</tbody>
												</table>
											  </div>-->

                            <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                              <div class="project-name"><span class="head-user-name" id="noticeId1"></span></div>
                              <div class="d-flex justify-content-end w-100 flex-wrap gap-2 flex-1">
                                <button class="btn m-0 edit-btn" type="button" id="newNotice" onclick="newNotice();editNotice();">Add</button>
                                <button class="btn m-0 edit-btn" type="button" id="editNotice" onclick="editNotice();">Edit</button>
                                <button class="btn m-0 edit-btn"type="button" id="deleteNotice" onclick="deleteNotice();">Delete</button>
                                <button class="btn m-0 edit-btn" type="button" id="draftNotice" onclick="saveNotice('DRAFT');">Draft</button>
                                <button class="btn m-0 edit-btn" type="button" id="publishNotice" onclick="saveNotice('SUBMIT');">Publish</button>
                                <button class="btn m-0 edit-btn" type="button" id="cancelNotice" onclick="cancelNotice();viewData();">Cancel</button>
                                <button class="btn m-0 edit-btn" type="button" id="downloadNotice" onclick="downloadNotice();">Download</button>
                              </div>
                            </div>

											<div class="card p-2">
												<div class="row">
													<div class="col-12">
														<div class="row row-cols g-3">
															<div class="col-auto align-content-center">
																<label>Publish Date:</label>
															</div>
															<div class="col-2 position-relative">
																<input type="text"
																id="publishDate" class="form-control"
																onblur="removeValid(event)"
																th:attr="onkeyup=|formatDate('publishDate','${session.DATEFORMAT_JS}')|"
																readonly> <i class="ti-calendar picker_calendar"
																id="dateCalendar"></i>
															</div>
															<div class="col-auto ms-auto align-content-center">
																<span class="fw-bold">Publish To : </span>
																<span id="publishTo">ALL</span>
															</div>
														</div>
													</div>
													<!-- <div class="form-group mt-2 date-class">
														Publish To : <span id="publishTo">ALL</span>
													</div>
													<div class="col-md-12"></div>
													<div class="col-md-3">
														<div class="form-group calendar_box">
															<label>Publish Date</label> 
															<input type="text"
																id="publishDate" class="form-control"
																onblur="removeValid(event)"
																th:attr="onkeyup=|formatDate('publishDate','${session.DATEFORMAT_JS}')|"
																readonly> <i class="ti-calendar picker_calendar"
																id="dateCalendar"></i>
														</div>
													</div> -->
													<div class="col-md-12">
														<div class="form-group">
															<label>Subject:</label>
															<textarea id="noticeSubject" class="form-control"
																style="height: 50px;" onblur="removeValid(event)"></textarea>
														</div>
													</div>
													<div class="col-lg-12">
														<div class="form-group1 mt-2">
															<label class="mb-2">Notice Content: </label>
															<textarea id="noticeContent" class="form-control noticeContent"
																onblur="removeValid(event)"></textarea>
														</div>
														<input type="hidden" id="commentckdreason" onblur="removeValid(event)">
													</div>
													<div class="col-md-6 mt-3">
														<div class="form-group">
															<label>Publish By ID:</label> <input type="text"
																class="form-control transparenttxtbox" id="publishBy"
																readonly>
														</div>
													</div>
													<div class="col-md-6 mt-3">
														<div class="form-group">
															<label>Publish By Name:</label> <input type="text"
																class="form-control transparenttxtbox" id="publishByName"
																readonly>
														</div>
													</div>
												</div>
											</div>
										</div>
							          </div>
							          
							        </div>
								<!--Right Inner Tab End-->
						        </div>
						      </div>
							<!--Right Sec End-->
						</div>
					
					</div>
				</div>
			</div>
		</div>
			
		<div id="confirmExitModal" class="modal fade show" aria-modal="true">
			<div class="modal-dialog modal-confirm">
				<div class="modal-content">
					<div class="modal-header flex-column">
					</div>
					<div class="modal-body">
						<p>Do You Really Want To Apply Resignation? This Process Cannot Be Undone.</p>
					</div>
					<div class="modal-footer justify-content-center mt-2" style="margin-top: -30px;">
						<button type="button" class="btn btn-primary edit-btn" data-bs-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-primary edit-btn" data-bs-dismiss="modal" onclick="saveResignApply()">Yes</button>
					</div>
				</div>
			</div>
		</div>
							
		<div id="deletResignModal" class="modal fade show" aria-modal="true">
			<div class="modal-dialog modal-confirm">
				<div class="modal-content">
					<div class="modal-header flex-column"></div>
						<div class="modal-body">
							<p>Do you really want to delete this room? This process
								cannot be undone.</p>
						</div>
						<div class="modal-footer justify-content-center"
							style="margin-top: 0px;">
							<button type="button" class="btn btn-primary edit-btn" onclick="cancelModalBtn();">Cancel</button>
							<button type="button" class="btn btn-primary edit-btn" onclick="deleteOnClick();">Delete</button>
							<!-- <img src="../assets/gif/loader.gif">  -->
						</div>
				</div>
			</div>
		</div>

	</div>
</body>
</html>
