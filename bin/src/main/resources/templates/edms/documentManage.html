<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>


	<script src="../javaScript/edms/documentManage.js"></script>
	<script src="../javaScript/edms/documentManageAccess.js"></script>
	<link rel="stylesheet" href="../assets/css/edms/workspace.css" />
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
	<!-- <link rel="stylesheet"
	href="../css/production-plan/rmpm-requisition.css"> -->



</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<!--Tabination 1 Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2 mb-20">
										<div class="col-md-8">
											<form class="d-flex search-sec position-relative">
												<input class="form-control me-2" id="seacrhInput" autoComplete="off" type="text" placeholder="Search">
												<button class="btn btn-primary go-btn" onClick="onQuickFilterChanged()" type="button">Go</button>
												<button class="btn go-btn w-auto mx-2"  type="button" onclick="resetBtn()">Reset</button>
											</form>
										</div>
										<div class="col-md-2 d-flex justify-content-end">
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i>
												<i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>

									</div>
										<!-- <div class="font-design px-2" id="userGroupSec">
											Group List(<span></span>)
										</div> -->
										<div id="myGrid1" style="width: 100%; height: 420px;" class="ag-theme-alpine p-2"></div>
								
								</div>

							</div>

							<!--Left Sec End-->
							<div id="snackbar" class="snackbar"></div>
							
							<!-- Right Section Start -->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">

									<!-- Left aligned max-btn -->
									<div class="d-flex flex-row-reverse justify-content-between align-items-center p-2 bdr-line">
									<button class="btn btn-primary max-btn" id="collapseButtonL1" type="button" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
										<i class="fa-solid fa-maximize" id="expandIconL1"></i>
										<i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                  					</button>

									<!-- Right aligned buttons -->
									<div class="d-flex gap-2">
										<ul class="nav nav-pills newtab" role="tablist"
											id="tabMenu">
											<li class="nav-item"><a class="nav-link active" data-bs-toggle="pill"
												id="userGroupNav" href="#groupCreation" onclick="createWorkspace()">User
												Group</a></li>
										</ul>
									</div>
								</div>
									<!-- Tab Start -->
									<!-- Start of Tab Content -->
									<div class="tab-content" id="tabContent">
										<!-- Create Workspace -->
										<div id="groupCreation" class="tab-pane active p-2">

											<div class="requisition-tbl ">

												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tr valign="middle">
															<td width="50%"><strong>
																	<div class="col-md-12 requisition_ids_text">
																		Group Id: <span id="groupId"></span>
																	</div>
																</strong></td>
															<!-- <td width="10%">Male</td>
																<td width="10%">45</td> -->
															<td>
																<div class="d-flex justify-content-end">
																	<div class="mr-2">
																		<button
																			class="btn btn-primary operation-btn  operation-btn-active"
																			type="button" id="add-btn"
																			onclick="newFolderDetailsAdd()">Add</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button"
																			onclick="editFolder()">Edit</button>
																	</div>
																	<div class="mr-2">
																		<!-- <button
																				class="btn btn-primary edit-btn operation-btn"
																				type="button" id="ticket-editBtn"
																				onclick="editItems()">Edit</button> -->
																		<input type="hidden" class="form-control"
																			id="editTktId">

																	</div>

																	<div class="mr-2" id="parentSaveBtn">
																		<button class="btn btn-primary edit-btn"
																			onclick="saveGroup()"
																			type="button">Save</button>
																	</div>
																	<!-- <div class="mr-0">
																			<button
																				class="btn btn-primary edit-btn operation-btn"
																				type="button" id="next-btn-parent"
																				style="display: none"
																				onclick="nextBtnFunction('readAccess')">Next</button>
																		</div> -->

																</div>

															</td>
														</tr>
													</table>
												</div>
												<form>
													<div class="content-header">
														<!-- Modal Header -->
														<div class="form-modal-header">
															<h4 class="modal-title">Create Group</h4>

														</div>
														<div class="row">
															<div id="createGroup">
																<div id="main">
																	<!-- <button data-toggle="collapse" href="#collapseExample"
																			role="button" aria-expanded="true"
																			aria-controls="collapseExample" class="collapse-btn"
																			id="document_upload">Create Group</button> -->
																	<!--</h2>-->


																	<div class="collapse multi-collapse show mb-20"
																		id="collapseExample">

																		<div class="row">
																			<div class="col-md-4 btn-hs1">
																				<div class="font-design"></div>
																			</div>
																			<!-- <div class="col-md-8 butttonsec">
																					<button class="approve-btn" id="save"
																						onclick="saveGroup()">Save</button>

																				</div>
 -->
																		</div>

																		<table id="docTbl" cellspacing="7"
																			cellpadding="7">
																			<thead>
																				<tr class="tr_clone">
																					<!-- <th align="center"></th> -->
																					<th width="320">Group Name</th>
																					<th width="320">Description</th>
																				</tr>
																			</thead>
																			<tbody id="doctbodyData">
																				<input type="hidden" id="groupId">
																				<tr>
																					<td>
																						<div class="form-group">
																							<input type="text" value=""
																								class="form-control docDesc"
																								id="groupName">
																						</div>
																					</td>

																					<td>
																						<div class="form-group">
																							<input type="text" value=""
																								class="form-control docDesc"
																								id="desc">
																						</div>
																					</td>
																					<td>
																				</tr>
																			</tbody>
																		</table>

																		<div class="row">

																			<div class="col-md-6">
																				<div class="form-group"
																					id="addUserSectioon">
																					<div>Add User:</div>

																					<select id="multiple8" multiple>
																						<option
																							th:each="c,iter:${emplists}"
																							th:value='${c.key}'
																							th:text="${c.name}">
																						</option>
																					</select> <input type="hidden"
																						id="toHiddenIdMeeting">

																				</div>
																			</div>
																		</div>
																	</div>
																</div>
															</div>
														</div>


													</div>
												</form>
											</div>
										</div>
									</div>
									<!-- end of Tab Content -->
								</div>
								<!-- Tab End -->
							</div>
							<!-- Right Section End -->
						</div>
						<!--Tabbination 1 End-->

					</div>

				</div>
			</div>

		</div>
	</div>
</body>

</html>
