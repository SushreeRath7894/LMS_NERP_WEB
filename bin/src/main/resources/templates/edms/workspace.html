<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style>
.disabled-folders {
    background-color: #dddddd; /* Change this to the desired background color for disabled options */
    color: #999999; /* Change this to the desired text color for disabled options */
}



.selected-name {
  display: flex;
  align-items: center;
  padding: 5px;
  border: 1px solid #ccc;
  border-radius: 5px;
  margin: 5px;
  background-color: blue;
  color: white;
}

.remove-icon {
  margin-left: 10px;
  cursor: pointer;
  color: red;
}

.selected-user-container {
  display: flex;
  flex-wrap: wrap;
}

.selected-group-container {
  display: flex;
  flex-wrap: wrap;
}

.selected-group-name {
  display: flex;
  align-items: center;
  padding: 5px;
  border: 1px solid #ccc;
  border-radius: 5px;
  margin: 5px;
  background-color: blue;
  color: white;
}


</style> 
<script  src="../javaScript/edms/workspace.js"></script>
<script  src="../javaScript/edms/variableNvalidation.js"></script>

<body>


<div layout:fragment="content" class="maincontent">

		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">

						<div class="d-flex justify-content-between" id="tdiv">
							<div class="btn-hs" id="totalWorkSpace">
								WorkSpace List(<span></span>)
							</div>
							<div class="col-md-4  btn-hs" id="searchDiv">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search"
									class="searchboxinput" onkeyup="cancelBar()"
									oninput="onQuickFilterChanged()" id="quickFilter"
									autocomplete="off">
								<div class="searchicon">
									<a href="javascript: void(0)"><span
										style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
										id="closeKey"
										onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#tdiv').find('span').html(gridOptions.api.getModel().getRowCount());"
										class="close_i"><i class="ti-close srchicon"></i></span></a>
										<a
										href="javascript: void(0)"><i class="ti-search srchicon"></i></a>
								</div>
							</div>

						</div>
							<div class="buttonsec btn-hs" id="ttbtn">
								<button class="download-btn" id="download"
									onclick="downloadDetails()">Download</button>
								<button class="delete-btn" id="reqDltBtn" onclick="deleteFun()">DELETE</button>
								<button class="new-btn" id="newBtn" onclick="newPlans();">NEW</button>
							</div>
						</div>

						<input type="hidden" id="sessionId" th:value="${userId}" /> <input
							type="hidden" id="sessionName" th:value="${userName}" /> <input
							type="hidden" id="hrRole" th:value="${hrRole}" /> <input
							type="hidden" id="sessionRole" th:value="${userRole}" /> <input
							type="hidden" id="adRole" th:value="${adRole}" />
						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>

						<div class="collapse" id="demo">
							<div class="innercontent">
								<div class="innerstickybg">
									<div class="row">

										<div class="col-md-6"></div>

										<div class="col-md-6" align="right">
											<button class="cancel-btn" id="cancelBtn" onclick="cancel()">Cancel</button>
											<button class="approve-btn" id="save"
												onclick="masterSaveData();">Save</button>
										</div>
									</div>

								</div>
								<div class="row innersticky_contentgap">
									<input type="hidden" id="workspaceId">
									<div class="col-md-6">
										<div class="form-group">
											<label> Parent Folder </label>
											<div class="select">
												<select class="" id="parentFolderName"
													onblur="removeValid(event);">
													<option value="">Select</option>
													<option th:each="c,iter:${parentFolder}" th:value="${c.key}"
														th:text="${c.name}" th:data-code="${c.code}"></option>
														
												</select>
											</div>
										</div>
									</div>
									<div class="col-md-6">
										<div class="form-group">
											<label> New Folder Name </label> <input type="text"
												class="form-control" id="newFolderName" oninput="spaceChecker();">
											<span id="validationMessage" style="color: red;font-size: 12px;font-weight: 600;"></span>	
										</div>
									</div>
									<div class="col-md-6">
										<div class="form-group">
											<label> Type </label>
											<div class="select">
												<select class="" id="accessType"
													onblur="removeValid(event);" onchange="accessType()">
													<option value="">Select</option>
													<option th:each="c,iter:${accessType}" th:value="${c.key}"
														th:text="${c.name}"></option>
												</select>
											</div>
										</div>
									</div>
									<div class="col-md-6">
										<div class="form-group">
											<label> Owner</label> <input type="text" class="form-control"
												id="owner" th:value="${userName}" readonly/>
												 <input type="hidden" class="form-control"
												id="ownerId" th:value="${userId}" />
												 <input type="hidden" class="form-control"
												id="orgName" th:value="${orgName}" />
												 <input type="hidden" class="form-control"
												id="orgDivision" th:value="${orgDivision}" />
										</div>
									</div>
									<div class="col-md-12">
										<div class="form-group">
											<label> Default Tags(Put comma separated tags) </label> <input
												type="text" class="form-control" id="defaultTags">
										</div>
									</div>

									<div class="col-md-12">
										<div class="form-group">
											<label> Description </label>
											<textarea class="form-control" id="description"
												onblur="removeValid(event)"></textarea>
										</div>
									</div>
								</div>
								<div id="main" class="mt-4">
									<div class="accordion-item">
										<h2 class="accordion-header" id="headingOne">
											<button class="accordion-button" type="button"
												data-bs-toggle="collapse" data-bs-target="#collapseOne"
												aria-expanded="false" aria-controls="collapseOne">
												Access Control</button>
										</h2>

										<div id="collapseOne" class="accordion-collapse collapse show"
											aria-labelledby="headingOne"
											data-bs-parent="#accordionExample">
											<div class="accordion-body">

												<div id="mySidenav" class="sidenav">
													<div class="slidebox">
														<div class="row">
															<div class="col-md-10 edit">Work Details</div>
															<div class="col-md-2">
																<div class="arrow">
																	<a href="javascript:void(0)" class="closebtn"
																		onclick="closeNav()"><i class="ti-arrow-right"></i></a>
																</div>
															</div>
														</div>
														<div style="clear: both;"></div>
														<div class="chartbtnsec">
															<div align="right">
																<button class="cancel-btn" onclick="closeNav()">CANCEL</button>
																<button class="approve-btn" id="save1"
																	onclick="saveTableData()">SAVE</button>
															</div>

														</div>
														<div class="clearfix"></div>
														<div class="row">
															<div class="col-lg-12">
																<div class="form-group">
																	<input type="hidden" class="form-control" id="rowEdit">
																</div>
															</div>

															<div class="col-lg-12">
																<div class="form-group">
																	<label>User/Group</label>
																	<div class="select">
																		<select id="operationType"
																			onblur="removeValid(event);" onchange="userType();">
																			<option value="user">User-Id</option>
																			<option value="group">User-Group</option>
																		</select>
																	</div>
																</div>
															</div>



															<div class="col-lg-12 leadNameCls" id="userList">
																<div class="form-group">
																	<label> USER LIST</label> <input type="text"
																		id="userName" placeholder="Enter User Name"
																		class="form-control" onkeyup='getUserNameList()'>
																	<input type="hidden" id="userSearchId">
																	<div id="suggesstion-boxUser_" class="sugg-cls"
																		style="margin-top: 5px;"></div>
																</div>
															</div>

															<div class="col-lg-12 participantsList" id="userNameList">
																<div class="form-group" id="selectedParticipants">
																	<label> Selected User</label>
																	<div class="selected-user-container"></div>
														
																</div>
															</div>
															
															<div class="col-lg-12 leadNameCls" id="groupList">
																<div class="form-group">
																	<label> Group LIST</label> <input type="text"
																		id="groupName" placeholder="Enter Group Name"
																		class="form-control" onkeyup='getUserGroupList()'>
																	<input type="hidden" id="groupSearchId">
																	<div id="suggesstion-boxGroup_" class="sugg-cls"
																		style="margin-top: 5px;"></div>
																</div>
															</div>

															<div class="col-lg-12 participantsList" id="groupNameList">
																<div class="form-group" id="selectedParticipants1">
																	<label> Selected Group</label>
																	<div class="selected-group-container"></div>
														
																</div>
															</div>


														
															

														</div>
													</div>
												</div>


												<div class="row">
												<!-- 	<div class="col-md-12">
														<button class="delete-btn" id="deleteChild"
															onclick="deleteDetails()">DELETE</button>
														<button class="new-btn" id="newchild" onclick="openNav()">NEW</button>
													</div> -->
													<div id="activity" style="width: 100%; height: 200px;"
														class="ag-theme-alpine"></div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>


				<!-- delete modal start -->
				<div id="delete" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column"></div>
							<div class="modal-body">
								<p>Do you really want to delete these records? This process
									cannot be undone.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="cancel-btn" data-bs-dismiss="modal"
									onclick="cancelModalBtn();">Cancel</button>
								<button type="button" class="delete-btn" id="deleteMdl"
									onclick="deleteOnclick()">Delete</button>
							</div>
						</div>
					</div>
				</div>

				<!-- delete product modal start -->
				<div id="deleteDetails" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column"></div>
							<div class="modal-body">
								<p>Do you really want to delete these records? This process
									cannot be undone.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: -30px;">

								<button type="button" class="cancel-btn" data-bs-dismiss="modal"
									onclick="cancelModalBtn();">Cancel</button>
								<button type="button" class="delete-btn"
									onclick="deleteDetailsOnclick()">Delete</button>
							</div>
						</div>
					</div>
				</div>
				<!-- alert modal start -->
				<div id="alert" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column">
								<button type="button" class="close" data-bs-dismiss="modal"
									aria-hidden="true" onclick="cancelModalBtn()">
									<i class="ti-close modal-close"></i>
								</button>
							</div>
							<div class="modal-body">
								<p id="textId"></p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="btn1" data-bs-dismiss="modal">SELECT</button>
								<button type="button" class="btn3" onclick="deleteOnclick()">Delete</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
