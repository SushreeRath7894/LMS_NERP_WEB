function rowSelect() {
	previousButton();
	$("#suggesstion-box2_").hide();
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(selectedRow, index) {

	});

	var selectedData = selectedNodes.map(node => node.data);
	var approveStatus = selectedData.map(node => node.approveStatus);
	let rowCount1 = rowCount;
	if (rowCount1 == 0) {
		newPhysicalVerification();
	} else {
		disableField();
	}
	if (rowCount > 0) {
		$("#add-btn").show();

			$('#approveGRNReturn').attr("disabled", true);

			$('#approveGRNReturn').attr("disabled", false);
			$("#approve-btn").show();
			$("#mstrEditBtn").show();

		$("#cancelMainBtn").show();

		$("#approve-btn").hide();

function amountFormatter(value) {
	if (value !== null && value !== undefined) {
		var parts = value.toString().split('.');
		var integerPart = parts[0];
		var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
		var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
		return formattedIntegerPart + decimalPart;
	} else {
		return '';
	}
}

function getVendorDtls(vendorId, id1) {

	$.ajax({
		type: "GET",
		url: "manage-invoice-get-vendor_state_data?id=" + vendorId + "&type=" + id1,
		success: function(response) {
			if (response.code == "success") {

				var jsonData = JSON.parse(response.body);
				console.log("jsonData", jsonData);
				var stateId = jsonData[0].stateId;
				console.log("stateId", stateId);
				if (stateId == "st019") {

					$("#sgstTR").show();
					$("#cgstTR").show();
					$("#igstTR").hide();
					$("#taxType").val("true")
				} else {

					$("#sgstTR").hide();
					$("#cgstTR").hide();
					$("#igstTR").show();
					$("#taxType").val("false")
				}
			}
		},
		error: function(e) {
		}
	});
}


function getPoList(vendorId, id1, id2) {

	if (vendorId) {
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");

		$.ajax({
			type: "GET",
			url: "manage-invoice-polist?id=" + vendorId + "&type=" + id1,
			success: function(response) {
				if (response.message == "success") {


					$("#poId").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#poId").append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].name);
						$(option).html(response.body[i].name);

			$("#quickFilter").val('');
			onQuickFilterChanged();
		}
	}
	
	

	function editMain(){
		enableField();
		$("#add-btn").hide();
		$("#mstrSaveBtn").show();
		$("#cancelMainBtn").show();
		$("#approve-btn").hide();
		$("#mstrEditBtn").hide();
	}

	function cancelMain(){
		let selectedRows = gridOptions.api.getSelectedRows();
		
		let rowCount = 0;
	    selectedRows.forEach(function(selectedRow, index) {
	        rowCount = rowCount + 1;
	    });
	    
	    if(rowCount == 0){
	    	gridOptions.api.getDisplayedRowAtIndex(0).setSelected(true);
	    }else{
	    	
	    	var selectedNodes = gridOptions.api.getSelectedNodes();
	    	const selectedRowIndex = selectedNodes[0].rowIndex;
	    	gridOptions.api.getDisplayedRowAtIndex(selectedRowIndex).setSelected(true);
	    	rowSelect();
	    }

	}
	

	//Upload Grid Document.

	function uploadDocOnClick(){
		$('#uploadDoc_0').click();
	}

	// Document Delete

	function deleteDocDetailsOnclick() {
		var selectedRows = gridOptionsDoc.api.getSelectedRows();
		gridOptionsDoc.api.applyTransaction({
			remove : selectedRows
		});
		
		// Reorder the serial numbers
	    const allRowNodes = [];
	    gridOptionsDoc.api.forEachNode((node) => {
	        allRowNodes.push(node);
	    });

	    allRowNodes.forEach((node, index) => {
	        node.data.slno = index + 1;
	    });

	    gridOptionsDoc.api.refreshCells({ force: true });
		
	}
	
	
	function nextTab(id) {
		const tabElement = document.querySelector('#' + id + ' a');
		const tab = new bootstrap.Tab(tabElement);
		tab.show();
	}

</script>
