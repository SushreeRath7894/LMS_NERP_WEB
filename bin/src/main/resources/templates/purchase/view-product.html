//viewProductData
function viewProductData(pid,t) {
    $('.loader').show();
    agGrid.simpleHttpRequest({
        url: 'view-product-get-sku-listing?type=' + "Purchase" + "&from=" + sessionStorage.getItem('moduleName'),
    }).then(function(data) {
        $('.loader').hide();
        var len = data.length;
        $('#totalReq').find('span').html(len);
        console.log(data)
        gridOptions.api.setRowData(data);

        if (data && data.length > 0) {
        	if(pid!=''){
        		const rowNode = gridOptions.api.getRowNode(pid);
        		if (rowNode) {
        				const rowIndex = rowNode.rowIndex; // Get the row index
        				const pageSize = gridOptions.api.paginationGetPageSize(); // Get the number of rows per page
        
      				  const pageNumber = Math.floor(rowIndex / pageSize); // Calculate page number
        
      						gridOptions.api.paginationGoToPage(pageNumber); // Switch to the calculated page
  					  }
                gridOptions.api.forEachNode((node) => {
                    if (node.data.productId === pid) {
                        node.setSelected(true);
                    }
                });
        	}else{
        		var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0);
        		firstRowNode.setSelected(true);
        	}
			 if (t== "A") {
				 enableField();
				 $("#edit").hide();
				 $("#delete").hide();
			 }else{
		    	 $("#edit").show();
		    	 $("#delete").show();
	             disableField();
			 }
        }else{
    	 $("#edit").hide();
    	 $("#delete").hide();
        }
        $("#add").show();
    });
}

//getSubCategory
function getsubcategoryList(id,id2){
	$.ajax({
		type : "GET",
		url : "view-product-get-subcategory?id="+id,
		success : function(response) {
			if (response.message == "success") {
				$("#subcategory").empty();
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$("#subcategory").append(option);
				for (var i = 0; i < response.body.length; i++) {
					var option = $("<option></option>");
					$(option).val(response.body[i].key);
					$(option).html(response.body[i].name);
					$("#subcategory").append(option);
				}
				if(id2){
					$("#subcategory").val(id2).trigger('change');
					getVariationList(id2);
				}
			}
		},
		error : function(e) {
		}
	});	
}
//getVariationList
function getVariationList(vid) {
	console.log("vid>>>", vid);
    var option = $("<option></option>");
    $(option).val(null);
    $(option).html("Select");
    var id = $("#subcategory").val();
    $.ajax({
        type: "GET",
        url: "view-product-get-variation-list?id=" + id,
        success: function(response) {
            if (response.message == "success") {
                $("#variationType").empty();
                var option = $("<option></option>");
                $(option).val(null);
                $(option).html("Select");
                $("#variationType").append(option);
                for (var i = 0; i < response.body.length; i++) {
                    var option = $("<option></option>");
                    $(option).val(response.body[i].key);
                    $(option).html(response.body[i].name);
                    $("#variationType").append(option);
                }
                if(vid!=''){
                	 $("#variationType").val(vid).trigger('change');
                }
            }
        },
        error: function(e) {}
    });
}

function submitProduct(dataset,t) {
    console.log("dataset", dataset);
    $.ajax({
        type: "POST",
        url: "/purchase/view-product-save",
        dataType: 'json',
        contentType: 'application/json',
        data: JSON.stringify(dataset),
        success: function(response) {
            if (response.code == "success") {
            	toastr.success(response.message);
				viewProductData(response.body.productId,t);
				 $("#updateProductDiv").hide();
            } else {
                $('.loader').hide();
                $("body").removeClass("overlay");
                toastr.error(response.message);
            }
        },
        error: function(response) {
            $('.loader').hide();
            $("body").removeClass("overlay");
            console.log(response);
        }
    })
}
function openDetails(id) {
	$("#productId").val("");
	$("#productName").val("");
	$("#brand").val("");
	$("#mode").val("").trigger('change');
	$("#prodStatus").prop("checked",false);
	$("#prCategoryId").val("");
	$("#tempCategoryId").val("");
	$("#prLevelId").val("");
	$("#next").hide();
	
	
	profileSelect();
	$(".loader").show();
	if(id) {
		$.ajax({
			type : "POST",
			url : "view-product-get-product-details",
			dataType : 'json',
			contentType : 'application/json',
			data : id,
			success : function(response) {
				console.log("response>>>>>>>>",response);
				$(".loader").hide();
				if (response.code == "success") {
					if(response.body == null || response.body == "" || response.body == 'null'){
						toastr.error("Something Went Wrong!");
						$("#ph").hide();
						profilecancelbtn();
					}else{
						$("#ph").show();
						$("#productheadId").html(response.body.productId);
						$("#productIdHead").text(response.body.productId);
						$("#productNameHead").text(response.body.productName);
						$("#productIdHead1").text(response.body.productId);
						$("#productNameHead1").text(response.body.productName);
						$("#productIdHead2").text(response.body.productId);
						$("#productNameHead2").text(response.body.productName);
						$("#productId").val(response.body.productId);
						$("#productName").val(response.body.productName);
						$("#brand").val(response.body.brand);
						$("#mode").val(response.body.mode).trigger('change');
						$("#parentCategory").val(response.body.productCategory).trigger('change');
						var id =response.body.productCategory;
						var id2 = response.body.subcategory;
						getsubcategoryList(id,id2);
						
						if(response.body.productStatus == "1") {
							$("#prodStatus").prop("checked",true);
						} else {
							$("#prodStatus").prop("checked",false);
						}
						
						$("#prCategoryId").val(response.body.productCategory);
						$("#hsnCode").val(response.body.hsnCode);
						$('#imgemp').attr('src', '');
						if(response.body.pImgName!=null && response.body.pImgName!="") {
							const fileName = response.body.pImgName;
							$('#fileedit').val(fileName.split('/').pop());
							$('#imgemp').attr('src', response.body.pImgName);
							
						} else {
							$('#imgemp').attr('src', '../assets/images/noimage.jpg');
						}
						agGrid.simpleHttpRequest({
							url : 'view-product-get-sku-by-product?id='+response.body.productId
						}).then(function(data) {
							console.log("aaaa====",data);
							skuOptions.api.setRowData(data);
							
							$("#skuPurchase").empty();
							$("#skuPurchase").append("<option value>Select</option>");
							for (var i = 0; i < data.length; i++) {
							    $("#skuPurchase").append("<option value='" + data[i].sku + "'>" + data[i].manufacture + " (" + data[i].sku + ")</option>");
							}

						});
						
						agGrid.simpleHttpRequest({
							url : 'view-product-get-purchase-by-product?id='+response.body.productId 
						}).then(function(data) {
							console.log(data)
							purchaseOptions.api.setRowData(data);
						});
						getVariationList(id2);
						hideShowButton();
					}
					
					
				}
			}, error : function(data) {
				console.log(data)
			}
		});
	}
	$('#next').hide();
}
//saveSKUData
 function saveSKUData() {
    obj = {};
    obj.isEdit = $("#isEdit").val();
    obj.productId = $("#productIdHead").text();
    obj.sku = $("#skuId").val();
    obj.model = $("#model").val();
    obj.manufacture = $("#manufacture").val();
    obj.variationType = $("#variationType").val();
    obj.unit = $("#unit").val();
    var price = $("#salePrice").val();
    price = price.replaceAll(",", "");
    obj.salePrice = price;
    obj.saleTax = $("#saleTax").val();
    obj.saleCess = $("#saleCess").val();
    obj.brand = $("#brand").val();

    $(".formValidation").remove();
    allValid = true;

    if (obj.manufacture == null || obj.manufacture == "") {
		toastr.error('SKU Name Required');
		return;
    }
    if (obj.variationType == null || obj.variationType == "") {
		toastr.error('Variation/Class Required');
		return;
    }
    if (obj.unit == null || obj.unit == "") {
		toastr.error('UOM Required');
		return;
    }
    console.log("obj-->", obj);
    if (allValid) {
        submitProductDetails(obj);
    }
}

 function submitProductDetails(dataset) {

	    $.ajax({
	        type: "POST",
	        url: "/purchase/view-product-save-sku-dtls",
	        dataType: 'json',
	        contentType: 'application/json',
	        data: JSON.stringify(dataset),
	        success: function(response) {
	        	console.log(response)
	            if (response.code == "success") {
	            	toastr.success(response.message);
	                closeToggleSection();
	                var productId = $("#productIdHead").text();
	                agGrid.simpleHttpRequest({
	                    url: 'view-product-get-sku-by-product?id=' + productId
	                }).then(function(data) {

function toDataUrl(url, callback) {
    var xhr = new XMLHttpRequest();
    xhr.onload = function() {
        var reader = new FileReader();
        reader.onloadend = function() {
            callback(reader.result);
        }
        reader.readAsDataURL(xhr.response);
    };
    xhr.open('GET', url);
    xhr.responseType = 'blob';
    xhr.send();
}
