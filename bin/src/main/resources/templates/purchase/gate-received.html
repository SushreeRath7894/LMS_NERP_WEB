		//Pagination.
		var pages;
		function createPagination(pages, page) {
			pno = page;
			if ($("#totalPageno").val() == '') {
				var pages = 20;
			} else {
				var pages = $("#totalPageno").val();
				$("#currentPageno").val(page);
			}

			var str = '<ul>';
			var active;
			var pageCutLow = page - 1;
			var pageCutHigh = page + 1;
			// Show the Previous button only if you are on a page other than the first
			if (page > 1) {
				str += '<li class="page-item previous no"><a onclick="createPagination(pages, ' + (page - 1) + ')">Previous</a></li>';
			}
			// Show all the pagination elements if there are less than 6 pages total
			if (pages < 6) {
				for (let p = 1; p <= pages; p++) {
					active = page == p ? "active" : "no";
					str += '<li class="' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';
				}
			}
			// Use "..." to collapse pages outside of a certain range
			else {
				// Show the very first page followed by a "..." at the beginning of the
				// pagination section (after the Previous button)
				if (page > 2) {
					str += '<li class="no page-item"><a onclick="createPagination(pages, 1)">1</a></li>';
					if (page > 3) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page - 2) + ')">...</a></li>';
					}
				}
				// Determine how many pages to show after the current page index
				if (page === 1) {
					pageCutHigh += 2;
				} else if (page === 2) {
					pageCutHigh += 1;
				}
				// Determine how many pages to show before the current page index
				if (page === pages) {
					pageCutLow -= 2;
				} else if (page === pages - 1) {
					pageCutLow -= 1;
				}
				// Output the indexes for pages that fall inside the range of pageCutLow
				// and pageCutHigh
				for (let p = pageCutLow; p <= pageCutHigh; p++) {
					if (p === 0) {
						p += 1;
					}
					if (p > pages) {
						continue
					}

					active = page == p ? "active" : "no";
					str += '<li class="page-item ' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';

				}
				// Show the very last page preceded by a "..." at the end of the pagination
				// section (before the Next button)
				if (page < pages - 1) {
					if (page < pages - 2) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page + 2) + ')">...</a></li>';
					}
					str += '<li class="page-item no"><a onclick="createPagination(pages, pages)">' + pages + '</a></li>';
				}
			}
			// Show the Next button only if you are on a page other than the last
			if (page < pages) {
				str += '<li class="page-item next no"><a onclick="createPagination(pages, ' + (page + 1) + ')">Next</a></li>';
				changePagination(page);
			} else if (page <= pages) {
				//str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
				changePagination(page);
			}
			str += '</ul>';
			// Return the pagination string to be outputted in the pug templates
			document.getElementById('pagination').innerHTML = str;
			return str;

		}

				$(".loader").hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.viewGateReceived;
				/* var len = allData.length;
				$('#totalItem').find('span').html(len); */
				gridOptions.api.setRowData(allData);

				var totalRowCount = gridOptions.api.getModel().getRowCount();
				$('#totalItem').find('span').html(totalRowCount);

				if (allData.length > 0) {
					//alert(data[0].totalPageno)
					$('#totalPageno').val(allData[0].totalPageno);
					pages = allData[0].totalPageno;

				}


			});
		}

			console.log("sts>>>", sts);
			$('#approveGateInModal').modal('show');
			event = sts;
		}
		function cancelApproveModalBtn() {
			$('#approveGateInModal').modal('hide');
			event = "";
		}

		function approveGateInOnclick() {
			var getPassEntryId;
			if (event == "main") {
				var selectedRows = gridOptions.api.getSelectedRows();
				var selectedRowsString = '';
				selectedRows.forEach(function (selectedRow, index) {
					if (index > 0) {
						selectedRowsString += ',';
					}
					selectedRowsString += selectedRow.gateEntry_Id;
				});
				getPassEntryId = selectedRowsString;
			} else if (event == "modal") {
				getPassEntryId = $("#entryId").text();
			}

			var approveStatus = 1;
			$('#approveGateInModal').modal('show');
			$('.loader').show();

			$.ajax({
				type: "GET",
				url: "approveGateEntry?approveStatus=" + approveStatus + "&getPassEntryId=" + getPassEntryId,
				async: false,
				success: function (response) {
					if (response.message == "Success") {
						$('.loader').hide();
						$('#approveGateIn').attr('disabled', true);
						$("#messageParagraph").text("Gate Received Approved Successfully");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$('#approveGateInModal').modal('hide');
						//viewGateInDetails();
						var rowNode = gridOptions.api.getRowNode(getPassEntryId);
						rowNode.setDataValue('entryStatus', 'Approved');
						gridOptions.api.refreshCells({rowNodes: [rowNode], force: true});
						showChild(getPassEntryId, "", "1");
					} else {
						$('.loader').hide();
						$('#approveGateInModal').modal('show');
					}

				},
				error: function (data) {
				}
			});
		}

		function filterByDate() {
			let fromDate = $("#filterFromDate").val();
			let toDate = $("#filterToDate").val();
			let quickFilter = $("#quickFilter").val();
			
			// Validation: Check if either fromDate or toDate is empty or null
			if (!fromDate && !toDate) {
				$("#messageParagraph").text("Both From Date and To Date fields are required.");
			} else if (!fromDate) {
				$("#messageParagraph").text("From Date is required.");
			} else if (!toDate) {
				$("#messageParagraph").text("To Date is required.");
			} else if (toDate < fromDate) {
				$("#messageParagraph").text("To Date must be greater than From Date.");
			} else {
				$("#pagination").hide();
				$(".loader").show();

			$(".loader").show();
			agGrid.simpleHttpRequest({
				url: "gate-received-filtered-view?id=" + "inventory" + "&fromDate=" + fromDate + "&toDate=" + toDate + "&searchData=" + quickFilter
			}).then(function (data) {
				$(".loader").hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.viewGateReceived;
				gridOptions.api.setRowData(allData);

				var totalRowCount = gridOptions.api.getModel().getRowCount();
				$('#totalItem').find('span').html(totalRowCount);

			});
			return;
			}

			$("#msgOkModal").removeClass("btn3").addClass("btn1");
			$("#msgModal").modal('show');
		}

		function resetFilter() {
			$("#filterFromDate").val("");
			$("#filterToDate").val("");
			$("#quickFilter").val("");
			viewGateReceived();
			cancelBar();
			$("#pagination").show();
		}
		
		function cancelModal(){
			viewGateReceived();
		}
	</script>
