function allocateVendor() {
    
    const selectedRows = allVendorOptions.api.getSelectedRows();
	
    const targetGridData = [];
    vendorOptions.api.forEachNode((node) => {
        targetGridData.push(node.data);
    });

  
    const updatedTargetData = [...targetGridData];

    selectedRows.forEach((row) => {
        const exists = updatedTargetData.some((targetRow) => targetRow.vendorId === row.vendorId); // Assuming 'id' is unique
        if (!exists) {
            updatedTargetData.push(row);
        }
    });


    vendorOptions.api.setRowData(updatedTargetData);
    
    allVendorOptions.api.deselectAll();

}



function deallocateVendor() {
   
    let selectedRows = vendorOptions.api.getSelectedRows();
    vendorOptions.api.applyTransaction({
		remove : selectedRows
	});
        
}

function saveTableData() {

    var editProduct = $("#editProduct").val();
    var item = {};
    var data = 1;
    var validation = true;
    
    if ($('#itemName').val() == null || $('#itemName').val() == "") {
		toastr.error("Item Name Required.");
		return validation = false;
	}
    if ($('#unit').val() == null || $('#unit').val() == "") {
		toastr.error("Unit Required.");
		return validation = false;
	}
    if ($('#quantity').val() == null || $('#quantity').val() == "") {
		toastr.error("Quantity Required.");
		return validation = false;
	}
    if ($('#unitPrice').val() == null || $('#unitPrice').val() == "") {
		toastr.error("Unit Price Required.");
		return validation = false;
	}
    if ($('#lineTotal').val() == null || $('#lineTotal').val() == "") {
		toastr.error("Total Amount Required.");
		return validation = false;
	}

    if (validation) {

        item.slNo = data;
        itemOptions.api.forEachNode(function(rowNode, index) {
            if (!editProduct) {
                data = data + 1;
                item.slNo = data;
            } else {
                item.slNo = editProduct;
            }

        });


        item.sku = $('#skuTemp').val();
        item.itemId = $('#itemIdTemp').val();
        item.itemName = $('#itemName').val();
        item.itemId = $('#itemIdTemp').val();
        item.hsnCode = $('#hsnCode').val();
        item.unit = $('#unit').val();
        item.unitName = $("#unit option:selected").text();
        item.quantity = $('#quantity').val();
        item.unitPrice = $('#unitPrice').val();
        item.lineTotal = $('#lineTotal').val();


        //item.slNo = data;
        var quot = [];

        if (editProduct) {
            var rowNode = itemOptions.api.getRowNode(editProduct);
            rowNode.setData(item);
        } else {
            itemOptions.api.forEachNode(function(rowNode, index) {
                quot.push(rowNode.data);
            });
            quot.push(item)
            itemOptions.api.setRowData(quot);

        }
        closeNav();
        $("#sku").val('');
        $("#itemId").val('');
        $("#itemName").val('');
        $("#quantity").val('');
        $("#unitPrice").val('');
        $("#lineTotal").val('');
        $("#hsnCode").val('');
        $("#unit").val('');
        $("#editProduct").val(null);
    }
    itemOptions.api.deselectAll()
}

function save() {

   let valid = true;
   
   if ($("#reqType").val() == null || $("#reqType").val() == "") {
  		toastr.error('Type Required.');
  		nextTab('basicInfLiId');
		valid=false;
		return;
  	 }
   if ($("#reqPrior").val() == null || $("#reqPrior").val() == "") {
 		toastr.error('Priority Required.');
 		nextTab('basicInfLiId');
		valid=false;
		return;
 	 }
   if ($("#receiveDate").val() == null || $("#receiveDate").val() == "") {
 		toastr.error('Receive By Date Required.');
 		nextTab('basicInfLiId');
		valid=false;
		return;
 	 }
   
    if (valid) {

        var vendorData = [];
        vendorOptions.api.forEachNode(function(rowNode, index) {
            var item = rowNode.data;
            vendorData.push(item);
        });


        var datas = [];
        if (itemOptions.api.getDisplayedRowCount() > 0) {
            var count = 0;
            itemOptions.api.forEachNode(function(rowNode, indrx) {

                var lineTotal = rowNode.data.lineTotal;

                if (lineTotal == "undefined" || lineTotal == null || lineTotal == "") {
                    count++;
                } else {
                    var obj = rowNode.data;
                    obj.rfqId = $("#reqHeadId").text();
                    console.log("$(#reqNo).val()>>>", $("#reqNo").val());
                    obj.reqNo = $("#reqNo").val();
                    console.log("obj.reqNo>>>", obj.reqNo);
                    obj.desc = safeBase64Encode($("#desc").val());
                    obj.reqType = $("#reqType").val();
                    obj.reqPrior = $("#reqPrior").val();
                    obj.receiveDate = $("#receiveDate").val();
                    obj.indentId = $("#indentId").val();
                    obj.project = $("#project").val();
                    obj.projectName = $("#project").find('option:selected').text();
                    obj.vendorList = vendorData;
                    datas.push(obj);
                }
            });

        } else {
        	toastr.error('Please Add Item Details.');
        	nextTab('basicInfLiId');
            return false;

        }
        var ct = 0;
        vendorOptions.api.forEachNode(function(rowNode, index) {
            var item = rowNode.data;

            if (item.assignStatus == '1') {
                ct = ct + 1;
            }

        });
        
        let vendorRowCount = vendorOptions.api.getDisplayedRowCount();
        
        if (count > 0) {
        	toastr.error('Add Price First.');
        	nextTab('basicInfLiId');
        } else {
        	if(vendorRowCount > 0){
        		 console.log('datas', datas);
                 savePurchaseQuotation(datas);
        	}else{
        		toastr.error('Add Atleast One Vendor.');
            	nextTab('vendorDetailsLiId');
        	}
           
        }
       
    }
}

function savePurchaseQuotation(datas) {
    

    $('.loader').show();
    
    $
        .ajax({
            type: "POST",
            url: "view-purchase-quotation-add",
            contentType: "application/json",
            data: JSON.stringify(datas),
            success: function(response) {
                if (response.message == "Success") {
                    $('.loader').hide();
                    toastr.success("Data Saved Successfully.");
                   

                    $("#myGrid").show();

                    nextTab('basicInfLiId');
                    view();
                   
                }

            },
            error: function(datas) {
                console.log(datas)
                $('.loader').hide();
            }
        })


}

        rowCount = rowCount + 1;
    });

    var id = "";
    
    var selectedNodes = gridOptions.api.getSelectedNodes();
	var selectedData = selectedNodes.map(node => node.data);
	var mailStatus = selectedData.map(node => node.mailStatus);

    for (var i = 0; i < selectedRows.length; i++) {
        id = selectedRows[i].rfqId;
    }
    nextTab('basicInfLiId');
    
    if (rowCount == 0) {
        add();
        $("#sendMailLiId").hide();
        $("#mstrSaveBtn").show();
        $("#cancelMainBtn").show();
        $("#vndrDtlsNextBtn").hide();
      
       
    } else if (rowCount == 1) {
        editInquiry(id);
        disableField();
        $("#sendMailLiId").show();
        $("#cancelMainBtn").hide()
        $("#mstrSaveBtn").hide()
        $("#vndrDtlsNextBtn").show();
    }

    if (rowCount > 0) {
    	if(mailStatus == "Sent"){
    		$("#mainEditBtn").hide();
    		$("#mstrSaveBtn").hide();
    		$("#sendMailBtn").hide();
    		$("#mainAddBtn").show();
    	}else{
    		$("#mainEditBtn").show();
    		//$("#mstrSaveBtn").show();
    		$("#sendMailBtn").show();
    		$("#mainAddBtn").show();
    	}
        //$("#mainEditBtn").show();
    } else {
    	$("#mainEditBtn").hide();
    	$("#mainAddBtn").hide();
    }
}

function toDataUrl(url, callback) {
    var xhr = new XMLHttpRequest();
    xhr.onload = function() {
        var reader = new FileReader();
        reader.onloadend = function() {
            callback(reader.result);
        }
        reader.readAsDataURL(xhr.response);
    };
    xhr.open('GET', url);
    xhr.responseType = 'blob';
    xhr.send();
}

	function safeBase64Encode(text) {
	    if (!text || text === "null") {
	        return "";
	    }
	    
	    return btoa(String.fromCharCode(...new TextEncoder().encode(text)));
	}

	function safeBase64Decode(base64) {
	    if (!base64 || base64 === "null") {
	        return ""; 
	    }
	    
	    return new TextDecoder().decode(Uint8Array.from(atob(base64), c => c.charCodeAt(0)));
	}
