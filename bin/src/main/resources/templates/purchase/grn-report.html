			function formatDate(date) {

		function filterByDate() {
			
			let fromDate = $("#filterFromDate").val();
			let toDate = $("#filterToDate").val();
			let quickFilter = $("#quickFilter").val();
			
			// Validation: Check if either fromDate or toDate is empty or null
			if (!fromDate && !toDate) {
				$("#messageParagraph").text("Both From Date and To Date fields are required.");
			} else if (!fromDate) {
				$("#messageParagraph").text("From Date is required.");
			} else if (!toDate) {
				$("#messageParagraph").text("To Date is required.");
			} else if (toDate < fromDate) {
				$("#messageParagraph").text("To Date must be greater than From Date.");
			} else {
				$("#pagination").hide();
				
				$(".loader").show(); 
			agGrid.simpleHttpRequest({
				url: "grn-report-view-filtered?fromDate=" + fromDate + "&toDate=" + toDate + "&searchData=" + quickFilter
			}).then(function (data) {
				$(".loader").hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.genReportData;
				gridOptions.api.setRowData(allData);
				var totalRowCount = gridOptions.api.getModel().getRowCount();
				$('#totalItem').find('span').html(totalRowCount);
				$(".loader").hide();

			});
			
			return;
			}

			$("#msgOkModal").removeClass("btn3").addClass("btn1");
			$("#msgModal").modal('show');
		}
