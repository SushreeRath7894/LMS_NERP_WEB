function amountFormatter(value) {
    if (value !== null && value !== undefined) {
        var parts = value.toString().split('.');
        var integerPart = parts[0];
        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
        return formattedIntegerPart + decimalPart;
    } else {
        return '';
    }
}

function rowSelect() {
	nextTab('basicinformation');
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(selectedRow, index) {
		rowCount = rowCount + 1;
	});
	
	var selectedNodes = gridOptions.api.getSelectedNodes();
	var selectedData = selectedNodes.map(node => node.data);
	var appoveStatus = selectedData.map(node => node.appoveStatus);
	let rowCount1 = rowCount;
	if (rowCount1 == 0) {
		newPhysicalVerification();
		
	} else if(rowCount1 == 1){
		disableField();
	}
	if (rowCount > 0) {
		$('#add').attr("disabled", true);
		$("#mstrSaveBtn").hide();
		$("#cancelMainBtn").hide();
		$("#add-btn").show();
		if (appoveStatus == 'Approved') {
			$('#delete').attr("disabled", true);
			$('#approve').attr("disabled", true);
			$('#returnGRN').attr("disabled", true);
			$("#approve-btn").hide();
			$("#mstrEditBtn").hide();
			$("#mstrDeleteBtn").hide();
			
		} else {
			$("#mstrEditBtn").show();
			$("#mstrDeleteBtn").show();
			$("#approve-btn").show();
			
		}
		var id = selectedRows[0].varificationId;
		var status = selectedRows[0].appoveStatus;
		var poid = selectedRows[0].poId;
		editPhysicalVarifiation(id, status, poid);
	} else {
		$("#cancelMainBtn").show();
		$("#add-btn").hide();
		$("#approve-btn").hide();
		$("#mstrEditBtn").hide();
		$("#mstrDeleteBtn").hide();
		$("#mstrSaveBtn").show();
	}
}

function getPoList(vendorId, id1, id2) {

	if (vendorId) {
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");

		$.ajax({
			type: "GET",
			url: "manage-invoice-polist?id=" + vendorId + "&type=" + id1,
			success: function(response) {
				if (response.message == "success") {


					$("#poId").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#poId").append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].name);
						$(option).html(response.body[i].name);
						$("#poId").append(option);
					}
					if (id2 != "") {
						$("#poId").val(id2);
					}

				}
			},
			error: function(e) {
			}
		});
	} else {
		$("#poId").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("poId");
		$("#poId").append(option);
		$("#poId").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");

	}
}

var totalLine;
function calculateLineTotal() {
	var price = $("#unitPrice").val();
	var quantity = $("#quantity").val();
	var discount = $("#discount").val();
	var discountAmount = $("#discountAmount").val();

	if (discountAmount == '1') {
		if (price && quantity) {
			var mul = price * quantity;

			if (discount > mul) {

				$("#discount").val("0");
				totalLine = mul - discount;
				$("#lineTotal").val((mul).toFixed(2));
			} else {
				totalLine = mul - discount;
				$("#lineTotal").val((totalLine).toFixed(2));
			}

		} else {
			var mul = 0;
			$("#lineTotal").val((mul).toFixed(2));

		}
	} else {
		if (price && quantity) {
			var mul = price * quantity;
			if (discount > mul) {

				$("#discount").val("0");
				totalLine1 = (mul / 100) * discount;
				totalLine = mul - totalLine1;
				$("#lineTotal").val((mul).toFixed(2));
			} else {
				totalLine1 = (mul / 100) * discount;
				totalLine = mul - totalLine1;
				$("#lineTotal").val((totalLine).toFixed(2));
			}

		} else {
			var mul = 0;
			$("#lineTotal").val((mul).toFixed(2));

		}
	}

}

function calculateAdjustment() {
	//var adjustment = $("#adjustment").val();

	if (/^\d+$/.test($("#adjustment").val()) || $("#adjustment").val() == '-' || $("#adjustment").val() == '' || /^\-?\d+((\.|\,)\d+)?$/.test($("#adjustment").val())) {
		var adjustment = $("#adjustment").val();
	}
	else {
		$("#adjustment").val(0);
	}
	var subTotal = $("#subTotal").val();
	var qSGST = $("#qSGST").val();
	var qCGST = $("#qCGST").val();
	var qIGST = $("#qIGST").val();
	var tcsAmount1 = $("#tcsAmount").val();
	var tcsAmount = 0;
	if (tcsAmount1 != '' && tcsAmount1 != null) {
		tcsAmount = tcsAmount1;
	}

	var grandTotal = parseFloat(subTotal) + parseFloat(qSGST) + parseFloat(qCGST) + parseFloat(qIGST) + parseFloat(tcsAmount);

	var add = 0;

	//alert(/^\-?\d+((\.|\,)\d+)?$/.test(adjustment))

	if (/^\-?\d+((\.|\,)\d+)?$/.test(adjustment)) {
		add = parseFloat(adjustment) + parseFloat(grandTotal);

		$("#grandTotal").val((add).toFixed(2));

	} else {
		$("#grandTotal").val((grandTotal).toFixed(2));

	}

}

	function cancelMain(){
		let selectedRows = gridOptions.api.getSelectedRows();
		
		let rowCount = 0;
	    selectedRows.forEach(function(selectedRow, index) {
	        rowCount = rowCount + 1;
	    });
	    
	    if(rowCount == 0){
	    	gridOptions.api.getDisplayedRowAtIndex(0).setSelected(true);
	    }else{
	    	
	    	var selectedNodes = gridOptions.api.getSelectedNodes();
	    	const selectedRowIndex = selectedNodes[0].rowIndex;
	    	gridOptions.api.getDisplayedRowAtIndex(selectedRowIndex).setSelected(true);
	    	rowSelect();
	    }

	}
	

	//Upload Grid Document.

	function uploadDocOnClick(){
		$('#uploadDoc_0').click();
	}

	// Document Delete

	function deleteDocDetailsOnclick() {
		var selectedRows = gridOptionsDoc.api.getSelectedRows();
		gridOptionsDoc.api.applyTransaction({
			remove : selectedRows
		});
		
		// Reorder the serial numbers
	    const allRowNodes = [];
	    gridOptionsDoc.api.forEachNode((node) => {
	        allRowNodes.push(node);
	    });

	    allRowNodes.forEach((node, index) => {
	        node.data.slno = index + 1;
	    });

	    gridOptionsDoc.api.refreshCells({ force: true });
		
	}
</script>
