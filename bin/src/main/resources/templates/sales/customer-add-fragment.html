<style>
.hvrbox .hvrbox-layer_top {
	opacity: 0;
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	width: 25%;
	height: 100%;
	background: rgba(0, 0, 0, 0.3);
	color: #fff;
	padding: 15px;
}

.btn1 {
	border: none;
	border-radius: 4px;
	font-size: 10px;
	background-color: #5784c4;
	color: #fff !important;
	margin-left: 5px;
	margin-bottom: 8px;
	width: 105px;
	height: 28px;
	line-height: 12px;
	float: right;
	text-transform: uppercase;
	cursor: pointer;
}

.taskInfo {
	padding-left: 10px;
	color: #45166a;
}

.rating {
	float: left;
}

.rating:not(:checked)>input {
	position: absolute;
	top: -9999px;
	clip: rect(0, 0, 0, 0);
}

.rating:not(:checked)>label {
	float: right;
	width: 1em;
	padding: 0 .1em;
	overflow: hidden;
	white-space: nowrap;
	cursor: pointer;
	font-size: 200%;
	line-height: 1.2;
	color: rgba(0, 0, 0, 0.6);
	/*  text-shadow:1px 1px #bbb, 2px 2px #666, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked)>label:before {
	content: '★ ';
}

.rating>input:checked ~label {
	color: #ea0;
	/*  text-shadow:1px 1px #c60, 2px 2px #940, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked)>label:hover, .rating:not(:checked)>label:hover ~label
	{
	color: black;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>input:checked+label:hover, .rating>input:checked+label:hover ~label,
	.rating>input:checked ~label:hover, .rating>input:checked ~label:hover
	 ~label, .rating>label:hover ~input:checked ~label {
	color: #ea0;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>label:active {
	position: relative;
	top: 2px;
	left: 2px;
}

.btn-outline-primary {
	color: #007bff;
	background-color: rgb(240 243 241/ 90%);
	background-image: none;
	border-color: #007bff;
	cursor: pointer;
}

.picker_calendar5 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 742px;
}

.picker_calendar6 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 1132px;
}

.btnbill {
	position: absolute;
	right: 70px;
	margin-top: -50px;
	z-index: 999;
}

.btn-primarynew {
	color: #fff !important;
	background-color: #0d6efd;
	border-color: #0d6efd;
}
</style>

										class="border-0 btn-transition btn btn-outline-primary br-dis br-m-btn"
										data-bs-toggle="tooltip" title="Delete" disabled

									<button class="btn btn-primary edit-btn br-s-btn" type="button"
										onclick="saveShippingDetails()">Save</button>

										onclick="cancelDetails()">Cancel</button>

										</select>
									</div>
								</div>
							</div>

							<div class="col-md-3">
								<div class="form-group">
									<label>State</label><span class="mandatory">*</span>

										<select id="states1" onblur="removeValid(event)">
											<option th:value="NULL">Select State</option>
											<!-- <option th:each="c,iter:${statesList}"
                  th:value="${c.key}" th:text="${c.name}"></option> -->
										</select> <span class="focus"></span>
									</div>
								</div>
							</div>

							<div class="col-md-3">
								<div class="form-group">
									<label>City</label><span class="mandatory">*</span> <input
										type="text" class="form-control" id="city1" placeholder="City"
										onblur="removeValid(event)" onkeyup="checkAlphabet('city')"
										maxLength="30">
								</div>
							</div>
							<div class="col-md-3">
								<div class="form-group">
									<label>Street 1<span class="mandatory">*</span></label> <input
										type="text" class="form-control" id="street11"
										placeholder="Street 1" onblur="removeValid(event)"
										maxLength="300">
								</div>
							</div>
							<div class="col-md-3">
								<div class="form-group">
									<label>Street 2</label> <input type="text" class="form-control"
										id="street21" placeholder="Street 2"
										onblur="removeValid(event)" maxLength="300">
								</div>
							</div>
							<div class="col-md-3">
								<div class="form-group">
									<label>Zip Code</label><span class="mandatory">*</span> <input
										type="text" class="form-control" id="zipCode1"
										autocomplete="off" placeholder="Zip Code"
										onkeyup="zipcodeVal1();checkNumeric('zipCode1');"
										onblur="removeValid(event)"> <span id="error15"
										class="formValidation1"></span>
								</div>
							</div>

							<div class="col-md-3">
								<div class="form-group">
									<label>Phone</label> <input type="text" class="form-control"
										id="phone1" placeholder="Phone"
										onkeyup="checkNumeric('phone1');" onblur="removeValid(event)"
										maxlength=10> <span id="error12"
										class="formValidation1"></span>
								</div>
							</div>
							<div class="col-md-3">
								<div class="form-group">
									<label>Fax</label> <input type="text" class="form-control"
										id="fax1" placeholder="Fax" onblur="removeValid(event)">
								</div>
							</div>
							<div class="col-md-3">
								<div class="form-group">
									<label>GSTIN</label> <input type="text" class="form-control"
										id="gstIn1" placeholder="GSTIN" onblur="removeValid(event)">
								</div>
							</div>
						</div>
					</div>
				</div>

					<div
