<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">

<head>
<link rel="stylesheet" href="../assets/css/extend/lightslider.css" />
<script src="/javaScript/sales/product-sales-price.js"></script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<input type="hidden" id="sessionOrganization1"
						th:value="${session.ORGANIZATION}" /> <input type="hidden"
						id="sessionOrganization" th:value="${organization}" /> <input
						type="hidden" id="sessionOrgDivision" th:value="${orgDivision}" />
					<input type="hidden" id="baseUrl" th:value="${baseUrl}" /> <input
						type="hidden" id="sessionId" th:value="${userId}" /> <input
						type="hidden" id="sessionName" th:value="${userName}" /> <input
						type="hidden" id="hrRole" th:value="${hrRole}" /> <input
						type="hidden" id="sessionRole" th:value="${userRole}" /> <input
						type="hidden" id="adRole" th:value="${adRole}" /> <input
						type="hidden" id="totalPageno"> <input type="hidden"
						id="currentPageno">
					<!--Tabbination 1 Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="h-100 d-flex flex-column">
										<div class="d-flex justify-content-between bdr-line p-2">
											<div class="col-md-8 col-12">
												<div class="d-flex search-sec gap-2" id="itemSearchSec">
													<input class="form-control search_input_bar"
														placeholder="Search.." type="text" name="search"
														id="quickFilter" autocomplete="off">
													<button class="btn go-btn"
														onclick="onQuickFilterChanged()" id="SearchBtn"
														type="button">Go</button>
													<button class="btn go-btn" type="button"
														onclick="resetBtn()">Reset</button>
												</div>
												<div class="d-flex search-sec gap-2" id="grnSearchSec">
													<input class="form-control search_input_bar"
														placeholder="Search.." type="text" name="search"
														id="quickFilter1" autocomplete="off">
													<button class="btn go-btn"
														onclick="onQuickFilterChanged1()" id="SearchBtn"
														type="button">Go</button>
													<button class="btn go-btn" type="button"
														onclick="resetBtn1()">Reset</button>
												</div>
											</div>
											<div class="d-flex justify-content-end gap-2">
												<button class="btn btn-primary max-btn"
													id="grnInvoiceBtn" onclick="openGRNSection()"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="GRN Invoice">
													<i class="fa-solid fa-file-invoice" id="grnIvoiceBtnIcon"></i> 
												</button>
												<button class="btn btn-primary max-btn"
													id="itemListBtn" onclick="openItemSection()"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Item List">
													<i class="fa-solid fa-list" id="itemListBtnIcon"></i>
												</button>
												<button class="btn btn-primary max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>
											</div>

										</div>
										<div class="card m-2 p-2">
                      <div id="myGrid" style="width: 100%; height: 100vh;" class="ag-theme-alpine"></div>
                      <div id="myGridItem" style="width: 100%; height: 100vh;" class="ag-theme-alpine"></div>
										</div>

									</div>
								</div>
							</div>
							<div id="snackbar" class="snackbar"></div>
							<!--Right Sec Start-->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box" id="rightSideDiv">
									<div
										class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>

										<!--Right Inner Tab Start-->
										<div class="d-flex gap-2">
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item" role="presentation" id="salesPriceInfo"><a
													class="nav-link active" data-bs-toggle="pill"
													href="#salesPriceInfo" aria-selected="true" role="tab">Sales
														Price</a></li>
											</ul>
										</div>
									</div>

									<!-- Tab panes -->
									<div class="tab-content flex-fill h-25">
										<!--Product Sales Price Tab Start  -->
										<div id="salesPriceInfo" class="tab-pane fade active p-2 h-100 show" role="tabpanel">

											<div class="requisition-tbl d-flex flex-column h-100 gap-2">

												<!--<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="50%"><strong id="productName"></strong></td>
																<td>
																	<div class="d-flex justify-content-end flxwrap">
																		<span th:text="${action_list}"></span>
																		<div class="mr-2">
                                      <button class="btn btn-primary  edit-btn " type="button" id="addSalesPriceBtn" onclick="addSalesPrice()">Add</button>
																		</div>
																		<div class="mr-2">
                                      <button class="btn btn-primary  edit-btn d-none" type="button" id="cancelBtn" onclick="cancelSalesPrice()">Cancel</button>
																		</div>
																		<div class="mr-2">
                                      <button class="btn btn-primary  edit-btn " type="button" onclick="saveSalesPrice()">Save</button>
																		</div>
																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>-->

                        <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                          <div class="project-name flex-1"><span class="head-user-name" id="productName"></span></div>
                          <div class="d-flex justify-content-end w-100 gap-2 flex-1">
                            <span th:text="${action_list}"></span>
                            <button class="btn m-0 edit-btn" type="button" id="addSalesPriceBtn" onclick="addSalesPrice()">Add</button>
                            <button class="btn m-0 edit-btn" type="button" onclick="saveSalesPrice()">Save</button>
                            <button class="btn m-0 edit-btn d-none" type="button" id="cancelBtn" onclick="cancelSalesPrice()">Cancel</button>
                          </div>
                        </div>

												<div class="card p-2">

													<div class="innercontent h-100 d-flex flex-column gap-2">
														<div class="row">
															<div class="col-md-3">
																<div class="form-group mb-10">
																	<label>Category <span class="mandatory">*</span></label>
																	<div class="select">
																		<select class="form-control transparenttxtbox"
																			id="categoryId" onblur="removeValid(event)"
																			onchange="getsubcategoryList(this.value);">
																			<option value="">Select</option>
																			<option th:each="c,iter:${categorylist}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>
															</div>
															<div class="col-md-3">
																<div class="form-group mb-10">
																	<label>Sub-Category <span class="mandatory">*</span></label>
																	<div class="select">
																		<select class="form-control transparenttxtbox"
																			id="subcategory"
																			onchange="getVariationList(this.value)">
																			<option value="">Select</option>
																		</select>
																	</div>
																</div>
															</div>
															<div class="col-md-3">
																<div class="form-group mb-10">
																	<label>Variant <span class="mandatory">*</span></label>
																	<div class="select">
																		<select class="form-control transparenttxtbox"
																			id="variationType" onchange="getItemList(this.value);">
																			<option value="">Select</option>
																		</select>
																	</div>
																</div>
															</div>
															<div class="col-md-3">
																<label class="form-group">SKU <span class="mandatory">*</span></label> <input
																	type="hidden" id="grnId"> <input type="hidden"
																	id="productId"> <input type="hidden"
																	id="purchaseAmount"> <select id="itemName"
																	class="searchable-select"
																	onchange="getItemdetailsBySku();">
																	<option value="">Select</option>
																	<!-- <option th:each="c,iter:${productList}"
																		th:value="${c.key}" th:text="${c.name}"></option> -->
																</select>
															</div>
														</div>

														<div class="row">
															<div class="col-md-12 cnt-sp-bw">
																<h5 class="sub-header-new m-0">Price Details</h5>
																<div class="d-flex gap-1 task-btn-sec">
																	<button
																		class="border-0 btn-transition btn btn-outline-primary br-m-btn"
																		data-bs-toggle="tooltip" title="Add"
																		onclick="toggleSection()">
																		<i class="fa-solid fa-square-plus " aria-hidden="true"></i>
																	</button>
																	<!-- <button
																		class="border-0 btn-transition btn btn-outline-primary br-dis br-m-btn"
																		title="Edit" onclick="editItemDetails()" disabled>
																		<i class="fa-solid fa-square-pen" aria-hidden="true"></i>
																	</button> -->
																	<button
																		class="border-0 btn-transition btn btn-outline-primary br-dis br-m-btn"
																		title="Delete" disabled onclick="deleteItemOnclick()"
																		data-bs-toggle="tooltip">
																		<i class="fa-solid fa-trash"></i>
																	</button>
																	<button class="btn btn-primary edit-btn br-s-btn"
																		type="button" onclick="saveTableData()">Save</button>
																	<button class="btn btn-primary edit-btn br-s-btn"
																		type="button" onclick="cancelItemDetails()">Cancel</button>
																</div>
															</div>
														</div>

														<div class="grid-container br-m-btn">
															<div id="salesPriceGrid" class="ag-theme-alpine grid-size"></div>
														</div>

														<div class="br-s-btn">
															<div class="row">
																<div class="col-lg-6">
																	<div class="mb-3">
																		<label class="form-label">Batch No</label> <input
																			type="text" onblur="removeValid(event)" id="batchNo"
																			class="form-control">
																	</div>
																</div>
																<div class="col-lg-6 form-group calendar_box">
																	<label class="form-label">Effective Date</label><span
																		class="mandatory">*</span>
                                  <div class="position-relative"><input type="text"
                                              id="effectDate" class="form-control"
                                              onblur="removeValid(event)"
                                              th:attr="onkeyup=|formatDate('qutValidDate','${session.DATEFORMAT_JS}')|"
                                              readonly> <i
                                       class="ti-calendar picker_calendar"
                                       id="effectDateCalendar" onblur="removeValid(event)"></i></div>
																</div>
																<div class="col-lg-3" id="purchaseDiv">
																	<div class="mb-3">
																		<label class="form-label">Purchase Price</label> <input
																			type="text" onblur="removeValid(event)"
																			id="purchasePrice" class="form-control" readonly>
																	</div>
																</div>
																<div class="col-lg-3">
																	<div class="mb-3">
																		<label class="form-label">Landing Price</label> <input
																			type="text" onblur="removeValid(event)"
																			id="landingPrice" class="form-control">
																	</div>
																</div>

																<div class="col-lg-3">
																	<div class="mb-3">
																		<label class="form-label">MRP</label> <input
																			type="text" id="mrp" class="form-control">
																	</div>
																</div>
																<div class="col-lg-3">
																	<label class="form-label">Sales Price</label><span
																		class="mandatory">*</span> <input
																		type="text" id="salesPrice"
																		onblur="removeValid(event)" class="form-control">

																</div>
																
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
										<!--Product Sales Price Tab End  -->
									</div>
									<!--Right Inner Tab End-->
								</div>
							</div>
							<!--Right Sec End-->
						</div>
					</div>
					<!--Tabbination 1 End-->
				</div>
			</div>
		</div>
	</div>
</body>
</html>
