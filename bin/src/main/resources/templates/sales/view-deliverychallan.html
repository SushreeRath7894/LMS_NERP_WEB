.modal-body table td input[type=checkbox] {

	top: 0px;

}

.firstnode {

	border-bottom: 1px solid transparent !important;

}

.simple-tree-table-closed .simple-tree-table-icon:after {
	content: "\f105" !important;
	font-family: 'FontAwesome';
	color: black;
	display: inline-block;
	margin-right: 6px;
	transform: rotate(90deg);
}

.simple-tree-table-opened .simple-tree-table-icon:after {
	content: "\f105" !important;
	font-family: 'FontAwesome';
	color: black;
	display: inline-block;
	margin-right: 6px;
}

.simple-tree-table-icon {
	display: inline-block;
	width: 1.5em;
	line-height: 1.5em;
	margin: 0.1em;
	background-color: transparent;
	text-align: center;

.tptCls {

}

ul#autocomplete-list1 {

}

.sugg-cls ul {

	position: relative;
}

.formValidation1 {
	font-size: 10px;

	color: #ff9e99;
	background-color: transparent;
	position: relative;
	top: -1px;
	padding: 3px 0;
}

ul#autocomplete-list1 li {
	position: relative;
	color: #fff;
	padding-left: 6px;
	background-color: #1f57a8;
	border-bottom: solid 1px #6189c2;
	padding-top: 5px;
	padding-bottom: 5px;
}

a.addCust {
	color: #fff !important;
}

.autocomplete {
	position: relative;
	display: inline-block;
	width: 100%;
}

.chosen-disabled .chosen-single {
	background: #e9ecef !important; /* Greyed out */
	cursor: not-allowed !important;
}

.chosen-disabled .chosen-choices {
	background: #e9ecef !important;
	cursor: not-allowed !important;
}

.out-box .max-btn1 {

    height: 15px;
}
#saveCopySelection {

    color: white;
}
