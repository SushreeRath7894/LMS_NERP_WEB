	xmlns:th="http://www.thymeleaf.org"

<head>
<link rel="stylesheet" href="../assets/css/extend/lightslider.css" />
<style type="text/css">
.highcharts-exporting-group {

}

.subheading.heading {

	font-size: 14px;
	margin-bottom: 5px;
	/* width: 200px; */
}

.autocomplete {
	position: relative;
	display: inline-block;
	width: 100%;
}

.btn-primarynew {
	color: #fff !important;
	background-color: #0d6efd;
	border-color: #0d6efd;
}

.innerstickybg {
	background: #f0f3f1;
	height: 60px;
	width: 100%;
	z-index: 8;
	padding: 10px 5px;
}

.slidebox {
	padding: 14px;
	margin-top: 0px;
	margin: 0px 10px;
}

/* .form-group label {
			font-size: 12px;
			position: relative;
			top: 4px;
		} */
.holdCls {
	background-color: rgb(0, 143, 0);
}

.bg_white {
	background: #ffffff !important;
}

.blueClsWT {
	background: #0076ba;
	color: #fff;
}

.blueCls {
	background: #0076ba;
	color: #fff;
}

.blueClsWT::before {
	font-size: 8px;
	color: #FFF;
	content: '\e64c';
	font-family: 'themify';
	padding-right: 7px;
}

.modal-body table td input[type=checkbox] {
	width: 0px;
	margin-right: 16px;
	position: relative;
	top: 0px;
	float: none;
}

.firstnode {
	color: #929292;
	border-top: 1px solid transparent !important;
	border-left: 1px solid transparent !important;
	border-bottom: 1px solid transparent !important;
	width: 320px;
	font-size: 12px;
	font-weight: 100;
}

.simple-tree-table-closed .simple-tree-table-icon:after {
	content: "\f105" !important;
	font-family: 'FontAwesome';
	color: black;
	display: inline-block;
	margin-right: 6px;
	transform: rotate(90deg);
}

.simple-tree-table-opened .simple-tree-table-icon:after {
	content: "\f105" !important;
	font-family: 'FontAwesome';
	color: black;
	display: inline-block;
	margin-right: 6px;
}

.simple-tree-table-icon {
	display: inline-block;
	width: 1.5em;
	line-height: 1.5em;
	margin: 0.1em;
	background-color: transparent;
	text-align: center;
	cursor: pointer;
}

.form-group1 label {
	font-size: 18px;
	position: relative;
	top: 4px;
}

.tptCls {
	background: transparnt;
}

.font-small {
	font-size: 13px;
}

.billtxt {
	color: #777 !important;
	font-size: 14px;
	margin-top: 10px;
	text-transform: uppercase;
	display: block;
}

.fa {
	display: inline-block;
	font: normal normal normal 14px/1 FontAwesome;
	font-size: inherit;
	text-rendering: auto;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
}

.form-controls {
	font-family: 'Montserrat', sans-serif;
	display: block;
	width: 100%;
	font-size: 12px;
	color: #929292;
	background-color: transparent;
	background-clip: padding-box;
	border: 1px solid #d5d5d5;
	transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
	line-height: 30px;
	border-radius: 0;
	padding: 0;
}

.sugg-cls ul {
	height: 150px;
	overflow-x: scroll;
	position: relative;
}

ul#autocomplete-list1 {
	position: relative;
	z-index: 999;
}

ul#autocomplete-list1 li {
	position: relative;
	color: #fff;
	padding-left: 6px;
	background-color: var(--mainColor);
	border-bottom: solid 1px #d6ccd9;
	padding-top: 5px;
	padding-bottom: 5px;
}

ul#autocomplete-list {
	position: relative;
	z-index: 999;
}

ul#autocomplete-list li {
	position: relative;
	color: #fff;
	padding-left: 6px;
	background-color: #1f57a8;
	border-bottom: solid 1px #6189c2;
	padding-top: 5px;
	padding-bottom: 5px;
}

a.addCust {
	color: #fff;
}

.formValidation1 {
	font-size: 10px;
	font-weight: 100;
	color: #ff9e99;
	background-color: transparent;
	position: relative;
	top: -1px;
	padding: 3px 0;
}

.approve-btn1 {
	border: none;
	border-radius: 4px;
	font-size: 11px;
	background-color: #264c82;
	color: #fff;
	margin-left: 5px;
	text-transform: uppercase;
	width: 50px;
	height: 28px;
	line-height: 12px;
	float: right;
	text-transform: uppercase;
	cursor: pointer;
	white-space: normal;
}
/*
element.style {
	width: 30%;
	position: absolute;
	right: -10px;
	overflow: hidden;
	height: auto;
	bottom: 150px;
}*/
.form-control_big {
	font-family: 'Montserrat', sans-serif;
	display: block;
	width: 100%;
	font-size: 20px;
	font-weight: 300;
	color: #000;
	background-color: transparent;
	background-clip: padding-box;
	border-top: none;
	border-left: none;
	border-right: none;
	border-bottom: 1px solid #d5d5d5;
	transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
	margin-top: 10px;
	margin-bottom: 1px;
	padding-bottom: 0;
}

a.addCustnew {
	color: #fff;
	font-size: 13px !important;
}

.font-design {
	text-transform: capitalize;
	font-weight: 600;
}

.new-btn {
	width: auto;
}

.out-box .task-btn-sec .edit-btn {
	width: auto;
}

.sp-bw {
	justify-content: space-between;
	align-items: center;
}

.custom-file-icon {
	font-size: calc(( 14/ 16)* 1rem);
	color: rgb(191, 5, 255);
}

.deleteFileDoc {
	font-size: calc(( 14/ 16)* 1rem);
	left: 12rem;
	top: 1.8rem;
	border: solid 1px var(--grayborderColor) !important;
	display: inline-block;
	cursor: pointer;
	font-weight: 100;
	background-color: var(--whiteColor);
	margin: 0 5px;
	line-height: 31px;
	border-radius: .25rem;
	height: 32px;
	transition: all 0.5s;
	width: 32px;
	text-align: center;
	font-size: 12px;
}

.out-box .max-btn1 {
	color: var(--mainColor);
	font-size: 16px;
	width: 40px;
	height: 37px;
	background-color: var(--whiteColor) !important;
	line-height: 20px !important;
	padding: 8px 12px;
	transition: 0.5s;
	border: solid 1px var(--grayborderColor) !important;
}
</style>
<script src="/javaScript/sales/view-quotation.js"></script>
<script src="https://cdn.ckeditor.com/4.16.0/standard/ckeditor.js"></script>

</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<input type="hidden" id="sessionOrganization1"
						th:value="${session.ORGANIZATION}" /> <input type="hidden"
						id="sessionOrganization" th:value="${organization}" /> <input
						type="hidden" id="sessionOrgDivision" th:value="${orgDivision}" />
					<input type="hidden" id="baseURL" th:value="${baseUrl}" /> <input
						type="hidden" id="sessionId" th:value="${userId}" /> <input
						type="hidden" id="sessionName" th:value="${userName}" /> <input
						type="hidden" id="hrRole" th:value="${hrRole}" /> <input
						type="hidden" id="sessionRole" th:value="${userRole}" /> <input
						type="hidden" id="myRole" th:value="${session.USER_ROLES}">
					<input type="hidden" id="adRole" th:value="${adRole}" /> <input
						type="hidden" id="totalPageno"> <input type="hidden"
						id="currentPageno">
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">
										<div class="col-md-8 col-12">
											<div class="d-flex search-sec" id="quotSearchDiv">
												<input class="form-control me-2" type="text"
													placeholder="Search" id="quickFilter" autocomplete="off"
													onkeydown="handleEnter(event)">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												&nbsp;
												<button class="btn go-btn w-auto" type="button"
													onclick="resetBtn()">Reset</button>
											</div>
											<div class="d-flex search-sec" id="quotDraftSearchDiv">
												<input class="form-control me-2" type="text"
													placeholder="Search" id="quickFilter1" autocomplete="off"
													onkeydown="handleEnter1(event)">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged1()">Go</button>
												&nbsp;
												<button class="btn go-btn w-auto" type="button"
													onclick="resetBtn()">Reset</button>
											</div>

										</div>
										<div class="d-flex gap-2">
											<button class="btn btn-primary max-btn" id="viewDraftBtn"
												onclick="viewDraft()" data-bs-toggle="tooltip"
												data-bs-placement="top" title="View Draft">
												<i class="fa-solid fa-pencil-alt" id="draftQoutIcon"></i>
											</button>
											<button class="btn btn-primary max-btn d-none"
												id="viewQuotBtn" onclick="returnToQuotation()"
												data-bs-toggle="tooltip" data-bs-placement="top"
												title="View Quotation">
												<i class="fa-solid fa-file-invoice" id="viewQoutIcon"></i>
											</button>
											<button class="btn btn-primary max-btn" id="copyQout"
												onclick="copyQuotation()" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Copy Quotation">
												<i class="fa-solid fa-copy" id="copyQoutIcon"></i>
											</button>
											<button class="btn btn-primary max-btn" id="downloadPDF"
												onclick="excelDownload()" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Download Excel">
												<i class="fa-solid fa-download" id="downloadPDFIcon"></i>
											</button>
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
									</div>
									<!--  -->
									<div class="rounded border m-2 mb-0 p-2">
										<div class="row row-cols-1 row-cols-xl-3 g-3">

											<!-- From Date -->
											<div class="col">
												<div class="row g-3 align-items-center">
													<div class="col-auto">
														<label for="fromDateQT" class="form-label">From
															Date:</label>
													</div>
													<div class="col">
														<div class="position-relative">
															<input type="text" id="fromDateQT"
																class="form-control position-relative"
																autocomplete="off" readonly onblur="removeValid(event)"
																th:attr="onkeyup=|formatDate('fromDateQT','${session.DATEFORMAT_JS}')|">
															<i class="ti-calendar picker_calendar"
																id="fromDateQTCalendar"></i>
														</div>
													</div>
												</div>
											</div>

											<!-- To Date -->
											<div class="col">
												<div class="row g-3 align-items-center">
													<div class="col-auto">
														<label for="toDateQT" class="form-label">To Date:</label>
													</div>
													<div class="col">
														<div class="position-relative">
															<input type="text" id="toDateQT"
																class="form-control position-relative"
																autocomplete="off" readonly onblur="removeValid(event)"
																th:attr="onkeyup=|formatDate('toDateQT','${session.DATEFORMAT_JS}')|">
															<i class="ti-calendar picker_calendar"
																id="toDateQTCalendar"></i>
														</div>
													</div>
												</div>
											</div>

											<!-- Search Button -->
											<div
												class="col text-end d-flex align-items-center justify-content-end">
												<button class="btn go-btn" type="button" id="dtSearch"
													onclick="filterView()">Search</button>
											</div>

										</div>
									</div>
									<!--  -->
									<div class="card p-2 m-2">
										<div id="myGrid" style="height: 100vh;"
											class="ag-theme-alpine"></div>
										<div id="myGridDraft" style="height: 100vh;"
											class="ag-theme-alpine d-none"></div>
									</div>
								</div>
							</div>
							<div id="snackbar" class="snackbar"></div>
							<!--Right Sec Start-->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box" id="rightSideDiv">

									<div
										class="d-flex justify-content-between align-items-center flex-row-reverse p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>
										<ul class="nav nav-pills newtab" role="tablist">
											<li class="nav-item" role="presentation"
												id="quotationInfLiId"><a class="nav-link active"
												data-bs-toggle="pill" href="#quotationInfo"
												aria-selected="true" role="tab"> Information</a></li>
											<li class="nav-item" role="presentation" id="quatationItemId"><a
												class="nav-link" data-bs-toggle="pill" href="#itemDetails"
												aria-selected="false" role="tab" tabindex="-1"> Design</a></li>
											<li class="nav-item" role="presentation" id="othersId"><a
												class="nav-link" data-bs-toggle="pill" href="#otherdetails"
												aria-selected="false" role="tab" tabindex="-1">Attachment</a></li>
											<li class="nav-item" role="presentation"
												id="shippingAddressId"><a class="nav-link"
												data-bs-toggle="pill" href="#shippingAddress"
												aria-selected="false" role="tab" tabindex="-1">Shipping
													Address</a></li>
											<li class="nav-item" role="presentation" id="termsCondLiId"><a
												class="nav-link" data-bs-toggle="pill" href="#termCondDtls"
												aria-selected="false" role="tab" tabindex="-1">Terms &
													Conditions</a></li>
											<li class="nav-item d-none" role="presentation"
												id="previewLiId"><a class="nav-link"
												data-bs-toggle="pill" href="#preview" aria-selected="false"
												role="tab" tabindex="-1">Preview</a></li>
											<li class="nav-item d-none" role="presentation" id="mailId"><a
												class="nav-link" data-bs-toggle="pill" href="#mail"
												aria-selected="false" role="tab" tabindex="-1">Mail</a></li>

										</ul>
									</div>

									<!-- Tab panes -->
									<div class="tab-content flex-fill h-25">
										<div id="quotationInfo"
											class="tab-pane fade active p-2 h-100 show" role="tabpanel">

											<div class="requisition-tbl d-flex flex-column h-100">

												<div
													class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded mb-2">
													<div class="project-name flex-1">
														<div class="d-none">
															<strong id="quotationReference"></strong> - (<span
																id="version"></span>)
														</div>
														<span class="head-user-name ml-5" id="employeeNameTop"></span>
													</div>

													<div class="d-flex justify-content-end w-100 gap-2 flex-1">
														<button class="btn btn-primary  edit-btn " type="button"
															onclick="addQuot()" id="addBtnId">Add</button>
														<button class="btn btn-primary  edit-btn d-none"
															type="button" id="approveBtn" onclick="approveOnclick()">Approve</button>
														<button class="btn btn-primary  edit-btn d-none"
															type="button" id="revisionBtn" onclick="revision()">Revision</button>
														<button class="btn btn-primary edit-btn " type="button"
															id="editQuotation" onclick="enableFields()">Edit</button>
														<button class="btn btn-primary edit-btn " type="button"
															id="deleteQuot" onclick="deleteQuotation()">Delete</button>
														<button class="btn btn-primary edit-btn d-none"

														<button class="btn btn-primary edit-btn" type="button"
															onclick="nextTab('quatationItemId')">Next</button>
													</div>
												</div>

												<div class="card p-2">

													<div class="innercontent">
														<!-- Customer Details -->
														<input type="hidden" id="qutNo"> <input
															type="hidden" id="draftId">
														<div class="font-design">Customer Details</div>
														<div class="row">
															<div class="col-md-6 form-group">
																<label for="custName">Customer Name</label><span
																	class="mandatory">*</span> <input type="text"
																	id="custName" class="form-control"
																	placeholder="Enter Customer Name"
																	onchange="handleCustomerChange()"
																	onkeyup="getCustomerList()" autocomplete="off">
																<input type="hidden" id="custId"> <input
																	type="hidden" id="custGSTNo"> <input
																	type="hidden" id="approveStatus">
																<div id="suggesstion-box1_" class="sugg-cls"></div>
															</div>
															<div class="col-md-6 form-group">
																<label for="endCustName">End Customer Name</label> <input
																	type="text" id="endCustName" class="form-control">
															</div>
														</div>



														<!-- Quotation Details -->
														<div class="mt-3">
															<div class="font-design">Quotation Details</div>
															<div class="row">
																<div class="col-md-4 form-group">
																	<label for="quotationId">Quotation ID</label> <input
																		type="text" id="quotationId" class="form-control"
																		readonly> <input type="hidden" id="draftId">
																</div>
																<div class="col-md-4 form-group">
																	<label for="quotationDate">Quotation Date</label>
																	<div class="position-relative">
																		<input type="text" id="quotationDate"
																			class="form-control" readonly> <i
																			class="ti-calendar picker_calendar"
																			id="quotDateCalendar" onblur="removeValid(event)"></i>
																	</div>
																</div>
																<div class="col-md-4 form-group calendar_box">
																	<label>Valid UpTo Date</label><span class="mandatory">*</span>
																	<div class="position-relative">
																		<input type="text" id="qutValidDate"
																			class="form-control" onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('qutValidDate','${session.DATEFORMAT_JS}')|"
																			readonly> <i
																			class="ti-calendar picker_calendar"
																			id="toDateCalendar" onblur="removeValid(event)"></i>
																	</div>
																</div>
																<div class="col-md-4 form-group">
																	<div class="mb-3">
																		<label>Project</label> <input type="hidden"
																			id="projectId"> <input type="hidden"
																			id="projectName"> <select id="project"
																			class="searchable-select"
																			onchange="getItemdetailsBySku();">
																			<option value="">Select</option>
																			<option th:each="c,iter:${projectList}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>
															</div>
															<div class="row mt-3">
																<div class="col-md-12 form-group">
																	<label for="subject">Subject</label><span
																		class="mandatory">*</span>
																	<textarea id="subject" class="form-control"></textarea>
																</div>
																<div class="col-md-12 mt-3 form-group">
																	<label for="qutDescription" class="mb-2">Customer
																		Notes</label>
																	<textarea id="qutDescription" class="form-control"></textarea>
																</div>
															</div>

														</div>

														<!-- Hidden Fields -->

															type="hidden" id="subTotal"> <input type="hidden"
															id="qIGST"> <input type="hidden" id="qCGST">
														<input type="hidden" id="qSGST"> <input
															type="hidden" id="grandTotal">

													</div>


												</div>
											</div>
										</div>
										<div id="itemDetails" class="tab-pane fade p-2 h-100"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">

												<div
													class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded mb-2">

													<div class="project-name flex-1">
														<span class="head-user-name ml-5" id="employeeNameTop1"></span>
													</div>

													<div class="d-flex justify-content-end w-100 gap-2 flex-1">
														<span th:text="${action_list}"></span>

														<div class="mr-2">
															<button class="btn btn-primary edit-btn" type="button"
																onclick="nextTab('quotationInfLiId')">Prev</button>
														</div>
														<div class="mr-2">
															<button class="btn btn-primary edit-btn" type="button"
																onclick="nextTab('othersId')">Next</button>
														</div>
													</div>
												</div>

												<div class="card p-2">

													<div class="innercontent">

															<div class="font-design">Item Details</div>
															<div class="d-flex gap-1 task-btn-sec">
																<button class="btn max-btn br-m-btn" title="Add"
																	onclick="toggleSection()" data-bs-toggle="tooltip">
																	<i class="fa-solid fa-square-plus " aria-hidden="true"></i>
																</button>

															<div class="col-md-3">
																<div class="form-group">
																	<label>State<span class="mandatory">*</span></label>
																	<div class="select">
																		<select id="states2" onblur="removeValid(event)">
																			<option value="">Select</option>
																		</select>
																	</div>
																</div>
															</div>

															<div class="col-md-3">
																<div class="form-group">
																	<label>City<span class="mandatory">*</span></label> <input
																		type="text" class="form-control" id="city2"
																		placeholder="City" onblur="removeValid(event)"
																		onkeyup="checkAlphabet('city2')" maxLength="30">
																</div>
															</div>
															<div class="col-md-3">
																<div class="form-group">
																	<label>Street 1<span class="mandatory">*</span></label>
																	<input type="text" class="form-control" id="street12"
																		placeholder="Street 1" onblur="removeValid(event)"
																		maxLength="300">
																</div>
															</div>
															<div class="col-md-3">
																<div class="form-group">
																	<label>Street 2</label> <input type="text"
																		class="form-control" id="street22"
																		placeholder="Street 2" onblur="removeValid(event)"
																		maxLength="300">
																</div>
															</div>
															<div class="col-md-3">
																<div class="form-group">
																	<label>Zip Code<span class="mandatory">*</span></label>
																	<input type="text" class="form-control" id="zipCode2"
																		autocomplete="off" placeholder="Zip Code"
																		onkeyup="zipcodeVal2();checkNumeric('zipCode2');"
																		onblur="removeValid(event)"> <span
																		id="error152" class="formValidation1"></span>
																</div>
															</div>

															<div class="col-md-3">
																<div class="form-group">
																	<label>Phone</label> <input type="text"
																		class="form-control" id="phone2" placeholder="Phone"
																		onkeyup="checkNumeric('phone2');"
																		onblur="removeValid(event)"> <span
																		id="error122" class="formValidation1"></span>
																</div>
															</div>
															<div class="col-md-3">
																<div class="form-group">
																	<label>Fax</label> <input type="text"
																		class="form-control" id="fax2" placeholder="Fax"
																		onblur="removeValid(event)">
																</div>
															</div>
															<div class="col-md-3">
																<div class="form-group">
																	<label>GSTIN</label> <input type="text"
																		class="form-control" id="gstIn2" placeholder="GSTIN"
																		onblur="removeValid(event)">
																</div>
															</div>
														</div>
													</div>


												</div>
											</div>
										</div>
										<!--Shipping Address Tab End -->

										<div id="termCondDtls" class="tab-pane fade p-2 h-100"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">

												<div
													class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded mb-2">

													<div class="project-name flex-1">
														<span class="head-user-name ml-5" id="employeeNameTop2"></span>
													</div>

													<div class="d-flex justify-content-end w-100 gap-2 flex-1">
														<span th:text="${action_list}"></span>

														<div class="mr-2">
															<button class="btn btn-primary edit-btn" type="button"
																onclick="nextTab('shippingAddressId')">Prev</button>
														</div>
														<div class="mr-2">
															<button class="btn btn-primary edit-btn d-none"
																type="button" id="draftButton" onclick="saveAsDraft()">Save
																As Draft</button>
														</div>
														<div class="mr-2">
															<button class="btn btn-primary edit-btn " type="button"
																id="quotationSaveBtn" onclick="save()">Save</button>
														</div>
														<!-- <div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="nextTab('shippingAddressId')">Next</button>
																		</div> -->

													</div>
												</div>

												<div class="card p-2">
													<div class="innercontent">
														<div class="mt-4" id="termsAndConditionCont">
															<div class="col-md-12 mt-3">
																<label for="qutDescription" class="mb-2">Terms &
																	Conditions</label>
																<textarea id="termCondition" class="form-control"></textarea>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>

										<!-- Mail Tab Start -->
										<div id="mail" class="tab-pane fade p-2 h-100 d-none"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="card p-2" id="emailInfo">
													<div class="d-flex justify-content-between">
														<div class="mb-3 font-design">Add Mail Details</div>
														<button class="btn btn-primary max-btn" title="Send"
															id="sendIcon" onclick="addMail()"
															data-bs-toggle="tooltip">
															<i class="bi bi-send"></i>
														</button>
													</div>

													<div class="row">

														<div class="col-md-6 form-group">
															<div class="mb-3">
																<label>Customer Name</label> <input type="hidden"
																	id="customerIds"> <input type="text"
																	class="form-control" id="customerNames"
																	onblur="removeValid(event);">
															</div>
														</div>

														<div class="col-md-6 form-group">
															<div class="mb-3">
																<label>Customer Contact No</label> <input type="text"
																	class="form-control" id="customerCns" maxlength="10"
																	onblur="removeValid(event);">
															</div>
														</div>

														<div class="col-md-12 form-group">
															<div class="mb-3">
																<label>Customer Mail (To)</label>
																<textarea class="form-control" id="customerMails"
																	onblur="removeValid(event);"></textarea>
															</div>
														</div>

														<div class="col-md-6" id="ccField">
															<div class="form-group">
																<label for="mailCc">Customer CC</label> <select
																	id="multipleMailCustomerCc" multiple
																	onblur="removeValid(event)">
																	<option th:each="c,iter:${emplistsEvent}"
																		th:value='${c.code}' th:text="${c.code}"></option>
																</select> <input type="hidden" id="toHiddenIdCc">
															</div>
														</div>

														<div class="col-md-6" id="bccField">
															<div class="form-group">
																<label for="mailBcc">Customer Bcc</label> <select
																	id="multipleMailCustomerBcc" multiple
																	onblur="removeValid(event)">
																	<option th:each="c,iter:${emplistsEvent}"
																		th:if="${c.code} != ''" th:value='${c.code}'
																		th:text="${c.code}" th:data-code="${c.name}"></option>
																</select> <input type="hidden" id="toHiddenIdBcc">
															</div>
														</div>

														<div class="col-md-12 form-group">
															<div class="mb-3">
																<label>Customer Message</label>
																<textarea class="form-control" id="customerMsg"
																	onblur="removeValid(event);"></textarea>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
										<div id="preview" class="tab-pane fade p-2 h-100"
											role="tabpanel">
											<div
												class="requisition-tbl d-flex flex-column h-100 overflow-scroll">
												<div th:replace="sales/quot-preview :: quot-preview"></div>
											</div>
										</div>
									</div>
								</div>
								<!-- Mail Tab End -->

							</div>

							<!--Right Inner Tab End-->
						</div>
					</div>
					<!--Right Sec End-->
				</div>
			</div>
			<!--Tabbination 1 End-->
		</div>
	</div>
</body>

</html>
