<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<script>

		function togglePocSection() {
			$(".br-m-btn-poc").hide();
			$(".br-s-btn-poc").show();
			$(".br-m-btn").hide();

		}
		function cancelDetails() {
			$(".br-m-btn-poc").show();
			$(".br-s-btn-poc").hide();
			$(".br-m-btn").show();
		}
		const columnDefs = [
			{
				headerCheckboxSelection: false,
				checkboxSelection: true,
				width: 8,
				sortable: false,
				filter: false,
				resizable: true,
				pinned: 'left',

			},
			{
				headerName: 'Customer Id',
				field: "customerId",
				pinned: 'left',
				width: 120,

			},

			{
				headerName: "Customer Name",
				field: "customerDisplayName",
				pinned: 'left',
				cellStyle: {
					textAlign: 'left'
				}
			}, {
				/* headerName : "Company Name",
				field : "companyName",
				cellStyle : {
					textAlign : 'left'
				}
			}, { */
				headerName: "Email",
				field: "cusEmail",
				width: 150,
				cellStyle: {
					textAlign: 'left'
				}
			},

			{
				headerName: "Pan No.",
				field: "pan",
				width: 100,
				cellStyle: {
					textAlign: 'left'
				}
			}, {
				headerName: "Gst No.",
				field: "gstNo",
				width: 120,
				cellStyle: {
					textAlign: 'left'
				}
			}, {
				headerName: "Customer Type",
				field: "customerType",
				width: 100,
				cellStyle: {
					textAlign: 'left'
				}
			}, {
				headerName: "Status",
				field: "status",
				width: 80,
				cellStyle: {
					textAlign: 'left'
				}
			}];

		const gridOptions = {
			columnDefs: columnDefs,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 187,
				height: 10
			},
			rowSelection: 'single',
			suppressRowClickSelection: true,

		};




		// Column Definitions
		const columnDefs1 = [{
			headerCheckboxSelection: false,
			checkboxSelection: true,
			width: 8,
			sortable: false,
			filter: false,
			resizable: true,
			pinned: 'left',
		},
		{
			headerName: " Poc Id",
			field: "id",
			hide: true,

		},
		{
			headerName: 'First Name',
			field: "firstName",
			flex: 1
		}, {
			headerName: "Last Name",
			field: "lastName",
			flex: 1
		}, {
			headerName: "Email",
			field: "emailAdd",
			flex: 1,
		}, {
			headerName: "Mobile",
			field: "mobile",
			flex: 1,
		}
		];
		// Row Data

		// Grid Options
		const gridOptions1 = {
			columnDefs: columnDefs1,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 150,
				height: 10
			},
			rowSelection: 'single',
			suppressRowClickSelection: true,

		};



		///




		// Column Definitions
		const columnDefs2 = [{
			headerCheckboxSelection: false,
			checkboxSelection: true,
			width: 8,
			sortable: false,
			filter: false,
			resizable: true,
			pinned: 'left',
		},

		{
			headerName: 'Module',
			field: "module",
			flex: 1
		}, {
			headerName: "Activity",
			field: "activity",
			flex: 1
		}
		];
		// Row Data

		// Grid Options
		const gridOptions2 = {
			columnDefs: columnDefs2,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 150,
				height: 10
			},
			rowSelection: 'single',
			suppressRowClickSelection: true,

		};

		$(document).ready(() => {

			$(".br-s-btn").hide();
			$(".br-s-btn-dl").hide();
			$(".br-s-btn-poc").hide();
			$(".br-s-btn-b").hide();
			$(".br-s-btn-p").hide();
			// Initialize the Grid
			const gridDiv1 = document.querySelector("#myGrid");
			new agGrid.Grid(gridDiv1, gridOptions);

			const gridDiv = document.querySelector("#myGrid1");
			new agGrid.Grid(gridDiv, gridOptions1);

			const gridDiv2 = document.querySelector("#myGridModule");
			new agGrid.Grid(gridDiv2, gridOptions2);


		})
	</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="d-flex">
			<div class="maincontentsec">
				<div id="tab1" class="tab-pane" role="tabpanel">
					<div class="d-flex flex-column flex-lg-row">
						<div class="box-sec" id="collapseWidthR1">
						
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">
										<div class="col-md-8 col-12">
											<div class="d-flex search-sec flxwrap">
												<input class="form-control me-2" type="text" placeholder="Search"
													id="quickFilter" autocomplete="off">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												&nbsp;
												<button class="btn go-btn w-auto" type="button"
													onclick="reset()">Reset</button>
											</div>
										</div>
										<button class="btn btn-primary max-btn" id="collapseButtonR1"
											onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
											data-bs-placement="top" title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
										</button>

									</div>
									<div class="card p-2 m-2">
										<div id="myGrid" style="width: 100%; height: 500px;" class="ag-theme-alpine">
										</div>
									</div>
					
							</div>
						</div>


						<div class="box-sec" id="collapseWidthL1">
							<div class="out-box" id="rightSideDiv">
								<div
									class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
									<button class="btn btn-primary max-btn" id="collapseButtonL1" type="button"
										onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" data-bs-placement="top"
										title="Expand">
										<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
											class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
									</button>

									<!--Right Inner Tab Start-->
									<div class="d-flex gap-2">
										<ul class="nav nav-pills newtab" role="tablist">
											<li class="nav-item" role="presentation" id="customerInfLiId"><a
													class="nav-link active" data-bs-toggle="pill"
													href="#customerInformation" aria-selected="true" role="tab">
													Information</a></li>
											<li class="nav-item" role="presentation" id="customerAddressLiId"><a
													class="nav-link" data-bs-toggle="pill" href="#customerAddress"
													aria-selected="false" role="tab" tabindex="-1">Address</a></li>
											<li class="nav-item" role="presentation" id="customerModulusId"><a
													class="nav-link" data-bs-toggle="pill" href="#customerModulus"
													aria-selected="false" role="tab" tabindex="-1">Modulus</a></li>
											<li class="nav-item" role="presentation" id="BillingCycle"><a
													class="nav-link" data-bs-toggle="pill" href="#customerBillingCycle"
													aria-selected="false" role="tab" tabindex="-1">Billing Cycle</a>
											</li>

										</ul>
									</div>
								</div>

								<!-- Tab panes -->
								<div class="tab-content flex-fill h-25">
									<div id="customerInformation" class="tab-pane active p-2 h-100" role="tabpanel">

										<div class="requisition-tbl d-flex flex-column h-100">

											<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tbody>
														<tr valign="middle">
															<td width="50%"><strong id="customerIdHead"></strong>
																- <strong id="customerIdHeadName"></strong></td>
															<td>
																<div class="d-flex justify-content-end flxwrap">
																	<span th:text="${action_list}"></span>
																	<div class="mr-2">
																		<button class="btn btn-primary  edit-btn "
																			type="button">Add</button>
																	</div>
																	<div class="mr-2">
																		<!-- th:if="${session.action_name_list.contains('Edit')}" -->
																		<button class="btn btn-primary edit-btn "
																			type="button">Edit</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn "
																			type="button">Delete</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button">Next</button>
																	</div>
																</div>

															</td>
														</tr>
													</tbody>
												</table>
											</div>

											<div class="card p-2">

												<div class="innercontent">

													<div class="innercontent">

														<!-- <div class="row"> -->
														<div class="row">


															<div class="col-md-4">
																<div class="form-group">
																	<input type="hidden" id="customerId">
																	<label>Customer
																		Id</label> <input type="text"
																		class="form-control" id="customer">
																</div>
															</div>
															<div class="col-md-4">
																<div class="form-group">
																	<label>Customer Type</label>

																	<div class="select">
																		<select id="customerType">
																			<option value="">Select</option>
																			<option value="Business">B2B</option>
																			<option value="Individual">B2C</option>
																			<option value="Export">Export</option>
																		</select>
																	</div>
																</div>
															</div>
															<div class="col-md-4" id="customerNameDiv">
																<div class="form-group">
																	<label>Customer Name</label> <input type="text"
																		class="form-control" id="customerName"
																		placeholder="Customer Name" maxLength="50">
																</div>
															</div>

															<div class="col-md-4">
																<div class="form-group">
																	<label>Customer Email</label> <input type="text"
																		class="form-control" id="cusEmail"
																		placeholder="Email"
																		style="text-transform: lowercase"> <span
																		id="error3" class="formValidation1"></span>
																</div>
															</div>

															<div class="col-md-4">
																<div class="form-group">
																	<label>Status</label>
																	<div class="radio d-flex gap-2">

																		<input type="radio" id="html"
																			name="fav_language" value="HTML">
																		<label for="html">Active</label><br>
																		<input type="radio" id="css" name="fav_language"
																			value="CSS">
																		<label for="css">Inactive</label><br>
																	</div>
																</div>
															</div>
														</div>

														<div class="row">
															<div class="col-md-4">
																<h5 class="sub-header-new">Other Details</h5>
															</div>
														</div>

														<div class="row">
															<div class="col-md-4">
																<div class="form-group">
																	<label>Pan Card</label> <input type="text"
																		class="form-control" id="pan"
																		placeholder="Pan Card"> <span id="error4"
																		class="formValidation1"
																		style="color: red;"></span>
																</div>
															</div>

															<div class="col-md-4" id="gstNoDiv">
																<div class="form-group">
																	<label>GST No.</label>
																	<!-- <div class="d-flex"> -->
																	<div>
																		<input type="text" class="form-control"
																			id="gstNo" placeholder="GST No"
																			maxlength="15">
																		<span id="error5"
																			class="formValidation1"></span>
																	</div>
																</div>
															</div>

														</div>
													</div>
												</div>


											</div>
										</div>
									</div>

									<div id="customerAddress" class="tab-pane fade p-2 h-100" role="tabpanel">
										<div class="requisition-tbl d-flex flex-column h-100">
											<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tbody>
														<tr valign="middle">
															<td width="50%"><strong id="vendorIdHead"></strong></td>
															<td>
																<div class="d-flex justify-content-end flxwrap">
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button">Prev</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button">Next</button>
																	</div>
																</div>

															</td>
														</tr>
													</tbody>
												</table>
											</div>
											<div class="card p-2">
												<div class="row">
													<div class="col-md-12">
														<h5 class="sub-header-new">Billing Address Details</h5>
													</div>
												</div>
												<div class="row">
													<div class="col-md-4">
														<div class="form-group">
															<label>Country</label>
															<div class="select">
																<select id="country">
																	<option>Select Country</option>
																	<option></option>
																</select>
															</div>
														</div>
													</div>

													<div class="col-md-4">
														<div class="form-group">
															<label>State</label>
															<div class="select">
																<select id="states">
																	<option th:value="NULL">Select State</option>
																	<!-- <option th:each="c,iter:${statesList}"
											th:value="${c.key}" th:text="${c.name}"></option> -->
																</select> <span class="focus"></span>
															</div>
														</div>
													</div>

													<div class="col-md-4">
														<div class="form-group">
															<label>City</label> <input type="text" class="form-control"
																id="city" placeholder="City" maxLength="30">
															<span id="error7" class="formValidation1"></span>
														</div>
													</div>

													<div class="col-md-4">
														<div class="form-group">
															<label>Street 1</label> <input type="text"
																class="form-control" id="street1" placeholder="Street 1"
																maxLength="30">
														</div>
													</div>

													<div class="col-md-4">
														<div class="form-group">
															<label>Street 2</label> <input type="text"
																class="form-control" id="street2" placeholder="Street 2"
																maxLength="30">
														</div>
													</div>
													<div class="col-md-4">
														<div class="form-group">
															<label>Zip Code</label> <input type="text"
																class="form-control" id="zipCode" autocomplete="off"
																placeholder="Zip Code"> <span id="error14"
																class="formValidation1"></span>
														</div>
													</div>

													<div class="col-md-4">
														<div class="form-group">
															<label>Phone</label> <input type="text" class="form-control"
																id="phone" placeholder="Phone"
																onkeyup="checkNumeric('phone');"
																onblur="removeValid(event)"> <span id="error11"
																class="formValidation1"></span>
														</div>
													</div>


													<div class="col-md-4">
														<div class="form-group">
															<label>Fax</label> <input type="text" class="form-control"
																id="fax" placeholder="Fax">
														</div>
													</div>

												</div>

												<div class="row mt-2">
													<div class="col-md-12 cnt-sp-bw">
														<h5 class="sub-header-new">Contact Details</h5>
														<div class="d-flex gap-1 task-btn-sec">
															<button
																class="border-0 btn-transition btn btn-outline-primary br-m-btn"
																title="Add" onclick="togglePocSection()">
																<i class="fa fa-plus-square" aria-hidden="true"></i>
															</button>
															<button
																class="border-0 btn-transition btn btn-outline-primary br-dis br-m-btn"
																title="Edit" disabled>
																<i class="fa fa-pencil-square" aria-hidden="true"></i>
															</button>
															<button
																class="border-0 btn-transition btn btn-outline-primary br-dis br-m-btn"
																title="Delete" disabled>
																<i class="fa fa-trash"></i>
															</button>
															<button class="btn btn-primary edit-btn br-s-btn-poc"
																type="button">Save</button>
															<button class="btn btn-primary edit-btn br-s-btn-poc"
																type="button" onclick="cancelDetails()">Cancel</button>
														</div>
													</div>
												</div>
												<div class="row br-m-btn-poc">
													<div id="myGrid1" style="height: 200px;" class="ag-theme-alpine">
													</div>
												</div>
												<div class="row br-s-btn-poc">

													<div class="col-md-6">
														<div class="form-group">
															<input type="hidden" id="idPoc"> <label>First
																Name</label> <input type="text" class="form-control"
																id="firstName" placeholder="First Name">
														</div>
													</div>

													<div class="col-md-6">
														<div class="form-group">
															<label>Last Name</label> <input type="text"
																class="form-control" id="lastName"
																placeholder="Last Name">
														</div>
													</div>


													<div class="col-md-6">
														<div class="form-group">
															<label>Email Address</label> <input type="text"
																class="form-control" id="emailAdd" placeholder="Email">
														</div>
													</div>


													<div class="col-md-6">
														<div class="form-group">
															<label>Mobile</label> <input type="text"
																class="form-control" id="mobile" placeholder="Mobile">
														</div>
													</div>

												</div>


											</div>
										</div>
									</div>

									<div id="customerModulus" class="tab-pane fade p-2 h-100" role="tabpanel">
										<div class="requisition-tbl d-flex flex-column h-100">
											<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tbody>
														<tr valign="middle">
															<td width="50%"><strong id="vendorIdHead"></strong></td>
															<td>
																<div class="d-flex justify-content-end flxwrap">
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button">Prev</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button">Next</button>
																	</div>
																</div>

															</td>
														</tr>
													</tbody>
												</table>
											</div>
											<div class="card p-2">
												<div class="row">
													<div id="myGridModule" style="width: 100%; height: 500px;"
														class="ag-theme-alpine">
													</div>
												</div>



											</div>
										</div>
									</div>


									<div id="customerBillingCycle" class="tab-pane fade p-2 h-100" role="tabpanel">
										<div class="requisition-tbl d-flex flex-column h-100">
											<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tbody>
														<tr valign="middle">
															<td width="50%"><strong id="vendorIdHead"></strong></td>
															<td>
																<div class="d-flex justify-content-end flxwrap">
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button">Prev</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			type="button">Next</button>
																	</div>
																</div>

															</td>
														</tr>
													</tbody>
												</table>
											</div>
											<div class="card p-2">
												<div class="row">
													<div class="col-md-4">
														<div class="form-group calendar_box">
															<label>From Date</label>
															<input type="text" autocomplete="off" class="form-control">
															<i class="ti-calendar picker_calendar"
																style="pointer-events: all;"></i>
														</div>
													</div>
													<div class="col-md-4">
														<div class="form-group calendar_box">
															<label>To Date</label>
															<input type="text" autocomplete="off" class="form-control">
															<i class="ti-calendar picker_calendar"
																id="toDateCalendar"></i>
														</div>
													</div>
												</div>



											</div>
										</div>
									</div>
								</div>

								<!--Right Inner Tab End-->
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>


	</div>
</body>

</html>
