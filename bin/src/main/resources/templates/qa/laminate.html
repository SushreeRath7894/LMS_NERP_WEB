		item.laminatationTest =$("#laminatationTest").val();

		item.avgWidth =$("#avgWidth").val();
		item.avgThicknes =$("#avgThicknes").val();
		item.avgGsm =$("#avgGsm").val();
		item.avgWeight =$("#avgWeight").val();
		item.remarks =$("#remarks").val();
				
		if (item.mrp == null || item.mrp == "") {
			valid = validationUpdated("MRP is Required", "mrp");
		 }
		if (item.pdate == null || item.pdate == "") {
			valid = validationUpdated("Production Date is Required", "pdate");
		 }
		
		if (item.pkd == null || item.pkd == "") {
			valid = validationUpdated("Pkd. is Required", "pkd");
		 }
		
		if (item.invoiceQty == null || item.invoiceQty == "") {
			valid = validationUpdated("Invoice Qty is Required", "invoiceQty");
		 }
		if (item.grnNo == null || item.grnNo == "") {
			valid = validationUpdated("GRN No is Required", "grnNo");
		 }
		if (item.suppliers == null || item.suppliers == "") {
			valid = validationUpdated("Suppliers is Required", "suppliers");
		 }
	

		
        if(valid){
        	datas.push(item);
         }
	});
	if (valid) {
		saveLaminate(datas);
		
		}
	} else {
		$("#messageParagraph").text(
		"Please Add Atleast One Plan Details");
		$("#msgOkModal").removeClass("btn3");
		$("#msgOkModal").addClass("btn1");
		$("#msgModal").modal('show');
	}
	console.log("data",datas);
}

function saveLaminate(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "laminate-details-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
			//var itemName = $("#itemname option:selected").text();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				agGrid.simpleHttpRequest({
					url : 'laminate-details-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body[0]);
					var allData=jsonData.view;
					console.log(allData)
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					gridOptions.api.setRowData(allData);
				});
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Test Parameter For "+itemName+" Already Exist.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				$("#itemid").val('');
				$("#itemname").val('');
				$("#description").val('');
				activityOptions.api.setRowData();
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

	function handleTextFieldKeyDown(event) {
		let currentCell = '';
		const idChar = {};
		if (event.code === 'Tab') {
			const currentInput = event.target;
			let currentId = currentInput.id;
			for (let i=0; i<currentId.length; i++) {
				idChar[i] = currentId.charAt(i);
				// console.log(`idChar[${i}] is ${idChar[i]}`);
				let searchString = idChar[0]+idChar[1];
				currentCell = currentId.replace(searchString,'');
			}
			 console.log(`currentCell is ${currentCell}`);

			if (currentCell < 17) {
				const nextInput = parseInt(currentCell) + 1;
				let nextInputId = idChar[0]+idChar[1]+nextInput;
				let nextInputCell = document.getElementById(`${nextInputId}`);
				if (nextInputCell) {
					nextInputCell.focus();
					event.preventDefault(); // Prevent the default Tab behavior
				}
			}
		}
	}
