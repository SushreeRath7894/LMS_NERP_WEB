	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}


	function saveTableData() {
		
		var editProduct = $("#editProduct").val();
		var item = {};
		var data = 1;
		
      {
		item.slNo = data;
			itemOptions.api.forEachNode(function(rowNode, index) {

				}
				else{
					item.slNo = editProduct;
				}
				
			});
			item.dateOfIssue = $('#dateOfIssue').val();
			item.shift = $('#shift').val();
			item.machine = $('#machine').val();
			item.incident = $('#incident').val();
			item.rejected = $('#rejected').val();
			item.quantity = $('#quantity').val();
			item.remark = $('#remark').val();
			item.signature = $('#signature').val();
			
			var quot = [];

			if (editProduct) {
				var rowNode = itemOptions.api.getRowNode(editProduct);
				rowNode.setData(item);
			} else {
				itemOptions.api.forEachNode(function(rowNode, index) {
					quot.push(rowNode.data);
				});
				quot.push(item)
				itemOptions.api.setRowData(quot);
		
			}
			closeNav();
			$("#dateOfIssue").val("");
			$("#shift").val("");
			$("#machine").val("");

			$("#rejected").val("");
			$("#quantity").val("");
			$("#remark").val("");
			$("#signature").val("");
			
			$("#editProduct").val(null);
		}

	}

		});

	function deleteItem1() {

		$('#deleteProduct').modal('show');
	}



	function cancelModalProductBtn() {
		$("#deleteModalBtn").removeAttr("disabled");
		$('#deleteProduct').modal('hide');
	}


	
	var id = "";
	var apstatus="";
	function rowSelect() {
		var selectedNodes = gridOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		var firstData = selectedData[0];
		 id= selectedData.map(node => node.incidentId);
		 apstatus=selectedData.map(node => node.apstatus);
		 var selectedRows = gridOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
			 
		});
		if (rowCount > 0) {
			$('#delete').attr("disabled", false);
			 $('#add').attr('disabled', true);
			
			if(firstData.apstatus == "Approved"){
				$("#delete").attr('disabled', true);
				$("#aprove").attr('disabled', true);
				
				
			}
			else{
				$("#delete").attr('disabled', false);
				$("#aprove").attr('disabled', false);
				
			}
			
			
		} else {
		
			$('#delete').attr("disabled", true);
			 $('#aprove').attr('disabled', true);
			 $('#add').attr('disabled', false);
		}

	}

	
	
	function rowSelectItem() {
		var selectedRows = itemOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			$('#delete1').attr("disabled", false);
			$('#newItem').attr("disabled", true);
		} else {
			$('#newItem').attr("disabled", false);
			$('#delete1').attr("disabled", true);
		}
	}


	

	function onQuickFilterChanged() {
		$(".ti-search srchicon").hide();
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	
</script>

<script>

function deleteProductOnclick() {
	var selectedRows = itemOptions.api.getSelectedRows();
	itemOptions.api.applyTransaction({
		remove : selectedRows

	});
	cancelModalProductBtn();

}




function approveIncident(){
$('#approveRequestModel').modal('show');
//$('#save').modal('hide');


}
function cancelApproveRequest() {
 $('#approveRequestModel').modal('hide');
} 

	
	
 function approveRequestOnclick() {
	
	var selectedRows = gridOptions.api.getSelectedRows();
	 var id=selectedRows[0].incidentId;
		$.ajax({
			type : "POST",
			url : "d-incidentregister-approve?id="+ id,
			success : function(response) {
			 if (response.code == "success") {
				 Cancel();
					$("#messageParagraph").text("Approved sucessfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					$('#delete').modal('hide');
					$('#approveRequestModel').modal('hide');
					agGrid.simpleHttpRequest({
						url : 'd-incidentregister-view'
					}).then(function(data) {
						var jsonData = JSON.parse(data.body[0]);
						var allData=jsonData.view;
						console.log(allData)
						var len = allData.length;
						$('#totalReq').find('span').html(len);
						gridOptions.api.setRowData(allData);
					});
					
				} else {
					$("#messageParagraph").text("Something went to wrong!");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			},
			error : function(data) {
				console.log(data)
			}
		       })
} 


function onQuickFilterChanged() {
	gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
var totalRowCount = gridOptions.api.getModel().getRowCount();
	
	$('#totalCandidate').find('span').html(gridOptions.api.getModel().getRowCount());
}
function cancelBar() {
	var id = document.getElementById("closeKey");
	id.style.display = "block";

	if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {

	}
}

	function incedientRegisterPdf(id) {

	}


</script>
