function masterSaveData() {
    activityOptions.api.stopEditing();
    activityOptionstwo.api.stopEditing();
    $(".formValidation").remove();
    var valid = true;
    var datas = [];
    var i = -1;
    var rowCount = activityOptions.api.getDisplayedRowCount();
    var rowCount2 = activityOptionstwo.api.getDisplayedRowCount();

    if (rowCount > 0 && rowCount2 > 0) {
        // Iterate over activityOptions
        activityOptions.api.forEachNode(function(rowNode, index) {
            var item = rowNode.data;
           // item.date = $("#date_" + index).val();

            if (item.issuedDate == null || item.issuedDate == "") {
                valid = validationUpdated("Issued Date Required", "issuedDate");
            }
            if (item.refNo == null || item.refNo == "") {
                valid = validationUpdated("Ref No. Required", "refNo");
            }
            if (item.issueNo == null || item.issueNo == "") {
                valid = validationUpdated("Issue No. Required", "issueNo");
            }

            item.type = "1st";
            item.horlicksId = $("#horlicksAnalysisdId").html(); // Ensure correct ID assignment
            item.issuedDate = $("#issuedDate").val(); // Ensure correct ID assignment
            item.refNo = $("#refNo").val(); // Ensure correct ID assignment
            item.issueNo = $("#issueNo").val(); // Ensure correct ID assignment
            item.productTypeField = $("#productTypeField").val(); // Ensure correct ID assignment

            if (valid) {
                datas.push(item);
            }
        });

        // Iterate over activityOptionstwo
        activityOptionstwo.api.forEachNode(function(rowNode, index) {
            var item = rowNode.data;
            item.date = $("#date_" + index).val(); // Adjust as needed based on your actual HTML structure

            if (item.issuedDate == null || item.issuedDate == "") {
                valid = validationUpdated("Issued Date Required", "issuedDate");
            }
            if (item.refNo == null || item.refNo == "") {
                valid = validationUpdated("Ref No. Required", "refNo");
            }
            if (item.issueNo == null || item.issueNo == "") {
                valid = validationUpdated("Issue No. Required", "issueNo");
            }

            item.type = "2nd";
            item.horlicksId = $("#horlicksAnalysisdId").html(); // Ensure correct ID assignment
            item.issuedDate = $("#issuedDate").val(); // Ensure correct ID assignment
            item.refNo = $("#refNo").val(); // Ensure correct ID assignment
            item.issueNo = $("#issueNo").val(); // Ensure correct ID assignment

            if (valid) {
                datas.push(item);
            }
        });

        if (valid) {
            saveMediaPmDetails(datas);
        }
    } else {
        $("#messageParagraph").text("Please Add Atleast One Details");
        $("#msgOkModal").removeClass("btn3");
        $("#msgOkModal").addClass("btn1");
        $("#msgModal").modal('show');
    }

    console.log("data1-----", datas);
}

function saveMediaPmDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "horlicks-analysis-record-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
		//	var itemName = $("#itemname option:selected").text();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				
				agGrid.simpleHttpRequest({
					url : "horlicks-analysis-record-view"
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					console.log("lllllllll",jsonData);
					var allData=jsonData.viewData;
					if(allData!=null){
						var len = allData.length;
						$('#totalRmPM').find('span').html(len);
						gridOptions.api.setRowData(allData);
					}else{
						$('#totalRmPM').find('span').html('0');
						gridOptions.api.setRowData('');
					}
					
				}); 
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Test Parameter For "+itemName+" Already Exist.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				$("#itemid").val('');
				$("#itemname").val('');
				$("#description").val('');
				activityOptions.api.setRowData();
				activityOptionstwo.api.setRowData();
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

		function editMedia(horlicksId,approveStatus) {

				$("#newchild").attr('disabled', false);
				$("#save").attr('disabled', false);
				 if(approveStatus=="Approved"){
			       	 $("#save").hide(); 
			        }else{
			       	 $("#save").show(); 
			        }
				 $("#productTypeField").val('');
			 $.ajax({
				type : "GET",
				url : "horlicks-analysis-record-edit?horlicksId="+ horlicksId,
				success : function(response) {
					if (response.code == "200") {
						var jsonData = JSON.parse(response.body);
						var allData=jsonData.editHorlicksdata;
						console.log("allData>>>",allData);
						var len = allData.length;
						$("#horlicksAnalysisdId").html(allData[0].horlicksId);
					    $("#horlicksId").val(allData[0].horlicksId);
						
						$("#refNo").val(allData[0].refNo);
						$("#issueNo").val(allData[0].issueNo);
						$("#issuedDate").val(allData[0].issuedDate);
						$("#productTypeField").val(allData[0].productTypeField);
						
						activityOptions.api.setRowData(allData[0].editHorlicksDetails);
						activityOptionstwo.api.setRowData(allData[0].editHorlicksDetailss);
					}
				},
				error : function(e) {
				}
			}); 

			
			
		}
	
	


	


//function for download
function downloadDetails() { 
	var dataset = [];
	gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
		dataset.push(rowNode.data);
	});
    gridOptions.api.exportDataAsCsv(dataset);
}

      
	function approveFun(){
		$('#approveRequestModel').modal('show');
	}
	function cancelApproveRequest() {
		 $('#approveRequestModel').modal('hide');
		} 
	function approveRequestOnclick() {
		
		var selectedRows = gridOptions.api.getSelectedRows();
		 var id=selectedRows[0].horlicksId;
		 console.log("vvv",id);
		$.ajax({
			type : "GET",
			url : "horlicks-analysis-record-approve?id=" + id,
			async : false,
			success : function(response) {

				if (true) {
					$('#approveRequestModel').modal('hide');
					$("#messageParagraph").text("Approved Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');


					agGrid.simpleHttpRequest({
						url : "horlicks-analysis-record-view"
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						console.log("lllllllll",jsonData);
						var allData=jsonData.viewData;
						if(allData!=null){
							var len = allData.length;
							$('#totalRmPM').find('span').html(len);
							gridOptions.api.setRowData(allData);
						}else{
							$('#totalRmPM').find('span').html('0');
							gridOptions.api.setRowData('');
						}
						
					});
					$('#reqDltBtn').attr("disabled", true);
					$('#assignBtn').attr("disabled", true);
					$('#newBtn').attr("disabled", false);
					
					
				}

			},
		});
	}
	
	function deleteFun(){
		var selectedRows = gridOptions.api.getSelectedRows();
				 var id=selectedRows[0].horlicksId;
				$.ajax({
					type : "GET",
					url : "horlicks-analysis-record-delete?id=" + id,
					async : false,
					success : function(response) {
                          console.log(response);
						if (response.code == "200") {
							
							$("#messageParagraph").text(
							"Data Deleted Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							
							agGrid.simpleHttpRequest({
								url : "horlicks-analysis-record-view"
							}).then(function(data) {
								var jsonData = JSON.parse(data.body);
								console.log("lllllllll",jsonData);
								var allData=jsonData.viewData;
								if(allData!=null){
									var len = allData.length;
									$('#totalRmPM').find('span').html(len);
									gridOptions.api.setRowData(allData);
								}else{
									$('#totalRmPM').find('span').html('0');
									gridOptions.api.setRowData('');
								}
								
							});
						
							$('#reqDltBtn').attr("disabled", true);
							$('#assignBtn').attr("disabled", true);
							$('#newBtn').attr("disabled", false);
							
							
						}

					},
					error : function(data) {
					}
				});
	}
