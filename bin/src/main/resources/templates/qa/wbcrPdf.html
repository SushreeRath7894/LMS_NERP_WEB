<body>
	<div class="container-fluid">
		<div class="row">
			<div class="maincontentsec">
				<div class="mainsec">
					<div class="bansec">
						<div class="leftsec">
							<img src="classpath:static/assets/images/oriclean_org_logo.png" />
						</div>
						<div class="rightsec">
							<h1 class="hdtxt" th:text="${wcr[0].organization}"> </h1>
							<p class="newtxt" th:text="${wcr[0].orgAddress}"></p>
							<p class="newtxt" th:text="${wcr[0].orgEmail}"></p>
							<p class="newtxt" th:text="${wcr[0].orgPhone}"></p>
						</div>
					</div>
					<div class="clear"></div>
					<div
						style="height: 10px; margin: 0px 10px; border-top: 1px solid grey; margin-top: 10px; position: relative;">
					</div>
					 <div class="secbody">
						<table class="formtable" style="background: #f5f6f7;">
							<tr align="center">
								<td><div class="titletext1">WEIGHING BALANCE CALIBRATION REGISTER</div></td>
							</tr>
						</table>
						 <div style="height: auto; margin-top: 10px;">
							<table class="formtable">
								<tr align="left">
									<td width="50%"><strong> ID : </strong><span
										th:text="${wcr[0].wbcrId}"></span></td>
									<td width="50%"><strong> DATE : </strong><span
										th:text="${wcr[0].date}"></span></td>
								</tr>
							</table>
						</div> 
						<div class="newsec">
							<div style="float: left;">
								<strong> DOMEX CASCADE-1  </strong>
							</div>
						</div>
						<div class="clear"></div>
					 	<div style="height: auto; margin-top: 10px;">
							<table class="formtable">
								<tr align="center" style="background: #B9D9EB;">
									<td width="10%" align="center"><strong>PACKING MACHINE DESCRIPTION </strong></td>
									<td width="10%" align="center"><strong>SKU </strong></td>
									<td width="10%" align="center"><strong>WEIGHING SCALE SERIAL NOS. </strong></td>
									<td width="10%" align="center"><strong>A' SHIFT </strong></td>
									<td width="10%" align="center"><strong>B' SHIFT </strong></td>
									<td width="10%" align="center"><strong>C' SHIFT </strong></td>
									<td width="10%" align="center"><strong>REMARKS </strong></td>
									
								</tr>

							      <tr align="center" th:each="item, status : ${wcr}"  th:style="${status.index == 0} ? 'background-color: #f5f6f7' : ''"
									th:if="${item.type == 'domex'}">
									<td width="10%" th:text="${item.itemDesc}" align="center"></td>
									<td width="10%" th:text="${item.sku}" align="center"></td>
									<td width="10%" th:text="${item.wsSlNo}" align="center"></td>
									<td width="10%" th:text="${item.shiftA}" align="center"></td>
									<td width="10%" th:text="${item.shiftB}" align="center"></td>
									<td width="10%" th:text="${item.shiftC}" align="center"></td>
									<td width="10%" th:text="${item.remarks}" align="center"></td>
								</tr> 
							</table>
						</div> 
						
						<div class="newsec">
							<div style="float: left;">
								<strong> WHEEL CASCADE-2   </strong>
							</div>
						</div>
						<div class="clear"></div>
						<div style="height: auto; margin-top: 10px;">
							<table class="formtable">
								<tr align="center" style="background: #B9D9EB;">
								</tr>
							      <tr align="center" th:each="item, status : ${wcr}"  th:style="${status.index == 0} ? 'background-color: #f5f6f7' : ''"
									th:if="${item.type == 'wheel'}">
									<td width="10%" th:text="${item.itemDesc}" align="center"></td>
									<td width="10%" th:text="${item.sku}" align="center"></td>
									<td width="10%" th:text="${item.wsSlNo}" align="center"></td>
									<td width="10%" th:text="${item.shiftA}" align="center"></td>
									<td  width="10%" th:text="${item.shiftB}" align="center"></td>
									<td width="10%" th:text="${item.shiftC}" align="center"></td>
									<td width="10%" th:text="${item.remarks}" align="center"></td>
								</tr> 
							</table>
						</div> 
						<div class="newsec">
							<div style="float: left;">
								<strong>SFXL EW CASCADE-3↓  </strong>
							</div>
						</div>
							<div class="clear"></div>
						<div style="height: auto; margin-top: 10px;">
							<table class="formtable">
								<tr align="center" style="background: #B9D9EB;">
								</tr>
							      <tr align="center" th:each="item, status : ${wcr}"  th:style="${status.index == 0} ? 'background-color: #f5f6f7' : ''"
									th:if="${item.type == 'sfxl'}">
									<td width="10%" th:text="${item.itemDesc}" align="center"></td>
									<td width="10%" th:text="${item.sku}" align="center"></td>
									<td width="10%" th:text="${item.wsSlNo}" align="center"></td>
									<td width="10%" th:text="${item.shiftA}" align="center"></td>
									<td  width="10%" th:text="${item.shiftB}" align="center"></td>
									<td width="10%" th:text="${item.shiftC}" align="center"></td>
									<td width="10%" th:text="${item.remarks}" align="center"></td>
								</tr> 
							</table>
						</div> 
						<div class="newsec">
							<div style="float: left;">
								<strong>OTHERS↓</strong>
							</div>
						</div>
						<div class="clear"></div>
						<div style="height: auto; margin-top: 10px;">
							<table class="formtable">
								<tr align="center" style="background: #B9D9EB;">
								</tr>
							      <tr align="center" th:each="item, status : ${wcr}"  th:style="${status.index == 0} ? 'background-color: #f5f6f7' : ''"
									th:if="${item.type == 'other'}">
									<td width="10%" th:text="${item.itemDesc}" align="center"></td>
									<td width="10%" th:text="${item.sku}" align="center"></td>
									<td width="10%" th:text="${item.wsSlNo}" align="center"></td>
									<td width="10%" th:text="${item.shiftA}" align="center"></td>
									<td  width="10%" th:text="${item.shiftB}" align="center"></td>
									<td width="10%" th:text="${item.shiftC}" align="center"></td>
									<td width="10%" th:text="${item.remarks}" align="center"></td>
								</tr> 
							</table>
						</div> 
					</div> 
				</div>
			</div>
		</div>
	</div>

</body>
