<script type="text/javascript">

	$(document).ready(function() {
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		gridOptions.api.setRowData();
		agGrid.simpleHttpRequest({
			url : 'crqs-check-details-view'
		}).then(function(data) {
			var jsonData = JSON.parse(data.body[0]);
			var allData=jsonData.view;
			console.log(allData)
			var len = allData.length;
			$('#totalReq').find('span').html(len);
			gridOptions.api.setRowData(allData);
		});
		var gridDiv = document.querySelector('#activity');
		new agGrid.Grid(gridDiv, activityOptions);
		var gridDiv1 = document.querySelector('#activity1');
		new agGrid.Grid(gridDiv1, activityOptions1);
		var gridDiv2 = document.querySelector('#activity2');
		new agGrid.Grid(gridDiv2, activityOptions2);
		var gridDiv3 = document.querySelector('#activity3');
		new agGrid.Grid(gridDiv3, activityOptions3);
		var gridDiv4 = document.querySelector('#activity4');
		new agGrid.Grid(gridDiv4, activityOptions4);

		$('#myModal10').modal('hide');
		$('#reqDltBtn').attr('disabled', true);
		$('#inspectBtn').attr('disabled', true);
		$('#assignBtn').attr('disabled', true);
		$('#deleteChild').attr('disabled', true);
		$('.collapse').on('show.bs.collapse', function() {
			$(this).siblings('.panel-heading').addClass('active');
		});

		$('.collapse').on('hide.bs.collapse', function() {
			$(this).siblings('.panel-heading').removeClass('active');
		});
		$("#newBtn").click(function() {

		})
		
		
		var dateFormat = localStorage.getItem("dateFormat");
		$("#DateCalendar3").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#pdate').val($(this).val());
		})

		$('#pdate').blur(function() {
			$("#DateCalendar3").val($(this).val());
		})
		
		
		var dateFormat = localStorage.getItem("dateFormat");
		$("#DateCalendar2").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#edate').val($(this).val());
		})

		$('#edate').blur(function() {
			$("#DateCalendar2").val($(this).val());
		})

		


	});

	},
	onSelectionChanged : onSelectionChanged,

//function for row select parents
var id = "";
var apstatus="";
function onSelectionChanged() {
	var selectedNodes = gridOptions.api.getSelectedNodes();
	 var selectedData = selectedNodes.map(node => node.data);
	 id= selectedData.map(node => node.crqsCheckId);
	 apstatus=selectedData.map(node => node.approvestatus);
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});
	if (rowCount > 0) {
		$('#inspectBtn').attr("disabled", false);
		if(apstatus==1){
			$('#reqDltBtn').attr("disabled", true);
			$('#assignBtn').attr("disabled", true);
			$('#newBtn').attr('disabled', false);
		}else{
		$('#newBtn').attr('disabled', true);
		$('#reqDltBtn').attr("disabled", false);
		$('#assignBtn').attr("disabled", false);
		}
	}else {
		$('#inspectBtn').attr("disabled", true);
		$('#reqDltBtn').attr("disabled", true);
		$('#assignBtn').attr("disabled", true);
		$('#newBtn').attr('disabled', false);
	}
}

	function handleTextFieldKeyDown(event) {

		let currentCell = '';
		const idChar = {};
		if (event.code === 'Tab') {
			const currentInput = event.target;
			let currentId = currentInput.id;
            var regexResult = currentId.match(/^([a-zA-Z]+)(\d+)$/);
            if (regexResult) {
                var color = regexResult[1];
                var numberPart = regexResult[2];
                var firstDigit = numberPart[0];
                var numericPart = numberPart.slice(1);
            }
			if (numericPart < 27) {
				const nextInput = parseInt(numericPart) + 1;
				let nextInputId = color+firstDigit+nextInput;
				let nextInputCell = document.getElementById(`${nextInputId}`);
				if (nextInputCell) {
					nextInputCell.focus();
					event.preventDefault(); // Prevent the default Tab behavior
				}
			}
		}
	}
