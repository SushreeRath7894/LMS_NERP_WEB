	function view(request_id){
		
		agGrid.simpleHttpRequest({
			url : "qa-request-view"
		}).then(function(data) {
			$(".loader").hide();
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.viewQaRequest;
			
			//gridOptions.api.setRowData(allData);
			

			
			if (allData && allData.length > 0) {
				gridOptions.api.setRowData(allData);
				if(request_id){
					
					const rowNode = gridOptions.api.getRowNode(request_id);
	        		if (rowNode) {
	        				const rowIndex = rowNode.rowIndex; // Get the row index
	        				const pageSize = gridOptions.api.paginationGetPageSize(); // Get the number of rows per page
	        
	      				  const pageNumber = Math.floor(rowIndex / pageSize); // Calculate page number
	        
	      						gridOptions.api.paginationGoToPage(pageNumber); // Switch to the calculated page
	      						gridOptions.api.getDisplayedRowAtIndex(rowIndex).setSelected(true); // Select row at index
	  					  }
					
				}else{
					let rowId = allData[0].request_id;
					gridOptions.api.getRowNode(rowId).setSelected(true);
				}
				
			
			}else{
				$('#entry').text(null);
				$('#entryIdClass').text(null);
				$('#modalSku').val(null);
				$('#modalItemName').val(null);
				$('#modalSampleAmt').val(null);

				$('#sampleAmtNextBtn').hide();
				$('#approveTestBtn').hide();
				$('#itemDetailsLiId').hide();
				$('#qrCodeDetails').hide();
			}
			
			
		});
	}

	function addSampleRequst() {
		agGrid.simpleHttpRequest({
			url : 'qa-request-status-change?id=' + id + '&sku=' + sku + '&itemName=' + itemName + '&totalAmt=' + totalAmt + '&sampleAmt=' + sampleAmt + '&testStatus=' + testStatus
		}).then(function(response){
			if (response.code == "success") {
				$('#assign').attr('disabled', true);
				toastr.success("Result Approved Successfully");
				
				$(".loader").hide();
				view(id);
				
			} else {
				toastr.error(response.message);
				
			}
		});
		
		


	}

function submitReq(datas) {
		console.log(datas);
		//$('.loader').show();
		//$("body").addClass("overlay");
		 $.ajax({
			type : "POST",
			url : "awaiting-qarequest-add-request",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(datas),
			success : function(response) {
				$('.loader').hide();
				if (response.code == "success") {
					cancel();
					$("#messageParagraph").text(response.message);
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					closeNav()
				} else {
					$('.loader').hide();
					$("#messageParagraph").text(response.message);
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			},
			error : function(data) {
				$('.loader').hide();
			}
		}) 
}

	function escapeString(str) {
		return str

			.replace(/\r/g, '\\r');

	function qrDownload(url, fileName){
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.responseType = "blob";
    xhr.onload = function(){
        var urlCreator = window.URL || window.webkitURL;
        var imageUrl = urlCreator.createObjectURL(this.response);
        var tag = document.createElement('a');
        tag.href = imageUrl;
        tag.download = fileName;
        document.body.appendChild(tag);
        tag.click();
        document.body.removeChild(tag);
    }
    xhr.send();
}
