<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>

  <style type="text/css">
    @page {  padding: 10px;  margin: 0; size: a4 landscape; /* Landscape orientation */ }
    body { margin: 0; font-family: 'Poppins', sans-serif; font-size: 12px; color: #000000; }
    html, body { margin: 0 auto; }
    img { border: none; outline: none; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 0; border: none !important; white-space: nowrap; }

    .ban-sec { position: relative; width: 100%; clear: both; display: block; text-align: center; }
    .clear { clear: both; }

    .right-sec { float: right; position: absolute; top: 0; right: 0; border: 1px solid #000000; padding: 5px; }
    .ref-table td { text-align: left; font-weight: 700; font-size: 14px; white-space: nowrap; }

    .logo-ori-food { }
    .logo-ori-food img { height: 40px; width: 120px; float: left; }

    .logo-ori-titles { display: inline-block; margin-right: 15%; margin-bottom: 1%; }
    .logo-ori-titles h2 { margin: 0; }
    .logo-ori-titles p { font-size: 18px; text-align: center; margin: 0; }
    .logo-ori-titles p span { text-decoration: underline; color: #000000; font-family: "Times New Roman"; font-weight: 700; }

    .table-first table { border: 1px solid #000000 !important; }
    .table-first table td { border-bottom: 1px solid #000000 !important; padding: 4px; font-weight: 700; }
    .border-rt { border-right: 1px solid #000000 !important; }

    .table-crqs { margin-top: 5px; }
    .table-crqs table td { border: 1px solid #000000 !important; padding-left: 5px; text-align: center; font-weight: 700; }
    .heading-crqs div { font-size: 18px; text-align: center; font-weight: 700; background-color: #a9a9a9; width: 100%; }
    .heading-crqs.secondary-title div { font-size: 14px; text-align: center; font-weight: 700; background-color: #a9a9a9; width: 100%; }
    .crqs-checklist td { border: 1px solid #000000 !important; text-align: center; font-size: 14px; font-weight: 700; }
    .crqs-checklist .title { text-align: center; font-size: 16px; font-weight: 700; padding-left: 5px; }
    .page-foot { clear: both; padding-left: 5px; padding-top: 5px; font-weight: 700; font-size: 14px; }
    .remarks { text-align: left !important; font-style: italic; height: 50px; vertical-align: top; }
    .footer-notes table td { border: none !important; height: 25px; vertical-align: bottom; font-style: italic; }
    .value-table td { height: 30px; }
    .series-table td { width: 30px; }
    .left-align, .table-lefts td:first-child { text-align: left !important; }
  </style>
</head>
