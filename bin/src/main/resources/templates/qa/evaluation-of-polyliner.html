function cellEditorSelector(params) {
	const paramt2 = params.data.parmId;
	if(paramt2 === '5'){
		return {
            component: 'agSelectCellEditor',
            params: { values: ['','Defects Observed', 'NIL'] }
        };
	}else if(paramt2 === '6'){
		return {
            component: 'agSelectCellEditor',
            params: { values: ['','Yes', 'No'] }
        };
	
	}else{
		return {
            component: 'agTextCellEditor',
        };
	}
	}

function onSelectionChanged() {

	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});
	if (rowCount > 0) {
		if(apstatus=='Approved'){
			$('#reqDltBtn').attr("disabled", true);
			$('#assignBtn').attr("disabled", true);
			$('#newBtn').attr('disabled', false);

		$('#inspectBtn').attr("disabled", true);

		$('#newBtn').attr('disabled', false);
	}
}

function savePlanDetails(item) {
	$(".loader").show();
	setTimeout(function() {
		$.ajax({
			type : "POST",
			url : "evaluation-of-polyliner-add",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(item),
			success : function(response) {
				$(".loader").hide();
				 $("#totalReq").show();
				 $("#searchRowDiv").show();
				 $("#ttbtn").show();
				 
				 $("#messageParagraph").text(response.message);
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				
				 
				 $("#demo").hide();
				 $("#myGrid").show();
				 
				 view();
				 
				 //inputnull();
				
			},
			error : function(data) {
				$('.loader').hide();
			}
		});
	}, 1000)
	

}

    gridOptions.api.exportDataAsCsv(dataset);
}

function selectSku(){
	var id = $("#product").val();
	$("#sku").val(id);
}

function approveFun() {
	$('#approveModal').modal('show');
}


function approveOnclick() {
	
	var selectedRows = gridOptions.api.getSelectedRows();	
	
	var id = selectedRows[0].evalId;
	
	
	$.ajax({
	type : "GET",
	url : "evaluation-of-polyliner-approve?id="+ id,
	success : function(response) {
		console.log(response);
	  if (response.code == "success") {
			$("#messageParagraph").text("Data Approved sucessfully");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
			//$('#approveModal').modal('hide');
			var rowNode = gridOptions.api.getRowNode(id);
					 rowNode.setDataValue('aprvSts', 'Approved');
					 gridOptions.api.refreshCells({ rowNodes: [rowNode], force: true });
			 $('#approveModal').modal('hide');
			 $("#reqDltBtn").attr('disabled', true);
			 $("#assignBtn").attr('disabled', true);
			 $("#newBtn").attr('disabled',false);
		} else {
			$("#messageParagraph").text("Something went to wrong!");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
		} 
	},
	error : function(data) {
		
	}
})

}

function reportDownload(id) {
	window.open("/qa/evaluation-of-polyliner-pdf-downloads?id="+window.btoa(id), '_blank');  
} 

function saveFile() {

	var uFile = $(uploadWarDoc_0)[0].files[0];
	var fileName = event.currentTarget.value;
	var lastIndex = fileName.lastIndexOf("\\");
	if (lastIndex >= 0) {
		fileName = fileName.substring(lastIndex + 1);
	}
	var extension = fileName.split(".");
	var iURL = URL.createObjectURL(uFile);
	$("#uploadedWarrDiv_0").html("");

	if (extension[1] == "jpg" || extension[1] == "png"
			|| extension[1] == "jpeg") {
		var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-picture-o' style='color: blue'></i></a></div>";
	} else if (extension[1] == "pdf") {
		var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-file-pdf-o' style='color: red'></i></a></div>";
	} else {
		var LightImg = "<div class='uploadicon position-l'> </div>";
	}

	$("#uploadedWarrDiv_0").html(LightImg);
	$("#imageWarrName_0").html(fileName);
	$("#dltImage_0")
			.html(
					"<button onclick='clearImg()' style='border: none; background: none;'><i class='fa fa-times' style='color: red; margin-left: 5px;'></i></button>");
	var fileData = new FormData();
	fileData.append('file', uFile);
	fileData.append('path', 'none');

}
function clearImg() {
	$("#uploadWarDoc_0").val("");
	$("#uploadedWarrDiv_0").html("");
	$("#imageWarrName_0").html("");
	$("#dltImage_0").html("");
}

    </script>
