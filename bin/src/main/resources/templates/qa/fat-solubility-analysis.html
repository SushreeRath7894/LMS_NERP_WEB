	function deleteOnclick() {
		
		var selectedRows = gridOptions.api.getSelectedRows();
		var id = selectedRows[0].fatSolAnalysisId;
		if (id) {
		
				$.ajax({
					type : "POST",
					url : "fat-solubility-analysis-delete?id="+ id,
					success : function(response) {
					 if (response.message == "Success") {
						cancel();
						$("#messageParagraph").text("Report Deleted Sucessfully");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$('#delete').modal('hide');
					} else {
						$("#messageParagraph").text("Something went to wrong!");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
					}
				},
				error : function(data) {
					console.log(data)
				}
			})
		} else {
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
		}

	}

	function deleteDetailsOnclick() {
		
		var grid = $("#deleteChildGrid").val();
		$('.modal').hide();
		
		if(grid == "details"){
			var selectedRows = activityOptions.api.getSelectedRows();
			activityOptions.api.applyTransaction({
				remove : selectedRows
			});
		}else if(grid == "sample"){
			var selectedRows1 = activityOptions1.api.getSelectedRows();
			activityOptions1.api.applyTransaction({
				remove : selectedRows1
			});
		}else if (grid == "composite"){
			var selectedRows2 = activityOptions2.api.getSelectedRows();
			activityOptions2.api.applyTransaction({
				remove : selectedRows2
			});
		}
		
		//$('#newchild').show();
		//$('#deletechild').hide;
		cancelModalProductBtn();
		$("#deleteChildGrid").val("");
		
	}

	 function changeDateFormat(inputDate) { // expects Y-m-d
			var splitDate = inputDate.split('-');
			if (splitDate.count == 0) {
				return null;
			}
			var year = splitDate[0];
			var month = splitDate[1];
			var day = splitDate[2];

			return day + '-' + month + '-' + year;
		}
	 
	
	 


 function calculateGW(val){
	 
	var tareWt;
	var netWt;
	if(val == "1"){
		tareWt = $("#tWtCFlsk1").val();
		netWt = $("#netWeightG1").val();
	}else if(val == "2"){
		tareWt = $("#tWtCFlsk2").val();
		netWt = $("#netWeightG2").val();
	}else if(val == "3"){
		tareWt = $("#tWtCFlsk3").val();
		netWt = $("#netWeightG3").val();
	}else if(val == "4"){
		tareWt = $("#tWtCFlsk4").val();
		netWt = $("#netWeightG4").val();
	}
	
	var res = (parseFloat(tareWt) + parseFloat(netWt));
	
	if (isNaN(res) || !isFinite(res) || res == '') {
		res = '0';
	} else {
		res = res;
	}
	
	if(val == "1"){
		$("#gWtCFlsk1").val(res);
	}else if(val == "2"){
		$("#gWtCFlsk2").val(res);
	}else if(val == "3"){
		$("#gWtCFlsk3").val(res);
	}else if(val == "4"){
		$("#gWtCFlsk4").val(res);
	}
	calculation(val);
 }
 
 function calculation(val){
	 var tareWt;
	 var netWt;
	 var grossWt;
	 
	 if(val == "1"){
			tareWt = $("#tWtCFlsk1").val();
			netWt = $("#netWeightG1").val();
			grossWt = $("#gWtCFlskOven1").val();
		}else if(val == "2"){
			tareWt = $("#tWtCFlsk2").val();
			netWt = $("#netWeightG2").val();
			grossWt = $("#gWtCFlskOven2").val();
		}else if(val == "3"){
			tareWt = $("#tWtCFlsk3").val();
			netWt = $("#netWeightG3").val();
			grossWt = $("#gWtCFlskOven3").val();
		}else if(val == "4"){
			tareWt = $("#tWtCFlsk4").val();
			netWt = $("#netWeightG4").val();
			grossWt = $("#gWtCFlskOven4").val();
		}
	 
	 var res = (((parseFloat(grossWt) - parseFloat(tareWt))/parseFloat(netWt))*100);
		
		if (isNaN(res) || !isFinite(res) || res == '') {
			res = '0';
		} else {
			res = res;
		}
		
	if(val == "1"){
		$("#fatSlAIA1").val(res);
	}else if(val == "2"){
		$("#fatSlAIA2").val(res);
	}else if(val == "3"){
		$("#fatSlAIA3").val(res);
	}else if(val == "4"){
		$("#fatSlAIA4").val(res);
	}
 }
