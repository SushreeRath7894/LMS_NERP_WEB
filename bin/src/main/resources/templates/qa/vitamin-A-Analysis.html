function mergeData(data1, data2) {
    return data1.map((item1, index) => {
        var matchingItem = data2[index];
        return { ...item1, ...matchingItem };
    });

function calculation(){
	var sampleWt = $("#weightofSample").val();
	var a = $('#aid').val();
	var b = $('#bid').val();
	var c = $('#cid').val();
	var d = $('#did').val();
	if(sampleWt == "" || sampleWt == null){
		sampleWt = '0';
	}if(a == "" || a == null){
		a = '0';
	}if(b == "" || b == null){
		b = '0';
	}if(c == "" || c == null){
		c = '0';
	}if(d == "" || d == null){
		d = '0';
	}
	var res = parseFloat(((parseFloat(c)-parseFloat(d))*1830*1.793*10*0.3)/(sampleWt)).toFixed(5);
	var calc = "("+ c +"-"+d+")*1830*1.793*10*0.3/"+sampleWt;
	console.log("res",res);
	console.log("calc",calc);
	if (isNaN(res) || !isFinite(res) || res == '') {
		res = '0';
	} else {
		res = res;
	}
	$("#resultsMg").val(res);
	$("#calculation").val(calc);
}
