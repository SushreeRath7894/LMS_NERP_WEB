	function onSelectionChanged() {
		var selectedRows = gridOptions.api.getSelectedRows();
		 var selectedNodes = gridOptions.api.getSelectedNodes();

		var rowCount = 0;
		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});

		if (rowCount > 0) {
			$('#reqDltBtn').attr("disabled", false);
			
			 if (selectedData.map(node => node.approveStatus)!="Pending"){
				
		        	$('#assignBtn').attr('disabled', true);
					$('#reqDltBtn').attr("disabled", true);
					$('#newBtn').attr("disabled", false);

					$('#reqDltBtn').attr("disabled", false);
					$('#newBtn').attr("disabled", true);
		        }
			
			
		} else {
		
			$('#reqDltBtn').attr("disabled", true);
			 $('#assignBtn').attr('disabled', true);
			 $('#newBtn').attr("disabled", false);
			
		}

	}

//master save data
function masterSaveData(){
	activityOptions.api.stopEditing();
		$(".formValidation").remove();
		var valid= true;
		var datas = [];
		var i=-1;
		var rowCount = activityOptions.api.getDisplayedRowCount();
		
		if(rowCount > 0){
			
			
			activityOptions.api.forEachNode(function(rowNode, index) {
				var item = rowNode.data;
				item.date=$("#date_"+index).val();
				
				/* if (item.issuedDate == null || item.issuedDate == "") {
					valid = validationUpdated("Issued Date Required", "issuedDate");
				 } */
				/* if (item.refNo == null || item.refNo == "") {
					valid = validationUpdated("Ref No. Required", "refNo");
				 } */
				/* if (item.issueNo == null || item.issueNo == "") {
					valid = validationUpdated("Issue No. Required", "issueNo");
				 } */
				
				     item.type = "1st";   
				     item.phId = $("#phMeterCalibrationId").html();
				     item.phId = $("#phId").val();
				     item.issuedDate = $("#issuedDate").val();
				     item.refNo = $("#refNo").val();
				     item.issueNo = $("#issueNo").val();
				     //item.frequency = $("#frequency").val();
				    // item.tolerance = $("#tolerance  ").val();
				     item.remarks = $("#remarks").val();
				     item.verifiedBy = $("#verifiedBy").val();
				     item.productTypeField = $("#productTypeField").val();
				     
				
		        if(valid){
		        	datas.push(item);
		        	
		         }
			});
		
			
		
		if (valid) {
			savePhDetails(datas);
			
			}
		} else {
			$("#messageParagraph").text(
			"Please Add Atleast One Details");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
		}
		console.log("data1-----",datas);
	
}

function savePhDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "ph-meter-record-addph",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
		//	var itemName = $("#itemname option:selected").text();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				
				agGrid.simpleHttpRequest({
					url : "ph-meter-records-view"
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					console.log("lllllllll",jsonData);
					var allData=jsonData.viewPh;
					if(allData!=null){
						var len = allData.length;
						$('#totalPhMeter').find('span').html(len);
						gridOptions.api.setRowData(allData);
					}else{
						$('#totalPhMeter').find('span').html('0');
						gridOptions.api.setRowData('');
					}
					
				}); 
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Test Parameter For "+itemName+" Already Exist.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				$("#itemid").val('');
				$("#itemname").val('');
				$("#description").val('');
				activityOptions.api.setRowData();
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}
