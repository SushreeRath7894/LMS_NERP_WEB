	/* //quotation item  table add */

	function saveTableData() {
		var editProduct = $("#editProduct").val();
		var item = {};
		var data = 1;
		var validation = true;
		
		 if (!validationUpdated("Select Product", 'product'))
			 validation = false;  
		
	if (validation) {
		item.slNo = data;
			itemOptions.api.forEachNode(function(rowNode, index) {
				if (!editProduct) {
					data = data + 1;
					item.slNo = data;
				}
				else{
					item.slNo = editProduct;
				}
				
			});
		
			item.rId = $('#rId').val();
			item.bId = $('#bId').val();
			item.product = $('#product').val();
			item.productName = $("#product option:selected").text();
			item.batchNo = $('#batchNo').val();
			item.weightofSample = $('#weightofSample').val();
			item.constantReading = $('#constantReading').val();
			item.calculation = $('#calculation').val();
			item.resulsMg = $('#resulsMg').val();
	
			var quot = [];

			if (editProduct) {
				var rowNode = itemOptions.api.getRowNode(editProduct);
				rowNode.setData(item);
			} else {
				itemOptions.api.forEachNode(function(rowNode, index) {
					quot.push(rowNode.data);
				});
				quot.push(item)
				itemOptions.api.setRowData(quot);
		
			}
			closeNav();
			$("#rId ").val('');
			$("#bId ").val('');
			$("#batchNo").val('');
			$("#weightofSample ").val('');
			$("#product").val('');
			$("#constantReading").val('');
			$("#calculation ").val('');
			$("#resulsMg").val('');
			
			$("#editProduct").val(null);
		}

	}

	function save() {
		if (validProductData() && validFormData()) {
			var datas = [];
			
			setTimeout(function() {
			   if (itemOptions.api.getDisplayedRowCount() > 0 ) {

					itemOptions.api.forEachNode(function(rowNode, indrx) {
						var obj = rowNode.data;
						obj.vb1arId = $("#vb1arRecordId").html();
						obj.vb1arId = $("#vb1arId").val();
						obj.resultStatus = $("#resultStatus").val();
						obj.nameSign = $("#nameSign").val();
						obj.verifiedBy = $("#verifiedBy").val();
						obj.refNo = $("#refNo").val();
						obj.issueNo = $("#issueNo").val();
						obj.date = $("#date").val();
						obj.dateOfIssue = $("#dateOfIssue").val();
						obj.productTypeField = $("#productTypeField").val();
						console.log('Object',obj)
						datas.push(obj);
						
					});
					saveVb2ar(datas);
				}else{
					$("#messageParagraph").text(
					"Please Add Items Details");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			}, 1000)
		
		}
	}

function totalProductCSV() {
	var dataset = [];
	gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
		dataset.push(rowNode.data);
	});
	gridOptions.api.exportDataAsCsv(dataset);
}

function calculation(){
	var sampleWt = $("#weightofSample").val();
	var constReading = $("#constantReading").val();
	var r = $("#rId").val();
	var b = $("#bId").val();
	
	if(sampleWt == "" || sampleWt == null){
		sampleWt = '0';
	}if(constReading == "" || constReading == null){
		constReading = '0';
	}if(r == "" || r == null){
		r = '0';
	}if(b == "" || b == null){
		b = '0';
	}
	
	var res = ((parseFloat(r)-parseFloat(b))*250*100*31.25)/(1000*25*parseFloat(constReading)*parseFloat(sampleWt));
	var calc = r +"-"+b+"*100*250*31.25/1000*25*"+constReading+"*"+sampleWt;
	console.log("res",res);
	console.log("calc",calc);
	if (isNaN(res) || !isFinite(res) || res == '') {
		res = '0';
	} else {
		res = res;
	}
	$("#resulsMg").val(res);
	$("#calculation").val(calc);
}
