<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/vms/tender-management.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script type="text/javascript"
	src="../javaScript/contract/contract-negotiation.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
	defer></script>


</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="row">

								<!--Left Sec Start-->
								<div class="col-md-6 pd-r tab-transition position-relative">
									<div class="out-box">
										<div class="row d-flex  mb-20">

											<div class="col-md-10">
												<form class="d-flex search-sec flxwrap">
													<input class="form-control me-2 search_input_bar"
														placeholder="Search.." type="text" name="search"
														id="quickFilter" autocomplete="off">
													<button class="btn btn-primary go-btn"
														onclick="onQuickFilterChanged()" id="SearchBtn"
														type="button">Go</button>
													<button class="btn go-btn w-auto mx-2" type="button"
														onclick="resetBtn()">Reset</button>
												</form>
											</div>

											<div class="col-md-2 d-flex justify-content-end">
												<div class="btn btn-primary max-btn">
													<i class="fas fa-arrows-alt"></i>
												</div>
											</div>

										</div>


										<div class="leftSideParentContainer">
											<div id="contractNegotation" class="ag-theme-alpine"
												style="height: 550px; width: 100%;"></div>
										</div>

										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
										<input type="hidden" id="docUniqueId" />
									</div>

								</div>

								<!--Right Sec Start-->
								<div class="col-md-6 pd-l tab-transition">
									<div class="out-box" id="rightSideDiv">
										<div class="btn btn-primary max-btn">
											<i class="fas fa-arrows-alt"></i>
										</div>

										<!-- Right Inner Tab Start -->
										<ul class="nav nav-pills newtab mb-20 tablistUl navbarSticky"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" href="#manageControl" role="tab">
													Contract Negotiation </a></li>
											<li class="nav-item wd-11"><a class="nav-link"
												data-bs-toggle="pill" href="#chatDetails" role="tab">
													Chat Details </a></li>
										</ul>

										<!-- Tab panes -->
										<div class="tab-content">
											<div id="snackbar" class="snackbar"></div>

											<!-- Contract Negotiation Tab -->
											<div id="manageControl" class="tab-pane fade show active"
												role="tabpanel">
												<div class="requisition-tbl">
													<div class="mb-2 operationBtnSticky">
														<table class="table table-bordered mb-0" width="100%">
															<tr valign="middle" class="operation-row">
																<td>
																	<div
																		class="d-flex justify-content-between align-items-center">
																		<div class="contract-info">
																			Contract Id:&nbsp;&nbsp;<span id="headercontractid"></span>
																		</div>
																		<div
																			class="features-btn d-flex justify-content-between align-items-center">
																			<div class="mr-2">
																				<button class="btn btn-primary edit-btn"
																					onclick="saveContract()" type="button">
																					Save</button>
																			</div>
																			<div class="mr-2">
																				<button class="btn btn-primary edit-btn"
																					onclick="nextBtnFunction('chatDetails'); details()"
																					type="button">Next</button>
																			</div>
																</div>
																	</div>
																</td>
															</tr>
														</table>
													</div>
												</div>

												<div id="infoDiv">
													<h5 id="reviewModalLabel">Contract details will be
														shown here.</h5>

													<!-- Selected Vendors -->
													<div class="col-lg-12">
														<div class="form-group">
															<label>Selected Vendors</label> <input type="text"
																id="selectedVendors" class="form-control" readonly>
														</div>
													</div>

													<!-- Vendor Selection -->
													<div class="col-lg-5">
														<div class="form-group">
															<label for="vendor">Vendor</label> <select
																class="form-control" id="vendor" name="vendor"
																onchange="vendorList()">
																<option value="">Select Vendor</option>
																<option value="ven0001">Vendor 1</option>
																<option value="ven0002">Vendor 2</option>
																<option value="ven0003">Vendor 3</option>
																<option value="ven0004">Vendor 4</option>
															</select>
														</div>
													</div>

													<!-- Description -->
													<div class="col-lg-12">
														<div class="form-group">
															<label>Description</label>
															<textarea class="ckeditor" id="tenderEditor"></textarea>
														</div>
													</div>
												</div>
											</div>

											<!-- Chat Details Tab -->
											<div id="chatDetails" class="tab-pane fade" role="tabpanel">
												<div class="requisition-tbl">
													<div class="mb-2 operationBtnSticky">
														<table class="table table-bordered mb-0" width="100%">
															<tr valign="middle" class="operation-row">
																<td>
																	<div
																		class="d-flex justify-content-between align-items-center">
																		<div class="contract-info">
																			Contract Id:&nbsp;&nbsp;<span id="headercontractid2"></span>
																		</div>
																		<div
																			class="features-btn d-flex justify-content-between align-items-center">
																			<div class="mr-2">
																				<button class="btn btn-primary edit-btn"
																					onclick="saveContract()" type="button">
																					Save</button>
																			</div>
																			<div class="mr-2">
																				<button class="btn btn-primary edit-btn"
																					onclick="nextBtnFunction('manageControl')"
																					type="button">Previous</button>
																			</div>
																		</div>
																	</div>
																</td>
															</tr>
														</table>
													</div>
												</div>

												<div class="chatdetails-content">
													<div class="review-header"></div>
													<div class="chatdetails-body mb-scroll">
														<h3 class="chatdetails-title" id="reviewModalLabel"
															style="margin-bottom: 25px;">
															Chat details for <span id="contractName"></span>
														</h3>

														<div class="row">
															<!-- Vendor Tabs Section Start -->
															<div class="col-12">
																<ul class="nav nav-tabs" id="vendorTabs" role="tablist">
																	<!-- Vendor tabs will be dynamically inserted here -->
																</ul>
															</div>
															<!-- Chat Box Section Start -->
															<div class="col-12">
																<div id="chatBox"
																	style="height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 15px; background-color: #f9f9f9;">
																	<!-- Messages will be dynamically inserted here based on selected vendor -->
																</div>
															</div>
															<!-- Input Section -->
															<div class="col-12 mt-3">
																<div class="input-group">
																	<input type="text" id="chatInput" class="form-control"
																		placeholder="Type your message here...">
																	<button class="btn btn-primary" id="sendMessageButton"
																		type="button">Send</button>
																</div>
															</div>
															<!-- Chat Box Section End -->
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

					</div>

				</div>
			</div>

		</div>
	</div>
</body>
</html>
