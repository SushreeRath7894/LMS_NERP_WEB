<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/vms/tender-management.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script type="text/javascript"
	src="../javaScript/contract/compliance-risk.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
	defer></script>


</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="d-flex flex-column flex-lg-row">

								<!--Left Sec Start-->
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between p-2 border-bottom">
											<div class="col-md-8 col-12">
												<form class="d-flex gap-2 search-sec flxwrap">
													<input class="form-control search_input_bar"
														placeholder="Search.." type="text" name="search"
														id="quickFilter" autocomplete="off">
													<button class="btn go-btn" onclick="onQuickFilterChanged()"
														id="SearchBtn" type="button">Go</button>
													<button class="btn go-btn w-auto" type="button"
														onclick="resetBtn()">Reset</button>
												</form>
											</div>

											<div class="col-md-2 text-end">
												<button alt="Maximize" class="btn btn-primary max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>
											</div>
										</div>

										<div class="card m-2 p-2">
											<div class="buttonsec btn-hs ">
												<!-- <button class="new-btn" id="vendorsResponseLogs" onclick="viewLogs()" style="width: 88px !important;">Logs</button> -->
												<button class="new-btn" id="changeReq" onclick="changeReq()"
													style="width: 88px !important;"
													th:if="${session.IS_VENDOR == 'rol030'}">Change
													Req</button>
												<button class="new-btn" id="approve" onclick="approve()"
													style="width: 88px !important;"
													th:if="${session.IS_VENDOR == 'rol030'}">Approve</button>
											</div>

											<div class="leftSideParentContainer">
												<div id="complianceRiskGrid" class="ag-theme-alpine"
													style="height: 400px; width: 100%;"></div>
											</div>

											<input type="hidden" id="userId"
												th:value="${session.USER_ID}" /> <input type="hidden"
												id="docUniqueId" />
										</div>

									</div>
								</div>

								<div id="snackbar" class="snackbar"></div>
								<!--Right Sec Start-->
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box" id="rightSideDiv">
										<div class="d-flex flex-column gap-2 h-100">
											<div
												class="d-flex justify-content-between align-items-center p-2 border-bottom">
												<!-- Right Inner Tab Start -->
												<ul
													class="nav nav-pills newtab mb-20 tablistUl navbarSticky"
													role="tablist">
													<li class="nav-item wd-11"><a class="nav-link active"
														data-bs-toggle="pill" href="#manageControl" role="tab">
															Compliance Section </a></li>
													<li class="nav-item wd-11"><a class="nav-link"
														data-bs-toggle="pill" href="#chatDetails" role="tab">
															Risk Management </a></li>
												</ul>
												<button alt="Maximize" class="btn btn-primary max-btn"
													id="collapseButtonL1" onclick="triggerExpansionL(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
												</button>
											</div>
											<!-- Tab panes -->
											<div class="tab-content flex-fill">

												<div id="manageControl"
													class="tab-pane fade show h-100 active operational-tabs">
													<div class="d-flex flex-column h-100">
														<div class="requisition-tbl">
															<div class="mb-2 operationBtnSticky">
																<table class="table table-bordered mb-0" width="100%">
																	<tr valign="middle" class="operation-row">
																		<td>
																			<div
																				class="d-flex justify-content-between align-items-center">
																				<div class="contract-info">
																					Contract Id:&nbsp;&nbsp;<span id="headercontractid"></span>
																				</div>
																				<div
																					class="features-btn d-flex justify-content-between align-items-center">
																					<div class="mr-2">
																						<button class="btn btn-primary edit-btn"
																							onclick="saveCompliance()" type="button">
																							Save</button>
																					</div>
																					<div class="mr-2">
																						<button class="btn btn-primary edit-btn"
																							onclick="nextBtnFunction('chatDetails');"
																							type="button">Next</button>
																					</div>

																				</div>
																			</div>
																		</td>
																	</tr>
																</table>
															</div>
														</div>

														<!-- <div class="row p-2">
															<div class="col-lg-12">
																<div class="section-container">
																	<h3 class="headertext">Compliance Section</h3>
																	<button id="addMultiCompliance"
																		class="btn btn-success mb-2 mt-2">+ Add
																		Compliance Entry</button>
																	<div id="complianceContainer"></div>
																</div>
															</div>
														</div> -->
														<div id="childGridKey">
															<div class="mb-2 mt-2">
																<table class="table table-bordered mb-0" width="100%">
																	<tbody>
																		<tr valign="middle">
																			<td width="70%"><h5>Add Compliance Record</h5></td>
																			<td>
																				<div class="d-flex justify-content-end">
																					<div class="mr-2">
																						<button class="btn max-btn br-m-btn" type="button"
																							id="addMultiCompliance">
																							<i class="fa fa-plus-square" aria-hidden="true"></i>
																						</button>
																					</div>
																					<div class="mr-0">
																						<button class="btn max-btn br-m-btn" type="button"
																							id="deleteFactor" onclick="deleteFactor1();">
																							<i class="fa fa-trash"></i>
																						</button>
																					</div>
																				</div>
																			</td>
																		</tr>
																	</tbody>
																</table>
															</div>
															<div id="complianceContainer"></div>
															<div id="complianceGrid" class="ag-theme-alpine"
																style="height: 200px; margin-top: 5px; width: 100%;"></div>
														</div>


													</div>
												</div>

												<div id="chatDetails" class="tab-pane fade" role="tabpanel">
													<div class="requisition-tbl">
														<div class="mb-2 operationBtnSticky">
															<table class="table table-bordered mb-0" width="100%">
																<tr valign="middle" class="operation-row">
																	<td>
																		<div
																			class="d-flex justify-content-between align-items-center">
																			<div class="contract-info">
																				Contract Id:&nbsp;&nbsp;<span id="headercontractid2"></span>
																			</div>
																			<div
																				class="features-btn d-flex justify-content-between align-items-center">
																				<div class="mr-2">
																						<button class="btn btn-primary edit-btn"
																							onclick="saveRisk()" type="button">
																							Save</button>
																					</div>
																				<div class="mr-2">
																					<button class="btn btn-primary edit-btn"
																						onclick="nextBtnFunction('manageControl')"
																						type="button">Previous</button>
																				</div>
																			</div>
																		</div>
																	</td>
																</tr>
															</table>
														</div>
													</div>
													<div id="childGridKey">
														<div class="mb-2 mt-2">
															<table class="table table-bordered mb-0" width="100%">
																<tbody>
																	<tr valign="middle">
																		<td width="70%"><h5>Add Risk Assessment</h5></td>
																		<td>
																			<div class="d-flex justify-content-end">
																				<div class="mr-2">
																					<button class="btn max-btn br-m-btn" type="button"
																						id="addMultiRisk">
																						<i class="fa fa-plus-square" aria-hidden="true"></i>
																					</button>
																				</div>
																				<div class="mr-0">
																					<button class="btn max-btn br-m-btn" type="button"
																						id="deleterisk" onclick="risk();">
																						<i class="fa fa-trash"></i>
																					</button>
																				</div>
																			</div>
																		</td>
																	</tr>
																</tbody>
															</table>
														</div>
														<div id="riskContainer"></div>
														<div id="riskGrid" class="ag-theme-alpine"
															style="height: 200px; margin-top: 5px; width: 100%;"></div>
													</div>
												</div>

											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

					</div>

				</div>
			</div>

		</div>
	</div>
</body>
</html>
