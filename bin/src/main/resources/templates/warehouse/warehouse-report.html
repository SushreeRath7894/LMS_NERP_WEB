			});

				});
			} else {

	function onQuickFilterChanged() {
		if($('#activeState').val()=='current'){
			gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
			$('#totalReq').find('span').html(gridOptions.api.getModel().getRowCount());
		}else if($('#activeState').val()=='history'){
			gridOptions1.api.setQuickFilter(document.getElementById('quickFilter').value);
			$('#totalReq').find('span').html(gridOptions1.api.getModel().getRowCount());
		}else if($('#activeState').val()=='register'){
			gridOptions2.api.setQuickFilter(document.getElementById('quickFilter').value);
			$('#totalReq').find('span').html(gridOptions2.api.getModel().getRowCount());
		}
		
	}

	function removeSearchField(){
		$('#quickFilter').val('');
		if($('#activeState').val()=='current'){
			gridOptions.api.setQuickFilter(null);
			$('#totalReq').find('span').html(gridOptions.api.getModel().getRowCount());
		}else if($('#activeState').val()=='history'){
			gridOptions1.api.setQuickFilter(null);
			$('#totalReq').find('span').html(gridOptions1.api.getModel().getRowCount());
		}else if($('#activeState').val()=='register'){
			gridOptions2.api.setQuickFilter(null);
			$('#totalReq').find('span').html(gridOptions2.api.getModel().getRowCount());
		}
	}
	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	function downloadDetails() {
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			dataset.push(rowNode.data);
		});
		gridOptions.api.exportDataAsCsv(dataset);
	}

	function ShowAgGrid(state) {
		$('#activeState').val(state);
		removeSearchField();
		if (state == 'current') {
			$('#hissec').removeClass('active');
			$("#currsec").addClass("active");
			$('#registersec').removeClass('active');
			
			$("#myGrid").show();
			$("#myGrid1").hide();
			$("#myGrid2").hide();
			
			/* var gridDiv = document.querySelector('#myGrid');
			new agGrid.Grid(gridDiv, gridOptions); */
			// var rowData = [];
			gridOptions.api.setRowData();
			$(".loader").show();
			agGrid.simpleHttpRequest({
				url : 'warehouse-report-view?state=' + state
			}).then(function(data) {
				$(".loader").hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.viewReportData;
				var len = allData.length;
				$('#totalReq').find('span').html(len);
				gridOptions.api.setRowData(allData);
			});
		} else if(state == 'history'){
			$('#currsec').removeClass('active');
			$('#hissec').addClass('active');
			$('#registersec').removeClass('active');
			
			$("#myGrid").hide();
			$("#myGrid1").show();
			$("#myGrid2").hide();
			
			gridOptions1.api.setRowData();
			$(".loader").show();
			 agGrid.simpleHttpRequest({
				url : 'warehouse-report-view-forItemWiseStock'
			}).then(function(data) {
				$(".loader").hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.viewReportDataItemWise;
				var len = allData.length;
				$('#totalReq').find('span').html(len);
				gridOptions1.api.setRowData(allData);
			});
		} else if(state == 'register'){
			$('#currsec').removeClass('active');
			$('#hissec').removeClass('active');
			$('#registersec').addClass('active');
			
			$("#myGrid").hide();
			$("#myGrid1").hide();
			$("#myGrid2").show();
			
			gridOptions2.api.setRowData();
			$(".loader").show();
			 agGrid.simpleHttpRequest({
				url : 'warehouse-report-view-stockRegister'
			}).then(function(data) {
				$(".loader").hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.AllocationData;
				var len = allData.length;
				$('#totalReq').find('span').html(len);
				gridOptions2.api.setRowData(allData);
			}); 
		}
		//$("#myGrid").empty();

		
	}

	function filterSlNo() {
		var slno = $("#filterSl").val();

		if (slno == "" || slno == null) {
			$("#messageParagraph").text("Enter Serial Number.");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');

		} else {
			$("#myGrid").empty();

			var gridDiv = document.querySelector('#myGrid');
			new agGrid.Grid(gridDiv, gridOptions);
			// var rowData = [];
			gridOptions.api.setRowData();
			agGrid.simpleHttpRequest({
				url : "warehouse-report-filter-view?slno=" + slno
			}).then(function(data) {
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.viewReportData;
				var len = allData.length;
				$('#totalReq').find('span').html(len);
				gridOptions.api.setRowData(allData);
			});

		}

		$("#filterSl").val('');
	}

	function filterInput() {
		var onKeyUpVal = $("#filterSl").val();
		if ((onKeyUpVal == "" || onKeyUpVal == null)
				&& $(".searchInput").is(':hover')) {
			$(".searchInput").css({
				"width" : "180px",
				"padding" : "0 6px",
				"margin-right" : "10px",
				"border-bottom" : "1px solid #d5d5d5"
			});
		}

		if (onKeyUpVal == "" || onKeyUpVal == null) {
			if ($(".searchInput").is(':hover')) {
				$(".searchInput").css({
					"width" : "180px",
					"padding" : "0 6px",
					"margin-right" : "10px",
					"border-bottom" : "1px solid #d5d5d5"
				});
			} else if ($(".searchBox").is(':hover')) {
				$(".searchInput").css({
					"width" : "180px",
					"padding" : "0 6px",
					"margin-right" : "10px",
					"border-bottom" : "1px solid #d5d5d5"
				});
			} else {
				$(".searchInput").css({
					"width" : "0px",
					"margin-right" : "0px",
					"border" : "none"
				});
			}
		}
	}
</script>
