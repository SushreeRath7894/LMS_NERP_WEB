<script>
    let triggerExpansionR = (n) => {
      let targetSectionR = document.querySelector('#collapseWidthR'+n);
      let targetSectionL = document.querySelector('#collapseWidthL'+n);
      let collapseButtonR = document.querySelector('#collapseButtonR'+n);
      let collapseButtonL = document.querySelector('#collapseButtonL'+n);
      let expandIconR = document.querySelector('#expandIconR'+n);
      let expandIconL = document.querySelector('#expandIconL'+n);
      let shrinkIconL = document.querySelector('#shrinkIconL'+n);
      let shrinkIconR = document.querySelector('#shrinkIconR'+n);
      
      if (targetSectionR.classList.contains('expanded')) {
        targetSectionR.classList.remove('expanded');
        targetSectionL.classList.remove('hidden');
        expandIconR.classList.remove('d-none');
        shrinkIconR.classList.add('d-none');
      } else {
        targetSectionR.classList.add('expanded');
        targetSectionL.classList.add('hidden');
        expandIconR.classList.add('d-none');
        shrinkIconR.classList.remove('d-none');
      }
    }
    let triggerExpansionL = (n) => {
      let targetSectionR = document.querySelector('#collapseWidthR'+n);
      let targetSectionL = document.querySelector('#collapseWidthL'+n);
      let collapseButtonR = document.querySelector('#collapseButtonR'+n);
      let collapseButtonL = document.querySelector('#collapseButtonL'+n);
      let expandIconR = document.querySelector('#expandIconR'+n);
      let expandIconL = document.querySelector('#expandIconL'+n);
      let shrinkIconL = document.querySelector('#shrinkIconL'+n);
      let shrinkIconR = document.querySelector('#shrinkIconR'+n);
      
      if (targetSectionL.classList.contains('expanded')) {
        targetSectionL.classList.remove('expanded');
        targetSectionR.classList.remove('hidden');
        expandIconL.classList.remove('d-none');
        shrinkIconL.classList.add('d-none');
      } else {
        targetSectionL.classList.add('expanded');
        targetSectionR.classList.add('hidden');
        expandIconL.classList.add('d-none');
        shrinkIconL.classList.remove('d-none');
      }
    }
  </script>


<script>
	var columnDefs2 = [
		{
	        headerName: "Product",
	        field: "item_name",
	        flex: 1,
	    },
	    {
	        headerName: "SKU",
	        field: "sku_name",
	        flex: 1,
	    },
	    {
	        headerName: "Quantity",
	        field: "qty",
	        flex: 1,
	    }
	]
	var columnDefs1 = [
			/* {
				headerCheckboxSelection : false,
				checkboxSelection : true,
				width : 8,
				sortable : false,
				filter : false,
				resizable : true,
				pinned : 'left',
			},  */
	    {
	        headerName: "Warehouse",
	        field: "loc_name",
	        flex: 1,
	        cellRenderer: function(params) {
	        	var addButton = '<i class="fa fa-plus" title="Add Zone" data-bs-toggle="tooltip" style="cursor: pointer; margin-left: 10px; color: var(--mainColor)" onclick="addZone(' + params.node.rowIndex + ')"></i>';
	        	if(params.data.loc_name)
	        	return params.data.loc_name + addButton;
	        }
	    }, {
	        headerName: "Zone",
	        field: "zone_name",
	        flex: 1,
	        cellRenderer: function(params) {
	        	var addButton = '<i class="fa fa-plus" title="Add Rack" data-bs-toggle="tooltip" style="cursor: pointer; margin-left: 10px;  color: var(--mainColor)" onclick="addRack(' + params.node.rowIndex + ')"></i>';
	        	var deleteButton = '<i class="fa fa-edit" title="Edit Zone" data-bs-toggle="tooltip" style="cursor: pointer; margin-left: 10px;  color: var(--mainColor)" onclick="editZone(' + params.node.rowIndex + ')"></i>';
	            var crossButton = '<i class="fa fa-trash" title="Delete Zone" data-bs-toggle="tooltip" style="cursor: pointer; margin-left: 10px;  color: var(--mainColor)" onclick=deleteZone("' + params.data.zone_id + '")></i>';
	        	if(params.data.zone_name)
	        	return params.data.zone_no + " - " + params.data.zone_name + addButton + deleteButton + crossButton;
	        }
	    },
		{
		    headerName: "Rack",
		    field: "rack_name",
		    flex: 1,
		    cellRenderer: function(params) {
		    	var addButton = '<i class="fa fa-list" title="Bin Details" data-bs-toggle="tooltip" style="cursor: pointer; margin-left: 10px;  color: var(--mainColor)" onclick="addBin(' + params.node.rowIndex + ')"></i>';
	        	var deleteButton = '<i class="fa fa-edit" title="Edit Rack" data-bs-toggle="tooltip" style="cursor: pointer; margin-left: 10px;  color: var(--mainColor)" onclick="editRack(' + params.node.rowIndex + ')"></i>';
	            var crossButton = '<i class="fa fa-trash" title="Delete Rack" data-bs-toggle="tooltip" style="cursor: pointer; margin-left: 10px;  color: var(--mainColor)" onclick=deleteRack("' + params.data.rack_id + '")></i>';
	        	if(params.data.rack_name)
	        	return params.data.rack_no + " - " + params.data.rack_name + addButton + deleteButton + crossButton;
	        }
		},
	];
	var gridOptions1 = {
	    columnDefs: columnDefs1,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    suppressRowClickSelection: true, 
	    onRowClicked: (event) => {
	        const selectedNode = event.node;
	        if (!selectedNode.isSelected()) {
	            selectedNode.setSelected(true);
	        }
	    },
	};
	var gridOptions2 = {
		columnDefs: columnDefs2,
		defaultColDef: {
			sortable: true,
		    filter: true,
		    resizable: true,
		    width: 195,
		    height: 10
		},
		rowSelection: 'single',
		rowMultiSelectWithClick: true,
		suppressRowClickSelection: true, 
		onRowClicked: (event) => {
			const selectedNode = event.node;
		    if (!selectedNode.isSelected()) {
		    	selectedNode.setSelected(true);
		    }
		},
		onSelectionChanged: onSelectionItemConfig,
		getRowNodeId : function(data) {
			return data.key;
		}
	};
	let type = '';
	$(document).ready(()=>{
		var gridDiv1 = document.querySelector('#myGrid1');
	    new agGrid.Grid(gridDiv1, gridOptions1);
	    
		var gridDiv2 = document.querySelector('#myGrid2');
	    new agGrid.Grid(gridDiv2, gridOptions2);
	    
	    const urlParams = new URLSearchParams(window.location.search);
		type = urlParams.get('id');
		
		if(type == null || type == 'null') {
			type = '';
		}
		
	    $('#locationSearch').select2({
	        placeholder: "Select",
	        allowClear: true          
	    });
	    $('#skuId').select2({
	        placeholder: "Select",
	        allowClear: true          
	    });
	    gridOptions2.api.setRowData([]);
	    getAllData();
	    $("#zoneLiId").hide()
	    $("#rackLiId").hide()
	    $("#binLiId").hide()
	    $(".second-view").hide()
	})
	function getAllData(id='') {
		agGrid.simpleHttpRequest({
		    url: "manage-warehouse-get-location?id="+id+"&type="+type
		}).then(data => {
			if(data?.body[0]) {
				let d = JSON.parse(data.body);
				if(d.length > 0) {
					if(d[0]) {
						let p = formatData(d);
						gridOptions1.api.setRowData(p);
					} else {
						gridOptions1.api.setRowData([]);
					}
				} else {
					gridOptions1.api.setRowData([]);
				}
			} else {
				gridOptions1.api.setRowData([]);
			}
			
			addZone(0);
		});
	}
	function getItemConfigOfBin(id='') {
		
		$('.loader').show();
		$("body").addClass("overlay");
		
		agGrid.simpleHttpRequest({
		    url: "manage-warehouse-get-item-config?id="+id
		}).then(data => {
			if(data.body[0]) {
				let d = JSON.parse(data?.body);
				if(d.length > 0) {
					itemConfigList = d;
					gridOptions2.api.setRowData(d);
				} else {
					gridOptions2.api.setRowData([]);
				}
			} else {
				gridOptions2.api.setRowData([]);
			}
			
			$('.loader').hide();
			$("body").removeClass("overlay");
		});
	}
	function getBinList(id='') {
		
		$('.loader').show();
		$("body").addClass("overlay");
		
		$("#binDtlsId").empty();
		
		agGrid.simpleHttpRequest({
		    url: "manage-warehouse-get-bin?id="+id
		}).then(data => {
			
			if(data.body[0]) {
				let d = JSON.parse(data?.body);
				
				if(d.length > 0) {
					let b = '';
					d.forEach(a => {
						b = b + '<div class="menu-container"><div class="btn btn-primary edit-btn pd--10">'+a.bin_name+'</div>'
  							  +	'<ul class="menu-list"><li><div onclick=editBin("'+window.btoa(JSON.stringify(a))+'")><i class="fa fa-edit" title="Edit Bin"></i></div><div onclick=deleteBin("'+a.bin_id+'")><i class="fa fa-trash" title="Delete Bin"></i></div><div onclick=binConfig("'+a.bin_id+'")><i class="fa fa-cog" title="Item Config"></i></div></li></ul></div>';
					})
					$("#binDtlsId").append(b);
				}
			}
			
			$('.loader').hide();
			$("body").removeClass("overlay");
			
		});
	}
	let itemConfigList = [];
	function binConfig(id) {
		$(".first-view").hide();
		$(".second-view").show();
		itemConfigList = [];
		$("#binId,#binName,#resetBinBtn,#saveBinBtn").attr("disabled",true);
		$("#itemCatId,#qty,#skuId").attr("disabled",true);
		gridOptions2.api.setRowData([]);
		$("#selectedBinId").val(id);
		addItemConfig();
		getItemConfigOfBin(id);
	}
	function removeConfig() {
		$(".first-view").show();
		$(".second-view").hide();
		$("#binId,#binName,#resetBinBtn,#saveBinBtn").attr("disabled",false);
		$("#selectedBinId").val('');
		itemConfigList = [];
	}
	function addZone(i) {
		$("#zoneLiId").show()
		$("#rackLiId").hide()
		$("#binLiId").hide()
		focusTab('zoneLiId');
		var rowNode = gridOptions1.api.getDisplayedRowAtIndex(i);
	    if (rowNode) {
	        let d = rowNode.data;
	        $("#locNameId").text(d.loc_name);
	        $("#warehouseId").val(d.loc_id);
	        $("#zoneId").val('');
	        $("#rackBin").val('');
	        $("#zoneRack").val('');
			$("#zoneName").val('');
			$("#zoneDBVal").val('');
			$("#zoneSlNoDBVal").val('');
	    }
	}
	function addRack(i) {
		$("#zoneLiId").hide()
		$("#rackLiId").show()
		$("#binLiId").hide()
		focusTab('rackLiId');
		var rowNode = gridOptions1.api.getDisplayedRowAtIndex(i);
	    if (rowNode) {
	        let d = rowNode.data;
	        $("#locNameId1").text(d.loc_name_2+" - "+d.zone_name);
	        $("#warehouseId").val(d.loc_id);
	        $("#zoneRack").val(d.zone_id);
	        $("#rackBin").val('');
	        $("#rackId").val('');
			$("#rackName").val('');
			$("#rackDBVal").val('');
			$("#rackSerialNo").val('');
	    }
	}
	function addBin(i) {
		$("#zoneLiId").hide()
		$("#rackLiId").hide()
		$("#binLiId").show()
		focusTab('binLiId');
		var rowNode = gridOptions1.api.getDisplayedRowAtIndex(i);
	    if (rowNode) {
	    	let d = rowNode.data;
	        $("#locNameId2").text(d.loc_name_2+" - "+d.zone_name_2 + " - " + d.rack_name);
	        $("#warehouseId").val(d.loc_id);
	        $("#zoneRack").val(d.zone_id);
	        $("#rackBin").val(d.rack_id);
	        getBinList(d.rack_id);
	        removeConfig()
	    }
	}
	function editZone(i) {
		$("#zoneLiId").show()
		$("#rackLiId").hide()
		$("#binLiId").hide()
		focusTab('zoneLiId');
		var rowNode = gridOptions1.api.getDisplayedRowAtIndex(i);
		if (rowNode) {
			let d = rowNode.data;
			$("#locNameId").text(d.loc_name_2 + " - " + d.zone_name);
			$("#warehouseId").val(d.loc_id);
			$("#zoneId").val(d.zone_code);
			$("#zoneName").val(d.zone_name);
			$("#zoneDBVal").val(d.zone_id);
			$("#zoneSlNoDBVal").val(d.zone_no);
			$("#rackBin").val('');
	        $("#zoneRack").val('');
		}
	}
	function editRack(i) {
		$("#zoneLiId").hide()
		$("#rackLiId").show()
		$("#binLiId").hide()
		focusTab('rackLiId');
		var rowNode = gridOptions1.api.getDisplayedRowAtIndex(i);
		if (rowNode) {
			let d = rowNode.data;
			$("#locNameId1").text(d.loc_name_2 + " - " + d.zone_name_2 + " - " + d.rack_name );
			$("#warehouseId").val(d.loc_id);
			$("#zoneRack").val(d.zone_id);
			$("#rackName").val(d.rack_name);
			$("#rackDBVal").val(d.rack_id);
			$("#rackSerialNo").val(d.rack_no);
			$("#rackId").val(d.rack_code);
			$("#rackBin").val('');
		}
	}
	function editBin(a) {
		$("#zoneLiId").hide()
		$("#rackLiId").hide()
		$("#binLiId").show()
		focusTab('binLiId');
		let d = window.atob(a);
		if (d) {
			d = JSON.parse(d)
			$("#binName").val(d.bin_name);
			$("#binDBVal").val(d.bin_id);
			$("#binId").val(d.bin_code);
		}
	}
	function resetZone() {
		if(!$("#zoneDBVal").val()) {
			$("#zoneId").val('');
			$("#zoneName").val('');
			$("#zoneDBVal").val('');
			$("#zoneSlNoDBVal").val('');
		}
	}
	function resetRack() {
		if(!$("#rackDBVal").val()) {
			$("#rackId").val('');
			$("#rackName").val('');
			$("#rackDBVal").val('');
			$("#rackSerialNo").val('');
		}
	}
	function resetBin() {
		// if(!$("#binDBVal").val()) {
			$("#binId").val('');
			$("#binName").val('');
			$("#binDBVal").val('');
			$("#binSerialNo").val('');
		// }
	}
	function saveZone() {
		
		if($("#zoneId").val() == null || $("#zoneId").val() == "") {
			toastr.error("Zone number required");
			return;
		}
		if($("#zoneName").val() == null || $("#zoneName").val() == "") {
			toastr.error("Zone name required");
			return;
		}
		
		data = {};

		data.warehouseId = $("#warehouseId").val();
		data.zoneCode = $("#zoneId").val();
		data.zoneName = $("#zoneName").val();
		data.zoneId = $("#zoneDBVal").val();
		data.zoneSlNo = $("#zoneSlNoDBVal").val();
		
		$('.loader').show();
		$("body").addClass("overlay");
		$.ajax({
		    type: "POST",
		    url: "manage-warehouse-zone-save",
		    dataType: "json",
		    contentType: "application/json",
		    data: JSON.stringify(data),
		    success: function(response) {
		        if (response.message == "Success") {
		        	if($("#zoneDBVal").val() == null || $("#zoneDBVal").val() == "") {
		        		toastr.success("Zone added successfully")
		        	} else {
		        		toastr.success("Zone modified successfully")
		        	}
		            $('.loader').hide();
		            $("body").removeClass("overlay");
		            $("#zoneId").val('');
					$("#zoneName").val('');
					$("#zoneDBVal").val('');
					$("#zoneSlNoDBVal").val('');
		            getAllData(id='');
		        } else {
		        	toastr.error(response.message)
		            $('.loader').hide();
		            $("body").removeClass("overlay");
		        }
		    },
		    error: function(data) {
		        console.log(data);
		        toastr.error("Something went wrong")
		        $('.loader').hide();
		        $("body").removeClass("overlay");
		    }
		})
	}
	function saveRack() {
		
		if($("#rackId").val() == null || $("#rackId").val() == "") {
			toastr.error("Rack number required");
			return;
		}
		if($("#rackName").val() == null || $("#rackName").val() == "") {
			toastr.error("Rack name required");
			return;
		}
		
		data = {};

		data.warehouseId = $("#warehouseId").val();
		data.rackName = $("#rackName").val();
		data.rackCode = $("#rackId").val();
		data.zoneId = $("#zoneRack").val();
		data.rackId = $("#rackDBVal").val();
		data.rackSlNo = $("#rackSerialNo").val();
		
		$.ajax({
		    type: "POST",
		    url: "manage-warehouse-save-rack",
		    dataType: "json",
		    contentType: "application/json",
		    data: JSON.stringify(data),
		    success: function(response) {
		        if (response.message == "Success") {
		            if ($("#rackDBVal").val() == null || $("#rackDBVal").val() == "") {
		                toastr.success("Rack added successfully")
		            } else {
		                toastr.success("Rack modified successfully")
		            }
		            $('.loader').hide();
		            $("body").removeClass("overlay");
		            $("#rackId").val('');
		            $("#rackName").val('');
		            $("#zoneRack").val('');
		            $("#rackDBVal").val('');
		            $("#rackSerialNo").val('');
		            getAllData(id = '');
		
		        } else {
		            toastr.error(response.message)
		            $('.loader').hide();
		            $("body").removeClass("overlay");
		        }
		    },
		    error: function(data) {
		        console.log(data);
		        toastr.error("Something went wrong")
		        $('.loader').hide();
		        $("body").removeClass("overlay");
		    }
		})
	}
	function saveBin() {
		
		if($("#binId").val() == null || $("#binId").val() == "") {
			toastr.error("Bin number required");
			return;
		}
		if($("#binName").val() == null || $("#binName").val() == "") {
			toastr.error("Bin name required");
			return;
		}
		
		data = {};

		data.roomId = $("#binDBVal").val();
		data.roomCode = $("#binId").val();
		data.roomName = $("#binName").val();
		data.roomType = "";
		data.rackId = $("#rackBin").val();
		
		$.ajax({
		    type: "POST",
		    url: "manage-warehouse-save-room",
		    dataType: "json",
		    contentType: "application/json",
		    data: JSON.stringify(data),
		    success: function(response) {
		        if (response.message == "Success") {
		        	$('.loader').hide();
		            $("body").removeClass("overlay");
		            if ($("#binDBVal").val() == null || $("#binDBVal").val() == "") {
		                toastr.success("Bin added successfully")
		            } else {
		                toastr.success("Bin modified successfully")
		            }
		            
		            $("#binId").val('');
		            $("#binName").val('');
		            $("#binDBVal").val('');
		            $("#binSerialNo").val('');
		            getBinList(data.rackId);
		
		        } else {
		            toastr.error(response.message)
		            $('.loader').hide();
		            $("body").removeClass("overlay");
		        }
		    },
		    error: function(data) {
		        console.log(data);
		        toastr.error("Something went wrong")
		        $('.loader').hide();
		        $("body").removeClass("overlay");
		    }
		})
	}
	function saveConfigItem() {
		
		let a = itemConfigList.map(m => m.sku_id);
		
		if(a.includes($("#skuId").val()) && $("#keyVal").val() == '') {
			toastr.error("This sku is already exist");
			return;
		}
		
		if($("#skuId").val() == null || $("#skuId").val() == "") {
			toastr.error("SKU required");
			return;
		}
		if($("#qty").val() == null || $("#qty").val() == "") {
			toastr.error("Quantity required");

	function formatData(data) {
		const locations = [];
		
		data = data.sort((a, b) => {
		    if (a.loc_id < b.loc_id) return -1;
		    if (a.loc_id > b.loc_id) return 1;
		    return a.zone_id < b.zone_id ? -1 : a.zone_id > b.zone_id ? 1 : 0;
		  });
		const locationMap = new Map();
		data.forEach(item => {
		  if (!locationMap.has(item.loc_id)) {
		    locations.push({ loc_id: item.loc_id, loc_name: item.loc_name, zone_id: null, zone_name: null, rack_id: null, rack_name: null });
		    locationMap.set(item.loc_id, new Set());
		  }
		  if (!locationMap.get(item.loc_id).has(item.zone_id)) {
			  if(item.zone_id) {
				  locations.push({ loc_id: item.loc_id, loc_name: null, loc_name_2:item.loc_name, zone_id: item.zone_id, zone_name: item.zone_name, zone_code: item.zone_code, zone_no: item.zone_no, rack_id: null, rack_name: null });
				    locationMap.get(item.loc_id).add(item.zone_id);
			  }
		    
		  }
		  if(item.rack_id)
		  locations.push({ loc_id: item.loc_id, loc_name: null, zone_id: item.zone_id, zone_name: null, rack_id: item.rack_id, rack_name: item.rack_name, rack_no: item.rack_no, rack_code: item.rack_code, loc_name_2: item.loc_name, zone_name_2 : item.zone_name });
		});
		return locations;
	}
