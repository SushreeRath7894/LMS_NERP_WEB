function getItemList() {
    var categoryId = $("#categoryId").val();
    if (categoryId) {
        $.ajax({
            type: 'GET',
            url: 'stock-transfer-getitemList?id=' + categoryId,
            contentType: false,
            success: function(response) {
                if (response.code == "success") {
                    $("#itemId").empty();
                    var option = $("<option></option>");
                    $(option).val(null);
                    $(option).html("Select");
                    $("#itemId").append(option);
                    for (var i = 0; i < response.body.length; i++) {
                        var option = $("<option></option>");
                        $(option).val(response.body[i].key);
                        $(option).html(response.body[i].name);
                        $(option).attr("code", response.body[i].code);
                        $(option).attr("data", response.body[i].data);
                        $("#itemId").append(option);
                    }
                } else {
                	$("#itemId").empty();
                    var option = $("<option></option>");
                    $(option).val(null);
                    $(option).html("Select");
                    $("#itemId").append(option);
                }
            },
            error: function(e) {
                console.log(e);
                
                $("#itemId").empty();
                var option = $("<option></option>");
                $(option).val(null);
                $(option).html("Select");
                $("#itemId").append(option);
            }
        });
    }
}

let right_data = [];
function filterBin() {
	
	if($("#warehouseId").val() == null || $("#warehouseId").val() == '' || $("#warehouseId").val() == undefined) {
		toastr.error('Warehouse required');
		return;
	}
	if($("#categoryId").val() == null || $("#categoryId").val() == '' || $("#categoryId").val() == undefined) {
		toastr.error('Category required');
		return;
	}
	if($("#itemId").val() == null || $("#itemId").val() == '' || $("#itemId").val() == undefined) {
		toastr.error('Item/SKU required');
		return;
	}
	
	$('.loader').show();
	$("body").addClass("overlay");
	
	$("#leftSection").empty();
	
	resetRightSec();
	
	let data = {};
	
	data.key = $("#zoneId").val();
	data.name = $("#rackId").val();
	data.code = $("#categoryId").val();
	data.data = $("#itemId").val();
	data.id = $("#warehouseId").val();
	
	$.ajax({
	    type: "POST",
	    url: "stock-transfer-get-stack-data-filter",
	    dataType: "json",
	    contentType: "application/json",
	    data: JSON.stringify(data),
	    success: function(response) {
	        if (response.code == "success") {
	        	
	        	let o = JSON.parse(response?.body);
	        	
	        	let d = JSON.parse(o?.left_data);
	        	right_data = JSON.parse(o?.right_data);

	            if (d && d.length > 0) {
	            	
	            	let b = '';

	                d.forEach(a => {

	                	b = b + '<h5 class="sub-header-new">' + a.zone_name + '</h5>';

	                    a?.bin_details?.forEach(c => {
	                    	b = b + '<div class="menu-container"><div class="btn btn-primary edit-btn pd--10 bin-for-all" data-alloc="'+c.alloc_id+'" id="' + c.bin_id + '" data-name="' + c.bin_name + '" data-qty="' + c.bin_qty + '" data-zone="' + c.zone_id + '">' + c.bin_name + '(' + c.bin_qty + ')' + '</div>' +
	                           '</div>';
	                    })
	                })
	                $("#leftSection").append(b);

	                $(".bin-for-all").click(function() {
	                    $(".bin-for-all").removeClass('bin-all-active');
                        $(this).addClass('bin-all-active');
                        
                        let len = $('.bin-all-active').length;
                        
                        if(len == 1) {
                        	$("#binName").val($(this).attr('data-name'));
                        	$("#binRId").val($(this).attr('id'));
                        	$("#checkBinQty").val($(this).attr('data-qty'));
                        	$("#allocId").val($(this).attr('data-alloc'));
                        	
                        	$("#binQuantity,#zoneId1,#rackId1,#transferBtn").attr('disabled',false);
                        } else {
                        	$("#binName").val('');
                        	$("#binRId").val('');
                        	$("#checkBinQty").val('');
                        	$("#allocId").val('');
                        	
                        	$("#binQuantity,#zoneId1,#rackId1,#transferBtn").attr('disabled',true);
                        }
                        
                        setRightSideData();
                        
	                });
	            }
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	        } else {
	        	right_data = [];
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	        }
	    },
	    error: function(data) {
	        console.log(data);
	        right_data = [];
	        toastr.error("Something went wrong")
	        $('.loader').hide();
	        $("body").removeClass("overlay");
	    }
	})
}

function setRightSideData() {
	
	$("#rightSection").empty();
	
	let selectedBinId = $("#binRId").val();
	let selectedZoneId = $("#zoneId1").val();
	let selectedRackId = $("#rackId1").val();
	
	let dd = right_data?.filter(f => f.bin_id !== selectedBinId);
	
	if(selectedZoneId != '') 
		dd = right_data?.filter(f => f.zone_id == selectedZoneId && f.bin_id !== selectedBinId);
	
	if(selectedRackId != '') 
		dd = right_data?.filter(f => f.rack_id == selectedRackId && f.bin_id !== selectedBinId);
	
	
	if(dd && dd.length > 0) {
		
		$("#itemDetailsId").hide();
		$("#binDetailsId").show();
		
		let d = formatToTreeData(dd);
		if(d.length > 0) {
			let b = '';
			
			d.forEach(a => {
				
				b = b + '<h5 class="sub-header-new">'+a.zone_name+'</h5>';
				
				a?.bin_details?.forEach(c => {
					b = b + '<div class="btn btn-primary edit-btn pd--10 r-bin-for-all" data-alloc="'+c.alloc_id+'" id="'+c.bin_id+'" data-name="'+c.bin_name+'" data-qty="'+c.qty+'" data-zone="'+c.zone_id+'">'+c.bin_name+'('+c.qty+')'+'</div>';
				})
			})
			$("#rightSection").append(b);
			
			$(".r-bin-for-all").click(function() {
				$(this).toggleClass('r-bin-all-active');
			});
		}
	}
}

function formatToTreeData(data) {
	const groupedData = Object.values(data.reduce((acc, { zone_name, qty, bin_id, bin_name, zone_id, rack_id, alloc_id }) => {
	    if (!acc[zone_name]) {
	        acc[zone_name] = { zone_name, bin_details: [] };
	    }
	    acc[zone_name].bin_details.push({ qty, bin_id, bin_name, zone_id, rack_id, alloc_id });
	    return acc;
	}, {}));
	return groupedData;
}

function transferGoods() {
	
	let dataset = [];
	let binCount = $(".r-bin-all-active").length;
	let itemQty = $("#binQuantity").val();
	let selectedBinQty = $("#checkBinQty").val();
	
	if (itemQty == null || itemQty == '') {
        toastr.error("Transfer quantity required")
        return;
    }
	
	if(selectedBinQty < itemQty) {
		toastr.error("Transfer quantity will be less than or equal to selected bin quantity")
		return;
	}
	
	if(binCount == 0) {
		toastr.error("Please choose a bin")
		return;
	}
	
	if(itemQty < binCount) {
		toastr.error("Quantity will always be greater than bin")
		return;
	}
	
	let i = binCount;
	let q = itemQty;
	let fairShare = Math.floor(q / i);
	$(".r-bin-all-active").each(function(){
		
		let allocate = Math.min(fairShare, q);
		
		let a = {};
		a.bin_id = $(this).attr('id');
		a.bin_name = $(this).attr('data-name');
		a.qty = $(this).attr('data-qty');
		a.zone_id = $(this).attr('data-zone');
		a.slNoFrom = 0;
		a.slNoTo = 0;
		a.binRemark = '';
		
		if(allocate > a.qty) {
			a.binQuntity = a.qty;
			q -= a.qty;
		} else {
			a.binQuntity = allocate;
			q -= allocate;
		}
		dataset.push(a)
	})
	
	dataset.forEach(a =>{
		let availableSpace = a.qty - a.binQuntity;
		let extra = Math.min(q, availableSpace);
		a.binQuntity = parseInt(a.binQuntity) + parseInt(extra);
		q -= extra;
	})
	
	if(q > 0) {
		toastr.error("There is "+q+" quantity left, add some more bin to allocate")
		return;
	}
	
	gridOptionsAllocationQty.api.setRowData(dataset);
	
	$("#itemDetailsId").show();
	$("#binDetailsId").hide();
	
	$(".bin-for-all").addClass('disabled-all-bin');
	$("#leftFilterBtn,#transferBtn,#warehouseId,#zoneId,#rackId,#categoryId,#itemId,#binQuantity,#zoneId1,#rackId1").attr("disabled",true);
}

class KeyUpEditor {
    init(params) {
        this.params = params;
        this.eInput = document.createElement('input');
        this.eInput.type = 'text';
        this.eInput.value = params.value;

        this.eInput.addEventListener('keyup', (event) => {
            params.api.getRowNode(params.node.id).setDataValue(params.column.colId, event.target.value);
        });
    }

    getGui() {
        return this.eInput;
    }

    getValue() {
        return this.eInput.value;
    }
}

	    flex:3,
	    cellStyle: (params) => params.colDef.editable ? { backgroundColor: "#e4c8ee" } : {},
	    cellEditor: KeyUpEditor,
	}
];

var gridOptionsAllocationQty = {
	columnDefs: columnDefsQty,
	rowSelection: 'single',
	onSelectionChanged: onRowSelectionBin,
	groupSelectsChildren: true,
	suppressRowClickSelection: true,
	suppressRowClickSelection: true,
	suppressAggFuncInHeader: true,
	singleClickEdit: true, 
	stopEditingWhenCellsLoseFocus: true,
	defaultColDef: {
	    sortable: true,
	    filter: true,
	    resizable: true,
	    width: 251,
	    height: 10
	},
};

function onRowSelectionBin() {

    var selectedRows = gridOptionsAllocationQty.api.getSelectedRows();
    var rowCount = 0;
    selectedRows.forEach(function(selectedRow, index) {
        rowCount = rowCount + 1;
    });

    if (rowCount > 0) {
        $('#deleteBinQty').attr("disabled", false);
        $('#saveAllocateData').attr("disabled", true);


    } else {
        $('#deleteBinQty').attr("disabled", true);
        $('#saveAllocateData').attr("disabled", false);

    }

}

function saveTransferBin() {
	
	if(type=='pharmacy') {
    	if($("#batchNo").val() == '' || $("#batchNo").val() == null || $("#batchNo").val() == undefined) {
    		toastr.error("Batch number required")
    		return;
    	}
    	if($("#manufactureDate").val() == '' || $("#manufactureDate").val() == null || $("#manufactureDate").val() == undefined) {
    		toastr.error("Manufactured date required")
    		return;
    	}
    	if($("#bestBeforeDate").val() == '' || $("#bestBeforeDate").val() == null || $("#bestBeforeDate").val() == undefined) {
    		toastr.error("Expired date required")
    		return;
    	}
    }
	
	let datas = [];
	let sumBinQty = 0;
    gridOptionsAllocationQty.api.forEachNode(function(rowNode, indrx) {
        var obj = {};
      
        obj.allocationId = $("#allocId").val() == undefined ? '' : $("#allocId").val();
        obj.warehouseId = $("#warehouseId").val();
        obj.categoryId = $("#categoryId").val();
        obj.itemName = $("#itemId").val();
        obj.quantity = $("#binQuantity").val();
        obj.batchNo = $("#batchNo").val();
        obj.oldBinId = $("#binRId").val();
        obj.manufactureDate = $("#manufactureDate").val();
        obj.bestBeforeDate = $("#bestBeforeDate").val();
        obj.binId = rowNode.data.bin_id;
        obj.zoneId = rowNode.data.zone_id;
        obj.capacityQuantity = rowNode.data.qty;
        obj.binQuntity = parseInt(rowNode.data.binQuntity);
        obj.slNoFrom = rowNode.data.slNoFrom;
        obj.slNoTo = rowNode.data.slNoTo;
        obj.binRemark = rowNode.data.binRemark;
        sumBinQty = sumBinQty + obj.binQuntity;
        datas.push(obj);
      	
    });
    
    let zeroBinQty = datas.filter(a => a.binQuntity == 0 || a.binQuntity == '' || a.binQuntity == undefined);
    
    if(zeroBinQty && zeroBinQty.length > 0) {
    	toastr.error("Bin quantity won't be 0")
		return;
    }
    
    if(sumBinQty > $("#binQuantity").val()) {
    	toastr.error("You can't transfer more than "+$("#binQuantity").val())
		return;
    }
    
    console.log(datas)
    
    $('.loader').show();
	$("body").addClass("overlay");
	$.ajax({
	    type: "POST",
	    url: "stock-transfer-save-allocation",
	    contentType: "application/json",
	    data: JSON.stringify(datas),
	    success: function(response) {
	        if (response.code == "success") {
	          	toastr.success("Item transferred successfully");
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	            reset();
	        } else {
	            toastr.error(response.message);
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	        }
	    },
	    error: function(data) {
	        console.log(data);
	        toastr.error("Something went wrong");
	        $('.loader').hide();
	        $("body").removeClass("overlay");
	    }
	})
}
</script>
