<script>
	let pno = 1;
	let type = '';
	$(document).ready(function() {
		
		const urlParams = new URLSearchParams(window.location.search);
		type = urlParams.get('id');
		
		if(type == null || type == 'null') {
			type = '';
		}
		
		$('#deleteBinQty').attr("disabled", true);

		$("#allocatationDetailsLiId").hide();
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		
		$('#itemName').select2({
	        placeholder: "Select",
	        allowClear: true          
	    });

		var rowData = [];
		gridOptions.api.setRowData(rowData);
		
		view();

		var gridDiv = document.querySelector('#myGridBlockQty');
		new agGrid.Grid(gridDiv, gridOptionsBlocckQty);
		
		gridOptionsBlocckQty.api.setRowData();

		$('#deleteData').attr("disabled", true);
		$('#dispatchRequest').attr("disabled", true);

		var dateFormat = localStorage.getItem("dateFormat");
		$("#manufactureDateCalendar").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#manufactureDate').val($(this).val());
		})

		$('#manufactureDate').blur(function() {
			$("#manufactureDateCalendar").val($(this).val());
		})

		$("#bestBeforeCalendar").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#bestBeforeDate').val($(this).val());
		})

		$('#bestBeforeDate').blur(function() {
			$("#bestBeforeCalendar").val($(this).val());
		})

		$("#toDateCalendarTime").datetimepicker({
			format : 'H:i',
			closeOnDateSelect : false,
			timepicker : true,
			datepicker : false,
			step : 15
		}).on("change", function() {
			$('#manufactureTime').val($(this).val());
		})

		$('#manufactureTime').blur(function() {
			$("#toDateCalendarTime").val($(this).val());
		})
		$("#addData").hide();
		$("#blocking").hide();
		$("#itemDetailsId").hide();
		$("#productDetailsId").hide();

	});
	
	function view() {

	    var pages;
	    var pageno = pno;
	    $(".loader").show();
	    agGrid.simpleHttpRequest({
	        url: "goods-blocking-through-ajax?pageno=" + pageno + "&type=" + type
	    }).then(function(data) {
	        $(".loader").hide();
	        var jsonData = JSON.parse(data?.body);
	        var allData = jsonData?.BlockData;
	        if (allData && allData.length > 0)
	            gridOptions.api.setRowData(allData);
	        else
	            gridOptions.api.setRowData([]);

	        var totalRowCount = gridOptions.api.getModel().getRowCount();
	        $('#totalBlocking').find('span').html(totalRowCount);

	    });
	}
	
	var colmnDefs = [{
	        headerCheckboxSelection: false,
	        headerCheckboxSelectionFilteredOnly: true,
	        checkboxSelection: true,
	        width: 10,
	        sortable: false,
	        filter: false,
	        resizable: true
	    },
	    {
	        headerName: "Verify ID",
	        field: "challan_id",
	
	    }, {
	        headerName: "Block Id",
	        field: "blockId",
	        width: 130,
			hide: true
	    }, {
	        headerName: 'Date',
	        field: "date"
	    }, {
	        headerName: 'Category',
	        field: "category",
	        width: 100,
	    }, {
	        headerName: 'SKU',
	        field: "sku_id"
	    }, {
	        headerName: 'Item Name',
	        field: "item_name",
	        width: 330,
	    }, {
	        headerName: 'Unit',
	        field: "unit"
	    }, {
	        headerName: 'Quantity',
	        field: "quantity",
			type: "rightAligned",
	    }, {
	        headerName: 'Status',
	        field: "status",
	        cellRenderer: function(params) {
	            if (params.data.status == "Blocked") {
	                return '<div style="color:#0642f5">' + params.data.status + '</div>';
	            } else {
	                return '<div style="color:#a9a9a9">' + params.data.status + '</div>';
	            }
	        }
	    }
	];
	var gridOptions = {
	    columnDefs: colmnDefs,
	    rowSelection: 'single',
	    onSelectionChanged: onRowSelection,
	    groupSelectsChildren: true,
	    suppressRowClickSelection: true,
	    suppressAggFuncInHeader: true,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 130,
	        height: 10
	    },
	
	    isRowSelectable: function(rowNode) {
	        var status = rowNode.data.status;
	        return status !== 'Blocked';
	    }
	
	};
	window.index = -1;
	class KeyUpEditor {
		  init(params) {
		    this.params = params;
		    this.eInput = document.createElement('input');
		    this.eInput.type = 'text';
		    this.eInput.value = params.value;

		    // Update AG Grid's value on keyup
		    this.eInput.addEventListener('keyup', (event) => {
		      params.api.getRowNode(params.node.id).setDataValue(params.column.colId, event.target.value);
		    });
		  }

		  getGui() {
		    return this.eInput;
		  }

		  getValue() {
		    return this.eInput.value; // Return the final value
		  }
		}
	var columnDefsBlockQty = [{
	        headerCheckboxSelection: false,
	        headerCheckboxSelectionFilteredOnly: true,
	        checkboxSelection: true,
	        width: 10,
	        sortable: false,
	        filter: false,
	        resizable: true,
	        hide: true
	    },
	    {
	        headerName: "Bin Id",
	        field: "bin_id",
	        width: 150,
	        hide: true
	
	    }, {
	        headerName: "Bin Name",
	        field: "bin_name",
	        width: 100,
	        flex: 1
	    }, {
	        headerName: "Zone Name",
	        field: "zone_id",
	        width: 100,
	        hide: true
	    }, {
	        headerName: "Allocation Id",
	        field: "alloc_id",
	        width: 100,
	        flex: 1
	    }, {
	        headerName: 'Unit',
	        field: "unitName",
	        width: 80,
	        hide: true
	    }, {
	        headerName: 'Stock Quantity',
	        field: "qty",
	        width: 130,
	        flex: 1
	    }, {
	        headerName: 'Block Quantity',
	        field: "binQuntity",
	        width: 130,
	        flex: 1,
	        editable: true,
	        cellStyle: (params) => params.colDef.editable ? { backgroundColor: "#e4c8ee" } : {} ,
	        cellEditor: KeyUpEditor,
	    }, {
	        headerName: 'SlNo. From',
	        field: "slNoFrom",
	        width: 120,
	        flex: 1,
	        editable: true,
	        cellStyle: (params) => params.colDef.editable ? { backgroundColor: "#e4c8ee" } : {} ,
	        cellEditor: KeyUpEditor,
	    }, {
	        headerName: 'SlNo. To',
	        field: "slNoTo",
	        width: 120,
	        flex: 1,
	        editable: true,
	        cellStyle: (params) => params.colDef.editable ? { backgroundColor: "#e4c8ee" } : {} ,
	        cellEditor: KeyUpEditor,
	    }, {
	        headerName: 'Remark',
	        field: "binBlockRemark",
	        width: 200,
	        flex: 3,
	        editable: true,
	        cellStyle: (params) => params.colDef.editable ? { backgroundColor: "#e4c8ee" } : {} ,
	        cellEditor: KeyUpEditor,
	    }
	];
	
	var gridOptionsBlocckQty = {
	    columnDefs: columnDefsBlockQty,
	    rowSelection: 'single',
	    onSelectionChanged: onRowSelectionBin,
	    groupSelectsChildren: true,
	    suppressRowClickSelection: true,
	    suppressRowClickSelection: true,
	    suppressAggFuncInHeader: true,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 251,
	        height: 10
	    },
	};
	
	let blockid = '';
	function onRowSelection() {
	    var selectedNodes = gridOptions.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    blockid = selectedData.map(node => node.blockId);
	    var rowCount = 0;
	    selectedNodes.forEach(function(selectedNodes, index) {
	        rowCount = rowCount + 1;
	    });
	    
	    let d = selectedNodes[0]?.data;
	    
	    if (rowCount > 0) {
	    	
	    	$("#categoryId").val(d.category_id);
	    	$("#quantity").val(d.quantity);
	    	$("#issue_id").val(d.challan_id);
	    	
	    	getItemList(d.sku_id,'OC');
	    	
	        $('#add').attr("disabled", true);
	        $('#blocking').attr("disabled", true);
	        $('#deleteData').attr("disabled", false);
	        $('#dispatchRequest').attr("disabled", false);
	        
	        $("#categoryId,#itemName,#quantity").attr("disabled", true);

	        if (selectedData.map(node => node.assignStatus) != "Assigned") {
	            $('#dispatchRequest').attr("disabled", false);
	            $('#deleteData').attr("disabled", false);

	        } else {
	            $('#dispatchRequest').attr("disabled", true);
	            $('#deleteData').attr("disabled", true);
	        }

	    } else {
	        $('#add').attr("disabled", false);
	        $('#blocking').attr("disabled", false);
	        $('#deleteData').attr("disabled", true);
	        $('#dispatchRequest').attr("disabled", true);
	        
	        $("#categoryId,#itemName,#quantity").attr("disabled", false);
	        
	    	$("#categoryId").val("");
	        $("#main").empty();
	        $("#itemName").empty();
	        $("#itemName").append("<option value=''>Select</option>");
	        $("#itemName").val("").trigger('change');
	        $("#quantity").val("");
	    	$("#issue_id").val("");

	    }
	}
	
	function getItemList(rtid,t = '') {
	    var categoryId = $("#categoryId").val();
	    if (categoryId) {
	        $.ajax({
	            type: 'GET',
	            url: 'goods-blocking-getitemList?id=' + categoryId,
	            contentType: false,
	            success: function(response) {
	                if (response.code == "success") {
	                    $("#itemName").empty();
	                    var option = $("<option></option>");
	                    $(option).val(null);
	                    $(option).html("Select");
	                    $("#itemName").append(option);
	                    for (var i = 0; i < response.body.length; i++) {
	                        var option = $("<option></option>");
	                        $(option).val(response.body[i].key);
	                        $(option).html(response.body[i].name);
	                        $(option).attr("code", response.body[i].code);
	                        $(option).attr("data", response.body[i].data);
	                        $("#itemName").append(option);
	                    }
	                    if (rtid != "" && rtid != "") {
	                        $("#itemName").val(rtid);
	                        	if(t && $("#warehouseId").val()) {
	                        		getFilterWarehouseData();
	                        	}
	                    }
	                }
	            },
	            error: function(e) {
	                console.log(e);
	            }
	        });
	    }
	}
	
	function getFilterWarehouseData() {

	    if ($("#warehouseId").val() == null || $("#warehouseId").val() == '') {
	        toastr.error("Warehouse required")
	        return;
	    }
	    if ($("#categoryId").val() == null || $("#warehouseId").val() == '') {
	        toastr.error("Category required")
	        return;
	    }
	    if ($("#itemName").val() == null || $("#itemName").val() == '') {
	        toastr.error("Item required")
	        return;
	    }
	    if ($("#quantity").val() == null || $("#quantity").val() == '') {
	        toastr.error("Quantity required")
	        return;
	    }

	    let data = {};

	    data.key = $("#warehouseId").val();
	    data.code = $("#zoneId").val();
	    data.data = $("#rackId").val();
	    data.name = $("#itemName").val();

	    $("#main").empty();

	    $('.loader').show();
	    $("body").addClass("overlay");
	    $.ajax({
	        type: "POST",
	        url: "goods-blocking-get-avl-bin",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data),
	        success: function(response) {
	            if (response.code == "success") {
	                let p = response.body[0];
	                if (p) {
	                    $("#blocking").show();
	                    let dd = JSON.parse(p);
	                    let d = formatToTreeData(dd);
	                    if (d.length > 0) {
	                        let b = '';

	                        d.forEach(a => {

	                            b = b + '<h5 class="sub-header-new">' + a.zone_name + '</h5>';
	                            
	                            a?.bin_details?.forEach(c => {
	                                b = b + '<div class="menu-container"><div class="btn btn-primary edit-btn pd--10 bin-for-all" id="' + c.bin_id + '" data-name="' + c.bin_name + '" data-qty="' + c.qty + '" data-zone="' + c.zone_id + '" data-alloc-id="'+c.alloc_id+'">' + c.bin_name + '(' + c.qty + ')' + '</div>'
	                                	  + '<ul class="menu-list"><li><div onclick=viewStockData("'+c.qty+'","'+c.m_date+'","'+c.e_date+'","'+c.batch_no+'","'+c.sl_no_from+'","'+c.sl_no_to+'")><i title="Details" class="fa fa-info-circle"></i></div></li></ul></div>';
	                            })
	                        })
	                        $("#main").append(b);

	                        $(".bin-for-all").click(function() {
	                            $(this).toggleClass('bin-all-active');
	                        });
	                        
	                        $("#blocking").attr("disabled",false);
	                    }
	                } else {

	                }
	                $('.loader').hide();
	                $("body").removeClass("overlay");
	            } else {
	                $('.loader').hide();
	                $("body").removeClass("overlay");
	            }

	        },
	        error: function(data) {
	            console.log(data);
	            toastr.error("Something went wrong")
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	        }
	    })
	}
	
	function formatToTreeData(data) {
		const groupedData = Object.values(data.reduce((acc, { zone_name, qty, bin_id, bin_name, zone_id, alloc_id, sl_no_from, sl_no_to, batch_no, m_date, e_date }) => {
		    if (!acc[zone_name]) {
		        acc[zone_name] = { zone_name, bin_details: [] };
		    }
		    acc[zone_name].bin_details.push({ qty, bin_id, bin_name, zone_id, alloc_id, sl_no_from, sl_no_to, batch_no, m_date, e_date });
		    return acc;
		}, {}));
		return groupedData;
	}
	
	function getZoneList() {
		let warehouseId = $("#warehouseId").val();
		$("#zoneId").empty();
    	$("#rackId").empty();
    	var option = $("<option></option>");
        $(option).val(null);
        $(option).html("Select");
        $("#zoneId").append(option);
        var option = $("<option></option>");
        $(option).val(null);
        $(option).html("Select");
        $("#rackId").append(option);
	    if (warehouseId) {
	        $.ajax({
	            type: "GET",
	            url: "goods-blocking-getzoneList?id=" + warehouseId,
	            success: function(response) {
	                if (response.code == "success") {
	                    for (var i = 0; i < response.body.length; i++) {
	                        var option = $("<option></option>");
	                        $(option).val(response.body[i].key);
	                        $(option).html(response.body[i].name);
	                        $("#zoneId").append(option);
	                    }
	                }
	            },
	            error: function(e) {
	            	console.log(e)
	            }
	        });
	    }
	}
	function getRackList() {
	    var zoneIdListId = $('#zoneId').val();
	    $("#rackId").empty();
        var option = $("<option></option>");
        $(option).val(null);
        $(option).html("Select");
        $("#rackId").append(option);
	    if (zoneIdListId) {
	        $.ajax({
	            type: "GET",
	            url: "goods-blocking-getrackList?id=" + zoneIdListId,
	            success: function(response) {
	                if (response.code == "success") {
	                    for (var i = 0; i < response.body.length; i++) {
	                        var option = $("<option></option>");
	                        $(option).val(response.body[i].key);
	                        $(option).html(response.body[i].name);
	                        $("#rackId").append(option);
	                    }
	                }
	            },
	            error: function(e) {
	            	console.log(e)
	            }
	        });
	    }
	}
	
	function blockItem(){
		
		let binCount = $(".bin-all-active").length;
		let itemQty = $("#quantity").val();
		let dataset = []
		
		if(itemQty < binCount) {
			toastr.error("Quantity will always be greater than bin")
			return;
		}
		
		if ($("#warehouseId").val() == null || $("#warehouseId").val() == '') {
	        toastr.error("Warehouse required")
	        return;
	    }
	    if ($("#categoryId").val() == null || $("#warehouseId").val() == '') {
	        toastr.error("Category required")
	        return;
	    }
	    if ($("#itemName").val() == null || $("#itemName").val() == '') {
	        toastr.error("Item required")
	        return;
	    }
	    if ($("#quantity").val() == null || $("#quantity").val() == '') {
	        toastr.error("Quantity required")
	        return;
	    }
		
		let i = binCount;
		let q = itemQty;
		let fairShare = Math.floor(q / i);
		$(".bin-all-active").each(function(){
			
			let allocate = Math.min(fairShare, q);
			
			let a = {};
			a.bin_id = $(this).attr('id');
			a.alloc_id = $(this).attr('data-alloc-id');
			a.bin_name = $(this).attr('data-name');
			a.qty = $(this).attr('data-qty');
			a.zone_id = $(this).attr('data-zone');
			a.slNoFrom = 0;
			a.slNoTo = 0;
			a.binBlockRemark = '';
			
			if(allocate > a.qty) {
				a.binQuntity = a.qty;
				q -= a.qty;
			} else {
				a.binQuntity = allocate;
				q -= allocate;
			}
			dataset.push(a)
		})
		
		dataset.forEach(a =>{
			let availableSpace = a.qty - a.binQuntity;
			let extra = Math.min(q, availableSpace);
			a.binQuntity = parseInt(a.binQuntity) + parseInt(extra);
			q -= extra;
		})
		
		if(q > 0) {
			toastr.error("There is "+q+" quantity left, add some more bin to block")
			return;
		}
		
		gridOptionsBlocckQty.api.setRowData(dataset);
		$("#itemDetailsId").show();
		$("#binDetailsId").hide();
		$("#productDetailsId").hide();
		
		$("#blocking,#filterBtn,#warehouseId,#zoneId,#rackId,#categoryId,#itemName,#quantity,#unit").attr("disabled",true);
	}
	
	function cancelBlockSec() {
		gridOptionsBlocckQty.api.setRowData([]);
		$("#itemDetailsId").hide();
		$("#productDetailsId").hide();
		$("#binDetailsId").show();
		$("#remarks").val('');
		$("#blocking,#filterBtn,#warehouseId,#zoneId,#rackId,#categoryId,#itemName,#quantity,#unit").attr("disabled",false);
	}
	
	function saveBlockBin() {
		
		let grnId = $("#issue_id").val() == undefined ? '' : $("#issue_id").val();
		
		let sumBinQty = 0;
		let datas = []
		gridOptionsBlocckQty.api.forEachNode(function(rowNode, indrx) {
	        var obj = {};
	      
	        obj.allocationId = rowNode.data.alloc_id;
	        obj.warehouseId = $("#warehouseId").val();
	        obj.categoryId = $("#categoryId").val();
	        obj.itemName = $("#itemName").val();
	        obj.quantity = $("#quantity").val();
	        obj.remarks = $("#remarks").val();
	        obj.requestId = grnId;
	        obj.binId = rowNode.data.bin_id;
	        obj.zoneId = rowNode.data.zone_id;
	        obj.stockQuntity = rowNode.data.stockQuntity;
	        obj.blockQuntity = parseInt(rowNode.data.binQuntity);
	        obj.slNoFrom = rowNode.data.slNoFrom;
	        obj.slNoTo = rowNode.data.slNoTo;
	        obj.binBlockRemark = rowNode.data.binBlockRemark;
	        sumBinQty = sumBinQty + obj.binQuntity;
	        datas.push(obj);
	      	
	    });
	    
	    let zeroBinQty = datas.filter(a => a.blockQuntity == 0 || a.blockQuntity == '' || a.blockQuntity == undefined);
	    
	    if(zeroBinQty && zeroBinQty.length > 0) {
	    	toastr.error("Bin quantity won't be 0")
			return;
	    }
	    
	    if(sumBinQty > $("#quantity").val()) {
	    	toastr.error("You can't block more than "+$("#quantity").val())
			return;
	    }
	    
	    $('.loader').show();
		$("body").addClass("overlay");
		$.ajax({
		    type: "POST",
		    url: "goods-blocking-submit-blockdetails",
		    contentType: "application/json",
		    data: JSON.stringify(datas),
		    success: function(response) {
		        if (response.code == "success") {
		          	toastr.success("Item blocked successfully");
		            $('.loader').hide();
		            $("body").removeClass("overlay");
		            if(grnId != '' && grnId != null) {
		            	view();
		            }
		            cancelBlockSec();
	            	$("#main").empty();
	            	$("#warehouseId").val('');
	            	$("#categoryId").val('');
	            	$("#issue_id").val('');
	            	$("#quantity").val('');
	            	$("#zoneId").empty();
	            	$("#zoneId").append('<option value="">Select</option>');
	            	$("#rackId").empty();
	            	$("#rackId").append('<option value="">Select</option>');
	            	$("#itemName").empty();
	            	$("#itemName").append('<option value="">Select</option>');
	            	$("#blocking").hide();
		        } else {
		            toastr.error(response.message);
		            $('.loader').hide();
		            $("body").removeClass("overlay");
		        }
		    },
		    error: function(data) {
		        console.log(data);
		        toastr.error("Something went wrong");
		        $('.loader').hide();
		        $("body").removeClass("overlay");
		    }
		})
	}
	
	function onRowSelectionBin() {

	    var selectedRows = gridOptionsBlocckQty.api.getSelectedRows();
	    var rowCount = 0;
	    selectedRows.forEach(function(selectedRow, index) {
	        rowCount = rowCount + 1;
	    });

	    if (rowCount > 0) {
	        $('#deleteBinQty').attr("disabled", false);
	        $('#submit').attr("disabled", true);


	    } else {
	        $('#deleteBinQty').attr("disabled", true);
	        $('#submit').attr("disabled", false);

	    }

	}
	
	function viewStockData(qty,m_date,e_date,batchNo,sl_no_from,sl_no_to) {
		$("#itemDetailsId").hide();
		$("#productDetailsId").show();
		$("#binDetailsId").hide();
		
		$("#stockQty").val(qty)
		
		if(batchNo == null || batchNo == '' || batchNo == undefined || batchNo == 'null')
			batchNo = 'N/A'
			
		if(m_date == null || m_date == '' || m_date == undefined || m_date == 'null')
			m_date = 'N/A';
		else
			m_date = formatDate(m_date);
		
		if(e_date == null || e_date == '' || e_date == undefined || e_date == 'null')
			e_date = 'N/A'
		else
			e_date = formatDate(e_date);
		
		$("#batchNo").val(batchNo)
		$("#serialNo").val(sl_no_from+" - "+sl_no_to)
		$("#manufacturedDate").val(m_date)
		$("#expiredDate").val(e_date)
	}
	
	function formatDate(dt) {
		let d = dt.split("-");
		
		return d[2] + "-" + d[1] + "-" + d[0];
	}
	
	function removeStockDetails() {
		$("#itemDetailsId").hide();
		$("#productDetailsId").hide();
		$("#binDetailsId").show();
		
		$("#stockQty").val('')
		$("#batchNo").val('')
		$("#serialNo").val('')
		$("#manufacturedDate").val('')
		$("#expiredDate").val('')
	}
</script>
