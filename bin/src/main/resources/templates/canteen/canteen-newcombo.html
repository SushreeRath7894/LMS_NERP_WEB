<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  
  <link rel="stylesheet" href="../css/canteen-css/canteen-menu.css">
<script type="text/javascript" src="../javaScript/Canteen/canteen-combo.js"></script>


</head>
<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition mt-3 mb-3">

			<!-- Tab panes -->
			<div class="tab-content">

				<!--Tabbination 1 Start-->
				<div id="canteen" class="tab-pane active mt-5">
					<div class="d-flex flex-column flex-lg-row">

						<div class="col-md-6 pd-r tab-width-css">
							<div class="out-box">
								<div class="row d-flex  mb-20">

									<div class="col-md-10">
										<form class="d-flex search-sec flxwrap">
											<input class="form-control me-2" type="text"
												placeholder="Search">
											<button class="btn btn-primary go-btn" type="button">Go</button>
										</form>
									</div>

									<div class="col-md-2 d-flex justify-content-end">
										<div class="btn btn-primary max-btn">
											<!-- <i class="fas fa-arrow-up"></i>-->
											<i class="fas fa-arrows-alt"></i>
										</div>
									</div>

								</div>
								<div id="myGrid" style="width: 100%; height: 500px;"
									class="ag-theme-alpine"></div>
							</div>
						</div>

						<!--Left Sec End-->

						<!--Right Sec Start-->
						<div class="col-md-6 pd-l">
							<div class="out-box">

								<button class="btn btn-primary max-btn" type="button"
									id="collapseButtonL">
									<i class="fas fa-arrows-alt" id="expandIconL"></i>
									<svg class="d-none" xmlns="http://www.w3.org/2000/svg"
										width="16" height="16" id="shrinkIconL">
										<use href="#shrinkIcon"></use></svg>
								</button>



								<!--Right Inner Tab Start-->
								<ul class="nav nav-pills newtab mb-20" role="tablist">
									<li class="nav-item wd-11"><a class="nav-link active"
										data-bs-toggle="pill" href="#canteenTab"
										onclick="activityTabs('canteen');">Canteen</a></li>
									<li class="nav-item wd-11"><a class="nav-link "
										data-bs-toggle="pill" href="#previewTab"
										onclick="activityTabs('preview');">Preview</a></li>
								</ul>
								<!-- Tab panes -->
								<div class="tab-content">
									<div id="canteenTab" class="tab-pane active show">
										<div class="requisition-tbl ">

											<div class="mb-2">
												<table class="table  mb-0" width="100%">
													<tr valign="middle">
														<td>
															<div class="d-flex justify-content-end">
																<div class="mr-2">
																	<button id="add" class="btn  edit-btn"
																		onclick="newBtn()" type="button">Add</button>
																</div>
																<div class="mr-2">
																	<button id="edit" class="btn  edit-btn" type="button"
																		onclick="editPage()">Edit</button>
																</div>
																<div class="mr-0">
																<button id="next" class="btn  edit-btn"
																	onclick="next()" type="button">Next</button>
															</div>
															
															</div>

														</td>
													</tr>
												</table>
											</div>

											<form>
												<div class="row">
													<input type="hidden" id="comboId">
													<div class="col-md-6">
														<div class="form-group">
															<label>Combo Name</label> <input type="text"
																class="form-control" onclick="clearErrorMessage()"
																id="comboName" placeholder="Item Name"> <span
																id="errmsg_name"></span>
														</div>
													</div>


													<div class="col-md-6" id="searchFilterDiv"
														style="margin-bottom: 10px;">

														<div class="form-group">
															<label>Category</label>
															<div class="select">
																<select id="categry" class="form-control"
																	onchange="getIncentiveStatus()">
																	<option value="">--Select--</option>
																	<option th:each="c,iter:${incentivedetails}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select> <span id="errmsg_name"></span>
															</div>

														</div>
													</div>



													<div class="col-md-6">
														<div class="form-group">
															<label>Sub Category</label>
															<div class="select">
																<select id="subcategry" class="form-control"
																	onchange="getIncentiveStatus()">
																	<option value="">--Select--</option>
																	<option th:each="c,iter:${clubMemberDetails}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select> <span id="errmsg_name"></span>
															</div>

														</div>
													</div>


													<div class="col-md-6">
														<div class="form-group">
															<label>Variant</label>
															<div class="select">
																<select id="variant" class="form-control"
																	onchange="getIncentiveStatus()">
																	<option value="">--Select--</option>
																	<option th:each="c,iter:${variantDetails}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select> <span id="errmsg_name"></span>
															</div>

														</div>
													</div>
													<div class="col-md-6">
														<div id="myGrid2" style="width: 200%; height: 300px;"
															class="ag-theme-alpine"></div>
													</div>
												</div>
											</form>
										</div>
									</div>
									<div id="previewTab" class="tab-pane fade">
										<div class="mb-2">
											<table class="table  mb-0" width="100%">
												<tr valign="middle">
													<td>
														<div class="d-flex justify-content-end">
															<div class="mr-2">
																<button id="prev" class="btn  edit-btn" onclick="prev()"
																	type="button">Prev</button>
															</div>
															
																<div class="mr-0">
																	<button id="next" class="btn  edit-btn"
																		onclick="saveTableData()" type="button">Save</button>
																</div>
														</div>
													</td>
												</tr>
											</table>
										</div>

										<div class="row form-top" id="preview">
											<div class="col-md-6">
												<div class="form-group">
													<label>All Price</label> <input type="text"
														class="form-control" id="allPrice" placeholder="All Price">
													<span id="errmsg_price"></span>
												</div>
											</div>

											<div class="col-md-12 mb-4">
												<div id="myGrid1" style="width: 100%; height: 200px;"
													class="ag-theme-alpine"></div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- shrink svg icon begins here -->
	<svg class="d-none" xmlns="http://www.w3.org/2000/svg" width="512"
		height="512" version="1.1">
    <symbol id="shrinkIcon" viewBox="0 0 512 512">
      <g style="fill: #ffffff;">
        <path
			d="M200 288H88c-21.4 0-32.1 25.8-17 41l32.9 31-99.2 99.3c-6.2 6.2-6.2 16.4 0 22.6l25.4 25.4c6.2 6.2 16.4 6.2 22.6 0L152 408l31.1 33c15.1 15.1 40.9 4.4 40.9-17V312c0-13.3-10.7-24-24-24zm112-64h112c21.4 0 32.1-25.9 17-41l-33-31 99.3-99.3c6.2-6.2 6.2-16.4 0-22.6L481.9 4.7c-6.2-6.2-16.4-6.2-22.6 0L360 104l-31.1-33C313.8 55.9 288 66.6 288 88v112c0 13.3 10.7 24 24 24zm96 136l33-31.1c15.1-15.1 4.4-40.9-17-40.9H312c-13.3 0-24 10.7-24 24v112c0 21.4 25.9 32.1 41 17l31-32.9 99.3 99.3c6.2 6.2 16.4 6.2 22.6 0l25.4-25.4c6.2-6.2 6.2-16.4 0-22.6L408 360zM183 71.1L152 104 52.7 4.7c-6.2-6.2-16.4-6.2-22.6 0L4.7 30.1c-6.2 6.2-6.2 16.4 0 22.6L104 152l-33 31.1C55.9 198.2 66.6 224 88 224h112c13.3 0 24-10.7 24-24V88c0-21.3-25.9-32-41-16.9z" />
      </g>
    </symbol>
  </svg>


</body>
</html>
