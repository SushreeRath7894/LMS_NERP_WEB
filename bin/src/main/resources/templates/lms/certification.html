    function navigateQuestion(direction) {
        // Save current answer if subjective
        if (examPhase === 'subjective') {
            const answer = $('#subjectiveAnswer').val();
            answers[currentQuestionIndex] = { answer: answer };
        }
        
        const newIndex = currentQuestionIndex + direction;
        
        if (newIndex < 0) return;
        
        if (examPhase === 'objective' && newIndex >= currentExam.objectiveQuestions.length) {
            // Switch to subjective questions
            examPhase = 'subjective';
            currentQuestionIndex = 0;
        } else if (examPhase === 'subjective' && newIndex >= currentExam.subjectiveQuestions.length) {
            // Submit exam
            submitExam();
            return;
        } else {
            currentQuestionIndex = newIndex;
        }
        
        displayExamQuestion();
    }

    function isLastQuestion() {
        if (examPhase === 'objective') {
            return currentQuestionIndex === currentExam.objectiveQuestions.length - 1 && 
                   currentExam.subjectiveQuestions.length === 0;
        } else {
            return currentQuestionIndex === currentExam.subjectiveQuestions.length - 1;
        }
    }

                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded">
                                <h6>Correct Answers</h6>
                                <p class="mb-0 display-6 text-success">${correctAnswers}/${totalQuestions}</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded">
                                <h6>Passing Score</h6>
                                <p class="mb-0 display-6">${currentExam.passingScore}%</p>
                            </div>
                        </div>
                    </div>
                    
                    ${passed ? `
                    <div class="alert alert-success">
                        <h5><i class="fas fa-trophy me-2"></i> Certificate Earned!</h5>
                        <p class="mb-0">You've earned a certificate for this course. You can download it now or access it later from your profile.</p>
                    </div>
                    <button class="btn btn-primary me-2" onclick="downloadCertificate()">
                        <i class="fas fa-download me-1"></i> Download Certificate
                    </button>
                    ` : `
                    <div class="alert alert-danger">
                        <h5><i class="fas fa-exclamation-circle me-2"></i> Not Quite There Yet</h5>
                        <p class="mb-0">You need ${currentExam.passingScore}% to pass. Review the course material and try again.</p>
                    </div>
                    `}
                    
                    <button class="btn btn-outline-secondary mt-3" onclick="reviewExam()">
                        <i class="fas fa-book-open me-1"></i> Review Exam
                    </button>
                </div>
            </div>
        `);
        
        // If passed and no certificate exists, create one
        if (passed && (!currentCert.earnedCertificates || currentCert.earnedCertificates.length === 0)) {
            const today = new Date().toISOString().split('T')[0];
            currentCert.earnedCertificates = [{
                id: `CERT-${currentCert.id}-${today.replace(/-/g, '')}-${Math.floor(1000 + Math.random() * 9000)}`,
                dateEarned: today,
                score: score,
                validity: "Lifetime",
                downloadUrl: "#"
            }];
        }
        
        // Refresh certification details to show certificate section
        displayCertificationDetails(currentCert);
    }

    function downloadCertificate() {
        alert('Certificate download started!');
        // In a real app, this would generate and download a PDF
    }

    function reviewExam() {
        currentQuestionIndex = 0;
        examPhase = 'objective';
        displayExamQuestion();
    }

    function shareCertificate() {
        alert('Sharing certificate...');
        // In a real app, this would integrate with social media sharing APIs
    }

    function toggleCertificatePreview() {
        const previewDiv = $('#certificatePreview');
        const button = $('button:contains("Preview Certificate"), button:contains("Hide Certificate")');
        if (previewDiv.hasClass('d-none')) {
            previewDiv.removeClass('d-none');
            button.html('<i class="fas fa-eye-slash me-1"></i> Hide Certificate');
        } else {
            previewDiv.addClass('d-none');
            button.html('<i class="fas fa-eye me-1"></i> Preview Certificate');
        }
    }
    
    function earnedCertifications() {
        if ($("#earnedCertificate").hasClass('d-none')) {
            $("#earnedCertificate").removeClass('d-none');
            $(".certificate-dtls").addClass('d-none');
            
            
        } else {
            // Hide earnedCertificate and show certificate-dtls
            $("#earnedCertificate").addClass('d-none');
            $(".certificate-dtls").removeClass('d-none');
            $("#certificatePreview").addClass('d-none');
        }
    }

    </script>
</head>
