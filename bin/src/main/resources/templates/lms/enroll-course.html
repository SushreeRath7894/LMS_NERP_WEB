<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<title>Enrolled Courses</title>
<style>
:root {
	--primary-color: #3498db;
	--secondary-color: #2c3e50;
	--accent-color: #e74c3c;
	--light-color: #ecf0f1;
	--dark-color: #2c3e50;
}

.courses-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
	gap: 8px;
	margin-top: 7px;
}

.course-card {
	background: white;
	border-radius: 6px;
	padding: 20px;
	border: 1px solid #715ab8;
	position: relative;
	overflow: hidden;
}

.course-content {
	display: flex;
	gap: 25px;
}

.course-image {
	flex-shrink: 0;
	width: 200px;
	height: 140px;
	border-radius: 12px;
	overflow: hidden;
	position: relative;
}

.course-image img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

.course-details {
	flex: 1;
	display: flex;
	flex-direction: column;
}

.category-badge {
	display: inline-block;
	background: #e3f2fd;
	color: #1976d2;
	padding: 6px 12px;
	border-radius: 20px;
	font-size: 0.8rem;
	font-weight: 500;
	margin-bottom: 10px;
	width: fit-content;
}

.course-title {
	font-size: 1.5rem;
	font-weight: 700;
	color: #2c3e50;
	margin-bottom: 15px;
	line-height: 1.3;
}

.instructor {
	display: flex;
	align-items: center;
	gap: 10px;
	margin-bottom: 11px;
}

.instructor-avatar {
	width: 35px;
	height: 35px;
	border-radius: 50%;
	background: linear-gradient(45deg, #667eea, #764ba2);
	display: flex;
	align-items: center;
	justify-content: center;
	color: white;
	font-weight: 600;
	font-size: 0.9rem;
}

.instructor-name {
	color: #7f8c8d;
	font-weight: 500;
}

.rating {
	display: flex;
	align-items: center;
	gap: 8px;
	margin-left: auto;
}

.star {
	color: #ffd700;
	font-size: 1.2rem;
}

.rating-score {
	font-weight: 600;
	margin-top: 6px;
	color: #2c3e50;
}

.progress-section {
	margin: 15px 0;
}

.progress-label {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 8px;
}

.complete-text {
	color: #7f8c8d;
	font-weight: 500;
	font-size: 0.9rem;
}

.progress-percentage {
	font-weight: 600;
	color: #27ae60;
}

.progress-bar {
	width: 100%;
	height: 8px;
	background: #ecf0f1;
	border-radius: 10px;
	overflow: hidden;
}

.progress-fill {
	height: 100%;
	background: linear-gradient(90deg, #27ae60, #2ecc71);
	border-radius: 10px;
	transition: width 0.3s ease;
}

.course-stats {
	display: flex;
	gap: 20px;
}

.stat {
	display: flex;
	align-items: center;
	gap: 6px;
	color: #7f8c8d;
	font-size: 0.9rem;
}

.stat-icon {
	width: 16px;
	height: 16px;
	opacity: 0.7;
}

.continue-btn {
	background: linear-gradient(45deg, #667eea, #764ba2);
	color: white;
	border: none;
	padding: 12px 24px;
	border-radius: 25px;
	font-weight: 600;
	cursor: pointer;
	transition: all 0.3s ease;
	align-self: flex-start;
}

.continue-btn:hover {
	transform: translateY(-2px);
	box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

@media ( max-width : 768px) {
	.courses-grid {
		grid-template-columns: 1fr;
	}
	.course-content {
		flex-direction: column;
	}
	.course-image {
		width: 100%;
		height: 180px;
	}
}

.certification-header {
	background: #6d6ace;
	color: white;
	border-radius: 10px;
	padding: 1rem;
	margin-bottom: 2rem;
}

.certification-title {
	font-weight: 700;
	margin-bottom: 0.5rem;
}

.certification-subtitle {
	font-weight: 300;
	opacity: 0.9;
}

.progress-container {
	background-color: white;
	border-radius: 10px;
	padding: 1.5rem;
	box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
	margin-bottom: 2rem;
}

.bg-active-badge {
	background-color: rgb(0, 152, 63); font-size : 12px; font-weight : 500;
	color : rgb( 255 255 255); line-height : 16px; padding : 3px 8px;
	border-style: solid;
	border-width: 1px;
	border-color: rgb(171, 239, 198);
	opacity: 1;
	border-radius: 10px;
	font-size: 12px;
	font-weight: 500;
	color: rgb(255, 255, 255);
	line-height: 16px;
	padding: 3px 8px;
}

.progress-bar {
	background-color: #05318a;
	height: 10px;
	border-radius: 5px;
}

.progress {
	height: unset;
}

.module-card {
	border: 1px solid #b6b3ff;
	border-radius: 10px;
	overflow: hidden;
	margin-bottom: 8px;
}

.module-header {
	background-color: #ccc;
	color: white;
	padding: 1rem 1.5rem;
	cursor: pointer;
}

.module-header h5 {
	color: #6d6ace;
	font-size: 17px;
}

.module-header i {
	color: #6d6ace;
	font-size: 17px;
}

.module-header.collapsed {
	background-color: #f8f9fa;
	color: var(--dark-color);
	border-bottom: 1px solid #eee;
}

.module-body {
	padding: 0;
}

.lesson-item {
	padding: 1rem 1.5rem;
	border-bottom: 1px solid #eee;
	display: flex;
	align-items: center;
	transition: background-color 0.2s ease;
}

.lesson-item:last-child {
	border-bottom: none;
}

.lesson-icon {
	width: 40px;
	height: 40px;
	border-radius: 50%;
	background-color: var(--light-color);
	display: flex;
	align-items: center;
	justify-content: center;
	margin-right: 1rem;
	color: var(--primary-color);
	flex-shrink: 0;
}

.lesson-completed .lesson-icon {
	background-color: #d4edda;
	color: #28a745;
}

.lesson-info {
	flex-grow: 1;
}

.lesson-title {
	font-weight: 600;
	margin-bottom: 0.2rem;
}

.lesson-duration {
	font-size: 0.85rem;
	color: #6c757d;
}

.lesson-status {
	margin-left: 1rem;
	font-size: 0.9rem;
	font-weight: 500;
}

.lesson-action-btn {
	background: linear-gradient(45deg, #667eea, #764ba2);
	color: white;
	border: none;
	padding: 8px 16px;
	border-radius: 20px;
	font-weight: 500;
	cursor: pointer;
	transition: all 0.3s ease;
}

.lesson-completed .lesson-action-btn {
	background: #6c757d;
	cursor: default;
}

.lesson-action-btn:hover {
	transform: translateY(-2px);
	box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
}

.btn-start-certification {
	background-color: var(--accent-color);
	border: none;
	padding: 0.8rem 2rem;
	font-weight: 600;
	letter-spacing: 0.5px;
	transition: all 0.3s ease;
}

.btn-start-certification:hover {
	background-color: #c0392b;
	transform: translateY(-2px);
	box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
}

.certification-badge {
	width: 80px;
	height: 80px;
	background-color: var(--primary-color);
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	color: white;
	font-size: 2rem;
	margin-right: 1.5rem;
	flex-shrink: 0;
}

.prerequisites-card {
	background-color: #ffffff;
	border-left: 4px solid #6d6ace;
	border-radius: 5px;
	padding: 1rem;
	margin-bottom: 1.5rem;
}

@media ( max-width : 768px) {
	.certification-badge {
		width: 60px;
		height: 60px;
		font-size: 1.5rem;
		margin-right: 1rem;
	}
	.certification-header {
		padding: 1.5rem;
	}
}

#cancelBtn {
	background-color: transparent;
	color: #fff;
	font-size: 33px;
	padding: 0;
	margin: 0;
	line-height: 1;
}

.navbar {
	margin-left: 0 !important;
}

.topbar {
	height: 70px;
	background-color: white;
	z-index: 10;
}

/* Modal Styles */
.modal-fullscreen {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(0, 0, 0, 0.9);
	z-index: 1050;
	display: none;
	align-items: center;
	justify-content: center;
	overflow-y: auto;
}

.modal-content {
	background: white;
	width: 90%;
	max-width: 800px;
	border-radius: 10px;
	padding: 20px;
	position: relative;
	max-height: 90vh;
	display: flex;
	flex-direction: column;
}

.modal-close {
	position: absolute;
	top: 10px;
	right: 20px;
	font-size: 1.5rem;
	cursor: pointer;
	color: #333;
	z-index: 99999;
}

.modal-body {
	padding: 20px;
	max-height: 80vh;
	overflow-y: auto;
}

.modal-body video {
	width: 100%;
	max-height: 400px;
	border-radius: 10px;
}

.modal-body .quiz-container {
	margin-top: 20px;
}

.quiz-question {
	margin-bottom: 20px;
}

.quiz-question h6 {
	font-weight: 600;
	margin-bottom: 10px;
}

.quiz-option {
	margin-bottom: 10px;
}

.quiz-option input {
	margin-right: 10px;
}

.submit-quiz-btn {
	background: linear-gradient(45deg, #667eea, #764ba2);
	color: white;
	border: none;
	padding: 10px 20px;
	border-radius: 20px;
	font-weight: 600;
	cursor: pointer;
	float: right;
}

.submit-quiz-btn:hover {
	transform: translateY(-2px);
	box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
}

.lesson-completed .lesson-icon {
    background-color: #4CAF50 !important; /* Green background for completed */
    color: white !important; /* White icon for better contrast */
    box-shadow: 0 2px 5px rgba(76, 175, 80, 0.3);
}

/* Ensure the checkmark is visible and styled correctly */
.lesson-completed .lesson-icon .fa-check {
    display: block !important;
    color: white !important;
}

/* Hide the original icon when lesson is completed */
.lesson-completed .lesson-icon i:not(.fa-check) {
    display: none !important;
}
</style>
<script type="text/javascript">
        // Store completed lessons per course
        let courseProgress = {};
        let currentCourseId = null;

        $('.loader').show();
        agGrid.simpleHttpRequest({
            url: 'enroll-course-view'
        }).then(function(response) {
            var jsonData = JSON.parse(response.body);
            var enrollCourses = jsonData.enrollCourses;

            var baseUrl = "https://healthcare-nirmalya.nerp.in/";
            const courses = enrollCourses.map(item => ({
                id: item.courseId,
                title: item.courseName || 'Untitled Course',
                category: item.courseCatg || 'Uncategorized',
                instructor: item.enrollBy || 'Unknown Instructor',
                rating: item.rating || '0.0',
                progress: item.progress || '0',
                lessons: item.lessons || '0',
                duration: item.duration || 'N/A',
                certificates: item.certificates || '0',
                desc: item.desc || 'N/A',
                image: item.image ? item.image : 'https://via.placeholder.com/400x280?text=No+Image'
            }));

            loadCourses(courses);
            $('.loader').hide();
        });

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('');
        }

        function createCourseCard(course) {
            const progressColor = course.progress > 0 ? '#27ae60' : '#ecf0f1';
            
            return `
                <div class="course-card">
                    <div class="course-content">
                        <div class="course-image">
                            <img src="${course.image}" alt="${course.title}">
                        </div>
                        <div class="course-details">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <span class="category-badge">${course.category}</span>
                                <div class="rating">
                                    <span class="star">★</span>
                                    <span class="rating-score">${course.rating}</span>
                                </div>
                            </div>
                            <h3 class="course-title">${course.title}</h3>
                            <p class="certification-subtitle">${course.desc}.</p>
                            <div class="d-flex justify-content-between align-items-center" style="border-top: 1px solid #f0f0f0; padding-block: 1rem;">
                                <div class="course-stats">
                                    <div class="stat">
                                        <svg class="stat-icon" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                        </svg>
                                        <span>${course.duration}</span>
                                    </div>
                                    <div class="stat">
                                        <svg class="stat-icon" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                        </svg>
                                        <span>${course.certificates} Certificates</span>
                                    </div>
                                </div>
                                <button class="continue-btn" onclick="continueCourse('${course.id}', '${course.title}', '${course.desc}')">
                                    ${course.progress > 0 ? 'Continue Learning' : 'Start Learning'}
                                </button>
                            </div>
                            <input type="hidden" class="course-desc" value="${course.desc}">
                        </div>
                    </div>
                </div>
            `;
        }

        function loadCourses(courses) {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = courses.map(course => createCourseCard(course)).join('');
        }

        function continueCourse(courseId, courseName, desc) {
            $("#modulesDiv").removeClass("d-none");
            $("#coursesContainer").addClass("d-none");
            document.getElementById('courseTitle').innerText = courseName;
            document.getElementById('courseName').innerText = courseName;
            document.getElementById('courseSubtitle').innerText = desc;
            currentCourseId = courseId;

            // Initialize progress tracking for this course if not already done
            if (!courseProgress[courseId]) {
                courseProgress[courseId] = {
                    completedLessons: new Set(),
                    totalLessons: 0
                };
            }

            const moduleHeader = document.querySelector("#module1Header");
            if (moduleHeader) {
                moduleHeader.querySelector("h3").innerText = courseName;
                moduleHeader.querySelector("p").innerText = desc;
            }

            loadCourseData(courseId);
        }

        function loadCourseData(courseId) {
            $.ajax({
                type: "GET",
                url: "/academic/get-course-details?courseId=" + courseId,
                async: true,
                success: function(response) {
                    if (response.code === "success") {
                        const bodyArray = JSON.parse(response.body);
                        const courseDetails = JSON.parse(bodyArray[0].courseContent);
                        $("#certificationModules").empty();
                        $("#certificationModules").append('<h5 class="mb-4">Certification Curriculum</h5>');

                        // Count total lessons for progress calculation
                        courseProgress[courseId].totalLessons = courseDetails.modules.reduce((sum, module) => sum + module.lessons.length, 0);
                        updateProgressBar(courseId);

                        courseDetails.modules.forEach((module, index) => {
                            let totalDuration = 0;
                            const lessonCount = module.lessons.length;
                            const collapseId = `module${index + 1}`;

                            let moduleHtml = `
                                <div class="card module-card">
                                    <div class="module-header d-flex justify-content-between align-items-center collapsed"
                                         data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                                        <div>
                                            <h5 class="mb-0">${module.title}</h5>
                                            <small class="text-muted">${lessonCount} Lesson${lessonCount !== 1 ? 's' : ''} | ${calculateModuleDuration(module)}</small>
                                        </div>
                                        <i class="fas fa-chevron-down"></i>
                                    </div>
                                    <div id="${collapseId}" class="collapse module-body">
                            `;

                            if (module.lessons.length > 0) {
                                module.lessons.forEach((lesson, lessonIndex) => {
                                    const lessonIcon = lesson.type === 'video' ? 'fa-play-circle' : 
                                                     lesson.type === 'text' ? 'fa-file-alt' : 
                                                     lesson.quiz && lesson.quiz.questions.length > 0 ? 'fa-question-circle' : 'fa-file-alt';
                                    const lessonDuration = lesson.type === 'video' ? '30 minutes' : 
                                                         lesson.type === 'text' ? '25 minutes' : 
                                                         '20 minutes';
                                    const buttonText = lesson.type === 'video' ? 'Watch' : 
                                                     lesson.type === 'text' ? 'Read' : 
                                                     lesson.quiz && lesson.quiz.questions.length > 0 ? 'Start Quiz' : 'View';
                                    const isCompleted = courseProgress[courseId].completedLessons.has(`${index}-${lessonIndex}`);
                                    
                                    moduleHtml += `
                                        <div class="lesson-item ${isCompleted ? 'lesson-completed' : ''}">
                                            <div class="lesson-icon">
                                                <i class="fas ${lessonIcon}" ${isCompleted ? 'style="display:none;"' : ''}></i>
                                                ${isCompleted ? '<i class="fas fa-check" style="display:block;color:white;"></i>' : ''}
                                            </div>
                                            <div class="lesson-info">
                                                <div class="lesson-title">${lesson.title}</div>
                                                <div class="lesson-duration">${lessonDuration}</div>
                                            </div>
                                            <div class="lesson-status text-muted">
                                                ${isCompleted ? 
                                                    '<span class="text-success">Completed</span>' : 
                                                    `<button class="lesson-action-btn" onclick='openLessonModal(${JSON.stringify(lesson)}, "${lesson.type}", ${lessonIndex}, "${collapseId}", "${courseId}", ${index})'>${buttonText}</button>`
                                                }
                                            </div>
                                        </div>
                                    `;
                                });
                            } else {
                                moduleHtml += `
                                    <div class="lesson-item">
                                        <div class="lesson-info">
                                            <div class="lesson-title">No lessons available for this module.</div>
                                        </div>
                                    </div>
                                `;
                            }

                            moduleHtml += `
                                    </div>
                                </div>
                            `;
                            $("#certificationModules").append(moduleHtml);
                        });
                    }
                },
                error: function(xhr, status, error) {
                    console.error("Error fetching course details:", error);
                }
            });
        }

        function calculateModuleDuration(module) {
            let totalMinutes = 0;
            module.lessons.forEach(lesson => {
                if (lesson.type === 'video') totalMinutes += 30;
                else if (lesson.type === 'text') totalMinutes += 25;
                else if (lesson.quiz && lesson.quiz.questions.length > 0) totalMinutes += 20;
            });

            if (totalMinutes === 0) return '0 minutes';
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return `${hours > 0 ? hours + 'h ' : ''}${minutes > 0 ? minutes + 'min' : ''}`.trim();
        }

        function updateProgressBar(courseId) {
            if (!courseId || !courseProgress[courseId]) return;
            
            const progressData = courseProgress[courseId];
            const progressPercentage = progressData.totalLessons > 0 ? 
                (progressData.completedLessons.size / progressData.totalLessons) * 100 : 0;
            
            const progressBar = document.querySelector('.progress-bar');
            const progressText = document.querySelector('.progress-container .fw-bold');
            
            progressBar.style.width = `${progressPercentage}%`;
            progressText.textContent = `${Math.round(progressPercentage)}% Completed`;
        }

        function markLessonComplete(courseId, moduleIndex, lessonIndex) {
            if (!courseProgress[courseId]) {
                courseProgress[courseId] = {
                    completedLessons: new Set(),
                    totalLessons: 0
                };
            }
            
            const lessonKey = `${moduleIndex}-${lessonIndex}`;
            if (!courseProgress[courseId].completedLessons.has(lessonKey)) {
                courseProgress[courseId].completedLessons.add(lessonKey);
                updateProgressBar(courseId);
                
                // Find and update the lesson item in the UI
                const lessonItems = document.querySelectorAll('.lesson-item');
                lessonItems.forEach(item => {
                    const btn = item.querySelector('.lesson-action-btn');
                    if (btn && btn.onclick.toString().includes(`"${lessonIndex}"`) && 
                        btn.onclick.toString().includes(`${moduleIndex}`)) {
                        
                        // Add completed class to lesson-item
                        item.classList.add('lesson-completed');
                        
                        // Add completed class to lesson-icon
                        const lessonIcon = item.querySelector('.lesson-icon');
                        if (lessonIcon) {
                            lessonIcon.classList.add('lesson-completed');
                            
                            // Remove any existing checkmark
                            const existingCheck = lessonIcon.querySelector('.fa-check');
                            if (existingCheck) {
                                existingCheck.remove();
                            }
                            
                            // Hide the original icon
                            const originalIcon = lessonIcon.querySelector('i:not(.fa-check)');
                            if (originalIcon) {
                                originalIcon.style.display = 'none';
                            }
                            
                            // Add the checkmark icon
                            const checkIcon = document.createElement('i');
                            checkIcon.className = 'fas fa-check';
                            checkIcon.style.display = 'block';
                            checkIcon.style.color = 'white';
                            lessonIcon.appendChild(checkIcon);
                        }
                        
                        // Replace the action button with "Completed" text
                        const lessonStatus = item.querySelector('.lesson-status');
                        if (lessonStatus) {
                            lessonStatus.innerHTML = '<span class="text-success">Completed</span>';
                        }
                    }
                });
            }
        }

        function openLessonModal(lesson, type, lessonIndex, moduleId, courseId, moduleIndex) {
            const modal = document.getElementById('lessonModal');
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '';

            const isCompleted = courseProgress[courseId]?.completedLessons?.has(`${moduleIndex}-${lessonIndex}`);

            if (isCompleted) {
                // If lesson is already completed, just show the content without completion option
                modalBody.innerHTML = `
                    <div style="padding: 20px;">
                        <h3 style="margin-bottom: 20px;">${lesson.title} <span class="badge bg-active-badge" style="width: 78px; display: inline-block; text-align: center;">Completed</span></h3>
                        ${getLessonContent(lesson, type)}
                        <button class="submit-quiz-btn" style="margin-top: 20px;" onclick="closeModal()">
                            Close
                        </button>
                    </div>
                `;
            } else {
                // If lesson is not completed, show content with completion option
                modalBody.innerHTML = `
                    <div style="padding: 20px;">
                        <h3 style="margin-bottom: 20px;">${lesson.title}</h3>
                        ${getLessonContent(lesson, type)}
                        ${type !== 'quiz' ? `
                            <button class="submit-quiz-btn" style="margin-top: 20px;" 
                                    onclick="markLessonComplete('${courseId}', ${moduleIndex}, ${lessonIndex}); closeModal()">
                                Mark as Complete
                            </button>
                        ` : ''}
                    </div>
                `;
            }

            modal.style.display = 'flex';
        }

        function getLessonContent(lesson, type) {
            if (type === 'text') {
                return `
                    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
                        ${lesson.content || '<p>No content available for this lesson.</p>'}
                    </div>
                `;
            } else if (type === 'video') {
                return `
                    <video controls style="width: 100%; max-height: 400px; border-radius: 8px;" 
                           onended="document.querySelector('.submit-quiz-btn').click()">
                        <source src="${lesson.url || ''}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else if (lesson.quiz && lesson.quiz.questions.length > 0) {
                let quizHtml = `
                    <div class="quiz-container" style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
                `;
                
                lesson.quiz.questions.forEach((question, qIndex) => {
                    quizHtml += `
                        <div class="quiz-question" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
                            <h6 style="font-weight: 600; margin-bottom: 10px;">${qIndex + 1}. ${question.text}</h6>
                            ${question.options.map((option, oIndex) => `
                                <div class="quiz-option" style="margin-bottom: 8px; display: flex; align-items: center;">
                                    <input type="radio" name="question${qIndex}" value="${oIndex}" 
                                           style="margin-right: 10px; width: 16px; height: 16px;">
                                    <label style="cursor: pointer;">${option}</label>
                                </div>
                            `).join('')}
                        </div>
                    `;
                });
                
                quizHtml += `
                        <button class="submit-quiz-btn" 
                                style="background: linear-gradient(45deg, #667eea, #764ba2); 
                                       color: white; border: none; padding: 10px 20px; 
                                       border-radius: 20px; font-weight: 600; cursor: pointer;"
                                onclick="submitQuiz(${JSON.stringify(lesson.quiz)}, ${lessonIndex}, '${moduleId}', '${courseId}', ${moduleIndex})">
                            Submit Quiz
                        </button>
                    </div>
                `;
                
                return quizHtml;
            } else {
                return `
                    <p>No content available for this lesson.</p>
                `;
            }
        }

        function submitQuiz(quiz, lessonIndex, moduleId, courseId, moduleIndex) {
            let score = 0;
            quiz.questions.forEach((question, qIndex) => {
                const selectedOption = document.querySelector(`input[name="question${qIndex}"]:checked`);
                if (selectedOption && parseInt(selectedOption.value) === question.correctAnswer) {
                    score++;
                }
            });
            
            const percentage = Math.round((score / quiz.questions.length) * 100);
            if (percentage >= 70) { // Only mark complete if score is 70% or higher
                markLessonComplete(courseId, moduleIndex, lessonIndex);
                alert(`Quiz passed! Your score: ${score}/${quiz.questions.length} (${percentage}%)`);
            } else {
                alert(`Quiz score: ${score}/${quiz.questions.length} (${percentage}%). You need at least 70% to pass. Please try again.`);
                return; // Don't close modal if quiz wasn't passed
            }
            
            closeModal();
        }

        function closeModal() {
            document.getElementById('lessonModal').style.display = 'none';
        }

        function cancelBtn() {
            $("#modulesDiv").addClass("d-none");
            $("#coursesContainer").removeClass("d-none");
            currentCourseId = null;
        }

        document.addEventListener('DOMContentLoaded', loadCourses);
    </script>
</head>
<body>
	<div layout:fragment="content" class="container-fluid">
		<nav class="navbar topbar mb-2 sticky-top bg-white">
			<div class="container-fluid">
				<button class="btn d-md-none me-3" id="sidebarToggle">
					<i class="fas fa-bars"></i>
				</button>
				<h5 class="mb-0 fw-bold">Learnings</h5>
			</div>
		</nav>

		<div class="courses-grid" id="coursesContainer">
			<!-- Courses will be dynamically loaded here -->
		</div>

		<div class="container-fluid d-none" id="modulesDiv">
			<div class="certification-header mt-2" id="module1Header">
				<div class="d-flex align-items-center position-relative">
					<div>
						<h3 class="certification-title" id="courseTitle">Advanced
							JavaScript Certification</h3>
						<p class="certification-subtitle" id="courseSubtitle">Master
							advanced JavaScript concepts and earn your certification</p>
					</div>
					<button class="btn edit-btn position-absolute end-0 top-0"
						id="cancelBtn" type="button" onclick="cancelBtn()">
						<i class="fa-solid fa-xmark"></i>
					</button>
				</div>
			</div>

			<div class="progress-container">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h5 class="mb-0">Your Progress</h5>
					<span class="fw-bold">0% Completed</span>
				</div>
				<div class="progress">
					<div class="progress-bar" role="progressbar" style="width: 0%;"
						aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
				</div>
			</div>

			<div class="prerequisites-card">
				<h5>Prerequisites</h5>
				<p class="mb-0">
					Before starting this certification, you should complete the basics
					Of <span id="courseName"></span> or have equivalent knowledge.
				</p>
			</div>

			<div id="certificationModules">
				<h5 class="mb-4">Certification Curriculum</h5>
			</div>
		</div>

		<!-- Fullscreen Modal -->
		<div class="modal-fullscreen" id="lessonModal">
			<div class="modal-content">
				<span class="modal-close" onclick="closeModal()">×</span>
				<div class="modal-body" id="modalBody" style="margin-top: 33px;">
					<!-- Lesson content will be loaded here -->
				</div>
			</div>
		</div>
	</div>
</body>
</html>
