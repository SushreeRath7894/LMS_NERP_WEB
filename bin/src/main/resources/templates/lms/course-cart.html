<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nlms - Premium Learning Management System</title>

<!-- Font Awesome -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<!-- Custom CSS -->
<style>
/* Base Styles */
.cart-item-table {
	width: 100%;
	border-collapse: separate;
	border-spacing: 0 1rem;
}

.cart-item-table th {
	font-weight: 600;
	color: var(--dark-color);
	padding: 1rem;
	text-align: left;
}

.cart-item-table td {
	padding: 1rem;
	vertical-align: middle;
}

.course-cart-items {
	background-color: #e2e2e2;
	border-radius: 10px;
	margin: 10px 0px;
}

.fa-trash-alt {
	color: grey
}

.course-cart-items:hover .btn-remove i {
	color: red;
}

.cart-item-img {
	width: 80px;
	height: 80px;
	object-fit: cover;
	border-radius: 5px;
}

.cart-item-details h6 {
	font-size: 1rem;
	margin-bottom: 0.25rem;
}

.cart-item-details p {
	font-size: 0.875rem;
	color: #817e7e;
	margin-bottom: 0;
}

.quantity-control {
	display: flex;
	align-items: center;
}

.quantity-btn {
	width: 30px;
	height: 30px;
	background-color: var(--primary-light);
	border: none;
	border-radius: 50%;
	color: var(--primary-color);
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 0.875rem;
	transition: all 0.3s ease;
}

.quantity-btn:hover {
	background-color: var(--primary-color);
	color: white;
}

.quantity-input {
	width: 50px;
	text-align: center;
	border: none;
	background: transparent;
	font-weight: 500;
	color: var(--dark-color);
}

.cart-item-remove-btn {
	background: none;
	border: none;
	color: var(--gray-color);
	font-size: 1rem;
	transition: all 0.3s ease;
}

.cart-item-remove-btn:hover {
	color: var(--danger-color);
}

.cart-summary {
	background-color: var(--light-gray);
	border-radius: 10px;
	padding: 2rem;
}

.cart-total {
	display: flex;
	justify-content: space-between;
	margin-bottom: 1rem;
	font-weight: 600;
}

/* Responsive Styles */
@media ( max-width : 991.98px) {
	.section-title {
		font-size: 2rem;
	}
	.navbar-collapse {
		background-color: var(--primary-dark);
		padding: 1rem;
		border-radius: 10px;
		margin-top: 1rem;
	}
	.navbar-nav {
		margin-bottom: 1rem;
	}
	.nav-link {
		padding: 0.5rem 0;
	}
	.cart-item-table th, .cart-item-table td {
		font-size: 0.875rem;
	}
}

@media ( max-width : 767.98px) {
	.section-title {
		font-size: 1.75rem;
	}
	.cart-section {
		padding: 3rem 0;
	}
	.cart-item-table {
		display: block;
		overflow-x: auto;
	}
	.cart-item-table th {
		display: none;
	}
	.cart-item-table tr {
		display: flex;
		flex-wrap: wrap;
		margin-bottom: 1rem;
		padding: 1rem;
	}
	.cart-item-table td {
		flex: 1 1 100%;
		padding: 0.5rem;
	}
	.cart-item-table td:nth-child(1) {
		flex: 0 0 auto;
	}
	.cart-item-table td:nth-child(2) {
		flex: 1 1 100%;
	}
}

@media ( max-width : 575.98px) {
	.section-title {
		font-size: 1.5rem;
	}
	.cart-card, .cart-summary {
		padding: 1.5rem;
	}
	.cart-item-img {
		width: 60px;
		height: 60px;
	}
}

* /

.empty-cart {
	background: #fff;
	border-radius: 16px;
	padding: 40px;
	max-width: 500px;
	text-align: center;
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

.empty-cart img {
	width: 150px;
	margin-bottom: 20px;
}

.empty-cart h2 {
	font-weight: 700;
	color: #343a40;
}

.empty-cart p {
	color: #6c757d;
	margin-bottom: 30px;
}

.btn-shop {
	border-radius: 10px;
	font-weight: 500;
}

.cart-container {
	display: flex;
	justify-content: center;
	align-items: center;
}

.empty-cart-container {
	display: flex;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	margin: 5rem;
}

.empty-cart-container a {
	background: #4269dd;
	color: white;
}
</style>

</head>
<body>


	<div th:replace="lms/lms-navbar :: lms-nav"></div>

	<!-- Cart Section -->
<section class=" py-3 bg-about">
	<div class="container">
		<div class="section-header text-center mt-5">
				<span class="section-subtitle">Your Cart</span>
				<h2 class="section-title text-white">Shopping Cart</h2>
				<p class="section-description text-white">Review your selected courses and
					proceed to checkout</p>
			</div>
		</div>	
</section>

	<section class="cart-section py-5">
		<div id="cart-container" class="d-none">
			<div class="empty-cart"></div>
		</div>
		<div class="container" id="cart-item-table-container">
			

			<div class="row g-4">
				<div class="col-lg-8">

					<div class="cart-card animate__animated animate__fadeInLeft">
						<table class="cart-item-table">
							<thead>
								<tr>
									<th>Image</th>
									<th>Course</th>
									<th>Price</th>
									<!-- <th>Quantity</th>
									<th>Total</th> -->
									<th>Action</th>
								</tr>
							</thead>
							<tbody>
							</tbody>
						</table>
						<div class="mt-4 mb-4">
							<a href="/" class="btn btn-outline-primary"><i
								class="fas fa-arrow-left me-2"></i> Continue Shopping</a>
						</div>
					</div>

				</div>
				<div class="col-lg-4">
					<div
						class="cart-card cart-summary animate__animated animate__fadeInRight">
						<h4 class="mb-4">Cart Summary</h4>
						<div class="cart-total">
							<span>Subtotal</span> <span>0.00</span>
						</div>
						<!-- <div class="cart-total">
							<span>Tax</span> <span>$0.00</span>
						</div> -->
						<input type="hidden" id="userId" th:value="${session.USER_ID}" />
						<div class="cart-total mt-3">
							<span>Total</span> <span>0.00</span>
						</div>
						<a class="btn btn-primary btn-lg w-100 mt-4"  onclick="getUserDetails();" style="cursor: pointer;">Proceed
							to Checkout</a>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="lms/lms-footer :: lms-footer"></div>

</body>
</html>
