<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>

<style type="text/css">
.ag-theme-alpine {
	height: calc(100vh - 100px);
}

.subject-card {
	background-color: #bf05ff;
	border-radius: 10px;
	padding: 15px;
	margin-bottom: 15px;
	color: white;
}

.subject-card p {
	margin-top: 0;
	margin-bottom: 0;
	font-size: 12px;
	font-weight: 400;
	color: #ffffff9e;
}

.subject-card h5 {
	margin: 0 0 5px;
	color: white;
}

.nav-pills {
	gap: 3px;
}

.step-line {
	background: #e0e0e0;
	height: 2px;
	width: 35vw;
	position: absolute;
	top: 30px;
	z-index: 1;
}

.nav-pills.custom li {
	background: transparent;
	margin: 0 30px;
	z-index: 2;
}

.nav-link.active.custom {
	background-color: #bf05ff;
	color: white;
}

.nav-link.custom {
	color: inherit;
	border: 1px solid #bf05ff;
	width: 93px;
}

.tab-content.custom {
	display: flex;
	justify-content: space-between;
	gap: 5px;
}

.tab-content.custom .tab-pane {
	width: 50vw;
}

.document-link {
	color: rgb(191, 5, 255);
	text-decoration: none;
	font-weight: bold;
}

.document-link:hover {
	color: #9b04d3; /* Slightly darker on hover */
	text-decoration: underline;
}

.btn-group button {
	background-color: #04AA6D; /* Green background */
	border: 1px solid green; /* Green border */
	color: white; /* White text */
	padding: 10px 24px; /* Some padding */
	cursor: pointer; /* Pointer/hand icon */
	float: left; /* Float the buttons side by side */
	min-width: 45vw;
	border-radius: 5px;
}

/* Clear floats (clearfix hack) */
.btn-group:after {
	content: "";
	clear: both;
	display: table;
}

.btn-group button:not(:last-child) {
	border-right: none; /* Prevent double borders */
}

/* Add a background color on hover */
.btn-group button:hover {
	background-color: #3e8e41;
}

#enable {
	font-weight: 700;
	background-color: #667eea !important;
	color: white !important;
}

/* Add this to your stylesheet */
.ag-theme-alpine {
	--ag-foreground-color: rgb(55, 65, 81);
	--ag-secondary-foreground-color: rgb(55, 65, 81);
	--ag-grid-size: 8px;
	--ag-list-item-height: 28px;
}

.ag-theme-alpine .ag-cell {
	display: flex;
	align-items: center;
	padding: 0 12px;
}

.go-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 0.5rem 1rem;
	border-radius: 0.375rem;
	font-weight: 500;
	transition: all 0.2s ease;
	border: none;
}

.go-btn:hover {
	transform: translateY(-1px);
	box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.go-btn:active {
	transform: translateY(0);
}

.go-btn i {
	font-size: 1.1em;
}

/* New styles for student profile card */
.student-profile-card {
	padding: 20px;
}

.profile-header-subs {
	display: flex;
	margin-bottom: 20px;
	text-align: left !important;
	padding: 20px;
	background-color: #f5f2e7;
}

.profile-avatar-subs {
	width: 80px;
	height: 80px;
	border-radius: 50%;
	object-fit: cover;
	margin-right: 20px !important;
	border: 3px solid #667eea;
	position: relative;
}

.profile-name {
	font-size: 1.5rem;
	font-weight: 600;
	margin-bottom: 5px;
}

.profile-email {
	color: #6b7280;
	font-size: 0.875rem;
}

.profile-details {
	margin-bottom: 20px;
}

.detail-row {
	display: flex;
	margin-bottom: 10px;
}

.detail-label {
	font-weight: 600;
	color: #4b5563;
	width: 120px;
}

.detail-value {
	color: #374151;
}

.status-badge {
	display: inline-block;
	padding: 0.25rem 0.5rem;
	border-radius: 0.25rem;
	font-size: 0.75rem;
	font-weight: 600;
}

.status-active {
	background-color: #dcfce7;
	color: #16a34a;
}

.status-inactive {
	background-color: #fee2e2;
	color: #dc2626;
}

.payment-status {
	display: inline-block;
	padding: 0.25rem 0.5rem;
	border-radius: 0.25rem;
	font-size: 0.75rem;
	font-weight: 600;
}

.payment-paid {
	background-color: #dcfce7;
	color: #16a34a;
}

.payment-unpaid {
	background-color: #fee2e2;
	color: #dc2626;
}

.payment-pending {
	background-color: #fef3c7;
	color: #d97706;
}

.action-buttons {
	display: flex;
	gap: 10px;
	margin-top: 20px;
}

.no-selection {
	display: flex;
	align-items: center;
	justify-content: center;
	height: 100%;
	color: #6b7280;
	font-size: 1.1rem;
}
</style>

<script type="text/javascript">

$(document).ready(function() {
	
	getStudentDetails();
	var gridDivm = document.querySelector('#mygrid');
	new agGrid.Grid(gridDivm, gridOptions);
	gridOptions.api.setRowData([]);
});

var columnDefs = [
    {
        headerCheckboxSelection: true,
        headerCheckboxSelectionFilteredOnly: true,
        checkboxSelection: true,
        width: 10,
        sortable: false,
        filter: false,
        resizable: true,
        pinned: 'left',
    }, 
    {
        headerName: "Enroll Id",
        field: "enrollId",
    }, 
    {
        headerName: "User Name",
        field: "studentName",
    },
    {
        headerName: "User Id",
        field: "studentId",
        hide: true
    },
    {
        headerName: "Course Name",
        field: "courseName",
    },
    {
        headerName: "Course Id",
        field: "courseId",
        hide: true
    }, 
    {
        headerName: "Email",
        field: "email",
    }, 
    {
        headerName: "Status",
        field: "userStatus",
        cellStyle: function(params) {
            if (params.value === 'Active') {
                return { color: '#16a34a', fontWeight: '500' }; // Green for Active
            } else if (params.value === 'Inactive') {
                return { color: '#dc2626', fontWeight: '500' }; // Red for Inactive
            }
            return null;
        }
    },
    {
        headerName: "Enroll Date",
        field: "enrollDate",
        cellRenderer: function(params) {
            return params.value ? new Date(params.value).toLocaleDateString() : '';
        }
    },
    {
        headerName: "Phone Number",
        field: "phoneNo"
    },
    {
        headerName: "Nationality",
        field: "nationality",
    },
    {
        headerName: "Payment Status",
        field: "paymentStaus",
        cellStyle: function(params) {
            if (params.value === 'PAID') {
                return { color: '#16a34a', fontWeight: '500' }; // Green for PAID
            } else if (params.value === 'UNPAID') {
                return { color: '#dc2626', fontWeight: '500' }; // Red for UNPAID
            } else if (params.value === 'PENDING') {
                return { color: '#d97706', fontWeight: '500' }; // Amber for PENDING
            }
            return null;
        }
    },
    {
        headerName: "Payment Mode",
        field: "paymentMode",
        cellStyle: function(params) {
            if (params.value) {
                return { 
                    color: '#2563eb', // Blue for payment mode
                    fontWeight: '500' 
                };
            }
            return null;
        }
    }
];

var gridOptions = {
	columnDefs: columnDefs,
	rowSelection: 'single',
	suppressRowClickSelection: true,

	defaultColDef: {
		sortable: true,
		filter: true,
		resizable: true,
		width: 185,
		height: 10
	},
	pagination: true,
	paginationPageSize: 15,
	onGridReady: function(params) {
		window.gridApi = params.api;
		window.gridOptionsCourse = params.api;
	},
	onSelectionChanged: onSelectionChanged,
};

function onSelectionChanged() {
	var selectedNodes = window.gridApi.getSelectedNodes();
	var selectedData = selectedNodes.map(node => node.data);
	
	if (selectedData.length > 0) {
		updateStudentProfile(selectedData[0]);
		enrollId = selectedData.map(node => node.enrollId);
		getTheCourseDetails(enrollId);
 	} else {
		// Show empty state if no row is selected
		document.getElementById('student-profile-container').innerHTML = `
			<div class="no-selection">
				<p>Select a student from the grid to view details</p>
			</div>
		`;
	}
}

function updateStudentProfile(studentData) {
    // Format the enrollment date
    const enrollDate = studentData.enrollDate ? new Date(studentData.enrollDate).toLocaleDateString() : 'N/A';
    
    // Determine status badge class
    const statusClass = studentData.userStatus === 'Active' ? 'status-active' : 'status-inactive';
    
    // Determine payment status class
    let paymentClass = '';
    if (studentData.paymentStaus === 'PAID') {
        paymentClass = 'payment-paid';
    } else if (studentData.paymentStaus === 'UNPAID') {
        paymentClass = 'payment-unpaid';
    } else if (studentData.paymentStaus === 'PENDING') {
        paymentClass = 'payment-pending';
    }
    const image = studentData.candidateImage
    ? studentData.candidateImage
    : `https://ui-avatars.com/api/?name=${encodeURIComponent(studentData.studentName)}&background=667eea&color=fff&size=80`;
    
    // Create the profile HTML
    const profileHtml = `
        <div class="student-profile-card">
            <div class="profile-header-subs">
            <img src="${image}" alt="Profile" class="profile-avatar-subs">
                <div>
                    <h3 class="profile-name">${studentData.studentName || 'N/A'}</h3>
                    <p class="profile-email">${studentData.email || 'N/A'}</p>
                    <span class="status-badge ${statusClass}">${studentData.userStatus || 'N/A'}</span>
                </div>
            </div>
            
            <div class="profile-details">
                <div class="detail-row">
                    <span class="detail-label">Enrollment ID:</span>
                    <span class="detail-value">${studentData.enrollId || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Course:</span>
                    <span class="detail-value">${studentData.courseName || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Enrollment Date:</span>
                    <span class="detail-value">${enrollDate}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Phone:</span>
                    <span class="detail-value">${studentData.phoneNo || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Nationality:</span>
                    <span class="detail-value">${studentData.nationality || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Status:</span>
                    <span class="payment-status ${paymentClass}">${studentData.paymentStaus || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Mode:</span>
                    <span class="detail-value">${studentData.paymentMode || 'N/A'}</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="go-btn btn-success" onclick="enableCourse(1)">
                    <i class="fas fa-check-circle me-2"></i> Enable
                </button>
                <button class="go-btn btn-danger" onclick="enableCourse(0)">
                    <i class="fas fa-times-circle me-2"></i> Disable
                </button>
            </div>
        </div>
    `;
    
    document.getElementById('student-profile-container').innerHTML = profileHtml;
}

function getStudentDetails() {
	Promise.resolve(
			  agGrid.simpleHttpRequest({ url: "subscription-student-view" })
			).then(function(response) {
			  if (response.message === "Success") {
			    const responseBody = JSON.parse(response.body);
			    let studentData = responseBody.studentData || [];

			    // Sort descending by enrollId (e.g., TECM0107 → TECM0001)
			    studentData.sort((a, b) => {
			      const numA = parseInt(a.enrollId.replace(/\D/g, ""), 10);
			      const numB = parseInt(b.enrollId.replace(/\D/g, ""), 10);
			      return numB - numA;
			    });

			    window.gridApi.setRowData(studentData);

			    if (studentData.length > 0) {
			      window.gridApi.forEachNode(node => {
			        if (node.rowIndex === 0) node.setSelected(true);
			      });
			    }
			  } else {
			    console.error("Failed to fetch data");
			  }
			}).catch(function(error) {
			  console.error("Error fetching data:", error);
			});

}

function enableCourse(status) {
    var selectedNodes = gridOptions.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);

    if (selectedData.length > 0) {
        var studentId = selectedData[0].studentId;

        $.ajax({
            type: "GET",
            url: "subscription-student-course-enable?studentId=" + studentId + "&status=" + status,
            success: function(response) {
                console.log("AJAX success response:", response);
                if (response.message === "Success") {
                    toastr.success("Course updated successfully");
                    // Refresh the grid and profile after update
                    getStudentDetails();
                } else {
                    toastr.error("Something went wrong: " + response.message);
                }
            },
            error: function(err) {
                toastr.error("Request failed");
            }
        });
    } else {
        toastr.warning("Please select a student row");
    }
}

function onQuickFilterChanged() {
    gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
}

function reset() {
    document.getElementById('quickFilter').value = '';
    gridOptions.api.setQuickFilter('');
}

function enterToSearch(event) {
    if (event.key === 'Enter') {
        onQuickFilterChanged();
    }
}
function getTheCourseDetails(enrollId) {
    $.ajax({
        url: 'subscription-get-course-details?enrollId=' + enrollId,
        type: 'GET',
        success: function (response) {
            console.log('Course details fetched successfully:', response);

            // Parse JSON string if needed
            const data = typeof response.body === 'string' ? JSON.parse(response.body) : response.body;
            
            // Clear existing content
            $('#courseCard').empty();

            // Course Header
            const courseHeader = `
                <div class="d-flex align-items-center mb-3 border-bottom pb-2">
                    <img src="${data.image}" alt="${data.courseTitle}" class="me-3" style="width:80px; height:80px; border-radius:8px; object-fit:cover;">
                    <div>
                        <h4 class="mb-1 fw-bold text-primary">${data.courseTitle}</h4>
                        <p class="text-muted mb-0">${data.categoryName} › ${data.subCategoryName}</p>
                    </div>
                </div>
            `;
            $('#courseCard').append(courseHeader);

            // Trainings List
            data.courseCategoryType.forEach(training => {
                const priceText = training.trainingPrice && training.trainingPrice !== "" 
                    ? `<span class="fw-semibold text-success">₹${training.trainingPrice}</span>` 
                    : `<span class="text-muted">Contact for price</span>`;

                const trainingHTML = `
                    <div class="border rounded p-3 mb-3 bg-light">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0 text-dark">${training.trainingCategory}</h5>
                            ${priceText}
                        </div>
                        <p class="mb-1 small text-secondary">${training.trainingDescription}</p>
                        <div class="text-end">
                            <button class="btn btn-sm btn-outline-primary mt-2">Learn More</button>
                        </div>
                    </div>
                `;
                $('#courseCard').append(trainingHTML);
            });
        },
        error: function (xhr, status, error) {
            console.error('Error fetching course details:', error);
            $('#courseCard').html('<p class="text-danger">Failed to load course details.</p>');
        }
    });
}
function nextTab(id) {
	const tabElement = document.querySelector('#' + id + ' a');
	const tab = new bootstrap.Tab(tabElement);
	tab.show();
}
</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<!--Tabbination 1 Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">

										<div class="col-md-8 col-12">
											<div class="d-flex gap-2 search-sec position-relative">
												<input class="form-control" type="text"
													onkeydown="enterToSearch(event)" placeholder="Search"
													id="quickFilter" autocomplete="off">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												<button class="btn go-btn" type="button" onclick="reset()">Reset</button>
											</div>
										</div>

										<button class="btn btn-primary max-btn" id="collapseButtonR1"
											onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
											data-bs-placement="top" title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
										</button>

									</div>
									<div class="card m-2 p-2">
										<div id="mygrid" class="ag-theme-alpine"></div>
									</div>
								</div>
							</div>
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div
										class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>

										<div class="d-flex gap-2">
											<ul class="nav nav-pills newtab" role="tablist" id="tabMenu">
												<li class="nav-item" role="presentation"
													id="student-profile"><a class="nav-link active"
													data-bs-toggle="pill" href="#studentProfile"
													aria-selected="false" role="tab">Profile</a></li>
												<li class="nav-item" role="presentation" id="course-details"><a
													class="nav-link" data-bs-toggle="pill"
													href="#courseDetails" aria-selected="true" role="tab">Course
														Details</a></li>
												<!-- <li class="nav-item" role="presentation"
												id="pendingPoints-tab"><a class="nav-link active"
												data-bs-toggle="pill" href="#pendingPoints"
												aria-selected="true" role="tab">Open Issues</a></li>
											<li class="nav-item" role="presentation" id="createMom-tab"><a
												class="nav-link" data-bs-toggle="pill" href="#createMom"
												aria-selected="false" role="tab">Create MoM</a></li> -->
												<!-- <li class="nav-item" role="presentation" id="agendaTab-tab"><a
												class="nav-link" data-bs-toggle="pill" href="#agendaTab"
												aria-selected="false" role="tab">Agenda</a></li> -->
											</ul>
										</div>
									</div>

									<div class="tab-content flex-fill" id="tabContent">
										<div class="tab-pane active show  h-100" role="tabpanel"
											id="studentProfile">

											<div class="requisition-tbl d-flex flex-column p-2 gap-2 h-100">
											<div class="d-flex justify-content-end border p-2 rounded">
														<button class="btn m-0 edit-btn" type="button"
															onclick="nextTab('course-details')">Next</button>
													</div>
												<div class="card p-2">
													<div id="student-profile-container">
														<div class="no-selection">
															<p>Select a student from the grid to view details</p>
														</div>
													</div>
												</div>
											</div>
										</div>
										<div class="tab-pane show p-2 h-100" id="courseDetails"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">
											<div class="d-flex justify-content-end">
														<button class="btn m-0 edit-btn" type="button"
															onclick="nextTab('student-profile')">Previous</button>
													</div>
												<div class="card m-2 p-3 shadow-sm" id="courseCard"> </div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
