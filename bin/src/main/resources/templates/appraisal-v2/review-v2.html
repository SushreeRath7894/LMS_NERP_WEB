<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}" lang="en">
<head>
<meta charset="UTF-8">
<title>NERP</title>
<script src="/javaScript/appraisal-v2/review.js"></script>
<link rel="stylesheet" href="/css/appraisal-v2/self-appraisal-v2.css">

<style>
.chipBox {
	padding: 0.4rem 0.6rem;
	border-radius: 20px;
	margin: 3px;
	background-color: rgb(191, 5, 255);
}

.form-switch .form-check-input {
	width: 3rem;
	height: 1.5rem;
	margin-top: 6px;
	margin-left: 10px;
}

.label {
	margin-top: 10px;
}

.align-items-start {
	margin-left: -40px;
}

#selectedEmployees {
	border: 1px solid #ccc;
	padding: 8px;
	height: 80px;
	overflow-y: auto;
	border-radius: 6px;
	/*  background-color: #f9f9f9; */
	display: flex;
	flex-wrap: wrap;
	gap: 8px;
}

.employee-chip {
	background-color: rgb(191, 5, 255);
	color: white;
	padding: 6px 10px;
	/*  border-radius: 20px; */
	display: flex;
	align-items: center;
	font-size: 14px;
}

.employee-chip .btn-close {
	margin-left: 8px;
	filter: invert(1);
	opacity: 0.8;
	font-size: 10px;
}

.employee-chip .btn-close:hover {
	opacity: 1;
}

#suggesstion-box5 {
	position: absolute;
	background-color: #fff;
	border-radius: 6px;
	z-index: 1000;
	width: 100%;
	max-height: 200px;
	overflow-y: auto;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
	margin-top: 2px;
	padding: 0;
}

#suggesstion-box5 ul {
	list-style: none;
	padding-left: 0;
	margin: 0;
}

#suggesstion-box5 li {
	padding: 8px 12px;
	cursor: pointer;
	transition: background-color 0.2s ease;
}

#suggesstion-box5 li:hover {
	background-color: rgb(191, 5, 255);
	color: white;
}

/* Optional: Styling for "No Data Found" */
#suggesstion-box5 div {
	padding: 10px 12px;
	color: #888;
	font-style: italic;
}

.chipBox {
	background-color: rgb(191, 5, 255);
}

.disabled {
	pointer-events: none;
	opacity: 0.6;
	cursor: not-allowed;
}
</style>


</head>
<body>
	<section>
		<div layout:fragment="content" class="maincontent">
			<div class="container-fluid">
				<div class="d-flex">
					<div class="maincontentsec">
						<div id="parent-tab" class="tab-pane" role="tabpanel">
							<div class="d-flex flex-column flex-lg-row">
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between border-bottom p-2 flex-wrap">
										<div class="col-lg-3 col-md-3 col-12">
												<div class="form-group">
													<label>Financial Year</label>
													<div class="select">
														<select class="" id="financialYear"
															onblur="removeValid(event);" onchange="getAllDesignationGoal();">
															<option value="">Select</option>
														</select>
													</div>
												</div>
											</div>
											<div class="d-flex align-items-center col-md-8 col-12 mt-30">
												<input class="form-control me-2" type="text"
													placeholder="Search" onkeyup="SearchUserInput(event)"
													id="quickFilter" autocomplete="off">
												<div class="searchicon position-relative">
													<span style="display: none;" id="closeKey"
														onclick="gridOptionsEmployee.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalEmp').find('span').html(gridOptionsEmployee.api.getModel().getRowCount());"
														class="close_i close-search"> <!-- <i
														class="ti-close srchicon"></i> -->
													</span>
													<button class="btn btn-primary go-btn" type="button"
														onclick="onQuickFilterChanged()">Go</button>
												</div>
												<button class="btn go-btn w-auto mx-2" type="button"
													onclick="resetBtn()">Reset</button>
											</div>

											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" aria-label="Expand"
												data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
										<div class="card m-2 p-2">
											<div id="appraisalGrid" class="ag-theme-alpine"></div>
										</div>
									</div>
								</div>
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box">
										<div
											class="d-flex justify-content-between align-items-center p-2 border-bottom">
											<!--Right Inner Tab Start-->
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link active"
														data-bs-toggle="pill" data-bs-target="#appraise-v2"
														aria-selected="true" role="tab" tabindex="-1">Manager
														Review</button>
												</li>
											</ul>

											<button class="btn btn-primary max-btn" id="collapseButtonL1"
												type="button" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												aria-label="Expand" data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>
										</div>
										<div class="tab-content flex-fill">
											<div class="tab-pane fade h-100 show active" id="appraise-v2"
												role="tabpanel" aria-labelledby="appraise-v2-tab">
												<div class="d-flex flex-column gap-2 p-2 h-100">
													<div class="card p-2">
														<div class="d-flex flex-column gap-2">

															<div
																class="d-flex justify-content-between p-2 border rounded align-items-center">
																<div class="head-user-name">
																	Employee Name: <span id="empNames"></span>
																</div>
																<input type="hidden" id="selfAppId">

																<div class="d-flex gap-2">

																	<button type="button" id="saveSelfApp"
																		class="btn edit-btn m-0 w-auto"
																		onclick="generateAppraisalJSONEmp();">Save</button>
																</div>
															</div>
															<div
																class="d-flex justify-content-between p-2 border rounded align-items-center">
																<div class="col-md-6">
																	<div
																		class="form-check form-switch d-flex align-items-start">
																		<label class="form-check-label label"
																			for="flexSwitchCheckDefault">Forward to 360°</label>
																		<input class="form-check-input" type="checkbox"
																			id="flexSwitchCheckDefault"
																			onclick="handleToggle(this)">
																	</div>
																</div>

																<div class="col-md-6" style="display: none;"
																	id="getEmpDiv">
																	<label for="autoSearchInput" class="form-label">Employee
																		List</label> <input type="text" class="form-control"
																		id="autoSearchInput" placeholder="Search"
																		oninput="getEmployeeList();">

																	<div id="selectedEmployees"
																		class="mt-2 mb-2 d-flex flex-wrap gap-2"></div>

																	<input type="hidden" id="assignedToMain"
																		name="assignedToMain">

																	<ul class="list-group mt-2" id="searchResults"
																		style="display: none;"></ul>
																	<div id="suggesstion-box5"></div>
																</div>
															</div>
															<input type="hidden" id=userId
																th:value="${session.USER_ID}"> <input
																type="hidden" id="selfAppId">
                                                        <div class="table-responsive">
															<table class="table table-bordered card-height-details"
																id="kra-table-dep" style="width: 100%;">
																<thead class="table-dark">
																	<tr>
																		<th style="width: 25%;">KPIs</th>
																		<th style="width: 15%;">Weightage (%)</th>
																		<th style="width: 15%;">Self Ratings</th>
																		<th style="width: 15%;">Self Notes</th>
																		<th style="width: 15%;"
																			th:if="${session.USER_ROLES != 'ROL031'}">Manager
																			Ratings</th>
																		<th style="width: 15%;"
																			th:if="${session.USER_ROLES != 'ROL031'}">Manager
																			Notes</th>
																	</tr>
																</thead>
																<tbody></tbody>
															</table>
														</div>

															<div class="row">
																<div class="col-lg-12">
																	<div class="row">
																		<div class="col-md-6">
																			<div class="rating-container">
																				<label>Overall Self Ratings:</label>
																				<div class="rating-group">
																					<input type="radio" id="self-star5" name="rating"
																						value="5"> <label for="self-star5">★</label>

																					<input type="radio" id="self-star4" name="rating"
																						value="4"> <label for="self-star4">★</label>

																					<input type="radio" id="self-star3" name="rating"
																						value="3"> <label for="self-star3">★</label>

																					<input type="radio" id="self-star2" name="rating"
																						value="2"> <label for="self-star2">★</label>

																					<input type="radio" id="self-star1" name="rating"
																						value="1"> <label for="self-star1">★</label>
																				</div>
																			</div>
																		</div>

																		<div class="col-md-6">
																			<div class="rating-container">
																				<label>Overall Manager Ratings:</label>
																				<div class="rating-group">
																					<input type="radio" id="man-star5" name="ratingMan"
																						value="5"> <label for="man-star5"
																						title="5 stars">★</label> <input type="radio"
																						id="man-star4" name="ratingMan" value="4">
																					<label for="man-star4" title="4 stars">★</label> <input
																						type="radio" id="man-star3" name="ratingMan"
																						value="3"> <label for="man-star3"
																						title="3 stars">★</label> <input type="radio"
																						id="man-star2" name="ratingMan" value="2">
																					<label for="man-star2" title="2 stars">★</label> <input
																						type="radio" id="man-star1" name="ratingMan"
																						value="1"> <label for="man-star1"
																						title="1 star">★</label>
																				</div>
																			</div>
																		</div>



																	</div>
																</div>
															</div>
															<div class="row">
																<div class="col-lg-12">
																	<div class="row">
																		<div class="col-md-6">
																			<label for="summary1">Employee Summary:</label>
																			<textarea id="summary1" rows="4" class="form-control"
																				required></textarea>
																		</div>
																		<div class="col-md-6">
																			<label for="summary2">Manager Summary:</label>
																			<textarea id="summary2" rows="4" class="form-control"
																				required></textarea>
																		</div>

																	</div>
																</div>
															</div>

															<div class="row height">
																<h2>Requirement Discussion</h2>

																<div class="col-md-6">
																	<label for="requirementDescription"><i class="bi bi-pin-angle-fill employee"></i>
																		Requested Requirement</label>
																	<textarea id="requirementDescription"
																		name="requirement_description" rows="4"
																		placeholder="Describe the requirement in detail..."></textarea>
																</div>

																<div class="col-md-6">
																	<label for="managerResponse"><i class="fa-solid fa-user-tie manager"></i> Manager's
																		Response</label>
																	<textarea id="managerResponse" name="manager_response"
																		rows="4"
																		placeholder="Manager's feedback or response..."></textarea>
																</div>
															</div>



														</div>
													</div>

												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
