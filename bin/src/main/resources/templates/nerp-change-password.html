<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:fragment="nerp-change-password">
<head>
<style type="text/css">
.position {
	position: absolute;
	right: 30px;
	top: 53px;
}

.out-box .go-btn {
	height: 30px;
}
</style>
<script>
	function backToManage() {
		$("#oldPassword").val('');
		$("#newPassword").val('');
		$("#confirmPassword").val('');
		$(".operationSecDiv").removeClass('d-none');
		$("#changePasswordSecDiv").hide();
	}
	$(document).ready(()=>{
		$("#confirmErrMsgId").hide();
	})
	function validateBothPassword(){
		let nPass = $("#newPassword").val();
		let cPass = $("#confirmPassword").val();
		if(nPass === cPass){
			$("#confirmErrMsgId").hide();
		} else {
			$("#confirmErrMsgId").show();
		}
	}
	function changePassword() {
		let key = $("#oldPassword").val();
		let name = $("#newPassword").val();
		let code = $("#confirmPassword").val();
		
		if(!key) {
			toastr.error("Old Password Required");
			return;
		}
		if(!name) {
			toastr.error("New Password Required");
			return;
		}
		if(!code) {
			toastr.error("Confirm Password Required");
			return;
		}
		
		if(name !== code) {
			toastr.error("New password and confirm password must be same");
			return;
		}
		
		let obj = {key, name, code};
		
		$(".loader").show();
		$("body").addClass("overlay");
		
		$.ajax({
            type: "POST",
            url: "/configuration/change-password",
            contentType: "application/json",
            data: JSON.stringify(obj),
            success: function(resp) {
            	$(".loader").hide();
        		$("body").removeClass("overlay");
            	if(resp.code == 'success') {
            		toastr.success("Password changed successfully")
            		window.location.href="/logout";
            	} else {
            		toastr.error(resp.message)
            	}
            },
            error: function(data) {
            	console.log(data)
            	$(".loader").hide();
        		$("body").removeClass("overlay");
            	toastr.error("Something went wrong")
            }
		});
	}
</script>
</head>
<body>

	<div class="d-flex justify-content-center bdr-line p-2">
		<div class="service-title">Change Password</div>

	</div>


	
	<div class="d-flex justify-content-end table-bordered border rounded-2 m-2 p-2" id="buttonsDiv">
		<div class="d-flex gap-2">
			<button alt="Change" class="btn btn-primary max-btn"
					id="changePassowrdId" onclick="changePassword()"
					data-bs-toggle="tooltip" title="Change Password">
					<i class="fa-solid fa-right-left" id="changePasswordIconId"></i>
				</button>
			<button alt="Close" class="btn btn-primary max-btn"
					id="backToManageId" onclick="backToManage()"
					data-bs-toggle="tooltip" title="Close">
					<i class="fa-solid fa-remove" id="backToManageIconId"></i>
				</button>
			<!-- <button class="btn btn-primary edit-btn" type="button"
				id="changePassowrdId" onclick="changePassword()">Change</button> -->
		</div>
		<!-- <div class="mr-2 mt-2">
			<button class="btn btn-primary edit-btn" type="button"
				id="backToManageId" onclick="backToManage()">Close</button>
		</div> -->
	</div>
	<div class="card p-2 m-2">
		<div class="d-flex flex-column gap-2 h-100">
			<div class="row">
				<div class="col-md-12">
					<div class="form-group">
						<label>Old Password<span class="mandatory">*</span></label> <input
							type="text" autocomplete="off" placeholder="Old Password"
							class="form-control" id="oldPassword">
					</div>
				</div>
				</div><div class="row">
				<div class="col-md-12">
					<div class="form-group">
						<label>New Password<span class="mandatory">*</span></label> <input
							type="text" autocomplete="off" placeholder="New Password"
							class="form-control" id="newPassword" onkeyup="validateBothPassword()">
					</div>
				</div>
				</div><div class="row">
				<div class="col-md-12">
					<div class="form-group">
						<label>Confirm Password<span class="mandatory">*</span></label> <input
							type="text" autocomplete="off" placeholder="Confirm Password"
							class="form-control" id="confirmPassword" onkeyup="validateBothPassword()"> 
					</div>
				</div>
				<span class="mandatory" style="font-size:12px" id="confirmErrMsgId">New password and confirm password must be same</span>
			</div>
		</div>
	</div>
</body>
</html>
