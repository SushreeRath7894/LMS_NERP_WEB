
<html xmlns:th="http://www.thymeleaf.org" th:fragment="header">
<div class="header">
	<div class="container-fluid">
		<div class="d-flex indexheader">

			<div class="logo">
				<a th:href="${'/'+session.DASHBOARD}"> <img
					src="../assets/images/login_img/logo.png" alt="" class="img-fluid" />
				</a>
			</div>

			<div class="headerright" align="right">
				<div class="logo-org">
					<a th:href="${'/'+session.DASHBOARD}"> <img
						th:src="${session.ORGANIZATION_LOGO}" alt="" class="img-fluid" />
					</a>
				</div>
				<div class="dropdown my-auto">
					<button type="button" class="btn img-btn" data-bs-toggle="dropdown"
						th:attr="title=${session.USER_NAME}">
						<i class="ti-user"
							th:classappend="${session.PROFILE_IMAGE}?(${session.PROFILE_IMAGE} == '' ? blank:d-none): is-null"></i>
						<img th:attr="'src'=${session.PROFILE_IMAGE}" alt="User Image"
							class="position-absolute"
							th:classappend="${session.PROFILE_IMAGE}?(${session.PROFILE_IMAGE} == '' ? d-none:not-blank):d-none">
					</button>
					<ul class="dropdown-menu custom-user-menu p-0">
						<!--     <li><a class="dropdown-item" href="#"><i class="ti-lock"></i>Lock Screen</a> </li>
					    <li><a class="dropdown-item" href="#"><i class="ti-email"></i> Profile</a></li>
					    <li><a class="dropdown-item" href="/notification"><i class="ti-power-off"></i>Notification</a> </li> -->

						<!-- Author: Sandeep Saurav Das | 25.06.2024 -->
						<!-- SO new profile menu -->
						<li class="p-0">
							<div class="row g-3 row cols-1">
								<div class="col">
									<div class="card m-0 bg-transparent p-0">
										<div class="card-header m-0 bg-origroup">

											<svg class="d-none" version="1.1"
												xmlns="http://www.w3.org/2000/svg"
												xmlns:xlink="http://www.w3.org/1999/xlink">
                          <symbol id="ti--user" viewBox="0 0 17 17">
                            <g>
												<path

													fill="#000000"></path></g>
                          </symbol>
                        </svg>



											<svg class="bd-placeholder-img card-img-top" width="100%"
												height="100%" xmlns="http://www.w3.org/2000/svg" role="img"
												preserveAspectRatio="xMidYMid slice">
                          <defs>
                            <pattern id="imagePlaceholder" x="0%" y="0%"
													height="100%" width="100%" viewBox="0 0 100 100">
                              <image
													th:attr="x=${thumbx},'xlink:href'=${session.PROFILE_IMAGE}"
													width="100" height="100"
													th:classappend="${session.PROFILE_IMAGE}?(${session.PROFILE_IMAGE} == '' ? d-none:not-blank):d-none" />
                              <use href="#ti--user" x="0" y="15"
													width="100" height="65"
													th:classappend="${session.PROFILE_IMAGE}?(${session.PROFILE_IMAGE} == '' ? blank:d-none): is-null"></use>
                            </pattern>
                          </defs>
                          <circle r="45" cx="50%" cy="50%"
													fill="#aeaeae" />
                          <circle r="45" cx="50%" cy="50%"
													fill="url(#imagePlaceholder)" />
                          <title th:text="${session.USER_NAME}">User Name</title>
                        </svg>

										</div>
										<div class="card-body mt-5 mb-3">
											<div class="row g-0 row-cols-1 text-center">
												<div class="col">
													<h6 class="m-0" th:text="${session.USER_NAME}">User
														Name</h6>
												</div>
												<div class="col">
													<div class="row g-1 row-cols-auto justify-content-center">
														<div class="col">
															<i class="ti-briefcase"></i>
														</div>
														<div class="col">
															<p class="m-0 text-dark">
																<small th:text="${session.USER_ID}">User ID</small>
															</p>
														</div>
													</div>
 
												</div>
											</div>
										</div>
										<div class="card-footer bg-transparent p-0">
											<a class="dropdown-item" href="/logout"> <span
												class="row g-1 row-cols-auto justify-content-center">
													<span class="col"><i
														class="ti-power-off p-0 text-dark"></i></span> <span class="col"><span
														class="m-0"><small>Log Out</small></span></span>
											</span>
											</a>
										</div>
									</div>
								</div>
							</div>
						</li>
						<!-- EO new profile menu -->

						<!--[header-index.html]-->
						<!--<li><a class="dropdown-item" href="/logout"><i class="ti-power-off"></i> Log Out</a> </li>-->
					</ul>
				</div>

			</div>
		</div>
	</div>
</div>
</html>
