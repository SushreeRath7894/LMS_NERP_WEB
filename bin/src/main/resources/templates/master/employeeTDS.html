/* -------------------section for onSelectionChanged ------------------------ */
var tid;

function onChangedData() {
var selectedRows = gridOptions.api.getSelectedRows();
tid = "";
var rowCount = 0;
for (var i = 0; i < selectedRows.length; i++) {
    tid = tid + '"' + selectedRows[i].tdsId + '",';
    rowCount = rowCount + 1;
}
tid = tid.substring(0, tid.length - 1);
if (rowCount > 0) {
    $('#approve').attr("disabled", false);
    $('#delete').attr("disabled", false);
    $('#newBtn').attr("disabled", true);
} else {
    $('#approve').attr("disabled", true);
    $('#delete').attr("disabled", true);
    $('#newBtn').attr("disabled", false);
}
}
/* -------------------view tds data for mygrid------------------------ */
function viewTdsData() {
var year = $("#attndyear").val();
var month = $("#attndmonth").val();
agGrid.simpleHttpRequest({
    url: 'employee-tds-view-data?year=' + year + '&month=' + month,
}).then(function(data) {
    var jsonData = JSON.parse(data.body);
    if (jsonData != null) {
        var len = jsonData.length;
        $('#totalReq').find('span').html(len);
    } else {
        $('#totalReq').find('span').html(0);
        jsonData = [];
    }
    gridOptions.api.setRowData(jsonData);
	var tdsAmnt = jsonData.reduce(function (sum, row) {
        return sum + parseFloat(row.tdsAmnt);
    }, 0);

    var totalRow = {
    		tdsId: 'Total',
    		tdsAmnt: tdsAmnt
    };

    gridOptions.api.setRowData(jsonData.concat(totalRow));
});
}

gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
var totalRowCount = gridOptions.api.getModel().getRowCount();
$('#totalReq').find('span').html(totalRowCount);
}

function cancelBar() {
var id = document.getElementById("closeKey");
id.style.display = "block";

}

//select employee
function getEmployeeList() {
var search = $("#employeeName").val();
if (search) {
    $.ajax({
        type: "POST",
        url: "employee-tds-get-employee-list",
        dataType: 'json',
        contentType: 'application/json',
        data: search,
        success: function(response) {
            if (response.message == "success") {
                if (response.body.length != 0) {
                    $("#empid").val("");
                    $("#employeeName").css("background", "#FFF");
                    var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;">';
                    for (var i = 0; i < response.body.length; i++) {
                        content += '<li class="autocompletedata cp" onClick="selectAutocompleteValueItem1(\'' +
                            response.body[i].key +
                            '\',\'' +
                            window.btoa(response.body[i].name) +
                            '\')">' +
                            response.body[i].key +
                            " - " +
                            response.body[i].name +
                            '</li>';
                    }
                    content += '</ul>';
                    $("#suggesstion-box_").show();
                    $("#suggesstion-box_").html(content);

                } else {
                    $("#employeeName").css("background", "#FFF");
                    var content = '<ul id="autocomplete-list1">';
                    content += '<font-weight:100; font-size:14px; color:#ccc;     background-color: #0909e4;"li onClick="selectAutocompleteValueItem()">' +
                        "No Data Found" + '</li>';
                    content += '</ul>';
                    $("#suggesstion-box_").show();
                    $("#suggesstion-box_").html(content);
                }
            }
        },
        error: function(data) {
            console.log(data);
        }
    })
} else {
    $("#empid").val("");
    $("#employeeName").val("");
    $("#suggesstion-box_").hide();
}
}

function selectAutocompleteValueItem1(empid, employeeName) {
if (empid) {
    $("#error1").hide();
    $("#employeeName").val(window.atob(employeeName));
    $("#empid").val(empid);
    $("#employeeName").attr('data-procat', empid);
    $("#suggesstion-box_").hide();
} else {
    $("#empid").val("");
    $("#employeeName").val("");
    $("#employeeName").attr('data-procat', "");
    $("#suggesstion-box_").hide();

}
}
//addDetails
function addDetails() {
obj = {};
obj.tdsId = $("#tdsId").val();
obj.empId = $("#empid").val();
obj.year = $("#attndyear1").val();
obj.month = $("#attndmonth1").val();
obj.fromDate = $("#fromDate1").val();
obj.toDate = $("#endDate1").val();
obj.fyear = $("#financialYr1").val();
obj.tdsAmnt = $("#tdsamnt").val();

var validation = true;
if (obj.empId == null || obj.empId == "") {
    $("#error1").html("Employee Name Required");
    validation = false;
} else {
    $("#error1").html("");
}
if (obj.year == null || obj.year == "") {
    validation = validationUpdated("Year Required", "attndyear1");
}
if (obj.month == null || obj.month == "") {
    validation = validationUpdated("Month Required", "attndmonth1");
}
if (obj.tdsAmnt == null || obj.tdsAmnt == "") {
    validation = validationUpdated("TDS Amount Required", "tdsamnt");
}

if (validation) {
    $.ajax({
        type: "POST",
        url: "employee-tds-details-save",
        contentType: "application/json",
        data: JSON.stringify(obj),
        success: function(response) {
            console.log(response)
            if (response.code == "200") {
                $("#msgModal").modal('show');
                viewTdsData();
                $("#messageParagraph").text(response.message);
                $("#msgOkModal").removeClass("btn3").addClass("btn1");
                closeNav();
            } else {
                $("#msgModal").modal('show');
                $("#messageParagraph").text(response.message);
                $("#msgOkModal").removeClass("btn3").addClass("btn1");
            }
        },
        error: function(data) {
            $("#msgModal").modal('show');
            $("#messageParagraph").text(response.message);
            $("#msgOkModal").removeClass("btn3").addClass("btn1");
        }
    });
}
}

/* ------------------- month and year for top section ------------------------ */
function getCurrentDateMonthYear() {
var curdate = new Date();
var date = curdate.getDate();
var mnth = curdate.getMonth();
$("#attndyear").val(curdate.getFullYear())
var sday = $("#startDayForAtten").val();
if (parseInt(sday) > 1) {
    if (parseInt(date) > parseInt(sday)) {
        var month = (curdate.getMonth() + 1);
        var year = curdate.getFullYear();
    } else {
        var month = curdate.getMonth();
        if (month == 0) {
            var year = curdate.getFullYear() - 1;
            month = 12;
        } else {
            var month = curdate.getMonth();
            var year = curdate.getFullYear();
        }
    }
} else {
    var month = (curdate.getMonth() + 1);
    var year = curdate.getFullYear();
}
var nextmonth = month + 1;
if (parseInt(sday) > 1) {
    $("#attndmonth").val(month + 1);
} else {
    $("#attndmonth").val(month);
}
var fromdate = sday + "-" + String(month).padStart(2, '0') + "-" + year;
const lastDayOfMonth = new Date(year, month, 0).getDate();
if (sday > 1) {
    if (month == "12") {
        var todate = (parseInt(sday) - 1) + "-" +
            String(1).padStart(2, '0') + "-" + (year + 1);
    } else {
        var todate = (parseInt(sday) - 1) + "-" +
            String(nextmonth).padStart(2, '0') + "-" + year;
    }
} else {
    var todate = lastDayOfMonth + "-" + String(month).padStart(2, '0') +
        "-" + year;
}

$("#fromDate").val(fromdate);
$("#fromDateCalendar").val(fromdate);
$("#endDate").val(todate);
$("#endDateCalendar").val(todate);
}

//changeMonthYear
function changeMonthYear() {
var curdate = new Date();
var attnyear = $("#attndyear").val();
var sday = $("#startDayForAtten").val();
var date = curdate.getDate();
var mnth = curdate.getMonth();
if (attnyear > curdate.getFullYear()) {
    $("#messageParagraph").text(
        "Please Choose Current Year Or Previous Year!");
    $("#msgOkModal").removeClass("btn3");
    $("#msgOkModal").addClass("btn1");
    $("#attndyear").val(curdate.getFullYear())
    getCurrentFY();
    getCurrentDateMonthYear();
    viewTdsData()
} else {
    if (attnyear == curdate.getFullYear()) {
        var month = $("#attndmonth").val();
        var mt = month - 1;
        if (mt > curdate.getMonth()) {
            $("#messageParagraph").text(
                "Please Choose Current month Or Previous Month!");
            $("#msgOkModal").removeClass("btn3");
            $("#msgOkModal").addClass("btn1");
            if (parseInt(sday) > 1) {
                if (parseInt(date) > parseInt(sday)) {
                    var month = (curdate.getMonth() + 1);
                    var year = attnyear;
                } else {
                    var month = curdate.getMonth();
                    if (month == 0) {
                        var year = attnyear - 1;
                        month = 12;
                    } else {
                        var month = curdate.getMonth();
                        var year = attnyear;
                    }
                }
            } else {
                var month = (curdate.getMonth() + 1);
                var year = attnyear;
            }
            var nextmonth = month + 1;
            if (parseInt(sday) > 1) {
                $("#attndmonth").val(month + 1);
            } else {
                $("#attndmonth").val(month);
            }
            var fromdate = sday + "-" + String(month).padStart(2, '0') +
                "-" + year;
            const lastDayOfMonth = new Date(year, month, 0).getDate();
            if (sday > 1) {
                if (month == "12") {
                    var todate = (parseInt(sday) - 1) + "-" +
                        String(1).padStart(2, '0') + "-" +
                        (year + 1);
                } else {
                    var todate = (parseInt(sday) - 1) + "-" +
                        String(nextmonth).padStart(2, '0') + "-" +
                        year;
                }
            } else {
                var todate = lastDayOfMonth + "-" +
                    String(month).padStart(2, '0') + "-" + year;
            }

            $("#fromDate").val(fromdate);
            $("#fromDateCalendar").val(fromdate);
            $("#endDate").val(todate);
            $("#endDateCalendar").val(todate);
        } else {
            getprocessYrMtData();
            viewTdsData();
        }
    } else {
        getprocessYrMtData();
        viewTdsData();
    }
}
}

        var month = curdate.getMonth();

            var year = curdate.getFullYear() - 1;
            month = 12;
        } else {
            var month = curdate.getMonth();
            var year = curdate.getFullYear();
        }
    }
} else {
    var month = (curdate.getMonth() + 1);
    var year = curdate.getFullYear();
}
var nextmonth = month + 1;

    $("#attndmonth1").val(month + 1);
} else {
    $("#attndmonth1").val(month);
}
var fromdate = sday + "-" + String(month).padStart(2, '0') + "-" + year;
const lastDayOfMonth = new Date(year, month, 0).getDate();

    if (month == "12") {
        var todate = (parseInt(sday) - 1) + "-" +
            String(1).padStart(2, '0') + "-" + (year + 1);

        var todate = (parseInt(sday) - 1) + "-" +
            String(nextmonth).padStart(2, '0') + "-" + year;
    }
} else {

}

$("#fromDate1").val(fromdate);
