	// Function to parse time string in "h:iA" format to a Date object
	function parseTime(timeStr) {
	    const [time, modifier] = timeStr.split(" ");
	    let [hours, minutes] = time.split(":").map(Number);

	    if (modifier === "PM" && hours !== 12) {
	        hours += 12;
	    } else if (modifier === "AM" && hours === 12) {
	        hours = 0;
	    }
	    
	    const today = new Date();
	    today.setHours(hours, minutes, 0, 0);
	    return today;
	}

	    $('#multiple8').trigger('chosen:updated');  
	}

	// Custom cell renderer function for rating stars
	function ratingCellRenderer(params) {
	    const ratingValue = params.value || 0; // Default to 0 if no value

	    // Create the HTML for the star rating system
	    const starsHtml = `
	        <fieldset class="rating">
	            <input type="radio" class="rating1" id="star5-${params.node.id}" name="rating-${params.node.id}" value="5" ${ratingValue == 5 ? 'checked' : ''} /><label for="star5-${params.node.id}" title="Excellent">5 stars</label>
	            <input type="radio" class="rating1" id="star4-${params.node.id}" name="rating-${params.node.id}" value="4" ${ratingValue == 4 ? 'checked' : ''} /><label for="star4-${params.node.id}" title="Very Good">4 stars</label>
	            <input type="radio" class="rating1" id="star3-${params.node.id}" name="rating-${params.node.id}" value="3" ${ratingValue == 3 ? 'checked' : ''} /><label for="star3-${params.node.id}" title="High">3 stars</label>
	            <input type="radio" class="rating1" id="star2-${params.node.id}" name="rating-${params.node.id}" value="2" ${ratingValue == 2 ? 'checked' : ''} /><label for="star2-${params.node.id}" title="Medium">2 stars</label>
	            <input type="radio" class="rating1" id="star1-${params.node.id}" name="rating-${params.node.id}" value="1" ${ratingValue == 1 ? 'checked' : ''} /><label for="star1-${params.node.id}" title="Low">1 star</label>
	        </fieldset>
	    `;

	    // Create a div element to contain the rating system
	    const div = document.createElement('div');
	    div.innerHTML = starsHtml;

	    // Add event listeners to capture changes
	    const radios = div.querySelectorAll('input[type="radio"]');
	    radios.forEach(radio => {
	        radio.addEventListener('change', (event) => {
	            const selectedRating = event.target.value;
	            // Update the grid's data with the new rating value
	            params.node.setDataValue('rating', selectedRating);
	        });
	    });

	    return div;
	}
	function getCurrentTime() {
	    const now = new Date();
	    let hours = now.getHours();
	    const minutes = now.getMinutes();
	    const ampm = hours >= 12 ? 'PM' : 'AM';
	    
	    hours = hours % 12;
	    hours = hours ? hours : 12; // Convert '0' to '12' for 12 AM
	    const minutesStr = minutes < 10 ? '0' + minutes : minutes;

	    return hours + ':' + minutesStr + ' ' + ampm;
	}

	// Function to parse date and time strings into a Date object
	function parseDateTime(dateStr, timeStr) {
		 dateStr = String(dateStr);
		 timeStr = String(timeStr);
    	const [day, month, year] = dateStr.split('-').map(Number);
    	const [time, period] = timeStr.split(' ');
    	let [hours, minutes] = time.split(':').map(Number);
    	if (period && period.toUpperCase() === 'PM' && hours < 12) {
       	 	hours += 12;
    	} else if (period && period.toUpperCase() === 'AM' && hours === 12) {
        	hours = 0; // Midnight case
    	}

    
    return new Date(year, month - 1, day, hours, minutes); 
}

	function getWeekStartAndEnd(dateString) {
		console.log('Week dateString',dateString)
	    // Parse the input date (format: dd-mm-yyyy)
	    let parts = dateString.split("-");
	    let inputDate = new Date(parts[2], parts[1] - 1, parts[0]);

	    // Get the day of the week (0 - Sunday, 1 - Monday, ..., 6 - Saturday)
	    let dayOfWeek = inputDate.getDay();

	    // Calculate the first day (start of the week - Monday)
	    let firstDay = new Date(inputDate);
	    firstDay.setDate(inputDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));

	    // Calculate the last day (end of the week - Sunday)
	    let lastDay = new Date(firstDay);
	    lastDay.setDate(firstDay.getDate() + 6);

	    // Format the dates as dd-mm-yyyy
	    let formatDate = (date) => {
	        let day = date.getDate().toString().padStart(2, '0');
	        let month = (date.getMonth() + 1).toString().padStart(2, '0');
	        let year = date.getFullYear();
	        return `${day}-${month}-${year}`;
	    };
console.log('firstDay',firstDay)
console.log('lastDay',lastDay)
	    return {
	        firstDate: formatDate(firstDay),
	        lastDate: formatDate(lastDay)
	    };
	}

	function meetingType(){

		$('#multiple9').val([]).trigger('chosen:updated');

			$("#meetingGrid").show();
			$("#prevMeetingGrid").show();
			$("#meetingDtls").hide();
			var today = new Date();
		    var day = ('0' + today.getDate()).slice(-2); // Get the day and pad with zero if needed
			var month = ('0' + (today.getMonth() + 1)).slice(-2); // Get the month and pad with zero if needed
			var year = today.getFullYear(); // Get the full year

			// Combine parts into DD-MM-YYYY format
			var formattedDate = day + '-' + month + '-' + year;
			$("#meetingDate").val(formattedDate);
			meetingTypeDetails();

			document.getElementById("mySidenavPrevMeeting").style.display = "none";

		}

	function dateChangeMeeting(){
		var type=$("#meetingType").val();
		var meetingDate=$("#meetingDate").val();
		var fromDate="";
		var toDate="";
		
		 agGrid.simpleHttpRequest({
		        url: 'event-management-previous-meetinglist?meetingDate=' + meetingDate+"&type="+type+"&fromDate="+fromDate
		        		+"&toDate="+toDate
		    }).then(function(response) {
		        $('.loader').hide();
		        // Parse the response
		        var data = JSON.parse(response.body);
		        console.log('DATA',data)
		     
		        if(data==null){
		        	gridOptionsprevMeeting.api.setRowData([]);
		        }else{
		        	gridOptionsprevMeeting.api.setRowData(data);
		            var prevMeetingData = data.map(function (item, index) {
		    			return {
		    				slNo: index + 1,
		    				attendId: item.attendId,
		    				attendName:item.attendName,
		    				role: item.role,
		    				curType:item.curType,
		    				date:item.date,
		    				issue:item.issue,
		    				issueRaiseBy:item.issueRaiseBy,
		    				curAction:item.curAction,
		    				status:item.status
		    			};
		    		});
		            if (gridOptionsprevMeeting && gridOptionsprevMeeting.api) {
		            	gridOptionsprevMeeting.api.setRowData(prevMeetingData);
		    		} else {
		    			console.error("Grid options or API not defined.");
		    		}
		        }
		    });
	}

					agGrid.simpleHttpRequest({url: 'view-new-requi-mstr-view-data'}).then(function(data) {

			}

	function approve() {
		var selectedRows = gridOptions.api.getSelectedRows();
				 var id=selectedRows[0].eventId;
				$.ajax({
					type : "GET",
					url : "event-management-approve?id=" + id,
					async : false,
					success : function(response) {

						if (response.message == "Success") {
							
							$("#messageParagraph").text(
							"Event Approved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							//location.reload();
							//profileSelect();
							   gridOptions.api.setRowData();
			            		agGrid.simpleHttpRequest({
			            			url: "event-management-getview-dtls?id=" + id,
			            				}).then(function(response) {
			            					$('.loader').hide();
			            					 if (response.code === "success") {
			            						 var data = JSON.parse(response.body)[0]; 
			            						 var len = data.length;
			            					        $('#totalReq').find('span').html(len);
			            						 gridOptions.api.setRowData(data);
			            						 onQuickFilterChanged();
			            					 }
			            				})
							
							$('#delete').attr("disabled", true);
							$('#approveEvent').attr("disabled", true);
							$('#new').attr("disabled", false);
							$('#new').show();
							
						}

					},
					error : function(data) {
					}
				});
	}
	
	function prevTblIssueRaiseDropdown(newRows) {
	    var dropdown = document.getElementById('empNameAutoPrev'); 
	    dropdown.innerHTML = '<option value="">Select</option>';

	    newRows.forEach(function(attendee) {
	        var option = document.createElement('option'); 
	        option.value = attendee.attendId; 
	        option.text = attendee.attendName; 
	        option.setAttribute('data-code', attendee.role);
	        dropdown.appendChild(option);
	    });
