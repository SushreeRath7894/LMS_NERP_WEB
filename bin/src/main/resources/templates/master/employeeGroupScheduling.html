	var empIdAll =[];
	$(function () {
	    var selectedOptions = {};
		 
	    var autocomplete1 = new SlimSelect({
	        select: '#employeeDropdown',
	        multiple: true,
	        autocomplete: true,
	        icon: "fa fa-times",
	        onChange: function (key) {
	            var newSelectedOptions = {};

	            key.forEach(function (option) {
	                var empId = option.value;
	                var empName = option.text;
	                var department = option.data.department;
	                var designation = option.data.designation;

	                newSelectedOptions[empId] = {
	                    empName: empName,
	                    department: department,
	                    designation: designation
	                };

	                if (!selectedOptions[empId]) {
	                	empIdAll.push(empId)
	                    addRow(empId, empName, department, designation);
	                }
	            });

	            for (var empId in selectedOptions) {
	                if (!newSelectedOptions[empId]) {
	                    removeRow(empId);
	                	empIdAll = empIdAll.filter(id => id !== empId);
	                }
	            }

	            selectedOptions = newSelectedOptions;
	            
	          /*   if (empIdAll.length > 0) {
	                removeValidationMessage("toHiddenDesignation");
	            } */
	        },
	    });
	});

	function addRow(empId, empIdName, department, designation) {
		var empName = empIdName.split("-")[1].trim();
	    var newRow = `<tr id="row-${empId}">
	                    <td>${empId}</td>
	                    <td>${empName}</td>
	                    <td>${department}</td>
	                    <td>${designation}</td>
	                  </tr>`;
	    $('#empDtlsNew').append(newRow);
	}

	function view(sec) {
		if(sec == 'G'){
			$("#groupGsec").addClass("active");
			$("#groupAsec").removeClass("active");
			$("#groupBsec").removeClass("active");
			$("#groupCsec").removeClass("active");
		}else if(sec == '1'){
			$("#groupGsec").removeClass("active");
			$("#groupAsec").addClass("active");
			$("#groupBsec").removeClass("active");
			$("#groupCsec").removeClass("active");
			
		}else if(sec == '2'){
			$("#groupGsec").removeClass("active");
			$("#groupAsec").removeClass("active");
			$("#groupBsec").addClass("active");
			$("#groupCsec").removeClass("active");
			
		}else if(sec == '3'){
			$("#groupGsec").removeClass("active");
			$("#groupAsec").removeClass("active");
			$("#groupBsec").removeClass("active");
			$("#groupCsec").addClass("active");
			
		}
		agGrid.simpleHttpRequest({
			url : "employee-group-scheduling-view?sec=" + sec
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.details;
			if (allData == "" || allData == null || allData == 'null') {
				len = 0;
			} else {
				len = allData.length;
			}
			
			gridOptions.api.setRowData(allData);

			console.log("counts===",jsonData.counts)
			$("#groupGTotal").text(jsonData.counts.countgroupG);
			$("#groupATotal").text(jsonData.counts.countgroup1);
			$("#groupBTotal").text(jsonData.counts.countgroup2);
			$("#groupCTotal").text(jsonData.counts.countgroup3);
			$('#totalReq').find('span').html(len);

		});
	}

	function rowSelectOnchange(){
		 var selectedRows = activityOptions.api.getSelectedRows();
			var rowCount = 0;
			selectedRows.forEach(function(i) {
				rowCount = rowCount + 1;
			});
			
			if (rowCount > 0) {
			    var disableButton = false;

			    for (var i = 0; i < selectedRows.length; i++) {
			        var status = selectedRows[i].status;
			        
			        if (status == "PENDING") {
			            disableButton = true;
			            break;
			        }
			    }
			    if (disableButton) {
			        $('#swapBtn').attr('disabled', true);
			    }else{

			    }
			}else{

			        $('#deleteBtn').attr('disabled', true);
			    }else{

	function changeDateFormatCurrent(inputDate) { 
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

	function addNewGroup() {
		$(".formValidation").remove();
		
		$("#employeeDropdown").html('');
		$('#empDtlsNew').html('');
	    $('#assignGroupPopup').modal('show');
	    $('#filterFromDate').val('');
	    $('#remarks').val('');
	    $('#groupTypeModalNew').val('');
	    
	    var today = new Date();
		today.setDate(today.getDate() + 1);
		var toDayDate = today.toISOString().split('T')[0];
		var newDate = changeDateFormat(toDayDate);

		$("#filterFromDateNew").val(newDate);
		
		
	    var options = '';
	    
	    $('.loader-modal').show();
	    $("body").addClass("overlay");
	    agGrid.simpleHttpRequest({
	        url: 'employee-group-scheduling-empdtls'
	    }).then(function (data) {
	        var jsonData = JSON.parse(data.body);

	        if (jsonData != null) {
	            jsonData.forEach(function (rowNode) {
	                options += '<option value="' + rowNode.empId + '" data-department="' + rowNode.department + '" data-designation="' + rowNode.designation + '">' + rowNode.empId + '-' + rowNode.empName + '</option>';
	            });
	            $("#employeeDropdown").html(options);
	        } else {
	            $("#employeeDropdown").html('');
	        }

	    	 $('.loader-modal').hide();
	         $("body").removeClass("overlay");
	    });
	}
	    
	function changeDateFormat(date) {
	    var dateParts = date.split("-");
	    return dateParts[2] + "-" + dateParts[1] + "-" + dateParts[0];
	}

	function approveAll(slNo,flag){
		$(".loader").show();
		if(slNo){
			$.ajax({
				type : "GET",
				url : "employee-group-scheduling-approve?slNo=" + slNo + "&flag=" +flag,
				async : false,
				success : function(response) {
					if (response.code == "success") {
						$(".loader").hide();
						
						if(flag == "APPROVE"){
							$("#messageParagraph").text(
							"Group Approved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');	
						}else{
							$("#messageParagraph").text(
							"Group Deleted Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
						}
						$("#groupType").val('all');
						viewAll("all");
						$('#approveBtn').attr('disabled', true);
						$('#deleteBtn').attr('disabled', true);
					}else{
						$(".loader").hide();
						$("#messageParagraph").text(
						"Something Went Wrong. Try After some time.");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");

	function downloadDetailsAll(){
			var rowCount = 0;
			activityOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			    if (rowNode.data.empId) {
			        rowCount++;
			    }
			});
			if (rowCount > 0) {
				var name = "Employee Revised Group Details";
			    var allColumns = activityOptions.columnApi.getAllColumns();

			    allColumns.forEach(col => {
			        if (col.getColDef().headerName) {
			            col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
			        }
			    });

			    var visibleColumns = allColumns.filter(col => {
			        const headerName = col.getColDef().headerName;
			        const isColumnVisible = !col.getColDef().hide;
			        return headerName !== undefined && headerName !== null && isColumnVisible;
			    });

			    var visibleColumnIds = visibleColumns.map(col => col.getColId());

			    const params = {
			        skipHeader: false,
			        columnGroups: false,
			        skipFooters: false,
			        skipGroups: false,
			        skipPinnedTop: false,
			        skipPinnedBottom: false,
			        allColumns: true,
			        onlySelected: false,
			        suppressQuotes: false,
			        fileName: name + '.csv',
			        sheetName: 'Sheet1',
			        customHeader: null,
			        customFooter: null,
			        columnKeys: visibleColumnIds
			    };
			    activityOptions.api.exportDataAsCsv(params);
			} else {
			    $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");

			    $("#msgModal").modal('show');

		}
