<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style>
#myReq .ag-row-selected {
	background: #0076ba !important;
	color: #fff;
	text-indent: 10px !important;
}
#myReq .ag-row-selected::before {
	font-size: 8px;
	color: #FFF;
	content: '\e64c';
	font-family: 'themify';
	margin-right: 7px;
	position: relative;
	top: 3px;
	right: 4px;
}
.formValidation1 {
	font-size: 10px;
	font-weight: 100;
	color: #f60909f7;
	background-color: transparent;
	position: relative;
	top: -1px;
	padding: 3px 0px;
}
.sugg-cls ul {
	height: 150px;
	overflow-x: scroll;
	position: relative;
}
ul#autocomplete-list1 {
	position: relative;
	z-index: 999;
}
ul#autocomplete-list1 li {
	position: relative;
	color: #fff;
	padding-left: 6px;
	background-color: #1f57a8;
	border-bottom: solid 1px #6189c2;
	padding-top: 5px;
	padding-bottom: 5px;
}
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/26.2.0/ag-grid.min.noStyle.js"></script>
<script>

$(document).ready(function() {
	var curDate = new Date();
	var currMonth=curDate.getMonth()+1;
    $("#attndyear").val(curDate.getFullYear());
    $("#attndmonth").val(currMonth)
    getCurrentDateMonthYear();
    var gridDiv = document.querySelector('#myGrid');
	new agGrid.Grid(gridDiv, gridOptions);
	updateGridColumns(currMonth ,curDate.getFullYear());
	viewReport();
});

function viewReport() {
    var staff = $("#designation").val();
    var fromDate = $("#fromDate").val();
    var toDate = $("#endDate").val();
    var employedBy = $("#employedBy").val();
    
    $('.loader').show();
    $("body").addClass("overlay");
    agGrid.simpleHttpRequest({
        url : "view-attendance-report-view?fromDate="
            + fromDate + "&toDate=" + toDate
            + "&staff=" + staff+"&employedBy="+employedBy
    }).then(function(data) {
        var jsonData = JSON.parse(data.body);
        var allData = jsonData.employees;
        console.log("jsonData====",jsonData)
        console.log("allData====",allData)
        if(allData == null || allData == 'null'){
            allData = [];
        }
        gridOptions.api.setRowData(allData);
        var len = allData.length;
        $('#totalReq').text(len);
        $('.loader').hide();
        $("body").removeClass("overlay");
    });
}
function getCurrentDateMonthYear() {
    var curDate = new Date();
    var selectedYear = $("#attndyear").val();
    var selectedMonth = $("#attndmonth").val();
    var startDay = $("#startDayForAtten").val();    
    if (!selectedYear) {
        selectedYear = curDate.getFullYear();
    }
    selectedYear = selectedYear.split("-")[0];
    var fromDate, toDate;
    if (selectedMonth === "0") {
        fromDate = "01-01-" + selectedYear;
        toDate = "31-012-" + (parseInt(selectedYear) + 1);
    } else {
        var month = parseInt(selectedMonth);
        if (startDay > 1 && curDate.getDate() > startDay) {
            month = curDate.getMonth() + 1;
        }
        fromDate = startDay + "-" + String(month).padStart(2, '0') + "-" + selectedYear;
        toDate = startDay + "-" + String(month + 1).padStart(2, '0') + "-" + selectedYear;
    }
    $("#fromDate").val(fromDate);
    $("#fromDateCalendar").val(fromDate);
    $("#endDate").val(toDate);
    $("#endDateCalendar").val(toDate);
}

var columnDefs = [];
var rowData = [];
var gridOptions = {
	columnDefs: columnDefs,
	rowData: rowData,
	defaultColDef: {
		sortable: true,
		filter: true,
		resizable: true,
		width: 149,
		height: 10
	},
	rowSelection: 'multiple',
	suppressRowClickSelection: true,
};
function formatDate(date) {
    const day = String(date.getDate()).padStart(2, '0'); // Get day and pad with leading zero if necessary
    const month = String(date.getMonth() + 1).padStart(2, '0'); // Get month and pad with leading zero (months are 0-based)
    const year = date.getFullYear(); // Get full year
    return `${day}-${month}-${year}`;
}
function changeMonthYear() {
	var selectedYear = parseInt($("#attndyear").val());
	var month = parseInt($("#attndmonth").val());
	var currentDate = new Date();
	var currentYear = currentDate.getFullYear();
	var currentMonth = currentDate.getMonth() + 1;
    if (selectedYear === currentYear && month > currentMonth) {
    	fromDate = new Date(currentYear, currentMonth - 1, 1);
        toDate = currentDate; 
        month=currentMonth;
        $("#attndmonth").val(currentMonth);
        $("#fromDate").val(formatDate(fromDate));
        $("#fromDateCalendar").val(formatDate(fromDate));
        $("#endDate").val(formatDate(toDate));
        $("#endDateCalendar").val(formatDate(toDate));
        $("#messageParagraph").text("Select A Passed Month");
	    $("#msgOkModal").removeClass("btn3");
	    $("#msgOkModal").addClass("btn1");
	    $("#msgModal").modal('show');
    } else if (month === 0) { // If "All" is selected
    	var fromDate = new Date(selectedYear, 0, 1); // January 1st
        var toDate = new Date(selectedYear, 11, 31); // December 31st
        $("#fromDate").val(formatDate(fromDate));
        $("#fromDateCalendar").val(formatDate(fromDate));
        $("#endDate").val(formatDate(toDate));
        $("#endDateCalendar").val(formatDate(toDate));
    }else {
        fromDate = new Date(selectedYear, month - 1, 1);
        toDate = new Date(selectedYear, month, 0); // Last day of the month
        $("#fromDate").val(formatDate(fromDate));
        $("#fromDateCalendar").val(formatDate(fromDate));
        $("#endDate").val(formatDate(toDate));
        $("#endDateCalendar").val(formatDate(toDate));
    }
    updateGridColumns(month ,selectedYear);
    viewReport();
}
function getDaysInMonth(month, year) {
	console.log(month)
    const today = new Date();
	console.log(today)
	var curr_month=today.getMonth()+1;
	console.log(curr_month)
    if (month === curr_month && year === today.getFullYear()) {
        return today.getDate();
    } else {
        return new Date(year, month, 0).getDate();
    }
}
function updateGridColumns(month, year) {
     columnDefs = [ {
            headerName: "Employee ID",
            field: "empId",
            pinned: 'left',
            cellStyle: { textAlign: 'center' },
            width: 120
        }, {
            headerName: "Employee Name",
            field: "empName",
            pinned: 'left',
            cellStyle: { textAlign: 'left' },
            width: 200
        }, {
            headerName: "Department",
            field: "dept",
            cellStyle: { textAlign: 'center' },
            width: 150,
            hide: true,
        }, {
            headerName: "Sub Department",
            field: "subDept",
            cellStyle: { textAlign: 'center' },
            width: 160,
            hide: true,
        }, {
            headerName: "Designation",
            field: "desg",
            cellStyle: { textAlign: 'center' },
            width: 150,
        }
    ];
    // Get the number of days in the specified month
    var numberOfDays = getDaysInMonth(month, year);
    
    // Loop to create columns for each day of the month
    for (var day = 1; day <= numberOfDays; day++) {
        var date = new Date(year, month - 1 , day);
        var formattedDate = date.toISOString().split('T')[0]; // yyyy-mm-dd
        var dayName = date.toLocaleDateString('en-US', { weekday: 'short' }); // e.g., Mon
		console.log(date,"===",day,"---",dayName);
        columnDefs.push({
            headerName: `${day} (${dayName})`,
            headerClass: 'header-center',
            children: [ {
                    headerName: "In",
                    field: `punchIn_${day}`,
                    cellStyle: { textAlign: 'center' },
                    width: 45,
                    suppressMenu: true
                }, {
                    headerName: "Out",
                    field: `punchOut_${day}`,
                    cellStyle: { textAlign: 'center' },
                    width: 45,
                    suppressMenu: true
                }
            ]
        });
    }
    console.log("columnDefs==",columnDefs)
     gridOptions.api.setColumnDefs(columnDefs);
     gridOptions.api.refreshClientSideRowModel();
}
function cancelBar() {
	var id = document.getElementById("closeKey");
	id.style.display = "block";
	if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
		id.style.display = "none";
	}
}
function onQuickFilterChanged() {
	gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
	var totalRowCount = gridOptions.api.getModel().getRowCount();

    $('#totalReq').text(totalRowCount);
}
function getListForEmp() {
	gridOptions.api.setQuickFilter(document.getElementById('empSort').value);
	var totalRowCount = gridOptions.api.getModel().getRowCount();

    $('#totalReq').text(totalRowCount);
}
//changeStaff
function changeStaff() {
	viewReport();
}
function downloadApproveCSV() {
    var rowCount = 0;
    gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
        if (rowNode.data.empId) {
            rowCount++;
        }
    });

    if (rowCount > 0) {
        var name = "Attendance Report-" + $("#attndmonth option:selected").text();
        var allColumns = gridOptions.columnApi.getAllColumns();

        // Capitalize all headers for CSV
        allColumns.forEach(col => {
            if (col.getColDef().headerName) {
                col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
            }
        });

        // Filter visible columns
        var visibleColumns = allColumns.filter(col => {
            const headerName = col.getColDef().headerName;
            const isColumnVisible = !col.getColDef().hide;
            return headerName !== undefined && headerName !== null && isColumnVisible;
        });

        // Map visible column IDs for export
        var visibleColumnIds = visibleColumns.map(col => col.getColId());

        // CSV Export Parameters
        const params = {
            skipHeader: false,          // Include header row
            columnGroups: true,         // Export column groups (parent-child headers)
            skipFooters: false,         
            skipGroups: false,          
            skipPinnedTop: false,       
            skipPinnedBottom: false,    
            allColumns: false,          // Export only visible columns
            onlySelected: false,        
            suppressQuotes: false,      
            fileName: name + '.csv',    // File name for CSV
            sheetName: 'Sheet1',        
            customHeader: null,         
            customFooter: null,         
            columnKeys: visibleColumnIds // Use only the visible column keys
        };

        // Perform export
        gridOptions.api.exportDataAsCsv(params);
    } else {
        // Display message if no data available
        $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
        $("#msgOkModal").removeClass("btn3");
        $("#msgOkModal").addClass("btn1");
        $("#msgModal").modal('show');
    }
}
</script>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div id="grid">
						<div class="row">
							<input type="hidden" id="startDayForAtten" th:value="${startDayForAtten}" />
							<div class="col-md-2">
								<div class="form-group" id="type1">
									<label>Staff Type</label>
									<div class="select">
										<select id="designation" class="form-control" onchange="changeStaff()">
											<option value="All">All</option>
											<option th:each="c,iter:${staffType}" th:value="${c.key}" th:text="${c.name}"></option>
										</select>
									</div>
								</div>
							</div>
							<div class="col-md-2">
								<div class="form-group">
									<label>Employed By</label>
									<div class="select">
										<select class="form-control bandclssls" id="employedBy" onchange="changeStaff()">
											<option value="All">All</option>
											<option th:each="c,iter:${employedByList}" th:value="${c.key}" th:text="${c.name}"></option>
										</select>
									</div>
								</div>
							</div>
							<div class="col-md-2">
								<div class="form-group" id="finYearData">
									<label>Year</label>
									<div class="select">
										<select id="attndyear" class="form-control" onchange="changeMonthYear()">
											<option th:each="c,iter:${yearList1}" th:value="${c.name}" th:text="${c.name}"></option>
										</select>
									</div>
								</div>
							</div>
							<div class="col-md-2">
								<div class="form-group" id="finMonthData">
									<label>Month Name</label>
									<div class="select">
										<select id="attndmonth" class="form-control" onchange="changeMonthYear()">
										<!-- 	<option value="0">All</option> -->
											<option value="1" text="JANUARY">JANUARY</option>
											<option value="2" text="FEBRUARY">FEBRUARY</option>
											<option value="3" text="MARCH">MARCH</option>
											<option value="4" text="APRIL">APRIL</option>
											<option value="5" text="MAY">MAY</option>
											<option value="6" text="JUNE">JUNE</option>
											<option value="7" text="JULY">JULY</option>
											<option value="8" text="AUGUST">AUGUST</option>
											<option value="9" text="SEPTEMBER">SEPTEMBER</option>
											<option value="10" text="OCTOBER">OCTOBER</option>
											<option value="11" text="NOVEMBER">NOVEMBER</option>
											<option value="12" text="DECEMBER">DECEMBER</option>
										</select>
									</div>
								</div>
							</div>
							<div class="col-md-2">
								<label>From Date</label>
								<div class="form-group calendar_box">
									<input type="text" id="fromDate" value="" class="form-control" th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|" readonly>
								</div>
							</div>
							<div class="col-md-2">
								<label>To Date</label>
								<div class="form-group calendar_box">
									<input type="text" id="endDate" value="" class="form-control" th:attr="onkeyup=|formatDate('endDate','${session.DATEFORMAT_JS}')|" readonly>
								</div>
							</div>
						</div>
						<div class="d-flex justify-content-between mt-4">
											<div class="btn-hs">
								<div class="font-design">Attendance Report (<span id="totalReq"></span>)</div>
							</div>
											<div class="col-md-3  btn-hs" id="searchDiv">
												<div class="input-style">
													<input type="text" placeholder="Search.." name="search"
														class="searchboxinput" onkeyup="cancelBar()"
														oninput="onQuickFilterChanged()" id="quickFilter"
														autocomplete="off">
													<div class="searchicon">
														<a href="javascript: void(0)"><span
															style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
															id="closeKey"
															onclick="closekey()"
															class="close_i"><i class="ti-close srchicon"></i></span></a><a
															href="javascript: void(0)"><i
															class="ti-search srchicon"></i></a>
													</div>
												</div>

											</div>
											<div class="  btn-hs" id="empList">
												<div  class="form-group" >
													<div class="select">
														<select id="empSort" class="form-control"
															onchange="getListForEmp()">
															<option value="">All Employee</option>
															<option th:each="c,iter:${EmployeeList}" th:value="${c.key}"
																th:text="${c.name}"></option>
														</select>
													</div>
												</div>
											</div>
											<div class="buttonsec btn-hs" id="btndiv">
												<button class="btn4" onclick="downloadApproveCSV()">Download</button>
											</div>
										</div>
						<div id="myGrid" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>
					</div>
				</div>
				
				
			</div>
		</div>
	</div>
</body>
</html>
