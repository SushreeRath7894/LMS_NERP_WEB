<!-- ck editor slim selector CDN -->
<script

	src="https://cdnjs.cloudflare.com/ajax/libs/slim-select/1.27.0/slimselect.css"></script> -->
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/slim-select/1.27.0/slimselect.js"></script>
<!-- <script
	src="https://cdnjs.cloudflare.com/ajax/libs/slim-select/1.27.0/slimselect.min.css"></script> -->

	src="https://cdnjs.cloudflare.com/ajax/libs/slim-select/1.27.0/slimselect.min.mjs"></script>

<script type="text/javascript">
	$(document).ready(function() {
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);

		viewData();	
		$("#save").hide();
		$("#cancel").hide();
		$("#Cancel").hide();


		$('#delete').attr('disabled', true);	
		$('#add').attr('disabled', true);
		$('#approve').attr('disabled', true);
	});

	/* -------------------search bar for mygrid1------------------------ */

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalReq').find('span').html(totalRowCount);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	$('.collapse').on('show.bs.collapse', function() {
		$(this).siblings('.panel-heading').addClass('active');
	});

	$('.collapse').on('hide.bs.collapse', function() {
		$(this).siblings('.panel-heading').removeClass('active');
	});

	const columnDefs = [{
		headerCheckboxSelection : true,
		headerCheckboxSelectionFilteredOnly : true,
		checkboxSelection : true,
	//	 checkboxSelection: params => params.data.updatedDate === "1", // Only show checkbox if updatedDate is "1"
		width : 10,
		sortable : false,
		filter : false,
		resizable : true,
		pinned : 'left',
	
	},{
		headerName : 'Notice/Letter No.',
		field : "letterNo",
		pinned : 'left',
		width : 200,
		/* cellRenderer : function(params) {
			return '<a id="" onclick=editSalaryRevision("'
					+ params.data.editId + '","'+ params.data.status
					+ '") href="javascript:void(0)"> '
					+ params.data.empId + '  ' + '<i class="bi bi-pencil-square"></i></a>';
		}, */
		
	}, {
		headerName : 'Date',
		field : "date",
		pinned : 'left',
		   width: 200,
	}, {
		headerName : ' Type',
		field : "typedd",
		   width: 220,
	}, {
		headerName : ' Description',
		field : "desc",
		   width: 300,
	},/* {
		headerName : 'Notice Content',
		field : "content",
		width: 150,
		cellStyle : {
			textAlign : 'center'
		},cellRenderer : function(params) {
				let encodedLogData = encodeURIComponent(JSON.stringify(params.data));
	
				 return '<a id="id" onclick="openOverViewModal(decodeURIComponent(\'' + encodedLogData.replace(/'/g, "\\'") + '\'))" href="javascript:void(0)">'
			        + '<i class="bi bi-eye-fill" style="font-size: 10px;"> View </i>'
			        + '</a>';
		}
	
	}, */ {
		   headerName: 'Preview',
		   field: "pdf",
		   width: 220,
		   cellStyle: {
			      textAlign: 'center'
			   },
		   cellRenderer: function (params) {
			   if(params.data.letterNo){
				   var s = "";
				      s = ' <a href="#" class="grn-btn" onclick="previewAsPDF(\'' + params.data.letterNo + '\',\'' + params.data.typedd + '\')"><i class="fas fa-file-pdf"></i> Preview </a>';
				      return s;
				}else{
					 return '';
				}
		   }, 
		},];

	const gridOptions = {
		columnDefs : columnDefs,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 180,
			height : 10
		},
		rowSelection : 'multiple',
		onSelectionChanged : rowSelectData,
		suppressRowClickSelection : true,
		getRowNodeId : function(data) {
			return data.editId;
		}
	}
	function rowSelectData() {
		var selectedRows = gridOptions.api.getSelectedRows();

		var rowCount = 0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
		});
		if (rowCount == 1) {
			var sts = selectedRows[0].status;
			if(sts != 0){
				$('#approve').attr("disabled", true);
				$('#add').attr("disabled", false);
				$('#delete').attr("disabled", true);

			}else{
				$('#approve').attr("disabled", false);
				$('#add').attr("disabled", true);
				$('#delete').attr("disabled", false);

			}
		}else if(rowCount > 1){
			var count = 0;
			var c = 0;
			selectedRows.forEach(function(rowNode) {
				c++;
			    if (rowNode.status != 0) {
			        count++;
			    }
			});
			$('#add').attr("disabled", true);
			if(c == count){
				$('#approve').attr("disabled", true);
			}else{
				$('#approve').attr("disabled", false);
			}
		}else {
			$('#delete').attr("disabled", true); 
			$('#add').attr("disabled", true);
			$('#approve').attr("disabled", true);
		}

	}
	
	function previewAsPDF(noticeId, type){
		   var organization = $("#sessionOrganization").val();
		   var orgDivision = $("#sessionOrgDivision").val();
		   var logo = $("#sessionLogo").val();
		   var userId = $("#sessionId").val();
		   console.log("organization======",organization);
		   console.log("orgDivision======",orgDivision);
		   console.log("logo======",logo);
		   console.log("userId======",userId);
		   if(type == 'notice'){
			   window.open("/master/view-notice-letter-pdf-notice?noticeId=" +
					      window.btoa(noticeId) + "&organization=" +
					      window.btoa(organization) + "&orgDivision=" +
					      window.btoa(orgDivision) + "&userId=" +  window.btoa(userId) + "&logo=" + window.btoa(logo), '_blank');
		   }else if (type == 'letter'){
			   window.open("/master/view-notice-letter-pdf-letter?noticeId=" +
					      window.btoa(noticeId) + "&organization=" +
					      window.btoa(organization) + "&orgDivision=" +
					      window.btoa(orgDivision) + "&userId=" +  window.btoa(userId) + "&logo=" + window.btoa(logo), '_blank');
		   }
		   	  

	}
	function cancelModalBtnOverview(){
		$('#contentModal').modal('hide');
	}

	function openOverViewModal(data) {
		$("#noticeSpanId").text('');
		 $("#contentSpan").html('');
		 
		$('#contentModal').modal('show');
		
	    let allData = JSON.parse(decodeURIComponent(data));
	    
	    $("#noticeSpanId").text(allData.letterNo || 'N/A');
	    if (allData.content) {
	        $("#contentSpan").html(allData.content || 'N/A');
	    } else {
	        $("#contentSpan").html('<div style="color:#D2042D">No Content To Show</div>');
	    } 
	}
	function viewData(){
		$(".loader").show();
		   agGrid.simpleHttpRequest({
		      url: "view-notice-letter-alldata"
		   }).then(function (data) {
			   $(".loader").hide();
			   
			   if(data.body[0] != null){
		      var data = JSON.parse(data.body);
		      var jsonData = data.allData;
		      console.log("jsonData===",jsonData)
		         var len = jsonData.length;
		         $('#totalReq').find('span').html(len);
		         gridOptions.api.setRowData(jsonData);
		      } else {
		    	  $(".loader").hide();
		         $('#totalReq').find('span').html("0");
		         gridOptions.api.setRowData([]);
		      }

		      $(".loader").hide();
		   });
	}

</script>

</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">
						<div id="main_content">
							<div class="d-flex justify-content-between">
								<div class="btn-hs ">
									<div class="font-design" id="totalReq">All Notice/Letters (<span></span>)</div>
								</div>
								<div id="searchRowDiv">
									<div class="input-style">
										<input type="text" placeholder="Search.." name="search"
											class="searchboxinput" onkeyup="cancelBar()"
											oninput="onQuickFilterChanged()" id="quickFilter"
											autocomplete="off">
										<div class="searchicon">
											<a href="javascript:void(0)"><span
												style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
												id="closeKey"
												onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalReq').find('span').html(gridOptions.api.getModel().getRowCount());"
												class="close_i"><i class="ti-close srchicon"></i></span></a><a
												href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
										</div>
									</div>
								</div>
								<div class="buttonsec btn-hs" id="btndiv">
									<!-- <button class="btn4" onclick="downloadSalaryCSV()">Download</button>
									<button class="delete-btn" id="delete" onclick="deleteDetails()">Delete</button>
									<button class="approve-btn" id="approve" onclick="approve()">APPROVE</button>
									<button class="new-btn" id="add" onclick="openNav()">Revision</button> -->
									
									<input type="hidden" id="sessionOrganization"
											th:value="${organization}" /> <input type="hidden"
											id="sessionOrgDivision" th:value="${orgDivision}" /> <input
											type="hidden" id="baseURL" th:value="${baseURL}" /> <input
											type="hidden" id="sessionLogo" th:value="${logo}" />
											
								</div>
							</div>
							<div id="myGrid" style="width: 100%; height: 500px;"
								class="ag-theme-alpine"></div>
						</div>

					</div>
					<!-- ------------------------------------------------Modal-------------------------------------------------------------------------- -->
					<div class="modal fade show" id="contentModal">
						    <div class="modal-dialog modal-lg" style="margin-top: 130px;">
						        <div class="modal-content">
						            <!-- Modal Header -->
						            <div class="modal-header">
						                <h4 class="modal-title md-color">
						                    <b>Notice Content : <span id="noticeSpanId"></span></b>
						                </h4>
						            </div>
						
						            <!-- Modal Body -->
						            <div class="modal-body-overview modal-cat">
						                <div>
						                        <p><span id="contentSpan"></span></p>
						                </div>
						            </div>
						
						            <!-- Modal Footer -->
						            <div class="modal-footer">
						                <button class="delete-btn" data-dismiss="modal" onclick="cancelModalBtnOverview()">CLOSE</button>
						            </div>
						        </div>
						    </div>
						</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
