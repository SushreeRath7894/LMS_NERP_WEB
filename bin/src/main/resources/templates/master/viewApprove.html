//getCurrentDateMonthYear
function getCurrentDateMonthYear(){
	var curdate = new Date();
	var date = curdate.getDate();
	var mnth = curdate.getMonth();
	$("#attndyear").val(curdate.getFullYear())
	var sday = $("#startDayForAtten").val();
	if (parseInt(sday) > 1) {
		if (parseInt(date) > parseInt(sday)) {
			var month = (curdate.getMonth() + 1);
			var year = curdate.getFullYear();
		} else {
			var month = curdate.getMonth();
			if (month == 0) {
				var year = curdate.getFullYear() - 1;
				month = 12;
			} else {
				var month = curdate.getMonth();
				var year = curdate.getFullYear();
			}
		}
	} else {
		var month = (curdate.getMonth() + 1);
		var year = curdate.getFullYear();
	}

	var nextmonth = month + 1;
	if (parseInt(sday) > 1) {
		$("#attndmonth").val(month + 1);
	} else {
		$("#attndmonth").val(month);
	}

	var fromdate = sday + "-"
			+ String(month).padStart(2, '0') + "-" + year;
	const lastDayOfMonth = new Date(year, month, 0)
			.getDate();
	if (sday > 1) {
		if (month == "12") {
			var todate = (parseInt(sday) - 1) + "-"
					+ String(1).padStart(2, '0') + "-"
					+ (year + 1);
		} else {
			var todate = (parseInt(sday) - 1) + "-"
					+ String(nextmonth).padStart(2, '0')
					+ "-" + year;
		}
	} else {
		var todate = lastDayOfMonth + "-"
				+ String(month).padStart(2, '0') + "-"
				+ year;
	}

	$("#fromDate").val(fromdate);
	$("#fromDateCalendar").val(fromdate);
	$("#endDate").val(todate);
	$("#endDateCalendar").val(todate);
}

//viewAllApproveData
function viewAllApproveData(){
	var stafftype = $("#stafftype").val();
	var employedBy = $("#employedBy").val();
	var fromDate = $("#fromDate").val();
	var toDate = $("#endDate").val();
	$('.loader').show();
	agGrid.simpleHttpRequest(
			{
				url : "view-approve-view-details?fromDate="
						+ fromDate + "&toDate=" + toDate+ "&stafftype=" + stafftype+"&employedBy="+employedBy
			}).then(function(data) {
				$('.loader').show();
				var len = data.length;
				$('#totalReq').find('span').html(len);
			    $('.loader').hide();
			gridOptions.api.setRowData(data);
			countFilteredRows();
	});
}

	var curdate = new Date();
	var month = $("#attndmonth").val();
	var sday = $("#startDayForAtten").val();
	var attnyear = $("#attndyear").val();
	if (parseInt(sday) > 1) {
		if (month == 1) {
			var year = attnyear - 1;
			month = 12;
		} else {
			var year = attnyear;
			month = month - 1;
		}
	} else {
		var year = attnyear;
	}

	var nextmonth = parseInt(month) + 1;

	var fromdate = sday + "-" + String(month).padStart(2, '0') + "-" + year;

//changeMonthYear

		var curdate = new Date();
		var attnyear = $("#attndyear").val();
		var month = $("#attndmonth").val();
		var date = curdate.getDate();
		var mnth = curdate.getMonth();
		var sday = $("#startDayForAtten").val();
		var mt=month-1;
	if(attnyear>curdate.getFullYear()){

			$("#msgOkModal").removeClass("btn3");

					} else {

					}
				}
			} else {

				var year = attnyear;
			}

			var nextmonth = month + 1;
			if (parseInt(sday) > 1) {
				$("#attndmonth").val(month + 1);
			} else {
				$("#attndmonth").val(month);
			}

			var fromdate = sday + "-"
					+ String(month).padStart(2, '0') + "-" + year;
			const lastDayOfMonth = new Date(year, month, 0)

			if (sday > 1) {
				if (month == "12") {
					var todate = (parseInt(sday) - 1) + "-"

				} else {
					var todate = (parseInt(sday) - 1) + "-"

	    if (rowCount > 0) {
	        var name = "Approve Salary -" + $("#attndmonth option:selected").text();
	        var allColumns = gridOptions.columnApi.getAllColumns();
	        
	        allColumns.forEach(col => {
	            if (col.getColDef().headerName) {
	                col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
	            }
	        });
	        
	        var visibleColumns = allColumns.filter(col => {
	            const headerName = col.getColDef().headerName;
	            const isColumnVisible = !col.getColDef().hide;
	            return headerName !== undefined && headerName !== null && isColumnVisible;
	        });
	        
	        var visibleColumnIds = visibleColumns.map(col => col.getColId());
	        
	        // Create CSV header
	        var headers = visibleColumns.map(col => '"' + col.getColDef().headerName + '"');
	        csvContent += headers.join(',') + '\n';
	        
	        // Create CSV data rows
	        gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
	            if (rowNode.data.empId) {
	                var data = visibleColumnIds.map(colId => '"' + rowNode.data[colId] + '"');
	                csvContent += data.join(',') + '\n';
	            }
	        });
	        
	        // Create a Blob with the CSV content
	        var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
	        var link = document.createElement("a");
	        if (link.download !== undefined) {
	            var url = URL.createObjectURL(blob);
	            link.setAttribute("href", url);
	            link.setAttribute("download", name + ".csv");
	            link.style.visibility = 'hidden';
	            document.body.appendChild(link);
	            link.click();
	            document.body.removeChild(link);
	        }
	    } else {
	        $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
	        $("#msgOkModal").removeClass("btn3");
	        $("#msgOkModal").addClass("btn1");
	        $("#msgModal").modal('show');
	    }
	}

	 	var monthYear=monthname+" "+y[2];

		} 
</script>
