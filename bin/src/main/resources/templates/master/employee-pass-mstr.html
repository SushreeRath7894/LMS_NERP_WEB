	function viewData(module,id,selectId=null) {
		$(".loader").show();
		agGrid.simpleHttpRequest({
			url : "employee-pass-all-entries?module="+module+"&type="+type,
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.viewPass;
			if(module == "HRMS"){
				if (allData != null) {
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					
					gridOptions.api.setRowData(allData);
					$(".loader").hide();
					if (selectId !== null) {  
					    let selectedRow = null;  
					    gridOptions.api.forEachNode((rowNode) => {  
					        if (rowNode.data.passId === selectId) {  
					            selectedRow = rowNode;  
					        }  
					    });
					if(id){
						gridOptions.api.getRowNode(id).setSelected(true);
					}else if(allData && allData.length > 0){
						let rowId = allData[0].passId;
						gridOptions.api.getRowNode(rowId).setSelected(true);
						$(".loader").hide();
					}
					}else{
						var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0);
						if (firstRowNode) {
							firstRowNode.setSelected(true);
						}	
					}
				} else {
					$('#totalReq').find('span').html("0");
					gridOptions.api.setRowData();
					onSelectionChanged()
				}
			}

			$(".loader").hide();
		});

	}

	function editPass(passId) {
		
		$("#passId").val("");
		$("#empNameAuto").val("");
		$("#employeeId").val("");
		$("#passType").val("");
		$("#passPurpose").val("");
		$("#date").val("");
		$("#toDate").val("");
		$("#fromTime").val("");
		$("#toTime").val("");
		$("#empNameAuto").val('');
		$("#suggesstion-box_").hide();
		$("#employeeName").val('');
		$("#employeeId").val('');
		$('.loader').show();
		$.ajax({
			type : "GET",
			url : "employee-pass-get-pass?id=" + passId,
			success : function(response) {
				if (response.message == "success") {
					var data = JSON.parse(response.body);
					var viewPass = data.viewPass[0];

					$(".formValidation").remove();
					
					$("#entryFromTime").show();
					$("#entryToTime").show();
					
					$("#passId").val(viewPass.passId);
					$("#empNameAuto").val(viewPass.empName);
					$("#employeeId").val(viewPass.employeeId);
					$("#passType").val(viewPass.passType);
					$("#passPurpose").val(decodeURIComponent(viewPass.passPurpose));
					$("#date").val(viewPass.fromDate);
					$("#toDate").val(viewPass.toDate);
					$("#fromTime").val(viewPass.fromTime);
					$("#toTime").val(viewPass.toTime);
					$('.loader').hide();
					/* $("#generatePassModal").modal('show');
					$('.loader-modal').hide();
					$('.loader-modal-autosearch').hide(); */
					$("#add").show();
				}

			}
		});

	function savePass(passId) {
	    var obj = {};
	    var valid = true;

	    obj.passId = $("#passId").val();
	    obj.employeeId = $("#employeeId").val();
	    obj.purpose = encodeURIComponent($("#passPurpose").val());
	    obj.fromDate = $("#date").val();
	    obj.toDate = $("#toDate").val();
	    obj.fromTime = $("#fromTime").val();
	    obj.toTime = $("#toTime").val();

	    if (!obj.employeeId) {
	        toastr.error("Employee name required");
	        return;
	    }
	    if (!obj.fromDate) {
	        toastr.error("From date required");
	        return;
	    }
	    if (!obj.toDate) {
	        toastr.error("To date required");
	        return;
	    }
	    if (!obj.fromTime) {
	        toastr.error("From time required");
	        return;
	    }
	    if (!obj.toTime) {
	        toastr.error("To time required");
	        return;
	    }
	    if (!obj.purpose) {
	        toastr.error("Purpose required");
	        return;
	    }

	    console.log('obj>>', obj);

	    if (valid) {
	        var selectedRowId = passId || obj.passId; // Store selected row ID before update
	        $(".loader-modal").show();

	        $.ajax({
	            type: "POST",
	            url: "emploee-pass-save-pass",
	            dataType: "json",
	            contentType: "application/json",
	            data: JSON.stringify(obj),
	            success: function(response) {
	                $(".loader-modal").hide();

	                if (response.code === "Success") {
	                    toastr.success(response.message);
	                    $('#replyBtn').attr("disabled", true);
	                    $("#generatePassModal").modal('hide');

	                    var module = 'HRMS';
	                    viewData(module, selectedRowId);
	                    
	                } else if (response.code === "failed") {
	                    toastr.error(response.message);
	                } else {
	                    toastr.error("Something went wrong.");
	                }
	            },
	            error: function(data) {
	                $(".loader-modal").hide();
	            }
	        });
	    }
	}

	function calculateTotalDuration() {
		
		    var date1 = $("#date").val(); // Assuming date1 is in "DD-MM-YYYY" format
		    var date2 = $("#toDate").val(); // Assuming date2 is in "DD-MM-YYYY" format

		    if (date1 && date2) {
		        function parseDate(dateStr) {
		            var parts = dateStr.split('-');
		            if (parts.length !== 3) {
		                console.error('Invalid date string format');
		                return null;
		            }
		            var day = parseInt(parts[0], 10);
		            var month = parseInt(parts[1], 10) - 1; // JavaScript months are 0-based
		            var year = parseInt(parts[2], 10);
		            return new Date(year, month, day);
		        }

		        var fromDateObj = parseDate(date1);
		        var toDateObj = parseDate(date2);

		        if (!fromDateObj || !toDateObj) {
		            console.error('Failed to parse one or both dates');
		            return;
		        }

		        if (fromDateObj > toDateObj) {
		        	toastr.error("Please choose a valid date range.");
		            $("#date").val("");
		            $("#toDate").val("");
		            return;
		        }

		    }
		}
