<head>
<style>
.btn-outline-primary {
	color: #007bff;
	background-color: rgb(240 243 241/ 90%);

}

.form-control {

	width: 100%;
	font-size: 12px;
	color: #929292;
	background-color: #ffffff !important;
	background-clip: padding-box;
	border: 1px solid #aeaeae !important;
	transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
	line-height: 1.5;
	border-radius: 0.25rem;
	padding: 2px 6px !important;
	color: black;
	font-weight: bold;
	height: 35px;
	transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
	-webkit-appearance: none;
	-moz-appearance: none;
	appearance: none;
}

.pl-3 {
	padding-left: 10px;
}

input[name="gridInput"] {
	padding: 0;
	background: rgba(138, 43, 226, 0.1);
	width: 100%;
	border: inset;
	border-color: rgba(138, 43, 226, 0.1);
	height: 100%;
}

input[name="gridInput"]:active, input[name="gridInput"]:focus, input[name="gridInput"]:hover
	{
	background: transparent;
}

.ag-cell-value:has(input[name="gridInput"]) {
	text-overflow: inherit;
	padding: 0 !important;
}

input[name="gridInput1"] {
	padding: 0;
	background: rgba(138, 43, 226, 0.1);
	width: 100%;
	border: inset;
	border-color: rgba(138, 43, 226, 0.1);
	height: 100%;
}

input[name="gridInput1"]:active, input[name="gridInput1"]:focus, input[name="gridInput1"]:hover
	{
	background: transparent;
}

.ag-cell-value:has(input[name="gridInput1"]) {
	text-overflow: inherit;
	padding: 0 !important;
}

input[name="gridInput2"] {
	padding: 0;
	background: rgba(138, 43, 226, 0.1);
	width: 100%;
	border: inset;
	border-color: rgba(138, 43, 226, 0.1);
	height: 100%;
}

input[name="gridInput2"]:active, input[name="gridInput2"]:focus, input[name="gridInput2"]:hover
	{
	background: transparent;
}

.ag-cell-value:has(input[name="gridInput2"]) {
	text-overflow: inherit;
	padding: 0 !important;
}
 #myGrid .ag-body-viewport {
    height: 500px;
}
</style>
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css"
	rel="stylesheet">

<script src="../javaScript/ticket/wet-clean-checklist.js"></script>

</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div>
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="row row-cols-auto g-3">
						<div class="col">
							<div class="font-design" id="totalWetCleanChecklist">
								Total Wet Clean Checklist(<span></span>)
							</div>
						</div>
						<div class="col ms-auto">
							<!-- Start -->
							<div class="row mb-2">

                                        Month
                                    </div>
                                    <div class="col-md-2">

                                    <div class="select form-control">

                                            <option value="">Select Month</option>

                                    </div>

								<div class="col text-end">
									<div class="buttonsec btn-hs">
										<input type="button" class="btn1" style="width: 100px"
											id="newButton" value="New Record" onclick="openNewModal()">
										<input type="button" class="btn3" style="width: 100px"
											id="deleteWebCleanChecklist" value="Delete"
											onclick="deleteFun()"> <input type="button"
											class="btn1" style="width: 100px"
											id="approveWebCleanChecklist" value="Approve"
											onclick="approveFun()">
									</div>
								</div>


							</div>
							<!-- End -->
						</div>
					</div>
					<!--Modal Start -->
					<div class="modal fade" id="wetChecklistModal" tabindex="-1"
						role="dialog" data-bs-backdrop="static" data-bs-keyboard="false"
						aria-labelledby="staticBackdropLabel" aria-hidden="true">
						<div class="modal-dialog modal-md modal-dialog-centered"
							role="document">
							<div class="modal-content">

								<div class="modal-body">
									<h4>Select an Option</h4>
									<div class="dropdown-section">
										<label for="selectionDropdown">Choose an option:</label> <select
											id="selectionDropdown" class="dropdown"
											onchange="validateSelection()">
											<option value="" disabled selected>Select an option</option>
											<option value="PHASE01">PHASE-01</option>
											<option value="PHASE02">PHASE-02</option>
											<!-- Add more options as needed -->
										</select>
									</div>

									<div class="modal-footer">
										<button id="cancelButton" class="btn3" onclick="cancelModal()">Cancel</button>
										<button id="selectButton" class="btn1" onclick="openNewPage()"
											disabled>Select</button>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!--Modal End-->
					<div id="myGrid" style="width: 100%; height: 500px;"
						class="ag-theme-alpine"></div>

					<div id="peforationRecordDiv">
						<!-- Buttons -->
						<div class="row cols-1 g-3 align-items-center">
							<div class="d-flex justify-content-between innerstickybg">
								<div type="hidden" id="checklistId" class="text-white pl-3">
									Wet Clean Checklist:<span id="WetCheckId"></span>
								</div>
								<div>
									<button id="saveWetChecklist" class="btn1"
										onclick="saveWetCleanData()">Save</button>
									<button id="cancelButton" class="btn3"
										onclick="cancelNewPage()">Cancel</button>
								</div>
							</div>
							<div class="col">

								<!-- Date Fields -->
								<div class="d-flex gap-3">
									<label for="phaseField">Phase Status:</label> <input
										type="text" id="selectedPhase" disabled>
									<div>
										<label>Date :</label>
									</div>
									<div class="form-group" id="issueDateDiv">
										<div class="form-group calendar_box">
											<input type="text" id="issueDate" placeholder="Issue Date"
												class="form-control" readonly> <i
												class="ti-calendar picker_calendar" id="issueDateCalendar"
												style="top: 10px; right: 10px;"></i>
										</div>
									</div>

								</div>
							</div>
							<!-- ag-Grid Section -->
							<div class="d-flex justify-content-start bg-primary"></div>

							<div id="myNewGrid" style="width: 100%; height:auto;"
								class="ag-theme-alpine"></div>

							<div class="d-flex justify-content-start bg-primary"></div>
							<div id="myNewGrid2" style="width: 100%; height:auto;"
								class="ag-theme-alpine"></div>
							<div class="d-flex justify-content-start bg-primary"></div>
							<div id="myNewGrid3" style="width: 100%; height: auto;"
								class="ag-theme-alpine"></div>
						</div>
					</div>
					<!-- delete modal start -->
					<div id="delete" class="modal fade show" tabindex="-1"
						role="dialog" data-bs-backdrop="static" data-bs-keyboard="false"
						aria-labelledby="staticBackdropLabel" aria-hidden="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p>Do you really want to delete this data? This process
										cannot be undone.</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">
									<button type="button" class="cancel-btn"
										data-bs-dismiss="modal" onclick="cancelModalBtnDlt();">Cancel</button>
									<button type="button" class="delete-btn"
										onclick="deleteWebCleanChecklist()">Delete</button>
								</div>
							</div>
						</div>
					</div>
					<!-- approve modal start -->
					<div id="approveModal" class="modal fade show" tabindex="-1"
						role="dialog" data-bs-backdrop="static" data-bs-keyboard="false"
						aria-labelledby="staticBackdropLabel" aria-hidden="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p>Do you want to approve this logbook? Once done you will
										not be able to make further changes.</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">

									<button type="button" class="cancel-btn"
										data-bs-dismiss="modal" onclick="cancelModalBtnApr();">Cancel</button>
									<button type="button" class="new-btn"
										onclick="approveWebCleanChecklist()">Approve</button>
								</div>
							</div>
						</div>
					</div>
