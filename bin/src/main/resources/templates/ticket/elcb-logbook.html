	function changeDateFormat(inputDate) {
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	var date1 = (new Date()).toISOString().split('T')[0];
	var newDate = changeDateFormat(date1);
	$("#checkinDate").val(newDate);
	onChangeDate() ;
	//
	
}

function onChangeDate() {
    var checkinDate = $("#checkinDate").val();
    
    if (checkinDate) {
        let [day, month, year] = checkinDate.split('-').map(Number);
        let date = new Date(year, month - 1, day);

        // Add one month to the date
        let nextMonth = date.getMonth() + 1;
        let nextYear = date.getFullYear();
        
        // If adding one month goes beyond December, adjust the year and month
        if (nextMonth > 11) {
            nextMonth = 0;
            nextYear += 1;
        }

        // Calculate the last day of the next month
        let lastDayOfNextMonth = new Date(nextYear, nextMonth + 1, 0).getDate();

        // Check if the original date is at the end of the month or beyond the last day of the next month
        let isEndOfMonth = (day === new Date(year, month - 1, 0).getDate());
        if (isEndOfMonth || day > lastDayOfNextMonth) {
            // If the original day is at the end of the month or exceeds the last day of the next month, adjust to the last day of the next month
            date = new Date(nextYear, nextMonth, lastDayOfNextMonth);
        } else {
            // Regular case: add one month with the same day
            date = new Date(nextYear, nextMonth, day);
        }

        // Extract the new values
        let newYear = date.getFullYear();
        let newMonth = (date.getMonth() + 1).toString().padStart(2, '0'); // Handle 0-indexed months
        let newDay = date.getDate().toString().padStart(2, '0');  // Handle day of the month

        // Set the calculated date in dd-mm-yyyy format
        $("#dueDate").val(`${newDay}-${newMonth}-${newYear}`);
    }
}

//	item.equiType = elcbTypeSelect.options[elcbTypeSelect.selectedIndex].text;

	 }

		 }

		}

function savePlanDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "elcb-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
			if (response.code == "success") {
				cancel();
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('.loader').hide();
				agGrid.simpleHttpRequest({
					url : 'elcb-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.elcb;
					//console.log("allData===",allData)
					var len = allData.length;
					$('#totalAsset').find('span').html(len);
					gridOptions.api.setRowData(allData);
					onSelectionChanged();
				});
				
			} else if(response.code == "unsuccess1"){

				$("#elcbType").val('');
				$("#equipmentName").val('');
				
				$('.loader').hide();
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}
				else {
				$('.loader').hide();
				$("#messageParagraph").text("Something Went Wrong");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

					 <div class="modal fade" id="newModal" tabindex="-1" role="dialog"
					aria-labelledby="exampleModalCenterTitle" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
					<div class="modal-dialog modal-dialog-centered modal-xl" role="document">
						<div class="modal-content">
							<div class="modal-header">
								<div class="innerstickybg">
									<div class="row">
										<div class="col-md-6">
											ELCB Id: <span id="logbookbox"></span>
										</div>
									</div>
								</div>

							</div>
							<div class="modal-body">
							
								<div class="row">
									<input type="hidden" id="elcbId">

									<div class="col-md-6" >
										<div class="form-group">
											<label> Type </label>
											<div class="select">
												<select id="elcbType" onchange="setEquipmentname();"  onblur="removeValid(event)">
													<option value="">Select</option>
													<option th:each="c:${elcbType}" th:value='${c.name}'
														th:text="${c.key}" th:name="${c.key}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									
									<div class="col-md-6" >
										<div class="form-group">
											<label> Equipment Name </label>
											<input type="text" class="form-control" id="equipmentName" onblur="removeValid(event)"
											autocomplete="off" disabled style="background-color: #ccc;">
											
										</div>
									</div>
									
									<div class="col-md-6">
										<div class="form-group calendar_box">
											<label>Check-In Date</label> <input type="text" onChange="onChangeDate();"
												id="checkinDate" autocomplete="off" class="form-control"
												onblur="removeValid(event)"
												th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|"
												readonly> <i class="ti-calendar picker_calendar"
												id="fromDateCalendar"></i>
										</div>
									</div>
									
									<div class="col-md-6">
										<div class="form-group">
											<label>ELCB Rating in</label> 
												<div class="select">
												<select id="elcbRating" onblur="removeValid(event)">
													<option value="">Select</option>
													<option value="30MA">30MA</option>
													<option value="100MA">100MA</option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									<div class="col-md-6">
									<div class="form-group">
										<label>Tripping Time in</label> <input type="text"
											class="form-control " id="tripingTime"
											onblur="removeValid(event)">
									</div>
									</div>
									
									
									<div class="col-md-6">
										<div class="form-group calendar_box">
											<label>Next Due Date</label> <input type="text"
												id="dueDate" autocomplete="off" class="form-control"
												onblur="removeValid(event)"
												th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|"
												readonly> <i class="ti-calendar picker_calendar"
												id="fromDateCalendar1"></i>
										</div>
									</div>
									
									<div class="col-lg-12">
										<div class="form-group">
											<label>Remarks</label> <textarea type="text"
												class="form-control transparenttxtbox" id="remark"
												onblur="removeValid(event)"></textarea>
										</div>
									</div>
									
									<div class="col-md-5" >
										<div class="form-group" id="emplist">
											<label> Uploaded By </label>
											<div class="select">
												<select id="assetemployee" onblur="removeValid(event)">
													<option value="">Select</option>
													<option th:each="c:${empLists}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									
									<input type="hidden" id="type">
								</div>
							</div>
							
							<div class="modal-footer">
								<button class="cancel-btn" id="cancelBtn" onclick="cancel()">Cancel</button>
											<button class="approve-btn" id="save"
												onclick="masterSaveData()">Save</button>
							</div>
						</div>
					</div>
				</div>
					
				</div>
			</div>
		</div>
	</div>
</body>
</html>
