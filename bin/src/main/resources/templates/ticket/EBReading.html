//function for row select parents
var id = "";
var apstatus = "";

function onSelectionChanged() {
	var selectedNodes = gridOptions.api.getSelectedNodes();
	 var selectedData = selectedNodes.map(node => node.data);
	 
	 id= selectedData.map(node => node.logbookId);
	 apstatus=selectedData.map(node => node.approveStatus);
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});

	if (rowCount > 0) {
			if(apstatus=="Approved"){
			$('#newBtn').attr('disabled', true);
			$('#reqDltBtn').attr("disabled", true);
			$('#approveBtn').attr("disabled", true);
			
			
		}else{
			$('#approveBtn').attr("disabled", false);
			$('#reqDltBtn').attr("disabled", false);
			$('#newBtn').attr('disabled', true);
		}
	}else {
		$('#reqDltBtn').attr("disabled", true);
		$('#approveBtn').attr("disabled", true);
		$('#newBtn').attr('disabled', false);
	}
}

	function changeDateFormat(inputDate) {
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	var date1 = (new Date()).toISOString().split('T')[0];
	var newDate = changeDateFormat(date1);
	$("#date").val(newDate);
	
}
//function for cancel
function cancel() {
	$('#newModal').modal('hide');
	gridOptions.api.setQuickFilter(null);

//master save data
function masterSaveData() {
	$(".formValidation").remove();
	var valid= true;
	var datas = [];
	var item = {};
	
	
	item.logbookId = $("#logbookId").val();
	item.date = $("#date").val();
	item.kwh = $("#kwh").val();
	item.kvah = $("#kvah").val();
	item.shift = $("#shift").val();
	item.uploadBy = $("#assetemployee").val();
	
	
	 if (item.uploadBy == null || item.uploadBy == "") {
		valid = validationUpdated("Uploaded By is Required", "assetemployee");
	 }
	 if (item.kwh == null || item.kwh == "") {
			valid = validationUpdated("KWH reading is Required", "kwh");
		 }
	 if (item.kvah == null || item.kvah == "") {
			valid = validationUpdated("KVAH reading is Required", "kvah");
		 }
	 if (item.shift == null || item.shift == "") {
			valid = validationUpdated("Shift is Required", "shift");
		 }
	 if (item.date == null || item.date == "") {
			valid = validationUpdated("Date is Required", "date");
		 }
	 
	
	if (valid) {
		datas.push(item);
		console.log("111111111111",datas);
		savePlanDetails(datas);
		}
}

function savePlanDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "EBReading-details-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('.loader').hide();
				agGrid.simpleHttpRequest({
					url : 'EBReading-details-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.logbook;
					var len = allData.length;
					$('#totalEBR').find('span').html(len);
					gridOptions.api.setRowData(allData);
					onSelectionChanged()
				});
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

				 if(rowData.approveStatus=="Approved"){

/* 		var rowNode = gridOptions.api.getDisplayedRowAtIndex(rowIndex);
	     */
	    console.log(rowData);

// function for delete qc  
function deleteOnclick() {
	
		if (id) {
			$('.loader').show();
				$.ajax({
		type : "POST",
		url : "EBReading-details-delete?id="+ id,
		success : function(response) {
		 if (response.code == "success") {
			 cancel();
				$("#messageParagraph").text("LogBook Deleted Successfully");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('#delete').modal('hide');
				agGrid.simpleHttpRequest({
					url : 'EBReading-details-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.logbook;
					var len = allData.length;
					$('#totalEBR').find('span').html(len);
					gridOptions.api.setRowData(allData);
					onSelectionChanged()
				});
				$('.loader').hide();
			} else {
				$("#messageParagraph").text("Something went to wrong!");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('.loader').hide();
			}
		},
		error : function(data) {
		}
	})
		} else {
			$('.loader').hide();
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
		}

}
