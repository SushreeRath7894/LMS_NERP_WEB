.my-container {
    transition: .4s;
    margin-left: 72px;
}
.edit {
    font-size: 18px;
    color: #716f6f;
    margin-bottom: 10px;
    font-weight: 500;
}

.click-links{
    font-weight: 600;
    text-decoration: none;
}

/* New Styles for User Creation Modal */
.modern-modal {
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    border: none;
}

.modern-modal .modal-header {
    background: linear-gradient(135deg, #0076ba, #00a1e0);
    color: white;
    padding: 20px;
    border-bottom: none;
}

.modern-modal .modal-title {
    font-weight: 600;
    font-size: 1.5rem;
}

.modern-modal .modal-body {
    padding: 25px;
}

.modern-modal .close {
    color: black;
    opacity: 0.8;
    text-shadow: none;
}

.modern-modal .form-group {
    margin-bottom: 1.5rem;
}

.modern-modal label {
    font-weight: 500;
    color: #555;
    margin-bottom: 0.5rem;
}

.modern-modal .form-control {
    border-radius: 8px;
    padding: 10px 15px;
    border: 1px solid #ddd;
    transition: all 0.3s;
}

.modern-modal .form-control:focus {
    border-color: #0076ba;
    box-shadow: 0 0 0 0.2rem rgba(0, 118, 186, 0.25);
}

.modern-modal .btn-upload {
    background-color: #f8f9fa;
    border: 1px dashed #ddd;
    padding: 15px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
}

.modern-modal .btn-upload:hover {
    background-color: #e9ecef;
    border-color: #0076ba;
}

.modern-modal .profile-preview {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto;
    display: block;
    border: 3px solid #e9ecef;
}

.modern-modal .gender-options {
    display: flex;
    gap: 15px;
}

.modern-modal .gender-option {
    flex: 1;
    text-align: center;
}

.modern-modal .gender-option input[type="radio"] {
    display: none;
}

.modern-modal .gender-option label {
    display: block;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
}

.modern-modal .gender-option input[type="radio"]:checked + label {
    background-color: #e3f2fd;
    border-color: #0076ba;
    color: #0076ba;
}

.modern-modal .modal-footer {
    border-top: none;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 0 0 12px 12px;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .modern-modal .modal-dialog {
        margin: 10px;
    }
    
    .modern-modal .row {
        margin-left: 0;
        margin-right: 0;
    }
    
    .modern-modal .col-md-6 {
        padding-left: 0;
        padding-right: 0;
    }
}

/* Floating action button */
.new-user-btn {
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0076ba, #00a1e0);
    color: white;
    border: none;
    font-size: 24px;
    box-shadow: 0 4px 20px rgba(0, 118, 186, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1000;
    transition: all 0.3s;
}

.new-user-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(0, 118, 186, 0.4);
}

.new-user-btn i {
    margin-top: 2px;
}

<script>
	$(document).ready(
			function() {

				$("#selectRole").click(
						function() {
							$(".roletxtsec").empty();
							var selectedRows = roleOptions.api
									.getSelectedRows();
							selectedRows.forEach(function(selectedRow, index) {

								var div = '<div class="rolestxt">'
										+ selectedRow.roleName + '</div>';

								$(".roletxtsec").append(div);
							});
							closeModal();
						})

				$("#browseBtn").click(function() {
					$("#browseModal").modal("show");
				})

				$("#empBtn").click(
						function() {
							$("#employeeModal").modal("show");
							empOptions.api.deselectAll();
							$("#myEmpGrid > .ag-header").attr("style",
									"display:none;");
							var empId = $("#userEmployee").val();
							var datas = [];
							empOptions.api
									.forEachNode(function(rowNode, index) {
										if (rowNode.data.key === empId) {
											empOptions.api.selectNode(rowNode,
													true);
										}
									});
						})

				$("#saveEmpData").click(function() {

					data = {};

					data.empId = $("#empId").val();
					data.name = $("#name").val();
					data.cont = $("#cont").val();
					data.email = $("#email").val();

					var dataset = [];
					var selectedRows = roleOptions.api.getSelectedRows();
					selectedRows.forEach(function(selectedRow, index) {
						dataset.push(selectedRow.roleId);
					});
					data.roleList = dataset;

					$(".formValidation").remove();
					allPValid = true;
					if (allPValid) {

						$("body").addClass("overlay");
						submitEmployeeData(data);
					}
				})

				// New User Modal functions
				$("#createUserBtn").click(function() {
				    $("#userCreationModal").modal("show");
				});
				
				$("#profileUpload").change(function(e) {
				    if (e.target.files.length > 0) {
				        var reader = new FileReader();
				        reader.onload = function(event) {
				            $("#profilePreview").attr("src", event.target.result);
				        };
				        reader.readAsDataURL(e.target.files[0]);
				    }
				});
				
				$("#saveNewUser").click(function() {
				    // Collect all form data
				    var formData = new FormData();
				    formData.append("firstName", $("#firstName").val());
				    formData.append("lastName", $("#lastName").val());
				    formData.append("email", $("#userEmail").val());
				    formData.append("phone", $("#userPhone").val());
				    formData.append("dob", $("#userDob").val());
				    formData.append("gender", $("input[name='gender']:checked").val());
				    
				    // Append profile picture if selected
				    var profilePic = $("#profileUpload")[0].files[0];
				    if (profilePic) {
				        formData.append("profilePic", profilePic);
				    }
				    
				    // You can add validation here before submitting
				    
				    // Submit the form data
				    $.ajax({
				        url: "save-new-user",
				        type: "POST",
				        data: formData,
				        processData: false,
				        contentType: false,
				        success: function(response) {
				            if(response.success) {
				                $("#userCreationModal").modal("hide");
				                // Refresh user list or show success message
				                showSuccessMessage("User created successfully!");
				                // Reset form
				                $("#userCreationForm")[0].reset();
				                $("#profilePreview").attr("src", "https://via.placeholder.com/100");
				            } else {
				                showErrorMessage(response.message);
				            }
				        },
				        error: function(xhr, status, error) {
				            showErrorMessage("An error occurred while creating user.");
				        }
				    });
				});
				
				function showSuccessMessage(message) {
				    // Implement your success message display
				    alert(message); // Replace with a nicer notification
				}
				
				function showErrorMessage(message) {
				    // Implement your error message display
				    alert(message); // Replace with a nicer notification
				}

			})

	function submitEmployeeData(dataset) {
		console.log(dataset)

		$.ajax({
			type : "POST",
			url : "user-role-assign-save-data",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(dataset),
			success : function(response) {
				if (response.message == "Success") {

					closeNav();

					$("body").removeClass("overlay");

					var id = dataset.empId;

					if (id) {
						$("#messageParagraph").text(
								"User Data Updated Successfully");
					} else {
						$("#messageParagraph").text(
								"User Data Saved Successfully");
					}

					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					agGrid.simpleHttpRequest({
						url : 'user-role-assign-view'
					}).then(function(data) {
						var len = data.length;
						/* $('#totalReq').find('span').html(len); */
						gridOptions.api.setRowData(data);
					});
				}
			},
			error : function(data) {
				console.log(data)

				$("body").removeClass("overlay");
			}
		});
	}

	function cancelModalBtn() {
		$("#delete").modal("hide");
		$("#deleteModalBtn").removeAttr("disabled");
	}

	var columnDefs = [{
				        headerCheckboxSelection: false,
				 headerCheckboxSelectionFilteredOnly: false,
				 checkboxSelection: true,
				 width: 10,
				 sortable: false,
				 filter: false,
				 resizable: true
				 },
				 {
				headerName : "User ID",
				field : "empId",
				width : 150,
				cellRenderer : function(params) {
					return '<a class="click-links" onclick=EditDetails("' + params.data.empId
							+ '") href="javascript:void(0)">'
							+ params.data.empId + ' <i class="fa-solid fa-pen-to-square"></i></a>';
				}
			}, {
				headerName : "Name",
				field : "name",
				width : 350,
			}, {
				headerName : "Contact Number",
				field : "cont",
				width : 150,
			}, {
				headerName : "Email",
				field : "email",
				width : 150,
			}, {
				headerName : "User Role",
				field : "role",
				flex: 1,
			} ];

	var gridOptions = {
		columnDefs : columnDefs,
		rowSelection : 'multiple',
		suppressRowClickSelection : false,
		pagination : true,
		paginationPageSize : 15,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			height : 10,
			width : 200,
		},
	onSelectionChanged: onSelectionChanged
	};
	
	function onSelectionChanged() {
		var selectedNodes = gridOptions.api.getSelectedNodes();
		if (selectedNodes.length > 0) {
		    const empId = selectedNodes[0].data.empId;
		    EditDetails(empId);
		} else {
			closeNav()
	    }
	}
	
	
	$(document).ready(function() {
		agGrid.simpleHttpRequest({
			url : 'user-role-assign-view'
		}).then(function(data) {
			var len = data.length;
			$('#totalReq').find('span').html(len);
			gridOptions.api.setRowData(data);
		});

		agGrid.simpleHttpRequest({
			url : 'user-role-assign-roles-listing',
		}).then(function(data) {
			roleOptions.api.setRowData(data);
		});
	})

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
	}

	function totalUserCSV() {
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			dataset.push(rowNode.data);
		});
		gridOptions.api.exportDataAsCsv(dataset);
	}

	function userSelect() {
		openNav();

		roleOptions.api.deselectAll();
		empOptions.api.deselectAll();

		agGrid.simpleHttpRequest({
			url : 'user-role-assign-roles-listing',
		}).then(function(data) {
			roleOptions.api.setRowData(data);
		});

	}

	function EditDetails(id) {
		openNav();
		if (id) {

			$
					.ajax({
						type : "POST",
						url : "user-role-assign-edit-data",
						dataType : "json",
						contentType : "application/json",
						data : id,
						success : function(response) {
							if (response.message == "Success") {
								console.log(response)
								$(".roletxtsec").empty();
								for (var i = 0; i < response.body.roleNameList.length; i++) {
									var div = '<div class="rolestxt">'
											+ response.body.roleNameList[i]
											+ '</div>';
									$(".roletxtsec").append(div);
								}

								roleOptions.api.deselectAll();
								var roleData = response.body.roleList;
								var datas = [];
								roleOptions.api
										.forEachNode(function(rowNode, index) {
											for (var i = 0; i < roleData.length; i++) {
												if (rowNode.data.roleId === roleData[i]) {
													roleOptions.api.selectNode(
															rowNode, true);
												}
											}
										});

								console.log(datas)

								$("#empId").val(response.body.empId);
								// $("#role").val(response.body.role);	

								$("#roleNameTxt").text(
										response.body.empId + " - "
												+ response.body.name);
							}
						},
						error : function(data) {
							console.log(data)
						}
					});
		}
	}

	function submitRole(dataset) {
		console.log(dataset)
		$.ajax({
			type : "POST",
			url : "user-role-assign-save-data",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(dataset),
			success : function(response) {
				if (response.message == "Success") {
					closeNav();
					agGrid.simpleHttpRequest({
						url : 'user-role-assign-roles-listing'
					}).then(function(data) {
						var len = data.length;
						$('#totalReq').find('span').html(len);
						gridOptions.api.setRowData(data);
					});
				}
			},
			error : function(data) {
				console.log(data)
			}
		});
	}

	function openNav() {
 		let sideNav = $("#mySidenav");
 		sideNav.show();
 		
		$(".roletxtsec").empty();
		$("#empId").val("");
		$("#name").val("");
		$("#cont").val("");
		$("#email").val("");
		$("#roleNameTxt").text("New User");
		document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto; top:45px;";
		document.getElementById("newId").style.width = "75%";
	}

	function closeNav() {

		$(".roletxtsec").empty();
		$("#empId").val("");
		$("#name").val("");
		$("#cont").val("");
		$("#email").val("");
		$("#roleNameTxt").text("New User");
		document.getElementById("mySidenav").style.width = "0";
		document.getElementById("newId").style.width = "100%";
	}

	function closeModal() {
		$("#browseModal").modal("hide");
	}
	var roleOptions = {
		columnDefs : [
				{
					headerName : '',
					field : 'roleName',
					cellClass : function(params) {
						return (params.data.statusData === '1' ? 'ag-row-selected'
								: '');
					}
				}, ],
		defaultColDef : {
			flex : 1,
			minWidth : 100,
		},
		rowSelection : 'multiple',
		rowMultiSelectWithClick : true
	};

	$(document).ready(function() {
		agGrid.simpleHttpRequest({
			url : 'user-role-assign-roles-listing',
		}).then(function(data) {
			roleOptions.api.setRowData(data);
		});
	});
	document.addEventListener('DOMContentLoaded', function() {
		var gridDiv = document.querySelector('#myRoleGrid');
		new agGrid.Grid(gridDiv, roleOptions);

	});

	document.addEventListener('DOMContentLoaded', function() {
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
	});
</script>
</head>
<body>
	<div layout:fragment="content">
		<div class="content-wrap">
			<div class="container-fluid">
				<div class="maincontent">

						<div class="maincontentsec">

										</div>

														</div>

		</div>
		
		<!-- Floating action button for new user -->
		<!-- <button class="new-user-btn" id="createUserBtn" title="Create New User">
		    <i class="ti-plus"></i>
		</button> -->
		
		<!-- User Creation Modal -->
		<div class="modal fade" id="userCreationModal" tabindex="-1" role="dialog" aria-labelledby="userCreationModalLabel" aria-hidden="true">
		    <div class="modal-dialog modal-lg modern-modal">
		        <div class="modal-content p-0">
		            <div class="modal-header">
		                <h5 class="modal-title" id="userCreationModalLabel">Create New User</h5>
		                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
		                    <span aria-hidden="true">&times;</span>
		                </button>
		            </div>
		            <div class="modal-body">
		                <form id="userCreationForm">
		                    <div class="row">
		                        <div class="col-md-4 text-center mb-4">
		                            <div class="form-group">

		                                <input type="file" id="profileUpload" accept="image/*" style="display: none;">

		                        </div>
		                        <div class="col-md-8">
		                            <div class="row">
		                                <div class="col-md-6">
		                                    <div class="form-group">
		                                        <label for="firstName">First Name</label>
		                                        <input type="text" class="form-control" id="firstName" required placeholder="User First Name">

		                                </div>
		                                <div class="col-md-6">
		                                    <div class="form-group">

		                                </div>

		                            <div class="row">

		                                    <div class="form-group">
		                                        <label for="userEmail">Email</label>
		                                        <input type="email" class="form-control" id="userEmail" required placeholder="User Email">
		                                    </div>
		                                </div>
		                                <div class="col-md-6">
		                                    <div class="form-group">
		                                        <label for="userPhone">Phone Number</label>
		                                        <input type="tel" class="form-control" id="userPhone" placeholder="User Contact No.">
		                                    </div>
		                                </div>
		                            </div>
		                        </div>

		                    <div class="row">
		                        <div class="col-md-6">
		                            <div class="form-group">

		                                <input type="date" class="form-control" id="userDob">
		                            </div>
		                        </div>
		                        <div class="col-md-6">
		                            <div class="form-group">
		                                <label>Gender</label>
		                                <div class="gender-options">

		                                        <input type="radio" id="male" name="gender" value="male" checked>
		                                        <label for="male">Male</label>
		                                    </div>
		                                    <div class="gender-option">
		                                        <input type="radio" id="female" name="gender" value="female">
		                                        <label for="female">Female</label>
		                                    </div>
		                                    <div class="gender-option">
		                                        <input type="radio" id="other" name="gender" value="other">
		                                        <label for="other">Other</label>
		                                    </div>
		                                </div>
		                            </div>
		                        </div>

		                </form>
		            </div>
		            <div class="modal-footer">

			<div class="modal-dialog modal-confirm">
				<div class="modal-content">
					<div class="modal-header flex-column">
						<button type="button" class="close" data-dismiss="modal"
							aria-hidden="true" onclick="cancelModalBtn()">
							<i class="ti-close modal-close"></i>
						</button>
					</div>
					<div class="modal-body">
						<p>Do you really want to delete these records? This process
							cannot be undone.</p>
					</div>
					<div class="modal-footer justify-content-center">
						<button class="btn1" data-dismiss="modal"
							onclick="cancelModalBtn();">Cancel</button>
						<button class="btn3" id="deleteModalBtn">Delete</button>
					</div>
				</div>
			</div>
		</div>

			<div class="modal-dialog modal-md" style="margin-top: 130px;">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title md-color">Select Roles</h4>
						<button type="button" class="close cp" onclick="closeModal();"
							data-dismiss="modal">&times;</button>
					</div>
					<div class="modal-body" style="height: 300px;">
						<div id="myRoleGrid" class="ag-theme-alpine" style="height: 90%;"></div>
					</div>
					<div class="modal-footer">
						<button class="btn4" data-dismiss="modal" onclick="closeModal();">Cancel</button>
						<button class="btn1" id="selectRole">Select</button>
					</div>
				</div>
			</div>
		</div>

	</div>
