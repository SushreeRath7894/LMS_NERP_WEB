	function onSelectionAssetListChanged(){
		var selectedRows = activityOptions.api.getSelectedRows();
		window.assetToAssign=[];
		var rowCount = 0;

		selectedRows.forEach(function(asset) {
				window.assetToAssign.push(asset);
		});
		
		var selectedAssetRows = gridAssetOptions.api.getSelectedRows();
		console.log("gridAssetOptions",selectedRows)
		console.log("activityOptions",selectedAssetRows)
		
		var subcategoryCounts = {};
        $.each(selectedRows, function(index, item) {
            var subcategory = item.assetSubCategory;
            if (subcategory in subcategoryCounts) {
                subcategoryCounts[subcategory]++;
            } else {
                subcategoryCounts[subcategory] = 1;
            }
        });

        // Compare approved quantities in object 1 with counts in object 2
        var results = [];
        $.each(selectedAssetRows, function(index, item) {
            var subcategory = item.assetSubcategory;
            var subcategoryName = item.assetSubcategoryName;
            var approvedQty = parseInt(item.approvedQty);
            var countInObject2 = subcategoryCounts[subcategory] || 0;
            var isApprovedLess = approvedQty < countInObject2;
            results.push({
                subcategory: subcategory,
                subcategoryName: subcategoryName,
                approvedQty: approvedQty,
                countInObject2: countInObject2,
                isApprovedLess: isApprovedLess
            });
        });
        
        $.each(results, function(index, item) {
            if(item.isApprovedLess==true){
            	$("#messageParagraph").text("Limit Exeeded For "+item.subcategoryName);
    			$("#msgOkModal").removeClass("btn3");
    			$("#msgOkModal").addClass("btn1");
    			$("#msgModal").modal('show');
    			
    			activityOptions.api.forEachNode(function(rowNode, index) {
    			    if (rowNode.data.assetSubCategory == item.subcategory) {
    			        rowNode.setSelected(false); // Deselect the row
    			    }
    			});
            }
        });
        console.log("results",results);
	}

	function checkValidQty(e) {
		var idOfNumField = event.target.id;
		var approved = event.target.value;
		var index = idOfNumField.match(/\d+/);
		var rowNode = gridAssetOptions.api.getRowNode(index);
		var required=rowNode.data.requiredQty
		console.log(rowNode.data.requiredQty)
		var valid = true;
		if (parseInt(approved) > parseInt(required)) {
			$("#"+idOfNumField).val(required);
		} else {
			if (parseInt(approved) < 0) {
				$("#"+idOfNumField).val("0");
			}else if(!(/^[0-9]+$/.test(approved))){
				$("#"+idOfNumField).val("0");
			}
		}
	}

	function addAssetData() {
		var selectedRows = gridPropertyOptions.api.getSelectedRows();
		var propertyId = selectedRows[0].propertyId;
		var spaceName = selectedRows[0].spaceName;
		var floorId = selectedRows[0].floorId;
		var spaceId = selectedRows[0].spaceId;
		var editAsset = false;
		var selectedRow = "";
		var item = {};
		valid = true;

		{

			item.assetCategory = $('#assetcat').val();
			item.assetSubcategory = $('#assetsubcat').val();
			item.assetCategoryName = $('#assetcat').find(':selected').text();
			item.assetSubcategoryName = $('#assetsubcat').find(':selected')
					.text();
			item.definiteQty = $('#definiteQty').val();
			item.requiredQty = $('#requiredQty').val();
			item.spaceId = spaceId;
			item.spaceName = spaceName;
			item.propertyId = propertyId;
			item.floorId = floorId;

			if (item.assetCategory == null || item.assetCategory == "") {
				valid = validationUpdated("Asset Type is Required", "assettype");
			}
			if (item.assetSubcategory == null || item.assetSubcategory == "") {
				valid = validationUpdated("Asset Type is Required", "assettype");
			}
			if (item.requiredQty == null || item.requiredQty == "") {
				valid = validationUpdated("Asset Type is Required", "assettype");
			}

			if (valid) {

				var quot = [];
				gridAssetOptions.api
						.forEachNode(function(rowNode, index) {
							if (rowNode.data.assetSubcategory == item.assetSubcategory) {
								selectedRow = rowNode.rowIndex;
								editAsset = true;
								console.log("selectedRow", selectedRow);
							}
						});

				if (editAsset) {
					var rowNode = gridAssetOptions.api.getRowNode(selectedRow);
					rowNode.setData(item);
				} else {
					gridAssetOptions.api.forEachNode(function(rowNode, index) {
						quot.push(rowNode.data);
					});
					quot.push(item)
					gridAssetOptions.api.setRowData(quot);

				}
				closeAssetPlanData();
			}

		}

	}

	function assignAssetToLoc(){
		var locid=$("#editSpaceId").val();
		var loctype="Room";
		var planId=$("#planId").val();
		var date=$("#asdate").val();
		var id= window.assetToAssign.map(node => node.assetid);
		var idString = id.join(',');
		
		var valid=true;
		if (date == null || date == "") {
			valid = validationUpdated("Assign Date Required", "DateCalendarAssign");
		 }
		if (id == null || id == "") {
			valid = false;
			$('.loader').hide();
			$("#messageParagraph").text("Select atleast one asset");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
			$("#assignAssetsToDiv").modal('hide');
		 }
		if (valid) {
		$('.loader').show();
		$.ajax({
		type : "GET",
		url : "manage-property-execution-asset-assign?id="+ idString+"&locid="+locid+"&loctype="+loctype+"&date="+date+"&planId="+planId,
		success : function(response) {
		 if (response.code == "success") {
			 $('.loader').hide();
			 cancelAddAssetModal();
				$("#messageParagraph").text("Planned Executed Successfully");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$("#assignAssetsToDiv").modal('hide');
				
				var property="";
				var floor="";
				var space="";
				agGrid.simpleHttpRequest({
					url : 'manage-property-execution-view?property='+property+'&floor='+floor+'&space='+space,
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData = jsonData.Asset;
					if(allData!=null){
						var len = allData.length;
						$('#totalAsset').find('span').html(len);
						gridOptions.api.setRowData(allData);
					}else{
						$('#totalAsset').find('span').html("0");
						gridOptions.api.setRowData("");
					}
				});
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Something went to wrong!");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$("#assignAssetsToDiv").modal('hide');
			}
		},
		error : function(data) {
			$('.loader').hide();}
	})
		}
	}
	function downloadDetails() {
		var params = {
			fileName: 'property_execution_list.csv', // Specify your custom filename here
		};
		gridOptions.api.exportDataAsCsv(params);
	}
</script>
