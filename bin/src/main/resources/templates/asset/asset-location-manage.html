<script type="text/javascript">

	$(document).ready(function() {
		$('.loader').show();
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		gridOptions.api.setRowData();
		agGrid.simpleHttpRequest({
			url : 'asset-location-manage-view'
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData=jsonData.Asset;
			var len = allData.length;
			$('#totalAsset').find('span').html(len);
			gridOptions.api.setRowData(allData);
		});
		$('.loader').hide();
		$('#deleteChild').attr('disabled', true);
		$('#verifyBtn').attr('disabled', true);
		
		$('.collapse').on('show.bs.collapse', function() {
			$(this).siblings('.panel-heading').addClass('active');
		});

		$('.collapse').on('hide.bs.collapse', function() {
			$(this).siblings('.panel-heading').removeClass('active');
		});
		$("#newBtn").click(function() {

		})
		

		  $('input[name="options"]').on('change', function() {
			    var selectedValue = $('input[name="options"]:checked').val();
			    if(selectedValue=="exist"){
			    	$("#verifySection").show();
			    	$("#remarksDiv").show();
			    	$('#submitVerify').attr('disabled', false);
			    }else{
			    	$("#verifySection").hide();
			    	$("#remarksDiv").show();
			    	$('#submitVerify').attr('disabled', false);
			    }
			  });
  
	});
	
	
	
	/* -------------------search bar for mygrid------------------------ */

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalAsset').find('span').html(totalRowCount);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}
	var columnDefs = [
		{
			headerCheckboxSelection : false,
			headerCheckboxSelectionFilteredOnly : false,
			checkboxSelection : true,
			width : 10,
			sortable : false,
			filter : false,
			pinned : 'left',
			resizable : true

		},
		{
			headerName : 'Asset ID',
			field : "assetId",
			pinned : 'left',
			cellRenderer : function(params) {
				return '<a id="assetId" onclick=showInnerContent("'
				+params.data.assetId
				+ '") href="javascript:void(0)">'
				+ params.data.assetId + '</a>';

			}

		},		{
			headerName : 'Asset Name',
			field : "assetname",

		},{
			headerName : 'Assigned Name',
			field : "assignedname",

		},{
			headerName : 'Assign Date',
			field : "assigndate",

		},{
			headerName : 'Latitude',
			field : "latitude",

		},{
			headerName : 'Longitude',
			field : "longitude",
			

		},{
			headerName : 'Address',
			field : "address",

		},{
			headerName : 'Status',
			field : "assignsts",
			cellRenderer : function(params) {
				if(params.data.assignsts=="Done"){
					return '<b><i class="bi bi-check-all"></i> '+ params.data.assignsts+'</b>';
				}else{
					return '<i class="bi bi-hourglass-bottom"></i> '+ params.data.assignsts;
				}
				

			}

		}];

// let the grid know which columns and what data to use
var gridOptions = {
	columnDefs : columnDefs,
	rowSelection : 'single',
	groupSelectsChildren : true,
	suppressRowClickSelection : true,
	suppressAggFuncInHeader : true,
	defaultColDef : {
		sortable : true,
		filter : true,
		resizable : true,
		width : 155
	},
	onSelectionChanged : onSelectionChanged,
};
//function for row select parents

function onSelectionChanged() {
	var id = "";
	var status = "";
	var verifyStatus = "";
	var selectedNodes = gridOptions.api.getSelectedNodes();
	 var selectedData = selectedNodes.map(node => node.data);
	 id= selectedData.map(node => node.assignId);
	 status=selectedData.map(node => node.status);
	 verifyStatus=selectedData.map(node => node.verifyStatus);
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});
	if(rowCount>0){
		console.log(status[0]);
		if(status[0]=='Active' && verifyStatus[0]=='Pending'){
			$('#verifyBtn').attr('disabled', false);
		}else{
			$('#verifyBtn').attr('disabled', true);
		}
	}else{
		$('#verifyBtn').attr('disabled', true);
	}

}


	function showInnerContent(id){
		$("#myGrid").hide();
		$("#reqTable").hide();
		$(".btn-hs").show();
		$("#btndiv").hide();
		$("#listdiv").hide();
		$("#totalAsset").hide();
		$("#searchRowDiv").hide();
		$("#ttbtn").hide();
		$("#demo").show();
		
		agGrid.simpleHttpRequest(
				{
					url : "asset-profile-asset-details?id="+ id
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.Asset;
					console.log("DATA:::",allData);
					var logbook="";
					var preventive="";
					var corrective="";
					$("#assetIdT").html(allData[0].assetId);
					$("#assetName").html(allData[0].assetname);
					$("#assetType").html(allData[0].assettype);
					$("#assetCategory").html(allData[0].assetcatname);
					$("#assetSubcategory").html(allData[0].assetsubcatname);
					$("#assetPrice").html(allData[0].assetPrice);
					$("#assetIdBox").html(allData[0].assetId);
					$("#assetQr").attr("src", allData[0].qr_codeurl);
					
					var statusAsset=`<span class='bg-green' id="workingStatus">${allData[0].workingstatus}</span> 
									 <span class='bg-yellow' id="approvedStatus">${allData[0].approvests}</span> 
									 <span class='bg-blue' id="assignStatus">${allData[0].assignname}</span>`;
					
					$("#statusDiv").html(statusAsset);
				});
	}
	
	function hideInnerContent(){
		$("#myGrid").show();
		$("#reqTable").show();
		$(".btn-hs").hide();
		$("#btndiv").show();
		$("#listdiv").show();
		$("#totalAsset").show();
		$("#searchRowDiv").show();
		$("#ttbtn").show();
		$("#demo").hide();
		//$("#totalAsset").show();
	}

	function downloadDetails() {
		var params = {
			fileName: 'asset_verification_list.csv', // Specify your custom filename here
		};
		gridOptions.api.exportDataAsCsv(params);
	}
	
	function changeLocationAsset() {
		$("#remarksDiv").hide();
		$('#submitVerify').attr('disabled', true);
		var selectedNodes = gridOptions.api.getSelectedNodes();
		var selectedData = selectedNodes.map(node => node.data);
		var assetId= selectedData.map(node => node.assetId);
		$('.loader').show();
		agGrid.simpleHttpRequest(
				{
					url : 'asset-physical-verfication-verify-details?id='+ assetId[0]
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					console.log("JSON:::",jsonData);
					var allData=jsonData.Verify;
					console.log("VERIFY:::",allData);
					if(allData!=null){
						$('#assignmodal').modal('show');
						$('.formValidation').remove();
						$("#verifySection").hide();
						$('input:radio[name="options"]').prop('checked', false);
						
						$("#verifyCon").text(allData[0].workingStatus);
						$("#verifyLoc").text(allData[0].locationName);
					}else{
						$("#messageParagraph").text("No Data Found As Of Yet");
	   					$("#msgOkModal").removeClass("btn3");
	   					$("#msgOkModal").addClass("btn1");
	   					$("#msgModal").modal('show');
					}
					
					
				});
		$('.loader').hide();
	}
	
	
	function submitOnclick() {
		var valid=true;
		var selectedNodes = gridOptions.api.getSelectedNodes();
		var selectedData = selectedNodes.map(node => node.data);
		var assetId= selectedData.map(node => node.assetId);
		var allocId= selectedData.map(node => node.allocId);
		var activeId= selectedData.map(node => node.activeId);
		var item={};
		var datas=[];
		var workingSts="";
    	var locationSts="";
    	var existSts="";
	    var selectedValue = $('input[name="options"]:checked').val();
	    if(selectedValue=="exist"){
	    	workingSts=$("#conVerifySts").val();
	    	locationSts=$("#locVerifySts").val();
	    	if(workingSts=="Matched" && locationSts=="Matched"){
	    		item.assetSts="Matched"
	    	}else{
	    		item.assetSts="Mismatched"
	    	}
	    	existSts="Exist";
	    	
	    	if (workingSts == null || workingSts == "") {
	    		valid = validationUpdated("Required", "conVerifySts");
	    	 }
	    	if (locationSts == null || locationSts == "") {
	    		valid = validationUpdated("Required", "locVerifySts");
	    	 }
	    	
	    }else if(selectedValue=="notexist"){
	    	workingSts="";
	    	locationSts="";
	    	existSts="Not Exist";
	    	item.assetSts="Not Exist"
	    }
	    var remarks=$("#verifyRemark").val();
	    if (remarks == null || remarks == "") {
    		valid = validationUpdated("Remark Required", "verifyRemark");
    	 }
	    item.wstatus=workingSts;
	    item.locationSts=locationSts;
	    item.existSts=existSts;
	    item.allocationId=allocId[0];
	    item.activeId=activeId[0];
	    item.assetId=assetId[0];
	    item.remark=remarks;
	    
	    datas.push(item);
	    if (valid) {
	    	$.ajax({
	    		type : "POST",
	    		url : "asset-physical-verfication-submit",
	    		dataType : "json",
	    		contentType : "application/json",
	    		data : JSON.stringify(datas),
	    		success : function(response) {
	    			$('#assignmodal').modal('hide');
	    			if (response.code == "success") {
	   				 $('.loader').hide();
	   				agGrid.simpleHttpRequest({
	    				url : 'asset-physical-verfication-view'
	    			}).then(function(data) {
	    				var jsonData = JSON.parse(data.body);
	    				var allData=jsonData.Asset;
	    				var len = allData.length;
	    				$('#totalAsset').find('span').html(len);
	    				gridOptions.api.setRowData(allData);
	    			});
	   					
	   				} else {
	   					$('.loader').hide();
	   					$("#messageParagraph").text("Something went to wrong!");
	   					$("#msgOkModal").removeClass("btn3");
	   					$("#msgOkModal").addClass("btn1");
	   					$("#msgModal").modal('show');
	   				}
	    			
	    		},
	    		error : function(data) {
	    			$('.loader').hide();
	    		}
	    	
	    	})
			}

	}

	function showVerifyDetails(activeId){
		$('#viewverifymodal').modal('show');
		$('.loader').show();
		agGrid.simpleHttpRequest(
				{
					url : 'asset-physical-verfication-active-details?id='+ activeId
				}).then(function(data) {
					var condition="";
					var location="";
					
					var jsonData = JSON.parse(data.body);
					console.log("JSON:::",jsonData);
					var allData=jsonData.Verify;
					console.log("VERIFY:::",allData);
					
					
					$('input:radio[name="options"]').prop('checked', false);
					
					$("#verifyConV").text(allData[0].workingStatus);
					$("#verifyLocV").text(allData[0].locationName);
					$("#verifyRemarkV").val(allData[0].remark);
					
					if(allData[0].locationSts=="Matched"){
						location=`<span class="thumb thumbs-up"><i class="fa fa-thumbs-o-up"></i></span> <small class="fw-500">Matched</small>`;
					}else{
						location=`<span class="thumb thumbs-down"><i class="fa fa-thumbs-o-down"></i></span> <small class="fw-500">Mismatched</small>`;
					}
					
					if(allData[0].conditionSts=="Matched"){
						condition=`<span class="thumb thumbs-up"><i class="fa fa-thumbs-o-up"></i></span> <small class="fw-500">Matched</small>`;
					}else{
						condition=`<span class="thumb thumbs-down"><i class="fa fa-thumbs-o-down"></i></span> <small class="fw-500">Mismatched</small>`;
					}
					
					if(allData[0].existSts=="Exist"){
						$("#verifySectionV").show();
						$("#remarksDivV").show();
						$("#locationIcon").html(location);
						$("#conditionIcon").html(condition);
						$('#exist').prop('checked', true);
						$('#notexist').prop('disabled', true);
					}else{
						$("#verifySectionV").hide();
						$("#remarksDivV").show();
						$('#notexist').prop('checked', true);
						$('#exist').prop('disabled', true);
					}
					
				});
		$('.loader').hide();
	}
	
	function closeOnclick(){
		$('.modal').modal('hide');
	}
</script>

</head>
<body>

	<div layout:fragment="content" class="maincontent">

		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">

						<div class="d-flex justify-content-between" id="MainDiv">
							<div class="btn-hs" id="totalAsset">
								<div class="font-design">
									Asset Details(<span></span>)
								</div>
							</div>
							<div id="searchRowDiv">
								<div class="input-style">
									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput" onkeyup="cancelBar()"
										oninput="onQuickFilterChanged()" id="quickFilter"
										autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey"
											onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalAsset').find('span').html(gridOptions.api.getModel().getRowCount());"
											class="close_i"><i class="ti-close srchicon"></i></span></a><a
											href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
									</div>
								</div>
							</div>
							<div class="buttonsec btn-hs" id="ttbtn">
								<button class="download-btn" id="download"
									onclick="downloadDetails()">Download</button>
								<button class="new-btn" id="verifyBtn" onclick="changeLocationAsset()">Change</button>
							</div>
						</div>

						<input type="hidden" id="sessionId" th:value="${userId}" /> <input
							type="hidden" id="sessionName" th:value="${userName}" /> <input
							type="hidden" id="hrRole" th:value="${hrRole}" /> <input
							type="hidden" id="sessionRole" th:value="${userRole}" /> <input
							type="hidden" id="adRole" th:value="${adRole}" />
						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>

						<div class="collapse" id="demo">
							<div class="innercontent">
								<div id="main3">
									<section style="background-color: #eee;">
										<div class="container py-4">
											<div class="row">
												<div class="col">
													<nav aria-label="breadcrumb"
														class="bg-light rounded-3 p-3 mb-4">
														<div class=" mb-0 d-flex justify-content-between">
															<div>
																<b>ASSET ID:<span id="assetIdBox"></span></b>
															</div>
															<div>
																<button class="cancel-btn" id="cancelBtn"
																	onclick="hideInnerContent()">Back</button>
															</div>
														</div>
													</nav>
												</div>
											</div>

											<div class="row">
												<div class="col-lg-4">
													<div class="card mb-4">
														<div class="card-body text-center">
															<img class=" img-fluid" style="width: 270px;"
																id="assetQr"
																onerror="this.onerror=null; this.src='../assets/images/noimage.jpg';">

															<div class="d-flex mb-2 badge justify-content-center"
																id="statusDiv"></div>
														</div>
													</div>
												</div>
												<div class="col-lg-8">
													<div class="card mb-4">
														<div class="card-body">
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Asset ID</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetIdT"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Asset Name</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetName"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Type</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetType"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Category</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetCategory"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Subcategory</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetSubcategory"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Price</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetPrice"></p>
