//function for download
function downloadDetails() {
	const params = { allColumns: true };

    // Get CSV strings from each grid
    const circuitACsv = gridOptions.api.getDataAsCsv(params);
    const circuitBCsv = gridOptions1.api.getDataAsCsv(params);
    const circuitCCsv = gridOptions2.api.getDataAsCsv(params);
    const circuitDCsv = gridOptions3.api.getDataAsCsv(params);

    // Merge CSVs
    const mergedCsv = 'WET CLEANING CHECKLIST OF SILO ROOM \n\n' + circuitACsv + '\n\n WET CLEANING CHECKLIST OF FILLING ROOM \n\n' 
    + circuitBCsv+ '\n\n WET CLEANING CHECKLIST OF SUCTION ROOM \n\n' 
    + circuitCCsv+ '\n\n WET CLEANING CHECKLIST OF SECONDARY AREA) \n\n' 
    + circuitDCsv;

    // Download merged CSV
    const csvBlob = new Blob([mergedCsv], { type: 'text/csv;charset=utf-8;' });
    const csvUrl = URL.createObjectURL(csvBlob);
    const link = document.createElement('a');
    link.href = csvUrl;
    link.setAttribute('download', 'Wet_Cleaning_Checklist.csv');
    link.click();
}
