<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style type="text/css">
.highcharts-exporting-group {
	display: none;
}

.slidebox {
	padding: 14px;
	margin-top: 0px;
	margin: 0px 10px;
}

#propertyDetailDiv >li+li:before {
    content: "" !important;
 }


.first span {
    color: black;
}
.active-1  , .active-2{
    font-size: 13px !important;
    padding-bottom: 12px !important;
    padding-top: 12px !important;
    padding-right: 25px !important;
    padding-left: 25px !important;
    border-radius: 200px !important;
    background-color: #C576F6 !important;
}
#home{
    vertical-align: middle !important ;
}
.aprvQty{
 border: 0.5px solid #ddd;
  border-radius: 2px; 
  background-color: #eedbff; 
  width: 124px;
  height: 22px;
}
</style>

<script type="text/javascript">
	$(document).ready(function() {
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);

		var gridDiv = document.querySelector('#myPropertyGrid');
		new agGrid.Grid(gridDiv, gridPropertyOptions);

		var gridDiv = document.querySelector('#myAssetGrid');
		new agGrid.Grid(gridDiv, gridAssetOptions);

		$('.loader').show();

		$('#addPlanBtn').attr('disabled', false);
		$('#reqDltBtn').attr('disabled', true);
		var property="";
		var floor="";
		var space="";
		agGrid.simpleHttpRequest({
			url : 'manage-property-approve-view?property='+property+'&floor='+floor+'&space='+space,
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.Asset;
			if(allData!=null){
				var len = allData.length;
				$('#totalAsset').find('span').html(len);
				gridOptions.api.setRowData(allData);
			}else{
				$('#totalAsset').find('span').html("0");
				gridOptions.api.setRowData("");
			}
		});

		$('.loader').hide();

		var dateFormat = localStorage.getItem("dateFormat");
		$("#DateCalendarAssign").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
			minDate : new Date().toLocaleDateString(undefined, {
				year : 'numeric',
				month : '2-digit',
				day : '2-digit'
			}),
		}).on("change", function() {
			$('#asdate').val($(this).val());
		})

		$('#asdate').blur(function() {
			$("#DateCalendarAssign").val($(this).val());
		})

	});

	/* -------------------search bar for mygrid------------------------ */

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalAsset').find('span').html(totalRowCount);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}
	var columnDefs = [
			/* {
				headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : false,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true,
				pinned : 'left',

			}, */
			{
				headerName : 'Plan Id',
				field : "planId",
				pinned : 'left',
				cellRenderer : function(params) {
					return '<a id="assetId" onclick=editPlan("'
							+ params.data.planId
							+ '") href="javascript:void(0)"><i class="bi bi-pencil-square"></i> '
							+ params.data.planId + '</a>';

				}

			}, {
				headerName : 'Property ID',
				field : "propertyId",
				pinned : 'left',

			}, {
				headerName : 'Property Name',
				field : "propertyName",

			}, {
				headerName : 'Floor ID',
				field : "floorId",
			}, {
				headerName : 'Floor Name',
				field : "floorName",

			}, {
				headerName : 'Space ID',
				field : "spaceId",

			}, {
				headerName : 'Space Name',
				field : "spaceName",

			}, {
				headerName : 'Approve Status',
				field : "approveStatus",
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					if (params.data.approveStatus == "Approved") {
						return '<div style="color:#0642f5">Approved</div>';
					} else if(params.data.approveStatus == "Rejected"){
						return '<div style="color:red">Rejected</div>';
					} else {
						return '<div style="color:#a9a9a9">Pending</div>';
					}

				}
			} ];

	// let the grid know which columns and what data to use
	var gridOptions = {
		columnDefs : columnDefs,
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 150
		},
		onSelectionChanged : onSelectionChanged,
	};
	function onSelectionChanged() {
		var selectedRows = gridOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {

			$('#addPlanBtn').attr('disabled', true);
			$('#reqDltBtn').attr('disabled', false);
		} else {
			$('#addPlanBtn').attr('disabled', false);
			$('#reqDltBtn').attr('disabled', true);
		}
	}

	var columnPropertyDefs = [ {
		headerCheckboxSelection : false,
		headerCheckboxSelectionFilteredOnly : false,
		checkboxSelection : true,
		width : 10,
		sortable : false,
		filter : false,
		resizable : true,
		pinned : 'left',

	}, {
		headerName : 'Property ID',
		field : "propertyId",
		pinned : 'left',
		width : 100,

	}, {
		headerName : 'Property Name',
		field : "propertyName",

	}, {
		headerName : 'Floor ID',
		field : "floorId",
	}, {
		headerName : 'Floor Name',
		field : "floorName",

	}, {
		headerName : 'Code',
		field : "spaceSlno",
		width : 80

	}, {
		headerName : 'Space Name',
		field : "spaceName",

	}, {
		headerName : 'Space Type',
		field : "spaceType",

	}, {
		headerName : 'Ownership',
		field : "ownership"
	} ];

	//let the grid know which columns and what data to use
	var gridPropertyOptions = {
		columnDefs : columnPropertyDefs,
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 120
		},
		onSelectionChanged : onSelectionPropertyChanged,
	};

	function onSelectionPropertyChanged() {
		gridAssetOptions.api.setRowData("");
		closeAssetPlanData();
		var selectedRows = gridPropertyOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			$('#addAssetBtn').attr("disabled", false);
			$('#deleteAssetBtn').attr('disabled', true);
		} else {
			$('#addAssetBtn').attr("disabled", true);
			$('#deleteAssetBtn').attr('disabled', true);
		}
	}

	var columnAssetDefs = [ 
		{
		headerName : 'Asset Category',
		field : "assetCategoryName",

	}, {
		headerName : 'Asset Subcategory',
		field : "assetSubcategoryName"

	}, {
		headerName : 'Definite Quantity',
		field : "definiteQty"
	}, {
		headerName : 'Required Quantity',
		field : "requiredQty"

	}, {
		headerName : 'Approved Quantity',
		field : "approvedQty",
		cellRenderer : function(params) {
			return '<input type="number" class="aprvQty" value="'+params.data.approvedQty+'" min=0 id="'+"aprvQty"+params.rowIndex+'" oninput="checkValidQty(event);">';
		}

	} ];

	//let the grid know which columns and what data to use
	var gridAssetOptions = {
		columnDefs : columnAssetDefs,
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 145
		},
		onSelectionChanged : onSelectionAssetChanged,
	};

	function onSelectionAssetChanged() {
		var selectedRows = gridAssetOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			$('#deleteAssetBtn').attr('disabled', false);
		} else {
			$('#deleteAssetBtn').attr('disabled', true);
		}
	}

	// delete selected record from child ag grid
	function deleteDetailsOnclick() {
		$('.modal').hide();
		var selectedRows = activityOptions.api.getSelectedRows();
		activityOptions.api.applyTransaction({
			remove : selectedRows
		});
		cancelModalProductBtn();
	}
	//for closeing modal box for dlt  product
	function cancelModalProductBtn() {
		$("#deleteModalBtn").removeAttr("disabled");
		$('#deleteDetails').modal('hide');
	}

	function deleteFun() {
		$('#delete').modal('show');
	}
	function approveFun() {
		$('#approveModal').modal('show');
	}

	function cancelModalBtn() {
		$("#deleteModalBtn").removeAttr("disabled");
		$("#assignsuccessModal").removeAttr("disabled");
	}


	function addPlanFun() {
		$("#addAssetQtyDiv").hide();
		$('#addAssetBtn').attr('disabled', true);
		$('#deleteAssetBtn').attr('disabled', true);
		$('#planId').val("");
		gridAssetOptions.api.setRowData("");
		$('#addPlanModal').modal('show');
	}
	function cancelAddAssetModal() {
		$('#addPlanModal').modal('hide');
	}
	function getFloorList() {
		var property = $("#propertyDr").val();
		var options = '<option value="">Select Floor</option>';
		agGrid.simpleHttpRequest({
			url : 'manage-property-planning-getfloor?property=' + property,
		}).then(
				function(data) {
					var jsonData = JSON.parse(data.body);
					console.log("PRINTED DATA:::", jsonData);
					var allData = jsonData.FloorList;
					if (allData != null) {
						allData.forEach(function(rowNode) {
							options += '<option value="'+rowNode.floorid+'">'
									+ rowNode.floorname + '</option>';
						});
						$('#floorDr').html(options)
					} else {
						$('#floorDr').html(options)
					}

				});
	}

	function filterWithCategory(e) {

		if (e.target.id == "floorDr") {
			var property = $("#propertyDr").val();
			var floor = $("#floorDr").val();
		} else {
			var property = $("#propertyDr").val();
			var floor = "";
		}

		var space = "";
		agGrid.simpleHttpRequest({
			url : 'manage-property-approve-view?property='+property+'&floor='+floor+'&space='+space,
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.Asset;
			if(allData!=null){
				var len = allData.length;
				$('#totalAsset').find('span').html(len);
				gridOptions.api.setRowData(allData);
			}else{
				$('#totalAsset').find('span').html("0");
				gridOptions.api.setRowData("");
			}
			
		});
	}

	function addAssetPlanData() {
		$("#addAssetQtyDiv").slideDown();
		$('#addAssetBtn').attr('disabled', true);
		$('#deleteAssetBtn').attr('disabled', true);

		$('#assetcat').val("");
		$('#assetsubcat').val("");
		$('#definiteQty').val("");
		$('#requiredQty').val("");
	}
	function closeAssetPlanData() {
		$("#addAssetQtyDiv").slideUp();
		$('#addAssetBtn').attr('disabled', false);
		$('#assetcat').val("");
		$('#assetsubcat').val("");
		$('#definiteQty').val("");
		$('#requiredQty').val("");
	}

	function getsubcategory() {
		var catid = $("#assetcat").val();
		var options = '<option value="">Select</option>';
		if (catid != "" && catid != null) {
			agGrid
					.simpleHttpRequest(
							{
								url : 'manage-property-planning-subcategory?id='
										+ catid
							})
					.then(
							function(data) {
								var jsonData = JSON.parse(data.body);
								var allData = jsonData.Asset;
								if (allData != null) {
									allData
											.forEach(function(rowNode) {
												options += '<option value="'+rowNode.subcatid+'" data-subQty="' + rowNode.assetqty + '">'
														+ rowNode.subcatname
														+ '</option>';
											});
								}
								$("#assetsubcat").html(options);
							});

		} else {
			$("#assetsubcat").html(options);
		}

	}
	function getQtyBySub() {
		var selectedOption = $("#assetsubcat option:selected");
		var customData = selectedOption.attr("data-subQty");
		$("#definiteQty").val(customData);
		$("#requiredQty").val("0");
	}

	function checkValidQty(e) {
		var idOfNumField = event.target.id;
		var approved = event.target.value;
		var index = idOfNumField.match(/\d+/);
		var rowNode = gridAssetOptions.api.getRowNode(index);
		var requested=rowNode.data.requiredQty
		var stock=rowNode.data.definiteQty
		console.log(rowNode.data.requiredQty)
		if(stock<=requested){
			var required=stock;
		}else{
			var required=requested;
		}
		var valid = true;
		if (parseInt(approved) > parseInt(required)) {
			$("#"+idOfNumField).val(required);
		} else {
			if (parseInt(approved) < 0) {
				$("#"+idOfNumField).val("0");
			}else if(!(/^[0-9]+$/.test(approved))){
				$("#"+idOfNumField).val("0");
			}
		}
	}

	function addAssetData() {
		var selectedRows = gridPropertyOptions.api.getSelectedRows();
		var propertyId = selectedRows[0].propertyId;
		var spaceName = selectedRows[0].spaceName;
		var floorId = selectedRows[0].floorId;
		var spaceId = selectedRows[0].spaceId;
		var editAsset = false;
		var selectedRow = "";
		var item = {};
		valid = true;

		{

			item.assetCategory = $('#assetcat').val();
			item.assetSubcategory = $('#assetsubcat').val();
			item.assetCategoryName = $('#assetcat').find(':selected').text();
			item.assetSubcategoryName = $('#assetsubcat').find(':selected')
					.text();
			item.definiteQty = $('#definiteQty').val();
			item.requiredQty = $('#requiredQty').val();
			item.spaceId = spaceId;
			item.spaceName = spaceName;
			item.propertyId = propertyId;
			item.floorId = floorId;

			if (item.assetCategory == null || item.assetCategory == "") {
				valid = validationUpdated("Asset Type is Required", "assettype");
			}
			if (item.assetSubcategory == null || item.assetSubcategory == "") {
				valid = validationUpdated("Asset Type is Required", "assettype");
			}
			if (item.requiredQty == null || item.requiredQty == "") {
				valid = validationUpdated("Asset Type is Required", "assettype");
			}

			if (valid) {

				var quot = [];
				gridAssetOptions.api
						.forEachNode(function(rowNode, index) {
							if (rowNode.data.assetSubcategory == item.assetSubcategory) {
								selectedRow = rowNode.rowIndex;
								editAsset = true;
								console.log("selectedRow", selectedRow);
							}
						});

				if (editAsset) {
					var rowNode = gridAssetOptions.api.getRowNode(selectedRow);
					rowNode.setData(item);
				} else {
					gridAssetOptions.api.forEachNode(function(rowNode, index) {
						quot.push(rowNode.data);
					});
					quot.push(item)
					gridAssetOptions.api.setRowData(quot);

				}
				closeAssetPlanData();
			}

		}

	}

	function deleteAssetPlanData() {
		var selectedRows = gridAssetOptions.api.getSelectedRows();
		gridAssetOptions.api.applyTransaction({
			remove : selectedRows
		});
	}
	function masterSaveData() {
		$(".formValidation").remove();
		var valid = true;
		var datas = [];
		var planObj = [];

		var item = {};
		var itemPlan = {};

		item.planId = $('#planId').val();
		item.approvedSts ="Approve";
		
		if (valid) {
			gridAssetOptions.api.forEachNode(function(rowNode, index) {

					itemPlan = rowNode.data;
					itemPlan.approvedQty = $('#aprvQty'+index).val();
					planObj.push(itemPlan);

			});
			if(planObj.length>0){
				item.planList = planObj;
				datas.push(item);
				console.log(datas);
				savePlanDetails(datas);
			}else{
				$("#messageParagraph").text("No Approved Quantity Found");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}
		}
	}

	function savePlanDetails(datas) {
		$('.loader').show();

		$.ajax({
			type : "POST",
			url : "manage-property-approve-add",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(datas),
			success : function(response) {
				$('.loader').hide();
				if (response.code == "success") {
					cancelAddAssetModal();
					$("#messageParagraph").text("Plan Approved Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');

					$("#propertyDr").val("");
					$("#floorDr").val("");
					var property="";
					var floor="";
					var space="";
					agGrid.simpleHttpRequest({
						url : 'manage-property-approve-view?property='+property+'&floor='+floor+'&space='+space,
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						var allData = jsonData.Asset;
						var len = allData.length;
						$('#totalAsset').find('span').html(len);
						gridOptions.api.setRowData(allData);
					});

				} else {
					$('.loader').hide();
					$("#messageParagraph").text("Something Went Wrong");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			},
			error : function(data) {
				$('.loader').hide();
			}

		})

	}


	function editPlan(planId) {
		addPlanFun();
		$("#planDisplay").html(planId);
		agGrid
				.simpleHttpRequest({
					url : 'manage-property-approve-edit?id=' + planId
				})
				.then(
						function(data) {
							$('.loader').hide();
							var jsonData = JSON.parse(data.body);
							var allData = jsonData.Plan;
							var allPlan = allData[0].PlanDetails;
							console.log(allData)
							var options=`<li class="breadcrumb-item "><a
								class="black-text active-2" href="#"><img id="home" src="https://img.icons8.com/ios-filled/50/000000/dog-house.png" class="mr-md-2 mr-1 mb-1 " width="22" height="19"><span> ${allData[0].propertyName}</span></a><img
								class="ml-md-3 ml-1" src="https://img.icons8.com/metro/50/000000/chevron-right.png "
								width="20" height="20"></li>
							<li class="breadcrumb-item "><a
								class="black-text active-2" href="#"><span>${allData[0].floorName}</span></a><img
								class="ml-md-3 ml-1"
								src="https://img.icons8.com/metro/50/000000/chevron-right.png "
								width="20" height="20"></li>
							<li class="breadcrumb-item "><a
								class="black-text active-2  " href="#"><span>${allData[0].spaceName}</span></a></li>`;
	
								if(allData[0].approveStatus=="Pending"){
									$('#rejectBtn').show();
									$('#aprvBtn').show();
								}else{
									$('#rejectBtn').hide();
									$('#aprvBtn').hide();
								}
								gridAssetOptions.api.setRowData(allPlan);
								$('#planId').val(allData[0].planId);
								$('#propertyDetailDiv').html(options);

						});

	}
	
	function rejectPlanOnClick(){
		var planId=$('#planId').val();
		if (planId) {
			$('.loader').show();
	$.ajax({
		type : "POST",
		url : "manage-property-approve-reject?id="+ planId,
		success : function(response) {
		 if (response.code == "success") {
			 $('.loader').hide();
				$("#messageParagraph").text("Plan Rejected Successfully");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('#delete').modal('hide');
				cancelAddAssetModal();
				$("#propertyDr").val("");
				$("#floorDr").val("");
				var property="";
				var floor="";
				var space="";
				agGrid.simpleHttpRequest({
					url : 'manage-property-approve-view?property='+property+'&floor='+floor+'&space='+space,
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData = jsonData.Asset;
					var len = allData.length;
					$('#totalAsset').find('span').html(len);
					gridOptions.api.setRowData(allData);
				});
				} else {
				$('.loader').hide();
				$("#messageParagraph").text("Something went to wrong!");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}
		},
		error : function(data) {
			$('.loader').hide();}
	})
		} else {
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Plan !";
			$('.loader').hide();}

	}
	
	function downloadDetails() {
		var params = {
			fileName: 'property_approval_list.csv', // Specify your custom filename here
		};
		gridOptions.api.exportDataAsCsv(params);
	}
</script>

</head>
<body>

	<div layout:fragment="content" class="maincontent">

		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">

						<div class="d-flex justify-content-between" id="tdiv">
							<div class="btn-hs">
								<div class="font-design" id="totalAsset">
									Planning List(<span></span>)
								</div>
							</div>
							<div class="col-md-8 row justify-content-center mb-2">
									<div class="col-md-4">
										<div class="form-group">
											<div class="select">
												<select id="propertyDr"
													onchange="getFloorList();filterWithCategory(event);">
													<option value="">Select Property</option>
													<option th:each="c:${propertyLists}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-group">
											<div class="select">
												<select id="floorDr" onchange="filterWithCategory(event);">
													<option value="">Select Floor</option>
													<option th:each="c:${itemnameList}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
								</div>
							<div class="buttonsec btn-hs" id="ttbtn">
								<button class="download-btn" id="download"
									onclick="downloadDetails()">DOWNLOAD</button>
								<!-- <button class="new-btn" id="addPlanBtn" onclick="addPlanFun()">ADD
									PLAN</button>
								<button class="delete-btn" id="reqDltBtn" onclick="deleteFun()">DROP
									PLAN</button> -->
							</div>
						</div>

						<input type="hidden" id="planId"> <input type="hidden"
							id="sessionId" th:value="${userId}" /> <input type="hidden"
							id="sessionName" th:value="${userName}" /> <input type="hidden"
							id="hrRole" th:value="${hrRole}" /> <input type="hidden"
							id="sessionRole" th:value="${userRole}" /> <input type="hidden"
							id="adRole" th:value="${adRole}" />
						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>

					</div>
				</div>


				<!-- delete modal start -->
				<div id="delete" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column"></div>
							<div class="modal-body">
								<p>Do you really want to delete this plan? This process
									cannot be undone.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="cancel-btn" data-bs-dismiss="modal"
									onclick="cancelModalBtn();">Cancel</button>
								<button type="button" class="delete-btn"
									onclick="deletePlanOnClick()">Delete</button>
							</div>
						</div>
					</div>
				</div>


				<!-- approve modal start -->
				<div id="approveModal" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column"></div>
							<div class="modal-body">
								<p>Do you want to approve this asset assign? Once done you
									will not be able to make further change.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="cancel-btn" data-bs-dismiss="modal"
									onclick="cancelModalBtn();">Cancel</button>
								<button type="button" class="new-btn" onclick="activeOnClick()">Activate</button>
							</div>
						</div>
					</div>
				</div>



				<!-- assign success modal start -->
				<div id="assignsuccessModal" class="modal fade show"
					aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column"></div>
							<div class="modal-body">
								<p>Modified Successfully</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="new-btn" data-bs-dismiss="modal"
									onclick="cancelModalBtn();">Okay</button>
							</div>
						</div>
					</div>
				</div>

				<!-- delete product modal start -->
				<div id="deleteDetails" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column"></div>
							<div class="modal-body">
								<p>Do you really want to delete these data? This process
									cannot be undone.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: -30px;">

								<button type="button" class="cancel-btn" data-bs-dismiss="modal"
									onclick="cancelModalBtn();">Cancel</button>
								<button type="button" class="delete-btn"
									onclick="deleteDetailsOnclick()">Delete</button>
							</div>
						</div>
					</div>
				</div>
				<!-- alert modal start -->
				<div id="alert" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column">
								<button type="button" class="close" data-bs-dismiss="modal"
									aria-hidden="true" onclick="cancelModalBtn()">
									<i class="ti-close modal-close"></i>
								</button>
							</div>
							<div class="modal-body">
								<p id="textId"></p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="btn1" data-bs-dismiss="modal">SELECT</button>
								<button type="button" class="btn3" onclick="dissociateOnClick()">Delete</button>
							</div>
						</div>
					</div>
				</div>


				<div class="modal fade" id="addPlanModal" role="dialog">
					<div class="modal-dialog modal-lg modal-dialog-scrollable">
						<div class="modal-content">
							<div class="modal-header">
								<h4 class="modal-title">ACTION FOR <span id="planDisplay"></span></h4>
							</div>
							<div class="modal-body row">
								<input type="hidden" id="AssetId"> <input type="hidden"
									id="roomId">

								<div class="col-md-12 mt-3">
									<div class="container d-flex justify-content-center">
										<nav aria-label="breadcrumb " class="first  d-md-flex">
											<ol class="breadcrumb indigo lighten-6 first-1 mb-5" id="propertyDetailDiv">
												
											</ol>
										</nav>
									</div>
								</div>
								<div class="col-md-12">
									<div id="myAssetGrid" style="width: 100%; height: 250px;"
										class="ag-theme-alpine mt-2"></div>
								</div>


							</div>
							<div class="modal-footer">
								<button type="button" class="download-btn" onclick="cancelAddAssetModal();">CLOSE</button>
								<button type="button" class="cancel-btn" id="rejectBtn" onclick="rejectPlanOnClick()">REJECT</button>
								<button type="button" class="new-btn" id="aprvBtn" onclick="masterSaveData()">APPROVE</button>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>

</body>
</html>
