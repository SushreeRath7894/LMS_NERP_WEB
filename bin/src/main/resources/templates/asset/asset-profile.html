<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style type="text/css">
.highcharts-exporting-group {
	display: none;
}
.horizontal-timeline
{
width:1170px;
}

.horizontal-timeline .items {
	border-top: 3px solid #e9ecef;
	margin-top:40px;
	position:relative;
}

.horizontal-timeline .items .items-list {
	display: block;
	position: relative;
	text-align: center;
	padding-top: 70px;
	margin-right: 0;
}

.horizontal-timeline .items .items-list:before {
	content: "";
	position: absolute;
	height: 36px;
	border-right: 2px dashed #dee2e6;
	top: 0;
}

.horizontal-timeline .items .items-list .event-date {
	position: absolute;
	top: 36px;
	left: 0;
	right: 0;
	width: 75px;
	margin: 0 auto;
	font-size: 0.9rem;
	padding-top: 8px;
}
.fixTableHead { 
      overflow-y: auto; 
      height:150px; 
    } 
    .fixTableHead thead th { 
      background:#fff;
      position: sticky; 
      top: 0;       
    } 
 
@media ( min-width : 1140px) {
	.horizontal-timeline .items .items-list {
		display: inline-block;
		width: 15%;
		padding-top: 45px;
	}
	 .horizontal-timeline .items .items-list .event-date {
		top: 15px;
	} 
}

.card {
	border: none;
	border-radius: 10px
}

.c-details span {
	font-weight: 300;
	font-size: 13px
}

.icon {
	width: 50px;
	height: 50px;
	background-color: #eee;
	border-radius: 15px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 39px
}

.badge .bg-yellow {
	background-color: #fffbec;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #fed85d;
	justify-content: center;
	align-items: center;
	margin:3px;
}

.badge .bg-blue {
	background-color: #D4F1F4;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #189AB4;
	justify-content: center;
	align-items: center;
	margin:3px;
}
.badge .bg-purple {
	background-color: #D7A1F9;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #51087E;
	justify-content: center;
	align-items: center;
	margin:3px;
}
.badge .bg-red {
	background-color: #FF8A8A;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #750000;
	justify-content: center;
	align-items: center;
	margin:3px;
}
.badge .bg-green {
	background-color: #B1D8B7;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #2F5233;
	justify-content: center;
	align-items: center;
	margin:3px;
}
.progress {
	height: 10px;
	border-radius: 10px
}

.progress div {
	background-color: red
}

.text1 {
	font-size: 14px;
	font-weight: 600
}

.text2 {
	color: #a5aec0
}
.scrollbar
{
    width: 1170px;
	overflow-x:scroll;
	position:relative;
}
</style>

<script type="text/javascript">

	$(document).ready(function() {
		$('.loader').show();
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		gridOptions.api.setRowData();
		agGrid.simpleHttpRequest({
			url : 'asset-profile-view'
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData=jsonData.Asset;
			var len = allData.length;
			$('#totalAsset').find('span').html(len);
			gridOptions.api.setRowData(allData);
		});
		$('.loader').hide();
		$('#deleteChild').attr('disabled', true);
		$("#emplist").hide();
    	$("#loclist").hide();
    	$("#assigndate").hide();
		$('.collapse').on('show.bs.collapse', function() {
			$(this).siblings('.panel-heading').addClass('active');
		});

		$('.collapse').on('hide.bs.collapse', function() {
			$(this).siblings('.panel-heading').removeClass('active');
		});
		$("#newBtn").click(function() {

		})
		

  
	});
	
	
	
	/* -------------------search bar for mygrid------------------------ */

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalAsset').find('span').html(totalRowCount);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}
	var columnDefs = [
		{
			headerCheckboxSelection : false,
			headerCheckboxSelectionFilteredOnly : false,
			checkboxSelection : true,
			width : 10,
			sortable : false,
			filter : false,
			pinned : 'left',
			resizable : true

		},
		{
			headerName : 'Asset ID',
			field : "assetId",
			pinned : 'left',
			cellRenderer : function(params) {
				return '<a id="assetId" onclick=showInnerContent("'
				+params.data.assetId
				+ '") href="javascript:void(0)">'
				+ params.data.assetId + '</a>';

			}

		},		{
			headerName : 'Asset Name',
			field : "assetname",

		},{
			headerName : 'Asset Type',
			field : "assettype",

		},{
			headerName : 'Asset Category',
			field : "assetcat",

		},{
			headerName : 'Asset Subcategory',
			field : "assetsubcat",

		}];

// let the grid know which columns and what data to use
var gridOptions = {
	columnDefs : columnDefs,
	rowSelection : 'single',
	groupSelectsChildren : true,
	suppressRowClickSelection : true,
	suppressAggFuncInHeader : true,
	defaultColDef : {
		sortable : true,
		filter : true,
		resizable : true,
		width : 238
	},
	onSelectionChanged : onSelectionChanged,
};
//function for row select parents
var id = "";
var apstatus = "";
function onSelectionChanged() {
	var selectedNodes = gridOptions.api.getSelectedNodes();
	 var selectedData = selectedNodes.map(node => node.data);
	 id= selectedData.map(node => node.assignId);
	 apstatus=selectedData.map(node => node.assignsts);
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});

}




	function goTOAsset(asseiiddata) {
		localStorage.setItem('assetIdData',asseiiddata);
		sessionStorage.setItem('activity', 'ACT0076');
		window.location.href = "/asset/asset-code";
	
}
	function showInnerContent(id){
		$("#myGrid").hide();
		$("#reqTable").hide();
		$(".btn-hs").show();
		$("#btndiv").hide();
		$("#listdiv").hide();
		$("#totalAsset").hide();
		$("#searchRowDiv").hide();
		$("#ttbtn").hide();
		$("#demo").show();
		
		agGrid.simpleHttpRequest(
				{
					url : "asset-profile-asset-details?id="+ id
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.Asset;
					console.log("DATA:::",allData);
					var logbook="";
					var preventive="";
					var corrective="";
					$("#assetIdT").html(allData[0].assetId);
					$("#assetName").html(allData[0].assetname);
					$("#assetType").html(allData[0].assettype);
					$("#assetCategory").html(allData[0].assetcatname);
					$("#assetSubcategory").html(allData[0].assetsubcatname);
					$("#assetPrice").html(allData[0].assetPrice);
					$("#assetIdBox").html(allData[0].assetId);
					$("#assetQr").attr("src", allData[0].qr_codeurl);
					
					var statusAsset=`<span class='bg-green' id="workingStatus">${allData[0].workingstatus}</span> 
									 <span class='bg-yellow' id="approvedStatus">${allData[0].approvests}</span> 
									 <span class='bg-blue' id="assignStatus">${allData[0].assignname}</span>`;
					if(allData[0].logbook!=null){
					
					allData[0].logbook.forEach(function(rowNode){
						if(rowNode.status=='Active'){
							var classColor='bg-success';
						}else if(rowNode.status=='Dissociated'){
							var classColor='bg-danger';
						}else{
							var classColor='bg-warning';
						}
						logbook += `<li class="list-inline-item items-list">
							<div class="px-4">
							<div class="event-date badge ${classColor}" style="display:inline-block; width:175px">${rowNode.assigneddate} : ${rowNode.dissociateddate}</div>
							<h5 class="pt-2">${rowNode.assignedto}</h5>
							<p class="text-muted">(${rowNode.status})</p>
							</div>
						</li>`;
						  });
					}else{
						logbook = `<p class="text-muted">No Activity Found As Of Now</p>`;
					}
					if(allData[0].preventive!=null){
					allData[0].preventive.forEach(function(rowNode){
						if(rowNode.status=='Expired'){
							var classColor='bg-danger';
						}else{
							var classColor='bg-success';
						}
						preventive += `<tr>
							<th style="text-align: center;">${rowNode.allocid}</th>
							<td style="text-align: center;">${rowNode.policyid}</td>
							<td style="text-align: center;">${rowNode.assetid}</td>
							<td style="text-align: center;">${rowNode.frequency}</td>
							<td style="text-align: center;"><div class="event-date badge ${classColor}">${rowNode.status}</div></td>
						</tr>`;
						  });
					}else{
						preventive = `<tr>
											<th colspan="5">No Allocated Policy Records</th>
									   </tr>`;
					}
					if(allData[0].corrective!=null){
					allData[0].corrective.forEach(function(rowNode){
						if(rowNode.status=='RAISED'){
							var classColor='bg-blue';
						}else if(rowNode.status=='INSPECTION'){
							var classColor='bg-yellow';
						}else if(rowNode.status=='ACTION'){
							var classColor='bg-purple';
						}else if(rowNode.status=='RESOLVED'){
							var classColor='bg-green';
						}else{
							var classColor='bg-red';
						}
						corrective += `<div class="col-md-3">
							<div class="card p-3 mb-2">
							<div class="d-flex justify-content-between">
								<div class="d-flex flex-row align-items-center">
									<div class="icon">
										<i class="bi bi-ticket-detailed"></i>
									</div>
									<div class="ms-2 c-details">
										<h6 class="mb-0">${rowNode.ticketid}</h6>
										<span>${rowNode.createdOn}</span>
									</div>
								</div>
								<div class="badge">
									<span class=${classColor}>${rowNode.status}</span>
								</div>
								</div>
							</div>
						</div>`;
						  });
					
					}else{
						corrective = `<div class="col-md-3">
							<div class="card p-3 mb-2">
							<div class="d-flex justify-content-between">
								<div class="d-flex flex-row align-items-center">
									<div class="ms-2 c-details">
										<h6 class="mb-0">No Tickets Raised</h6>
									</div>
								</div>
								</div>
							</div>
						</div>`;
					}
											
					
					$("#logbookDiv").html(logbook);
					$("#preventiveDiv").html(preventive);
					$("#correctiveDiv").html(corrective);
					$("#statusDiv").html(statusAsset);
				});
	}
	
	function hideInnerContent(){
		$("#myGrid").show();
		$("#reqTable").show();
		$(".btn-hs").hide();
		$("#btndiv").show();
		$("#listdiv").show();
		$("#totalAsset").show();
		$("#searchRowDiv").show();
		$("#ttbtn").show();
		$("#demo").hide();
		//$("#totalAsset").show();
	}

	function downloadDetails() {
		var params = {
			fileName: 'asset_list.csv', // Specify your custom filename here
		};
		gridOptions.api.exportDataAsCsv(params);
	}
</script>

</head>
<body>

	<div layout:fragment="content" class="maincontent">

		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">

						<div class="d-flex justify-content-between" id="MainDiv">
							<div class="btn-hs" id="totalAsset">
								<div class="font-design">
									Asset Details(<span></span>)
								</div>
							</div>
							<div id="searchRowDiv">
								<div class="input-style">
									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput" onkeyup="cancelBar()"
										oninput="onQuickFilterChanged()" id="quickFilter"
										autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey"
											onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalAsset').find('span').html(gridOptions.api.getModel().getRowCount());"
											class="close_i"><i class="ti-close srchicon"></i></span></a><a
											href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
									</div>
								</div>
							</div>
							<div class="buttonsec btn-hs" id="ttbtn">
								<button class="download-btn" id="download"
									onclick="downloadDetails()">Download</button>
							</div>
						</div>

						<input type="hidden" id="sessionId" th:value="${userId}" /> <input
							type="hidden" id="sessionName" th:value="${userName}" /> <input
							type="hidden" id="hrRole" th:value="${hrRole}" /> <input
							type="hidden" id="sessionRole" th:value="${userRole}" /> <input
							type="hidden" id="adRole" th:value="${adRole}" />
						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>

						<div class="collapse" id="demo">
							<div class="innercontent">
								<div id="main3">
									<section style="background-color: #eee;">
										<div class="container py-4">
											<div class="row">
												<div class="col">
													<nav aria-label="breadcrumb"
														class="bg-light rounded-3 p-3 mb-4">
														<div class=" mb-0 d-flex justify-content-between">
															<div>
																<b>ASSET ID:<span id="assetIdBox"></span></b>
															</div>
															<div>
																<button class="cancel-btn" id="cancelBtn"
																	onclick="hideInnerContent()">Back</button>
															</div>
														</div>
													</nav>
												</div>
											</div>

											<div class="row">
												<div class="col-lg-4">
													<div class="card mb-4">
														<div class="card-body text-center">
															<img class=" img-fluid" style="width: 270px;" id="assetQr"
															onerror="this.onerror=null; this.src='../assets/images/noimage.jpg';">

															<div class="d-flex mb-2 badge justify-content-center" id="statusDiv">
																
															</div>
														</div>
													</div>
												</div>
												<div class="col-lg-8">
													<div class="card mb-4">
														<div class="card-body">
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Asset ID</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetIdT"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Asset Name</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetName"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Type</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetType"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Category</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetCategory"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Subcategory</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetSubcategory"></p>
																</div>
															</div>
															<hr>
															<div class="row">
																<div class="col-sm-3">
																	<p class="mb-0">Price</p>
																</div>
																<div class="col-sm-9">
																	<p class="text-muted mb-0" id="assetPrice"></p>
																</div>
															</div>

														</div>
													</div>

												</div>
											</div>
											<h4>Allocation LogBook</h4>
											<div class="scrollbar">
											<div class="container-fluid bg-white">
											
												<div class="row ">
													<div class="col-lg-12 mt-2" style="width: 100%; overflow: scroll;">

														<div class="horizontal-timeline">

															<ul class="list-inline items" id="logbookDiv" style="display: flex;overflow-x: scroll;width: 3000px;flex-wrap: nowrap;overflow-y: hidden;">
																
															</ul>

														</div>

													</div>
												</div>
												</div>

											</div>
											<h4 class=" mt-3">Preventive Maintenance Details</h4>
											<div class="fixTableHead">
											<table class="table bg-white">
												<thead>
													<tr>
														<th scope="col">Allocation ID</th>
														<th scope="col">Policy ID</th>
														<th scope="col">Asset ID</th>
														<th scope="col">Frequency</th>
														<th scope="col">Status</th>
													</tr>
												</thead>
												<tbody id="preventiveDiv">
													
												</tbody>
											</table>
											</div>

											<h4 class="mt-3">Corrective Maintenance Details</h4>
											<div class="container mt-5 mb-3">
												<div class="row" id="correctiveDiv">
												
												</div>
											</div>

										</div>
									</section>
								</div>
							</div>

						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
