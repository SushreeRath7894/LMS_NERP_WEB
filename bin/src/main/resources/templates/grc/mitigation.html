	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

	function approveOnclick() {
			
			var selectedRows = gridOptions.api.getSelectedRows();
			var selectedRowsString = '';
			selectedRows.forEach(function(selectedRow, index) {
				if (index > 0) {
					selectedRowsString += ',';
				}
				selectedRowsString += selectedRow.mitigationId;
			});
			var mitigationId = selectedRowsString;
			
			var approveStatus = 1;
			$('#approvePQtn').modal('show');
			$('.loader').show();
		$.ajax({
			type : "GET",
			url : "risk-mitigation-plan-approve-th-ajax?approveStatus=" + approveStatus + "&mitigationId=" + mitigationId ,
			async : false,
			success : function(response) {
				if (response.message == "Success") {
					$('.loader').hide();
					$("#messageParagraph").text("Indent Approved Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					
					$('#newBtn').attr("disabled", false);
					$('#analysisDltBtn').attr("disabled", true);
					$('#approveBtn').attr("disabled", true);
					
					$('#approvePQtn').modal('hide');
					$("#total").show();
					$("#totalReq").show();
					$("#btndiv").show();
					$('#dwnld').show();
					$("#addData").hide();
					$("#myGrid").show();
					$("#searchRowDiv").show();
					$("#reqTable").show();
		
					gridOptions.api.setRowData();
					agGrid.simpleHttpRequest({
						url : "risk-mitigation-plan-view-all-Details"
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						var allData = jsonData.mitigationAllDatails;
						var len = allData.length;
						$('#totalReq').find('span').html(len);
						gridOptions.api.setRowData(allData);
					});  
					
				}else{
					$('.loader').hide();
					$('#approvePQtn').modal('show');
				}
				
			},
			error : function(data) {
			}
		});
	}
