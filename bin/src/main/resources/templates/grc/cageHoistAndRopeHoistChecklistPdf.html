<!DOCTYPE html>
<html>
<head>
  <title>CAGE HOIST AND ROPE HOIST CHECKLIST</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"></meta>
  <style>
@page {
	size: A4 portrait;
	padding: 0;
	margin: 0;
}

table {
	width: 100%;
	font-family: sans-serif;
	border-collapse: collapse;
	border-spacing: 0;
	-fs-table-paginate: paginate;
}

.border, table, th, td, table.border, table.border th, table.border td {
	border: 1px solid;
}

table {
	page-break-inside: avoid;
}

table.borderless, .border table.border-0, .border table.border-0 th,
	.border table.border-0 td {
	border: 0;
}

.table-fixed {
	table-layout: fixed;
}

.m-0 {
	margin: 0;
}

.p-0 {
	padding: 0;
}

.align-middle {
	vertical-align: middle;
}

.text-center {
	text-align: center;
}

.text-start {
	text-align: left;
}

.text-end {
	text-align: right;
}

.text-nowrap {
	text-wrap: nowrap;
}

.align-top {
	vertical-align: top;
}

.align-bottom {
	vertical-align: bottom;
}

.border-0, .border-0 th, .border-0 td {
	border: 0;
}

.bordered .border-left-0 {
	border-left: 0;
}

.bordered .border-right-0 {
	border-right: 0;
}

.border-0 .border-top, .border-top, .border-top th, .border-top td {
	border-top: 1px solid;
}

.border-0 .border-left, .border-left, .border-left th, .border-left td,
	th.border-left {
	border-left: 1px solid;
}

.border-0 .border-right, .border-right, .border-right th, .border-right td,
	th.border-right {
	border-right: 1px solid;
}

.border-0 .border-bottom, .border-bottom, .border-bottom th,
	.border-bottom td {
	border-bottom: 1px solid;
}

.ps-1 {
	padding-left: 10px;
}

.ps-0_5 {
	padding-left: 5px;
}

.pt-1 {
	padding-top: 10px;
}

.p-0_5 {
	padding: 2.5px;
}

.p-1 {
	padding: 10px;
}

.p-2 {
	padding: 20px;
}

.px-3 {
	padding-left: 15px;
	padding-right: 15px;
}

.m-1 {
	margin: 5px;
}

.mt-2 {
	margin-top: 20px;
}

img {
	width: 250px;
}

.fs-18p {
	font-size: 18px;
}

.fs-16p {
	font-size: 16px;
}

.fs-14p, td.fs-14p {
	font-size: 14px;
}

.fs-12p {
	font-size: 12px;
}

.fs-10p {
	font-size: 10px;
}

.fs-9p {
	font-size: 9px;
}

.fw-normal {
	font-weight: normal;
}

.fw-bold {
	font-weight: 700;
}

.fw-bolder {
	font-weight: 900;
}

/*tbody td:first-child, tfoot td:first-child { border-left: 0; }*/
/*tbody td:last-child, tfoot td:last-child { border-right: 0; }*/
.h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th {
	height: 60px;
}

.h-pdf, .h-pdf td, .h-pdf th {
	height: 24px;
}

.h-pdf-next, .h-pdf-next td, .h-pdf-next th {
	height: 10px;
}

td.h-row {
	height: 20px;
}

td.h-row-smaller {
	height: 10px;
}

td.h-row-xs {
	height: 5px;
}

.bg-dark {
	background-color: #000000;
}

.bg-lightgrey {
	background-color: #d3d3d3;
}

.text-white {
	color: #ffffff;
}

.rounded-1 {
	border-radius: 5px;
}

.font-serif {
	font-family: serif;
}

.font-vivian {
	font-family: 'Vivian', sans-serif;
}

[class^="ti-"], [class*=" ti-"] {
	font-family: 'themify';
	speak: none;
	font-style: normal;
	font-variant: normal;
	text-transform: none;
	line-height: 1;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	font-weight: 900;
}

.ti-check:before {
	content: "\e64c";
}

.ti-close:before {
	content: "\e646";
}

.table-caption {
	margin-bottom: 10px;
	font-weight: 700;
	font-size: 14px;
}

.border-none {
	border-collapse: collapse;
	border: none;
}

.border-none td {
	border: 1px solid black;
}

.border-none tr:first-child th {
	border-top: none;
	border-left: none;
	border-bottom: none;
}

.border-none tr:last-child th {
	border-bottom: none;
	border-right: none;
}

.border-none tr:first-child td {
	border-top: none;
}

.border-none tr:last-child td {
	border-bottom: none;
}

.border-none tr td:first-child {
	border-left: none;
}

.border-none tr td:last-child {
	border-right: none;
}

.orif-logo {
	height: 35px;
	width: 120px;
	margin-left: 20px;
}

.br-left {
	border-left: 1px solid #000000 !important;
}

.br-right {
	border-right: 1px solid #000000 !important;
}

.br-top {
	border-top: 1px solid #000000 !important;
}

.br-bottom {
	border-bottom: 1px solid #000000 !important;
}
</style>
</head>
<body>

<table class="borderless">
  <tbody class="border-0">
    <tr>
      <td class="p-1">
        <table class="border-0">
          <tr>
				<td class="p-1" colspan='2'>
					<table class="border">
						<tr>
							<th width="20%"><img th:src="${logo}"
								class="text-start orif-logo"></img></th>
							<th width="55%" class="h-pdf-xl text-center"><span
								class="text-center" style="text-transform: uppercase"
								th:text="${allData[0].orgDiv}"></span> <br></br> <span
								class="text-center fs-12p" th:text="${allData[0].orgAddress}"></span>
							</th>
							<td class="text-end fs-12p align-top" width="25%">
								<table class="fs-12p border-0">
									<tr>

										<th class="text-end fs-12p">Doc. No: OBPL/OHS-24</th>
									</tr>
									<tr>
										<th class="text-end fs-12p">Issue No./Date: 01/02.08.2022</th>
									</tr>
									<tr>
										<th class="text-end fs-12p">Rev. No/Date: 00/NIL</th>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
						</tr>
					</table> <!-- <table class="border-0 h-pdf-next"><tr><td>&nbsp;</td></tr></table> -->
				</td>
			</tr>
          <tr class="text-center">
            <th class="text-center" colspan='2'><span class="fs-16p">CAGE HOIST CHECKLIST</span></th>
            <!-- <td class="text-start fs-12p" width="40%">DATE OF INSPECTION: <span th:text="${allData[0].date}"></span></td> -->
          </tr>
          <tr>
           <th><span class="fs-16p text-center" width="60%">&nbsp;</span></th>
            <td class="text-end fs-12p" >DATE OF INSPECTION: <b><span th:text="${allData[0].date}"></span></b></td>
          </tr>
        </table>
        <table class="border-0 h-pdf-next"><tr><td>&nbsp;</td></tr></table>
        <table class="border-0">
          <tr>
            <th class="text-start"><B>CHECK POINTS:</B></th>
          </tr>
        </table>
      </td>
    </tr>
  <tr>
    <td>
      <table class="border-0">
        <tbody>
        <tr>
          <td class="p-1">
            <table class="fs-12p text-center border">
              <tr>
                <th width="5%">Sl No.</th>
                <th width="65%">Check Points</th>
                <th width="15%">Yes/No</th>
                <th width="15%">Remarks</th>
              </tr>
              <tr th:each="items: ${allData}">
                <td class="text-start ps-0_5" th:text="${items.slNo}"></td>
                <td class="text-start ps-0_5" th:text="${items.taskName}"></td>
                <td th:text="${items.result}"></td>
                <td th:text="${items.remark}"></td>
              </tr> 
            </table>
          </td>
        </tr>
        </tbody>
      </table>
    </td>
  </tr>
  <tr><tr><table class="border-0 h-pdf-next"><tr><td>&nbsp;</td></tr></table></tr></tr>
  <tr>
    <table class="border-0 fs-14p">
      <tr>
        <th class="text-start p-1" width="70%">Checked By :</th>
        <th class="text-start p-1">Sign Of Electrical Engineer</th>
      </tr>
    </table>
  </tr>
  <tr><table class="border-0 h-pdf-next"><tr><td>&nbsp;</td></tr></table></tr>
  <tr>
    <table class="border-0 fs-14p">
      <tr>
        <th class="text-start p-1" width="70%">Checked By :</th>
        <th class="text-start p-1">Sign Of Maintenance Engineer</th>
      </tr>
    </table>
  </tr>
  <tr><table class="border-0 h-pdf-next"><tr><td>&nbsp;</td></tr></table></tr>
  <tr>
    <table class="border-0 fs-14p">
      <tr>
        <th class="text-start p-1" width="70%">Verified By :</th>
        <th class="text-start p-1">Sign Of Safety Officer</th>
      </tr>
    </table>
  </tr>
  </tbody>
</table>

</body>
</html>
