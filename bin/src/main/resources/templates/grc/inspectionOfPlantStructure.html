<!DOCTYPE html>
<html>
<head>
  <title>Inspection of Plant Structure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"></meta>
  <style>
    @page {
      size: A4 portrait;
      padding: 0;
      margin: 0;
    }
    table { width: 100%; font-family: sans-serif; border-collapse: collapse; border-spacing: 0; -fs-table-paginate: paginate; }
    .border, table, th, td, table.border, table.border th, table.border td { border: 1px solid; }
    table { page-break-inside: avoid; }

    table.borderless, .border table.border-0, .border table.border-0 th, .border table.border-0 td { border: 0; }
    .table-fixed { table-layout: fixed; }

    .m-0 { margin: 0; }
    .p-0 { padding: 0; }
    .align-middle { vertical-align: middle; }
    .text-center { text-align: center; }
    .text-start { text-align: left; }
    .text-end { text-align: right; }
    .text-nowrap { text-wrap: nowrap; }
    .align-top { vertical-align: top; }
    .align-bottom { vertical-align: bottom; }

    .border-0, .border-0 th, .border-0 td { border: 0; }
    .bordered .border-left-0 { border-left: 0; }
    .bordered .border-right-0 { border-right: 0; }
    .border-0 .border-top, .border-top, .border-top th, .border-top td { border-top: 1px solid; }
    .border-0 .border-left, .border-left, .border-left th, .border-left td, th.border-left { border-left: 1px solid; }
    .border-0 .border-right, .border-right, .border-right th, .border-right td, th.border-right { border-right: 1px solid; }
    .border-0 .border-bottom, .border-bottom, .border-bottom th, .border-bottom td { border-bottom: 1px solid; }
    .ps-1 { padding-left: 10px; }
    .ps-0_5 { padding-left: 5px; }
    .pt-1 { padding-top: 10px; }
    .p-0_5 { padding: 2.5px; }
    .p-1 { padding: 10px; }
    .p-2 { padding: 20px; }
    .px-3 { padding-left: 15px; padding-right: 15px; }

    .m-1 { margin: 5px; }
    .mt-2 { margin-top: 20px; }
    img { width: 250px; }

    .fs-18p { font-size: 18px; }
    .fs-16p { font-size: 16px; }
    .fs-14p, td.fs-14p { font-size: 14px; }
    .fs-12p { font-size: 12px; }
    .fs-10p { font-size: 10px; }
    .fs-9p { font-size: 9px; }
    .fw-normal { font-weight: normal; }
    .fw-bold { font-weight: 700; }
    .fw-bolder { font-weight: 900; }

    /*tbody td:first-child, tfoot td:first-child { border-left: 0; }*/
    /*tbody td:last-child, tfoot td:last-child { border-right: 0; }*/

    .h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th { height: 60px; }
    .h-pdf, .h-pdf td, .h-pdf th { height: 24px; }
    .h-pdf-next, .h-pdf-next td, .h-pdf-next th { height: 10px; }
    td.h-row { height: 20px; }
    td.h-row-smaller { height: 10px; }
    td.h-row-xs { height: 5px; }
    .bg-dark { background-color: #000000; }
    .bg-lightgrey { background-color: #d3d3d3; }

    .text-white { color: #ffffff; }
    .rounded-1 { border-radius: 5px; }
    .font-serif { font-family: serif; }
    .font-vivian { font-family: 'Vivian', sans-serif; }
    [class^="ti-"], [class*=" ti-"] { font-family: 'themify'; speak: none; font-style: normal; font-variant: normal; text-transform: none; line-height: 1; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-weight: 900; }
    .ti-check:before { content: "\e64c"; }
    .ti-close:before { content: "\e646"; }
    .table-caption {
          margin-bottom: 10px;
    font-weight: 700;
    /* font-size: 14px; */
    margin-top: 10px;
    }
    .bordered-tbl {
  border-collapse: collapse;
  border: none;
}

.bordered-tbl td {
  border: 1px solid black;
}

.bordered-tbl tr:first-child th {
  border-top: 1px solid #000000;
    border-left: 1px solid #000000;
    border-bottom: 1px solid #000000;
}

.bordered-tbl tr:last-child th {
  border-bottom: 1px solid #000000;
  border-right: 1px solid #000000;
}

.bordered-tbl tr:first-child td {
  border-top: 1px solid #000000;
}

.bordered-tbl tr:last-child td {
  border-bottom: 1px solid #000000;
}

.bordered-tbl tr td:first-child {
  border-left: 1px solid #000000;
}

.bordered-tbl tr td:last-child {
  border-right: 1px solid #000000;
}
.ori-logo {width: 75%;}
  </style>
</head>
<body>

<table class="borderless">
  <thead class="text-center border-0">
  <tr>
    <td>
      <table class="table-fixed border-0">
        <tr class="h-pdf-xl">
          <th></th>
          <th width="60%"><span class="p-2 fs-18p" style="text-transform: uppercase"
						th:text="${allData[0].orgDiv}"></span></th>
          <th class="text-end"><img th:src="${logo}" class="text-end p-2 ori-logo"></img></th>
        </tr>
      </table>
    </td>
  </tr>
  </thead>
  <tbody class="border-0">
  <tr>
    <td>
      <table class="border-0">
        <thead>
        <tr>
          <caption class="text-center table-caption fs-16p">Quaterly Inspection of Plant Structure</caption>
        </tr>
        <tr>
          <td class="p-1">
            <table class="fs-12p bordered-tbl">
              <tr>
                <th rowspan="3" class="text-start p-1" width="70%">For The Month Of: <span th:text="${allData[0].monthName}"></span> </th>
                <td class="text-end">Document No.: OPL/OHS-26</td>
              </tr>
              <tr>
                <td class="text-end">Issue No./Date: 01/02.01.2014</td>
              </tr>
              <tr>
                <td class="text-end">Rev. No./Date: 00/Nil</td>
              </tr>
            </table>
          </td>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td class="p-1">
            <table class="fs-12p text-center border">
              <tr>
                <th width="5%">SN</th>
                <th width="25%">Area</th>
                <th width="25%">Observation</th>
                <th width="15%">Date of Inspection</th>
                <th width="15%">Status</th>
                <th width="15%">Remarks</th>
              </tr>
              <tr th:each="items: ${allData}">
              <td class="align-top" th:text="${items.slNo}"></td>
              <td class="text-start ps-0_5" th:text="${items.taskName}"></td>
              <td class="text-start ps-0_5" th:text="${items.observation}"></td>
              <td th:text="${items.dateOfInspection}"></td>
              <td th:text="${items.result}"></td>
              <td th:text="${items.remark}"></td>
              </tr>
              
            </table>
            
            <table class="border-0 h-pdf-xl"><tr><td>&nbsp;</td></tr></table>
          </td>
        </tr>
        </tbody>
      </table>
    </td>
  </tr>
  <tr>
    <table class="border-0 fs-12p">
      <tr>
        <td width="70%" class="ps-0_5">Checked By:</td>
        <td width="30%" class="ps-0_5">Signature:</td>
      </tr>
    </table>
  </tr>
  </tbody>
</table>

</body>
</html>
