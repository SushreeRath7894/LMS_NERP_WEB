<!DOCTYPE html>

    .font-serif { font-family: serif; }

  border-collapse: collapse;
  border: none;
}

.bordered-tbl td {
  border: 1px solid black;

  border-top: 1px solid #000000;
    border-left: 1px solid #000000;
    border-bottom: 1px solid #000000;
}

.bordered-tbl tr:last-child th {
  border-bottom: 1px solid #000000;
  border-right: 1px solid #000000;
}

.bordered-tbl tr:first-child td {
  border-top: 1px solid #000000;
}

.bordered-tbl tr:last-child td {
  border-bottom: 1px solid #000000;
}

.bordered-tbl tr td:first-child {

}

}
.ori-logo {width: 150px;}
.br-left {border-left: 1px solid #000000 !important;}

<table class="borderless">
  <thead class="text-center border-0">
  <tr>
    <td>
      <table class="table-fixed border-0">
        <tr class="h-pdf-xl">
          <th class="text-center" width="20%"><img th:src="${logo}" class="text-end  ori-logo"></img></th>
          <th class="text-center"><span class="p-2 fs-18p" style="text-transform: uppercase" th:text="${allData[0].orgDiv}"></span></th>
          <th width="20%"></th>
        </tr>
      </table>
    </td>
  </tr>
  </thead>
  <tbody class="border-0">
  <tr>
    <td>
      <table class="border-0">
        <thead>
        <tr>
          <td class="p-1 pb-0">
            <table class="fs-12p bordered-tbl">
              <tr>
                <th rowspan="3" class="text-center p-1 fs-16p" width="70%">CHECKLIST FOR SAFETY EQUIPMENT </th>
                <td class="text-end">Document No.: OPL/OHS-26</td>
              </tr>
              <tr>
                <td class="text-end">Issue No./Date: 01/02.01.2014</td>
              </tr>
              <tr>
                <td class="text-end">Rev. No./Date: 00/Nil</td>
              </tr>
              <tr>
                <th class="text-center p-1 fs-16p br-left br-right br-bottom" colspan="2">FOR THE MONTH OF/DATE : <span th:text="${allData[0].monthName}"> / </span><span th:text="${allData[0].date}"></span></th>
              </tr>
              
            </table>
          </td>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td class="p-1 pt-0">
            <table class="fs-12p text-center border">
              <tr>
                <th width="5%">Sl. No.</th>
                <th width="25%">Location</th>
                <th width="10%">Date</th>
                <th width="15%">Result</th>
                <th width="15%">Checked By</th>
                <th width="15%">Signature</th>
                <th width="15%">Remark</th>
              </tr>
              <tr th:each="items: ${allData}">
                <td class="align-top" th:text="${items.slNo}">1</td>
                <td class="text-start ps-0_5" th:text="${items.taskName}">RM STORE</td>
                <td class="text-center ps-0_5" th:text="${items.date}"></td>
                <td class="text-center ps-0_5" th:text="${items.result}"></td>
                <td class="text-center ps-0_5" th:text="${items.reviewName}"></td>
                <td class="text-center ps-0_5"></td>
                <td class="text-center ps-0_5" th:text="${items.remark}"></td>
              </tr>
    
            </table>
            
          </td>
        </tr>
        </tbody>
      </table>
    </td>
  </tr>
  </tbody>
</table>
