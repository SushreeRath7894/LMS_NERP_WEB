<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
   xmlns:th="http://www.thymeleaf.org"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout/master}">
   <head>
      <title>Welcome</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style></style>
      <script type="text/javascript">
         $(document).ready(function() {
          
          $('#delete').attr('disabled', true);
         
         var gridDiv = document.querySelector('#myGrid');
         new agGrid.Grid(gridDiv, gridOptions);
         
         var gridDiv = document.querySelector('#myGrid1');
         new agGrid.Grid(gridDiv, gridOptions1);
         
         
         // View AgGrid-1
         
         agGrid.simpleHttpRequest({
         url : "incident-manage-view-master"
         }).then(function(data) {
         gridOptions.api.setRowData(data);
         var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0); // Get the first row node
         if (firstRowNode) {
         firstRowNode.setSelected(true); // Set the row as selected
         }
         });       
         var selectedRows = gridOptions.api.getSelectedRows();
         console.log("------------------>>>>>>>>> "+selectedRows[0].incidentNo)
         incNo = selectedRows[0].incidentNo;
         $('#incidentNo').val(selectedRows[0].incidentNo);
         $('#projectId').val(selectedRows[0].projectId);
         console.log(selectedRows[0].incidentNo);
         viewdets(incNo);
         });
         
         var incNo="";  
         // View AgGrid-2
         
         function viewdets(id){
         var selectedRows = gridOptions.api.getSelectedRows();
         agGrid.simpleHttpRequest({
         url : "incident-manage-view?id=" +id
         }).then(function(data) {
         gridOptions1.api.setRowData(data);
         
         
         }) ;
         
         }
         
         //  Ag Grid-1
         
         var columnDefs = [ {
          headerCheckboxSelection : false,
         headerCheckboxSelectionFilteredOnly : true,
         checkboxSelection : true,
         width : 10,
         sortable : false,
         filter : false,
         resizable : true
         },
         {
         	headerName : "Incident No.",
         	field : "incidentNo",
         	width : 150,
         	
         
         }, {
         	headerName : "Date",
         	field : "date",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Type",
         	field : "type",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Description",
         	field : "description",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Reported By",
         	field : "reportedBy",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Project Id",
         	field : "projectId",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Severity",
         	field : "severity",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Action Taken",
         	field : "actionTaken",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Location",
         	field : "location",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Latitude",
         	field : "latitude",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Longitude",
         	field : "longitude",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Status",
         	field : "status",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         } ];
         
         var gridOptions = {
         	columnDefs : columnDefs,
         	defaultColDef : {
         		sortable : true,
         		filter : true,
         		resizable : true,
         		width : 260,
         		height : 10
         	},
         	//rowSelection : 'multiple',
         	rowSelection : 'single',
         	suppressRowClickSelection : true,
         	onSelectionChanged : selectRow,
         };
         
         
         //  Ag Grid-2
         
         var columnDefs1 = [ {
          headerCheckboxSelection : false,
         headerCheckboxSelectionFilteredOnly : true,
         checkboxSelection : true,
         width : 10,
         sortable : false,
         filter : false,
         resizable : true
         },
         {
         	headerName : "Assign No.",
         	field : "assignNo",
         	width : 150,
         	cellRenderer : function(params) {
         return '<a id="" onclick=editId("' + params.data.assignNo
         + '") href="javascript:void(0)">'
         + params.data.assignNo + '</a>';
         }
         
         }, {
         	headerName : "Assign To",
         	field : "assignTo",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Task",
         	field : "task",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Due Date",
         	field : "dueDate",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Remarks",
         	field : "remarks",
         	cellStyle : {
         		textAlign : 'left'
         	},
         	
         } ];
         
         var gridOptions1 = {
         	columnDefs : columnDefs1,
         	defaultColDef : {
         		sortable : true,
         		filter : true,
         		resizable : true,
         		width : 260,
         		height : 10
         	},
         	//rowSelection : 'multiple',
         	rowSelection : 'single',
         	suppressRowClickSelection : true,
         	onSelectionChanged : deleteModal,
         };
         
         
         function selectRow(){
          var selectedRows = gridOptions.api.getSelectedRows();
         incNo = selectedRows[0].incidentNo;
         //alert(incNo);
         $('#incidentNo').val(selectedRows[0].incidentNo);
         $('#projectId').val(selectedRows[0].projectId);
         console.log(selectedRows[0].projectId);
         viewdets(incNo);	
         
         }
         
         function deleteModal(){
          $('#delete').attr('disabled', false); 
         
         }
         
         
         // Function for ag grid    
         function openNav() {
         	$("#assignTo").val('');
         	$("#task").val('');
         	$("#dueDate").val('');
         	$("#remarks").val('');
         	
         	document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto; top:320px;";
         
         	document.getElementById("demo").style.width = "75%";
         	$("#delete").hide();
         	$("#add").hide();
         }
         
         function closeNav() {
         	document.getElementById("mySidenav").style.width = "0";
         	document.getElementById("demo").style.width = "100%";
         	$("#assignTo").val('');
         	$("#task").val('');
         	$("#dueDate").val('');
         	$("#remarks").val('');
         	
         	$("#delete").show();
         	$("#add").show();
         }
         
         
          
         
         // save
         function saveNav() {
         	var obj = {};
         	obj.incidentNo = $("#incidentNo").val();
         	obj.projectId = $("#projectId").val();
         	obj.assignNo = $("#assignNo").val();
         obj.assignTo = $("#assignToId").val();
         obj.task = $("#task").val();
         obj.dueDate = $("#dueDate").val();
         obj.remarks = $("#remarks").val();        
         	
         
         	console.log(obj);
         	
         	var validation = true;
         	 
         /*   if (obj.incidentType == null || obj.incidentType == "") {
         validation = validationUpdated("Incident Type Required", "incidentType");
         }
         if (obj.incidentDesc == null || obj.incidentDesc == "") {
         validation = validationUpdated("Incident Description Required", "incidentDesc");
         }
         if (obj.status == null || obj.status == "") {
         validation = validationUpdated("Status Required", "status");
         }    */
          
         
         if (validation) {
         $.ajax({
         type : "POST",
         url : "incident-manage-add",
         contentType : "application/json",
         data : JSON.stringify(obj),
         success : function(response) {
         if (response.message == "success") {
         
         $("#messageParagraph").text("Data Saved Successfully");
         $("#msgOkModal").removeClass("btn3");
         $("#msgOkModal").addClass("btn1");
         $("#msgModal").modal('show');
         $("#activityone").show();
         $("#add").show();
         $("#myGrid").show();
         $("#cancel").hide();
         $("#save").hide();
         $("#form").hide();
         $("#new").hide();
         viewdets(incNo);
         
         closeNav();
         
         }
         },
         
         error : function(data) {
         }
         })
         }
                 
         }
         
         
         /* AssignTo AutoSearch */
         
         function getAssignToList() {
         var search = $("#assignTo").val();
         
         if (search) {
         
         $
         		.ajax({
         			type : "POST",
         			url : "incident-manage-get-assign-list",
         			dataType : 'json',
         			contentType : 'application/json',
         			data : search,
         			success : function(response) {
         				if (response.message == "success") {
         					console.log(response)
         					if (response.body.length != 0) {
         						$("#search")
         								.css(
         										"background",
         										"#FFF");
         						var content = '<ul id="autocomplete-list" >';
         						for (var i = 0; i < response.body.length; i++) {
         							content += '<li style="margin-left:-30px; font-weight:100; font-size:12px;"   class="autocompletedata cp" onClick="selectAutocompleteValue(\''
         									+ response.body[i].key
         									+ '\',\''
         									+ response.body[i].name
         									+ '\')">'
         									+ response.body[i].name
         									+ '</li>';
         						}
         
         						content += '</ul>';
         						//console.log("content " + content)
         						$(
         								"#suggesstion-box")
         								.show();
         						$(
         								"#suggesstion-box")
         								.html(
         										content);
         
         					} else {
         						$("#search")
         								.css(
         										"background",
         										"#FFF");
         						var content = '<ul id="autocomplete-list">';
         						content += '<li style="margin-left:-30px; font-weight:100; font-size:14px; color:#ccc;     background-color: #0909e4;" onClick="selectAutocompleteValue()">'
         								+ "No Data Found"
         								+ '</li>';
         
         						content += '</ul>';
         						$(
         								"#suggesstion-box")
         								.show();
         						$(
         								"#suggesstion-box")
         								.html(
         										content);
         					}
         				}
         			},
         			error : function(data) {
         				console.log(data);
         			}
         		})
         } else {
         $("#suggesstion-box").hide();
         }
         
         }
         
         
     	function selectAutocompleteValue(assignToId, assignTo) {

    		if (assignToId) {

    			$("#assignToId").val(assignToId);
    			$("#assignTo").val(assignTo);
    			$("#search").val(assignTo);
    			$("#search").attr('data-procat', assignToId);
    			$("#suggesstion-box").hide();
    			
    		} else {

    			$("#assignToId").val("");
    			$("#assignTo").val("");
    			
    			$("#search").val("");
    			$("#search").attr('data-procat', "");
    			$("#suggesstion-box").hide();

    		}
    	}
         
         // edit
         
         function editId(id) {
         
         console.log("idddddddddd = " + id);
         $("#add").hide();
         //$("#myGrid").show();
         $("#delete").hide();
         $("#add").hide();
         //$("#download").hide();
         
         $
         	.ajax({
         		type : "GET",
         		url : "incident-manage-edit?Id="
         				+ id,
         		success : function(response) {
         			if (response.message == "Success") {
         				openNav();
         				console.log("edit" + JSON.stringify(response));        						
         				$("#assignNo").val(response.body.assignNo);
         				$("#assignTo").val(response.body.assignTo);
         			    $("#task").val(response.body.task);        						
         				$("#dueDate").val(response.body.dueDate);       								
         				$("#remarks").val(response.body.remarks);
         						
         			}
         		},
         
         		error : function(data) {
         			console.log(data)
         
         			$("#assignNo").val();
         			$("#assignTo").val();
         			$("#task").val();
         			$("#dueDate").val();
         			$("#remarks").val();
         
         		}
         	});
         }
         
         //Delete 
         function deleteFun() {
         var selectedRows = gridOptions1.api
         	.getSelectedRows();
         var id = selectedRows[0].assignNo;
         $('#delete').attr('disabled', true);
         console.log("id", id);
         $
         	.ajax({
         		type : "GET",
         		url : "incident-manage-delete?id="
         				+ id,
         		success : function(response) {
         			if (response.message == "Success") {
         
         				agGrid
         						.simpleHttpRequest(
         								{
         									url : "incident-manage-view"
         								})
         						.then(
         								function(
         										data) {
         									gridOptions1.api
         											.setRowData(data);
         								});
         				//location.reload();
         
         				closeModal();
         				closeNav();
         				viewdets(incNo);
         			}
         		},
         		error : function(data) {
         			console.log(data);
         		}
         	})
         }
         
         function deleteModalfun() {
         $("#deleteModal").modal('show');
         }
         function closeModal() {
         $("#deleteModal").modal('hide');
         }
      </script>
   </head>
   <body>
      <div layout:fragment="content" class="maincontent">
         <div class="container-fluid">
            <div class="row">
               <div class="maincontentsec">
                  <div class="content_padding">
                     <div id="main_content">
                        <div class="panel-body">
                           <div class="d-flex justify-content-between">
                              <div class="btn-hs">
                                 <div class="font-design" id="totalReq">
                                    Master (<span></span>)
                                 </div>
                              </div>
                           </div>
                           <div class="row">
                              <div id="myGrid" style="width: 100%; height: 200px;"
                                 class="ag-theme-alpine"></div>
                           </div>
                        </div>
                        <div class="panel-body" id="demo">
                           <div class="d-flex justify-content-between">
                              <div class="btn-hs">
                                 <div class="font-design" id="totalReq1">
                                    Manage (<span></span>)
                                 </div>
                              </div>
                              <div class="buttonsec btn-hs" id="btndiv">
                                 <button id="download" class="download-btn" onclick="goalCSV()">Download</button>
                                 <button id="add" class="new-btn" onclick="openNav()">New</button>
                                 <button class="delete-btn" id="delete" onclick="deleteModalfun()">DELETE</button>
                              </div>
                           </div>
                           <div class="row">
                              <div id="myGrid1" style="width: 100%; height: 300px;"
                                 class="ag-theme-alpine"></div>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
               <div id="mySidenav" class="sidenav">
                  <div class="slidebox">
                     <div class="d-flex justify-content-between">
                        <div class="edit">Manage Details</div>
                        <div class="arrow">
                           <a href="javascript:void(0)" class="closebtn"
                              onclick="closeNav()"><i class="ti-arrow-right"></i></a>
                        </div>
                     </div>
                     <div class="row">
                        <div class="col-md-12 buttonsec btn-hs">
                           <button class="cancel-btn" onclick="closeNav()">CANCEL</button>
                           <button class="save-btn" onclick="saveNav()">SAVE</button>
                        </div>
                     </div>
                     <input type="hidden" id="assignNo">
                     <input type="hidden" id="incidentNo">
                     <input type="hidden" id="projectId">
                     <div class="col-md-12">
                        <div class="form-group">
                           <div class="autocomplete" style="width: 100%;">
                              <label> Assign To</label> <input type="text"
                                 class="form-control" id="assignTo" placeholder="Search Here.." onkeyup='getAssignToList()'>
                              <input type="hidden" id="assignToId">
                           </div>
                           <div id="suggesstion-box" class="sugg-cls"></div>
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label> Task</label> <input type="text"
                              class="form-control" id=task onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label>Due Date</label> <input type="date"
                              class="form-control" id="dueDate"
                              onblur="removeValid(event)" autocomplete="off" >
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label>Remarks</label> <input type="text"
                              class="form-control" id="remarks" onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
                  </div>
               </div>
            </div>
            <!-- delete modal start -->
            <div class="modal fade"  id="deleteModal">
               <div class="modal-dialog modal-confirm" >
                  <div class="modal-content">
                     <div class="modal-header flex-column">
                     </div>
                     <div class="modal-body">
                        <p>Do you really want to delete these records? This
                           process cannot be undone.
                        </p>
                     </div>
                     <div class="modal-footer justify-content-center">
                        <button type="button" class="btn1" data-dismiss="modal"
                           aria-hidden="true" onclick="closeModal()">Cancel</button>
                        <button type="button" class="btn3" id="deleteModalBtn"
                           onclick="deleteFun()">Delete</button>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </body>
</html>
