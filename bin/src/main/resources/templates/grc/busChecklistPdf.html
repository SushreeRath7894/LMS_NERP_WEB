<!DOCTYPE html>
<html>
<head>
<title>Bus Checklist</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
<style>
@page {
	size: A4 portrait;
	padding: 0;
	margin: 0;
}

table {
	width: 100%;
	font-family: sans-serif;
	border-collapse: collapse;
	border-spacing: 0;
	-fs-table-paginate: paginate;
}

.border, table, th, td, table.border, table.border th, table.border td {
	border: 1px solid;
}

table {
	page-break-inside: avoid;
}

table.borderless, .border table.border-0, .border table.border-0 th,
	.border table.border-0 td {
	border: 0;
}

.table-fixed {
	table-layout: fixed;
}

.m-0 {
	margin: 0;
}

.p-0 {
	padding: 0;
}

.align-middle {
	vertical-align: middle;
}

.text-center {
	text-align: center;
}

.text-start {
	text-align: left;
}

.text-end {
	text-align: right;
}

.text-nowrap {
	text-wrap: nowrap;
}

.align-top {
	vertical-align: top;
}

.align-bottom {
	vertical-align: bottom;
}

.border-0, .border-0 th, .border-0 td {
	border: 0;
}

.bordered .border-left-0 {
	border-left: 0;
}

.bordered .border-right-0 {
	border-right: 0;
}

.border-0 .border-top, .border-top, .border-top th, .border-top td {
	border-top: 1px solid;
}

.border-0 .border-left, .border-left, .border-left th, .border-left td,
	th.border-left {
	border-left: 1px solid;
}

.border-0 .border-right, .border-right, .border-right th, .border-right td,
	th.border-right {
	border-right: 1px solid;
}

.border-0 .border-bottom, .border-bottom, .border-bottom th,
	.border-bottom td {
	border-bottom: 1px solid;
}

.ps-1 {
	padding-left: 10px;
}

.ps-0_5 {
	padding-left: 5px;
}

.pt-1 {
	padding-top: 10px;
}

.p-0_5 {
	padding: 2.5px;
}

.p-1 {
	padding: 10px;
}

.p-2 {
	padding: 20px;
}

.px-3 {
	padding-left: 15px;
	padding-right: 15px;
}

.m-1 {
	margin: 5px;
}

.mt-2 {
	margin-top: 20px;
}
/*img { width: 250px; }*/
.fs-24p {
	font-size: 24px;
}

.fs-18p {
	font-size: 18px;
}

.fs-16p {
	font-size: 16px;
}

.fs-14p, td.fs-14p {
	font-size: 14px;
}

.fs-12p {
	font-size: 12px;
}

.fs-10p {
	font-size: 10px;
}

.fs-9p {
	font-size: 9px;
}

.fw-normal {
	font-weight: normal;
}

.fw-bold {
	font-weight: 700;
}

.fw-bolder {
	font-weight: 900;
}

/*tbody td:first-child, tfoot td:first-child { border-left: 0; }*/
/*tbody td:last-child, tfoot td:last-child { border-right: 0; }*/
.h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th {
	height: 80px;
}

.h-pdf, .h-pdf td, .h-pdf th {
	height: 24px;
}

.h-pdf-next, .h-pdf-next td, .h-pdf-next th {
	height: 18px;
}

td.h-row {
	height: 20px;
}

td.h-row-smaller {
	height: 10px;
}

td.h-row-xs {
	height: 5px;
}

.bg-dark {
	background-color: #000000;
}

.bg-lightgrey {
	background-color: #d3d3d3;
}

.text-white {
	color: #ffffff;
}

.rounded-1 {
	border-radius: 5px;
}

.font-serif {
	font-family: serif;
}

.font-vivian {
	font-family: 'Vivian', sans-serif;
}
/*.font-calibri { font-family: 'Calibri', sans-serif; }*/
[class^="ti-"], [class*=" ti-"] {
	font-family: 'themify';
	speak: none;
	font-style: normal;
	font-variant: normal;
	text-transform: none;
	line-height: 1;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	font-weight: 900;
}

.ti-check:before {
	content: "\e64c";
}

.ti-close:before {
	content: "\e646";
}

.position-absolute {
	position: absolute;
}

.w--5 {
	width: 6.6%;
}


.left-2 {
	left: 2%;
}
</style>
</head>
<body>

	<table class="borderless font-calibri">
		<thead class="text-center">
			<tr>
				<th colspan="6"><img
					th:src="${logo}"
					alt="oriFood" class="position-absolute  left-2" style="width: 15%" />
					<h2 class="m-0" style="text-transform: uppercase"
						th:text="${allData[0].orgDiv}"></h2></th>
			</tr>
			<tr>
				<th class="fs-24p" colspan="4">BUS CHECKLIST</th>
				<th colspan="2" class="text-start" width="30%">MONTHLY: <span th:text="${allData[0].monthName}"></span></th>
			</tr>
			<tr class="border-0 h-pdf-next">
				<td colspan="6"></td>
			</tr>
		</thead>
		<tbody class="text-center h-pdf">
			<tr>
            <td >Parameters</td>
            <td colspan="2">Result</td>
            <td colspan="2">Remark</td>
          </tr>
          <tr  th:each="items: ${allData}">
			 <td style="text-align:left; padding: 5px;" th:text="${items.taskName}">Repeat Length</td>
			 <td colspan="2" th:text="${items.result}"></td>
            <td colspan="2" th:text="${items.remark}"></td>
            
		</tr>
		</tbody>
		<tbody>
			<tr class="border-0 h-pdf-xl text-center">
				<th colspan="3"></th>
				<th colspan="3" class="align-bottom">Signature</th>
			</tr>
		</tbody>
	</table>

</body>
</html>
