<!DOCTYPE html>
<html>
<head>
<title>List of First Aid Box</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
<style>
@page {
	size: A4 portrait;
	padding: 0;
	margin: 0;
}

table {
	width: 100%;
	font-family: sans-serif;
	border-collapse: collapse;
	border-spacing: 0;
	-fs-table-paginate: paginate;
}

.border, table, th, td, table.border, table.border th, table.border td {
	border: 1px solid;
}

table {
	page-break-inside: avoid;
}

table.borderless, .border table.border-0, .border table.border-0 th,
	.border table.border-0 td {
	border: 0;
}

.table-fixed {
	table-layout: fixed;
}

.m-0 {
	margin: 0;
}

.p-0 {
	padding: 0;
}

.align-middle {
	vertical-align: middle;
}

.text-center {
	text-align: center;
}

.text-start {
	text-align: left;
}

.text-end {
	text-align: right;
}

.text-nowrap {
	text-wrap: nowrap;
}

.align-top {
	vertical-align: top;
}

.align-bottom {
	vertical-align: bottom;
}

.border-0, .border-0 th, .border-0 td {
	border: 0;
}

.bordered .border-left-0 {
	border-left: 0;
}

.bordered .border-right-0 {
	border-right: 0;
}

.border-0 .border-top, .border-top, .border-top th, .border-top td {
	border-top: 1px solid;
}

.border-0 .border-left, .border-left, .border-left th, .border-left td,
	th.border-left {
	border-left: 1px solid;
}

.border-0 .border-right, .border-right, .border-right th, .border-right td,
	th.border-right {
	border-right: 1px solid;
}

.border-0 .border-bottom, .border-bottom, .border-bottom th,
	.border-bottom td {
	border-bottom: 1px solid;
}

.ps-1 {
	padding-left: 10px;
}

.ps-0_5 {
	padding-left: 5px;
}

.pt-1 {
	padding-top: 10px;
}

.p-0_5 {
	padding: 2.5px;
}

.p-1 {
	padding: 10px;
}

.p-2 {
	padding: 20px;
}

.px-3 {
	padding-left: 15px;
	padding-right: 15px;
}

.m-1 {
	margin: 5px;
}

.mt-2 {
	margin-top: 20px;
}

.fs-18p {
	font-size: 18px;
}

.fs-16p {
	font-size: 16px;
}

.fs-14p, td.fs-14p {
	font-size: 14px;
}

.fs-12p {
	font-size: 12px;
}

.fs-10p {
	font-size: 10px;
}

.fs-9p {
	font-size: 9px;
}

.fw-normal {
	font-weight: normal;
}

.fw-bold {
	font-weight: 700;
}

.fw-bolder {
	font-weight: 900;
}

.h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th {
	height: 60px;
}

.h-pdf, .h-pdf td, .h-pdf th {
	height: 24px;
}

.h-pdf-next, .h-pdf-next td, .h-pdf-next th {
	height: 10px;
}

.orif-logo {
	height: 35px;
	width: 120px;
	margin-left: 20px;
}

.br-left {
	border-left: 1px solid #000000 !important;
}

.br-right {
	border-right: 1px solid #000000 !important;
}

.br-top {
	border-top: 1px solid #000000 !important;
}

.br-bottom {
	border-bottom: 1px solid #000000 !important;
}
</style>
</head>
<body>
	<table class="borderless">
		<tbody class="border-0">

			<tr>
				<td class="p-1">
					<table class="border">
						<tr>
							<th width="20%"><img th:src="${logo}"
								class="text-center orif-logo"></img></th>
							<th width="55%" class="h-pdf-xl text-center"><span
								class="text-center" style="text-transform: uppercase"
								th:text="${allData[0].orgDiv}"></span> <br></br> <span
								class="text-center fs-12p" th:text="${allData[0].orgAddress}"></span>
							</th>
							<td class="text-end fs-12p align-top" width="25%">
								<table class="border-0 fs-12p">
									<tr>
										<td>Doc. No: OPL/HRD/REC-06</td>
									</tr>
									<tr>
										<td>Issue No./Date: 02/01.09.2014</td>
									</tr>
									<tr>
										<td>Rev. No./Date: 04/06.01.2023</td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
						</tr>
					</table> <!-- <table class="border-0 h-pdf-next"><tr><td>&nbsp;</td></tr></table> -->
				</td>
			</tr>
			<tr>
				<td class="p-1">
					<table class="border-0 fs-22p">
						<tr>

							<th class="text-center">List of First Aid Box With Location</th>

						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td class="p-1">
					<table class="fs-12p text-center border">
						<tr>
							<th width="5%">Sl No.</th>
							<th>Location</th>
							<th width="10%">Status</th>
							<th width="30%">Remark</th>
						</tr>
						<tr th:each="items: ${allData}">
							<td class="align-top" th:text="${items.slNo}"></td>
							<td class="text-start ps-0_5" th:text="${items.location}"></td>
							<td class="ps-0_5" th:text="${items.result}"></td>
							<td class="text-start ps-0_5" th:text="${items.remark}"></td>
						</tr>
						<!--  <tr><td class="align-top">2</td><td class="text-start ps-0_5">5 Mtr(Both EW and Wheel)</td></tr>
                  <tr><td class="align-top">3</td><td class="text-start ps-0_5">8 Mtr(Both EW and Wheel)</td></tr>
                  <tr><td class="align-top">4</td><td class="text-start ps-0_5">11 Mtr(Both EW and Wheel)</td></tr> -->

					</table>
				</td>
			</tr>
			<tr>
				<td><table class="border-0 h-pdf-next">
						<tr>
							<td>&nbsp;</td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<table class="border-0 fs-12p">
					<tr>
						<td width="70%" class="ps-0_5">&nbsp;</td>
						<td width="30%" class="ps-0_5">Signature:</td>
					</tr>
				</table>
				<!-- <table class="border-0 fs-12p">
					<tr>
						<th class="text-start p-1" width="50%">Machine Operator:</th>
						<th class="text-start p-1" width="50%">Maintenance-in-Charge:
						</th>
					</tr>
				</table> -->
			</tr>
		</tbody>
	</table>

</body>
</html>
