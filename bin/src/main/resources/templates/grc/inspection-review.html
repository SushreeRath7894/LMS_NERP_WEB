<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>

<style>
.innerstickybg {
	background: none;
}

#myReq .ag-row-selected {
	background: #0076ba !important;
	color: #fff;
	text-indent: 10px !important;
}

.blank_row {
	height: 10px !important; /* overwrites any other rules */
	background-color: #007bff;
}

#myReq .ag-row-selected::before {
	font-size: 8px;
	color: #FFF;
	content: '\e64c';
	font-family: 'themify';
	margin-right: 7px;
	position: relative;
	top: 3px;
	right: 4px;
}

.new-btn {
	width: 200px;
}

.grc-dwnld {
	background: #f31212;
	color: #FFF;
	border: none;
	outline: none;
	cursor: pointer;
	border-radius: 30px;
	padding: 4px 10px 4px 10px;
	text-decoration: none;
	font-family: roboto;
}
</style>

<script>
	//Multiple Document Upload Ends
	$(document).ready(function() {
		$('#new').attr('disabled', true);
		$('#delete').attr('disabled', true);

		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);

		var gridDiv2 = document.querySelector('#activity');
		new agGrid.Grid(gridDiv2, activityOptions);

		agGrid.simpleHttpRequest({
			url : "inspection-review-view"
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.inspectionSchedule;
			if (allData && allData.length > 0) {
				auditPlanId = allData[0].auditPlanId;
			}
			var len = allData.length;
			$('#totalRec1').find('span').html(len);
			gridOptions.api.setRowData(allData);

		 	var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0); 
			if (firstRowNode) {
				firstRowNode.setSelected(true); 
			}
			var id = selectedRows[0].scheduledId;
			viewdets(id); 
			//viewrecorddets(id);
		});

		var gridDiv = document.querySelector('#myGrid2');
		new agGrid.Grid(gridDiv, gridOptions2);
		$('#add').prop("disabled", true);
	});

	var columnDefs = [
			{
				headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : false,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true,
				pinned : 'left'
			},
			 {
		        headerName: 'Plan Id',
		        field: 'auditPlanId',
		        width: 130, 
		        cellStyle: {
		            textAlign: 'center'
		        }
		    }, 
		    {
		        headerName: 'Inspection Type',
		        field: "auditPlanType",
		        width:100,
		        hide:true
		    },
		    {
		        headerName: 'Inspection Name',
		        field: "auditCategory",
		        width:300
		    },
		    {
		        headerName: 'Inspector Name',
		        field: "auditorName",
		        width: 150 ,
		    }, {
				headerName : 'Result Status',
				field : "instanceUserSts",
				width: 150 ,
				cellStyle : {
					textAlign : 'center'
				},			cellRenderer : function(params) {
					if(parseInt(params.data.instanceUserSts)!=0){
						return '<div style="color:#0642f5">Updated</div>';
					}else{
						return '<div style="color:#a9a9a9">Not Been Updated</div>';
					}
					

				}
			} , {
				headerName : 'Review Status',
				field : "instanceAdminSts",
				width: 150 ,
				cellStyle : {
					textAlign : 'center'
				},			cellRenderer : function(params) {
					if (params.data.instanceAdminSts=="OKAY") {
						return '<div style="color:#0642f5">OKAY</div>';
					}else if(params.data.instanceAdminSts=="NOT OKAY"){
						return '<div style="color:red">NOT OKAY</div>';
					}else {
						return '<div style="color:#a9a9a9">Pending</div>';
					}
					

				}
			},{
		        headerName: 'Frequency',
		        field: "frequency",
		        width: 130,
		        cellStyle: {
		            textAlign: 'center'
		        },
		    },
		    {
		        headerName: 'Inspection Location',
		        field: "auditLocation",
		        width:160
		    },
		    {        
		    	headerName: 'Assign Date',
		        field: "assignDate",
		        width: 130 ,
		        cellStyle: {
		            textAlign: 'center'
		        },
		    },{
		        headerName: 'Status',
		        field: "scheduleStatus",
		        width: 150,
		        cellStyle: {
		            textAlign: 'center'
		        },
		        cellRenderer: function(params) {
		            var status = params.value === 1 ? 'Scheduled' : 'Unscheduled';
		            var style = params.value === 1 
		                ? 'color: #0642f5; padding: 5px; text-align: center;  #000000; font-size: 14px;' 
		                : 'color: #a9a9a9; padding: 5px; text-align: center;  0px 0px 0px #000000; font-size: 14px;';
		            return '<span style="' + style + '">' + status + '</span>';
		        }
		    }
		   
		];

	var rowdata1 = [];
	var gridOptions = {
		columnDefs : columnDefs,
		rowData : rowdata1,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 200,
			height : 20
		},
		rowSelection : 'single',
		onSelectionChanged : onSelectionChanged
	};

	var columnDefs2 = [
			{
				headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : true,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true,
				pinned : 'left'
			},
			{
				headerName : "Date",
				field : "date",
				pinned : 'left',
				cellRenderer : function(params) {
					return '<a id="scheduledId" onclick="viewScheduledAuditDetails(\''
							+ params.data.scheduleId
							+ '\', \''
							+ params.data.instanceId
							+ '\')" href="javascript:void(0)"><i class="bi bi-view-list"> '
							+ params.data.date + '</a>';
				}
			},
			{
				headerName : "Inspection Name",
				field : "category",
				width : 200,
				pinned : 'left'
			}, {
				headerName : "Inspector Name",
				field : "auditorName",
				width : 200,
			},
			{
				headerName : 'Upload Status',
				field : "userStatus",
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					if (parseInt(params.data.userStatus) != 0) {
						return '<div style="color:#0642f5">Updated</div>';
					} else {
						return '<div style="color:#a9a9a9">Not Been Updated</div>';
					}

				}
			},{
				headerName : 'Admin Status',
				field : "adminStatus",
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					if (params.data.adminStatus=="OKAY") {
						return '<div style="color:#0642f5">OKAY</div>';
					}else if(params.data.adminStatus=="NOT OKAY"){
						return '<div style="color:red">NOT OKAY</div>';
					}else {
						return '<div style="color:#a9a9a9">PENDING</div>';
					}

				}
			},
			{
				headerName : "Remarks",
				field : "remark",
				width : 250,
			},{
				headerName : "Report",
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					if (parseInt(params.data.userStatus) != 0){
						var s = "";
						s = ' <a href="#" class="grc-dwnld" onclick="reportDownload(\''
								+ params.data.planId
								+ '\',\''
								+ params.data.scheduleId
								+ '\',\''
								+ params.data.categoryId
								+ '\',\''
								+ params.data.instanceId
								+ '\')"><i class="ti ti-download"></i> Report </a>';
						return s;
					}else{
						return 'Pending';
					}
				
				},
			},
			{
				headerName : "Schedule ID",
				field : "scheduleId",
			},
			{
				headerName : "Plan ID",
				field : "planId",
			}  ];

	var rowdata2 = [];
	var gridOptions2 = {
		columnDefs : columnDefs2,
		rowData : rowdata2,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 150,
			height : 20
		},
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		onSelectionChanged : onSelectionChanged2
	};
	
	function reportDownload(planId,scheduledId,category,instanceId){
		
		console.log("category-->",category);
		
		window.open("/grc/inspection-review-pdf-download?planId="
				+ window.btoa(planId) + "&scheduledId=" + window.btoa(scheduledId)
				+ "&category=" + window.btoa(category)+ "&instanceId=" + window.btoa(instanceId), '_blank');
	}

	function viewdets(id) {
		agGrid.simpleHttpRequest({
			url : `inspection-review-instance-view?scheduledId=${id}`,
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.inspectionInstance;
			console.log("JSON:::", allData)
			
			gridOptions2.api.setRowData(allData);
			
			var len = allData.length;
			$('#totalRec2').find('span').html(len);
			
			onSelectionChanged2();
		});
	}

	function onSelectionChanged() {
		var selectedRows = gridOptions.api.getSelectedRows();
		selectedId = selectedRows[0].scheduledId;
		viewdets(selectedId);
	}

	function onSelectionChanged2() {
		var selectedRows = gridOptions2.api.getSelectedRows();
		var status= selectedRows.map(node => node.adminStatus);
		var ustatus= selectedRows.map(node => node.userStatus);
		console.log(selectedRows)
		var rowCount=0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			if(ustatus=="0"){
				$('#add').prop("disabled", true);
			}else{
				if(status=="PENDING"){
					$('#add').prop("disabled", false);
				}else{
					$('#add').prop("disabled", true);
				}	
			}
		} else {
		    $('#add').prop("disabled", true);
		}
	}

	var activityDefs = [
			/* {
				headerName : "Status",
				field : "status",
				width : 100,
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					if (params.data.status == 1) {
						return "Completed"
					} else {
						return "Not Completed"
					}
				}
			}, */
			{
				headerName : "Sl No.",
				field : "taskName",
				width : 100
			},
			{
				headerName : "Task Description",
				field : "description",
				width : 325
			},
			{
				headerName : "Task Priority",
				field : "taskPriority",
				cellStyle : {
					textAlign : 'center'
				},
				width : 120,
				hide: true
			},
			{
				headerName : "Task Type",
				field : "taskType",
				cellStyle : {
					textAlign : 'center'
				},
				width : 110,
				hide: true
			},
			{
				headerName : "Unit Of Measurement",
				field : "taskUom",
				cellStyle : {
					textAlign : 'center'
				},
				width : 110
			},
			{
				headerName : "Minimum Range",
				field : "minRange",
				cellStyle : {
					textAlign : 'center'
				},
				width : 110
			},
			{
				headerName : "Maximum Range",
				field : "maxRange",
				cellStyle : {
					textAlign : 'center'
				},
				width : 110
			},
			{
				headerName : "Result",
				field : "result",
				width : 110,
			}, {
				headerName : "Remarks",
				field : "remark",
				width : 375
			},
			{
				headerName : "View Image",
				field : "docUrl",
				width : 180,
				editable : false,
				cellRenderer : function(params) {
					if (params.data.docUrl != null
							&& params.data.docUrl != "null") {
						return '<a href="' + params.data.docUrl+'" target="_blank"><i class="bi bi-file-earmark-image">View</i></a>';
					} else {
						if (params.data.tempURL != null
								&& params.data.tempURL != "null") {
							return '<a href="' + params.data.tempURL+'" target="_blank"><i class="bi bi-file-earmark-image">View</i></a>';
						} else {
							return "Not Available";
						}
					}
				}
			}

	];

	var activityOptions = {
		columnDefs : activityDefs,
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 240,
			singleClickEdit : true,
			stopEditingWhenCellsLoseFocus : true,
		}
	};
	function toggleColumnVisibility(columnKey, show) {
	    var column = activityOptions.columnApi.getColumn(columnKey);
	    if (column) {
	    	activityOptions.columnApi.setColumnVisible(column, show);
	    }
	}
	function viewScheduledAuditDetails(scheduledId, auditInstId) {
		$
				.ajax({
					type : "GET",
					async : false,
					url : `inspection-review-getScheduledDetails?scheduledId=${scheduledId}&auditInstId=${auditInstId}`,
					success : function(response) {
						console.log(response);
						$('#scheduledDetailsModal').modal('show');
						var data = JSON.parse(response.body);
						var allData = data.scheduledDetails;

						//console.log("data-->", data)
						console.log("alldata-->", allData)
						if (allData[0].taskType == "Non Quantitative") {
						    toggleColumnVisibility('taskUom', false);
					        toggleColumnVisibility('minRange', false);
					        toggleColumnVisibility('maxRange', false);
						} else {
						    toggleColumnVisibility('maxRange', true);
					        toggleColumnVisibility('minRange', true);
					        toggleColumnVisibility('taskUom', true);
						}
						if (allData[0].instanceAdminSts == 1) {
							$('#SubmitBtn').attr('disabled', true);
						} else {
							$('#SubmitBtn').attr('disabled', false);
						}

						activityOptions.api.setRowData(allData);

					},
					error : function(e) {
						console.error("An error occurred:", e);
					}
				});
	}
	function openReordToReview() {
		var selectedRows = gridOptions2.api.getSelectedRows();
		var scheduledId = selectedRows[0].scheduleId;
		var instanceId = selectedRows[0].instanceId;
		var date = selectedRows[0].date;

		$("#auditScheduleSeqId").val(scheduledId);
		$("#hid_audit_instance_id").val(instanceId);
		$("#auditDate").val(date);
		
		$("#myModalSelected").modal("show");
	}
	function hideModal() {
		$("#myModalSelected").modal("hide");
		//window.location.href = "/grc/audit-review";
	}
	
	
	function getRowByScheduleId(scheduleId) {
	    const rowCount = gridOptions.api.getDisplayedRowCount();

	    for (let i = 0; i < rowCount; i++) {
	        const rowNode = gridOptions.api.getDisplayedRowAtIndex(i);
	        if (rowNode.data.scheduledId === scheduleId) {
	            return rowNode; 
	        }
	    }

	    return null;
	}
	
	
	 function UpdateTableData() {
		    var rowData = [];
		    var item={};
		    item.scheduledId = $("#auditScheduleSeqId").val();
		    item.instanceId = $("#hid_audit_instance_id").val();
		    item.remark = $("#auditRecordRemarks").val();
		    item.result = $("#auditRecordStatus").val();
		    
     		rowData.push(item);
     		
     		
     		var selectedRecord = gridOptions2.api.getSelectedRows();
     		
     		console.log("Selected rows --> ", selectedRecord);
     		
     		var scheduleId = selectedRecord[0].scheduleId;
     		console.log("scheduleId  --> ", scheduleId);

		    setTimeout(function() {
			    $.ajax({
			        url: 'inspection-review-submit',
			        type: 'POST',
			        contentType: 'application/json',
			        data: JSON.stringify(rowData),
			        success: function(response) {
			            if (response.code == "success") {
			                $("#messageParagraph").text(response.message);
			                $("#msgOkModal").removeClass("btn3").addClass("btn1");
			                $("#msgModal").modal('show');
			                agGrid.simpleHttpRequest({
			        			url : "inspection-review-view"
			        		}).then(function(data) {
			        			var jsonData = JSON.parse(data.body);
			        			var allData = jsonData.inspectionSchedule;
			        			if (allData && allData.length > 0) {
			        				auditPlanId = allData[0].auditPlanId;
			        			}
			        			var len = allData.length;
			        			$('#totalRec1').find('span').html(len);
			        			gridOptions.api.setRowData(allData);

			        			 var firstRowNode = getRowByScheduleId(scheduleId)
			        			if (firstRowNode) {
			        				firstRowNode.setSelected(true); 
			        			}
			        			var id = firstRowNode.data.scheduledId;
			        			
			        			viewdets(id);
			        			//viewrecorddets(id);
			        		});
			            } else {
			                $("#messageParagraph").text("Something Went Wrong");
			                $("#msgOkModal").removeClass("btn3").addClass("btn1");
			                $("#msgModal").modal('show');
			            }
			            $("#myModalSelected").modal("hide");
			        },
			        error: function(error) {
			            console.error('Save failed:', error);
			            $("#messageParagraph").text("Failed to save data. Please try again later.");
			            $("#msgOkModal").removeClass("btn3").addClass("btn1");
			            $("#msgModal").modal('show');
			        }
			    });
		    }, 500);
		    // AJAX request to send rowData to server

		}
	 
	 function schedulePlanCancel(){
		 $("#scheduledDetailsModal").modal('hide');
	 }
</script>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">

						<div class="" id="upperline">
							<div class="" id="upperOne">
								<div class="row">
									<div class="d-flex justify-content-between">
										<div class="col-md-4  btn-hs">
											<div class="font-design" id="totalRec1">
												Scheduled Audits (<span></span>)
											</div>
										</div>
										<div class="buttonsec btn-hs" id="ttbtn"></div>
									</div>
								</div>
								<div id="myGrid" style="width: 100%; height: 200px;"
									class="ag-theme-alpine mt-4"></div>
								<div style="width: 100%; height: 15px;" class="ag-theme-alpine"></div>
							</div>
						</div>

						<div class="" id="upperline">
							<div class="" id="upperOne">
								<div class="row">
									<div class="d-flex justify-content-between">
										<div class="col-md-4  btn-hs">
											<div class="font-design" id="totalRec2">
												Scheduled Records (<span></span>)
											</div>
										</div>
										<div class="buttonsec btn-hs" id="ttbtn">
											<button class="new-btn" id="add"
												onclick="openReordToReview()">Mark Record As
												Reviewed</button>
										</div>
									</div>
								</div>
								<div id="myGrid2" style="width: 100%; height: 300px;"
									class="ag-theme-alpine"></div>
								<div style="width: 100%; height: 15px;" class="ag-theme-alpine"></div>
							</div>
						</div>
					</div>
					<!-- SIDE BAR NAVIGATION STARTS -->
				</div>
				<!-- SIDE BAR NAVIGATION ENDS -->
				<!-- Open Modal on click to New Button-->
				<div class="modal fade" id="myModalSelected">
					<div class="modal-dialog modal-lg" style="margin-top: 150px;">
						<div class="modal-content">
							<!-- Modal body -->
							<div class="modal-body modal-bodyheight">
								<div class="row">
									<input type="hidden" id="hid_audit_instance_id">
									<div class="col-lg-6">
										<div class="form-group ">
											<label>Schedule ID</label> <input type="text"
												id="auditScheduleSeqId" class="form-control" readonly="true">
										</div>
									</div>
									<div class="col-lg-6">
										<div class="form-group ">
											<label>Date</label> <input type="text"
												id="auditDate" class="form-control" readonly="true">
										</div>
									</div>
									<div class="col-lg-6">
										<div class="form-group">
											<label>Remarks</label>
											<textarea class="adresscls" id="auditRecordRemarks"
												placeholder="Enter Remarks" onblur="removeValid(event)"></textarea>
										</div>
									</div>
									<div class="col-lg-6">
										<div class="form-group">
											<div class="autocomplete" style="width: 100%;">
												<label>Status</label>
												<div class="select">
													<select class="" id="auditRecordStatus">
														<option value="">Select</option>
														<option value="OKAY">OKAY</option>
														<option value="NOT OKAY">NOT OKAY</option>
													</select>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
							<!-- Modal footer -->
							<div class="modal-footer">
								<div align="right">
									<button class="cancel-btn" onclick="hideModal()">CANCEL</button>
									<button class="btn1" id="UpdateId" onclick="UpdateTableData()">UPDATE</button>
								</div>
							</div>
						</div>
					</div>
				</div>



				<div id="scheduledDetailsModal" class="modal fade" role="dialog">
					<div class="modal-dialog modal-xl">
						<div class="modal-content">
							<div class="modal-body p-0">
								<div id="main_content" class="mt-3">
									<div id="activity" style="width: 100%; height: 400px;"
										class="ag-theme-alpine"></div>
								</div>
							</div>
							<div class="modal-footer">
								<button type="button" class="new-btn" data-dismiss="modal"
									onclick="schedulePlanCancel()">Close</button>
							</div>
						</div>
					</div>
				</div>
				<!-- End Open Modal on click to New Button-->
			</div>
		</div>
	</div>
</body>
</html>
