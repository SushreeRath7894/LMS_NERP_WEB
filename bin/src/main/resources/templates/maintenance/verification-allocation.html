<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style type="text/css">
.highcharts-exporting-group {
	display: none;
}

.horizontal-timeline {
	width: 1170px;
}

.horizontal-timeline .items {
	border-top: 3px solid #e9ecef;
	margin-top: 40px;
	position: relative;
}

.horizontal-timeline .items .items-list {
	display: block;
	position: relative;
	text-align: center;
	padding-top: 70px;
	margin-right: 0;
}

.horizontal-timeline .items .items-list:before {
	content: "";
	position: absolute;
	height: 36px;
	border-right: 2px dashed #dee2e6;
	top: 0;
}

.horizontal-timeline .items .items-list .event-date {
	position: absolute;
	top: 36px;
	left: 0;
	right: 0;
	width: 75px;
	margin: 0 auto;
	font-size: 0.9rem;
	padding-top: 8px;
}

.fixTableHead {
	overflow-y: auto;
	height: 150px;
}

.fixTableHead thead th {
	background: #fff;
	position: sticky;
	top: 0;
}

@media ( min-width : 1140px) {
	.horizontal-timeline .items .items-list {
		display: inline-block;
		width: 15%;
		padding-top: 45px;
	}
	.horizontal-timeline .items .items-list .event-date {
		top: 15px;
	}
}

.card {
	border: none;
	border-radius: 10px
}

.c-details span {
	font-weight: 300;
	font-size: 13px
}

.icon {
	width: 50px;
	height: 50px;
	background-color: #eee;
	border-radius: 15px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 39px
}

.badge .bg-yellow {
	background-color: #fffbec;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #fed85d;
	justify-content: center;
	align-items: center;
	margin: 3px;
}

.badge .bg-blue {
	background-color: #D4F1F4;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #189AB4;
	justify-content: center;
	align-items: center;
	margin: 3px;
}

.badge .bg-purple {
	background-color: #D7A1F9;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #51087E;
	justify-content: center;
	align-items: center;
	margin: 3px;
}

.badge .bg-red {
	background-color: #FF8A8A;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #750000;
	justify-content: center;
	align-items: center;
	margin: 3px;
}

.badge .bg-green {
	background-color: #B1D8B7;
	width: 82px;
	height: 25px;
	padding-bottom: 3px;
	border-radius: 5px;
	display: flex;
	color: #2F5233;
	justify-content: center;
	align-items: center;
	margin: 3px;
}

.progress {
	height: 10px;
	border-radius: 10px
}

.progress div {
	background-color: red
}

.text1 {
	font-size: 14px;
	font-weight: 600
}

.text2 {
	color: #a5aec0
}

.scrollbar {
	width: 1170px;
	overflow-x: scroll;
	position: relative;
}
</style>

<script type="text/javascript">

	$(document).ready(function() {
		$('.loader').show();
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		gridOptions.api.setRowData();
		agGrid.simpleHttpRequest({
			url : 'verification-allocation-view'
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData=jsonData.Asset;
			var len = allData.length;
			$('#totalAsset').find('span').html(len);
			gridOptions.api.setRowData(allData);
		});
		$('.loader').hide();
		$('#deleteChild').attr('disabled', true);
		$("#emplist").hide();
    	$("#loclist").hide();
    	$("#assigndate").hide();
    	$("#assignfrequency").hide();
    	$('#allocateBtn').attr('disabled', true);
		$('#reqDltBtn').attr("disabled", true);
		$('.collapse').on('show.bs.collapse', function() {
			$(this).siblings('.panel-heading').addClass('active');
		});

		$('.collapse').on('hide.bs.collapse', function() {
			$(this).siblings('.panel-heading').removeClass('active');
		});
		$("#newBtn").click(function() {

		})
		
		
		
		  $('input[name="options"]').on('change', function() {
			    var selectedValue = $('input[name="options"]:checked').val();
			    if(selectedValue=="in-house"){
			    	$("#emplist").show();
			    	$("#loclist").hide();
			    	$("#assetlocation").val("");
			    	$("#assigndate").show();
			    	$("#assignfrequency").show();
			    }else if(selectedValue=="vendor"){
			    	$("#emplist").hide();
			    	$("#loclist").show();
			    	$("#assetemployee").val("");
			    	$("#assigndate").show();
			    	$("#assignfrequency").show();
			    }
			  });
		
		var dateFormat = localStorage.getItem("dateFormat");
		$("#DateCalendarAssign").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#asdate').val($(this).val());
		})

		$('#asdate').blur(function() {
			$("#DateCalendarAssign").val($(this).val());
		})

  
	});
	
	
	
	/* -------------------search bar for mygrid------------------------ */

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalAsset').find('span').html(totalRowCount);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}
	var columnDefs = [
		{
			headerCheckboxSelection : false,
			headerCheckboxSelectionFilteredOnly : false,
			checkboxSelection : true,
			width : 10,
			sortable : false,
			filter : false,
			pinned : 'left',
			resizable : true

		},
		{
			headerName : 'Asset ID',
			field : "assetId",
			pinned : 'left'

		},		{
			headerName : 'Asset Name',
			field : "assetname",

		},{
			headerName : 'Asset Type',
			field : "assettype",

		},{
			headerName : 'Asset Category',
			field : "assetcat",

		},{
			headerName : 'Asset Subcategory',
			field : "assetsubcat",

		}, {
			headerName : 'Verify Allot Status',
			field : "allotstatus",
			cellStyle : {
				textAlign : 'center'
			},cellRenderer : function(params) {
				if(params.data.allotstatus=="Alloted"){
					return '<div style="color:#0642f5">Alloted</div>';
				}else{
					return '<div style="color:#a9a9a9">Pending</div>';
				}
				

			}
		},{
			headerName : 'Alloted To',
			field : "allotTo",

		}, {
			headerName : 'Verify Status',
			field : "verifystatus",
			cellStyle : {
				textAlign : 'center'
			},cellRenderer : function(params) {
				if(params.data.verifystatus=="Matched"){
					return '<div style="color:#0642f5">Matched</div>';
				}else if(params.data.verifystatus=="Mismatched"){
					return '<div style="color:#0642f5">Mismatched</div>';
				}else{
					return '<div style="color:#a9a9a9">Pending</div>';
				}
				

			}
		}];

// let the grid know which columns and what data to use
var gridOptions = {
	columnDefs : columnDefs,
	rowSelection : 'single',
	groupSelectsChildren : true,
	suppressRowClickSelection : true,
	suppressAggFuncInHeader : true,
	defaultColDef : {
		sortable : true,
		filter : true,
		resizable : true,
		width : 150
	},
	onSelectionChanged : onSelectionChanged,
};
//function for row select parents
var id = "";
var apstatus = "";
function onSelectionChanged() {
	var selectedNodes = gridOptions.api.getSelectedNodes();
	 var selectedData = selectedNodes.map(node => node.data);
	 id= selectedData.map(node => node.assignId);
	 apstatus=selectedData.map(node => node.assignsts);
	 allotstatus=selectedData.map(node => node.allotstatus);
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});
	if(rowCount>0){
		if(allotstatus[0]=="Alloted"){
			$('#allocateBtn').attr('disabled', true);
			$('#reqDltBtn').attr("disabled", false);
		}else{
			$('#allocateBtn').attr('disabled', false);
			$('#reqDltBtn').attr("disabled", true);
		}
	}else{
		$('#allocateBtn').attr('disabled', true);
		$('#reqDltBtn').attr("disabled", true);
	}
	

}

	function downloadDetails() { 
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			dataset.push(rowNode.data);
		});
	    gridOptions.api.exportDataAsCsv(dataset);
	}
	
	function allocatePolicy() {
		$('#assignmodal').modal('show');
		$('.formValidation').remove();
		$("#emplist").hide();
		$("#loclist").hide();
		$("#assigndate").hide();
		$("#assignfrequency").hide();
		$("#assetemployee").val("");
		$("#asdate").val("");
		$('input:radio[name="options"]').prop('checked', false);
	}
	
	function closeOnclick(){
		$('#assignmodal').modal('hide');
		$('#delete').modal('hide');
	}
	
	function assignOnclick() {
		var selectedNodes = gridOptions.api.getSelectedNodes();
		var selectedData = selectedNodes.map(node => node.data);
		var assetid= selectedData.map(node => node.assetId);
		var valid=true;
		 var selectedValue = $('input[name="options"]:checked').val();
		 if (!selectedValue) {
		        // If no radio button is selected, show validation message and return early
		        $("#alert").modal('show');
		        document.getElementById("textId").innerHTML = "Please check the radio button first!";
		        return;
		    }
	    if(selectedValue=="in-house"){
	    	var assigndate=$("#asdate").val();
	    	var assetemp=$("#assetemployee").val();
	    	var assetfrequency=$("#frequency").val();
	    	if (assetemp == null || assetemp == "") {
	    		valid = validationUpdated("Employee is Required", "assetemployee");
	    	 }
	    	if (assigndate == null || assigndate == "") {
	    		valid = validationUpdated("Date is Required", "asdate");
	    	 }
	    	if (assetfrequency == null || assetfrequency == "") {
	    		valid = validationUpdated("Frequency is Required", "frequency");
	    	 }
	    	
	    }else{
	    	valid=false;
	    	
	    }
	   
			if (valid) {
				console.log("asset-maintenance-allocate?assetid="+ assetid[0]+"&assetemp="+assetemp+"&assigndate="+assigndate+"&frequency="+assetfrequency)
					$.ajax({
			type : "POST",
			url : "verification-allocation-allocate?assetid="+ assetid[0]+"&assetemp="+assetemp+"&assigndate="+assigndate+"&frequency="+assetfrequency,
			success : function(response) {
			 if (response.code == "success") {
				 	$('#assignmodal').modal('hide');
					$("#assignsuccessModal").modal('show');
					$("#messageParagraph").text("Verification Assigned Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					agGrid.simpleHttpRequest({
						url : 'verification-allocation-view'
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						var allData=jsonData.Asset;
						var len = allData.length;
						$('#totalAsset').find('span').html(len);
						gridOptions.api.setRowData(allData);
					});
					onSelectionChanged();
					$('#allocateBtn').attr('disabled', true);
				} else {
					$("#messageParagraph").text("Something went to wrong!");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			},
			error : function(data) {
				console.log(data)
			}
		})
			} else {
				$("#alert").modal('show');
				document.getElementById("textId").innerHTML = "Please Fill The Required Info !";
			}

	}
	
	function deleteFun() {
		$('#delete').modal('show');
	}
	
	function deleteOnclick() {
		var selectedNodes = gridOptions.api.getSelectedNodes();
		var selectedData = selectedNodes.map(node => node.data);
		var assetid= selectedData.map(node => node.assetId);
		if (assetid[0]) {
				$.ajax({
		type : "POST",
		url : "verification-allocation-deallocate?id="+ assetid[0],
		success : function(response) {
		 if (response.code == "success") {
			 closeOnclick();
				$("#messageParagraph").text("Verification deallocated sucessfully");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('#delete').modal('hide');
				agGrid.simpleHttpRequest({
					url : 'verification-allocation-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.Asset;
					var len = allData.length;
					$('#totalAsset').find('span').html(len);
					gridOptions.api.setRowData(allData);
				});
				onSelectionChanged();
			} else {
				$("#messageParagraph").text("Something went to wrong!");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}
		},
		error : function(data) {
			console.log(data)
		}
	})
		} else {
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
		}

}

</script>

</head>
<body>

	<div layout:fragment="content" class="maincontent">

		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">

						<div class="d-flex justify-content-between" id="MainDiv">
							<div class="btn-hs" id="totalAsset">
								<div class="font-design">
									Asset Details(<span></span>)
								</div>
							</div>
							<div id="searchRowDiv">
								<div class="input-style">
									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput" onkeyup="cancelBar()"
										oninput="onQuickFilterChanged()" id="quickFilter"
										autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey"
											onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalAsset').find('span').html(gridOptions.api.getModel().getRowCount());"
											class="close_i"><i class="ti-close srchicon"></i></span></a><a
											href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
									</div>
								</div>
							</div>
							<div class="buttonsec btn-hs" id="ttbtn">
								<button class="download-btn" id="download"
									onclick="downloadDetails()">DOWNLOAD</button>
								<button class="delete-btn" id="reqDltBtn" onclick="deleteFun()">DEALLOCATE</button>
								<button class="new-btn" id="allocateBtn" data-toggle="modal"
									onclick="allocatePolicy()">ALLOCATE</button>
							</div>
						</div>

						<input type="hidden" id="sessionId" th:value="${userId}" /> <input
							type="hidden" id="sessionName" th:value="${userName}" /> <input
							type="hidden" id="hrRole" th:value="${hrRole}" /> <input
							type="hidden" id="sessionRole" th:value="${userRole}" /> <input
							type="hidden" id="adRole" th:value="${adRole}" />
						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>



						<div class="modal fade" id="assignmodal" tabindex="-1"
							role="dialog" aria-labelledby="exampleModalCenterTitle"
							aria-hidden="true">
							<div class="modal-dialog modal-dialog-centered" role="document">
								<div class="modal-content">
									<div class="modal-header">
										<h5 class="modal-title" id="exampleModalLongTitle">Asset
											Verification Allocation</h5>

									</div>
									<div class="modal-body">




										<!-- form radio buttons example -->
										<label>Assigning To</label>
										<form class="form">
											<div class="btn-group btn-toggle">
												<label class="btn btn-light "> <input name="options"
													value="in-house" type="radio"> In House
												</label>
												<!-- <label class="btn btn-light"> <input name="options"
													value="vendor" type="radio"> Vendor
												</label> -->
											</div>
										</form>
										<br>

										<div class="col-md-12 row">
											<div class="col-md-12" id="emplist">
												<div class="form-group">
													<label> Employee List </label>
													<div class="select">
														<select id="assetemployee">
															<option value="">Select</option>
															<option th:each="c:${empLists}" th:value='${c.key}'
																th:text="${c.name}"></option>
														</select> <span class="focus"></span>
													</div>
												</div>
											</div>

											<div class="col-md-8" id="loclist">
												<div class="form-group">
													<label> Party List </label>
													<div class="select">
														<select id="assetlocation">
															<option value="">Select</option>
															<option th:each="c:${locLists}" th:value='${c.key}'
																th:text="${c.name}"></option>
														</select> <span class="focus"></span>
													</div>
												</div>
											</div>
											<div class="col-lg-6" id="assigndate">
												<div class="form-group calendar_box">
													<label>Assigning From</label> <input type="text"
														id="asdate" class="form-control"
														onblur="removeValid(event)"
														th:attr="onkeyup=|formatDate('date','${session.DATEFORMAT_JS}')|"
														readonly> <i class="ti-calendar picker_calendar"
														id="DateCalendarAssign"></i>
												</div>
											</div>
											<div class="col-md-6" id="assignfrequency">
												<div class="form-group">
													<label> Frequency </label>
													<div class="select">
														<select id="frequency">
															<option value="">Select</option>
															<option value="Yearly">Yearly</option>
															<option value="Half-Yearly">Half-Yearly</option>
															<option value="Quarterly">Quarterly</option>
															<option value="Monthly">Monthly</option>
															<option value="Half-Monthly">Half-Monthly</option>
															<option value="Weekly">Weekly</option>
															<option value="Daily">Daily</option>
														</select> <span class="focus"></span>
													</div>
												</div>
											</div>
										</div>
										<p class="mt-2" style="font-size: 12px;">This will
											allocate the asset to the chosen employee for the
											verification on the basis of Location,Working Condition and
											Authorization</p>
									</div>
									<div class="modal-footer">
										<button type="button" class="btn download-btn"
											onclick="closeOnclick();">Close</button>
										<button type="button" class="new-btn"
											onclick="assignOnclick();">Allocate</button>
									</div>
								</div>
							</div>
						</div>

						<div id="delete" class="modal fade show" aria-modal="true">
							<div class="modal-dialog modal-confirm">
								<div class="modal-content">
									<div class="modal-header flex-column"></div>
									<div class="modal-body">
										<p>Do you really want to delete these data? This process
											cannot be undone.</p>
									</div>
									<div class="modal-footer justify-content-center"
										style="margin-top: 0px;">

										<button type="button" class="cancel-btn"
											data-bs-dismiss="modal" onclick="cancelModalBtn();">Cancel</button>
										<button type="button" class="delete-btn"
											onclick="deleteOnclick()">Deallocate</button>
									</div>
								</div>
							</div>
						</div>
						<div id="alert" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column">
								<button type="button" class="close" data-bs-dismiss="modal"
									aria-hidden="true" onclick="cancelModalBtn()">
									<i class="ti-close modal-close"></i>
								</button>
							</div>
							<div class="modal-body">
								<p id="textId"></p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="btn1" data-bs-dismiss="modal">OKAY</button>

							</div>
						</div>
					</div>
				</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
