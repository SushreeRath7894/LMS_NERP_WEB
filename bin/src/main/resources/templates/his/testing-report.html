function activateGrid() {
    console.log("Select button clicked");  // Debug message
    var selectedGroups = [];
    
    // Get all selected checkboxes
    var checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
    checkboxes.forEach(function (checkbox) {
        selectedGroups.push(checkbox.value); // Collect selected group names
    });

    if (selectedGroups.length > 0) {

        document.getElementById('secondGrid').style.display = 'block';
        $('#generatePdf').show();
        // Filter static rowData based on selected groups and labType
        var filteredData = rowData2.filter(function (row) {
        	 console.log(selectedGroups.includes(row.grpName) && row.type === labType)
            return selectedGroups.includes(row.grpName) && row.type === labType;
           
        });

        console.log("Filtered Data:", filteredData);

        // Set the filtered data into the grid
        if (gridOptions2.api) {
            gridOptions2.api.setRowData(filteredData);
        } else {
            console.error("Grid API is not initialized.");

    } else {
        console.log("No groups selected");  // Message if no groups are selected

}

var id = labType;

function deleteTestResult() {
    // Get the selected rows
    const selectedRows = gridOptions2.api.getSelectedRows();
    console.log(selectedRows);

    if (selectedRows.length === 0) {
        alert("No rows selected for deletion.");
        return;
    }

    // Get the current row data
    var allRowData = [];
    gridOptions2.api.forEachNode(function (node) {
        allRowData.push(node.data);
    });

    // Remove selected rows from the data
    var updatedRowData = allRowData.filter(function (row) {
        // If the row is NOT in the selected rows, keep it
        return !selectedRows.includes(row);
    });

    // Update the grid with the new data after deletion
    gridOptions2.api.setRowData(updatedRowData);

    // Optionally show a confirmation message
    alert("Selected rows deleted successfully!");
}
