<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="his-inner-patient-regs">
<head>
  <meta charset="UTF-8">
  <script type="text/javascript" src="../javaScript/his/his-billing-2.js"></script>

  <script>
    $(()=>{
      $('#extPat').select2();  //#extPat
      $('#gender').select2();  //#gender
      $('#country').select2();  //#country
      $('#states').select2();  //#states
      $('#dist').select2();  //#dist
      $('#cityId').select2();  //#cityId
      $('#testName').select2();  //#testName
    });

    $(document).ready(() => {
      document.getElementById("existingPatientCheckbox").addEventListener("change", function () {
        let dropdown = document.getElementById("extPatDiv");
        dropdown.style.display = this.checked ? "block" : "none";
        if (!this.checked) {
          $("#extPat").val('').trigger('change');
          addAppoint();
          enableAllFields()
        } else {
          addAppoint()
          disableAllFields()
        }
      });

      getPayModeListAjax();

      $('#extPat').select2({
        placeholder: "Select",
        allowClear: true
      });
      $('#testName').select2({
        placeholder: "Select",
        allowClear: true
      });

      var gridDiv = document.querySelector('#testGridGrid');
      new agGrid.Grid(gridDiv, gridOptionsTest);

      gridOptionsTest.api.setRowData([])

      cancelTest()
    })
    
    function backToBasic() {
    	var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0); // Get the first row node
        if (firstRowNode) {
            firstRowNode.setSelected(true);
        }
    }
    
    let globalPayModeList = [];
function getPayModeListAjax() {

    agGrid.simpleHttpRequest({
        url: 'his-billing-pharmacy-get-paymode-list'
    }).then(function(data) {
    	if(data.code === 'success') {
    		globalPayModeList = data.body;
    	} else {
    		globalPayModeList = []
    	}
    	paymentDetails();
    })
}

    var columnDefs2 = [{
      headerCheckboxSelection: false,
      headerCheckboxSelectionFilteredOnly: true,
      checkboxSelection: true,
      width: 8,
      sortable: false,
      filter: false,
      resizable: true,
      pinned: 'left',
    },
      {
        headerName: "Test Name",
        field: "name",
      },
      {
        headerName: "Test Category",
        field: "data",
      }
    ];

    var gridOptionsTest = {
      columnDefs: columnDefs2,
      rowSelection: 'single',
      suppressRowClickSelection: true,
      defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        flex: 1
      },
      onSelectionChanged: rowSelect2
    };

    function rowSelect2() {
      var selectedRows = gridOptionsTest.api.getSelectedRows();
      if (selectedRows && selectedRows.length > 0) {
        $(".br-dis-tst").attr("disabled", false);
      } else {
        $(".br-dis-tst").attr("disabled", true);
      }
    }

    function addTest() {
      $(".br-m-btn-tst").hide();
      $(".br-s-btn-tst").show();

      $("#testCategory,#testCategoryId").val('');
      $("#testName").val('').trigger('change');
    }

    function cancelTest() {
      $(".br-m-btn-tst").show();
      $(".br-s-btn-tst").hide();

      $("#testCategory,#testCategoryId").val('');
      $("#testName").val('').trigger('change');
    }

    function addAppoint() {
      getStates = '';
      $('#patientId,#fullName,#age,#mobNo,#altMobNo,#email,#gender,#country,#states,#dist,#cityId,#address,#zipCode').val('').trigger('change');
      gridOptionsTest.api.setRowData([])
      $("#states").empty();
      $("#states").append("<option value=''>Select</option>");
      $("#dist").empty();
      $("#dist").append("<option value=''>Select</option>");
      $("#cityId").empty();
      $("#cityId").append("<option value=''>Select</option>");

    }

    function disableAllFields() {
      $('#patientId,#fullName,#age,#mobNo,#altMobNo,#email,#gender,#country,#states,#dist,#cityId,#address,#zipCode').attr('disabled', true)
    }

    function enableAllFields() {
      $('#patientId,#fullName,#age,#mobNo,#altMobNo,#email,#gender,#country,#states,#dist,#cityId,#address,#zipCode').attr('disabled', false)
    }

    function newPatient() {
    	$("#bookAppBtn1").addClass("d-none");
      addAppoint();
      enableAllFields();
      $('.patDiv').show();
      $("#resetAppBtn,#saveNewPatBtn,.tst").show();
      $('.pay-tab,.report-tab').hide();
      $("#extPatDiv").hide()
      $("#extPat").val('').trigger('change');
      document.getElementById("existingPatientCheckbox").checked = false;
      $('.br-s-btn-tst,#proceedPayBtn').hide()
    }

    let getStates = '';

    function getPatientDetailsById(selectedValue, value = null) {
      if (selectedValue) {
        $.ajax({
          type: "GET",
          url: "/lookup/lookups-getPatientDetailsById?id=" + selectedValue,
          success: function (response) {
            if (response.code == "success") {
              var jsonData = JSON.parse(response.body);
              if (jsonData != null) {
                $("#country").val(jsonData[0].country).trigger('change');
                getStates = jsonData[0].state;
                getStateDetails(jsonData[0].state);
                $("#patientId").val(jsonData[0].patientId);
                $("#fullName").val(jsonData[0].patientName);
                $("#age").val(jsonData[0].age);
                $("#mobNo").val(jsonData[0].mob);
                $("#altMobNo").val(jsonData[0].altMob);
                $("#gender").val(jsonData[0].gender).trigger('change');
                getStateDetails(jsonData[0].state, jsonData[0].dist, jsonData[0].city);
                $("#zipCode").val(jsonData[0].zip);
                $("#address").val(jsonData[0].address);

              }

            }
          },
          error: function (e) {
          }
        });
      } else {
        addAppoint()
      }
    }

    function getStateDetails(id, distId = '', cityId = '') {

      var cname = $('#country').val();

      $("#states").empty();
      $("#states").append("<option value=''>Select</option>");
      $("#dist").empty();
      $("#dist").append("<option value=''>Select</option>");
      $("#cityId").empty();
      $("#cityId").append("<option value=''>Select</option>");

      if (cname) {

        $.ajax({
          type: "GET",
          url: "/lookup/lookups-stateList?id=" + cname,
          success: function (response) {
            if (response.message == "success") {
              for (var i = 0; i < response.body.length; i++) {
                var option = $("<option></option>");
                $(option).val(response.body[i].key);
                $(option).html(response.body[i].name);
                $("#states").append(option);
              }
              if (id == "0") {

              } else {
                $("#states").val(id);
                getDistrictDetails(distId, cityId)
              }
            }
          },
          error: function (e) {
          }
        });
      }
    }

    //OnChange district
    function getDistrictDetails(id, cityId = '') {

      let state = '';
      if ($('#states').val() == "" || $('#states').val() == null) {
        state = getStates;
      } else {
        state = $('#states').val();
      }

      $("#dist").empty();
      $("#dist").append("<option value=''>Select</option>");
      $("#cityId").empty();
      $("#cityId").append("<option value=''>Select</option>");

      if (state) {
        $.ajax({
          type: "GET",
          url: "/lookup/lookups-districtList?id=" + state,
          success: function (response) {
            if (response.message == "success") {
              for (var i = 0; i < response.body.length; i++) {
                var option = $("<option></option>");
                $(option).val(response.body[i].key);
                $(option).html(response.body[i].name);
                $("#dist").append(option);
              }
              if (id == "0") {

              } else {
                $("#dist").val(id);
                getCityDetails(cityId);
              }
            }
          },
          error: function (e) {
          }
        });
      }
    }

    function getCityDetails(cityId) {

      let dist = $('#dist').val();

      $("#cityId").empty();
      $("#cityId").append("<option value=''>Select</option>");

      if (dist) {
        $.ajax({
          type: "GET",
          url: "/lookup/lookups-cityList?id=" + dist,
          success: function (response) {
            if (response.message == "success") {
              for (var i = 0; i < response.body.length; i++) {
                var option = $("<option></option>");
                $(option).val(response.body[i].key);
                $(option).html(response.body[i].name);
                $("#cityId").append(option);
              }
              if (cityId) {
                $("#cityId").val(cityId);
              }
            }
          },
          error: function (e) {
          }
        });
      }
    }

    function getTestList(type) {

      $("#testName").empty();
      $("#testName").append("<option value=''>Select</option>");

      $.ajax({
        type: "GET",
        url: "/lookup/lookups-testLists?type=" + type,
        success: function (response) {
          if (response.code == "success") {
            let data = JSON.parse(response.body)
            data = data.sort((a, b) => a.test_name.localeCompare(b.test_name));
            for (var i = 0; i < data.length; i++) {
              var option = $("<option></option>");
              $(option).val(data[i].test_id);
              $(option).html(data[i].test_name);
              $(option).attr('data-grp-id', data[i].group_id);
              $(option).attr('data-grp-name', data[i].group_name);
              $("#testName").append(option);
            }
          }
        },
        error: function (e) {
        }
      });
    }

    function setTestCategory() {
      let groupId = $("#testName option:selected").attr('data-grp-id');
      let groupName = $("#testName option:selected").attr('data-grp-name');

      $("#testCategory").val(groupName)
      $("#testCategoryId").val(groupId)
    }

    function saveTest() {
      let rowData = [];
      gridOptionsTest.api.forEachNode((node) => {
        rowData.push(node.data);
      });

      let testId = $("#testName").val();

      if (testId == null || testId == '') {
        toastr.error("Select test");
        return;
      }

      let selectedData = rowData?.filter(a => a.key == testId);

      if (selectedData && selectedData.length > 0) {
        toastr.error("This test is already added");
        $("#testCategory,#testCategoryId").val('');
        $("#testName").val('').trigger('change');
        return;
      }

      let testName = $("#testName option:selected").text();

      let obj = {};

      obj.key = testId;
      obj.name = testName;
      obj.code = $("#testCategoryId").val()
      obj.data = $("#testCategory").val()

      rowData.push(obj)

      gridOptionsTest.api.setRowData(rowData);
      cancelTest();

    }

    function deleteTest() {
      Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
      }).then((result) => {
        if (result?.value) {
          var selectedNodes = gridOptionsTest.api.getSelectedNodes();
          var selectedData = selectedNodes.map(node => node.data);

          let rowData = [];
          gridOptionsTest.api.forEachNode((node) => {
            rowData.push(node.data);
          });

          let result = rowData.filter(item1 => !selectedData.some(item2 => item1.key === item2.key));

          if (result.length == 0) {
            $(".br-dis-tst").attr("disabled", true);
          }

          gridOptionsTest.api.setRowData(result)

        }
      })
    }

    function savePatientWithTest() {

      let patientId = $("#patientId").val();
      let fullName = $("#fullName").val();
      let age = $("#age").val();
      let mobNo = $("#mobNo").val();
      let altMobNo = $("#altMobNo").val();
      let email = $("#email").val();
      let gender = $("#gender").val();
      let country = $("#country").val();
      let state = $("#states").val();
      let dist = $("#dist").val();
      let city = $("#cityId").val();
      let address = $("#address").val();
      let zipCode = $("#zipCode").val();

      if (fullName == null || fullName == '') {
        toastr.error("Full Name Required");
        return;
      }
      if (age == null || age == '') {
        toastr.error("Age Required");
        return;
      }
      if (mobNo == null || mobNo == '') {
        toastr.error("Mobile Number Required");
        return;
      }
      
      let validMobData = mobVal1();
      if(!validMobData) {
    	  toastr.error("Enter Valid Mobile Number");
    	  return false;
      }
      
      if (gender == null || gender == '') {
        toastr.error("Gender Required");
        return;
      }
      /* if (country == null || country == '') {
        toastr.error("Country required");
        return;
      }
      if (state == null || state == '') {
        toastr.error("State required");
        return;
      }
      if (dist == null || dist == '') {
        toastr.error("District required");
        return;
      }
      if (city == null || city == '') {
        toastr.error("City required");
        return;
      }
      if (address == null || address == '') {
        toastr.error("Address required");
        return;
      }
      if (zipCode == null || zipCode == '') {
        toastr.error("Pincode required");
        return;
      } 
      
      let validPinCodeData = mobVal4();
      if(!validPinCodeData) {
    	  toastr.error("Enter Valid Pin Code");
    	  return false;
      }
      */

      let testList = [];
      gridOptionsTest.api.forEachNode((node) => {
        testList.push(node.data);
      });

      if (testList.length == 0) {
        toastr.error("You Have To Add Atleast One Test")
        return;
      }

      let obj = {type, patientId, fullName, age, mobNo, altMobNo, email, gender, country, state, dist, city, address, zipCode, testList};

      $('.loader').show();
      $("body").addClass("overlay");

      $.ajax({
        type: "POST",
        url: "patient-registration-with-test-list",
        contentType: "application/json",
        data: JSON.stringify(obj),
        success: function (response) {
          if (response.code == "success") {

            let test_id = '';

            if (response.body && response.body.length > 0) {
              test_id = response.body[0];
            }

            getAllPatientsDetails(test_id);

            $('.loader').hide();
            $("body").removeClass("overlay");
            toastr.success('Patient registered successfully');

          } else {
            $('.loader').hide();
            $("body").removeClass("overlay");
          }

        },
        error: function (datas) {
          console.log(datas)
          $('.loader').hide();
          $("body").removeClass("overlay");
        }
      })

    }

    function getPatientAndTestDetails(id) {

      addAppoint();

      $.ajax({
        type: "GET",
        url: "patient-details-with-test-list?id=" + id + "&type=" + type,
        success: function (response) {
          if (response.code == "success") {
            let d = JSON.parse(response.body)

            console.log(d)

            $("#fullName").val(d?.fullName);
            $("#age").val(d?.age);
            $("#mobNo").val(d?.mobNo);
            $("#altMobNo").val(d?.altMob);
            $("#gender").val(d?.genderId).trigger('change');
            $("#email").val(d?.email);
            $("#country").val(d?.countryId).trigger('change');
            $("#address").val(d?.address);
            $("#zipCode").val(d?.zipcode);

            getStateDetails(d?.stateId, d?.distId, d?.cityId);

            if (d?.testList) {
              gridOptionsTest.api.setRowData(JSON.parse(d?.testList))
            }

            getPaymenDetails(id);
          }
        },
        error: function (e) {
        }
      });
    }

    function proceedForPayment() {
      let selectedRows = gridOptions.api.getSelectedRows();

      if (selectedRows && selectedRows.length > 0) {
    	  
    	let pfrom = selectedRows[0].pfrom;
    	  
        let testId = selectedRows[0].test_id;

        let obj = {key: testId, name: pfrom, id: selectedRows[0].book_id}

        $('.loader').show();
        $("body").addClass("overlay");

        $.ajax({
          type: "POST",
          url: "payment-proceed-by-test-id",
          contentType: "application/json",
          data: JSON.stringify(obj),
          success: function (response) {
            if (response.code == "success") {
            	if(pfrom === 'IPD') {
            		getAllPatientsDetails();
            		toastr.success('Payment added to bed successfully');
            	} else {
            		$('.pay-tab').show()
                    nextTab('paymentDetailLi')
                    getPaymenDetails(testId);
            		toastr.success('Payment proceeded successfully');
            	}
              

              $('.loader').hide();
              $("body").removeClass("overlay");
              

            } else {
              $('.loader').hide();
              $("body").removeClass("overlay");
            }

          },
          error: function (datas) {
            console.log(datas)
            $('.loader').hide();
            $("body").removeClass("overlay");
          }
        })
      }
    }

    function nextTab(id) {
      const tabElement = document.querySelector('#' + id + ' a');
      const tab = new bootstrap.Tab(tabElement);
      tab.show();
    }

    function bookAppointment() {
      gridOptions.api.deselectAll()
    }
    
    function billingPrevious(){
    	nextTab('registrationTabLi')
    }
  </script>
</head>

	<div class="d-flex flex-column h-100 gap-2">
		<div
    <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
      <div class="project-name flex-1">
        <span class="head-user-name" id="pName"></span>
      </div>
      <div class="d-flex justify-content-end w-100 gap-2 flex-wrap flex-1">
        <button id="saveNewPatBtn" class="btn m-0 edit-btn bk-app" onclick="savePatientWithTest()" type="button">Save</button>
        <button id="resetAppBtn" class="btn m-0 edit-btn bk-app" onclick="backToBasic()" type="button">Cancel</button>
        <button id="proceedPayBtn" class="btn m-0 edit-btn bk-app" onclick="proceedForPayment()" type="button">Pay Now</button>
        <button id="bookAppBtn1" class="btn m-0 edit-btn bk-app" onclick="bookAppointment()" type="button">Book Now</button>
        <button id="nextTabToPay" class="btn m-0 edit-btn bk-app" onclick="nextTab('paymentDetailLi')" type="button">Next</button>
      </div>
    </div>
		<div class="card p-2">
			<div class="d-flex flex-column h-100 gap-2">
				<div
					class="align-items-xl-center d-flex flex-column flex-lg-row justify-content-between lh-lg">
					<h6 class="m-0">Patient Details</h6>
					<div class="mandatory-txt text-end">
						Note: All fields marked with <span>*</span> are mandatory.
          </div>
				</div>
				<div class="row">
					<div class="col-lg-4 patDiv">
						<!--<label><input type="checkbox" id="existingPatientCheckbox">Existing Patient</label>-->
						<div class="form-check">
							<input class="nerp-check-input form-check-input" type="checkbox"
								value="" id="existingPatientCheckbox"> <label
								class="form-check-label" for="existingPatientCheckbox">Existing
								Patient</label>
						</div>
					</div>
					<div class="col-lg-8 patDiv" id="extPatDiv" style="display: none;">
						<label for="extPat">Select a patient:</label> <select id="extPat"
							class="searchable-select"
							onchange="getPatientDetailsById(this.value)">
							<option value="">Select</option>
							<option th:each="a : ${patList}" th:value="${a.key}"
								th:text="${a.name}"></option>
						</select>
					</div>
				</div>
				<div class="row g-3 mb-2">
					<input type="hidden" id="patientId">
					<div class="col-lg-3">
						<div class="form-group">
							<label>Full Name <span class="mandatory">*</span></label> <input
								type="text" id="fullName" class="form-control">
						</div>
					</div>
					<div class="col-lg-3">
						<div class="form-group">
							<label>Age <span class="mandatory">*</span></label> <input
								type="text" id="age" class="form-control" maxlength="3">
						</div>
					</div>
					<div class="col-lg-3">
						<div class="form-group">
							<label>Mobile No</label> <span class="mandatory">*</span> <input
								type="text" class="form-control" id="mobNo" maxLength="10"
								onkeyup="checkNumeric('mobNo');"
								onblur="removeValid(event)"> 
						</div>
					</div>
					<div class="col-lg-3 d-none">
						<div class="form-group">
							<label>Alt. Mobile No</label> <input type="text"
								class="form-control" id="altMobNo" maxLength="10"
								onkeyup="mobVal3();checkNumeric('altMobNo');"
								onblur="removeValid(event)"> <span id="error2"
								class="formValidation2"></span>
						</div>
					</div>
					<div class="col-lg-3 d-none">
						<div class="form-group">
							<label>Email Id</label> <input type="text" id="email"
								class="form-control">
						</div>
					</div>
					<div class="col-lg-3">
						<div class="form-group">
							<label>Gender <span class="mandatory">*</span></label> <select
								id="gender" class="form-select">
								<option value="">Select</option>
								<option th:each="c,iter:${genderList}" th:value="${c.key}"
									th:text="${c.name}"></option>
							</select>
						</div>
					</div>
					<div class="col-md-3 d-none">
						<div class="form-group">
							<label>Country <span class="mandatory">*</span></label> <select
								id="country" class="form-select" onchange="getStateDetails('0')"
								onblur="removeValid(event)">
								<option value="">Select</option>
								<option th:each="c,iter:${countryList}" th:value="${c.key}"
									th:text="${c.name}"></option>
							</select>
						</div>
					</div>
					<div class="col-md-3 d-none">
						<div class="form-group">
							<label>State <span class="mandatory">*</span></label> <select
								id="states" class="form-select"
								onchange="getDistrictDetails('0')" onblur="removeValid(event)">
								<option th:value="NULL">Select</option>
								<option th:each="c,iter:${statesList}" th:value="${c.key}"
									th:text="${c.name}"></option>
							</select> <span class="focus"></span>
						</div>
					</div>
					<div class="col-md-3 d-none">
						<div class="form-group">
							<label>District <span class="mandatory">*</span></label> <select
								id="dist" class="form-select" onblur="removeValid(event)"
								onchange="getCityDetails('')">
								<option th:value="NULL">Select</option>
								<option th:each="c,iter:${districtList}" th:value="${c.key}"
									th:text="${c.name}"></option>
							</select> <span class="focus"></span>
						</div>
					</div>
