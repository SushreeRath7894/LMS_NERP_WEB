<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"></meta>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
  <title>Blood Test Report</title>
  <style>
    
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #e0e0e0;
      font-size: 13px;
    }
    
    p {
      font-size: 13px;
    }
    
    .header {
      text-align: center;
      padding: 20px;
      margin-bottom: 20px;
      border-bottom: solid 4px #6F2816;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .pd-btm {
      padding-bottom: 0 !important;
    }
    
    .content {
      margin: 20px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    
    table, th, td {
      border: 1px solid;
    }
    
    table.borderless, table.borderless tr, table.borderless tr td {
      border: 0;
    }
    
    .border-0, .border-0 th, .border-0 td {
      border: 0;
    }
    
    th, td {
      padding: 8px;
      text-align: left;
    }
    
    .section-title {
      font-weight: bold;
      margin-top: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .mainsec {
      background-color: #ffffff;
    }
    
    .d-flex {
      display: flex !important;
    }
    
    .leftsec {
      position: relative;
    }
    
    .leftsec img {
      max-width: 250px;
    }
    
    w-100 {
      width: 100% !important;
    }
    
    
    .rightsec {
      position: relative;
    }
    
    .justify-content-between {
      justify-content: space-between !important;
    }
    
    .text-center {
      text-align: center;
    }
    
    .text-right {
      text-align: right;
    }
    
    h2.p-title {
      font-size: 14px;
      margin-bottom: 0;
    }
    
    .subtxt {
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 0;
    }
    
    .toptxt {
      font-size: 13px;
      margin-top: 0px !important;
      
    }
    
    
    table.borderless tr:first-child td:nth-child(1), table.borderless tr:first-child td:nth-child(2), table.borderless tr:first-child td:nth-child(3) {
      border-right: solid 1px !important;
      border: 0;
    }
    
    
    .bdr-btm {
      border-bottom: solid 1px #5e5e5e;
      padding-bottom: 10px;
    }
    
    .border-top-bottom {
      border-top: solid 1px #5e5e5e;
      border-bottom: solid 1px #5e5e5e;
    }
    
    .sign-sec {
      position: relative;
      text-align: left;
    }
    
    .sign-sec h2 {
      font-size: 16px;
    }
    
    .sign-sec img {
      max-width: 120px;
    }
    
    ul.listsec {
      margin: 0;
      padding: 0;
    }
    
    ul.listsec li {
      margin-left: 10px;
      margin-bottom: 5px;
      line-height: 18px;
    }
    
    .pd-5 {
      padding-top: 5px !important;
    }
    
    .rightsec span {
      margin-right: 5px;
    }
    
    .rightsec span img {
      width: 25px;
    }
    
    .align-items-center {
      align-items: center !important;
    }
    
    .hd-txt {
      text-transform: uppercase;
      margin-bottom: 4px;
      margin-top: 4px;
    }
    
    .img-h {
      height: 350px;
    }
    
    .txt-danger {
      color: #ff0000;
    }
    
    @page {
      size: A4 portrait;
      padding: 0;
      margin: 0;
    }
  
  </style>
</head>
<body>
<div class="container">
  <div class="mainsec">
    <div class="header pd-btm">
      <div class="d-flex w-100 justify-content-between">
        
        <div class="leftsec"><img src="classpath:static/assets/hisimages/logo.png"/></div>
        
        <div class="rightsec">
          <p class="d-flex align-items-center"><span><img src="classpath:static/assets/images/email.png"/></span> <span th:text="${maindata.mobile}"></span></p>
          <p class="d-flex align-items-center"><span><img src="classpath:static/assets/images/phone.png"/></span><span th:text="${maindata.email}"></span></p>
        </div>
      </div>
      
      <p class="text-center hd-txt"><span th:text="${maindata.address}"></span></p>
    </div>
    <div class="content" style="height:740px;">
      
      <table class="borderless ">
        <thead class="bdr-btm">
        <tr valign="top">
          <td>
            <h2 class="p-title"><span th:text="${maindata.pName}"></span></h2>
            <p class="subtxt"><span th:text="${maindata.age}"> Years</span></p>
            <p class="subtxt">Sex:<span th:text="${maindata.gender}"> Years</span></p>
          </td>
          
          <td>
            <h2 class="p-title">PID : <span th:text="${maindata.custId}"></span></h2>
            <p class="subtxt">Apt ID:<span th:text="${maindata.appId}"></span></p>
            <p class="subtxt">Ref By :<span th:text="${maindata.referedBy}"></span></p>
          
          </td>
          
          <td class="text-right">
            <h2 class="p-title">Registered On :</h2>
            <p class="subtxt"><span th:text="${maindata.registerDate}"></span></p>
            <h2 class="p-title">Reported On :</h2>
            <p class="subtxt"><span th:text="${maindata.reportDate}"></span></p>
          </td>
          
          <td class="text-center"><img src="classpath:static/assets/images/qrcode.png"/></td>
        </tr>
        
        </thead>
      </table>
      
      <!-- <span th:each="items: ${respdata}>
      <h2 class="section-title text-center"><span th:text="${items.groupNames}"></h2>
      </span> -->
      <table class="border-0">
        <thead class="border-top-bottom">
        <tr>
          <th><strong>Investigation</strong></th>
          <th><strong>Result</strong></th>
          <th><strong>Reference Value</strong></th>
          <th><strong>Unit</strong></th>
        </tr>
        </thead>
        <tbody>
       
       <tr th:each="items: ${respdata}">
          <td th:text="${items.testNames}"></td>
          <td th:text="${items.result}"></td>
          <td th:text="${items.ref}"></td>
          <td th:text="${items.unitName}"></td>
        </tr> 
        
        </tbody>
      </table>
      <h3 class="section-title">Note:</h3>
        <p><span th:text="${respdata[0].notes}"></span></p>

        <li>Exercise in between samples.</li>
        <li>Family history of Diabetes.</li>
        <li>Idiopathic.</li>
        <li>Partial / Total Gastrectomy.</li>
      </ul> -->

        <img src="images/x-ray-forearm.jpg" alt="x-ray-forearm" class="img-fluid img-h"/>
      </div>-->

        <div class="sign"><img src="images/sign1.jpg"/></div>
        <h2>Radiologic Technologists</h2>
        <p class="toptxt">(MSC,PGDM)</p>
      </div>
      
      <div class="sign-sec">
        <div class="sign"><img src="images/sign2.jpg"/></div>
        <h2>Dr. Payal Shah</h2>
        <p class="toptxt">(MD, Radiologist</p>
      </div>
      
      <div class="sign-sec">
        <div class="sign"><img src="images/sign3.jpg"/></div>

        <p class="toptxt">(MD, Radiologist)</p>
      </div>
    
    </div> -->
      
    </div>
    
    
  
  </div>

</div>
</body>
</html>
