<script>
function getLabReport(id) {
	
	$("#lab-container").empty();
	agGrid.simpleHttpRequest({
        url: "his-patholab-lab-report-view?id="+id
    }).then(function(response) {
    	$("#lab-container").empty();
    	
    	console.log(JSON.parse(response?.body))
    	if(response?.body) {
	    	let d = JSON.parse(response?.body)
	    	
	    	let userName = $("#userName").val();
	    	
	    	let c = '';
	    	let register_on = '';
	    	d.forEach(a => {
	    		
	    		let p = '';
	    		if(a?.test_details && a?.test_details.length > 0) {
	    			a?.test_details?.forEach(b=>{
	    				p = p + '<tr><td><strong>'+b.test_name+'</strong></td><td>'+b.result+'</td>'+
					    '<td>'+b.range+'</td><td>'+b.unit_name+'</td></tr>';
	    			})
	    			
	    		}
	    		
	    		register_on = d[0]?.register_on;
	    		
	    		let notes = a?.doc_notes ? a?.doc_notes : '';
	    		
	    		c = c + '<div class="container"><div class="mainsec"><div class="report-header pd-btm"><div class="d-flex w-100 justify-content-between">'
				+'<div class="leftsec"><img src="../assets/images/login_img/logo.png" style="width: 80px" /></div><div class="rightsec"><p class="d-flex align-items-center">'
				+'<span><i class="fa fa-mobile"></i> </span> 0674-7132-677 / 688 </p><p class="d-flex align-items-center">'
				+'<span><i class="fa fa-envelope"></i></span>info@nirmalyalabs.com </p></div></div><p class="text-center hd-txt">N3/325, Nayapalli, Bhubaneswar, Odisha - 751015</p></div>'
				+'<div class="content" style="height: 740px;"><table class="borderless " style="width: 100%"><thead class="bdr-btm"><tr valign="top"><td><h2 class="p-title">'+a?.cust_name+'</h2>'
				+'<p class="subtxt"><strong>Age: </strong>'+a?.age+' Years</p><p class="subtxt"><strong>Sex: </strong>'+a?.gender+'</p></td><td><h2 class="p-title">PID : '+a?.cust_id+'</h2><p class="subtxt">Apt ID: '+a?.test_id+'</p></td>'
				+'<td class="text-right"><h2 class="p-title">Registered On :</h2><p class="subtxt">'+register_on+'</p><h2 class="p-title">Reported On :</h2><p class="subtxt">'+a?.reported_on+'</p></td></tr></thead></table>'
				+'<h2 class="section-title text-center">'+a?.group_name+'</h2><table class="border-0" style="width: 100%">'
				+'<thead class="border-top-bottom"><tr><th><strong>Investigation</strong></th><th><strong>Result</strong></th>'
				+'<th><strong>Reference Value</strong></th><th><strong>Unit</strong></th></tr></thead>'
				+'<tbody>'+p+'</tbody></table><h3 class="section-title">Note:</h3> <p>'+notes+'</p></div>'
				+'<div class="footer bdr-btm d-flex w-100 justify-content-end"><div class="sign-sec"><div class="sign">'
				+'<img src="../assets/images/login_img/sign2.jpg" /></div><h2>Dr. '+userName+'</h2></div></div></div></div>';
	    		
	    	})
	    	
	    	$("#lab-container").append(c);
    	}
    })
	
}
</script>
</head>
<body>
	<input type="hidden" id="userName" th:value="${session.USER_NAME}">
	<div id="lab-container">
		
	</div>
