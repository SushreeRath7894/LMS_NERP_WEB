	function openDetails(id) {
		
		$("#myGrid").hide();

		$("#add").hide();
		$("#deleteBtn").hide();

	                if (response.message == "Success") {
						
						$("#empName").val(response.body.empName);
						$("#userEmployee").val(response.body.userEmployee);
						$(".roletxtsec").empty();
					
						for(var i = 0; i < response.body.roleNameList.length; i++) {

				            $(".roletxtsec").append(div);
						}
						
						roleOptions.api.deselectAll();
					    
					    agGrid.simpleHttpRequest({
					        url: 'ot-reserve-view-data',
					    }).then(function(data) {
					    	empOptions.api.setRowData(data);
					    });
					    
					    var roleData = response.body.roleList;
					    var datas = [];
					    roleOptions.api.forEachNode(function(rowNode, index) {
					    	
							for (var i = 0; i < roleData.length; i++) {
								if (rowNode.data.roleId === roleData[i]) { 
									roleOptions.api.selectNode(rowNode, true);
								}
							}
						}); 
					    console.log(datas)
					    
					    CKEDITOR.instances['commentck'].setData(response.body.procedure);
						CKEDITOR.instances['commentck1'].setData(response.body.instruction);
						
						$("#otReserveId").val(response.body.otReserveId);
						$("#ipdId").val(response.body.ipdId);
						$("#patientId").val(response.body.patientId);
						$("#pName").val(response.body.pName);
						$("#dateOfOpe").val(response.body.dateOfOpe);
						$("#duration").val(response.body.duration);
						$("#group").val(response.body.group);
						$("#subGroup").val(response.body.subGroup);
						$("#surgery").val(response.body.surgery);
						$("#otTable").val(response.body.otTable);

						$("#department").val(response.body.department);
						$("#doctor").val(response.body.doctor);
						$("#instruction").val(response.body.instruction);
						
						
					    $("#roleNameTxt").text(response.body.userId+" - "+response.body.userFirstName+" "+response.body.userLastName);
	                }
	            },
	            error: function(data) {
	                console.log(data)
	            }
	        });
	    }
	}

<script>


	function closeModal1() {

		$("#searchRowDiv").show();
		$("#add").show();

	function deleteProduct() {
		//console.log("delete ids--------------"+deleteId);
		$.ajax({
			type : "GET",
			url : "manage-product-mstr-delete-id?id=" + deleteId,

					}).then(function(data) {
						gridOptions.api.setRowData(dataset);

				}
			}

		});

		$('#delete').attr("disabled", true);
	}
	
	function getPatientList() {
		var search = $("#pName").val();
		if (search.length < 1) {
			$("#suggesstion-box20_").hide();
		}
		if (search) {
			$.ajax({
				type: "POST",
				url: "ot-reserve-patientList",
				dataType: 'json',
				contentType: 'application/json',
				data: search,
				success: function (response) {
					if (response.message == "success") {
						if (response.body.length != 0) {
							$("#search").css("background", "#FFF");
							var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;">';

							for (var i = 0; i < response.body.length; i++) {
								content += '<li class="autocompletedata cp ps-List" onClick="selectAutocompleteValue20(\''
									+ response.body[i].patientId
									+ '\',\''
									+ response.body[i].pName
									+ '\')">'
									+ response.body[i].pName
									+ '</li>';
							}

							content += '</ul>';
							$("#suggesstion-box20_").show();
							$("#suggesstion-box20_").html(content);

						} else {
							$("#search").css("background", "#FFF");
							var content = '<ul id="autocomplete-list2">';
							content += '<li onClick="selectAutocompleteValue()">'
								+ "No Data Found" + '</li>';
							content += '</ul>';
							$("#suggesstion-box20_").show();
							$("#suggesstion-box20_").html(content);
						}
					}
				},
				error: function (data) {
					console.log("Error:", data);
				}
			});
		}
	}

	function selectAutocompleteValue20(patientId, pName, mobNo, email) {

		if (patientId) {
			$("#patientId").val(patientId);
			var index = pName.indexOf(' / ');
			var trimmedData = pName.substring(0, index);

			$("#pName").val(trimmedData);
			$("#search").val(pName);
			$("#search").attr('data-procat', patientId);
			$("#suggesstion-box20_").hide();
		} else {
			$("#patientId").val("");
			$("#pName").val("");
			$("#search").val("");
			$("#search").attr('data-procat', "");
			$("#suggesstion-box20_").hide();

		}
	}

	
	function getSubGroupList(id) {
		//alert(id)
		var group = $('#group').val();
		//alert(id)
		if (group) {
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$.ajax({
				type: "GET",
				url: "manage-patient-subGroupList?id=" + group,
				success: function (response) {
					if (response.message == "success") {
						$("#subGroup").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#subGroup").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#subGroup").append(option);
						}
						if (id == '0') {

						} else {
							$("#subGroup").val(id);
						}
					}
				},
				error: function (e) {
				}
			});
		} else {
			$("#subGroup").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$("#subGroup").append(option);
			$("#subGroup").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
		}
	}
	
	
	
	function saveData() {
    	
		data = {};
		
		var procedure = CKEDITOR.instances.commentck.getData();
		var instruction = CKEDITOR.instances.commentck1.getData();
		
		data.patientId = $("#patientId").val();
		data.dateOfOpe = $("#dateOfOpe").val();
		
		data.duration = $("#duration").val();
		data.group = $("#group").val();
		data.subGroup = $("#subGroup").val();
		data.surgery = $("#surgery").val();
		data.surgery = $("#surgery").val();
		data.otTable = $("#otTable").val();
		
		data['procedure'] = procedure;
		data['instruction'] = instruction;
				
		var dataset = [];
		var selectedRows = roleOptions.api.getSelectedRows();
        selectedRows.forEach(function(selectedRow, index) {
        	dataset.push(selectedRow.roleId);
        });
        data.roleList = dataset;  
        
        $(".formValidation").remove();
		allPValid = true;
		
		if(allPValid) {
			$('.loader').show();
	    	$("body").addClass("overlay");
			submitUserData(data);
		}
    }
    
    
    function submitUserData(dataset) {
	console.log(dataset)

	$.ajax({
        type: "POST",
        url: "ot-reserve-save-data",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(dataset),
        success: function(response) {
            if (response.message == "Success") {
            	cancelBtn();
            	$('.loader').hide();
            	$("body").removeClass("overlay");
            	
            	$("#msgOkModal").removeClass("btn3");
            	$("#msgOkModal").addClass("btn1");
            	$("#msgModal").modal('show');
            	gridOptions.api.setRowData(dataset);
            	/* agGrid.simpleHttpRequest({
            	    url: 'ot-reserve-view-data'
            	}).then(function(data) {
            	    var len = data.length;
            	    $('#totalReq').find('span').html(len);
            	    gridOptions.api.setRowData(dataset);
            	}); */
            }
        }, error: function(data) {
        	console.log(data)
        	$('.loader').hide();
        	$("body").removeClass("overlay");
        }
	});
}
    
    function deleteUsers() {

        var selectedRows = gridOptions.api.getSelectedRows();
        var c = 0;
        selectedRows.forEach(function(selectedRow, index) {
            c = c + 1;
        });
        if (c > 0) {
            $("#delete").modal("show");
        }

    }
    
    function cancelModalBtn() {
        $("#delete").modal("hide");
        $("#deleteModalBtn").removeAttr("disabled");
    }
    
	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	
</script>
</head>

						<div id="myRoleGrid" class="ag-theme-alpine" style="height: 90%;"></div>
					</div>
					<div class="modal-footer">
						<button class="btn4" data-dismiss="modal"
							onclick="closeModal();">Cancel</button>
						<button class="btn1" id="selectRole">Select</button>

			</div>
		</div>
				</div>
			</div>
			
			<div id="delete" class="modal fade show" aria-modal="true">

				<div class="modal-content">
					<div class="modal-header flex-column">
						<button type="button" class="close" data-dismiss="modal"
							aria-hidden="true" onclick="cancelModalBtn()">
							<i class="ti-close modal-close"></i>
						</button>
					</div>
					<div class="modal-body">

							cannot be undone.</p>

					<div class="modal-footer justify-content-center">
						<button class="btn1" data-dismiss="modal"
							onclick="cancelModalBtn();">Cancel</button>
						<button class="btn3" id="deleteModalBtn">Delete</button>

				</div>
			</div>
		</div>
