    <style>

      .index-circle {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 24px;
        height: 24px;
        font-size: 14px;
        font-weight: bold;
        color: white;
        background-color: rgb(191, 5, 255); /* Purple Background */
        border-radius: 50%;
        margin-right: 8px;
      }

      .view-details {
        color: rgb(191, 5, 255);
      }

      .vital-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        flex-grow: 1;
        position: relative;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease-in-out;
      }

      .vital-card:hover {
        transform: translateY(-5px);
        /* box-shadow: 0 8px 16px rgba(0, 0, 0, 0.10); */
      }

      .btn-close-det {
        color: rgb(191, 5, 255);
      }

      .top-margin {
        margin-top: 10px;
      }

      .unitxt {
        font-size: 13px;
        margin-left: 10px;
      }

      .col-form-label {
        font-size: 13px;
      }

      .form-label {
        font-weight: bold;
      }

      .hidden {
        display: none;
      }

      .fw-bold {
        /*font-size: 16px;*/
        text-align: left;
      }

      .diet-grid {
        .col-md-1 {
          width: 5%;
          display: flex;
          justify-content: center;
        }

        .col-md-3 {
          font-weight: bold;
        }

        .autocomplete {
          width: 280px; /* Set appropriate width */
        }

        .col-md-4 {
          width: 250px; /* Adjust width */
        }
      }

      select {
        width: 100%;
        max-width: 100%;
        height: 36px;
      }

      .mb-3 {
        margin-bottom: 15px;
      }

      .slim-select {
        min-width: 100%;
      }

      input[type="text"].form-control {
        width: 100%;
        max-width: 100%;
        height: 36px;
      }

      .diet-view-section {
        border: 1px solid #ddd;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        background: transparent;
        /* box-shadow: 0 .5rem 1rem rgba(0,0,0,.15); */
      }

      .diet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: bold;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #ddd;
        margin-bottom: 10px;

        p {margin: 0;}
      }

      .diet-entry {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
      }

      .menu-container {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .menu-chip {
        /*background: #c88fdc;*/
        background: rgba(191, 5, 255, 0.7);
        color: #fff;
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 14px;
      }

      .timeline-circle-sym {
        background-color: rgb(191, 5, 255);
        width: 10px;
        height: 10px;
        position: absolute;
        left: -5px;
        top: 50%;
        border-radius: 50%;
      }

      .no-treatment-message {
        background-color: #ffffff;
    color: #BF05FF;
    text-align: center;
    padding: 15px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 13px;
    border: solid 1px #e3e2e2;
      }

      .fa-eye {
        position: absolute;
        top: 10px;
        right: 16px;
      }
      .edit-icon { color: var(--mainColor); }
      .fnt-13{font-size: 13px;}
     .check-align input[type=checkbox] {
          top: -8px;
      }
      .bdr-rt{border-right: 1px solid var(--inputborder);}
      @media only screen and (max-width:768px) {
        .border{
          border: none !important;
        }
      }
