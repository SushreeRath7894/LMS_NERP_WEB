<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>
	<style>
		.ps-List {
			background-color: #dedede !important;
			font-weight: 500 !important;
			margin-left: 11px !important;
			color: #848484 !important;
			padding: 4px;
			border-radius: 7px;
			border-left: solid;

			border-top: solid;
		}
	</style>

	<script>

	$(document).ready(function() {
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		
		gridOptions.api.setRowData(rowData);
		$('#addEdu').attr('disabled', true);
		
	});

	
		
		/* -------------------search bar for mygrid----------------------- */

		function onQuickFilterChanged() {
			gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
			var totalRowCount = gridOptions.api.getModel().getRowCount();
			$('#totalMetaDetector').find('span').html(gridOptions.api.getModel().getRowCount());
		}

		function cancelBar() {
			var id = document.getElementById("closeKey");
			id.style.display = "block";

			if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
				id.style.display = "none";
			}
		}
		 // Static row data
        var rowData = [
            {
            	patientId: "TIM/2023-24/00001",
            	patientName: "Sushree Manmayee Rath",
            	deptId: "Dr Amarendra",
            	deptName: "Friend",
                status: "635241895"
            },
            {
            	patientId: "TIM/2023-24/00001",
            	patientName: "Sushree Manmayee Rath",
                deptId: "Sadhna Panda",
                deptName: "Mother",
                status: "8632594613"
            },
            {
            	patientId: "TIM/2023-24/00001",
            	patientName: "Sushree Manmayee Rath",
                deptId: "Samar Dash",
                deptName: "Father",
                status: "8632344613"
            },
           
        ];
		var columnDefs = [
			{
				headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : false,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true,
				pinned : 'left',

			},
			{
				headerName : 'Patient Id',
				field : "patientId",
				pinned : 'left',
				flex:1

			}, {
				headerName : 'Patient Name',
				field : "patientName",
				flex:1
				
			},{
				headerName : 'Emergency Contact Name',
				field : "deptId",
				flex:1
				
			},{
				headerName : 'Relation',
				field : "deptName",
				flex:1
				
			}, {
				headerName : 'Mobile',
				field : "status",
				flex:1
				
			}];

	// let the grid know which columns and what data to use
	var gridOptions = {
		columnDefs : columnDefs,
		rowData: rowData, 
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 150
		},
		onSelectionChanged : onSelectionChanged,
	};

	//function for row select parents
	
	function onSelectionChanged() {
		var selectedNodes = gridOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		
		var selectedRows = gridOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			$('#addEdu').attr('disabled', false);
			
		
		}else {
			$('#addEdu').attr('disabled', true);
		}
	}
	
	function addEdu(){
		$("#myModalEducation").modal('show');
	}

	function submitedu(){
		 var qualification = $('#eName').val();
	        var specialization = $('#relation option:selected').text();
	        var patientId = $('#patientId').val();
	        var patientName = $('#patientName').val();
	        var status = $('#mobile').val();

	        if (qualification && specialization) {
	            // Add new row data to AG Grid
	            gridOptions.api.applyTransaction({
	                add: [{ deptId: qualification, deptName: specialization,patientId:patientId,patientName:patientName,status:status }]
	            });

	            // Clear input fields and hide modal
	            $('#qualification').val('');
	            $('#specialization').val('');
	            $('#myModalEducation').modal('hide');
	        } else {
	            alert('Please fill out both fields.');
	        }
	}	
	
   function cancelModalBtn1(){
   	   $('#qualification').val('');
	        $('#specialization').val('');
	        $('#mobile').val('');
	        $('#myModalEducation').modal('hide');
	}	
	</script>

</head>

<body>
	<div layout:fragment="content" class="maincontent">

		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">

						<div class="d-flex justify-content-between align-items-center" id="tdiv">
							<div class="btn-hs">
								<div class="font-design" id="totalMetaDetector">
									Emergency Contact List
								</div>
							</div>
							<div id="searchRowDiv">
								<div class="input-style">
									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput" onkeyup="cancelBar()"
										oninput="onQuickFilterChanged()" id="quickFilter"
										autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey"
											onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalAsset').find('span').html(gridOptions.api.getModel().getRowCount());"
											class="close_i"><i class="ti-close srchicon"></i></span></a><a
											href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
									</div>
								</div>
							</div>
							<div class="button-right">
							
								<div class="buttonsec btn-hs" id="ttbtn">
										<button class="new-btn" id="addEdu"
										onclick="addEdu()">Add</button>
								</div>

							</div>

						</div>

						
						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>
						<div id="myModalEducation" class="modal fade" role="dialog">
							<div class="modal-dialog modal-md">
								<!-- Modal content-->
								<div class="modal-content">

									<div class="modal-body">


										<div class="row mdsec">

											<div class="col-md-6 ">
												<div>Name</div>
												<input type="text" class="form-control"
													placeholder="Name" id="eName"
													autocomplete="off" onblur="removeValid(event)">
											</div>
											<div class="col-md-6 ">
												<div>Relation</div>
												<div class="select">
												<select id="relation" class="form-control">
													<option value="1">Select</option>
													<option value="2">Father</option>
													<option value="3">Mother</option>
													<option value="4">Brother</option>
													<option value="5">Sister</option>
													<option value="6">Friend</option>
												</select>
											</div>
											</div>

											<div class="col-md-6 ">
												<div>Mobile</div>
												<input type="text" placeholder="Mobile"
													class="form-control" id="mobile" autocomplete="off"
													onblur="removeValid(event)">
											</div>
											
											<input type = "hidden" id ="patientId" value = "TIM/2023-24/00001">
											<input type = "hidden" id ="patientName" value = "Sushree Manmayee Rath">

										</div>

									</div>

									<div class="modal-footer">
										<button class="btn4" id="cancelModalBtn1"
											onclick="cancelModalBtn1()">CANCEL</button>
										<button class="btn1" id="submitedu" onclick="submitedu()">SAVE</button>
									</div>

								</div>
							</div>
						</div>




					</div>
					
					
					
					
					
					 
				</div>


			

		
			</div>
		</div>
	</div>
</body>

</html>
