<html lang="en" xmlns="http://www.w3.org/1999/xhtml"

<head>
<style>
.ps-List {
	background-color: #dedede !important;
	font-weight: 500 !important;
	margin-left: 11px !important;
	color: #848484 !important;
	padding: 4px;
	border-radius: 7px;

.clickable-cell {
	cursor: pointer;

<script>

	$(document).ready(function() {
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		
		gridOptions.api.setRowData(rowData);
		$('#pdf').attr('disabled', true);
		
	});
	//function for download
	function downloadDetails() {
		var params = {
			fileName: 'Discharge_List.csv', // Specify your custom filename here
		};
		gridOptions.api.exportDataAsCsv(params);
	}
	
		
		/* -------------------search bar for mygrid----------------------- */

		function onQuickFilterChanged() {
			gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
			var totalRowCount = gridOptions.api.getModel().getRowCount();
			$('#totalMetaDetector').find('span').html(gridOptions.api.getModel().getRowCount());
		}

		function cancelBar() {
			var id = document.getElementById("closeKey");
			id.style.display = "block";

			if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
				id.style.display = "none";
			}
		}
		 // Static row data
        var rowData = [
            {
            	patientId: "IPD/2023-24/00001",
            	patientName: "Gyana Nayak",
            	deptName: "Medicine",
            	word: "General Ward",
                bed: "Standard-010",
                insurance : "Aditya Birla Insurance",
                status : "Claimed"
            },
            {
                patientId: "IPD/2023-24/00002",
                patientName: "Raj Kumar",
                deptName: "Medicine",
                word: "General Ward",
                bed: "Standard-001",
                insurance : "Sun Life Insurance",
                status : "Pending"
            }
        ];
		var columnDefs = [
			{
				headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : false,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true,
				pinned : 'left',

			},
			{
				headerName : 'Patient Id',
				field : "patientId",
				pinned : 'left',
				width : 250,
				flex:1

			}, {
				headerName : 'Patient Name',
				field : "patientName",
				width : 250,
				flex:1
				
			},{
				headerName : 'Department',
				field : "deptName",
				width : 250,
				flex:1
				
			}, {
				headerName : 'Ward',
				field : "word",
				width : 180,
				flex:1
				
			}, {
				headerName : 'Bed',
				field : "bed",
				width : 180,
				flex:1
				
			}
			, {
				headerName : 'Insurance Company',
				field : "insurance",
				width : 250,
				flex:1
				
			},{
			    headerName: 'Status',
			    field: 'status',
			    width: 250,
			    cellStyle: function(params) {
			        if (params.value === 'Claimed') {
			            return { 'background-color': '#d4edda', 'color': '#155724', 'text-align': 'center' };  // Green for Claimed
			        } else if (params.value === 'Pending') {
			            return { 'background-color': '#f8d7da', 'color': '#721c24', 'text-align': 'center' };  // Red for Not Claimed
			        } else {
			            return { 'text-align': 'center' };
			        }
			    },
			    cellRenderer: function(params) {
	                return `<span>${params.value || ''}</span>`;
	            },
	            flex: 1,
	        
	        // Other column definitions...
	    
	    /* onCellClicked: function(event) {
	        if (event.colDef.field === 'status') {  // Check if the clicked cell is in the 'status' column
	            openClaimModal(event.rowIndex);  // Open the modal with the row index
	        }
	    }, */
			
				
			},{
			    headerName: 'Claim',
			    field: 'status',
			    width: 100,
			    cellRenderer : function(params) {
					return '<a onclick=openClaimModal("' + params.data.status
					+ '") style="color: var(--primary); cursor: pointer">Claim</a>';
				}
			}];
		
		
		function openModal() {
			$("#myModal").show();
		}

	// let the grid know which columns and what data to use
	var gridOptions = {
		columnDefs : columnDefs,
		rowData: rowData, 
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 150
		},
		onSelectionChanged : onSelectionChanged,
	};

	//function for row select parents
	
	function onSelectionChanged() {
		var selectedNodes = gridOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		
		var selectedRows = gridOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(i) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			$('#pdf').attr('disabled', false);
			
		
		}else {
			$('#pdf').attr('disabled', true);
		}
	}

	
		
	let selectedRowIndex = null;

	function openClaimModal(rowIndex) {
		
		 const rowNode = gridOptions.api.getDisplayedRowAtIndex(rowIndex);
		    
		    // Clear the current status value in the cell
		    // rowNode.setDataValue('status', ''); // Clear the existing value before showing the modal

		    selectedRowIndex = rowIndex; // Store the selected row index
		    
		    if(rowIndex == 'Pending') {
		    	$('#myModal').modal('show');
		    }
		     // Show the modal
	}
   
	function updateStatus(newStatus) {
	    const rowNode = gridOptions.api.getDisplayedRowAtIndex(selectedRowIndex);
	    
	    // Directly update the status value, replacing any previous data
	    rowNode.setDataValue('status', newStatus); // This replaces any previous value
	    
	    // Hide the modal after the selection
	    $('#myModal').modal('hide');
	}
	
	function sumTotal() {
		let a = $("#a").val();
		let b = $("#b").val();
		let c = $("#c").val();
		let d = $("#d").val();
		
		if(a != '' && a != null) {
			a = parseFloat(a).toFixed(2);
			$('#a').val(a);
		} else {
			a = 0;
		}
		if(b != '' && b != null) {
			b = parseFloat(b).toFixed(2);
			$('#b').val(b);
		} else {
			b = 0;
		}
		if(c != '' && c != null) {
			c = parseFloat(c).toFixed(2);
			$('#c').val(c);
		} else {
			c = 0;
		}
		if(d != '' && d != null) {
			d = parseFloat(d).toFixed(2);
			$('#d').val(d);
		} else {
			d = 0;
		}
		
		let e = 0;
		e = parseFloat(a) + parseFloat(b) + parseFloat(c) + parseFloat(d);
		
		$("#e").val(e.toFixed(2));
	}
	
	function cancelBtn() {
		$("#a").val('');
		$("#b").val('');
		$("#c").val('');
		$("#d").val('');
		$("#e").val('');
		$("#myModal").modal('hide');
	}
	
	function approve() {
		var rowData = [
            {
            	patientId: "IPD/2023-24/00001",
            	patientName: "Gyana Nayak",
            	deptName: "Medicine",
            	word: "General Ward",
                bed: "Standard-010",
                insurance : "Aditya Birla Insurance",
                status : "Claimed"
            },
            {
                patientId: "IPD/2023-24/00002",
                patientName: "Raj Kumar",
                deptName: "Medicine",
                word: "General Ward",
                bed: "Standard-001",
                insurance : "Sun Life Insurance",
                status : "Claimed"
            }
        ];
		gridOptions.api.setRowData(rowData);
		$("#myModal").modal('hide');
	}
	</script>

</head>
