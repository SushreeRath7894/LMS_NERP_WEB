<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>
	<meta charset="ISO-8859-1">
	<style type="text/css">
		.highcharts-exporting-group {
			display: none;
		}

		.slidebox {
			padding: 14px;
			margin-top: 0px;
			margin: 0px 10px;
		}

		.holdCls {
			background-color: rgb(0, 143, 0);
		}

		.bg_white {
			background: #ffffff !important;
		}
	</style>

	<script type="text/javascript" charset="utf-8">

		function agGridOnLoad() {

			agGrid.simpleHttpRequest({
				url: 'patholab-lab-view'
			}).then(function (data) {
				if (!data) {
					data.push(data);
				}
				gridOptions.api.setRowData(data);
			});

		}


		$(document).ready(function () {
			
			$("#delete").prop("disabled", true);
			var gridDiv = document.querySelector('#myGrid');
			new agGrid.Grid(gridDiv, gridOptions);


			agGrid.simpleHttpRequest({
				url: "patholab-lab-view"
			}).then(function (data) {
				var len = data.length;
				$('#totalReq').find('span').html(len);
				if (!data) {
					data.push(data);
				}
				gridOptions.api.setRowData(data);
			});

			function cancelBar() {
				var id = document.getElementById("closeKey");
				id.style.display = "block";

				if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
					id.style.display = "none";
				}
			}

		});

		/* ------------------- search bar for mygrid------------------------ */

		function onQuickFilterChanged() {
			gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
			var displayedRowCount = gridOptions.api.getDisplayedRowCount();
			var len = displayedRowCount;
			$('#totalReq').find('span').html(len);
		}

		function cancelBar() {
			var id = document.getElementById("closeKey");
			id.style.display = "block";


			if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
				id.style.display = "none";

			}

		}


		var colmnDefs = [{
			headerCheckboxSelection: true,
			headerCheckboxSelectionFilteredOnly: true,
			checkboxSelection: true,
			width: 10,
			sortable: false,
			filter: false,
			resizable: true
		},
		{
			headerName: "ID",
			field: "pathoLab",
			cellRenderer: function (params) {
				return '<a id="" onclick=editpathoLab("' + params.data.pathoLab
					+ '") href="javascript:void(0)">'
					+ params.data.pathoLab + '</a>';
			}

		}, {
			headerName: 'Name',
			field: "labName"
		}, {
			headerName: 'Property Floor Type',
			field: "labpropertyFloorType"
		}, {
			headerName: 'Status',
			field: "labStatus"
		}, {
			headerName: 'Description',
			field: "labDes"
		}];

		var gridOptions = {
			columnDefs: colmnDefs,
			rowSelection: 'multiple',
			onSelectionChanged: deleteDetails,
			groupSelectsChildren: true,
			suppressRowClickSelection: true,
			suppressAggFuncInHeader: true,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 210,
				height: 10
			},

		};

		function Cancel() {

			$("#add").show();
			$("#delete").show();
			$("#myGrid").show();
			$("#save").hide();
			$("#cancel").hide();

		}

		//Open Nav 
		function openNav() {

			document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto;";
			document.getElementById("main_content").style.width = "75%";
			$("#cancel").show();
			$("#save").show();
			$('#delete').hide();
		}



		function closeNav() {
			$("#pathoLab").val("");
			$("#labName").val("");
			$("#labpropertyFloorType").val("");
			$("#labStatus").val("");
			$("#labDes").val("");
			$('#delete').show();
			$('#add').show();
			document.getElementById("mySidenav").style.width = "0";
			document.getElementById("main_content").style.width = "100%";
		}

		// add

		//add 

		function addLab() {
			obj = {};

			obj.pathoLab = $("#pathoLab").val();
			obj.labName = $("#labName").val();
			obj.labpropertyFloorType = $("#labpropertyFloorType").val();
			obj.labDes = $("#labDes").val();
			obj.labStatus = $("#labStatus").val();
			obj.labOrg = $("#labOrg").val();
			obj.labDiv = $("#labDiv").val();
			var validation = true;

			if (validation) {
				$.ajax({
					type: "POST",
					url: "patholab-lab-add",
					contentType: "application/json",
					data: JSON.stringify(obj),
					success: function (response) {
						if (response.message == "Success") {

							$("#messageParagraph").text("Data Saved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							$("#activityone").show();

							$("#add").show();
							$("#myGrid").show();
							$("#cancel").hide();
							$("#save").hide();
							$("#form").hide();
							$("#new").hide();
							closeNav();

							agGrid.simpleHttpRequest({
								url: "patholab-lab-view"
							}).then(function (data) {
								gridOptions.api.setRowData(data);
							});

						}
					},
					error: function (data) {
					}
				})
			}
		}


		// edit

		function editpathoLab(id) {
			agGridOnLoad();

			$.ajax({
				type: "POST",
				url: "patholab-lab-edit?Id=" + id,
				dataType: 'json',
				contentType: 'application/json',
				data: id,
				success: function (response) {
					if (response.message == "success") {

						console.log("edit", response.body)
						$("#pathoLab").val(response.body[0].pathoLab);
						$("#labName").val(response.body[0].labName);
						$("#labpropertyFloorType").val(response.body[0].labpropertyFloorType);
						$("#labDes").val(response.body[0].labDes);
						$("#labStatus").val(response.body[0].labStatus);

						openNav();
					}
				},

				error: function (data) {
					console.log(data)
					$("#pathoLab").val("");
					$("#labName").val("");
					$("#labpropertyFloorType").val("");
					$("#labDes").val("");
					$("#labStatus").val("");

				}
			});

		}





		var deleteId = "";
		function deleteDetails() {
			var selectedRows = gridOptions.api.getSelectedRows();

			deleteId = "";
			for (var i = 0; i < selectedRows.length; i++) {
				deleteId = deleteId + '"' + selectedRows[i].icu + '",';

			}
			deleteId = deleteId.substring(0, deleteId.length - 1);

			var rowCount = 0;
			selectedRows.forEach(function () {
				rowCount = rowCount + 1;
			});
			if (rowCount > 0) {
				$('#delete').attr("disabled", false);
				$('#add').hide();
				if (rowCount == 1) {
					$('#add').hide();
				}
			} else {
				$('#delete').attr("disabled", true);
				$('#add').show();

			}

		}
		//Delete 
		function deletelab() {
			var selectedRows = gridOptions.api.getSelectedRows();
			var id = selectedRows[0].pathoLab;


			$.ajax({
				type: "POST",
				url: "patholab-lab-delete?id=" + id,
				success: function (response) {
					if (response.message == "Success") {
						agGrid.simpleHttpRequest({
							url: "patholab-lab-view"
						}).then(function (data) {
							gridOptions.api.setRowData(data);
						});

						Cancel();
					}
				},
				error: function (data) {
					console.log(data);
				}
			})
		}



		function closeNav() {
			$("#pathoLab").val("");
			$("#labName").val("");
			$("#labpropertyFloorType").val("");
			$("#labDes").val("");
			$("#labStatus").val("");

			$('#delete').show();
			$('#add').show();
			document.getElementById("mySidenav").style.width = "0";
			document.getElementById("main_content").style.width = "100%";
		}






	</script>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">
						<div id="main_content">


							<div id="main_content">
								<div class="row">
									<!-- Left corner -->
									<div class="col-md-3" id="patList">
										<div class="font-design" id="totalReq">
											PathoLab List (<span></span>)
										</div>
									</div>

									<!-- Middle -->
									<div class="col-md-4" style="margin-bottom: 10px;">
										<div id="searchRowDiv">
											<div class="input-style">
												<input type="text" placeholder="Search.." name="search"
													class="searchboxinput" onkeyup="cancelBar()"
													oninput="onQuickFilterChanged()" id="quickFilter"
													autocomplete="off">
												<div class="searchicon">
													<a href="javascript:void(0)">
														<span
															style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
															id="closeKey"
															onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';"
															class="close_i">
															<i class="ti-close srchicon"></i>
														</span>
													</a>
													<a href="javascript:void(0)">
														<i class="ti-search srchicon"></i>
													</a>
												</div>
											</div>
										</div>
									</div>

									<!-- Right corner -->
									<div class="col-md-5">
										<div id="buttonContainer" class="horizontal-align">
											<div class="btn-hs" id="buttonGroup">
												<button class="btn1" id="add" onclick="openNav()">New</button>
												<button id="delete" onclick="deletelab()" class="btn3">DELETE</button>
											</div>
										</div>
									</div>
								</div>


								<div id="mySidenav" class="sidenav">
									<div class="slidebox">
										<div class="row">
											<div class="col-md-10 edit">PathoLab Details</div>
											<div class="col-md-2">
												<div class="arrow">
													<a href="javascript:void(0)" class="closebtn"
														onclick="closeNav()"><i class="ti-arrow-right"></i></a>
												</div>
											</div>
										</div>
										<div class="row">
											<div class="col-md-12 buttonsec btn-hs">
												<button class="btn4" id="cancel" onclick="closeNav()">Cancel</button>
												<button class="btn1" type="submit" id="save" value="add"
													onclick="addLab()">Save</button>
											</div>
										</div>

										<div class="col-md-12">
											<div class="form-group">
												<input type="hidden" class="form-control transparenttxtbox"
													placeholder="PathoLab" id="pathoLab">
											</div>
										</div>
										<div class="col-md-12">
											<div class="form-group">
												<label>Name</label> <input type="text"
													class="form-control transparenttxtbox" placeholder="Name"
													id="labName">
											</div>
										</div>
										<div class="row">
											<div class="col-md-12">
												<div class="form-group">
													<label>Property Floor Type</label>
													<div class="select">
														<select id="labpropertyFloorType" onblur="removeValid(event)">
															<option th:value="NULL">Select</option>
															<option th:each="c,iter:${floorList}" th:value="${c.key}"
																th:text="${c.name}">
															</option>
														</select>
													</div>
												</div>
											</div>
											<div class="col-md-12">
												<div class="form-group">
													<label>Status</label>
													<div class="select">
														<select id="labStatus" class="form-control">
															<option value="">Select</option>
															<option value="1">Active</option>
															<option value="0">Inactive</option>
														</select>
													</div>
												</div>
											</div>
											<div class="col-md-12">
												<div class="form-group">
													<label>Description</label>
													<textarea id="labDes" cols="50"></textarea>

												</div>
											</div>

										</div>
									</div>
								</div>
								<div id="myGrid" style="width: 100%; height: 500px;" class="ag-theme-alpine"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
</body>

</html>
