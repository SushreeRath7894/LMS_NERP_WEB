<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.btn-position {
	position: absolute;
	right: 20px;
	bottom: 135px;
}

.ag-theme-alpine .ag-ltr .ag-cell a {
	color: var(--mainColor) !important;
	text-decoration: none !important;
}

.ag-btn {
	color: var(--mainColor);
	background-color: var(- -bs-white);
	height: max-content;
	line-height: 1;
	border: 1px solid var(--mainColor);
}

.ag-btn:hover {
	color: var(- -mainColor);
	border: 1px solid var(--mainColor);
	font-weight: 600;
}

.bk-app {
	line-height: 10px !important;
	width: 102px !important;
}
.btn-align input[type='radio'], label{   
    vertical-align: middle;
    margin-top: -2px;
 }
</style>
<script>
let type, bookFromType = '';
$(document).ready(function() {

    var gridDiv = document.querySelector('#myGrid');
    new agGrid.Grid(gridDiv, gridOptions);
    getAllPatientsDetails();

    var gridDivprocessing = document.querySelector('#myGridProcessing');
    new agGrid.Grid(gridDivprocessing, gridOptionsProcessing);

    $('#nextBTNs').attr('disabled', true);
    $("#lab-container").empty();

    $('.pay-tab').hide();
    type = 'RAD';
    bookFromType = 'RAD';
    getTestList(type);
    
    $("#quickFilter").on("keydown", function(event) {
  		if (event.key === "Enter" || event.which === 13) {
  			event.preventDefault();
  			onQuickFilterChanged();
  		}
  	});
    
})


function onQuickFilterChanged() {
	gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
	var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0);
	if (firstRowNode) {
		firstRowNode.setSelected(true);
	}
}

function resetList() {
	let data = $("#quickFilter").val();
	if(data) {
		$("#quickFilter").val('');
		onQuickFilterChanged();
	}
}

var columnDefs = [{
        headerCheckboxSelection: false,
        headerCheckboxSelectionFilteredOnly: true,
        checkboxSelection: true,
        width: 10,
        sortable: false,
        filter: false,
        resizable: true
    },
    {
        headerName: "Booking Id",
        field: "book_id",
        flex: 1,
        cellRenderer: (params) => {
        	
        	if(params.data.book_id) {
        		return params.data.book_id;
        	} else {
        		return params.data.test_id;
        	}
        	
        }
    },
    {
        headerName: "Patient Id",
        field: "cust_id",
        flex: 1,
    },
    {
        headerName: "Name",
        field: "cust_name",
        flex: 1,

    },
    {
        headerName: "Address",
        field: "address",
        flex: 1,

    },
    {
        headerName: "Mobile",
        field: "cust_mob",
        flex: 1,

    },
    {
        headerName: "Age",
        field: "age",
        flex: 1,

    },
    {
        headerName: "Gender",
        field: "gender",
        flex: 1,

    },
    {
        headerName: "Status",
        field: "pay_status",
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.pay_status === "Fully Paid") {
                return '<a style="color:blue !important;font-weight: bold;">Fully Paid</a>';
            } else if (params.data.pay_status === "Not Paid") {
                return '<a  style="color:red !important;font-weight: bold;">Not Paid</a>';
            } else if (params.data.pay_status === "Partial Paid") {
                return '<a style="color:black !important;font-weight: bold;">Partial Paid</a>';
            }
        }

    }
];

// Define grid options
var gridOptions = {
    columnDefs: columnDefs,
    rowSelection: 'single',
    getRowNodeId: function(data) {
        return data.test_id; // or whatever unique field your row data uses
    },
    suppressRowClickSelection: true,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
    },
    pagination: true,
    paginationPageSize: 15,
    onSelectionChanged: rowSelect
};

var columnDefsProcessing = [{
        checkboxSelection: true,
        width: 10,
        hide: true,
        sortable: false,
        filter: false,
        resizable: true
    },
    {
        headerName: "Group",
        field: "testName",
        flex: 1,

    },
    {
        headerName: "Test",
        field: "skuName",
        flex: 1,

    },
    {
        headerName: "Attachment",
        field: "file",
        cellRenderer: FileUploadRenderer,
        flex: 1,
    },
    {
        headerName: "Result",
        field: "testResult",
        cellRenderer: ResultLinkRenderer,
        flex: 2,

    },
    {
        headerName: "Action",
        field: "action",
        cellRenderer: ButtonRenderer,
        flex: 1,
    },
    {
        headerName: "Base64Data",
        field: "base64Data",
        cellRenderer: ButtonRenderer,
        flex: 1,
        hide:true
    },
    {
        headerName: "Id",
        field: "id",
        flex: 1,
        hide:true
    },

];

var gridOptionsProcessing = {
    columnDefs: columnDefsProcessing,
    rowSelection: 'single',
    suppressRowClickSelection: true,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
    },
    getRowId: function (params) {
        return params.data.id;
    },
    onSelectionChanged: rowSelectProcessing
};


function FileUploadRenderer(params) {
	let base64String = '';
    const container = document.createElement('div');

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.marginRight = '10px';
    fileInput.style.display = 'block';
    fileInput.style.lineHeight = '18px';
    fileInput.accept = 'image/*, .pdf';
    fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
        	
        	$('.loader').show();
        	$("body").addClass("overlay");
        	
        	const rowNode = params.node;
        	const reader = new FileReader();
            
            reader.onload = function(e) {
                base64String = e.target.result; 
                rowNode.setDataValue('base64Data', base64String);
            };

            reader.readAsDataURL(file); 
        	
            setTimeout(()=>{
            	params.setValue(file);
                const fileURL = URL.createObjectURL(file);
                let skuName = params.data.skuName?.replaceAll('-','')?.replaceAll(' ','-')?.replaceAll('(','-')?.replaceAll(')','-');
                let custId = params.data.custId?.replaceAll('/','_');
                let orderId = params.data.orderId?.replaceAll('/','_');
                let extension = file.name.split('.').pop();
                let fileName = skuName+"-"+orderId+"-"+custId+"."+extension;
                rowNode.setDataValue('testResult', { name: fileName, url: fileURL });
                rowNode.setDataValue('action', 1);
                
                fileInput.value = ''; 
                
                $('.loader').hide();
        		$("body").removeClass("overlay");
            },1000)
            

        } else {
        	$('.loader').hide();
    		$("body").removeClass("overlay");
        }
    });
    
    $('.loader').hide();
	$("body").removeClass("overlay");
	
	let selectedRows = gridOptions.api.getSelectedRows();
    if(selectedRows && selectedRows.length > 0) {
    	if(selectedRows[0].approved == 1) {
    		fileInput.disabled = true;
    	} else {
    		fileInput.disabled = false;
    	}
    } else {
    	fileInput.disabled = false;
    }
    
    container.appendChild(fileInput);
    
    return container;
}

function ResultLinkRenderer(params) {
	if (params.value && params.value.name) {
        return `<a href="${params.value.url}" target="_blank" title="${params.value.name}">${params.value.name}</a>`;
    }
    return '';
}

function ButtonRenderer(params) {
	if (params.value == 1) {
		let jsonString = window.btoa(JSON.stringify(params?.data))
		return `<button class="btn btn-sm ag-btn" onclick=uploadTestResult("${jsonString}")><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>`;
	}
	if (params.value == 2) {
		let selectedRows = gridOptions.api.getSelectedRows();
		if(selectedRows && selectedRows.length > 0) {
			if(selectedRows[0]?.approved == 1) {
				$("#approveBtn").hide();
			} else {
				$("#approveBtn").show();
			}
		} else {
			$("#approveBtn").hide();
		}
		return 'Uploaded';
	}
	return '';
}

function uploadTestResult(params) {
	
	let data = JSON.parse(window.atob(params));
	
	let obj = {};
	
	obj.key = data?.orderId;
	obj.code = data?.base64Data;
	obj.id = data?.skuId;
	obj.data = data?.testId;
	obj.name = data?.testResult?.name;
	
	$('.loader').show();
    $("body").addClass("overlay");
	
	$.ajax({
        type: "POST",
        url: "radiology-save-test-report",
        contentType: "application/json",
        data: JSON.stringify(obj),
        success: function(response) {
            if (response.code == "success") {
                $('.loader').hide();
                $("body").removeClass("overlay");
                toastr.success('Result uploaded successfully');
                
                gridOptionsProcessing.api.forEachNode(function (node) {
				    if (node.data.id === data?.id) {
				        node.setDataValue('base64Data', '');
				        node.setDataValue('action', 2);
				        let imgurl = '/document/function/' + obj.name;
				        node.setDataValue('testResult', { name: obj.name, url: imgurl });
				    }
				});
                
            } else {
                $('.loader').hide();
                $("body").removeClass("overlay");
            }

        },
        error: function(datas) {
            console.log(datas)
            $('.loader').hide();
            $("body").removeClass("overlay");
        }
    })
}

function getAllPatientsDetails(id='') {

    agGrid.simpleHttpRequest({
        url: "radiology-view"
    }).then(function(response) {
        var jsonData = JSON.parse(response?.body);
        var allData = jsonData;

        if (allData && allData.length > 0) {
            gridOptions.api.setRowData(allData);
            if(id) {
            	gridOptions.api.forEachNode(node => {
            	    if (node.data.test_id === id) {
            	        node.setSelected(true);
            	    }
            	});
            } else {
            	var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0); // Get the first row node
                if (firstRowNode) {
                    firstRowNode.setSelected(true);
                }
            }
            
        } else {
            gridOptions.api.setRowData([]);
            rowSelect()
        }

    });
    
}

var allDataP = "";
function getAllPatientsDetailsProcessing(id) {
    
	agGrid.simpleHttpRequest({
        url: "radiology-test-view?id=" + id
    }).then(function(response) {
        var jsonData = JSON.parse(response?.body);
        allDataP = jsonData?.patientDetails;
		
        if (allDataP && allDataP.length > 0) {
        	
        	let filteredData = allDataP.filter(f => f.action !== 2);
        	if(filteredData?.length === allDataP?.length) {
        		$("#approveBtn").hide();
        	} else {
        		let selectedRows = gridOptions.api.getSelectedRows();
        		if(selectedRows && selectedRows.length > 0) {
        			if(selectedRows[0]?.approved == 1) {
        				$("#approveBtn").hide();
        			} else {
        				$("#approveBtn").show();
        			}
        		} else {
        			$("#approveBtn").hide();
        		}
        	}
        	
            gridOptionsProcessing.api.setRowData(allDataP);
        } else {
            gridOptionsProcessing.api.setRowData([]);
        }

    });
	
}


var patientId = '';
var pName = '';
var customerId = '';

function rowSelect() {
    var selectedRows = gridOptions.api.getSelectedRows();
    var selectedData = selectedRows.map(node => node.data);
    var rowCount = 0;
    selectedData.forEach(function(selectedRow, index) {
        rowCount = rowCount + 1;
    });

    for (var i = 0; i < selectedRows.length; i++) {
        patientId = patientId + selectedRows[i].cust_id;
        pName = pName + selectedRows[i].cust_name;
    }
    
    $("#patientId").val('')

    $("#lab-container").empty();
    $("#pName").text(pName);
    $("#proceedPayBtn").hide()
    if (rowCount > 0) {
    	
    	$('.patDiv').hide();
    	disableAllFields()
    	$("#resetAppBtn,#saveNewPatBtn,.tst").hide();
    	getPatientAndTestDetails(selectedRows[0].test_id);
    	if(selectedRows[0].pay_status == 'Fully Paid') {
    		$('.pay-tab,.report-tab').show();
    		$("#processingTab").show()
    		nextTab('processingTabLi')
    		getAllPatientsDetailsProcessing(selectedRows[0].test_id)
    	} else {
    		$('.pay-tab,.report-tab').hide();
    		$("#processingTab").hide()
    		if(selectedRows[0].invoice_id) {
    			$('.pay-tab').show();
    			nextTab('paymentDetailLi')
    		} else {
    			nextTab('registrationTabLi')
    			$("#proceedPayBtn").show()
    		}
    	}
    	
    	if(selectedRows[0]?.approved == 1) {
    		$("#approveBtn").hide()
    	} else {
    		$("#approveBtn").show()
    	}
    	
    } else {
        $("#pName").text('');
        gridOptionsProcessing.api.setRowData([]);
        nextTab('registrationTabLi')
        newPatient()
    }

    patientId = '';
    pName = '';
    customerId = '';

}

function rowSelectProcessing() {
    
	var selectedRows = gridOptionsProcessing.api.getSelectedRows();
    
    var rowCount = 0;
    selectedRows.forEach(function(selectedRow, index) {
        rowCount = rowCount + 1;
    });
    
}

function approveByDoctor() {
	let dataset = [];
	gridOptionsProcessing.api.forEachNode(function (node) {
	    let d = node.data;
	    let obj = {};
	    
	    obj.key = d.orderId;
	    obj.data = d.testId;
	    obj.code = d.skuId;
	    
	    dataset.push(obj)
	});
	
	$('.loader').show();
    $("body").addClass("overlay");
	
	$.ajax({
        type: "POST",
        url: "radiology-approve-test-report",
        contentType: "application/json",
        data: JSON.stringify(dataset),
        success: function(response) {
            if (response.code == "success") {
                $('.loader').hide();
                $("body").removeClass("overlay");
                let selectedRows = gridOptions.api.getSelectedRows();
                let selectedBookId = '';
                if(selectedRows && selectedRows.length > 0) {
                	selectedBookId = selectedRows[0]?.test_id;
                	getAllPatientsDetails(selectedBookId)
                }
                
                toastr.success('Result approved successfully');
                
            } else {
                $('.loader').hide();
                $("body").removeClass("overlay");
            }

        },
        error: function(datas) {
            console.log(datas)
            $('.loader').hide();
            $("body").removeClass("overlay");
        }
    })
}

</script>
</head>
<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid ">
			<div class="d-flex">
				<div class="maincontentsec">
					<div id="main_content">
						<div class="tab-content">

							<div id="ipd" class="tab-pane active">
								<div class="d-flex flex-column flex-lg-row">
									<div class="box-sec" id="collapseWidthR1">
										<div class="out-box">

											<div class="d-flex justify-content-between bdr-line p-2">
												<div class="col-md-8 col-12">
													<div class="d-flex search-sec flxwrap">
														<input class="form-control me-2" type="text"
															placeholder="Search" id="quickFilter" autocomplete="off">
														<button class="btn go-btn" type="button"
															onclick="onQuickFilterChanged()">Go</button>
														<button class="btn go-btn" type="reset" onclick="resetList()">Reset</button>
													</div>
												</div>
												<button class="btn btn-primary max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>

											</div>
											<div class="card p-2 m-2">
												<div id="myGrid" style="width: 100%; height: 80vh;"
													class="ag-theme-alpine"></div>
											</div>
										</div>
									</div>


									<div class="box-sec" id="collapseWidthL1">
										<div class="out-box">
											<div
												class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
												<button class="btn btn-primary max-btn"
													id="collapseButtonL1" type="button"
													onclick="triggerExpansionL(1)" data-bs-toggle="tooltip"
													data-bs-placement="top" title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
												</button>

												<!--Right Inner Tab Start-->
											
													<ul class="nav nav-pills newtab" role="tablist">
														<li class="nav-item" id="registrationTabLi"><a
															class="nav-link text-nowrap" data-bs-toggle="pill"
															href="#registrationTab">Registration</a></li>
														<li class="nav-item pay-tab" id="paymentDetailLi"><a
															class="nav-link text-nowrap" data-bs-toggle="pill"
															href="#paymentDetail">Payment</a></li>
														<li class="nav-item report-tab" id="processingTabLi"><a
															class="nav-link text-nowrap active" data-bs-toggle="pill"
															href="#processingTab">Report</a></li>

													</ul>
										
											</div>



											<div class="tab-content flex-fill h-25">
												<div id="registrationTab" class="tab-pane p-2 h-100">
													<div th:replace="his/his-inner-patient-regs :: his-inner-patient-regs"></div>
												</div>
												<div id="paymentDetail" class="tab-pane p-2 h-100">
													<div th:replace="his/his-billing-2 :: his-billing-2"></div>
												</div>
												<div id="processingTab"
													class="tab-pane show active p-2 h-100">
													<div class="requisition-tbl d-flex flex-column h-100">
														<div class="mb-2">
															<input type="hidden" id="pID1">
															<table class="table table-bordered mb-0" width="100%">
																<tr valign="middle">
																	<td width="50%"><strong id="pName"></strong></td>
																	<td>
																		<div class="d-flex justify-content-end gap-2">
																			<div class="">
																				<button id="bookAppBtn" class="btn edit-btn bk-app"
																					onclick="bookAppointment()" type="button">Book Appointment</button>
																			</div>
																			<div class="">
																				<button id="approveBtn" class="btn edit-btn"
																					onclick="approveByDoctor()" type="button">Approve</button>
																			</div>
																		</div>
																	</td>
																</tr>
															</table>
														</div>
														<div class="card p-2">
															<div id="myGridProcessing" style="height: 400px;"
																class="ag-theme-alpine"></div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
