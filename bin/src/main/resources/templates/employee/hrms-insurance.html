<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- <link rel="stylesheet" href="../css/hrms/insurance.css"> -->
<script type="text/javascript" src="../javaScript/hrms/insurance.js"></script>
<style>
input[name=inlineRadioOptions]:checked:disabled {
	background-color: #0d6efd !important;
	border-color: #0d6efd !important;
}
.disabled-icon {
    pointer-events: none;
    opacity: 0.5;
    cursor: not-allowed;
}
.picker_calendar{
	top: 40px;
 }
</style>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition ">
			<div class="tab-content">
				<div id="reception" class="tab-pane active">
					<div class="d-flex flex-column flex-lg-row">
						<div class="box-sec" id="collapseWidthR1">
							<div class="out-box">
					
								<div class="d-flex justify-content-between p-2 gap-3 bdr-line">

									<div class="col-md-8 col-12">
										<div class="d-flex gap-2 search-sec position-relative">
													<input class="form-control" type="text"
														onkeydown="enterToSearch(event)" placeholder="Search"
														id="quickFilter" autocomplete="off">
													<button class="btn go-btn" type="button"
														onclick="onQuickFilterChanged()">Go</button>
													<button class="btn go-btn" type="button"
														onclick="reset()">Reset</button>
												</div>
									</div>

									<div class="d-flex justify-content-end">
										<button class="btn max-btn"
											id="collapseButtonR1" onclick="triggerExpansionR(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
										</button>
									</div>
									</div>
							<div class="card  p-2 m-2">
											<div id="myGridEmployee" style="width: 100%; height: 100vh;"
												class="ag-theme-alpine"></div>
										</div>
							</div>
						</div>
						<div class="box-sec" id="collapseWidthL1">
							<div class="out-box">
								
								<div class="d-flex justify-content-between flex-row-reverse p-2 bdr-line">
									<button class="btn max-btn" id="collapseButtonL1" type="button"
										onclick="triggerExpansionL(1)" data-bs-toggle="tooltip"  title="Expand">
										<i class="fa-solid fa-maximize" id="expandIconL1"></i>
										<i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
									  </button>
									<!--Right Inner Tab Start-->
									<ul class="nav nav-pills newtab" role="tablist">
										<li class="nav-item "><a class="nav-link active"
											data-bs-toggle="pill" href="#basic"
											onclick="activityTabs('basic');">Basic</a></li>
	
										<li class="nav-item "><a class="nav-link text-nowrap"
											data-bs-toggle="pill" href="#employeeDetails"
											onclick="activityTabs('employeeDetails');">Nominee</a></li>
									</ul>
								</div>

								<!-- Tab panes -->
								<div class="tab-content flex-fill">
									<div id="basic" class="tab-pane fade active show p-2 h-100">
										<div class="requisition-tbl d-flex flex-column h-100 gap-2">

											<!--<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tr valign="middle">
													<td width="70%"><span class="head-user-name"
																id="employeeNameTop1"></span></td>													
														<td>
															<div class="d-flex justify-content-end">															
																<div class="mr-0">
																	<button id="next" class="btn  edit-btn"
																		onclick="next()" type="button">Next</button>
																</div>														
															</div>

														</td>
													</tr>
												</table>
											</div>-->

                      <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                        <div class="project-name"><span class="head-user-name" id="employeeNameTop1"></span></div>
                        <div class="d-flex justify-content-end w-100 flex-wrap gap-2 flex-1">
                          <button id="next" class="btn m-0 edit-btn"
                                  onclick="next()" type="button">Next</button>
                        </div>
                      </div>

                      <div class="card p-2">
                        <div class="col-md-12 form-top">
                          <div class="row">
                            <div class="col-lg-4">
                              <div class="form-group">
                                <label>Employee Id:</label>
                                <input type="text" id="employeeId" class="form-control"readonly>
                              </div>
                            </div>

                            <div class="col-lg-4">
                              <div class="form-group">
                                <label>Employee Name: </label> <input type="text"
                                                                      id="firstName" class="form-control"readonly>
                              </div>
                            </div>
                            <div class="col-lg-4">
                              <div class="form-group  calendar_box"
                                   oninput="validateFields()">
                                <label>Date Of Birth</label>
                                <input type="text" id="dob"
                                       class="form-control" onblur="removeValid(event)"
                                       th:attr="onkeyup=|formatDate('dateOfBirth','${session.DATEFORMAT_JS}')|"readonly>
                              </div>
                            </div>

                            <div class="col-lg-4">
                              <div class="form-group">
                                <label>Department:</label> <input type="text" id="department"
                                                                  class="form-control"readonly>
                              </div>
                            </div>
                            <div class="col-lg-4">
                              <div class="form-group">
                                <label>Mobile:</label> <input type="text" id="mobileNo"
                                                              class="form-control"readonly>
                              </div>
                            </div>
                            <div class="col-lg-4">
                              <div class="form-group">
                                <label>Email:</label> <input type="text" id="personalMail"
                                                             class="form-control"readonly>
                              </div>
                            </div>


                            <div class="col-12">
                              <div class="form-group">
                                <label>Insurance Type:<span class="mandatory">*</span></label>

                              </div>
                              <div id="insuranceTypeData">
                                <!-- <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio"
                                      name="inlineRadioOptions" id="inlineRadio1"
                                      value="TI001" onchange="grtDtls(this.value)"> <label
                                      class="form-check-label" for="inlineRadio1">Health Insurance</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio"
                                      name="inlineRadioOptions" id="inlineRadio2"
                                      value="TI002" onchange="grtDtls(this.value)"> <label
                                      class="form-check-label" for="inlineRadio2">Auto Insurance</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio"
                                      name="inlineRadioOptions" id="inlineRadio3"
                                      value="TI003" onchange="grtDtls(this.value)"> <label
                                      class="form-check-label" for="inlineRadio3">Crop Insurance</label>
                                  </div> --></div>
                            </div>
                            <div class="col-lg-4">
                              <div class="form-group">
                                <input type="hidden" id="insuranceId">
                                <input type="hidden" id="insuranceTypeId">
                                <input type="hidden" id="employeeIdInsurance">
                                <label>Insurance Name</label>
                                <input type="text" id="insuranceName"
                                       class="form-control"readonly>
                              </div>
                            </div>
                            <div class="col-lg-4">
                              <div class="form-group">
                                <label>Insurance Provider:</label> <input type="text" id="insuranceProvider"
                                                                          class="form-control"readonly>
                              </div>
                            </div>
                            <div class="col-lg-4">
                              <div class="form-group">
                                <label>Insured Amount:</label> <input type="text" id="insuredAmount"
                                                                      class="form-control"readonly>
                              </div>
                            </div>

                            <div class="col-md-4 mt-4">
                              <div class="form-group calendar_box">
                                <label>From Date</label> <input type="text" id="fDate"
                                                                class="form-control" onblur="removeValid(event)"
                                                                th:attr="onkeyup=|formatDate('fDate','${session.DATEFORMAT_JS}')|"> <i
                                   class="ti-calendar picker_calendar"
                                   id="fromDateCalendar" onchange="dateChange()"></i>
                              </div>
                            </div>

                            <div class="col-md-4 mt-4">
                              <div class="form-group calendar_box">
                                <label>To Date</label> <input type="text" id="tDate"
                                                              class="form-control" onblur="removeValid(event)"
                                                              th:attr="onkeyup=|formatDate('tDate','${session.DATEFORMAT_JS}')|"> <i
                                   class="ti-calendar picker_calendar"
                                   id="toDateCalendar" onchange="dateChange()"></i>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
										</div>
									</div>


									<div id="employeeDetails" class="tab-pane fade hidden p-2 h-100">
										<div class="requisition-tbl d-flex flex-column h-100 gap-2">
										<!--<div class="mb-2">
											<table class="table table-bordered mb-0" width="100%">
												<tr valign="middle">	
												    <td width="70%"><span class="head-user-name"
																id="employeeNameTop"></span></td>												
													<td>
														<div class="d-flex justify-content-end">

															<div class="mr-2">
																<button id="prev" class="btn  edit-btn" onclick="prev()"
																	type="button">Prev</button>
															</div>
															<div class="mr-0">
																<button id="save" class="btn  edit-btn"
																	onclick="masterSaveInsurance()" type="button">Save</button>
																	
															</div>
														</div>

													</td>
												</tr>
											</table>
										</div>-->

                      <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                        <div class="project-name"><span class="head-user-name" id="employeeNameTop"></span></div>
                        <div class="d-flex justify-content-end w-100 flex-wrap gap-2 flex-1">
                          <button id="prev" class="btn m-0 edit-btn" onclick="prev()"
                                  type="button">Prev</button>
                          <button id="save" class="btn m-0 edit-btn"
                                  onclick="masterSaveInsurance()" type="button">Save</button>
                        </div>
                      </div>

										<!--Doctor and Department Details-->
										<div class="card p-2">
											<div class="row form-top " id="employeeDetails">
										<div>
											<div class="row form-top" id="employeeDetails">
											
														<div class="mandatory-txt text-end">
															Note: All fields marked with <span>*</span> are
															mandatory.
														</div>

														<div class="d-flex gap-2 task-btn-sec justify-content-end mb-2">
													<button
														class="btn max-btn br-m-btn"
														title="Add" id="add" onclick="addInsurance()">
														<i class="fa fa-plus-square" aria-hidden="true"></i>
													</button>
															<button
																class="btn max-btn br-m-btn"
																title="Edit" id="edit" onclick="editInsurance()">
																<i class="fa fa-pencil-square" aria-hidden="true"></i>
															</button>

															<button
																class="btn max-btn br-m-btn"
																title="Delete" id="deleteChild"
																onclick="deleteInsurance()">
																<i class="fa fa-trash"></i>
															</button>
															<button class="btn m-0 edit-btn br-s-btn m-0" type="button" id="saveTableData" onclick="masterSaveNomine()">Save</button>
																<button class="btn m-0 edit-btn br-s-btn m-0"
																	type="button" id="cancelData" onclick="cancelInsurance()" title="cancelData">Cancel</button>													
														</div>

												<div id="activity" style="height: 160px;"
													class="ag-theme-alpine"></div>
												<div class="collapse" id="demo">
													<div class="row">												
														<div class="col-lg-4">
															<div class="form-group">
															<input type="hidden" id="employeeIdNomine">
															<input type="hidden" id="nomineId">
																<label>Insured Name:<span class="mandatory">*</span></label> <input type="text" id="insuredName"
																	class="form-control">
															</div>
														</div>
																<div class="col-lg-4">
																<div class="form-group  calendar_box">
																	<label>Date Of Birth <span class="mandatory">*</span></label>
																	<input type="text" id="dateOfBirth" oninput="calculateAges()"
																		class="form-control" onblur="removeValid(event)"
																		th:attr="onkeyup=|formatDate('dateOfBirth','${session.DATEFORMAT_JS}')|">
																	<i class="ti-calendar picker_calendar"
																		id="DateCalendar" onchange="calculateAges()"></i>
																</div>
															</div>
															<div class="col-lg-4">
																<div class="form-group">
																	<label>Age</label> <input type="text" id="age"
																		class="form-control" maxlength="3" readonly>
																</div>
															</div>
															
																<div class="col-md-4">
															<div class="form-group">
																<label>Relation <span class="mandatory">*</span></label> <select id="depRelation"
																	class="form-select">
																	<option th:value="NULL">Select Relation</option>
																	<option th:each="c,iter:${getRelationList}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select>
															</div>
														</div>											
													</div>
												</div>

											</div>
										</div>

											</div>
										</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
