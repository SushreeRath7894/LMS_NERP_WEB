<head>
<style type="text/css">
.vital-card {
	border: 1px solid #ddd;
	border-radius: 8px;
	padding: 16px;
	margin-bottom: 16px;
	flex-grow: 1;
	position: relative;
	transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s
		ease-in-out;
}

.vital-card:hover {
	transform: translateY(-5px);
	box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
}

.edit-icon {
	position: absolute;
	top: 8px;
	right: 8px;
	color: rgb(191, 5, 255);
	font-size: 16px;
	cursor: pointer;
	text-decoration: none;
}

.timeline-line {
	background-color: rgb(191, 5, 255);
	width: 2px;
	height: 100%;
	position: absolute;
	left: 0;
	top: 20px;
}

.timeline-circle {
	background-color: rgb(191, 5, 255);
	width: 10px;
	height: 10px;
	position: absolute;
	left: -5px;
	top: 10px;
	border-radius: 50%;
}

.hide {
	display: none;
}

.no-treatment-message {
	background-color: rgb(191, 5, 255);
	color: white;
	text-align: center;
	padding: 15px;
	border-radius: 8px;
	font-weight: bold;
}

.view-details {
	color: rgb(191, 5, 255);
}

.date-time {
	color: #6c757d !important;
	left: auto !important;
}

.btn-close-det {
	color: rgb(191, 5, 255);
}

.index-circle {
	display: inline-flex;
	justify-content: center;
	align-items: center;
	width: 24px;
	height: 24px;
	font-size: 14px;
	font-weight: bold;
	color: white;
	background-color: rgb(191, 5, 255); /* Purple Background */
	border-radius: 50%;
	margin-right: 8px;
}

.view-test-details {
	color: rgb(191, 5, 255);
}

.line-height {
	line-height: 5px;
}

.view-diet-details {
	color: rgb(191, 5, 255);
}

.fa-eye {
	position: absolute;
	top: 10px;
	right: 16px;
}

.top-margin {
	margin-top: 10px;
}

.symptom-card:hover {
	transform: translateY(-5px);
	box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
}

.timeline-circle-sym {
	background-color: rgb(191, 5, 255);
	width: 10px;
	height: 10px;
	position: absolute;
	left: -5px;
	top: 10px;
	border-radius: 50%;
}
</style>
