<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style>
.hvrbox .hvrbox-layer_top {
	opacity: 0;
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	width: 25%;
	height: 100%;
	background: rgba(0, 0, 0, 0.3);
	color: #fff;
	padding: 15px;
}

.btn1 {
	border: none;
	border-radius: 4px;
	font-size: 13px!important;
	background-color: #5784c4;
	color: #fff !important;
	margin-left: 5px;
	margin-bottom: 8px;
	width: 150px;
	height: 33px;
	line-height: 12px;
	float: right;
	text-transform: uppercase;
	cursor: pointer;
}

.taskInfo {
	padding-left: 10px;
	color: #0c63e4;
}

.rating {
	float: left;
}

.rating:not(:checked )>input {
	position: absolute;
	top: -9999px;
	clip: rect(0, 0, 0, 0);
}

.rating:not(:checked )>label {
	float: right;
	width: 1em;
	padding: 0 .1em;
	overflow: hidden;
	white-space: nowrap;
	cursor: pointer;
	font-size: 200%;
	line-height: 1.2;
	color: rgba(0, 0, 0, 0.6);
	/*  text-shadow:1px 1px #bbb, 2px 2px #666, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked )>label:before {
	content: '★ ';
}

.rating>input:checked ~ label {
	color: #ea0;
	/*  text-shadow:1px 1px #c60, 2px 2px #940, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked )>label:hover, .rating:not(:checked )>label:hover 
	 ~ label {
	color: black;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>input:checked+label:hover, .rating>input:checked+label:hover ~
	label, .rating>input:checked ~ label:hover, .rating>input:checked ~
	label:hover ~ label, .rating>label:hover ~ input:checked ~ label {
	color: #ea0;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>label:active {
	position: relative;
	top: 2px;
	left: 2px;
}

.btn-outline-primary {
	color: #007bff;
	background-color: rgb(240 243 241/ 90%);
	background-image: none;
	border-color: #007bff;
	cursor: pointer;
}

.picker_calendar5 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 742px;
}

.picker_calendar6 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 1132px;
}

.btnbill {
	position: absolute;
	right: 70px;
	margin-top: -50px;
	z-index: 999;
}

.btn-primarynew {
	color: #fff !important;
	background-color: #0d6efd;
	border-color: #0d6efd;
}

.formValidation1 {
	font-size: 10px;
	font-weight: 100;
	color: #ff9e99;
	background-color: transparent;
	position: relative;
	top: -1px;
	padding: 3px 0;
}
</style>
<script>

$(document).ready(function(){
	$("#otpvalue").attr("disabled", "disabled");
})

var passwordValid;

function passwordVal() {
	var password = $('#dealerPassword').val();
	var password2 = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
	if (password != '') {
		if (password2.test(password)) {

			$("#error10").hide();

			passwordValid = true;
			return true;
		} else {

			$("#error10").html(
					"please enter  password with 8 characters having atleast one special character,one small letter, one large letter and one number");
			$("#error10").show();
			passwordValid = false;
			return false;
		}
	} else {
		$("#error10").html(" Password Required");

		passwordValid = false;
		return false;
	}

}


var passwordValid1;

function passwordVal1() {
	var password = $('#dealerConfirmPassword').val();
	var password2 = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
	if (password != '') {
		if (password2.test(password)) {

			$("#error11").hide();

			passwordValid1 = true;
			return true;
		} else {

			$("#error11").html(
					"please enter  password with 8 characters having atleast one special character,one small letter, one large letter and one number");
			$("#error11").show();
			passwordValid1 = false;
			return false;
		}
	} else {
		$("#error11").html(" Password Required");

		passwordValid = false;
		return false;
	}

}

var validation = true;
function updatePassword(){
	
	var password=$("#dealerPassword").val();
	var confirmPassword=$("#dealerConfirmPassword").val();
	if(password == confirmPassword){
		updatePass();
	}else{
		swal("Password mis-match!");
		return false;
		validation = false;
	}
	
	
}


function updatePass() {
	var otpvalue = $('#otpvalue').val();
	var obj = {};
	obj.dealerId = $('#userId').val();
	obj.dealerPassword = $('#dealerPassword').val();
	console.log("object on add-----------" + JSON.stringify(obj));
	//return false;


	var validation = true;
	
	if (obj.dealerPassword == null || obj.dealerPassword == "") {
		 	validation = false;
			$("#errmsg_password").css('color', 'red');
			$("#errmsg_password").css('font-size', '10px');
     		$("#errmsg_password").html("*Password Required").show().fadeOut(5000);
			return validation;
	}
	if (otpvalue == null || otpvalue == "") {
		 	validation = false;
			$("#errmsg_otp").css('color', 'red');
			$("#errmsg_otp").css('font-size', '10px');
     		$("#errmsg_otp").html("*OTP Required").show().fadeOut(5000);
			return validation;
	}


	if (validation) {
		$.ajax({
			type : "POST",
			url : "pos-change-password-updatePassword?otpvalue=" + otpvalue,
			contentType : "application/json",
			data : JSON.stringify(obj),
			success : function(response) {
				if (response.code == "Success") {
					console.log(response);
					
					swal("Password updated succesfully!", " ", "success");
					
					window.location.href = "/logout";


				}else{
					swal("Otp Mismatch","","error")
				}
			},
			error : function(data) {

				//console.log(data);
			}
		})
	}

}


function getOtp() {
	
	var userId = $("#userId").val();
	$('.loader').show();
	alert("otp")
	if (userId != '') {
		$.ajax({
			type : "GET",
			url : "pos-change-password-otp?userId=" + userId,
			async : false,
			success : function(response) {
				console.log(response)
				if (response.message == "Success") {
					$('.loader').hide();
					$("#otpvalue").removeAttr("disabled"); 
					swal("Otp sent successfully","","success")
					$("body").removeClass("overlay");
				} else {
					$('.loader').hide();
					swal("Otp mismatch","","error")
				}

			},
			error : function(data) {
			}
		});

	}

}


</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">



					<div id="demo">
						<div class="innercontent">
							<div class="innerstickybg">
								<div class="d-flex justify-content-between" id="main">

									<div>
										<span class="taskInfo">CHANGE PASSWORD</span> 
										
									</div>


									<div class="col-md-3 padding-0" align="right">
										
										<button class="btn1" id="save" onclick="updatePassword()">Update password</button>
										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
									</div>
								</div>
							</div>
							<div class="innercontent">


								<div class="row">

									<div class="col-md-6">
										<div class="form-group">
											<label>New Password</label> 
											<input type="password" class="form-control"
												id="dealerPassword" placeholder="New Password" onkeyup="passwordVal();">
											<span id="error10" class="formValidation1"></span>
											<span id="errmsg_password"></span>
										</div>
									</div>

								</div>
								<div class="row">
								
									<div class="col-md-6">
										<div class="form-group">
											<label>Confirm New Password</label> 
											<input type="password" class="form-control"
												id="dealerConfirmPassword" placeholder="Confirm New Password"
												onkeyup="passwordVal1();">
											<span id="error11" class="formValidation1"></span>
										</div>
									</div>
								
								</div>
								
								<div class="row mt-1">
									<div class="form-group">
										<label>OTP</label>
									</div>
								</div>
								
								<div class="row">
								
									<div class="col-lg-3">
										 <input type="text" id="otpvalue" class="form-control">	
										 <span id="errmsg_otp"></span>									
									</div>
									
									<div class="col-lg-2">
									<button class="btn3" id="otp" onclick="getOtp()" style="float:left!important;">Get Otp</button>												
									</div>
										
								
								</div>
								
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
