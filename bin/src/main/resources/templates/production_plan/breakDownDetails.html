<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Break Down Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
<style>
@page {
  size: A4 landscape;
  padding: 0;
  margin: 0;
}
table { width: 100%; font-family: sans-serif; border-collapse: collapse; }
table, th, td { border: 1px solid; }
table.borderless { border: 0; }

.m-0 { margin: 200; }
.align-middle { vertical-align: middle; }
.text-center { text-align: center; }
.text-nowrap { text-wrap: nowrap; }
.border-0, .border-0 th, .border-0 td { border: 0; }
.border-0 .border-right { border-right: 1px solid; }
.border-left-0 { border-left: 0; }
.border-right-0 { border-right: 0; }
.border-top, .border-top th, .border-top td { border-top: 1px solid; }
.ps-1 { padding-left: 10px; }
.pt-1 { padding-top: 10px; }
.mt-2 { margin-top: 20px; }

img { width: 120px; }
.fs-14p { font-size: 14px; }
.fw-bold { font-weight: 700; }

tbody td:first-child, tfoot td:first-child { border-left: 0; }
tbody td:last-child, tfoot td:last-child { border-right: 0; }
.h-pdf, .h-pdf td { height: 35px; }
tr.px-1 td { padding: 0 5px; }
.fs-12p { font-size: 12px; }
.text-start { text-align: left; }
</style>
</head>
<body>

<table class="borderless">
  <thead>
  <tr class="border-0">
    <th class="align-middle text-center" colspan="8">
 	<img class="m-0" th:src="${logo}" alt="oriFoodLogo" style="position: absolute; left: 5mm;  width:250px;" /> 
 	<h2 class="m-0"  th:text="${orgDivision}"></h2>
      <!-- <h2 class="m-0">ORIFOOD &amp; BEVERAGE PVT. LTD.</h2>
      <h3 class="m-0 text-nowrap">BREAK DOWN DETAILS</h3> -->
    </th>
  </tr>
  <tr class="h-pdf border-0"><td colspan="8"></td></tr>
  </thead>
  <tbody>
  <tr class="text-center fs-14p fw-bold">
    <td width="15%"><small>Machine Number</small></td>
    <td width="15%"><small>SKU</small></td>
    <td width="10%"><small>From Date</small></td>
    <td><small>From Time</small></td>
    <td width="10%"><small>To Date</small></td>
    <td><small>To Time</small></td>
    <td><small>Duration<br/>(HH:mm)</small></td>
    <td width="25%"><small>Remarks</small></td>
  </tr>
  <tr class="h-pdf fs-12p px-1 text-center" th:each="data1 : ${dtls}">
    <td th:text="${data1.mcName}">Track 1</td>
    <td th:text="${data1.sku}">HO1Q14A</td>
    <td th:text="${data1.fromDt}">08-10-2024</td>
    <td th:text="${data1.fromTime}">00:00</td>
    <td th:text="${data1.toDt}">08-10-2024</td>
    <td th:text="${data1.toTime}">00:00</td>
    <td th:text="${data1.duration}">12:00</td>
    <td class="text-start" th:text="${data1.mcRemark}">Lorem Ipsum ... Lorem Ipsum ... Lorem Ipsum ... Lorem Ipsum ... Lorem Ipsum ... Lorem Ipsum ... </td>
  </tr>
  </tbody>
</table>

</body>
</html>
