<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<style>
/* General Styles */
:root {
	--primary-color: #BF05FF;
	--secondary-color: #1e5eff;
	--background-light: #f9f9f9;
	--background-dark: #1a1a1a;
	--text-light: #333;
	--text-dark: #f9f9f9;
	--glass-bg: rgba(255, 255, 255, 0.1);
	--glass-border: rgba(255, 255, 255, 0.2);
	--shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
}

.top-header {
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
}

.add-experience:hover {
	background: #BA68C8;
	color: #fff;
	cursor: pointer;
	border: solid 1px #BA68C8
}

.bg-profile {
    background-color: #f8f8f8cc !important;
}

.logo{
        position:relative;
	  }	

	.logo img{
        width:130px;
	  }	

/* Progress Bar Styles */
@keyframes progress {
  0% { --percentage: 0; }
  100% { --percentage: var(--value); }
}

@property --percentage {
  syntax: '<number>';
  inherits: true;
  initial-value: 0;
}

.progress-circle {
  --percentage: var(--value);
  --primary: #c001ff;
  --secondary: #f1c9ff;
  --size: 170px; /* Adjusted size to fit profile image */
  animation: progress 2s 0.5s forwards;
  width: var(--size);
  aspect-ratio: 1;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
  margin: 0 auto; /* Center the progress circle */
}

.progress-circle::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: conic-gradient(var(--primary) calc(var(--percentage) * 1%), var(--secondary) 0);
  mask: radial-gradient(white 55%, transparent 0);
  mask-mode: alpha;
  -webkit-mask: radial-gradient(#0000 55%, #000 0);
  -webkit-mask-mode: alpha;
}

.progress-circle img {
  width: 80%; /* Adjust image size */
  height: 80%;
  border-radius: 50%;
  object-fit: cover;
  position: relative;
  z-index: 1;
}

/* Percentage Text Styles */
.profile-completion-text {
    text-align: center;
    margin-top: 10px;
    font-size: 34px;
    font-weight: bold;
    color: #bf01ff;
}

/* Profile Picture Update Button */
.profile-picture-update {
  text-align: center;
  margin-top: 10px;
}

.profile-picture-update label {
  cursor: pointer;
  color: var(--primary-color);
  font-weight: bold;
  text-decoration: underline;
}

.profile-picture-update input[type="file"] {
  display: none; /* Hide the file input */
}
.profile-sec h4{
	font-size:16px;
}

.prf-btn .btn-primary {
    background-color: #bf01ff;
    border:none;
}



</style>
</head>
<body>

	<nav class="navbar navbar-expand-lg navbar-light bg-light bdr-btm fixed-top top-header">

			<div class="d-flex justify-content-between align-items-center w-100">

				<div class="logo">
					<a class="navbar-brand" href="#"> <img src="../assets/images/web-nerp-logo.png" class="img-fluid" />
					</a>
				</div>

				<!-- Navbar Toggle for Mobile -->
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
					<span class="navbar-toggler-icon"></span>
				</button>

				<!-- Centered Navigation Links -->
				<!-- <div class="collapse navbar-collapse text-center" id="navbarNav">
					<ul class="navbar-nav mx-auto">
						<li class="nav-item"><a class="nav-link" href="#">Find Jobs</a></li>
						<li class="nav-item"><a class="nav-link" href="#">Applied Jobs</a></li>
					</ul>
				</div> -->

				<!-- User Avatar (Right) -->
				<a class="navbar-brand" href="javascript:void(0)"> <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8dXNlcnxlbnwwfHwwfHx8MA%3D%3D" alt="Avatar Logo" style="width: 40px;" class="rounded-pill">
				</a>
			</div>
		</div>
	</nav>

	<div class="container mt-4 profile-sec">
		<div class="row">
			<div class="container rounded mt-5 mb-5 bg-profile">
				<div class="row">
					<!-- Profile Image and Progress Bar -->
					<div class="col-md-3 border-right text-center p-3 py-5">
						<div class="progress-circle" id="profileCompletion" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="--value: 0">
							<img id="profileImage" src="https://st3.depositphotos.com/15648834/17930/v/600/depositphotos_179308454-stock-illustration-unknown-person-silhouette-glasses-profile.jpg" alt="Profile Image">
						</div>
						<!-- Percentage Text -->
						<div class="profile-completion-text" id="percentageText">0%</div>
						<!-- Profile Picture Update Button -->
						<div class="profile-picture-update">
							<label for="profilePictureInput">Update Profile Picture</label>
							<input type="file" id="profilePictureInput" accept="image/*">
						</div>
						<h5 class="font-weight-bold mt-3">Pankaj Kr.</h5>
						<span class="text-black-50">pankaj.kumar@gmail.com</span>
					</div>

					<!-- Personal Information Section -->
					<div class="col-md-9 border-right p-3 py-5 profile-sec">
						<h4 class="font-weight-bold">Personal Information</h4>
						<div class="row mt-3">
							<div class="col-md-6">
								<label class="labels">Name</label><input type="text" class="form-control profile-input" placeholder="First name" value="Pankaj">

							<div class="col-md-6">

							</div>

							</div>
							<div class="col-md-12 mt-2">
								<label class="labels">Address</label><input type="text" class="form-control profile-input" placeholder="Enter address">
							</div>
							<div class="col-md-6 mt-2">
								<label class="labels">Postcode</label><input type="text" class="form-control profile-input" placeholder="Enter postcode">
							</div>
							<div class="col-md-6 mt-2">
								<label class="labels">State</label><input type="text" class="form-control profile-input" placeholder="Enter state">
							</div>
							<div class="col-md-6 mt-2">
								<label class="labels">Country</label><input type="text" class="form-control profile-input" placeholder="Country">
							</div>
							<div class="col-md-6 mt-2">
								<label class="labels">Email</label><input type="text" class="form-control profile-input" placeholder="Enter email">
							</div>
						</div>
					</div>
				</div>

				<!-- Experience Section -->
				<div class="p-3 py-4 border-top">
					<h4 class="font-weight-bold">Experience</h4>
					<div class="row mt-3">
						<div class="col-md-12">
							<label class="labels">Experience in Designing</label><input type="text" class="form-control profile-input" placeholder="Enter experience details">
						</div>
						<div class="col-md-12 mt-2">
							<label class="labels">Additional Details</label><input type="text" class="form-control profile-input" placeholder="Additional details">
						</div>
					</div>
				</div>

				<!-- Skills Section -->
				<div class="p-3 py-4 border-top">
					<h4 class="font-weight-bold">Skills</h4>
					<div class="row mt-3">
						<div class="col-md-12">
							<label class="labels">Skill Set</label><input type="text" class="form-control profile-input" placeholder="Enter your skills">
						</div>
					</div>
				</div>

				<!-- Educational Information Section -->
				<div class="p-3 py-4 border-top">
					<h4 class="font-weight-bold">Educational Information</h4>
					<div class="row mt-3">
						<div class="col-md-12">
							<label class="labels">Education</label><input type="text" class="form-control profile-input" placeholder="Enter education details">
						</div>
					</div>
				</div>

				<!-- Resume Upload Section -->
				<div class="p-3 py-4 border-top">
					<h4 class="font-weight-bold">Resume</h4>
					<div class="row mt-3">
						<div class="col-md-12">
							<label class="labels">Upload Resume</label><input type="file" class="form-control profile-input">
						</div>
					</div>
				</div>

				<!-- Save Profile Button -->
				<div class="mt-4 text-center mb-3 prf-btn">
					<button class="btn btn-primary profile-button" type="button">Save Profile</button>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function calculateCompletion() {
			const inputs = document.querySelectorAll('.profile-input');
			let filled = 0;
			inputs.forEach(input => {
				if (input.value.trim() !== '') {
					filled++;
				}
			});
			let percentage = Math.round((filled / inputs.length) * 100);
			return percentage;
		}

		function animateProgressBar(targetPercentage) {
			const progressBar = document.getElementById('profileCompletion');
			const percentageText = document.getElementById('percentageText');
			let currentPercentage = 0;
			const interval = setInterval(() => {
				if (currentPercentage >= targetPercentage) {
					clearInterval(interval);
				} else {
					currentPercentage++;
					progressBar.style.setProperty('--value', currentPercentage);
					progressBar.setAttribute('aria-valuenow', currentPercentage);
					percentageText.textContent = `${currentPercentage}%`;
				}
			}, 20); // Adjust the speed of the animation by changing the interval time
		}

		// Calculate the initial percentage and animate the progress bar
		$(document).ready(function() {
			const percentage = calculateCompletion();
			animateProgressBar(percentage);
		});

		// Add event listeners to all input fields
		document.querySelectorAll('.profile-input').forEach(input => {
			input.addEventListener('input', () => {
				const percentage = calculateCompletion();
				const progressBar = document.getElementById('profileCompletion');
				const percentageText = document.getElementById('percentageText');
				progressBar.style.setProperty('--value', percentage);
				progressBar.setAttribute('aria-valuenow', percentage);
				percentageText.textContent = `${percentage}%`;
			});
		});

		// Allow users to update their profile picture
		document.getElementById('profilePictureInput').addEventListener('change', function(event) {
			const file = event.target.files[0];
			if (file) {
				const reader = new FileReader();
				reader.onload = function(e) {
					document.getElementById('profileImage').src = e.target.result;
				};
				reader.readAsDataURL(file);
			}
		});
	</script>
</body>
</html>
