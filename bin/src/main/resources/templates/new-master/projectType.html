<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="projectType">
<head>
<meta charset="UTF-8">
<script>
	var columnDefspCategory = [{
	        headerName: "Order",
	        field: "categoryOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Name",
	        field: "categoryName",
	        flex: 5,
	    }, {
	        headerName: "Status",
	        field: "categoryStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.categoryStatus == "Active") {
	                return '<div style="color:green">' + params.data.categoryStatus + '</div>';
	            } else {
	                return '<div>' + params.data.categoryStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptionsPType = {
		    columnDefs: columnDefspCategory,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionPType,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.categoryId;
			}
		};
	$(document).ready(() => {
		getpTypeData();
	})

	function onSelectionPType() {

	    var selectedNodes = gridOptionsPType.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    
	    if(selectedData && selectedData.length > 0) {
	    	$('#ptypeOrder').val(selectedData.map(node => node.categoryOrder));
		    $('#ptypeName').val(selectedData.map(node => node.categoryName));
		    $('#ptypeId').val(selectedData.map(node => node.categoryId));
		    $('#ptypeStatus').val(selectedData.map(node => node.categoryStatus));
		    
		    if (selectedData.map(node => node.categoryStatus) == "Active") {
		        $('#ptypeStatus').val("1");
		    } else if(selectedData.map(node => node.categoryStatus) == "") {
		    	$('#ptypeStatus').val("1");
		    } else {
		        $('#ptypeStatus').val("0");
		    }
		    $("#resetpTypeBtn").attr("disabled",true);
		    $("#deletepTypeBtn").attr("disabled",false);
	    }
	    
	}
	function enableFieldspType() {
		$('#ptypeOrder,#ptypeName,#ptypeStatus').attr('disabled',false);
	}
	function openAddSectionpType() {
		enableFieldspType();
		$('#ptypeId,#ptypeOrder,#ptypeName').val('');
		$('#ptypeStatus').val('1');
		$("#resetpTypeBtn").attr("disabled",false);
		$("#deletepTypeBtn").attr("disabled",true);
		gridOptionsPType.api.deselectAll();
	}
	function resetpType() {
		if(!$("#ptypeId").val()) {
			$('#ptypeId,#ptypeOrder,#ptypeName').val('');
			$('#ptypeStatus').val('1');
		}
	}

	function savepType() {
		
		/* if($("#categoryOrder").val() == null || $("#categoryOrder").val() == '') {
			toastr.error("Category order required");
			return;
		} */
		if($("#ptypeName").val() == null || $("#ptypeName").val() == '') {
			toastr.error("Type name required");
			return;
		}
		if($("#ptypeStatus").val() == null || $("#ptypeStatus").val() == '') {
			toastr.error("Type status required");
			return;
		}

	    var data19 = {};

	    data19.categoryId = $("#ptypeId").val();
	    data19.categoryOrder = $("#ptypeOrder").val();
	    data19.categoryName = $("#ptypeName").val();
	    data19.categoryStatus = $("#ptypeStatus").val();
	    data19.type = "ptype";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getpTypeData();
	            	resetpType();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deletepType() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#ptypeId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-data?id=" + id + "&type=ptype" ,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getpTypeData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	function getpTypeData() {
		agGrid.simpleHttpRequest({
            url: '/configuration/view-master-data?type=ptype'
        }).then(function(data) {
        	let dataSet = [];
	        if (data.length > 0) {
	        	gridOptionsPType.api.setRowData(data);
	        	gridOptionsPType.api.getRowNode(data[0].categoryId).setSelected(true);
	        } else {
	        	$("#ptypeName,#ptypeStatus").attr("disabled",false);
	        	$('#ptypeId,#ptypeOrder,#ptypeName').val('');
				$('#ptypeStatus').val('1');
	        	gridOptionsPType.api.setRowData(dataSet);
	        	$("#deletepTypeBtn").attr("disabled",true);
	        }
        });
		$('#ptypeOrder,#ptypeName,#ptypeStatus').attr('disabled',true);
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridpType');
	    new agGrid.Grid(gridDiv, gridOptionsPType);
	})
</script>
</head>
<body>
	<h6>Project Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionpType()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldspType()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletepTypeBtn" class="btn  edit-btn"
								onclick="deletepType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridpType" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Project Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="savepType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetpTypeBtn" class="btn  edit-btn" onclick="resetpType()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="ptypeOrder">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="ptypeName"> <input
					type="hidden" id="ptypeId">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="ptypeStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
