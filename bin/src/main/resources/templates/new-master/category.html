<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="category">
<head>
<meta charset="UTF-8">
<script>
	var columnDefsCategory = [{
	        headerName: "Order",
	        field: "categoryOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Category Name",
	        field: "categoryName",
	        flex: 5,
	    }, {
	        headerName: "Status",
	        field: "categoryStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.categoryStatus == "Active") {
	                return '<div style="color:green">' + params.data.categoryStatus + '</div>';
	            } else {
	                return '<div>' + params.data.categoryStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptionsCategory = {
		    columnDefs: columnDefsCategory,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionCategory,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.categoryId;
			}
		};
	$(document).ready(() => {
		getCategoryData();
	})

	function onSelectionCategory() {

	    var selectedNodes = gridOptionsCategory.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    
	    if(selectedData && selectedData.length > 0) {
	    	$('#categoryOrder').val(selectedData.map(node => node.categoryOrder));
		    $('#categoryName').val(selectedData.map(node => node.categoryName));
		    $('#categoryId').val(selectedData.map(node => node.categoryId));
		    $('#categoryStatus').val(selectedData.map(node => node.categoryStatus));
		    
		    if (selectedData.map(node => node.categoryStatus) == "Active") {
		        $('#categoryStatus').val("1");
		    } else if(selectedData.map(node => node.categoryStatus) == "") {
		    	$('#categoryStatus').val("1");
		    } else {
		        $('#categoryStatus').val("0");
		    }
		    $("#resetCategoryBtn").attr("disabled",true);
		    $("#deleteCatBtn").attr("disabled",false);
	    }
	    
	}
	function enableFieldsCat() {
		$('#categoryOrder,#categoryName,#categoryStatus').attr('disabled',false);
	}
	function openAddSectionCat() {
		enableFieldsCat();
		$('#categoryId,#categoryOrder,#categoryName').val('');
		$('#categoryStatus').val('1');
		$("#resetCategoryBtn").attr("disabled",false);
		$("#deleteCatBtn").attr("disabled",true);
		gridOptionsCategory.api.deselectAll();
	}
	function resetCategory() {
		if(!$("#categoryId").val()) {
			$('#categoryId,#categoryOrder,#categoryName').val('');
			$('#categoryStatus').val('1');
		}
	}

	function saveCategory() {
		
		/* if($("#categoryOrder").val() == null || $("#categoryOrder").val() == '') {
			toastr.error("Category order required");
			return;
		} */
		if($("#categoryName").val() == null || $("#categoryName").val() == '') {
			toastr.error("Category name required");
			return;
		}
		if($("#categoryStatus").val() == null || $("#categoryStatus").val() == '') {
			toastr.error("Category status required");
			return;
		}

	    var data19 = {};

	    data19.categoryId = $("#categoryId").val();
	    data19.categoryOrder = $("#categoryOrder").val();
	    data19.categoryName = $("#categoryName").val();
	    data19.categoryStatus = $("#categoryStatus").val();
	    data19.type = "category";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getCategoryData();
	            	resetCategory();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deleteCategory() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#categoryId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-data?id=" + id + "&type=category" ,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getCategoryData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	function getCategoryData() {
		agGrid.simpleHttpRequest({
            url: '/configuration/view-master-data?type=category'
        }).then(function(data) {
        	let dataSet = [];
	        if (data.length > 0) {
	        	gridOptionsCategory.api.setRowData(data);
	        	gridOptionsCategory.api.getRowNode(data[0].categoryId).setSelected(true);
	        } else {
	        	gridOptionsCategory.api.setRowData(dataSet);
	        	$("#deleteCatBtn").attr("disabled",true);
	        }
        });
		$('#categoryOrder,#categoryName,#categoryStatus').attr('disabled',true);
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridCategory');
	    new agGrid.Grid(gridDiv, gridOptionsCategory);
	})
</script>
</head>
<body>
	<h6>Category List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionCat()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsCat()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteCatBtn" class="btn  edit-btn"
								onclick="deleteCategory()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridCategory" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Category</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveCategory()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetCategoryBtn" class="btn  edit-btn" onclick="resetCategory()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="categoryOrder">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="categoryName"> <input
					type="hidden" id="categoryId">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="categoryStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
