<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="sacMstr">
<head>
<meta charset="UTF-8">
<style>
.wh-img {
	height: 50px;
	width: 50px;
	cursor: pointer;
}
.pd-10-0 {
	padding: 10px 0px;
	display: flex;
	align-items: center;
}
.remove-url {
	font-size: 30px;
    padding-left: 10px;
    cursor: pointer;
}
.disabled-rmv-btn {
    pointer-events: none;
    opacity: 0.5;
}
</style>
<script>
	var columnDefsSAC = [{
		headerName : "Sac Id",
		field : "sacId",
		width : 130,
		pinned: 'left',
		hide:true
	
	},{
		headerName : "Sac Name",
		field : "sacName",
		width : 140,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		headerName : "Service Name",
		field : "serviceName",
		width : 140,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		headerName : "GST",
		field : "sacGst",
		width : 140,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		headerName : "Effective Date",
		field : "fDate",
		width : 130,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		
		headerName : "Created By",
		field : "approvedBy",
		width : 150,
		cellStyle : {
			textAlign : 'center'
		},
		hide: true,
	}
	];
	var gridOptionsSAC = {
		    columnDefs: columnDefsSAC,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionSAC,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.sacId;
			}
		};
	$(document).ready(() => {
		getSACData();
	})
	
	function getSACData() {
		agGrid.simpleHttpRequest({
	        url: '/configuration/get-sac-list'
	    }).then(function(data) {
	    	let s = JSON.parse(data?.body[0]);
	        let dataSet = [];
	        if (s && s.length > 0) {
	            gridOptionsSAC.api.setRowData(s);
	            gridOptionsSAC.api.getRowNode(s[0].sacId).setSelected(true);
	        } else {
	            gridOptionsSAC.api.setRowData(dataSet);
	            $('#sacName,#serviceName,#sacGst,#fDate').val('');
	            $("#deleteSACBtn").attr("disabled",true);
	        }
	    });
		$('#sacName,#serviceName,#sacGst,#fDate').attr('disabled',true);
		$("#remove-btn").addClass("disabled-rmv-btn");
	}

	function onSelectionSAC() {

	    var selectedNodes = gridOptionsSAC.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    console.log("selectedData==================",selectedData)
	    if(selectedData && selectedData.length > 0) {
	    	
		    $('#sacId').val(selectedData.map(node => node.sacId));
		    $('#sacName').val(selectedData.map(node => node.sacName));
		    $('#serviceName').val(selectedData.map(node => node.serviceName));
		    $('#sacGst').val(selectedData.map(node => node.sacGst));
		    let fdate = selectedData.map(node => node.fDate)[0];
		    var parts = fdate.split("-"); // [dd, mm, yyyy]
		    var formattedDate = parts[2] + "-" + parts[1] + "-" + parts[0]; // yyyy-mm-dd

		    $('#fDate').val(formattedDate);
		    
		    $("#resetSACBtn").attr("disabled",true);
		    $("#deleteSACBtn").attr("disabled",false);
	    }

	}
	function enableFieldsSAC() {
		$('#sacName,#serviceName,#sacGst,#fDate').attr('disabled',false);
		$("#remove-btn").removeClass("disabled-rmv-btn");
	}
	function openAddSectionSAC() {
		enableFieldsSAC();
		$('#sacId,#sacName,#serviceName,#sacGst,#fDate').val('');
		
		$("#resetSACBtn").attr("disabled",false);
		$("#deleteSACBtn").attr("disabled",true);
		gridOptionsSAC.api.deselectAll();
		//$("#viewIngSectionId").hide();
		
	}
	function resetSAC() {
		if(!$("#sacId").val()) {
			$('#sacId,#sacName,#serviceName,#sacGst,#fDate').val('');
			
			
		}
	}

	function saveSAC() {
		
		if($("#sacName").val() == null || $("#sacName").val() == '') {
			toastr.error('Sac name required')
			return;
		}
		if($("#sacGst").val() == null || $("#sacGst").val() == '') {
			toastr.error('GST required')
			return;
		}
		
		
	    var data19 = {};

	    data19.sacId = $("#sacId").val();
	    data19.sacName = $("#sacName").val();
	    data19.serviceName = $("#serviceName").val();
		data19.sacGst = $("#sacGst").val();
		data19.fDate = $("#fDate").val();
	    data19.type = "SACType";
	    
	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message)
	            	getSACData();
	            } else {
	            	toastr.error(response.message)
	            }
	        },
	        error: function(response) {
	            console.log(response);
	            toastr.error("Something went wrong")
	        }
	    })
	}
	
	function deleteSAC() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {
	        	var id = $('#sacId').val();

	    	    $.ajax({
	    	        type: "GET",
	    	        url: "/configuration/delete-master-data?id=" + id + "&type=SAC",
	    	        dataType: "json",
	    	        contentType: "application/json",
	    	        success: function(response) {
	    	            if (response.code == "success") {
	    	            	getSACData();
	    	            	
	    	            	toastr.success('Data deleted successfully')
	    	            } else {
	    	            	toastr.error('Something went wrong')
	    	            }
	    	        },
	    	        error: function(response) {
	    	            console.log(response);
	    	            toastr.error('Something went wrong')
	    	        }
	    	    })
	        }
	    });
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridSAC');
	    new agGrid.Grid(gridDiv, gridOptionsSAC);
	    
	    
	})
 
</script>
</head>
<body>
	<h6>Sac List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionSAC()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsSAC()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteSACBtn" class="btn  edit-btn"
								onclick="deleteSAC()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridSAC" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Sac</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn" onclick="saveSAC()"
								type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetSACBtn" class="btn  edit-btn" onclick="resetSAC()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-3">
			<div class="form-group">
				<label>Sac Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="sacName"> <input type="hidden"
					id="sacId">
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Sac Service Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="serviceName"> 
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Sac GST <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="sacGst"> 
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group calendar_box">
				<label>Effective Date</label> <span class="mandatory">*</span></label> <input type="date"
					class="form-control transparenttxtbox" placeholder="date"
					id="fDate" >
			</div>
		</div>
		
	</div>
</body>
</html>
