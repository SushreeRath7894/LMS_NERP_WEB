<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="roomType">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>


<script>
$(document).ready(() => {
    var gridDiv = document.querySelector('#myGridRType');
    new agGrid.Grid(gridDiv, gridOptionsRType);

    getrTypeData();
})


var columnDefsRtype = [
/* {
    headerName: "Order",
    field: "categoryOrder",
    flex: 1,
    hide: true
}, */
{
    headerName: "Name",
    field: "categoryName",
    flex: 3,
},{
    headerName: "Desc",
    field: "categoryOrder",
    flex: 5,
}, {
    headerName: "Status",
    field: "categoryStatus",
    flex: 1,
    cellRenderer: function(params) {
        if (params.data.categoryStatus == "Active") {
            return '<div style="color:green">' + params.data.categoryStatus + '</div>';
        } else {
            return '<div>' + params.data.categoryStatus + '</div>';
        }
    }
}
];

var gridOptionsRType = {
	    columnDefs: columnDefsRtype,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    onSelectionChanged: onSelectionRType,
	    onRowClicked: (event) => {
	        const selectedNode = event.node;
	        if (!selectedNode.isSelected()) {
	            selectedNode.setSelected(true);
	        }
	    },
	    getRowNodeId : function(data) {
			return data.categoryId;
		}
	};
	
function getrTypeData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-master-data?type=rtype' 
    }).then(function(data) {
    	let dataSet = [];
        if (data.length > 0) {
        	gridOptionsRType.api.setRowData(data);
        	gridOptionsRType.api.getRowNode(data[0].categoryId).setSelected(true);
        } else {
        	$("#rtypeName,#rtypeStatus,#roomDesc").attr("disabled",false);
        	$('#rtypeId,#rtypeOrder,#rtypeName,#roomDesc').val('');
			$('#rtypeStatus').val('1');
			gridOptionsRType.api.setRowData(dataSet);
        	$("#deletepTypeBtn").attr("disabled",true);
        }
    });
	$('#rtypeOrder,#rtypeName,#rtypeStatus,#roomDesc').attr('disabled',true);
}

function enableFieldspType() {
	$('#rtypeOrder,#rtypeName,#rtypeStatus,#roomDesc').attr('disabled',false);
}
function openAddSectionpType() {
	enableFieldspType();
	$('#rtypeId,#rtypeOrder,#rtypeName,#roomDesc').val('');
	$('#rtypeStatus').val('1');
	$("#resetpTypeBtn").attr("disabled",false);
	$("#deletepTypeBtn").attr("disabled",true);
	gridOptionsRType.api.deselectAll();
}
function resetpType() {
	if(!$("#rtypeId").val()) {
		$('#rtypeId,#rtypeOrder,#rtypeName,#roomDesc').val('');
		$('#rtypeStatus').val('1');
	}
}


function saverType() {
	if($("#rtypeName").val() == null || $("#rtypeName").val() == '') {
		toastr.error("Type Name required");
		return;
	}
	if($("#rtypeStatus").val() == null || $("#rtypeStatus").val() == '') {
		toastr.error("Type status required");
		return;
	} 
	if($("#roomDesc").val() == null || $("#roomDesc").val() == '') {
		toastr.error("Bed Description is required");
		return;
	}

    var roomTypeData = {};

    roomTypeData.categoryId = $("#rtypeId").val();
    roomTypeData.categoryOrder = $("#rtypeOrder").val();
    roomTypeData.categoryName = $("#rtypeName").val();
    roomTypeData.categoryStatus = $("#rtypeStatus").val();
    roomTypeData.categoryDesc = $("#roomDesc").val();
    roomTypeData.type = "rtype";

    $.ajax({
        type: "POST",
        url: "/configuration/add-master-data",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(roomTypeData),
        success: function(response) {
            if (response.code == "success") {
            	toastr.success(response.message);
            	getrTypeData();
            	resetpType();
            } else {
            	toastr.error(response.message);
            }
        },
        error: function(response) {
        	toastr.error("Something went wrong");
            console.log(response);
        }
    })
}

function onSelectionRType() {

    var selectedNodes = gridOptionsRType.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#rtypeOrder').val(selectedData.map(node => node.categoryOrder));
	    $('#rtypeName').val(selectedData.map(node => node.categoryName));
	    $('#rtypeId').val(selectedData.map(node => node.categoryId));
	    $('#rtypeStatus').val(selectedData.map(node => node.categoryStatus));
	    $('#roomDesc').val(selectedData.map(node => node.categoryOrder));
	    
	    if (selectedData.map(node => node.categoryStatus) == "Active") {
	        $('#rtypeStatus').val("1");
	    } else if(selectedData.map(node => node.categoryStatus) == "") {
	    	$('#rtypeStatus').val("1");
	    } else {
	        $('#rtypeStatus').val("0");
	    }
	    $("#resetrTypeBtn").attr("disabled",true);
	    $("#deleterTypeBtn").attr("disabled",false);
    }
    
}


function deleterType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {

		    var id = $('#rtypeId').val();
	
		    $.ajax({
		        type: "GET",
		        url: "/configuration/delete-master-data?id=" + id + "&type=rtype" ,
		        dataType: "json",
		        contentType: "application/json",
		        success: function(response) {
		            if (response.code == "success") {
		            	toastr.success("Data deleted successfully")
		            	getrTypeData();
		            }
		        },
		        error: function(response) {
		            console.log(response);
		        }
		    })
        }
    });
}
</script>
</head>
<body>
	<h6>Room Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionpType()" type="button">
								<i class="fas fa-plus-circle"></i> Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldspType()">
								<i class="fas fa-edit"></i> Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletepTypeBtn" class="btn  edit-btn"
								onclick="deleterType()" type="button">
								<i class="fa fa-trash" aria-hidden="true"></i> Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridRType" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Room Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn" onclick="saverType()"
								type="button">
								<i class="fas fa-save"></i> Save</button>
						</div>
						<div class="mr-0">
							<button id="resetpTypeBtn" class="btn  edit-btn"
								onclick="resetpType()" type="button">
								<i class="fas fa-rotate-left"></i> Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="rtypeOrder">
			</div>
		</div>

		<div class="row">
		<div class="col">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="rtypeName"> <input type="hidden"
					id="rtypeId">
			</div>
		</div>
		<div class="col">
			<div class="form-group">
				<label>Room Desc <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Room Description" id="roomDesc">
			</div>
		</div>
		<div class="col">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="rtypeStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>

		
		</div>
	</div>
</body>
</html>
