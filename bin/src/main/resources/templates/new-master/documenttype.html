<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="documenttype">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>

var columnDefsDocumenttype = [

    {
        headerName: "Document Type",
        field: "documentId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Order",
        field: "documentOrder",
        flex: 1,
        width: 80,
        hide: true
    },
    {
        headerName: "Name",
        field: "documentName",
        width: 175,
        flex: 5,
    },
    {
        headerName: "Status",
        field: "documentStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.documentStatus == "Active") {
                return '<div style="color:green">' +
                    params.data.documentStatus + '</div>';
            } else {
                return '<div>' + params.data.documentStatus + '</div>';
            }
        }
    }
];

var gridOptionsDocumenttype = {
    columnDefs: columnDefsDocumenttype,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangeddocument,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId: function(data) {
        return data.documentId;
    }

};

$(document).ready(() => {
    getDocTypeData();
})

function getDocTypeData() {
    agGrid.simpleHttpRequest({
        url: '/configuration/referenceHr-view-document'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
            gridOptionsDocumenttype.api.setRowData(data);
            gridOptionsDocumenttype.api.getRowNode(data[0].documentId).setSelected(true);
        } else {
            gridOptionsDocumenttype.api.setRowData(dataSet);
            $("#deleteDocBtn").attr("disabled",true);
        }
    });
    $('#documentName,#documentOrder,#documentStatus').attr('disabled', true);
}

function onSelectionChangeddocument() {
    var selectedNodes = gridOptionsDocumenttype.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);

    if (selectedData.length > 0) {
        $('#documentOrder').val(selectedData.map(node => node.documentOrder));
        $('#documentName').val(selectedData.map(node => node.documentName));
        $('#documentId').val(selectedData.map(node => node.documentId));


        if (selectedData.map(node => node.documentStatus) == "Active") {
            $('#documentStatus').val("1");
        } else if (selectedData.map(node => node.documentStatus) == "") {
            $('#documentStatus').val("1");
        } else {
            $('#documentStatus').val("0");
        }
        
        $("#resetDocBtn").attr("disabled",true);
        $("#deleteDocBtn").attr("disabled",false);
    }

}

function enableFieldsDocument() {
    $('#documentOrder,#documentName,#documentStatus').attr('disabled', false);
}

function openAddSectionDocument() {
    enableFieldsDocument();
    $('#documentId,#documentOrder,#documentName').val('');
    $('#documentStatus').val('1');
    $("#resetDocBtn").attr("disabled",false);
    $("#deleteDocBtn").attr("disabled",true);
    gridOptionsDocumenttype.api.deselectAll();
}

function resetDocument() {
    if (!$("#documentId").val()) {
        $('#documentId,#documentOrder,#documentName').val('');
        $('#documentStatus').val('1');
    }
}


function saveDocument() {
	
	/* if($("#documentOrder").val() == null || $("#documentOrder").val() == '') {
		toastr.error('Document type order required');
		return;
	} */
	if($("#documentName").val() == null || $("#documentName").val() == '') {
		toastr.error('Document type name required');
		return;
	}
	if($("#documentStatus").val() == null || $("#documentStatus").val() == '') {
		toastr.error('Document type status required');
		return;
	}

    var data9 = {};

    data9.documentId = $("#documentId").val();
    data9.documentOrder = $("#documentOrder").val();
    data9.documentName = $("#documentName").val();
    data9.documentStatus = $("#documentStatus").val();

    $.ajax({
        type: "POST",
        url: "/configuration/referenceHr-add-document",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data9),
        success: function(response) {
            if (response.message == "Success") {
                if ($("#documentId").val() == null || $("#documentId").val() == "" || $("#documentId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
                getDocTypeData()
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteDocument() {
    
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
    	if (result?.value) {
    		var id = $('#documentId').val();

    	    $.ajax({
    	        type: "GET",
    	        url: "/configuration/referenceHr-document-delete?id=" + id,
    	        dataType: "json",
    	        contentType: "application/json",
    	        success: function(response) {
    	            if (response.message == "Success") {
    	                getDocTypeData()
    	                toastr.success('Data deleted successfully')
    	            }
    	        },
    	        error: function(response) {
    	            console.log(response);
    	        }
    	    })
    	}
    });
    
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid5');
    new agGrid.Grid(gridDiv, gridOptionsDocumenttype);
})
</script>
</head>
<body>
	<h6>Document Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionDocument()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsDocument()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteDocBtn" class="btn  edit-btn"
								onclick="deleteDocument()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid5" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Document Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveDocument()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetDocBtn" class="btn  edit-btn" onclick="resetDocument()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Order"
					id="documentOrder"> <input type="hidden" id="documentId">
			</div>
		</div>
		<div class="col-md-6">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="documentName">
			</div>
		</div>
		<div class="col-md-6">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="documentStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
