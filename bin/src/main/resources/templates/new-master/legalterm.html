<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="legalterm">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefslegalterm = [

    {
        headerName: "Legal Term Type",
        field: "legalTermId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "legalTermName",
        flex: 2,
        width: 80
    }, {
        headerName: "Description",
        field: "legalTermDesc",
        width: 175,
        flex: 3,
    }, {
        headerName: "Status",
        field: "legalTermStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.legalTermStatus == "Active") {
                return '<div style="color:green">' + params.data.legalTermStatus + '</div>';
            } else {
                return '<div>' + params.data.legalTermStatus + '</div>';
            }
        }
    }
];

var gridOptionslegalterm = {
    columnDefs: columnDefslegalterm,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedLegalterm,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId : function(data) {
		return data.legalTermId;
	}

};

$(document).ready(() => {

	getLegalTermData();
})

function getLegalTermData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-procurement-view-legal-term-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionslegalterm.api.setRowData(data);
        	gridOptionslegalterm.api.getRowNode(data[0].legalTermId).setSelected(true);
        } else {
        	gridOptionslegalterm.api.setRowData(dataSet);
        	$("#deleteLTermBtn").attr("disabled",true);
        }

    });
    
    $('#legalTermName,#legalTermDesc,#legalTermStatus').attr('disabled',true);
}

function onSelectionChangedLegalterm() {

    var selectedNodes = gridOptionslegalterm.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#legalTermName').val(selectedData.map(node => node.legalTermName));
        $('#legalTermDesc').val(selectedData.map(node => node.legalTermDesc));
        $('#legalTermId').val(selectedData.map(node => node.legalTermId));

        if (selectedData.map(node => node.legalTermStatus) == "Active") {
            $('#legalTermStatus').val("1");
        } else if(selectedData.map(node => node.legalTermStatus) == "") {
        	$('#legalTermStatus').val("1");
        } else {
            $('#legalTermStatus').val("0");
        }
        $("#resetLTermBtn").attr("disabled",true);
        $("#deleteLTermBtn").attr("disabled",false);
    }
}

function enableFieldslegalTerm() {
	$('#legalTermName,#legalTermDesc,#legalTermStatus').attr('disabled',false);
}
function openAddSectionlegalTerm() {
	enableFieldslegalTerm();
	$('#legalTermId,#legalTermName,#legalTermDesc').val('');
	$('#legalTermStatus').val('1');
	$("#resetLTermBtn").attr("disabled",false);
	$("#deleteLTermBtn").attr("disabled",true);
	gridOptionslegalterm.api.deselectAll();
}
function resetlegalTerm() {
	if(!$("#legalTermId").val()) {
		$('#legalTermId,#legalTermName,#legalTermDesc').val('');
		$('#legalTermStatus').val('1');
	}
}

function saveLegalTermType() {

	var data8 = {};
	
	if($("#legalTermName").val() == null || $("#legalTermName").val() == '') {
		toastr.error('Legal term name required');
		return;
	}
	if($("#legalTermStatus").val() == null || $("#legalTermStatus").val() == '') {
		toastr.error('Legal term status required');
		return;
	}

    data8.legalTermId = $("#legalTermId").val();
    data8.legalTermName = $("#legalTermName").val();
    data8.legalTermDesc = $("#legalTermDesc").val();
    data8.legalTermStatus = $("#legalTermStatus").val();

    $.ajax({
        type: "POST",
        url: "/configuration/view-procurement-add-legal-term-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data8),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#legalTermId").val() == null || $("#legalTermId").val() == "" || $("#legalTermId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getLegalTermData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteLegalTermType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {

            var id = $('#legalTermId').val();

            $.ajax({
                type: "GET",
                url: "/configuration/view-procurement-legal-term-type-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getLegalTermData();
                    	toastr.success('Data deleted successfully')
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    })
    
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid11');
    new agGrid.Grid(gridDiv, gridOptionslegalterm);
})

</script>
</head>
<body>
	<h6>Legal Term List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionlegalTerm()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldslegalTerm()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteLTermBtn" class="btn  edit-btn"
								onclick="deleteLegalTermType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid11" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Legal Term</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveLegalTermType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetLTermBtn" class="btn  edit-btn"
								onclick="resetlegalTerm()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="legalTermName"> <input type="hidden" id="legalTermId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Description</label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="legalTermDesc">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="legalTermStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
