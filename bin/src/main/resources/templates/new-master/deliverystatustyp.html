<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="deliverystatustyp">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsDeliverystatusTyp = [

    {
        headerName: "Delivery Method Type",
        field: "deliveryMethodId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "deliveryMethodName",
        flex: 2,
        width: 80
    }, {
        headerName: "Description",
        field: "deliveryMethodDesc",
        width: 175,
        flex: 3,
    }, {
        headerName: "Status",
        field: "deliveryMethodStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.deliveryMethodStatus == "Active") {
                return '<div style="color:green">' + params.data.deliveryMethodStatus + '</div>';
            } else {
                return '<div>' + params.data.deliveryMethodStatus + '</div>';
            }
        }
    }
];

var gridOptionsDeliverystatusTyp = {
    columnDefs: columnDefsDeliverystatusTyp,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedDelivery,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId : function(data) {
		return data.deliveryMethodId;
	}

};

$(document).ready(() => {
	getDelMethodData();
})
function getDelMethodData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-procurement-view-delivery-method-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsDeliverystatusTyp.api.setRowData(data);
        	gridOptionsDeliverystatusTyp.api.getRowNode(data[0].deliveryMethodId).setSelected(true);
        } else {
        	gridOptionsDeliverystatusTyp.api.setRowData(dataSet);
        	$("#deleteDelMetBtn").attr("disabled",true);
        }
    });
	$('#deliveryMethodName,#deliveryMethodDesc,#deliveryMethodStatus').attr('disabled',true);
}

function onSelectionChangedDelivery() {

    var selectedNodes = gridOptionsDeliverystatusTyp.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#deliveryMethodName').val(selectedData.map(node => node.deliveryMethodName));
        $('#deliveryMethodDesc').val(selectedData.map(node => node.deliveryMethodDesc));
        $('#deliveryMethodId').val(selectedData.map(node => node.deliveryMethodId));

        if (selectedData.map(node => node.deliveryMethodStatus) == "Active") {
            $('#deliveryMethodStatus').val("1");
        } else if(selectedData.map(node => node.deliveryMethodStatus) == "") {
        	$('#deliveryMethodStatus').val("1");
        } else {
            $('#deliveryMethodStatus').val("0");
        }
        $("#resetDelMethodBtn2").attr("disabled",true);
        $("#deleteDelMetBtn").attr("disabled",false);
    }
    
}

function enableFieldsDelivery() {
	$('#deliveryMethodName,#deliveryMethodDesc,#deliveryMethodStatus').attr('disabled',false);
}
function openAddSectionDelivery() {
	enableFieldsDelivery();
	$('#deliveryMethodId,#deliveryMethodName,#deliveryMethodDesc').val('');
	$('#deliveryMethodStatus').val('1');
	$("#resetDelMethodBtn2").attr("disabled",false);
	$("#deleteDelMetBtn").attr("disabled",true);
	gridOptionsDeliverystatusTyp.api.deselectAll();
}
function resetDelivery() {
	if(!$("#deliveryMethodId").val()) {
		$('#deliveryMethodId,#deliveryMethodName,#deliveryMethodDesc').val('');
		$('#deliveryMethodStatus').val('1');
	}
}

function saveDeliveryType() {
	
	if($("#deliveryMethodName").val() == null || $("#deliveryMethodName").val() == '') {
		toastr.error('Delivery method name required');
		return;
	}
	if($("#deliveryMethodStatus").val() == null || $("#deliveryMethodStatus").val() == '') {
		toastr.error('Delivery method status required');
		return;
	}

	var data10 = {};

    data10.deliveryMethodId = $("#deliveryMethodId").val();
    data10.deliveryMethodName = $("#deliveryMethodName").val();
    data10.deliveryMethodDesc = $("#deliveryMethodDesc").val();
    data10.deliveryMethodStatus = $("#deliveryMethodStatus").val();

    $.ajax({
        type: "POST",
        url: "/configuration/view-procurement-add-delivery-method-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data10),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#deliveryMethodId").val() == null || $("#deliveryMethodId").val() == "" || $("#deliveryMethodId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getDelMethodData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteDeliveryMethodType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {
        	var id = $('#deliveryMethodId').val();

            $.ajax({
                type: "GET",
                url: "/configuration/view-procurement-delivery-method-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getDelMethodData();
                    	toastr.success('Data deleted successfully')
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    })
    
}
$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid13');
    new agGrid.Grid(gridDiv, gridOptionsDeliverystatusTyp);
})
</script>
</head>
<body>
	<h6>Delivery Method Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionDelivery()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsDelivery()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteDelMetBtn" class="btn  edit-btn"
								onclick="deleteDeliveryMethodType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid13" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Delivery Method Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveDeliveryType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetDelMethodBtn2" class="btn  edit-btn"
								onclick="resetDelivery()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="deliveryMethodName"> <input type="hidden"
					id="deliveryMethodId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Description</label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="deliveryMethodDesc">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="deliveryMethodStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
