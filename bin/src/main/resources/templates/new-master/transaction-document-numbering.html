<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
	overflow: hidden;
}

.mb-3 {
	margin-bottom: 3px !important
}

.reset-btn {
	background-color: #e4e4e4 !important;
	color: #000 !important;
	border-color: #e4e4e4 !important;
	margin-left: 2px;
}
 
.mr-tp {
	margin-top: 20px;
}

.out-box2 {
	background-color: #fff;
	border: 1px solid #BF05FF;
	padding: 10px;
	min-height: 448px;
	position: relative;
	overflow-x: hidden;
	overflow-y: scroll;
	height: 31.9em;
}

.swal2-popup .swal2-title {
	font-size: 15px !important;
	font-weight: 500 !important;
}

.swal2-popup .swal2-styled.swal2-confirm {
	border: 0;
	border-radius: .25em;
	background: initial;
	background-color: #3085d6;
	color: #fff;
	font-size: 13px !important;
}

.swal2-popup .swal2-styled.swal2-cancel {
	border: 0;
	border-radius: .25em;
	background: initial;
	background-color: #aaa;
	color: #fff;
	font-size: 13px !important;
}

.swal2-popup #swal2-content {
	text-align: center;
	font-size: 13px;
}

.top-expand-sec {
	position: relative;
}

@media ( max-width :769px) {
	.top-expand-sec {
		display: none !important;
	}
}

.ag-theme-alpine .ag-ltr .ag-cell a {
	font-weight: 600 !important;
	text-decoration: none !important;
	color: #000 !important;
}
</style>

<script>
	var masterData = [];
	$(document).ready(()=>{
		var gridDiv1 = document.querySelector('#myGrid1');
	    new agGrid.Grid(gridDiv1, gridOptions1);
	    getAllData();
	    $(".br-s-btn").hide();
	    
	    document.getElementById("prefix_length").addEventListener("input", function () {
	    	  if (this.value.length > 2) {
	    	    this.value = this.value.slice(0, 2);
	    	  }
	    	  let val = parseInt(this.value, 10);
	    	  if (val < 3 && this.value !== "") {
	    	    this.value = 3;
	    	  }
	    	  if (val > 10) {
	    	    this.value = 10;
	    	  }
	    	});
	    
	    document.getElementById("prefix_start").addEventListener("input", function () {
	        if (this.value.length > 12) {
	          this.value = this.value.slice(0, 12);
	        }

	        let val = parseInt(this.value, 10);
	        if (val < 1 && this.value !== "") {
	          this.value = 1;
	        }
	        if (val > 999999999999) {
	          this.value = 999999999999;
	        }
	      });
	    document.getElementById("prefix_code").addEventListener("input", function () {
	    	  let val = this.value.toUpperCase();
	    	  val = val.replace(/[^A-Z_]/g, '');
	    	  val = val.replace(/_+/g, '_');
	    	  if (val.length > 0 && !/^[A-Z]/.test(val.charAt(0))) {
	    	    val = val.replace(/^_+/, ''); // remove starting underscore(s)
	    	  }
	    	  this.value = val;
	    	});
        document.getElementById("quickFilter").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                onQuickFilterChanged()
            }
        });

	})
	function getAllData() {
		agGrid.simpleHttpRequest({
		    url: "transaction-document-numbering-get-data"
		}).then(data => {
			let d = JSON.parse(data.body);
	        if (d.length > 0) {
	        	gridOptions1.api.setRowData(d);
	            var firstRowNode = gridOptions1.api.getDisplayedRowAtIndex(0);
	            if (firstRowNode) {
	                firstRowNode.setSelected(true);
	            }
	        }
		});
	}
	function onQuickFilterChanged() {
		gridOptions1.api.setQuickFilter(document.getElementById('quickFilter').value);
	    var firstRowNode = gridOptions1.api.getDisplayedRowAtIndex(0);
	    if (firstRowNode) {
	        firstRowNode.setSelected(true);
	    }
	}

	function reset() {
	    $('#quickFilter').val("");
	    onQuickFilterChanged();
	}
	var columnDefs1 = [
		{
			headerCheckboxSelection : false,
			checkboxSelection : true,
			width : 8,
			sortable : false,
			filter : false,
			resizable : true,
			pinned : 'left',
		}, 
    {
        headerName: "Document Name",
        field: "document_name",
        flex: 2,
    }, {
        headerName: "prefix",
        field: "prefix_code",
        flex: 1
    }, {
        headerName: "Number Length",
        field: "prefix_length",
        flex: 1
    }, {
        headerName: "Use FY",
        field: "prefix_useFY",
        flex: 1,
        cellRenderer: params => params.value === 1 ? 'Yes' : 'No'
    }, {
        headerName: "Sample Output",
        field: "output",
        flex: 2
    },
	{
	    headerName: "Editable",
	    field: "editable_status",
	    flex: 1,
	    cellRenderer: params => {
	    	  return String(params.value) === "0"
	    	    ? '<span style="color: green;">✅ Yes</span>'
	    	    : '<span style="color: red;">🔒 No</span>';
	    	}
	}
];
var gridOptions1 = {
	    columnDefs: columnDefs1,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    suppressRowClickSelection: true, 
	    onSelectionChanged: selectPrefix,
	    pagination: true, 
	    paginationPageSize: 15,
	    paginationPageSizeSelector: [15, 30, 45],
	    onPaginationChanged: function () {
	        const currentPage = gridOptions1.api.paginationGetCurrentPage() + 1;
	    }
	};
function selectPrefix() {
	$('#pfix_id,#tbl_name,#document_name,#prefix_code, #prefix_length, #prefix_start, #prefix_useFY').val("");
	$('#reqHeadId').html("");
	  $(".br-s-btn").hide();
    var selectedNodes = gridOptions1.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#pfix_id').val(selectedData.map(node => node.pfix_id));
	    $('#tbl_name').val(selectedData.map(node => node.tbl_name));
	    $('#document_name').val(selectedData.map(node => node.document_name));
	    $('#reqHeadId').text(selectedData.map(node => node.document_name));
	    $('#prefix_code').val(selectedData.map(node => node.prefix_code));
	    $('#prefix_length').val(selectedData.map(node => node.prefix_length));
	    $('#prefix_start').val(selectedData.map(node => node.prefix_start));
	    $('#prefix_useFY').val(selectedData.map(node => node.prefix_useFY));
	    $('#prefix_code, #prefix_length, #prefix_start, #prefix_useFY').attr("disabled", true);
	    if (selectedData.map(node => node.editable_status) == "0") {
	    	$(".br-m-btn").show();
	    } else {
	    	$(".br-m-btn").hide();
	    }
    }
}
function editPrefix(){
	  $('#prefix_code, #prefix_length, #prefix_start, #prefix_useFY').attr("disabled", false);
	  $(".br-s-btn").show(); 
	  $(".br-m-btn").hide();
}
function cancel(){
	  $(".br-s-btn").hide(); 
	  $(".br-m-btn").show();	
	  $('#prefix_code, #prefix_length, #prefix_start, #prefix_useFY').attr("disabled", true);
}
//save Data
function saveData(){
	var data = {};
	var valid = true;
	data.pfix_id = $("#pfix_id").val();
	data.tbl_name = $("#tbl_name").val();
	data.document_name = $("#document_name").val();
	data.prefix_code = $("#prefix_code").val();
	data.prefix_length = $("#prefix_length").val();
	data.prefix_start = $("#prefix_start").val();
	data.prefix_useFY = $("#prefix_useFY").val();
	if (data.prefix_code == null || data.prefix_code.trim() === "") {
		toastr.error('Prefix Code Required');
		return;
	}
	if (data.prefix_length == null || data.prefix_length.trim() === "") {
		toastr.error('Number Length Required');
		return;
	}
	if (data.prefix_start == null || data.prefix_start.trim() === "") {
		toastr.error('Starting Number Required');
		return;
	}
	if (data.prefix_useFY == "" || data.prefix_useFY.trim() === "") {
		toastr.error('Select Use FY');
		return;
	}
	if (valid) {
		savePrefix(data);
	}
}
function savePrefix(prefixData) {
	$('.loader').show();
	$.ajax({
		type: "POST",
		url: "transaction-document-numbering-modify-data",
		dataType: "json",
		contentType: "application/json",
		data: JSON.stringify(prefixData),
		success: function(response) {
			if (response.code == "success") {
				toastr.success(response.message);
				getAllData();
				cancel();
			} else {
				toastr.error(response.message);
				getAllData();
				cancel();
			}
			$('.loader').hide();
		},
		error: function(response) {
			console.log(response);
		}
	})
}
</script>
</head>

<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition  mb-3">

			<!-- Tab panes -->
			<div class="tab-content">

				<!--Tabbination 1 Start-->
				<div class="d-flex flex-column flex-lg-row">
					<!--Left Sec Start-->

					<div class="box-sec" id="collapseWidthR1">
						<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">
										<div class="col-md-8 col-12">
											<div class="d-flex search-sec">
												<input class="form-control me-2" type="text"
													placeholder="Search" id="quickFilter" autocomplete="off">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												&nbsp;
												<button class="btn go-btn w-auto" type="button"
													onclick="reset()">Reset</button>
											</div>
										</div>
										<div class="col-md-2 d-flex justify-content-end">
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
									</div>
							<div class="requisition-tbl table-responsive">
								<ul class="nav nav-pills newtab mb-20" role="tablist"
									style="margin-left: 0px !important" id="masterSection">

								</ul>

							</div>

							<div class="card-scroll m-2">
								<div id="myGrid1" style="height: 500px;" class="ag-theme-alpine"></div>
							</div>

						</div>
					</div>


					<!--Left Sec End-->

					<!--Right Sec Start-->
					<div class="box-sec" id="collapseWidthL1">
						<div class="out-box">
							<div class="d-flex flex-row-reverse justify-content-between align-items-center p-2 bdr-line top-expand-sec">
								<button class="btn btn-primary max-btn" id="collapseButtonL1"
									type="button" onclick="triggerExpansionL(1)"
									data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
									<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
										class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
								</button>
							</div>
							<div class="tab-content flex-fill h-25" id="tabContent">
								<div id="raiseTicket" class="tab-pane active show h-100 p-2"
									role="tabpanel">
									<div class="requisition-tbl d-flex flex-column h-100">
										<div class="mb-2 m-2">
											<table class="table table-bordered mb-0" width="100%">
												<tr valign="middle">
													<td width="50%" style="vertical-align: middle;"><span
														class="head-user-name" id="reqHeadId"></span></td>
													<td>
														<div class="d-flex justify-content-end flxwrap">
															<div class="mr-2">
																<button
																	class="btn btn-primary edit-btn operation-btn br-m-btn"
																	type="button" id="edit" onclick="editPrefix()">Edit</button>
																<input type="hidden" class="form-control" id="editId">
															</div>
															<div class="mr-2">
																<button class="btn btn-primary edit-btn br-s-btn"
																	id="cancel" type="button" onclick="cancel()">Cancel</button>
															</div>
															<div class="mr-2">
																<button class="btn btn-primary edit-btn br-s-btn"
																	id="save" onclick="saveData()" type="button">Save</button>
															</div>

														</div>

													</td>
												</tr>
											</table>
										</div>
										<div class="crd card p-2 m-2">
											<div class="row mt-4">
											<input type="hidden" id="pfix_id">
											<input type="hidden" id="tbl_name">
											<input type="hidden" id="document_name">
												<div class="col-md-3">
													<div class="form-group">
														<label>Prefix Code <span class="mandatory">*</span></label> <input
															type="text" class="form-control transparenttxtbox"
															placeholder="Prefix Code" id="prefix_code"> 
													</div>
												</div>

												<div class="col-md-3">
													<div class="form-group">
														<label>Number Length <span class="mandatory">*</span></label> <input
															type="number" class="form-control transparenttxtbox"
															placeholder="Number Length" id="prefix_length"  min="3" max="10" maxLength="2"> 
													</div>
												</div>
												<div class="col-md-3">
													<div class="form-group">
														<label>Starting Number <span class="mandatory">*</span></label> <input
															type="number" class="form-control transparenttxtbox"
															placeholder="Starting Number" id="prefix_start"  min="1" max="9999999999" maxLength="12"> 
													</div>
												</div>

												<div class="col-md-3">
													<div class="form-group">
														<label>Use FY <span class="mandatory">*</span></label>
														<div class="select">
															<select id="prefix_useFY" class="form-control">
																<option value="">Select</option>
																<option value="1">YES</option>
																<option value="0">NO</option>
															</select>
														</div>
													</div>
												</div>
											</div>

										</div>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
