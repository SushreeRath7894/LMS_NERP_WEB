<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="insurance">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
$(document).ready(() => {
    var gridDiv = document.querySelector('#myGridInsurance');
    new agGrid.Grid(gridDiv, gridOptionsInsurancetyp);
    getInsuranceType();
});
var columnDefsInsurancetyp = [
    {
        headerName: "Insurance Type",
        field: "insuranceId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "insuranceName",
        flex: 2,
        width: 80
    },
    {
        headerName: "Description",
        field: "insuranceDesc",
        width: 175,
        flex: 3,
    },
    {
        headerName: "Status",
        field: "insuranceStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.insuranceStatus == "Active") {
                return '<div style="color:green">' + params.data.insuranceStatus + '</div>';
            } else {
                return '<div>' + params.data.insuranceStatus + '</div>';
            }
        }
    }
];

var gridOptionsInsurancetyp = {
	    columnDefs: columnDefsInsurancetyp,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    onSelectionChanged: onSelectionChangedInsurance,
	    onRowClicked: (event) => {
	        const selectedNode = event.node;
	        if (!selectedNode.isSelected()) {
	            selectedNode.setSelected(true);
	        }
	    },
	    getRowNodeId : function(data) {
			return data.insuranceId;
		}

	};

function onSelectionChangedInsurance() {
    
    var selectedNodes = gridOptionsInsurancetyp.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#insuranceDesc').val(selectedData.map(node => node.insuranceDesc));
        $('#insuranceName').val(selectedData.map(node => node.insuranceName));
        $('#insuranceId').val(selectedData.map(node => node.insuranceId));


        if (selectedData.map(node => node.insuranceStatus) == "Active") {
            $('#insuranceStatus').val("1");
        }else if(selectedData.map(node => node.insuranceStatus) == ""){
        	$('#insuranceStatus').val("1");
        }else {
            $('#insuranceStatus').val("0");
        }
        $("#resetInsuranceBtn").attr("disabled",true);
        $("#deleteInsurncTypeBtn").attr("disabled",false);
    }

}
	
	function getInsuranceType() {
	agGrid.simpleHttpRequest({
        url: '/master/view-insurance-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsInsurancetyp.api.setRowData(data);
        	gridOptionsInsurancetyp.api.getRowNode(data[0].insuranceId).setSelected(true);
        } else {
        	gridOptionsInsurancetyp.api.setRowData(dataSet);
        	$("#deleteInsurncTypeBtn").attr("disabled",true);
        }
    });
    
    $('#insuranceName,#insuranceDesc,#insuranceStatus').attr('disabled',true);
}
	
	function enableFieldsInsurnc() {
		$('#insuranceName,#insuranceDesc,#insuranceStatus').attr('disabled',false);
	}
	
	function openAddSectionInsurnc(){
		enableFieldsInsurnc();
		$('#insuranceId,#insuranceDesc,#insuranceName').val('');
		$('#insuranceStatus').val('1');
		$("#resetInsuranceBtn").attr("disabled",false);
		$("#deleteInsurncTypeBtn").attr("disabled",true);
		gridOptionsInsurancetyp.api.deselectAll();
		
	}
	
	function resetInsurancetyp() {
		if(!$("#insuranceId").val()) {
			$('#insuranceId,#insuranceDesc,#insuranceName').val('');
			$('#insuranceStatus').val('1');
		}
	}
	
	function saveInsuranceType() {
		
		if($("#insuranceName").val() == null || $("#insuranceName").val() == '') {
			toastr.error('Insurance type name required');
			return;
		}
		if($("#insuranceStatus").val() == null || $("#insuranceStatus").val() == '') {
			toastr.error('Insurance type status required');
			return;
		}
		
		var data3 = {};
		data3.insuranceId = $("#insuranceId").val();
	    data3.insuranceName = $("#insuranceName").val();
	    data3.insuranceDesc = $("#insuranceDesc").val();
	    data3.insuranceStatus = $("#insuranceStatus").val();

	    $.ajax({
	        type: "POST",
	        url: "/master/add-insurance-type",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data3),
	        success: function(response) {
	            if (response.message == "Success") {
	            	if ($("#insuranceId").val() == null || $("#insuranceId").val() == "" || $("#insuranceId").val() == undefined) {
	                    toastr.success('Data saved successfully')
	                } else {
	                    toastr.success('Data updated successfully')
	                }
	            	getInsuranceType();
	            	resetInsurancetyp();
	            }
	        },
	        error: function(response) {
	            console.log(response);
	        }
	    })
	}
	
	function deleteInsuranceType() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {
	    
			    var id = $('#insuranceId').val();
			
			    $.ajax({
			        type: "GET",
			        url: "/master/insurance-type-delete?id=" + id,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.message == "Success") {
			            	getInsuranceType();
			            	toastr.success('Data deleted successfully')
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
		    
	        }
		    
	       });
	}
	
</script>
</head>
<body>
<h6>Insurance</h6>
<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionInsurnc()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsInsurnc()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteInsurncTypeBtn" class="btn  edit-btn"
								onclick="deleteInsuranceType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridInsurance" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	
	<h6>Add Insurance</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveInsuranceType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetInsuranceBtn" class="btn  edit-btn" onclick="resetInsurancetyp()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">

		<div class="col-md-4">
			<div class="form-group">
				<label>Insurance Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="insuranceName"> <input type="hidden" id="insuranceId">
			</div>
		</div>
		<div class="col-md-4">
			<div class="form-group">
				<label>Description <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="insuranceDesc">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="insuranceStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
