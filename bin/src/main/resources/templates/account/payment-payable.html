<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"

<head>

<style>
#autocomplete-list {
	list-style-type: none;
	margin: 0;
	padding: 0;
	max-width: 300px;
	border: 1px solid #ccc;
	border-radius: 5px;
	overflow: hidden;
	box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
	max-height: 200px;
	overflow: hidden;
	overflow-y: auto;
}

.autocompletedata {
	padding: 5px 15px;
	font-size: 13px;
	font-weight: 500;
	color: #333;
	cursor: pointer;
	transition: background-color 0.3s, color 0.3s;
}

.autocompletedata:nth-child(even) {
	background-color: #f9f9f9; /* Alternating row colors */
}

.autocompletedata:nth-child(odd) {
	background-color: #ffffff;
}

.autocompletedata:hover {
	color: #fff;
	background-color: #BF05FF !important;
	border: 1px solid #BF05FF;
	font-size: 13px;
}

.navTabContainer {
	padding: 0px 10px;
}

.removeAccessForSave {
	pointer-events: none;
	opacity: 0.5;
}

.navTabContainer {
	padding: 10px 15px;
	flex-wrap: wrap;
}

.navTabContainer .nav-link {
	color: #495057;
	background-color: #ffffff;
	border: 1px solid #dee2e6;
	padding: 10px 20px;
	font-weight: 500;
}

.navTabContainer .nav-link:hover {
	background: #bf05ff !important;
	color: whitesmoke !important;
}

.navTabContainer .nav-link.active {
	background: #bf05ff !important;
	color: whitesmoke !important;
	border-radius: 6px !important;
}

.tab-content {
	border: 1px solid #dee2e6;
	border-top: none;
	background-color: #ffffff;
	border-radius: 0 0 8px 8px;
}

#tdiv {
	justify-content: flex-start;
	align-items: center;
	gap: 5rem;
	padding: 2px 15px;
}
</style>

function viewPaymentSchedule() {
	
	showLoader();
	
    agGrid.simpleHttpRequest({
        url: "payment-payable-schedule-view?type=vnd"
    }).then(function(data) {
    	
    	hideLoader();
    	
        var jsonData = JSON.parse(data.body);
        var alldata = jsonData.InvoiceDetails;
        var newData = [];
        $.each(alldata, function(index, obj) {
            if (obj.payStatus != "Fully Paid") {
                newData.push(obj);
            }
        });

        var rowData = [];
        gridOptionsVPS.api.setRowData(rowData);

        gridOptionsVPS.api.setRowData(newData);

        if (newData && newData.length > 0) {
            gridOptionsVPS.api.forEachNode(function(node) {
                if (node.rowIndex === 0) {
                    node.setSelected(true); // Select the first row
                }
            });
        }

        /* var allsaldata = jsonData.payrollDetails;
        var newData1 = [];
        $.each(allsaldata, function(index, obj) {

                newData1.push(obj);

        gridOptionsOPS.api.setRowData(rowData2);
        gridOptionsOPS.api.setRowData(newData1);

        if (newData1 && newData1.length > 0) {
            gridOptionsOPS.api.forEachNode(function(node) {
                if (node.rowIndex === 0) {
                    node.setSelected(true); // Select the first row
                }
            });
        } */

    });
}

function rowSelect() {
    var selectedRows = gridOptionsVPS.api.getSelectedRows();
    var rowCount = 0;
    var selectedNodes = gridOptionsVPS.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    selectedRows.forEach(function(selectedRow, index) {
        rowCount = rowCount + 1;
    });

    if (rowCount > 0) {
        if (selectedData.map(node => node.payStatus) == "Fully Paid") {
            $('#schedule').attr("disabled", true);
        } else {
            $('#schedule').attr("disabled", false);
        }
        $("#scheduleDate").val(selectedRows[0].scheduleDate);
        $("#schedule_save_btn").removeClass("removeAccessForSave");
    } else {
        $('#schedule').attr("disabled", true);
        $("#scheduleDate").val('');
        $("#schedule_save_btn").addClass("removeAccessForSave");

        var today = new Date();
        var dateString = ('0' + today.getDate()).slice(-2) + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + today.getFullYear();
        var fromDate = dateString.toString();

        $("#scheduleDate").val(null)
    }

}

function amountFormatter(value) {
    if (value !== null && value !== undefined) {
        var parts = value.toString().split('.');
        var integerPart = parts[0];
        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
        return formattedIntegerPart + decimalPart;
    } else {
        return '';
    }
}

        preConfirm: () => {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve()
                }, 3000)
            })
        }
    }).then((result) => {
        if (result.value) {
            $.ajax({

function formatAmount(element) {
    let value = element.value;
    if (value) {
        let formattedValue = indianCurreny(value);
        element.value = formattedValue;
        $("#remainAmount").val(value);
    }

}


function indianCurreny(value) {
    if (value !== null && value !== undefined) {
        //value = value.replace(/[^\d.,]/g, '');

        var parts = value.toString().split('.');
        var integerPart = parts[0].replace(/,/g, '');
        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';

        if (decimalPart.length > 3) {
            decimalPart = decimalPart.substring(0, 3);
        }

        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
        return formattedIntegerPart + decimalPart;
    } else {
        return '';
    }
}

function validateDateRange(fromDateSelector, toDateSelector) {

    let fromDate = $(fromDateSelector).val();
    let toDate = $(toDateSelector).val();


    if (fromDate && toDate) {
        let from = new Date(fromDate.split('-').reverse().join('-'));
        let to = new Date(toDate.split('-').reverse().join('-'));

        if (from > to) {
            swal("From Date cannot be greater than To Date!");
            $(fromDateSelector).val("");
            $(toDateSelector).val("");
        }
    }
}


function checkNumberInput(id) {

        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
        return formattedIntegerPart + decimalPart;
    } else {
        return '';
    }
}

function schedule() {
    $(".formValidation").remove();
    $('#scheduleModal').modal('show');
}

function scheduleCancelOnclick() {
    $("#scheduleDate").val("");
    $('#scheduleModal').modal('hide');
}

function scheduleOnclick(event) {
    let activeElements = $(".nav-link.active").map(function() {
        return $(this).parent().attr("id");
    }).get();


    let type = activeElements.filter(item => item === "psLi" || item === "vpsLiId");
    
    let idType = $('#activeTabId').val();


    var scheduleDate = $("#scheduleDate").val();
    var validation = true;
    if (scheduleDate == null || scheduleDate == "") {
        validation = validationUpdated("Schedule Date Required", 'scheduleDate');
    }
    if (validation) {
        if (type[0] == "vpsLiId") {
            var selectedRows = gridOptionsVPS.api.getSelectedRows();
            var invoiceIdArray = [];
            for (var i = 0; i < selectedRows.length; i++) {
                invoiceIdArray.push(selectedRows[i].invoiceId);
            }
            var JsonInvArrayId = JSON.stringify(invoiceIdArray);
            $.ajax({
                type: "GET",
                url: "payment-payable-schedule-save?id=" + encodeURIComponent(JsonInvArrayId) + "&scheduleDate=" + encodeURIComponent(scheduleDate) + "&type=" + type[0],
                async: false,
                success: function(response) {
                    if (true) {
                        toastr.success("Payment Scheduled Successfully");
                        //scheduleCancelOnclick();
                        viewPaymentSchedule()
                        
                    }

                },
            });
        } else {
            var selectedRows1 = gridOptionsOPS.api.getSelectedRows();
            var vIdArray = [];
            for (var i = 0; i < selectedRows1.length; i++) {
                vIdArray.push(selectedRows1[i].vid);
            }
            var JsonVidArrayId = JSON.stringify(vIdArray);
            $.ajax({
                type: "GET",
                url: "payment-payable-schedule-save?id=" + encodeURIComponent(JsonVidArrayId) + "&scheduleDate=" + encodeURIComponent(scheduleDate) + "&type=" + type[0],
                async: false,
                success: function(response) {
                    if (true) {
                        toastr.success("Payment Scheduled Successfully");
                        //scheduleCancelOnclick();
                        viewPaymentScheduleOth()
                    }

                },
            });
        }
    }
}

function getActId(id1, id2) {
	
	$('#psLi').toggle(id2 !== 'ppLi');
	$('#ppLi').toggle(id2 === 'ppLi');
	
	if (id2 === 'ppLi') {
	    if (id1 === 'vpp') viewPaymentProcess();
	    else if (id1 === 'opp') viewPaymentProcessOth();
	} else if (id2 === 'psLi') {
	    if (id1 === 'vps') viewPaymentSchedule();
	    else if (id1 === 'ops') viewPaymentScheduleOth();
	}

	const tabElement = document.querySelector(`#${id2} a`);
	if (tabElement) {
	    new bootstrap.Tab(tabElement).show();
	}

	$('#activeTabId').val(id1);
	$('#quickFilter').val('');

}

function creditCheckEmpty() {
    var creditAccountGroup = true;
    $('.creditAccountSubGroupCls').each(function() {
        if (!blankValidation($(this).attr('id'), "TextField", "Please Enter Account Ledger")) {

            creditAccountGroup = false;

}



function SearchUserInput(event) {
    if (event.key === "Enter" || event.keyCode === 13) {
        event.preventDefault();
        onQuickFilterChanged();
    }
}

function onQuickFilterChanged() {
    let searchValue = document.getElementById('quickFilter').value;

    gridOptionsVPS.api.setQuickFilter(searchValue);
    gridOptionsOPS.api.setQuickFilter(searchValue);
    gridOptionsVPP.api.setQuickFilter(searchValue);
    gridOptionsOPP.api.setQuickFilter(searchValue);

    $('#totalReq').find('span').html(gridOptions.api.getModel().getRowCount());

    getMostClosestRow();
}

function getMostClosestRow() {
    let searchValue = document.getElementById('quickFilter').value;

    [gridOptionsVPS, gridOptionsOPS, gridOptionsVPP, gridOptionsOPP].forEach(grid => {
        grid.api.setQuickFilter(searchValue);

        grid.api.forEachNodeAfterFilter((node, index) => {
            if (index === 0) {
                node.setSelected(true);
                grid.api.ensureIndexVisible(node.rowIndex);
            }
        });
    });
}

function resetBtn() {
    $("#quickFilter").val('');

    [gridOptionsVPS, gridOptionsOPS, gridOptionsVPP, gridOptionsOPP].forEach(grid => {
        grid.api.setQuickFilter('');
        grid.api.refreshCells({
            force: true
        });

        setTimeout(() => {
            grid.api.forEachNode((node, index) => {
                if (index === 0) {
                    node.setSelected(true);
                    grid.api.ensureIndexVisible(node.rowIndex);
                }
            });
        }, 50);
    });
}
