																							onkeyup='getDimensionList();alphabetCheck();calculateLineTotal();'>
																						<input type="hidden" id="productDimensionId">

																						<div id="suggesstion-box1_" class="sugg-bx"
																							style="overflow-y: hidden; padding: 0; height: auto;">
																						</div>
																					</div>
																				</div>

																				<div class="col-lg-6">
																					<div class="form-group">
																						<label>Quantity</label> <input type="text"
																							id="quantity" class="form-control"
																							onkeyup="calculateLineTotal();numberCheck()"
																							onblur="offerQty()">
																					</div>
																				</div>
																				<div class="col-lg-6">
																					<div class="form-group">
																						<label>Unit Price</label><input type="text"
																							id="itemUnitPrice" class="form-control"
																							onkeyup="calculateLineTotal()" autocomplete="off">
																					</div>
																				</div>

																				<div class="col-lg-6">
																					<div class="form-group">
																						<label>Discount Code</label>
																						<div class="d-flex">
																							<input type="text" id="dealerCode"
																								class="form-control"
																								onkeyup="calculateLineTotal()"> <input
																								type="hidden" id="itemDiscount"> <input
																								type="hidden" id="OfferedlineTotal">


																						</div>
																					</div>
																				</div>
																				<div class="col-lg-6">
																					<div class="form-group">
																						<label>GST Rate</label><input type="text"
																							id="gstRate" class="form-control"
																							autocomplete="off">
																					</div>
																				</div>
																				<div class="col-lg-6">
																					<div class="form-group">
																						<label>Line Total</label> <input type="text"
																							id="lineTotal" class="form-control">
																					</div>
																				</div>

																			</div>
																		</div>
																	</div>
																</div>
															</div>
														</div>


														<div class="text-center d-none" id="no_purchase_voucher">
															<div>
																<strong>No sales vouchers found.</strong>
															</div>
															<div>Please add a new sales voucher to view
																details.</div>
														</div>
													</div>
												</div>

											</div>

											<div id="TDS" class="tab-pane fade p-2 h-100">
												<div class="requisition-tbl d-flex flex-column h-100 ">
													<div class="mb-2 operationBtnSticky">
														<table class="table table-bordered mb-0" width="100%">
															<tr valign="middle" class="operation-row">
																<td>
																	<div class="d-flex justify-content-end gap-1">
																			<button
																				class="btn btn-primary edit-btn operation-btn"
																				type="button"
																				onclick="nextBtnFunction('voucherNarration')">Prev</button>
																			<button class="btn btn-primary edit-btn" id="saveTdsBtn"
																				onclick="tdsEdit()" type="button">Save</button>
																			<input type="hidden" class="form-control"
																				id="editTktId">

																	</div>

																</td>
															</tr>
														</table>
													</div>
													<div class="card p-2">
														<div class="TDS-content">

															<div class="TDS-body">

																<div
																	class="TDS-header flex justify-content-between payment-Modal-Header">
																	<!-- <h4 id="ledgerNameModal" class="modalheading"></h4> -->

																</div>

																<div class='row'>
																	<div class="form-group col-md-4">
																		<div class="py_Amt" id="payAmountDiv">
																			<label>TDS <span>(<span
																					id="tdsPercentageAmt"></span> )
																			</span></label> <input type="text" id="payTdsAmountGlobal" hidden>
																			<input type="text" id="payTdsPercentGlobal" hidden>
																			<input type="text" id="payTdsAmount" value=""
																				class="form-control"
																				onkeyup="checkNumberInput(this.id)"
																				oninput="checkPayAmount();" placeholder="TDS"
																				autocomplete=off>
																		</div>
																	</div>

																	<div class="col-md-4">
																		<div class="form-group">
																			<label>TDS Ledger</label>
																			<div>
																				<select id="tdsLedgerId" class="form-select">
																					<option value="">Select</option>
																					<option th:each="c,iter:${tdsLedgerList}"
																						th:value="${c.key}" th:text="${c.name}">
																					</option>
																				</select>
																			</div>
																		</div>
																	</div>

																	<div class="col-md-4 form-group"
																		id="tdsTransactionDateDiv">
																		<div class="form-group calendar_box">
																			<label>Date</label> <input type="text"
																				id="tdsTransactionDate"
																				placeholder="TDS Transaction Date"
																				class="form-control" readonly> <i
																				class="ti-calendar picker_calendar"
																				id="tdsTransactionDateCalendar"
																				style="top: 35px; right: 5px;"></i>
																		</div>
																	</div>

																	<div class="form-group col-md-4">
																		<div class="off_Amt" id="offAmountDiv">
																			<label>Round Off</label> <input type="text"
																				id="offAmount" value="0" class="form-control"
																				oninput="restrictedInput('offAmount');"
																				onkeyup="offAmountInput(this.value);"
																				placeholder="Round Off" autocomplete="off">
																		</div>
																	</div>

																	<!-- <div class="col-md-8 mt-2 form-group">
																		<label>Narration</label>

																		<textarea class="form-controlarea" rows="4" cols="100"
																			id="tdsNarration" onkeyup="textCount(event)"
																			autocomplete=off></textarea>
																		<div id="charNumSN" class="txtcounter" align="right">
																			<span>0</span> characters
																		</div>

																	</div> -->
																</div>

															</div>

															<div class="row">
																<div class="col-lg-12">
																	<input type="hidden" id="pVendorid"
																		class="form-control">
																	<table
																		class="duetable table table-bordered table-striped mt-2"
																		style="width: 100%; margin-top: 0px;"
																		id="offeredScheduleTable">
																		<thead class="tablenewhead">
																			<tr>
																				<th class="text-style">Invoice Id</th>
																				<th class="text-style">Voucher No</th>
																				<th class="text-style">GST Rate</th>
																				<th class="text-style">Taxable Amount</th>
																				<th class="text-style">IGST</th>
																				<th class="text-style">CGST</th>
																				<th class="text-style">SGST</th>
																				<th class="text-style">Invoice Amount</th>
																				<th class="text-style">TDS AMOUNT <span>(<span
																						id="PercentageTDS"></span>)
																				</span></th>
																				<th class="text-style">Round Off</th>
																				<th class="text-style">Final Amount</th>
																			</tr>
																		</thead>
																		<tbody id="vendorInvoiceList">
																		</tbody>

																	</table>
																</div>
															</div>
															<!-- <div class="row">
														<div class="modal-footer mt-2">
															<button class="btn3" id="cancel"
																onclick="cancelInvoiceModalBtn()">BACK</button>
															<button class="btn1" id="saveTdsBtn" onclick="tdsEdit()">SAVE</button>
														</div>

													</div> -->
														</div>
													</div>
												</div>
											</div>



											<div id="voucherNarration" class="tab-pane fade p-2">

												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tr valign="middle">
															<td>
																<div class="d-flex justify-content-end gap-1">
																	<button class="btn btn-primary edit-btn operation-btn"
																		type="button" id="voucher_cls_prv_btn"
																		onclick="nextBtnFunction('manageControl')">Prev</button>

																	<button class="btn btn-primary edit-btn operation-btn"
																		id="saveNarration" onclick="addNarration()">Save</button>

																	<button class="btn btn-primary edit-btn operation-btn"
																		type="button" id="vchr_Nxt_btn"
																		onclick="nextBtnFunction('TDS')">Next</button>
																</div>
															</td>
														</tr>
													</table>
												</div>


												<div class="col-md-12" id="shippingInfo">

													<div class="row">
														<!-- <input type="hidden" id="empIds">-->
														<input type="hidden" id="ledgerId"> <input
															type="hidden" id="pVoucherId">

														<div class="col-lg-12">
															<div class="form-group">
																<label>Narration</label>
																<textarea class="form-controlarea" rows="4" cols="100"
																	id="vchNarration" autocomplete=off></textarea>
															</div>
														</div>
													</div>
												</div>
											</div>

										</div>
									</div>

								</div>

							</div>
						</div>

					</div>

				</div>
			</div>

		</div>
	</div>
</body>

</html>
