	function statelistnames(countryId, stateid) {
		$.ajax({
			type : "GET",
			url : "view-account-branch-stateList?id=" + countryId,
			success : function(response) {
				if (response.message == "success") {
					$("#states").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select State");
					$("#states").append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].key);
						$(option).html(response.body[i].name);
						$("#states").append(option);
					}
					$("#states").val(stateid);
				}

			},
			error : function(e) {
			}
		});

	}

	// Edit & stage change 
	function editPage(id) {
		//	alert(id);
		$(".loader").show();
		var editId = id.split(",");

		var branchId = editId[0];

		var modal = editId[1];
		//alert('branchId------'+branchId);
		$("#demo").show();

		$.ajax({
			type : "GET",
			url : "view-account-branch-edit?id=" + branchId,
			async : false,
			success : function(response) {
				console.log("response for edit------"
						+ JSON.stringify(response));
				if (response.code == "Success") {

					$("#add").hide();
					$("#copy").hide();
					$("#delete").hide();
					$("#myGrid").hide();
					$("#searchRowDiv").hide();
					$("#totalReq").hide();
					$("#statusDiv").hide();
					$("#idDiv").hide();
					$("#collapseFour").hide();
					$("#headingFour").hide();
					$("#myGridActivity").hide();
					$(".loader").hide();
					$("#demo").show();

					$(".container").hide();

					var branchId = $("#branchId").text(
							response.body[0].branchId);

					$("#bank").val(response.body[0].bank);
					$("#branchName").val(response.body[0].branchName);
					$('#ifscCode').val(response.body[0].ifscCode);

					$("#contactNo").val(response.body[0].contactNo);
					$("#email").val(response.body[0].email);
					$('#status').val(response.body[0].status);

					if (response.body[0].status == "true") {
						$('#status').val("1");
					} else {
						$('#status').val("0");
					}

					$("#country").val(response.body[0].country);
					var countryid = response.body[0].country
					var stateid = response.body[0].states

					/* 	function for statelist on country onchange */
					statelistnames(countryid, stateid);

					$('#city').val(response.body[0].city);

					$("#addressStreet").val(response.body[0].addressStreet);
					$("#zip").val(response.body[0].zip);
					$('#address').val(response.body[0].address);

				}
			}
		})
	}

	function saveLedgerDetails() {

		var obj = {};

		obj.bankId = $('#bankId').text();
		obj.bankName = $('#addbankName').val();
		obj.status = $('#bankstatus').val();
		obj.description = $('#description').val();

		console.log(obj)

		var validation = true;

		if (obj.bankName == null || obj.bankName == "") {
			validation = validationUpdated("Bank Name Required", "addbankName");
		}

		if (obj.bankstatus == null || obj.bankstatus == "") {
			validation = validationUpdated("Bank Status Required", "bankstatus");
		}

		if (obj.bankdescription == null || obj.bankdescription == "") {
			validation = validationUpdated("Bank Description Required",
					"description");
		}

		if (validation) {
			$("#addLedgerModal").modal('hide');
			$('#bankName').val('');
			$('#addbankName').val('');
			$('#bankstatus').val('');
			$('#description').val('');
			$('#charNumSN').find('span').html(0);

			/* ajax */

			$.ajax({
				type : "POST",
				url : "view-account-bank-add",
				contentType : "application/json",
				data : JSON.stringify(obj),
				success : function(response) {
					if (response.code == "1062") {
						Swal.fire({
							icon : 'error',
							title : 'Oops...',
							text : 'Bank Details Is Already Exists',

						});
					}
					getallbankname();

				},
				error : function(data) {

					//console.log(data);
				}
			});
		}

	}

		}

		if (obj.branchName == null || obj.branchName == "") {
			$(".loader").hide();
			validation = validationUpdated("Branch Name Required", "branchName");
		}

		if (obj.ifscCode == null || obj.ifscCode == "") {
			$(".loader").hide();
			validation = validationUpdated("Ifsc Code Required", "ifscCode");
		}

		/* if (obj.zip == null || obj.zip == "") {
			$(".loader").hide();
			validation = validationUpdated("Zip Code Required", "zip");
		}

		if (obj.contactNo == null || obj.contactNo == "") {
			$(".loader").hide();
			validation = validationUpdated("Contact Number Required",
					"contactNo");
		}

		if (obj.email == null || obj.email == "") {
			validation = validationUpdated("Email Required", "email");
		}

		if (obj.city == null || obj.city == "") {
			validation = validationUpdated("City Required", "city");
		} */

		/* FORM VALIDATION ENDS*/

		if (validation) {
			$.ajax({
				type : "POST",
				url : "view-account-branch-add",
				contentType : "application/json",
				data : JSON.stringify(obj),
				success : function(response) {
					if (response.code == "Success") {
						
						$('#bank').val('');
						$('#branchName').val('');
						$('#ifscCode').val('');
						$('#contactNo').val('');
						$('#email').val('');
						$('#status').val('');

						$('#city').val('');
						$('#addressStreet').val('');
						$('#zip').val('');
						$('#address').val('');

						$("#delete").show();

						$("#myGrid").show();
						$("#searchRowDiv").show();
						$("#demo").hide();
						$("#add").attr("disabled", false);
						$(".loader").hide();
						swal("Branch Added Successfully");

						agGrid.simpleHttpRequest({
							url : "view-account-branch-throughAjax"
						}).then(function(data) {
							var len = data.length;
							$('#totalReq').find('span').html(len);
							gridOptions.api.setRowData(data);
						});

					}
				},
				error : function(data) {

					//console.log(data);
				}
			})
		}

	}

	function deleteBranch() {

		var updatedId = '(' + deleteId + ')';

		$.ajax({
			type : "GET",
			url : "view-account-branch-delete-id?id=" + updatedId,

				if (response.code == "Success") {

					agGrid.simpleHttpRequest({

						gridOptions.api.setRowData(data);

		});

		$('#delete').attr("disabled", true);
	}

	function saveFile() {
		var uFile = $('#fileUpload')[0].files[0];
		var fileName = $('#fileUpload').val();

		var lastIndex = fileName.lastIndexOf("\\");
		if (lastIndex >= 0) {
			fileName = fileName.substring(lastIndex + 1);
		}
		var iURL = URL.createObjectURL(uFile);

		$('#imgLoc').attr('src', '');
		$('#imgLoc').attr('src', iURL);

		var fileData = new FormData();
		fileData.append('file', uFile);
		fileData.append('path', 'none');

		$.ajax({
			type : "POST",
			url : "view-crm-vendors-upload-file",
			enctype : "multipart/form-data",
			contentType : false,
			data : fileData,
			processData : false,
			cache : false,
			success : function(response) {

			},
			error : function(e) {

			}
		});
	}

	function deleteFile() {

		$('#imgLoc').attr('src', '');
		$('#imgLoc').attr('src', '../assets/images/noimage.jpg');

		var fileData = new FormData();

		fileData.append('file', 'none');
		fileData.append('path', 'none');

		$.ajax({
			type : "POST",
			url : "view-crm-vendors-delete-file",
			enctype : "multipart/form-data",
			contentType : false,
			/* data        : fileData, */
			processData : false,
			cache : false,
			success : function(response) {
			},
			error : function(e) {

			}
		});
	}

	function getStateDetails() {

		var cname = $('#country').val();

		if (cname) {
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			//$("#dname").append(option);
			$.ajax({
				type : "GET",
				url : "view-account-branch-stateList?id=" + cname,
				success : function(response) {
					if (response.message == "success") {
						$("#states").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select State");
						$("#states").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#states").append(option);
						}
					}
				},
				error : function(e) {
				}
			});
		} else {
			$("#states").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$("#states").append(option);
			$("#states").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			//$("#dname").append(option);
		}
	}

	function getStateDataOnEdit(stateId) {
		var country = $("#country").val();
		if (country) {
			$.ajax({
				type : "GET",
				url : "view-crm-leads-stateList?id=" + country,
				success : function(response) {
					if (response.message == "success") {
						$("#states").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#states").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#states").append(option);
						}
						$("#states").val(stateId);
					}
				},
				error : function(e) {
				}
			});
		} else {
			$("#states").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$("#states").append(option);
		}
	}
</script>
