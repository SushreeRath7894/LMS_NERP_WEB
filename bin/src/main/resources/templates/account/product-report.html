<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/account/account-day-book.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script src="../javaScript/account/product-report.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="row">

								<!--Left Sec Start-->
								<div class="col-md-6 pd-r tab-transition position-relative">
									<div class="out-box">
										<div class="row d-flex  mb-20">

											<div class="col-md-10">
												<form class="d-flex search-sec flxwrap">
													<input class="form-control me-2 search_input_bar"
														placeholder="Search.." type="text" name="search"
														oninput="onQuickFilterChanged()" id="quickFilter"
														autocomplete="off">
													<button class="btn btn-primary go-btn"
														onclick="onQuickFilterChanged()" id="SearchBtn"
														type="button">Go</button>
												</form>
											</div>

											<div class="col-md-2 d-flex justify-content-end">
												<div class="btn btn-primary max-btn">
													<i class="fas fa-arrows-alt"></i>
												</div>
											</div>

										</div>

										<div class="leftSideParentContainer">
											<div class="maincontentsec">
												<div
													class="row d-flex justify-content-between mt-4 mb-2 align-items-center"
													id="headingDiv">
													<div class="button-right">
														<div id="dateDiv1" class="d-flex form-group">
															<label style="margin: 5px 8px 0px 0px;">From Dt:</label>
															<div class="form-group calendar_box" id='fdate'
																style="margin-right: 15px;">
																<input type="text" id="filterFromDate" value=""
																	class="form-control" placeholder="from date.."
																	th:attr="onkeyup=|formatDate('filterFromDate','${session.DATEFORMAT_JS}')|"
																	readonly> <i
																	class="ti-calendar picker_calendar"
																	id="fromDateCalender" style="top: 14px; right: 0px;"></i>
															</div>
														</div>
														<div id="dateDiv2" class="d-flex form-group">
															<label style="margin: 5px 8px 0px 0px;">To Dt:</label>
															<div class="form-group calendar_box" id="tdate"
																style="margin-right: 15px;">
																<input type="text" id="filterToDate" value=""
																	class="form-control" placeholder="to date.."
																	th:attr="onkeyup=|formatDate('filterToDate','${session.DATEFORMAT_JS}')|"
																	readonly> <i
																	class="ti-calendar picker_calendar" id="toDateCalendar"
																	style="top: 14px; right: 0px;"></i>
															</div>
														</div>
														<div class="buttonsec btn-hs" id="ttbtn">
															<button class="new-btn operation-btn-active" id="filterBtn" onclick="filter()">
																<i class="bi bi-search"></i> Search
															</button>
														</div>
														<div class="buttonsec btn-hs">
															<input type="button" class="btn1 operation-btn-active"
																id="purchaseRegisterExcel" value="Download Excel"
																style="width: 165px;"
																onclick="downloadExcelFromGrid('Purchase', gridOptions)"
																readonly>
														</div>
														<div class="buttonsec btn-hs">
															<input type="button" class="btn1" id="salesRegisterExcel"
																value="Download Excel" style="width: 100px"
																onclick="downloadExcelFromGrid('Sales', gridOptions1)"
																readonly>
														</div>
													</div>


												</div>

												<div class="d-flex justify-content-between">
													<div class="btn-hs">
														<div class="font-design" id="totalReq">
															TOTAL LIST(<span></span>) <input type="hidden" id="type">
														</div>
													</div>
												</div>

												<div id="myGrid"
													style="width: 100%; height: 500px; margin-top: 27px;"
													class="ag-theme-alpine"></div>

												<div id="salesGrid">
													<div id="myGrid1"
														style="width: 100%; height: 500px; margin-top: 27px;"
														class="ag-theme-alpine"></div>
												</div>

												<div id="totalAmountFooterDiv">
													<div class="form-group d-flex" style="float: right;">
														<label style="width: 240px; top: 13px;">Total
															Taxable Amount:</label> <input type="text" id="totalAmountFooter"
															class="form-control"
															style="margin-top: 7px; text-align: end;" readonly>
													</div>

													<div class="form-group d-flex" style="float: right;">
														<label style="width: 240px; top: 13px;">Total
															IGST:</label> <input type="text" id="totalIGSTAmount"
															class="form-control"
															style="margin-top: 7px; text-align: end;" readonly>
													</div>

													<div class="form-group d-flex" style="float: right;">
														<label style="width: 240px; top: 13px;">Total
															CGST:</label> <input type="text" id="totalCGSTAmount"
															class="form-control"
															style="margin-top: 7px; text-align: end;" readonly>
													</div>

													<div class="form-group d-flex" style="float: right;">
														<label style="width: 240px; top: 13px;">Total
															SGST:</label> <input type="text" id="totalSGSTAmount"
															class="form-control"
															style="margin-top: 7px; text-align: end;" readonly>
													</div>

													<div class="form-group d-flex" style="float: right;">
														<label style="width: 240px; top: 13px;">Total
															Payable Amount:</label> <input type="text"
															id="totalPayableAmount" class="form-control"
															style="margin-top: 7px; text-align: end;" readonly>
													</div>
												</div>

											</div>
										</div>


									</div>

								</div>

								<!--Right Sec Start-->
								<div class="col-md-6 pd-l tab-transition">
									<div class="out-box" id="rightSideDiv">

										<div class="btn btn-primary max-btn">
											<i class="fas fa-arrows-alt"></i>
										</div>

										<!--Right Inner Tab Start-->
										<ul class="nav nav-pills newtab mb-20 tablistUl navbarSticky"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" id="manageTab" href="#manageControl"
												onclick="tabAccess('manageControl')">Manage </a></li>
										</ul>

										<!-- Tab panes -->

										<div class="tab-content">
											<div id="manageControl"
												class="tab-pane active operational-tabs">

												<div class="innercontent">
													<div class="btn-hs">
														<h2 id="ledgerVcrName" style="font-size: 20px;">Product
															Report</h2>
														<label id="openinbalanceDate" class="animate-charcter"></label>
													</div>
														<div class="product-header">Select Product Category</div>
														<div class="modal-body modal-cat" >
															<div class="row">
																<input type="hidden" id="selectedProductCategory">
																<table id="basic">
																	<tbody id="costCeneterCBDiv"
																		style="background: #ffffffb8;"></tbody>
																</table>
															</div>
														</div>

												</div>

											</div>

										</div>

									</div>

								</div>
							</div>

						</div>

					</div>
				</div>

			</div>
		</div>
</body>
</html>
