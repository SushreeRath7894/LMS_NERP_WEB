<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="DayBookReport">
<head>


<!-- <link rel="stylesheet" href="../assets/css/account/account-day-book.css" />
 -->
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script src="../javaScript/account/account-day-book.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


</head>
<body>
	<div class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active d-block">
							<div class="row">

								<!--Left Sec Start-->
								<div class="col-md-12 pd-r tab-transition position-relative">
									<div class="out-box" style="height: auto">
										<div class="row d-flex  mb-20">

											<div class="col-md-10">
												<div class="d-flex search-sec flxwrap">
													<input class="form-control me-2 ms-2" type="text"
														placeholder="Search" style="width: 50vw"
														id="quickFilterDayBook" autocomplete="off"
														onkeyup="SearchUserInputDayBook(event)">
													<button class="btn go-btn " type="button"
														onclick="onQuickFilterChangedDayBook()">Go</button>
													<button class="btn go-btn ms-2"
														onclick="resetBtnDayBook()" type="reset">Reset</button>
												</div>
											</div>

										</div>

										<div class="leftSideParentContainerDayBook">
											<div class="ledgertable">
												<div
													class="row d-flex justify-content-between align-items-center mb-2 px-2">
													<!-- <div class="col-md-3  btn-hs">
														<div class="font-design" id="todayDate">
															DAY BOOK: (<span></span>)
														</div>
													</div> -->

													<div class="col-md-3">

														<div class="form-group">
															<label class="font-design">Voucher Type</label>
															<div class="select" style="width: 200px;">
																<select id="dayBookVoucherType" class="form-control"
																	onchange="getDataVoucherType();">
																	<option value="">--Select--</option>
																	<option value="PAYMENT">PAYMENT</option>
																	<option value="RECEIPT">RECEIPT</option>
																	<option value="SALE">SALE</option>
																	<option value="PURCHASE">PURCHASE</option>
																	<option value="JOURNAL">JOURNAL</option>
																	<option value="CONTRA">CONTRA</option>
																</select>
															</div>
														</div>
													</div>


													<div class="col-md-3 form-group">
														<label class="font-design">Change Date</label>
														<div class="form-group calendar_box">
															<input type="text" id="dayBookfromDate"
																placeholder="Date" class="form-control"
																style="color: black; border-radius: 5px;"> <i
																class="ti-calendar picker_calendar"
																id="dayBooktoDateCalendar"
																style="top: 12px; right: 5px;"
																onchange="getDateFilterData()"></i>
														</div>
													</div>

													<div class="col-md-3 form-group">
														<button
															class="download-btn operation-btn-active edit-btn d-none"
															style="margin-top: 30px;" id="dayBookPdf"
															onclick="PdfDownloadButton()">Download PDF</button>
													</div>


												</div>

												<table class="table table-bordered table-striped" id="DayBookTable">
													<thead style="display: auto;">
														<tr align="center" style="background: #f5f6f7;"
															valign="middle">
															<th width="10%"><strong>Date </strong></th>
															<th width="35%"><strong>Particulars </strong></th>

															<th width="10%"><strong>Voucher Type </strong></th>
															<th width="15%"><strong>Voucher No. </strong></th>
															<th width="15%"><strong>Debit Amount<br>
															</strong></th>
															<th width="15%"><strong>Credit Amount<br>
															</strong></th>

														</tr>
													</thead>
													<tbody id="tblbody"
														style="display: auto; overflow-x: auto;">

													</tbody>
												</table>
											</div>
										</div>

										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
										<input type="hidden" id="docUniqueId" />

									</div>

								</div>

								<!--Right Sec Start-->
								<div class="col-md-12 pd-l tab-transition d-none">
									<div class="out-box" id="rightSideDiv">

										<div class="btn btn-primary max-btn">
											<i class="fas fa-arrows-alt"></i>
										</div>

										<!--Right Inner Tab Start-->
										<ul class="nav nav-pills newtab mb-20 tablistUl navbarSticky"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" id="manageTab" href="#manageControl"
												onclick="tabAccess('manageControl')">Manage </a></li>
										</ul>

										<!-- Tab panes -->

										<div class="tab-content">
											<div id="manageControl"
												class="tab-pane active operational-tab d-block">

												<div class="innercontent">
													<div class="btn-hs">
														<h2 id="ledgerVcrName" style="font-size: 20px;">Account
															Day Book</h2>
														<label id="openinbalanceDate" class="animate-charcter"></label>
													</div>

													<!-- <div class="container">
														<div class="pdf-icon">
															<i class="fa-solid fa-file-pdf"></i>
														</div>
														<p class="download-para">The Account Day Book provides
															a comprehensive summary of your daily financial
															transactions. Download the PDF to review and keep track
															of your records.</p>
														<div class="progress-bar " style="display: none">
															<div class="progress-bar-fill" id="progressFill">0%</div>
														</div>
														<button class="download-btn operation-btn-active"
															onclick="PdfDownloadButton()" id="downloadBtn">Download
															PDF</button>
													</div> -->

													<div class="noDataFoundContainer" style="display: none">

														<i class="bi bi-emoji-frown-fill notFoundIcon"></i>
														<p>No data available in the Account Day Book. Once
															transactions are recorded, they will appear here. Please
															check back later or ensure your entries are up-to-date.</p>
													</div>
												</div>

											</div>

										</div>

									</div>

								</div>
							</div>

						</div>

					</div>
				</div>

			</div>
		</div>
	</div>
</body>
</html>
