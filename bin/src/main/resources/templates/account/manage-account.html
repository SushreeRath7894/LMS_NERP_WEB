<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>



<script src="../javaScript/account/manage-account.js"></script>
<link rel="stylesheet" href="../assets/css/edms/workspace.css" />
<link rel="stylesheet" href="../assets/css/account/manageAccount.css" />
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<!-- <link rel="stylesheet"
	href="../css/production-plan/rmpm-requisition.css"> -->

</head>
<style>
</style>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="d-flex flex-column flex-lg-row">

								<!--Left Sec Start-->
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between bdr-line p-2">

											<div class="col-md-8 col-12">
												<form class="d-flex search-sec"  onsubmit="return false;">
													<input class="form-control me-2 search_input_bar"
														placeholder="Search.." type="text" name="search"
														onkeyup="SearchUserInput(event)" id="quickFilter"
														autocomplete="off">
													<button class="btn btn-primary go-btn"
														onclick="onQuickFilterChanged()" id="SearchBtn"
														type="button">Go</button>
														&nbsp;
														<button class="btn go-btn w-auto" type="button" onclick="resetBtn()">Reset</button>
												</form>
											</div>

											<div class="col-md-2 d-flex justify-content-end">
												<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
											</div>

										</div>
										<div class="card m-2 p-2">
										<div class="font-design mb-1" id="totalReq">
										<!-- 	ALL ACCOUNTS (<span></span>) -->
										</div>
										<div id="myGrid" style="width: 100%; height: 100vh;"
											class="ag-theme-alpine"></div>
                                        </div>
									</div>

								</div>

								<!--Left Sec End-->



								<!--Right Sec Start-->
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box">
										<div class="d-flex flex-row-reverse justify-content-between align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>



										<!--Right Inner Tab Start-->
										<div class="d-flex gap-2">
										<ul class="nav nav-pills newtab tablistUl"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" id="userGroupNav"
												href="#groupCreation" onclick="createWorkspace()">Account
													Information</a></li>

										</ul>
										</div>
										</div>



										<!-- Tab panes -->

										<div class="tab-content flex-fill h-25">
											<!-- Create Workspace -->
											<div id="groupCreation" class="tab-pane active h-100 p-2">

												<div class="requisition-tbl d-flex flex-column h-100">

													<div class="mb-2">
														<table class="table table-bordered mb-0" width="100%">
															<tr valign="middle">
																<td width="50%"><strong><div
																			class="col-md-12 requisition_ids_text">
																			<!-- Account ID: --> <span id="accountId" class="d-none"></span>
																			<span id="bankAccountName"></span>
																		</div></strong></td>
																<!-- <td width="10%">Male</td>
																<td width="10%">45</td> -->
																<td>
																	<div class="d-flex justify-content-end flxwrap">
																		<div class="mr-2">
																			<button
																				class="btn btn-primary edit-btn d-none"
																				type="button" id="add-btn"
																				onclick="newFolderDetailsAdd()">Add</button>
																		</div>
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn d-none"
																				type="button" onclick="editFolder()" id="accountEditbtn">Edit</button>
																		</div>

																		<div class="mr-2" >
																			<button class="btn btn-primary edit-btn d-none"
																				onclick="addAccountInfo()" type="button" id="parentSaveBtn">Save</button>
																		</div>
																		
																		<div class="mr-2" >
																			<button class="btn btn-primary edit-btn d-none"
																				onclick="cancelAccountBtn()" type="button" id="parentCancelBtn">Cancel</button>
																		</div>
																		<div class="mr-2" >
																			<button class="btn btn-primary edit-btn d-none"
																				onclick="deleteAccount()" type="button" id="parentDeleteBtn">Delete</button>
																		</div>

																	</div>

																</td>
															</tr>
														</table>
													</div>
													<div class="card p-2 mt-0">
													<form>
														<div class="content-header">
															<!-- Modal Header -->
															<div class="form-modal-header"></div>
															<div class="row">
																<div class="col-md-12 d-flex justify-content-end" id="notificationBox" style="margin:4px 0px">
																
																</div>
															</div>
															<div class="row">
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Bank Name <span class="mandatory">*</span></label>
																		<!-- <div class="select">
																			<select id="bankName" class="form-control"
																				onchange="getbranchname()">
																				<option value="">Select Bank</option>
																				<option th:each="c,iter:${bankList}"
																					th:value="${c.key}" th:text="${c.name}"></option>
																				<option
																					style="margin-left: -26px; border-bottom: solid 1px #6189c2; cursor: pointer; background-color: #0c0c6b; color: white"
																					value="addbank" id="creditLedger"
																					onclick="addnewbank()">+ Add Bank</option>
																			</select>
																		</div> -->

																		<input type="text" id="BankAccountName"
																			class="form-control debitAccountSubGroupCls"
																			onkeyup="getBankAccountName(this.id);"
																			autocomplete="off" placeholder="Search Bank Name...">
																		<div id="suggesstion-box1_0"></div>
																		<input type="hidden" id="bankNameId"
																			class="form-control debitAccountGroupIdCls" />
																	</div>
																</div>


																<div class="col-md-4">
																	<div class="form-group">
																		<label>Account Holder Name</label> <span
																			class="mandatory">*</span> <input type="text"
																			class="form-control" id="accountHolder"
																			placeholder="Account Holder Name" autocomplete="off">
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>Account Number</label> <span class="mandatory">*</span>
																		<input type="text" class="form-control"
																			id="accountNumber" placeholder="Account Number"
																			autocomplete="off">
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>Account Type</label>

																		<div class="select">
																			<select id="accountType" class="form-control">
																				<option value="">Select</option>
																				<option value="Saving Account">Saving
																					Account</option>
																				<option value="Current Account">Current
																					Account</option>
																				<option value="OD/CC">OD/CC</option>
																				<option value="Cash Credit">Cash Credit</option>
																			</select>
																		</div>
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>IFSC Number</label> <span class="mandatory">*</span>
																		<input type="text" class="form-control"
																			id="ifscNumber" placeholder="IFSC Number"
																			oninput="validateIfsc()"> <small
																			id="ifscError" style="color: red; display: none;">Invalid
																			IFSC code. Please enter a valid code.</small>
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>Branch Name</label> <input type="text"
																			class="form-control" id="branchName"
																			placeholder="Branch Name" readonly>

																	</div>
																</div>

																<!-- <div class="col-md-4">
																	<div class="form-group">
																		<label>Branch Name</label>
																		<input type="text" class="form-control"
													id="branchName" placeholder="Branch Name">
																		<div class="select">
																			<select id="branchName" class="form-control"
																				onchange="addbankbranch2()">
																				<option value="">Select Branch</option>

																			</select>
																		</div>
																	</div>
																</div> -->


																<div class="col-md-4">
																	<div class="form-group">
																		<label>Opening Balance</label> <input type="text"
																			class="form-control" id="openingBalance"
																			placeholder="Opening Balance"
																			oninput="formatAmount(this);"
																			autocomplete="off">
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>Status</label>
																		<div class="select">
																			<select id="status" class="form-control">
																				<option value="">Select</option>
																				<option value="Active">Active</option>
																				<option value="Inactive">Inactive</option>
																			</select>
																		</div>
																	</div>
																</div>
															</div>


														</div>
													</form>
													</div>
												</div>
											</div>
										</div>

									</div>

								</div>
							</div>
							<!--Tabbination 1 End-->

						</div>

					</div>
				</div>

			</div>
		</div>
</body>
</html>
