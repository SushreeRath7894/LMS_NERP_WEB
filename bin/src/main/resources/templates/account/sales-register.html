		 function parseDate(dateStr, format) {
		        // Example assumes format is DD-MM-YYYY
		        var parts = dateStr.split('-');
		        return new Date(parts[2], parts[1] - 1, parts[0]); // YYYY, MM, DD
		    }

		    // Function to update date pickers based on selected range
		    function updateDatePickers(yearStart, yearEnd) {
		        var minDate = `01-04-${yearStart}`;
		        var maxDate = `31-03-${yearEnd}`;
		        var minDateParsed = parseDate(minDate, dateFormat);
		        var maxDateParsed = parseDate(maxDate, dateFormat);

		        $("#toDateCalendar").datetimepicker('destroy').datetimepicker({
		            format: dateFormat,
		            closeOnDateSelect: true,
		            timepicker: false,
		            minDate: minDateParsed,
		            maxDate: maxDateParsed
		        }).on("change", function() {
		            $('#fromDate').val($(this).val());
		        });

		        $('#fromDate').blur(function() {
		            $("#toDateCalendar").val($(this).val());
		        });

		        $("#toDateCalendar2").datetimepicker('destroy').datetimepicker({
		            format: dateFormat,
		            closeOnDateSelect: true,
		            timepicker: false,
		            minDate: minDateParsed,
		            maxDate: maxDateParsed
		        }).on("change", function() {
		            $('#toDate').val($(this).val());
		        });

		        $('#toDate').blur(function() {
		            $("#toDateCalendar2").val($(this).val());
		        });
		    }

		    // Function to handle dropdown change
		    function handleDropdownChange() {
		        var datee = $("#orderStatusFilter").val();

		        // Extract year range from selected value
		        var yearRange = datee.split('-');
		        if (yearRange.length === 2) {
		            var yearStart = yearRange[0];
		            var yearEnd = yearRange[1];

		            // Update date pickers with new date range
		            updateDatePickers(yearStart, yearEnd);
		        }
		    }

		    // Attach change event handler to dropdown
		    $("#orderStatusFilter").change(function() {
		        handleDropdownChange();
		    });

		    // Initialize date format and default date values

		    var dateString = ('0' + today.getDate()).slice(-2) + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + today.getFullYear();
		    var fromDate = dateString.toString();
		    var toDate = dateString.toString();

		    // Set initial date range based on current selection
		    handleDropdownChange(); 
		
		    viewFilteredData();

	function amountFormatter(value) {
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split('.');
	        var integerPart = parts[0];
	        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
	        return formattedIntegerPart + decimalPart;
	    } else {
	        return '';
	    }
	}
	
	function valueFormatForQN(value) {
		 
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split(' ');
	        var numberPart = parts[0];
	        var suffix = parts.length > 1 ? ' ' + parts[1] : '';

	        var numberParts = numberPart.split('.');
	        var integerPart = numberParts[0];
	        var decimalPart = numberParts.length > 1 ? '.' + numberParts[1] : '';

	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);

	        return formattedIntegerPart + decimalPart + suffix;
	    } else {
	        return '';
	    }
	}

	        });
	        return values.join(', ');
	    }
	    return params.value; 
	}

function getCurrentFinancialYear() {
	  var fiscalyear = "";
	  var today = new Date();
	  if ((today.getMonth() + 1) <= 3) {
	    fiscalyear = (today.getFullYear() - 1) + "-" + today.getFullYear()
	  
	  } else {
	    fiscalyear = today.getFullYear() + "-" + (today.getFullYear() + 1)
	    
	  }
	  $("#orderStatusFilter").val(fiscalyear);
	  return fiscalyear
	} 
		
var GridRowData = [];
function viewFilteredData(){
	$('.loader').show();
	var fromDateFilter = $("#fromDate").val();
	var toDateFilter = $("#toDate").val();
	var validation = true;
	var totalIGSTAmount = 0.00;
	var totalCGSTAmount = 0.00;
	var totalSGSTAmount = 0.00;
	var totalPayableAmount = 0.00;
	if(fromDateFilter == null || fromDateFilter == ""){
		swal("Please Provide From Date");
		validation = false; 
	}else if(toDateFilter == null || toDateFilter == ""){
		swal("Please Provide To Date");
		validation = false;
	}
	if(validation){
		agGrid.simpleHttpRequest({
			url : "sales-voucher-view-filteredData?fromDate=" +fromDateFilter+ "&toDate=" +toDateFilter,
		}).then(function(data) {
			$('.loader').hide();
			
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.viewSalesVoucher;
			GridRowData = allData
			var FiltervoucherType = jsonData.distinctVoucherTypes;
			
			if(allData == "" || allData == "null" || allData == null){
				$('#totalReq').find('span').html('0');
				gridOptions.api.setRowData();
				$("#salesRegisterPdf").prop("disabled", true);
				$("#totalAmountFooter").val("0.00");
				$("#totalIGSTAmount").val("0.00");
				$("#totalCGSTAmount").val("0.00");
				$("#totalSGSTAmount").val("0.00");
				$("#totalPayableAmount").val("0.00");
				$("#dwnldExcel").prop("disabled", true);
			}else{
				var len = allData.length;
				$('#totalReq').find('span').html(len);
				gridOptions.api.setRowData(allData);
				var totalSum = allData.reduce(function(acc, curr) {
		            return acc + parseFloat(curr.Taxableamt);
		        }, 0);
				for(var i=0; i< len;i++){
					totalIGSTAmount = totalIGSTAmount + parseFloat(allData[i].igst);
					totalCGSTAmount = totalCGSTAmount + parseFloat(allData[i].cgst);
					totalSGSTAmount = totalSGSTAmount + parseFloat(allData[i].sgst);
					totalPayableAmount = totalPayableAmount + parseFloat(allData[i].invoicevalue);
				}
				$("#salesRegisterPdf").prop("disabled", false);
				$("#dwnldExcel").prop("disabled", false);
				$("#totalAmountFooter").val(amountFormatter(totalSum.toFixed(2)));
				$("#totalIGSTAmount").val(amountFormatter(totalIGSTAmount.toFixed(2)));
				$("#totalCGSTAmount").val(amountFormatter(totalCGSTAmount.toFixed(2)));
				$("#totalSGSTAmount").val(amountFormatter(totalSGSTAmount.toFixed(2)));
				$("#totalPayableAmount").val(amountFormatter(totalPayableAmount.toFixed(2)));
				$('#voucherTypeFilter').children('option:not(:first)').remove();

				FiltervoucherType.map((element)=>{
					var option = $('<option></option>');
					option.val(element).text(element);
					$("#voucherTypeFilter").append(option);
				})
			}
		});
	}
}

function downloadExcelFromGrid() {
	  const selectedHeaders = [
	    "Date", "INVOICE NUMBER", "GSTIN NO", "TAX INVOICE NUMBER", "Voucher Type", "Voucher Class",
	    "BILLING DATE", "VENDOR NAME", "DESTINATION STATE", "MATERIAL CODE", "MATERIAL DESCRIPTION",
	    "HSN CODE", "Quantity", "Quantity(Case)", "Quantity(KG)", "GST RATE (%)", "TAXABLE AMOUNT",
	    "IGST", "cGST", "SGST", "INVOICE VALUE", "TDS", "TCS", "NET RECEIVABLE"
	  ];

	  const fieldsToSum = [
	    'TAXABLE AMOUNT', 'IGST', 'cGST', 'SGST', 'INVOICE VALUE', 'TDS', 'TCS', 'NET RECEIVABLE'
	  ];

	  const companyName = $("#sessionDivision1").val()?.toUpperCase() || "COMPANY NAME";
	  const fromDate = $("#fromDate").val();
	  const toDate = $("#toDate").val();

	  const currentDate = new Date().toLocaleDateString('en-GB').split('/').join('_');
	  const fileName = 'Sales_Register_Report_' + currentDate + '.xlsx';

	  const rowData = [];
	  const fieldMap = {};
	  const totals = {};
	  fieldsToSum.forEach(header => totals[header] = 0);

	  gridOptions.columnApi.getAllColumns().forEach((col) => {
	    const colDef = col.getColDef();
	    if (colDef.headerName && colDef.field) {
	      fieldMap[colDef.headerName.trim()] = colDef.field;
	    }
	  });

	  gridOptions.api.forEachNodeAfterFilterAndSort((node) => {
	    const row = {};
	    selectedHeaders.forEach((header) => {
	      const field = fieldMap[header.trim()];
	      let value = node.data?.[field] ?? '';
	      if (fieldsToSum.includes(header)) {
	        const num = parseFloat(value);
	        totals[header] += isNaN(num) ? 0 : num;
	        value = amountFormatter(isNaN(num) ? '0.00' : num.toFixed(2));
	      }
	      row[header] = value;
	    });
	    rowData.push(row);
	  });

	  // Add total row
	  const totalRow = {};
	  selectedHeaders.forEach(header => {
	    if (fieldsToSum.includes(header)) {
	      totalRow[header] = amountFormatter(totals[header].toFixed(2));
	    } else if (header === 'Date') {
	      totalRow[header] = 'Total';
	    } else {
	      totalRow[header] = '';
	    }
	  });
	  rowData.push(totalRow);

	  // Create worksheet from rowData (leave space for 4 heading rows)
	  const ws = XLSX.utils.json_to_sheet(rowData, {
	    header: selectedHeaders,
	    skipHeader: true
	  });

	  // Add heading rows above data
	  XLSX.utils.sheet_add_aoa(ws, [
	    [companyName],
	    [`Sales Register Report From ${fromDate} To ${toDate}`],
	    ['―'.repeat(80)],
	    selectedHeaders
	  ], { origin: 'A1' });

	  // Merge top 3 heading rows
	  ws['!merges'] = [
	    { s: { r: 0, c: 0 }, e: { r: 0, c: selectedHeaders.length - 1 } }, // Company name
	    { s: { r: 1, c: 0 }, e: { r: 1, c: selectedHeaders.length - 1 } }, // Date range
	    { s: { r: 2, c: 0 }, e: { r: 2, c: selectedHeaders.length - 1 } }  // Divider
	  ];

	  // Style top heading rows
	  ws['A1'] = {
	    v: companyName,
	    t: 's',
	    s: {
	      font: { bold: true, sz: 16 },
	      alignment: { horizontal: 'center', vertical: 'center' },
	      fill: { fgColor: { rgb: 'DCE6F1' } }
	    }
	  };

	  ws['A2'] = {
	    v: `Sales Register Report From ${fromDate} To ${toDate}`,
	    t: 's',
	    s: {
	      font: { bold: true, sz: 14 },
	      alignment: { horizontal: 'center', vertical: 'center' },
	      fill: { fgColor: { rgb: 'E2EFDA' } }
	    }
	  };

	  ws['A3'] = {
	    v: '―'.repeat(80),
	    t: 's',
	    s: {
	      alignment: { horizontal: 'center', vertical: 'center' },
	      font: { color: { rgb: "666666" } }
	    }
	  };

	  // Style column headers (row 4)
	  selectedHeaders.forEach((header, i) => {
	    const cellAddress = XLSX.utils.encode_cell({ r: 3, c: i });
	    if (ws[cellAddress]) {
	      ws[cellAddress].s = {
	        fill: { fgColor: { rgb: "5784c4" } },
	        font: { bold: true, color: { rgb: "FFFFFF" } },
	        alignment: { horizontal: "center", vertical: "center" },
	        border: {
	          top: { style: "thin", color: { rgb: "000000" } },
	          bottom: { style: "thin", color: { rgb: "000000" } },
	          left: { style: "thin", color: { rgb: "000000" } },
	          right: { style: "thin", color: { rgb: "000000" } }
	        }
	      };
	    }
	  });

	  // Set column widths
	  ws['!cols'] = selectedHeaders.map(header => {
	    switch (header) {
	      case 'VENDOR NAME': return { wch: 40 };
	      case 'MATERIAL DESCRIPTION': return { wch: 35 };
	      case 'TAXABLE AMOUNT':
	      case 'IGST':
	      case 'SGST':
	      case 'cGST':
	      case 'TDS':
	      case 'TCS':
	      case 'INVOICE VALUE':
	      case 'NET RECEIVABLE':
	        return { wch: 18 };
	      default:
	        return { wch: 20 };
	    }
	  });

	  // ✅ Set row heights to fix visibility of heading rows
	  ws['!rows'] = [
	    { hpt: 24 }, // Row 1: Company Name
	    { hpt: 20 }, // Row 2: Report title
	    { hpt: 14 }, // Row 3: Divider
	    { hpt: 18 }  // Row 4: Column headers
	  ];

	  // Export the workbook
	  const wb = XLSX.utils.book_new();
	  XLSX.utils.book_append_sheet(wb, ws, 'Sales Register Report');
	  XLSX.writeFile(wb, fileName);
	}

function calculateGridAmount(allData){
	
	
	var totalIGSTAmount = 0.00;
	var totalCGSTAmount = 0.00;
	var totalSGSTAmount = 0.00;
	var totalPayableAmount = 0.00;
	if(allData == "" || allData == "null" || allData == null){
		$('#totalReq').find('span').html('0');
		gridOptions.api.setRowData();
		$("#salesRegisterPdf").prop("disabled", true);
		$("#totalAmountFooter").val("0.00");
		$("#totalIGSTAmount").val("0.00");
		$("#totalCGSTAmount").val("0.00");
		$("#totalSGSTAmount").val("0.00");
		$("#totalPayableAmount").val("0.00");
		$("#dwnldExcel").prop("disabled", true);
	}else{
		var len = allData.length;
		$('#totalReq').find('span').html(len);
		gridOptions.api.setRowData(allData);
		var totalSum = allData.reduce(function(acc, curr) {
            return acc + parseFloat(curr.Taxableamt);
        }, 0);
		for(var i=0; i< len;i++){
			totalIGSTAmount = totalIGSTAmount + parseFloat(allData[i].igst);
			totalCGSTAmount = totalCGSTAmount + parseFloat(allData[i].cgst);
			totalSGSTAmount = totalSGSTAmount + parseFloat(allData[i].sgst);
			totalPayableAmount = totalPayableAmount + parseFloat(allData[i].invoicevalue);
		}
		$("#salesRegisterPdf").prop("disabled", false);
		$("#dwnldExcel").prop("disabled", false);
		$("#totalAmountFooter").val(amountFormatter(totalSum.toFixed(2)));
		$("#totalIGSTAmount").val(amountFormatter(totalIGSTAmount.toFixed(2)));
		$("#totalCGSTAmount").val(amountFormatter(totalCGSTAmount.toFixed(2)));
		$("#totalSGSTAmount").val(amountFormatter(totalSGSTAmount.toFixed(2)));
		$("#totalPayableAmount").val(amountFormatter(totalPayableAmount.toFixed(2)));
		//$('#voucherTypeFilter').children('option:not(:first)').remove();

		/* FiltervoucherType.map((element)=>{
			var option = $('<option></option>');
			option.val(element).text(element);
			$("#voucherTypeFilter").append(option);
		}) */
	}
}

				$('#qCGST').val(amountFormatter(parseFloat(response.body[0].cgst).toFixed(2)));

				$("#tcsValue").val(amountFormatter(parseFloat(response.body[0].tcsValue).toFixed(2)));
				$("#tdsRate").val(response.body[0].tdsRate);
				var nr=response.body[0].netReceivable;
				if(nr=='0.00'){
					$("#netReceivable").val(amountFormatter(parseFloat(response.body[0].totalAmount).toFixed(2)));
				}

				itemOptions.api.setRowData(response.body[0].productList);
				
			}

	});
