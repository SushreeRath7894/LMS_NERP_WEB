	function formatDate(date) {
	    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
	    var day = date.getDate();
	    var month = months[date.getMonth()];
	    var year = date.getFullYear();
	    var dayFormatted = (day < 10) ? '0' + day : day;
	    
	    return dayFormatted + ' ' + month + ' ' + year;
	}
	
	
	function amountFormatter(value) {
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split('.');
	        var integerPart = parts[0];
	        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
	        return formattedIntegerPart + decimalPart;
	    } else {
	        return '';
	    }
	}
	

	function getProfitLossData() {

		var fromDate = $("#fromDate").val();
		var toDate = $("#toDate").val();
		var orgName = $("#orgName").val();
		$("#orgNameView").text(orgName)
		$("#orgNameView1").text(orgName)

		$
				.ajax({
					type : "GET",
					url : "profile-and-loss-reportData",
					async : false,
					success : function(response) {
							var data = JSON.parse(response.body);
							var ExpensesAmountTotal = 0;
							var IncomesAmountTotal = 0;

							for (var i = 0; i < data.length; i++) {
							    var $li = $("ul." + data[i].TAGM_AccountGroup).find("li").first();
							    
							    $li.text(amountFormatter(data[i].DynamicAmount.toFixed(2)));
								
								if(data[i].TAGM_AccGroup_Type == 'Expenses'){
									ExpensesAmountTotal = ExpensesAmountTotal + data[i].DynamicAmount ;
								}
								else if(data[i].TAGM_AccGroup_Type == 'Incomes'){
									IncomesAmountTotal = IncomesAmountTotal + data[i].DynamicAmount ;
								}
								
							}
							
							
							var profitLossAmount = ExpensesAmountTotal - IncomesAmountTotal ;

							
							if(ExpensesAmountTotal > IncomesAmountTotal){
								$("#netLossAmount").text(amountFormatter(Math.abs(profitLossAmount).toFixed(2)));
								$("#netProfitText").hide();
								$("#netProfitAmount").hide();
								IncomesAmountTotal = IncomesAmountTotal + Math.abs(profitLossAmount);
								
							}
							
							else if(ExpensesAmountTotal < IncomesAmountTotal){
								
								$("#netProfitAmount").text(amountFormatter(Math.abs(profitLossAmount).toFixed(2)));
								$("#netLossText").hide();
								$("#netLossAmount").hide();
								ExpensesAmountTotal = ExpensesAmountTotal + Math.abs(profitLossAmount);
							}
							
							else if(profitLossAmount == 0){
								$("#netProfitText").hide();
								$("#netProfitAmount").hide();
								$("#netLossText").hide();
								$("#netLossAmount").hide();
								$(".profitlosstr").hide();
							}
							
							
							
							$("#ExpensesTotal").text(amountFormatter(ExpensesAmountTotal.toFixed(2)));
							
							$("#IncomesTotal").text(amountFormatter(IncomesAmountTotal.toFixed(2)));



					}
				})

	}

	function getLedgerModal(groupId, accountType, groupName) {

			async : false,
			success : function(response) {
				
				if (response.code == "Success") {
					$("#childGrpLedgerList").empty();
					var jsonData = JSON.parse(response.body);
					var allData=jsonData.viewLedgerList;
					var len = '0';
					if (allData != null){
						len = allData.length;
					}
					if (len == '0' || len == null || len == 0) {
						var emptybdy='<tr align="left" valign="top">'
							+'<td colspan="5" style="text-align: center;">NO LEDGER FOUND</td>'
							+'</tr>';
						$("#childGrpLedgerList").append(emptybdy);
					}else{
						for(var i=0;i<len;i++){
						    
							var rowColorStyle = i % 2 === 0 ? 'background-color: #ffffff;' : 'background-color: #bcb6b6;';
							var bdy = '<tr align="left" valign="top" style="' + rowColorStyle + '">'
								+'<td style="text-align: left;">'+allData[i].ledgerId+'</td>'
								+'<td style="text-align: left;">'+allData[i].ledgerName+'</td>'
								+'<td style="text-align: right;">₹'+amountFormatter(allData[i].debitAmtSum.toFixed(2))+'</td>'
								+'<td style="text-align: right;">₹'+amountFormatter(allData[i].creditAmtSum.toFixed(2))+'</td>'
								+'<td style="text-align: center; text-decoration: underline;"><a href="#" onclick="voucherTransactionList(\'' + allData[i].ledgerId + '\', \'' + accountType + '\', \'' + btoa(allData[i].ledgerName) + '\')">View</a></td>'
								+'</tr>';
						  $("#childGrpLedgerList").append(bdy);		
						}
						var totalDebitCalc = allData.reduce((sum, entry) => sum + parseFloat(entry.debitAmtSum), 0);
						var totalCreditCalc = allData.reduce((sum, entry) => sum + parseFloat(entry.creditAmtSum), 0);
						
						var totalbdy = '<tr align="left" valign="top">'
							+ '<td colspan="1"></td>'
						    + '<td colspan="1" style="text-align: right;"><strong>Total:</strong></td>'
						    + '<td style="text-align: right;"><strong>₹' + amountFormatter(totalDebitCalc.toFixed(2)) + '</strong></td>'

						    + '<td colspan="1"></td>'
						    + '</tr>';
						    
						$("#childGrpLedgerList").append(totalbdy);
					}
					
				}
			
			}

	function formatDateFYear(date) {
	    var day = date.getDate();
	    var month = date.getMonth() + 1;
	    var year = date.getFullYear();
	    var dayFormatted = (day < 10) ? '0' + day : day;
	    var monthFormatted = (month < 10) ? '0' + month : month;

	    return dayFormatted + '-' + monthFormatted + '-' + year;
	}

		function getSubChild(parentid, accountType, ulName) {
			 $(".loader").show();
		    console.log("getSubChild===get parentid==" + parentid + "==accountType==" + accountType + "==ulName==" + ulName);
		    var amountUL = $("#" + ulName);

		    if ($("." + parentid).hasClass('fa-plus-circle')) {

		        $("." + parentid).removeClass('fa-plus-circle');
		        $("." + parentid).addClass('fa-minus-circle');

		        $.ajax({
		            type: "GET",
		            url: "balance-sheet-getSubchild?parentid=" + parentid,
		            async: false,
		            success: function(response) {
		                console.log("getSubChild resonse==" + JSON.stringify(response.body))
		                var data = response.body;
		                var ulList = $("<ul></ul>");
		                for (var i = 0; i < data.length; i++) {
		                    (function(index) {
		                        var icon = $('<i/>', {
		                            class: 'subchild fa fa-plus-circle ' + data[index].groupId,
		                            'aria-hidden': 'true'
		                        });
		                        var a = $('<a/>', {
		                            onclick: "getSubChild('" + data[index].groupId + "', '" + accountType + "', '" + ulName + "')"
		                        }).append(icon);
		                        
		                        var spanText = $('<span/>', {
		                            text: data[index].groupName,
		                            onclick: "getLedgerModal('" + data[index].groupId + "' , '" + accountType + "' , '" + btoa(data[index].groupName) + "')"
		                        }).css('cursor', 'pointer');
		                        
		                        var space = $('<span/>', {
		                            text: ' '
		                        });
		                        
		                        var editIcon = $('<i/>', {
		                            class: 'bi bi-window',
		                            'aria-hidden': 'true',
		                            onclick: "getLedgerModal('" + data[i].groupId + "' , '" + accountType + "' , '" + btoa(data[i].groupName) + "')"
		                        }).css('cursor', 'pointer');
		                        
		                        var li = $("<li></li>").append(a).append(spanText).append(space).append(editIcon).addClass("ChildList");
		                        var amountChildUl = $("<ul></ul>");
		                        amountChildUl.addClass(parentid);
		                        if(data[index].amount < 0){
		                        var amountli = $("<li></li>").append(amountFormatter(Math.abs(data[index].amount).toFixed(2)) + " Dr");		                        	
		                        }
		                        else if(data[index].amount >0){
		                        	var amountli = $("<li></li>").append(amountFormatter(Math.abs(data[index].amount).toFixed(2)) + " Cr");
		                        }
		                        else{
		                        	var amountli = $("<li></li>").append(data[index].amount);
		                        }
		                        li.attr("id", data[index].groupId);
		                        amountli.attr("id", data[index].groupId);
		                        amountli.addClass('amountAlign');
		                        var targetLi = amountUL.find('li#' + parentid);
		                        if(data[0].childAmount < 0){
		                        	amountUL.find('li#' + parentid).text(amountFormatter(Math.abs(data[0].childAmount).toFixed(2)) + " Dr");
		                        }
		                        else if(data[0].childAmount >0){
		                        	amountUL.find('li#' + parentid).text(amountFormatter(data[0].childAmount) + " Cr");
		                        }
		                        else{		                        	
		                        amountUL.find('li#' + parentid).text(amountFormatter(data[0].childAmount));
		                        }
		                        ulList.append(li);
		                        amountChildUl.append(amountli);
		                        targetLi.after(amountChildUl);
		                    })(i);
		                }

		                $("#" + parentid).append(ulList);
		                $(".loader").hide();
		            },
		            error: function(e) {
		            	 $(".loader").hide();
		            }
		        });

		    } else if ($("." + parentid).hasClass('fa-minus-circle')) {

		        $("." + parentid).removeClass('fa-minus-circle');
		        $("." + parentid).addClass('fa-plus-circle');

		        $("#" + parentid).find('ul').html('');
		        var targetLi = amountUL.find('ul.' + parentid);
		        targetLi.remove();
		        $(".loader").hide();
		    }
		}
</script>
