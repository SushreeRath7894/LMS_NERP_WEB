	function filterCreditorsLedger() {
		//alert("hello")
		var financialYear = $("#financialYear").val();
		var fromDate = $('#fromDate').val();
		var toDate = $('#toDate').val();

		if (fromDate === null || fromDate === '') {

				if (financialYear === null || financialYear === '') {
					swal("Select Financial Year");
					return false;

				}
			} else {
				swal("Insert From Date");

			}
		}

		if (toDate === null || toDate === '') {
			if (fromDate === null || fromDate === '') {

					swal("Select Financial Year");
					return false;
				}
			} else {

			}
		}

		getSearchData();
	}

	 function getDealerStmntNameList() {
		// alert("hello")
			var search = $("#dname").val();
			if(search.length<1){
				$("#suggesstion-box20_").hide();
			}
			if (search) {

				$.ajax({
						type : "POST",
						url : "debit-view-get-vender-list",
						dataType : 'json',
						contentType : 'application/json',
						data : search,
						success : function(response) {
							if (response.message == "success") {
								if (response.body.length != 0) {
									$("#search").css("background", "#FFF");
									var content = '<ul id="autocomplete-list1" style="font-weight:600; color:#fff;  font-size:12px; background-color: #07449b;">';
									for (var i = 0; i < response.body.length; i++) {
											content += '<li class="autocompletedata cp" onClick="selectAutocompleteValue20(\''
													+ response.body[i].dealerId
													 + '\',\''
													 + response.body[i].dname
													 /*+ '\',\''
													 + response.body[i].dname
													+ '\',\''
													+ response.body[i].dname */
													+ '\')">'
													+ response.body[i].dname 
													+ '</li>';
										}
										content += '</ul>';
										//console.log("content " + content)
										$("#suggesstion-box20_").show();
										$("#suggesstion-box20_").html(content);

									} else {
										$("#search").css("background", "#FFF");
										var content = '<ul id="autocomplete-list2">';
										content += '<li onClick="selectAutocompleteValue()">'
												+ "No Data Found" + '</li>';
										content += '</ul>';
										$("#suggesstion-box20_").show();
										$("#suggesstion-box20_").html(content);
									}
								}
							},
							error : function(data) {
								//console.log(data);
							}
						})
			}

		}

		function selectAutocompleteValue20(dealerId, dname) {

				$("#search").val("");

				$("#suggesstion-box20_").hide();

			}
		}
