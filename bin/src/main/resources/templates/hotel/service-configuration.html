function addServiceDetails() {
    document.getElementById("mysecGridBuild").style.display = "none";
    const detailsSection = document.getElementById("hiddenDetails");
    detailsSection.style.display = "block";
    const inputs = detailsSection.querySelectorAll("input, textarea, select");
    inputs.forEach(input => {
        if (input.type === "checkbox" || input.type === "radio") {
            input.checked = false;
        } else {
            input.value = "";
        }
    });
    
    $("#addServiceDetails").addClass("d-none");
    $("#cancelCandidate").removeClass("d-none");
    $("#editServicesBtn").addClass("d-none");
    $("#saveCandidate").removeClass("d-none");
}

function cancelService(){
	$("#addServiceDetails").removeClass("d-none");
    $("#cancelCandidate").addClass("d-none");
    $("#saveCandidate").addClass("d-none");
    $("#hiddenDetails").hide();
    $("#mysecGridBuild").show();
    $("#editServicesBtn").removeClass("d-none");
}

	var selectedNodes = gridOptionsBuild.api.getSelectedNodes();

	    $('.propertyName').html(propertyName + " (" + propertyType + ")");
	    getAllServiceDetails(locationId);
	} else {
		 $('.propertyName').html("");

}

	        if (event.node.selected) {
	        	$("#editBTN").show();
	        	var selectedData = event.data
	        	serviceDataEdit(selectedData);
	        }
	        else
	        {
	        	$("#editBTN").hide();
	        }
	        
	    }
};

function onSelectionChangedServices() {
	var selectedNodes = secgridOptionsBuild.api.getSelectedNodes();
	if (selectedNodes.length > 0) {
		$("#editBTN").show();

}

function serviceDataEdit(selectedData){
	$("#locationId").val(selectedData.locationId);
	$("#serviceId").val(selectedData.serviceId);
	$("#serviceName").val(selectedData.serviceName);
    $("#roomTypeService").val(selectedData.hiddenRoomType).trigger("change");;
	$("#availability").val(selectedData.availability).trigger("change");;
	$("#startTime").val(selectedData.startTime);
	$("#endTime").val(selectedData.endTime);
	setTimeout(() => {
	    $("#parentCategory").val(selectedData.hiddenserviceCategory).trigger("change");;
	}, 1000)
	setTimeout(() => {
	    $("#subcategory").val(selectedData.hiddenserviceSubCategory).trigger("change");;
	}, 3000)
}

// view Data Functions
function viewBuilding(id=null,tab=null){
	agGrid.simpleHttpRequest({
		url : 'hotel-management-view'
	}).then(function(data) {
		var jsonData = JSON.parse(data.body);
		var allData=jsonData.Property;
	 	if(allData!=null){
		 	var len = allData.length;
			$('#totalReq').find('span').html(len);
			gridOptionsBuild.api.setRowData(allData);
			if (id != null) {
				locSel = id;
			    gridOptionsBuild.api.forEachNode(function(node) {
				 if (String(node.data.locationId) === String(id)) {					
			           node.setSelected(true);
			        }
			    });
			} else {	
				console.log("else")
				locSel = '';		
				var firstRowNode = gridOptionsBuild.api.getDisplayedRowAtIndex(0);
				if (firstRowNode) {
					firstRowNode.setSelected(true);
				}
			}
		}else{
			gridOptionsBuild.api.setRowData("");
		}
	});

}

  var selectedNodes = gridOptionsBuild.api.getSelectedNodes();

	var selectedRows = gridOptionsBuild.api.getSelectedRows();

		rowCount = rowCount + 1;
	}
	if (rowCount > 0) {
		editCandidate()
	} else {
	}
	
}

function saveServices() {
	var selectedNodes = gridOptionsBuild.api.getSelectedNodes();
    if (selectedNodes.length === 0) {
        toastr.error("Please select a building from the list.");
        return;
    }
 
    var selectedData = selectedNodes[0].data;
    var locationId = selectedData.locationId;
    let serviceData = {};

    serviceData['serviceId'] = $("#serviceId").val();
    serviceData['locationId']= locationId;
    serviceData['serviceName']= $("#serviceName").val();
    serviceData['roomTypeService'] = $("#roomTypeService").val();
    serviceData['availability']= $("#availability").val();
    serviceData['startTime']= $("#startTime").val();
    serviceData['endTime']= $("#endTime").val();
    serviceData['parentCategory']= $("#parentCategory").val();
    serviceData['subcategory']= $("#subcategory").val();

    saveServicesData(serviceData);
    document.getElementById("mysecGridBuild").style.display = "block";
    document.getElementById("hiddenDetails").style.display = "none";

}
    
function saveServicesData(serviceData) {

		$.ajax({
			type: "POST",
			url: "save-hotel-details",
			contentType: "application/json",
			data: JSON.stringify(serviceData),
			success: function(response) {
			if (response.code === "Success") {
				$('.loader').hide();
				getAllServiceDetails(serviceData.locationId);
					toastr.success(response.message);
					cancelService();
			} else {
				toastr.error(response.message);
				
				$('.loader').hide();
			  }
			},
			error: function(datas) {
 			$('.loader').hide();
			toastr.error("Something went wrong. Please try again.");
 			}
 		});
	}
	
function getAllServiceDetails(locationId) {

	agGrid.simpleHttpRequest({
	    url: "servicetype-view?id="+ locationId
	}).then(function(response) {
	    var jsonData = JSON.parse(response.body);
	    var allData = jsonData.serviceDetails || [];
	    secgridOptionsBuild.api.setRowData(allData);
	});
}



//getSubCategory
function getsubcategoryList(id,id2){
	$.ajax({
		type : "GET",
		url : "view-products-get-subcategory?id="+id,
		success : function(response) {
			if (response.message == "success") {
				$("#subcategory").empty();
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$("#subcategory").append(option);
				for (var i = 0; i < response.body.length; i++) {
					var option = $("<option></option>");
					$(option).val(response.body[i].key);
					$(option).html(response.body[i].name);
					$("#subcategory").append(option);
				}
				if(id2){
					$("#subcategory").val(id2).trigger('change');
					getVariationList(id2);
				}
			}
		},
		error : function(e) {
		}
	});	
}
