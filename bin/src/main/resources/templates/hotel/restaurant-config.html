<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<script src="../javaScript/hotel/restaurant.js"></script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<!--Tabbination 1 Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">

										<div class="col-md-8 col-12">
											<div class="d-flex search-sec">
												<!-- <input class="form-control me-2" type="text"
													placeholder="Search">
												<button class="btn btn-primary go-btn" type="button">Go</button> -->
												<input class="form-control me-2" type="text"
													placeholder="Search" id="quickFilter" autocomplete="off">
												<button class="btn go-btn" type="button" id="goBtn">Go</button>
												&nbsp;
												<button class="btn go-btn w-auto" type="button"
													id="resetBtn">Reset</button>
											</div>
										</div>

										<button class="btn btn-primary max-btn" id="collapseButtonR1"
											onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
											data-bs-placement="top" title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
										</button>

									</div>

									<div class="card p-2 m-2">
										<div id="foodGrid" style="height: 420px;"
											class="ag-theme-alpine w-100"></div>
									</div>
								</div>
							</div>
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div
										class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>



										<!--Right Inner Tab Start-->
										<div class="d-flex">
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item" role="presentation"><a
													class="nav-link active" data-bs-toggle="pill"
													href="#restaurantFoodDetailsTab" aria-selected="true"
													id="foodsType" role="tab">Foods and Beverages</a></li>
												<li class="nav-item" role="presentation"><a
													class="nav-link " data-bs-toggle="pill"
													href="#foodTimmingDetails" aria-selected="true"
													id="timmingType" role="tab">Food Timmings</a></li>
												<li class="nav-item" role="presentation"><a
													class="nav-link " data-bs-toggle="pill"
													href="#tableDetails" aria-selected="true" id="tables"
													role="tab">Tables</a></li>
											</ul>
										</div>

									</div>

									<!-- Tab panes -->
									<div class="tab-content flex-fill">
										<div id="restaurantFoodDetailsTab"
											class="tab-pane active show p-2 h-100" role="tabpanel">

											<div class="requisition-tbl d-flex flex-column h-100 ">

												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="80%"><strong id="programNameDisplay"></strong></td>
																<td>
																	<div class="d-flex justify-content-end">


																		<div class="mr-2" id="addRestaurantFoodDetails">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="addRestaurantFoodDetails()">
																				<i class="fas fa-plus-circle"></i> ADD
																			</button>
																		</div>

																		<div class="mr-2" id="editRestaurantBtn">
																			<button class="btn btn-primary edit-btn"
																				type="button"
																				onclick="onEditRestaurantButtonClick()">
																				<i class="fas fa-edit"></i> Edit
																			</button>
																		</div>
																		<div class="mr-2 d-none" id="saveRestaurant">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="restaurantfoodData()">
																				<i class="fas fa-save"></i> SAVE
																			</button>
																		</div>
																		<div class="mr-2 d-none" id="cancelFoodItems">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="cancelRestaurantFood()">
																				<i class="fas fa-times-circle"></i> Cancel
																			</button>
																		</div>

																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<div id="demo">
														<div class="row">
															<div class="card p-2">
																<div id="hiddenDetails" style="display: none;">
																	<div class="row">
																		<!-- Hidden service/property id -->
																		<input type="hidden" id="item_Code"> <input
																			type="hidden" id="locationId">
																		<div class="row">
																			<div class="col-lg-6">
																				<div class="form-group">
																					<label>Item_Name</label> <input type="text"
																						class="form-control" id="item_Name"
																						onblur="removeValid(event)" style="width: 250px;"
																						autocomplete="off">
																				</div>
																			</div>
																			<div class="col-lg-3">
																				<div class="form-group">
																					<label>Quantity</label> <input type="text"
																						class="form-control" id="quantity"
																						onblur="removeValid(event)" autocomplete="off">
																				</div>
																			</div>
																			<div class="col-lg-3">
																				<div class="form-group">
																					<label for="uom">UOM</label> <select
																						class="form-control" id="uom"
																						onblur="removeValid(event)" autocomplete="off">
																						<option value="">Select</option>
																						<option value="Full">Full</option>
																						<option value="Half">Half</option>
																						<option value="Piece">Piece</option>
																						<option value="Slice">Slice</option>
																					</select>
																				</div>
																			</div>

																		</div>
																		<div class="row">
																			<div class="col-lg-6">
																				<div class="form-group">
																					<label>Cost</label> <input type="text"
																						class="form-control" id="cost"
																						onblur="removeValid(event)" style="width: 250px;"
																						autocomplete="off">
																				</div>
																			</div>
																			<div class="col-lg-3">
																				<div class="form-group">
																					<label for="type">Type</label> <select
																						class="form-control" id="type"
																						onblur="removeValid(event)" autocomplete="off">
																						<option value="">Select</option>
																						<option value="Veg">Veg</option>
																						<option value="Non-Veg">Non-Veg</option>
																					</select>
																				</div>
																			</div>
																			<div class="col-lg-3">
																				<div class="form-group">
																					<label for="availability">Availability</label> <select
																						class="form-control" id="availability"
																						onblur="removeValid(event)" autocomplete="off">
																						<option value="">Select</option>
																						<option value="Breakfast">Breakfast</option>
																						<option value="Lunch">Lunch</option>
																						<option value="Dinner">Dinner</option>
																					</select>
																				</div>
																			</div>

																		</div>

																	</div>
																</div>
																<div id="foodsecGridContainer">
																	<div id="foodsecGrid" style="height: 420px;"
																		class="ag-theme-alpine w-100"></div>
																</div>

																<!-- <div id="timeGridContainer">
																	<div id="timesecGrid" style="height: 420px;"
																		class="ag-theme-alpine w-100"></div>
																</div> -->

															</div>

														</div>
													</div>

												</div>

											</div>
										</div>

										<div id="foodTimmingDetails" class="tab-pane fade p-2 h-100">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="80%"><strong></strong><span
																	id="propertyId"></span></td>
																<td>
																	<div class="d-flex justify-content-end">

																		<div class="mr-2" id="addRestaurantTimeDetails">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="addRestaurantTimeDetails()">
																				<i class="fas fa-plus-circle"></i> ADD
																			</button>
																		</div>

																		<div class="mr-2" id="editRestaurantTimeBtn">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="onEditTimeButtonClick()">
																				<i class="fas fa-edit"></i> Edit
																			</button>
																		</div>
																		<div class="mr-2 d-none" id="saveRestaurantTime">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="restaurantfoodTimeData()">
																				<i class="fas fa-save"></i> SAVE
																			</button>
																		</div>
																		<div class="mr-2 d-none" id="cancelFoodTime">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="cancelFoodTime()">
																				<i class="fas fa-times-circle"></i> Cancel
																			</button>
																		</div>

																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="row">
													<div class="row">
														<div id="hiddenDetails2" style="display: none;">
															<div class="row">
																<!-- Hidden service/property id -->
																<input type="hidden" id="tableId"> <input
																	type="hidden" id="locationId">
																<div class="col-lg-4">
																	<div class="form-group">
																		<label for="availabilityfoodtime"
																			class="form-label required-field">
																			Availability <span class="mandatory">*</span>
																		</label> <select id="availabilityfoodtime">
																			<option value="" selected disabled>Select</option>
																			<option value="BREAKFAST">BREAKFAST</option>
																			<option value="Lunch">Lunch</option>
																			<option value="Dinner">Dinner</option>
																		</select>
																	</div>
																</div>

																<div class="col-lg-4">
																	<div class="form-group">
																		<label for="startTime"
																			class="form-label required-field">Start Time
																			<span class="mandatory">*</span>
																		</label> <input type="time" id="startTime"
																			class="form-control" name="startTime">
																	</div>
																</div>

																<div class="col-lg-4">
																	<div class="form-group">
																		<label for="endTime" class="form-label required-field">End
																			Time <span class="mandatory">*</span>
																		</label> <input type="time" id="endTime" class="form-control"
																			name="endTime">
																	</div>
																</div>
															</div>

														</div>

														<div id="timeGridContainer">
															<div id="timesecGrid" style="height: 360px;"
																class="ag-theme-alpine w-100"></div>
														</div>
													</div>
												</div>
											</div>
										</div>

										<div id="tableDetails" class="tab-pane fade p-2 h-100">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="80%"><strong></strong> <span
																	id="propertyId"></span></td>
																<td>
																	<div class="d-flex justify-content-end gap-1">
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button"
																				onclick="nextBtnFunction('timmingType')">PREV</button>
																		</div>
																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>



												<div class="mb-3">
													<button
														class="btn btn-lg w-100 d-flex align-items-center justify-content-center gap-2"
														onclick="openAssetManagement()"
														style="background-color: #d4af37; color: black; border: none;">
														<i class="fas fa-plus"></i> Add Asset
													</button>
												</div>




												<div class="row"></div>
											</div>
										</div>

									</div>


									<!--Tabbination 1 End-->

								</div>
							</div>
						</div>
					</div>
</body>
</html>
