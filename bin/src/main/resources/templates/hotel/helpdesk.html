<style type="text/css">
/* Individual tab item container */
.header-tab {
	padding: 0 8px; /* Slightly reduced to fit more items inline */
}

/* Style for nav-link buttons */
.custom-tab-group .nav-pills .nav-link {
	border-radius: 0;
	font-weight: 500;
	border: 1px solid #d4af37;
	transition: background-color 0.3s ease;
	color: #d4af37;
	background-color: transparent;
}

/* Hover effect for nav-link */
.custom-tab-group .nav-pills .nav-link:hover {
	background-color: rgba(212, 175, 55, 0.1); /* subtle gold hover */
}

/* Active tab style */
.custom-tab-group .nav-pills .nav-link.active {
	background-color: #d4af37 !important;
	color: white !important;
}

/* Ensures tab items are minimum width and equal spacing */
.custom-tab-group .nav-item {
	min-width: 120px; /* Reduced to allow all in one row */
	flex: 1; /* Makes all tab items take equal space */
	text-align: center;
}

/* If using extra alignment class somewhere */
.gap-1 {
	gap: .25rem !important;
	justify-content: end;
	margin-top: 10px;
}

/* Timepicker active styling (unchanged) */
.timepicker .active, .bootstrap-timepicker-widget .bootstrap-timepicker-hour.active,
	.bootstrap-timepicker-widget .bootstrap-timepicker-minute.active,
	.bootstrap-timepicker-widget .bootstrap-timepicker-meridian.active {
	background-color: #28a745 !important;
	color: white !important;
	border-color: #d4af37 !important;
}

.custom-tab-group ul.nav {
	display: flex;
	flex-wrap: nowrap;
	overflow-x: auto;
	white-space: nowrap;
}

.custom-tab-group ul.nav::-webkit-scrollbar {
	height: 6px;
}

.custom-tab-group ul.nav::-webkit-scrollbar-thumb {
	background-color: #d4af37;
	border-radius: 4px;
}

@media ( max-width : 768px) {
	.custom-tab-group .nav-item {
		min-width: 100px;
	}
}

.filter-tab {
	margin-top: 10px;
	margin-left: 4px;
}

.img-color {
	color: #d4af37;
	margin-right: 10px;
	margin-left: 5px;
	font-size: x-large;
}

.bg-header {
	background-color: #f5f2e7;
}

#editComplaints {
	background-color: #d4af37 !important;
	color: #000000;
	font-weight: 600;
	    width: 101px !important;
}

.highlight-btn {
	transition: transform 0.3s ease;
	
}
.highlight-btn:hover {
	transform: scale(1.05);
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}
@keyframes zoomInOut { 0% {
	transform: scale(1);
}

50%
{
transform
:
scale(
1.1
);
}
100%

:
 
scale
(
1
)
;
 
}
}

/* Color modifiers */
.badge-open {
  background-color: rgb(6 66 245 / 10%);

}

.badge-assigned {
  background-color: rgb(201 176 54 / 10%);

  border-color: rgb(201 176 54 / 30%);
}

.badge-reassigned {

}

.badge-progress {

  border-color: rgb(58 169 160 / 30%);
}

.badge-reopen {

.badge-closed {

															<div class="row">
																<div class="col mb-2 mb-xl-0 table-responsive">
																	<table class="table table-bordered mb-2" id="med-table">
																		<thead>
																			<tr>
																				<th style="width: 5%;" class="med-tbl-th">Sl</th>
																				<th style="width: 20%;" class="med-tbl-th">Item</th>
																				<th style="width: 10%;" class="med-tbl-th">Qty</th>
																				<th style="width: 5%;" class="med-tbl-th">Price</th>
																				<th style="width: 5%;" class="med-tbl-th">Disc(%)</th>
																				<th style="width: 10%;" class="med-tbl-th">Amount</th>
																				<th style="width: 5%;" class="med-tbl-th">GST</th>
																				<th style="width: 5%;" class="med-tbl-th">CGST</th>
																				<th style="width: 5%;" class="med-tbl-th">SGST</th>
																				<th style="width: 5%;" class="d-none">IGST</th>
																				<th style="width: 10%;" class="med-tbl-th">Total
																					Amount</th>
																				<th style="width: 10%;" class="med-tbl-th">Action</th>
																			</tr>
																		</thead>
																		<tbody id="med-tbody">

																		</tbody>
																	</table>
																</div>
															</div>
															<div class="row">
																<div class="table-responsive mb-2">
																	<table class="table table-bordered mb-0">
																		<tbody>
																			<tr>
																				<td><strong>Total</strong></td>
																				<td id="grantTotalAmount" align="right">0.00</td>
																			</tr>
																		</tbody>
																	</table>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>

											<!-- amenities tabs starts from here -->
											<div class="tab-pane fade h-100 fade " id="amenities"

												<div class="d-flex flex-column gap-2 p-2 h-100">
													<div
														class="d-flex justify-content-between p-2 border rounded align-items-center bg-header">
														<div class="voucher-info">
															<span id="organizationGoalName"></span>
														</div>
														<!-- Right-aligned Buttons -->
														<div class="d-flex gap-2">
																<div class="mr-2 d-none" id="addAmenities">
																<button class="btn btn-primary edit-btn" type="button"
																	onclick="addAmenities()">
																	<i class="fas fa-plus-circle"></i> Add
																</button>
															</div>
																<div class="mr-2 d-none" id="cancelAmenities">
																<button class="btn btn-secondary edit-btn" type="button"
																	onclick="cancelAmenities()">
																	<i class="fas fa-xmark"></i> Cancel
																</button>
															</div>
															
															<div class="mr-2 d-none" id="editAmenities">
																<button class="btn btn-primary edit-btn" type="button"
																	onclick="editAmenities()">
																	<i class="fas fa-edit"></i> Edit
																</button>
															</div>
																<div class="mr-2 d-none" id="saveAmenities">
																<button class="btn btn-primary edit-btn" type="button"
																	onclick="saveAmenities()">
																	<i class="fas fa-save"></i> Save
																</button>
															</div>
																
																
																
														</div>
													</div>
													<div class="card p-2">
														<div class="row">
															<div class="col-lg-4">

																	<label>Room No</label> <select class="form-select"
																		id="roomNoAme" onchange="setGuestName(this)">
																		<option value="">Select</option>
																		<option th:each="c : ${locLists}"
																			th:value="${c.key} + '|' + ${c.name} + '|' + ${c.code}"
																			th:data-custid="${c.data}" th:text="${c.name}">
																		</option>

																	</select>
																</div>
															</div>

															<div class="col-lg-4">
																<div class="form-group">
																	<label>Guest Name</label> <input type="text"
																		id="guestNameAme" class="form-control" readonly>
																	<input type="hidden" id="custIdAme">
																</div>
															</div>



															<div class="col-md-4">
																<div class="form-group" style="position: relative;">
																	<label>Date</label> <input type="text"
																		id="amenitiesDate" class="form-control"
																		autocomplete="off" disabled="disabled"> <i
																		class="ti-calendar picker_calendar pointeerEventsProperty"
																		id="toDateCalendar4" style="top: 45px; right: 5px;"></i>
																</div>
															</div>

															<div class="col-lg-6">
																<div class="form-group">
																	<label>Service Type</label> <select
																		class="form-select " id="serviceTypeAme"
																		onblur="removeValid(event)"
																		onchange="getAllProductList(this.id);">
																		<option value="">Select</option>
																		<option th:each="c,iter:${serviceListAme}"
																			th:value="${c.key}" th:text="${c.name}"></option>
																	</select>
																</div>
															</div>

															<div class="col-lg-6">
																<label for="descriptionSer">Details</label>
																<textarea id="descriptionAme" name="description"
																	class="form-control"></textarea>
															</div>

															<div class="col-lg-4">
																<div class="form-group">
																	<label>Received By</label> <input type="text"
																		id="receivedByAme" readonly class="form-control">
																</div>
															</div>

															<div class="col-md-4 ">
																<div class="form-group">
																	<label> Assign To:</label> <select class="form-select "
																		id="assignToAme" onblur="removeValid(event)">
																		<option value="">Select</option>
																		<option th:each="c,iter:${assignToList}"
																			th:value="${c.key}" th:text="${c.name}"></option>
																	</select>
																</div>
															</div>
															<div class="col-lg-4">
																<div class="form-group">
																	<label>Billing</label> <input type="text"
																		id="billingAme" class="form-control">
																</div>
															</div>

															<div class="row mt-2">
																<div class="col-md-12 cnt-sp-bw">
																	<h5 class="sub-header-new">Item Details</h5>
																	<div class="d-flex gap-2 task-btn-sec">
																		<button
																			class="border-0 btn-transition btn btn-outline-primary btn-med-v"
																			title="Add" onclick="addItemRowAme()">
																			<i class="fa fa-plus-square" aria-hidden="true"></i>
																		</button>
																	</div>
																</div>
															</div>
															<div class="row">
																<div class="col mb-2 mb-xl-0 table-responsive">
																	<table class="table table-bordered mb-2"
																		id="med-table-ame">
																		<thead>
																			<tr>
																				<th style="width: 5%;" class="med-tbl-th">Sl</th>
																				<th style="width: 20%;" class="med-tbl-th">Item</th>
																				<th style="width: 10%;" class="med-tbl-th">Qty</th>
																				<th style="width: 5%;" class="med-tbl-th">Price</th>
																				<th style="width: 5%;" class="med-tbl-th">Disc(%)</th>
																				<th style="width: 10%;" class="med-tbl-th">Amount</th>
																				<th style="width: 5%;" class="med-tbl-th">GST</th>
																				<th style="width: 5%;" class="med-tbl-th">CGST</th>
																				<th style="width: 5%;" class="med-tbl-th">SGST</th>
																				<th style="width: 5%;" class="d-none">IGST</th>
																				<th style="width: 10%;" class="med-tbl-th">Total
																					Amount</th>
																				<th style="width: 10%;" class="med-tbl-th">Action</th>
																			</tr>
																		</thead>
																		<tbody id="med-tbody-ame">

																		</tbody>
																	</table>
																</div>
															</div>
															<div class="row">
																<div class="table-responsive mb-2">
																	<table class="table table-bordered mb-0">
																		<tbody>
																			<tr>
																				<td><strong>Total</strong></td>
																				<td id="grantTotalAmountAme" align="right">0.00</td>
																			</tr>
																		</tbody>
																	</table>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
											<!-- amenities tabs starts from here -->
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

</body>
