<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<script src="../javaScript/hotel/taxtpye.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style type="text/css">
.navv-link {
	color: black !important;
	text-decoration: none !important;
	background-color: white !important; /* Green */
	border: 1px solid #ccc !important; /*  Added for light border */
	border-radius: 8px !important;
	padding: 8px 20px !important;
	font-weight: 500;
	box-shadow: none;
	transition: background-color 0.3s ease;
}

.navv-link:hover {
	background-color: #d4af37 !important;
	color: #fff !important;
}

.navv-link.active {
	background-color: #d4af37 !important;
	color: #fff !important;
}

.navBtn {
	background: #f0f0f0;
	color: #000;
	border: 1px solid #d4af37;
	padding: 10px;
	transition: background 0.3s;
	width: 50px !important;
	height: 28px;
	padding: 2px 6px;
	font-size: 12px;
	line-height: 1;
}

.navBtn:hover {
	background: #d4af37;
	color: #fff;
}

.navBtn.active {
	background: #d4af37;
	color: #fff;
}

.add-btn {
	cursor: pointer;
	color: green;
	font-size: 15px;
}

.add-btn {
	cursor: pointer;
	color: green;
	font-size: 18px;
	font-weight: bold;
}

.remove-btn {
	color: black;
	background: none;
	border: none;
	font-size: 16px;
	cursor: pointer;
}
</style>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<!--Tabbination 1 Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex align-items-center col-md-8 col-12"
										style="margin-top: 10px; margin-left: 20px;">
										<input class="form-control me-2" type="text"
											placeholder="Search" id="quickFilter" autocomplete="off">
										<div class="searchicon position-relative">
											<button class="btn btn-primary go-btn" type="button"
												onclick="onQuickFilterChanged()">Go</button>
										</div>
										<button class="btn go-btn w-auto mx-2" type="button"
											onclick="ClearBtn()">Reset</button>
										<div class="d-flex justify-content-between bdr-line p-2">
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
									</div>
									<div class="card p-2 m-2">
										<div id="myGridBuild" style="height: 100vh;"
											class="ag-theme-alpine w-100"></div>
									</div>
								</div>
							</div>
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div
										class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>
										<!-- <div class="d-flex">
											<ul class="nav nav-pills newtab" role="tablist">

												<li class="nav-item me-1" role="presentation"
													id="candidateDetails"><a class="navv-link"
													data-bs-toggle="pill" href="#applicationDetailsTab"
													aria-selected="true" role="tab"
													onclick="goToConfirmOrder()" id="taxType">Tax Type</a></li>
											</ul>
										</div> -->

									</div>
									<!-- Tab panes -->
									<div class="tab-content flex-fill">
										<div id="applicationDetailsTab"
											class="tab-pane active show p-2 h-100" role="tabpanel">

											<div class="requisition-tbl d-flex flex-column h-100 ">

												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="80%"><strong id="programNameDisplay"></strong></td>
																<td>
																	<div class="d-flex justify-content-end">


																		<div class="mr-2" id="addServiceDetails">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="addServiceDetails()">
																				<i class="fas fa-plus-circle"></i> ADD
																			</button>
																		</div>

																		<div class="mr-2" id="editServicesBtn">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="onEditServiceButtonClick()">
																				<i class="fas fa-edit"></i> Edit
																			</button>
																		</div>
																		<div class="mr-2 d-none" id="saveTaxType">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="candidateTaxDtls()">
																				<i class="fas fa-save"></i> SAVE
																			</button>
																		</div>
																		<div class="mr-2 d-none" id="cancelTaxBtn">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="cancelService()">
																				<i class="fas fa-times-circle"></i> Cancel
																			</button>
																		</div>

																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<div id="hiddenDetails" style="display: none;">
														<div class="row">
															<!-- Hidden service/property id -->
															<input type="hidden" id="taxtypeId"> <input
																type="hidden" id="locationId">
															<div class="row">
																<div class="col-lg-6">
																	<div class="form-group">
																		<label>Service Name <span class="mandatory">*</span></label> <input type="text"
																			class="form-control" id="service_Name"
																			onblur="removeValid(event)" 
																			autocomplete="off" placeholder="Enter Service Name Here">
																	</div>
																</div>
																<div class="col-lg-3">
																	<div class="form-group">
																		<label>Tax % <span class="mandatory">*</span></label> <input type="text"
																			class="form-control" id="tax"
																			onblur="removeValid(event)" autocomplete="off" placeholder="Tax Percent Of The Service">
																	</div>
																</div>
																<div class="col-lg-3">
																	<div class="form-group">
																		<label>HSN Code <span class="mandatory">*</span></label> <input type="text"
																			class="form-control" id="hSN_Code"
																			onblur="removeValid(event)" autocomplete="off" placeholder="HSN Code">
																	</div>
																</div>
															</div>

														</div>
													</div>
													<div id="mysecGridBuild" style="height: 100vh;"
														class="ag-theme-alpine w-100"></div>

												</div>

											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
