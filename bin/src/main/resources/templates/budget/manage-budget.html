function addNewBudget(){
	
	var selectedRows = gridOptions.api.getSelectedRows();
	var selectedRowsString = '';
	var selectedRowsString1 = '';
	var selectedRowsString2 = '';
	
	selectedRows.forEach(function(selectedRow, index) {
		if (index > 0) {
			selectedRowsString += ',';
		}
		selectedRowsString += selectedRow.dept_id;
	});
	selectedRows.forEach(function(selectedRow, index) {
		if (index > 0) {
			selectedRowsString1 += ',';
		}
		selectedRowsString1 += selectedRow.group_id;
	});
	selectedRows.forEach(function(selectedRow, index) {
		if (index > 0) {
			selectedRowsString2 += ',';
		}
		selectedRowsString2 += selectedRow.financialYear;
	});
	
	
	var dept_id = selectedRowsString;
	var group_id = selectedRowsString1;
	var financialYear = selectedRowsString2;
	
	
	var budgetAmount =  $('#budgetAmount').val();
	var incmRemak = $('#incmRemak').val();
	
	
	
	
	$.ajax({
		type : "GET",
		url : "add-budget-amount?dept_id=" + dept_id +
				"&group_id=" + group_id+
				"&financialYear=" + financialYear+ 
				"&budgetAmount=" + budgetAmount +
				"&incmRemak=" + incmRemak,
		async : false,
		success : function(response) {

			if (response.code == "success") {
				
				
				$("#categoryModal").modal('hide');
				
				swal({
					 
					text: "Budget Added Successfully!", 
					type: "success"
					}).then(function(){
				   location.reload();
				   }
				);
				
				
				
				agGrid.simpleHttpRequest({
					url : 'manage-department-budget-through-json'
				}).then(function(data) {
					var len = data.length;
					$('#totalReq').find('span').html(len);

					gridOptions.api.setRowData(data);
				});
			}else{
				$("#messageParagraph").text("Something Went Wrong");
				
				$("#categoryModal").modal('hide');
				
			}

		},
	});
}
