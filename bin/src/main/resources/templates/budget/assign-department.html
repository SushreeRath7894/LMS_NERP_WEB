	function getCurrentQuarter() {
		  const currentDate = new Date();
		  const fiscalYearStartMonth = 3; // April is the 4th month (0-indexed)
		  const currentMonth = currentDate.getMonth();
		  
		  // Calculate the fiscal year
		  let fiscalYear;
		  if (currentMonth < fiscalYearStartMonth) {
		    fiscalYear = currentDate.getFullYear() - 1;
		  } else {
		    fiscalYear = currentDate.getFullYear();
		  }
		  
		  // Calculate the quarter
		  const quarter = Math.floor((currentMonth - fiscalYearStartMonth) / 3) + 1;
		  
		  return {
		    fiscalYear,
		    quarter
		  };
	}
