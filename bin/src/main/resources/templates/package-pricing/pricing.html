<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}" lang="en">
<head>
<meta charset="UTF-8">
<title>NERP</title>
<script src="../javaScript/packagePricing/pricing.js"></script>

<style type="text/css">
.bg-header {
	background-color: #f7f5eb;
}

.ag-theme-alpine {
	width: 100%;
	height: 100%;
}
</style>

</head>
<body>
	<section>
		<div layout:fragment="content" class="maincontent">
			<div class="container-fluid">
				<div class="d-flex">
					<div class="maincontentsec" id="holeContainer">
						<div id="parent-tab" class="tab-pane" role="tabpanel">
							<div class="d-flex flex-column flex-lg-row">
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">

										<div class="d-flex justify-content-end border-bottom p-2">
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" aria-label="Expand"
												data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>

										<div class="d-flex align-items-center col-md-8 col-12"
											style="margin-top: 10px; margin-left: 20px;">
											<input class="form-control me-2" type="text"
												placeholder="Search" id="quickFilter" autocomplete="off">
											<div class="searchicon position-relative">
												<button class="btn btn-primary go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
											</div>
											<button class="btn go-btn w-auto mx-2" type="button"
												onclick="ClearBtn()">Reset</button>
										</div>

										<div class="tab-content flex-fill">
											<div class="d-flex h-100">
												<div class="card m-2 p-2">
													<div id="myPackageGrid" class="ag-theme-alpine"></div>
												</div>
											</div>
										</div>
									</div>
								</div>

								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box">
										<div
											class="d-flex justify-content-between align-items-center p-2 border-bottom">

											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link active"
														data-bs-toggle="pill" data-bs-target="#package-info"
														aria-selected="true" role="tab" tabindex="-1" id="tabHead">Package
														Information</button>
												</li>
											</ul>

											<button class="btn btn-primary max-btn" id="collapseButtonL1"
												type="button" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												aria-label="Expand" data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>
										</div>

										<div class="tab-content flex-fill">

											<div class="tab-pane p-2 fade h-100 show active"
												id="package-info" role="tabpanel"
												aria-labelledby="package-info">
												<div class="d-flex flex-column gap-2 h-100 ">

													<div
														class="d-flex justify-content-end p-2 border align-items-center bg-header">

														<div class="d-flex gap-1">

															<div class="mr-2" id="addPackageData">
																<button class="btn btn-primary edit-btn"
																	onclick="addPackageData()">
																	<i class="fas fa-user-plus"></i> Add
																</button>
															</div>

															<div class="mr-2" id="editPackageData">
																<button class="btn btn-primary edit-btn"
																	onclick="editPackageData()">
																	<i class="fas fa-edit"></i> Edit
																</button>
															</div>
															
															<div class="mr-2" id="deletePackageData">
																<button class="btn btn-primary edit-btn"
																	onclick="deletePackageData()">
																	<i class="fa fa-trash" aria-hidden="true"></i> Delete
																</button>
															</div>

															<div class="mr-2 d-none" id="savePackageData">
																<button class="btn btn-primary edit-btn"
																	onclick="savePackageData()">
																	<i class="fas fa-save"></i> Save
																</button>
															</div>

															<div class="mr-2 d-none" id="cancelPackageData">
																<button class="btn btn-primary edit-btn"
																	onclick="cancelPackageData()">
																	<i class="fas fa-times-circle"></i> Cancel
																</button>
															</div>

														</div>
													</div>

													<div class="card p-2 h-100">
														<div class="row mb-3">
															<input type="hidden" class="form-control" id="packageId">
															<div class="col">
																<label for="packageName"
																	class="form-label required-field">Package Name
																	<span class="mandatory">*</span>
																</label> <input type="text" class="form-control"
																	id="packageName">
															</div>
														</div>
														<div class="row mb-4">
															<div class="col">
																<label for="startDate" class="form-label required-field">Start
																	Date <span class="mandatory">*</span>
																</label> <input type="date" class="form-control" id="startDate">
															</div>

															<div class="col">
																<label for="endDate" class="form-label required-field">End
																	Date <span class="mandatory">*</span>
																</label> <input type="date" class="form-control" id="endDate">
															</div>

														</div>
														<div class="row mb-3">
															<div class="col">
																<label for="service" class="form-label required-field">Services</label>
																<span class="mandatory">*</span> <select
																	class="form-control" id="service" multiple
																	onblur="removeValid(event)">
																	<option th:each="c,iter:${activityList}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select>
															</div>
															<div class="col">
																<label for="function" class="form-label required-field">
																	Functions <span class="mandatory">*</span>
																</label> <select class="form-select" id="function">
																	<option value="">Select</option>
																	<option value="GMap Integration">GMap Integration</option>
																	<option value="Payment Integration">Payment Integration</option>
																	<option value="Email Notification">Email Notification</option>
																	<option value="User Authentication">User Authentication</option>
																</select>
															</div>

														</div>


														<div class="row mb-3">
															<div class="col">
																<label for="desc" class="form-label required-field">Description
																	<span class="mandatory">*</span>
																</label>
																<textarea type="text" class="form-control" id="desc"></textarea>
															</div>
														</div>

													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
	</section>

</body>

</html>
