<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="ISO-8859-1">
<title>CRM Invited Meetings</title>

<script src="../javaScript/crm/invite-meetings/invited-meetings.js"></script>
<script src="../javaScript/crm/common.js"></script>
<style>
#customLoad {
  position: absolute;
  top: 43%;
  left: 50%;
  /*transform: translate(-50%, -50%);*/
  z-index: 9999;
}
.loader-backdrop{
	background:rgba(0,0,0,0.3);
	height: 100vh;
	width: 100%;
	position: absolute;
    left: 0;
    top: 37px;
    z-index: 99;
}
.spinner-border.custom-color {
  color: #6A2BBF !important;
}
body.loader-visible {
  overflow: hidden;
}
</style>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
				  <div class="loader-backdrop">
					<div class="spinner-border custom-color " id="customLoad"></div>
                    </div>
					<div class="d-flex justify-content-between flex-wrap">
						<div class="col-md-2 btn-hs">
							<div class="font-design" id="totalReq">
								Invited Meetings (<span></span>)
							
							</div> 

						</div>

						<div class="col-md-8 btn-hs" id="searchRowDiv">
							<div class="input-style" style="margin-bottom: 10px;">
								<input type="text" placeholder="Search.." name="search" class="searchboxinput"
									onkeyup="cancelBar()" oninput="onQuickFilterChanged()" id="quickFilter">
								<div class="searchicon">
									<a href="javascript:void(0)">
										<span style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey" onclick="resetQuickFilter()" class="close_i">
											<i class="ti-close srchicon"></i>
										</span>
									</a>
									<a href="javascript:void(0)">
										<i class="ti-search srchicon"></i>
									</a>
								</div>
							</div>
						</div>
						
					</div>
					
					
						<div class="main-body p-0">
							<div class="inner-wrapper">
								<!-- Inner main -->
								<div class="inner-main">
									<div class="inner-main-body collapse forum-content show">
							        	<div id="myGridMeetings" style="width: 100%; height: 200px;" class="ag-theme-alpine"></div>
							        </div>
							    </div>
							</div>
						</div>
					
				</div>
			</div>
		</div>
	</div>
</body>
</html>
