		function addAccountInfo() {
			var obj = {};
			obj.accountId = $('#accountId').text();
			obj.accountOwner = $('#accountOwner').val();
			obj.rating = $('#rating').val();
			obj.accountName = $('#accountName').val();
			obj.phone = $('#phone').val();
			obj.accountSite = $('#accountSite').val();
			obj.fax = $('#fax').val();
			obj.parentAccountId = $('#parentAccountId').val();
			obj.parentAccount = $('#parentAccount').val();
			obj.website = $('#website').val();
			obj.referenceContact = $('#referenceContact').val();
			obj.accountNo = $('#accountNo').val();
			obj.ticketSymbol = $('#ticketSymbol').val();
			obj.accountType = $('#accountType').val();
			obj.ownership = $('#ownership').val();
			obj.industry = $('#industry').val();
			obj.employee = $('#employee').val();
			obj.accountRevenue = $('#accountRevenue').val();
			obj.sicCode = $('#sicCode').val();
			obj.billingStreet = $('#billingStreet').val();
			obj.shippingStreet = $('#shippingStreet').val();
			obj.billingCity = $('#billingCity').val();
			obj.shippingCity = $('#shippingCity').val();
			obj.billingState = $('#billingState').val();
			obj.shippingState = $('#shippingState').val();
			obj.billingCode = $('#billingCode').val();
			obj.shippingCode = $('#shippingCode').val();
			obj.billingCountry = $('#billingCountry').val();
			obj.shippingCountry = $('#shippingCountry').val();
			obj.description = $('#description').val();
			console.log(obj);

			/* FORM VALIDATION STARTS*/

			var validation = true;

			if (obj.accountName == null || obj.accountName == "") {
				validation = validationUpdated("Account Name Required",
						"accountName");
			}
			if (obj.accountRevenue == null || obj.accountRevenue == "") {
				validation = validationUpdated("Account Revenue Required",
						"accountRevenue");
			}
			
			if (obj.ownership == null || obj.ownership == "") {
				validation = validationUpdated("Ownership Required",
						"ownership");
			}
			if (obj.industry == null || obj.industry == "") {
				validation = validationUpdated("Industry Required",
						"industry");
			}
			if (obj.accountType == null || obj.accountType == "") {
				validation = validationUpdated("Account Type Required",
						"accountType");
			}
	
			/* FORM VALIDATION ENDS*/

			if (validation) {
				//alert('hjhjhjbbh');
				$.ajax({
					type: "POST",
					url: "view-crm-accounts-add",
					contentType: "application/json",
					data: JSON.stringify(obj),
					success: function (response) {
						console.log(response);
						if (response.message == "Success") {
							cancelBtn();
							viewAccountDetailsAll();
							$("#messageParagraph").text("Account Saved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
						}
					},
					error: function (data) {

						console.log(data);
					}
				})
			}

		}

		// auto complete
		function contactNameAutoComplete() {

			var x = $("#contactName").val();
			$
				.ajax({

					type: "GET",
					url: "/pipeline/view-crm-pipeline-contactAutoComplete?id="
						+ x,
					dataType: 'json',
					contentType: 'application/json',
					success: function (response) {
						console.log(response);
						if (response.message == "success") {

							if (response.body.length != 0) {
								console.log("if: " + response);
								$("#contactName").css("background", "#FFF");
								var content = '<ul id="autocomplete-list">';
								for (var i = 0; i < response.body.length; i++) {

									console.log(response)
									content += '<li onClick="selectAutocompleteValue1(\''
										+ response.body[i].contactName
										+ '\',\''
										+ response.body[i].oppertunity
										+ '\',\''
										+ response.body[i].customer
										+ '\',\''
										+ response.body[i].email
										+ '\',\''
										+ response.body[i].phone
										+ '\',\''
										+ response.body[i].city
										+ '\',\''
										+ response.body[i].addressStreet
										+ '\',\''
										+ response.body[i].campanyName
										+ '\',\''
										+ response.body[i].states
										+ '\',\''
										+ response.body[i].country
										+ '\',\''
										+ response.body[i].zip
										+ '\')">'
										+ response.body[i].contactName
										+ '</li>';
								}
								content += '</ul>';
								$("#suggesstion-box1").show();
								$("#suggesstion-box1").html(content);

							} else {
								console.log("else: " + response);
								$("#contactName").css("background", "#FFF");
								var content = '<ul id="autocomplete-list">';
								content += '<li onClick="selectAutocompleteValue1(\''
									+ ''
									+ '\',\''
									+ ''
									+ '\')">'
									+ "No Data Found" + '</li>';
								content += '</ul>';
								$("#suggesstion-box1").show();
								$("#suggesstion-box1").html(content);
							}
						}
					},
					error: function (data) {
						console.log(data);
					}
				})
		}

		function selectAutocompleteValue1(contactName, oppertunity, customer,
			email, phone, city, addressStreet, campanyName, states, country,
			zip) {
			if (contactName) {
				$("#contactName").val(contactName);
				$("#oppertunity").val(campanyName);
				$("#customer").val(customer);
				$("#email").val(email);
				$("#phone").val(phone);
				$("#city").val(city);
				$("#addressStreet").val(addressStreet);
				$("#campanyName").val(campanyName);
				$("#states").val(states);
				$("#country").val(country);
				$("#zip").val(zip);
				$("#contactName").attr('data-procat', contactName);
				$("#suggesstion-box1").hide();
			} else {
				$("#contactName").val("");
				$("#oppertunity").val("");
				$("#customer").val("");
				$("#email").val("");
				$("#phone").val("");
				$("#city").val("");
				$("#addressStreet").val("");
				$("#campanyName").val("");
				$("#states").val("");
				$("#country").val("");
				$("#zip").val("");
				$("#contactName").attr('data-procat', "");
				$("#suggesstion-box1").hide();
			}
		}

		//Pagination
		var pages;
		function createPagination(pages, page) {
			if ($("#totalPageno").val() == '') {
				var pages = 10;
			} else {
				var pages = $("#totalPageno").val();
			}

			var str = '<ul>';
			var active;
			var pageCutLow = page - 1;
			var pageCutHigh = page + 1;
			// Show the Previous button only if you are on a page other than the first
			if (page > 1) {
				str += '<li class="page-item previous no"><a onclick="createPagination(pages, ' + (page - 1) + ')">Previous</a></li>';
			}
			// Show all the pagination elements if there are less than 6 pages total
			if (pages < 6) {
				for (let p = 1; p <= pages; p++) {
					active = page == p ? "active" : "no";
					str += '<li class="' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';
				}
			}
			// Use "..." to collapse pages outside of a certain range
			else {
				// Show the very first page followed by a "..." at the beginning of the
				// pagination section (after the Previous button)
				if (page > 2) {
					str += '<li class="no page-item"><a onclick="createPagination(pages, 1)">1</a></li>';
					if (page > 3) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page - 2) + ')">...</a></li>';
					}
				}
				// Determine how many pages to show after the current page index
				if (page === 1) {
					pageCutHigh += 2;
				} else if (page === 2) {
					pageCutHigh += 1;
				}
				// Determine how many pages to show before the current page index
				if (page === pages) {
					pageCutLow -= 2;
				} else if (page === pages - 1) {
					pageCutLow -= 1;
				}
				// Output the indexes for pages that fall inside the range of pageCutLow
				// and pageCutHigh
				for (let p = pageCutLow; p <= pageCutHigh; p++) {
					if (p === 0) {
						p += 1;
					}
					if (p > pages) {
						continue
					}

					active = page == p ? "active" : "no";
					str += '<li class="page-item ' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';

				}
				// Show the very last page preceded by a "..." at the end of the pagination
				// section (before the Next button)
				if (page < pages - 1) {
					if (page < pages - 2) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page + 2) + ')">...</a></li>';
					}
					str += '<li class="page-item no"><a onclick="createPagination(pages, pages)">' + pages + '</a></li>';
				}
			}
			// Show the Next button only if you are on a page other than the last
			if (page < pages) {
				str += '<li class="page-item next no"><a onclick="createPagination(pages, ' + (page + 1) + ')">Next</a></li>';
				changePagination(page);
			} else if (page <= pages) {
				//str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
				changePagination(page);
			}
			str += '</ul>';
			// Return the pagination string to be outputted in the pug templates
			document.getElementById('pagination').innerHTML = str;
			return str;

		}

													style="background-color: #e9ecef;">

													<option th:each="c,iter:${ownerList}" th:value="${c.key}"
														th:text="${c.name}"></option>

												</select>
											</div>
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Rating</label>
											<div class="select">
												<select id="rating">
													<option value="">Select Rating</option>
													<option th:each="c,iter:${ratingList}" th:value="${c.key}"
														th:text="${c.name}"></option>

												</select>
											</div>
										</div>
									</div>

										<div class="form-group">

									</div>

									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Fax</label> <input type="text" class="form-control numberonly"
												id="fax" placeholder="Fax">
										</div>
									</div>



									<div class="col-md-4">
										<div class="form-group">
											<div class="autocomplete">
												<label>Parent Account</label> <input type="text" id="parentAccount"

													type="hidden" id="taxType" onclick="hideShowS()">
											</div>
											<div id="suggesstion-box1_" class="sugg-cls"></div>

										</div>
									</div>


									<div class="col-md-4">
										<div class="form-group">

												placeholder="Website">
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Reference Contact Name</label> <input type="text"
												class="form-control" id="referenceContact"
												placeholder="Reference Contact Name">
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Account Number</label> <input type="text"
												class="form-control numberonly" id="accountNo"
												placeholder="Account Number">
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Ticket Symbol</label> <input type="text" class="form-control"
												id="ticketSymbol" placeholder="Ticket Symbol">
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Account Type</label>

												<select id="accountType">
													<option value="">Select Account Type</option>
													<option th:each="c,iter:${accountTypeList}" th:value="${c.key}"

												</select>
											</div>
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Ownership</label>
											<div class="select">
												<select id="ownership">
													<option value="">Select Ownership</option>
													<option th:each="c,iter:${ownershipList}" th:value="${c.key}"

												</select>
											</div>
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">

													<option th:each="c,iter:${industryList}" th:value="${c.key}"

										</div>

									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Account Revenue</label> <input type="text"

									<div class="col-md-4">

								</div>

														<div class="form-group">

													</div>

																placeholder="Shipping City ">
														</div>
													</div>

														<div class="form-group">
															<label>Billing State</label>

																<select id="shippingState">
																	<option th:value="NULL">Select State</option>
																	<option th:each="c,iter:${statesList}"
																		th:value="${c.key}" th:text="${c.name}">
																	</option>
																</select>
															</div>
														</div>
													</div>


													<div class="col-md-6">
														<div class="form-group">
															<label>Shipping State</label>
															<div class="select">
																<select id="billingState">
																	<option th:value="NULL">Select State</option>
																	<option th:each="c,iter:${statesList}"
																		th:value="${c.key}" th:text="${c.name}">
																	</option>
																</select>
															</div>
														</div>
													</div>

													<div class="col-md-6">
														<div class="form-group">
															<label>Billing Zip Code</label> <input type="text"

													</div>

													<div class="col-md-6">
														<div class="form-group">
															<label>Shipping Zip Code</label> <input type="text"
																class="form-control numberonly" id="shippingCode"
																placeholder="Shipping Zip Code">
														</div>
													</div>

													<div class="col-md-6">
														<div class="form-group">
															<label>Billing Country</label>
															<div class="select">
																<select id="billingCountry">
																	<option th:value="NULL">Select Country</option>
																	<option th:each="c,iter:${countryList}"
																		th:value="${c.key}" th:text="${c.name}">
																	</option>
																</select>
															</div>
														</div>
													</div>

													<div class="col-md-6">
														<div class="form-group">
															<label>Shipping Country</label>
															<div class="select">
																<select id="shippingCountry">
																	<option th:value="NULL">Select Country</option>
																	<option th:each="c,iter:${countryList}"
																		th:value="${c.key}" th:text="${c.name}">
																	</option>
																</select>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>


									<div class="accordion-item">
										<h2 class="accordion-header" id="headingTwo">
											<button class="accordion-button" type="button" data-bs-toggle="collapse"
												data-bs-target="#collapseTwo" aria-expanded="true"
												aria-controls="collapseTwo">
												Description Information</button>
										</h2>
										<div id="collapseTwo" class="accordion-collapse collapse show"
											aria-labelledby="headingTwo" data-bs-parent="#accordionExample">
											<div class="accordion-body">

												<div class="row">
													<div class="col-md-8">
														<div class="modal-inrheading">Description</div>
														<div class="position-text">
															<textarea rows="4" cols="100" id="description"
																onkeyup="textCount(event)"></textarea>
															<div id="charNumSN" class="txtcounter" align="right">
																<span>0</span> characters
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

					<!-- 	Delete Confirmation Modal Starts -->
					<div id="deleteModal" class="modal fade show" aria-modal="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p>Do you really want to delete these records? This
										process cannot be undone.</p>
								</div>
								<div class="modal-footer justify-content-center" style="margin-top: -30px;">

									<button type="button" class="btn4" data-dismiss="modal"
										onclick="cancelDeleteModalBtn();">Cancel</button>
									<button type="button" class="delete-btn"
										onclick="deleteAccountOnclick()">Delete</button>
								</div>
							</div>
						</div>
					</div>
					<!-- 	Delete Confirmation Modal Ends -->
				</div>
			</div>
		</div>
	</div>
