.rating:not(:checked)>input {

.rating:not(:checked)>label {

	width: 1em;

	overflow: hidden;

}

.rating:not(:checked)>label:before {
	content: '★ ';
}

.rating>input:checked ~label {
	color: #ea0;
	/*  text-shadow:1px 1px #c60, 2px 2px #940, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked)>label:hover, .rating:not(:checked)>label:hover ~label
	{
	color: black;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */

.slider {

	bottom: 0;
	cursor: pointer;
	left: 0;
	position: absolute;
	right: 0;
	top: 0;
	transition: .4s;
}

.slider:before {

	left: 3px;
	position: absolute;
	transition: .4s;
	width: 22px;

input:checked+.slider {

input:checked+.slider:before {

.slider.round {

.slider.round:before {

		//pancard card validation 

		var pancardValid;

function pancardVal() {
    var ctype = $('#customerType').val();
    var pancard = $('#pan').val();
    var pancardid = /^([A-Z]{5})([0-9]{4})([A-Z]{1})$/;
    var format = /[ `!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~]/;

    if (!ctype) {
        // toastr.error('Customer Type Required.');
        pancardValid = false;
        return false;
    }

    // PAN validation only for Business and Individual
    if (ctype === 'Business' || ctype === 'Individual') {
        if (pancard !== '' && pancard === pancard.toUpperCase() && !format.test(pancard)) {
            if (pancardid.test(pancard)) {
                $("#error4").hide();  // Assuming this div is used for error display
                pancardValid = true;
                return '';
            } else {
                pancardValid = false;
                return 'Please enter a valid PAN card no.';
            }
        } else {
            $('#pan').val('');
            pancardValid = false;
            return 'PAN must be uppercase and without special characters.';
        }
    }

    // For other types, skip PAN validation
    pancardValid = true;
    return '';
}

		// gst no  validation

var GSTValid;
function ValidateGSTNumber() {
	var gstNumber = $('#gstNo').val().toUpperCase();
	var panNumber = $('#pan').val().toUpperCase();

	var gstRegex = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
	var panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;

	if (gstNumber !== "") {

		if (panNumber === "" || !panRegex.test(panNumber)) {
			// toastr.error('Please enter a valid PAN before entering GST number.');
			GSTValid = false;
			return 'Please enter a valid PAN before entering GST number.';
		}

		if (gstRegex.test(gstNumber)) {
			var gstPan = gstNumber.substring(2, 12);

			if (!panRegex.test(gstPan)) {
				// toastr.error('PAN format inside GST is invalid.');
				GSTValid = false;
				return 'PAN format inside GST is invalid.';
			}

			if (gstPan !== panNumber) {
				// toastr.error('PAN number does not match the PAN inside the GST number.');
				GSTValid = false;
				return 'PAN number does not match the PAN inside the GST number.';
			}

			GSTValid = true;
			return '';
		} else {
			// toastr.error('Invalid GST format.');
			GSTValid = false;
			return 'Invalid GST format.';
		}
	}

	GSTValid = true;
	return '';
}

				if (zipPattern.test(zip)) {

					$('#zipCode').val(zip);

				return false;

							for (var i = 0; i < response.body.length; i++) {

								$(option).val(response.body[i].key);

		function generateUUID() {
			return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
				const r = Math.random() * 16 | 0;
				const v = c === 'x' ? r : (r & 0x3 | 0x8);
				return v.toString(16);
			});
		}

			let selectedRows = gridOptions.api.getSelectedRows();
			

			if (selectedRows.length === 0) {
				toastr.error("Please select a row to delete.");
				return;
			}
			
			if (type === "shipping" && cnt === 1) {
				toastr.error("You cannot delete the shipping address because at least one must be saved.");
				return;
			} else if(type === "poc" && cnt === 1) {
				toastr.error("You cannot delete the point of contact because at least one must be saved.");
				return;
			}

			Swal.fire({
				title: 'Are you sure?',
				text: 'Do you want to delete the selected row(s)?',
				icon: 'warning',
				showCancelButton: true,
				confirmButtonText: 'Yes, delete it!',
				cancelButtonText: 'No, keep it',
				confirmButtonColor: '#d33',
				cancelButtonColor: '#3085d6',
			}).then((result) => {
				console.log("Swal Result:", result);

				if (result.value) {
					console.log("User confirmed deletion.");
					
					if(!customerId) {
						gridOptions.api.applyTransaction({ remove: selectedRows });
						return;
					} else {
						let matchKey = type === "shipping" ? "shippingId" : "id";
						selectedRows.forEach((selectedRow) => {
							let index = dataset.findIndex(row => row[matchKey] == selectedRow[matchKey]);
							if (index !== -1) {
								dataset[index] = {
									...dataset[index],
									delFlag: 1,
									customerId: customerId,
									type: type
								};
							}
						});
						if (type === "shipping") {
							dataset = [...dataset, ...fullShippingDetails.filter(item => item.delFlag === 1)];
						} else if (type === "poc") {
							dataset = [...dataset, ...fullPocDetails.filter(item => item.delFlag === 1)];
						}

						console.log("Updated Dataset:", dataset);

						$.ajax({
							type: "POST",
							url: "view-customer-delete-child-data",
							contentType: "application/json",
							data: JSON.stringify(dataset),
							success: function (response) {
								console.log("AJAX Success Response:", response);
								if (response.code === "success") {
									const responseData = JSON.parse(response.body);
									let updatedData = [];

									if (type === "shipping") {
										updatedData = responseData.shippingDetails.filter(item => item.delFlag === 0);
										fullShippingDetails = responseData.shippingDetails;
										console.log("FullShipping Details", fullShippingDetails);
									} else if (type === "poc") {
										updatedData = responseData.pocDetails.filter(item => item.delFlag === 0);
										fullPocDetails = responseData.pocDetails;
										console.log("FullPoc Details", fullPocDetails);
									}

									gridOptions.api.setRowData(updatedData);

									toastr.success(`${type} details deleted successfully!`);
								} else {
									toastr.error(`Failed to delete ${type} details.`);
								}
							},
							error: function (xhr, status, error) {
								console.error("AJAX Error:", error);
								toastr.error(`Error while deleting ${type} details.`);
							}
						});
					}
					
					
				} else {
					console.log("User canceled deletion.");
				}
			});

		}


		function onQuickFilterChanged() {
			gridOptions.api

		}
		function duplicatePanCheck(){
	 		var panCheck = $('#pan').val();
	 			$.ajax({
	 				type : "GET",
	 				url : "view-customer-panduplicate?id=" + panCheck,
	 				async : false,
	 				success : function(response) {
	 					if (response.message == "Success") {
	 						if(panCheck == response.body[0].pan && panCheck != ""){
								toastr.error('Pan number already registered!');
	 							$("#pan").val('');
	 						}
	 						

	 					}

	 				}
	 			})
	 		
	 	}
		function excelDownload() {
			var params = {
				fileName: 'Customer_list.csv', // Specify your custom filename here
			};
			gridOptions.api.exportDataAsCsv(params);
		}
		
		function copyBillingAddress(checkbox) {
			
			let cntry = $("#country").val();
			let cntrynm = $("#country option:selected").text();
			let st = $("#states").val();
			let stnm = $("#states option:selected").text();
			let ct = $("#city").val();
			let strt1 = $("#street1").val();
			let strt2 = $("#street2").val();
			let pin = $("#zipCode").val();
			let phn = $("#phone").val();
			let fax = $("#fax").val();
			
			let dataset = [];
			let lastSelectedSlNo = '0';
			gridSAOptions.api.forEachNode((node) => {
				dataset.push(node.data);
				lastSelectedSlNo = node.data.id;
			});
			
			let obj = {};

			obj.country = cntry;
			obj.countryName = cntrynm;
			obj.state = st;
			obj.stateName = stnm;
			obj.city = ct;
			obj.street1 = strt1;
			obj.street2 = strt2;
			obj.zipcode = pin;
			obj.phone = phn;
			obj.fax = fax;
			obj.gstIn = '';
			obj.delFlag = 0;
			obj.shippingId = generateUUID()?.toString();
			obj.copyfrom = 'Y';
			dataset.push(obj)
			
			if (checkbox.checked) {
				if(!cntry) {
					$('#copyBillAddress').prop('checked', false);
					return showError('Country required');
				}
				if(!st) {
					$('#copyBillAddress').prop('checked', false);
					return showError('State required');
				}
				if(!ct) {
					$('#copyBillAddress').prop('checked', false);
					return showError('City required');
				}
				if(!strt1) {
					$('#copyBillAddress').prop('checked', false);
					return showError('Street 1 required');
				}
				if(!pin) {
					$('#copyBillAddress').prop('checked', false);
					return showError('Zipcode required');
				}
				gridSAOptions.api.setRowData(dataset);
			} else {
				const rowsToRemove = [];
				gridSAOptions.api.forEachNode((node) => {
					if(node.data?.copyfrom === 'Y') {
						rowsToRemove.push(node.data);
					}
				});
				gridSAOptions.api.applyTransaction({ remove: rowsToRemove });
			}
		}
