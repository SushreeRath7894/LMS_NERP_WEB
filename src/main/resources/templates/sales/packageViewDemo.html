function amountFormatter(value) {
	if (value !== null && value !== undefined) {
		var parts = value.toString().split('.');
		var integerPart = parts[0];
		var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
		var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
		return formattedIntegerPart + decimalPart;
	} else {
		return '';
	}
}

function rowSelect() {
	var selectedNodes = salesGridOptions.api.getSelectedNodes();
	var rowCount = selectedNodes.length;

	console.log("Row count:", rowCount);

	if (rowCount > 0) {
		var selectedData = selectedNodes.map(node => node.data);
		console.log('Selected data for SO:', selectedData);

		var selectedRow = selectedData[0]; // just using the first row for now

		// 👉 Fill form inputs directly
		
		$("#salesViewId").html(selectedRow.custName);
		$("#salesCustName").val(selectedRow.custName);
		$("#salesReferenceId").val(selectedRow.salesOrder);
		$("#expectedShipmentDate").val(selectedRow.expectedShipmentDate);
		$("#orderReceiveDate").val(selectedRow.orderReceiveDate);
		$("#salesOrder").val(selectedRow.salesOrder);
		$("#custId").val(selectedRow.custId);
		

		// 👉 Set itemDetails data to agGrid
		var itemDetailsData = selectedRow.itemDetails || [];
		itemDetailsOptions.api.setRowData(itemDetailsData);

		// 👉 Handle buttons
		if (selectedRow.approveStatus === 'Approved') {
			$('#soApproveBtn').addClass('d-none');
			$('#deleteSo').addClass('d-none');
			$('#editSo').addClass('d-none');
			$('#saveSo').addClass('d-none');
			$('#pacakgeBtn').removeClass('d-none');
		} else {
			$('#soApproveBtn').removeClass('d-none');
			$('#deleteSo').removeClass('d-none');
			$('#editSo').removeClass('d-none');
			$('#saveSo').removeClass('d-none');
			$('#pacakgeBtn').addClass('d-none');
		}
	} else {
		console.log("No rows selected");

		// Reset form and itemDetails grid
		$("#salesOrderheadId").html('');
		$("#salesCustName").val('');
		$("#salesReferenceId").val('');
		$("#expectedShipmentDate").val('');
		$("#orderReceiveDate").val('');
		$("#orderReceiveTime").val('');
		$("#salesOrder").val('');
		$("#taxtype").val('');
		$("#salesViewId").html('');

		itemDetailsOptions.api.setRowData([]);

		// Reset buttons
		$('#soApproveBtn').removeClass('d-none');
		$('#deleteSo').removeClass('d-none');
		$('#editSo').removeClass('d-none');
		$('#saveSo').removeClass('d-none');
		$('#pacakgeBtn').addClass('d-none');
	}
}

function changeDateFormat(inputDate) {
	var splitDate = inputDate.split('-');
	if (splitDate.count == 0) {
		return null;
	}
	var year = splitDate[0];
	var month = splitDate[1];
	var day = splitDate[2];
	return day + '-' + month + '-' + year;
}
function getStateDataOnEditMul(cid, sid, stateId) {
	var country = $("#" + cid).val();
	if (country) {
		$.ajax({
			type: "GET",
			url: "view-customer-stateList?id=" + country,
			success: function(response) {
				if (response.message == "success") {
					$("#" + sid).empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#" + sid).append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].key);
						$(option).html(response.body[i].name);
						$("#" + sid).append(option);
					}
					$("#" + sid).val(stateId);
				}
			},
			error: function(e) {
			}
		});
	} else {
		$("#" + sid).empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
		$("#" + sid).append(option);
	}
}

function addPackQut(fieldId) {
	var pending = parseFloat($("#pendingQut").val());
	var tempVal = $("#" + fieldId).val().replace(/[^0-9 ]/g, '');
	if (tempVal <= pending) {
		$("#" + fieldId).val(tempVal);
		$("#packQut").val(tempVal);
	}
	else {
		toastr.error('Please add less than or same Packing Quantity as Pending Quantity');
		$("#" + fieldId).val(null);
		$("#packQut").val(null);
	}

}

console.log("Item Data Before Grid Update:", item);

function cacelPackageGrid(){
	
	var selectedNodes = packageGridOptions.api.getSelectedNodes();
			var selectedData = selectedNodes.map(node => node.data);

		if(a){
			const rowNode = packageGridOptions.api.getRowNode(a);

				const rowIndex = rowNode.rowIndex; // Get the row index
				console.log("rowIndex>>>>>" , rowIndex);

				rowSelectPackage();
			}	
		}	
	
}

																					<i class="fa-solid fa-check-square"
																						aria-hidden="true"></i>
																				</button>

																			</div>
																		</div>
																	</div>
																	<div class="row">
																		<div id="mySAGrid" style="height: 120px;"
																			class="ag-theme-alpine"></div>
																	</div>
																	<div class="row" id="shippingAddressSec">
																		<div class="col-md-3">
																			<div class="form-group">
																				<label>Country</label>
																				<div class="select">
																					<input type=hidden id="shippingHiddenId"> <input
																						type="hidden" id="shippingId"> <select
																						id="country1" onchange="getStateDetails1()"
																						onblur="removeValid(event)">
																						<option th:value="NULL">Select Country</option>
																						<option th:each="c,iter:${countryList}"
																							th:value="${c.key}" th:text="${c.name}"></option>
																					</select>
																				</div>
																			</div>
																		</div>

																		<div class="col-md-3">
																			<div class="form-group">
																				<label>State</label>
																				<div class="select">
																					<select id="states1" onblur="removeValid(event)">
																						<option th:value="NULL">Select State</option>
																					</select> <span class="focus"></span>
																				</div>
																			</div>
																		</div>

																		<div class="col-md-3">
																			<div class="form-group">
																				<label>City</label> <input type="text"
																					class="form-control" id="city1" placeholder="City"
																					onblur="removeValid(event)"
																					onkeyup="checkAlphabet('city')" maxLength="30">
																			</div>
																		</div>
																		<div class="col-md-3">
																			<div class="form-group">
																				<label>Street 1</label> <input type="text"
																					class="form-control" id="street11"
																					placeholder="Street 1" onblur="removeValid(event)"
																					maxLength="30">
																			</div>
																		</div>
																		<div class="col-md-3">
																			<div class="form-group">
																				<label>Street 2</label> <input type="text"
																					class="form-control" id="street21"
																					placeholder="Street 2" onblur="removeValid(event)"
																					maxLength="30">
																			</div>
																		</div>
																		<div class="col-md-3">
																			<div class="form-group">
																				<label>Zip Code</label> <input type="text"
																					class="form-control" id="zipCode1"
																					autocomplete="off" placeholder="Zip Code"
																					onkeyup="zipcodeVal1();checkNumeric('zipCode1');"
																					onblur="removeValid(event)"> <span
																					id="error15" class="formValidation1"></span>
																			</div>
																		</div>

																		<div class="col-md-3">
																			<div class="form-group">
																				<label>Phone</label> <input type="text"
																					class="form-control" id="phone1"
																					placeholder="Phone"
																					onkeyup="checkNumeric('phone1');"
																					onblur="removeValid(event)"> <span
																					id="error12" class="formValidation1"></span>
																			</div>
																		</div>
																		<div class="col-md-3">
																			<div class="form-group">
																				<label>Fax</label> <input type="text"
																					class="form-control" id="fax1" placeholder="Fax"
																					onblur="removeValid(event)">
																			</div>
																		</div>
																	</div>

																</div>
															</div>

															<!-- Hidden Fields -->
															<input type="hidden" id="salesOrder"> <input
																type="hidden" id="taxType">
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
									<!--Right Inner Tab End-->
								</div>
							</div>
							<!--Right Sec End-->
						</div>
					</div>
					<!--Tabbination 1 End-->
				</div>
			</div>
		</div>
	</div>
</body>
</html>
