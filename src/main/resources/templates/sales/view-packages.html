<style type="text/css">
.highcharts-exporting-group {
	display: none;
}

.btn-primarynew {
	color: #fff !important;
	background-color: #0d6efd;
	border-color: #0d6efd;
}

.slidebox {
	padding: 14px;
	margin-top: 0px;
	margin: 0px 10px;
}

.form-group label {
	position: relative;
}

.holdCls {
	background-color: rgb(0, 143, 0);
}

.bg_white {
	background: #ffffff !important;
}

.blueClsWT {
	background: #0076ba;
	color: #fff;
}

.blueCls {
	background: #0076ba;
	color: #fff;
}

.blueClsWT::before {
	font-size: 8px;
	color: #FFF;
	content: '\e64c';
	font-family: 'themify';
	padding-right: 7px;
}

.modal-body table td input[type=checkbox] {
	width: 0px;
	margin-right: 16px;
	position: relative;
	top: 0px;
	float: none;
}

.firstnode {
	color: #929292;
	border-top: 1px solid transparent !important;
	border-left: 1px solid transparent !important;
	border-bottom: 1px solid transparent !important;
	width: 320px;
	font-size: 12px;
	font-weight: 100;
}

.simple-tree-table-closed .simple-tree-table-icon:after {
	content: "\f105" !important;
	font-family: 'FontAwesome';
	color: black;
	display: inline-block;
	margin-right: 6px;
	transform: rotate(90deg);
}

.simple-tree-table-opened .simple-tree-table-icon:after {
	content: "\f105" !important;
	font-family: 'FontAwesome';
	color: black;
	display: inline-block;
	margin-right: 6px;
}

.simple-tree-table-icon {
	display: inline-block;
	width: 1.5em;
	line-height: 1.5em;
	margin: 0.1em;
	background-color: transparent;
	text-align: center;
	cursor: pointer;
}

.tptCls {
	background: transparnt;
}

.max-btn1, .max-btn1:hover {
	background-color: #bf05ff;
	border-color: #bf05ff;
}

																		</div>
																		<div class="col-md-3">
																			<div class="form-group">
																				<label>Fax</label> <input type="text"
																					class="form-control" id="fax2" placeholder="Fax"
																					onblur="removeValid(event)">
																			</div>
																		</div>
																		<div class="col-md-3">
																			<div class="form-group">
																				<label>GSTIN</label> <input type="text"
																					class="form-control" id="gstIn2"
																					placeholder="GSTIN" onblur="removeValid(event)">
																			</div>
																		</div>
																	</div>
																</div>
															</div>


															<!-- Hidden Fields -->
															<input type="hidden" id="salesOrder"> <input
																type="hidden" id="taxType">
														</div>
													</div>
												</div>
											</div>
										</div>
										<!-- Item Details Tab Starts -->
										<div id="itemDetails" class="tab-pane fade p-2 h-100"
											role="tabpanel">

											<div class="requisition-tbl d-flex flex-column h-100 gap-2">
												<div
													class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
													<div class="project-name">
														<span class="head-user-name" id="packageViewId1"></span>
													</div>
													<div class="d-flex justify-content-end gap-2 flex-wrap">
														<span th:text="${action_list}"></span>
														<button class="btn m-0 edit-btn" id="prevPackae"
															type="button" onclick="nextTabPackage('packageInfLid')"
															data-bs-toggle="tooltip">Prev</button>
														<button class="btn m-0 edit-btn" id="savePackage"
															type="button" onclick="savePackage()">Save</button>
														<!-- <button class="btn m-0 edit-btn d-none" type="button"
															id="deletePackage" onclick="deletePackageOnclick()">Delete</button> -->
													</div>
												</div>

												<div class="card p-2">

													<div class="innercontent">
														<div class="cust-detls">
															<!-- Customer Details -->
															<input type="hidden" id="qutNo">
															<div class="card mt-3">
																<!-- <div class="card-header text-black">Item Details</div> -->
																<div class="row">
																	<div class="col-md-12 cnt-sp-bw">
																		<h5 class="sub-header-new">Item Details</h5>
																		<div class="d-flex gap-1 task-btn-sec">
																			<button
																				class="border-0 btn-transition btn btn-outline-primary br-dis br-m-btn"
																				title="Pack Item" disabled id="packItem"
																				onclick="packedItem()" data-bs-toggle="tooltip">
																				<i class="bi bi-cart-plus-fill"></i>
																			</button>
																			<button class="btn btn-primary edit-btn br-s-btn"
																				id="saveCancel1" type="button"
																				onclick="saveTableData()" data-bs-toggle="tooltip">Save</button>
																			<button class="btn btn-primary edit-btn br-s-btn"
																				id="saveCancel2" type="button"
																				onclick="cancelItemDetails()"
																				data-bs-toggle="tooltip">Cancel</button>
																		</div>
																	</div>
																</div>
																<div class="card-body">

																	<div class="row br-m-btn mt-1">
																		<div id="item" style="height: 200px;"
																			class="ag-theme-alpine"></div>
																	</div>
																	<div class="row br-s-btn">
																		<div class="row">
																			<div class="col-lg-6">
																				<label class="form-label">Stock Keeping Unit</label>
																				<input type="text" onblur="removeValid(event)"
																					id="sku" class="form-control" disabled>
																			</div>
																			<input type="hidden" id="isalesOrderId"> <input
																				type="hidden" id="editProduct"> <input
																				type="hidden" id="productId"> <input
																				type="hidden" id="productName"> <input
																				type="hidden" id="hsnCode" class="form-control"
																				readonly> <input type="hidden" id="itemDesc"
																				class="form-control" readonly>
																			<div class="col-lg-6">
																				<label class="form-label">Item Name</label> <input
																					type="text" id="itemName"
																					onblur="removeValid(event)" class="form-control"
																					readonly>
																			</div>
																			<div class="col-lg-6">
																				<label class="form-label">Unit</label> <select
																					class="form-select" id="unit"
																					onblur="removeValid(event);">
																					<option value="">Select</option>
																					<option th:each="c,iter:${unitList}"
																						th:value="${c.key}" th:text="${c.name}"></option>
																				</select>
																			</div>
																			<div class="col-lg-6">
																				<label class="form-label">Quantity</label> <input
																					type="text" id="quantity" class="form-control"
																					onkeyup="calculateLineTotal();getGSTRateCal()"
																					onblur="removeValid(event)">
																			</div>

																			<div class="col-lg-6">
																				<div class="form-group">
																					<label>Packed Quantity</label> <input type="text"
																						id="packedQut" onblur="removeValid(event)"
																						class="form-control" readonly>
																				</div>
																			</div>

																			<div class="col-lg-6" id="pendingDiv">
																				<div class="form-group">
																					<label>Pending Quantity</label> <input type="text"
																						id="pendingQut" onblur="removeValid(event)"
																						class="form-control" readonly>
																				</div>
																			</div>
																			<div class="col-lg-6" id="packDateDiv">
																				<div class="form-group">
																					<label>Packaging Date</label> <input type="text"
																						class="form-control" id="packDate"
																						autocomplete="off" readonly />
																				</div>
																				<input type="hidden" class="form-control"
																					id="packQut" autocomplete="off" readonly />
																			</div>
																			<div class="col-lg-6" id="packingDiv">
																				<div class="form-group">
																					<label>Packing Quantity</label><span
																						class="mandatory">*</span> <input type="text"
																						class="form-control" id="packingQut"
																						autocomplete="off"
																						onkeyup="addPackQut('packingQut')" />
																				</div>
																			</div>
																			<div class="col-lg-6">
																				<div class="form-group">
																					<label>Packaging Type</label><select
																						class="form-control" id="packType">
																						<option value="">Select</option>
																						<option th:each="c,iter:${packTypeList}"
																							th:value="${c.key}" th:text="${c.name}"></option>
																					</select>
																				</div>
																			</div>
																			<div class="col-lg-6">
																				<div class="form-group">
																					<label>No. Of Item</label><input type="text"
																						id="noOfItem" class="form-control"
																						onkeyup="checkNumeric('noOfItem');">
																				</div>
																			</div>
																			<div class="col-lg-12">
																				<div class="mb-3">
																					<label class="form-group">Remarks</label> <input
																						type="text" id="packDesc" class="form-control">
																				</div>
																			</div>
																		</div>
																	</div>
																</div>
															</div>
															<!-- Hidden Fields -->
															<input type="hidden" id="salesOrder"> <input
																type="hidden" id="taxType">
														</div>
													</div>
												</div>
											</div>
										</div>
										<!-- Item Details Tab Ends   -->

									</div>
									<!--Right Inner Tab End-->
								</div>
							</div>
							<!--Right Sec End-->
						</div>
					</div>
					<!--Tabbination 1 End-->
				</div>
			</div>
		</div>
	</div>
</body>
</html>
