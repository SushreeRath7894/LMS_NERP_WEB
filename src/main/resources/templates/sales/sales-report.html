            // Format helper function (based on your dateFormat)
            function formatDate(date) {
                let dd = String(date.getDate()).padStart(2, '0');
                let mm = String(date.getMonth() + 1).padStart(2, '0'); // January is 0!
                let yyyy = date.getFullYear();
        
                // Handle format string dynamically
                switch (dateFormat) {
                    case "Y-m-d":
                        return `${yyyy}-${mm}-${dd}`;
                    case "d-m-Y":
                        return `${dd}-${mm}-${yyyy}`;
                    case "m/d/Y":
                        return `${mm}/${dd}/${yyyy}`;
                    default:
                        return `${dd}-${mm}-${yyyy}`; 
                }
            }

        function validateDatesOnly() {
            var fromdate = $('#fromDate').val();
            var todate = $('#toDate').val();
        
            if (fromdate === '' && todate === '') {
                toastr.error("Please select both From Date and To Date");
                return;
            }
        
            if (fromdate !== '' && todate !== '') {
                var fromDateArray = fromdate.split("-").map(Number);
                var toDateArray = todate.split("-").map(Number);
        
                var fromDateObj = new Date(fromDateArray[2], fromDateArray[1] - 1, fromDateArray[0]);
                var toDateObj = new Date(toDateArray[2], toDateArray[1] - 1, toDateArray[0]);
        
                if (fromDateObj > toDateObj) {
                    toastr.error("Please choose To Date greater than or equal to From Date");
                    $("#fromDate, #fromDateCalendar").val(formattedFirstDay);
                    $("#toDate, #toDateCalendar").val(formattedLastDay);
                }
            }
        }

													onclick="resetBtn()">Reset</button>
											</div>
										</div>
										<div class="col-12 col-md-3">
											<div class="hstack gap-2">
												<!-- From Date -->
												<div class="flex-1 form-group calendar_box" id="fromDateDiv">
													<label>From Date</label>
													<div class="position-relative">
														<input type="text" id="fromDate" class="form-control"
															onchange="validateDatesOnly()"
															onblur="removeValid(event)"
															th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|"
															readonly> <i class="ti-calendar picker_calendar"
															id="fromDateCalendar" onchange="validateDatesOnly()"
															onblur="removeValid(event)"></i>
													</div>
												</div>
												<!-- To Date -->
												<div class="flex-1 form-group calendar_box" id="toDateDiv">
													<label>To Date</label>
													<div class="position-relative">
														<input type="text" id="toDate" class="form-control"
															onchange="validateDatesOnly()"
															onblur="removeValid(event)"
															th:attr="onkeyup=|formatDate('toDate','${session.DATEFORMAT_JS}')|"
															readonly> <i class="ti-calendar picker_calendar"
															id="toDateCalendar" onchange="validateDatesOnly()"
															onblur="removeValid(event)"></i>
													</div>
												</div>
											</div>
										</div>

										<div class="col-md-3">
											<div class="position-relative">
												<label>Executive Name</label>
												<div class="select">
													<select id="empId" onblur="removeValid(event)">
														<option value="All">All</option>
														<option th:each="c,iter:${empList}" th:value="${c.key}"
															th:text="${c.name}"></option>
													</select>
												</div>
											</div>
										</div>

										<button class="btn go-btn" onclick="filter()" id="filterBtn"
											type="button">Filter</button>
										<button class="btn icon-btn" id="downloadExcel"
											onclick="excelDownload()" data-bs-toggle="tooltip"
											data-bs-placement="top" title="Download Excel">
											<i class="fa-solid fa-download"></i>
										</button>
									</div>



									<!-- Tab panes -->
									<div class="tab-content flex-fill">
										<div id="salesInfo" class="tab-pane fade active h-100 show"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100 gap-2">

												<div class="card p-2 m-2">
													<div id="salesReportGrid" style="height: 100vh;"
														class="ag-theme-alpine"></div>
													<div id="poReportGrid" style="height: 100vh;"
														class="ag-theme-alpine d-none"></div>
													<div id="soReportGrid" style="height: 100vh;"
														class="ag-theme-alpine d-none"></div>
												</div>
											</div>
										</div>

									</div>
									<!--Right Inner Tab End-->
								</div>
							</div>
							<!--Right Sec End-->
						</div>
					</div>
					<!--Tabbination 1 End-->
				</div>
			</div>
		</div>
	</div>
</body>

</html>
