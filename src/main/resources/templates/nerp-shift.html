<script>
	function backToManage1() {
		$(".operationSecDiv").removeClass('d-none');
		$("#changePasswordSecDiv,#profileSecDiv,#shiftSecDiv").hide();
	}
</script>
<script>
let dataset = [];
var calendar2 = null;
$(document).ready(() => {
    var calendarEl2 = document.getElementById('calendar2');

    calendar2 = new FullCalendar.Calendar(calendarEl2, {
        height: 'auto',
        expandRows: true,
        initialView: 'dayGridMonth',
        datesRender: function(info) {
            let todayCell = document.querySelector('.fc-day-today');
            if (todayCell) {
                todayCell.classList.add('highlight-today');
            }
        },
        headerToolbar: {
            left: 'prev,next,today',
            center: 'title',
            right: 'myCustomButton',
        },
        editable: true,
        dayMaxEvents: true,
        customButtons: {
            myCustomButton: {
            	text: '\u2715', 
                click: function() {
                    backToManage1();
                },
            }
        },
        eventDidMount: function() {
            const button = document.querySelector('.fc-myCustomButton-button');
            if (button) {
                button.setAttribute('data-bs-toggle', 'tooltip');
                button.setAttribute('title', 'Close');
                setTimeout(() => {
        	        new bootstrap.Tooltip(button);
        	    }, 100);
            }
        },
        events: [],
        eventClick: function(info) {
            calendar2.updateSize(); // Force resize on event click
        },
        datesSet: function (info) {
            var startDate = info.start;
            var syear = startDate.getFullYear();
            var smonth = (startDate.getMonth() + 1)?.toString()?.padStart(2, '0');
            var sdate = startDate.getDate()?.toString()?.padStart(2, '0');
            
            var endDate = info.end;
            var eyear = endDate.getFullYear();
            var emonth = (endDate.getMonth() + 1)?.toString()?.padStart(2, '0');
            var edate = endDate.getDate()?.toString()?.padStart(2, '0');
            
            let dt1 = syear+'-'+smonth+'-'+sdate;
            let dt2 = eyear+'-'+emonth+'-'+edate;
            getShiftDetails(dt1,dt2);

        }
    });

    calendar2.render();
});
function getShiftDetails(dt1,dt2){
	calendar2.removeAllEvents(); 
	$.ajax({
        type: "GET",
        url: "/configuration/get-shift-details?dt1="+dt1+"&dt2="+dt2,
        contentType: "application/json",
        success: function(resp) {
        	if(resp.code == 'success') {
        		if(resp.body && resp.body.length > 0) {
        			let currentDate = new Date();
        			let cyear = currentDate.getFullYear();
        			let cmonth = currentDate.getMonth();
        			let cdate = currentDate.getDate();
        			let tArray = resp.body?.map(item => ({
        				start: item.key,
        			    title: item.name,
        			    ...(new Date(item.key).getTime() === new Date(cyear, cmonth, cdate, 5, 30).getTime() 
        			            ? { 
        			                rendering: 'background',
        			                className: 'important-highlight'  
        			              }
        			            : {})
        			}))
        			console.log(tArray)
        			calendar2.addEventSource(tArray); 

        		}
        	}
        },
        error: function(data) {
        	console.log(data)
        	toastr.error("Something went wrong")
        }
	});
}
</script>
</head>
<body>
	<div class="out-box">
		<div class="d-flex justify-content-center bdr-line p-2">
			<div class="service-title">Shift</div>
		</div>

				</div>
			</div>
		</div>
	</div>
</body>
