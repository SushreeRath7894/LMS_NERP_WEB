<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style type="text/css">
.propertyName {
	font-size: 15px;
	font-weight: 600;
	color: #ae8600;
}

.standard-rate {
    color: blue;
    font-weight: bold;
}

.corporate-rate {
    color: green;
    font-weight: bold;
}

</style>
<script type="text/javascript">
$(() => {
	$('#roomtypes').select2();  //#roomType
	$('#bedtypesId').select2();
	$('#ratetypes').select2();
});
$(document).ready(function () {
	var gridDiv = document.querySelector('#myGridBuild');
	new agGrid.Grid(gridDiv, gridOptionsBuild);
	viewBuilding();

	var secGridDiv = document.querySelector('#mySecGrid');
	new agGrid.Grid(secGridDiv, gridOptionsSecond);
});

function nextBtnFunction(tablink) {
	const tabElement = document.querySelector(`#${tablink}`);
	if (tabElement) tabElement.click();
}

//add
function addBtnFunction() {
	$("#ratetypes").val('');
	$("#roomtypes").val('');
	$("#ratepernight").val('');
	$("#rateTypeForm").removeClass('d-none');
	$("#cancelTypeForm").removeClass('d-none');
	$("#mySecGrid").addClass('d-none');
	$("#addBtn").addClass('d-none');
	$("#saveRateType").removeClass('d-none');
	$("#charge").val('');
}

function cancelRateType(){
	$("#cancelTypeForm").addClass('d-none');
	$("#rateTypeForm").addClass('d-none');
	$("#mySecGrid").removeClass('d-none');
	$("#saveRateType").addClass('d-none');
	$("#addBtn").removeClass('d-none');
}
function saveRateType() {
	var hotelData = {
		ratetypesId: $("#ratetypesId").val(),
		propertyId: $("#propertyId").val(),
		ratetypes: $("#ratetypes").val(),
		roomtypes: $("#roomtypes").val(),
		ratepernight: $("#ratepernight").val(),
		charge: $("#charge").val(),
		bedtypesId: $("#bedtypesId").val()
	};

	console.log(hotelData);
	saveRatetypesData(hotelData);
}

var columnDefs = [
	{ headerCheckboxSelection: false, checkboxSelection: true, width: 10, pinned: 'left' },
	{ headerName: "Property Id", field: "locationId", pinned: 'left' },
	{ headerName: "Code", field: "locationCode", hide: true, cellRenderer: () => 'Location' },
	{ headerName: "Property Name", field: "locationName", pinned: 'left' },
	{ headerName: "Type", field: "locationType" },
	{ headerName: "Address", field: "locStreet" },
	{ headerName: "City", field: "locCity" },
	{ headerName: "Ownership", field: "locOwnership" },
	{ headerName: "State", field: "locState" },
	{ headerName: "Country", field: "locCountry" },
	{ headerName: "Height", field: "locHeight" },
	{ headerName: "Width", field: "locWidth" },
	{ headerName: "Length", field: "locLength" },
	{ headerName: "Status", field: "locStatus", cellStyle: { textAlign: 'center' } },
	{ headerName: "Create Date", field: "createdDate", cellStyle: { textAlign: 'center' } }
];

var columnDefsSecond = [
    { headerName: "Rate Type Id", field: "rateTypeId", width: 100,hide:true },
    { headerName: "Room Type", field: "roomtypes",width: 100 },
    { headerName: "Bed Name", field: "bedName",width: 220 },
    {
        headerName: "Rate Type",
        field: "ratetypes",
        width: 100,
        cellClassRules: {
            'standard-rate': params => params.value === 'Standard',
            'corporate-rate': params => params.value === 'Corporate'
        }
    },
   
    {
        headerName: "Rate per Night",
        field: "ratepernight",
        width: 120,
        cellStyle: { textAlign: 'right' },
        valueFormatter: params => parseFloat(params.value).toFixed(2)
    },
    {
        headerName: "Charge per Extra Adult",
        field: "charge",
        width: 118,
        cellStyle: { textAlign: 'right' },
        valueFormatter: params => parseFloat(params.value).toFixed(2)
    }
];


var gridOptionsBuild = {
	columnDefs: columnDefs,
	rowSelection: 'single',
	suppressRowClickSelection: true,
	defaultColDef: {
		sortable: true,
		filter: true,
		resizable: true,
		width: 149
	},
	pagination: true,
	paginationPageSize: 15,
	onSelectionChanged: onSelectionChanged,
	paginationAutoPageSize: true
};

var gridOptionsSecond = {
	columnDefs: columnDefsSecond,
	rowSelection: 'single',
	suppressRowClickSelection: true,
	defaultColDef: {
		sortable: true,
		filter: true,
		resizable: true,
		width: 149
	},
	pagination: true,
	paginationPageSize: 15,
	onSelectionChanged: onSelectionChanged,
	paginationAutoPageSize: true
};

function onSelectionChanged() {
    var selectedRows = gridOptionsBuild.api.getSelectedRows();
    if (selectedRows.length > 0) {
        var selectedRow = selectedRows[0];
        var propertyId = selectedRow.locationId;
        var propertyName = selectedRow.locationName;
        var propertyType = selectedRow.locationType;
        $('#property').val(selectedRow.locationName);
        $('#propertyId').val(propertyId);
        $('.propertyName').html(propertyName + " (" + propertyType + ")");
        editRatetype(propertyId); // Optional: form fill karne ke liye
        getRatetypesDetails(propertyId); // Show only matching rows
        getRoomTypeData(propertyId);
    } else {
        $('#property').val('');
        $('#propertyId').val('');
        gridOptionsSecond.api.setRowData([]); // Clear second grid
        $('.propertyName').html("");
    }
}


function viewBuilding() {
    agGrid.simpleHttpRequest({ url: 'hotel-management-view' }).then(function (data) {
        var jsonData = JSON.parse(data.body);
        var allData = jsonData.Property;
        gridOptionsBuild.api.setRowData(allData || []);

        // Automatically select first row
        setTimeout(() => {
            var firstRow = gridOptionsBuild.api.getDisplayedRowAtIndex(0);
            if (firstRow) {
                firstRow.setSelected(true); // this will trigger onSelectionChanged()
            }
        }, 100);
    });
}


function saveRatetypesData(hotelData) {
    $.ajax({
        type: "POST",
        url: "save-ratetype-details",
        contentType: "application/json",
        data: JSON.stringify(hotelData),
        success: function (response) {
            if (response.code === "Success") {
                $('.loader').hide();
                toastr.success(response.message);
                getRatetypesDetails(hotelData.propertyId);
                cancelRateType();
                
            } else {
                toastr.error(response.message);
                $('.loader').hide();
            }
        },
        error: function () {
            $('.loader').hide();
            toastr.error("Something went wrong. Please try again.");
        }
    });
}

//edit

function editRatetype (id) {
	agGrid.simpleHttpRequest({
		url: "ratetype-edit?propertyId=" + id,
	}).then(function(response) {
		if (response.code === "Success") {
			console.log(response.body[0]);
			const responseBody = JSON.parse(response.body[0]);
			$("#propertyId").val(responseBody[0].propertyId);
			$("#ratetypes").val(responseBody[0].ratetypes);
			$("#roomtypes").val(responseBody[0].roomtypes);
			$("#ratepernight").val(responseBody[0].ratepernight);
			$("#charge").val(responseBody[0].charge);
			} 
			else {
			console.log("Failed to fetch data");
		}
	});
}
//view


function getRatetypesDetails(propertyId) {
    agGrid.simpleHttpRequest({ url: "ratetypes-view?id="+propertyId }).then(function (response) {
        var jsonData = JSON.parse(response.body);
        var allData = jsonData.ratetypesDetails || [];
        gridOptionsSecond.api.setRowData(allData);
    });
}

function getRoomTypeData(id) {
    agGrid.simpleHttpRequest({
        url: "get-roomtype-data?id=" + id,
    }).then(function(response) {
        if (response.code === "success") {
            const roomTypes = JSON.parse(response.body); 
            const select = document.getElementById("roomtypes");
            
            select.options.length = 1;
            roomTypes.forEach(room => {
                const option = document.createElement("option");
                option.value = room.roomTypeId;
                option.textContent = room.roomTypeName;
                select.appendChild(option);
            });
        } else {
            console.log("Failed to fetch data");
        }
    });
}

	
function getRoomData(id){
    const propertyId = $("#propertyId").val();
    agGrid.simpleHttpRequest({
		url: "get-bed-data?id=" + id + "&propertyId="+propertyId,
  	}).then(function(response) {
  		if (response.code === "success") {
  			 const roomTypes = JSON.parse(response.body); 
             const select = document.getElementById("bedtypesId");
             
             select.options.length = 1;
             roomTypes.forEach(room => {
                 const option = document.createElement("option");
                 option.value = room.bedTypeId;
                 option.textContent = room.bedTypeName;
                 select.appendChild(option);
             });
             
  			} 
  		 else {
  			console.log("Failed to fetch data");
  		}
  	});
}

    $("#bedtypesId").val(bedId);
    $("#bedtypes").val(bedName);
}
 */

</script>
</head>

										<!-- contract Tab -->

											class="tab-pane fade show active p-2 h-100">

													<div class="voucher-info">
														<span class="propertyName"></span>

												</div>
												<div class="mb-2">

																<td width="80%"><span id=""></span></td>
																<td>
																	<div class="d-flex justify-content-end gap-1">
																		<div class="mr-2" id="addBtn">

																	</div>
																</td>

												<div class="innercontent card p-2">

														<div class="row">

																<label>Property <span class="mandatory">*</span></label>
																<input type="text" class="form-control" id="property"
