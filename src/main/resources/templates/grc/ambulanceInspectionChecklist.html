<!DOCTYPE html>
<html>
<head>
<title>Ambulance Checklist</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
<style>
@page {
	size: A4 portrait;
	padding: 0;
	margin: 0;
}

table {
	width: 100%;
	font-family: sans-serif;
	border-collapse: collapse;
	border-spacing: 0;
	-fs-table-paginate: paginate;
}

.border, table, th, td, table.border, table.border th, table.border td {
	border: 1px solid;
}

table {
	page-break-inside: avoid;
}

table.borderless, .border table.border-0, .border table.border-0 th,
	.border table.border-0 td {
	border: 0;
}

.table-fixed {
	table-layout: fixed;
}

.m-0 {
	margin: 0;
}

.p-0 {
	padding: 0;
}

.align-middle {
	vertical-align: middle;
}

.text-center {
	text-align: center;
}

.text-start {
	text-align: left;
}

.text-end {
	text-align: right;
}

.text-nowrap {
	text-wrap: nowrap;
}

.align-top {
	vertical-align: top;
}

.align-bottom {
	vertical-align: bottom;
}

.border-0, .border-0 th, .border-0 td {
	border: 0;
}

.bordered .border-left-0 {
	border-left: 0;
}

.bordered .border-right-0 {
	border-right: 0;
}

.border-0 .border-top, .border-top, .border-top th, .border-top td {
	border-top: 1px solid;
}

.border-0 .border-left, .border-left, .border-left th, .border-left td,
	th.border-left {
	border-left: 1px solid;
}

.border-0 .border-right, .border-right, .border-right th, .border-right td,
	th.border-right {
	border-right: 1px solid;
}

.border-0 .border-bottom, .border-bottom, .border-bottom th,
	.border-bottom td {
	border-bottom: 1px solid;
}

.ps-1 {
	padding-left: 10px;
}

.ps-0_5 {
	padding-left: 5px;
}

.pt-1 {
	padding-top: 10px;
}

.p-0_5 {
	padding: 2.5px;
}

.p-1 {
	padding: 10px;
}

.p-2 {
	padding: 20px;
}

.px-3 {
	padding-left: 15px;
	padding-right: 15px;
}

.m-1 {
	margin: 5px;
}

.mt-2 {
	margin-top: 20px;
}

img {
	width: 250px;
}

.fs-18p {
	font-size: 18px;
}

.fs-16p {
	font-size: 16px;
}

.fs-14p, td.fs-14p {
	font-size: 14px;
}

.fs-12p {
	font-size: 12px;
}

.fs-10p {
	font-size: 10px;
}

.fs-9p {
	font-size: 9px;
}

.fw-normal {
	font-weight: normal;
}

.fw-bold {
	font-weight: 700;
}

.fw-bolder {
	font-weight: 900;
}

/*tbody td:first-child, tfoot td:first-child { border-left: 0; }*/
/*tbody td:last-child, tfoot td:last-child { border-right: 0; }*/
.h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th {
	height: 60px;
}

.h-pdf, .h-pdf td, .h-pdf th {
	height: 24px;
}

.h-pdf-next, .h-pdf-next td, .h-pdf-next th {
	height: 10px;
}

td.h-row {
	height: 20px;
}

td.h-row-smaller {
	height: 10px;
}

td.h-row-xs {
	height: 5px;
}

.bg-dark {
	background-color: #000000;
}

.bg-lightgrey {
	background-color: #d3d3d3;
}

.text-white {
	color: #ffffff;
}

.rounded-1 {
	border-radius: 5px;
}

.font-serif {
	font-family: serif;
}

.font-vivian {
	font-family: 'Vivian', sans-serif;
}

[class^="ti-"], [class*=" ti-"] {
	font-family: 'themify';
	speak: none;
	font-style: normal;
	font-variant: normal;
	text-transform: none;
	line-height: 1;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	font-weight: 900;
}

.ti-check:before {
	content: "\e64c";
}

.ti-close:before {
	content: "\e646";
}
.img-center {
  display: block;
  margin-left: auto;
  margin-right: auto;
  //width: 50%;
}
</style>
</head>
<body>

	<table class="borderless">
		<thead class="text-center border-0">
			<tr>
				<td>
					<table class="table-fixed border-0">
						<tr class="h-pdf-xl">
							<th></th>
							<!-- <th><span class="p-2 border fs-12p"></span></th> -->
							<th><span th:text="${allData[0].orgName}"></span></th>
							<th></th>
						</tr>
					</table>
				</td>
			</tr>
		</thead>
		<tbody class="border-0">
			<tr>
				<td>
					<table class="border">
						<thead>
							<tr>
								<th class="text-center">Ambulance Inspection Checklist</th>
							</tr>
							<tr>
								<td>
									<table class="border-0 fs-12p">
										<tr>
											<td width="25%" class="ps-0_5">Company Name</td>
											<td width="">:</td>
											<td width=""><span th:text="${allData[0].orgName}"></span></td>
										</tr>
										<tr>
											<td class="ps-0_5">Date of Inspection</td>
											<td>:</td>
											<td><span th:text="${allData[0].inspectionDate}"></span></td>
										</tr>
										<tr>
											<td class="ps-0_5">Number</td>
											<td>:</td>
											<td></td>
										</tr>
										<tr>
											<td class="ps-0_5">Owned/Hired/Contractor</td>
											<td>:</td>
											<td></td>
										</tr>
									</table>
								</td>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td class="p-1">
									<table class="fs-12p text-center">
										<tr>
											<th width="5%">SN</th>
											<th>Details</th>
											<th width="10%">Yes/No</th>
											<th width="15%">Comments</th>
										</tr>
										<tr th:each="items: ${allData[0].taskList}">
											<td class="align-top" th:text="${items.slNo}"></td>
											<td class="text-start ps-0_5" th:text="${items.taskName}"></td>
											<td th:text="${items.result}"></td>
											<td th:text="${items.remarks}"></td>
										</tr>

									</table>
									<table class="border-0 h-pdf-xl">
										<tr>
											<td>&nbsp;</td>
										</tr>
									</table>
									<table>
										<tr>
											<!-- <td width="50%" class="p-1" th:if="${iterStat.index == 0}">
                  <img th:src="${item.document}" alt="ambulance" style="width: 100px;"/>
                </td> -->
											<td>
												<table class="border-0">
													<tr>
														<td width="50%" class="p-1"
															th:each="item, iterStat : ${allData[0].taskList}"
															th:if="${iterStat.index < 3 and item.document != null and item.document != '' and item.document != 'null'}"><img
															class="img-center" th:src="${item.document}" alt="ambulance"
															style="width: 120px;" />
														<div class="text-center fs-12p pt-1"
																th:text="${iterStat.index + 1}"></div></td>
													</tr>
													<tr>
														<td width="50%" class="p-1"
															th:each="item, iterStat : ${allData[0].taskList}"
															th:if="${iterStat.index >= 3 and iterStat.index < 6 and item.document != null and item.document != '' and item.document != 'null'}">
															<img class="img-center" th:src="${item.document}" alt="ambulance"
															style="width: 120px;" />
														<div class="text-center fs-12p pt-1"
																th:text="${iterStat.index + 1}"></div>
														</td>
													</tr>
													<tr>
														<td width="50%" class="p-1"
															th:each="item, iterStat : ${allData[0].taskList}"
															th:if="${iterStat.index >= 6 and iterStat.index < 9 and item.document != null and item.document != '' and item.document != 'null'}">
															<img class="img-center" th:src="${item.document}" alt="ambulance"
															style="width: 120px;" />
														<div class="text-center fs-12p pt-1"
																th:text="${iterStat.index + 1}"></div>
														</td>
													</tr>
													<tr>
														<td width="50%" class="p-1"
															th:each="item, iterStat : ${allData[0].taskList}"
															th:if="${iterStat.index >= 9 and iterStat.index < 12 and item.document != null and item.document != '' and item.document != 'null'}">
															<img class="img-center" th:src="${item.document}" alt="ambulance"
															style="width: 120px;" />
														<div class="text-center fs-12p pt-1"
																th:text="${iterStat.index + 1}"></div>
														</td>
													</tr>
													<tr>
														<td width="50%" class="p-1"
															th:each="item, iterStat : ${allData[0].taskList}"
															th:if="${iterStat.index >= 12 and iterStat.index < 15 and item.document != null and item.document != '' and item.document != 'null'}">
															<img class="img-center" th:src="${item.document}" alt="ambulance"
															style="width: 120px;" />
														<div class="text-center fs-12p pt-1"
																th:text="${iterStat.index + 1}"></div>
														</td>
													</tr>

												</table>
											</td>
											<td width="50%" class="p-1 fs-12p">
												<table>
													<tr>
														<td class="ps-0_5"><span class="bg-lightgrey">Fit
																for use:</span><span th:text="${allData[0].fitForUse}"></span></td>
													</tr>
												</table>
												<table class="border-0 h-pdf">
													<tr>
														<td>&nbsp;</td>
													</tr>
												</table>
												<table>
													<tr>
														<td class="ps-0_5"><span class="bg-lightgrey">Inspection
																Done By:</span><span th:text="${allData[0].inspectionName}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Name:<span
															th:text="${allData[0].inspectionName}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Department:<span
															th:text="${allData[0].inspectionDept}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Designation:<span
															th:text="${allData[0].inspDesgn}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Signature:<span
															th:text="${allData[0].inspectionName}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Date:<span
															th:text="${allData[0].inspectionDate}"></span></td>
													</tr>
												</table>
												<table class="border-0 h-pdf">
													<tr>
														<td>&nbsp;</td>
													</tr>
												</table>
												<table>
													<tr>
														<td class="ps-0_5"><span class="bg-lightgrey">Review
																Done By:</span><span th:text="${allData[0].reviewName}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Name:<span
															th:text="${allData[0].reviewName}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Department:<span
															th:text="${allData[0].reviewDept}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Designation:<span
															th:text="${allData[0].reviewDesgn}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Signature:<span
															th:text="${allData[0].reviewName}"></span></td>
													</tr>
													<tr>
														<td class="ps-0_5">Date:<span
															th:text="${allData[0].reviewDate}"></span></td>
													</tr>
												</table>
											</td>
										</tr>
									</table>
								</td>
							</tr>
						</tbody>
					</table>
				</td>
			</tr>
		</tbody>
	</table>


</body>
</html>
