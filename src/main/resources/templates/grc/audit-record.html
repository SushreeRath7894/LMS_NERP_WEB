function updateRowData(updatedItem) {
	//console.log("Updated Item---->>>>",updatedItem);
    activityOptions.api.forEachNode(function(rowNode) {
        if (rowNode.data.status === updatedItem.status) {
            rowNode.setData(updatedItem);
            return;
        }
    });
}

function saveFile(event, uploadIndex, params) {
    var fileInput = event.target;
    var uFile = fileInput.files[0];
    var fileName = fileInput.value;

    var lastIndex = fileName.lastIndexOf("\\");
    if (lastIndex >= 0) {
        fileName = fileName.substring(lastIndex + 1);
    }

    var reader = new FileReader();
    reader.onload = function(e) {
        var base64Data = e.target.result;

        var iURL = URL.createObjectURL(uFile);
        $('#uploadedAuditDoc_' + uploadIndex).html('<img src="' + iURL + '" width="100">');
        $('#auditImageName_' + uploadIndex).text(fileName);

        var rowData = params.data;
    	console.log("PARAM",params);
        var item = {};

        Object.keys(rowData).forEach(function(key) {
            item[key] = rowData[key];
        });
        var checkbox = document.getElementById("status"+params.rowIndex);
       /*  if (checkbox.checked) {
        	item.status =1;
        }else{
        	item.status =0;
        }  */
        item.result = $('#resultDropdown' + params.rowIndex).val();
        item['base64Image'] = base64Data;
        item['fileName'] = fileName;
        item['tempURL'] = iURL;
        
        

        updateGridRow(params.data.slno, item);
    };

    reader.readAsDataURL(uFile);

    function updateGridRow(field, updatedItem) {
        activityOptions.api.forEachNode(function(rowNode) {
            if (rowNode.data.slno === updatedItem.slno) {
                rowNode.setData(updatedItem);
                activityOptions.api.refreshCells({ rowNodes: [rowNode], force: true });
                return;
            }
        });
    }
}

		        success: function(response) {
		            console.log('Save successful:', response);
		            if (response.code == "success") {
		                schedulePlanCancel();
		                $("#messageParagraph").text(response.message);
		                $("#msgOkModal").removeClass("btn3").addClass("btn1");
		                $("#msgModal").modal('show');
		            } else {
		                $("#messageParagraph").text("Something Went Wrong");
		                $("#msgOkModal").removeClass("btn3").addClass("btn1");
		                $("#msgModal").modal('show');
		            }
		        },
		        error: function(error) {
		            console.error('Save failed:', error);
		            $("#messageParagraph").text("Failed to save data. Please try again later.");
		            $("#msgOkModal").removeClass("btn3").addClass("btn1");
		            $("#msgModal").modal('show');
		        }
		    });
	    }, 500);
	    // AJAX request to send rowData to server

	}
 function getUploadedFileData(uploadIndex) {
	    var uploadedImageElement = $(`#uploadedAuditDoc_${uploadIndex}`);
	    if (uploadedImageElement.length > 0) {
	        var imgSrc = uploadedImageElement.find('img').attr('src');
	        if (imgSrc && imgSrc.startsWith('data:image')) {
	            var base64Data = imgSrc.split(',')[1];  
	            return base64Data;
	        }
	    }
	    return null;
	}
	
 
 function schedulePlanCancel(){
	 $('#scheduledDetailsModal').modal('hide'); 
 }
</script>
