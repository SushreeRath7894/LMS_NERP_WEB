
<!DOCTYPE html>

.btn3 {
	border: none;

	font-size: 14px;

.taskInfo {
	padding-left: 10px;

.rating {
	float: left;

.rating:not(:checked )>input {
	position: absolute;
	top: -9999px;
	clip: rect(0, 0, 0, 0);
}

.rating:not(:checked )>label {
	float: right;

.rating:not(:checked )>label:before {
	content: '★ ';
}

.rating>input:checked ~ label {
	color: #ea0;
	/*  text-shadow:1px 1px #c60, 2px 2px #940, .1em .1em .2em rgba(0,0,0,.5); */
}

	 ~ label {

	label, .rating>input:checked ~ label:hover, .rating>input:checked ~
	label:hover ~ label, .rating>label:hover ~ input:checked ~ label {

	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */

.rating>label:active {

	color: #fff !important;

.btn_new {
    border: none;
    background: rgb(87, 132, 196);
    background: linear-gradient(0deg, rgb(42 22 57) 0%, rgb(88, 0, 152) 100%);
    border-radius: 4px;
    font-size: 12px;
    background-color: #264c82;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 8px;
    line-height: 12px;
    box-shadow: inset 2px 2px 2px 0px rgba(255, 255, 255, .5), 7px 7px 20px 0px rgba(0, 0, 0, .1), 4px 4px 5px 0px rgba(0, 0, 0, .1);
    text-transform: uppercase;

<script>

	$(function() {

		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
	
			agGrid.simpleHttpRequest({
				url : 'manage-finacialYear-view-through-json'
			}).then(function(data) {
				var jsonData = JSON.parse(data.body[0]);
				var allData=jsonData.financial;
				console.log(allData)
				var len = allData.length;
				$('#totalReq').find('span').html(len);
				gridOptions.api.setRowData(allData);
			});
			
	});
	
	$(function() {
		$('.collapse').on('show.bs.collapse', function() {
			$(this).siblings('.panel-heading').addClass('active');
		});

	})
	//search bar

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	$('input,textarea').focus(
			function() {
				$(this).data('placeholder', $(this).attr('placeholder')).attr(
						'placeholder', '');
			}).blur(function() {
		$(this).attr('placeholder', $(this).data('placeholder'));
	});

	var count = 0;
	function allCheck() {
		count++;

		if (count == 1) {
			$('.checkCls').prop("checked", true);
		} else {
			count = 0;
			$('.checkCls').prop("checked", false);
		}
	}

	var txtLen = 0;
	function textCount(event) {

		var id = event.target.id;
		var pId = $('#' + id).next().attr("id");
		$('#' + pId + ' span').empty();
		txtLen = $('#' + id).val().length;
		$('#' + pId + ' span').append(txtLen);
	}
	// column Defs
	const columnDefs = [
			{
				headerCheckboxSelection : true,
				checkboxSelection : true,
				width : 8,
				sortable : false,
				filter : false,
				resizable : true

			},
			{
				headerName : 'Financial Year Id',
				field : "financialYearId",
				width : 200,
				cellRenderer : function(params) {
					return '<a onclick=editPage("' + params.data.financialYearId
							+ ',' + '0' + '") href="javascript:void(0)">'
							+ params.data.financialYearId + '</a>';
				}
			},
			
			{
				headerName : "Financial Year Name",
				field : "financialYearName",
				width : 350,
				cellStyle : {
					textAlign : 'center'
				}
			},

			{
				headerName : "Financial Year Start Date",
				field : "financialYearStartDate",
				width : 355,
				cellStyle : {
					textAlign : 'center'
				}
			},

			{
				headerName : "Financial Year End Date",
				field : "financialYearEndDate",
				width : 360,
				cellStyle : {
					textAlign : 'center'
				}
			
			
			},
			{
				headerName : "Description",
				field : "description",
				width : 200,
				cellStyle : {
					textAlign : 'center'
				}
			
			
			}];

	const gridOptions = {
		columnDefs : columnDefs,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 200,
			height : 10
		},
		rowSelection : 'single',
		suppressRowClickSelection : true,
		onSelectionChanged : rowSelect,
		getRowNodeId : function(data) {
			return data.financialYearId;
		}
	};

	
	var deleteId = "";
	function rowSelect() {
		//alert('hello select');
		var selectedRows = gridOptions.api.getSelectedRows();
		deleteId = "";

		for (var i = 0; i < selectedRows.length; i++) {
			deleteId = deleteId + '"' + selectedRows[i].financialYearId + '",';
			// deleteId = deleteId  + selectedRows[i].incentiveId + ',';
		}
		deleteId = deleteId.substring(0, deleteId.length - 1);
		console.log(deleteId)
		var rowCount = 0;

		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});

		if (rowCount > 0) {
			$('#delete').attr("disabled", false);

		} else {
			$('#delete').attr("disabled", true);
		}
	}
	// for new button
	function newBtn() {
		//	alert('hello');
		$("#add").hide();
		$("#copy").hide();
		$("#delete").hide();
		$("#myGrid").hide();
		$("#searchRowDiv").hide();
		$("#totalReq").hide();
		$("#statusDiv").hide();
		$("#idDiv").hide();
		$("#collapseFour").hide();
		$("#headingFour").hide();
		$("#myGridActivity").hide();
		$("#financialYearId").empty();

		$("#demo").show();

	}
	// for cancel button
	function cancelBtn() {
		$("#add").show();
		$("#copy").show();
		$("#delete").show();
		$("#totalReq").show();
		$("#myGrid").show();
		$("#searchRowDiv").show();
		$("#demo").hide();

		$('#financialYearId').val("");
		$('#financialYearName').val("");
		$('#financialYearStartDate').val("");
		$('#financialYearEndDate').val("");
		$('#description').val("");

		agGrid.simpleHttpRequest({
			url : "manage-financialYear-view"
		}).then(function(data) {
			gridOptions.api.setRowData(data);
		});
	}


	// Edit & stage change 
	function editPage(id) {
		//alert(id);
		var editId = id.split(",");

		var financialYearId = editId[0];

		var modal = editId[1];
		//alert('colorId------'+colorId);
		$("#demo").show();
		$("#add").hide();
		$("#copy").hide();
		$("#delete").hide();
		$("#myGrid").hide();
		$("#searchRowDiv").hide();
		$("#totalReq").hide();
		$("#statusDiv").hide();
		$("#idDiv").show();
		$("#collapseFour").hide();
		$("#headingFour").hide();
		$("#myGridActivity").hide();

		$.ajax({
			type : "GET",
			url : "manage-financialyear-edit?id=" + financialYearId,
			async : false,
			success : function(response) {
				console.log("response------" + JSON.stringify(response));
			if (response.message == "Success") {

					$("#add").hide();
					$("#copy").hide();
					$("#delete").hide();
					$("#myGrid").hide();
					$("#searchRowDiv").hide();
					$("#totalReq").hide();
					$("#statusDiv").hide();
					$("#idDiv").hide();
					$("#collapseFour").hide();
					$("#headingFour").hide();
					$("#myGridActivity").hide();

					$("#demo").show();

					$(".container").hide();

					$("#financialYearId").text(response.body[0].financialYearId);
					$("#financialYearName").val(response.body[0].financialYearName);
					$("#financialYearStartDate").val(response.body[0].financialYearStartDate);
					$("#financialYearEndDate").val(response.body[0].financialYearEndDate);
					$("#description").val(response.body[0].description);
					
				}
			}
		})
}


	
</script>
<script>
	//addClubMemberInfo

		console.log("object on add-----------" + JSON.stringify(obj));

						 location.reload();*/
									
						    cancelBtn();
						    location.reload();
						/*	agGrid.simpleHttpRequest({
							url : 'manage-finacialYear-view-through-json'
						}).then(function(data) {
							var jsonData = JSON.parse(data.body[0]);
							var allData=jsonData.Currency;

					}
				},
				error : function(data) {

			})
		}

	

	function deleteFinancialYearInfo() {
		//console.log("delete ids--------------"+deleteId);

		$.ajax({
			type : "GET",
			url : "manage-financialYear-delete?id=" + deleteId,
			success : function(response) {
				if (response.message == "Success") {
					swal("Financial Year deleted successfully!", " ", "success");
					cancelBtn();
					agGrid.simpleHttpRequest({
						url : "manage-financialYear-view"
					}).then(function(data) {
						gridOptions.api.setRowData(data);
					});

				}
			}

		});

		$('#delete').attr("disabled", true);
	}

	
</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">

					<div class="d-flex justify-content-between">
						<div class="col-md-2  btn-hs">
							<div class="font-design" id="totalReq">
								FINANCIAL YEAR LIST(<span></span>)
							</div>
						</div>
						<div class="col-md-4  btn-hs" id="searchRowDiv">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search"
									class="searchboxinput" onkeyup="cancelBar()"
									oninput="onQuickFilterChanged()" id="quickFilter">
								<div class="searchicon">
									<a href="javascript:void(0)"><span
										style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
										id="closeKey"
										onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';"
										class="close_i"><i class="ti-close srchicon"></i></span></a><a
										href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
								</div>
							</div>

						</div>
						<div class="col-md-6 buttonsec btn-hs d-flex justify-content-end">
						<input type="button" class="btn_new" id="add"
								value="Add Financial" onclick="newBtn()" readonly>
						
							<input type="button" class="btn3"
								onclick="deleteFinancialYearInfo()" id="delete" value="DELETE"
								data-toggle="modal" data-target="#delete" readonly>
							<!-- <input type="button" class="btn2" id="action" value="Action"
									 readonly> -->

							
								
						</div>
					</div>

					<input type="hidden" id="totalPageno"> <input type="hidden"
						id="currentPageno">
					<div id="myGrid" style="width: 100%; height: 350px;"
						class="ag-theme-alpine"></div>
					<div id="pagination" style="cursor: pointer;"></div>

					<div class="collapse" id="demo">
						<div class="innercontent">
							<div class="innerstickybg">
								<div class="d-flex justify-content-between" id="main">
									<div class="col-md-3" id="idDiv">
										Financial Year ID: <span id="financialYearId"></span>
									</div>
									<div>
										<span class="taskInfo">Financial Year Information</span>
									</div>


									<div class="col-md-3 padding-0" align="right">
										<button class="btn1" id="cancel" onclick="cancelBtn()">BACK</button>
										<button class="btn4" id="cancel" onclick="cancelBtn()">CANCEL</button>
										<button class="btn1" id="save" onclick="addFinancialInfo()">SAVE</button>

									</div>
								</div>
							</div>
							<div class="innercontent">

								<!-- <div class="row"> -->
								<div class="row">
									<div class="col-md-4">
										<div class="form-group">
											<label>Financial Year Name</label> <input type="text"
												class="form-control" id="financialYearName"
												placeholder="Financial Year Name" onblur="showDisplay()">
											<span id="errmsg_fname"></span>
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Financial Year Start Date</label> <input type="text"
												class="form-control" id="financialYearStartDate"
												placeholder="Financial Year Start Date"
												onblur="showDisplay()"> <span id="errmsg_fname"></span>
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Financial Year End Date</label> <input type="text"
												class="form-control" id="financialYearEndDate"
												placeholder="Financial Year End Date"
												onblur="showDisplay()"> <span id="errmsg_fname"></span>
										</div>
									</div>
								</div>
							</div>
						</div>


						<!-- 	main div start here -->
						<div id="main">

							<!-- 	collapse for Contact InformationStart here -->
							<div class="accordion-item">
								<h2 class="accordion-header" id="headingOne">
									<button class="accordion-button" type="button"
										data-bs-toggle="collapse" data-bs-target="#collapseOne"
										aria-expanded="false" aria-controls="collapseOne">
										Description Information</button>
								</h2>
								<div id="collapseOne" class="accordion-collapse collapse show"
									aria-labelledby="headingOne" data-bs-parent="#accordionExample">
									<div class="accordion-body">
										<div class="row">
											<div class="col-md-8">
												<div class="modal-inrheading">Description</div>
												<div class="position-text">
													<textarea rows="4" cols="100" id="description"
														onkeyup="textCount(event)"></textarea>
													<div id="charNumSN" class="txtcounter" align="right">
														<span>0</span> characters
													</div>
												</div>
											</div>

										</div>

									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
