<script type="text/javascript"> 
let validatedRows = [];
function getCourseName(fileName) {
    if (!fileName) return "UNKNOWN";
    return fileName.replace(/\.(xlsx|xls|csv)$/i, '').trim();
}
$(document).ready(function () {
	$("#save").addClass('d-none');
    console.log("✅ Document ready — initializing Excel upload script...");

    // --- CRITICAL CHECK ---
    if (typeof XLSX === 'undefined') {

        return;
    }
    // --- END CRITICAL CHECK ---

    const fileInput   = document.getElementById('excelFile');
    const previewBtn  = document.getElementById('previewBtn');
   // const uploadBtn   = document.getElementById('uploadBtn');
    const clearBtn    = document.getElementById('clearBtn');

    let parsedData = [];

    // ------------------------------------------------------------
    // Header Normalization & Mapping
    // ------------------------------------------------------------
    function normalizeHeader(h) {
        if (!h) return '';
        return String(h).trim()
            .replace(/\s+/g, ' ')
            .replace(/[:#]/g, '')
            .toLowerCase();
    }

    function mapHeaderToKey(h) {
        const s = normalizeHeader(h);
        if (/question\s*text|^question$|ques.?/.test(s)) return 'Question';
        if (/correct.*answer|answer\s*correct|^answer$/.test(s)) return 'Correct Answer';
        if (/option\s*1|option\s*a/.test(s)) return 'Option 1';
        if (/option\s*2|option\s*b/.test(s)) return 'Option 2';
        if (/option\s*3|option\s*c/.test(s)) return 'Option 3';
        if (/option\s*4|option\s*d/.test(s)) return 'Option 4';
        if (/rationale\s*1|rationale\s*a/.test(s)) return 'Rationale 1';
        if (/rationale\s*2|rationale\s*b/.test(s)) return 'Rationale 2';
        if (/rationale\s*3|rationale\s*c/.test(s)) return 'Rationale 3';
        if (/rationale\s*4|rationale\s*d/.test(s)) return 'Rationale 4';
        if (/syllabus.*ref|reference/.test(s)) return 'Syllabus Ref';
        return String(h).trim();
    }
    // ------------------------------------------------------------
    // Validation Rules
    // ------------------------------------------------------------
    const VALIDATION_RULES = {
        required: ['Question', 'Correct Answer'],
        maxLengths: { 'Question': 2000, 'Option 1': 500, 'Syllabus Ref': 200 },
        allowedCorrectFormats: ['A','B','C','D']
    };

    function validateRow(rowObj, rowIndex, seenQuestions) {
        const errors = [];

        // Required fields
        for (const col of VALIDATION_RULES.required) {
            if (!String(rowObj[col] ?? '').trim()) {
                errors.push({ type: 'required', message: `${col} is required.` });
            }
        }

        // Length limits
        for (const [col, max] of Object.entries(VALIDATION_RULES.maxLengths)) {
            if ((rowObj[col] ?? '').length > max) {
                errors.push({ type: 'length', message: `${col} exceeds ${max} chars.` });
            }
        }

        // Correct Answer validation
        const correctVal = String(rowObj['Correct Answer'] ?? '').trim();
        if (correctVal) {
            const normalized = correctVal.toUpperCase();
            if (!VALIDATION_RULES.allowedCorrectFormats.includes(normalized)) {
                const matchesOption = ['Option 1','Option 2','Option 3','Option 4'].some(optKey => {
                    const val = String(rowObj[optKey] ?? '').trim();
                    return val && val === correctVal;
                });
                if (!matchesOption) {
                    errors.push({ type: 'answer_mismatch', message: 'Correct Answer does not match A/B/C/D nor any Option text.' });
                }
            }
        }

        // Duplicate question check
        const qnorm = String(rowObj['Question'] ?? '').trim().toLowerCase();
        if (qnorm && seenQuestions.has(qnorm)) {
            errors.push({ type: 'duplicate', message: 'Duplicate question in file.' });
        } else if (qnorm) {
            seenQuestions.add(qnorm);
        }

        // At least two options
        const opts = ['Option 1','Option 2','Option 3','Option 4']
            .map(k => String(rowObj[k] ?? '').trim())
            .filter(Boolean);
        if (opts.length < 2) {
            errors.push({ type: 'options_count', message: 'At least two options required.' });
        }

        return { valid: errors.length === 0, errors };
    }

    // ------------------------------------------------------------
    // Event: File Selection
    // ------------------------------------------------------------
    uploadTrigger.addEventListener('click', () => {
	  fileInput.click();
	});
	
	// When file is selected
	fileInput.addEventListener('change', () => {
	  if (fileInput.files.length > 0) {
	    const file = fileInput.files[0];
	    fileName.textContent = file.name;
	
	    // Show file name and remove icon
	    fileInfo.classList.remove('d-none');
	    uploadTrigger.classList.add('d-none'); // hide plus icon
	
	    console.log(`📁 Selected file: ${file.name}`);
	  }
	});
	
	// When remove icon is clicked
	removeFile.addEventListener('click', () => {
	  fileInput.value = ''; // clear file input
	  fileInfo.classList.add('d-none');
	  uploadTrigger.classList.remove('d-none'); // show plus icon again
	  console.log("🗑️ File removed, ready to upload new one");
	});

    // ------------------------------------------------------------
    // Event: Clear
    // ------------------------------------------------------------
    clearBtn.addEventListener('click', () => {
        fileInput.value = '';
        previewBtn.disabled = false;
        $("#save").addClass('d-none');
       // uploadBtn.disabled  = true;
        previewArea.innerHTML = '';
        parsedData = [];
        headers = [];
        msg.innerHTML = '';
        fileInput.value = ''; // clear file input
  	    fileInfo.classList.add('d-none');
  	    uploadTrigger.classList.remove('d-none');
        console.log("🧹 Form and data cleared.");
    });

    // ------------------------------------------------------------
    // Preview Logic
    // ------------------------------------------------------------
    previewBtn.addEventListener('click', () => {
        console.log("👀 Preview button clicked");

        const file = fileInput.files[0];
        if (!file) {
            console.log('Please select a file first.');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const courseName = getCourseName(file.name);
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                if (!rows || rows.length === 0) {
                    previewArea.innerHTML = '<div class="alert alert-warning">No data found in the sheet.</div>';
                    return;
                }

             let headerRowIndex = -1;
             for (let i = 0; i < rows.length; i++) {
                 const row = rows[i].map(c => String(c).trim());
                 const headerLike = row.some(cell => /question|option|answer|rationale/i.test(cell));
                 if (headerLike) {
                     headerRowIndex = i;
                     break;
                 }
             }

             if (headerRowIndex === -1) {
                 previewArea.innerHTML = '<div class="alert alert-warning">❌ Could not find a valid header row (no "Question" or "Option" columns found).</div>';
                 console.error("❌ Could not find header row with recognizable column names.");
                 return;
             }

             console.log(`✅ Header row likely found at index ${headerRowIndex + 1}`);
             const rawHeaders = rows[headerRowIndex];
             headers = rawHeaders.map(h => String(h).trim());


                parsedData = rows.slice(headerRowIndex + 1)
                    .filter(r => r.some(c => c !== "" && c !== null))
                    .map(r => {
                        const obj = {};
                        headers.forEach((h, i) => obj[h || `COL_${i}`] = r[i] ?? "");
                        return obj;
                    });

                console.log(`🧩 Detected Headers: ${headers.join(', ')}`);
                console.log(`✅ Parsed ${parsedData.length} rows`);

                validatedRows = renderPreviewTableWithValidation(headers, parsedData, sheetName);
                const validCount = validatedRows.filter(r => r.validation.valid).length;
                validCount === 0 ? $("#save").addClass("d-none") : $("#save").removeClass("d-none");

                msg.innerHTML = `<div class="alert alert-success">
                    Parsed ${parsedData.length} row(s) from sheet "<strong>${sheetName}</strong>".
                    <br><strong>Quiz Code/Section Title:</strong> ${courseName}<br>
                    Valid rows: ${validCount}
                </div>`;
            } catch (err) {
                console.error("❌ Error parsing file:", err);
                previewArea.innerHTML = '<div class="alert alert-danger">Error parsing file: ' + escapeHtml(err.message) + '</div>';
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // ------------------------------------------------------------
    // Preview Renderer
    // ------------------------------------------------------------
   function renderPreviewTableWithValidation(headers, rows, sheetName) {
    const seenQuestions = new Set();

    // Step 1️⃣: Validate each row and build objects
    const rowsWithValidation = rows.map((r, idx) => {
        const obj = {};
        headers.forEach(h => obj[h.trim()] = r[h] ?? ""); // preserve all Excel columns dynamically
        const validation = validateRowDynamic(obj, idx + 1, seenQuestions);
        return { rowObj: obj, validation, originalIndex: idx + 1 };
    });

    // Step 2️⃣: Build HTML table dynamically from headers
    let html = `<div class="mb-2">Sheet: ${escapeHtml(sheetName)} — Total rows: ${rowsWithValidation.length}</div>`;
    html += '<table class="table table-sm table-bordered"><thead><tr>';

    // use all headers dynamically
    headers.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
    html += '<th>Status</th></tr></thead><tbody>';

    rowsWithValidation.forEach(rwv => {
        const r = rwv.rowObj;
        html += '<tr>';
        headers.forEach(c => html += `<td title="${escapeHtml(String(r[c] ?? ''))}">${escapeHtml(String(r[c] ?? ''))}</td>`);
        if (rwv.validation.valid) {
            html += `<td class="text-success">Valid</td>`;
        } else {
            const msgs = rwv.validation.errors.map(e => e.message).join('; ');
            html += `<td class="text-danger" title="${escapeHtml(msgs)}">Invalid: ${escapeHtml(rwv.validation.errors[0].message)}</td>`;
        }
        html += '</tr>';
    });

    html += '</tbody></table>';

    // Step 3️⃣: Summary
    const invalidCount = rowsWithValidation.filter(r => !r.validation.valid).length;
    html = `<div class="mb-2">Valid rows: ${rowsWithValidation.length - invalidCount} • Invalid rows: ${invalidCount}</div>` + html;

    previewArea.innerHTML = html;
    return rowsWithValidation;
}
    
   function validateRowDynamic(rowObj, rowNum, seenQuestions) {
	    const errors = [];

	    // 1️⃣ Question required
	    const question = rowObj["Question"]?.trim();
	    if (!question) errors.push({ message: "Question is required" });
	    else if (seenQuestions.has(question)) errors.push({ message: "Duplicate question text" });
	    else seenQuestions.add(question);

	    // 2️⃣ Map correct answer text → A/B/C/D if possible
	    let answer = rowObj["Correct Answer"]?.trim();
	    let mappedAnswer = answer?.toUpperCase();

	    const options = [
	        rowObj["Option 1"]?.trim(),
	        rowObj["Option 2"]?.trim(),
	        rowObj["Option 3"]?.trim(),
	        rowObj["Option 4"]?.trim()
	    ];

	    // Try to match answer text with one of the options (case-insensitive)
	    if (answer && !["A", "B", "C", "D"].includes(mappedAnswer)) {
	        const matchIndex = options.findIndex(opt => opt && opt.toLowerCase() === answer.toLowerCase());
	        if (matchIndex >= 0) {
	            mappedAnswer = String.fromCharCode(65 + matchIndex); // A=65
	            rowObj["Correct Answer"] = mappedAnswer; // update the actual data
	        } else {
	            errors.push({ message: "Correct Answer does not match any Option (1–4)" });
	        }
	    }

	    // 3️⃣ Final validation for Correct Answer
	    if (!mappedAnswer) {
	        errors.push({ message: "Correct Answer is required" });
	    } else if (!["A", "B", "C", "D"].includes(mappedAnswer)) {
	        errors.push({ message: "Correct Answer must be A, B, C, or D" });
	    }

	    // 4️⃣ Check Options are not empty (if they exist)
	    for (let i = 1; i <= 4; i++) {
	        const opt = rowObj[`Option ${i}`]?.trim();
	        if (!opt) errors.push({ message: `Option ${i} is missing` });
	    }

	    return {
	        valid: errors.length === 0,
	        errors
	    };
	}

    // Upload Logic
    // ------------------------------------------------------------

    // ------------------------------------------------------------
    // Utility: Escape HTML
    // ------------------------------------------------------------
    function escapeHtml(s) {
        if (!s && s !== 0) return '';
        return String(s)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

function masterSaveQuiz() {

    });
}

function uploadAllQuizData(validRows, courseName) {
    console.log("📦 Preparing bulk JSON payload...");

    if (!validRows || !validRows.length) {
        toastr.warning("No valid quiz data to upload.");
        return;
    }
    
    const loader = `
        <div id="uploadLoader" class="loader-overlay">
            <div class="loader"></div>
            <p class="loader-text">Uploading quiz data, please wait...</p>
        </div>
    `;
    $("body").append(loader);
     const quizArray = validRows.map((row) => {
        const options = [];
        for (let i = 1; i <= 4; i++) {
            options.push({
                option: String.fromCharCode(64 + i), // A, B, C, D
                text: row[`Option ${i}`]?.trim() || "",
                rationale: row[`Rationale ${i}`]?.trim() || ""
            });
        }

        return {
            quiz_code: courseName,
            section_title: courseName,
            question_text: row["Question"] ?? "",
            right_answer: row["Correct Answer"] ?? "",
            syllabus_ref: row["Syllabus Ref"] ?? "",
            options
        };
    });

    console.log("🧩 Final quizArray structure:", quizArray);

     toastr.info("Uploading all quiz data...");

    // --- AJAX POST ---
    $.ajax({
        url: "quiz-config-add",
        type: "POST",
        data: JSON.stringify(quizArray),
        contentType: "application/json",
        processData: false,
        success: function (response) {
            console.log("✅ Server response:", response);
            $("#uploadLoader").remove();
            if (response?.code === "success") {
            	 $("#save").addClass('d-none');
            	 document.getElementById('msg').innerHTML = '';
            	 document.getElementById('excelFile').value = '';  
            	 document.getElementById('fileInfo').classList.add('d-none');
            	 document.getElementById('uploadTrigger').classList.remove('d-none');
            	 toastr.success(response.message || "✅ Quiz saved successfully!");
                Swal.fire({
                    title: "Upload Successful!",
                    text: response.message || `Uploaded ${quizArray.length} quiz question(s).`,
                    icon: "success",
                    confirmButtonText: "OK"
                }).then(() => {
                    if (typeof getQuizDetails === "function") getQuizDetails();
                    $("#excelFile").val("");
                    $("#previewArea").html("");
                    validatedRows = [];
                    parsedData = [];
                });
            } else {
                toastr.error(response.message || "❌ Upload failed on server.");
                Swal.fire("Upload Failed", response.message || "Server returned error.", "error");
            }

        },
        error: function (xhr, status, error) {
            console.error("❌ Upload failed:", error, xhr.responseText);
            toastr.error("Upload failed: " + (xhr.responseText || error));
            Swal.fire("❌ Upload Failed", xhr.responseText || error, "error");
            $("#save").removeClass('d-none');
            $("#uploadLoader").remove();
        }
    });
}
