<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="UTF-8">
<style>
#myGrid {
	height: 500px; /* or any suitable height */
	width: 100%;
}
.w-400{
width:400px;}
.search-sec .go-btn {
    width: 60px;
    height: 37px;
}
</style>

<script type="text/javascript">
	$(document).ready(function() {
		$("#dltBtn").prop("disabled", true);
		var gridDivm = document.querySelector('#myGrid');
		new agGrid.Grid(gridDivm, contactUsGrid);
		getcontactusData();
	});

	var columnDefsCourse = [ {
		headerCheckboxSelection : true,
		headerCheckboxSelectionFilteredOnly : true,
		checkboxSelection : true,
		width : 10,
		sortable : false,
		filter : false,
		resizable : true,
		pinned : 'left',
	},{
		headerName : "Name",
		field : "name",
 	}, {
		headerName : "Email",
		field : "email",
 	},{
		headerName : "Course Name",
		field : "courseName",
	}, {
		headerName : "Organisation",
		field : "organisation",
	}, {
		headerName : "Phone Number",
		field : "phone",
 	}, {
		headerName : "Message",
		field : "message"
	},
	{
		headerName : "Training Id",
		field : "trainingId",
		hide :true
	}
	];
	var contactUsGrid = {
		columnDefs : columnDefsCourse,
		rowSelection : 'multiple',
		suppressRowClickSelection : false,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 185,
			height : 10
		},
		pagination : true,
		paginationPageSize : 15,
		onGridSizeChanged: function(params) {
			params.api.sizeColumnsToFit();
		},
		onSelectionChanged : onSelectionChanged,
	};
	function onSelectionChanged() {
		let selectedRows = contactUsGrid.api.getSelectedRows();
		 var rowCount = selectedRows.length; // Use .length for count
		 if (rowCount > 0) {
	   
 	        $("#dltBtn").prop("disabled", false);
	    } else {
 	        $("#dltBtn").prop("disabled", true);
	    }
	 }
	function getcontactusData(){
	    $.ajax({
	        type:'GET',
	        url:'contactUs-data-view',
	        success:function(response){
	            if(response.message =='Success'){
	                
	                const raw = JSON.parse(response.body[0]).contactdetails;
                    console.log("Raw Data----->",raw);
	                contactUsGrid.api.setRowData(raw);
	            }
	        }
	    })
	}
	
	function enterToSearch(event) {
		 if (event.key === 'Enter') {
		     onQuickFilterChanged();
		 }
		}
	
	function onQuickFilterChanged() {
		 const filterValue = document.getElementById('quickFilter').value;
		 if (filterValue) {
			 contactUsGrid.api.setQuickFilter(filterValue);  
 		     setTimeout(() => {  
		         const firstRow = contactUsGrid.api.getDisplayedRowAtIndex(0);
		         if (firstRow) {
		             firstRow.setSelected(true);
		         }
		     }, 100);
		 }
		}
		function reset() {
		 $("#quickFilter").val('');  
		 contactUsGrid.api.setQuickFilter('');  
 		 setTimeout(() => {
		     const firstRow = contactUsGrid.api.getDisplayedRowAtIndex(0);
		     if (firstRow) {
		         firstRow.setSelected(true);
		     }
		 }, 100);
		}

</script>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="d-flex justify-content-between align-items-center mb-3">
										
										
											<div class="d-flex gap-2 search-sec position-relative">
												<input class="form-control w-400" type="text"
													onkeydown="enterToSearch(event)" placeholder="Search"
													id="quickFilter" autocomplete="off">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												<button class="btn go-btn" type="button" onclick="reset()">Reset</button>
											</div>
										
									
					

					</div>
					<div id="myGrid" class="ag-theme-alpine"></div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
