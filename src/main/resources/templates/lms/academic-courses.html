<head>
<link

<style type="text/css">
.ag-theme-alpine {

}

.bg-active-badge {
	background-color: rgb(236, 253, 243);

	font-weight: 500;
	color: rgb(6, 118, 71);
	line-height: 16px;
	padding: 0px 8px;
	border-style: solid;

.selected span {

.bg-close {

 .multi-select-dropdown {

<script type="text/javascript"
	src="https://cdn.ckeditor.com/4.16.0/standard/ckeditor.js"></script>

<script type="text/javascript">
$(document).ready(function () {
    CKEDITOR.replace('courseDesc', {
        height: 150,
        removePlugins: 'wsc',
        scayt_autoStartup: true,
        scayt_maxSuggestions: 3,
        autoParagraph: false,
    });

    var dateFormat = localStorage.getItem("dateFormat");
    $("#toDateCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
    }).on("change", function () {
        $('#startDate').val($(this).val());
    });

    $('#startDate').blur(function () {
        $("#toDateCalendar").val($(this).val());
    });

    $("#toDateCalendar1").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
    }).on("change", function () {
        $('#endDate').val($(this).val());
    });

    $('#endDate').blur(function () {
        $("#toDateCalendar1").val($(this).val());
    });

    var gridDivm = document.querySelector('#orgGRid');
    new agGrid.Grid(gridDivm, gridOptionsCourse);
    gridOptionsCourse.api.setRowData([]);

    getCourseDetails();

    $("#courseForm :input").prop("disabled", true);

    // Initialize price type handling
    togglePriceFields();
    $('#priceType').on('change', togglePriceFields);
});

var columnDefsCourse = [{
    headerCheckboxSelection: true,
    headerCheckboxSelectionFilteredOnly: true,
    checkboxSelection: true,
    width: 10,
    sortable: false,
    filter: false,
    resizable: true,
    pinned: 'left',
}, {
    headerName: "Course ID",
    field: "courseId",
    hide: true
}, {
    headerName: "Course Title",
    field: "courseTittle",
    width: 310,
    cellRenderer: function(params) {
        const jobTitle = params.data.jobTitle;
        const name = params.value || '';
        const createdOn = params.data.createdOn || '';

        let createdDate;
        if (createdOn) {
            const [day, month, year] = createdOn.split('-').map(Number);
            createdDate = new Date(year, month - 1, day);
        }

        const today = new Date();
        const timeDiff = createdDate ? today - createdDate : 0;
        const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

        let badgeText = '';
        let badgeStyle = '';
        let openBadge = '';

        if (!createdOn || isNaN(daysDiff)) {
            return `
                <div style="display: flex; align-items: center; height: 100%; gap: 5px;">
                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis;">${name}</span>
                    ${openBadge}
                </div>
            `;
        }

        if (daysDiff === 0) {
            badgeText = 'New';
            badgeStyle = `
                background: rgba(52, 168, 83, 0.2);
                color: #34a853;
                font-size: 10px;
                font-weight: 600;
                padding: 2px 6px 0px 7px;
                border-radius: 10px;
                display: inline-flex;
                align-items: center;
                backdrop-filter: blur(2px);
                white-space: nowrap;
                line-height: 17px;
            `;
        } else if (daysDiff >= 1 && daysDiff <= 6) {
            badgeText = daysDiff === 1 ? '1 day ago' : `${daysDiff} days ago`;
            badgeStyle = `
                background: rgba(255, 165, 0, 0.2);
                color: #ff8c00;
                font-size: 10px;
                font-weight: 600;
                padding: 2px 6px 0px 7px;
                border-radius: 10px;
                display: inline-flex;
                align-items: center;
                backdrop-filter: blur(2px);
                white-space: nowrap;
                line-height: 17px;
            `;
        } else if (daysDiff >= 7 && daysDiff <= 20) {
            if (daysDiff === 7) {
                badgeText = '1 week ago';
            } else if (daysDiff === 14) {
                badgeText = '2 weeks ago';
            } else {
                badgeText = `${daysDiff} days ago`;
            }
            badgeStyle = `
                background: rgba(255, 165, 0, 0.2);
                color: #ff8c00;
                font-size: 10px;
                font-weight: 600;
                padding: 2px 6px 0px 7px;
                border-radius: 10px;
                display: inline-flex;
                align-items: center;
                backdrop-filter: blur(2px);
                white-space: nowrap;
                line-height: 17px;
            `;
        } else if (daysDiff >= 30) {
            badgeText = `${daysDiff} days Old`;
            badgeStyle = `
                background: rgba(128, 128, 128, 0.2);
                color: #666;
                font-size: 10px;
                font-weight: 600;
                padding: 2px 6px 0px 7px;
                border-radius: 10px;
                display: inline-flex;
                align-items: center;
                backdrop-filter: blur(2px);
                white-space: nowrap;
                line-height: 17px;
            `;
        } else {
            badgeText = `${daysDiff} days ago`;
            badgeStyle = `
                background: rgba(255, 165, 0, 0.2);
                color: #ff8c00;
                font-size: 10px;
                font-weight: 600;
                padding: 2px 6px 0px 7px;
                border-radius: 10px;
                display: inline-flex;
                align-items: center;
                backdrop-filter: blur(2px);
                white-space: nowrap;
                line-height: 17px;
            `;
        }

        return `
            <div style="display: flex; align-items: center; height: 100%; gap: 5px;">
                <span style="flex: 1; overflow: hidden; text-overflow: ellipsis;">${name}</span>
                ${badgeText ? `<span style="${badgeStyle}">${badgeText}</span>` : ''}
            </div>
        `;
    },
}, {
    headerName: "Status",
    field: "status",
    width: 110,
    cellRenderer: function(params) {
        const status = params.value?.toLowerCase();
        if (status === "active") {
            return '<span class="badge bg-active-badge" style="width: 70px; display: inline-block; text-align: center;">Active</span>';
        } else if (status === "inactive") {
            return '<span class="badge bg-close" style="width: 70px; display: inline-block; text-align: center;">Inactive</span>';
        } else {
            return `<span class="badge bg-secondary" style="width: 70px; display: inline-block; text-align: center;">${params.value}</span>`;
        }
    }
}, {
    headerName: "Level",
    field: "courselevel",
    width: 150,
    cellRenderer: function(params) {
        const level = params.value?.toLowerCase();
        let badgeStyle = "";

        switch (level) {
            case "beginner":
                badgeStyle = "background-color: rgba(236, 253, 243, 0.2); color: rgb(6, 118, 71); border-color: rgb(171, 239, 198);";
                break;
            case "intermediate":
                badgeStyle = "background-color: rgba(255, 243, 205, 0.2); color: rgb(133, 100, 4); border-color: rgb(255, 230, 156);";
                break;
            case "advanced":
                badgeStyle = "background-color: rgba(253, 236, 234, 0.2); color: rgb(153, 27, 27); border-color: rgb(254, 202, 202);";
                break;
            default:
                badgeStyle = "background-color: rgba(243, 244, 246, 0.2); color: rgb(55, 65, 81); border-color: rgb(209, 213, 219);";
        }

        const label = params.value 
            ? params.value.charAt(0).toUpperCase() + params.value.slice(1).toLowerCase()
            : "Unknown";

        return `<span style="display: inline-block;
                            font-size: 10px;
                            font-weight: 500;
                            line-height: 16px;
                            padding: 0px 8px;
                            border-style: solid;
                            border-width: 1px;
                            border-radius: 10px;
                            display: inline-block;
                            text-align: center;
                            width:70px;
                            opacity: 1;
                            ${badgeStyle}">
                        ${label}
                </span>`;
    }
}, {
    headerName: "Category",
    field: "parentCategory",
}, {
    headerName: "Category",
    field: "parentCategoryId",
    hide: "true"
}, {
    headerName: "Duration",
    field: "duration"
}, {
    headerName: "Start Date",
    field: "startDate",
    width: 110,
}, {
    headerName: "End Date",
    field: "endDate"
}, {
    headerName: "Status",
    field: "statusId",
    hide: "true"
}, {
    headerName: "Created On",
    field: "createdOn",
}, {
    headerName: 'Course Image',
    field: "documentURL",
    cellStyle: {
        textAlign: 'center'
    },
    cellRenderer: function (params) {
        if (params.data.documentURL) {
            return '<a onclick=openImage("' + window.btoa(params.data.documentURL) +
                '") href="javascript:void(0)"><i class="bi bi-file-earmark-medical"> View</i></a>';
        } else {
            return "Not Available"
        }
    }
}];

var gridOptionsCourse = {
    columnDefs: columnDefsCourse,
    rowSelection: 'single',
    suppressRowClickSelection: true,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 185,
        height: 10
    },
    pagination: true,
    paginationPageSize: 15,
    onGridReady: function (params) {
        window.gridApi = params.api;
        window.gridOptionsCourse = params.api;
        getCourseDetails();
    },
    onSelectionChanged: onSelectionChanged,
};

var courseId = "";
let selectedEmployeeIds = [];
let employeeData = [];

function onSelectionChanged() {
    var selectedNodes = window.gridApi.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    courseId = selectedData.map(node => node.courseId);
    $("#courseId").val(courseId);
    employeeList = selectedData.map(node => node.employeeList);
    var selectedRows = window.gridApi.getSelectedRows();
    var rowCount = 0;
    selectedRows.forEach(function (i) {
        rowCount = rowCount + 1;
    });
    if (selectedRows.length > 0) {
        courseId = selectedRows[0].courseId;
        editCourseDetails(courseId);
        getAllEmployeeDetails(employeeList);
    } else {
        $("#courseId").val('');
        $("#courseTittle").val('');
        $("#parentCategory").val('');
        $("#duration").val('');
        $("#price").val('');
        $("#startDate").val('');
        $("#endDate").val('');
        $("#patientStatus").val('');
        $("#courseDesc").val('');
        $("#priceType").val('B2C');
        $("#currencySymbol").val('₹');
        $("#customers").val('');
        togglePriceFields();
    }
    courseId = '';
}

function renderInstructorCards(employeeData, preSelectedIds = [], searchQuery = '') {
    const container = document.getElementById('instructorCards');
    container.innerHTML = '';

    const filteredData = employeeData.filter(employee => {
        const name = (employee.firstName || '').toLowerCase();
        const email = (employee.personalMail || '').toLowerCase();
        const id = (employee.employeeId || '').toLowerCase();
        const query = searchQuery.toLowerCase();
        return name.includes(query) || email.includes(query) || id.includes(query);
    });

    filteredData.forEach(employee => {
        const isSelected = preSelectedIds.includes(employee.employeeId);
        const initial = employee.firstName ? employee.firstName.charAt(0).toUpperCase() : 'U';
        const fullName = employee.firstName || 'Unknown';
        const fullEmail = employee.personalMail || 'No email';
        const truncatedName = fullName.length > 10 ? 
            (fullName.charAt(0).toUpperCase() + fullName.slice(1).toLowerCase()).substring(0, 10) + '...' : 
            (fullName.charAt(0).toUpperCase() + fullName.slice(1).toLowerCase());
        const truncatedEmail = fullEmail.length > 15 ? fullEmail.substring(0, 15) + '...' : fullEmail;

        const card = document.createElement('div');
        card.className = `instructor-card ${isSelected ? 'selected' : ''}`;
        card.dataset.employeeId = employee.employeeId;

        card.innerHTML = `
            <div class="avatar">${initial}</div>
            <div class="details">
                <h3 title="${fullName}">${truncatedName}</h3>
                <p title="${fullEmail}">${truncatedEmail}</p>
                <p class="d-none">ID: ${employee.employeeId || 'N/A'}</p>
                <p><span class="badge bg-role-badge" style="width: 70px; display: inline-block; text-align: center;">${employee.role}</span></p>
            </div>
        `;

        card.addEventListener('click', () => {
            const index = selectedEmployeeIds.indexOf(employee.employeeId);
            if (index === -1) {
                selectedEmployeeIds.push(employee.employeeId);
                card.classList.add('selected');
            } else {
                selectedEmployeeIds.splice(index, 1);
                card.classList.remove('selected');
            }
            onSelectionChangedEmployee();
        });

        if (isSelected) {
            card.classList.add('selected');
        }

        container.appendChild(card);
    });
}

function filterInstructors() {
    const searchQuery = document.getElementById('instructorSearch').value;
    renderInstructorCards(employeeData, selectedEmployeeIds, searchQuery);
}

function clearSearch() {
    document.getElementById('instructorSearch').value = '';
    renderInstructorCards(employeeData, selectedEmployeeIds, '');
}

function onSelectionChangedEmployee() {
    const selectedData = employeeData.filter(emp => selectedEmployeeIds.includes(emp.employeeId));
    console.log('Selected Employees:', selectedData);
}

function nextBtnFunction(tablink) {
    const tabElement = document.querySelector(`a.nav-link[href="#${tablink}"]`);
    if (tabElement) {
        const tabTrigger = new bootstrap.Tab(tabElement);
        tabTrigger.show();
    }
}

function togglePriceFields() {
    const priceType = $('#priceType').val();
    const priceContainer = $('#priceContainer');
    const customersContainer = $('#customersContainer');
    
    if (priceType === 'B2B') {
        priceContainer.show();
        customersContainer.show();
    } else {
        priceContainer.show();
        customersContainer.hide();
        $('#customers').val(''); // Clear customer selection
    }
}

function masterSaveCourse() {
    var valid = true;

    CKEDITOR.instances.courseDesc.updateElement();
    var courseDesc = CKEDITOR.instances.courseDesc.getData();
    console.log("CKEditor data:", courseDesc);

    var hours = $("#durationHours").val();
    var minutes = $("#durationMinutes").val();

    if (!hours && !minutes) {
        toastr.error("Duration (Hours or Minutes) Required");
        return;
    }

    hours = parseInt(hours) || 0;
    minutes = parseInt(minutes) || 0;

    if (hours < 0 || minutes < 0 || minutes > 59) {
        toastr.error("Invalid Duration: Hours must be non-negative, and Minutes must be between 0 and 59");
        return;
    }

    var duration = "";
    if (hours > 0) {
        duration += hours + "h";
    }
    if (minutes > 0) {
        duration += (hours > 0 ? " " : "") + minutes + "m";
    }
    if (!duration) {
        duration = "0h";
    }

    var formData = new FormData();
    formData.append('courseId', $("#courseId").val());
    formData.append('courseTittle', $("#courseTittle").val());
    formData.append('parentCategory', $("#parentCategory").val());
    formData.append('duration', duration);
    formData.append('price', $("#price").val());
    formData.append('startDate', $("#startDate").val());
    formData.append('endDate', $("#endDate").val());
    formData.append('patientStatus', $("#patientStatus").val());
    formData.append('courseDesc', $("#courseDesc").val());
    formData.append('rate', $("#rate").val());
    formData.append('currencySymbol', $("#currencySymbol").val());
    formData.append('level', $("#level").val());
    formData.append('priceType', $("#priceType").val());
    
    // Append selected customers for B2B
    if ($("#priceType").val() === 'B2B') {
        const selectedCustomers = $("#customers").val() || [];
        formData.append('customers', JSON.stringify(selectedCustomers));
    }

    var fileInput = $(".wardocument")[0];
    if (fileInput.files.length > 0) {
        formData.append('document', fileInput.files[0]);
    }
    console.log(formData);

    if (!formData.get('courseTittle')?.trim()) {
        toastr.error("Course Title Required");
        return;
    }
    if (!formData.get('parentCategory')?.trim()) {
        toastr.error("Category Required");
        return;
    }
    if (!formData.get('startDate')?.trim()) {
        toastr.error("Start Date Required");
        return;
    }
    if (!formData.get('endDate')?.trim()) {
        toastr.error("End Date Required");
        return;
    }
    if (formData.get('priceType') === 'B2B' && (!formData.get('customers') || JSON.parse(formData.get('customers')).length === 0)) {
        toastr.error("At least one customer must be selected for B2B pricing");
        return;
    }

    if (valid) {
        saveCourse(formData);
    }
}

function saveCourse(formData) {
    $.ajax({
        url: 'academic-course-add',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function (response) {
            toastr.success(response.message);
            getCourseDetails();
            cancel();
        },
        error: function (xhr, status, error) {
            toastr.error('Error saving course');
        }
    });
}

function getCourseDetails() {
    agGrid.simpleHttpRequest({
        url: "academic-course-view"
    }).then(function (response) {
        if (response.message === "Success") {
            const responseBody = JSON.parse(response.body);
            const courseData = responseBody.courseData;
            window.gridApi.setRowData(courseData);
            
            const courseId = $("#courseId").val();
            if (courseId) {
                window.gridApi.forEachNode(function(node) {
                    if (node.data && node.data.courseId === courseId) {
                        node.setSelected(true);
                        return;
                    }
                });
            } else {
                window.gridApi.forEachNode(function(node) {
                    if (courseData && courseData.length > 0) {
                        window.gridApi.forEachNode(function(node) {
                            if (node.rowIndex === 0) {
                                node.setSelected(true);
                            }
                        });
                    }
                });
            }
        } else {
            console.error("Failed to fetch data");
        }
    });
}

function editCourseDetails(courseId) {
    $.ajax({
        type: "GET",
        url: "academic-course-edit?Id=" + courseId,
        async: false,
        success: function (response) {
            if (response.code === "success") {
                const courseDetails = JSON.parse(response.body).courseDetails;
                if (courseDetails == null) {
                    // Handle null case
                } else {
                    $("#courseId").val(courseDetails[0].courseId || "");
                    $("#courseTittle").val(courseDetails[0].courseTittle || "");
                    $("#parentCategory").val(courseDetails[0].parentCategoryId || "");
                    $("#price").val(courseDetails[0].price || "");
                    $("#startDate").val(courseDetails[0].startDate || "");
                    $("#endDate").val(courseDetails[0].endDate || "");
                    $("#patientStatus").val(courseDetails[0].patientStatusId || "");
                    if (CKEDITOR.instances.courseDesc) {
                        CKEDITOR.instances.courseDesc.setData(courseDetails[0].courseDesc || "");
                    } else {
                        console.error("CKEditor instance for 'courseDesc' not found.");
                    }
                    $("#documentURL").val(courseDetails[0].documentURL || "");
                    $("#rate").val(courseDetails[0].rate || "");
                    $("#currencySymbol").val(courseDetails[0].currencySymbol || "");
                    $("#level").val(courseDetails[0].level || "");
                    $("#priceType").val(courseDetails[0].priceType || "B2C");
                    $("#customers").val(courseDetails[0].customers ? JSON.parse(courseDetails[0].customers) : "");

                    var duration = courseDetails[0].duration || "";
                    var hours = 0;
                    var minutes = 0;
                    if (duration) {
                        var parts = duration.split(" ");
                        for (var part of parts) {
                            if (part.endsWith("h")) {
                                hours = parseInt(part.replace("h", "")) || 0;
                            } else if (part.endsWith("m")) {
                                minutes = parseInt(part.replace("m", "")) || 0;
                            }
                        }
                    }
                    $("#durationHours").val(hours);
                    $("#durationMinutes").val(minutes);
                    togglePriceFields();
                }
            }
        },
        error: function (error) {
            console.error("Error fetching patient details:", error);
        }
    });
}

function saveFile() {
    var uFile = $("#uploadWarDoc_0")[0].files[0];

    var lastIndex = fileName.lastIndexOf("\\");
    if (lastIndex >= 0) {
        fileName = fileName.substring(lastIndex + 1);
    }
    var extension = fileName.split(".");
    var iURL = URL.createObjectURL(uFile);
    $("#uploadedWarrDiv_0").html("");

    let docIcon;
    if (extension[1] == "pdf") {
        docIcon = '<i class="bi bi-file-pdf pdf"></i>';
    } else {
        docIcon = '<i class="bi bi-image img-attach" ></i>';
    }

    $("#uploadedWarrDiv_0").html('<a href="' + iURL + '" target="_blank">' + docIcon + '</a>');
    $("#imageWarrName_0").html(fileName);
    $("#imageRemoveBtn_0").html('<i style="color: red; cursor: pointer;" class="bi bi-x-lg" onclick="clearFileUploadFields();">');
    var fileData = new FormData();
    fileData.append('file', uFile);
    fileData.append('path', 'none');
    $("#imageWarrName_0").removeAttr("onclick").attr("onclick", "openImage('" + window.btoa(iURL) + "')");

function getAllEmployeeDetails(employeeList) {

document.addEventListener('DOMContentLoaded', function() {
    // Multi-select dropdown functionality for B2B customers
    const customerSearch = document.getElementById('customer-search');
    const customerOptions = document.getElementById('customer-options');
    const selectedCustomersContainer = document.getElementById('selected-customers');
    
    // Sample customer data - in a real app, this might come from an API
    const customers = [
    { id: 1, name: "Bayanihan Trading Co." },
    { id: 2, name: "Mabuhay Enterprises" },
    { id: 3, name: "Tagalog Solutions Inc." },
    { id: 4, name: "Lakambini Holdings" },
    { id: 5, name: "Maynila Ventures" },
    { id: 6, name: "Makabayan Group" },
    { id: 7, name: "Sampaguita Logistics" },
    { id: 8, name: "Malaya Innovations" }
];

    
    let selectedCustomers = [];
    
    // Render customer options
    function renderCustomerOptions(filter = '') {
        customerOptions.innerHTML = '';
        
        const filteredCustomers = customers.filter(customer => 
            customer.name.toLowerCase().includes(filter.toLowerCase())
        );
        
        filteredCustomers.forEach(customer => {
            const option = document.createElement('div');
            option.className = 'dropdown-option';
            if (selectedCustomers.some(c => c.id === customer.id)) {
                option.classList.add('selected');
            }
            option.textContent = customer.name;
            option.dataset.id = customer.id;
            option.dataset.name = customer.name;
            
            option.addEventListener('click', function() {
                const customerId = parseInt(this.dataset.id);
                const customerName = this.dataset.name;
                
                // Toggle selection
                const index = selectedCustomers.findIndex(c => c.id === customerId);
                if (index === -1) {
                    selectedCustomers.push({ id: customerId, name: customerName });
                } else {
                    selectedCustomers.splice(index, 1);
                }
                
                renderSelectedCustomers();
                renderCustomerOptions(customerSearch.value);
            });
            
            customerOptions.appendChild(option);
        });
    }
    
    // Render selected customers
    function renderSelectedCustomers() {
        selectedCustomersContainer.innerHTML = '';
        
        selectedCustomers.forEach(customer => {
            const tag = document.createElement('div');
            tag.className = 'selected-option';
            tag.innerHTML = `
                ${customer.name}
                <button type="button" data-id="${customer.id}">&times;</button>
            `;
            
            tag.querySelector('button').addEventListener('click', function(e) {
                e.stopPropagation();
                const customerId = parseInt(this.dataset.id);
                selectedCustomers = selectedCustomers.filter(c => c.id !== customerId);
                renderSelectedCustomers();
                renderCustomerOptions(customerSearch.value);
            });
            
            selectedCustomersContainer.appendChild(tag);
        });
    }
    
    // Event listeners for dropdown
    customerSearch.addEventListener('focus', function() {
        customerOptions.classList.add('show');
        renderCustomerOptions();
    });
    
    customerSearch.addEventListener('input', function() {
        renderCustomerOptions(this.value);
    });
    
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.multi-select-dropdown')) {
            customerOptions.classList.remove('show');
        }
    });
    
    // Initialize
    renderCustomerOptions();
});
</script>

																class="text-lg font-semibold text-gray-700 mb-2 flex items-center text-primary">
																Course Materials</h5>
															<div class="col-md-12  form-group">
																<label for="courseDesc" class="mb-2">Course
																	Description</label>
																<textarea id="courseDesc" class="form-control"></textarea>
															</div>
														</div>
														<div class="col-md-4" id="attachWar">
															<div class="form-group">
																<label for="uploadWarDoc_0" class="form-label">Document</label>
																<div class="control-group position-r">
																	<label
																		class="custom-file-upload btn go-btn h-auto mr-2"
																		for="uploadWarDoc_0"> <i class="ti-plus"></i>
																	</label>
																	<div class="controls">
																		<input type="file" class="wardocument"
																			id="uploadWarDoc_0" accept=".jpeg, .jpg, .png, .pdf"
																			name="userImage" onchange="saveFile(event)">
																	</div>
																</div>
																<input type="hidden" id="uploadHidden_0"
																	class="uploadHidCls">
																<div class="d-flex align-items-center gap-2 my-1">
																	<div id="uploadedWarrDiv_0" align="center"
																		class="uploadedWarrCls"></div>
																	<div id="imageWarrName_0" class="imageName"
																		onClick="viewDoc(this)"></div>
																	<div id="imageRemoveBtn_0"
																		class="imageRemove img-remove"></div>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
										<div id="examination" class="tab-pane fade hidden p-2 h-100">
											<div class="requisition-tbl d-flex flex-column h-100 gap-2">
												<div class="">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="80%"><strong id="programNameDisplay"></strong></td>
																<td>
																	<div class="d-flex justify-content-end gap-2">
																		<div class="mr-0">
																			<button id="prev" class="btn m-0 edit-btn"
																				onclick="prev()" type="button">Prev</button>
																		</div>
																		<div class="mr-0">
																			<button id="assign" class="btn edit-btn"
																				onclick="masterAssign()" type="button">Assign</button>
																		</div>
																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<div class="row form-top" id="examination">
														<div class="mb-3">
															<div class="relative">
																<label>All Instructor</label> <input type="text"
																	id="instructorSearch"
																	class="form-control w-full mt-2 pl-10 pr-10 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
																	placeholder="Search instructors..."
																	onkeyup="filterInstructors()">
															</div>
														</div>
														<div
															class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
															id="instructorCards">
															<!-- Instructor cards will be dynamically inserted here -->
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
