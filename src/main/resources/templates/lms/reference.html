            onSelectionChanged: onSelectionChanged

        $(document).ready(() => {
            var gridDiv1 = document.querySelector('#myGrid1');
            new agGrid.Grid(gridDiv1, gridOptions1);
            $('.ag-center-cols-container').addClass('nav');
            getReferenceData();
            // Automatically select the first row
            gridOptions1.api.forEachNode((node, index) => {
                if (index === 0) {
                    node.setSelected(true);
                    onRowClicked({ data: node.data });
                }
            });
        });

        function getReferenceData() {
            gridOptions1.api.setRowData([
                { name: "Lecture Notes" },
                { name: "Class Notes" },
                { name: "Class Videos" },
                { name: "Previous Year Question" },

                { name: "Study Groups" },
                { name: "Faculty Resources" }
            ]);
        }

        function onRowClicked(event) {
            const selectedName = event.data.name;
            // Update current path and content
            currentPath = [selectedName];
            currentContent = contentData[selectedName].contents;
            renderFolderStructure();
        }

        function onSelectionChanged() {
            const selectedNodes = gridOptions1.api.getSelectedNodes();
            if (selectedNodes.length > 0) {
                const selectedName = selectedNodes[0].data.name;
                // Update current path and content
                currentPath = [selectedName];
                currentContent = contentData[selectedName].contents;
                renderFolderStructure();
            }
        }

        function renderFolderStructure() {
            const attendanceDiv = document.getElementById('attendanceDiv');
            let html = '<div class="folder-structure">';

            // Breadcrumb navigation
            html += '<nav class="breadcrumb-nav">';
            html += '<ol class="breadcrumb">';
            html += '<li class="breadcrumb-item"><a href="#" onclick="resetToRoot()">Home</a></li>';
            currentPath.forEach((path, index) => {
                html += `<li class="breadcrumb-item"><a href="#" onclick="navigateToPath(${index})">${path}</a></li>`;
            });
            html += '</ol></nav>';

            // Folder/file items
            Object.keys(currentContent).forEach(item => {
                const isFolder = currentContent[item].type === 'folder';
                const isVideo = currentContent[item].isVideo;
                const icon = isFolder ? 'folder' : (isVideo ? 'file-video' : 'file-pdf');
                html += `
                    <div class="folder-item" onclick="${isFolder ? `navigateToFolder('${item}')` : `viewFile('${item}')`}">
                        <i class="fa-solid fa-${icon}"></i>
                        ${item}
                    </div>
                `;
            });

            html += '</div>';
            attendanceDiv.innerHTML = html;
        }

        function navigateToFolder(folderName) {
            currentPath.push(folderName);
            currentContent = currentContent[folderName].contents;
            // If the folder contains only PDFs, display all of them
            const allFilesArePdfs = Object.keys(currentContent).every(item => 
                currentContent[item].type === 'file' && currentContent[item].isPdf
            );
            if (allFilesArePdfs) {
                displayMultiplePdfs();
            } else {
                renderFolderStructure();
            }
        }

        function viewFile(fileName) {
            const file = currentContent[fileName];
            const attendanceDiv = document.getElementById('attendanceDiv');
            let html = '<div class="folder-structure">';

            // Breadcrumb
            html += '<nav class="breadcrumb-nav">';
            html += '<ol class="breadcrumb">';
            html += '<li class="breadcrumb-item"><a href="#" onclick="resetToRoot()">Home</a></li>';
            currentPath.forEach((path, index) => {
                html += `<li class="breadcrumb-item"><a href="#" onclick="navigateToPath(${index})">${path}</a></li>`;
            });
            html += '</ol></nav>';

            // File content in a flex container
            html += '<div class="file-content-container">';
            html += '<div class="file-content">';
            if (file.isVideo) {
                html += `
                    <p>Video: ${file.content}</p>
                    <iframe class="video-iframe" src="${file.url}" frameborder="0" allowfullscreen></iframe>
                `;
            } else if (file.isPdf) {
                html += `
                    <p>PDF: ${file.content}</p>
                    <embed src="${file.url}" type="application/pdf" class="pdf-viewer">
                    <a href="${file.url}" target="_blank">Download</a>
                `;
            }
            html += '</div>';
            html += '</div>';
            html += '</div>';
            attendanceDiv.innerHTML = html;
        }

        function displayMultiplePdfs() {
            const attendanceDiv = document.getElementById('attendanceDiv');
            let html = '<div class="folder-structure">';

            // Breadcrumb
            html += '<nav class="breadcrumb-nav">';
            html += '<ol class="breadcrumb">';
            html += '<li class="breadcrumb-item"><a href="#" onclick="resetToRoot()">Home</a></li>';
            currentPath.forEach((path, index) => {
                html += `<li class="breadcrumb-item"><a href="#" onclick="navigateToPath(${index})">${path}</a></li>`;
            });
            html += '</ol></nav>';

            // Display all PDFs in a flex container
            html += '<div class="top-container"><div class="file-content-container">';
            Object.keys(currentContent).forEach(fileName => {
                const file = currentContent[fileName];
                html += `
                    <div class="file-content">
                        <p>PDF: ${file.content}</p>
                        <embed src="${file.url}" type="application/pdf" class="pdf-viewer">
                        <a href="${file.url}" target="_blank">Download</a>
                    </div>
                `;
            });
            html += '</div></div>';

            html += '</div>';
            attendanceDiv.innerHTML = html;
        }

        function navigateToPath(index) {
            currentPath = currentPath.slice(0, index + 1);
            currentContent = contentData;
            currentPath.forEach(path => {
                currentContent = currentContent[path].contents;
            });
            renderFolderStructure();
        }

        function resetToRoot() {
            currentPath = [];
            currentContent = contentData;
            document.getElementById('attendanceDiv').innerHTML = '<p>Please select a category from the left panel.</p>';
            // Reselect the first row
            gridOptions1.api.forEachNode((node, index) => {
                if (index === 0) {
                    node.setSelected(true);
                    onRowClicked({ data: node.data });
                }
            });
