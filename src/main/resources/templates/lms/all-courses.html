<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>All Courses</title>
 
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const img = document.querySelector('img[src$="icons8-user.png"]');
      if (img) {
        img.onmouseover = img.onmouseout =
            e => e.target.src = `/assets/icons8-user.${e.type === 'mouseover' ? 'gif' : 'png'}`;
      } else {
        console.error('Image element not found for hover effect');
      }
      getAllProductDetails();
    });
    
    function getAllProductDetails() {
        $.ajax({
            type: "GET",
            url: "get-all-product-details",
            success: function(response) {
                if (response.code == "success") {
                    const productData = JSON.parse(response.body[0]);
                    const products = productData.productDetails;

                    // STEP A: Generate unique categories
                    const categoriesMap = { all: "All" };
                    products.forEach(product => {
                        if (product.categoryId && product.categoryName) {
                            categoriesMap[product.categoryId] = product.categoryName;
                        }
                    });

                    // STEP B: Build category tab headers
                    const $courseTab = $('#courseTab');
                    $courseTab.empty();

                    Object.entries(categoriesMap).forEach(([id, name], index) => {
                        const isActive = index === 0 ? 'active' : '';
                        $courseTab.append(`
                            <li class="nav-item" role="presentation">
                                <button class="nav-link ${isActive}" data-category="${id}" type="button">${name}</button>
                            </li>
                        `);
                    });

                    // STEP C: Render all course cards and save for filtering
                    const $productDiv = $('#productDiv');
                    $productDiv.empty();

                    products.forEach(product => {
                        const courseCard = `
                            <div class="col-md-6 col-lg-4 col-xl-3 course-card-wrapper" data-category="${product.categoryId}">
                                <div class="course-card">
                                    <div class="course-image">
                                        <img src="${product.image || 'https://placehold.co/300x200'}" alt="${product.productName}">
                                        ${product.rating >= 4.5 ? '<div class="course-badge">Bestseller</div>' : ''}
                                      
                                    </div>
                                    <div class="course-content">
                                        <div class="course-category">${product.categoryName}</div>
                                        <h3><a href="#" class="course-title">${product.productName}</a></h3>
                                        <span class="course_content_id d-none">${product.productId}</span>
                                        
                                        <div class="course-meta d-none">
                                            <div class="course-instructor">
                                                <img src="https://thumbs.dreamstime.com/b/generative-ai-young-smiling-man-avatar-man-brown-beard-mustache-hair-wearing-yellow-sweater-sweatshirt-d-vector-people-279560903.jpg"
                                                     alt="Instructor" class="instructor-img">
                                                <span class="course-instructor-name">${product.instructorName || "Instructor"}</span>
                                            </div>
                                            <div class="course-rating">
                                                ${product.rating ? 
                                                    `<i class="fas fa-star"></i> <span>${product.rating}</span> <span>(124)</span>` : 
                                                    '<span>No ratings yet</span>'}
                                            </div>
                                        </div>

                                        
                                        <div class="course-footer">
                                            <div class="course-price d-none">
                                                <span class="current-price">${amountFormatter(product.price, product.currencyType)}</span>
                                                ${product.originalPrice ? `<span class="original-price">$${product.originalPrice}</span>` : ''}
                                            </div>
                                         
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        $productDiv.append(courseCard);
                    });

                    // STEP D: Tab click filtering
                    $('#courseTab').on('click', 'button', function () {
                        const selectedCategory = $(this).data('category');

                        $('#courseTab .nav-link').removeClass('active');
                        $(this).addClass('active');

                        $('.course-card-wrapper').each(function () {
                            const cardCategory = $(this).data('category');
                            if (selectedCategory === 'all' || selectedCategory === cardCategory) {
                                $(this).show();
                            } else {
                                $(this).hide();
                            }
                        });
                    });
                    restoreWishlistUI();
                }
            },
            error: function(xhr, status, error) {
                console.error("Error fetching product details:", error);
            }
        });
    }
    
    function amountFormatter(value, currencyType = '₹') {
	    if (value !== null && value !== undefined) {
	        const num = Number(value).toFixed(2);
	        const parts = num.split('.');
	        const integerPart = parts[0];
	        const decimalPart = '.' + parts[1];

	        const formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);

	        return `${currencyType}${formattedIntegerPart}${decimalPart}`;
	    } else {
	        return `${currencyType}0.00`;
	    }
	}
    
	function restoreWishlistUI() {
		const savedWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
	
		$('.course-card-wrapper').each(function() {
			const productId = $(this).find('.course_content_id').text().trim();
			const isInWishlist = savedWishlist.some(item => item.productId.trim() === productId);
			const $icon = $(this).find('.wishlist-btn i');
	
			if (isInWishlist) {
				$icon.removeClass('far').addClass('fas');
			} else {
				$icon.removeClass('fas').addClass('far');
			}
		});
	
		$('.wishList-count, .wishlist-count, .wishlist-item-count').text(savedWishlist.length);
	}
  </script>
</head>
<body>
 <div th:replace="lms/lms-navbar :: lms-nav"></div>
  <!-- Popular Courses Section -->
 <section  class="py-5 bg-about">
        <div class="section-header text-center mb-0">
				<span class="section-subtitle">Our Courses</span>
				<h2 class="section-title text-white">All Courses</h2>
				<p class="section-description text-white">Start learning with our most
					popular courses taught by industry experts</p>
			</div>
</section>

   <section id="courses" class="courses-section py-5 bg-light">
		<div class="container">
			

			<div class="row">
				<div class="col-12">
					<ul class="nav nav-pills course-tabs mb-4 justify-content-center"
						id="courseTab" role="tablist">
						<!-- Dynamic category buttons will be inserted here -->
					</ul>
				</div>
			</div>

			<div class="tab-content" id="courseTabContent">
				<div class="tab-pane fade show active" id="all" role="tabpanel">
					<div class="row g-4" id="productDiv">
					</div>
				</div>

				<!-- Other tabs would go here -->
			</div>

		</div>
	</section>
  
   <div th:replace="lms/lms-footer :: lms-footer"></div>
  
</body>
</html>
