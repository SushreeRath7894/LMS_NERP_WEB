function setDocumentData(documentData) {
	const tbody = document.querySelector("#documentsTable tbody");
	tbody.innerHTML = '';

	if (Array.isArray(documentData) && documentData.length > 0) {
		documentData.forEach((doc, index) => {
			const row = document.createElement('tr');

			row.innerHTML = `
	      <td>
	        <select class="form-select document-select" name="document_name[]" required>
			<option value="10th Mark Sheet" ${doc.name === "10th Mark Sheet" ? 'selected' : ''}>Class 10th Mark Sheet</option>
			          <option value="12th Mark Sheet" ${doc.name === "12th Mark Sheet" ? 'selected' : ''}>Class 12th Mark Sheet</option>
			          <option value="Graduation Degree Certificate" ${doc.name === "Graduation Degree Certificate" ? 'selected' : ''}>Graduation Degree Certificate</option>
			          <option value="Post Graduation Certificate" ${doc.name === "Post Graduation Certificate" ? 'selected' : ''}>Post Graduation Certificate</option>
			          <option value="Diploma Certificate" ${doc.name === "Diploma Certificate" ? 'selected' : ''}>Diploma Certificate</option>
	        </select>
	      </td>
	      <td>
	        <textarea class="document-description form-control" name="document_description[]" rows="1" placeholder="Enter description">${doc.description || ''}</textarea>
	      </td>
	      <td class="text-center">
	        <!-- Optional delete button -->
	      </td>
	    `;
			tbody.appendChild(row);
		});
	} else {

		const staticRow = document.createElement('tr');
		staticRow.innerHTML = `
	    <td>
	      <select class="form-select document-select" name="document_name[]" required>

		  <option value="10th Mark Sheet">Class 10th Mark Sheet</option>

	    </td>
	    <td class="text-center">
	      <!-- Optional delete button -->
	    </td>
	  `;
		tbody.appendChild(staticRow);
	}

}

function saveApllication() {


	var applicationData = {};



	applicationData['applicationId'] = $("#applicationId").val();
	applicationData['programName'] = $("#programName").val();
	applicationData['specialisation'] = $("#specialisation").val();
	applicationData['duration'] = $("#duration").val();
	applicationData['intakeCapacity'] = $("#intakeCapacity").val();
	applicationData['totalFee'] = $("#totalFee").val();
	applicationData['applicationFee'] = $("#applicationFee").val();
	applicationData['programDesc'] = $("#programDesc").val();
	applicationData['applicationSD'] = $("#applicationSD").val();
	applicationData['applicationED'] = $("#applicationED").val();
	applicationData['eligibility'] = $("#eligibility").val();
	applicationData['format'] = $("#format").val();
	applicationData['country'] = $("#country").val();
	applicationData['states'] = $("#states").val();
	applicationData['district'] = $("#district").val();
	applicationData['cityId'] = $("#cityId").val();
	applicationData['applicationSummary'] = CKEDITOR.instances.applicationSummary.getData();



	let applicationDocuments = [];

	$('tr').each(function() {
		const $row = $(this);

		const doc = $row.find('.document-select').val();
		const description = $row.find('.document-description').val();

		if (doc) {
			applicationDocuments.push({
				name: doc,
				description: description || ''
			});
		}
	});

	applicationData['documentDtls'] = applicationDocuments;





	applicationData['programImage'] = $("#programImage").val();

	saveApllicationData(applicationData);

}

function saveApllicationData(applicationData) {
	console.log("data is coming for save============> ", applicationData);
	$('.loader').show();
	$.ajax({
		type: "POST",
		url: "save-application-details",
		contentType: "application/json",
		data: JSON.stringify(applicationData),
		success: function(response) {
			if (response.code == "Success") {
				$('.loader').hide();
				toastr.success(response.message);
				getApplicationDetails();
				addApplication();
			} else {
				toastr.error(response.message);
				$('.loader').hide();
			}
			$(".br-dis").attr("disabled", true);
		},
		error: function(datas) {
			console.log(datas);
		}
	});

}


function deleteApplication() {
	var selectedRows = gridOptions.api.getSelectedRows();
	var id = selectedRows[0].applicationId;
	agGrid.simpleHttpRequest({
		url: "application-delete?id=" + id,
	}).then(function(response) {
		if (response.code == "success") {
			toastr.success("Application Delete Successfully");
			getApplicationDetails();

		}

	});
}

function getApplicationDetails() {

	
	agGrid.simpleHttpRequest({
		url: "application-view"
	}).then(function(response) {
		var jsonData = JSON.parse(response.body);
		var allData = jsonData.applicationDetails;
		gridOptions.api.setRowData(allData);

		var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0);
		if (firstRowNode) {
			firstRowNode.setSelected(true);
		}

	});
}

function base64UrlEncode(str) {
	return btoa(str)
		.replace(/\+/g, '-')
		.replace(/\//g, '_')
		.replace(/=+$/, '');
}

function fetchApplicationUrl(applicationId) {

}


function setApplicationData(allData) {

	console.log("The Data To Set BISWAJIT --->>>", allData);

	$("#applicationId").val(allData.applicationId)
	$("#programName").val(allData.programName)
	$("#specialisation").val(allData.specialisation)
	$("#duration").val(allData.duration);
	$("#intakeCapacity").val(allData.intakeCapacity)
	$("#totalFee").val(allData.totalFee);
	$("#applicationFee").val(allData.applicationFee)
	$("#programDesc").val(allData.programDesc)
	$("#applicationSD").val(allData.applicationSD)
	$("#applicationED").val(allData.applicationED)
	$("#eligibility").val(allData.eligibility)
	$("#programImage").val(allData.programImage)
	$("#format").val(allData.format)
	CKEDITOR.instances.applicationSummary.setData(allData.applicationSummary);    //Set The Summary To The Field
	$("#country").val(allData.country);
					
					getStateDetails(allData.state);
					setTimeout(function() {
						getDistrictDetails(allData.district);
					}, 2000);
					setTimeout(function() {	
						getCityDetails(allData.city);
					}, 3000);


	//Set The Required Documents
	let parsedDocs = [];

	try {
		if (typeof allData.requireDocs === 'string') {
			parsedDocs = JSON.parse(allData.requireDocs);
		}
	} catch (err) {
		console.error("Failed to parse requireDocs:", err);
	}

	if (Array.isArray(parsedDocs)) {
		/*console.log("Parsed documents:", parsedDocs)*/;
		setDocumentData(parsedDocs);
	} else {
		console.warn("Parsed result is not an array");
	}




}

function handleFileChange() {
	const input = document.getElementById('programImage');
	const feedback = document.getElementById('fileFeedback');
	const fileNameText = document.getElementById('fileName');

	if (input.files.length > 0) {
		const fileName = input.files[0].name;
		feedback.style.display = 'block';
		fileNameText.textContent = `📄 ${fileName}`;
	} else {
		feedback.style.display = 'none';
		fileNameText.textContent = 'Upload a high-quality image (JPG, PNG, or WEBP). Max size: 5MB.';
	}
}

//Get States -->>>

function getStateDetails(id) {

	/*alert(id);*/
		
	var cname = $('#country').val();
	if (cname) {
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
		$.ajax({
			type: "GET",
			url: "application-stateList?id=" + cname,
			success: function(response) {
				
				if (response.message == "success") {
					$("#states").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#states").append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].key);
						$(option).html(response.body[i].name);
						$("#states").append(option);
					}
					if (id == "0") {

					} else {
						$("#states").val(id);
					}
				}
			},
			error: function(e) { }
		});
	} else {
		$("#states").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
		$("#states").append(option);
		$("#states").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
	}
}

	} else {

	}

		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
		$.ajax({
			type: "GET",
			url: "application-districtList?id=" + state,
			success: function(response) {
				if (response.message == "success") {
					$("#district").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#district").append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].key);
						$(option).html(response.body[i].name);
						$("#district").append(option);
					}
					if (id == "0") {
					} else {
						$("#district").val(id);
					}
				}
			},
			error: function(e) { }
		});
	} else {
		$("#district").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
		$("#district").append(option);
		$("#district").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");

	}
}


//Get City Details
function getCityDetails(cityId) {
	let dist = $('#district').val();


	if (dist) {
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
		$.ajax({
			type: "GET",
			url: "application-city-list?id=" + dist,
			success: function(response) {
				if (response.message == "success") {
					$("#cityId").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#cityId").append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].key);
						$(option).html(response.body[i].name);
						$("#cityId").append(option);
					}
					if (cityId) {
						$("#cityId").val(cityId);
					}
				}
			},
			error: function(e) { }
		});
	} else {
		$("#cityId").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
		$("#cityId").append(option);
		$("#cityId").empty();
		var option = $("<option></option>");
		$(option).val(null);
		$(option).html("Select");
	}
}

																</select>
															</div>

															<div class="col-md-12">
																<label class="form-label">Program Name <span
																	class="mandatory">*</span></label> <input type="text"
																	class="form-control" id="programName">
															</div>


															<div class="col-md-6">
																<label class="form-label">Intake Capacity <span
																	class="mandatory">*</span></label> <input type="number"
																	class="form-control" id="intakeCapacity">
															</div>

															<div class="col-md-6">
																<label class="form-label">Program Fees (₹) <span
																	class="mandatory">*</span></label> <input type="text"
																	class="form-control" id="totalFee">
															</div>

															<div class="col-md-6">
																<label class="form-label">Application Fee (₹) <span
																	class="mandatory">*</span></label> <input type="text"
																	class="form-control" id="applicationFee">
															</div>

															<div class="col-md-6">
																<label class="form-label">Choose Format <span
																	class="mandatory">*</span></label> <select class="form-select"
																	id="format">
																	<option>Select Duration</option>
																	<option>Part Time</option>
																	<option>Full Time</option>
																	<option>Hybrid</option>
																</select>
															</div>

															<div class="col-md-12">
																<label class="form-label fw-semibold">Program
																	Description <span class="text-danger">*</span>
																</label>
																<textarea class="form-control" id="programDesc" rows="4"></textarea>
															</div>

															<div class="col-md-6">
																<label>Country <span class="mandatory">*</span></label>
																<select id="country" class="form-select"
																	onchange="getStateDetails('0')"
																	onblur="removeValid(event)">
																	<option th:value="NULL">Select</option>
																	<option th:each="c,iter:${countryList}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select>
															</div>


															<div class="col-md-6">
																<label>State <span class="mandatory">*</span></label> <select
																	id="states" class="form-select"
																	onchange="getDistrictDetails('0')"
																	onblur="removeValid(event)">
																	<option th:value="NULL">Select</option>
																	<option th:each="c,iter:${statesList}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select> <span class="focus"></span>
															</div>

															<div class="col-md-6">
																<label>District <span class="mandatory">*</span></label>
																<select id="district" class="form-select"
																	onblur="removeValid(event)"
																	onchange="getCityDetails('')">
																	<option th:value="NULL">Select</option>
																	<option th:each="c,iter:${districtList}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select> <span class="focus"></span>
															</div>

															<div class="col-md-6">
																<label>City</label> <span class="mandatory">*</span> <select
																	class="form-select" id="cityId"
																	onblur="removeValid(event)">
																	<option value="">Select</option>
																	<option th:each="c,iter:${cityList}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select>
															</div>


														</div>
													</div>
												</div>
											</div>
										</div>



										<div id="documentsDetails" class="tab-pane fade p-2 h-100">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="80%"><strong></strong><span
																	id="propertyId"></span></td>
																<td>
																	<div class="d-flex justify-content-end gap-1">
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button"
																				onclick="nextBtnFunction('applicationDetailsTab')">PREV</button>
																		</div>
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button"
																				onclick="nextBtnFunction('summaryDetails')">NEXT</button>
																		</div>

																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<!--Inner Start-->

													<div class="row">
														<div class="col-md-6 mb-4">
															<label class="form-label fw-semibold"> Start Date
																<span class="text-danger">*</span>
															</label> <input type="date" class="form-control"
																id="applicationSD">
														</div>

														<div class="col-md-6 mb-4">
															<label class="form-label fw-semibold"> End Date <span
																class="text-danger">*</span>
															</label> <input type="date" class="form-control"
																id="applicationED">
														</div>
													</div>

													<div class="mb-4">
														<label class="form-label fw-semibold">Eligibility
															Criteria <span class="text-danger">*</span>
														</label>
														<textarea class="form-control" id="eligibility" rows="3"></textarea>
													</div>

													<div class="mb-4">
														<label class="form-label fw-semibold d-block mb-2">Required
															Documents <span class="text-danger">*</span>
														</label>
														<button type="button"
															class="btn btn-outline-success btn-sm mb-3"
															id="addMoreBtn">
															<i class="bi bi-plus-circle"></i> Add Document
														</button>
														<p id="docWarning" class="text-danger"
															style="display: none;">Please select at least one
															document before adding another.</p>

														<div class="table-responsive">
															<table class="table table-bordered align-middle"
																id="documentsTable">
																<thead class="table-light">
																	<tr>
																		<th width="30%">Document Name</th>
																		<th width="60%">Description</th>
																		<th width="10%">Action</th>
																	</tr>
																</thead>
																<tbody>
																	<!-- Initial row -->
																	<tr>
																		<td>
																			<!-- Combined Dropdown for Document Type --> <select
																			class="form-select document-select"
																			name="document_name[]" required>
																				<option value="" disabled selected>Select
																					document</option>
																				<option value="10th Mark Sheet">Class 10th
																					Mark Sheet</option>
																				<option value="12th Mark Sheet">Class 12th
																					Mark Sheet</option>
																				<option value="Graduation Degree Certificate">Graduation
																					Degree Certificate</option>
																				<option value="Post Graduation Certificate">Post
																					Graduation Certificate</option>
																				<option value="Diploma Certificate">Diploma
																					Certificate</option>

																		</select>
																		</td>

																		<td><textarea
																				class="document-description form-control"
																				name="document_description[]" rows="1"></textarea></td>

																		<td class="text-center">
																			<!-- Future delete icon -->
																		</td>
																	</tr>

																</tbody>
															</table>
														</div>
													</div>

													<!-- <div class="mb-4">
														<label for="programImage" class="form-label fw-semibold">
															<i class="fas fa-image me-1 text-primary"></i> Program
															Image <span class="text-danger">*</span>
														</label> <input class="form-control" type="file" id="programImage"
															accept="image/*" onchange="handleFileChange()" />

														<div id="fileFeedback" class="mt-2 text-success fw-medium"
															style="display: none;">File selected!</div>

														<div id="fileName" class="form-text text-muted">
															Upload a high-quality image (JPG, PNG, or WEBP). Max
															size: 5MB.</div>
													</div> -->


												</div>


											</div>
										</div>

										<!--Application Summary-->

										<div id="summaryDetails" class="tab-pane fade p-2 h-100">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="80%"><strong></strong><span
																	id="propertyId"></span></td>
																<td>
																	<div class="d-flex justify-content-end gap-1">
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button"
																				onclick="nextBtnFunction('documentsDetails')">PREV</button>
																		</div>

																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="saveApllication()">SAVE</button>
																		</div>

																		<div class="ml-3">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="deleteApplication()">DELETE</button>
																		</div>
																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<!-- Inner Start -->
													<div class="mb-4">
														<label class="form-label fw-semibold"> Application
															Summary <span class="text-danger">*</span>
														</label>
														<textarea class="ckeditor" id="applicationSummary"
															rows="3"></textarea>
													</div>


												</div>


											</div>
										</div>

									</div>

								</div>
							</div>
						</div>
					</div>
					<!--Tabbination 1 End-->

				</div>
			</div>
		</div>
	</div>
</body>
</html>
