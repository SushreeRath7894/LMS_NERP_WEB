        function parseDate(dateStr) {
            if (!dateStr) return null;
            let parts = dateStr.split(' ');
            let datePart = parts[0];
            let timePart = parts.length > 1 ? parts[1].split(':').map(Number) : [0, 0, 0];
            let dateParts = datePart.split('-');
            if (dateParts.length === 3) {
                if (dateParts[0].length === 4) { // YYYY-MM-DD
                    return new Date(dateParts[0], dateParts[1] - 1, dateParts[2], ...timePart);
                } else { // DD-MM-YYYY
                    return new Date(dateParts[2], dateParts[1] - 1, dateParts[0], ...timePart);
                }
            }
            return null;
        }

                    const to = parseDate(rowData.validTo);
                    if (from && to) {
                        const diff = Math.ceil((to - from) / (1000 * 60 * 60 * 24));
                        daysText = diff + " days";
                    } else {
                        daysText = "0 days";
                    }
                }

                        CouponNo: rowData.couponNo,
                        Minimum_Price: rowData.price,
                        Discount: rowData.discount,
                        ValidFrom: rowData.validFrom,
                        ValidTo: rowData.validTo,
                        couponId : rowData.couponId,
                        
                    });
                    
                 

                    var tempContainer = document.createElement("div");
                    new QRCode(tempContainer, {
                        text: qrData,
                        width: 150,
                        height: 150,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    setTimeout(function () {
                        var generatedImg = tempContainer.querySelector('img');
                        if (generatedImg) {
                            qrImg.src = generatedImg.src;
                        }
                    }, 100);
                    qrImg.alt = "QR Code";

                        qrImg.src = docUrl;
                        qrImg.alt = "Document";
                    }

        function saveFile(event) {
            const fileInput = $("#uploadWarDoc_0")[0];
            const uFile = fileInput.files[0];
            if (!uFile) return;

            let fileName = uFile.name;
            const extension = fileName.split(".").pop().toLowerCase();
            const iURL = URL.createObjectURL(uFile);

            // Define valid image extensions
            const imageExtensions = ["jpg", "jpeg", "png", "gif", "bmp"];

            // Clear old preview
            $("#uploadedWarrDiv_0").html("");

            // Check if the file is an image
            if (imageExtensions.includes(extension)) {
                // Load image to check dimensions
                const img = new Image();
                img.src = iURL;

                img.onload = function () {
                    if (img.width !== 1920 || img.height !== 1080) {
                        // Invalid dimensions, show error and reset
                        alert("Image must be 1920x1080 pixels. Please upload a valid image.");
                        clearFileUploadFields();
                        return;
                    }

                    // Valid image dimensions, proceed with preview
                    displayFilePreview(iURL, fileName, extension);
                };

                img.onerror = function () {
                    alert("Failed to load image. Please try another file.");
                    clearFileUploadFields();
                };
            } else {
                // Non-image file (e.g., PDF), proceed without dimension check
                displayFilePreview(iURL, fileName, extension);
            }
        }

            } else {

            }

            // Show icon as clickable preview
            $("#uploadedWarrDiv_0").html('<a href="' + iURL + '" target="_blank">' + docIcon + '</a>');
            $("#imageWarrName_0").text(fileName);

            // Add remove (X) icon
            $("#imageRemoveBtn_0").html(
                '<i class="bi bi-x-lg" style="color:red; cursor:pointer;" onclick="clearFileUploadFields();"></i>'
            );

            // Optionally send file to backend

              .then(res => res.json())

function editCourseDetails(courseId) {
    $.ajax({
        type: "GET",
        url: "academic-course-edit?Id=" + courseId,
        async: false,
        success: function (response) {
            if (response.code === "success") {
                const courseDetails = JSON.parse(response.body);
                
                if (courseDetails == null) {
                    // Handle null case
                } else {
                    console.log('dddddddddddd', courseDetails);
                    
                    // Use direct object properties since courseDetails is an object, not an array
                    $("#courseId").val(courseDetails.courseId || "");
                    $("#courseTittle").val(courseDetails.courseTitle || "");  // Note: Response uses "courseTitle", not "courseTittle"
                    $("#price").val(courseDetails.price || "");  // Assuming "price" exists; add if missing in response
                    $("#startDate").val(courseDetails.startDate || "");
                    $("#endDate").val(courseDetails.endDate || "");
                    $("#patientStatus").val(courseDetails.patientStatusId || "");  // Assuming this exists
                    
                    // FIXED: 'dec' is plain escaped HTML (not base64), so no atob needed - use directly
                    let decodedDesc = courseDetails.dec || courseDetails.courseDesc || "";
                    if (CKEDITOR.instances.courseDesc) {
                        CKEDITOR.instances.courseDesc.setData(decodedDesc);
                    } else {
                        console.error("CKEditor instance for 'courseDesc' not found.");
                    }
                    
                    // Handle document preview
                    if (!courseDetails.documentURL || courseDetails.documentURL === '') {
                        $("#uploadedWarrDiv_0").html("");
                        $("#imageWarrName_0").html("");
                        $("#imageRemoveBtn_0").empty();
                    } else {
                        $("#uploadedWarrDiv_0").html("");
                        var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + courseDetails.documentURL + "' title='" + (courseDetails.fileName || '') + "' target='_blank'><i class='fa fa-file-o' style='color: blue'></i></a></div>";
                        $("#uploadedWarrDiv_0").html(LightImg);
                        $("#imageWarrName_0").html(courseDetails.fileName || "");
                        /* $("#imageRemoveBtn_0").html('<i style="color: red; cursor: pointer;" class="bi bi-x-lg" onclick="clearFileUploadFields();"></i>'); */
                    }
                    
                    $("#rate").val(courseDetails.rate || "");
                    $("#currencySymbol").val(courseDetails.currencySymbol || "");
                    $("#level").val(courseDetails.level || "");
                    $("#priceType").val(courseDetails.priceType || "B2C");
                    $("#customers").val(courseDetails.customers ? JSON.parse(courseDetails.customers) : "");
                    
                    // Handle duration parsing
                    var duration = courseDetails.duration || "";
                    var hours = 0;
                    var minutes = 0;
                    if (duration) {
                        var parts = duration.split(" ");
                        for (var part of parts) {
                            if (part.endsWith("h")) {
                                hours = parseInt(part.replace("h", "")) || 0;
                            } else if (part.endsWith("m")) {
                                minutes = parseInt(part.replace("m", "")) || 0;
                            }
                        }
                    }
                    $("#durationHours").val(hours);
                    $("#durationMinutes").val(minutes);
                    togglePriceFields();
                    
                    // FIXED: Handle Category and Subcategory setting by matching names (since IDs may be missing in response)
                    const categoryName = courseDetails.categoryName || '';
                    if (categoryName) {
                        // Find option by text and set value to its key (ID)
                        const categoryOption = $('#parentCategory option').filter(function() {
                            return $(this).text().trim() === categoryName.trim();
                        }).first();
                        if (categoryOption.length > 0) {
                            const categoryId = categoryOption.val();
                            $("#parentCategory").val(categoryId);
                            // FIXED: Load subcategories WITHOUT passing subcategory name as ID (load all, then set by name below)
                            getsubcategoryList(categoryId, '');
                        } else {
                            console.warn('Category name "' + categoryName + '" not found in options');
                            // Fallback: If category not found, still try to load subcategories if possible (e.g., from existing ID)
                            if (courseDetails.parentCategoryId) {
                                getsubcategoryList(courseDetails.parentCategoryId, '');
                            }
                        }
                    }
                    
                    // Set subcategory after parent loads (increased delay for AJAX completion; set by name matching)
                    const subCategoryName = courseDetails.subCategoryName || '';
                    if (subCategoryName) {
                        setTimeout(() => {
                            const subOption = $('#subcategory option').filter(function() {
                                return $(this).text().trim() === subCategoryName.trim();
                            }).first();
                            if (subOption.length > 0) {
                                $("#subcategory").val(subOption.val()).trigger('change');
                                console.log('Subcategory set successfully:', subCategoryName);
                            } else {
                                console.warn('Subcategory name "' + subCategoryName + '" not found in options');
                            }
                        }, 300);  // Increased timeout to 300ms for AJAX to complete
                    }
                    
                    // Optional: Load training details if courseCategoryType exists
                    if (courseDetails.courseCategoryType && Array.isArray(courseDetails.courseCategoryType)) {
                        getTrainingDetails(courseId);  // Assuming this function exists to populate training tabs
                    }
                    
                    // Optional: Handle image if "image" field exists
                    if (courseDetails.image) {
                        // Set preview for course image if needed
                        console.log('Course Image URL:', courseDetails.image);
                    }
                    
                    // Optional: Populate structured description fields if separate sections exist
                    if (courseDetails.courseOverview) {
                        // Assuming additional CKEditor instances for sections; adjust as needed
                        // e.g., if (CKEDITOR.instances.courseOverview) CKEDITOR.instances.courseOverview.setData(courseDetails.courseOverview);
                    }
                    if (courseDetails.targetGroup) {

                    }
                    if (courseDetails.conceptsCovered) {
                        // e.g., if (CKEDITOR.instances.conceptsCovered) CKEDITOR.instances.conceptsCovered.setData(courseDetails.conceptsCovered);
                    }
                    if (courseDetails.examAndPrerequisite) {
                        // e.g., if (CKEDITOR.instances.examAndPrerequisite) CKEDITOR.instances.examAndPrerequisite.setData(courseDetails.examAndPrerequisite);
                    }
                }
            }
        },
        error: function (error) {
            console.error("Error fetching course details:", error);
        }
    });

                                                                    type="text" id="discount" class="form-control"
                                                                    onblur="removeValid(event);">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label for="instiname">Minimum Purchase Price<span
                                                                        class="mandatory">*</span></label> <input
                                                                    type="text" id="price" class="form-control"
                                                                    onblur="removeValid(event);">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label for="instiname">Tracking URL</label> <input
                                                                    type="text" id="trackUrl" class="form-control"
                                                                    onblur="removeValid(event);">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group calendar_box">
                                                                <label>Valid From </label> <input type="text"
                                                                    id="validFrom" class="form-control"
                                                                    th:attr="onkeyup=|formatDate('validFrom','${session.DATEFORMAT_JS}')|"
                                                                    readonly> <i class="ti-calendar picker_calendar"
                                                                    id="validFromCalendarDate"></i>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group calendar_box">
                                                                <label>Valid To </label> <input type="text" id="validTo"
                                                                    class="form-control"
                                                                    th:attr="onkeyup=|formatDate('validTo','${session.DATEFORMAT_JS}')|"
                                                                    readonly> <i class="ti-calendar picker_calendar"
                                                                    id="validToCalendarDate"></i>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <label for="mode" class="form-label">Status<span
                                                                    class="mandatory">*</span></label> <select
                                                                class="form-select" id="status" name="status">
                                                                <option value="">Select</option>
                                                                <option value="active">Active</option>
                                                                <option value="In-active">In-active</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div id="marketingCard" class="card-body p-0 mt-3"
                                                    style="display: none;">
                                                    <input type="hidden" id="marketingId">
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Name<span class="text-danger">*</span></label>
                                                                <input type="text" id="marketName" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Start Date<span
                                                                        class="text-danger">*</span></label>
                                                                <input type="date" id="starmarketNametDate"
                                                                    class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>End Date<span
                                                                        class="text-danger">*</span></label>
                                                                <input type="date" id="endDate" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label for="instiname">Tracking URL</label> <input
                                                                    type="text" id="marketingTrackUrl" class="form-control"
                                                                    onblur="removeValid(event);">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <label>Status<span class="text-danger">*</span></label>
                                                            <select class="form-select" id="marketingStatus">
                                                                <option value="">Select</option>
                                                                <option value="active">Active</option>
                                                                <option value="inactive">Inactive</option>
                                                            </select>
                                                        </div>
                                                        <div class="col-md-12">
                                                            <label>Description<span class="text-danger">*</span></label>
                                                            <div id="description"></div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <h6 class="mt-2">Document</h6>
                                                            <div
                                                                class="upload-container d-flex gap-2 align-items-center">
                                                                <!-- Hidden file input -->
                                                                <input type="file" id="uploadWarDoc_0" name="userImage"
                                                                    accept=".jpeg, .jpg, .png, .pdf"
                                                                    style="display: none;" onchange="saveFile(event)">

                                                                <!-- Plus icon (clickable) -->
                                                                <div id="uploadedWarrDiv_0">
                                                                    <i class="ti-plus" id="addIcon_0"
                                                                        onclick="$('#uploadWarDoc_0').click();"></i>
                                                                </div>

                                                                <!-- File name + remove button -->
                                                                <div id="imageWarrName_0" style="font-weight: 500;">
                                                                </div>
                                                                <div id="imageRemoveBtn_0"></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Coupon Allocation Tab -->
                                    <div id="course-allocation" class="tab-pane fade p-2 h-100" role="tabpanel">
                                        <div class="requisition-tbl d-flex flex-column h-100">
                                            <div class="mb-2">
                                                <table class="table table-bordered mb-0" width="100%">
                                                    <tbody>
                                                        <tr valign="middle">
                                                            <td width="50%"><span class="head-user-name ml-5"
                                                                    id="employeeNameTop2"></span></td>
                                                            <td>
                                                                <div class="d-flex justify-content-end flxwrap">
                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="prevTabBtn" type="button"
                                                                            onclick="nextTab('course-overview')">Prev</button>
                                                                    </div>


                                                                    <div class="ml-3">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="deleteChild" type="button"
                                                                            onclick="deleteDetails()">Delete</button>
                                                                    </div>
                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="newchild" type="button"
                                                                            onclick="openBrowseCourse()">Allocate</button>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            <div class="card p-2" id="courseAllocate">
                                                <div class="innercontent">
                                                    <h5 class="mb-2">Course Details</h5>

                                                    <div id="activity" style="width: 100%; height: 500px;"
                                                        class="ag-theme-alpine"></div>

                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
