                    height: 150,

        function saveCoupon() {
            let allRowData = [];
            var validation = true;

            // Detect which option is selected
            let isCoupon = $("#couponCheck").is(":checked");
            let isMarketing = $("#marketingCheck").is(":checked");

            if (!isCoupon && !isMarketing) {
                toastr.error("Please select either Coupon or Marketing before saving");
                return;
            }

            // Build data object
            let recordJsonData = {};

            if (isCoupon) {
                // ===== COUPON FIELDS =====
                var couponId = $("#couponId").val();
                var couponNo = $("#couponNo").val();
                var discount = $("#discount").val();
                var price = $("#price").val();
                var validFrom = $("#validFrom").val();
                var validTo = $("#validTo").val();
                var status = $("#status").val();

                // Grid data (if applicable)
                activityOptions.api.forEachNode(function (node) {
                    let rowData = {};
                    activityDefs.forEach(function (column) {
                        const field = column.field;
                        if (field) {
                            rowData[field] = node.data[field] || "";
                        }
                    });
                    allRowData.push(rowData);
                });

                // ===== COUPON VALIDATION =====
                if (couponNo === "") {
                    toastr.error("Coupon Code is required");
                    return;
                }
                if (discount === "") {
                    toastr.error("Discount is required");
                    return;
                }
                if (isNaN(discount) || Number(discount) <= 0) {
                    toastr.error("Please enter a valid Discount (%) greater than 0");
                    return;
                }
                if (price === "") {
                    toastr.error("Minimum Purchase Price is required");
                    return;
                }
                if (isNaN(price) || Number(price) < 0) {
                    toastr.error("Please enter a valid Minimum Purchase Price (>= 0)");
                    return;
                }
                if (validFrom === "") {
                    toastr.error("Valid From date is required");
                    return;
                }
                if (validTo === "") {
                    toastr.error("Valid To date is required");
                    return;
                }
                if (status === "") {
                    toastr.error("Status must be selected");
                    return;
                }

                recordJsonData = {
                    type: "coupon",
                    couponId: couponId,
                    couponNo: couponNo,
                    discount: discount,
                    price: price,
                    validFrom: validFrom,
                    validTo: validTo,
                    status: status,
                    rows: allRowData
                };
            }

            if (isMarketing) {
                // ===== MARKETING FIELDS =====
                var marketingId = $("#marketingId").val();
                var marketName = $("#marketName").val();
                var startDate = $("#starmarketNametDate").val();
                var endDate = $("#endDate").val();
                var marketingStatus = $("#marketingStatus").val();

                // ===== MARKETING VALIDATION =====
                if (marketName === "") {
                    toastr.error("Marketing Name is required");
                    return;
                }
                if (startDate === "") {
                    toastr.error("Start Date is required");
                    return;
                }
                if (endDate === "") {
                    toastr.error("End Date is required");
                    return;
                }
                if (marketingStatus === "") {
                    toastr.error("Status must be selected");
                    return;
                }

                recordJsonData = {
                    type: "marketing",
                    marketingId: marketingId,
                    marketName: marketName,
                    startDate: startDate,
                    endDate: endDate,
                    status: marketingStatus
                };
            }

            // Convert to JSON for AJAX
            let jsonData = JSON.stringify(recordJsonData);
            console.log("Record JSON Data ===>", jsonData);

            // ===== AJAX CALL =====
            $.ajax({
                url: 'promotion-marketing-save-data',
                type: 'POST',
                contentType: 'application/json',
                data: jsonData,
                success: function (response) {
                    if (response.code == "success") {
                        toastr.success(response.message);
                        cancelCoupon();
                        shouldHideNextTabBtn = true;
                        const tabElement = document.querySelector('#' + "courseDetails" + ' a');
                        tabElement.click();
                    }
                },
                error: function (xhr, status, error) {
                    console.log("Error saving data:", error);
                }
            });
        }

                <div class="maincontentsec">
                    <div class="d-flex flex-column flex-lg-row">
                        <!--Left Sec Start-->
                        <div class="box-sec" id="collapseWidthR1">
                            <div class="out-box">
                                <div class="d-flex justify-content-between bdr-line p-2">
                                    <div class="col-md-8 col-12">
                                        <div class="d-flex search-sec">
                                            <input class="form-control me-2" type="text" placeholder="Search"
                                                id="quickFilter" autocomplete="off">
                                            <button class="btn go-btn" type="button" id="goBtn">Go</button>
                                            &nbsp;
                                            <button class="btn go-btn w-auto" type="button" id="resetBtn">Reset</button>
                                        </div>
                                    </div>
                                    <button class="btn btn-primary max-btn" id="collapseButtonR1"
                                        onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top"
                                        title="Expand">
                                        <i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
                                            class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                                    </button>
                                </div>
                                <div class="card m-2 p-2">
                                    <div id="myGrid" class="ag-theme-alpine"></div>
                                </div>
                            </div>
                        </div>

                        <!--Right Sec Start-->
                        <div class="box-sec" id="collapseWidthL1">
                            <div class="out-box">
                                <div
                                    class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
                                    <button class="btn btn-primary max-btn" id="collapseButtonL1" type="button"
                                        onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" data-bs-placement="top"
                                        title="Expand">
                                        <i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
                                            class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                                    </button>

                                    <!--Right Inner Tab Start-->
                                    <div class="d-flex gap-2">
                                        <ul class="nav nav-pills newtab" role="tablist">
                                            <li class="nav-item" role="presentation" id="courseDetails">
                                                <a class="nav-link active" data-bs-toggle="pill" href="#course-overview"
                                                    aria-selected="true" role="tab">Coupon Overview</a>
                                            </li>
                                            <li class="nav-item" role="presentation" id="courseAllocation">
                                                <a class="nav-link" data-bs-toggle="pill" href="#course-allocation"
                                                    aria-selected="false" role="tab">Coupon Allocation</a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>

                                <!-- Tab panes -->
                                <div class="tab-content flex-fill">
                                    <!-- Coupon Overview Tab -->
                                    <div id="course-overview" class="tab-pane active show p-2 h-100" role="tabpanel">
                                        <div class="requisition-tbl d-flex flex-column h-100">
                                            <div class="mb-2">
                                                <table class="table table-bordered mb-0" width="100%">
                                                    <tbody>
                                                        <tr valign="middle">
                                                            <td width="80%"><strong id="programNameDisplay"></strong>
                                                            </td>
                                                            <td>
                                                                <div class="d-flex justify-content-end">
                                                                    <div class="ml-3">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="addBtn" type="button"
                                                                            onclick="addCoupon()">ADD</button>
                                                                    </div>
                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="dltBtn" type="button"
                                                                            onclick="deleteCoupon()">Delete</button>
                                                                    </div>
                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="nextTabBtn" type="button"
                                                                            onclick="nextTab('course-allocation')">Next</button>
                                                                    </div>
                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="cancelBtn" type="button"
                                                                            onclick="cancelCoupon()">Cancel</button>
                                                                    </div>

                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="saveBtn" type="button"
                                                                            onclick="saveCoupon()">Save</button>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            <div class="card p-2" id="couponDiv">
                                                <!-- Coupon display content -->
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <div
                                                            class="coupon bg-white rounded mb-3 d-flex justify-content-between">
                                                            <div class="kiri p-3">
                                                                <div class="icon-container">
                                                                    <div class="icon-container_box">
                                                                        <img id="qrImage"
                                                                            th:src="@{/images/default.png}" width="150"
                                                                            alt="QR Code" />
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="tengah py-3 d-flex w-100 justify-content-start">
                                                                <div>
                                                                    <span class="badge badge-success">Valid</span>
                                                                    <h3 class="lead">Coupon Detail goes here</h3>
                                                                    <p class="text-muted mb-0">Short info about voucher
                                                                    </p>
                                                                    <span class="badge bg-close"
                                                                        style="width: 70px; display: inline-block; text-align: center;"
                                                                        id="ststusBadge"></span>
                                                                </div>
                                                            </div>
                                                            <div class="kanan">
                                                                <div class="info m-3 d-flex align-items-center">
                                                                    <div class="w-100">
                                                                        <div class="block">
                                                                            <span class="time font-weight-light">
                                                                                <span id="daysleft">0 days</span>
                                                                            </span>
                                                                        </div>
                                                                        <button class="btn btn-primary edit-btn"
                                                                            type="button" onclick="editCoupon()"
                                                                            style="background: linear-gradient(45deg, #09063b 0%, #4a00e0 100%); color: white; border: none; transition: 0.3s;">
                                                                            View</button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="card p-2" id="couponForm">
                                                <!-- Coupon form content -->
                                                <!-- <div
                                                    class="card-header d-flex align-items-center justify-content-between">
                                                    <h5>Coupon Details</h5>
                                                </div> -->
                                                <div>
                                                    <h6>Type</h6>
                                                    <div class="d-flex gap-4 align-items-center">
                                                        <label>
                                                            <input type="radio" name="type" value="coupon"
                                                                id="couponCheck" checked> Coupon
                                                        </label>
                                                        <label>
                                                            <input type="radio" name="type" value="marketing"
                                                                id="marketingCheck">
                                                            Marketing
                                                        </label>
                                                    </div>
                                                </div>


                                                <div class="card-body p-0 mt-2" id="couponCard">
                                                    <input type="hidden" id="couponId">
                                                    <div class="row">

                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label for="instiname">Coupon Code<span
                                                                        class="mandatory">*</span></label> <input
                                                                    type="text" id="couponNo" class="form-control"
                                                                    onblur="removeValid(event);">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label for="instiname">Coupon Offer(%)<span
                                                                        class="mandatory">*</span></label> <input
                                                                    type="text" id="discount" class="form-control"
                                                                    onblur="removeValid(event);">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label for="instiname">Minimum Purchase Price<span
                                                                        class="mandatory">*</span></label> <input
                                                                    type="text" id="price" class="form-control"
                                                                    onblur="removeValid(event);">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group calendar_box">
                                                                <label>Valid From </label> <input type="text"
                                                                    id="validFrom" class="form-control"
                                                                    th:attr="onkeyup=|formatDate('validFrom','${session.DATEFORMAT_JS}')|"
                                                                    readonly> <i class="ti-calendar picker_calendar"
                                                                    id="validFromCalendarDate"></i>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group calendar_box">
                                                                <label>Valid To </label> <input type="text" id="validTo"
                                                                    class="form-control"
                                                                    th:attr="onkeyup=|formatDate('validTo','${session.DATEFORMAT_JS}')|"
                                                                    readonly> <i class="ti-calendar picker_calendar"
                                                                    id="validToCalendarDate"></i>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <label for="mode" class="form-label">Status<span
                                                                    class="mandatory">*</span></label> <select
                                                                class="form-select" id="status" name="status">
                                                                <option value="">Select</option>
                                                                <option value="active">Active</option>
                                                                <option value="In-active">In-active</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div id="marketingCard" class="card-body p-0 mt-3"
                                                    style="display: none;">
                                                    <input type="hidden" id="marketingId">
                                                    <div class="row">
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Name<span class="text-danger">*</span></label>
                                                                <input type="text" id="marketName" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>Start Date<span
                                                                        class="text-danger">*</span></label>
                                                                <input type="date" id="starmarketNametDate" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div class="form-group">
                                                                <label>End Date<span
                                                                        class="text-danger">*</span></label>
                                                                <input type="date" id="endDate" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <label>Status<span class="text-danger">*</span></label>
                                                            <select class="form-select" id="marketingStatus">
                                                                <option value="">Select</option>
                                                                <option value="active">Active</option>
                                                                <option value="inactive">Inactive</option>
                                                            </select>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <h6 class="mt-2">Document</h6>
                                                            <div
                                                                class="upload-container d-flex gap-2 align-items-center">
                                                                <!-- Hidden file input -->
                                                                <input type="file" id="uploadWarDoc_0" name="userImage"
                                                                    accept=".jpeg, .jpg, .png, .pdf"
                                                                    style="display: none;" onchange="saveFile(event)">

                                                                <!-- Plus icon (clickable) -->
                                                                <div id="uploadedWarrDiv_0">
                                                                    <i class="ti-plus" id="addIcon_0"
                                                                        onclick="$('#uploadWarDoc_0').click();"></i>
                                                                </div>

                                                                <!-- File name + remove button -->
                                                                <div id="imageWarrName_0" style="font-weight: 500;">
                                                                </div>
                                                                <div id="imageRemoveBtn_0"></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Coupon Allocation Tab -->
                                    <div id="course-allocation" class="tab-pane fade p-2 h-100" role="tabpanel">
                                        <div class="requisition-tbl d-flex flex-column h-100">
                                            <div class="mb-2">
                                                <table class="table table-bordered mb-0" width="100%">
                                                    <tbody>
                                                        <tr valign="middle">
                                                            <td width="50%"><span class="head-user-name ml-5"
                                                                    id="employeeNameTop2"></span></td>
                                                            <td>
                                                                <div class="d-flex justify-content-end flxwrap">
                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="prevTabBtn" type="button"
                                                                            onclick="nextTab('course-overview')">Prev</button>
                                                                    </div>


                                                                    <div class="ml-3">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="deleteChild" type="button"
                                                                            onclick="deleteDetails()">Delete</button>
                                                                    </div>
                                                                    <div class="mr-2">
                                                                        <button class="btn btn-primary edit-btn"
                                                                            id="newchild" type="button"
                                                                            onclick="openBrowseCourse()">Allocate</button>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            <div class="card p-2" id="courseAllocate">
                                                <div class="innercontent">
                                                    <h5 class="mb-2">Course Details</h5>

                                                    <div id="activity" style="width: 100%; height: 500px;"
                                                        class="ag-theme-alpine"></div>

                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
