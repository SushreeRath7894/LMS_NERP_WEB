<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}">
<head>

  <style type="text/css">
    /* --------------------------------------------
       EXISTING STYLES (kept) + MODERN TAB REDESIGN
    ---------------------------------------------*/
    .ag-theme-alpine { height: calc(100vh - 100px); }

    .subject-card {
      background-color: #bf05ff;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      color: white;
    }
    .subject-card p { margin: 0; font-size: 12px; font-weight: 400; color: #ffffff9e; }
    .subject-card h5 { margin: 0 0 5px; color: white; }

    .nav-pills { gap: 3px; }

    .step-line {
      background: #e0e0e0;
      height: 2px;
      width: 35vw;
      position: absolute;
      top: 30px;
      z-index: 1;
    }

    .nav-pills.custom li { background: transparent; margin: 0 30px; z-index: 2; }
    .nav-link.active.custom { background-color: #bf05ff; color: white; }
    .nav-link.custom { color: inherit; border: 1px solid #bf05ff; width: 93px; }

    .tab-content.custom { display: flex; justify-content: space-between; gap: 5px; }
    .tab-content.custom .tab-pane { width: 50vw; }

    .document-link {
      color: rgb(191, 5, 255);
      text-decoration: none;
      font-weight: bold;
    }
    .document-link:hover { color: #9b04d3; text-decoration: underline; }

    .btn-group button {
      background-color: #04AA6D;
      border: 1px solid green;
      color: white;
      padding: 10px 24px;
      cursor: pointer;
      float: left;
      min-width: 45vw;
      border-radius: 5px;
    }
    .btn-group:after { content: ""; clear: both; display: table; }
    .btn-group button:not(:last-child) { border-right: none; }
    .btn-group button:hover { background-color: #3e8e41; }

    #enable {
      font-weight: 700;
      background-color: #667eea !important;
      color: white !important;
    }

    /* Grid tweaks */
    .ag-theme-alpine {
      --ag-foreground-color: rgb(55, 65, 81);
      --ag-secondary-foreground-color: rgb(55, 65, 81);
      --ag-grid-size: 8px;
      --ag-list-item-height: 28px;
    }
    .ag-theme-alpine .ag-cell {
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    /* Buttons */
    .go-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      font-weight: 600;
      transition: all 0.2s ease;
      border: none;
    }
    .go-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px -12px rgba(0, 0, 0, 0.35);
    }
    .go-btn:active { transform: translateY(0); }
    .go-btn i { font-size: 1.1em; }

    /* Student profile card */
    .student-profile-card { padding: 20px; }
    .profile-header-subs {
      display: flex;
      margin-bottom: 20px;
      text-align: left !important;
      padding: 18px 18px;
      background-color: #f5f2e7;
      border-radius: 14px;
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .profile-avatar-subs {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 18px !important;
      border: 3px solid #667eea;
      position: relative;
    }
    .profile-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 2px; color:#0f172a; }
    .profile-email { color: #6b7280; font-size: 0.9rem; }

    .profile-details { margin-bottom: 20px; }
    .detail-row { display: flex; margin-bottom: 10px; }
    .detail-label { font-weight: 700; color: #4b5563; width: 140px; }
    .detail-value { color: #374151; }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .status-active { background-color: #dcfce7; color: #16a34a; }
    .status-inactive { background-color: #fee2e2; color: #dc2626; }

    .payment-status {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .payment-paid { background-color: #dcfce7; color: #16a34a; }
    .payment-unpaid { background-color: #fee2e2; color: #dc2626; }
    .payment-pending { background-color: #fef3c7; color: #d97706; }

    .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .no-selection {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6b7280;
      font-size: 1.05rem;
    }

    /* Course cards */
    .course-card {
      border: 1px solid rgba(15, 23, 42, 0.10);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfbff 100%);
      box-shadow: 0 10px 20px -18px rgba(0,0,0,0.45);
    }
    .course-header {
      font-size: 16px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 8px;
      letter-spacing: .2px;
    }
    .training-list { list-style-type: disc; padding-left: 20px; margin: 0; }
    .training-list li { margin-bottom: 4px; font-size: 14px; color: #334155; }

    /* ✅ Modern enrolled training rows + Unassign button (override training-list) */
    .training-list { list-style: none; padding-left: 0; margin: 0; }
    .training-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      background: #fff;
      margin-bottom: 8px;
      transition: all .18s ease;
    }
    .training-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px -24px rgba(0,0,0,0.65);
      border-color: rgba(191, 5, 255, 0.20);
    }
    .training-left {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .training-name {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 36vw;
    }
    .training-id-badge {
      display: inline-flex;
      align-self: flex-start;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.10);
      color: #2563eb;
    }
    .training-unassign-btn {
      border-radius: 999px !important;
      font-weight: 900;
      padding: 6px 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .training-unassign-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    @media (max-width: 992px){
      .training-name { max-width: 70vw; }
    }

    /* Dropdown */
    .dropdown-search { position: relative; margin-bottom: 1.25rem; }
    .dropdown-list {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: white;
      border: 1px solid #e5e7eb;
      border-top: none;
      max-height: 300px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 14px 24px -20px rgba(0,0,0,0.55);
      border-radius: 0 0 0.9rem 0.9rem;
    }
    .dropdown-item {
      padding: 10px 14px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .dropdown-item:hover { background-color: #f1f5f9; }
    .dropdown-item.active { background-color: #2563eb; color: #fff; }
    .dropdown-list::-webkit-scrollbar { width: 8px; }
    .dropdown-list::-webkit-scrollbar-track { background: #f1f1f1; }
    .dropdown-list::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 4px; }
    .dropdown-list::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    /* --------------------------------------------
       MODERN / ADVANCED TAB STYLING (NO JS BREAK)
       - Keeps IDs and structure intact
    ---------------------------------------------*/
    .tab-header-bar {
      background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 14px 28px -26px rgba(0,0,0,0.65);
    }

    #userTypeTabs {
      background: #f1f5f9;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      padding: 4px;
      gap: 6px;
    }
    #userTypeTabs .nav-item { margin: 0; }
    #userTypeTabs .nav-link {
      border: none !important;
      border-radius: 999px !important;
      padding: 9px 14px;
      font-weight: 800;
      font-size: 13px;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .18s ease;
      white-space: nowrap;
    }
    #userTypeTabs .nav-link:hover {
      transform: translateY(-1px);
      background: rgba(37, 99, 235, 0.08);
    }
    #userTypeTabs .nav-link.active {
      background: linear-gradient(135deg, #bf05ff 0%, #667eea 60%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 14px 22px -18px rgba(102,126,234,0.85);
    }

    #tabMenu {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      padding: 4px;
      gap: 6px;
      box-shadow: 0 14px 28px -26px rgba(0,0,0,0.65);
      flex-wrap: wrap;
    }
    #tabMenu .nav-link {
      border: none !important;
      border-radius: 999px !important;
      padding: 9px 14px;
      font-weight: 800;
      font-size: 13px;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .18s ease;
      white-space: nowrap;
      position: relative;
    }
    #tabMenu .nav-link:hover {
      transform: translateY(-1px);
      background: rgba(191, 5, 255, 0.08);
    }
    #tabMenu .nav-link.active {
      background: #0f172a;
      color: #fff;
      box-shadow: 0 18px 26px -22px rgba(15,23,42,0.9);
    }
    #tabMenu .nav-link.active::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: -6px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #bf05ff 0%, #667eea 55%, #2563eb 100%);
      box-shadow: 0 12px 18px -16px rgba(102,126,234,0.9);
    }

    .search-sec input.form-control{
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,0.10);
      padding: 10px 12px;
      box-shadow: 0 10px 18px -22px rgba(0,0,0,0.55);
    }
    .search-sec .go-btn{
      border-radius: 12px;
      font-weight: 800;
    }

    .bdr-line.p-2 { background: transparent; }

    @media (max-width: 992px) {
      #userTypeTabs { border-radius: 16px; padding: 6px; }
      #tabMenu { border-radius: 16px; }
      #userTypeTabs .nav-link, #tabMenu .nav-link { padding: 10px 12px; font-size: 12px; }
    }
  </style>

  <script type="text/javascript">

    /* -----------------------------
       GLOBALS
    ------------------------------*/
    var tb = 'Normal User';

    // stores BOTH Normal + Public in one place
    var allStudentData = [];

    // ✅ store currently selected studentId (this is your enrolledBy)
    let selectedStudentId = null;

    /* -----------------------------
       SMALL HELPERS
    ------------------------------*/
    function escHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function sanitizeTrainingName(name) {
      // IMPORTANT: must match how you generate trainingId during Assign:
      // selectedTrainingRefId + "-" + trainingCategory.replace(/\s+/g, '')
      return String(name || "").trim().replace(/\s+/g, "");
    }

    function resolveTrainingId(tr) {
      // ✅ 1) BEST: trainingRefId + trainingCategory (matches your backend remove key)
      const ref = tr?.trainingRefId ? String(tr.trainingRefId).trim()
        : (tr?.trainingRef ? String(tr.trainingRef).trim()
        : (tr?.trainingRefID ? String(tr.trainingRefID).trim() : ""));

      const cat = tr?.trainingCategory
        ? String(tr.trainingCategory).trim()
        : (tr?.trainingName ? String(tr.trainingName).trim() : "");

      if (ref && cat) return `${ref}-${sanitizeTrainingName(cat)}`;

      // ✅ 2) fallback: sometimes backend may provide already-built string id
      if (tr?.trainingId && typeof tr.trainingId === "string") return tr.trainingId.trim();

      // ❌ DO NOT prefer numeric trainingId (e.g., 5478) for unassign
      return null;
    }

    /* ✅ SweetAlert2 confirm compatibility (old versions return {value:true}) */
    function swalConfirmedResult(r) {
      return !!(r && (r.isConfirmed === true || r.value === true));
    }

    /* -----------------------------
       GRID DEFINITIONS
    ------------------------------*/
    var columnDefs = [
      {
        headerCheckboxSelection: true,
        headerCheckboxSelectionFilteredOnly: true,
        checkboxSelection: true,
        width: 10,
        sortable: false,
        filter: false,
        resizable: true,
        pinned: 'left',
      },
      { headerName: "Enroll Id", field: "enrollId" },
      { headerName: "User Name", field: "studentName" },
      { headerName: "User Id", field: "studentId", hide: true },
      { headerName: "Course Name", field: "courseName" },
      { headerName: "Course Id", field: "courseId", hide: true },
      { headerName: "Email", field: "email" },
      {
        headerName: "Status",
        field: "userStatus",
        cellStyle: function(params) {
          if (params.value === 'Active') return { color: '#16a34a', fontWeight: '500' };
          if (params.value === 'Inactive') return { color: '#dc2626', fontWeight: '500' };
          return null;
        }
      },
      {
        headerName: "Enroll Date",
        field: "enrollDate",
        cellRenderer: function(params) {
          return params.value ? new Date(params.value).toLocaleDateString() : '';
        }
      },
      { headerName: "Phone Number", field: "phoneNo" },
      { headerName: "Nationality", field: "nationality" },
      {
        headerName: "Payment Status",
        field: "paymentStaus",
        cellStyle: function(params) {
          if (params.value === 'PAID') return { color: '#16a34a', fontWeight: '500' };
          if (params.value === 'UNPAID') return { color: '#dc2626', fontWeight: '500' };
          if (params.value === 'PENDING') return { color: '#d97706', fontWeight: '500' };
          return null;
        }
      },
      {
        headerName: "Payment Mode",
        field: "paymentMode",
        cellStyle: function(params) {
          if (params.value) return { color: '#2563eb', fontWeight: '500' };
          return null;
        }
      }
    ];

    var gridOptions = {
      columnDefs: columnDefs,
      rowSelection: 'single',
      suppressRowClickSelection: true,
      defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 185,
        height: 10
      },
      pagination: true,
      paginationPageSize: 15,
      onGridReady: function(params) {
        window.gridApi = params.api;
        window.gridOptionsCourse = params.api;
      },
      onSelectionChanged: onSelectionChanged,
    };

    // reusable checkbox column
    const checkboxCol = {
      headerCheckboxSelection: true,
      headerCheckboxSelectionFilteredOnly: true,
      checkboxSelection: true,
      width: 50,
      minWidth: 50,
      maxWidth: 50,
      sortable: false,
      filter: false,
      resizable: false,
      pinned: 'left',
      lockPosition: true,
      suppressMenu: true,
      cellClass: 'ag-checkbox-column'
    };

    /* -----------------------------
       INIT
    ------------------------------*/
    $(document).ready(function() {
      var gridDivm = document.querySelector('#mygrid');
      new agGrid.Grid(gridDivm, gridOptions);

      // Load BOTH tabs once, then filter locally
      loadAllStudentsOnce();

      // ✅ IMPORTANT FIX: Only toggle left tab active states (do NOT touch right side tabs)
      $('#normalTabLink').on('click', function(e) {
        e.preventDefault();
        $('#userTypeTabs .nav-link').removeClass('active');
        $(this).addClass('active');
        tb = 'Normal User';
        filterGridData(tb);
      });

      $('#publicTabLink').on('click', function(e) {
        e.preventDefault();
        $('#userTypeTabs .nav-link').removeClass('active');
        $(this).addClass('active');
        tb = 'Public Batches';
        filterGridData(tb);
      });
    });

    /* -----------------------------
       HELPERS (SAFE PARSE + NORMALIZE)
    ------------------------------*/
    function safeParseBody(body) {
      if (!body) return {};
      if (typeof body === "object") return body;
      try { return JSON.parse(body); } catch (e) { return {}; }
    }

    function normalizeRow(row, tabName) {
      const r = Object.assign({}, row || {});
      if (!r.enrollId && r.studentId) r.enrollId = r.studentId;
      if (!r.studentId && r.enrollId) r.studentId = r.enrollId;

      if (r.paymentStatus && !r.paymentStaus) r.paymentStaus = r.paymentStatus;
      if (r.paymentStaus && !r.paymentStatus) r.paymentStatus = r.paymentStaus;

      r.__tab = tabName;
      return r;
    }

    /* -----------------------------
       LOAD ALL DATA ONCE
    ------------------------------*/
    function loadAllStudentsOnce() {
      const urlNormal = "subscription-student-view?id=" + encodeURIComponent("Normal User");
      const urlPublic = "subscription-student-view?id=" + encodeURIComponent("Public Batches");

      const reqNormal = agGrid.simpleHttpRequest({ url: urlNormal });
      const reqPublic = agGrid.simpleHttpRequest({ url: urlPublic });

      Promise.all([reqNormal, reqPublic])
        .then(function([resNormal, resPublic]) {
          let merged = [];

          if (resNormal && resNormal.message === "Success") {
            const b1 = safeParseBody(resNormal.body);
            const arr1 = (b1.studentData || []).map(r => normalizeRow(r, "Normal User"));
            merged = merged.concat(arr1);
          }

          if (resPublic && resPublic.message === "Success") {
            const b2 = safeParseBody(resPublic.body);
            const arr2 = (b2.studentData || []).map(r => normalizeRow(r, "Public Batches"));
            merged = merged.concat(arr2);
          }

          merged.sort((a, b) => {
            const aId = String(a.studentId || "").replace(/\D/g, "");
            const bId = String(b.studentId || "").replace(/\D/g, "");
            return (parseInt(bId || "0", 10) - parseInt(aId || "0", 10));
          });

          allStudentData = merged;
          filterGridData(tb);
        })
        .catch(function(err) {
          console.error("[loadAllStudentsOnce] failed:", err);
        });
    }

    // kept for compatibility
    function getStudentDetails(type) {
      if (type) tb = type;
      loadAllStudentsOnce();
    }

    /* -----------------------------
       FILTER GRID LOCALLY
    ------------------------------*/
    function filterGridData(type) {
      const filtered = allStudentData.filter(r => r.__tab === type);

      let defs = [checkboxCol];

      defs.push(
        {
          headerName: "Enroll ID",
          valueGetter: function(params) {
            const d = params.data || {};
            return (d.enrollId || d.studentId || "").toString();
          },
          width: 150
        },
        { headerName: "Student Name", field: "studentName", width: 180 },
        { headerName: "Email", field: "email", width: 220 },
        { headerName: "Phone", field: "phoneNo", width: 150 },
        { headerName: "Course Name", field: "courseName", width: 350, tooltipField: "courseName" }
      );

      if (type === "Public Batches") {
        defs.push(
          { headerName: "Batch Title", field: "batchTitle", width: 200 },
          { headerName: "Batch Start Date", field: "batchStartDate", width: 180 },
          { headerName: "Batch End Date", field: "batchEndDate", width: 180 },
          { headerName: "From Time", field: "batchFromTime", width: 140 },
          { headerName: "To Time", field: "batchToTime", width: 140 }
        );
      }

      window.gridApi.setColumnDefs(defs);
      window.gridApi.setRowData(filtered);

      if (filtered.length > 0) {
        window.gridApi.deselectAll();
        window.gridApi.getDisplayedRowAtIndex(0).setSelected(true);
      } else {
        document.getElementById('student-profile-container').innerHTML =
          `<div class="no-selection">
              <p>No students found in this category.</p>
           </div>`;
        $('#courseCard').html('<p class="text-muted">No courses found.</p>');
        const rc = document.getElementById('courseRemoveContainer');
        if (rc) rc.innerHTML = `<div class="alert alert-secondary m-0">Select a student to manage training removals.</div>`;
      }
    }

    /* -----------------------------
       SELECTION CHANGE
    ------------------------------*/
    function onSelectionChanged() {
      var selectedNodes = window.gridApi.getSelectedNodes();
      var selectedData = selectedNodes.map(node => node.data);

      if (selectedData.length > 0) {
        updateStudentProfile(selectedData[0]);

        // ✅ This is the real userId used for enroll/remove
        selectedStudentId = selectedData[0].studentId || selectedData[0].enrollId;

        // existing
        getTheCourseDetails(selectedStudentId);
        getCourseDetails();           // Add Training tab (existing)
        getCourseDetailsForRemove();  // Remove UI (bulk/advanced)
      } else {
        selectedStudentId = null;

        document.getElementById('student-profile-container').innerHTML = `
          <div class="no-selection">
              <p>Select a student from the grid to view details</p>
          </div>
        `;

        $('#courseCard').html('<p class="text-muted">No courses found.</p>');
        const rc = document.getElementById('courseRemoveContainer');
        if (rc) rc.innerHTML = `<div class="alert alert-secondary m-0">Select a student to manage training removals.</div>`;
      }
    }

    /* -----------------------------
       PROFILE RENDER
    ------------------------------*/
    function updateStudentProfile(studentData) {
      const enrollDate = studentData.enrollDate ? new Date(studentData.enrollDate).toLocaleDateString() : 'N/A';
      const statusClass = studentData.userStatus === 'Active' ? 'status-active' : 'status-inactive';

      let paymentClass = '';
      if (studentData.paymentStaus === 'PAID') paymentClass = 'payment-paid';
      else if (studentData.paymentStaus === 'UNPAID') paymentClass = 'payment-unpaid';
      else if (studentData.paymentStaus === 'PENDING') paymentClass = 'payment-pending';

      const image = studentData.candidateImage
        ? studentData.candidateImage
        : `https://ui-avatars.com/api/?name=${encodeURIComponent(studentData.studentName)}&background=667eea&color=fff&size=80`;

      const profileHtml = `
        <div class="student-profile-card">
          <div class="profile-header-subs">
            <img src="${escHtml(image)}" alt="Profile" class="profile-avatar-subs">
            <div>
              <h3 class="profile-name">${escHtml(studentData.studentName || 'N/A')}</h3>
              <p class="profile-email">${escHtml(studentData.email || 'N/A')}</p>
              <span class="status-badge ${statusClass}">${escHtml(studentData.userStatus || 'N/A')}</span>
            </div>
          </div>

          <div class="profile-details">
            <div class="detail-row">
              <span class="detail-label">Enrollment ID:</span>
              <span class="detail-value">${escHtml(studentData.enrollId || studentData.studentId || 'N/A')}</span>
            </div>
            <div class="detail-row">

    ------------------------------*/
    function getTheCourseDetails(enrollId) {
      $.ajax({
        url: 'subscription-get-course-details?enrollId=' + encodeURIComponent(enrollId),
        type: 'GET',
        success: function (response) {
          const body = typeof response.body === 'string'
            ? JSON.parse(response.body)
            : response.body;

          $('#courseCard').empty();

          if (!body || !body.enrollCourses || body.enrollCourses.length === 0) {
            $('#courseCard').html('<p class="text-muted">No courses found.</p>');
            return;
          }

          // Map by courseId (preferred) else courseName
          const courseMap = new Map();

          body.enrollCourses.forEach(course => {
            const courseId = (course.courseId || course.productId || "").toString().trim();
            const courseName = (course.courseName || "Course").toString().trim();

            const key = courseId || courseName;

            if (!courseMap.has(key)) {
              courseMap.set(key, {
                courseId,
                courseName,
                trainings: [],
                seen: new Set()
              });
            }

            const bucket = courseMap.get(key);
            const details = course.trainingDetails || [];

            details.forEach(tr => {
              // ✅ label should NOT fall back to numeric trainingId
              const label = (tr.trainingCategory || tr.trainingName || "Training").toString().trim();

              const tid = resolveTrainingId(tr);
              const dedupeKey = tid || label;

              if (!bucket.seen.has(dedupeKey)) {
                bucket.seen.add(dedupeKey);
                bucket.trainings.push({
                  label,
                  trainingId: tid
                });
              }
            });
          });

          courseMap.forEach((c) => {
            const courseDiv = $('<div class="course-card"></div>');

            const courseHeader = $(`
              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="course-header mb-0">${escHtml(c.courseName)}</div>
                ${c.courseId ? `<span class="badge bg-light text-dark">Course ID: <b>${escHtml(c.courseId)}</b></span>` : ""}
              </div>
            `);

            courseDiv.append(courseHeader);
            courseDiv.append(`<div class="mt-2 mb-2 text-muted" style="font-size:12px;font-weight:800;">Enrolled Trainings</div>`);

            if (c.trainings.length > 0) {
              const ul = $('<ul class="training-list"></ul>');

              c.trainings.forEach(t => {
                const disabled = !t.trainingId ? "disabled" : "";
                const title = t.trainingId ? "Unassign this training" : "Training ID missing from backend. Cannot unassign.";

                const li = $(`
                  <li class="training-item">
                    <div class="training-left">
                      <div class="training-name">${escHtml(t.label)}</div>
                      ${t.trainingId ? `<div class="training-id-badge">${escHtml(t.trainingId)}</div>` : ``}
                    </div>

                    <button type="button"
                            class="btn btn-outline-danger btn-sm training-unassign-btn js-unassign-training"
                            data-course-id="${escHtml(c.courseId)}"
                            data-training-id="${escHtml(t.trainingId || "")}"
                            ${disabled}
                            title="${escHtml(title)}">
                      <i class="fa-solid fa-trash"></i>
                      <span class="d-none d-md-inline">Unassign</span>
                    </button>
                  </li>
                `);

                ul.append(li);
              });

              courseDiv.append(ul);
            } else {
              courseDiv.append('<p class="text-muted">No trainings available.</p>');
            }

            $('#courseCard').append(courseDiv);
          });
        },
        error: function () {
          $('#courseCard').html('<p class="text-danger">Failed to load course details.</p>');
        }
      });
    }

            const trainingInput = document.getElementById("removeTrainingSearchInput");
            const trainingDisp = document.getElementById("removeSelectedTrainingDisplay");
            if (trainingInput) trainingInput.value = "";
            if (trainingDisp) trainingDisp.textContent = "None";
            if (trainingSec) trainingSec.style.display = "block";

            getTrainingDetailsForRemove(key);
            updateRemoveButtons();
          };
          courseList.addEventListener("click", removeCourseListListener);

          removeCourseKeydownListener = (e) => {
            const items = courseList.querySelectorAll(".dropdown-item");
            if (items.length === 0) return;
            let idx = Array.from(items).findIndex(it => it.classList.contains("active"));

            if (e.key === "ArrowDown") {
              e.preventDefault();
              items.forEach(i => i.classList.remove("active"));
              idx = (idx + 1) % items.length;
              items[idx].classList.add("active");
              items[idx].scrollIntoView({ block: "nearest" });
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              items.forEach(i => i.classList.remove("active"));
              idx = (idx - 1 + items.length) % items.length;
              items[idx].classList.add("active");
              items[idx].scrollIntoView({ block: "nearest" });
            } else if (e.key === "Enter" && idx >= 0) {
              e.preventDefault();
              items[idx].click();
            }
          };
          courseInput.addEventListener("keydown", removeCourseKeydownListener);

          removeCourseFocusListener = () => renderCourseList(courses);
          courseInput.addEventListener("focus", removeCourseFocusListener);

          document.addEventListener("click", (e) => {
            if (!container.contains(e.target)) courseList.style.display = "none";
          });
        })
        .catch(function(err) {
          console.error("Remove UI course load failed:", err);
          container.innerHTML = `<div class="alert alert-danger m-0">Failed to load courses for removal.</div>`;
        });
    }

    function getTrainingDetailsForRemove(courseId) {
      const trainingInput = document.getElementById("removeTrainingSearchInput");
      const trainingList = document.getElementById("removeTrainingDropdownList");
      const trainingDisp = document.getElementById("removeSelectedTrainingDisplay");

      if (!trainingInput || !trainingList) return;

      if (removeTrainingInputListener) trainingInput.removeEventListener("input", removeTrainingInputListener);
      if (removeTrainingKeydownListener) trainingInput.removeEventListener("keydown", removeTrainingKeydownListener);
      if (removeTrainingFocusListener) trainingInput.removeEventListener("focus", removeTrainingFocusListener);
      if (removeTrainingListListener) trainingList.removeEventListener("click", removeTrainingListListener);

      fetch("academic-training-view?id=" + encodeURIComponent(courseId))
        .then(r => {
          if (!r.ok) throw new Error("Network error: " + r.status);
          return r.json();
        })
        .then(data => {
          let trainingData = [];
          if (data.message === "Success" && data.body && data.body.length > 0) {
            try {
              const parsed = JSON.parse(data.body[0]);
              trainingData = parsed.courseCategoryType || [];
            } catch (e) {
              console.error("Remove training parse error:", e);
            }
          }

          const trainings = trainingData.map(t => ({
            key: t.trainingRefId,
            name: (t.trainingCategory || "Unknown").trim()
          }));

          function renderTrainingList(list) {
            if (list.length === 0) {
              trainingList.innerHTML = `<div class="dropdown-item text-muted text-center py-3">No trainings available</div>`;
            } else {
              trainingList.innerHTML = list.map((t, i) => `
                <div class="dropdown-item ${i === 0 ? 'active' : ''}" data-key="${escHtml(t.key)}">
                  ${escHtml(t.name)}
                </div>
              `).join("");
            }
            trainingList.style.display = "block";
            const active = trainingList.querySelector(".dropdown-item.active");
            if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }

          selectedRemoveTrainingRefId = null;
          trainingInput.value = "";
          if (trainingDisp) trainingDisp.textContent = "None";
          updateRemoveButtons();

          renderTrainingList(trainings);

          removeTrainingInputListener = () => {
            const q = trainingInput.value.toLowerCase().trim();
            const matched = trainings.filter(t => t.name.toLowerCase().includes(q));
            renderTrainingList(matched);
          };
          trainingInput.addEventListener("input", removeTrainingInputListener);

          removeTrainingListListener = (e) => {
            const item = e.target.closest(".dropdown-item");
            if (!item || item.textContent.includes("No trainings")) return;

            const key = item.getAttribute("data-key");
            const name = item.textContent.trim();

            selectedRemoveTrainingRefId = key;
            trainingInput.value = name;
            if (trainingDisp) trainingDisp.textContent = `${name} (${key})`;
            trainingList.style.display = "none";
            updateRemoveButtons();
          };
          trainingList.addEventListener("click", removeTrainingListListener);

          removeTrainingKeydownListener = (e) => {
            const items = trainingList.querySelectorAll(".dropdown-item");
            if (items.length === 0) return;
            let idx = Array.from(items).findIndex(it => it.classList.contains("active"));

            if (e.key === "ArrowDown") {
              e.preventDefault();
              items.forEach(i => i.classList.remove("active"));
              idx = (idx + 1) % items.length;
              items[idx].classList.add("active");
              items[idx].scrollIntoView({ block: "nearest" });
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              items.forEach(i => i.classList.remove("active"));
              idx = (idx - 1 + items.length) % items.length;
              items[idx].classList.add("active");
              items[idx].scrollIntoView({ block: "nearest" });
            } else if (e.key === "Enter" && idx >= 0) {
              e.preventDefault();
              items[idx].click();
            }
          };
          trainingInput.addEventListener("keydown", removeTrainingKeydownListener);

          removeTrainingFocusListener = () => renderTrainingList(trainings);
          trainingInput.addEventListener("focus", removeTrainingFocusListener);
        })
        .catch(err => {
          console.error("Remove training fetch failed:", err);
          trainingList.innerHTML = `<div class="dropdown-item text-danger text-center py-3">Failed to load trainings</div>`;
          trainingList.style.display = "block";
          updateRemoveButtons();
        });
    }

    // Add selected training into textarea list
    document.addEventListener("click", function(e) {
      const btn = e.target.closest("#addToRemoveListBtn");
      if (!btn) return;

      if (!selectedRemoveCourseId || !selectedRemoveTrainingRefId) {
        Swal.fire("Warning", "Please select Course and Training first.", "warning");
        return;
      }
      const trainingInput = document.getElementById("removeTrainingSearchInput");
      const trainingCategory = (trainingInput && trainingInput.value) ? trainingInput.value.trim() : "";
      if (!trainingCategory) {
        Swal.fire("Warning", "Training name missing.", "warning");
        return;
      }
      const trainingId = selectedRemoveTrainingRefId + "-" + trainingCategory.replace(/\s+/g, '');
      const box = document.getElementById("removeTrainingIdsInput");
      if (!box) return;

      const existing = box.value.trim();
      if (!existing) {
        box.value = trainingId;
      } else {
        const items = existing.split(",").map(s => s.trim()).filter(Boolean);
        if (!items.includes(trainingId)) {
          items.push(trainingId);
          box.value = items.join(",");
        }
      }
      toastr.success("Added to remove list");
    });

    // AJAX call for removal
    function removeEnrollmentTrainingData(payload, onDone) {
      $.ajax({
        type: "POST",
        url: "subscription-remove-enrollment-training",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(payload),
        success: function(resp) {
          if (resp && resp.code === "success") {
            toastr.success(resp.message || "Training removed successfully");
            if (typeof onDone === "function") onDone();
          } else {
            Swal.fire("Error", (resp && resp.message) ? resp.message : "Removal failed", "error");
          }
        },
        error: function(xhr, status, error) {
          console.error("[removeEnrollmentTrainingData] error:", error, xhr.responseText);
          Swal.fire("Error", "Something went wrong while removing training", "error");
        }
      });
    }

    // Remove button click (bulk/advanced)
    // ✅ FIX: use closest() + ✅ FIX: SweetAlert confirm compatible
    document.addEventListener("click", function(e) {
      const btn = e.target.closest("#removeTrainingBtn");
      if (!btn) return;

      if (!selectedStudentId) {
        Swal.fire("Warning", "Please select a Student first.", "warning");
        return;
      }
      if (!selectedRemoveCourseId) {
        Swal.fire("Warning", "Please select a Course for removal.", "warning");
        return;
      }

      const box = document.getElementById("removeTrainingIdsInput");
      let removeCsv = (box && box.value) ? box.value.trim() : "";

      if (!removeCsv) {
        if (!selectedRemoveTrainingRefId) {
          Swal.fire("Warning", "Select a Training or paste training IDs in the box.", "warning");
          return;
        }
        const trainingInput = document.getElementById("removeTrainingSearchInput");
        const trainingCategory = (trainingInput && trainingInput.value) ? trainingInput.value.trim() : "";
        if (!trainingCategory) {
          Swal.fire("Warning", "Training name missing.", "warning");
          return;
        }
        removeCsv = selectedRemoveTrainingRefId + "-" + trainingCategory.replace(/\s+/g, '');
      }

      Swal.fire({
        title: "Confirm Removal",
        text: "This will remove training(s) for this student and course.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Yes, Remove"
      }).then((r) => {
        const confirmed = swalConfirmedResult(r);
        if (!confirmed) return;

        const payload = {
          enrolledBy: selectedStudentId,
          productIds: [selectedRemoveCourseId],
          removeTrainingIds: removeCsv
        };

        removeEnrollmentTrainingData(payload, function() {
          getTheCourseDetails(selectedStudentId);
          if (box) box.value = "";
        });
      });
    });

    /* ==========================================================
       ✅ NEW: INLINE “UNASSIGN” (DELETE) from Course Details cards
       ✅ FIX: SweetAlert confirm compatible
    ========================================================== */
    document.addEventListener("click", function(e) {
      const btn = e.target.closest(".js-unassign-training");
      if (!btn) return;

      if (!selectedStudentId) {
        Swal.fire("Warning", "Please select a Student first.", "warning");
        return;
      }

      const courseId = (btn.getAttribute("data-course-id") || "").trim();
      const trainingId = (btn.getAttribute("data-training-id") || "").trim();

      if (!courseId) {
        Swal.fire("Warning", "Course ID missing for this row.", "warning");
        return;
      }

      if (!trainingId) {
        Swal.fire("Warning", "Training ID missing from backend. Cannot unassign.", "warning");
        return;
      }

      Swal.fire({
        title: "Unassign Training?",
        html: `<div style="text-align:left">
                <div><b>Student:</b> ${escHtml(selectedStudentId)}</div>
                <div><b>Course:</b> ${escHtml(courseId)}</div>
                <div><b>Training:</b> ${escHtml(trainingId)}</div>
              </div>`,
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Yes, Unassign",
        cancelButtonText: "Cancel"
      }).then((r) => {
        const confirmed = swalConfirmedResult(r);
        if (!confirmed) return;

        const payload = {
          enrolledBy: selectedStudentId,
          productIds: [courseId],
          removeTrainingIds: trainingId
        };

        removeEnrollmentTrainingData(payload, function() {
          // refresh enrolled list UI instantly
          getTheCourseDetails(selectedStudentId);

          // optional clear bulk box
          const box = document.getElementById("removeTrainingIdsInput");
          if (box) box.value = "";
        });
      });
    });

  </script>
</head>

  <div class="container-fluid">

      <div class="maincontentsec">
        <div id="tab1" class="tab-pane" role="tabpanel">
          <div class="d-flex flex-column flex-lg-row">

            <!-- Left -->
            <div class="box-sec" id="collapseWidthR1">
              <div class="out-box">
                <div class="d-flex justify-content-between bdr-line p-2 tab-header-bar">

                  <ul class="nav nav-pills newtab" role="tablist" id="userTypeTabs">
                    <li class="nav-item" role="presentation">
                      <a class="nav-link active" id="normalTabLink" href="javascript:void(0);">
                        <i class="fa-regular fa-user"></i> Normal User
                      </a>
                    </li>
                    <li class="nav-item" role="presentation">
                      <a class="nav-link" id="publicTabLink" href="javascript:void(0);">
                        <i class="fa-solid fa-bullhorn"></i> Public Batches
                      </a>
                    </li>
                  </ul>

                  <button class="btn btn-primary max-btn" id="collapseButtonR1"
                          onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"

                    <i class="fa-solid fa-maximize" id="expandIconR1"></i>
                    <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                  </button>
                </div>

                <div class="col-md-8 col-12">
                  <div class="d-flex gap-2 search-sec position-relative p-2">
                    <input class="form-control" type="text" onkeydown="enterToSearch(event)"
                           placeholder="Search" id="quickFilter" autocomplete="off">

                <div class="card m-2 p-2">

              </div>
            </div>

            <!-- Right -->
            <div class="box-sec" id="collapseWidthL1">
              <div class="out-box">
                <div class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line tab-header-bar">

                          type="button" onclick="triggerExpansionL(1)"
                          data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                    <i class="fa-solid fa-maximize" id="expandIconL1"></i>
                    <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                  </button>

                  <div class="d-flex gap-2">
                    <ul class="nav nav-pills newtab" role="tablist" id="tabMenu">
                      <li class="nav-item" role="presentation" id="student-profile">
                        <a class="nav-link active" data-bs-toggle="pill" href="#studentProfile" aria-selected="false" role="tab">
                          <i class="fa-regular fa-id-card"></i> Profile
                        </a>
                      </li>
                      <li class="nav-item" role="presentation" id="course-details">
                        <a class="nav-link" data-bs-toggle="pill" href="#courseDetails" aria-selected="true" role="tab">
                          <i class="fa-solid fa-layer-group"></i> Course Details
                        </a>
                      </li>
                      <li class="nav-item" role="presentation" id="course-training">
                        <a class="nav-link" data-bs-toggle="pill" href="#courseTraining" aria-selected="true" role="tab">
                          <i class="fa-solid fa-plus"></i> Add Training
                        </a>
                      </li>
                    </ul>
                  </div>
                </div>

                <div class="tab-content flex-fill" id="tabContent">
                  <div class="tab-pane active show h-100" role="tabpanel" id="studentProfile">
                    <div class="requisition-tbl d-flex flex-column p-2 gap-2 h-100">
                      <div class="d-flex justify-content-end border p-2 rounded">
                        <button class="btn m-0 edit-btn" type="button" onclick="nextTab('course-details')">Next</button>
                      </div>
                      <div class="card p-2">
                        <div id="student-profile-container">
                          <div class="no-selection">
                            <p>Select a student from the grid to view details</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="tab-pane show p-2 h-100" id="courseDetails" role="tabpanel">
                    <div class="requisition-tbl d-flex flex-column h-100">
                      <div class="d-flex justify-content-end">
                        <button class="btn m-0 edit-btn" type="button" onclick="nextTab('student-profile')">Previous</button>
                        <button class="btn m-0 edit-btn" type="button" onclick="nextTab('course-training')">Next</button>
                      </div>

                      <!-- ✅ Course Details Cards + Inline Unassign buttons -->
                      <div id="courseCard" class="container mt-3" style="max-height: 280px; overflow-y: auto;"></div>

                      <!-- Advanced/Bulk Remove UI (kept) -->
                      <div id="courseRemoveContainer" class="container mt-3"></div>
                    </div>
                  </div>

                  <div class="tab-pane show p-2 h-100" id="courseTraining" role="tabpanel">
                    <div class="requisition-tbl d-flex flex-column h-100">
                      <div class="d-flex justify-content-end">
                        <button class="btn m-0 edit-btn" type="button" onclick="nextTab('course-details')">Previous</button>
                      </div>

                      <!-- IMPORTANT: unique id used by JS to render the dynamic UI -->
                      <div id="courseTrainingContainer" class="container mt-3" style="max-height: 500px; overflow-y: auto;"></div>
                    </div>
                  </div>

                </div><!-- tab-content -->
              </div><!-- out-box -->
            </div><!-- box-sec -->
          </div><!-- flex -->
        </div><!-- tab1 -->
      </div><!-- maincontentsec -->
    </div><!-- d-flex -->
