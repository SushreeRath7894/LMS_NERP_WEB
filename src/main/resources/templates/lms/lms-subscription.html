<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>

<style type="text/css">
/* --------------------------------------------
   EXISTING STYLES (kept) + MODERN TAB REDESIGN
---------------------------------------------*/
.ag-theme-alpine { height: calc(100vh - 100px); }

.subject-card {
	background-color: #bf05ff;
	border-radius: 10px;
	padding: 15px;
	margin-bottom: 15px;
	color: white;
}
.subject-card p { margin: 0; font-size: 12px; font-weight: 400; color: #ffffff9e; }
.subject-card h5 { margin: 0 0 5px; color: white; }

.nav-pills { gap: 3px; }

.step-line {
	background: #e0e0e0;
	height: 2px;
	width: 35vw;
	position: absolute;
	top: 30px;
	z-index: 1;
}

.nav-pills.custom li { background: transparent; margin: 0 30px; z-index: 2; }
.nav-link.active.custom { background-color: #bf05ff; color: white; }
.nav-link.custom { color: inherit; border: 1px solid #bf05ff; width: 93px; }

.tab-content.custom { display: flex; justify-content: space-between; gap: 5px; }
.tab-content.custom .tab-pane { width: 50vw; }

.document-link {
	color: rgb(191, 5, 255);
	text-decoration: none;
	font-weight: bold;
}
.document-link:hover { color: #9b04d3; text-decoration: underline; }

.btn-group button {
	background-color: #04AA6D;
	border: 1px solid green;
	color: white;
	padding: 10px 24px;
	cursor: pointer;
	float: left;
	min-width: 45vw;
	border-radius: 5px;
}
.btn-group:after { content: ""; clear: both; display: table; }
.btn-group button:not(:last-child) { border-right: none; }
.btn-group button:hover { background-color: #3e8e41; }

#enable {
	font-weight: 700;
	background-color: #667eea !important;
	color: white !important;
}

/* Grid tweaks */
.ag-theme-alpine {
	--ag-foreground-color: rgb(55, 65, 81);
	--ag-secondary-foreground-color: rgb(55, 65, 81);
	--ag-grid-size: 8px;
	--ag-list-item-height: 28px;
}
.ag-theme-alpine .ag-cell {
	display: flex;
	align-items: center;
	padding: 0 12px;
}

/* Buttons */
.go-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 0.5rem 1rem;
	border-radius: 0.6rem;
	font-weight: 600;
	transition: all 0.2s ease;
	border: none;
}
.go-btn:hover {
	transform: translateY(-1px);
	box-shadow: 0 10px 18px -12px rgba(0, 0, 0, 0.35);
}
.go-btn:active { transform: translateY(0); }
.go-btn i { font-size: 1.1em; }

/* Student profile card */
.student-profile-card { padding: 20px; }
.profile-header-subs {
	display: flex;
	margin-bottom: 20px;
	text-align: left !important;
	padding: 18px 18px;
	background-color: #f5f2e7;
	border-radius: 14px;
	border: 1px solid rgba(15, 23, 42, 0.06);
}
.profile-avatar-subs {
	width: 80px;
	height: 80px;
	border-radius: 50%;
	object-fit: cover;
	margin-right: 18px !important;
	border: 3px solid #667eea;
	position: relative;
}
.profile-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 2px; color:#0f172a; }
.profile-email { color: #6b7280; font-size: 0.9rem; }

.profile-details { margin-bottom: 20px; }
.detail-row { display: flex; margin-bottom: 10px; }
.detail-label { font-weight: 700; color: #4b5563; width: 140px; }
.detail-value { color: #374151; }

.status-badge {
	display: inline-block;
	padding: 0.25rem 0.6rem;
	border-radius: 999px;
	font-size: 0.75rem;
	font-weight: 800;
}
.status-active { background-color: #dcfce7; color: #16a34a; }
.status-inactive { background-color: #fee2e2; color: #dc2626; }

.payment-status {
	display: inline-block;
	padding: 0.25rem 0.6rem;
	border-radius: 999px;
	font-size: 0.75rem;
	font-weight: 800;
}
.payment-paid { background-color: #dcfce7; color: #16a34a; }
.payment-unpaid { background-color: #fee2e2; color: #dc2626; }
.payment-pending { background-color: #fef3c7; color: #d97706; }

.action-buttons { display: flex; gap: 10px; margin-top: 20px; }
.no-selection {
	display: flex;
	align-items: center;
	justify-content: center;
	height: 100%;
	color: #6b7280;
	font-size: 1.05rem;
}

/* Course cards */
.course-card {
	border: 1px solid rgba(15, 23, 42, 0.10);
	border-radius: 14px;
	padding: 14px 16px;
	margin-bottom: 12px;
	background: linear-gradient(180deg, #ffffff 0%, #fbfbff 100%);
	box-shadow: 0 10px 20px -18px rgba(0,0,0,0.45);
}
.course-header {
	font-size: 16px;
	font-weight: 800;
	color: #2563eb;
	margin-bottom: 8px;
	letter-spacing: .2px;
}
.training-list { list-style-type: disc; padding-left: 20px; margin: 0; }
.training-list li { margin-bottom: 4px; font-size: 14px; color: #334155; }

/* Dropdown */
.dropdown-search { position: relative; margin-bottom: 1.25rem; }
.dropdown-list {
	position: absolute;
	top: 100%; left: 0; right: 0;
	background: white;
	border: 1px solid #e5e7eb;
	border-top: none;
	max-height: 300px;
	overflow-y: auto;
	z-index: 1000;
	display: none;
	box-shadow: 0 14px 24px -20px rgba(0,0,0,0.55);
	border-radius: 0 0 0.9rem 0.9rem;
}
.dropdown-item {
	padding: 10px 14px;
	cursor: pointer;
	transition: background-color 0.15s ease;
}
.dropdown-item:hover { background-color: #f1f5f9; }
.dropdown-item.active { background-color: #2563eb; color: #fff; }
.dropdown-list::-webkit-scrollbar { width: 8px; }
.dropdown-list::-webkit-scrollbar-track { background: #f1f1f1; }
.dropdown-list::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 4px; }
.dropdown-list::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

/* --------------------------------------------
   MODERN / ADVANCED TAB STYLING (NO JS BREAK)
   - Keeps IDs and structure intact
---------------------------------------------*/

/* Small "tab header bar" look */
.tab-header-bar {
	background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
	border: 1px solid rgba(15, 23, 42, 0.08);
	border-radius: 14px;
	padding: 10px 12px;
	box-shadow: 0 14px 28px -26px rgba(0,0,0,0.65);
}

/* Left (Normal/Public) segmented tabs */
#userTypeTabs {
	background: #f1f5f9;
	border: 1px solid rgba(15, 23, 42, 0.08);
	border-radius: 999px;
	padding: 4px;
	gap: 6px;
}
#userTypeTabs .nav-item { margin: 0; }
#userTypeTabs .nav-link {
	border: none !important;
	border-radius: 999px !important;
	padding: 9px 14px;
	font-weight: 800;
	font-size: 13px;
	color: #334155;
	display: inline-flex;
	align-items: center;
	gap: 8px;
	transition: all .18s ease;
	white-space: nowrap;
}
#userTypeTabs .nav-link:hover {
	transform: translateY(-1px);
	background: rgba(37, 99, 235, 0.08);
}
#userTypeTabs .nav-link.active {
	background: linear-gradient(135deg, #bf05ff 0%, #667eea 60%, #2563eb 100%);
	color: #fff;
	box-shadow: 0 14px 22px -18px rgba(102,126,234,0.85);
}

/* Right (Profile/Course/Add) modern pill tabs */
#tabMenu {
	background: #ffffff;
	border: 1px solid rgba(15, 23, 42, 0.08);
	border-radius: 999px;
	padding: 4px;
	gap: 6px;
	box-shadow: 0 14px 28px -26px rgba(0,0,0,0.65);
	flex-wrap: wrap;
}
#tabMenu .nav-link {
	border: none !important;
	border-radius: 999px !important;
	padding: 9px 14px;
	font-weight: 800;
	font-size: 13px;
	color: #334155;
	display: inline-flex;
	align-items: center;
	gap: 8px;
	transition: all .18s ease;
	white-space: nowrap;
	position: relative;
}
#tabMenu .nav-link:hover {
	transform: translateY(-1px);
	background: rgba(191, 5, 255, 0.08);
}
#tabMenu .nav-link.active {
	background: #0f172a;
	color: #fff;
	box-shadow: 0 18px 26px -22px rgba(15,23,42,0.9);
}
#tabMenu .nav-link.active::after {
	content: "";
	position: absolute;
	left: 18px;
	right: 18px;
	bottom: -6px;
	height: 3px;
	border-radius: 999px;
	background: linear-gradient(90deg, #bf05ff 0%, #667eea 55%, #2563eb 100%);
	box-shadow: 0 12px 18px -16px rgba(102,126,234,0.9);
}

/* Search bar modern */
.search-sec input.form-control{
	border-radius: 12px;
	border: 1px solid rgba(15,23,42,0.10);
	padding: 10px 12px;
	box-shadow: 0 10px 18px -22px rgba(0,0,0,0.55);
}
.search-sec .go-btn{
	border-radius: 12px;
	font-weight: 800;
}

/* Make tab header areas look premium */
.bdr-line.p-2 {
	background: transparent;
}

/* Responsive niceties */
@media (max-width: 992px) {
	#userTypeTabs { border-radius: 16px; padding: 6px; }
	#tabMenu { border-radius: 16px; }
	#userTypeTabs .nav-link, #tabMenu .nav-link { padding: 10px 12px; font-size: 12px; }
}
</style>

<script type="text/javascript">

/* -----------------------------
   GLOBALS
------------------------------*/
var tb = 'Normal User';

// stores BOTH Normal + Public in one place
var allStudentData = [];

/* -----------------------------
   GRID DEFINITIONS
------------------------------*/
var columnDefs = [
    {
        headerCheckboxSelection: true,
        headerCheckboxSelectionFilteredOnly: true,
        checkboxSelection: true,
        width: 10,
        sortable: false,
        filter: false,
        resizable: true,
        pinned: 'left',
    },
    { headerName: "Enroll Id", field: "enrollId" },
    { headerName: "User Name", field: "studentName" },
    { headerName: "User Id", field: "studentId", hide: true },
    { headerName: "Course Name", field: "courseName" },
    { headerName: "Course Id", field: "courseId", hide: true },
    { headerName: "Email", field: "email" },
    {
        headerName: "Status",
        field: "userStatus",
        cellStyle: function(params) {
            if (params.value === 'Active') return { color: '#16a34a', fontWeight: '500' };
            if (params.value === 'Inactive') return { color: '#dc2626', fontWeight: '500' };
            return null;
        }
    },
    {
        headerName: "Enroll Date",
        field: "enrollDate",
        cellRenderer: function(params) {
            return params.value ? new Date(params.value).toLocaleDateString() : '';
        }
    },
    { headerName: "Phone Number", field: "phoneNo" },
    { headerName: "Nationality", field: "nationality" },
    {
        headerName: "Payment Status",
        field: "paymentStaus",
        cellStyle: function(params) {
            if (params.value === 'PAID') return { color: '#16a34a', fontWeight: '500' };
            if (params.value === 'UNPAID') return { color: '#dc2626', fontWeight: '500' };
            if (params.value === 'PENDING') return { color: '#d97706', fontWeight: '500' };
            return null;
        }
    },
    {
        headerName: "Payment Mode",
        field: "paymentMode",
        cellStyle: function(params) {
            if (params.value) return { color: '#2563eb', fontWeight: '500' };
            return null;
        }
    }
];

var gridOptions = {
    columnDefs: columnDefs,
    rowSelection: 'single',
    suppressRowClickSelection: true,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 185,
        height: 10
    },
    pagination: true,
    paginationPageSize: 15,
    onGridReady: function(params) {
        window.gridApi = params.api;
        window.gridOptionsCourse = params.api;
    },
    onSelectionChanged: onSelectionChanged,
};

// reusable checkbox column
const checkboxCol = {
    headerCheckboxSelection: true,
    headerCheckboxSelectionFilteredOnly: true,
    checkboxSelection: true,
    width: 50,
    minWidth: 50,
    maxWidth: 50,
    sortable: false,
    filter: false,
    resizable: false,
    pinned: 'left',
    lockPosition: true,
    suppressMenu: true,
    cellClass: 'ag-checkbox-column'
};

/* -----------------------------
   INIT
------------------------------*/
$(document).ready(function() {
    var gridDivm = document.querySelector('#mygrid');
    new agGrid.Grid(gridDivm, gridOptions);

    // Load BOTH tabs once, then filter locally
    loadAllStudentsOnce();

    // ✅ IMPORTANT FIX: Only toggle left tab active states (do NOT touch right side tabs)
    $('#normalTabLink').on('click', function(e) {
        e.preventDefault();
        console.log("[TAB CLICK] Normal User");
        $('#userTypeTabs .nav-link').removeClass('active');
        $(this).addClass('active');
        tb = 'Normal User';
        filterGridData(tb);
    });

    $('#publicTabLink').on('click', function(e) {
        e.preventDefault();
        console.log("[TAB CLICK] Public Batches");
        $('#userTypeTabs .nav-link').removeClass('active');
        $(this).addClass('active');
        tb = 'Public Batches';
        filterGridData(tb);
    });
});

/* -----------------------------
   HELPERS (SAFE PARSE + NORMALIZE)
------------------------------*/
function safeParseBody(body) {
    if (!body) return {};
    if (typeof body === "object") return body;
    try { return JSON.parse(body); } catch (e) { return {}; }
}

function normalizeRow(row, tabName) {
    const r = Object.assign({}, row || {});
    if (!r.enrollId && r.studentId) r.enrollId = r.studentId;
    if (!r.studentId && r.enrollId) r.studentId = r.enrollId;

    if (r.paymentStatus && !r.paymentStaus) r.paymentStaus = r.paymentStatus;
    if (r.paymentStaus && !r.paymentStatus) r.paymentStatus = r.paymentStaus;

    r.__tab = tabName;
    return r;
}

/* -----------------------------
   LOAD ALL DATA ONCE
------------------------------*/
function loadAllStudentsOnce() {
    console.log("[loadAllStudentsOnce] started");

    const urlNormal = "subscription-student-view?id=" + encodeURIComponent("Normal User");
    const urlPublic = "subscription-student-view?id=" + encodeURIComponent("Public Batches");

    const reqNormal = agGrid.simpleHttpRequest({ url: urlNormal });
    const reqPublic = agGrid.simpleHttpRequest({ url: urlPublic });

    Promise.all([reqNormal, reqPublic])
        .then(function([resNormal, resPublic]) {
            console.log("[loadAllStudentsOnce] normal response:", resNormal);
            console.log("[loadAllStudentsOnce] public response:", resPublic);

            let merged = [];

            if (resNormal && resNormal.message === "Success") {
                const b1 = safeParseBody(resNormal.body);
                const arr1 = (b1.studentData || []).map(r => normalizeRow(r, "Normal User"));
                merged = merged.concat(arr1);
            }

            if (resPublic && resPublic.message === "Success") {
                const b2 = safeParseBody(resPublic.body);
                const arr2 = (b2.studentData || []).map(r => normalizeRow(r, "Public Batches"));
                merged = merged.concat(arr2);
            }

            merged.sort((a, b) => {
                const aId = String(a.studentId || "").replace(/\D/g, "");
                const bId = String(b.studentId || "").replace(/\D/g, "");
                return (parseInt(bId || "0", 10) - parseInt(aId || "0", 10));
            });

            allStudentData = merged;

            console.log("[loadAllStudentsOnce] merged length:", allStudentData.length);
            console.log("[loadAllStudentsOnce] merged sample:", allStudentData.slice(0, 5));

            filterGridData(tb);
        })
        .catch(function(err) {
            console.error("[loadAllStudentsOnce] failed:", err);
        });
}

// kept for compatibility
function getStudentDetails(type) {
    if (type) tb = type;
    loadAllStudentsOnce();
}

/* -----------------------------
   FILTER GRID LOCALLY
------------------------------*/
function filterGridData(type) {
    console.log("[filterGridData] type =", type);

    const filtered = allStudentData.filter(r => r.__tab === type);

    console.log("[filterGridData] filtered length =", filtered.length);
    console.log("[filterGridData] filtered sample =", filtered.slice(0, 5));

    let defs = [checkboxCol];

    defs.push(
        {
            headerName: "Enroll ID",
            valueGetter: function(params) {
                const d = params.data || {};
                return (d.enrollId || d.studentId || "").toString();
            },
            width: 150
        },
        { headerName: "Student Name", field: "studentName", width: 180 },
        { headerName: "Email", field: "email", width: 220 },
        { headerName: "Phone", field: "phoneNo", width: 150 },
        { headerName: "Course Name", field: "courseName", width: 350, tooltipField: "courseName" }
    );

    if (type === "Public Batches") {
        defs.push(
            { headerName: "Batch Title", field: "batchTitle", width: 200 },
            { headerName: "Batch Start Date", field: "batchStartDate", width: 180 },
            { headerName: "Batch End Date", field: "batchEndDate", width: 180 },
            { headerName: "From Time", field: "batchFromTime", width: 140 },
            { headerName: "To Time", field: "batchToTime", width: 140 }
        );
    }

    window.gridApi.setColumnDefs(defs);
    window.gridApi.setRowData(filtered);

    if (filtered.length > 0) {
        window.gridApi.deselectAll();
        window.gridApi.getDisplayedRowAtIndex(0).setSelected(true);
    } else {
        document.getElementById('student-profile-container').innerHTML =
            `<div class="no-selection">
                <p>No students found in this category.</p>
             </div>`;
    }
}

/* -----------------------------
   SELECTION CHANGE
------------------------------*/
function onSelectionChanged() {
    var selectedNodes = window.gridApi.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);

    if (selectedData.length > 0) {
        updateStudentProfile(selectedData[0]);

        var enrollId = selectedData[0].enrollId || selectedData[0].studentId;

        getTheCourseDetails(enrollId);
        getCourseDetails();
    } else {
        document.getElementById('student-profile-container').innerHTML = `
            <div class="no-selection">
                <p>Select a student from the grid to view details</p>
            </div>
        `;
    }
}

/* -----------------------------
   PROFILE RENDER
------------------------------*/
function updateStudentProfile(studentData) {
    const enrollDate = studentData.enrollDate ? new Date(studentData.enrollDate).toLocaleDateString() : 'N/A';
    const statusClass = studentData.userStatus === 'Active' ? 'status-active' : 'status-inactive';

    let paymentClass = '';
    if (studentData.paymentStaus === 'PAID') paymentClass = 'payment-paid';
    else if (studentData.paymentStaus === 'UNPAID') paymentClass = 'payment-unpaid';
    else if (studentData.paymentStaus === 'PENDING') paymentClass = 'payment-pending';

    const image = studentData.candidateImage
        ? studentData.candidateImage
        : `https://ui-avatars.com/api/?name=${encodeURIComponent(studentData.studentName)}&background=667eea&color=fff&size=80`;

    const profileHtml = `
        <div class="student-profile-card">
            <div class="profile-header-subs">
                <img src="${image}" alt="Profile" class="profile-avatar-subs">
                <div>
                    <h3 class="profile-name">${studentData.studentName || 'N/A'}</h3>
                    <p class="profile-email">${studentData.email || 'N/A'}</p>
                    <span class="status-badge ${statusClass}">${studentData.userStatus || 'N/A'}</span>
                </div>
            </div>

            <div class="profile-details">
                <div class="detail-row">
                    <span class="detail-label">Enrollment ID:</span>
                    <span class="detail-value">${studentData.enrollId || studentData.studentId || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Course:</span>
                    <span class="detail-value">${studentData.courseName || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Enrollment Date:</span>
                    <span class="detail-value">${enrollDate}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Phone:</span>
                    <span class="detail-value">${studentData.phoneNo || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Nationality:</span>
                    <span class="detail-value">${studentData.nationality || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Status:</span>
                    <span class="payment-status ${paymentClass}">${studentData.paymentStaus || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Mode:</span>
                    <span class="detail-value">${studentData.paymentMode || 'N/A'}</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="go-btn btn-success" onclick="enableCourse(1)">
                    <i class="fas fa-check-circle me-2"></i> Enable
                </button>
                <button class="go-btn btn-danger" onclick="enableCourse(0)">
                    <i class="fas fa-times-circle me-2"></i> Disable
                </button>
            </div>
        </div>
    `;

    document.getElementById('student-profile-container').innerHTML = profileHtml;
}

/* -----------------------------
   ENABLE / DISABLE
------------------------------*/
function enableCourse(status) {
    var selectedNodes = window.gridApi.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);

    if (selectedData.length > 0) {
        var studentId = selectedData[0].studentId || selectedData[0].enrollId;

        $.ajax({
            type: "GET",
            url: "subscription-student-course-enable?studentId=" + encodeURIComponent(studentId) + "&status=" + encodeURIComponent(status),
            success: function(response) {
                console.log("[enableCourse] response:", response);
                if (response.message === "Success") {
                    toastr.success("Course updated successfully");
                    getStudentDetails(tb);
                } else {
                    toastr.error("Something went wrong: " + response.message);
                }
            },
            error: function(err) {
                console.error("[enableCourse] error:", err);
                toastr.error("Request failed");
            }
        });
    } else {
        toastr.warning("Please select a student row");
    }
}

/* -----------------------------
   GRID SEARCH
------------------------------*/
function onQuickFilterChanged() { gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value); }
function reset() { document.getElementById('quickFilter').value = ''; gridOptions.api.setQuickFilter(''); }
function enterToSearch(event) { if (event.key === 'Enter') onQuickFilterChanged(); }

/* -----------------------------
   COURSE DETAILS
------------------------------*/
function getTheCourseDetails(enrollId) {
    $.ajax({
        url: 'subscription-get-course-details?enrollId=' + encodeURIComponent(enrollId),
        type: 'GET',
        success: function (response) {
            const body = typeof response.body === 'string'
                ? JSON.parse(response.body)
                : response.body;

            $('#courseCard').empty();

            if (!body.enrollCourses || body.enrollCourses.length === 0) {
                $('#courseCard').html('<p class="text-muted">No courses found.</p>');
                return;
            }

            const courseMap = new Map();

            body.enrollCourses.forEach(course => {
                const key = course.courseName;
                if (!courseMap.has(key)) {
                    courseMap.set(key, course.trainingDetails || []);
                } else {
                    const existingTrainings = courseMap.get(key);
                    (course.trainingDetails || []).forEach(tr => {
                        if (!existingTrainings.some(e => e.trainingCategory === tr.trainingCategory)) {
                            existingTrainings.push(tr);
                        }
                    });
                    courseMap.set(key, existingTrainings);
                }
            });

            courseMap.forEach((trainings, courseName) => {
                const courseDiv = $('<div class="course-card"></div>');
                const courseHeader = $(`<div class="course-header">${courseName}</div>`);
                courseDiv.append(courseHeader);

                if (trainings.length > 0) {
                    const trainingList = $('<ul class="training-list"></ul>');
                    trainings.forEach(training => {
                        const li = $('<li></li>').text(training.trainingCategory);
                        trainingList.append(li);
                    });
                    courseDiv.append(trainingList);
                } else {
                    courseDiv.append('<p class="text-muted">No trainings available.</p>');
                }

                $('#courseCard').append(courseDiv);
            });
        },
        error: function () {
            $('#courseCard').html('<p class="text-danger">Failed to load course details.</p>');
        }
    });
}

function nextTab(id) {
    const tabElement = document.querySelector('#' + id + ' a');
    const tab = new bootstrap.Tab(tabElement);
    tab.show();
}

/* -----------------------------
   ADD TRAINING TAB
------------------------------*/
let selectedCourseId = null;
let selectedTrainingRefId = null;

let trainingInputListener = null;
let trainingListListener = null;
let trainingKeydownListener = null;
let trainingFocusListener = null;

function updateAssignButton() {
    const btn = document.getElementById("assignTrainingBtn");
    if (btn) btn.style.display = (selectedCourseId && selectedTrainingRefId) ? "inline-block" : "none";
}

function getCourseDetails() {
    agGrid.simpleHttpRequest({
        url: "academic-course-view"
    }).then(function (response) {
        if (response.message === "Success") {
            let courseData = [];
            try {
                const responseBody = JSON.parse(response.body);
                courseData = responseBody.courseData || [];
            } catch (e) {
                console.error("JSON parse error:", e);
                courseData = [];
            }

            const allowedCategories = ["ICAT0006", "ICAT0015"];
            const filteredCourses = courseData
                .filter(course => course.status === "Active" && allowedCategories.includes(course.parentCategoryId))
                .map(course => ({
                    key: course.courseId,
                    name: course.courseTittle.trim()
                }))
                .sort((a, b) => a.name.localeCompare(b.name));

            const container = document.getElementById("courseTrainingContainer");
            if (!container) return;

            container.innerHTML = `
                <h4 class="mb-4">Select Course & Training</h4>

                <label for="courseSearchInput" class="form-label fw-bold">1. Select Course</label>
                <div class="dropdown-search">
                    <input type="text" class="form-control" id="courseSearchInput" placeholder="Type to search course..." autocomplete="off" />
                    <div id="courseDropdownList" class="dropdown-list"></div>
                </div>

                <div id="trainingSection" style="display: none;">
                    <label for="trainingSearchInput" class="form-label fw-bold">2. Select Training Type</label>
                    <div class="dropdown-search">
                        <input type="text" class="form-control" id="trainingSearchInput" placeholder="Type to search training..." autocomplete="off" />
                        <div id="trainingDropdownList" class="dropdown-list"></div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Training Price:</label>
                        <input type="text" class="form-control" id="trainingPriceDisplay" readonly placeholder="Select a training to see price" />
                    </div>

                    <div class="mt-3">
                        <strong>Selected Training:</strong>
                        <span id="selectedTrainingDisplay" class="text-primary fw-semibold">None</span>
                    </div>
                </div>

                <div class="mt-4">
                    <strong>Selected Course:</strong>
                    <span id="selectedCourseDisplay" class="text-success fw-semibold">None</span>
                </div>

                <div class="d-flex justify-content-end border p-2 rounded mt-4">
                    <button class="btn btn-success m-0 edit-btn" type="button" id="assignTrainingBtn">
                        Assign Training
                    </button>
                </div>
            `;

            selectedCourseId = null;
            selectedTrainingRefId = null;
            updateAssignButton();

            const courseInput = document.getElementById("courseSearchInput");
            const courseList = document.getElementById("courseDropdownList");
            const selectedCourseDisplay = document.getElementById("selectedCourseDisplay");

            function renderCourseList(courses) {
                if (courses.length === 0) {
                    courseList.innerHTML = `<div class="dropdown-item text-muted text-center py-3">No courses found</div>`;
                } else {
                    courseList.innerHTML = courses.map((c, i) => `
                        <div class="dropdown-item ${i === 0 ? 'active' : ''}" data-key="${c.key}">${c.name}</div>
                    `).join("");
                }
                courseList.style.display = "block";
                const active = courseList.querySelector(".active");
                if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }

            renderCourseList(filteredCourses);

            courseInput.addEventListener("input", () => {
                const q = courseInput.value.toLowerCase().trim();
                const matched = filteredCourses.filter(c => c.name.toLowerCase().includes(q));
                renderCourseList(matched);
            });

            courseList.addEventListener("click", (e) => {
                const item = e.target.closest(".dropdown-item");
                if (!item || item.textContent.includes("No courses")) return;

                const key = item.getAttribute("data-key");
                const name = item.textContent.trim();

                selectedCourseId = key;
                courseInput.value = name;
                selectedCourseDisplay.textContent = `${name} (${key})`;
                courseList.style.display = "none";

                getTrainingDetails(key);
                updateAssignButton();
            });

            courseInput.addEventListener("keydown", (e) => {
                const items = courseList.querySelectorAll(".dropdown-item");
                if (items.length === 0) return;
                let idx = Array.from(items).findIndex(it => it.classList.contains("active"));

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    items.forEach(i => i.classList.remove("active"));
                    idx = (idx + 1) % items.length;
                    items[idx].classList.add("active");
                    items[idx].scrollIntoView({ block: "nearest" });
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    items.forEach(i => i.classList.remove("active"));
                    idx = (idx - 1 + items.length) % items.length;
                    items[idx].classList.add("active");
                    items[idx].scrollIntoView({ block: "nearest" });
                } else if (e.key === "Enter" && idx >= 0) {
                    e.preventDefault();
                    items[idx].click();
                }
            });

            courseInput.addEventListener("focus", () => renderCourseList(filteredCourses));

            document.addEventListener("click", (e) => {
                if (!container.contains(e.target)) courseList.style.display = "none";
            });
        }
    }).catch(err => {
        console.error("Failed to load courses:", err);
        const container = document.getElementById("courseTrainingContainer");
        if (container) container.innerHTML = `<div class="alert alert-danger">Failed to load courses.</div>`;
    });
}

function getTrainingDetails(courseId) {
    console.log("Loading trainings for course:", courseId);

    const trainingInput = document.getElementById("trainingSearchInput");
    const trainingList = document.getElementById("trainingDropdownList");

    if (!trainingInput || !trainingList) {
        console.error("Dropdown elements missing");
        return;
    }

    if (trainingInputListener) trainingInput.removeEventListener("input", trainingInputListener);
    if (trainingListListener) trainingList.removeEventListener("click", trainingListListener);
    if (trainingKeydownListener) trainingInput.removeEventListener("keydown", trainingKeydownListener);
    if (trainingFocusListener) trainingInput.removeEventListener("focus", trainingFocusListener);

    fetch("academic-training-view?id=" + encodeURIComponent(courseId))
        .then(response => {
            if (!response.ok) throw new Error("Network error: " + response.status);
            return response.json();
        })
        .then(data => {
            const trainingSection = document.getElementById("trainingSection");
            const priceDisplay = document.getElementById("trainingPriceDisplay");
            const selectedTrainingDisplay = document.getElementById("selectedTrainingDisplay");

            let trainingData = [];
            if (data.message === "Success" && data.body && data.body.length > 0) {
                try {
                    const jsonString = data.body[0];
                    const parsed = JSON.parse(jsonString);
                    trainingData = parsed.courseCategoryType || [];
                } catch (e) {
                    console.error("Parse error:", e);
                }
            }

            const trainings = trainingData.map(t => ({
                key: t.trainingRefId,
                name: t.trainingCategory ? t.trainingCategory.trim() : "Unknown",
                price: (t.trainingPrice && t.trainingPrice !== "") ? t.trainingPrice : "N/A"
            }));

            trainingSection.style.display = "block";
            trainingInput.value = "";
            priceDisplay.value = "";
            selectedTrainingDisplay.textContent = "None";
            selectedTrainingRefId = null;

            updateAssignButton();

            function renderTrainingList(list) {
                if (list.length === 0) {
                    trainingList.innerHTML = `<div class="dropdown-item text-muted text-center py-3">No trainings available</div>`;
                } else {
                    trainingList.innerHTML = list.map((t, i) => `
                        <div class="dropdown-item ${i === 0 ? 'active' : ''}"
                             data-key="${t.key}"
                             data-price="${t.price}">
                            <div class="d-flex justify-content-between align-items-center">
                                <span>${t.name}</span>
                                ${t.price !== "N/A" ? `<span class="badge bg-success price-badge">₹${t.price}</span>` : ''}
                            </div>
                        </div>
                    `).join("");
                }
                trainingList.style.display = "block";
                const active = trainingList.querySelector(".dropdown-item.active");
                if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }

            renderTrainingList(trainings);

            trainingInputListener = () => {
                const q = trainingInput.value.toLowerCase().trim();
                const matched = trainings.filter(t => t.name.toLowerCase().includes(q));
                renderTrainingList(matched);
            };
            trainingInput.addEventListener("input", trainingInputListener);

            trainingListListener = (e) => {
                const item = e.target.closest(".dropdown-item");
                if (!item || item.textContent.includes("No trainings")) return;

                const key = item.getAttribute("data-key");
                const price = item.getAttribute("data-price");
                const name = item.querySelector("span:first-child").textContent.trim();

                selectedTrainingRefId = key;
                trainingInput.value = name;
                priceDisplay.value = price !== "N/A" ? "₹" + price : "";
                priceDisplay.placeholder = (price === "N/A") ? "No price available" : "";
                selectedTrainingDisplay.textContent = `${name} (${key})`;

                trainingList.style.display = "none";
                updateAssignButton();
            };
            trainingList.addEventListener("click", trainingListListener);

            trainingKeydownListener = (e) => {
                const items = trainingList.querySelectorAll(".dropdown-item");
                if (items.length === 0) return;
                let idx = Array.from(items).findIndex(it => it.classList.contains("active"));

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    items.forEach(i => i.classList.remove("active"));
                    idx = (idx + 1) % items.length;
                    items[idx].classList.add("active");
                    items[idx].scrollIntoView({ block: "nearest", behavior: "smooth" });
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    items.forEach(i => i.classList.remove("active"));
                    idx = (idx - 1 + items.length) % items.length;
                    items[idx].classList.add("active");
                    items[idx].scrollIntoView({ block: "nearest", behavior: "smooth" });
                } else if (e.key === "Enter" && idx >= 0) {
                    e.preventDefault();
                    items[idx].click();
                }
            };
            trainingInput.addEventListener("keydown", trainingKeydownListener);

            trainingFocusListener = () => renderTrainingList(trainings);
            trainingInput.addEventListener("focus", trainingFocusListener);
        })
        .catch(error => {
            console.error("Fetch failed:", error);
            const trainingSection = document.getElementById("trainingSection");
            if (trainingSection) {
                trainingSection.style.display = "block";
                trainingSection.innerHTML += `<div class="alert alert-danger mt-3">Failed to load trainings: ${error.message}</div>`;
            }
            updateAssignButton();
        });
}

/* -----------------------------
   ASSIGN BUTTON HANDLER
------------------------------*/
document.addEventListener("click", function(e) {
    if (e.target && e.target.id === "assignTrainingBtn") {
        const selectedNodes = window.gridApi?.getSelectedNodes() || [];
        const student = selectedNodes.length ? selectedNodes[0].data : null;
        const enrolledBy = student ? (student.studentId || student.enrollId) : null;

        if (!selectedCourseId || !selectedTrainingRefId) {
            Swal.fire("Warning", "Please select both Course and Training", "warning");
            return;
        }

        if (!enrolledBy) {
            Swal.fire("Error", "No student selected.", "error");
            return;
        }

        const trainingInput = document.getElementById("trainingSearchInput");
        const trainingCategory = (trainingInput && trainingInput.value) ? trainingInput.value.trim() : "";
        const trainingId = selectedTrainingRefId + "-" + trainingCategory.replace(/\s+/g, '');

        const enrollmentData = {
            productIds: [selectedCourseId],
            trainingId: trainingId,
            enrolledBy: enrolledBy,
            paymentMethod: "none"
        };

        console.log("Sending enrollment:", enrollmentData);
        saveEnrollmentData(enrollmentData);
    }
});

function saveEnrollmentData(data) {
    console.log("Sending to server:", data);

    $.ajax({
        type: "POST",
        url: "subscription-save-enrollment-details",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function(response) {
            console.log("Server Response:", response);
            if (response.code === "success") {
                localStorage.setItem('cart', JSON.stringify([]));
                Swal.fire({
                    title: 'Enrollment Successful!',
                    text: response.message || 'Your courses have been enrolled successfully.',
                    icon: 'success',
                }).then(() => {});
            } else {
                Swal.fire('Error', response.message || 'Enrollment failed.', 'error');
            }
        },
        error: function(xhr, status, error) {
            console.error("AJAX Error:", error);
            Swal.fire('Error', 'Something went wrong. Please try again.', 'error');
        }
    });
}
