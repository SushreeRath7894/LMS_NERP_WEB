            <img src="${image}" alt="Profile" class="profile-avatar-subs">

                    <span class="detail-value">${studentData.courseName || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Enrollment Date:</span>
                    <span class="detail-value">${enrollDate}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Phone:</span>
                    <span class="detail-value">${studentData.phoneNo || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Nationality:</span>
                    <span class="detail-value">${studentData.nationality || 'N/A'}</span>
                </div>
                <div class="detail-row">

                    <span class="payment-status ${paymentClass}">${studentData.paymentStaus || 'N/A'}</span>

function getStudentDetails(tb) {
    agGrid.simpleHttpRequest({
        url: "subscription-student-view?id=" + tb
    })
    .then(function (response) {
        if (response.message === "Success") {
            const responseBody = JSON.parse(response.body);
            fullStudentData = responseBody.studentData || [];

            // ✅ Sort using studentId
            fullStudentData.sort((a, b) => {
                const numA = parseInt(a.studentId.replace(/\D/g, ""), 10);
                const numB = parseInt(b.studentId.replace(/\D/g, ""), 10);
                return numB - numA;
            });

            filterGridData(tb);
        }
    })
    .catch(console.error);
}


function filterGridData(type) {

    // ✅ Allow empty type rows
    let filtered = fullStudentData.filter(row =>
        !row.type || row.type === type

    let columnDefs = [checkboxCol];

    // ✅ Enroll ID mapped to studentId

        {
            headerName: "Enroll ID",
            field: "studentId",   // ⭐ FIX HERE
            width: 150
        },
        {
            headerName: "Student Name",
            field: "studentName",
            width: 180
        },
        {
            headerName: "Email",
            field: "email",
            width: 220
        },
        {
            headerName: "Phone",
            field: "phoneNo",
            width: 150
        },
        {
            headerName: "Course Name",
            field: "courseName",
            width: 350,
            tooltipField: "courseName"
        }
    );

    if (type === "Public Batches") {
        columnDefs.push(
            { headerName: "Batch Title", field: "batchTitle", width: 200 },
            { headerName: "Batch Start Date", field: "batchStartDate", width: 180 },
            { headerName: "Batch End Date", field: "batchEndDate", width: 180 },
            { headerName: "From Time", field: "batchFromTime", width: 140 },
            { headerName: "To Time", field: "batchToTime", width: 140 }
        );
    }

    window.gridApi.setColumnDefs(columnDefs);
    window.gridApi.setRowData(filtered);

    if (filtered.length > 0) {
        window.gridApi.deselectAll();
        window.gridApi.getDisplayedRowAtIndex(0).setSelected(true);
    } else {
        document.getElementById('student-profile-container').innerHTML =

    }
}


function enableCourse(status) {
    var selectedNodes = window.gridApi.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);

    if (selectedData.length > 0) {
        var studentId = selectedData[0].studentId;

        $.ajax({
            type: "GET",
            url: "subscription-student-course-enable?studentId=" + studentId + "&status=" + status,
            success: function(response) {
                console.log("AJAX success response:", response);
                if (response.message === "Success") {
                    toastr.success("Course updated successfully");
                    // Refresh the grid and profile after update
                    getStudentDetails(tb); // Use current tb to refresh
                } else {
                    toastr.error("Something went wrong: " + response.message);
                }
            },
            error: function(err) {
                toastr.error("Request failed");
            }
        });
    } else {
        toastr.warning("Please select a student row");
    }
}

//JS Function
function getTheCourseDetails(enrollId) {
    $.ajax({
        url: 'subscription-get-course-details?enrollId=' + enrollId,
        type: 'GET',
        success: function (response) {
            const body = typeof response.body === 'string'
                ? JSON.parse(response.body)
                : response.body;

            $('#courseCard').empty();

            if (!body.enrollCourses || body.enrollCourses.length === 0) {
                $('#courseCard').html('<p class="text-muted">No courses found.</p>');
                return;
            }

            // Use a map to avoid duplicate courses
            const courseMap = new Map();

            body.enrollCourses.forEach(course => {
                const key = course.courseName;
                if (!courseMap.has(key)) {
                    courseMap.set(key, course.trainingDetails || []);
                } else {
                    // Merge trainings if course already exists
                    const existingTrainings = courseMap.get(key);
                    course.trainingDetails.forEach(tr => {
                        if (!existingTrainings.some(e => e.trainingCategory === tr.trainingCategory)) {
                            existingTrainings.push(tr);
                        }
                    });
                    courseMap.set(key, existingTrainings);
                }
            });

            // Render courses
            courseMap.forEach((trainings, courseName) => {
                const courseDiv = $('<div class="course-card"></div>');

                // Course header
                const courseHeader = $(`<div class="course-header">${courseName}</div>`);
                courseDiv.append(courseHeader);

                // Training list
                if (trainings.length > 0) {
                    const trainingList = $('<ul class="training-list"></ul>');
                    trainings.forEach(training => {
                        const li = $('<li></li>').text(training.trainingCategory);
                        trainingList.append(li);
                    });
                    courseDiv.append(trainingList);
                } else {
                    courseDiv.append('<p class="text-muted">No trainings available.</p>');
                }

                $('#courseCard').append(courseDiv);
            });
        },
        error: function () {
            $('#courseCard').html('<p class="text-danger">Failed to load course details.</p>');
        }
    });
}

function getCourseDetails() {
    agGrid.simpleHttpRequest({
      url: "academic-course-view"
    }).then(function (response) {
      if (response.message === "Success") {
        let courseData = [];
        try {
          const responseBody = JSON.parse(response.body);
          courseData = responseBody.courseData || [];
        } catch (e) {
          console.error("JSON parse error:", e);
          courseData = [];
        }

        const allowedCategories = ["ICAT0006", "ICAT0015"];
        const filteredCourses = courseData
          .filter(course => course.status === "Active" && allowedCategories.includes(course.parentCategoryId))
          .map(course => ({
            key: course.courseId,
            name: course.courseTittle.trim()
          }))
          .sort((a, b) => a.name.localeCompare(b.name));

        const container = document.getElementById("courseTraining");
        container.innerHTML = `
          <h4 class="mb-4">Select Course & Training</h4>

          <label for="courseSearchInput" class="form-label fw-bold">1. Select Course</label>
          <div class="dropdown-search">
            <input type="text" class="form-control" id="courseSearchInput" placeholder="Type to search course..." autocomplete="off" />
            <div id="courseDropdownList" class="dropdown-list"></div>
          </div>

          <div id="trainingSection" style="display: none;">
            <label for="trainingSearchInput" class="form-label fw-bold">2. Select Training Type</label>
            <div class="dropdown-search">
              <input type="text" class="form-control" id="trainingSearchInput" placeholder="Type to search training..." autocomplete="off" />
              <div id="trainingDropdownList" class="dropdown-list"></div>
            </div>

            <div class="mt-3">
              <label class="form-label">Training Price:</label>
              <input type="text" class="form-control" id="trainingPriceDisplay" readonly placeholder="Select a training to see price" />
            </div>

            <div class="mt-3">
              <strong>Selected Training:</strong>
              <span id="selectedTrainingDisplay" class="text-primary fw-semibold">None</span>
            </div>
          </div>

          <div class="mt-4">
            <strong>Selected Course:</strong>
            <span id="selectedCourseDisplay" class="text-success fw-semibold">None</span>
          </div>

          <!-- ASSIGN BUTTON MOVED HERE SO IT EXISTS WHEN WE CALL updateAssignButton() -->
          <div class="d-flex justify-content-end border p-2 rounded mt-4">
            <button class="btn btn-success m-0 edit-btn" type="button" id="assignTrainingBtn">
              Assign Training
            </button>
          </div>
        `;

        // Now the button exists → safe to control it
        updateAssignButton(); // Initially hide

        // === Course Dropdown Logic ===
        const courseInput = document.getElementById("courseSearchInput");
        const courseList = document.getElementById("courseDropdownList");
        const selectedCourseDisplay = document.getElementById("selectedCourseDisplay");
        const trainingSection = document.getElementById("trainingSection");

        function renderCourseList(courses) {
          if (courses.length === 0) {
            courseList.innerHTML = `<div class="dropdown-item text-muted text-center py-3">No courses found</div>`;
          } else {
            courseList.innerHTML = courses.map((c, i) => `
              <div class="dropdown-item ${i === 0 ? 'active' : ''}" data-key="${c.key}">${c.name}</div>
            `).join("");
          }
          courseList.style.display = "block";
          const active = courseList.querySelector(".active");
          if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }

        renderCourseList(filteredCourses);

        courseInput.addEventListener("input", () => {
          const q = courseInput.value.toLowerCase().trim();
          const matched = filteredCourses.filter(c => c.name.toLowerCase().includes(q));
          renderCourseList(matched);
        });

        courseList.addEventListener("click", (e) => {
          const item = e.target.closest(".dropdown-item");
          if (!item || item.textContent.includes("No courses")) return;
          const key = item.getAttribute("data-key");
          const name = item.textContent.trim();
          selectedCourseId = key;
          courseInput.value = name;
          selectedCourseDisplay.textContent = `${name} (${key})`;
          courseList.style.display = "none";
          getTrainingDetails(key);
          updateAssignButton(); // Update after course selected
        });

        // Keyboard navigation for course (unchanged)
        courseInput.addEventListener("keydown", (e) => {
          const items = courseList.querySelectorAll(".dropdown-item");
          if (items.length === 0) return;
          let idx = Array.from(items).findIndex(it => it.classList.contains("active"));

          if (e.key === "ArrowDown") {
            e.preventDefault();
            items.forEach(i => i.classList.remove("active"));
            idx = (idx + 1) % items.length;
            items[idx].classList.add("active");
            items[idx].scrollIntoView({ block: "nearest" });
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            items.forEach(i => i.classList.remove("active"));
            idx = (idx - 1 + items.length) % items.length;
            items[idx].classList.add("active");
            items[idx].scrollIntoView({ block: "nearest" });
          } else if (e.key === "Enter" && idx >= 0) {
            e.preventDefault();
            items[idx].click();
          }
        });

        courseInput.addEventListener("focus", () => renderCourseList(filteredCourses));
        document.addEventListener("click", (e) => {
          if (!container.contains(e.target)) courseList.style.display = "none";
        });

      
      }
    }).catch(err => {
      console.error("Failed to load courses:", err);
      document.getElementById("courseTraining").innerHTML = `<div class="alert alert-danger">Failed to load courses.</div>`;
    });
}

function getTrainingDetails(courseId) {
    console.log("Loading trainings for course:", courseId);

    const trainingInput = document.getElementById("trainingSearchInput");
    const trainingList = document.getElementById("trainingDropdownList");

    if (!trainingInput || !trainingList) {
        console.error("Dropdown elements missing");
        return;
    }

    // Cleanup old listeners
    if (trainingInputListener) trainingInput.removeEventListener("input", trainingInputListener);
    if (trainingListListener) trainingList.removeEventListener("click", trainingListListener);
    if (trainingKeydownListener) trainingInput.removeEventListener("keydown", trainingKeydownListener);
    if (trainingFocusListener) trainingInput.removeEventListener("focus", trainingFocusListener);

    fetch("academic-training-view?id=" + courseId)
        .then(response => {
            if (!response.ok) throw new Error("Network error: " + response.status);
            return response.json();
        })
        .then(data => {
            const trainingSection = document.getElementById("trainingSection");
            const priceDisplay = document.getElementById("trainingPriceDisplay");
            const selectedTrainingDisplay = document.getElementById("selectedTrainingDisplay");

            let trainingData = [];
            if (data.message === "Success" && data.body && data.body.length > 0) {
                try {
                    const jsonString = data.body[0];
                    const parsed = JSON.parse(jsonString);
                    trainingData = parsed.courseCategoryType || [];
                } catch (e) {
                    console.error("Parse error:", e);
                }
            }

            const trainings = trainingData.map(t => ({
                key: t.trainingRefId,
                name: t.trainingCategory ? t.trainingCategory.trim() : "Unknown",
                price: t.trainingPrice && t.trainingPrice !== "" ? t.trainingPrice : "N/A"
            }));

            trainingSection.style.display = "block";
            trainingInput.value = "";
            priceDisplay.value = "";
            selectedTrainingDisplay.textContent = "None";
            selectedTrainingRefId = null;

            // Hide button initially when trainings load
            updateAssignButton();

            function renderTrainingList(list) {
                if (list.length === 0) {
                    trainingList.innerHTML = `<div class="dropdown-item text-muted text-center py-3">No trainings available</div>`;
                } else {
                    trainingList.innerHTML = list.map((t, i) => `
                        <div class="dropdown-item ${i === 0 ? 'active' : ''}"
                             data-key="${t.key}"
                             data-price="${t.price}">
                            <div class="d-flex justify-content-between align-items-center">
                                <span>${t.name}</span>
                                ${t.price !== "N/A" ? `<span class="badge bg-success price-badge">₹${t.price}</span>` : ''}
                            </div>
                        </div>
                    `).join("");
                }
                trainingList.style.display = "block";
                const active = trainingList.querySelector(".dropdown-item.active");
                if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }
            renderTrainingList(trainings);

            trainingInputListener = () => {
                const q = trainingInput.value.toLowerCase().trim();
                const matched = trainings.filter(t => t.name.toLowerCase().includes(q));
                renderTrainingList(matched);
            };
            trainingInput.addEventListener("input", trainingInputListener);

            trainingListListener = (e) => {
                const item = e.target.closest(".dropdown-item");
                if (!item || item.textContent.includes("No trainings")) return;

                const key = item.getAttribute("data-key");
                const price = item.getAttribute("data-price");
                const name = item.querySelector("span:first-child").textContent.trim();

                selectedTrainingRefId = key;
                trainingInput.value = name;
                priceDisplay.value = price !== "N/A" ? "₹" + price : "";
                priceDisplay.placeholder = price === "N/A" ? "No price available" : "";
                selectedTrainingDisplay.textContent = `${name} (${key})`;
                trainingList.style.display = "none";

                // This is the critical fix – show button after training selected
                updateAssignButton();
            };
            trainingList.addEventListener("click", trainingListListener);

            // Keyboard navigation (unchanged)
            trainingKeydownListener = (e) => {
                const items = trainingList.querySelectorAll(".dropdown-item");
                if (items.length === 0) return;
                let idx = Array.from(items).findIndex(it => it.classList.contains("active"));

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    items.forEach(i => i.classList.remove("active"));
                    idx = (idx + 1) % items.length;
                    items[idx].classList.add("active");
                    items[idx].scrollIntoView({ block: "nearest", behavior: "smooth" });
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    items.forEach(i => i.classList.remove("active"));
                    idx = (idx - 1 + items.length) % items.length;
                    items[idx].classList.add("active");
                    items[idx].scrollIntoView({ block: "nearest", behavior: "smooth" });
                } else if (e.key === "Enter" && idx >= 0) {
                    e.preventDefault();
                    items[idx].click();
                }
            };
            trainingInput.addEventListener("keydown", trainingKeydownListener);

            trainingFocusListener = () => renderTrainingList(trainings);
            trainingInput.addEventListener("focus", trainingFocusListener);

        })
        .catch(error => {
            console.error("Fetch failed:", error);
            const trainingSection = document.getElementById("trainingSection");
            if (trainingSection) {
                trainingSection.style.display = "block";
                trainingSection.innerHTML += `<div class="alert alert-danger mt-3">Failed to load trainings: ${error.message}</div>`;
            }
            updateAssignButton(); // Hide on error
        });
}
function updateAssignButton() {
	alert("hyy")
    const btn = document.getElementById("assignTrainingBtn");
    if (btn) {
        if (selectedCourseId && selectedTrainingRefId) {
            btn.style.display = "inline-block"; // or "block", but inline-block matches .btn
        } else {
            btn.style.display = "none";
        }
    }
}

function onCourseSelected(courseId, courseName) {
    selectedCourseId = courseId;
    document.getElementById("selectedCourseDisplay").textContent = `${courseName} (${courseId})`;
    updateAssignButton();
}

function onTrainingSelected(trainingRefId, trainingName, price) {
    selectedTrainingRefId = trainingRefId;
    document.getElementById("selectedTrainingDisplay").textContent = `${trainingName} (${trainingRefId})`;

    const priceDisplay = document.getElementById("trainingPriceDisplay");
    if (price && price !== "N/A") {
        priceDisplay.value = "₹" + price;
    } else {
        priceDisplay.value = "";
        priceDisplay.placeholder = "No price";
    }

    updateAssignButton();
}
//✅ Use event delegation since button is dynamic
document.addEventListener("click", function(e) {
  if (e.target && e.target.id === "assignTrainingBtn") {
    // Get selected student
    const selectedNodes = window.gridApi?.getSelectedNodes() || [];
    const student = selectedNodes.length ? selectedNodes[0].data : null;
    const enrolledBy = student ? student.studentId : null;

    if (!selectedCourseId || !selectedTrainingRefId) {
      Swal.fire("Warning", "Please select both Course and Training", "warning");
      return;
    }

    if (!enrolledBy) {
      Swal.fire("Error", "No student selected.", "error");
      return;
    }

    // ✅ Retrieve trainingCategory from the DOM or stored data
    // We stored it in the dropdown item as text → extract it
    const trainingInput = document.getElementById("trainingSearchInput");
    const trainingCategory = trainingInput.value.trim(); // This is the visible name (e.g., "ducisgroupLmsAccess")

    // ✅ Build combined trainingId: "PRD000061_tr007-ducisgroupLmsAccess"
    const trainingId = selectedTrainingRefId + "-" + trainingCategory.replace(/\s+/g, ''); // Remove spaces if any

    // ✅ Final payload format expected by backend
    const enrollmentData = {
      productIds: [selectedCourseId],  // Must be array
      trainingId: trainingId,          // Combined ID
      enrolledBy: enrolledBy,
      paymentMethod: "none"
    };

    console.log("Sending enrollment:", enrollmentData);
    saveEnrollmentData(enrollmentData);
  }
});
// ✅ Updated updateAssignButton (without alert)
function updateAssignButton() {
  const btn = document.getElementById("assignTrainingBtn");
  if (btn) {
    if (selectedCourseId && selectedTrainingRefId) {
      btn.style.display = "inline-block";
    } else {
      btn.style.display = "none";
    }
  }
}
// Final Checkout Function (Updated as per your request)
function proceedToCheckOut() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    
    if (cart.length === 0) {
        Swal.fire("Empty Cart", "Please assign at least one training", "warning");
        return;
    }

    // Extract only needed fields
    const items = cart.map(item => ({
        courseId: item.courseId,
        trainingRefId: item.trainingRefId,
        enrolledBy: item.enrolledBy
    }));

    const paymentMethod = "none"; // As requested

    const paymentData = {
        items: items,              // Send array of items
        paymentMethod: paymentMethod
    };

    console.log('Final Checkout Data:', paymentData);

    saveEnrollmentData(paymentData);
}

function saveEnrollmentData(data) {
    console.log("Sending to server:", data);

    $.ajax({
        type: "POST",
        url: "subscription-save-enrollment-details",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function(response) {
            console.log("Server Response:", response);
            if (response.code === "success") {
                localStorage.setItem('cart', JSON.stringify([])); // Clear cart
                Swal.fire({
                    title: 'Enrollment Successful!',
                    text: response.message || 'Your courses have been enrolled successfully.',
                    icon: 'success',
                //    confirmButtonText: 'Go to Dashboard'
                }).then(() => {
                 //   localStorage.setItem("activity", "ACT0891");
                 //   window.location.href = 'student/dashboard';
                });
            } else {
                Swal.fire('Error', response.message || 'Enrollment failed.', 'error');
            }
        },
        error: function(xhr, status, error) {
            console.error("AJAX Error:", error);
            Swal.fire('Error', 'Something went wrong. Please try again.', 'error');
        }
    });
}
