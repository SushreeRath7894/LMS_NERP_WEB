<script>
	//setup the grid after the page has finished loading
	document.addEventListener('DOMContentLoaded', function() {
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);

	});
	$(document).ready(function() {
		pno = 1;
		$('#grid').show();
		$('#main').hide();
		$("#approve").attr('disabled', true);
		$("#delete1").attr('disabled', true);
		var dateFormat = localStorage.getItem("dateFormat");
		var currentDate = (new Date()).toISOString().split('T')[0];
		var newDate = changeDateFormat(currentDate);
		$('#date').val(newDate);
		$("#dateCalendar").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
			value : newDate,
		}).on("change", function() {
			$('#date').val($(this).val());
		})
		$('#date').blur(function() {
			$("#dateCalendar").val($(this).val());
		});
		$('#usedBy').val(newDate);
		$("#usedBydateCalendar").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
			value : newDate,
		}).on("change", function() {
			$('#usedBy').val($(this).val());
		})
		$('#usedBy').blur(function() {
			$("#usedBydateCalendar").val($(this).val());
		})

		$("#fromDateCalendarTime").datetimepicker({
			format : 'H:i',
			closeOnDateSelect : false,
			timepicker : true,
			datepicker : false,
			step : 1,
			formatTime : 'H:i'
		}).on("change", function() {
			$('#fromtime').val($(this).val());
		})

		$('#fromtime').blur(function() {
			$("#fromDateCalendarTime").val($(this).val());

		})

		$("#toDateCalendarTime").datetimepicker({
			format : 'H:i',
			closeOnDateSelect : false,
			timepicker : true,
			datepicker : false,
			step : 1,
			formatTime : 'H:i'
		}).on("change", function() {
			$('#toTime').val($(this).val());
		})

		$('#toTime').blur(function() {
			$("#toDateCalendarTime").val($(this).val());

		})

		$("#timeDateCalendarTime").datetimepicker({
			format : 'H:i',
			closeOnDateSelect : false,
			timepicker : true,
			datepicker : false,
			step : 1,
			formatTime : 'H:i'
		}).on("change", function() {
			$('#time').val($(this).val());
		})

		$('#time').blur(function() {
			$("#timeDateCalendarTime").val($(this).val());

		})

		view();
	});

	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];
		return day + '-' + month + '-' + year;
	}

	function onQuickFilterChanged() {
		/* gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value); */

		//getRowCountSearch();
		var id1 = document.getElementById("closeKey");
		id1.style.display = "block";
		var value = $("#quickFilter").val();

		if (event.which === 13) {
			if (value == "" || value == null || value == 'null') {

			} else {
				gridSearch();
			}
		} else {
			if (value == "" || value == null || value == 'null') {
				gridSearch();
			}
		}
	}

	function cancelBar() {
		/* var id = document.getElementById("closeKey");
		id.style.display = "block";
		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		} */

		$("#quickFilter").val("");
		gridSearch();
	}

	function gridSearch() {
		var value = $("#quickFilter").val();
		var id1 = document.getElementById("closeKey");
		if (value == "" || value == null || value == 'null') {
			$("#currentPageno").val("1");
			view();
			$("#pagination").show();
			id1.style.display = "none";
		} else {
			$("#pagination").hide();
			$(".loader").show();
			agGrid.simpleHttpRequest({
				url : "lmr-log-view-search?searchValue=" + value
			}).then(function(data) {
				$(".loader").hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.viewGateReceived;
				gridOptions.api.setRowData(allData);
				var totalRowCount = gridOptions.api.getModel().getRowCount();
				$('#totalCandidate').find('span').html(totalRowCount);

			});

		}

	}

	/* function getRowCountSearch(){
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalCandidate').find('span').html(totalRowCount);
	} */

	function cancleBtn() {
		$('#grid').show();
		$('#main').hide();
		view();
	}

	// Definations -columnDefs and gridOptions
	// main
	var columnDefs = [
			{
				//headerCheckboxSelection : true,
				headerCheckboxSelectionFilteredOnly : true,
				checkboxSelection : true,
				rowSelection : 'single',
				width : 10,
				sortable : false,
				filter : false,
				resizable : true,
				pinned : 'left',
			},
			{
				headerName : "Sack Id",
				field : "sackId",
				width : 130,
				pinned : 'left',
				cellRenderer : function(params) {
					return '<a onclick=getEditData("'
							+ params.data.sackId
							+ '","'
							+ params.data.sku
							+ '","'
							+ params.data.caseConfig
							+ '","'
							+ params.data.packSize
							+ '","'
							+ params.data.totalMt
							+ '","'
							+ params.data.remark
							+ '") href="javascript:void(0)"> <i class="bi bi-pencil-square")></i> '
							+ params.data.sackId + '</a>';
				}
			}, {
				headerName : "Material Code",
				field : "sku",
				width : 130,
				pinned : 'left',
			}, {
				headerName : "Material Name",
				field : "name",
				width : 200,
			}, {
				headerName : "Brand",
				field : "brand",
				width : 130,
				cellStyle : {
					textAlign : 'center'
				},
			}, {
				headerName : "Category",
				field : "category",
				width : 170,
				cellStyle : {
					textAlign : 'center'
				},
			}, {
				headerName : "Case Configuration",
				field : "caseConfig",
				width : 170,
				cellStyle : {
					textAlign : 'right'
				},
			}, {
				headerName : "Pack Size",
				field : "packSize",
				width : 170,
				cellStyle : {
					textAlign : 'right'
				},
			}, {
				headerName : "Total in MT",
				field : "totalMt",
				width : 170,
				cellStyle : {
					textAlign : 'right'
				},
			}, {
				headerName : "Remarks",
				field : "remark",
				width : 130,
			}, ];
	var gridOptions = {
		columnDefs : columnDefs,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 149,
			height : 10
		},
		//rowSelection : 'single',
		//suppressRowClickSelection : true,
		onSelectionChanged : onSelectionChangedState,
		getRowNodeId: function (data) {
			return data.sackId;
		},
	};

	function onSelectionChangedState() {
		var selectedRows = gridOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			$('#delete1').attr("disabled", false);
			$('#newItem').attr("disabled", true);
		} else {
			$('#delete1').attr("disabled", true);
			$('#newItem').attr("disabled", false);
		}

	}

	// MAIN EDITOR
	function getEditData(id, sku, caseConfig, packSize, totalMt, remark) {
		$("#childModal").modal('show');
		$("#sackId").text(id);
		$("#productId").val(sku);
		$("#sku").val(sku);
		$("#caseConfig").val(caseConfig);
		$("#packSize").val(packSize);
		$("#totalMt").val(totalMt);
		$("#remark").val(remark);

	}
	// Main data
	function openNav() {

		$(".formValidation").remove();
		$("#childModal").modal('show');
		$("#sackId").text("");
		$("#productId").val("");
		$("#sku").val("");
		$("#caseConfig").val("");
		$("#packSize").val("");
		$("#totalMt").val("");
		$("#remark").val("");
	}

	function closeNav() {
		$('#childModal').modal('hide');
		$("#newItem").show();
		$("#delete1").show();
		$("#sackId").text("");
		$("#productId").val("");
		$("#sku").val("");
		$("#caseConfig").val("");
		$("#packSize").val("");
		$("#totalMt").val("");
		$("#remark").val("");
	}

	function addReview() {

		var item = {};
		var validation = true;
		item.sackId = $("#sackId").text();
		item.sku = $("#sku").val();
		item.caseConfig = $('#caseConfig').val();
		item.packSize = $('#packSize').val();
		item.totalMt = $('#totalMt').val();
		item.remark = $('#remark').val();

		var validation = true;
		/* if (item.date == null || item.date == "") {
			validation = validationUpdated("Date Required", "date");
		}
		if (item.shift == null || item.shift == "") {
			validation = validationUpdated("Shift Required", "shift");
		}
		if (item.productId == null || item.productId == "") {
			validation = validationUpdated("Product Required", "productId");
		} */
		console.log("item>>>>", item);
		if (validation) {
			saveDatas(item);
		}
	}

	function saveDatas(datas) {
		$(".loader").show();
		$.ajax({
			type : "POST",
			url : "sack-configuration-add",
			contentType : "application/json",
			data : JSON.stringify(datas),
			success : function(response) {
				if (response.message == "Success") {
					$(".loader").hide();
					closeNav();

					$("body").removeClass("overlay");
					$('#candMsg').text("");
					$('#candValid').modal('toggle');
					$('#candMsg').text("Data Saved Successfully");
					view();

				} else {
					$(".loader").show();
				}
			},
			error : function(data) {
				$('.loader').hide();
				$("body").removeClass("overlay");
			}
		})
	}

	function view() {

		$(".loader").show();
		agGrid.simpleHttpRequest({
			url : 'sack-configuration-view'
		}).then(function(data) {
			$(".loader").hide();
			console.log("data>>>>>", data);
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.viewData;
			gridOptions.api.setRowData(allData);

			var totalRowCount = gridOptions.api.getModel().getRowCount();
			$('#totalCandidate').find('span').html(totalRowCount);

		});
	}

	function deleteItem() {
		$('#deleteProduct').modal('show');
	}
	function cancelModalBtn() {
		$('#deleteProduct').modal('hide');
	}
	function deleteProductOnclick() {
		var selectedRows = gridOptions.api.getSelectedRows();
		var id = selectedRows[0].sackId;
		$(".loader").show();
		$.ajax({
			type : "GET",
			url : "sack-configurationg-delete?id=" + id,
			success : function(response) {
				$(".loader").hide();
				if (response.code == "success") {
					$("#messageParagraph").text(response.message);
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					$('#delete').modal('hide');
					cancelModalBtn();
					view();

					$('#delete1').attr("disabled", true);
					$('#newItem').attr("disabled", false);
				} else {
					$("#messageParagraph").text("Something went to wrong!");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			},
			error : function(data) {
			}
		})
	}

	function downloadDetails() {
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			dataset.push(rowNode.data);
		});
		gridOptions.api.exportDataAsCsv(dataset);
	}

	/* function downloadPdfDetails(type) {
		var PackId = $("#packId1").text();
		window.open("/production/lmr-logbook-download?packId="
				+ window.btoa(PackId) + "&type=" + window.btoa(type), '_blank'); 
	} */

	function setMaterialCode() {
		$("#sku").val($("#productId").val());
	}
</script>


<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div id="grid">
						<div class="d-flex justify-content-between" id="hideTbl">
							<div class=" btn-hs">
								<div class="font-design" id="totalCandidate">
									List (<span></span>)
								</div>
							</div>
							<div class=" btn-hs" id="searchRowDiv">
								<div class="input-style">
									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput" onkeyup="onQuickFilterChanged(event)"
										id="quickFilter" autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey" onclick="cancelBar();" class="close_i"><i
												class="ti-close srchicon"></i></span></a><a href="javascript:void(0)">
											<i class="ti-search srchicon" onclick="gridSearch()"></i>
										</a>
									</div>
								</div>
							</div>
							<div class=" btn-hs" align="right">
								<button class="download-btn" id="download"
									onclick="downloadDetails()">Download</button>
								<button class="delete-btn" id="delete1" onclick="deleteItem()">Delete</button>
								<!-- <button class="btn2" id="approve" onclick="modalApprove()">Approve</button> -->
								<button class="new-btn" id="newItem" onclick="openNav()">New</button>
							</div>
						</div>
						<input type="hidden" id="sessionId" th:value="${userId}" /> <input
							type="hidden" id="sessionName" th:value="${userName}" /> <input
							type="hidden" id="adRole" th:value="${adRole}" /> <input
							type="hidden" id="mrRole" th:value="${mrRole}" /> <input
							type="hidden" id="empRole" th:value="${empRole}" /> <input
							type="hidden" id="sessionRole" th:value="${userRole}" />
						<div class="row">
							<div class="col-md-4 btn-hs1">
								<div class="font-design"></div>
							</div>
							<input type="hidden" id="totalPageno"> <input
								type="hidden" id="currentPageno">
							<div id="myGrid" style="width: 100%; height: 500px;"
								class="ag-theme-alpine"></div>
							<div id="pagination" class="pagination" style="cursor: pointer;"></div>
						</div>
					</div>

					<!-- The Modal For Validation-->
					<!-- ALLOCATE REQUISITION STARTS -->
					<!-- The Modal For Add Main  -->
					<div class="modal fade" id="childModal">
						<div class="modal-dialog modal-lg"
							style="margin-top: 130px; height: 800px; max-width: 750px">
							<div class="modal-content">
								<!-- 	Modal Header -->
								<div class="modal-header">
									<h4 class="modal-title" style="font-size: 16px" id="entry">
										<b>Sack Id: </b><span id="sackId"></span>
									</h4>

								</div>
								<!-- Modal body -->
								<div class="modal-body">
									<div class="col-md-12" id="shippingInfo1">

										<div class="row">
											<div class="col-md-6">
												<div class="form-group">
													<label>Product</label>
													<div class="select">
														<select id="productId" onchange="setMaterialCode()">
															<option value=''>--SELECT--</option>
															<option th:each="c:${itemList}" th:value='${c.key}'
																th:text="${c.name}"></option>
														</select>
													</div>
												</div>
											</div>
											<div class="col-md-6">
												<div class="form-group">
													<label>Material Code</label> <input type="text"
														class="form-control" placeholder="" id="sku"
														onblur="removeValid(event);" autocomplete="off" readonly>
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-group">
													<label>Case Configuration</label> <input type="number"
														class="form-control transparenttxtbox" placeholder=""
														id="caseConfig" onblur="removeValid(event);"
														autocomplete="off">
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-group">
													<label>Pack Size</label> <input type="number"
														class="form-control transparenttxtbox" placeholder=""
														id="packSize" onblur="removeValid(event);"
														autocomplete="off">
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-group">
													<label>Total in MT</label> <input type="number"
														class="form-control transparenttxtbox" placeholder=""
														id="totalMt" onblur="removeValid(event);"
														autocomplete="off">
												</div>
											</div>

											<div class="col-md-12">
												<div class="form-group">
													<label>Remarks</label>
													<!-- <input type="text"
														class="form-control transparenttxtbox" placeholder=""
														id="remark" onblur="removeValid(event);"
														autocomplete="off"> -->
													<textarea id="remark"> </textarea>
												</div>
											</div>
											<div class="row mt-4">
												<div class="form-group">
													<button class="delete-btn" id="cancel" onclick="closeNav()">CANCEL</button>
													<button class="btn1" id="save" onclick="addReview()">Save</button>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- The Modal For Validation  -->
					<div class="modal fade" id="candValid">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p id="candMsg"></p>
								</div>
								<div class="modal-footer justify-content-center">
									<button type="button" class="btn1" data-bs-dismiss="modal">Ok</button>
								</div>
							</div>
						</div>
					</div>
					<!-- The Modal For Delete Main  -->
					<div id="deleteProduct" class="modal fade show" aria-modal="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column">
									<button type="button" class="close" data-bs-dismiss="modal"
										aria-hidden="true" onclick="deleteProductOnclick()"></button>
								</div>
								<div class="modal-body">
									<p>Do you really want to delete these records? This process
										cannot be undone.</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">
									<button type="button" class="cancel-btn" data-dismiss="modal"
										onclick="cancelModalBtn();">Cancel</button>
									<button type="button" class="delete-btn"
										onclick="deleteProductOnclick()">Delete</button>
								</div>
							</div>
						</div>
					</div>
					<!-- The Modal For Approve Main  -->
					<div id="approveModal" class="modal fade show" aria-modal="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column">
									<button type="button" class="close" data-bs-dismiss="modal"
										aria-hidden="true" onclick="closeapprove()"></button>
								</div>
								<div class="modal-body">
									<p>Do you really want to approve ?</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: -30px;">
									<button type="button" class="cancel-btn" data-dismiss="modal"
										onclick="closeapprove();">Cancel</button>
									<button type="button" class="approve-btn" onclick="approve()">Approve</button>
								</div>
							</div>
						</div>
