			      filter: 'agDateColumnFilter',

			      filterParams: {
			        comparator: (filterLocalDateAtMidnight, cellValue) => {
			          const dateParts = cellValue.split('-');
			          const day = Number(dateParts[0]);
			          const month = Number(dateParts[1]) - 1;
			          const year = Number(dateParts[2]);
			          const cellDate = new Date(year, month, day);
			          if (cellDate < filterLocalDateAtMidnight) {
			            return -1;
			          } else if (cellDate > filterLocalDateAtMidnight) {
			            return 1;
			          } else {
			            return 0;
			          }
			        },
			      },
			    },

	function downloadDetails() {
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			dataset.push(rowNode.data);
		});
		gridOptions.api.exportDataAsCsv(dataset);
	}

	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	function changeDateFormat1(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = "01";

		return day + '-' + month + '-' + year;
	}
	
	
	function filterDate() {
		
		var fdate = $("#filterFromDate").val();
		var tdate = $("#filterToDate").val();

		if (fdate == "" || fdate == null && tdate == "" || tdate == null) {
			$("#messageParagraph").text("Enter FromDate And ToDate.");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');

		} else {
			$("#myGrid").empty();

			var gridDiv = document.querySelector('#myGrid');
			new agGrid.Grid(gridDiv, gridOptions);
			// var rowData = [];
			gridOptions.api.setRowData();
			$('.loader').show();
			agGrid.simpleHttpRequest({
				url : "store-grnreport-filter-view-forMaterialArrival?fdate=" + fdate+"&tdate="+tdate,
			}).then(function(data) {
				$('.loader').hide();
				var jsonData = JSON.parse(data.body);
				var allData = jsonData.viewReportData;
				if(allData == null || allData == 'null'){
					allData = "";
				}
				var len = allData.length;
				$('#totalReq').find('span').html(len);
				gridOptions.api.setRowData(allData);
			});

		}

		$("#fdate").val('');
		$("#tdate").val('');
	}
