<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">



<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">

<link rel="stylesheet" href="../css/project/projectConfig.css">
<script type="text/javascript"
	src="../javaScript/project/projectConfig.js"></script>

</head>
<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition mt-3 mb-3">
			<!-- Tab panes -->
			<div class="tab-content">

				<!--Tabbination 1 Start-->
				<div id="ipd" class="tab-pane active mt-5">
					<div class="row">

						<!--Left Sec Start-->
						<div class="col-md-6 pd-r tab-width-css">
							<div class="out-box">

								<div class="row d-flex  mb-20">
									<div class="col-md-10" id="searchRowDiv1">
										<div class="input-style">
											<input type="text" placeholder="Search.." name="search"
												class="searchboxinput" onkeyup="cancelBar()"
												oninput="onQuickFilterChanged()" id="quickFilter"
												autocomplete="off">
											<div class="searchicon">
												<a href="javascript:void(0)"><span
													style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
													id="closeKey"
													onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalPrj').find('span').html(gridOptions1.api.getModel().getRowCount());"
													class="close_i"><i class="ti-close srchicon"></i></span></a><a
													href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
											</div>
										</div>

									</div>

									<div class="col-md-2 d-flex justify-content-end">
										<div class="btn btn-primary max-btn">
											<!-- <i class="fas fa-arrow-up"></i>-->
											<i class="fas fa-arrows-alt"></i>
										</div>
									</div>

								</div>
								<div class="requisition-tbl table-responsive">
									<div id="myGrid" style="height: 500px;" class="ag-theme-alpine"></div>

								</div>
							</div>
						</div>

						<!--Left Sec End-->

						<!--Right Sec Start-->
						<div class="col-md-6 pd-l">
							<div class="out-box">

								<div class="btn btn-primary max-btn">
									<!-- <i class="fas fa-arrow-up"></i>-->
									<i class="fas fa-arrows-alt"></i>
								</div>



								<!--Right Inner Tab Start-->
								<ul class="nav nav-pills newtab mb-20" role="tablist">


									<li class="nav-item"><a class="nav-link active"
										data-bs-toggle="pill" href="#configurationTab"
										onclick="activityTabs('configurationTab');">Configuration</a></li>


									<li class="nav-item wd-11"><a class="nav-link text-nowrap"
										data-bs-toggle="pill" href="#processTab"
										onclick="activityTabs('processTab');">Process</a></li>


								</ul>




								<!-- Tab panes -->
								<div class="tab-content"
									style="height: 500px; overflow-y: scroll;">
									<div id="configurationTab" class="tab-pane active">
										<div class="mb-2">
											<input type="hidden" id="pID">
											<table class="table  mb-0" width="100%">
												<tr valign="middle">
													<td width="50%"></td>

													<td>
														<div class="d-flex justify-content-end gap-2">


															<div class="">
																<button class="btn edit-btn" id="newCrop"
																	onclick="newCrop()">Add</button>
															</div>

															<div class="">
																<button class="btn edit-btn" id="enableFieldsConfig"
																	onclick="enableFieldsConfig()">Edit</button>

															</div>
															<div class="">
																<button class="btn edit-btn" id="deleteCrop"
																	onclick="deleteCrop()">Delete</button>

															</div>

															<div class="">
																<button class="btn edit-btn" id="saveCrop"
																	onclick="saveCrop()">Save</button>

															</div>






														</div>

													</td>
												</tr>
											</table>
										</div>

										<form>
											<div class="row" id="mySidenav">


												<div class="row">


													<div class="col-lg-12">
														<input type="hidden" id="cropId">
														<div class="col-lg-12">
															<div class="form-group">
																<label>Configuration Name</label> <input type="text"
																	class="form-control" autocomplete="off" id="cropName"
																	onblur="removeValid(event)">
															</div>
														</div>

													</div>

													<div class="col-md-12">
														<div class="form-group">
															<label>Description</label>
															<textarea name="Description" id="cropDescription"
																class="form-control"></textarea>
														</div>
													</div>

													<div class="col-md-12">
														<div class="form-group mt-0">
															<input type="checkbox" class="loc-chb" name="isActive"
																id="cropStatus" value="1"> <label
																class="checkboxlbltxt">Active</label>
														</div>
													</div>



												</div>


											</div>


										</form>

									</div>



									<div id="processTab" class="tab-pane fade">
										<div class="mb-2">
											<input type="hidden" id="pID">
											<table class="table  mb-0" width="100%">
												<tr valign="middle">
													<td width="50%"></td>

													<td>
														<div class="d-flex justify-content-end gap-2">


															<div class="">
																<button class="btn edit-btn" id="newCropProcess"
																	onclick="newCropProcess()">Add</button>
															</div>

															<div class="">
																<button class="btn edit-btn" id="enableFieldsSubConfig"
																	onclick="enableFieldsSubConfig()">Edit</button>

															</div>
															<div class="">
																<button class="btn edit-btn" id="deleteCropProcess"
																	onclick="deleteCropProcess()">Delete</button>

															</div>

															<div class="">
																<button class="btn edit-btn" id="saveCropProcess"
																	onclick="saveCropProcess()">Save</button>

															</div>


														</div>

													</td>
												</tr>
											</table>
										</div>

										<form>
											<div class="row" id="subcategoryDiv">
												<div class="col-md-4 btn-hs" id="searchRowDiv1">
													<div class="input-style">
														<input type="text" placeholder="Search.." name="search"
															class="searchboxinput"onkeyup="cancelBar1()" 
															oninput="onQuickFilterChanged1()"
															id="quickFilter1" autocomplete="off">
														<div class="searchicon">
															<a href="javascript:void(0)"><span
																style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
																id="closeKey"
																onclick="gridOptions1.api.setQuickFilter(null);$('#quickFilter1').val('');document.getElementById('closeKey').style.display='none';"
																class="close_i"><i class="ti-close srchicon"></i></span></a><a
																href="javascript:void(0)"><i
																class="ti-search srchicon"></i></a>
														</div>
													</div>
												</div>


												<div id="myGrid1" style="width: 100%; height: 250px;"
													class="ag-theme-alpine"></div>
											</div>

											<div class="row">

												<input type="hidden" id="cropProcessId">
												<input type="hidden" id="cropIdspan">
												<div class="col-md-12">
													<div class="form-group mb-10">
														<label>Activity</label>

														<div class="select">
															<select class="" id="activityId" onchange="subCat()"
																onblur="removeValid(event);">
																<option th:value="NULL">Select</option>
																<option th:each="c,iter:${budgetCategoryList}"
																	th:value="${c.key}" th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>

												<div class="col-md-12">
													<div class="form-group mb-10">
														<label>Task</label>

														<div class="select">
															<select class="" id="taskId" onblur="removeValid(event);">
																<option th:each="c,iter:${budgetSubCategoryList}"
																	th:value="${c.key}" th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>


												<div class="col-md-12">
													<div class="form-group mb-10">
														<label>Quantity</label> <input type="text" id="qty"
															class="form-control">
													</div>
												</div>
												<div class="col-md-6">
													<div class="form-group mb-10">
														<label>Unit</label>

														<div class="select">
															<select class="" id="unitId">
																<option value="">Select</option>
																<option th:each="c,iter:${unitList}" th:value="${c.key}"
																	th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>

												<div class="col-md-6">
													<div class="form-group mb-10">
														<label>Amount</label> <input type="text" id="amount"
															class="form-control">
													</div>
												</div>

												<div class="col-md-6">
													<div class="form-group mb-10">
														<label>Duration(Days)</label> <input type="text"
															id="duration" class="form-control">
													</div>
												</div>
												<div class="col-md-12">
													<div class="form-group">
														<label>Description</label>
														<textarea name="Description" id="cropProcessDescription"
															class="form-control"></textarea>
													</div>
												</div>
											</div>

										</form>

									</div>


								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
