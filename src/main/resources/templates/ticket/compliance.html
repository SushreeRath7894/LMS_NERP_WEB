function savePlanDetails(datas) {
	$('.loader').show();
	setTimeout(function() {
	$.ajax({
		type : "POST",
		url : "compliance-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('.loader').hide();
				agGrid.simpleHttpRequest({
					url : 'compliance-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.Asset;
					var len = allData.length;
					$('#totalAsset').find('span').html(len);
					gridOptions.api.setRowData(allData);
					onSelectionChanged()
				});
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Something Went Wrong");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})
	}, 1000)

}

	function extractFilename(url) {
        // Split the URL by '/'
        var urlParts = url.split('/');
        // Get the last part of the URL, which is the filename
        var filename = urlParts[urlParts.length - 1];
        return filename;
    }

function saveFile() {

		var uFile = $(uploadWarDoc_0)[0].files[0];
		var fileName = event.currentTarget.value;
		var lastIndex = fileName.lastIndexOf("\\");
		if (lastIndex >= 0) {
			fileName = fileName.substring(lastIndex + 1);
		}
		var extension = fileName.split(".");
		var iURL = URL.createObjectURL(uFile);
		$("#uploadedWarrDiv_0").html("");

		if (extension[1] == "jpg" || extension[1] == "png"|| extension[1] == "jpeg"|| extension[1] == "JPG") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_blank'><i class='fa fa-picture-o' style='color: blue'></i></a><i class='ti-close position-l rmv1' onclick='openWarDelete()'></i></div>";
		}else if (extension[1] == "pdf") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_blank'><i class='fa fa-file-pdf-o' style='color: red'></i></a><i class='ti-close position-l rmv1' onclick='openWarDelete()'></i></div>";
		} else {
			var LightImg = "<div class='uploadicon position-l'> </div>";
		}
		$("#uploadedWarrDiv_0").html(LightImg);
		$("#imageWarrName_0").html(fileName);
		var fileData = new FormData();
		fileData.append('file', uFile);
		fileData.append('path', 'none');
		
	}

// save data in aggrid table sidenav save

function saveTableData() {
  var datas = [];
  var item = {};
  var valid = true;
  var rowEdit = $("#rowEdit").val();
  var found = false;

  activityOptions.api.forEachNode(function(rowNode, index) {
    var iid = rowNode.data.parameterId;

    datas.push(rowNode.data);
  });

  	var uFile = $(".wardocument")[0].files[0];
	var fileName = $(".wardocument").val();
	var data = [];
	var x = [];
	if (fileName != '' && fileName != 'undefined'
			&& fileName != null) {
		var lastIndex = fileName.lastIndexOf("\\");
		if (lastIndex >= 0) {
			item.fileName = fileName.substring(lastIndex + 1);
		}
		var reader = new FileReader();
		reader.readAsDataURL(uFile);
		var iURL = URL.createObjectURL(uFile);
		reader.onload = function() {
			data = reader.result.split(",");
			item.documentFileBase=data[1];
			item.documentURL=$(this).find(".uploadedWarrCls").val();
			item.dURL=iURL;
		};
	}
	
	
  if (!found) {
    
    
	item.sdate = $("#sdate").val();
	item.rdate = $("#rdate").val();
	item.docName = $("#docName").val();

	 if (item.sdate == null || item.sdate == "") {
			valid = validationUpdated("Start Date is Required", "sdate");
		 }
		 if (item.docName == null || item.docName == "") {
				valid = validationUpdated("Document Name is Required", "docName");
			 }
	
    if (valid) {
      if (rowEdit) {
        activityOptions.api.forEachNode(function(rowNode, index) {
          var iid = rowNode.data.parameterId;
          console.log("oooooooooo",iid)
          if (iid == rowEdit) {
            rowNode.setData(item);
            return;
          }
        });
        setTimeout(function() {
        	activityOptions.api.redrawRows();   
        }, 500);
        closeNav();
      } else {
        var rowCount = activityOptions.api.getDisplayedRowCount();
        if (rowCount > 0) {
          var foundId = false;
          
          if (!foundId) {
            datas.push(item);
          }
        } else {
          datas = [item];
        }
        activityOptions.api.setRowData(datas);
        
        closeNav();
        console.log("123456543",datas);
     // Using setTimeout to execute a function after 2 seconds (2000 milliseconds)
        setTimeout(function() {
        	activityOptions.api.redrawRows();   
        }, 500);
      }
    } else {
      $("#mySidenav").show();
    }
  }
}
