<style>
@import url('https://fonts.googleapis.com/css?family=Raleway:400,600');

body {
	background: #fafafa;
}

h1 {
	text-align: center;
	padding: 30px 0 0 0;
}

h4 {
	font-size: 1.2em;
	text-align: center;
	padding: 0 0 30px 0;
}

.timeline {
	list-style: none;
	padding: 20px 0 20px;
	position: relative;
}

.timeline:before {
	top: 0;
	bottom: 0;
	position: absolute;
	content: "";
	width: 3px;
	background-color: #d9d9d9;
	margin-left: -1.5px;
	left: 20px;
}

@media ( min-width : 576px) {
	.timeline:before {
		left: 50%;
	}
}

.timeline>li {
	margin-bottom: 20px;
	position: relative;
	padding-left: 55px;
}

.timeline>li:after, .timeline>li:after {
	content: "";
	display: table;
	clear: both;
}

.timeline>li .panel {
	width: 100%;
	float: left;
	border-radius: 3px;
	font-weight: 500;
	overflow: hidden;
	position: relative;
	background: #cccddd;
	box-shadow: 1px 2px 80px 0 rgba(0, 0, 0, 0.1);
}

.timeline>li .panel summary {
	display: block;
	user-select: none;
	outline: none;
	padding: 20px;
	margin-bottom: 0px;
	transition: all 600ms cubic-bezier(0.23, 1, 0.32, 1);
	transition-property: margin, background;
	font-weight: 600;
}

.timeline>li .panel summary::-webkit-details-marker {
	display: none;
}

.timeline>li .panel summary:hover {
	background: rgba(0, 0, 0, 0.1);
}

.timeline>li .panel p {
	padding: 0 20px 10px;
}

.timeline>li .panel[open] summary {
	margin-bottom: 20px;
	padding-bottom: 20px;
	border-bottom: 1px solid rgba(0, 0, 0, 0.1);
}

.tracking-content {
	box-shadow: inset 0 0 0 0 #54b3d6;
	color: var(- -primary);
	margin-left: 10px;
	/* 	margin: 0 -.25rem;
	padding: 0 .25rem; */
	transition: color .3s ease-in-out, box-shadow .3s ease-in-out;
	font-weight: 600;
}

.tracking-content:hover {
	box-shadow: inset 450px 0 0 0 var(- -primary);
	color: white;
}

@media ( min-width : 576px) {
	.timeline>li {
		padding-left: 0px;
	}
	.timeline>li .panel {
		width: 50%;
	}
	.timeline>li:not(:nth-child(even)) {
		padding-right: 90px;
	}
	.timeline>li:nth-child(even) {
		padding-left: 90px;
	}
	.timeline>li:nth-child(even)>:nth-child(even) {
		float: right;
	}
}

.timeline>li>.icon {
	color: #d9d9d9;
	width: 50px;
	height: 50px;
	line-height: 50px;
	font-size: 2.5em;
	text-align: center;
	position: absolute;
	left: 20px;
	margin-left: -25px;
	background-color: #fafafa;
	z-index: 999;
	border-radius: 50%;
	font-family: Font Awesome\ 5 Free;
}

.timeline>li>.icon:before {
	content: "\f192";
}

@media ( min-width : 576px) {
	.timeline>li>.icon {
		left: 50%;
	}
}

.timeline>li>.icon.done {
	color: #3f51b5;
}

.timeline>li>.icon.done:before {
	content: "\f058";
}

.timeline>li>.icon.working {
	color: #eeba4c;
}

.timeline>li>.icon.working:before {
	content: "\f017";
}

	function viewAllTicketPriority(){
		var modName =sessionStorage.getItem('modName');
		
		agGrid.simpleHttpRequest(
				{
					url : "departmentview-priority-list?modName="+modName,
				}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.priorityList;
			
			if(allData != "" && allData != null && allData != 'null'){
				
				for(var i=0 ; i< allData.length ; i++){
					
					var priorityList = `<div class="btn-group col-md-3">
						<button class="btn btn-primary child" id=${allData[i].priorityName}
						value=${allData[i].prorityId} onclick="ShowAgGrid(id,value)">${allData[i].priorityName}(${allData[i].count1})</button>
				</div>`
						$("#buttonClass").append(priorityList);
				}
				$("#"+allData[0].priorityName).addClass("active");
			} 
			
		});
	}

	var pages;
	function createPagination(pages, page) {
		pno=page;
		if($("#totalPageno").val()==''){
			var pages=20;
		}else{
			var pages=$("#totalPageno").val();
			$("#currentPageno").val(page);
		}
		
	  var str = '<ul>';
	  var active;
	  var pageCutLow = page - 1;
	  var pageCutHigh = page + 1;
	  // Show the Previous button only if you are on a page other than the first
	  if (page > 1) {
	    str += '<li class="page-item previous no"><a onclick="createPagination(pages, '+(page-1)+')">Previous</a></li>';
	  }
	  // Show all the pagination elements if there are less than 6 pages total
	  if (pages < 6) {
	    for (let p = 1; p <= pages; p++) {
	      active = page == p ? "active" : "no";
	      str += '<li class="'+active+'"><a onclick="createPagination(pages, '+p+')">'+ p +'</a></li>';
	    }
	  }
	  // Use "..." to collapse pages outside of a certain range
	  else {
	    // Show the very first page followed by a "..." at the beginning of the
	    // pagination section (after the Previous button)
	    if (page > 2) {
	      str += '<li class="no page-item"><a onclick="createPagination(pages, 1)">1</a></li>';
	      if (page > 3) {
	          str += '<li class="out-of-range"><a onclick="createPagination(pages,'+(page-2)+')">...</a></li>';
	      }
	    }
	    // Determine how many pages to show after the current page index
	    if (page === 1) {
	      pageCutHigh += 2;
	    } else if (page === 2) {
	      pageCutHigh += 1;
	    }
	    // Determine how many pages to show before the current page index
	    if (page === pages) {
	      pageCutLow -= 2;
	    } else if (page === pages-1) {
	      pageCutLow -= 1;
	    }
	    // Output the indexes for pages that fall inside the range of pageCutLow
	    // and pageCutHigh
	    for (let p = pageCutLow; p <= pageCutHigh; p++) {
	      if (p === 0) {
	        p += 1;
	      }
	      if (p > pages) {
	        continue
	      }
	  
	      active = page == p ? "active" : "no";
	      str += '<li class="page-item '+active+'"><a onclick="createPagination(pages, '+p+')">'+ p +'</a></li>';
	      
	    }
	    // Show the very last page preceded by a "..." at the end of the pagination
	    // section (before the Next button)
	    if (page < pages-1) {
	      if (page < pages-2) {
	        str += '<li class="out-of-range"><a onclick="createPagination(pages,'+(page+2)+')">...</a></li>';
	      }
	      str += '<li class="page-item no"><a onclick="createPagination(pages, pages)">'+pages+'</a></li>';
	    }
	  }
	  // Show the Next button only if you are on a page other than the last
	  if (page < pages) {
	    str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
		  changePagination(page);
	  }else if(page <= pages){
		  //str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
		  changePagination(page);
	  }
	  str += '</ul>';
	  // Return the pagination string to be outputted in the pug templates
	  document.getElementById('pagination').innerHTML = str;
	  return str;

	}

function changeDateFormat(inputDate) { // expects Y-m-d
	var splitDate = inputDate.split('-');
	if (splitDate.count == 0) {
		return null;
	}
	var year = splitDate[0];
	var month = splitDate[1];
	var day = splitDate[2];

	return day + '-' + month + '-' + year;
}

	    var idOfNumField = event.target.id;
	    var newValue = event.target.value;
	    var index = idOfNumField.match(/\d+/)[0];

	    // Get the row node for the current row
	    var rowNode = gridApi.getRowNode(index);

	    if (!rowNode) {
	        console.error("Row node not found");
	        return;
	    }

	    // Get the min and max range values from the row data
	    var minrange = rowNode.data.minrange;
	    var maxrange = rowNode.data.maxrange;

	    if (minrange === undefined || maxrange === undefined || newValue === undefined) {
	        console.error("Missing values");
	        return;
	    }

	    // Update the result value in the row data
	    rowNode.setDataValue('result', newValue);
	    
	    

	    // Update the review status based on the new value
	    if (parseInt(minrange) <= parseInt(newValue) && parseInt(maxrange) >= parseInt(newValue)) {
	        rowNode.setDataValue('reviewSts', 'OKAY');
	    } else {
	        rowNode.setDataValue('reviewSts', 'NOT OKAY');
	    }

	    // Optionally, you can refresh the grid to reflect the changes immediately
	    //gridApi.refreshCells({ rowNodes: [rowNode], force: true });
	}
	
	function checkReview(){
		var idOfNumField = event.target.id;
	    var newValue = event.target.value;
	    var index = idOfNumField.match(/\d+/)[0];
	    var rowNode = gridApi.getRowNode(index);
	    if (!rowNode) {
	        console.error("Row node not found");
	        return;
	    }
	    rowNode.setDataValue('reviewSts', newValue);
	}
	function checkValidQt(params) {
	    var newValue = parseFloat(params.newValue);  // Convert to float in case of decimals
	    var minrange = parseFloat(params.data.minrange);  // Convert to float
	    var maxrange = parseFloat(params.data.maxrange);  // Convert to float

	    if (isNaN(minrange) || isNaN(maxrange) || isNaN(newValue)) {
	        console.error("Invalid or missing values");
	        return;
	    }

	    // Update the result value in the row data
	    params.data.result = newValue;

	    // Update the review status based on the new value
	    if (minrange <= newValue && maxrange >= newValue) {
	        params.data.reviewSts = 'OKAY';
	    } else {
	        params.data.reviewSts = 'NOT OKAY';
	    }

	    // Optionally refresh the grid to reflect the changes immediately
	    gridApi.refreshCells({ rowNodes: [params.node], force: true });
	}

function filterOnPolicyOnGrid() {
	var policyId=$("#policyFilter").val();
    if (policyId === null) {
        // Clear any existing filters
        gridOptions.api.setFilterModel(null);
        
        // Refresh the grid to show all data
        gridOptions.api.onFilterChanged();
    } else {
        // Apply filter on policyId field (even though it is not shown in the columns)
        gridOptions.api.setFilterModel({
            policyId: {
                type: 'equals',
                filter: policyId
            }
        });
        
        // Refresh the grid to apply the filter
        gridOptions.api.onFilterChanged();
        var totalRowCount = gridOptions.api.getModel().getRowCount();
        $('#totalReq').find('span').html(totalRowCount);
    }
}

											class="form-control" placeholder="View By Date"

											readonly> <i class="ti-calendar picker_calendar"
											id="fromDateCalender" style="top: 14px; right: 0px;"></i>
									</div>
								</div>
								<div class="form-group d-flex">
					<label style="margin: 5px 5px 0px 0px;">Shift:</label>
					<div class="select" style="margin-right: 15px;" id="shiftDivView">
							<select id="shiftType1" class="form-control"
									onblur="removeValid(event)"
									style="width: 170px; padding-left: 7px;">
									<option value="all">All</option>
									<option th:each="c:${shiftLists}" th:value='${c.key}' th:text="${c.name}"></option>
							</select> <span class="focus"></span>
					</div>
				</div>
								<div class="buttonsec btn-hs" id="ttbtn">
									<button class="download-btn" id="downloadResult"
										onclick="downloadResultDetails()">Download</button>
									<button class="new-btn" id="filterBtn" onclick="filterData()">
										<i class="bi bi-search"></i> Search
									</button>
								</div>
							</div>

							<!-- Modal Body -->
							<div class="modal-body row"
								style="height: 450px; overflow-y: scroll;" id="modalBody">
								<!-- Loader overlay -->
								<div id="loaderOverlay" class="custom-loader-overlay"
									style="display: none;">
									<div class="custom-loader"></div>
								</div>

								<!-- Asset Grid -->
								<div class="ag-theme-alpine" id="assetGrid"
									style="width: 100%; height: 415px;"></div>

								<div id="main2" class="mt-4">
									<div class="accordion-item">
										<h2 class="accordion-header" id="headingThree">
											<button class="accordion-button collapsed" type="button"
												data-bs-toggle="collapse" data-bs-target="#collapseOne2"
												aria-expanded="false" aria-controls="collapseOne2">
												Equipment Details</button>
										</h2>

										<div id="collapseOne2"
											class="accordion-collapse collapse hide collapse"
											aria-labelledby="headingOne"
											data-bs-parent="#accordionExample">
											<div class="accordion-body">
												<div class="row">
													<div id="activityEquip2"
														style="width: 100%; height: 200px;"
														class="ag-theme-alpine"></div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>

							<!-- Modal Footer -->
							<div class="modal-footer">
								<button class="btn1" data-dismiss="modal" onclick="submitProgress()">SAVE</button>
								<button class="btn4" data-dismiss="modal" onclick="cancelModalBtn()">CANCEL</button>
							</div>
						</div>
					</div>
				</div>



				<div class="modal fade" id="feedbackModal" tabindex="-1"
					role="dialog" aria-labelledby="feedbackModalScrollable"
					aria-hidden="true">
					<div class="modal-dialog modal-dialog-scrollable" role="document">
						<div class="modal-content">
							<div class="modal-header">
								<h5 class="modal-title" id="feedbackModalScrollable">REPLY
									CONCERNS</h5>
								<button type="button" class="close" data-bs-dismiss="modal"
									aria-label="Close">
									<span aria-hidden="true">&times;</span>
								</button>
							</div>
							<div class="modal-body">
								<section>
									<div class="container">

										<div class="row">
											<div class="col-md-12">

												<div id="chat3">
													<div class="card-body">

														<div class="row">
															<div class="col-12">

																<div data-mdb-perfect-scrollbar="true"
																	style="position: relative;" id="chatDiv"></div>

															</div>
														</div>

													</div>
												</div>

											</div>
										</div>

									</div>
								</section>

							</div>
							<div class="modal-footer">
								<div class="col-md-10">
									<div class="form-group">
										<textarea name="Feedback" id="ticketFeedback"
											class="form-control" style="height: 42px;"></textarea>
									</div>
								</div>
								<button type="button" class="btn btn-primary"
									id="feedbackSendBtn" onclick="sendFeedback()">
									<i class="bi bi-send"></i>
								</button>

								<div class="spinner-border text-purple d-none" role="status"
									id="loader">
									<span class="visually-hidden">Loading...</span>
								</div>
							</div>
						</div>
					</div>
				</div>


				<!-- delete modal start -->
				<div id="delete" class="modal fade show" aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column"></div>
							<div class="modal-body">
								<p>Do you really want to close this ticket? This process
									cannot be undone.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: 0px;">

								<button type="button" class="cancel-btn" data-bs-dismiss="modal"
									onclick="cancelModalBtn();">Cancel</button>
								<button type="button" class="approve-btn"
									onclick="closeTicketOnclick()">Confirm</button>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>

</body>

</html>
