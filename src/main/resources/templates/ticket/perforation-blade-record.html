<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style>
  
.btn-outline-primary {
	color: #007bff;
	background-color: rgb(240 243 241/ 90%);
	background-image: none;
	border-color: #007bff;
	cursor: pointer;
}

.picker_calendar5 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 742px;
}

.picker_calendar6 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 1132px;
}

.voucher-info {
	font-weight: 600;
	font-size: 13px;
}

.subheading.heading {
	font-weight: 700;
	width: 200px;
}

.debit {
	background-image: linear-gradient(to right, lightcoral, white);
}

.credit {
	background-image: linear-gradient(to right, lightgreen, white);
}

.add__p_voucher {
	width: 175px;
}

.form-control {
	font-family: 'Montserrat', sans-serif;
	display: block;
	width: 100%;
	font-size: 12px;
	color: #929292;
	background-color: #ffffff !important;
	background-clip: padding-box;
	border: 1px solid #aeaeae !important;
	transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
	line-height: 1.5;
	border-radius: 0.25rem;
	padding: 2px 6px !important;
	color: black;
	font-weight: bold;
	height: 35px;
	transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
	-webkit-appearance: none;
	-moz-appearance: none;
	appearance: none;
}
.pl-3
{ padding-left:10px;}
 
 input[name="gridInput"] { padding: 0;
    background: rgba(138, 43, 226, 0.1);
    width: 100%;
    border: inset;
    border-color: rgba(138, 43, 226, 0.1);
    height: 100%; }
    input[name="gridInput"]:active, input[name="gridInput"]:focus, input[name="gridInput"]:hover { background: transparent; }
 .ag-cell-value:has(input[name="gridInput"]) { text-overflow: inherit; padding: 0!important; }
  .ag-body-viewport
 {height:500px}
</style>
 <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css" rel="stylesheet">
 

<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script> -->
<script src="https://unpkg.com/exceljs/dist/exceljs.min.js"></script>
 <script src="../javaScript/ticket/perforation-blade-record.js"></script>
 
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div >
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="row row-cols-auto g-3">
						<div class="col">
							<div class="font-design" id="totalPerforationRecord">
								Total Perforation Blade Record(<span></span>)
							</div>
						</div>
						<div class="col ms-auto">
							<!-- Start -->
							<div class="row mb-2">
								<div class="col text-end">
									<div class="buttonsec btn-hs">
										<input type="button" class="btn1" style="width:100px"  id="newButton"
											   value="New Record" onclick="openNewPage()">
										<input type="button" class="btn3" style="width:100px"  id="deletePerforationRecord"
											   value="Delete" onclick="deleteFun()">
									   <input type="button" class="btn1" style="width:100px"  id="approvePerforationRecord"
											   value="Approve" onclick="approveFun()">
									</div>
								</div>


							</div>
							<!-- End -->
						</div>
					</div>



 
					<div id="myGrid" style="width: 100%; height: 500px;"
						class="ag-theme-alpine"></div>

					<div id="peforationRecordDiv">
						<!-- Buttons -->
						<div class="row cols-1 g-3">
							<div class="d-flex justify-content-between innerstickybg">
							<div type="hidden" id="recordId" class="text-white pl-3">Perforation Blade Record:<span id="perforationRecordId"></span></div>
							<div>
							<button id="saveFeChecklist" class="btn1" onclick="savePerforationRecord()">Save</button>
								<button id="cancelButton" class="btn3" onclick="cancelPage()">Cancel</button>
							</div>	
							</div>
							<div class="col">
							
								<!-- Date Fields -->
								<div class="row row-cols-3 g-3">
								
								<div class="cols">
								<label for="yearDropdown" class="text-end w-160">Select Year</label> <select
									id="yearDropdown" class="form-control" onchange="updateGridData()">
									<!-- Year options will be dynamically populated -->
								</select>
							</div>
									<div class="cols">
										<label for="monthDropdown" class="text-end w-160">Select
											Month</label> <select id="monthDropdown" class="form-control" onchange="updateGridData()">
											<!-- Month options will be dynamically populated -->
										</select>
									</div>

								</div>
							</div>
							<!-- ag-Grid Section -->
							<div id="myNewGrid" style="width: 100%; height: 500px;"
								 class="ag-theme-alpine"></div>
						</div>
					</div>
                 <!-- delete modal start -->
					<div id="delete" class="modal fade show" tabindex="-1"
						role="dialog" data-bs-backdrop="static" data-bs-keyboard="false"
						aria-labelledby="staticBackdropLabel" aria-hidden="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p>Do you really want to delete this data? This process
										cannot be undone.</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">

									<button type="button" class="cancel-btn"
										data-bs-dismiss="modal" onclick="cancelModalBtnDlt();">Cancel</button>
									<button type="button" class="delete-btn"
										onclick="deletePerforationRecord()">Delete</button>
								</div>
							</div>
						</div>
					</div>
					<!-- approve modal start -->
					<div id="approveModal" class="modal fade show" tabindex="-1"
						role="dialog" data-bs-backdrop="static" data-bs-keyboard="false"
						aria-labelledby="staticBackdropLabel" aria-hidden="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p>Do you want to approve this logbook? Once done you will
										not be able to make further changes.</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">

									<button type="button" class="cancel-btn"
										data-bs-dismiss="modal" onclick="cancelModalBtnApr();">Cancel</button>
									<button type="button" class="new-btn"
										onclick="approvePerforationRecord()">Approve</button>
								</div>
							</div>
						</div>
					</div>
				</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
