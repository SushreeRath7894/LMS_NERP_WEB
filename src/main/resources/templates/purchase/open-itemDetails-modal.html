					filter : false,

					}
				}, {
					headerName : "Product Name",
					field : "productName",
					width : 200,
				}, {
					headerName : "Brand",
					field : "brand",
					cellStyle : {
						textAlign : 'center'
					}

				}, {

					headerName : "Category",
					field : "productCategoryText",
					width : 200,
				}, {
					headerName : "Mode",
					field : "mode",
					cellStyle : {

					}
				}, {

					cellStyle : {

				}, {

				}, {

			rowSelection : 'multiple',

				filter : true,
				resizable : true,
				width : 149,
				height : 10
			},
			rowSelection : 'multiple',
			suppressRowClickSelection : true,
			onSelectionChanged : onSelectionChangedproduct12
		};

		function onSelectionChangedproduct12() {
			var selectedRows = gridOptions12.api.getSelectedRows();

			var rowCount = 0;
			selectedRows.forEach(function(i) {
				rowCount = rowCount + 1;
			});
			if (rowCount > 0) {
				$('#deleteproduct1').attr("disabled", false);
				$('#newBtn1').attr("disabled", true);

			} else {
				$('#deleteproduct1').attr("disabled", false);
				$('#newBtn1').attr("disabled", false);

			}
		}

					headerCheckboxSelection : true,
					headerCheckboxSelectionFilteredOnly : true,
					checkboxSelection : true,
					width : 10,
					sortable : false,
					filter : false,
					resizable : true
				},
				{
					headerName : "SKU",
					field : "sku",

								+ '","' + params.data.productId
								+ '") href="javascript:void(0)">'
								+ params.data.sku + '</a>';

				}, {
					headerName : "Manufacture Item",
					field : "manufacture",

				}, {

				}, {

					field : "variationType"
				}, {
					headerName : "Variation Value",
					field : "variationValue"
				}, {

					field : "unit"
				}, {

					}
				}, {

				resizable : true,

				height : 10
			},

		};

		function getVendorListForProduct() {
			var id=0;
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$.ajax({
					type : "GET",
					url : "itemDetails-page-get-VendorList?id=" + id,
					success : function(response) {
						if (response.message == "success") {
							$("#itemVendorId").empty();
							var option = $("<option></option>");
							$(option).val(null);
							$(option).html("Select");
							$("#itemVendorId").append(option);
							for (var i = 0; i < response.body.length; i++) {
								var option = $("<option></option>");
								$(option).val(response.body[i].key);
								$(option).html(response.body[i].name);
								$("#itemVendorId").append(option);
							}
							if(rid!="" || rid!=null || rid!="null"){
								$("#itemVendorId").val(rid);
							}
						}
					},
					error : function(e) {
					}
				});	
		}	
		function deleteProductOnclickForPr() {
			var selectedRows = gridOptions12.api.getSelectedRows();
			var selectedRowsString = '';
			var selectedId = '';
			selectedRows.forEach(function(selectedRow, index) {
				if (index > 0) {
					selectedRowsString += ',';
					selectedId += ',';
				}
				selectedRowsString += '"' + selectedRow.productId + '"';
				selectedId += selectedRow.productId;
			});
			if (selectedRowsString) {
				$('.loader').show();
				$("body").addClass("overlay");

				/* var item = {};
				item.vendorLocationId = selectedRowsString; */
				$.ajax({
					type : "POST",
					url : "itemDetails-page-product-delete?id=" + selectedRowsString
							+ "&simpleid=" + selectedId,
					success : function(response) {
						if (response.message == "success") {
							console.log(response.message)
							$("#delete").modal('hide');
							cancelModalBtnForPr();
							AddProduct();
							
							$('.loader').hide();
							$("body").removeClass("overlay");
							$('#newBtnForPr').show();
							 $('#newBtnForPr').attr("disabled", false);
							 $('#deleteproduct1').attr("disabled", true);
							
							viewProductData();
						}
					},
					error : function(data) {
						console.log(data);
					}
				})

			} else {
				$("#alert").modal('show');
				document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
			}
			/* $('#deleteVendor').modal('hide');  */

		}
