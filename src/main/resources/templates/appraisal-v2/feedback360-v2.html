<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}" lang="en">
<head>
<meta charset="UTF-8">
<title>NERP</title>
<script src="/javaScript/appraisal-v2/feedback.js"></script>
<link rel="stylesheet" href="/css/appraisal-v2/configuration-v2.css">
<link rel="stylesheet" href="/css/appraisal-v2/self-appraisal-v2.css">
<style type="text/css">
.vital-card {
	/* border: 1px solid #ddd;
	border-radius: 8px !important;
	padding: 16px !important;
	margin-bottom: 16px;
	flex-grow: 1;
	position: relative;
	transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s
		ease-in-out; */
		background-color: #ffffff;
    color: #BF05FF;
    text-align: center;
    padding: 15px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 13px;
    border: solid 1px #e3e2e2;
}

/* .vital-card:hover {
	transform: translateY(-5px);
	box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
} */

.eye-icon{
    position: absolute;
    right: 16px;
    color: rgb(191, 5, 255);
}

.no-data{
  color: rgb(191, 5, 255);
}
</style>
</head>
<body>
	<section>
		<div layout:fragment="content" class="maincontent">
			<div class="container-fluid">
				<div class="d-flex">
					<div class="maincontentsec">
						<input type="hidden" id=userId th:value="${session.USER_ID}">
						<!--Tabbination 1 Start-->
						<div id="parent-tab" class="tab-pane" role="tabpanel">
							<div class="d-flex flex-column flex-lg-row">
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between border-bottom p-2 flex-wrap">
										
										<div class="col-lg-3 col-12">
												<div class="form-group">
													<label>Financial Year</label>
													<div class="select">
														<select class="" id="financialYear"
															onblur="removeValid(event);" onchange="getAllDesignationGoal();">
															<option value="">Select</option>
														</select>
													</div>
												</div>
											</div>
											
											<div class="d-flex align-items-center col-md-8 col-12 mt-30">
												<input class="form-control me-2" type="text"
													placeholder="Search" onkeyup="SearchUserInput(event)"
													id="quickFilter" autocomplete="off">
												<div class="searchicon position-relative">
													<span style="display: none;" id="closeKey"
														onclick="gridOptionsEmployee.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalEmp').find('span').html(gridOptionsEmployee.api.getModel().getRowCount());"
														class="close_i close-search"> <!-- <i
														class="ti-close srchicon"></i> -->
													</span>
													<button class="btn btn-primary go-btn" type="button"
														onclick="onQuickFilterChanged()">Go</button>
												</div>
												<button class="btn go-btn w-auto mx-2" type="button"
													onclick="resetBtn()">Reset</button>
											</div>

											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" aria-label="Expand"
												data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
										<div class="card m-2 p-2">
											<div id="myGrid" style="width: 100%; height: 100vh;"
												class="ag-theme-alpine"></div>
										</div>
									</div>
								</div>
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box">

										<div
											class="d-flex justify-content-between align-items-center p-2 border-bottom">
											<!--Right Inner Tab Start-->
											<ul class="nav nav-pills newtab" role="tablist">
											<li class="nav-item" role="presentation"><a
													type="button" class="nav-link active" data-bs-toggle="pill"
													href="#review-360-v2" aria-selected="true" role="tab">360°</a>
												</li>
												<li class="nav-item" role="presentation"><a
													type="button" class="nav-link " data-bs-toggle="pill"
													href="#goal-v2" aria-selected="false" role="tab"
													tabindex="-1">Review</a></li>
												
											</ul>

											<button class="btn btn-primary max-btn" id="collapseButtonL1"
												type="button" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												aria-label="Expand" data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>
										</div>
										<div class="tab-content flex-fill">
											

											<div class="tab-pane show active h-100" id="review-360-v2"
												role="tabpanel" aria-labelledby="goal-v2-tab">
												<div class="d-flex flex-column gap-2 p-2 h-100">

													<!-- Header Action Buttons -->
													<!-- 	<div
														class="d-flex justify-content-end gap-2 border rounded p-2">

														<button class="btn edit-btn m-0"
															onclick="nextBtnFunction('goal-v2')">Previous</button>

													</div> -->
													<div
														class="d-flex justify-content-end gap-2 border rounded p-2">
														<button class="btn go-btn" title="Add"
															onclick="addFeedback()" id="remarkBtn">
															<i class="fa fa-plus-square" aria-hidden="true"></i>
														</button>
														<button class="btn go-btn" id="saveRemarks" title="Save"
															onclick="savemanagerRemarks();">
															<i class="fa-solid fa-floppy-disk"></i>
														</button>

														<button class="btn go-btn" id="cancelBtn" title="Cancel"
															onclick="cancelRemarks();">
															<i class="fa fa-window-close" aria-hidden="true"></i>
														</button>

														<button class="btn btn-primary edit-btn br-s-btn-tx"
															title="Save" onclick="saveTratment()"
															style="display: none;">Save</button>
														<button class="btn btn-primary edit-btn br-s-btn-tx"
															title="Cancel" onclick="cancelTreatment()"
															style="display: none;">Cancel</button>

													</div>

													<!-- Card Section -->
													<div class="card p-2">
														<!-- <div id="managerRemarksContainer"></div> -->
														<!-- Goal Details -->
														<div class="row" id="feedbackDiv">
															<input type="hidden" id="reviewId">
															<div class="col-lg-6">
																<div class="form-group mb-20">
																	<label>Manager Name</label> <select
																		class="form-select chosen-select" id="employeeName"
																		multiple onchange="setEmailFromDropdown()"
																		onblur="removeValid(event)">
																		<!-- <option value="">Select</option> -->
																		<option th:each="c,iter:${employeeList}"
																			th:value="${c.key}" th:text="${c.name}"
																			th:attr="data-code=${c.code}"></option>
																	</select>
																</div>
															</div>
															<div class="col-lg-6">
																<div class="mb-20">
																	<label>Email</label><input type="text" id="email"
																		class="form-control email-input"
																		title="Enter one or more email addresses, separated by ," />
																</div>
															</div>
															<div class="card p-2">
																<label>Objectives:</label>
																<div class="row">
																	<div class="col-lg-12">
																		<textarea id="description">
           																 </textarea>
																	</div>
																</div>
															</div>
															<!-- KRA Table -->
															<div
																class="d-flex justify-content-end gap-2 border rounded p-2">

																<button class="btn edit-btn m-0 wd-100" onclick="addKra();">Add
																	Row</button>

															</div>
															<div class="col-md-12 mt-3 table-responsive">

																<table class="table table-bordered" id="kra-table">
																	<thead>
																		<tr>
																			<th style="width: 40%;">Key Result Areas (KRAs)</th>
																			<th style="width: 40%;">Notes</th>
																			<th style="width: 20%;">Actions</th>
																		</tr>

																	</thead>
																	<tbody>
																	</tbody>
																</table>

															</div>
															<div class="col-md-12">
																<label for="description">Remarks:</label>
																<textarea id="remarks" rows="8" class="form-control"
																	required></textarea>
															</div>
														</div>
														<div 
															id="feedbackDetailsContainer"></div>
													</div>
												</div>
											</div>
											<div class="tab-pane fade fade  h-100" id="goal-v2"
												role="tabpanel" aria-labelledby="goal-v2-tab">
												<div class="d-flex flex-column gap-2 p-2 h-100">
													<div
														class="d-flex justify-content-end gap-2 border rounded p-2">
														<!-- 	<button class="btn edit-btn m-0" onclick="previousTab()">Previous</button> -->
														<button class="btn edit-btn m-0"
															onclick="nextBtnFunction('review-360-v2')">Previous</button>

													</div>

													<div class="card p-2">
														<table class="table table-bordered card-height-details"
															id="kra-table-dep" style="width: 100%;">
															<thead class="table-dark">
																<tr>
																	<th style="width: 20%;">KPIs</th>
																	<th style="width: 15%;">Weightage (%)</th>
																	<th style="width: 10%;">Self Ratings</th>
																	<th style="width: 20%;">Self Notes</th>
																	<th style="width: 20%;"
																		th:if="${session.USER_ROLES != 'ROL031'}">Manager
																		Ratings</th>
																	<th style="width: 20%;"
																		th:if="${session.USER_ROLES != 'ROL031'}">Manager
																		Notes</th>
																</tr>
															</thead>
															<tbody></tbody>
														</table>

														<div class="row">
															<div class="col-lg-12">
																<div class="row">
																	<div class="col-md-6">
																		<div class="rating-container">
																			<label>Overall Self Ratings:</label>
																			<div class="rating-group">
																				<input type="radio" id="self-star5" name="rating"
																					value="5"> <label for="self-star5">★</label>

																				<input type="radio" id="self-star4" name="rating"
																					value="4"> <label for="self-star4">★</label>

																				<input type="radio" id="self-star3" name="rating"
																					value="3"> <label for="self-star3">★</label>

																				<input type="radio" id="self-star2" name="rating"
																					value="2"> <label for="self-star2">★</label>

																				<input type="radio" id="self-star1" name="rating"
																					value="1"> <label for="self-star1">★</label>
																			</div>
																		</div>
																	</div>

																	<div class="col-md-6">
																		<div class="rating-container">
																			<label>Overall Manager Ratings:</label>
																			<div class="rating-group">
																				<input type="radio" id="man-star5" name="ratingMan"
																					value="5"> <label for="man-star5"
																					title="5 stars">★</label> <input type="radio"
																					id="man-star4" name="ratingMan" value="4">
																				<label for="man-star4" title="4 stars">★</label> <input
																					type="radio" id="man-star3" name="ratingMan"
																					value="3"> <label for="man-star3"
																					title="3 stars">★</label> <input type="radio"
																					id="man-star2" name="ratingMan" value="2">
																				<label for="man-star2" title="2 stars">★</label> <input
																					type="radio" id="man-star1" name="ratingMan"
																					value="1"> <label for="man-star1"
																					title="1 star">★</label>
																			</div>
																		</div>
																	</div>



																</div>
															</div>
														</div>

														<div class="row">
															<div class="col-lg-12">
																<div class="row">
																	<div class="col-md-6">
																		<label for="summary1">Employee Summary:</label>
																		<textarea id="summary1" rows="4" class="form-control"
																			required></textarea>
																	</div>
																	<div class="col-md-6">
																		<label for="summary2">Manager Summary:</label>
																		<textarea id="summary2" rows="4" class="form-control"
																			required></textarea>
																	</div>

																</div>
															</div>
														</div>
														<div class="row height">
																<h2 class="discussion">Requirement Discussion</h2>

																<div class="col-md-6">
																	<label for="requirementDescription"><i class="bi bi-pin-angle-fill employee"></i>
																		Requested Requirement</label>
																	<textarea id="requirementDescription"
																		name="requirement_description" rows="4"
																		placeholder="Describe the requirement in detail..."></textarea>
																</div>

																<div class="col-md-6">
																	<label for="managerResponse"><i class="fa-solid fa-user-tie manager"></i> Manager's
																		Response</label>
																	<textarea id="managerResponse" name="manager_response"
																		rows="4"
																		placeholder="Manager's feedback or response..."></textarea>
																</div>
															</div>
														
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
