<script type="text/javascript">
	function setModule(moduleId) {
		sessionStorage.setItem('module', moduleId);
		sessionStorage.setItem('function', $("#fun_" + moduleId).val());
		sessionStorage.setItem('activity', $("#act_" + moduleId).val());
		sessionStorage.setItem('moduleName', $("#mod_" + moduleId).text());
		window.location.href = "/index-get-function-list/" + moduleId;
	}
	$(document).ready(function() {
		var userId = $("#userId").val();
		sessionStorage.setItem('userId', userId);
		if ($("#MENU_COUNT").val() == 1) {
			var moduleId = $("#MODULE_ID").val();
			sessionStorage.setItem('module', moduleId);
			sessionStorage.setItem('function', $("#fun_" + moduleId).val());
			sessionStorage.setItem('activity', $("#act_" + moduleId).val());
			sessionStorage.setItem('moduleName', $("#mod_" + moduleId).text());
			window.location.href = "/index-get-function-list/" + moduleId;
		}
	});
	let triggerExpansionR = (n) => {
	    let targetSectionR = document.querySelector('#collapseWidthR' + n);
	    let targetSectionL = document.querySelector('#collapseWidthL' + n);
	    let collapseButtonR = document.querySelector('#collapseButtonR' + n);
	    let collapseButtonL = document.querySelector('#collapseButtonL' + n);
	    let expandIconR = document.querySelector('#expandIconR' + n);
	    let expandIconL = document.querySelector('#expandIconL' + n);
	    let shrinkIconL = document.querySelector('#shrinkIconL' + n);
	    let shrinkIconR = document.querySelector('#shrinkIconR' + n);

	    if (targetSectionR.classList.contains('expanded')) {
	        targetSectionR.classList.remove('expanded');
	        collapseButtonR.setAttribute('title', 'Expand');
	        reInitTooltip(collapseButtonR);
	        targetSectionL.classList.remove('hide-expansion');
	        expandIconR.classList.remove('d-none');
	        shrinkIconR.classList.add('d-none');
	    } else {
	        targetSectionR.classList.add('expanded');
	        collapseButtonR.setAttribute('title', 'Shrink');
	        reInitTooltip(collapseButtonR);
	        targetSectionL.classList.add('hide-expansion');
	        expandIconR.classList.add('d-none');
	        shrinkIconR.classList.remove('d-none');
	    }
	}
	let triggerExpansionL = (n) => {
	    let targetSectionR = document.querySelector('#collapseWidthR' + n);
	    let targetSectionL = document.querySelector('#collapseWidthL' + n);
	    let collapseButtonR = document.querySelector('#collapseButtonR' + n);
	    let collapseButtonL = document.querySelector('#collapseButtonL' + n);
	    let expandIconR = document.querySelector('#expandIconR' + n);
	    let expandIconL = document.querySelector('#expandIconL' + n);
	    let shrinkIconL = document.querySelector('#shrinkIconL' + n);
	    let shrinkIconR = document.querySelector('#shrinkIconR' + n);

	    if (targetSectionL.classList.contains('expanded')) {
	        targetSectionL.classList.remove('expanded');
	        collapseButtonL.setAttribute('title', 'Expand');
	        reInitTooltip(collapseButtonL);
	        targetSectionR.classList.remove('hide-expansion');
	        expandIconL.classList.remove('d-none');
	        shrinkIconL.classList.add('d-none');
	    } else {
	        targetSectionL.classList.add('expanded');
	        collapseButtonL.setAttribute('title', 'Shrink');
	        reInitTooltip(collapseButtonL);
	        targetSectionR.classList.add('hide-expansion');
	        expandIconL.classList.add('d-none');
	        shrinkIconL.classList.remove('d-none');
	    }
	}

	let reInitTooltip = (button) => {
	    // Reinitialize the tooltip to reflect the updated title
	    const tooltip = bootstrap.Tooltip.getInstance(button); // Get the existing tooltip instance
	    if (tooltip) {
	        tooltip.dispose(); // Destroy the old instance
	    }
	    new bootstrap.Tooltip(button); // Reinitialize the tooltip
	}

	$(() => {
	    /* Enable tooltips in this page */
	    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
	    // console.log("tooltipTriggerList", tooltipTriggerList);
	    var tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
	        return new bootstrap.Tooltip(tooltipTriggerEl)
	    })
	});
	
	toastr.options = {
		'closeButton': true,
		'debug': false,
		'newestOnTop': false,
		'progressBar': false,
		'positionClass': 'toast-bottom-center',
		'preventDuplicates': false,
		'showDuration': '1000',
		'hideDuration': '1000',
		'timeOut': '3000',
		'extendedTimeOut': '1000',
		'showEasing': 'swing',
		'hideEasing': 'linear',
		'showMethod': 'fadeIn',
		'hideMethod': 'fadeOut',
	}
</script>
  <script>
