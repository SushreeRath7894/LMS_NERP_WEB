<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"></meta>
    <title>Ori food</title>
    <style>
        table{
            margin:10px 0px;
        }
        table td,th{
            font: size 16px;
      padding: 3px 5px;
      height: 30px;
      white-space: nowrap;
        }
    .annexure {
    font-size: 20px;
    text-align: center;
    font-weight: 600;
}
    .heading
    {
      text-align: center;
      font-weight: bold;
       text-transform: uppercase;

    }
    .d-flex{display: flex;}
 .bdr-sm {
      width: 30%;
      border-bottom: 1px solid #000;
    }
    </style>
</head>
<body>

    <table border="1" width="100%" cellspacing="0" cellpadding="0">
        <tr>
            <td class="heading"><img src="${logo}" height="60" width="180" /></td>
    
            <td class="heading">
                <div class="annexure">Format 05</div>
                 <div class="heading">Refrigerator Temperature<br> Monitoring Record</br></div>
             </td>

            <td class="heading">Orifood And Beverage<br> Pvt.Ltd.</br> </td>
        </tr>
    </table>
    <table width="100%" cellspacing="0" cellpadding="0">
        <tr>
            <td><div class="d-flex">Month- <span th:text="${dtls[0].month}"></span>
                  </div></td>
        </tr>
    </table>
    
    <table border="1" width="100%" cellspacing="0" cellpadding="0">
        <tr align="center">
            <th width="25%">Date</th>
            <th width="20%">Time</th>
            <th width="20%">Temp °C</th>
            <th width="35%">Sign.</th>
        </tr>
    
        <tr th:each="items: ${dtls}">
            <td width="25%" th:text="${items.date}" align="center"></td>
            <td width="20%" th:text="${items.time}" align="center"></td>
            <td width="20%" th:text="${items.temp}" align="center"></td>
            <td width="35%" th:text="${items.sign}" align="left"></td>
        </tr>
        
        </table>

<table width="100%" cellspacing="0" cellpadding="0">
    <tr>
        <td width="50%">
            <div><b>Note:</b><span>Min. Temp.-2°C</span></div>
            <div>Max. Temp.-<span>8°C</span></div>
            <br></br>

            <div>Ref. No.:-<span>OBPL/QA/012/A/05</span></div>
            <div>Issue No.:-<span>01</span></div>
            <div>Date of Issue:<span>01/07/2022</span></div>
        </td>
        <td width="50%" align="right" valign="top"><b>QA Manager</b></td>
    </tr>
</table>
</body>
</html>
