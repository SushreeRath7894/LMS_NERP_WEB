//master save data



function masterSaveData(){
	activityOptions.api.stopEditing();
	activityOptions1.api.stopEditing();
		$(".formValidation").remove();
		var valid= true;
		var datas = [];
		var i=-1;
		var type="";
		var funId = sessionStorage.getItem('funId');
		if(funId == 'FUN0103'){
			type = 'mt';
		}else if(funId == 'FUN0104'){
			type = 'ct';
		}
		var rowCount = activityOptions.api.getDisplayedRowCount();
		
		if(rowCount > 0){
			
			
			activityOptions.api.forEachNode(function(rowNode, index) {
				var item = rowNode.data;
				item.gridSlNo = "2";
				
				
				if (item.sampleDate == null || item.sampleDate == "") {
					valid = validationUpdated("Date Required", "sampleDate");
				 }			
				     item.type = type;
				     item.sampleId = $("#sampleReceivingId").html();
				     item.sampleDate = $("#sampleDate").val();
				     item.remarks = $("#remarks").val();
				     item.reviewedBy = $("#reviewedBy").val();
				     item.analyzedBy = $("#analyzedBy").val();
				     item.resultBy = $("#resultBy").val();
				    
				     console.log("rowNode2====",item);
				
				     if(valid){
				        	datas.push(item);
				         }
			});
			
			activityOptions1.api.forEachNode(function(rowNode, index) {
				var item1 = rowNode.data;
				item1.gridSlNo = "1";
				datas.push(item1);     
			});

	
		
		if (valid) {
			saveDetails(datas);
			}
		} else {
			$("#messageParagraph").text(
			"Please Add Atleast One Details");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
		}
		console.log("data1-----",datas);
	
}
function saveDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "sample-receiving-analysis-details-save",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
		//	var itemName = $("#itemname option:selected").text();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				view();
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Test Parameter For "+itemName+" Already Exist.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				$("#itemid").val('');
				$("#itemname").val('');
				$("#description").val('');
				activityOptions.api.setRowData();
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

	 function changeDateFormat(inputDate) { // expects Y-m-d
			var splitDate = inputDate.split('-');
			if (splitDate.count == 0) {
				return null;
			}
			var year = splitDate[0];
			var month = splitDate[1];
			var day = splitDate[2];

			return day + '-' + month + '-' + year;
		}
