});

	    this.eInput.value = params.value;

function onRowSelection() {
    var stackStatus = '';
    var selectedNodes = gridOptions.api.getSelectedNodes();

    var selectedData = selectedNodes.map(node => node?.data);
    var id = selectedData?.map(node => node.vreification_id);
    var allocationId = selectedData?.map(node => node.allocationId);

    var rowCount = 0;
    selectedNodes.forEach(function(selectedNodes, index) {
        window.value = selectedNodes.data.spdata;
        stackStatus = selectedNodes.data.stackingStatus;
        rowCount = rowCount + 1;
    });
    
    let d = selectedNodes[0]?.data;
    
    
    var spdata = window.value;
    if (rowCount > 0) {
    	
    	$("#categoryId").val(d.category_id);
    	$("#quantity").val(d.quantity);
    	$("#vreificationId").val(d.vreification_id);
    	
    	getItemList(d.sku_id,'OC');
    	
        $('#add').attr("disabled", true);
        if (spdata == "Requested") {
            $('#approveRequest').attr("disabled", true);
        } else {
            $('#approveRequest').attr("disabled", false);

        }
        if (spdata != "Pending") {
            $('#deleteData').attr("disabled", true);
        } else {
            $('#deleteData').attr("disabled", false);
        }

        $("#categoryId").attr("disabled", true);
        $("#itemName").attr("disabled", true);
        $("#quantity").attr("disabled", true);
        $("#unit").attr("disabled", true);
        
    } else {
        $('#add').attr("disabled", false);
        $('#deleteData').attr("disabled", true);
        $('#approveRequest').attr("disabled", true);

        $("#categoryId").attr("disabled", false);
        $("#itemName").attr("disabled", false);
        $("#quantity").attr("disabled", false);
        $("#unit").attr("disabled", false);

        $("#main").empty();
        $("#itemName").empty();
        $("#itemName").append("<option value=''>Select</option>");
        $("#itemName").val("").trigger('change');
        $("#quantity").val("");
        $("#unit").val("");
        cancelAllocSec();
        $("#allocate").hide();
        $("#vreificationId").val('');
    }
}

function getItemList(rtid,t = '') {
    var categoryId = $("#categoryId").val();
    if (categoryId) {
        $.ajax({
            type: 'GET',
            url: 'warehouse-allocation-getitemList?id=' + categoryId,
            contentType: false,
            success: function(response) {
                if (response.code == "success") {
                    $("#itemName").empty();
                    var option = $("<option></option>");
                    $(option).val(null);
                    $(option).html("Select");
                    $("#itemName").append(option);
                    for (var i = 0; i < response.body.length; i++) {
                        var option = $("<option></option>");
                        $(option).val(response.body[i].key);
                        $(option).html(response.body[i].name);
                        $(option).attr("code", response.body[i].code);
                        $(option).attr("data", response.body[i].data);
                        $("#itemName").append(option);
                    }
                    if (rtid != "" && rtid != "") {
                        $("#itemName").val(rtid);
                        	if(t && $("#warehouseId").val()) {
                        		getFilterWarehouseData();
                        	}
                    }
                } else {
                	$("#itemName").empty();
                    var option = $("<option></option>");
                    $(option).val(null);
                    $(option).html("Select");
                    $("#itemName").append(option);
                }
            },
            error: function(e) {
                console.log(e);
                
                $("#itemName").empty();
                var option = $("<option></option>");
                $(option).val(null);
                $(option).html("Select");
                $("#itemName").append(option);
            }
        });
    }
}

function getFilterWarehouseData() {
	
	if($("#warehouseId").val() == null || $("#warehouseId").val() == '') {
		toastr.error("Warehouse required")
		return;
	}
	if($("#categoryId").val() == null || $("#warehouseId").val() == '') {
		toastr.error("Category required")
		return;
	}
	if($("#itemName").val() == null || $("#itemName").val() == '') {
		toastr.error("Item required")
		return;
	}
	if($("#quantity").val() == null || $("#quantity").val() == '') {
		toastr.error("Quantity required")
		return;
	}
	
	let data = {};
	
	data.key = $("#warehouseId").val();
	data.code = $("#zoneId").val();
	data.data = $("#rackId").val();
	data.name = $("#itemName").val();
	
	$("#main").empty();
	
	$('.loader').show();
		$("body").addClass("overlay");
		$.ajax({
		    type: "POST",
		    url: "warehouse-allocation-get-avl-bin",
		    dataType: "json",
		    contentType: "application/json",
		    data: JSON.stringify(data),
		    success: function(response) {
		        if (response.code == "success") {
		        	let p = response.body[0];
		        	if(p) {
		        		$("#allocate").show();
		        		let dd = JSON.parse(p);
		        		let d = formatToTreeData(dd);
		        		if(d.length > 0) {
							let b = '';
							
							d.forEach(a => {
								
								b = b + '<h5 class="sub-header-new">'+a.zone_name+'</h5>';
								
								a?.bin_details?.forEach(c => {
									b = b + '<div class="btn btn-primary edit-btn pd--10 bin-for-all" id="'+c.bin_id+'" data-name="'+c.bin_name+'" data-qty="'+c.qty+'" data-zone="'+c.zone_id+'">'+c.bin_name+'('+c.qty+')'+'</div>';
								})
							})
							$("#main").append(b);
							
							$(".bin-for-all").click(function() {
								$(this).toggleClass('bin-all-active');
							});
						}
		        	} else {
		        		
		        	}
		        	$('.loader').hide();
			        $("body").removeClass("overlay");
		        } else {
		        	$('.loader').hide();
			        $("body").removeClass("overlay");
		        }
		        
		    },
		    error: function(data) {
		        console.log(data);
		        toastr.error("Something went wrong")
		        $('.loader').hide();
		        $("body").removeClass("overlay");
		    }
		})
}

function formatToTreeData(data) {
	const groupedData = Object.values(data.reduce((acc, { zone_name, qty, bin_id, bin_name, zone_id }) => {
	    if (!acc[zone_name]) {
	        acc[zone_name] = { zone_name, bin_details: [] };
	    }
	    acc[zone_name].bin_details.push({ qty, bin_id, bin_name, zone_id });
	    return acc;
	}, {}));
	return groupedData;
}
function allocate(){
	
	let binCount = $(".bin-all-active").length;
	let itemQty = $("#quantity").val();
	let dataset = []
	
	if(itemQty < binCount) {
		toastr.error("Quantity will always be greater than bin")
		return;
	}
	
	if ($("#warehouseId").val() == null || $("#warehouseId").val() == '') {
        toastr.error("Warehouse required")
        return;
    }
    if ($("#categoryId").val() == null || $("#warehouseId").val() == '') {
        toastr.error("Category required")
        return;
    }
    if ($("#itemName").val() == null || $("#itemName").val() == '') {
        toastr.error("Item required")
        return;
    }
    if ($("#quantity").val() == null || $("#quantity").val() == '') {
        toastr.error("Quantity required")
        return;
    }
	
	let i = binCount;
	let q = itemQty;
	let fairShare = Math.floor(q / i);
	$(".bin-all-active").each(function(){
		
		let allocate = Math.min(fairShare, q);
		
		let a = {};
		a.bin_id = $(this).attr('id');
		a.bin_name = $(this).attr('data-name');
		a.qty = $(this).attr('data-qty');
		a.zone_id = $(this).attr('data-zone');
		a.slNoFrom = 0;
		a.slNoTo = 0;
		a.binRemark = '';
		
		if(allocate > a.qty) {
			a.binQuntity = a.qty;
			q -= a.qty;
		} else {
			a.binQuntity = allocate;
			q -= allocate;
		}
		dataset.push(a)
	})
	
	dataset.forEach(a =>{
		let availableSpace = a.qty - a.binQuntity;
		let extra = Math.min(q, availableSpace);
		a.binQuntity = parseInt(a.binQuntity) + parseInt(extra);
		q -= extra;
	})
	
	if(q > 0) {
		toastr.error("There is "+q+" quantity left, add some more bin to allocate")
		return;
	}
	
	gridOptionsAllocationQty.api.setRowData(dataset);
	$("#itemDetailsId").show();
	$("#binDetailsId").hide();
	
	$("#allocate,#filterBtn,#warehouseId,#zoneId,#rackId,#categoryId,#itemName,#quantity,#unit").attr("disabled",true);
}

}

function saveAllocBin() {

    var datas = [];
    
    let grnId = $("#vreificationId").val() == undefined ? '' : $("#vreificationId").val();
    
    if(type=='pharmacy') {
    	if($("#batchNo").val() == '' || $("#batchNo").val() == null || $("#batchNo").val() == undefined) {
    		toastr.error("Batch number required")
    		return;
    	}
    	if($("#manufactureDate").val() == '' || $("#manufactureDate").val() == null || $("#manufactureDate").val() == undefined) {
    		toastr.error("Manufactured date required")
    		return;
    	}
    	if($("#bestBeforeDate").val() == '' || $("#bestBeforeDate").val() == null || $("#bestBeforeDate").val() == undefined) {
    		toastr.error("Expired date required")
    		return;
    	}
    }

    let sumBinQty = 0;
    gridOptionsAllocationQty.api.forEachNode(function(rowNode, indrx) {
        var obj = {};
      
        obj.allocationId = $("#allocationId").val() == undefined ? '' : $("#allocationId").val();
        obj.vreificationId = grnId;
        obj.warehouseId = $("#warehouseId").val();
        obj.categoryId = $("#categoryId").val();
        obj.itemName = $("#itemName").val();
        obj.quantity = $("#quantity").val();
        obj.batchNo = $("#batchNo").val();
        obj.manufactureDate = $("#manufactureDate").val();
        obj.bestBeforeDate = $("#bestBeforeDate").val();
        obj.binId = rowNode.data.bin_id;
        obj.zoneId = rowNode.data.zone_id;
        obj.capacityQuantity = rowNode.data.qty;
        obj.binQuntity = parseInt(rowNode.data.binQuntity);
        obj.slNoFrom = rowNode.data.slNoFrom;
        obj.slNoTo = rowNode.data.slNoTo;
        obj.binRemark = rowNode.data.binRemark;
        sumBinQty = sumBinQty + obj.binQuntity;
        datas.push(obj);
      	
    });
    
    let zeroBinQty = datas.filter(a => a.binQuntity == 0 || a.binQuntity == '' || a.binQuntity == undefined);
    
    if(zeroBinQty && zeroBinQty.length > 0) {
    	toastr.error("Bin quantity won't be 0")
		return;
    }
    
    if(sumBinQty > $("#quantity").val()) {
    	toastr.error("You can't allocate more than "+$("#quantity").val())
		return;
    }
    
    $('.loader').show();
	$("body").addClass("overlay");
	$.ajax({
	    type: "POST",
	    url: "warehouse-allocation-save-allocation",
	    contentType: "application/json",
	    data: JSON.stringify(datas),
	    success: function(response) {
	        if (response.code == "success") {
	          	toastr.success("Item allocated successfully");
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	            if(grnId != '' && grnId != null) {
	            	view();
	            }
	            cancelAllocSec();
            	$("#main").empty();
            	$("#warehouseId").val('');
            	$("#vreificationId").val('');
            	$("#categoryId").val('');
            	$("#quantity").val('');
            	$("#zoneId").empty();
            	$("#zoneId").append('<option value="">Select</option>');
            	$("#rackId").empty();
            	$("#rackId").append('<option value="">Select</option>');
            	$("#itemName").empty();
            	$("#itemName").append('<option value="">Select</option>');
            	$("#allocate").hide();
	        } else {
	            toastr.error(response.message);
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	        }
	    },
	    error: function(data) {
	        console.log(data);
	        toastr.error("Something went wrong");
	        $('.loader').hide();
	        $("body").removeClass("overlay");
	    }
	})

}
