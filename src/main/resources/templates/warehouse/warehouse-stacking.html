<script>
var pno = 1;
let type = '';
$(document).ready(function() {
	
	const urlParams = new URLSearchParams(window.location.search);
	type = urlParams.get('id');
	
	if(type == null || type == 'null') {
		type = '';
	}
	
    var gridDiv = document.querySelector('#myGrid');
    new agGrid.Grid(gridDiv, gridOptions);

    var rowData = [];
    gridOptions.api.setRowData(rowData);
    pno = 1;
    
    view();

    var dateFormat = localStorage.getItem("dateFormat");
    $("#manufactureDateCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
    }).on("change", function() {
        $('#manufactureDate').val($(this).val());
    })

    $('#manufactureDate').blur(function() {
        $("#manufactureDateCalendar").val($(this).val());
    })

    $("#bestBeforeCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
    }).on("change", function() {
        $('#bestBeforeDate').val($(this).val());
    })

    $('#bestBeforeDate').blur(function() {
        $("#bestBeforeCalendar").val($(this).val());
    })

    $("#toDateCalendarTime").datetimepicker({
        format: 'H:i',
        closeOnDateSelect: false,
        timepicker: true,
        datepicker: false,
        step: 15
    }).on("change", function() {
        $('#manufactureTime').val($(this).val());
    })

    $('#manufactureTime').blur(function() {
        $("#toDateCalendarTime").val($(this).val());
    })
    $("#addData").hide();
    $("#changeBinDiv").hide();

});
function view() {

    var pages;
    var pageno = pno;
    $(".loader").show();
    agGrid.simpleHttpRequest({
        url: "warehouse-stacking-through-ajax?pageno=" + pageno+"&type="+type
    }).then(function(data) {
        $(".loader").hide();
        var jsonData = JSON.parse(data.body);
        var allData = jsonData.StackingData;

        gridOptions.api.setRowData(allData);

        if (allData && allData.length > 0) {
            let rowId = allData[0].allocationId;
            gridOptions.api.getRowNode(rowId).setSelected(true);
            $('.loader').hide();
            $("body").removeClass("overlay");
        }

    });
}
var colmnDefs = [
	{
	    headerCheckboxSelection: true,
	    headerCheckboxSelectionFilteredOnly: true,
	    checkboxSelection: true,
	    width: 10,
	    sortable: false,
	    filter: false,
	    resizable: true
	},
	{
	    headerName: "Allocation Id",
	    field: "allocationId",
	    width: 150,
	},
	{
	    headerName: 'Warehouse',
	    field: "warehouseName",
	    width: 150,
	},
	{
	    headerName: 'Category',
	    field: "categoryName",
	    width: 130,
	},
	{
	    headerName: 'Item Name',
	    field: "ItemName",
	    width: 180,
	},
	{
	    headerName: 'Quantity',
	    field: "quantity",
	    width: 80,
	    type: 'rightAligned',
	},
	{
	    headerName: 'Unit',
	    field: "unitName",
	    width: 100,
	    hide: true
	},
	{
	    headerName: 'Bin',
	    field: "binId",
	    width: 200,
	},
	{
	    headerName: 'Stacking Status',
	    field: "stackingStatus",
	    width: 150,
	    cellStyle: {
	        textAlign: 'center'
	    },
	    cellRenderer: function(params) {
	        if (params.data.stackingStatus == "Stacked") {
	            return '<div style="color:#0642f5">' +
	                params.data.stackingStatus + '</div>';
	        } else if (params.data.stackingStatus == "In Progress") {
	            return '<div style="color:#ffa500">' +
	                params.data.stackingStatus + '</div>';
	        } else {
	            return '<div style="color:#a9a9a9">' +
	                params.data.stackingStatus + '</div>';
	        }
	    }
	}, {
	    headerName: 'Created By',
	    field: "createdBy",
	    width: 200,
	    cellStyle: {
	        textAlign: 'center'
	    },
	    hide: true
	
	}, {
	    headerName: 'Created On',
	    field: "createdOn",
	    width: 200,
	    cellStyle: {
	        textAlign: 'center'
	    },
	
	}
];

var gridOptions = {
	columnDefs: colmnDefs,
	rowSelection: 'single',
	onSelectionChanged: onRowSelection,
	groupSelectsChildren: true,
	suppressRowClickSelection: true,
	suppressAggFuncInHeader: true,
	defaultColDef: {
	    sortable: true,
	    filter: true,
	    resizable: true,
	    width: 130,
	    height: 10
	},
	getRowNodeId: function(data) {
	    return data.allocationId;
	},
  paginationAutoPageSize: true,
  pagination: true,
};
function onRowSelection() {
    
    var stackStatus = '';
    var selectedNodes = gridOptions.api.getSelectedNodes();

    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	var allocationId = selectedData.map(node => node.allocationId);
        var categoryName = selectedData.map(node => node.categoryName);
        var itemName = selectedData.map(node => node.ItemName);
        var quantity = selectedData.map(node => node.quantity);
        var unitName = selectedData.map(node => node.unitName);
        var warehouseid = selectedData.map(node => node.warehouseid);
        var warehouseName = selectedData.map(node => node.warehouseName);
        var rackId = selectedData.map(node => node.rackId);
        var rackName = selectedData.map(node => node.rackName);
        var stackingStatus = selectedData.map(node => node.stackingStatus);
        
        $("#warehouseId").val(warehouseid);
        $("#allocationId").val(allocationId);
        $("#warehouseName").val(warehouseName);
        $("#categoryId").val(categoryId);
        $("#categoryName").val(categoryName);
        $("#itemId").val(selectedData.map(node => node.itemId));
        $("#itemName").val(itemName);
        $("#quantity").val(quantity);
        $("#unit").val(unitName);
        removeChangeBin();
        getBinList(warehouseid,allocationId);
    } else {
    	$("#allocationId").val('');
    	$("#warehouseId").val('');
        $("#warehouseName").val('');
        $("#categoryId").val('');
        $("#categoryName").val('');
        $("#itemId").val('');
        $("#itemName").val('');
        $("#quantity").val('');
        $("#unit").val('');
    }

}

function getBinList(wh_id,alloc_id) {
	
	$('.loader').show();
	$("body").addClass("overlay");
	
	$("#main").empty();
	
	agGrid.simpleHttpRequest({
	    url: "warehouse-stacking-getAllocationDataforStacking?warehouse="+wh_id+"&allocate="+alloc_id
	}).then(data => {
		
		if(data.body) {
			let d = JSON.parse(data?.body);
			
			if(d.length > 0) {
				let b = '';
				
				d.forEach(a => {
					
					b = b + '<h5 class="sub-header-new">'+a.zone_name+'</h5>';
					
					a?.bin_details?.forEach(c => {
						b = b + '<div class="menu-container"><div class="btn btn-primary edit-btn pd--10 bin-for-all" id="'+c.bin_id+'" data-name="'+c.bin_name+'" data-qty="'+c.bin_qty+'" data-zone="'+c.zone_id+'">'+c.bin_name+'('+c.bin_qty+')'+'</div>'
							  +	'<ul class="menu-list"><li><div onclick=getFilterWarehouseData("'+c.bin_id+'","'+window.btoa(c.bin_name)+'",'+c.bin_qty+')><i title="Change Bin" class="fa fa-box"></i></div></li></ul></div>';
					})
				})
				$("#main").append(b);
				
				$(".bin-for-all").click(function() {
					$(this).toggleClass('bin-all-active');
				});
			}
		}
		
		$('.loader').hide();
		$("body").removeClass("overlay");
		
	});
}

function stacking() {
	let binCount = $(".bin-all-active").length;
	
	if(binCount == 0) {
		toastr.error("Please select atleast one bin to stacking")
		return;
	}
	
	let datas = [];
	$(".bin-all-active").each(function(){
		let a = {};
		
		a.key = $("#warehouseId").val();
		a.name = $("#allocationId").val();
		a.code = $(this).attr('id');
		
		datas.push(a)
	});
	
	$('.loader').show();
	$("body").addClass("overlay");
	
	$.ajax({
        type : "POST",
        url : "warehouse-stacking-submit-stacking",
        contentType: "application/json",
	    data: JSON.stringify(datas),
        success : function(response) {
            if (response.code == "success") {
				toastr.success("Stacked successfullt")
                view();
            } else {
                $('.loader').hide();
                $("body").removeClass("overlay");
                toastr.error(response.message)
            }

        },
        error : function(data) {
        	$('.loader').hide();
        	$("body").removeClass("overlay");
        	toastr.error("Something went wrong")
        }
    });
}
function getFilterWarehouseData(binId,binName,qty) {

    let data = {};

    data.key = $("#warehouseId").val();
    data.id = $("#allocationId").val()+","+binId;
    
    $("#binNameLast").val(window.atob(binName));
    $("#quantityLast").val(qty);
    $("#oldBinId").val(binId);

    $("#changeDiv").empty();
    
    $("#changeBinDiv").show();
    $("#stackDiv").hide();

    $('.loader').show();
    $("body").addClass("overlay");
    $.ajax({
        type: "POST",
        url: "warehouse-stacking-get-avl-bin",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function(response) {
            if (response.code == "success") {
                let p = response.body[0];
                if (p) {
                    let dd = JSON.parse(p);
                    let d = formatToTreeData(dd);
                    if (d.length > 0) {
                        let b = '';

                        d.forEach(a => {

                            b = b + '<h5 class="sub-header-new">' + a.zone_name + '</h5>';

                            a?.bin_details?.forEach(c => {
                                b = b + '<div class="btn btn-primary edit-btn pd--10 ch-bin-for-all" id="' + c.bin_id + '" data-name="' + c.bin_name + '" data-qty="' + c.qty + '" data-zone="' + c.zone_id + '">' + c.bin_name + '(' + c.qty + ')' + '</div>';
                            })
                        })
                        $("#changeDiv").append(b);

                        $(".ch-bin-for-all").click(function() {
                        	$(".ch-bin-for-all").removeClass('ch-bin-all-active');
                            $(this).addClass('ch-bin-all-active');
                        });
                    }
                } else {

                }
                $('.loader').hide();
                $("body").removeClass("overlay");
            } else {
                $('.loader').hide();
                $("body").removeClass("overlay");
            }

        },
        error: function(data) {
            console.log(data);
            toastr.error("Something went wrong")
            $('.loader').hide();
            $("body").removeClass("overlay");
        }
    })
}

function removeChangeBin() {
	$("#changeDiv").empty();
    
    $("#changeBinDiv").hide();
    $("#stackDiv").show();
    
    $("#binNameLast").val("");
    $("#quantityLast").val("");
    $("#oldBinId").val("");
}

function formatToTreeData(data) {
    const groupedData = Object.values(data.reduce((acc, {
        zone_name,
        qty,
        bin_id,
        bin_name,
        zone_id
    }) => {
        if (!acc[zone_name]) {
            acc[zone_name] = {
                zone_name,
                bin_details: []
            };
        }
        acc[zone_name].bin_details.push({
            qty,
            bin_id,
            bin_name,
            zone_id
        });
        return acc;
    }, {}));
    return groupedData;
}

function changeBin() {
	
	let binLength = $(".ch-bin-all-active").length;
	
	if(binLength == 0) {
		toastr.error("Please select atleast one bin");
		return;
	}
	
	
    
	data = {};

    data.allocationId = $("#allocationId").val();
    data.oldBinId = $("#oldBinId  ").val();
    
    
	$(".ch-bin-all-active").each(function(){
		data.zoneId = $(this).attr('data-zone');
		data.newBinId = $(this).attr('id');
	})
	
	console.log(data)
	$('.loader').hide();
	$("body").removeClass("overlay");
	
	$.ajax({
	    type: "POST",
	    url: "warehouse-stacking-save-stackdata",
	    dataType: "json",
	    contentType: "application/json",
	    data: JSON.stringify(data),
	    success: function(response) {
	        if (response.code == "success") {
	        	removeChangeBin();
	        	getBinList($("#warehouseId").val(),$("#allocationId").val());
	            $('.loader').hide();
	            $("body").removeClass("overlay");
				toastr.success("Bin changed successfully")
	        } else {
	            $('.loader').hide();
	            $("body").removeClass("overlay");
	            toastr.error(response.message)
	        }
	    },
	    error: function(data) {
	        console.log(data);
	        $('.loader').hide();
	        $("body").removeClass("overlay");
	        toastr.error("Something went wrong")
	    }
	})

}

function onQuickFilterChanged() {
	gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
}

function resetAllocated() {
	$("#quickFilter").val('');
	gridOptions.api.setQuickFilter('');
}
</script>
