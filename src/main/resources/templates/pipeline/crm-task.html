		//Pagination
		var pages;
		function createPagination(pages, page) {

			if ($("#totalPageno").val() == '') {
				var pages = 10;
			} else {
				var pages = $("#totalPageno").val();
				$("#currentPageno").val(page);
			}

			var str = '<ul>';
			var active;
			var pageCutLow = page - 1;
			var pageCutHigh = page + 1;
			// Show the Previous button only if you are on a page other than the first
			if (page > 1) {
				str += '<li class="page-item previous no"><a onclick="createPagination(pages, ' + (page - 1) + ')">Previous</a></li>';
			}
			// Show all the pagination elements if there are less than 6 pages total
			if (pages < 6) {
				for (let p = 1; p <= pages; p++) {
					active = page == p ? "active" : "no";
					str += '<li class="' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';
				}
			}
			// Use "..." to collapse pages outside of a certain range
			else {
				// Show the very first page followed by a "..." at the beginning of the
				// pagination section (after the Previous button)
				if (page > 2) {
					str += '<li class="no page-item"><a onclick="createPagination(pages, 1)">1</a></li>';
					if (page > 3) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page - 2) + ')">...</a></li>';
					}
				}
				// Determine how many pages to show after the current page index
				if (page === 1) {
					pageCutHigh += 2;
				} else if (page === 2) {
					pageCutHigh += 1;
				}
				// Determine how many pages to show before the current page index
				if (page === pages) {
					pageCutLow -= 2;
				} else if (page === pages - 1) {
					pageCutLow -= 1;
				}
				// Output the indexes for pages that fall inside the range of pageCutLow
				// and pageCutHigh
				for (let p = pageCutLow; p <= pageCutHigh; p++) {
					if (p === 0) {
						p += 1;
					}
					if (p > pages) {
						continue
					}

					active = page == p ? "active" : "no";
					str += '<li class="page-item ' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';

				}
				// Show the very last page preceded by a "..." at the end of the pagination
				// section (before the Next button)
				if (page < pages - 1) {
					if (page < pages - 2) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page + 2) + ')">...</a></li>';
					}
					str += '<li class="page-item no"><a onclick="createPagination(pages, pages)">' + pages + '</a></li>';
				}
			}
			// Show the Next button only if you are on a page other than the last
			if (page < pages) {
				str += '<li class="page-item next no"><a onclick="createPagination(pages, ' + (page + 1) + ')">Next</a></li>';
				changePagination(page);
			} else if (page <= pages) {
				//str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
				changePagination(page);
			}
			str += '</ul>';
			// Return the pagination string to be outputted in the pug templates
			document.getElementById('pagination').innerHTML = str;
			return str;

		}

		function addTaskInfo() {
			
			var obj = {};
			obj.taskId = $('#taskId').text();

			obj.taskLead = $('#taskLead').val();
			obj.pageType = "Task";
			obj.taskSubject = $('#taskSubject').val();
			obj.dueDate = $('#dueDate').val();
			obj.taskContactName = $('#contactName').val();
			obj.contactId = $('#contactId').val();
			obj.taskAccountName = $('#dealAccountName').val();
			obj.accountId = $('#accountId').val();
			obj.taskStatus = $('#taskStatus').val();
			obj.taskPriority = $('#taskPriority').val();

			var ReminderYesOrNo = $("input[name='ReminderYesOrNo']:checked").val();
			obj.reminderYesOrNo = ReminderYesOrNo;

			var RepeateYesOrNo = $("input[name='RepeateYesOrNo']:checked").val();
			//alert(RepeateYesOrNo);
			obj.repeateYesOrNo = RepeateYesOrNo;

			if (ReminderYesOrNo == 'Yes') {
				obj.reminderDateid = $('#reminderDateid').val();
				obj.reminderTime = $('#reminderTime').val();
				obj.taskAlertBy = $('#taskAlertBy').val();
			} else {
				obj.reminderDateid = "";

				obj.taskAlertBy = "";
			}

			obj.description = $('#description').val();

			console.log("Printed Data" + JSON.stringify(obj));

			var validation = true;
			//return false;



			if (obj.taskSubject == null || obj.taskSubject == "") {

				return false;
			}
			if (obj.dueDate == null || obj.dueDate == "") {

				return false;
			}
			if (obj.taskStatus == null || obj.taskStatus == "") {

			}
			if (obj.taskPriority == null || obj.taskPriority == "") {

			}


			/* FORM VALIDATION ENDS*/

				url: "view-crm-tasks-delete-id?id=" + deleteId,
				success: function (response) {
					if (response.message == "Success") {
						console.log(response);
						$("#messageParagraph").text("Task Deleted Successfully");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						cancelDeleteModalBtn();
						var pages;
						var pageno = 1;
			
						var rowData = [];
						gridOptions.api.setRowData(rowData);
						agGrid.simpleHttpRequest({
							url: "view-crm-tasks-throughAjax?pageno=" + pageno,
						}).then(function (data) {
							var len = data.length;
			
							$('#totalReq').find('span').html(data[0].totalOrderById);
							console.log("Data: " + JSON.stringify(data));
							gridOptions.api.setRowData(data);
							if (data.length > 0) {
								///alert(data[0].totalPageno)
								$('#totalPageno').val(data[0].totalPageno);
								pages = data[0].totalPageno;
								//alert(pages);
							}
							createPagination(pages, pageno);
						});
					}
				}

			});

			$('#delete').attr("disabled", true);
		}

		function checkMeetingDetails() {
			$("#contactName").val('');
			$("#contactId").val('');
			$("#taskLead").val('');
			$("#dealAccountName").val('');
			$("#accountId").val('');

			var id = $("#relatedMeetingTo").val();
			if (id == "Lead") {
				$("#leadDiv").show();
				$("#contactDiv").hide();
				$("#accountDiv").hide();

			}
			else {

				$("#leadDiv").hide();
				$("#contactDiv").show();
				$("#accountDiv").show();
			}
		}

	</script>
