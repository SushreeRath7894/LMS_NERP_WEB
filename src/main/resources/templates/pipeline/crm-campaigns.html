		//Pagination
		var pages;
		function createPagination(pages, page) {
			if ($("#totalPageno").val() == '') {
				var pages = 10;
			} else {
				var pages = $("#totalPageno").val();
				$("#currentPageno").val(page);
			}

			var str = '<ul>';
			var active;
			var pageCutLow = page - 1;
			var pageCutHigh = page + 1;
			// Show the Previous button only if you are on a page other than the first
			if (page > 1) {
				str += '<li class="page-item previous no"><a onclick="createPagination(pages, ' + (page - 1) + ')">Previous</a></li>';
			}
			// Show all the pagination elements if there are less than 6 pages total
			if (pages < 6) {
				for (let p = 1; p <= pages; p++) {
					active = page == p ? "active" : "no";
					str += '<li class="' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';
				}
			}
			// Use "..." to collapse pages outside of a certain range
			else {
				// Show the very first page followed by a "..." at the beginning of the
				// pagination section (after the Previous button)
				if (page > 2) {
					str += '<li class="no page-item"><a onclick="createPagination(pages, 1)">1</a></li>';
					if (page > 3) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page - 2) + ')">...</a></li>';
					}
				}
				// Determine how many pages to show after the current page index
				if (page === 1) {
					pageCutHigh += 2;
				} else if (page === 2) {
					pageCutHigh += 1;
				}
				// Determine how many pages to show before the current page index
				if (page === pages) {
					pageCutLow -= 2;
				} else if (page === pages - 1) {
					pageCutLow -= 1;
				}
				// Output the indexes for pages that fall inside the range of pageCutLow
				// and pageCutHigh
				for (let p = pageCutLow; p <= pageCutHigh; p++) {
					if (p === 0) {
						p += 1;
					}
					if (p > pages) {
						continue
					}

					active = page == p ? "active" : "no";
					str += '<li class="page-item ' + active + '"><a onclick="createPagination(pages, ' + p + ')">' + p + '</a></li>';

				}
				// Show the very last page preceded by a "..." at the end of the pagination
				// section (before the Next button)
				if (page < pages - 1) {
					if (page < pages - 2) {
						str += '<li class="out-of-range"><a onclick="createPagination(pages,' + (page + 2) + ')">...</a></li>';
					}
					str += '<li class="page-item no"><a onclick="createPagination(pages, pages)">' + pages + '</a></li>';
				}
			}
			// Show the Next button only if you are on a page other than the last
			if (page < pages) {
				str += '<li class="page-item next no"><a onclick="createPagination(pages, ' + (page + 1) + ')">Next</a></li>';
				changePagination(page);
			} else if (page <= pages) {
				//str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
				changePagination(page);
			}
			str += '</ul>';
			// Return the pagination string to be outputted in the pug templates
			document.getElementById('pagination').innerHTML = str;
			return str;

		}

			if (obj.startDate == null || obj.startDate == "") {
				validation = validationUpdated("Start Date Required",
					"startDate");
			}

			if (obj.endDate == null || obj.endDate == "") {
				validation = validationUpdated("End Date Required",
					"endDate");
			}

			/* FORM VALIDATION ENDS*/

			if (validation) {
				//alert('save');
				$.ajax({
					type: "POST",
					url: "view-crm-campaigns-add-dtls",
					contentType: "application/json",
					data: JSON.stringify(obj),
					success: function (response) {
						if (response.message == "Success") {

							cancelBtn();

							var pages;
							var pageno = 1;

							var rowData = [];
							gridOptions.api.setRowData(rowData);
							agGrid.simpleHttpRequest({
								url: "view-crm-campaigns-throughAjax?pageno=" + pageno,
							}).then(function (data) {
								var len = data.length;

								//alert(len);
								$('#totalReq').find('span').html(data[0].totalOrderById);
								console.log("Data: " + JSON.stringify(data));
								gridOptions.api.setRowData(data);
								//colsole.log("------------------->>>>>>>>>>>>>>>>>>"+data);
								if (data.length > 0) {
									//alert(data[0].totalPageno)
									$('#totalPageno').val(data[0].totalPageno);
									pages = data[0].totalPageno;

								}
								createPagination(pages, pageno);


							});


						}
					},
					error: function (data) {

						console.log(data);
					}
				})
			}

		}

		function deleteCampaign() {

			$('#deleteModal').modal('show');
		}


		function cancelDeleteModalBtn() {
			//$('#deleteModal').hide();
			$("#delete").removeAttr("disabled");
			$("#deleteModal").modal('hide');

			$(".modal-backdrop").hide();
		}




		function deleteOnclick() {

				console.log("delete ids--------------" + deleteId);
				$.ajax({
					type: "GET",
					url: "view-crm-campaigns-delete-id?id=" + deleteId,
					success: function (response) {
						if (response.message == "Success") {
							console.log(response);
							$("#messageParagraph").text("Campaign Deleted Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							cancelDeleteModalBtn();
							$("#delete").prop("disabled", true);
							var pages;
							var pageno = 1;

							var rowData = [];
							gridOptions.api.setRowData(rowData);
							agGrid.simpleHttpRequest({
								url: "view-crm-campaigns-throughAjax?pageno=" + pageno,
							}).then(function (data) {
								var len = data.length;
								$('#totalReq').find('span').html(data[0].totalOrderById);
								console.log("Data: " + JSON.stringify(data));
								gridOptions.api.setRowData(data);
								if (data.length > 0) {
									$('#totalPageno').val(data[0].totalPageno);
									pages = data[0].totalPageno;

								}
								createPagination(pages, pageno);


							});

						}
					}

				});

				$('#delete').attr("disabled", true);
			}

		/*
		* Date Validation 
		* From Date & To Date 
		*/

		// for Meetings
		function dateValid() {
			if ($("#startDate").val() && $("#endDate").val())
				dateValidation('startDate', 'endDate', 'Start Date', 'End Date');
		}

	</script>

</head>

<body>

		<div class="container-fluid">

				<div class="maincontentsec">
					<div class="loader-backdrop">

						</div>

					</div>

									<button type="button" class="btn4" data-dismiss="modal"

							</div>
						</div>
					</div>

							<div class="innerstickybg">
								<div class="d-flex justify-content-between" id="main">

								</div>
							</div>
							<div class="innercontent">

								<!-- <div class="row"> -->
								<div class="row">

										</div>
									</div>

									<div class="col-md-4">

													<option value="Banner Ads">Banner Ads</option>

													<option value="Direct Mail">Direct Mail</option>
													<option value="Email Tele Marketing">Email Tele Marketing</option>
													<option value="Others">Others</option>


												</select>
											</div>
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">

										</div>
									</div>

									<div class="col-md-4">
