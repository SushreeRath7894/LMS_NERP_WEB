<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="leadsTimeline">

<head>
	<style>
		@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap");

		*,
		*::before,
		*::after {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		

		h2 {
			text-align: center;
			margin-bottom: 20px;
		}

		.lead-timeline ul {
			--col-gap: 2rem;
			--row-gap: 2rem;
			--line-w: 0.25rem;
			display: grid;
			grid-template-columns: var(--line-w) 1fr;
			grid-auto-columns: max-content;
			column-gap: var(--col-gap);
			list-style: none;
			width: min(60rem, 90%);
			margin-inline: auto;
		}

		/* line */
		.lead-timeline ul::before {
			content: "";
			grid-column: 1;
			grid-row: 1 / span 20;
			background: rgb(225, 225, 225);
			border-radius: calc(var(--line-w) / 2);
		}

		/* columns*/

		/* row gaps */
		.lead-timeline ul li:not(:last-child) {
			margin-bottom: var(--row-gap);
		}

		/* card */
		.lead-timeline ul li {
			grid-column: 2;
			--inlineP: 1.5rem;
			margin-inline: var(--inlineP);
			grid-row: span 2;
			display: grid;
			grid-template-rows: min-content min-content min-content;
		}

		/* date */
		.lead-timeline ul li .date {
			--dateH: 3rem;
			height: var(--dateH);
			margin-inline: calc(var(--inlineP) * -1);

			text-align: center;
			background-color: var(--accent-color);

			color: white;
			font-size: 1.25rem;
			font-weight: 700;

			display: grid;
			place-content: center;
			position: relative;

			border-radius: calc(var(--dateH) / 2) 0 0 calc(var(--dateH) / 2);
		}

		/* date flap */
		.lead-timeline ul li .date::before {
			content: "";
			width: var(--inlineP);
			aspect-ratio: 1;
			background: var(--accent-color);
			background-image: linear-gradient(rgba(0, 0, 0, 0.2) 100%, transparent);
			position: absolute;
			top: 100%;

			clip-path: polygon(0 0, 100% 0, 0 100%);
			right: 0;
		}

		/* circle */
		.lead-timeline ul li .date::after {
			content: "";
			position: absolute;
			width: 2rem;
			aspect-ratio: 1;
			background: var(--bgColor);
			border: 0.3rem solid var(--accent-color);
			border-radius: 50%;
			top: 50%;

			transform: translate(50%, -50%);
			right: calc(100% + var(--col-gap) + var(--line-w) / 2);
		}

		/* title descr */
		.lead-timeline ul li .title,
		.lead-timeline ul li .descr {
			background: var(--bgColor);
			position: relative;
			padding-inline: 1.5rem;
		}

		.lead-timeline ul li .title {
			overflow: hidden;
			padding-block-start: 1.5rem;
			padding-block-end: 1rem;
			font-weight: 500;
		}

		.lead-timeline ul li .descr {
			padding-block-end: 1.5rem;
			font-weight: 300;
		}

		/* shadows */
		.lead-timeline ul li .title::before,
		.lead-timeline ul li .descr::before {
			content: "";
			position: absolute;
			width: 90%;
			height: 0.5rem;
			background: rgba(0, 0, 0, 0.5);
			left: 50%;
			border-radius: 50%;
			filter: blur(4px);
			transform: translate(-50%, 50%);
		}

		.lead-timeline ul li .title::before {
			bottom: calc(100% + 0.125rem);
		}

		.lead-timeline ul li .descr::before {
			z-index: -1;
			bottom: 0.25rem;
		}

		@media (min-width: 40rem) {
			.lead-timeline ul {
				grid-template-columns: 1fr var(--line-w) 1fr;
			}

			.lead-timeline ul::before {
				grid-column: 2;
			}

			.lead-timeline ul li:nth-child(odd) {
				grid-column: 1;
			}

			.lead-timeline ul li:nth-child(even) {
				grid-column: 3;
			}

			/* start second card */
			.lead-timeline ul li:nth-child(2) {
				grid-row: 2/4;
			}

			.lead-timeline ul li:nth-child(odd) .date::before {
				clip-path: polygon(0 0, 100% 0, 100% 100%);
				left: 0;
			}

			.lead-timeline ul li:nth-child(odd) .date::after {
				transform: translate(-50%, -50%);
				left: calc(100% + var(--col-gap) + var(--line-w) / 2);
			}

			.lead-timeline ul li:nth-child(odd) .date {
				border-radius: 0 calc(var(--dateH) / 2) calc(var(--dateH) / 2) 0;
			}
		}

		.credits {
			margin-top: 1rem;
			text-align: right;
		}

		.credits a {
			color: var(--color);
		}
	</style>
	<title>Lead-Timeline</title>
</head>
<!--Modal-->
<div class="modal fade" id="myModalTimeline">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title" id="leadNameOnHead"></h4>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>

			<div class="modal-body lead-timeline" id="statusTimeline">

				<!--Timeline Design Here-->

				<h2>Lead Stages Timeline</h2>
				<ul></ul>
				

			</div>
		</div>
	</div>
</div>

</html>
