		    var bloodBankDate = $('#bloodBankdateId').val();
		    var bloodgroupId = $('#bloodgroupId option:selected').text();

		    // Check if a row is selected
		    var selectedNode = gridOptions.api.getSelectedNodes();
		    if (selectedNode.length === 0) {
		        alert('Please select a row in the grid.');
		        return;
		    }

		    // Update the selected row's data

		    selectedNode[0].data.date = bloodBankDate;
		    selectedNode[0].data.bloodgroupId = bloodgroupId;

		    // Refresh the grid to reflect changes
		    gridOptions.api.refreshCells({force: true});

		    $('#bloodBankdateId').val("");
