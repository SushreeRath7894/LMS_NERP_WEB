<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="text/javascript" src="/javaScript/his/his-ipd.js"></script>
<script type="text/javascript"
	src="../javaScript/his/his-billing-2.js"></script>
	<style>
.dtl-radiobtn input[type="radio"] {
  margin-top: -1px;
  vertical-align: middle;
}
.dtl-radiobtn input[type="radio"]:checked {
	accent-color: #bf05ff;
 }
.top-ico .picker_calendar {
    top: 70%;
}
	</style>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition">
			<div class="d-flex">
				<div class="maincontentsec">
					<div id="main_content">
						<div class="tab-content">
							<div id="ipd" class="tab-pane active">
								<div class="d-flex flex-column flex-lg-row">
									<!--Left Sec Start-->
									<div class="box-sec" id="collapseWidthR1">
										<div class="out-box">
											<div class="d-flex justify-content-between bdr-line p-2">
												<div class="col-md-8 col-12">
													<div class="d-flex gap-2 search-sec">
														<input class="form-control" type="text"
															placeholder="Search" id="quickFilter" autocomplete="off">
														<button class="btn go-btn" type="button">Go</button>
														<button class="btn go-btn" type="reset">Reset</button>
													</div>
												</div>
												<button class="btn max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>
											</div>
											<div class="card p-2 m-2">
													<div id="myGrid" style="height: 100vh; width: 100%;"
														class="ag-theme-alpine"></div>
											</div>
										</div>
									</div>
									<div class="box-sec" id="collapseWidthL1">
										<div class="out-box">
											<div
												class="d-flex justify-content-between align-items-center flex-row-reverse p-2 bdr-line">
												<button class="btn btn-primary max-btn"
													id="collapseButtonL1" type="button"
													onclick="triggerExpansionL(1)" data-bs-toggle="tooltip"
													data-bs-placement="top" title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
												</button>
												<ul class="nav nav-pills newtab" role="tablist">
													<li class="nav-item"><a class="nav-link active"
														data-bs-toggle="pill" href="#registrationTab"
														onclick="activityTabs('registrationTab');">Registration</a>
													</li>
													<li class="nav-item"><a class="nav-link text-nowrap"
														data-bs-toggle="pill" href="#otherDetail"
														onclick="activityTabs('otherDetail');">Other Details</a></li>
													<li class="nav-item "><a class="nav-link text-nowrap"
														data-bs-toggle="pill" href="#doctorsDetail"
														onclick="activityTabs('doctorsDetail');">Doctor
															Details</a></li>
													<li class="nav-item "><a class="nav-link text-nowrap"
														data-bs-toggle="pill" href="#bedsDetail"
														onclick="activityTabs('bedsDetail');">Bed Allotment</a></li>
													<!-- <li class="nav-item pay-tab wd-12" style="display:none"><a
														class="nav-link text-nowrap" data-bs-toggle="pill"
														href="#paymentDetail"
														onclick="activityTabs('paymentDetail');">Payment
															Details</a></li> -->
												</ul>
											</div>

											<!-- Tab panes -->
											<div class="tab-content flex-fill">
												<div id="registrationTab"
													class="tab-pane fade show active p-2 h-100">
													<div class="requisition-tbl d-flex flex-column h-100 gap-2">
                            <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                              <div class="project-name flex-1"><span class="head-user-name" id="pName"></span></div>
                              <div class="d-flex justify-content-end w-100 gap-2 flex-1">
                                <button class="btn m-0 edit-btn" type="button" id="add" onclick="newButton1()">Add</button>
                                <button class="btn m-0 edit-btn" type="button" id="next" onclick="next()">Next</button>
                              </div>
                            </div>
														<div class="requisition-tbl card p-2">
															<form>
																<div class="row form-top" id="addPatient">
																	<input type="hidden" id="ipdId">
																	<div class="col-md-12" id="newPatId">
																		<div class="form-group" style="display: none;">
																			<label>New Patient Id</label> <input type="text"
																				class="form-control transparenttxtbox"
																				placeholder="New Patient Id" id="newPatientId"
																				disabled="true">
																		</div>
																	</div>
																	<div class="col-md-12">
																	<div class="row">
																		<div class="col-md-6">
																			<h6>Patient Details</h6>
																		</div>
																		<div class="col-md-6 text-end">
																			<div class="mandatory-txt">
																				Note: All fields marked with <span>*</span> are
																				mandatory.
																			</div>
																		</div>
																	</div>


																	<div class="row">
																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Full Name <span class="mandatory">*</span></label>
																				<input type="text" id="fullName"
																					class="form-control">
																			</div>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Age <span class="mandatory">*</span></label>
																				<input type="text" id="age" class="form-control"
																					maxlength="3">
																			</div>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Mobile No <span class="mandatory">*</span></label>
																				<input type="text" class="form-control" id="mobNo"
																					maxLength="10"
																					onkeyup="mobVal1();checkNumeric('mobNo');"
																					onblur="removeValid(event)"> <span
																					id="error9" class="formValidation1"></span>
																			</div>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Alt. Mobile No</label> <input type="text"
																					class="form-control" id="altMob" maxLength="10"
																					onkeyup="mobVal3();checkNumeric('contactNo');"
																					onblur="removeValid(event)"> <span
																					id="error2" class="formValidation2"></span> <input
																					type="hidden" id="patientId">
																			</div>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Email Id</label> <input type="text"
																					id="email" class="form-control"> <input
																					type="hidden" id="patientType" value="0">
																			</div>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Gender <span class="mandatory">*</span></label>
																				<select id="gender" class="form-select">
																					<option value="">Select</option>
																					<option th:each="c,iter:${genderList}"
																						th:value="${c.key}" th:text="${c.name}">
																					</option>
																				</select>
																			</div>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Nationality</label> <select id="nationality"
																					class="form-select">
																					<option value="">Select</option>
																					<option th:each="c,iter:${nationalityList}"
																						th:value="${c.key}" th:text="${c.name}">
																					</option>
																				</select>
																			</div>
																		</div>
																		<div class="col-md-4">
																			<div class="form-group">
																				<label>Country <span class="mandatory">*</span></label>
																				<select id="country" onchange="getStateDetails('0')"
																					onblur="removeValid(event)" class="form-select">
																					<option th:value="NULL">Select</option>
																					<option th:each="c,iter:${countryList}"
																						th:value="${c.key}" th:text="${c.name}">
																					</option>
																				</select>
																			</div>
																		</div>

																		<div class="col-md-4">
																			<div class="form-group">
																				<label>State <span class="mandatory">*</span></label>
																				<select id="states"
																					onchange="getDistrictDetails('0')"
																					onblur="removeValid(event)" class="form-select">
																					<option th:value="NULL">Select</option>
																					<option th:each="c,iter:${statesList}"
																						th:value="${c.key}" th:text="${c.name}">
																					</option>
																				</select> <span class="focus"></span>
																			</div>
																		</div>

																		<div class="col-md-4">
																			<div class="form-group">
																				<label>District <span class="mandatory">*</span></label>
																				<select id="dist" onblur="removeValid(event)"
																					class="form-select" onchange="getCityDetails('')">
																					<option th:value="NULL">Select</option>
																					<option th:each="c,iter:${districtList}"
																						th:value="${c.key}" th:text="${c.name}">
																					</option>
																				</select> <span class="focus"></span>
																			</div>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>City <span class="mandatory">*</span></label>
																				<select class="form-select" id="cityId"
																					onblur="removeValid(event)">
																					<option value="">Select</option>
																					<option th:each="c,iter:${cityList}"
																						th:value="${c.key}" th:text="${c.name}"></option>
																				</select>
																			</div>
																		</div>
																		<div class="col-md-4">
																			<label>Pin Code <span class="mandatory">*</span></label>
																			<input type="text" class="form-control" id="zipCode"
																				maxLength="6"
																				onkeyup="mobVal4();checkNumeric('zipCode');"
																				onblur="removeValid(event)"> <span
																				id="error3" class="formValidation3"></span>
																		</div>
																		<div class="col-md-4">
																			<label for="address">Address <span
																				class="mandatory">*</span></label>
																			<textarea id="address" name="address"
																				class="form-control" rows="1"></textarea>
																		</div>

																		<div class="col-lg-4">
																			<div class="form-group">
																				<label>Recommended</label> <input type="text"
																					id="recommended" class="form-control">
																			</div>
																		</div>

																		<div class="col-md-4">
																			<div class="form-group">
																				<label>Status <span class="mandatory">*</span></label>
																				<select id="patientStatus" class="form-select">
																					<option value="1">Active</option>
																					<option value="0">Inactive</option>
																				</select>
																			</div>
																		</div>
																		</div>
																	</div>
																</div>
															</form>
														</div>
													</div>
												</div>

												<div id="otherDetail" class="tab-pane fade p-2 h-100">
													<div class="requisition-tbl d-flex flex-column h-100 gap-2">

                            <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                              <div class="project-name flex-1"><span class="head-user-name" id="pName1"></span></div>
                              <div class="d-flex justify-content-end w-100 gap-2 flex-1">
                                <button class="btn m-0 edit-btn" type="button" id="prev" onclick="prev()">Prev</button>
                                <button class="btn m-0 edit-btn" type="button" id="next1" onclick="next1()">Next</button>
                              </div>
                            </div>
														<div class="card p-2">
															<div class="row">
															<div class="col-md-12 form-top"
																id="patientDependentDetails">

																<div>
																	<h6>Patient Working Details</h6>
																</div>
															</div>
															</div>

															<div class="row">
																<div class="col-lg-3">
																	<div class="form-group">
																		<label>Occupation</label> <input type="text"
																			id="occupation" class="form-control">
																	</div>
																</div>


																<div class="col-lg-3">
																	<div class="form-group">
																		<label>Office Name</label> <input type="text"
																			id="officeName" class="form-control">
																	</div>
																</div>


																<div class="col-lg-3">
																	<div class="form-group">
																		<label>Income</label> <input type="text" id="income"
																			class="form-control">
																	</div>
																</div>


																<div class="col-md-3">
																	<label for="address" class="ofc-address2">Office
																		Address</label>
																	<textarea id="officeAddress" name="office Address"
																		class="form-control ofc-address" rows="1"></textarea>
																</div>
															</div>
															<div class="row">
															<div class="col-md-12" id="patientTypeBox">
																<div class="form-group">
																	<div class="mt-2">
																		<h6 style="margin-bottom: 5px;">Insurance Details</h6>
																	</div>

                                                               <div class="dtl-radiobtn">
																	<label for="Insurance"> <input type="radio"
																		id="insurance" value="0" name="patient"
																		onclick="insurance()" /> Insurance
																	</label> <label for="Cash"> <input type="radio"
																		id="cash" value="0" name="patient" onclick="cash()"
																		checked> Cash
																	</label>
																</div>

																</div>
															</div>



															<div class="col-md-3 form-top" id="detailsInsurance">
																<div class="form-group">
																	<label>Insurance Details</label> <select
																		id="insuranceName" onblur="removeValid(event)"
																		class="form-select">
																		<option th:value="NULL">Select Relation</option>
																		<option th:each="c,iter:${insuranceList}"
																			th:value="${c.key}" th:text="${c.name}"></option>
																	</select> <span class="focus"></span>

																</div>
															</div>
															</div>

															
															<div class="row">
																<div class="col-md-6 mt-2">
																	<h6>Patient Dependent Details</h6>
																</div>
																<div class="col-md-6 cnt-sp-end mb-1">
																	<div class="d-flex gap-1 task-btn-sec">
																		<button
																			class="border-0 btn-transition btn btn-outline-primary br-m-btn-p"
																			title="Add" onclick="togglePSection()" data-bs-toggle="tooltip">
																			<i class="fa fa-plus-square" aria-hidden="true"></i>
																		</button>
																		<button
																			class="border-0 btn-transition btn btn-outline-primary br-dis-p br-m-btn-p"
																			title="Delete" data-bs-toggle="tooltip" disabled
																			onclick="deleteSubChildData()">
																			<i class="fa fa-trash"></i>
																		</button>
																		<button class="btn btn-primary edit-btn br-s-btn-p"
																			type="button" onclick="saveDepChildData()">Save</button>
																		<button class="btn btn-primary edit-btn br-s-btn-p"
																			type="button" onclick="cancelPDetails()">Cancel</button>
																	</div>
																</div>
															</div>
															<div class="grid-container br-m-btn-p">
																<div id="myGridPDtls" class="ag-theme-alpine grid-size"></div>
															</div>
															<div class="row br-s-btn-p">
																<div class="col-lg-4">
																	<div class="form-group">
																		<label>Name</label> <input type="text" id="depName"
																			class="form-control"> <input type="hidden"
																			id="depId">
																	</div>
																</div>


																<div class="col-lg-4">
																	<div class="form-group">
																		<label>Mobile No</label> <input type="text"
																			class="form-control" id="depMobNo" maxLength="10"
																			onkeyup="mobVal2();checkNumeric('depMobNo');"
																			onblur="removeValid(event)"> <span
																			id="error1" class="formValidation2"></span>
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Relation </label> <select id="depRelation"
																			class="form-select">
																			<option th:value="NULL">Select</option>
																			<option th:each="c,iter:${getRelationList}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>
															</div>

														</div>

													</div>
												</div>

												<div id="doctorsDetail" class="tab-pane fade p-2 h-100">
													<div class="requisition-tbl d-flex flex-column h-100 gap-2">

                            <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                              <div class="project-name flex-1"><span class="head-user-name" id="pName3"></span></div>
                              <div class="d-flex justify-content-end w-100 gap-2 flex-1">
                                <button class="btn m-0 edit-btn" type="button" id="prev1" onclick="prev1()">Prev</button>
                                <!-- <button class="btn m-0 edit-btn" type="button" id="savePatient" onclick="savePatient()">Save</button> -->
                              </div>
                            </div>
														<!--Doctor and Department Details-->
														<div class="card p-2">
															<div class="row form-top" id="doctorsDetail">
																<div style="margin-top: 0px;">
																	<h6>Department and Doctor Details</h6>
																</div>


																<div class="col-lg-4">
																	<div class="form-group">
																		<label>Department</label><span class="mandatory">*</span>
																		<select id="department" onchange="getDoctorsList('0')"
																			class="form-select">
																			<option value="">Select Department</option>
																			<option th:each="c,iter:${departmentList}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>Doctor</label> <select id="doctor"
																			onblur="removeValid(event)" class="form-select">
																			<option th:value="NULL">Select</option>
																		</select> <span class="focus"></span>
																	</div>
																</div>

																<div class="col-lg-4">
																	<div class="form-group calendar_box top-ico">
																		<label>Date Of Appointment</label> <span
																			class="mandatory">*</span> <input type="text"
																			id="dateOfAppointment" class="form-control"
																			onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('date','${session.DATEFORMAT_JS}')|"
																			readonly> <i
																			class="ti-calendar picker_calendar" id="DateCalendar"></i>
																	</div>
																</div>
																<div class="col-md-12">
																	<label for="description">Description</label>
																	<textarea id="description" name="description"
																		class="form-control" rows="2"></textarea>
																</div>
																<div class="col-md-12">
																	<div class="form-group">
																		<div class="mt-4">
																			<h6>Diagnosis</h6>
																		</div>
																		<div class="position-text">
																			<textarea class="form-controlarea" id="dignosys"></textarea>

																		</div>
																	</div>
																</div>
															</div>
														</div>
													</div>
												</div>
												<div id="bedsDetail" class="tab-pane fade h-100">
													<div th:replace="his/his-bed-allot :: his-bed-allot"></div>
												</div>
												<!-- <div id="paymentDetail"
													class="tab-pane">
													<div th:replace="his/his-billing-2 :: his-billing-2"></div>
												</div> -->

											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
