<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="final-settlement">
<head>
<style>
.right-align {
	text-align: right !important;
}
.book_id {
	color: var(--mainColor);
	cursor: pointer;
	font-weight: bold;
}
#settle-table td, #total-table td {
	font-size: 12px;
}

#settle-table th {
	font-weight: bold;
}

#odtls-table td, #odrtotal-table td {
	font-size: 12px;
}

#odtls-table th {
	font-weight: bold;
}

.order-dtls {
	display: flex;
	justify-content: space-between;
	align-items: center;
}
</style>
<script>
$(document).ready(()=>{
})
let billOrderList = []
function getOrderList(id) {
	const $settleTbody = $('#settle-table tbody');
	const $totalTbody = $('#total-table tbody');
	$settleTbody.empty();
	$totalTbody.empty();
	agGrid.simpleHttpRequest({
        url: "opd-billing-order-list?id=" + id
    }).then(resp => {
    	if(resp.code === 'success') {
    		if(resp.body && resp.body[0]) {
    			let data = JSON.parse(resp.body[0]);
    			billOrderList = data;
    			createOrderTable(data)
    		}
    	}
    })
}

function createOrderTable(dataset) {
	const $settleTbody = $('#settle-table tbody');
	const $totalTbody = $('#total-table tbody');
	$settleTbody.empty();
	$totalTbody.empty();

	if (Array.isArray(dataset) && dataset.length > 0) {
		let totalAmount = 0, totalDiscount = 0, totalCgst = 0, totalSgst = 0, totalLineAmount = 0;

		const rowsHtml = dataset.map((d, c) => {
			const discount = d?.discount || 0;
			const lineAmount = d?.line_amount || 0;
			const cgst = d?.cgst || 0;
			const sgst = d?.sgst || 0;
			const taxableAmount = d?.taxable_amount || 0;
			const catname = d?.cat_name || 'NA';
			const encCatName = window.btoa(catname);

			totalAmount += taxableAmount;
			totalDiscount += discount;
			totalCgst += cgst;
			totalSgst += sgst;
			totalLineAmount += lineAmount;

			return `
				<tr class="settle-parent-class-2" data-bill-id="${c}">
					<td style="text-align: center" class="slno-td">${c + 1}</td>
					<td>${d.dt || ''}</td>
					<td onclick=openFullDetails(${d?.id},"${d.oth_book_id}","${encCatName}")><span class="book_id">${d.oth_book_id || ''}</span></td>
					<td>${d.cat_name || ''}</td>
					<td>${d.item_cnt > 1 ? d.cat_name : (d.sku_name || '')}</td>
					<td class="right-align">${discount.toFixed(2)}</td>
					<td class="right-align">${lineAmount.toFixed(2)}</td>
					<td class="right-align">${cgst.toFixed(2)}</td>
					<td class="right-align">${sgst.toFixed(2)}</td>
					<td class="right-align">${taxableAmount.toFixed(2)}</td>
				</tr>
			`;
		}).join('');

		$settleTbody.append(rowsHtml);

		const totalRow = `
			<tr>
				<td style="width: 10%;" class="bill-tbl-th"></td>
				<td style="width: 50%;" colspan="4" class="bill-tbl-th">Grand Total</td>
				<td style="width: 8%;" class="bill-tbl-th right-align">${totalDiscount.toFixed(2)}</td>
				<td style="width: 8%;" class="bill-tbl-th right-align">${totalLineAmount.toFixed(2)}</td>
				<td style="width: 8%;" class="bill-tbl-th right-align">${totalCgst.toFixed(2)}</td>
				<td style="width: 8%;" class="bill-tbl-th right-align">${totalSgst.toFixed(2)}</td>
				<td style="width: 8%;" class="bill-tbl-th right-align">${totalAmount.toFixed(2)}</td>
			</tr>
		`;

		$totalTbody.append(totalRow);
	}
}


function openFullDetails(id,bookId,encCatName) {
	
		const selectedRows = gridOptionsDeg.api.getSelectedRows();
	
		if (selectedRows.length > 0) {
		    const selectedData = selectedRows[0];
		    const grandTotal = parseFloat(selectedData.grandTotal);
		    const pendingAmount = parseFloat(selectedData.pendingAmount);

		    if (pendingAmount < (grandTotal / 2)) {
		        toastr.error("Settlement not allowed: Pending amount is less than 50% of the total invoice.");
		        return;
		    }
		}

	
	$("#orderListSecId").addClass("d-none");
	$("#detailsSecId").removeClass("d-none");
	
	let catName = window.atob(encCatName)
	
	agGrid.simpleHttpRequest({
        url: "opd-billing-get-order-details?id=" + id + '&bookId=' + bookId
    }).then(resp => {
    	if(resp.code === 'success') {
    		if(resp.body && resp.body[0]) {
    			let data = JSON.parse(resp.body[0]);
    			createOrderDetailsTable(data,catName)
    		}
    	}
    })
}

function createOrderDetailsTable(dataset,catName) {
	const $settleTbody = $('#odtls-table tbody');
	const $totalTbody = $('#odrtotal-table tbody');
	$settleTbody.empty();
	$totalTbody.empty();
	
	$("#categoryName").val(catName);

	if (Array.isArray(dataset) && dataset.length > 0) {

		const rowsHtml = dataset.map((d, c) => {
			const discount = d?.discount || 0;
			const unit_price = d?.unit_price || 0;
			const gst_rate = d?.gst_rate || 0;
			const lineAmount = d?.line_amount || 0;
			const cgst = d?.cgst || 0;
			const sgst = d?.sgst || 0;
			const taxableAmount = d?.taxable_amount || 0;

			return `
				<tr class="settle-parent-class-2" data-oth-id="${c}">
					<td style="text-align: center" class="slno-td">${c + 1}</td>
					<td>${d.sku_name}
						<input type="hidden" class="id" value="${d?.id}">
						<input type="hidden" class="skuid" value="${d?.sku_id}">
						<input type="hidden" class="othbookid" value="${d?.oth_book_id}">
						<input type="hidden" class="bookid" value="${d?.book_id}">
						<input type="hidden" class="batch" value="${d?.batch}">
					</td>
					<td class="right-align"><input type="text" class="form-control right-align qty" value="${d?.qty}" disabled></td>
					<td><input type="text" class="form-control right-align unit_price" value="${unit_price.toFixed(2)}" onkeyup=calculateTotalValue("${c}")></td>
					<td><input type="text" class="form-control right-align discount" value="${discount.toFixed(2)}" onkeyup=calculateTotalValue("${c}")>
						<input type="hidden" class="gstRate" value="${gst_rate}"></td>
					<td class="lineAmount right-align">${lineAmount.toFixed(2)}</td>
					<td class="cgst right-align">${cgst.toFixed(2)}</td>
					<td class="sgst right-align">${sgst.toFixed(2)}</td>
					<td class="taxableAmount right-align">${taxableAmount.toFixed(2)}</td>
				</tr>
			`;
		}).join('');

		$settleTbody.append(rowsHtml);

		updateGrandTotals();
	}
}

function closeOrderDetails() {
	$("#orderListSecId").removeClass("d-none");
	$("#detailsSecId").addClass("d-none");
	$("#categoryName").val('');
}

function calculateTotalValue(i) {
	const rowSelector = `tr[data-oth-id="${i}"]`;
	const qtyEl = document.querySelector(`${rowSelector} .qty`);
	const priceEl = document.querySelector(`${rowSelector} .unit_price`);
	const gstRateEl = document.querySelector(`${rowSelector} .gstRate`);
	const discountEl = document.querySelector(`${rowSelector} .discount`);
	const lineAmountEl = document.querySelector(`${rowSelector} .lineAmount`);
	const cgstEl = document.querySelector(`${rowSelector} .cgst`);
	const sgstEl = document.querySelector(`${rowSelector} .sgst`);
	const taxableAmountEl = document.querySelector(`${rowSelector} .taxableAmount`);

	let qty = parseFloat(qtyEl?.value) || 0;
	let price = parseFloat(priceEl?.value) || 0;
	let gstRate = parseFloat(gstRateEl?.value) || 0;
	let discount = parseFloat(discountEl?.value) || 0;

	// Calculate taxable amount and taxes
	const gross = qty * price;
	const discountAmount = (gross * discount) / 100;
	const lineAmount = gross - discountAmount;
	const cgst = (lineAmount * gstRate) / 200;
	const sgst = (lineAmount * gstRate) / 200;
	const taxableAmount = lineAmount + cgst + sgst;

	// Update values in DOM
	if (lineAmountEl) lineAmountEl.textContent = lineAmount.toFixed(2);
	if (cgstEl) cgstEl.textContent = cgst.toFixed(2);
	if (sgstEl) sgstEl.textContent = sgst.toFixed(2);
	if (taxableAmountEl) taxableAmountEl.textContent = taxableAmount.toFixed(2);
	
	updateGrandTotals();
}

function updateGrandTotals() {
	let totalLineAmount = 0, totalCgst = 0, totalSgst = 0, totalAmount = 0;

	document.querySelectorAll('#odtls-table tbody tr').forEach(row => {
		const lineAmount = parseFloat(row.querySelector('.lineAmount')?.textContent) || 0;
		const cgst = parseFloat(row.querySelector('.cgst')?.textContent) || 0;
		const sgst = parseFloat(row.querySelector('.sgst')?.textContent) || 0;
		const taxableAmount = parseFloat(row.querySelector('.taxableAmount')?.textContent) || 0;

		totalLineAmount += lineAmount;
		totalCgst += cgst;
		totalSgst += sgst;
		totalAmount += taxableAmount;
	});

	// Replace total row
	const $totalTbody = $('#odrtotal-table tbody');
	$totalTbody.empty();

	const totalRow = `
		<tr>
			<td style="width: 5%;" class="bill-tbl-th"></td>
			<td style="width: 50%;" colspan="6" class="bill-tbl-th">Grand Total</td>
			<td style="width: 10%;" class="bill-tbl-th right-align">${totalLineAmount.toFixed(2)}</td>
			<td style="width: 10%;" class="bill-tbl-th right-align">${totalCgst.toFixed(2)}</td>
			<td style="width: 10%;" class="bill-tbl-th right-align">${totalSgst.toFixed(2)}</td>
			<td style="width: 10%;" class="bill-tbl-th right-align">${totalAmount.toFixed(2)}</td>
			<td style="width: 5%;" class="bill-tbl-th"></td>
		</tr>
	`;

	$totalTbody.append(totalRow);
}

function saveUpdatedBillData() {
	const payload = [];

	let totalLineAmount = 0;
	let totalTaxableAmount = 0;
	document.querySelectorAll('#odtls-table tbody tr').forEach(row => {
		const getVal = (selector, isValue = true, fallback = 0) => {
			const el = row.querySelector(selector);
			const val = isValue ? el?.value : el?.textContent;
			const data = isValue ? val : parseFloat(val);
			return data || fallback;
		};
		
		totalLineAmount =+ getVal('.lineAmount', false);
		totalTaxableAmount =+ getVal('.taxableAmount', false);

		const obj = {
			id: getVal('.id', true, null),
			batch: getVal('.batch', true, null),
			bookid: getVal('.bookid', true, null),
			othbookid: getVal('.othbookid', true, null),
			skuid: getVal('.skuid', true, null),
			qty: getVal('.qty'),
			unit_price: getVal('.unit_price', true),
			discount: getVal('.discount', true),
			lineAmount: getVal('.lineAmount', false),
			cgst: getVal('.cgst', false),
			sgst: getVal('.sgst', false),
			taxableAmount: getVal('.taxableAmount', false),
			categoryName: $("#categoryName").val()
		};

		payload.push(obj);
	});
	
	if(totalLineAmount === 0) {
		toastr.error("Line Amount Can't Be 0");
		return;
	}
	if(totalTaxableAmount === 0) {
		toastr.error("Taxable Amount Can't Be 0");
		return;
	}
		
	console.log(payload);
	
	$.ajax({
        type: "POST",
        url: "opd-billing-modify",
        contentType: "application/json",
        data: JSON.stringify(payload),
        success: (resp) => {
            hideLoader();
            if (resp.code === 'success') {
                toastr.success(resp.message);
                let selectedRows = gridOptions.api.getSelectedRows();
                getBalanceSheet(selectedRows[0].bookingId);
                getOrderList(selectedRows[0].bookingId);
                closeOrderDetails()
            } else {
                toastr.error(resp.message);
            }
        },
        error: (err) => {
            console.error(err);
            toastr.error('Something Went Wrong');
            hideLoader();
        }
    });
}

</script>
</head>
<body>
	<div class="requisition-tbl d-flex flex-column h-100">
		<div class="mb-2 table-responsive">
			<table class="table table-bordered mb-0" width="100%">
				<tbody>
					<tr valign="middle">
						<td width="50%"><div>
								<strong id="patientNameHead"></strong>
							</div></td>
						<td>
							<!-- <div class="d-flex justify-content-end flxwrap">
								<button class="btn btn-primary edit-btn" type="button"
									style="width: auto !important" onclick="nextTab('bills-tab')">Final
									Settlement</button>
							</div> -->
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="card p-2">
			<div class="row" id="orderListSecId">
				
				<table class="table table-bordered" id="settle-table">
					<thead>
						<tr>
							<th style="width: 10%;" class="bill-tbl-th">Sl</th>
							<th style="width: 10%;" class="bill-tbl-th">Date</th>
							<th style="width: 15%;" class="bill-tbl-th">Id</th>
							<th style="width: 10%;" class="bill-tbl-th">Category</th>
							<th style="width: 15%;" class="bill-tbl-th">Description</th>
							<th style="width: 8%;" class="bill-tbl-th">Discount</th>
							<th style="width: 8%;" class="bill-tbl-th">Amount</th>
							<th style="width: 8%;" class="bill-tbl-th">CGST</th>
							<th style="width: 8%;" class="bill-tbl-th">SGST</th>
							<th style="width: 8%;" class="bill-tbl-th">Total</th>
						</tr>
					</thead>
					<tbody id="settle-tbody">

					</tbody>

				</table>
				<table class="table table-bordered" id="total-table">
					<tbody id="total-tbody">
						
					</tbody>
				</table>
			</div>
			<div class="row d-none" id="detailsSecId">
				<div class="order-dtls">
					<h5>Order Details</h5>
					<div>
						<button class="btn btn-primary max-btn" data-bs-toggle="tooltip"
							data-bs-placement="top" title="Save"
							onclick="saveUpdatedBillData()">
							<i class="fa-solid fa-save"></i>
						</button>
						<button class="btn btn-primary max-btn" id="closeOrderButton"
							onclick="closeOrderDetails()" data-bs-toggle="tooltip"
							data-bs-placement="top" title="Close">
							<i class="fa-solid fa-close" id="closeOrderIcon"></i>
						</button>
					</div>
				</div>
				<div class="mt-2">
					<input type="hidden" id="categoryName">
					<table class="table table-bordered" id="odtls-table">
						<thead>
							<tr>
								<th style="width: 5%;" class="bill-tbl-th">Sl</th>
								<th style="width: 20%;" class="bill-tbl-th">Description</th>
								<th style="width: 10%;" class="bill-tbl-th">Quantity</th>
								<th style="width: 10%;" class="bill-tbl-th">Unit Price</th>
								<th style="width: 10%;" class="bill-tbl-th">Discount(%)</th>
								<th style="width: 10%;" class="bill-tbl-th">Amount</th>
								<th style="width: 10%;" class="bill-tbl-th">CGST</th>
								<th style="width: 10%;" class="bill-tbl-th">SGST</th>
								<th style="width: 10%;" class="bill-tbl-th">Total</th>
								<th style="width: 5%;" class="bill-tbl-th">Action</th>
							</tr>
						</thead>
						<tbody id="odtls-tbody">

						</tbody>

					</table>
					<table class="table table-bordered" id="odrtotal-table">
						<tbody id="odrtotal-tbody">

						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
