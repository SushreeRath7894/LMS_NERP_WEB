function openApprovalModal() {
	var selectedRows = gridOptions.api.getSelectedRows();

	selectedRows.forEach(function(selectedRow, index) {
		if (index > 0) {
			selectedRowsString += ',';
		}
		console.log(JSON.stringify(selectedRow))
		selectedRowsString += selectedRow.approvalStatus;
	});
	if(selectedRowsString == "Approved"){
		flag = false;
		swal("Already Approved<br>Please Select Another OPD ID")
		return flag;
	}
	
	$("#AprovalPopup").modal('show');
}

function opdApproval() {
	
		var selectedRows = gridOptions.api.getSelectedRows();
		var selectedRowsString = '';
		selectedRows.forEach(function(selectedRow, index) {
			if (index > 0) {
				selectedRowsString += ',';
			}
			selectedRowsString += selectedRow.opdId;
		});
		
		var validation = true;
		
		var opdId = selectedRowsString;
		
		const checkVal = $('input[name="approved"]:checked').val();
		var approval=checkVal;
		var approvedBy = $("#userId").val();
	
		
	$.ajax({
		type : "GET",
		url : "his-opd-approval-status?approval=" + approval + "&opdId=" + opdId+ "&approvedBy=" + approvedBy,
		async : false,
		success : function(response) {
			if (response.message == "Success") {
				$("#AprovalPopup").modal('hide');				
				swal({
					text: "Status updated successfully!", 
					type: "success"
					}).then(function(){
				   location.reload();
				   }
				);
				
				//swal("Payment approved successfully!", " ", "success");
				
				agGrid.simpleHttpRequest({
				    url: "manage-opd-view?fromdate=" + fromdate + "&todate=" + todate,
				}).then(function(data) {
					var len = data.length;
					$('#totalReq').find('span').html(len);

					gridOptions.api.setRowData(data);
				});
			}

		},
		error : function(data) {
		}
	});
}
