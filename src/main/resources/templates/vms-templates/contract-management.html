			padding: 8px;
		}

		.custom-dropdown:hover {
			border-color: #888;
		}

		.custom-dropdown:focus {
			border-color: #007bff;
			outline: none;
		}

			width: 100%;
			height: 28px !important;
			margin: 0px;
			padding: 0px;
			/* font-family: 'Montserrat', sans-serif; */
			color: #333;
			cursor: pointer;
			line-height: 23px !important;
			font-size: 12px !important;
			font-weight: 700;
			margin-left: 5px;
		}

		.hidden {
			display: none;
		}

			height: 95px !important;
			overflow: hidden;
		}

		.hidden-height1 {
			height: 450px !important;
			overflow: hidden;
		}

		.hidden-height2 {
			height: 180px !important;
			overflow: hidden;
			margin-bottom: 25px !important;
		}

		#templateDetailsGrid,
		#templateSectionGrid {
			transition: height 0.3s;
			/* Smooth height transition */
		}

		.checkmarkDrop {
			position: absolute;
			right: 10px;
			top: 50%;
			transform: translateY(-50%);
			color: rgb(56, 159, 0);
			/* Green color */
			font-size: 16px;
			/* Adjust size if needed */
		}

		.section-header {
			background-color: #e9ecef;
			border-color: #b2b2b2;
			border-width: 2px !important;

		}

		.section-content {
			font-size: 16px !important;
			font-weight: 700;
		}

		.section-no-column {
			width: 20%;

		.modal-xxl {
			max-width: 90%;

		}

		.mb-scroll {
			overflow: scroll;
			max-height: 680px;
		}

		.review-section {
			margin-bottom: 20px;
		}

		.review-header {
			display: flex;
			align-items: center;
			margin-bottom: 15px;
		}

		.company-logo {

			height: auto;

		.company-name {
			font-size: 24px;

		.section-details {

		.section-title {
			font-size: 18px;

		.section-content {

			text-align: left;

					}

				this.checkmark.style.display = hasSelection ? 'inline' : 'none';

		function openReviewModal() {
			openReviewData();
			$(".loader").show();
			const content = document.querySelector('#reviewModal .modal-body').innerHTML;
			fetch('get-pdf-data', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					pdfContent: content
				})
			}).then(response => {
				if (response.ok) {
					return response.blob();
				} else {
					throw new Error('Error generating PDF');
				}
			}).then(blob => {
				const url = window.URL.createObjectURL(blob);
				window.open(url);
				window.URL.revokeObjectURL(url);
				$(".loader").hide();
			});
		}

		function downloadPdf() {
			openReviewData();
			$(".loader").show();
			const content = document.querySelector('#reviewModal .modal-body').innerHTML;

			fetch('get-pdf-data', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					pdfContent: content
				})
			}).then(response => {
				if (response.ok) {
					return response.blob(); // Convert response to blob
				} else {
					throw new Error('Error generating PDF');
				}
			})
				.then(blob => {
					const url = window.URL.createObjectURL(blob);
					const a = document.createElement('a');
					a.href = url;
					a.download = 'sample-pdf.pdf';
					document.body.appendChild(a);
					a.click();
					window.URL.revokeObjectURL(url);
					document.body.removeChild(a);
					$(".loader").hide();
				});
		}

			var year = now.getFullYear();
			var month = String(now.getMonth() + 1).padStart(2, '0');
			var day = String(now.getDate()).padStart(2, '0');
			var hours = String(now.getHours()).padStart(2, '0');
			var minutes = String(now.getMinutes()).padStart(2, '0');
			var formattedDateTime = year + '-' + month + '-' + day + 'T' + hours + ':' + minutes;

		function saveTenderData() {
			generateDynamicId(function (tenderId) {
				const tenderDescription = CKEDITOR.instances.tenderEditor.getData();
				const tenderDescriptionPlain = stripHtmlTags(tenderDescription);
				const allSections = $(".saved-section").map(function () {
					return {
						name: $(this).find(".section-name strong").text(),
						description: $(this).find(".section-description").text()
					};

				const effectiveDate = $("#effectiveDate").val();
				const createdDate = $("#date").val();
				const status = $("#status").val();

				const data = {
					templateId: tenderId,
					templateName: templateName,
					effectiveDate: effectiveDate,
					creationDate: createdDate,
					status: status,
					templateDescription: tenderDescriptionPlain,
					sections: allSections
				};

				mainData.tenders.push(data);
				fetchAndUpdateGrid();
				$('#tenderModal').modal("hide");
			});

			const templateId = selectedTemplate.templateId;
			const allSections = window.templateSectionApi.getModel().rowsToDisplay;
			const updatedSections = allSections.map(node => node.data);

			console.log(updatedSections);

			const template = mainData.tenders.find(tender => tender.templateId === templateId);

			if (!template) {

			template.sections = updatedSections;
