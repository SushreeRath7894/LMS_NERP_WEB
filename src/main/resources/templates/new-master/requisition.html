<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="requisition">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsRequisition = [

    {
        headerName: "Reqipriority Type",
        field: "requiPriorityId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "requiPriorityName",
        flex: 2,
        width: 80
    }, {
        headerName: "Description",
        field: "requiPriorityDesc",
        width: 175,
        flex: 3,
    }, {
        headerName: "Status",
        field: "requiPriorityStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.requiPriorityStatus == "Active") {
                return '<div style="color:green">' + params.data.requiPriorityStatus + '</div>';
            } else {
                return '<div>' + params.data.requiPriorityStatus + '</div>';
            }
        }
    }
];

var gridOptionsRequisition = {
    columnDefs: columnDefsRequisition,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedReqiPriority,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId : function(data) {
		return data.requiPriorityId;
	}

};

$(document).ready(() => {
	getReqData();
})

function getReqData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-procurement-view-reqi-priority-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsRequisition.api.setRowData(data);
        	gridOptionsRequisition.api.getRowNode(data[0].requiPriorityId).setSelected(true);
        } else {
        	gridOptionsRequisition.api.setRowData(dataSet);
        	$("#deleteReqPriorBtn").attr("disabled",true);
        }

    });
    
    $('#requiPriorityName,#requiPriorityDesc,#requiPriorityStatus').attr('disabled',true);
}

function onSelectionChangedReqiPriority() {

    var selectedNodes = gridOptionsRequisition.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);

    if(selectedData && selectedData.length > 0) {
    	$('#requiPriorityName').val(selectedData.map(node => node.requiPriorityName));
        $('#requiPriorityDesc').val(selectedData.map(node => node.requiPriorityDesc));
        $('#requiPriorityId').val(selectedData.map(node => node.requiPriorityId));


        if (selectedData.map(node => node.requiPriorityStatus) == "Active") {
            $('#requiPriorityStatus').val("1");
        } else if(selectedData.map(node => node.requiPriorityStatus) == "") {
        	$('#requiPriorityStatus').val("1");
        } else {
            $('#requiPriorityStatus').val("0");
        }
        $("#resetReqBtn").attr("disabled",true);
        $("#deleteReqPriorBtn").attr("disabled",false);
    }
    
}

function enableFieldsReq() {
	$('#requiPriorityName,#requiPriorityDesc,#requiPriorityStatus').attr('disabled',false);
}
function openAddSectionReq() {
	enableFieldsReq();
	$('#requiPriorityId,#requiPriorityName,#requiPriorityDesc').val('');
	$('#requiPriorityStatus').val('1');
	$("#resetReqBtn").attr("disabled",false);
	$("#deleteReqPriorBtn").attr("disabled",true);
	gridOptionsRequisition.api.deselectAll();
}
function resetReq() {
	if(!$("#requiPriorityId").val()) {
		$('#requiPriorityId,#requiPriorityName,#requiPriorityDesc').val('');
		$('#requiPriorityStatus').val('1');
	}
}

function saveRequiPriorityType() {
	
	if($("#requiPriorityName").val() == null || $("#requiPriorityName").val() == '') {
		toastr.error('Requisition priority name required');
		return;
	}
	if($("#requiPriorityStatus").val() == null || $("#requiPriorityStatus").val() == '') {
		toastr.error('Requisition priority status required');
		return;
	}

	var data6 = {};

    data6.requiPriorityId = $("#requiPriorityId").val();
    data6.requiPriorityName = $("#requiPriorityName").val();
    data6.requiPriorityDesc = $("#requiPriorityDesc").val();
    data6.requiPriorityStatus = $("#requiPriorityStatus").val();

    $.ajax({
        type: "POST",
        url: "/configuration/view-procurement-add-reqi-priority-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data6),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#requiPriorityId").val() == null || $("#requiPriorityId").val() == "" || $("#requiPriorityId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getReqData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteReqiPriorityType() {
    
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {

            var id = $('#requiPriorityId').val();

            $.ajax({
                type: "GET",
                url: "/configuration/view-procurement-reqi-priority-type-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getReqData();
                    	toastr.success('Data deleted successfully')
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    });
	
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid9');
    new agGrid.Grid(gridDiv, gridOptionsRequisition);
})
</script>
</head>
<body>
	<h6>Requisition List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionReq()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsReq()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteReqPriorBtn" class="btn  edit-btn"
								onclick="deleteReqiPriorityType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid9" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Requisition</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveRequiPriorityType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetReqBtn" class="btn  edit-btn"
								onclick="resetReq()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="requiPriorityName"> <input type="hidden"
					id="requiPriorityId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Description</label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="requiPriorityDesc">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="requiPriorityStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
