<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="variationType">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsvariation = [

    {
        headerName: "Variation Type",
        field: "variationId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "variationName",
        flex: 2,
        width: 80
    },
    {
        headerName: "Description",
        field: "variationDesc",
        width: 175,
        flex: 3,
    },
    {
        headerName: "Status",
        field: "variationStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.variationStatus == "Active") {
                return '<div style="color:green">' + params.data.variationStatus + '</div>';
            } else {
                return '<div>' + params.data.variationStatus + '</div>';
            }
        }
    }
];

var gridOptionsvariation = {
    columnDefs: columnDefsvariation,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedVariation,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId : function(data) {
		return data.variationId;
	}

};

$(document).ready(() => {
	getVariationTypeData();
})

function getVariationTypeData() {
	agGrid.simpleHttpRequest({
        url: '/master/view-procurement-view-variation-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsvariation.api.setRowData(data);
        	gridOptionsvariation.api.getRowNode(data[0].variationId).setSelected(true);
        } else {
        	gridOptionsvariation.api.setRowData(dataSet);
        	$("#deleteVariationTypeBtn").attr("disabled",true);
        }
    });
    
    $('#variationName,#variationDesc,#variationStatus').attr('disabled',true);
}

function onSelectionChangedVariation() {
    
    var selectedNodes = gridOptionsvariation.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#variationName').val(selectedData.map(node => node.variationName));
        $('#variationDesc').val(selectedData.map(node => node.variationDesc));
        $('#variationId').val(selectedData.map(node => node.variationId));


        if (selectedData.map(node => node.variationStatus) == "Active") {
            $('#variationStatus').val("1");
        } else if(selectedData.map(node => node.variationStatus) == ""){
        	$('#variationStatus').val("1");
        }else {
            $('#variationStatus').val("0");
        }
        $("#resetVarTypeBtn").attr("disabled",true);
        $("#deleteVariationTypeBtn").attr("disabled",false);
    }
}

function enableFieldsVariationtyp() {
	$('#variationName,#variationDesc,#variationStatus').attr('disabled',false);
}
function openAddSectionVariationtyp() {
	enableFieldsVariationtyp();
	$('#variationId,#variationDesc,#variationName').val('');
	$('#variationStatus').val('1');
	$("#resetVarTypeBtn").attr("disabled",false);
	$("#deleteVariationTypeBtn").attr("disabled",true);
	gridOptionsvariation.api.deselectAll();
}
function resetVariationtyp() {
	if(!$("#variationId").val()) {
		$('#variationId,#variationDesc,#variationName').val('');
		$('#variationStatus').val('1');
	}
}

function saveVariationType() {
	
	if($("#variationName").val() == null || $("#variationName").val() == '') {
		toastr.error('Variation type name required');
		return;
	}
	if($("#variationStatus").val() == null || $("#variationStatus").val() == '') {
		toastr.error('Variation type status required');
		return;
	}

	var data4 = {};

	data4.variationId = $("#variationId").val();
	data4.variationName = $("#variationName").val();
	data4.variationDesc = $("#variationDesc").val();
	data4.variationStatus = $("#variationStatus").val();


    $.ajax({
        type: "POST",
        url: "/master/view-procurement-add-variation-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data4),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#variationId").val() == null || $("#variationId").val() == "" || $("#variationId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getVariationTypeData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteVariationType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {
        	var id = $('#variationId').val();

            $.ajax({
                type: "GET",
                url: "/master/view-procurement-variation-type-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getVariationTypeData();
                    	toastr.success('Data deleted successfully')
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    });

}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid16');
    new agGrid.Grid(gridDiv, gridOptionsvariation);
})
</script>
</head>
<body>
	<h6>Variation Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionVariationtyp()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsVariationtyp()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteVariationTypeBtn" class="btn  edit-btn"
								onclick="deleteVariationType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid16" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Variation Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveVariationType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetVarTypeBtn" class="btn  edit-btn"
								onclick="resetVariationtyp()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="variationName"> <input type="hidden" id="variationId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Description</label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="variationDesc">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label> 
				<div class="select">
				<select id="variationStatus"
					class="form-control">
					<option value="">Select</option>
					<option value="1">Active</option>
					<option value="0">Inactive</option>
				</select></div>
			</div>
		</div>
	</div>
</body>
</html>
