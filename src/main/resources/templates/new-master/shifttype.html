<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="shifttype">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsShiftType = [
    {
        headerName: "Shift Type",
        field: "shiftId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Shift",
        field: "shiftName",
        width: 95,
        flex: 1,
    },
    {
        headerName: "From Time",
        field: "shiftFromTime",
        width: 80,
        flex: 2,
        cellClass: 'my-center-cell-class' 
    },
    {
        headerName: "To Time",
        field: "shiftToTime",
        width: 80,
        flex: 2,
        cellClass: 'my-center-cell-class' 
    },
    {
        headerName: "Status",
        field: "shiftStatus",
        width: 65,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.shiftStatus == "Active") {
                return '<div style="color:green">' +
                    params.data.shiftStatus + '</div>';
            } else {
                return '<div>' + params.data.shiftStatus + '</div>';
            }
        }
    },

];


var gridOptionsShiftType = {
    columnDefs: columnDefsShiftType,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedShiftType,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId: function(data) {
        return data.shiftId;
    }
};

$(document).ready(() => {
	
	$( "#shiftFromTime" ).datetimepicker({
		format:'H:i A',
		closeOnDateSelect: true,
		datepicker: false, 
		timepicker : true,
	})
	
	$( "#shiftToTime" ).datetimepicker({
		format:'H:i A',
		closeOnDateSelect: true,
		datepicker: false, 
		timepicker : true,
	})
	
	
	getShiftTypeData();
})

function getShiftTypeData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/referenceHr-view-shift'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
            gridOptionsShiftType.api.setRowData(data);
            gridOptionsShiftType.api.getRowNode(data[0].shiftId).setSelected(true);
        } else {
            gridOptionsShiftType.api.setRowData(dataSet);
            $("#deleteShiftTypeBtn").attr("disabled",true);
        }

    });

    $('#shiftDepartmentId,#shiftName,#shiftFromTime,#shiftToTime,#shiftStatus').attr('disabled', true);
}

function onSelectionChangedShiftType() {
    var selectedNodes = gridOptionsShiftType.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#shiftId').val(selectedData.map(node => node.shiftId));
        $('#shiftName').val(selectedData.map(node => node.shiftName));
        $('#shiftFromTime').val(selectedData.map(node => node.shiftFromTime));
        $('#shiftToTime').val(selectedData.map(node => node.shiftToTime));
        if (selectedData.map(node => node.shiftStatus) == "Active") {
            $('#shiftStatus').val("1");
        } else if (selectedData.map(node => node.shiftStatus) == "") {
            $('#shiftStatus').val("1");
        } else {
            $('#shiftStatus').val("0");
        }
        $("#resetShiftBtn").attr("disabled",true);
        $("#deleteShiftTypeBtn").attr("disabled",false);
    }
}

function enableFieldsShft() {
    $('#shiftDepartmentId,#shiftSubDepartmentId,#shiftName,#shiftFromTime,#shiftToTime,#shiftStatus').attr('disabled', false);
}

function openAddSectionShft() {
    enableFieldsShft();
    $('#shiftId,#shiftDepartmentId,#shiftSubDepartmentId,#shiftName,#shiftFromTime,#shiftToTime').val('');
    $('#shiftStatus').val('1');
    $("#resetShiftBtn").attr("disabled",false);
    $("#deleteShiftTypeBtn").attr("disabled",true);
    gridOptionsShiftType.api.deselectAll();
}

function resetShft() {
    if (!$("#shiftId").val()) {
        $('#shiftId,#shiftDepartmentId,#shiftSubDepartmentId,#shiftName,#shiftFromTime,#shiftToTime').val('');
        $('#shiftStatus').val('1');
    }
}


function saveShiftType() {
	
	if($("#shiftName").val() == null || $("#shiftName").val() == '') {
		toastr.error('Shift type name required')
		return;
	}
	if($("#shiftFromTime").val() == null || $("#shiftFromTime").val() == '') {
		toastr.error('From time required')
		return;
	}
	if($("#shiftToTime").val() == null || $("#shiftToTime").val() == '') {
		toastr.error('To time required')
		return;
	}
	if($("#shiftStatus").val() == null || $("#shiftStatus").val() == '') {
		toastr.error('Shift type status required')
		return;
	}

    //closeNav17();
    var data18 = {};

    data18.shiftId = $("#shiftId").val();
    /* data18.shiftDepartmentName = $("#shiftDepartmentId").val();
    data18.shiftSubDepartmentName = $("#shiftSubDepartmentId").val(); */
    data18.shiftName = $("#shiftName").val();
    data18.shiftFromTime = $("#shiftFromTime").val();
    data18.shiftToTime = $("#shiftToTime").val();
    data18.shiftStatus = $("#shiftStatus").val();

    $.ajax({
        type: "POST",
        url: "/configuration/referenceHr-add-shift",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data18),
        success: function(response) {
            if (response.message == "Success") {
            	if($("#shiftId").val() == null || $("#shiftId").val() == "" || $("#shiftId").val() == undefined) {
            		toastr.success('Data saved successfully')
            	} else {
            		toastr.success('Data updated successfully')
            	}
            	getShiftTypeData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteShiftType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {
        	var id = $('#shiftId').val();

            $.ajax({
                type: "GET",
                url: "/configuration/referenceHr-shift-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getShiftTypeData()
                    	toastr.success('Data deleted successfully')
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    });
    
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid4');
    new agGrid.Grid(gridDiv, gridOptionsShiftType);
})
</script>

</head>
<body>
	<h6>Shift Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionShft()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsShft()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteShiftTypeBtn" class="btn  edit-btn"
								onclick="deleteShiftType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid4" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Shift Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveShiftType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetShiftBtn" class="btn  edit-btn" onclick="resetShft()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">

		<div class="col-md-3">
			<div class="form-group">
				<label>Shift Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="shiftName"> <input type="hidden" id="shiftId">
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>From Time <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder=""
					id="shiftFromTime">
			</div>

		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>To Time <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder=""
					id="shiftToTime">
			</div>
		</div>

		<div class="col-md-3">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="shiftStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
