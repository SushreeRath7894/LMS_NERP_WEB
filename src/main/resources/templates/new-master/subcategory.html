<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="subcategory">
<head>
<script>
	var columnDefsSubCategory = [{
	        headerName: "Order",
	        field: "subCategoryOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Sub-Category Name",
	        field: "subCategoryName",
	        flex: 3,
	    }, 
	    {
	        headerName: "Category Name",
	        field: "categoryName",
	        flex: 2,
	    },
	    {
	        headerName: "Status",
	        field: "subCategoryStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.subCategoryStatus == "Active") {
	                return '<div style="color:green">' + params.data.subCategoryStatus + '</div>';
	            } else {
	                return '<div>' + params.data.subCategoryStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptionsSubCategory = {
		    columnDefs: columnDefsSubCategory,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionSubCategory,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.subCategoryId;
			}
		};
	$(document).ready(() => {
		getSubCategoryListData();
	})

	function onSelectionSubCategory() {

	    var selectedNodes = gridOptionsSubCategory.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);

	    if(selectedNodes.length > 0) {
	    	$('#subCategoryOrder').val(selectedData.map(node => node.subCategoryOrder));
		    $('#categoryIdS').val(selectedData.map(node => node.categoryId));
		    $('#subCategoryName').val(selectedData.map(node => node.subCategoryName));
		    $('#subCategoryId').val(selectedData.map(node => node.subCategoryId));
		    $('#subCategoryStatus').val(selectedData.map(node => node.subCategoryStatus));
		    
		    if (selectedData.map(node => node.subCategoryStatus) == "Active") {
		        $('#subCategoryStatus').val("1");
		    } else if(selectedData.map(node => node.subCategoryStatus) == "") {
		    	$('#subCategoryStatus').val("1");
		    } else {
		        $('#subCategoryStatus').val("0");
		    }
		    $("#resetSubCatBtn").attr("disabled",true);
		    $("#deleteSubCatBtn").attr("disabled",false);
	    }
	    
	}
	function enableFieldsSub() {
		$('#subCategoryOrder,#categoryIdS,#subCategoryName,#subCategoryStatus').attr('disabled',false);
	}
	function openAddSectionSub() {
		enableFieldsSub();
		$('#subCategoryId,#subCategoryOrder,#subCategoryName').val('');
		$('#categoryIdS').val('ABC');
		$('#subCategoryStatus').val('1');
		$("#resetSubCatBtn").attr("disabled",false);
		$("#deleteSubCatBtn").attr("disabled",true);
		gridOptionsSubCategory.api.deselectAll();
	}
	function resetSubCat() {
		if(!$("#subCategoryId").val()) {
			$('#subCategoryId,#subCategoryOrder,#subCategoryName').val('');
			$('#categoryIdS').val('ABC');
			$('#subCategoryStatus').val('1');
		}
	}

	function saveSubCategory() {
		
		/* if($("#subCategoryOrder").val() == null || $("#subCategoryOrder").val() == '') {
			toastr.error("Sub-Category order required");
			return;
		} */
		if($("#subCategoryName").val() == null || $("#subCategoryName").val() == '') {
			toastr.error("Sub-Category name required");
			return;
		}
		if($("#categoryIdS").val() == null || $("#categoryIdS").val() == '' || $("#categoryIdS").val() == 'ABC') {
			toastr.error("Category required");
			return;
		}
		if($("#subCategoryStatus").val() == null || $("#subCategoryStatus").val() == '') {
			toastr.error("Sub-Category status required");
			return;
		}

	    var data19 = {};

	    data19.subCategoryId = $("#subCategoryId").val();
	    data19.categoryId = $("#categoryIdS").val();
	    data19.subCategoryOrder = $("#subCategoryOrder").val();
	    data19.subCategoryName = $("#subCategoryName").val();
	    data19.subCategoryStatus = $("#subCategoryStatus").val();
	    data19.type = "subcategory";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getSubCategoryListData();
	            	resetSubCat();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deleteSubCategory() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#subCategoryId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-data?id=" + id + "&type=subcategory" ,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getSubCategoryListData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	function getSubCategoryListData() {
		agGrid.simpleHttpRequest({
            url: '/configuration/view-master-data?type=subcategory'
        }).then(function(data) {
        	let dataSet = [];
	        if (data.length > 0) {
	        	gridOptionsSubCategory.api.setRowData(data);
	        	gridOptionsSubCategory.api.getRowNode(data[0].subCategoryId).setSelected(true);
	        } else {
	        	gridOptionsSubCategory.api.setRowData(dataSet);
	        	$("#deleteSubCatBtn").attr("disabled",true);
	        }
        });
		$('#subCategoryOrder,#categoryIdS,#subCategoryName,#subCategoryStatus').attr('disabled',true);
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridSubCategory');
	    new agGrid.Grid(gridDiv, gridOptionsSubCategory);
	})
</script>
</head>
<body>
	<h6>Sub-Category List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionSub()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsSub()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteSubCatBtn" class="btn  edit-btn"
								onclick="deleteSubCategory()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridSubCategory" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Sub-Category</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveSubCategory()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetSubCatBtn" class="btn  edit-btn" onclick="resetSubCat()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-3" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="subCategoryOrder">
			</div>
		</div>
		
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="subCategoryName"> <input
					type="hidden" id="subCategoryId">
			</div>
		</div>
		
		<div class="col-md-4">
			<div class="form-group">
				<label>Category <span class="mandatory">*</span></label>
				<div class="select">
					<select id="categoryIdS" class="form-control">
						<option value="ABC">Select</option>
						<option th:each="a : ${categoryList}" th:value="${a.key}" th:text="${a.name}"></option>
					</select>
				</div>
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="subCategoryStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
