<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="measurement">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsMeasurement = [

    {
        headerName: "Requisition Type",
        field: "requisitionId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "requisitionName",
        flex:2,
        width: 80
    }, {
        headerName: "Description",
        field: "requisitionDesc",
        width: 175,
        flex:3,
    }, {
        headerName: "Status",
        field: "requisitionStatus",
        width: 90,
        flex:1,
        cellRenderer: function(params) {
            if (params.data.requisitionStatus == "Active") {
                return '<div style="color:green">' + params.data.requisitionStatus + '</div>';
            } else {
                return '<div>' + params.data.requisitionStatus + '</div>';
            }
        }
    }
];

var gridOptionsMeasurement = {
    columnDefs: columnDefsMeasurement,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedReqiType,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId : function(data) {
		return data.requisitionId;
	}

};

$(document).ready(() => {
	getReqTypeData();
    
})

function getReqTypeData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-procurement-view-reqi-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsMeasurement.api.setRowData(data);
        	gridOptionsMeasurement.api.getRowNode(data[0].requisitionId).setSelected(true);
        } else {
        	gridOptionsMeasurement.api.setRowData(dataSet);
        	$("#deleteReqTypeBtn").attr("disabled",true);
        }

    });
    
    $('#requisitionName,#requisitionDesc,#requisitionStatus').attr('disabled',true);
}

function onSelectionChangedReqiType() {

    var selectedNodes = gridOptionsMeasurement.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);

    if(selectedData && selectedData.length > 0) {
    	$('#requisitionName').val(selectedData.map(node => node.requisitionName));
        $('#requisitionDesc').val(selectedData.map(node => node.requisitionDesc));
        $('#requisitionId').val(selectedData.map(node => node.requisitionId));

        if (selectedData.map(node => node.requisitionStatus) == "Active") {
            $('#requisitionStatus').val("1");
        } else if(selectedData.map(node => node.requisitionStatus) == "") {
        	$('#requisitionStatus').val("1");
        } else {
            $('#requisitionStatus').val("0");
        }
        $("#resetMReqBtn").attr("disabled",true);
        $("#deleteReqTypeBtn").attr("disabled",false);
    }
    
}

function enableFieldsMeasurementReq() {
	$('#requisitionName,#requisitionDesc,#requisitionStatus').attr('disabled',false);
}
function openAddSectionMeasurementReq() {
	enableFieldsMeasurementReq();
	$('#requisitionId,#requisitionName,#requisitionDesc').val('');
	$('#requisitionStatus').val('1');
	$("#resetMReqBtn").attr("disabled",false);
	$("#deleteReqTypeBtn").attr("disabled",true);
	gridOptionsMeasurement.api.deselectAll();
}
function resetMeasurementReq() {
	if(!$("#requisitionId").val()) {
		$('#requisitionId,#requisitionName,#requisitionDesc').val('');
		$('#requisitionStatus').val('1');
	}
}

function saveRequiType() {
	
	if($("#requisitionName").val() == null || $("#requisitionName").val() == '') {
		toastr.error('Measurement name required');
		return;
	}
	if($("#requisitionStatus").val() == null || $("#requisitionStatus").val() == '') {
		toastr.error('Measurement status required');
		return;
	}

	var data5 = {};

    data5.requisitionId = $("#requisitionId").val();
    data5.requisitionName = $("#requisitionName").val();
    data5.requisitionDesc = $("#requisitionDesc").val();
    data5.requisitionStatus = $("#requisitionStatus").val(); 

    $.ajax({
        type: "POST",
        url: "/configuration/view-procurement-add-reqi-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data5),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#requisitionId").val() == null || $("#requisitionId").val() == "" || $("#requisitionId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getReqTypeData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteReqiType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {

            var id = $('#requisitionId').val();

            $.ajax({
                type: "GET",
                url: "/configuration/view-procurement-reqi-type-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getReqTypeData();
                    	toastr.success('Data deleted successfully')
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    });
    
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid7');
    new agGrid.Grid(gridDiv, gridOptionsMeasurement);
})
</script>
</head>
<body>
	<h6>Measurement List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionMeasurementReq()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsMeasurementReq()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteReqTypeBtn" class="btn  edit-btn"
								onclick="deleteReqiType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid7" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Measurement</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveRequiType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetMReqBtn" class="btn  edit-btn"
								onclick="resetMeasurementReq()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="requisitionName"> <input type="hidden"
					id="requisitionId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Description</label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="requisitionDesc">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="requisitionStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
