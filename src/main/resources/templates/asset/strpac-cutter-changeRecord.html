<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"

	layout:decorate="~{layout/master}">
<head>
<style type="text/css">
.highcharts-exporting-group {
	display: none;
}

	padding: 14px;

	background-color: rgb(0, 143, 0);
}

.bg_white {
	background: #ffffff !important;
}

.btn1 {
	margin-right: 7px;
}
</style>

<script type="text/javascript">

document.addEventListener('DOMContentLoaded', function () {
    const currentMonth = ("0" + (new Date().getMonth() + 1)).slice(-2);
    $("#monthDropdown").val(currentMonth);
    
    const gridDiv = document.querySelector('#myGrid');
    new agGrid.Grid(gridDiv, gridOptions);

    // Initialize columns based on the current month selected in dropdown
    updateGridColumns(currentMonth);
    getAllReportData();
});
//function for download
function downloadButton(){
  alert("hi")
	var params = {
		fileName: 'starpac-perforationCheckList.csv', // Specify your custom filename here
	};
	gridOptions.api.exportDataAsCsv(params);
}
	function filter(){
		var fromDate=$("#filterFromDate").val();
		var toDate=$("#filterToDate").val();
		var assetName=$("#assetName").val();
		$('.loader').show();
		gridOptions.api.setRowData();
		 agGrid.simpleHttpRequest({
			url : 'starpac-perforationCheckList-view?fromDate='+fromDate +"&toDate="+toDate+"&assetName="+assetName
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData=jsonData.MetalDetector;
			//console.log()
			var len = allData.length;
			$('#totalItem').find('span').html(len);
			gridOptions.api.setRowData(allData);
			onSelectionChanged();
		
		});
		$('.loader').hide(); 
	}

function getSelectedMonth() {
    const monthDropdown = document.getElementById("monthDropdown");
    const selectedMonth = monthDropdown.value;
    
    // Update column header name for the month
    updateGridColumns(selectedMonth);
    getAllReportData();
}

function updateGridColumns(selectedMonth) {
    const daysInMonth = getDaysInMonth(selectedMonth);
    const currentMonth = getMonthName(selectedMonth);

    const columnDefs = generateColumnDefs(selectedMonth, daysInMonth, currentMonth);
    gridOptions.api.setColumnDefs(columnDefs);
}

function getDaysInMonth(month) {
    const now = new Date();
    const year = now.getFullYear();
    return new Date(year, parseInt(month, 10), 0).getDate();
}

function getMonthName(month) {
    const monthNames = [
        "January", "February", "March", "April", "May",
        "June", "July", "August", "September", "October", "November", "December"
    ];
    return monthNames[parseInt(month, 10) - 1];
}

function generateColumnDefs(month, daysInMonth, currentMonth) {
    const columnDefs = [{
        children: [{
            headerName: "S.N",
            field: "sn",
            width: 70,
            pinned: 'left'
        }, {
            headerName: "Asset Name",
            field: "assetName",
            width: 200,
            pinned: 'left'
        },{
            headerName: "Remarks",
            field: "remark",
            width: 200,
            pinned: 'left'
        }]
    }, {
        headerName: `Month: ${currentMonth}`,
        children: []
    }];

 
    columnDefs[1].children = [];


    for (let day = 1; day <= daysInMonth; day++) {
        columnDefs[1].children.push({
            headerName: `${day}`,
            field: `day${day}`,
            width: 50
        });
    }

    return columnDefs;
}

let rowData = [];

function getAllReportData() {
	
	 var mon = $("#monthDropdown").find('option:selected').val();

    $.ajax({
        url: 'starpac-cutterChangeRecord-view?mon='+mon,
        type: 'GET',
        dataType: 'json',
        success: function(response) {
        	 const jsonData =JSON.parse(response.body);
        	 
            console.log(jsonData);
            
            if (!Array.isArray(jsonData) || jsonData.length === 0) {
                console.error("No data available.");
                gridOptions.api.setRowData([]);
                return;
            }

            rowData = [];

            let checklistMap = {};
            jsonData.forEach(item => {
                const day = item.date ? parseInt(item.date.split('-')[0], 10) : null;

                if (!checklistMap[item.assetName]) {
                    checklistMap[item.assetName] = {
                        sn: Object.keys(checklistMap).length + 1,  
                        assetName: item.assetName,
                        remark: item.remark
                    };
                }

                if (day !== null) {
                    checklistMap[item.assetName][`day${day}`] = item.completeStatus; //=== 'OK' ? 'OK' : 'NOT OK';
                } else {
                    const daysInMonth = getDaysInMonth(mon);
                    for (let i = 1; i <= daysInMonth; i++) {
                        checklistMap[item.assetName][`day${i}`] = '';
                    }
                }
            });

            
            rowData = Object.values(checklistMap);

            gridOptions.api.setRowData(rowData);
        },
        error: function(error) {
            console.error("Error in request:", error);
        }
    });

}

//function for download
function downloadDetails() {
	var params = {
		fileName: 'Starpac-Cutter_Record.csv', // Specify your custom filename here
	};
	gridOptions.api.exportDataAsCsv(params);
}

const gridOptions = {
    columnDefs: [], // Will be set dynamically
    rowData: rowData,
    defaultColDef: {
        resizable: true,
        sortable: true
    },
    rowHeight: 35,
    domLayout: 'autoHeight',
};

</script>

</head>
<body>

											onchange="getSelectedMonth()">

											<option value="07">July</option>
											<option value="08">August</option>
											<option value="09">September</option>
											<option value="10">October</option>
											<option value="11">November</option>
											<option value="12">December</option>
										</select>
									</div>
								</div>
								<div class="buttonsec btn-hs" id="ttbtn">
									<button class="download-btn" id="download"
										onclick="downloadDetails()">Download</button>
								</div>
							</div>

						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
