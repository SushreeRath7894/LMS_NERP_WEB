	 function getCategoryList() {
		    var search = $("#categoryName").val();
		    $("#addre").hide();

		    if (search) {
		        $.ajax({
		            type: "POST",
		            url: "manage-monthlyprovision-get-category-list",
		            dataType: 'json',
		            contentType: 'application/json',
		            data: search,
		            success: function (response) {
		                if (response.message == "success") {
		                    if (response.body.length != 0) {
		                        var data = JSON.parse(response.body);
		                        $("#search").css("background", "#FFF");
		                        var content = '<ul id="autocomplete-list1">';
		                        for (var i = 0; i < data.length; i++) {
		                            content += '<li style="margin-left:-30px; font-weight:100; font-size:12px; cursor: pointer;" data-category-id="' + data[i].categoryId + '" class="autocompletedata cp" onclick="selectAutocompleteValue1(\'' + data[i].categoryId + '\', \'' + data[i].categoryName + '\')">'
		                                + data[i].categoryName
		                                + '</li>';
		                        }
		                        content += '</ul>';
		                        $("#suggesstion-box1_").html(content);
		                        $("#suggesstion-box1_").show();
		                    } else {
		                        $("#suggesstion-box1_").hide();
		                    }
		                }
		            },
		            error: function (data) {
		                console.log(data);
		            }
		        });
		    } else {
		        $("#suggesstion-box1_").hide();
		    }
		}

		})

	 function updateSelection() {
		    const selectedYear = $("#year").val();
		    const selectedMonth = $("#month").val();
            
		    console.log("Selected Year:", selectedYear);
		    console.log("Selected Month:", selectedMonth);
		    agGrid.simpleHttpRequest({
		        url: "manage-monthlyprovision-view?year=" + selectedYear  + "&month=" + selectedMonth,
		    }).then(function (data) {
		        console.log("####data", +data);
		        var len = data.length;
		        $('#totalReq').find('span').html(len);

		        if (len === 0) {
		        	 //gridOptions.api.setRowData("No data found for the selected year and month");		            
		             var noDataMessage = {
		            	provisionId: '',
		                categoryName: 'No data found',
		                projectcost: '',
		                annualcost: '',
		                difference: ''
		            }; 
		            // Display the message row in the ag-Grid
		            gridOptions.api.setRowData([noDataMessage]);
		        } else {
		            // If data is found, populate the ag-Grid with the data
		            var totalProjectCost = data.reduce(function (sum, row) {
		                return sum + parseFloat(row.projectcost);
		            }, 0);

		            var totalAnnualCost = data.reduce(function (sum, row) {
		                return sum + parseFloat(row.annualcost);
		            }, 0);

		            var totalDifference = data.reduce(function (sum, row) {
		                return sum + parseFloat(row.difference);
		            }, 0);

		            var totalRow = {
		                categoryName: 'Total',
		                projectcost: totalProjectCost,
		                annualcost: totalAnnualCost,
		                difference: totalDifference
		            };
		           
		            gridOptions.api.setRowData(data.concat(totalRow));
		        }
		    });
		}
