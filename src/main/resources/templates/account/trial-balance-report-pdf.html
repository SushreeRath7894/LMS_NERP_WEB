<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Trial Balance Report</title>
<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" />
<style>
@page {
  size: A4 landscape;
  margin-right: 30mm;
}

body {
	font-family: 'Montserrat', sans-serif;
	margin: 0;
	padding: 0;
	font-size: 12px;
}

table {
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
      -fs-table-paginate: paginate;
    }

th, td {
	border: 1px solid #444;
	padding: 5px;
}

th {
	background-color: #c4bebe;
	text-decoration: underline;
	text-align: center;
}

td {
	text-align: right;
	font-size: 10px;
	text-align: right;
}

td:first-child {
    text-align: left !important;
}

caption {
	caption-side: top;
	font-weight: bold;
	margin-bottom: 10px;
	font-size: 16px;
}

.b-c {
	font-weight: bold;
	text-transform: uppercase;
}

.b-i {
	font-weight: bold;
	font-style: italic;
}

.b-i-u {
	font-weight: bold;
	font-style: italic;
	text-decoration: underline;
}

.b {
	font-weight: bold;
}

.fs-14 {
	font-size: 14px;
}

thead {
  display: table-header-group;
}

@media print {
	table {
        page-break-inside: auto;
    }
    tr {
        page-break-inside: avoid;
    }
}
</style>
</head>
<body>
	<table>
		<caption>Trial Balance Report</caption>
		<thead>
			<tr>
				<th>Account Description</th>
				<th>Opening Balance</th>
				<th>Transaction Debit</th>
				<th>Transaction Credit</th>
				<th>Closing Balance</th>
			</tr>
		</thead>
		<tbody>
			<tr th:if="${not #lists.isEmpty(data)}" th:each="a : ${data}">
				<td th:text="${a.AccGroupName}" th:class="${a.AccGroupLevel == 'L1'} ? 'b-c' : (${a.AccGroupLevel == 'L2'} ? 'b-i' : (${a.AccGroupLevel == 'L3'} ? 'b-i-u' : (${a.AccGroupLevel == 'L4'} ? 'b' : '')))"></td>
				<td th:text="${a.OpenBalance}" th:class="${a.AccGroupLevel == 'L1'} ? 'b-c' : (${a.AccGroupLevel == 'L2'} ? 'b-i' : (${a.AccGroupLevel == 'L3'} ? 'b-i-u' : (${a.AccGroupLevel == 'L4'} ? 'b' : '')))"></td>
				<td th:text="${a.DebitAmount}" th:class="${a.AccGroupLevel == 'L1'} ? 'b-c' : (${a.AccGroupLevel == 'L2'} ? 'b-i' : (${a.AccGroupLevel == 'L3'} ? 'b-i-u' : (${a.AccGroupLevel == 'L4'} ? 'b' : '')))"></td>
				<td th:text="${a.CreditAmount}" th:class="${a.AccGroupLevel == 'L1'} ? 'b-c' : (${a.AccGroupLevel == 'L2'} ? 'b-i' : (${a.AccGroupLevel == 'L3'} ? 'b-i-u' : (${a.AccGroupLevel == 'L4'} ? 'b' : '')))"></td>
				<td th:text="${a.CloseBalance}" th:class="${a.AccGroupLevel == 'L1'} ? 'b-c' : (${a.AccGroupLevel == 'L2'} ? 'b-i' : (${a.AccGroupLevel == 'L3'} ? 'b-i-u' : (${a.AccGroupLevel == 'L4'} ? 'b' : '')))"></td>
			</tr>
			<tr style="background-color: #c4bebe">
				<td class="b-c fs-14">Total</td>
				<td class="b-c fs-14">0.00</td>
				<td class="b-c fs-14" th:text="${totalDebit}"></td>
				<td class="b-c fs-14" th:text="${totalCredit}"></td>
				<td class="b-c fs-14" th:text="${closingBalance}"></td>
			</tr>
		</tbody>
	</table>
</body>
</html>
