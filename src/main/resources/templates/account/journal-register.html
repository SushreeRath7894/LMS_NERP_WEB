		 function parseDate(dateStr, format) {
		        // Example assumes format is DD-MM-YYYY
		        var parts = dateStr.split('-');
		        return new Date(parts[2], parts[1] - 1, parts[0]); // YYYY, MM, DD
		    }

		    // Function to update date pickers based on selected range
		    function updateDatePickers(yearStart, yearEnd) {
		        var minDate = `01-04-${yearStart}`;
		        var maxDate = `31-03-${yearEnd}`;
		        var minDateParsed = parseDate(minDate, dateFormat);
		        var maxDateParsed = parseDate(maxDate, dateFormat);

		        $("#toDateCalendar").datetimepicker('destroy').datetimepicker({
		            format: dateFormat,
		            closeOnDateSelect: true,
		            timepicker: false,
		            minDate: minDateParsed,
		            maxDate: maxDateParsed
		        }).on("change", function() {

		        });

		        $('#fromDate').blur(function() {

		        });

	function amountFormatter(value) {
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split('.');
	        var integerPart = parts[0];
	        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
	        return formattedIntegerPart + decimalPart;
	    } else {
	        return '';
	    }
	}

	function checkNumberInput(id) {
		var tagname = $("#" + id).val()
		 var replaceValue = tagname.replace(/[^\d.]/g, '');
		    var decimalIndex = replaceValue.indexOf('.');
		    if (decimalIndex !== -1) {

		    }
		    $("#" + id).val(replaceValue);
		}

		//function to validate Discount field
		
		function extractNumber(obj, decimalPlaces, allowNegative){
			var temp = obj.value;
			// avoid changing things if already formatted correctly
			var reg0Str = '[0-9]*';
			if (decimalPlaces > 0) {
				reg0Str += '\\.?[0-9]{0,' + decimalPlaces + '}';
			} else if (decimalPlaces < 0) {
				reg0Str += '\\.?[0-9]*';
			}
			reg0Str = allowNegative ? '^-?' + reg0Str : '^' + reg0Str;
			reg0Str = reg0Str + '$';
			var reg0 = new RegExp(reg0Str);
			if (reg0.test(temp)) return true;

			// first replace all non numbers
			var reg1Str = '[^0-9' + (decimalPlaces != 0 ? '.' : '') + (allowNegative ? '-' : '') + ']';
			var reg1 = new RegExp(reg1Str, 'g');
			temp = temp.replace(reg1, '');

			if (allowNegative) {
				// replace extra negative
				var hasNegative = temp.length > 0 && temp.charAt(0) == '-';
				var reg2 = /-/g;
				temp = temp.replace(reg2, '');
				if (hasNegative) temp = '-' + temp;
			}
			
			if (decimalPlaces != 0) {
				var reg3 = /\./g;
				var reg3Array = reg3.exec(temp);
				if (reg3Array != null) {
					// keep only first occurrence of .
					//  and the number of places specified by decimalPlaces or the entire string if decimalPlaces < 0
					var reg3Right = temp.substring(reg3Array.index + reg3Array[0].length);
					reg3Right = reg3Right.replace(reg3, '');
					reg3Right = decimalPlaces > 0 ? reg3Right.substring(0, decimalPlaces) : reg3Right;
					temp = temp.substring(0,reg3Array.index) + '.' + reg3Right;
				}
			}
			
			obj.value = temp;
		}

function downloadExcelFromGrid() {
	const selectedHeaders = [
	    'JOURNAL VOUCHER ID',
	    'COST CENTER NAME',
	    'DEBIT TO',
	    'CREDIT TO',
	    'DESCRIPTION',
	    'AMOUNT',
	    'CREATED DATE'
	   
	  ];

	  const fieldsToSum = [
	    'AMOUNT',
	  ];

	  // Get fromDate and toDate values
	  const fromDate = $("#fromDate").val();
	  const toDate = $("#toDate").val();

	  // Dynamically get company name (orgDiv) from first row of grid
	  let companyName = "ORIFOOD AND BEVERAGE PRIVATE LIMITED---"; // default fallback
	  const firstNode = gridOptions.api.getDisplayedRowAtIndex(0);
	  if (firstNode && firstNode.data && firstNode.data.orgDiv) {
	    companyName = firstNode.data.orgDiv.toUpperCase();
	  }

	  const currentDate = new Date().toLocaleDateString('en-GB', {
	    day: '2-digit',
	    month: '2-digit',
	    year: 'numeric'
	  }).split('/').join('_');

	  const fileName = 'JOURNAL REGISTER REPORT_' + currentDate + '.xlsx';
	  const rowData = [];
	  const fieldMap = {};

	  // Map column headers to fields
	  gridOptions.columnApi.getAllColumns().forEach((col) => {
	    const colDef = col.getColDef();
	    if (colDef.headerName && colDef.field) {
	      fieldMap[colDef.headerName.toUpperCase()] = colDef.field;
	    }
	  });

	  const totals = {};
	  fieldsToSum.forEach(header => totals[header] = 0);

	  // Collect row data
	  gridOptions.api.forEachNodeAfterFilterAndSort((node) => {
	    const row = {};
	    selectedHeaders.forEach((header) => {
	      const field = fieldMap[header.toUpperCase()];
	      let value = node.data?.[field] ?? '';

	      // Sum numeric fields
	      if (fieldsToSum.includes(header)) {
	        const num = parseFloat(value.toString().replace(/,/g, ''));
	        totals[header] += isNaN(num) ? 0 : num;
	        value = amountFormatter(isNaN(num) ? 0 : num.toFixed(2));
	      }

	      row[header] = value;
	    });
	    rowData.push(row);
	  });

	  // Add total row
	  const totalRow = {};
	  selectedHeaders.forEach(header => {
	    if (fieldsToSum.includes(header)) {
	      totalRow[header] = amountFormatter(totals[header].toFixed(2));
	    } else if (header === 'JOURNAL VOUCHER ID') {
	      totalRow[header] = 'Total';
	    } else {
	      totalRow[header] = '';
	    }
	  });
	  rowData.push(totalRow);

	  // Create top rows
	  const headingRow1 = {}, headingRow2 = {}, dividerRow = {}, spacerRow = {};
	  selectedHeaders.forEach(header => {
	    headingRow1[header] = '';
	    headingRow2[header] = '';
	    dividerRow[header] = '';
	    spacerRow[header] = '';
	  });

	  headingRow1[selectedHeaders[0]] = companyName;
	  headingRow2[selectedHeaders[0]] = `JOURNAL REGISTER REPORT From ${fromDate} To ${toDate}`;
	  dividerRow[selectedHeaders[0]] = '―'.repeat(80);

	  rowData.unshift(spacerRow);
	  rowData.unshift(dividerRow);
	  rowData.unshift(headingRow2);
	  rowData.unshift(headingRow1);

	  // Convert to sheet
	  const ws = XLSX.utils.json_to_sheet(rowData, {
	    header: selectedHeaders,
	    skipHeader: true
	  });

	  // Merge and style heading rows
	  ws['!merges'] = [
	    { s: { r: 0, c: 0 }, e: { r: 0, c: selectedHeaders.length - 1 } },
	    { s: { r: 1, c: 0 }, e: { r: 1, c: selectedHeaders.length - 1 } },
	    { s: { r: 2, c: 0 }, e: { r: 2, c: selectedHeaders.length - 1 } }
	  ];

	  ws['A1'] = {
	    v: companyName,
	    t: 's',
	    s: {
	      font: { bold: true, sz: 16 },
	      alignment: { horizontal: 'center', vertical: 'center' },
	      fill: { fgColor: { rgb: 'DCE6F1' } }
	    }
	  };

	  ws['A2'] = {
	    v: `JOURNAL REGISTER REPORT From ${fromDate} To ${toDate}`,
	    t: 's',
	    s: {
	      font: { bold: true, sz: 14 },
	      alignment: { horizontal: 'center', vertical: 'center' },
	      fill: { fgColor: { rgb: 'E2EFDA' } }
	    }
	  };

	  ws['A3'] = {
	    v: '―'.repeat(80),
	    t: 's',
	    s: {
	      alignment: { horizontal: 'center', vertical: 'center' },
	      font: { color: { rgb: "666666" } }
	    }
	  };

	  // Style headers
	  selectedHeaders.forEach((header, index) => {
	    const cellAddress = XLSX.utils.encode_cell({ c: index, r: 3 });
	    if (!ws[cellAddress]) return;

	    ws[cellAddress].v = header.toUpperCase();
	    ws[cellAddress].s = {
	      fill: { fgColor: { rgb: "5784c4" } },
	      font: { bold: true, color: { rgb: "FFFFFF" } },
	      alignment: { horizontal: "center", vertical: "center" },
	      border: {
	        top: { style: "thin", color: { rgb: "000000" } },
	        bottom: { style: "thin", color: { rgb: "000000" } },
	        left: { style: "thin", color: { rgb: "000000" } },
	        right: { style: "thin", color: { rgb: "000000" } }
	      }
	    };

	    
	    
	    const colLetter = XLSX.utils.encode_col(index);
	    const colRange = XLSX.utils.decode_range(ws['!ref']);
	    for (let r = 4; r <= colRange.e.r; r++) {
	      const cellRef = `${colLetter}${r + 1}`;
	      if (!ws[cellRef]) continue;

	      if (fieldsToSum.includes(header) || header === 'TDS RATE(%)') {
	        ws[cellRef].s = {
	          alignment: { horizontal: "right" }
	        };
	      }
	    }
	  });


	  // Set column widths
	  ws['!cols'] = selectedHeaders.map(header => {
	    switch (header) {
	      case 'JOURNAL VOUCHER ID': return { wch: 25 };
	      case 'COST CENTER NAME': return { wch: 20 };
	      case 'DEBIT TO': return { wch: 40 };
	      case 'CREDIT TO':return { wch: 45 };
	      case 'DESCRIPTION': return { wch: 50 };
	      case 'AMOUNT': return { wch: 30 };
	      case 'CREATED DATE':
	        return { wch: 18 };
	      default:
	        return { wch: 20 };
	    }
	  });

	  // Export workbook
	  const wb = XLSX.utils.book_new();
	  XLSX.utils.book_append_sheet(wb, ws, 'Journal Register Report');
	  XLSX.writeFile(wb, fileName);
}
	
</script>
