<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="tdsreport">

<head>

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script src="../javaScript/account/manage-tds-report.js"></script>


<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.min.js"></script>

<style>
.tdsReportSection .out-box {
	height: calc(100vh - 7.9rem);
}

.TDSTypeButtons {
	background: #bf05ff0d;
	color: #bf05ff;
}

.tabActive {
	background: #c646f2fa;
	color: #ffffff;
}
</style>
</head>
<body>
	<div class="d-flex flex-column flex-lg-row">

		<!--Left Sec Start-->
		<div class="box-sec w-100 tdsReportSection" id="collapseWidthR1">
			<div class="out-box p-2">
				<div class="hstack justify-content-between">

					<div class="col-md-8 col-12">
						<form class="d-flex gap-2 search-sec flxwrap">
							<input class="form-control search_input_bar"
								placeholder="Search..." type="text" name="search"
								oninput="onQuickFilterChanged()" id="quickFilter"
								autocomplete="off">
							<button class="btn go-btn" onclick="onQuickFilterChanged()"
								id="SearchBtn" type="button">Go</button>
						</form>
					</div>

					<div class="btn icon-btn">
						<i class="bi bi-arrow-down-square-fill" onclick="downloadExcelTds()"></i>
					</div>

				</div>

				<div class="card p-2">

					<div class="row" id="sDiv">
						<input type="hidden" id="activeStatus"> <input
							type="hidden" id="entryId">
						<div class="btn-group col-md-6">
							<button class="btn TDSTypeButtons" id="tdsReceivable"
								onclick="viewTdsReceivable()">TDS Receivable</button>
						</div>
						<div class="btn-group col-md-6">
							<button class="btn TDSTypeButtons" id="tdsPayable"
								onclick="viewTdsPayable()">TDS Payable</button>
						</div>

					</div>

					<div class="row row-cols-1 row-cols-md-5" id="headingDiv">
						<div class="col" id="fyearDiv">
							<div class="form-group">
								<label>Fiscal Year</label>
								<div class="select">
									<select id="orderStatusFilter" class="form-control">
										<option value="">--Select--</option>
										<option th:each="c,iter:${fiscalList}" th:value="${c.key}"
											th:text="${c.name}"></option>
									</select>
								</div>
							</div>
						</div>

						<div class="col" id="tdsReceivableSelectionDiv">
							<div class="form-group">
								<label>TDS Receivable Type</label>
								<div class="select">
									<select id="tdsReceivableLedgerId" class="form-control">
										<option value="">--Select--</option>
										<option th:each="c,iter:${tdsReceivableLedgerList}"
											th:value="${c.key}" th:text="${c.name}"></option>
									</select>
								</div>
							</div>
						</div>

						<div class="col" id="tdsPayableSelectionDiv">
							<div class="form-group">
								<label>TDS Payable Type</label>
								<div class="select">
									<select id="tdsPayableLedgerId" class="form-control">
										<option value="">--Select--</option>
										<option th:each="c,iter:${tdsPayableLedgerList}"
											th:value="${c.key}" th:text="${c.name}"></option>
									</select>
								</div>
							</div>
						</div>

						<div class="col">
							<div class="row row-cols-1 row-cols-md-2">
								<div class="col" id="fdateDiv">
									<div class="form-group calendar_box">
										<label>From Date</label> <input type="text" id="fromDateTDS"
											placeholder="From Date" class="form-control"> <i
											class="ti-calendar picker_calendar" id="fromDateCalendarTDS"
											style="top: 50px; right: 5px;"></i>
									</div>
								</div>
								<div class="col" id="tdateDiv">
									<div class="form-group calendar_box">
										<label>To Date</label> <input type="text" id="toDateTDS"
											placeholder="To Date" class="form-control"> <i
											class="ti-calendar picker_calendar" id="toDateCalendarTDS"
											style="top: 50px; right: 5px;"></i>
									</div>
								</div>
							</div>
						</div>

						<div class="col-auto ms-auto align-content-end" id="filterDiv">
							<button type="button" id="filterTdsBtn" class="btn1"
								onclick="viewFilteredDataTDS()">Search</button>
						</div>
					</div>

					<div class="d-flex justify-content-between">
						<div class="col-md-4  btn-hs">
							<!-- <div class="font-design" id="totalReq">
								ALL TDS (<span></span>)
							</div> -->
						</div>
					</div>

					<div id="myGridTds" style="width: 100%; height: 100vh;"
						class="ag-theme-alpine"></div>

					<div id="totalAmountFooterDiv">
						<div class="form-group d-flex" style="float: right;">
							<label style="width: 240px; top: 13px;">Total TDS Amount:</label>
							<input type="text" id="totalAmountFooter" class="form-control"
								style="margin-top: 7px; text-align: end;" readonly>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
