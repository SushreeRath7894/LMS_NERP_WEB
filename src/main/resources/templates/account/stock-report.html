		$("#filterFromDate").val(firstDayOfMonth);
		$("#filterToDate").val(newDate);

		$("#div4").hide();

				"margin-right" : "10px",
				"border-bottom" : "1px solid #d5d5d5"
			});

	function ShowAgGrid(state) {
		$("#div1").hide();
		$("#div2").hide();
		$("#div3").hide();
		$("#div4").hide();
		$('#rmStockReport').removeClass('active');
		$('#pmStockReport').removeClass('active');
		$('#fgStockReport').removeClass('active');
		$('#storeStockReport').removeClass('active');
		if (state == 'rm') {
			$('#rmStockReport').addClass('active');
			$("#div1").show();
			viewStock(state);
		}else if (state == 'pm') {
			$('#pmStockReport').addClass('active');
			$("#div2").show();
			viewStock(state);
		}else if (state == 'fg') {
			$('#fgStockReport').addClass('active');
			$("#div3").show();
			viewStock(state);
		}else if (state == 'scrap') {
			$('#scarpStockReport').addClass('active');
			$("#div4").show();
			viewStock(state);
		}  
	}
 function viewStock(type){
		$('.loader').show();
		$("body").addClass("overlay");
		 agGrid.simpleHttpRequest({
			url : "stock-report-view?type="+type
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			console.log("jsonData==",jsonData)
			if(jsonData == null || jsonData == 'null'){
				jsonData = "";
			}
			var len = jsonData.length;
			if (type == 'rm') {
				$('#totalReq').find('span').html(len);
				gridOptions.api.setRowData(jsonData);
			}else if (type == 'pm') {
				$('#totalReq2').find('span').html(len);
				gridOptions2.api.setRowData(jsonData);				
			}else if (type == 'fg') {
				$('#totalReq3').find('span').html(len);
				gridOptions3.api.setRowData(jsonData);				
			}else if (type == 'scrap') {
				$('#totalReq4').find('span').html(len);
				gridOptions4.api.setRowData(jsonData);				
			}
			
			$('.loader').hide();
			$("body").removeClass("overlay");
		});

	function numberFormatter(params) { 
	
		return params.value!="" && params.value!= null?parseFloat(params.value).toFixed(2):''; 
	}
	function numberFormatter2(params) { 
		return params.value!= null ? params.value?.toFixed(2) : '0.00'; 
	}

	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	function changeDateFormat1(inputDate) { // expects Y-m-d

		var month = splitDate[1];
		var day = "01";

		return day + '-' + month + '-' + year;

	function amountFormatter(value) {
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split('.');
	        var integerPart = parts[0];
	        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
	        return formattedIntegerPart + decimalPart;
	    } else {
	        return '';
	    }
	}
