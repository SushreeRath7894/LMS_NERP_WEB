	function viewData(module,id) {
		console.log("module>>>",module);
		$(".loader").show();
		agGrid.simpleHttpRequest({
			url : "employee-pass-all-entries?module="+module
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.viewPass;
			if(module == "HRMS"){
				if (allData != null) {
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					
					gridOptions.api.setRowData(allData);
				} else {
					$('#totalReq').find('span').html("0");
					gridOptions.api.setRowData();
				}
			}else{
				if (allData != null) {
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					gridOptionsGate.api.setRowData(allData);
					
					if(id){
						gridOptionsGate.api.getRowNode(id).setSelected(true);
					}else if(allData && allData.length > 0){
						let rowId = allData[0].slNo;
						gridOptionsGate.api.getRowNode(rowId).setSelected(true);
					}
				
				} else {
					$('#totalReq').find('span').html("0");
					gridOptionsGate.api.setRowData();
				}
			}
			

			$(".loader").hide();
		});

	}

	function editPass(passId) {
		
		$("#passIdSpan").html(passId)
		$("#passId").val("");
		$("#empNameAuto").val("");
		$("#employeeId").val("");
		$("#passType").val("");
		$("#passPurpose").val("");
		$("#date").val("");
		$("#toDate").val("");
		$("#fromTime").val("");
		$("#toTime").val("");
		$("#empNameAuto").val('');
		$("#suggesstion-box_").hide();
		$("#employeeName").val('');
		$("#employeeId").val('');

		$.ajax({
			type : "GET",
			url : "employee-pass-get-pass?id=" + passId,
			success : function(response) {
				if (response.message == "success") {
					var data = JSON.parse(response.body);
					var viewPass = data.viewPass[0];

					$(".formValidation").remove();
					
					$("#passId").val(viewPass.passId);
					$("#empNameAuto").val(viewPass.empName);
					$("#employeeId").val(viewPass.employeeId);
					$("#passType").val(viewPass.passType);
					$("#passPurpose").val(decodeURIComponent(viewPass.passPurpose));
					$("#date").val(viewPass.fromDate);
					$("#toDate").val(viewPass.toDate);
					$("#fromTime").val(viewPass.fromTime);
					$("#toTime").val(viewPass.toTime);
					$("#generatePassModal").modal('show');
					$('.loader-modal').hide();
					$('.loader-modal-autosearch').hide();
				}

			}
		});
	}

	var timeout;
	function getEmployeeList() {
		
		$("#employeeName").val('');
		$("#employeeId").val('');
		$('.loader-modal-autosearch').show();
		
		clearTimeout(timeout); 
		timeout = setTimeout(function() {
		var search = $("#empNameAuto").val();
		if (search) {
			$.ajax({
						type : "POST",
						url : "employee-pass-autoserach-employee",
						dataType : 'json',
						contentType : 'application/json',
						data : search,
						success : function(response) {
							if (response.message == "success") {

								var jsonData = JSON.parse(response.body);
								var allData = jsonData;
								if (allData != null && allData.length > 0) {
									var len = allData.length;
									//$("#empid").val("");
							var content = '<div id="autocomplete-container" style="max-height: 160px; overflow-y: auto; background-color : #c8cfdf">';
									content += '<ul id="autocomplete-list1" class="sugg-cls-ul" style="padding-left: 10px;" >';
									for (var i = 0; i < len; i++) {
										content += '<li class="autocompletedata cp" onClick="selectAutocompleteValueItem1(\''
												+ window.btoa(allData[i].empId)
												+ '\',\''
												+ window.btoa(allData[i].name)
												+ '\')">'
												+ allData[i].empId
												+ " - "
												+ allData[i].name
												+ '</li>';
									}
									content += '</ul>';
									$("#suggesstion-box_").show();
									$("#suggesstion-box_").html(content);
									$('.loader-modal-autosearch').hide();

	function savePass() {
		var obj = {};
		var valid = true;

		obj.passId = $("#passId").val();
		obj.employeeId = $("#employeeId").val();
		obj.purpose = encodeURIComponent($("#passPurpose").val());
		obj.fromDate = $("#date").val();
		obj.toDate = $("#toDate").val();

		obj.toTime = $("#toTime").val();

		if (obj.employeeId == null || obj.employeeId == "") {
			valid = validationUpdated("Please Choose An Employee",

		}

		if (obj.fromDate == null || obj.fromDate == "") {
			valid = validationUpdated("Choose From Date", "date");
		}
		if (obj.toDate == null || obj.toDate == "") {
			valid = validationUpdated("Choose To Date", "toDate");
		}
		if (obj.fromTime == null || obj.fromTime == "") {
			valid = validationUpdated("Choose From Time", "fromTime");
		}
		if (obj.toTime == null || obj.toTime == "") {
			valid = validationUpdated("Choose To Time", "toTime");
		}
		
		console.log('obj>>',obj)

		if (valid) {
			$(".loader-modal").show();
			$.ajax({
				type : "POST",
				url : "emploee-pass-save-pass",
				dataType : "json",
				contentType : "application/json",
				data : JSON.stringify(obj),

					if (response.code == "success") {
						$("#messageParagraph").text(response.message);
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$('#replyBtn').attr("disabled", true);
						$(".loader").hide();
						$("#generatePassModal").modal('hide');
						
						//var module=sessionStorage.getItem('modName');
						var module='Gate';
						viewData(module,"");
						$('.loader-modal').hide();

					} else if(response.code == "failed"){
						$('.loader').hide();
						$("#messageParagraph").text(response.message);
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$(".loader-modal").hide();

					}else {
						$('.loader').hide();
						$("#messageParagraph").text("Something Went Wrong.");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$(".loader-modal").hide();

				},

					$('.loader-modal').hide();
				}

	function calculateTotalDuration() {
		
		    var date1 = $("#date").val(); // Assuming date1 is in "DD-MM-YYYY" format
		    var date2 = $("#toDate").val(); // Assuming date2 is in "DD-MM-YYYY" format

		    if (date1 && date2) {
		        function parseDate(dateStr) {
		            var parts = dateStr.split('-');
		            if (parts.length !== 3) {
		                console.error('Invalid date string format');
		                return null;
		            }
		            var day = parseInt(parts[0], 10);
		            var month = parseInt(parts[1], 10) - 1; // JavaScript months are 0-based
		            var year = parseInt(parts[2], 10);
		            return new Date(year, month, day);
		        }

		        var fromDateObj = parseDate(date1);
		        var toDateObj = parseDate(date2);

		        if (!fromDateObj || !toDateObj) {
		            console.error('Failed to parse one or both dates');
		            return;
		        }

		        if (fromDateObj > toDateObj) {
		            $("#messageParagraph").text("Please choose a valid date range.");
		            $("#msgOkModal").removeClass("btn3");
		            $("#msgOkModal").addClass("btn1");
		            $("#msgModal").modal('show');
		            $("#date").val("");
		            $("#toDate").val("");
		            return;
		        }

		    }
		}
