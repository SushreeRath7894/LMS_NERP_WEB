    height: 10px;

    border-radius: 50%;

	function updateShiftButtonColors() {
	    var now = new Date();
	    var currentMinutes = now.getHours() * 60 + now.getMinutes();

	    // Define shifts with priority (higher index means higher priority)
	    var shifts = [
	        {
	            id: '#shiftCsec',
	            start: 22 * 60 + 1, // 10:01 PM
	            end: 6 * 60         // 06:00 AM
	        },
	        {
	            id: '#shiftBsec',
	            start: 14 * 60 + 1, // 02:01 PM
	            end: 22 * 60        // 10:00 PM
	        },
	        {
	            id: '#shiftGsec',
	            start: 9 * 60,      // 09:00 AM
	            end: 18 * 60        // 06:00 PM
	        },
	        {
	            id: '#shiftAsec',
	            start: 6 * 60,      // 06:00 AM
	            end: 14 * 60        // 02:00 PM
	        }
	    ];

	    function isWithinRange(start, end) {
	        if (start < end) {
	            return currentMinutes >= start && currentMinutes <= end;
	        } else {
	            return currentMinutes >= start || currentMinutes <= end;
	        }
	    }

	    // Remove all active classes first
	    $('#shiftGsec').removeClass('shiftA shiftB');
		$('#shiftAsec').removeClass('shiftA shiftB');
		$('#shiftBsec').removeClass('shiftA shiftB');
		$('#shiftCsec').removeClass('shiftA shiftB');
		$('#shiftGicon').removeClass('blink-icon blink-iconss');
		$('#shiftAicon').removeClass('blink-icon blink-iconss');
		$('#shiftBicon').removeClass('blink-icon blink-iconss');
		$('#shiftCicon').removeClass('blink-icon blink-iconss');
		
		// Iterate over shifts based on priority
		for (var i = 0; i < shifts.length; i++) {
		    var shift = shifts[i];
		    var shiftId = shift.id; // e.g., #shiftGsec
		    var shiftIdentifier = shiftId.replace('#shift', '').replace('sec', '');
		    var iconId = shiftId.replace('sec', 'icon'); // e.g., #shiftGicon
		    // Check if within range
		    if (isWithinRange(shift.start, shift.end)) {
		        $(shiftId).addClass('shiftA');
		        $(iconId).addClass('blink-icon');
		    } else {
		        $(shiftId).addClass('shiftB');
		        $(iconId).addClass('blink-iconss');
		    }
		}
	}

	function changeFromDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}

		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

	function changeDateFormat(date) {
	    var dateParts = date.split("-");
	    return dateParts[2] + "-" + dateParts[1] + "-" + dateParts[0];
	}

			$("#filterFromDate").val(newDate);

	function downloadDetailsAll(){
			var rowCount = 0;
			activityOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			    if (rowNode.data.empId) {
			        rowCount++;
			    }
			});
			if (rowCount > 0) {

			    var allColumns = activityOptions.columnApi.getAllColumns();

			    allColumns.forEach(col => {
			        if (col.getColDef().headerName) {
			            col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
			        }
			    });

			    var visibleColumns = allColumns.filter(col => {
			        const headerName = col.getColDef().headerName;
			        const isColumnVisible = !col.getColDef().hide;
			        return headerName !== undefined && headerName !== null && isColumnVisible;
			    });

			    var visibleColumnIds = visibleColumns.map(col => col.getColId());

			    const params = {
			        skipHeader: false,
			        columnGroups: false,
			        skipFooters: false,
			        skipGroups: false,
			        skipPinnedTop: false,
			        skipPinnedBottom: false,
			        allColumns: true,

			        suppressQuotes: false,
			        fileName: name + '.csv',
			        sheetName: 'Sheet1',
			        customHeader: null,
			        customFooter: null,
			        columnKeys: visibleColumnIds
			    };
			    activityOptions.api.exportDataAsCsv(params);
			} else {
			    $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
			    $("#msgOkModal").removeClass("btn3");

			    $("#msgModal").modal('show');
			}
