<script>
let type = '';
$(document).ready(function() {

    const urlParams = new URLSearchParams(window.location.search);
    type = urlParams.get('id');

    if (type == null || type == 'null') {
        type = '';
    }

    var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
    var popoverList = popoverTriggerList.map(function(popoverTriggerEl) {
        return new bootstrap.Popover(popoverTriggerEl)
    })
    var gridDiv = document.querySelector('#myGrid');
    new agGrid.Grid(gridDiv, gridOptions);
    var gridDiv1 = document.querySelector('#myGridLeaveList');
    new agGrid.Grid(gridDiv1, gridOptionsLeaveList);

    var userid = $("#sessionId").val();
    var userrole = $("#sessionRole").val();
    var roleid = "";
    for (var i = 6; i <= userrole.length; i = i + 6) {
        roleid = roleid + '"' + userrole.slice(i - 6, i) + '",';
    }
    roleid = roleid.substring(0, roleid.length - 1);
    gridOptions.api.setRowData();
    agGrid.simpleHttpRequest({
        url: "leave-apply-view?userid=" + userid + "&roleid=" + roleid + "&selftype=" + type,
    }).then(function(data) {
        var len = data.length;
        $('#totalReq').find('span').html(len);
        if (len > 0) {
            gridOptions.api.setRowData(data);
            var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0);
            if (firstRowNode) {
                firstRowNode.setSelected(true);
            }
        } else {
            var data = [];
            gridOptions.api.setRowData(data);
            rowSelectLeaveApply()
        }

    })


    $('#new').show();
    $('#approveLeave').hide();
    $('#rejectLeave').hide();

    $("#hidDocUrl").val('');
    $("#hidDocName").val('');

    var dateFormat = localStorage.getItem("dateFormat");

    $("#leaveApplyDateCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
        scrollMonth: false
    }).on("change", function() {
        $('#leaveApplyDate').val($(this).val());
    })

    $('#leaveApplyDate').blur(function() {
        $("#leaveApplyDateCalendar").val($(this).val());
    })

    $("#toDateCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
        scrollMonth: false,
        minDate: 0,
        defaultDate: new Date()
    }).on("change", function() {
        $('#toDate').val($(this).val());
    })

    $('#toDate').blur(function() {
        $("#toDateCalendar").val($(this).val());
    })

    $("#fromDateCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
        scrollMonth: false,
        minDate: 0,
        defaultDate: new Date()
    }).on("change", function() {
        $('#fromDate').val($(this).val());
    })

    $('#fromDate').blur(function() {
        $("#fromDateCalendar").val($(this).val());
    })
    
    nextTab('leaveDetails-tab');
    
    $("#editLeave").click(()=>{
    	$("#saveLeave,#cancelLeave").show();
    	$("#addProfile,#editLeave,#approveLeave,#rejectLeave,#nextApprovedLeave,#prevLeaveDetails").hide();
		$("#approveDetails-tab,#approvedLeave-tab").hide();
    })

});

/* -------------------search bar for mygrid1------------------------ */

function onQuickFilterChanged() {
    gridOptions.api
        .setQuickFilter(document.getElementById('quickFilter').value);

    var displayedRowCount = gridOptions.api.getDisplayedRowCount();

    var len = displayedRowCount;
    $('#totalReq').find('span').html(len);
    if (len > 0) {
        gridOptions.api.getDisplayedRowAtIndex(0).setSelected(true);
    }
}

function enterKeyToGo(e) {
    if (event.key === "Enter" || event.keyCode === 13) {
        onQuickFilterChanged()
    }
}

function reset() {
    if ($('#quickFilter').val() != null && $('#quickFilter').val("") != '') {
        $('#quickFilter').val("");
        onQuickFilterChanged();
    }

}

function cancelBar() {
    var id = document.getElementById("closeKey");
    id.style.display = "block";

    if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
        id.style.display = "none";
    }

    var len = gridOptions.api.getDisplayedRowCount();
    $('#totalReq').find('span').html(len);
}

/*------------- Function for delete leave apply parent table----------- */

function deleteLeaveApply() {

    var selectedRows = gridOptions.api.getSelectedRows();
    var rowCount = 0;
    selectedRows.forEach(function(i) {
        rowCount = rowCount + 1;
    });

    var selectedNodes = gridOptions.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    if (selectedData.map(node => node.status) == '0' && rowCount > 0) {

        var selectedRows = gridOptions.api.getSelectedRows();
        var id = selectedRows[0].leaveId;
        $.ajax({
            type: "GET",
            url: "leave-apply-delete?id=" + id,
            async: false,
            success: function(response) {

                if (response.message == "Success") {
                    toastr.success("Data Deleted Successfully");
                    cancelBtn();
                    $('#delete').attr("disabled", true);
                    $('#approve').attr('disabled', true);
                    $('#reject').attr('disabled', true);
                    $('#new').attr('disabled', false);
                    $('#new').show();

                }

            },
            error: function(data) {}
        });
    } else {
        toastr.error("Leave can't be deleted");
    }
}

    });
    var valuesSeparatedByComma = checkedValues.join(',');

    }

    });

    var selectedData = selectedNodes.map(node => node.data);
    var empID = selectedData.map(node => node.empID);

    var selectedNodes = gridOptions.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    var fromdate = selectedData.map(node => node.fromDate);

    var selectedNodes = gridOptions.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    var todate = selectedData.map(node => node.toDate);

    var date = (new Date()).toISOString().split('T')[0];
    var todayDate = changeDateFormat(date);


    if ((hrRole != null) && rowCount > 0 && valuesSeparatedByComma != "") {
        $.ajax({
            type: "GET",
            url: "leave-apply-approve?approveId=" + lvid + "&name=" + empid + "&comment=" + comment + "&roleid=" + roleid + "&dateid=" + valuesSeparatedByComma,
            async: false,
            success: function(response) {
                var userid = $("#sessionId").val();
                var userrole = $("#sessionRole").val();
                var roleid = "";
                for (var i = 6; i <= userrole.length; i = i + 6) {
                    roleid = roleid + '"' + userrole.slice(i - 6, i) + '",';
                }
                roleid = roleid.substring(0, roleid.length - 1);
                //To get The Leave Id
                const selectedNodes = gridOptions.api.getSelectedNodes();
                const leaveId = selectedNodes[0].data.leaveId;
                agGrid.simpleHttpRequest({
                    url: "leave-apply-view?userid=" + userid + "&roleid=" + roleid + "&selftype=" + type,
                }).then(function(data) {
                    console.log(data)
                    var len = data.length;
                    $('#totalReq').find('span').html(len);
                    if (len > 0) {
                        gridOptions.api.setRowData(data);
                        gridOptions.api.forEachNode(function(node) {
                            if (node.data.leaveId === leaveId) {
                                node.setSelected(true);
                            }
                        });
                    } else {
                        var data = [];
                        gridOptions.api.setRowData(data);
                    }


                    if (response.message == "Success") {

                        const leaveIdToFind = lvid[0];
                        var leaveData = "";
                        gridOptions.api.forEachNode((rowNode) => {
                            if (rowNode.data.leaveId == lvid) {
                                console.log("Row with leaveId  found:", rowNode.data);
                                leaveData = rowNode.data;
                            }
                        });
                        var message = "";
                        if (leaveData.status == 1) {
                            message = "Leave forwarded successfully";
                        } else if (leaveData.status == 3) {
                            message = "Leave approved successfully";
                        }
                        toastr.success(message);
                        $('#commentModal').modal('hide');
                        $('#approve').attr('disabled', true);
                        $('#delete').attr('disabled', true);
                        $('#reject').attr('disabled', true);
                        $('#new').attr('disabled', false);
                        $("#comment").val(null);
                    } else {
                        toastr.error("You have already approved this leave");
                        $('#commentModal').modal('hide');
                        $('#approve').attr('disabled', true);
                        $('#delete').attr('disabled', true);
                        $('#reject').attr('disabled', true);
                        $('#new').attr('disabled', false);
                        $("#comment").val(null);
                    }
                    closeApprove();

                });

            },
            error: function(data) {}
        });
    } else {
        toastr.error("Leave can't be approved with provided data");
    }
}

function changeDateFormat(inputDate) { // expects Y-m-d
    var splitDate = inputDate.split('-');
    if (splitDate.count == 0) {
        return null;
    }
    var year = splitDate[0];
    var month = splitDate[1];
    var day = splitDate[2];

    return day + '-' + month + '-' + year;
}

        $("#fromDate,#fromDateCalendar").val(null)

    var leavavail = parseInt(casleave);

/* ---------function for getting the data of leave apply parent table---------- */

function addDetails() {
    var datas = [];

    leave.forEach(function(details) {
        var uFile = $(".wardocument")[0].files[0];
        var fileName = $(".wardocument").val();
        var data = [];

        if (fileName != '' && fileName != 'undefined' && fileName != null) {
            var lastIndex = fileName.lastIndexOf("\\");
            if (lastIndex >= 0) {
                details.fileName = fileName.substring(lastIndex + 1);
            }

            var reader = new FileReader();
            reader.readAsDataURL(uFile);
            var iURL = URL.createObjectURL(uFile);
            reader.onload = function() {
                data = reader.result.split(",");
                details.documentFileBase = data[1];
                details.documentURL = $(this).find(".uploadedWarrCls").val();
                details.dURL = iURL;
            };
        } else {
            details.documentURL = $("#hidDocUrl").val();
            details.fileName = $("#hidDocName").val();
        }

        details.leaveId = $("#leaveId").html();
        if (adRole == "admin") {
            details.empName = $("#empNameList option:selected").text();
        } else {
            details.empName = $("#empName").val();
        }

        details.empID = $("#empID").val();
        details.leaveApplyDate = $("#leaveApplyDate").val();
        datas.push(details);
    });

    if (leave.length == 0) {
        toastr.error("Add leave details first");
    } else {
        saveLeaveApply(datas);
    }
}

/* --------------------function for header status----------------- */

function headerStatus(rejectStatus) {

    //	$("#statusDiv").show();
    var createdDate = $("#createdDate").text();
    //var approveDate = $("#approveDate").text();
    var rejectDate = $("#rejectDate").text();
    var forwardDate = $("#forwardDate").text();

    if (createdDate) {
        $('#createdDiv').addClass('bg-light-completed');
        $('#createdDiv').removeClass('bg-light-pink');
    } else {
        $('#createdDiv').removeClass('bg-light-completed');
        $('#createdDiv').addClass('bg-light-pink');
    }

    if (rejectStatus == "1") {
        $('#forwardDiv').removeClass('bg-light-pink');
        $('#forwardDiv').addClass('bg-light-completed');
    } else {
        $("#forwardDate").html("");
        $('#forwardDiv').removeClass('bg-light-completed');
        $('#forwardDiv').addClass('bg-light-pink');
    }
    if (rejectStatus == "2") {
        $('#rejectDiv').removeClass('bg-light-pink');
        $('#rejectDiv').addClass('bg-light-completed');
    } else {
        $("#rejectDate").html("");
        $('#rejectDiv').removeClass('bg-light-completed');
        $('#rejectDiv').addClass('bg-light-pink');
    }

    if (rejectStatus == "3") {
        $('#approveDiv').removeClass('bg-light-pink');
        $('#approveDiv').addClass('bg-light-completed');
    } else {
        $("#approveDate").html("");
        $('#approveDiv').removeClass('bg-light-completed');
        $('#approveDiv').addClass('bg-light-pink');

    }
    if (rejectStatus == "0") {
        $('#pendingDiv').removeClass('bg-light-pink');
        $('#pendingDiv').addClass('bg-light-completed');
    } else {
        $('#pendingDiv').removeClass('bg-light-completed');
        $('#pendingDiv').addClass('bg-light-pink');

    }
}

    }).then(function(data) {

        allDate.forEach(function(rowNode) {

                colour = 'inner-circleR';

                colour = 'inner-circleG';

    }

    $("#uploadedWarrDiv_0").html('<a href="' + iURL + '" target="_blank">' + docIcon + '</a>');

										<div class="requisition-tbl p-2 d-flex gap-2 flex-column h-100">

                      <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded" id="topBtnSec">
                        <!-- Name on the left -->
                        <div class="hstack flex-1">
                          <span class="head-user-name" id="employeeNameTop"></span>
                          <button class="btn edit-btn m-0 invisible d-none d-md-block" aria-label="This button remains hidden to manage the height when all button on the right are hidden">&nbsp;</button>
                        </div>

                        <!-- Buttons on the right -->
                        <div class="d-flex gap-2 w-100 flex-wrap flex-1 justify-content-end">
                          <button class="btn m-0 edit-btn"
                                  id="addProfile" onclick="addNewBtn()">Add</button>
                          <button class="btn m-0 edit-btn" id="editLeave"
                                  onclick="editAllFields()">Edit</button>
                          <button class="btn m-0 edit-btn" id="saveLeave"
                                  onclick="saveSideNav()">Save</button>
                          <button class="btn m-0 edit-btn"
                                  id="cancelLeave" onclick="resetRightSection()">Cancel</button>
                          <button class="btn m-0 edit-btn"
                                  id="approveLeave" onclick="approveLeaveModal()"
                                  th:if="${hrRole != null}">Approve</button>
                          <button class="btn m-0 edit-btn"
                                  id="rejectLeave" onclick="rejectLeaveModal()"
                                  th:if="${hrRole != null}">Reject</button>
                          <button type="button" class="btn m-0 edit-btn" id="approveLeaveSubmitBtn"
                                  onclick="approveLeave()">Approve</button>
                          <button type="button" class="btn m-0 edit-btn" id="rejectLeaveSubmitBtn"
                                  onclick="rejectLeave()">Reject</button>
                          <button class="btn m-0 edit-btn"
                                  id="closeApprove" onclick="closeApprove()">Cancel</button>
                          <button class="btn m-0 edit-btn"
                                  id="nextApprovedLeave"
                                  onclick="nextTab('approvedLeave-tab')">Next</button>
                          <button class="btn m-0 edit-btn"
                                  id="prevLeaveDetails"
                                  onclick="nextTab('leaveDetails-tab')">Prev</button>
                        </div>
                      </div>

											<div class="tab-content crd card p-2">
												<div class="tab-pane fade show active h-100" id="leaveDetails"
													role="tabpanel">
													<div class="d-flex align-items-center">
														<input type="hidden" id="leaveIdInput">
														<div class="col-md-12 ">
															<h6 class="font-design" id="leaveDtDiv">Available
																Leave</h6>
															<div class="topdetails roomListDiv"></div>
															<div class="slidearrow"></div>

														</div>
													</div>

													<!--Leave Details Section Start -->
													<div class="d-flex">
														<div class="card-body p-0">
															<div class="row g-3 m-auto">
																<div class="" id="idDiv" style="display: none">
																	<span class="head-user-name" id="leaveId">
																		
                                                                    </span>
																</div>
																<div class="mandatory-txt mt-0">
																	Note: All fields marked with <span>*</span> are
																	mandatory.
																</div>

																<!-- Employee Name Autocomplete -->
																<div class="col-md-4" id="empDdownDiv">
																	<div class="form-group">
																		<label for="empNameListInput" class="form-label">Employee
																			Name<span class="mandatory">*</span>
																		</label>
																		<div class="autocomplete">
																			<input type="text" class="form-control"
																				id="empNameList" autocomplete="off"
																				onkeyup="getEmployeeList()"
																				onblur="removeValid(event)"
																				placeholder="Enter Employee Id Or Name" />
																		</div>
																		<div id="suggesstion-box_" class="sugg-cls"></div>
																	</div>
																</div>

																<!-- Employee ID -->
																<div class="col-md-4">
																	<div class="form-group">
																		<label for="empID" class="form-label">Employee
																			ID</label> <input type="text" class="form-control" id="empID"
																			autocomplete="off" readonly />
																	</div>
																</div>


																<!-- Leave Apply Date with Calendar -->
																<div class="col-md-4">
																	<div class="form-group position-relative calendar_box">
																		<label for="leaveApplyDateInput" class="form-label">Leave
																			Apply Date<span class="mandatory">*</span>
																		</label>
																		<div class="position-relative">
																			<input type="text" id="leaveApplyDate"
																				autocomplete="off" class="form-control"
																				onblur="removeValid(event)" disabled
																				th:attr="onkeyup=|formatDate('leaveApplyDate','${session.DATEFORMAT_JS}')|" />
																			<i
																				class="ti-calendar picker_calendar position-absolute"
																				id="leaveApplyDateCalendar" style="cursor: pointer;"
																				onClick="setCalenderDate('leaveApplyDate','leaveApplyDateCalendar')"></i>
																		</div>
																	</div>
																</div>

																<!--Leave Details Starts  -->
																<!-- <div class="font-design" style="font-size: 1.1rem;">Leave Details</div> -->

																<!-- Leave Type -->
																<div class="col-md-4">
																	<div class="form-group">
																		<input type="hidden" id="rowId" /> <label
																			for="leaveType" class="form-label">Leave Type<span
																			class="mandatory">*</span></label>
																		<div class="select">
																			<select onblur="removeValid(event)" id="leaveType"
																				onchange="changedLeaveType()">
																				<option value="">Select</option>
																				<option th:each="c,iter:${leavelist}"
																					th:value="${c.key}" th:text="${c.name}"
																					th:name="${c.code}"></option>
																			</select>
																		</div>
																	</div>
																</div>

																<!-- From Date -->
																<div class="col-md-4">
																	<div class="form-group calendar_box">
																		<label for="fromDate" class="form-label">From
																			Date<span class="mandatory">*</span>
																		</label>
																		<div class="position-relative">
																			<input type="text" id="fromDate"
																				onchange="dateChange()" autocomplete="off"
																				class="form-control" onblur="removeValid(event)"
																				th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|">
																			<i class="ti-calendar picker_calendar"
																				id="fromDateCalendar" onchange="dateChange();"
																				onClick="setCalenderDate('fromDate','fromDateCalendar')"></i>
																		</div>
																	</div>
																</div>

																<!-- To Date -->
																<div class="col-md-4">
																	<div class="form-group calendar_box">
																		<label for="toDate" class="form-label">To Date<span
																			class="mandatory">*</span></label>
																		<div class="position-relative">
																			<input type="text" id="toDate"
																				onchange="dateChange()" autocomplete="off"
																				class="form-control" onblur="removeValid(event)"
																				th:attr="onkeyup=|formatDate('toDate','${session.DATEFORMAT_JS}')|">
																			<i class="ti-calendar picker_calendar"
																				id="toDateCalendar" onchange="dateChange();"
																				onClick="setCalenderDate('toDate','toDateCalendar')"></i>
																		</div>
																	</div>
																</div>



																<!-- Total Leave Days -->
																<div class="col-md-4">
																	<div class="form-group">
																		<label for="totalLeave" class="form-label">Total
																			Leave Days</label> <input type="text" class="form-control"
																			id="totalLeave" autocomplete="off"
																			onblur="removeValid(event)" readonly />

																	</div>
																</div>

																<!-- Reason -->
																<div class="col-md-4">
																	<div class="form-group">
																		<label for="reason" class="form-label">Reason<span
																			class="mandatory">*</span></label> <input type="text"
																			class="form-control" id="reason" autocomplete="off"
																			onblur="removeValid(event)">
																	</div>
																</div>

																<!-- Attach -->
																<div class="col-md-4" id="attachWar">
																	<div class="form-group">
																		<label for="uploadWarDoc_0" class="form-label">Attachment</label>
																		<div class="control-group position-r">
																			<label class="custom-file-upload btn go-btn h-auto mr-2" for="uploadWarDoc_0">
																				<i class="ti-plus"></i>
																			</label>
																			<div class="controls">
																				<input type="file" class="wardocument"
																					id="uploadWarDoc_0"
																					accept=".jpeg, .jpg, .png, .pdf" name="userImage"
																					onchange="saveFile(event)">
																			</div>
																		</div>
																		<input type="hidden" id="uploadHidden_0"
																			class="uploadHidCls">
																		<div class="d-flex align-items-center gap-2 my-1">
																			<div id="uploadedWarrDiv_0" align="center"
																				class="uploadedWarrCls"></div>
																				
																			<div id="imageWarrName_0" class="imageName"
																				onClick="viewDoc(this)"></div>
																				
																			<div id="imageRemoveBtn_0" class="imageRemove img-remove"></div>
																				
																		</div>
																	</div>
																</div>


																<!--Leave Details End  -->
															</div>
														</div>
													</div>
													<!--Leave Details Section End -->
												</div>
												<div class="tab-pane fade h-100" id="approveDetails"
													role="tabpanel">
													<div class="card bg-white">
														<div class="card-header bg-white">
															<h5 class="sub-header-new" id="approveHeader">Approval
																Details</h5>
															<h5 class="sub-header-new" id="rejectHeader">Reject
																Details</h5>
														</div>
														<div class="card-body">
															<div class="requisition-tbl table-responsive" id="datesOfLeaveTable">
																<table class="table table-borderless">
																	<thead>
																		<tr class="bg-light">
																			<th scope="col" width="10%"><input
																				type="checkbox" id="apprvAllCheckBox"
																				class="apprvAllCheck" style="cursor: pointer"
																				onchange="selectAllCheck()"></th>
																			<th scope="col" width="30%">Date</th>
																			<th scope="col" width="30%">Day</th>
																			<th scope="col" width="30%">Type</th>
																		</tr>
																	</thead>
																	<tbody id="datesOfLeaveDiv">
																		<!-- Rows dynamically populated -->
																	</tbody>
																</table>
															</div>
															<div class="row mt-4">
																<div class="col-md-12">
																	<div class="form-group">
																		<label for="comment">Comment</label> <textarea
																			class="form-control h-auto" type="text" autocomplete="off" rows="3"
																			id="comment"></textarea>
																	</div>
																</div>
															</div>
														</div>
														<div class="card-footer bg-white"></div>
													</div>
												</div>
												<div class="tab-pane fade h-100" id="approvedLeave" role="tabpanel">
                          <div class="grid-parent-container h-100">
                            <div class="grid-container">
                              <div id="myGridLeaveList" class="ag-theme-alpine grid-size">
                              </div>
                            </div>
                          </div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
