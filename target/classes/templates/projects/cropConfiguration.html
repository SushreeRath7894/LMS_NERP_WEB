function saveCrop() {
    obj = {};

    var validation = true;

    if (obj.cropName == null || obj.cropName == "") {
        validation = validationUpdated("Crop Name Required",
            "cropName");
    }
    if (obj.cropDescription == null || obj.cropDescription == "") {
        validation = validationUpdated("Crop Desc Required",
            "cropDescription");
    }
    
    let cropId = $("#cropId").val();

    obj.cropId = cropId;
    obj.cropName = $("#cropName").val();
    obj.cropDescription = $("#cropDescription").val();

    var isChecked = $('#cropStatus').prop('checked');

    let checkedValue = '0';
    if (isChecked) {
        checkedValue = '1';
    } else {
        checkedValue = '0';
    }

    obj.cropStatus = checkedValue;

    if (validation) {
        console.log(JSON.stringify(obj), 'objgg');
        $.ajax({
            type: "POST",
            url: "project-configuration-save",
            contentType: "application/json",
            data: JSON.stringify(obj),
            success: function(response) {
                if (response.message == "Success") {

                    $("#messageParagraph").text("Data Saved Successfully");
                    $("#msgOkModal").removeClass("btn3");
                    $("#msgOkModal").addClass("btn1");
                    $("#msgModal").modal('show');
                    closeNav();
                    $('#deleteCrop').attr("disabled", true);
                    agGrid.simpleHttpRequest({
                        url: "project-configuration-view"
                    }).then(function(data) {
                        jsonData = JSON.parse(data.body);
                        console.log(jsonData)
                        var len = jsonData.length;
                        $('#totalReqs').find('span').html(len);
                        gridOptions.api.setRowData(jsonData);
                        
                        if(cropId == null || cropId == '' || cropId == undefined) {
                        	let rowCount = gridOptions.api.getDisplayedRowCount();
                            if (rowCount > 0) {
                                var lastRowNode = gridOptions.api.getDisplayedRowAtIndex(rowCount - 1);
                                gridOptions.api.selectNode(lastRowNode, true);
                            }
                        } else {
                        	let rowIndex = jsonData.findIndex(item => item.cropId === cropId);
                        	if (rowIndex > 0) {
                                var lastRowNode = gridOptions.api.getDisplayedRowAtIndex(rowIndex);
                                gridOptions.api.selectNode(lastRowNode, true);
                            }
                        }
                        
                        cancelBar();
                    });
                }
            },
            error: function(data) {}
        })
    }
}

function onSelectionChangeData() {
    var selected = gridOptions.api.getSelectedRows();

        $('#deleteCrop').attr('disabled', false);
        $('#newCropProcess').attr("disabled", false);
        $('#newCrop').attr("disabled", true);
    } else {
        $('#deleteCrop').attr('disabled', true);
        $('#newCropProcess').attr("disabled", true);
        $('#newCrop').attr("disabled", false);
    }

    id = "";

}

function cropprocessView(ccid){
	agGrid.simpleHttpRequest({
		url : "project-configuration-process-view?id="+ccid,
	}).then(function(data) {
		jsonDataa = JSON.parse(data.body);
		if(jsonDataa == null){
			gridOptions1.api.setRowData();
		}else{
			var len = jsonDataa.length;
			/* jsonDataa = jsonDataa.sort((e1, e2) =>
			  e1.activityId.toLowerCase().localeCompare(e2.activityId.toLowerCase())
			); */
			 jsonDataa = jsonDataa.sort((a, b) => {
				  if (a.catSlNo < b.catSlNo) return -1;
				  if (a.catSlNo > b.catSlNo) return 1;
				  
				  if (a.slNo < b.slNo) return -1;
				  if (a.slNo > b.slNo) return 1;
				  
				  return 0; 
				});
				let arr = [];
					let dataset = [];
					jsonDataa.forEach(e => {
						if(!arr.includes(e.activityName)) {
							arr.push(e.activityName);
							/* let obj = {};
							obj.activityName = e.activityName;
							obj.taskName = ''; */
						//	obj.amount = e.totalamount;
							
							dataset.push(e);
						} else {
							e.activityName = '';
							dataset.push(e);
						}
					});
					//dataset.push(new Object({"activityName":allData[0].activityName}))
					console.log(dataset)
					
				$('#totalReqss').find('span').html(len);
				gridOptions1.api.setRowData(dataset);
		
		
		}
	});
}

function getSubTaskDetails(cactivityId, ctaskId) {
	if (cactivityId) {
		$.ajax({
			type : "GET",
			url : "project-configuration-SubCategoryList?id="+ cactivityId,
			success : function(response) {
				
				if (response.message == "success") {
					
					$("#taskId").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#taskId").append(option);
					for (var i = 0; i < response.body.length; i++) {
						var option = $("<option></option>");
						$(option).val(response.body[i].key);
						$(option).html(response.body[i].name);
						$("#taskId").append(option);
					}
					$("#taskId").val(ctaskId);
				}
			}
		})
	} else {
	$("#item").empty();
	$("#item").append("<option value=''>Select</option>");
	}

	}

									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput" 
										oninput="onQuickFilterChanged1()" id="quickFilter1"
										autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey"
											onclick="gridOptions1.api.setQuickFilter(null);$('#quickFilter1').val('');document.getElementById('closeKey').style.display='none';"
											class="close_i"><i class="ti-close srchicon"></i></span></a><a
											href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
									</div>
								</div>
							</div>
							<div class="col-md-4 buttonsec btn-hs" id="ttbtn">

								<button class="new-btn" id="newCropProcess"
									onclick="newCropProcess()">NEW</button>
								<button class="btn3" id="deleteCropProcess"
									onclick="deleteCropProcess()">Delete</button>
							</div>

							<div id="myGrid1" style="width: 100%; height: 250px;"
								class="ag-theme-alpine"></div>

						</div>
						
						 
						
						 <div id="mySidenav1" class="sidenav">
							<div class="slidebox">
								<div class="row">
									<div class="col-md-10 edit"></div>
									<div class="col-md-2">
										<div class="arrow">
											<a><i class="ti-arrow-right" onclick="closeNav1()"></i></a>
										</div>
									</div>
								</div>
								<div style="clear: both;"></div>
								<div class="chartbtnsec">
									<div align="right">
										<button class="btn3" onclick="closeNav1()">CANCEL</button>
										<button class="btn1" id="saveCropProcess"
											onclick="saveCropProcess()">SAVE</button>

									</div>

								</div>
								<div class="clearfix"></div>
								<div class="row">

									 <div class="col-md-12">
										<div class="form-group">
											<span class="slide-span">Process Id:</span><span
												id="cropIdspan" class="slide-span-text"></span>

										</div>
									</div>
									<input type = "hidden" id = "cropProcessId">
									<div class="col-md-12">
										<div class="form-group mb-10">
											<label>Activity</label>

											<div class="select">
												<select class="" id="activityId" onchange="subCat()"
													onblur="removeValid(event);">
													<option th:value="NULL">Select</option>
													<option th:each="c,iter:${budgetCategoryList}"
														th:value="${c.key}" th:text="${c.name}"></option>
												</select>
											</div>
										</div>
									</div>

									<div class="col-md-12">
										<div class="form-group mb-10">
											<label>Task</label>

											<div class="select">
												<select class="" id="taskId"
													onblur="removeValid(event);">
													<option th:each="c,iter:${budgetSubCategoryList}"
														th:value="${c.key}" th:text="${c.name}"></option>
												</select>
											</div>
										</div>
									</div>
									
									
									<div class="col-md-12">
										<div class="form-group mb-10">
											<label>Quantity</label> 
											
											<input type="text" id="qty"
												class="form-control">
										</div>
									</div>
									 <div class="col-md-6">
										<div class="form-group mb-10">
											<label>Unit</label> 
											
											<div class="select">
												<select class="" id="unitId">
													<option value="">Select</option>
													<option th:each="c,iter:${unitList}"
														th:value="${c.key}" th:text="${c.name}"></option>
												</select>
											</div>
										</div>
									</div>
									
									<div class="col-md-6">
										<div class="form-group mb-10">
											<label>Amount</label> <input type="text" id="amount"
												class="form-control">
										</div>
									</div>

									<div class="col-md-6">
										<div class="form-group mb-10">
											<label>Duration(Days)</label> <input type="text" id="duration"
												class="form-control">
										</div>
									</div>
									<div class="col-md-12">
											<div class="form-group">
												<label>Description</label>
												<textarea name="Description" id="cropProcessDescription"
													class="form-control"></textarea>
											</div>
									</div>
								</div>
							</div>
						</div>

					</div>
				</div>
				<div id="deleteCropModal" class="modal fade show"
					aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column">
								 <button type="button" class="close" data-dismiss="modal"
									aria-hidden="true" onclick="cancelModalBtn()">
									 <i class="ti-close modal-close"></i> 
								</button>
							</div>
							<div class="modal-body">
								<p>Do you really want to delete these records? This process
									cannot be undone.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: -15px;">

								<button type="button" class="btn4" id="modalCan"
									data-bs-dismiss="modal">cancel</button>
								<button type="button" class="delete-btn"
									onclick="deleteOnclick()">Delete</button>
							</div>
						</div>
					</div>
				</div>
				
				 <div id="deleteCropProcessModal" class="modal fade show"
					aria-modal="true">
					<div class="modal-dialog modal-confirm">
						<div class="modal-content">
							<div class="modal-header flex-column">
						<button type="button" class="close" data-dismiss="modal"
									aria-hidden="true" onclick="cancelSubModalBtn()">
									 <i class="ti-close modal-close"></i> 
								</button>
							</div>
							<div class="modal-body">
								<p>Do you really want to delete these records? This process
									cannot be undone.</p>
							</div>
							<div class="modal-footer justify-content-center"
								style="margin-top: -15px;">

								<button type="button" class="btn4" id="modalCan"
									data-bs-dismiss="modal">cancel</button>
								<button type="button" class="delete-btn"
									onclick="deleteSubOnclick()">Delete</button>
							</div>
						</div>
					</div>
				</div> 
				
			</div>
		</div>
	</div>
</body>
</html>
