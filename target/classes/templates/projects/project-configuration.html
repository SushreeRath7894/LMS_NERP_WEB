<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}">


<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .reset-btn {
      background-color: #e4e4e4 !important;
      color: #000 !important;
      border-color: #e4e4e4 !important;
      margin-left: 2px;
    }

    .mandatory {
      color: red;
      font-weight: bold;
    }

    .mr-tp {
      margin-top: 20px;
    }

    .swal2-popup .swal2-title {
      font-size: 15px !important;
      font-weight: 500 !important;
    }

    .swal2-popup .swal2-styled.swal2-confirm {
      border: 0;
      border-radius: .25em;
      background: initial;
      background-color: #3085d6;
      color: #fff;
      font-size: 13px !important;
    }

    .swal2-popup .swal2-styled.swal2-cancel {
      border: 0;
      border-radius: .25em;
      background: initial;
      background-color: #aaa;
      color: #fff;
      font-size: 13px !important;
    }

    .swal2-popup #swal2-content {
      text-align: center;
      font-size: 13px;
    }

    .top-expand-sec {
      position: relative;
    }

    @media ( max-width: 769px) {
      .top-expand-sec {
        display: none !important;
      }
    }

    .ag-theme-alpine .ag-ltr .ag-cell a {
      font-weight: 600 !important;
      text-decoration: none !important;
      color: #000 !important;
    }
  </style>
  <script type="text/javascript" src="/javaScript/project/projectConfig.js"></script>
</head>

<body>

<div layout:fragment="content" class="maincontent">
  <div class="container-fluid requisition">

    <div class="tab-content">

      <div id="ambulance" class="tab-pane active">
        <div class="d-flex flex-column flex-lg-row">

          <!--Left Sec Start-->
          <div class="box-sec" id="collapseWidthR1">
            <div class="out-box">
              <div class="d-flex flex-column h-100 gap-2">
                <div class="d-flex justify-content-between border-bottom p-2 top-expand-sec">
                  <div class="col-md-8 col-12">
                    <div class="d-flex gap-2 search-sec">
                      <input class="form-control search_input_bar" placeholder="Search..." type="text" name="search" id="quickFilter" autocomplete="off">
                      <button class="btn go-btn" id="SearchBtn" type="button">Go</button>
                      <button class="btn go-btn" type="reset">Reset</button>
                    </div>
                  </div>
                  <button class="btn btn-primary max-btn" id="collapseButtonR1" onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                    <i class="fa-solid fa-maximize" id="expandIconR1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                  </button>
                </div>
                <div class="card p-2 m-2 mt-0">
                  <div id="myGrid" style="height: 100vh;" class="ag-theme-alpine"></div>
                </div>
              </div>
            </div>
          </div>
          <!--Left Sec End-->

          <!--Right Sec Start-->
          <div class="box-sec" id="collapseWidthL1">
            <div class="out-box">
              <div class="d-flex justify-content-between align-items-center p-2 border-bottom top-expand-sec">
                <div class="">
                  <ul class="nav nav-pills newtab" role="tablist" style="margin-left: 0px !important" id="masterSection">
                    <li class="nav-item">
                      <a class="nav-link active" data-bs-toggle="pill" href="#configurationTab">Process</a>
                    </li>
                  </ul>
                </div>
                <button class="btn btn-primary max-btn" id="collapseButtonL1" type="button" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                  <i class="fa-solid fa-maximize" id="expandIconL1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                </button>
              </div>

              <div class="tab-content flex-fill">
                <div id="configurationTab" class="tab-pane fade show active p-2 h-100">
                  <div class="d-flex flex-column gap-2 h-100">
                    <div class="d-flex border rounded">
                      <table class="table mb-0" width="100%">
                        <tr valign="middle">
                          <td width="50%" class="border-0 p-2"></td>
                          <td class="border-0 p-2">
                            <div class="d-flex gap-1 task-btn-sec justify-content-end">
                              <button class="btn go-btn" title="Add" onclick="toggleSection()">
                                <i class="fa fa-plus-square" aria-hidden="true"></i>
                              </button>
                              <button class="btn go-btn br-dis br-m-btn" title="Delete" disabled onclick="deleteCropProcess()">
                                <i class="fa fa-trash"></i>
                              </button>
                              <button class="btn btn-primary edit-btn br-s-btn" type="button" onclick="saveCropProcess()">Save</button>
                              <button class="btn btn-primary edit-btn br-s-btn" type="button" onclick="cancel()">Cancel</button>
                            </div>
                          </td>
                        </tr>
                      </table>
                    </div>
                    <div class="card p-2">
                      <div class="row h-100" id="viewProcessDiv">
                        <div id="myGrid1" style="width: 100%; height: auto;"
                             class="ag-theme-alpine"></div>
                      </div>
                      <div class="row" id="createProcessDiv">
                        <div class="col-md-4">
                          <div class="form-group">
                            <label>Category <span class="mandatory">*</span></label>
                            <div class="select">
                              <select class="" id="activityId" onchange="subCat()"
                                      onblur="removeValid(event);">
                                <option value="">Select</option>
                                <option th:each="c,iter:${budgetCategoryList}"
                                        th:value="${c.key}" th:text="${c.name}"></option>
                              </select>
                              <input type="hidden" id="cropProcessId">
                              <input type="hidden" id="cropId">
                            </div>
                          </div>
                        </div>
                        <div class="col-md-4">
                          <div class="form-group">
                            <label>Sub-Category <span class="mandatory">*</span></label>
                            <div class="select">
                              <select class="" id="taskId" onblur="removeValid(event);" onchange="getVariant()">
                                <option value="">Select</option>
                              </select>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-4">
                          <div class="form-group">
                            <label>Variant <span class="mandatory">*</span></label>
                            <div class="select">
                              <select class="" id="variantId"
                                      onblur="removeValid(event);">
                                <option value="">Select</option>
                              </select>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-12">
                          <div class="form-group">
                            <label>Description</label>
                            <textarea class="form-control" id="processDescription"></textarea>
                          </div>
                        </div>
                      </div>
                      <!-- <div class="row">
                        <div class="col-md-6">
                          <div class="form-group">
                            <label>Category <span class="mandatory">*</span></label> <div class="select">
                                  <select class="" id="activityId" onchange="subCat()"
                                    onblur="removeValid(event);">
                                    <option th:value="NULL">Select</option>
                                    <option th:each="c,iter:${budgetCategoryList}"
                                      th:value="${c.key}" th:text="${c.name}"></option>
                                  </select>
                                </div>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="form-group">
                            <label>Status <span class="mandatory">*</span></label>
                            <div class="select">
                              <select id="cropStatus" class="form-control">
                                <option value="">Select</option>
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                              </select>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-12">
                          <div class="form-group">
                            <label>Description</label>
                            <textarea class="form-control" id="cropDescription"></textarea>
                          </div>
                        </div>
                      </div> -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>

</html>
