<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<link rel="stylesheet" href="../css/project/project-planning-new.css">
<script type="text/javascript"
	src="../javaScript/project/project-planning-new.js"></script>

</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition mt-3 mb-3">

			<!-- Tab panes -->
			<div class="tab-content">

				<!--Tabbination 1 Start-->
				<div id="ipd" class="tab-pane active mt-5">
					<div class="row">

												class="searchboxinput" onkeyup="cancelBar()"
												oninput="onQuickFilterChanged1()" id="quickFilter1"
												autocomplete="off">
											<div class="searchicon">
												<a href="javascript:void(0)"><span
													style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
													id="closeKey"
													onclick="gridOptions1.api.setQuickFilter(null);$('#quickFilter1').val('');document.getElementById('closeKey').style.display='none';"
													class="close_i"><i class="ti-close srchicon"></i></span></a><a
													href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
											</div>
										</div>

										<div class="col-md-2 d-flex justify-content-end">
											<div class="btn btn-primary max-btn">
												<!-- <i class="fas fa-arrow-up"></i>-->
												<i class="fas fa-arrows-alt"></i>
											</div>
										</div>

									</div>


									<div class="requisition-tbl table-responsive">
										<div id="myGrid1" style="height: 500px;"
											class="ag-theme-alpine"></div>

									</div>
								</div>
							</div>
						</div>

						<!--Left Sec End-->



						<!--Right Sec Start-->
						<div class="col-md-6 pd-l">
							<div class="out-box">

								<div class="btn btn-primary max-btn">
									<!-- <i class="fas fa-arrow-up"></i>-->
									<i class="fas fa-arrows-alt"></i>
								</div>



								<!--Right Inner Tab Start-->
								<ul class="nav nav-pills newtab mb-20" role="tablist">
									<li class="nav-item wd-11" role="presentation"><a
										class="nav-link active" data-bs-toggle="pill" href="#basic"
										aria-selected="true" role="tab">Project Planning</a></li>


								</ul>

								<div class="tab-content"
									style="height: 500px; overflow-y: scroll;">
									<div id="basic" class="tab-pane active">
										<div class="mb-2">
											<input type="hidden" id="pID">
											<table class="table  mb-0" width="100%">
												<tr valign="middle">
													<td width="50%"></td>

													<td>
														<div class="d-flex justify-content-end gap-2">

															<div class="">
																<button class="btn edit-btn" id="cancel"
																	onclick="cancel()">Cancel</button>

															</div>



															<div class="">
																<button class="btn edit-btn" id="saveExecutionPlanAll"
																	onclick="saveExecutionPlanAll()">SAVE</button>

															</div>

															<div class="">
																<button class="btn edit-btn" id="save1"
																	onclick="saveNav()">SAVE</button>

															</div>






														</div>

													</td>
												</tr>
											</table>
										</div>


										<input type="hidden" id="planningid" /> <input type="hidden"
											id="plnIds" />
										<div style="margin-top: 20px;">

													<input type="hidden" id="hiddenYear"> <input

													<table id="basic" width="1400" border="1"
														class="table-bordered">
														<thead id="theadData">
															<th class="firstnode">Task Name</th>
															<th width="100">Priority</th>
															<th>Project Name</th>
															<th>Start Date</th>
															<th>End Date</th>
															<th>Assigned To</th>
															<!-- <th>Days</th> -->
															<th>Duration</th>
															<th>Estimate Cost</th>
															<th>Preceders</th>
															<!-- <th>Area(acre)</th> -->
															<th>Notes</th>
															<th>Created By</th>
															<th>Status</th>

														</thead>
														<tbody id="tbodyData12">
														</tbody>
													</table>
												</div>
											</div>

										</div>
										<div class="row" id="mySidenavAll">

														type="hidden" id="catIdMain"> <input type="hidden"

												<span id="totalCropMain" class="slide-span-text"></span> -->

												</div>
											</div>


											<div class="col-lg-4">
												<div class="form-group">
													<label>Phase/Task Name</label> <input type="text"
														class="form-control" autocomplete="off" id="phaseMain"
														onblur="removeValid(event)">
												</div>
											</div>




											<div class="col-lg-4">
												<div class="form-group calendar_box">
													<label>Start Date</label> <input type="text"
														id="startDateMain" class="form-control"
														onblur="removeValid(event)"
														th:attr="onkeyup=|formatDate('startDateMain','${session.DATEFORMAT_JS}')|"
														readonly> <i class="ti-calendar picker_calendar"
														id="DateCalendarMain" onchange="calculateDuration()"></i>
												</div>
											</div>

											<div class="col-lg-4">
												<div class="form-group calendar_box">
													<label>End Date</label> <input type="text" id="endDateMain"
														class="form-control" onblur="removeValid(event)"
														th:attr="onkeyup=|formatDate('endDateMain','${session.DATEFORMAT_JS}')|"

														id="EndDateCalendarMain"></i> <span id="error9"
														class="formValidation"></span>
												</div>
											</div>

											<div class="row">

													<div class="form-group">
														<label>Assigned To</label> <input type="hidden"

													</div>

												<div class="col-lg-4">

															id="durationMain"> <input type="text"
															class="form-control transparenttxtbox" id="hoursplan"
															onblur="removeValid(event)" disabled="disabled">
													</div>
												</div>

												<div class="col-lg-4">
													<div class="form-group">
														<label>Quantity</label> <input type="text"
															class="form-control transparenttxtbox" id="quantityMain"
															onblur="removeValid(event)" onkeyup="calculationAmnt()">
													</div>
												</div>

											</div>
											<div class="row">
												<div class="col-lg-4">
													<div class="form-group">
														<label>Rate</label> <input type="text"
															class="form-control transparenttxtbox" id="rateMain"
															onblur="removeValid(event)" onkeyup="calculationAmnt()">
													</div>
												</div>

												<div class="col-lg-4">
													<div class="form-group">
														<label>Total price</label> <input type="text"
															class="form-control transparenttxtbox"
															id="totalPriceMain" onblur="removeValid(event)" readonly>
													</div>
												</div>



												<div class="col-lg-4">
													<div class="form-group">
														<div class="autocomplete w-100">

														<div id="suggesstion-box11_" class="sugg-cls"></div>
													</div>
												</div>


											</div>
											<div class="row">
												<div class="col-md-4">
													<div class="form-group">
														<label>Priority</label>

														<div class="select">
															<select class="" id="priorityMain"
																onblur="removeValid(event);">
																<option th:value="NULL">Select</option>
																<option th:each="c,iter:${projectPriorityList}"
																	th:value="${c.key}" th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>

												<div class="col-md-4">
													<div class="form-group mb-10">
														<label>Unit</label>
														<div class="select">
															<select id="unitMain" onblur="removeValid(event)">
																<option value="">Select</option>
																<option th:each="c,iter:${unitList}" th:value="${c.key}"
																	th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>





												<div class="col-md-4">
													<div class="form-group">
														<label>Status</label>

														<div class="select">
															<select class="" id="statusMain"
																onblur="removeValid(event);" disabled="disabled">
																<option th:value="NULL">Select</option>
																<option th:each="c,iter:${planningStatusList}"
																	th:value="${c.key}" th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>
											</div>


											<div class="col-lg-12">
												<div class="form-group">
													<label>Notes</label>
													<textarea class="form-control" id="notesMain"
														onblur="removeValid(event)"></textarea>
												</div>
											</div>


										</div>

										<div class="row" id="mySidenav">
											<div class="col-md-12">
												<div class="form-group">

													<span class="slide-span">Parent:</span><span
														id="subCatParentSpan" class="slide-span-text"></span>
													<!-- <span class="slide-span">Total Area(Acer):</span><span
												id="totalCropSpanChild" class="slide-span-text"></span> -->
													<input type="hidden" id="subCatParentSpanId"> <input
														type="hidden" id="projectIdnav"> <input
														type="hidden" id="subCatId"> <input type="hidden"
														id="executionId"> <input type="hidden"
														id="slnoval"> <input type="hidden"
														id="subCatgoryNameSpanId"> <input type="hidden"
														id="stDateMain"> <input type="hidden"
														id="edDateMain">

												</div>
											</div>



											<div class="col-md-4">
												<div class="form-group">
													<label>Phase/Task Name</label> <input type="text"

														onblur="removeValid(event)">
												</div>
											</div>

											<div class="col-md-4">
												<div class="form-group calendar_box">
													<label>Start Date</label> <input type="text"
														id="startDateC" class="form-control"
														onblur="removeValid(event)"
														th:attr="onkeyup=|formatDate('date','${session.DATEFORMAT_JS}')|"
														readonly> <i class="ti-calendar picker_calendar"
														id="DateCalendarC" onchange="calculateDurationC()"></i> <span
														id="error11" class="formValidation"></span>
												</div>
											</div>

											<div class="col-md-4">
												<div class="form-group calendar_box">
													<label>End Date</label> <input type="text" id="endDateC"
														class="form-control" onblur="removeValid(event)"
														th:attr="onkeyup=|formatDate('date','${session.DATEFORMAT_JS}')|"
														readonly> <i class="ti-calendar picker_calendar"
														id="EndDateCalendarC"></i> <span id="error10"
														class="formValidation"></span>
												</div>
											</div>

											<div class="row">
												<div class="col-md-4">
													<div class="form-group">
														<label>Assigned To</label> <input type="hidden"
															id="assignedToC" class="form-control"> <input
															type="text" id="ATnameMain" class="form-control"
															onkeyup='getAssignedToMainAutoSearch()'>
														<div id="suggesstion-box3" class="sugg-cls"></div>
													</div>
												</div>

												<div class="col-md-4">

															id="durationC"> <input type="text"

												</div>



												<div class="col-md-4">
													<div class="form-group">
														<label>Quantity</label> <input type="text"
															class="form-control transparenttxtbox" id="quantityC"
															onblur="removeValid(event)" onkeyup="calculationAmntC()">
													</div>
												</div>
											</div>

											<div class="row">
												<div class="col-md-4">
													<div class="form-group">
														<label>Rate</label> <input type="text"
															class="form-control transparenttxtbox" id="rateC"
															onblur="removeValid(event)" onkeyup="calculationAmntC()">

												</div>

												<div class="col-md-4">
													<div class="form-group">

															class="form-control transparenttxtbox" id="totalPriceC"
															onblur="removeValid(event)" readonly>

												</div>

												<div class="col-md-4">
													<div class="form-group">
														<div class="autocomplete w-100">
															<label>Preceders</label> <input type="hidden"

														<div id="suggesstion-box1_" class="sugg-cls"></div>
													</div>
												</div>
											</div>
											<div class="row">
												<div class="col-md-4">
													<div class="form-group">
														<label>Priority</label>

														<div class="select">
															<select class="" id="priorityC"
																onblur="removeValid(event);">
																<option th:value="NULL">Select</option>
																<option th:each="c,iter:${projectPriorityList}"
																	th:value="${c.key}" th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>

												<div class="col-md-4">
													<div class="form-group mb-10">
														<label>Unit</label>
														<div class="select">
															<select id="unitC" onblur="removeValid(event)">
																<option value="">Select</option>
																<option th:each="c,iter:${unitList}" th:value="${c.key}"
																	th:text="${c.name}"></option>
															</select>
														</div>
													</div>
												</div>

												<div class="col-md-4">
													<div class="form-group">

																<option th:each="c,iter:${planningStatusList}"

													<label>Notes</label>
													<textarea class="form-control" id="notesC"

										</div>

							</div>
						</div>




					</div>
				</div>
