	function calculateTotal() {
		var qty = parseFloat($("#qty").val()) || 0;
		var rate = parseFloat($("#rate").val()) || 0;
		var extra = parseFloat($("#actual").val()) || 0;
		var nos = parseFloat($("#nos").val()) || 1;
		var mob = parseFloat($("#mob").val()) || 0;
		
		// Check if extra is null or an empty string
		if (isNaN(extra) || isNaN(mob) || isNaN(nos)) {
		$("#actual").val('0');
		$("#mob").val('0');
		$("#nos").val('1');
		extra = 0;
		mob = 0;
		nos = 1;
		}
		
		var totalAmt = qty * rate * nos + extra + mob;
	
		$("#amount").val(totalAmt.toFixed(2));
		$("#projected").val(totalAmt.toFixed(2));
		}

		function callBudgetData(bIdd){
			agGrid.simpleHttpRequest({
				url : "jobcard-view?id="+bIdd
				}).then(function(data) {
					
					var jsonData = JSON.parse(data.body[0]);
					console.log('budget',jsonData);
					var allData = jsonData.viewBudgetData;
					
					
					if (jsonData.viewBudgetData === null) {
						  console.log("Budget is null");
						  let myArray = Array.isArray(jsonData) ? jsonData : [];
						  if(myArray == null || myArray.length === 0){
								$('.loader').hide();
								$("body").removeClass("overlay");
								gridOptions.api.setRowData();
								$("#totalCandidates").find('span').html(0);
							}
						} else {
							var len = allData.length;
							$("#totalCandidates").find('span').html(len);
							allData = allData.sort((e1, e2) =>
							  e1.budgetCategory.toLowerCase().localeCompare(e2.budgetCategory.toLowerCase())
							);
							let arr = [];
								let dataset = [];
								allData.forEach(e => {
									if(!arr.includes(e.budgetCategory)) {
										arr.push(e.budgetCategory);
										let obj = {};
										obj.budgetCategory = e.budgetCategory;
										obj.amount = e.totalamount;
										
										dataset.push(obj);
									}
									e.budgetCategory = '';
									dataset.push(e);
								});
								dataset.push(new Object({"budgetCategory":"Total","amount":allData[0].budgetTotalAmnt}))
								console.log(dataset)
								
				
							gridOptions.api.setRowData(dataset);
							$('.loader').hide();
							$("body").removeClass("overlay");
						}
					
						
					
				});
		}

	function getstate(budgetCategory, item) {
	if (budgetCategory) {
	$.ajax({
				type : "GET",
				url : "jobcard-SubCategoryList?id="+ budgetCategory,
				dataType : 'json',
				contentType : 'application/json',
				data : budgetCategory,
				success : function(response)
				{
					if (response.message == "success") {
						$("#item").empty();
						$("#item").append(
								"<option value=''>Select</option>");
	
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#item").append(option);
						}
						$("#item").val(item);
					}
				},
				error : function(data) {
					console.log(data);
					$("#item").empty();
					$("#item").append(
							"<option value=''>Select</option>");
				}
			})
	} else {
	$("#item").empty();
	$("#item").append("<option value=''>Select</option>");
	}
	
	}

	            	//$("#expenseId").empty();

					 allData.forEach(function(rowNode){

				var dataprj = $("#projectId1").val();
				callBudgetData(dataprj);
	
			}
		}
	
	});
	
	$('#delete').attr("disabled", true);
	$("#deleteModal").modal('hide');
	}
	
	
	function downloadData() {
		var dataset = [];
		gridOptions.api
					.forEachNodeAfterFilterAndSort(function(rowNode, index) {
						dataset.push(rowNode.data);
	
					});
		gridOptions.api.exportDataAsCsv(dataset);
	}
	

	function sink(){
		var selectedRowString = $("#projectId1").val();
		$.ajax({
			type : "GET",
			url : "jobcard-sink?id=" + selectedRowString,
			success : function(response) {
				if (response.message == "Success") {
					$("#messageParagraph").text("Data Fetched Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					callBudgetData(selectedRowString);
		
				}
			}
		
		});
	}
	
	</script>
