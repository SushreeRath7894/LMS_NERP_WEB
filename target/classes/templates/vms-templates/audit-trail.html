<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}">
<head>


  <link rel="stylesheet" href="../assets/css/vms/tender-management.css" />
  <link rel="stylesheet" href="/assets/css/vms/auditTrail.css" />

  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
  <script type="text/javascript" src="../javaScript/vms/auditTrail.js"></script>

  <script
       src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
  <script
       src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
       defer></script>


</head>
<body>
<div layout:fragment="content" class="maincontent">
  <div class="container-fluid">
    <div class="d-flex">
      <div class="maincontentsec">
        <div class="tab-content">

          <!--Tabbination 1 Start-->
          <div id="opd" class="tab-pane active">
            <div class="d-flex flex-column flex-lg-row">

              <!--Left Sec Start-->
              <div class="box-sec" id="collapseWidthR1">
                <div class="out-box">
                  <div class="d-flex justify-content-between p-2 border-bottom">

                    <div class="col-md-8 col-12">
                      <form class="d-flex search-sec flxwrap">
                        <input class="form-control me-2 search_input_bar"
                               placeholder="Search.." type="text" name="search"
                               id="quickFilter" autocomplete="off">
                        <button class="btn btn-primary go-btn"
                                onclick="onQuickFilterChanged()" id="SearchBtn"
                                type="button">Go</button>
                        <button class="btn go-btn w-auto mx-2" type="button"
                                onclick="resetBtn()">Reset</button>
                      </form>
                    </div>

                    <div class="col-md-2 d-flex justify-content-end gap-2">
                      <button alt="Maximize" class="btn btn-primary max-btn" id="collapseButtonR1" onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                        <i class="fa-solid fa-maximize" id="expandIconR1"></i>
                        <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                      </button>
                    </div>

                  </div>

                  <div class="card m-2 p-2">
                    <div class="leftSideParentContainer">
                      <div class="d-flex justify-content-between align-items-center flex-wrap" id="tdiv">

                        <div class="col">
                          <div class="row row-cols-1 row-cols-lg-4 g-3">
                            <div class="col">
                              <div class="row row-cols-1 g-3">
                                <div class="col"><label for="auditTypeId" class="form-label">Select Audit</label></div>
                                <div class="col my-1">
                                  <div class="select">
                                    <select id="auditTypeId" class="month-dropdown" style="height: unset;" onchange="getAuditTypeData();">
                                      <option value="">-SELECT-</option>
                                      <option th:each="c,iter:${auditTypeList}" th:value="${c.key}" th:text="${c.name}"></option>
                                    </select>
                                  </div>
                                </div>
                              </div>
                            </div>
                            <div class="col">
                              <div class="form-group" id="fdateDiv">
                                <label for="fromDate">From Date</label>
                                <div class="calendar_box position-relative">
                                  <input type="text" id="fromDate" placeholder="From Date" class="form-control" readonly>
                                  <i class="ti-calendar picker_calendar" id="fromDateCalendar"></i>
                                </div>
                              </div>
                            </div>
                            <div class="col">
                              <div class="form-group" id="todateDiv">
                                <label for="toDate">To Date</label>
                                <div class="calendar_box position-relative">
                                  <input type="text" id="toDate" placeholder="To Date" class="form-control" readonly>
                                  <i class="ti-calendar picker_calendar" id="toDateCalendar"></i>
                                </div>
                              </div>
                            </div>
                            <div class="col m-0 text-end align-content-center">
                              <button type="button" id="filter" class="btn go-btn w-auto px-2" onclick="viewFilteredData()">Search</button>
                            </div>
                          </div>
                        </div>

                        <!--<div class="d-flex gap-1">
                          <label for="auditTypeId" class="form-label">Select Audit</label>
                          <div class="select">
                            <select id="auditTypeId" class="month-dropdown" style="height: unset;" onchange="getAuditTypeData();">
                              <option value="">-SELECT-</option>
                              <option th:each="c,iter:${auditTypeList}" th:value="${c.key}" th:text="${c.name}"></option>
                            </select>
                          </div>
                        </div>


                        <div class="form-group" id="fdateDiv">
                          <label for="fromDate">From Date</label>
                          <div class="calendar_box position-relative">
                            <input type="text" id="fromDate" placeholder="From Date" class="form-control" readonly>
                            <i class="ti-calendar picker_calendar" id="fromDateCalendar"></i>
                          </div>
                        </div>

                        <div class="form-group" id="todateDiv">
                          <label for="toDate">To Date</label>
                          <div class="calendar_box position-relative">
                            <input type="text" id="toDate" placeholder="To Date" class="form-control" readonly>
                            <i class="ti-calendar picker_calendar" id="toDateCalendar"></i>
                          </div>
                        </div>

                        <div>
                          <button type="button" id="filter" value="Search" class="btn go-btn w-auto px-2" onclick="viewFilteredData()">
                        </div>-->
                      </div>
                      <div id="myGrid" style="width: 100%; height: 500px;"
                           class="ag-theme-alpine"></div>
                    </div>
                    <input type="hidden" id="userId" th:value="${session.USER_ID}" />
                    <input type="hidden" id="docUniqueId" />
                  </div>
                </div>
              </div>

              <div id="snackbar" class="snackbar"></div>

              <!--Right Sec Start-->
              <div class="box-sec" id="collapseWidthL1">
                <div class="out-box" id="rightSideDiv">
                  <div class="d-flex flex-column gap-2 h-100">
                    <div class="d-flex justify-content-between align-items-center p-2 border-bottom">
                      <!-- Right Inner Tab Start -->
                      <ul class="nav nav-pills newtab tablistUl navbarSticky" role="tablist">
                        <li class="nav-item wd-11"><a class="nav-link active" data-bs-toggle="pill" id="manageTab" href="#manageControl">Audit Details</a></li>
                      </ul>
                      <button alt="Maximize" class="btn btn-primary max-btn" id="collapseButtonL1" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                        <i class="fa-solid fa-maximize" id="expandIconL1"></i>
                        <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                      </button>
                    </div>
                    <!-- Tab panes -->
                    <div class="tab-content flex-fill">

                      <div id="manageControl" class="tab-pane fade show active h-100 operational-tabs">
                        <div class="d-flex flex-column h-100">
                          <div class="requisition-tbl">
                            <div class="operationBtnSticky mx-2">
                              <table class="table table-bordered mb-0" width="100%">
                                <tr valign="middle" class="operation-row">
                                  <td width="50%"><strong>
                                    <div class="col-md-12 requisition_ids_text">
                                      <span id="header-text"></span> <span id="historyId"></span>
                                    </div></strong>
                                  </td>
                                  <td>
                                    <div class="d-flex justify-content-end"></div>
                                  </td>
                                </tr>
                              </table>
                            </div>
                          </div>
                          <div class="card p-2 m-2">
                            <div class="logs-header">
                              <h6 class="logs-title m-0" id="exampleModalLabel">Audit Logs...</h6>
                              <input type="hidden" id="tenderId">
                            </div>
                            <div class="auditTrail-content"></div>
                          </div>
                        </div>

                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
