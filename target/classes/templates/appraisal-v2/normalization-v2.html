<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}" lang="en">
<head>
<meta charset="UTF-8">
<title>NERP</title>
<script src="/javaScript/appraisal-v2/normalization-v2.js"></script>
<link rel="stylesheet" href="/css/appraisal-v2/normalization-v2.css">

<script src="https://code.highcharts.com/modules/histogram-bellcurve.js"></script>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<script src="https://code.highcharts.com/modules/export-data.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>
<script src="https://code.highcharts.com/modules/bellcurve.js"></script>

<style>

.highcharts-series-label text {
    fill: #ffffff !important;
}




</style>

</head>
<body>
	<section>
		<div layout:fragment="content" class="maincontent">
			<div class="container-fluid">
				<div class="d-flex">
					<div class="maincontentsec">
						<!--Tabbination 1 Start-->
						<div id="parent-tab" class="tab-pane" role="tabpanel">
							<div class="d-flex flex-column flex-lg-row">
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between border-bottom p-2">
										
										<div class="col-lg-3">
												<div class="form-group">
													<label>Financial Year</label>
													<div class="select">
														<select class="" id="financialYear"
															onblur="removeValid(event);" onchange="getAllDesignationGoal();">
															<option value="">Select</option>
														</select>
													</div>
												</div>
											</div>
											<div class="col-md-8 col-12">
												<!-- <div class="d-flex gap-2 search-sec">
													<input class="form-control" type="text"
														placeholder="Search" id="quickFilter1" autocomplete="off">
													<button class="btn go-btn" type="button" id="goBtn">Go</button>
													<button class="btn resetBtn" type="button" id="resetBtn">Reset</button>
												</div> -->
											</div>

											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" aria-label="Expand"
												data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
										<div class="card m-2 p-2">
											<div id="appraisalGrid" class="ag-theme-alpine"></div>
										</div>
									</div>
								</div>
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box">
										<div
											class="d-flex justify-content-between align-items-center p-2 border-bottom">
											<!--Right Inner Tab Start-->
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link active"
														data-bs-toggle="pill" data-bs-target="#graph-v2"
														aria-selected="true" role="tab" tabindex="-1">Graph</button>
												</li>
												
												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link"
														data-bs-toggle="pill" data-bs-target="#reports"
														aria-selected="true" role="tab" tabindex="-1">Reports</button>
												</li>
												
											</ul>

											<button class="btn btn-primary max-btn" id="collapseButtonL1"
												type="button" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												aria-label="Expand" data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>
										</div>
										<div class="tab-content flex-fill">
											<div class="tab-pane fade h-100 show active" id="graph-v2"
												role="tabpanel" aria-labelledby="graph-v2-tab">
												<div class="d-flex flex-column gap-2 h-100">
													<div class="card p-2">
														<div class="d-flex flex-column gap-2">
															<div id="bellCurve" style="height: 50vh; width: 100%;">
															</div>
														</div>

														<!-- Place this somewhere in your HTML where you want to show mean/std dev -->
														<div id="ratingStats"
															style="margin: 1rem 0; font-size: 14px;"></div>

													</div>
												</div>
											</div>
											
											
											
											<!--Reports tab starts from here  -->
											
											<div class="tab-pane fade h-100 fade " id="reports"
												role="tabpanel" aria-labelledby="reports">
												<div class="d-flex flex-column gap-2 h-100">
														<div class="card p-2 m-2">
															<div id="myGrid" style="height: 250px;"
																class="ag-theme-alpine mb-4"></div>
																
																	<div id="myGridEmp" style="height: 100vh;"
																class="ag-theme-alpine"></div>
														</div>

												</div>
											</div>
											
											<!--Reports tab ends here  -->
											
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
