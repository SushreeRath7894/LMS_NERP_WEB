<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}" lang="en">
<head>
  <meta charset="UTF-8">
  <title>NERP</title>
  <script src="/javaScript/appraisal-v2/configuration-v2.js"></script>
  <link rel="stylesheet" href="/css/appraisal-v2/configuration-v2.css">
</head>
<body>
<section>
  <div layout:fragment="content" class="maincontent">
    <div class="container-fluid">
      <div class="d-flex">
        <div class="maincontentsec">
          <!--Tabbination 1 Start-->
          <div id="parent-tab" class="tab-pane" role="tabpanel">
            <div class="d-flex flex-column flex-lg-row">
              <div class="box-sec" id="collapseWidthR1">
                <div class="out-box">
                  <div class="d-flex justify-content-between border-bottom p-2">
                    <div class="col-md-8 col-12">
                      <div class="d-flex gap-2 search-sec">
                        <input class="form-control" type="text" placeholder="Search" id="quickFilter1" autocomplete="off">
                        <button class="btn go-btn" type="button" id="goBtn">Go</button>
                        <button class="btn resetBtn" type="button" id="resetBtn">Reset</button>
                      </div>
                    </div>

                    <button class="btn btn-primary max-btn" id="collapseButtonR1" onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top" aria-label="Expand" data-bs-original-title="Expand">
                      <i class="fa-solid fa-maximize" id="expandIconR1"></i>
                      <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                    </button>
                  </div>
                  <div class="card m-2 p-2">
                    <div id="appraisalGrid" class="ag-theme-alpine"></div>
                  </div>
                </div>
              </div>
              <div class="box-sec" id="collapseWidthL1">
                <div class="out-box">

                  <div class="d-flex justify-content-between align-items-center p-2 border-bottom">
                    <!--Right Inner Tab Start-->
                    <ul class="nav nav-pills newtab" role="tablist">
                      <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link active" data-bs-toggle="pill" data-bs-target="#goal-v2" aria-selected="true" role="tab" tabindex="-1">Goals</button>
                      </li>
                      <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link" data-bs-toggle="pill" data-bs-target="#review-360-v2" aria-selected="false" role="tab">Competencies</button>
                      </li>
                    </ul>

                    <button class="btn btn-primary max-btn" id="collapseButtonL1" type="button" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" data-bs-placement="top" aria-label="Expand" data-bs-original-title="Expand">
                      <i class="fa-solid fa-maximize" id="expandIconL1"></i>
                      <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                    </button>
                  </div>
                  <div class="tab-content flex-fill">
                    <div class="tab-pane fade show active h-100" id="goal-v2" role="tabpanel" aria-labelledby="goal-v2-tab">
                      <div class="d-flex flex-column gap-2 p-2 h-100">
                        <div class="d-flex justify-content-end gap-2 border rounded p-2">
                          <button class="btn edit-btn m-0">Previous</button>
                          <button class="btn edit-btn m-0">Next</button>
                          
                        </div>
                        <div class="card p-2">
                          <div class="row row-cols-1 g-2">
                            <div class="col"><h6>Assign Goals</h6></div>
                            <div class="col">
                              <div class="row row-cols g-3 justify-content-center">
                                <div class="col-md-8 col-12">
                                  <div class="d-flex gap-2 search-sec">
                                    <input class="form-control" type="text" placeholder="Search" id="quickFilter2" autocomplete="off">
                                    <button class="btn go-btn" type="button" id="goBtn2">Go</button>
                                    <button class="btn resetBtn" type="button" id="resetBtn2">Reset</button>
                                  </div>
                                </div>
                                <div class="col text-end">
                                  <button class="btn resetBtn" type="button" id="saveGoalsButton">Save</button>
                                </div>
                              </div>
                            </div>
                            <div class="col">
                              <div id="addGoalsGrid" class="ag-theme-alpine"></div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="tab-pane fade h-100" id="review-360-v2" role="tabpanel" aria-labelledby="review-360-v2-tab">
                      <div class="d-flex flex-column gap-2 p-2 h-100">
                        <div class="card p-2">
                          <div class="d-flex flex-column gap-2">
                            <div class="d-flex justify-content-between align-items-center">
                              <h6 class="m-0">Title</h6>
                              <button class="btn go-btn" id="addMoreBtn" type="button">Add More</button>
                            </div>
                            <div class="col">
                              <div class="row row-cols-1 g-2">
                                <div class="col">
                                  <div class="row row-cols-3 g-3" id="goalContainer">
                                    <div class="col">
                                      <label class="form-label">Add Goal</label>
                                    </div>
                                    <div class="col text-center">
                                      <label class="form-label">Add Checkbox</label>
                                    </div>
                                    <div class="col text-center">
                                      <label class="form-label">Add Stars</label>
                                    </div>

                                    <!-- Template added here dynamically, as the page loads -->

                                  </div>
                                </div>
                                <div class="col">
                                  <div class="row row-cols-2 g-3">
                                    <div class="col">
                                      <label for="feedback1" class="form-label">Feedback 1</label>
                                    </div>
                                    <div class="col">
                                      <input type="text" class="form-control" id="feedback1">
                                    </div>
                                  </div>
                                </div>
                                <div class="col">
                                  <div class="row row-cols-2 g-3">
                                    <div class="col">
                                      <label for="feedback2" class="form-label">Feedback 2</label>
                                    </div>
                                    <div class="col">
                                      <input type="text" class="form-control" id="feedback2">
                                    </div>
                                  </div>
                                </div>
                                <div class="col">
                                  <div class="row row-cols-2 g-3">
                                    <div class="col">
                                      <label for="summary1" class="form-label">Summary</label>
                                    </div>
                                    <div class="col">
                                      <textarea name="summary" id="summary1" class="form-control" rows="3"></textarea>
                                    </div>
                                  </div>
                                </div>
                                <div class="col">
                                  <div class="row row-cols-2 g-3">
                                    <div class="col">
                                      <label for="summary2" class="form-label">Manager Recommendation</label>
                                    </div>
                                    <div class="col">
                                      <textarea name="summary" id="summary2" class="form-control" rows="3"></textarea>
                                    </div>
                                  </div>
                                </div>
                                <div class="col text-end">
                                  <button class="btn go-btn" id="addMoreBtn" type="submit">Submit</button>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
