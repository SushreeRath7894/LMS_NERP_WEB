<style>
#autocomplete-list {
	list-style-type: none;
	margin: 0;
	padding: 0;
	max-width: 300px;
	border: 1px solid #ccc;
	border-radius: 5px;
	overflow: hidden;
	box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
	max-height: 200px;
	overflow: hidden;
	overflow-y: auto;
}

.autocompletedata {
	padding: 5px 15px;
	font-size: 12px;
	font-weight: 500;
	color: #333;
	cursor: pointer;
	transition: background-color 0.3s, color 0.3s;
}

.autocompletedata:nth-child(even) {
	background-color: #f9f9f9; /* Alternating row colors */
}

.autocompletedata:nth-child(odd) {
	background-color: #ffffff;
}

.autocompletedata:hover {
	color: #fff;
	background-color: #BF05FF !important;
	border: 1px solid #BF05FF;
}

.navTabContainer {
	padding: 0px 10px;
}

.removeAccessForSave {
	pointer-events: none;
	opacity: 0.5;
}

.navTabContainer {
	padding: 10px 15px;
	flex-wrap: wrap;
}

.navTabContainer .nav-link {
	color: #495057;
	background-color: #ffffff;
	border: 1px solid #dee2e6;
	padding: 10px 20px;
	font-weight: 500;
}

.navTabContainer .nav-link:hover {
	background: #bf05ff !important;
	color: whitesmoke !important;
}

.navTabContainer .nav-link.active {
	background: #bf05ff !important;
	color: whitesmoke !important;
	border-radius: 6px !important;
}

.tab-content {
	border: 1px solid #dee2e6;
	border-top: none;
	background-color: #ffffff;
	border-radius: 0 0 8px 8px;
}

#tdiv {
	justify-content: flex-start;
	align-items: center;
	gap: 3rem;
	padding: 2px 15px;
}

		function amountFormatter(value) {
		    if (value !== null && value !== undefined) {
		        var parts = value.toString().split('.');
		        var integerPart = parts[0];
		        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
		        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
		        return formattedIntegerPart + decimalPart;
		    } else {
		        return '';
		    }
		}

			function changeToDecimal(elemt) {
				id = $(elemt).attr('id');
				value = $("#" + id).val();
				value = value.replace(/,/g, '');
				var floatValue = (parseFloat(value).toFixed(2));
				console.log("floatvalue-->", floatValue);
				if (isNaN(floatValue)) {
					floatValue = 0.00;
				}

				var parts = floatValue.toString().split('.');
				var integerPart = parts[0];
				var decimalPart = parts.length > 1 ? '.' + parts[1] : '.' + '00';
				var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);

				floatValue = integerPart + decimalPart;

				console.log("floatValue innn -->", floatValue);

				if (id.includes('debitAmount')) {
					$("#" + id).val(amountFormatter(parseFloat(floatValue).toFixed(2)));
					var counter = id.split('_')[1];
				} else if (id.includes('creditAmount')) {

					$("#" + id).val(amountFormatter(floatValue));
					var counter = id.split('_')[1];

					$("#debitAmount_" + counter).val(amountFormatter(parseFloat(floatValue).toFixed(2)));
				}
			}
			
			function formatAmount(element) {
			    let value = element.value;
			   if (value) {
			        let formattedValue = indianCurreny(value);
			        element.value = formattedValue;
			        $("#remainAmount").val(value);
			   }
			   
			}
			
			
			function  indianCurreny(value) {
			    if (value !== null && value !== undefined) {
			        //value = value.replace(/[^\d.,]/g, '');

			        var parts = value.toString().split('.');
			        var integerPart = parts[0].replace(/,/g, '');
			        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
			        
			        if(decimalPart.length>3){
			        	decimalPart = decimalPart.substring(0,3);
			        }

			        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
			        return formattedIntegerPart + decimalPart;
			    } else {
			        return '';
			    }
			}

function validateDateRange(fromDateSelector, toDateSelector) {
			
		    let fromDate = $(fromDateSelector).val();
		    let toDate = $(toDateSelector).val();
		    

		    if (fromDate && toDate) {
		        let from = new Date(fromDate.split('-').reverse().join('-')); 
		        let to = new Date(toDate.split('-').reverse().join('-'));

		        if (from > to) {
		            swal("From Date cannot be greater than To Date!");
		            $(fromDateSelector).val("");
		            $(toDateSelector).val("");
		        }
		    }
		}
		
		
function checkNumberInput(id) {
	var tagname = $("#"+id).val()
	var replaceValue = tagname.replace(/[^\d.]/g, '');
	var decimalIndex = replaceValue.indexOf('.');
	if (decimalIndex !== -1) {
		 replaceValue = replaceValue.substring(0, decimalIndex + 1) + replaceValue.substring(decimalIndex + 1).replace(/\./g, '');
	}
	$("#"+id).val(replaceValue);
}
function viewPaymentProcess(){
	
	
	let activeTab = $("#activeTabId").val();
	
	var fromDate =   activeTab == "vpp" ?$("#fromDate").val() : $("#oppFromDate").val();
	var toDate =  activeTab == "vpp" ?$("#toDate").val() : $("#oppToDate").val();
	
	
	$(".loader").show();
	agGrid.simpleHttpRequest({
		url: "payment-receivable-process-view?fromdate="+fromDate + "&todate=" + toDate,
	}).then(function (data) {
		
		let activatedTab = $("#activeTabId").val();
		var jsonData = JSON.parse(data.body);
		if(activatedTab == "vpp"){
		var alldata = jsonData.InvoiceDetails;
		var newData = [];
		
		 $.each(alldata, function(index, obj) {
		        if (obj.invoicePayStatus !="Fully Paid"){
		        newData.push(obj);
		        }
		    });
		 gridOptionsVPP.api.setRowData(newData);
		 
		 var rowData = [];
		 gridOptionsVPP.api.setRowData(rowData);
		 gridOptionsVPP.api.setRowData(newData);
		 

			if (newData && newData.length > 0) {
				gridOptionsVPP.api.forEachNode(function(node) {
					if (node.rowIndex === 0) {

					}

			}
			else{
				$("#payment-process-parent-container").addClass("d-none");
				$("#vendorNameText").text('');
			}
		}
		
		$(".loader").hide();
	});

		function amountFormatter(value) {
		    if (value !== null && value !== undefined) {
		        var parts = value.toString().split('.');
		        var integerPart = parts[0];
		        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
		        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
		        return formattedIntegerPart + decimalPart;
		    } else {
		        return '';
		    }
}

function SearchUserInput(event) {
	if (event.key === "Enter" || event.keyCode === 13) {
		event.preventDefault();
		onQuickFilterChanged();
	}
}
function onQuickFilterChanged() {
	let searchValue = document.getElementById('quickFilter').value;

	gridOptionsVPS.api.setQuickFilter(searchValue);
	gridOptionsOPS.api.setQuickFilter(searchValue);
	gridOptionsVPP.api.setQuickFilter(searchValue);
	gridOptionsOPP.api.setQuickFilter(searchValue);

	$('#totalReq').find('span').html(gridOptions.api.getModel().getRowCount());

	getMostClosestRow();
}

function getMostClosestRow() {
	let searchValue = document.getElementById('quickFilter').value;

	[gridOptionsVPS, gridOptionsOPS, gridOptionsVPP,gridOptionsOPP].forEach(grid => {
		grid.api.setQuickFilter(searchValue);

		grid.api.forEachNodeAfterFilter((node, index) => {
			if (index === 0) {
				node.setSelected(true);
				grid.api.ensureIndexVisible(node.rowIndex);
			}
		});
	});
}

function resetBtn() {
	$("#quickFilter").val('');

	[gridOptionsVPS, gridOptionsOPS, gridOptionsVPP,gridOptionsOPP].forEach(grid => {
		grid.api.setQuickFilter('');
		grid.api.refreshCells({ force: true });

		setTimeout(() => {
			grid.api.forEachNode((node, index) => {
				if (index === 0) {
					node.setSelected(true);
					grid.api.ensureIndexVisible(node.rowIndex);
				}
			});
		}, 50);
	});
}
