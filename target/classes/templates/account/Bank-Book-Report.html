<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="bankBookReport">
<head>


<link rel="stylesheet" href="/assets/css/account/bank-book-report.css" />
 
<!-- <link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css"> -->
<script src="../javaScript/account/manage-account-bank-book.js"></script>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/jquery-datetimepicker@2.5.20/build/jquery.datetimepicker.min.css" />

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/jquery-datetimepicker@2.5.20/build/jquery.datetimepicker.full.min.js"></script>


 <script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<style>
/*.out-box {
	border-top: 1pxsolidvar(--mainColor) !important;
	border-left: 1px solid rgb(255 255 255) !important;
	border-right: 1px solid var(--mainColor) !important;
	border-bottom: none !important;
	outline: none !important;
}*/
</style>
</head>
<body>
	<div class="maincontent">
		<div class="parent-container">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content flex-fill">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active h-100 d-block">
							<div class="row">
								<!--Left Sec Start-->
								<div class="col-md-12" id="bankDetailsGridDiv">
                  <div class="d-flex">

                    <div class="d-flex gap-2 search-sec flxwrap">
                      <input class="form-control" type="text"
                             placeholder="Search" style="width: 50vw" id="quickFilterBannk"
                             autocomplete="off" onkeyup="SearchUserInputBank(event)">
                      <button class="btn go-btn" type="button"
                              onclick="onQuickFilterChangedBank()">Go</button>
                      <button class="btn go-btn" onclick="resetBtnBank()"
                              type="reset">Reset</button>
                    </div>

                    <!-- <div class="col-md-2 d-flex justify-content-end">
                      <div class="btn btn-primary max-btn">
                        <i class="fas fa-arrows-alt"></i>
                      </div>
                    </div>
-->
                  </div>
                  <div class="voucherCounter my-1">
                    <div class="col-md-2  btn-hs">
                      <div class="font-design" id="totalReq">
                        <!-- ALL BANK LIST(<span></span>) -->
                      </div>
                    </div>
                  </div>
                  <div class="leftSideParentContainer">
                    <input type="hidden" id="sessionOrganization1"
                           th:value="${session.ORGANIZATION}" />
                    <div id="myGrid" style="height: 450px; width: 100%;"
                         class="ag-theme-alpine"></div>
                  </div>
                  <input type="hidden" id="userId" th:value="${session.USER_ID}" />
                  <input type="hidden" id="docUniqueId" />
								</div>

								<!--Right Sec Start-->
								<div class="col-md-12 d-none"
									id="bankTransDetailsDiv">
									<div id="rightSideDiv">

										<!-- <div class="btn btn-primary max-btn">
											<i class="fas fa-arrows-alt"></i>
										</div> -->

										<!--Right Inner Tab Start-->
										<ul class="nav nav-pills newtab mb-20 tablistUl navbarSticky d-none"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" id="manageTab" href="#manageControl"
												onclick="tabAccess('manageControl')">Bank Book Report</a></li>
										</ul>

										<!-- Tab panes -->

										<div class="tab-content">
											<div id="manageControl" class="tab-pane active operational-tabs d-block">

												<div class="mb-2 operationBtnSticky">
													<table class="table table-bordered mb-0" width="100%">
														<tr valign="middle" class="operation-row d-none">
															<td>
																<div class="row justify-content-between ">
																	<div class="col-md-12 bank-reportinfo">
																		Bank Id:&nbsp;&nbsp;<span id="voucherNumber"></span>
																	</div>

																</div>
															</td>
															<td></td>
														</tr>
													</table>
												</div>
												<div class="innercontent">

													<div class="ledgertable">
														<div class="btn-hs position-relative">
															<i class="bi bi-arrow-left-circle-fill bankBookBackBtn position-absolute"
																onclick="bankTransDivBack()"></i>
															<h2 id="bankbookName" style="font-size: 20px;"></h2>
															<label id="openinbalanceDate" class="animate-charcter"></label>
														</div>


														<!-- Start -->
														<div
															class=" d-flex justify-content-between mb-2 align-items-center">
															<input type="hidden" id="bankBookLedgerid"> <input
																type="hidden" id="openBal" value="" class="backbtn ">
															<input type="hidden" id="finalBal" value=""
																class="backbtn ">

															<div class="form-group">
																<label class="font-design">Voucher Type</label>
																<div class="select" style="width: 200px;">

																	<select id="bankBookVoucherType" class="form-control">
																		<option value="">--Select--</option>

																		<option value="PAYMENT">PAYMENT</option>
																		<option value="RECEIPT">RECEIPT</option>
																		<option value="SALE">SALE</option>
																		<option value="PURCHASE">PURCHASE</option>
																		<option value="JOURNAL">JOURNAL</option>
																		<option value="CONTRA">CONTRA</option>
																		<option value="DEBITNOTE">DEBIT NOTE</option>
																		<option value="CREDITNOTE">CREDIT NOTE</option>
																	</select>
																</div>
															</div>

															<div class="form-group">
																<label class="font-design">FROM DATE</label>
																<div class="form-group calendar_box">
																	<input type="text" id="bankbookfromDate"
																		placeholder="From Date" class="form-control">
																	<i class="ti-calendar picker_calendar"
																		id="toDateCalendarbankBook"
																		style="top: 16px; right: 5px;"></i>
																</div>
															</div>

															<div class="form-group">
																<label class="font-design">TO DATE</label>
																<div class="form-group calendar_box">
																	<input type="text" id="bankbooktoDate"
																		placeholder="To Date" class="form-control"> <i
																		class="ti-calendar picker_calendar"
																		id="toDateCalendar2bankBook"
																		style="top: 16px; right: 5px;"></i>
																</div>
															</div>

															<div class="form-group">

																<button
																	class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																	type="button" onclick="viewBankBookFilteredData()">
																	<i class="bi bi-search " id="filterBtnId"></i>
																</button>

															</div>

															<div class="form-group">
																<button
																	class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																	type="button" onclick="downloadPdfData()">
																	<i class="bi bi-file-earmark-pdf-fill"
																		id="downloadPdfId"></i>
																</button>
																<!-- <i class="bi bi-file-earmark-pdf-fill fltbtn"
																	id="downloadPdfId" onclick="downloadPdfData()"></i> -->
															</div>

															<div class="form-group">
																<!-- <input type="button" id="downloadExcelId" value="Excel"
																	class="fltbtn" onclick="downloadExcelData()"> -->
																<!-- <i class="bi bi-file-earmark-spreadsheet fltbtn"
																	id="downloadExcelId" onclick="downloadExcelData()"></i> -->
																<button
																	class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																	type="button" onclick="downloadBankAccountHistory()">
																	<i class="bi bi-file-earmark-spreadsheet "
																		id="downloadExcelId"></i>
																</button>
															</div>

														</div>



														<table class="table table-bordered table-striped bankAccountHistoryTable">
															<thead class="tablenewhead">
																<tr align="center">
																	<th width="10%"><strong>Date </strong></th>
																	<th width="30%"><strong>Particulars </strong></th>
																	<th width="15%"><strong>Voucher Type </strong></th>
																	<th width="15%"><strong>Voucher No. </strong></th>
																	<th width="10%"><strong>Debit Amount</strong></th>
																	<th width="10%"><strong>Credit Amount</strong></th>
																	<th width="10%"><strong>Closing Amount</strong></th>
																</tr>
															</thead>

															<tbody id="tblBody">

															</tbody>

														</table>
													</div>
												</div>

											</div>

										</div>

									</div>

								</div>
							</div>

						</div>

					</div>
				</div>

			</div>
		</div>
	</div>
</body>
</html>
