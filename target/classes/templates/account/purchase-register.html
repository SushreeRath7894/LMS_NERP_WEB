		 function parseDate(dateStr, format) {
		        // Example assumes format is DD-MM-YYYY
		        var parts = dateStr.split('-');
		        return new Date(parts[2], parts[1] - 1, parts[0]); // YYYY, MM, DD
		    }

		    // Function to update date pickers based on selected range
		    function updateDatePickers(yearStart, yearEnd) {
		        var minDate = `01-04-${yearStart}`;
		        var maxDate = `31-03-${yearEnd}`;
		        var minDateParsed = parseDate(minDate, dateFormat);
		        var maxDateParsed = parseDate(maxDate, dateFormat);

		        $("#toDateCalendar").datetimepicker('destroy').datetimepicker({
		            format: dateFormat,
		            closeOnDateSelect: true,
		            timepicker: false,
		            minDate: minDateParsed,
		            maxDate: maxDateParsed
		        }).on("change", function() {
		            $('#fromDate').val($(this).val());
		        });

		        $('#fromDate').blur(function() {
		            $("#toDateCalendar").val($(this).val());
		        });

		        $("#toDateCalendar2").datetimepicker('destroy').datetimepicker({
		            format: dateFormat,
		            closeOnDateSelect: true,
		            timepicker: false,
		            minDate: minDateParsed,
		            maxDate: maxDateParsed
		        }).on("change", function() {
		            $('#toDate').val($(this).val());
		        });

		        $('#toDate').blur(function() {
		            $("#toDateCalendar2").val($(this).val());
		        });
		    }

		    // Function to handle dropdown change
		    function handleDropdownChange() {
		        var datee = $("#orderStatusFilter").val();

		        // Extract year range from selected value
		        var yearRange = datee.split('-');
		        if (yearRange.length === 2) {
		            var yearStart = yearRange[0];
		            var yearEnd = yearRange[1];

		            // Update date pickers with new date range
		            updateDatePickers(yearStart, yearEnd);
		        }
		    }

		    // Attach change event handler to dropdown
		    $("#orderStatusFilter").change(function() {
		        handleDropdownChange();
		    });

		    // Initialize date format and default date values
		    var dateFormat = localStorage.getItem("dateFormat");
		    var today = new Date();
		    var dateString = ('0' + today.getDate()).slice(-2) + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + today.getFullYear();
		    var fromDate = dateString.toString();
		    var toDate = dateString.toString();

		    $("#toDate").val(toDate);
		    $("#fromDate").val(fromDate);

		    // Set initial date range based on current selection
		    handleDropdownChange(); 
		
		    viewFilteredData();

	function amountFormatter(value) {
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split('.');
	        var integerPart = parts[0];
	        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
	        return formattedIntegerPart + decimalPart;
	    } else {
	        return '';
	    }
	}
	
	function valueFormatForQN(value) {
		 
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split(' ');
	        var numberPart = parts[0];
	        var suffix = parts.length > 1 ? ' ' + parts[1] : '';

	        var numberParts = numberPart.split('.');
	        var integerPart = numberParts[0];
	        var decimalPart = numberParts.length > 1 ? '.' + numberParts[1] : '';

	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);

	        return formattedIntegerPart + decimalPart + suffix;
	    } else {
	        return '';
	    }
	}
	
	function customCellRenderer(params) {
	    if (params.value && typeof params.value === 'string') {
	        const values = params.value.split(',').map((value, index) => {
	        	return `<span style="color: #3467af;  font-size:12px; font-weight:700;">(${index + 1})</span> ${value.trim()}`;
	        });
	        return values.join(', ');
	    }
	    return params.value; 
	} 
	
	function customCellForUnitPrice(params) {
	    if (params.value && typeof params.value === 'string') {
	        const values = params.value.split(',').map((value, index) => {
	        	var priceValue = amountFormatter(value.trim());
	        	return `<span style="color: #3467af;  font-size:12px; font-weight:700;">(${index + 1})</span> ${priceValue}`;
	        });
	        return values.join(', ');
	    }
	    return params.value; 
	}

		function extractNumber(obj, decimalPlaces, allowNegative){
			var temp = obj.value;
			// avoid changing things if already formatted correctly
			var reg0Str = '[0-9]*';
			if (decimalPlaces > 0) {
				reg0Str += '\\.?[0-9]{0,' + decimalPlaces + '}';
			} else if (decimalPlaces < 0) {
				reg0Str += '\\.?[0-9]*';
			}
			reg0Str = allowNegative ? '^-?' + reg0Str : '^' + reg0Str;
			reg0Str = reg0Str + '$';
			var reg0 = new RegExp(reg0Str);
			if (reg0.test(temp)) return true;

			// first replace all non numbers
			var reg1Str = '[^0-9' + (decimalPlaces != 0 ? '.' : '') + (allowNegative ? '-' : '') + ']';
			var reg1 = new RegExp(reg1Str, 'g');
			temp = temp.replace(reg1, '');

			if (allowNegative) {
				// replace extra negative
				var hasNegative = temp.length > 0 && temp.charAt(0) == '-';
				var reg2 = /-/g;
				temp = temp.replace(reg2, '');
				if (hasNegative) temp = '-' + temp;
			}
			
			if (decimalPlaces != 0) {
				var reg3 = /\./g;
				var reg3Array = reg3.exec(temp);
				if (reg3Array != null) {
					// keep only first occurrence of .
					//  and the number of places specified by decimalPlaces or the entire string if decimalPlaces < 0
					var reg3Right = temp.substring(reg3Array.index + reg3Array[0].length);
					reg3Right = reg3Right.replace(reg3, '');
					reg3Right = decimalPlaces > 0 ? reg3Right.substring(0, decimalPlaces) : reg3Right;
					temp = temp.substring(0,reg3Array.index) + '.' + reg3Right;
				}
			}
			
			obj.value = temp;
		}

	function downloadExcelFromGrid() {
		  const selectedHeaders = [
		    "Date", "GRR Number", "NAME OF THE SUPPLIER", "GSTIN NO", "Voucher Type", "Voucher Class",
		    "MATERIAL CODE", "NAME OF THE MATERIAL", "HSN Code", "UNIT", "QTY BILLED", "QTY RECEIVED",
		    "SHORTAGE", "RATE P/U", "FREIGHT", "GST RATE (%)", "TAXABLE AMOUNT", "IGST", "CGST",
		    "SGST", "INVOICE VALUE", "TDS Amount", "Payable Amount"
		  ];

		  const fieldsToSum = [
		    'TAXABLE AMOUNT', 'IGST', 'CGST', 'SGST', 'INVOICE VALUE', 'TDS Amount', 'Payable Amount'
		  ];

		  const companyName = $("#sessionDivision1").val()?.toUpperCase() || "COMPANY NAME";
		  const fromDate = $("#fromDate").val();
		  const toDate = $("#toDate").val();

		  const currentDate = new Date().toLocaleDateString('en-GB', {
		    day: '2-digit', month: '2-digit', year: 'numeric'
		  }).split('/').join('_');
		  const fileName = 'Purchase_Register_Report_' + currentDate + '.xlsx';

		  const fieldMap = {};
		  const totals = {};
		  fieldsToSum.forEach(header => totals[header] = 0);

		  gridOptions.columnApi.getAllColumns().forEach((col) => {
		    const colDef = col.getColDef();
		    if (colDef.headerName && colDef.field) {
		      fieldMap[colDef.headerName.trim()] = colDef.field;
		    }
		  });

		  const rowData = [];

		  gridOptions.api.forEachNodeAfterFilterAndSort((node) => {
		    const row = {};
		    selectedHeaders.forEach((header) => {
		      const field = fieldMap[header];
		      let value = node.data?.[field] ?? '';
		      if (fieldsToSum.includes(header)) {
		        const num = parseFloat(value);
		        totals[header] += isNaN(num) ? 0 : num;
		        value = amountFormatter(isNaN(num) ? '0.00' : num.toFixed(2));
		      }
		      row[header] = value;
		    });
		    rowData.push(row);
		  });

		  // Add total row
		  const totalRow = {};
		  selectedHeaders.forEach(header => {
		    if (fieldsToSum.includes(header)) {
		      totalRow[header] = amountFormatter(totals[header].toFixed(2));
		    } else if (header === 'Date') {
		      totalRow[header] = 'Total';
		    } else {
		      totalRow[header] = '';
		    }
		  });
		  rowData.push(totalRow);

		  // Create worksheet from data
		  const ws = XLSX.utils.json_to_sheet(rowData, {
		    header: selectedHeaders,
		    skipHeader: true
		  });

		  // Add title/header rows manually
		  XLSX.utils.sheet_add_aoa(ws, [
		    [companyName],
		    [`Purchase Register Report From ${fromDate} To ${toDate}`],
		    ['―'.repeat(80)],
		    selectedHeaders
		  ], { origin: 'A1' });

		  // Merge title/header rows
		  ws['!merges'] = [
		    { s: { r: 0, c: 0 }, e: { r: 0, c: selectedHeaders.length - 1 } },
		    { s: { r: 1, c: 0 }, e: { r: 1, c: selectedHeaders.length - 1 } },
		    { s: { r: 2, c: 0 }, e: { r: 2, c: selectedHeaders.length - 1 } }
		  ];

		  // Style header rows
		  ws['A1'] = {
		    v: companyName,
		    t: 's',
		    s: {
		      font: { bold: true, sz: 16 },
		      alignment: { horizontal: 'center', vertical: 'center' },
		      fill: { fgColor: { rgb: 'DCE6F1' } }
		    }
		  };

		  ws['A2'] = {
		    v: `Purchase Register Report From ${fromDate} To ${toDate}`,
		    t: 's',
		    s: {
		      font: { bold: true, sz: 14 },
		      alignment: { horizontal: 'center', vertical: 'center' },
		      fill: { fgColor: { rgb: 'E2EFDA' } }
		    }
		  };

		  ws['A3'] = {
		    v: '―'.repeat(80),
		    t: 's',
		    s: {
		      alignment: { horizontal: 'center', vertical: 'center' },
		      font: { color: { rgb: "666666" } }
		    }
		  };

		  // Style header row (row 4)
		  selectedHeaders.forEach((header, i) => {
		    const cell = XLSX.utils.encode_cell({ r: 3, c: i });
		    if (ws[cell]) {
		      ws[cell].s = {
		        fill: { fgColor: { rgb: "5784c4" } },
		        font: { bold: true, color: { rgb: "FFFFFF" } },
		        alignment: { horizontal: "center", vertical: "center" },
		        border: {
		          top: { style: "thin", color: { rgb: "000000" } },
		          bottom: { style: "thin", color: { rgb: "000000" } },
		          left: { style: "thin", color: { rgb: "000000" } },
		          right: { style: "thin", color: { rgb: "000000" } }
		        }
		      };
		    }
		  });

		  // Apply right alignment to numeric columns
		  const range = XLSX.utils.decode_range(ws['!ref']);
		  selectedHeaders.forEach((header, colIndex) => {
		    if (!fieldsToSum.includes(header)) return;
		    for (let r = 4; r <= range.e.r; r++) {
		      const cellAddress = XLSX.utils.encode_cell({ r, c: colIndex });
		      if (ws[cellAddress]) {
		        ws[cellAddress].s = {
		          alignment: { horizontal: 'right' }
		        };
		      }
		    }
		  });

		  // Set column widths
		  ws['!cols'] = selectedHeaders.map(header => {
		    switch (header) {
		      case 'NAME OF THE SUPPLIER':
		      case 'NAME OF THE MATERIAL':
		        return { wch: 40 };
		      case 'TAXABLE AMOUNT':
		      case 'IGST':
		      case 'CGST':
		      case 'SGST':
		      case 'TDS Amount':
		      case 'INVOICE VALUE':
		      case 'Payable Amount':
		        return { wch: 18 };
		      default:
		        return { wch: 20 };
		    }
		  });

		  // ✅ Set row heights so headings are visible without clicking
		  ws['!rows'] = [
		    { hpt: 24 }, // Row 1: Company Name
		    { hpt: 20 }, // Row 2: Report range
		    { hpt: 14 }, // Row 3: Divider
		    { hpt: 18 }  // Row 4: Column headers
		  ];

		  // Export the Excel file
		  const wb = XLSX.utils.book_new();
		  XLSX.utils.book_append_sheet(wb, ws, 'Purchase Register Report');
		  XLSX.writeFile(wb, fileName);
		}
