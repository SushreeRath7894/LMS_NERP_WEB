	function amountFormatter(value) {
	    if (value !== null && value !== undefined) {
	        var parts = value.toString().split('.');
	        var integerPart = parts[0];
	        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
	        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
	        return formattedIntegerPart + decimalPart;
	    } else {
	        return '';
	    }
	}

function viewPaymentDetails(ledgerId, creditPeriod, vendorId,rowIndex, ledgerName){
	
	$("#proposetopay").prop("disabled", true);
	$("#downloadPdfId").prop("disabled", true);
	$("#downloadExcelId").prop("disabled", true);
	
	IndexValue = ledgerId;
	$("#proposevendoeid").val(vendorId);


	if(creditPeriod=="" || creditPeriod=="null" || creditPeriod==null){
		swal("Payment Term Not Available")
	}else{
		var ledgerNametag = atob(ledgerName);
		$('#invoiceListPopup').modal('show');
		$("#ledgerNameModal").html(ledgerNametag);
		$.ajax({
			type : "GET",
			url : "payment-planning-getInvoiceList?ledgerId=" + ledgerId + "&vendorId=" + vendorId,
			async : false,
			success : function(response) {
				if (response.code == "Success") {
					$("#vendorInvoiceList").empty();
					if (response.body.length == 0 || response.body.length == null) {
						var emptybdy='<tr align="left" valign="top">'
							+'<td colspan="7" style="text-align: center;">NO DATA FOUND</td>'
							+'</tr>';
						$("#vendorInvoiceList").append(emptybdy);
					}else{
						for(var i=0;i<response.body.length;i++){
						    var checkbox = '';
							if (response.body[i].overDueCount !== 'PAID') {
						        checkbox = '<td style="text-align: center;"><input type="checkbox" name="invoiceCheckbox" value="' + response.body[i].remainAmt + '" onclick="sumCheckedCheckboxes()"></td>';
						    }else{
						    	checkbox = '<td></td>';
						    }
							var overDueCountStyle = response.body[i].overDueCount === 'PAID' ? 'color: blue;' :
	                            response.body[i].overDueCount > 0 ? 'color: red; animation: slowBlink 2s infinite;' : '';
							var rowColorStyle = i % 2 === 0 ? 'background-color: #ffffff;' : 'background-color: #bcb6b6;';
							var bdy = '<tr align="left" valign="top" style="' + rowColorStyle + '">'
								+checkbox
								+'<td style="text-align: center;">'+response.body[i].invoiceId+'</td>'
								+'<td class="alnright totalamt">₹'+response.body[i].totalAmt+'</td>'
								+'<td class="alnright paidamt">₹'+response.body[i].paidAmt+'</td>'
								+'<td class="alnright remainamt">₹'+response.body[i].remainAmt+'</td>'
								+'<td style="text-align: center;">'+response.body[i].invoiceDate+'</td>'
								+'<td style="text-align: center;">'+response.body[i].invoiceDueDate+'</td>'
								//+'<td style="text-align: center;">'+response.body[i].overDueCount+'</td>'
								+'<td style="text-align: center;' + overDueCountStyle + '">' + response.body[i].overDueCount + '</td>'
								+'</tr>';
						  $("#vendorInvoiceList").append(bdy);		
						}
						var totalAmtCalc = response.body.reduce((sum, entry) => sum + parseFloat(entry.totalAmt), 0);
						var paidAmtCalc = response.body.reduce((sum, entry) => sum + parseFloat(entry.paidAmt), 0);
						var remainAmtCalc = response.body.reduce((sum, entry) => sum + parseFloat(entry.remainAmt), 0);
						
						var totalbdy = '<tr align="left" valign="top">'
							+ '<td colspan="1"></td>'
						    + '<td colspan="1" style="text-align: right;"><strong>Total:</strong></td>'
						    + '<td class="alnright"><strong>₹' + totalAmtCalc.toFixed(2) + '</strong></td>'
						    + '<td class="alnright"><strong>₹' + paidAmtCalc.toFixed(2) + '</strong></td>'
						    + '<td class="alnright"><strong>₹' + remainAmtCalc.toFixed(2) + '</strong></td>'
						    + '<td colspan="3" style="text-align: left;" id="selectedTotalPayAmount"><strong>Selected Total Pay Amount: ₹' + selectedTotalPayAmount.toFixed(2) + '</strong></td>'
						    + '</tr>';
						    
						$("#vendorInvoiceList").append(totalbdy);
						proposeAmount = selectedTotalPayAmount;
						console.log("proposeAmount-->", selectedTotalPayAmount);
					}
					
				}
			
			}
		})
	}

function getDataVoucherType(){
	var voucherType = $("#voucherTypeId").val();
	var ledgerId = $("#ledgerIdVoucher").val();
	$.ajax({
		type : "GET",
		url : "ledger-voucher-details-wrtVoucherType?id=" + ledgerId + "&voucherType=" + voucherType,
		async : false,
		success : function(response) {
			if (response.code == "Success") {
				$("#tblBody").empty();
				if (response.body.length == 0 || response.body.length == null) {
					var emptybdy='<tr align="left" valign="top">'
						+'<td colspan="6" style="text-align: center;">NO DATA FOUND</td>'
						+'</tr>';
					$("#tblBody").append(emptybdy);
				}else{
					for(var i=0;i<response.body.length;i++){
						var bdy='<tr align="left" valign="top">'
							+'<td style="text-align: center;">'+response.body[i].voucherDate+'</td>'
							+'<td style="text-align: center;">'+response.body[i].ledgerName+'</td>'
							+'<td style="text-align: center;">'+response.body[i].voucherType+'</td>'
							+'<td style="text-align: center;">'+response.body[i].voucherId+'</td>'
							+'<td class="alnright">₹'+response.body[i].debitAmount+'</td>'
							+'<td class="alnright">₹'+response.body[i].creditAmount+'</td>'
							+'</tr>';
					  $("#tblBody").append(bdy);		
					}
					var totalDebit = response.body.reduce((sum, entry) => sum + parseFloat(entry.debitAmount), 0);
					var totalCredit = response.body.reduce((sum, entry) => sum + parseFloat(entry.creditAmount), 0);
					
					var totalbdy = '<tr align="left" valign="top">'
					    + '<td colspan="4" style="text-align: right;"><strong>Total:</strong></td>'
					    + '<td class="alnright"><strong>₹' + totalDebit.toFixed(2) + '</strong></td>'
					    + '<td class="alnright"><strong>₹' + totalCredit.toFixed(2) + '</strong></td>'
					    + '</tr>';
					    
					    $("#tblBody").append(totalbdy);

				}
				$(".ledgertable").show();
				$("#agGridTable").hide();
			}
			//$("#ledgerVcrName").text(atob(ledgerName));
		}
	})
}

 function downloadExcelFromGrid() {
	    var selectedHeaders = ['Ledger ID', 'Vendor ID', 'Suppliers Name', 'Account Group', 'Credit Period',

	             }
	             data[header] = value;
	        });

	        
	        console.log("Data-->",data);

	        var outstandingAmount =  parseFloat(node.data[fieldMap['Total Outstanding']]) || 0;
	        var payableamt =  parseFloat(node.data[fieldMap['Overdue']]) || 0;
	        var proposeamt =  parseFloat(node.data[fieldMap['Propose Amount']]) || 0;

	        totalOutstandingAmt += outstandingAmount;
	        totalPayableAmt += payableamt;

	    });

	    		'Due Invoice': "",
	    		
	    };

	    var ws = XLSX.utils.json_to_sheet(rowData, { header: selectedHeaders });
	    var wb = XLSX.utils.book_new();
	    XLSX.utils.book_append_sheet(wb, ws, 'Payment Planning');

	}


// PDF Download BTN for all the vendor details.....

	function downloadPropseAmountPdf(){
	var rowData = [];
    gridOptions.api.forEachNode(function(node) {
    	if(node.data.proposeAmt==null || node.data.proposeAmt ==""){
    		node.data.proposeAmt = '0.00';
    	}
    	 node.data.outstandingAmt = amountFormatter(node.data.outstandingAmt);
    	 node.data.payableAmt = amountFormatter(node.data.payableAmt);
    	 node.data.proposeAmt = amountFormatter(node.data.proposeAmt);
        rowData.push(node.data);
    });

    console.log("ROwData -->", rowData);
    var jsonbody = JSON.stringify(rowData);
    
    $.ajax({
        url: 'payment-planning-proposeAmt-pdf',
        type: 'POST',
        contentType: 'application/json',
        data: jsonbody,
        xhrFields: {
            responseType: 'blob'
        },
        success: function(response) {
        	var blob = new Blob([response], { type: 'application/pdf' });
            var url = window.URL.createObjectURL(blob);
            var filename = 'Payment_Planning_' + new Date().toISOString().slice(0, 10) + '.pdf';
            var a = document.createElement('a');
            a.href = url;
            a.download = filename; // Set the filename
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        },
        error: function(error) {
            console.error('Error sending data:', error);
        }
    });
    
    rowData.forEach(function(row) {
        row.outstandingAmt = removeCommas(row.outstandingAmt);
        row.payableAmt = removeCommas(row.payableAmt);
        row.proposeAmt = removeCommas(row.proposeAmt);
    });
	
}

function removeCommas(amount) {
	return amount.replace(/,/g, '');
}
