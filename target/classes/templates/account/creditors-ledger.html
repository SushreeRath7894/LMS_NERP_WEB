<head>
<style>
.input-style {
	width: 302px;
	border-radius: 34px;
	border: 1px solid #d5d5d5;
	font-size: 12px;
	padding: 4px 10px;
	background-color: #f8f8f8;
	margin-left: 0;
	display: flex;
}

.hvrbox .hvrbox-layer_top {
	opacity: 0;
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	width: 25%;
	height: 100%;
	background: rgba(0, 0, 0, 0.3);
	color: #fff;
	padding: 15px;
}

.btn1 {
	border: none;
	border-radius: 4px;
	font-size: 10px;
	background-color: #5784c4;
	color: #fff !important;
	margin-left: 5px;
	margin-bottom: 8px;
	width: 156px;
	height: 28px;
	line-height: 12px;
	float: right;
	text-transform: uppercase;
	cursor: pointer;
}

.taskInfo {
	padding-left: 10px;
	color: #45166a;
}

.rating {
	float: left;
}

.rating:not (:checked )>input {
	position: absolute;
	top: -9999px;
	clip: rect(0, 0, 0, 0);
}

.rating:not (:checked )>label {
	float: right;
	width: 1em;
	padding: 0 .1em;
	overflow: hidden;
	white-space: nowrap;
	cursor: pointer;
	font-size: 200%;
	line-height: 1.2;
	color: rgba(0, 0, 0, 0.6);
	/*  text-shadow:1px 1px #bbb, 2px 2px #666, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not (:checked )>label:before {
	content: '★ ';
}

.rating>input:checked ~label {
	color: #ea0;
	/*  text-shadow:1px 1px #c60, 2px 2px #940, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not (:checked )>label:hover, .rating:not (:checked )>label:hover
	 ~label {
	color: black;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>input:checked+label:hover, .rating>input:checked+label:hover
	 ~label, .rating>input:checked ~label:hover, .rating>input:checked
	 ~label:hover ~label, .rating>label:hover ~input:checked ~label {
	color: #ea0;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>label:active {

	left: 2px;
}

.btn-outline-primary {

	background-color: rgb(240 243 241/ 90%);

	border-color: #007bff;

}

.text-style {
	color: black;

}

.picker_calendar5 {

.picker_calendar6 {

background-color: #fff!important;
color:#07449b!important;

<script>
	$(document).ready(function() {

		var dateFormat = localStorage.getItem("dateFormat");

		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);

		getAccountCreditorsLedger();

		$("#fromDate").datetimepicker({
			format : 'd-m-Y',
			closeOnDateSelect : true,
			timepicker : false,
		});

		$("#fromDateICon").datetimepicker({
			format : 'd-m-Y',
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#fromDate').val($(this).val());
		});

		$("#toDate").datetimepicker({
			format : 'd-m-Y',
			closeOnDateSelect : true,
			timepicker : false,
		});

		$("#toDateIcon").datetimepicker({
			format : 'd-m-Y',
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#toDate').val($(this).val());
		});

		$("#fromDateCalenderStmnt").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#fromDateStmnt').val($(this).val());
		});

		$('#fromDateStmnt').blur(function() {
			$("#fromDateCalenderStmnt").val($(this).val());
		});

		//to date account statement
		$("#toDateCalendarStmnt").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#toDateStmnt').val($(this).val());
		});

		$('#toDateStmnt').blur(function() {
			$("#toDateCalendarStmnt").val($(this).val());
		});

		var displayedRowCount = gridOptions.api.getDisplayedRowCount();

		var len = displayedRowCount;
		$('#totalReq').find('span').html(len);
	});

	//search bar

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		var displayedRowCount = gridOptions.api.getDisplayedRowCount();

		var len = displayedRowCount;
		$('#totalReq').find('span').html(len);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	$('input,textarea').focus(
			function() {
				$(this).data('placeholder', $(this).attr('placeholder')).attr(
						'placeholder', '');
			}).blur(function() {
		$(this).attr('placeholder', $(this).data('placeholder'));
	});

	var count = 0;
	function allCheck() {
		count++;

		if (count == 1) {
			$('.checkCls').prop("checked", true);
		} else {
			count = 0;
			$('.checkCls').prop("checked", false);
		}
	}

	var txtLen = 0;
	function textCount(event) {

		var id = event.target.id;
		var pId = $('#' + id).next().attr("id");
		$('#' + pId + ' span').empty();
		txtLen = $('#' + id).val().length;
		$('#' + pId + ' span').append(txtLen);
	}

	// column Defs
	const columnDefs = [
			{
				headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : false,
				checkboxSelection : false,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true
			},
			{

				headerName : 'Vendor Id',
				field : "vendorId",
				width : 170,
				cellStyle : {
					textAlign : 'left'
				},
				cellRenderer : function(params) {
					return '<div style="color:black;font-weight: bold;">'
							+ params.data.vendorId + '</div>';
				}
			},

			{
				headerName : "Vendor Name",
				field : "vendorName",
			},
			{
				headerName : "Mobile No",
				field : "mobileNo",
			},

			{
				headerName : "Invoice No",
				field : "invoiceNo",
			},
			{
				headerName : "Total Order Amount",
				field : "totalAmt",
				cellStyle : {
					textAlign : 'right'
				},
				cellRenderer : function(params) {
					const formattedValue = parseFloat(params.data.totalAmt)
							.toFixed(2);
					return '<div>' + formattedValue + '</div>';
				},
			},
			{
				headerName : "Payment Id",
				field : "paymentId",
			},
			{
				headerName : "Paid Amount",
				field : "paidAmount",
				cellStyle : {
					textAlign : 'right'
				},
				cellRenderer : function(params) {
					const formattedValue = parseFloat(params.data.paidAmount)
							.toFixed(2);
					return '<div>' + formattedValue + '</div>';
				},
			},
			{
				headerName : "Outstanding Amount",
				field : "outstandingAmount",
				cellStyle : {
					textAlign : 'right'
				},
				cellRenderer : function(params) {
					const formattedValue = parseFloat(
							params.data.outstandingAmount).toFixed(2);
					return '<div>' + formattedValue + '</div>';
				},
			}, {
				headerName : "Payment Status",
				field : "paidStatus",
			} ];

	const gridOptions = {
		columnDefs : columnDefs,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 180,
			height : 10
		},
		rowSelection : 'single',
		suppressRowClickSelection : true,
		onSelectionChanged : rowSelect,
		getRowNodeId : function(data) {
			return data.journalVoucher;
		}

	};

	//	var deleteId = "";
	function rowSelect() {

		var selectedRows = gridOptions.api.getSelectedRows();
		deleteId = "";

		for (var i = 0; i < selectedRows.length; i++) {
			deleteId = deleteId + '' + selectedRows[i].journalVoucher + ',';
			// deleteId = deleteId  + selectedRows[i].journalVoucherId + ',';
		}
		deleteId = deleteId.substring(0, deleteId.length - 1);
		console.log(deleteId)
		var rowCount = 0;

		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});
	}

	function getAccountCreditorsLedger() {

		$.ajax({
			type : "GET",
			url : "view-account-creditors-ledger",
			async : false,
			success : function(response) {
				console.log("API Response dfdgbfdfdgffd:", response);
				if (response.code === "success") {

					var jsonData = JSON.parse(response.body);
					//console.log("bjfghjkgcgkghlggfdfjggk  ===============" + jsonData)
					var allData = jsonData;
					//console.log("bjfghjkgcgkghlggfdfjggk  ===============" + allData)
					gridOptions.api.setRowData(allData);

				}

			}
		});
	}

	//=================Filter Start=============================

	function filterCreditorsLedger() {

		var financialYear = $("#financialYear").val();
		var fromDate = $('#fromDate').val();
		var toDate = $('#toDate').val();

		if (fromDate === null || fromDate === '') {
			if (toDate === null || toDate === '') {
				if (financialYear === null || financialYear === '') {
					swal("Select Financial Year");
					return false;

				}
			} else {
				swal("Insert From Date");
				return false;
			}
		}

		if (toDate === null || toDate === '') {
			if (fromDate === null || fromDate === '') {
				if (financialYear === null || financialYear === '') {
					swal("Select Financial Year");
					return false;
				}
			} else {
				swal("Insert To Date");
				return false;
			}
		}

		getSearchData();
	}

	function getSearchData() {

		var financialYear = $("#financialYear").val();
		var fromDate = $("#fromDate").val();
		var toDate = $("#toDate").val();

		agGrid.simpleHttpRequest(
				{
					url : "view-account-creditors-ledgerFilter?financialYear="
							+ financialYear + "&fromDate=" + fromDate
							+ "&toDate=" + toDate,

				}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData;
			console.log("Pankajskjgjasdhfsadh" + JSON.stringify(allData));
			gridOptions.api.setRowData(allData);
			var displayedRowCount = gridOptions.api.getDisplayedRowCount();

			var len = displayedRowCount;
			$('#totalReq').find('span').html(len);

		});

	}

	function dateValidation() {

		var fromDate = $("#fromDate").val();
		var toDate = $("#toDate").val();

		if (fromDate && toDate) {
			if (new Date(toDate) < new Date(fromDate)) {
				swal("To Date should not be less than   From Date");
				$("#toDate").val("");

			}
		}
	}

	function selectAutocompleteValue20(vendorId, vendorName, vendorEmail,
			vendorMobile) {

		if (vendorId) {
			$("#vendorId").val(vendorId);
			$("#vendorName").val(vendorName);

			$("#search").val(vendorName);
			$("#search").attr('data-procat', vendorId);
			$("#suggesstion-box20_").hide();
		} else {
			$("#vendorId").val("");
			$("#vendorName").val("");

			$("#search").val("");
			$("#search").attr('data-procat', "");
			$("#suggesstion-box20_").hide();

		}
	}

	function getVendorNameList() {
		var search = $("#vendorName").val();
		if (search.length < 1) {
			$("#suggesstion-box20_").hide();
		}

		if (search) {
			$
					.ajax({
						type : "POST",
						url : "view-account-creditors-ledger-vendorList",
						dataType : 'json',
						contentType : 'application/json',
						data : search,
						success : function(response) {
							if (response.message == "success") {
								if (response.body.length != 0) {
									$("#search").css("background", "");
									var content = '<ul id="autocomplete-list1">';

									for (var i = 0; i < response.body.length; i++) {
										content += '<li class="autocompletedata cp" style="font-weight:700;      padding: 5px 10px; color:#121212;     border-bottom: 1px solid white;  font-size:12px; background-color: #9ec5ff;" onClick="selectAutocompleteValue20(\''
												+ response.body[i].vendorId
												+ '\',\''
												+ response.body[i].vendorName
												+ '\',\''
												+ response.body[i].vendorEmail
												+ '\',\''
												+ response.body[i].vendorMobile
												+ '\')">'
												+ response.body[i].vendorName
												+ '</li>';
									}

									content += '</ul>';
									$("#suggesstion-box20_").show();
									$("#suggesstion-box20_").html(content);
								} else {
									$("#search").css("background", "#FFF");
									var content = '<ul id="autocomplete-list2">';
									content += '<li onClick="selectAutocompleteValue()">'
											+ "No Data Found" + '</li>';
									content += '</ul>';
									$("#suggesstion-box20_").show();
									$("#suggesstion-box20_").html(content);
								}
							}
						},
						error : function(data) {
							console.log("Error:", data);
						}
					});
		}
	}

	 function viewPdf() {


		var vendorId = $("#vendorId").val();

		var fromDate = $("#fromDateStmnt").val();
		var toDate = $("#toDateStmnt").val();
		if (vendorId == "" || vendorId == null) {
			swal("Please Enter Vendor");
			return false;
		}
		if (fromDate == "" || fromDate == null) {
			swal("Please Enter From Date");
			return false;
		}
		if (toDate == "" || toDate == null) {
			swal("Please Enter To Date");
			return false;
		}
		window.open("/account/creditors-ledger-receipt-Pdf?id=" + vendorId + "&fromDate=" + fromDate + "&toDate=" + toDate, '_blank');

	}
	
	function downloadAccountStatementAdmin() {

		$('#accntStmntPopupAdmin').modal('show');
	}

	function cancelPaymentBtn() {
		$('#accntStmntPopupAdmin').modal('hide');
	}

/* 	function getVendorStatementByAdmin() {

		var vendorId = $("#vendorId").val();

		if (vendorId == "" || vendorId == null) {

			return false;
		}
		if (fromDate == "" || fromDate == null) {
			swal("Please Enter From Date");
			return false;
		}
		if (toDate == "" || toDate == null) {

		window.open("/purchase/vendor-account-statement-view-pdf-admin?id="

				'_blank');

		$("#vendorstmtName").val("");
		$("#vendorstmtId").val("");
		$("#fromDateStmnt").val("");
		$("#toDateStmnt").val("");
	} */
</script>
</head>

<body>

		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">


					<div class="row" id="headingDiv">
						<div class="col-md-4">
							<div class="form-group d-flex">
								<div class="col-md-3">
									<label>Financial Year</label>
								</div>
								<div class="col-md-9">
									<div class="select">
										<select id="financialYear" class="form-control">

											<option th:each="c,iter:${fiscalList}" th:value="${c.key}"
												th:text="${c.name}"></option>

									</div>
								</div>

						</div>

									style="top: 12px; right: 5px;"></i>
							</div>
						</div>

						<div class="col-md-2 form-group">
							<div class="form-group calendar_box">
								<input type="text" id="toDate" onchange="dateValidation()"
									placeholder="To Date" class="form-control"> <i
									class="ti-calendar picker_calendar" id="toDateIcon"
									style="top: 12px; right: 5px;"></i>
							</div>
						</div>
						<div class="col-md-1 form-group">
							<input type="button" id="filter" value="Filter" class="btn2"
								onclick="filterCreditorsLedger()" readonly>


						</div>
					</div>

					<div class="d-flex justify-content-between mt-4">
						<div class="btn-hs">
							<div class="font-design" id="totalReq">
								ALL CREDITOR LEDGER(<span></span>)
							</div>
						</div>

						<div id="searchRowDiv">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search"
									class="searchboxinput" onkeyup="cancelBar()"
									oninput="onQuickFilterChanged()" id="quickFilter"
									autocomplete="off">
								<div class="searchicon">
									<a href="javascript:void(0)"><span
										style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
										id="closeKey"
										onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';"
										class="close_i"><i class="ti-close srchicon"></i></span></a><a
										href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
								</div>

							</div>

						</div>
						<!-- <div class="col-lg-4">
							<div class="form-group">
								<div class="autocomplete" style="width: auto !important; margin-top: 0px;">
									<div class="form-group">
										<label>Vendor Name</label> <input type="text" id="vendorName"
											placeholder="Vendor Name" class="form-control"
											onkeyup='getVendorNameList();'>
										<input type="hidden" id="vendorId">
									</div>
								</div>
								<div id="suggesstion-box20_" class="sugg-cls"></div>

							</div>
						</div> -->
						<button class="new-btn btn1" style="font-size: 12px;"
							id="dwnldStatementBtnAdmin"
							onclick="downloadAccountStatementAdmin()">Statement PDF</button>

					</div>



					<!-- End -->



					<!-- Start -->
					<div class="row mt-2" id="searchFilter"
						style="margin-bottom: 10px;">
						<div class="col-md-4"></div>


						<div id="myGrid" style="width: 100%; height: 500px;"
							class="ag-theme-alpine mt-3"></div>

						<div id="accntStmntPopupAdmin" class="modal fade" role="dialog">
							<div class="modal-dialog modal-lg">
								<!-- Modal content-->
								<div class="modal-content">

									<div class="modal-body">

										<div class="row">

											<div class="col-lg-4">
												<div class="form-group">
													<div class="autocomplete"
														style="width: auto !important; margin-top: 0px;">
														<div class="form-group">
															<label>Vendor Name</label> <input type="text"
																id="vendorName" placeholder="Vendor Name"
																class="form-control" onkeyup='getVendorNameList();'>

														</div>
													</div>
													<div id="suggesstion-box20_" class="sugg-cls"></div>

											<div class="col-md-4 form-group" id="fdDivStmnt"

												<div class="form-group calendar_box">
													<input type="text" id="fromDateStmnt" value=""

														th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|"

														id="fromDateCalenderStmnt" style="top: 12px; right: 5px;"></i>
												</div>
											</div>

											<div class="col-md-4 form-group" id="tdDivStmnt"

												<div class="form-group calendar_box">
													<input type="text" id="toDateStmnt" value=""

														readonly> <i class="ti-calendar picker_calendar"
														id="toDateCalendarStmnt" style="top: 12px; right: 5px;"></i>
												</div>
											</div>
										</div>

									</div>
									<div class="modal-footer">

								</div>

						<div class="collapse" id="demo">
							<div class="innercontent">
								<div class="innerstickybg">
									<div class="d-flex justify-content-between" id="main"></div>

								</div>
</body>
