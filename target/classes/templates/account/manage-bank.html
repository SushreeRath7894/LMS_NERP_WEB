<script>
	$(function() {

		$("input[name=ReminderYesOrNo]:radio").click(function() {
			if ($('input[name=ReminderYesOrNo]:checked').val() == "Yes") {
				$('.reminderBtn').show();

			} else if ($('input[name=ReminderYesOrNo]:checked').val() == "No") {
				$('.reminderBtn').hide();

				$('#reminderTime').val("");
				$('#taskAlertBy').val("");

			}
		});

		var dateFormat = localStorage.getItem("dateFormat");
		$("#startDateCalendar").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#startDate').val($(this).val());
		})

		$('#startDate').blur(function() {
			$("#startDateCalendar").val($(this).val());
		})

		$("#endDateCalendar").datetimepicker({
			format : dateFormat,

		}).on("change", function() {
			$('#endDate').val($(this).val());
		})

			$("#endDateCalendar").val($(this).val());
		})

			format : 'H:i',
			closeOnDateSelect : false,
			timepicker : true,
			datepicker : false,
			step : 15
		}).on("change", function() {
			$('#reminderTime').val($(this).val());
		})

		$('#reminderTime').blur(function() {
			$("#toDateCalendarTime").val($(this).val());
		})
	});

			}).blur(function() {
		$(this).attr('placeholder', $(this).data('placeholder'));
	});

		count++;

		} else {

			$('.checkCls').prop("checked", false);
		}

	function textCount(event) {

		var id = event.target.id;
		var pId = $('#' + id).next().attr("id");
		$('#' + pId + ' span').empty();
		txtLen = $('#' + id).val().length;
		$('#' + pId + ' span').append(txtLen);

	}

	var deleteId = "";
	function rowSelect() {
		//alert('hello select');
		var selectedRows = gridOptions.api.getSelectedRows();
		deleteId = "";

		for (var i = 0; i < selectedRows.length; i++) {
			deleteId = deleteId + '"' + selectedRows[i].bankId + '",';

		}
		deleteId = deleteId.substring(0, deleteId.length - 1);

		var rowCount = 0;

		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});

		if (rowCount > 0) {
			$('#delete').prop("disabled", false).css("opacity", 1);
			$('#add').prop("disabled", true).css("opacity", 0.4);

		} else {

			$('#delete').prop("disabled", true).css("opacity", 0.4);

	// Edit & stage change 
	function editPage(id) {
		//alert(id);
		$(".loader").show();
		var editId = id.split(",");

		var bankId = editId[0];

		var modal = editId[1];
		//alert('bankId------'+bankId);
		$("#demo").show();

		$.ajax({
			type : "GET",
			url : "view-account-bank-edit?id=" + bankId,
			async : false,
			success : function(response) {
				console.log("response for edit------"
						+ JSON.stringify(response));
				if (response.code == "Success") {

					$("#add").hide();
					$("#copy").hide();
					$("#delete").hide();
					$("#myGrid").hide();
					$("#searchRowDiv").hide();
					$("#totalReq").hide();
					$("#statusDiv").hide();
					$("#idDiv").hide();
					$("#collapseFour").hide();
					$("#headingFour").hide();
					$("#myGridActivity").hide();
					$(".loader").hide();
					$("#demo").show();

					$(".container").hide();

					var bankId = $("#bankId").text(response.body[0].bankId);

					$("#bankName").val(response.body[0].bankName);
					$("#status").val(response.body[0].status);

					var statuset = response.body[0].status;
					console.log("Status----", statuset);

					if (statuset == "true") {
						$("#status").prop('selectedIndex', 1);
					} else {
						$("#status").prop('selectedIndex', 2);
					}

					$('#description').val(response.body[0].description);

				}
			}
		})
	}
</script>

		$('#imgLoc').attr('src', '../assets/images/noimage.jpg');

		var fileData = new FormData();

		fileData.append('file', 'none');
		fileData.append('path', 'none');

		$.ajax({
			type : "POST",
			url : "view-crm-vendors-delete-file",
			enctype : "multipart/form-data",
			contentType : false,
			/* data        : fileData, */
			processData : false,
			cache : false,
			success : function(response) {
			},
			error : function(e) {

			}
		});
	}

	function getStateDetails() {

		var cname = $('#country').val();
		if (cname) {
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			//$("#dname").append(option);
			$.ajax({
				type : "GET",
				url : "view-crm-leads-stateList?id=" + cname,
				success : function(response) {
					if (response.message == "success") {
						$("#states").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#states").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#states").append(option);
						}
					}
				},
				error : function(e) {
				}
			});
		} else {
			$("#states").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$("#states").append(option);
			$("#states").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			//$("#dname").append(option);
		}
	}

	function getStateDataOnEdit(stateId) {
		var country = $("#country").val();
		if (country) {
			$.ajax({
				type : "GET",
				url : "view-crm-leads-stateList?id=" + country,
				success : function(response) {
					if (response.message == "success") {
						$("#states").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#states").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#states").append(option);
						}
						$("#states").val(stateId);
					}
				},
				error : function(e) {
				}
			});
		} else {
			$("#states").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$("#states").append(option);
		}
	}
</script>
