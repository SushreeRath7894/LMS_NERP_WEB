<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:fragment="AccountStatementReport">
<head>


<link rel="stylesheet" href="../assets/css/account/bank-book-report.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script src="../javaScript/account/account-statement.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


</head>
<body>
	<div class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active d-block">
							<div class="row">

								<!--Left Sec Start-->
								<div class="col-md-12 pd-r tab-transition position-relative"
									id="accountStatementLeftGridDiv">
									<div class="out-box">
										<div class="row d-flex  mb-20">

											<div class="col-md-10">
												<div class="d-flex search-sec flxwrap">
													<input class="form-control me-2 ms-2" type="text"
														placeholder="Search" style="width: 50vw"
														id="quickFilterAccountStatement" autocomplete="off"
														onkeyup="SearchUserInputAccStatement(event)">
													<button class="btn go-btn " type="button"
														onclick="onQuickFilterChangedAccStatement()">Go</button>
													<button class="btn go-btn ms-2" onclick="resetBtnAccStatement()"
														type="reset">Reset</button>
												</div>
											</div>

										</div>

										<div class="voucherCounter  px-3 mt-4">
											<div class="col-md-2  btn-hs">
												<div class="font-design" id="totalReq">
													<!-- ALL LEDGER(<span></span>) -->
												</div>
											</div>


										</div>

										<div class="leftSideParentContainerAccountStatement">
											<input type="hidden" id="sessionOrganization1"
												th:value="${session.ORGANIZATION}" />
											<div id="myGridAccountStatement"
												style="height: 80vh; width: 100%;" class="ag-theme-alpine"></div>
										</div>

										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
										<input type="hidden" id="docUniqueId" />

									</div>

								</div>

								<!--Right Sec Start-->
								<div class="col-md-12 pd-l tab-transition d-none"
									id="accountStatementDetailsDiv">
									<div class="out-box" id="rightSideDiv">

										<!-- <div class="btn btn-primary max-btn">
											<i class="fas fa-arrows-alt"></i>
										</div> -->

										<!--Right Inner Tab Start-->
										<ul
											class="nav nav-pills newtab mb-20 tablistUl navbarSticky d-none"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" id="manageTab" href="#manageControl"
												onclick="tabAccess('manageControl')">Account Statement
													Details</a></li>
										</ul>

										<!-- Tab panes -->

										<div class="tab-content">
											<div id="manageControlAccountStatement"
												class="tab-pane active operational-tab d-block">

												<div class="mb-2 operationBtnSticky">
													<table class="table table-bordered mb-0" width="100%">
														<tr valign="middle" class="operation-row d-none">
															<td class="">
																<div class="row justify-content-between">
																	<div class="col-md-12 bank-reportinfo ">
																		Ledger Id:&nbsp;&nbsp;<span id="voucherNumber"></span>
																	</div>

																</div>
															</td>
															<td></td>
														</tr>
													</table>
												</div>
												<div class="innercontent">

													<div class="ledgertable" id="monthlyShowingTable">
														<!-- Start -->
														<div class=" d-flex justify-content-between mb-2">

															<div class="form-group">
																<p>
																	<input type="hidden" id="ledgerId"> <input
																		type="hidden" id="ledgerName">
																</p>
															</div>

															<div class="form-group">
																<input type="button" id="filter" value="Search"
																	class="fltbtn" onclick="viewSearchData()" readonly
																	style="opacity: 0">
															</div>

															<!-- <div class="btn-hs">
																<button type="button" onclick="backPage()"
																	class="d-inline-flex align-items-center  mb-2 backbtn">
																	Back</button>
															</div> -->

															<div class="btn-hs"></div>
														</div>

														<div class="form-group">
															<button
																class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																type="button" onclick="accountStatementBackBtn()"
																style="margin-bottom: 5px; float: right;">
																<i class="bi bi-arrow-90deg-left"></i>
															</button>

														</div>


														<table class="table table-bordered table-striped"
															id="shtable">

															<thead>
																<tr align="center" style="background: #f5f6f7;">

																	<th width="50%" style="vertical-align: middle;"><strong
																		style="color: #212529;">Particulars </strong></th>


																	<th width="50%" colspan="3">
																		<table width="100%" class="newwht">
																			<tr>
																				<td colspan="3">
																					<p style="color: #212529; margin-bottom: 0px;">
																						Accounting Reports-<span id="AccLedgerName"></span><br>
																						<span id="statementYear"></span>
																				</td>

																			</tr>

																			<tr>
																				<td width="30%" colspan="2">
																					<table width="100%" class="cartbl">
																						<tr>
																							<td colspan="2" style="color: #212529;">Transactions</td>

																						</tr>
																						<tr
																							style="border-bottom: 1px solid #212529 !important;">
																							<td width="50%" style="color: #212529;">Debit</td>
																							<td width="50%"
																								style="color: #212529; border-left: 1px solid white !important;">Credit</td>
																						</tr>
																					</table>

																				</td>

																				<td width="20%" valign="middle"
																					style="color: #212529; border-left: 1px solid white !important;">Closing
																					Balance</td>
																			</tr>

																		</table>

																	</th>

																</tr>
															</thead>

															<tbody id="montlyReport">
																<tr align="left" valign="top">

																	<td><a>Opening Balance </a></td>
																	<td width="15%"></td>
																	<td width="15%"></td>
																	<td width="20%"></td>
																</tr>

															</tbody>


														</table>

													</div>

													<div class="ledgertable" id="demo">

														<div class=" d-flex justify-content-center mb-2 px-3"
															style="gap: 1rem">
															<div class="form-group">
																<label class="font-design">FROM DATE</label>
																<div class="form-group calendar_box">
																	<input type="text" id="fromDateAccountStatement"
																		placeholder="From Date" class="form-control"
																		style="color: black;"> <i
																		class="ti-calendar picker_calendar"
																		id="toDateCalendarAccountStatement"
																		style="top: 12px; right: 5px;"></i>
																</div>
															</div>

															<div class="form-group">
																<label class="font-design">TO DATE</label>
																<div class="form-group calendar_box">
																	<input type="text" id="toDateAccountStatement"
																		placeholder="To Date" class="form-control"
																		style="color: black;"> <i
																		class="ti-calendar picker_calendar"
																		id="toDateCalendar2AccountStatement"
																		style="top: 12px; right: 5px;"></i>
																</div>
															</div>

															<div class="operation-icons-div">

																<div class="form-group">

																	<button
																		class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																		type="button" onclick="viewSearchData()">
																		<i class="bi bi-search " id="filterBtnId"></i>
																	</button>

																</div>
																<div class="form-group">
																	<button
																		class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																		type="button" onclick="downAccountStatementPdf()">
																		<i class="bi bi-file-earmark-pdf-fill "
																			id="downAccountStatementPdfId"></i>
																	</button>

																</div>

																<div class="form-group">
																	<button
																		class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																		type="button" onclick="downloadExcelData()">
																		<i class="bi bi-file-earmark-spreadsheet "
																			id="downloadExcelId"></i>
																	</button>

																</div>

																<div class="form-group">
																	<button
																		class="btn btn-primary operation-btn  operation-btn-active edit-btn bankTransOperationBtn"
																		type="button" onclick="tabBackBtn()"
																		style="margin-top: 27px;">
																		<i class="bi bi-arrow-90deg-left"></i>
																	</button>

																</div>
															</div>
														</div>




														<table
															class="table table-bordered table-striped AccountstatementTable">
															<thead>
																<tr align="center" style="background: #f5f6f7;"
																	valign="middle">
																	<th width="10%"><strong>Date </strong></th>
																	<th width="20%"><strong>Particulars </strong></th>
																	<th width="15%"><strong>Voucher Type </strong></th>
																	<th width="20%"><strong>Voucher No. </strong></th>
																	<th width="15%"><strong>Debit Amount</strong></th>
																	<th width="20%"><strong>Credit Amount</strong></th>

																</tr>
															</thead>

															<tbody id="monthlyDetails">

															</tbody>

														</table>
													</div>
												</div>

											</div>

										</div>

									</div>

								</div>
							</div>

						</div>

					</div>
				</div>

			</div>
		</div>
	</div>
</body>
</html>
