let arr = [];
function openSection(e,grp_id,grp_lvl) {
	e.preventDefault();
	var id = e.target.id;
	$("#"+id).toggleClass('fa fa-plus fa fa-minus');
	
	let className = $("#"+id).attr('class');
	
	if(className == 'fa fa-minus') {
		$("#"+id).find(".dropdown-emp").css("display","block");
		$("#li_"+id+"").children(".dropdown-emp").show();
		
		if(grp_lvl == 'L1') {
			$("#li_"+id+"").addClass('bg-white');
		}
		
	} else {
		$("#li_"+id+"").children(".dropdown-emp").hide();
		if(grp_lvl == 'L1') {
			$("#li_"+id+"").removeClass('bg-white');
		}
	}
    
    $("#"+id).parent().nextAll().slideToggle();
    
    if(!arr.includes(grp_id)) {
    	arr.push(grp_id)
    	openNode(grp_id,grp_lvl);
    }
    
}

function setFinancialYearAndDates() {
    var today = new Date();
    var currentYear = today.getFullYear();
    var currentMonth = today.getMonth() + 1;
    var fromDate, toDate, financialYear;

    if (currentMonth >= 4) {
        fromDate = `01-04-${currentYear}`;
        toDate = `31-03-${currentYear + 1}`;
        financialYear = `${currentYear}-${currentYear + 1}`;
    } else {
        fromDate = `01-04-${currentYear - 1}`;
        toDate = `31-03-${currentYear}`;
        financialYear = `${currentYear - 1}-${currentYear}`;
    }

    //$("#fromDate").val(fromDate);
    //$("#toDate").val(toDate);
    
    console.log("financialYear-->",financialYear);
    $("#orderStatusFilter").val(financialYear);

    updateDatePickers(currentYear - (currentMonth < 4 ? 1 : 0), currentYear + (currentMonth >= 4 ? 1 : 0));
}


function dateFormatter(date){
	
	var dateStr2 = date; 
	var dateParts2 = dateStr2.split("-"); 

	
	var formattedFormDate = `${dateParts2[2]}-${dateParts2[1]}-${dateParts2[0]}`;
	
	return formattedFormDate;
}



function updateDatePickers(yearStart, yearEnd) {
    var minDate = `01-04-${yearStart}`;
    var maxDate = `31-03-${yearEnd}`;

    var minDateParsed = parseDate(minDate);
    var maxDateParsed = parseDate(maxDate);

    $("#toDateCalendar").datetimepicker('destroy').datetimepicker({
        format: 'Y-m-d',  
        closeOnDateSelect: true,
        timepicker: false,
        minDate: minDateParsed,  
        maxDate: maxDateParsed   
    }).on("change", function() {
        $('#fromDate').val(dateFormatter($(this).val()));  
    });


    $('#fromDate').blur(function() {
        $("#toDateCalendar").val(dateFormatter($(this).val()));
    });
    $("#toDateCalendar2").datetimepicker('destroy').datetimepicker({
        format: 'Y-m-d',  
        closeOnDateSelect: true,
        timepicker: false,
        minDate: minDateParsed, 
        maxDate: maxDateParsed   
    }).on("change", function() {
        $('#toDate').val(dateFormatter($(this).val()));  
    });

    
    $('#toDate').blur(function() {
        $("#toDateCalendar2").val($(this).val());
    });
}

function handleDropdownChange() {
    var datee = $("#orderStatusFilter").val();

}

function amountFormatter(value) {
    if (value !== null && value !== undefined) {
        var parts = value.toString().split('.');
        var integerPart = parts[0];
        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
        return formattedIntegerPart + decimalPart;
    } else {
        return '';
    }
}

							    + '<td class="alnright"><strong>₹' + amountFormatter(parseFloat(Math.abs(creditClosing)).toFixed(2))+ '</strong></td>'
							    + '</tr>';

							$("#childGrpLedgerData").append(closingBalBdy);
				
						}
					
				
				else{
					for(var i=1;i<response.body.length;i++){
						var rowColorStyle = i % 2 === 0 ? 'background-color: #ffffff;' : 'background-color: #dadada;';
						var bdy = '<tr align="left" valign="top" style="' + rowColorStyle + '">'
							+'<td style="text-align: left;">'+response.body[i].voucherDate+'</td>'
							+'<td style="text-align: left;">'+response.body[i].ledgerName+'</td>'
							+'<td style="text-align: left;">'+response.body[i].voucherType+'</td>'
							+'<td class="alnright">₹'+amountFormatter(parseFloat(response.body[i].debitAmount).toFixed(2))+'</td>'
							+'<td class="alnright">₹'+amountFormatter(parseFloat(response.body[i].creditAmount).toFixed(2))+'</td>'
							+'</tr>';
					  $("#childGrpLedgerData").append(bdy);		
					  
					}
					var totalDebit = response.body
				    .filter(entry => entry.debitAmount && !isNaN(parseFloat(entry.debitAmount))) 
				    .reduce((sum, entry) => sum + parseFloat(entry.debitAmount), 0);

				
				var totalCredit = response.body
				    .filter(entry => entry.creditAmount && !isNaN(parseFloat(entry.creditAmount))) 
				    .reduce((sum, entry) => sum + parseFloat(entry.creditAmount), 0);
					
					var openingBalanceText = 'Opening Balance:';
					
					var openingAmount = parseFloat(response.body[0].openingBalance);
					
					var debitOpening = '0.00';
					var creditOpeing = '0.00';
					
					if(openingAmount > 0){
						
						debitOpening = openingAmount;
					}
					else{
						creditOpeing = openingAmount;
					}
					
					

					
					var openingBalance = '<tr align="center" valign="top">'
					    + '<td colspan="1" style="text-align: right; border: none!important;opacity: 0;     border-bottom: 1px solid #00000000  !important;"><strong></strong></td>'
					    + '<td colspan="1" style="text-align: right; border: none!important;opacity: 0;     border-bottom: 1px solid #00000000  !important;"><strong></strong></td>'
					    + '<td colspan="1" style="text-align: right;"><strong>' + openingBalanceText + '</strong></td>'
					    + '<td class="alnright"><strong>₹' + amountFormatter(parseFloat(Math.abs(debitOpening)).toFixed(2)) + '</strong></td>'
					    + '<td class="alnright"><strong>₹' + amountFormatter(parseFloat(Math.abs(creditOpeing)).toFixed(2)) + '</strong></td>'
					    + '</tr>';
					
					    $("#childGrpLedgerData").append(openingBalance);
					
					var totalbdy = '<tr align="center" valign="top">'
						  + '<td colspan="1" style="text-align: right; border: none!important;opacity: 0; border-bottom: 1px solid #00000000  !important;"><strong></strong></td>'
						  + '<td colspan="1" style="text-align: right; border: none!important;opacity: 0; border-bottom: 1px solid #00000000  !important;"><strong></strong></td>'
						
					    + '<td colspan="1" style="text-align: right;"><strong>Total:</strong></td>'
					    + '<td class="alnright"><strong>₹' + amountFormatter(totalDebit.toFixed(2)) + '</strong></td>'
					    + '<td class="alnright"><strong>₹' + amountFormatter(totalCredit.toFixed(2)) + '</strong></td>'
					    + '</tr>';
					    
					$("#childGrpLedgerData").append(totalbdy);
					
					//var closingBalance = parseFloat(totalCredit).toFixed(2) - parseFloat(totalDebit).toFixed(2);
					
					var closingBalance = openingAmount + parseFloat(totalDebit) - parseFloat(totalCredit);
				closingBalance = closingBalance.toFixed(2);

					
					var closingBalanceText = 'Closing Balance:';
					var debitClosing = '0.00';
					var creditClosing = '0.00';
					
					
					if(closingBalance > 0){
						
					   debitClosing = closingBalance;
					}
					else{
						creditClosing = closingBalance;
					}


					var closingBalBdy = '<tr align="center" valign="top">'
					    + '<td colspan="1" style="text-align: right; border: none!important;opacity: 0;     border-bottom: 1px solid #00000000  !important;"><strong></strong></td>'
					    + '<td colspan="1" style="text-align: right; border: none!important;opacity: 0;     border-bottom: 1px solid #00000000  !important;"><strong></strong></td>'
					    + '<td colspan="1" style="text-align: right;"><strong>' + closingBalanceText + '</strong></td>'
					    + '<td class="alnright"><strong>₹' + amountFormatter(parseFloat(Math.abs(debitClosing)).toFixed(2)) + '</strong></td>'
					    + '<td class="alnright"><strong>₹' + amountFormatter(parseFloat(Math.abs(creditClosing)).toFixed(2))+ '</strong></td>'
					    + '</tr>';

					$("#childGrpLedgerData").append(closingBalBdy);
				}
				
				
			}
		}
	})
