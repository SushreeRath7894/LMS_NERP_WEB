<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>



<script src="../javaScript/account/manage-ledger.js"></script>

<link rel="stylesheet" href="../assets/css/account/manage-ledger.css" />
<!--<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
 <link rel="stylesheet"
	href="../css/production-plan/rmpm-requisition.css"> -->

</head>
<style>
</style>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="d-flex flex-column flex-lg-row">

								<!--Left Sec Start-->
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between bdr-line p-2">
											<div class="col-md-8 col-12">
												<div class="d-flex search-sec">
													<input class="form-control me-2" type="text"
														placeholder="Search" id="quickFilter" autocomplete="off"
														onkeyup="SearchUserInput(event)">
													<button class="btn go-btn" type="button"
														onclick="onQuickFilterChanged()">Go</button>
													&nbsp;
													<button class="btn go-btn w-auto" type="button"
														onclick="resetBtn()">Reset</button>
												</div>
											</div>
											<div class="col-md-2 d-flex justify-content-end flxwrap">
												<button class="btn btn-primary max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>
											</div>

										</div>

										<div class="card m-2">
											<div class="font-design" id="totalReq">
												Ledger LIST(<span></span>)
											</div>
											<div id="myGrid" style="width: 100%; height: 100vh;"
												class="ag-theme-alpine"></div>
										</div>

									</div>

								</div>

								<!--Left Sec End-->



								<!--Right Sec Start-->
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box" id="rightSideDiv">


										<div
											class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">
											<button class="btn btn-primary max-btn" id="collapseButtonL1"
												type="button" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>

											<!--Right Inner Tab Start-->
											<div class="d-flex gap-2">
												<ul class="nav nav-pills newtab  tablistUl" role="tablist">
													<li class="nav-item wd-11"><a class="nav-link active"
														data-bs-toggle="pill" id="userGroupNav"
														href="#groupCreation" onclick="createWorkspace()">Ledger
															Information</a></li>

												</ul>
											</div>
										</div>


										<!-- Tab panes -->

										<div class="tab-content flex-fill h-25">
											<!-- Create Workspace -->
											<div id="groupCreation" class="tab-pane active h-100">

												<div class="requisition-tbl d-flex flex-column h-100">

													<div class="mb-0 m-2">
														<table class="table table-bordered mb-0" width="100%">
															<tr valign="middle">
																<td width="40%"><strong><div
																			class="col-md-12 requisition_ids_text">
																			<span id="ledgerNameText" class="truncate-text"></span>
																			<span id="leadgerId" class="hiddenText"></span>
																		</div></strong></td>
																<!-- <td width="10%">Male</td>
																<td width="10%">45</td> -->
																<td>
																	<div class="d-flex justify-content-end flxwrap">
																		<div class="mr-2">
																			<button
																				class="btn btn-primary operation-btn edit-btn  d-none"
																				type="button" id="add-btn" onclick="addLedger()">Add</button>
																		</div>
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn d-none"
																				type="button" id="ledger_edit_btn"
																				onclick="editLedger()">Edit</button>
																		</div>

																		<div class="mr-2" id="parentSaveBtn">
																			<button class="btn btn-primary edit-btn d-none"
																				onclick="addLedgerInfo()" id="ledger_save_btn"
																				type="button">Save</button>
																		</div>
																		<div class="mr-2" id="parentSaveBtn">
																			<button class="btn btn-primary edit-btn d-none"
																				onclick="ledgerCancelBtnFunction()"
																				id="ledger_cancel_btn" type="button">Cancel</button>
																		</div>
																		<div class="mr-2" id="parentSaveBtn">
																			<button class="btn btn-primary edit-btn d-none"
																				onclick="deleteLedger()" id="ledger_delete_btn"
																				type="button">Delete</button>
																		</div>

																	</div>

																</td>
															</tr>
														</table>
													</div>
													<div class="crd card p-2 m-2">
														<form>
															<div class="content-header">
																<!-- Modal Header -->
																<div class="form-modal-header"></div>
																<div class="row">
																	<div class="col-md-12 d-flex justify-content-end"
																		id="notificationBox" style="margin: 4px 0px"></div>
																</div>
																<div class="innercontent">

																	<!-- <div class="row"> -->
																	<div class="row">


																		<div class="col-md-6">
																			<div class="form-group">
																				<label>Ledger Name</label> <input type="text"
																					class="form-control" id="ledgername"
																					placeholder="Ledger Name" autocomplete="off">
																				<span id="errmsg_fname"></span>
																			</div>
																		</div>




																		<div class="col-md-6">
																			<div class="autocomplete"
																				style="width: 100% !important; margin-top: 0px;">
																				<div class="form-group">
																					<label>Under Group</label> <input type="text"
																						id="groupName" placeholder="Under Group"
																						class="form-control" onkeyup='getGroupList();'
																						autocomplete="off"> <input type="hidden"
																						id="undergroupId"> <span
																						id="errmsg_producn"></span>
																				</div>
																			</div>
																			<div id="suggesstion-box11_" class="sugg-cls"></div>
																		</div>


																	</div>
																	<div id="main" class="mt-1">

																		<!-- 	collapse for Contact InformationStart here -->
																		<div class="accordion-item">
																			<h2 class="accordion-header" id="headingOne">
																				<button class="accordion-button" type="button"
																					data-bs-toggle="collapse"
																					data-bs-target="#collapseOne" aria-expanded="false"
																					aria-controls="collapseOne">Mailing
																					Details</button>
																			</h2>
																			<div id="collapseOne"
																				class="accordion-collapse collapse show"
																				aria-labelledby="headingOne"
																				data-bs-parent="#accordionExample">
																				<div class="accordion-body">
																					<div class="row">

																						<div class="col-md-4">
																							<div class="form-group">
																								<label>E-mail</label> <input type="text"
																									class="form-control" id="ledgerEmail"
																									placeholder="E-mail" autocomplete="off">
																								<span id="errmsg_address1"></span>
																							</div>
																						</div>

																						<div class="col-md-4">
																							<div class="form-group">
																								<label>Address 1</label> <input type="text"
																									class="form-control" id="ledgerAddress1"
																									placeholder="Address 1" autocomplete="off">
																								<span id="errmsg_address2"></span>
																							</div>
																						</div>

																						<div class="col-md-4">
																							<div class="form-group">
																								<label>Address 2</label> <input type="text"
																									class="form-control" id="ledgerAddress2"
																									placeholder="Address 2" autocomplete="off">
																								<span id="errmsg_address2"></span>
																							</div>
																						</div>

																						<div class="col-md-4">
																							<div class="form-group">
																								<label>Address 3</label> <input type="text"
																									class="form-control" id="ledgerAddress3"
																									placeholder="Address 3" autocomplete="off">
																								<span id="errmsg_address2"></span>
																							</div>
																						</div>


																						<div class="col-md-4">
																							<div class="form-group">
																								<label> Country</label>
																								<div class="select">
																									<select id="ledgerCountry"
																										onchange="getStateList();"
																										class="form-control">
																										<option value="">Select Country</option>
																										<option th:each="c,iter:${countryList}"
																											th:value="${c.key}" th:text="${c.name}"></option>

																									</select>
																								</div>
																								<span id="errmsg_country"></span>
																							</div>
																						</div>

																						<div class="col-md-4">
																							<div class="form-group">
																								<label> State</label>

																								<div class="select">
																									<select id="ledgerState" class="form-control"
																										onchange="stateCode()">
																										<option value="">Select State</option>
																										<option th:each="c,iter:${stateList}"
																											th:value="${c.key}" th:text="${c.name}"></option>

																									</select>
																								</div>
																								<span id="errmsg_state"></span>
																							</div>
																						</div>
																						<div class="col-md-4">
																							<div class="form-group">
																								<label>Pin Code</label> <input type="text"
																									class="form-control" id="ledgerPinCode"
																									placeholder="Pin Code" autocomplete="off">
																								<span id="errmsg_locality"></span>
																							</div>
																						</div>

																						<div class="col-md-4">
																							<div class="form-group">
																								<label>Mobile</label> <input type="text"
																									class="form-control" id="ledgerMobile"
																									placeholder="Mobile" autocomplete="off">
																							</div>
																						</div>


																					</div>

																				</div>
																			</div>
																		</div>


																	</div>

																	<div class="accordion-item">
																		<h2 class="accordion-header" id="headingTwo2">
																			<button class="accordion-button" type="button"
																				data-bs-toggle="collapse"
																				data-bs-target="#collapseTwo2" aria-expanded="true"
																				aria-controls="collapseTwo2">Tax
																				Registration Details</button>
																			<!-- 	<div class="btnbill">
							<button class="btn btn-primarynew" onclick="copyAsBillingAdd()">Copy As Shipping Address</button>
							</div> -->
																		</h2>
																		<div id="collapseTwo2"
																			class="accordion-collapse collapse show"
																			aria-labelledby="headingTwo2"
																			data-bs-parent="#accordionExample">
																			<div class="accordion-body">

																				<div class="row">

																					<div class="col-md-4">
																						<div class="form-group">
																							<label>Pan | IT No</label> <input type="text"
																								class="form-control" id="ledgerPan"
																								onblur="checkPan(this.id)" placeholder="PAN"
																								autocomplete="off"> <span
																								id="Panvalidate"></span>
																						</div>
																					</div>

																					<div class="col-md-4">
																						<div class="form-group">
																							<label>GST</label> <input type="text"
																								class="form-control"
																								oninput="turnCapital(this.id)" id="ledgerGst"
																								placeholder="GST" autocomplete="off">
																						</div>
																					</div>


																				</div>


																			</div>
																		</div>
																	</div>

																	<div id="main">

																		<!-- 	collapse for Contact InformationStart here -->
																		<div class="accordion-item">
																			<h2 class="accordion-header" id="headingOne">
																				<button class="accordion-button" type="button"
																					data-bs-toggle="collapse"
																					data-bs-target="#collapseOne" aria-expanded="false"
																					aria-controls="collapseOne">Other Details</button>
																			</h2>
																			<div id="collapseOne"
																				class="accordion-collapse collapse show"
																				aria-labelledby="headingOne"
																				data-bs-parent="#accordionExample">

																				<div class="accordion-body">
																					<div class="row">
																						<div class="col-md-4">
																							<div class="form-group">
																								<label for="openinbalanceDate"
																									id="openingBalanceLabel">Opening Balance</label>
																								<input type="text" id="openinbalanceDate"
																									placeholder="Opening Balance"
																									class="form-control" autocomplete="off">
																							</div>
																						</div>
																						<div class="col-md-4">
																							<div class="form-group">
																								<label>Ledger Type</label>
																								<div class="select">
																									<select id="ledgerType" class="form-control">
																										<option value="">Select</option>
																										<option th:each="c,iter:${ledgerTypeList}"
																											th:value="${c.key}" th:text="${c.name}"></option>
	
																									</select>
																								</div>
																								<span id="errmsg_country"></span>
																							</div>
																						</div>
																					</div>
																				</div>

																			</div>
																		</div>
																	</div>
																</div>
															</div>
														</form>
													</div>
												</div>
											</div>
										</div>

									</div>

								</div>
								<!--Right Sec End-->
							</div>
							<!--Tabbination 1 End-->

						</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</body>
</html>
