    <script>
      var masterData = [];

      var columnDefs1 = [
        {
          headerCheckboxSelection: false,
          checkboxSelection: true,
          width: 8,
          sortable: false,
          filter: false,
          resizable: true,
          pinned: 'left',
        },
        {
          headerName: "Name",
          field: "name",
          flex: 1,

        }, {
          headerName: "Report Order",
          field: "ReportOrder",
          flex: 2,
          hide: true
        },
        {
          headerName: "ReportModuleId",
          field: "ReportModuleId",
          flex: 1,
          hide: true
        }
      ];
      var gridOptions1 = {
        columnDefs: columnDefs1,
        defaultColDef: {
          sortable: true,
          filter: true,
          resizable: true,
          width: 195,
          height: 10
        },
        rowSelection: 'single',
        rowMultiSelectWithClick: true,
        suppressRowClickSelection: true,
        onRowClicked: (event) => {
          const selectedNode = event.node;
          if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
          }
        },
        onSelectionChanged: onSelectionDesignation1,
        getRowNodeId: function (data) {
          return data.ReportOrder;
        }
      };

      $(document).ready(() => {
        var gridDiv1 = document.querySelector('#myGrid1');
        new agGrid.Grid(gridDiv1, gridOptions1);
        $('.ag-center-cols-container').addClass('nav');
        getAllData();
      })

      function getAllData() {
        agGrid.simpleHttpRequest({
          url: "reports-get-details"
        }).then(data => {
          let jsonData = JSON.parse(data.body);
          console.log("jsonData-->", jsonData);
          masterData = jsonData.AccountReports;
          appendDataToMasterSection(null);
        });
      }

      function onSelectionDesignation1() {

        const selectedNodes = gridOptions1.api.getSelectedNodes();
        const selectedData = selectedNodes.map(node => node.data);

        console.log("selectedData-->", selectedData);


        const selected = selectedData[0];

        if (!selected) {
          console.warn('No fragment name found.');
          return;
        }

        const fragmentName = selected.ReportFragmentName;
        const htmlFile = selected.ReportHtmlName;
        focusTab(fragmentName);
      }

      function searchMasterDataFunction() {
        let searchvalue = $("#searchMasterData").val();
        appendDataToMasterSection(searchvalue);
      }

      function resetMasterDataFunction() {
        $("#searchMasterData").val('');
        appendDataToMasterSection(null);
      }

      function appendDataToMasterSection(searchvalue) {

        let searchedMasterData = masterData;
        console.log("in appendData Master-->", searchedMasterData);
        if (searchvalue)
          searchedMasterData = masterData.filter(f => f.name == searchvalue);
        searchedMasterData.sort((a, b) => a.ReportOrder - b.ReportOrder);
        gridOptions1.api.setRowData(searchedMasterData);
        let rowId = searchedMasterData[0].ReportOrder;
        gridOptions1.api.getRowNode(rowId).setSelected(true);
        let id = searchedMasterData[0].name ? (searchedMasterData[0].name).replace(' ', '') : "Designation";
        focusTab(id);
      }

      function focusTab(id) {

        const allTabPanes = document.querySelectorAll('#reportContainer .tab-pane');

        allTabPanes.forEach(pane => {
          pane.classList.remove('active', 'show');
        });

        const targetPane = document.getElementById(id);
        if (targetPane) {
          targetPane.classList.add('active', 'show');
        } else {
          console.error("No tab pane found for ID:", id);
        }
      }


    </script>
