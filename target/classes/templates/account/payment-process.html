		function viewPayment(mode){
			var fromDate =  $("#fromDate").val();

		function amountFormatter(value) {
		    if (value !== null && value !== undefined) {
		        var parts = value.toString().split('.');
		        var integerPart = parts[0];
		        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
		        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
		        return formattedIntegerPart + decimalPart;
		    } else {
		        return '';
		    }
		}

		function submitJournal(dataset) {
			swal.fire({
				title: "Are you sure want to Submit?",
				text: "Once Submited,Can't revert back !",
				type: "warning",
				showCancelButton: true,
				confirmButtonColor: "#264c82",
				confirmButtonText: "Submit",
				showLoaderOnConfirm: true,
				reverseButtons: true,
				confirmButtonAriaLabel: 'Thumbs up, great!',
				cancelButtonText: 'Cancel',
				cancelButtonAriaLabel: 'Thumbs down',
				preConfirm: () => {
					return new Promise((resolve) => {
						setTimeout(() => {
							//console.log("Doing async operation");
							resolve()
						}, 3000)
					})
				}
			}).then((result) => {
				if (result.value) {
					$.ajax({
						type: "POST",
						url: "view-account-payment-voucher-add",
						dataType: "json",
						contentType: "application/json",
						data: JSON.stringify(dataset),
						success: function (response) {
							if (response.message == "Success") {
								swal({
									title: "Voucher Status",
									text: "Payment voucher created successfully.",
									type: "success",
								}).then(function () {
									window.location.href = "/account/payment-process";
								})
							} else {
								swal({
									title: response.code,
									text: response.message,
									type: "warning"
								})
							}
						}, error: function (response) {
							swal(response.code);
						}
					}) //ajax ends
				}
			})//swal function block ends
		}//submit function ends

			function  indianCurreny(value) {
				console.log("value",value);
			    if (value !== null && value !== undefined) {
			        //value = value.replace(/[^\d.,]/g, '');

			        var parts = value.toString().split('.');
			        var integerPart = parts[0].replace(/,/g, '');
			        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
			        
			        if(decimalPart.length>3){
			        	decimalPart = decimalPart.substring(0,3);
			        }

			        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
			        return formattedIntegerPart + decimalPart;
			    } else {
			        return '';
			    }
			}
