<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<title>Welcome To NERP</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../css/his-css/floor-management.css">
<script src="/javaScript/asset/floor-management.js"></script>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition">

			<div class="d-flex">
				<div class="maincontentsec">
					<div id="main_content">

						<!-- Tab panes -->


						<!--Tabbination 1 Start-->
						<div id="#buildingManage1" class="tab-pane active">
							<div class="d-flex flex-column flex-lg-row">

								<!--Left Sec Start-->
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between p-2 bdr-line">

											<div class="col-md-8 col-12">
												<div class="d-flex search-sec position-relative gap-2">
													<input class="form-control" type="text"
														placeholder="Search" id="quickFilter" autocomplete="off">
													<button class="btn go-btn" type="button"
														onclick="onQuickFilterChanged()">Go</button>
													<button class="btn go-btn" type="button" onclick="reset()">Reset</button>
												</div>
											</div>


											<div class="col-md-2 d-flex justify-content-end">
												<button class="btn btn-primary max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>
											</div>

										</div>
										<div class="card m-2 p-2">
											<div id="myGridFloor" style="width: 100%; height: 100vh;"
												class="ag-theme-alpine"></div>
										</div>
									</div>
								</div>

								<!--Left Sec End-->

								<!--Right Sec Start-->
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box">
										<div
											class="d-flex justify-content-between align-items-center bdr-line p-2">
											<!--Right Inner Tab Start-->
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item" id='floorTab'
													onclick="nextTab('floorTab')"><a
													class="nav-link active" data-bs-toggle="pill"
													href="#floorDets">Floor Details</a></li>
												<li class="nav-item" id='roomTab'
													onclick="nextTab('roomTab')"><a class="nav-link "
													data-bs-toggle="pill" href="#roomLayout">Room Layout</a></li>
											</ul>

											<button class="btn max-btn" id="collapseButtonL1"
												type="button" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>
										</div>

										<div class="tab-content flex-fill">
											<!-- TAB PANEL		====		Building Details	 -->
											<div id="floorDets" class="tab-pane fade show active h-100">
												<div
													class="requisition-tbl d-flex flex-column h-100 gap-2 p-2">
													<!--<div class="p-2 pb-0">
                            <table class="table table-bordered mb-0" width="100%">
                              <tbody>
                              <tr valign="middle">
                                <td width="80%" class="align-middle"><span
                                     id="floorId1" class="fnt-wt"></span></td>
                                <td>
                                  <div class="d-flex justify-content-end">
                                    <div class="mr-2">
                                      <button class="btn btn-primary edit-btn" type="button" id="addFloorDets" onclick="addFloorDets();">Add</button>
                                    </div>
                                    <div class="mr-0">
                                      <button class="btn btn-primary edit-btn" type="button" id="deleteFloorDets" onclick="deleteFloorDets();">Delete</button>
                                    </div>
                                  </div>
                                </td>
                              </tr>
                              </tbody>
                            </table>
                          </div>-->

													<div
														class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
														<div class="project-name flex-1">
															<span class="head-user-name" id="floorId1"></span>
														</div>
														<div class="d-flex gap-1 task-btn-sec">
															<button class="btn m-0 edit-btn" type="button" id="next"
																onclick="nextTab('roomTab')">
																<i class="fas fa-arrow-right"></i> Next</button>

														</div>
													</div>

													<div class="card p-2">
														<div
															class="d-flex w-100 justify-content-between align-items-center p-2 border rounded my-2">
															<div class="project-name flex-1">
																<span class="head-user-name" id="roomId"></span>
															</div>
															<div class="d-flex gap-1 task-btn-sec">
																<button class="btn go-btn br-m-btn"
																	data-bs-toggle="tooltip" data-bs-placement="top"
																	title="Add" id="addFloorDets" onclick="addFloorDets();">
																	<i class="fa fa-plus-square" aria-hidden="true"></i>
																</button>
																<button class="btn go-btn br-dis br-m-btn "
																	data-bs-toggle="tooltip" data-bs-placement="top"
																	title="Add" id="editFloorDets"
																	onclick="editFloorDets();">
																	<i class="fa fa-pencil-square" aria-hidden="true"></i>
																</button>
																<button class="btn go-btn br-dis br-m-btn"
																	data-bs-toggle="tooltip" data-bs-placement="top"
																	id="deleteFloorDets" onclick="deleteFloorDets();"
																	disabled>
																	<i class="fa fa-trash" aria-hidden="true"></i>
																</button>

																<button class="btn m-0 edit-btn br-s-btn" type="button"
																	id="saveFloorDets" onclick="saveFloorDets();">
																	<i class="fas fa-save"></i> Save</button>
																	
																<button class="btn m-0 edit-btn br-s-btn" type="button"
																	id="cancelFloorDets" onclick="cancelFloorDets();">
																	<i class="fas fa-times-circle"></i> Cancel</button>

															</div>
														</div>
														<div id="myGridFloorDets"
															style="width: 100%; height: 100vh;"
															class="ag-theme-alpine"></div>
														<div id="floorDetsForm">
															<form>
																<div class="row br-s-btn">
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Type<span class="mandatory">*</span></label> <input
																				type="text" class="form-control transparenttxtbox"
																				placeholder="Detail Type" id="type"> <input
																				type="hidden" id="floorTypeId"> <input
																				type="hidden" id="ftDBId">

																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Quantity<span class="mandatory">*</span></label>
																			<input type="number" min="1"
																				class="form-control transparenttxtbox"
																				placeholder="Quantity" id="quantity"
																				onkeypress="return event.charCode >= 48 && event.charCode <= 57 || event.charCode === 46"
																				oninput="validatePositiveNumber(this)">
																		</div>
																	</div>

																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Height (ft)<span class="mandatory">*</span></label>
																			<input type="number"
																				class="form-control transparenttxtbox"
																				placeholder="Height" id="height"
																				onkeypress="return event.charCode >= 48 && event.charCode <= 57 || event.charCode === 46"
																				oninput="validatePositiveNumber(this)">
																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Width (ft)<span class="mandatory">*</span></label>
																			<input type="number"
																				class="form-control transparenttxtbox"
																				placeholder="Width" id="width"
																				onkeypress="return event.charCode >= 48 && event.charCode <= 57 || event.charCode === 46"
																				oninput="validatePositiveNumber(this)">
																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Length (ft)<span class="mandatory">*</span></label>
																			<input type="number"
																				class="form-control transparenttxtbox"
																				placeholder="Length" id="length"
																				onkeypress="return event.charCode >= 48 && event.charCode <= 57 || event.charCode === 46"
																				oninput="validatePositiveNumber(this)">
																		</div>
																	</div>
																</div>
															</form>

														</div>
													</div>
												</div>
											</div>


											<div id="roomLayout" class="tab-pane fade show h-100">
												<div
													class="requisition-tbl d-flex flex-column h-100 gap-2 p-2">
									

													<div
														class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
														<div class="project-name flex-1">
															<span class="head-user-name" id="floorId"></span>
														</div>
														<button class="btn m-0 edit-btn" type="button" id="prev"
															onclick="nextTab('floorTab');">
															<i class="fas fa-arrow-left"></i> Prev</button>

													</div>

													<div class="card p-2">
														<div
															class="d-flex w-100 justify-content-between align-items-center p-2 border rounded my-2">
															<div class="project-name flex-1">
																<span class="head-user-name" id="roomId"></span>
															</div>
															<div
																class="d-flex justify-content-end gap-2 flex-wrap flex-1">
																<button class="btn go-btn br-m-btn"
																	data-bs-toggle="tooltip" data-bs-placement="top"
																	title="Add" id="addRoom" onclick="addRoom();">
																	<i class="fa fa-plus-square" aria-hidden="true"></i>
																</button>
																<button class="btn go-btn br-dis br-m-btn "
																	data-bs-toggle="tooltip" data-bs-placement="top"
																	title="Add" id="editRoom" onclick="editRoom();">
																	<i class="fa fa-pencil-square" aria-hidden="true"></i>
																</button>
																<button class="btn go-btn br-dis br-m-btn"
																	data-bs-toggle="tooltip" data-bs-placement="top"
																	id="deleteRoom" onclick="deleteRoomOnClick();" disabled>
																	<i class="fa fa-trash" aria-hidden="true"></i>
																</button>
																<button class="btn m-0 edit-btn br-s-btn" type="button"
																	id="saveRoom" onclick="saveRoom();">
																	<i class="fas fa-save"></i> Save</button>
																	
																<button class="btn m-0 edit-btn br-s-btn" type="button"
																	id="cancelRoom" onclick="cancelRoom();">
																	<i class="fas fa-times-circle"></i> Cancel</button>
															</div>
														</div>
														<div id="myGridRoom" style="width: 100%; height: 100vh;"
															class="ag-theme-alpine"></div>
														<div id="roomForm">

															<form>
																<div class="row br-s-btn">
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Room Code<span class="mandatory">*</span></label> <input
																				type="text" class="form-control transparenttxtbox"
																				placeholder="Space Code" id="roomCode"> <input
																				type="hidden" id="sectionRoomId"> <input
																				type="hidden" id="roomDBId"> <input
																				type="hidden" id="rFloorSlNo"> <input
																				type="hidden" id="rSectionSlNo">
																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Room Name<span class="mandatory">*</span></label>
																			<input type="text"
																				class="form-control transparenttxtbox"
																				placeholder="Space Name" id="roomName">
																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Room Type<span class="mandatory">*</span></label>
																			<div class="select">
																				<select id="roomType" class="transparenttxtbox">
																					<option value=''>Select</option>
																					<option th:each="c,iter:${roomTypeList}"
																						th:value="${c.key}" th:text="${c.name}"></option>
																				</select>
																			</div>
																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Bed Type <span class="mandatory">*</span></label>
																			<div class="select">
																				<select id="variationType" class="transparenttxtbox">
																					<option value=''>Select</option>
																					<option th:each="c,iter:${bedTypeList}"
																						th:value="${c.key}" th:text="${c.name}"></option>
																				</select>
																			</div>
																		</div>
																	</div>

																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Room Height (ft)</label> <input type="number"
																				class="form-control transparenttxtbox"
																				placeholder="Space Height" id="roomHeight"
																				onkeypress="return event.charCode >= 48 && event.charCode <= 57 || event.charCode === 46"
																				oninput="validatePositiveNumber(this)">
																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Room Width (ft)</label> <input type="number"
																				class="form-control transparenttxtbox"
																				placeholder="Space Width" id="roomWidth"
																				onkeypress="return event.charCode >= 48 && event.charCode <= 57 || event.charCode === 46"
																				oninput="validatePositiveNumber(this)">
																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Room Length (ft)</label> <input type="number"
																				class="form-control transparenttxtbox"
																				placeholder="Space Length" id="roomLength"
																				onkeypress="return event.charCode >= 48 && event.charCode <= 57 || event.charCode === 46"
																				oninput="validatePositiveNumber(this)">
																		</div>
																	</div>
																</div>
															</form>
														</div>
													</div>
												</div>
											</div>

										</div>

									</div>
									<!--Tabbination 1 End-->


								</div>
							</div>

						</div>
					</div>
				</div>
			</div>

			<div id="deletemodal" class="modal fade show" aria-modal="true">
				<div class="modal-dialog modal-confirm">
					<div class="modal-content">
						<div class="modal-header flex-column"></div>
						<div class="modal-body">
							<p>Do you really want to delete this room? This process
								cannot be undone.</p>
						</div>
						<div class="modal-footer justify-content-center"
							style="margin-top: 0px;">
							<button type="button" class="btn1" onclick="cancelModalBtn();">
							<i class="fas fa-times-circle"></i> Cancel</button>
							
							<button type="button" class="delete-btn"
								onclick="deleteRoomOnClick();">
								<i class="fa fa-trash" aria-hidden="true"></i> Delete</button>
							<!-- <img src="../assets/gif/loader.gif">  -->
						</div>
					</div>
				</div>
			</div>


			<div id="deleteFloorDetsModal" class="modal fade show"
				aria-modal="true">
				<div class="modal-dialog modal-confirm">
					<div class="modal-content">
						<div class="modal-header flex-column"></div>
						<div class="modal-body">
							<p>Do you really want to delete these details? This process
								cannot be undone.</p>
						</div>
						<div class="modal-footer justify-content-center"
							style="margin-top: -15px;">
							<input type="hidden" id="typeToDelete">
							<button type="button" class="btn1" data-dismiss="modal"
								onclick="cancelModalBtn();">
								<i class="fas fa-times-circle"></i> Cancel</button>
								
							<button type="button" class="delete-btn"
								onclick="deleteFloorDetsOnClick()">
								<i class="fa fa-trash" aria-hidden="true"></i> Delete</button>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</body>
</html>
