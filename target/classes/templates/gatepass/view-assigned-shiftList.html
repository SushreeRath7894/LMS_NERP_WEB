@-webkit-keyframes spin {

/* iconsss */

.blink-icon {
    display: inline-block;
    width: 10px;
    height: 10px;
    background-color: #00FF00;
    border-radius: 50%;
    margin-left: 10px; /* Adjust space between text and icon as needed */
    margin-bottom: 0px; 
    animation: blink 1s infinite;
}
.blink-iconss {
    display: none; /* Hidden by default */
}
@keyframes blink {
    0% {
        opacity: 1;
    }
    50% {
        opacity: 0;
    }
    100% {
        opacity: 1;
    }

	function updateShiftButtonColors() {
	    var now = new Date();
	    var currentMinutes = now.getHours() * 60 + now.getMinutes();

	    // Define shifts with priority (higher index means higher priority)
	    var shifts = [
	        {
	            id: '#shiftCsec',
	            start: 22 * 60 + 1, // 10:01 PM
	            end: 6 * 60         // 06:00 AM
	        },
	        {
	            id: '#shiftBsec',
	            start: 14 * 60 + 1, // 02:01 PM
	            end: 22 * 60        // 10:00 PM
	        },
	        {
	            id: '#shiftGsec',
	            start: 9 * 60,      // 09:00 AM
	            end: 18 * 60        // 06:00 PM
	        },
	        {
	            id: '#shiftAsec',
	            start: 6 * 60,      // 06:00 AM
	            end: 14 * 60        // 02:00 PM
	        }
	    ];

	    function isWithinRange(start, end) {
	        if (start < end) {
	            return currentMinutes >= start && currentMinutes <= end;
	        } else {
	            return currentMinutes >= start || currentMinutes <= end;
	        }
	    }
	    // Remove all active classes first
	    $('#shiftGsec').removeClass('shiftA shiftB');
		$('#shiftAsec').removeClass('shiftA shiftB');
		$('#shiftBsec').removeClass('shiftA shiftB');
		$('#shiftCsec').removeClass('shiftA shiftB');
		$('#shiftGicon').removeClass('blink-icon blink-iconss');
		$('#shiftAicon').removeClass('blink-icon blink-iconss');
		$('#shiftBicon').removeClass('blink-icon blink-iconss');
		$('#shiftCicon').removeClass('blink-icon blink-iconss');
		
		// Iterate over shifts based on priority
		for (var i = 0; i < shifts.length; i++) {
		    var shift = shifts[i];
		    var shiftId = shift.id; // e.g., #shiftGsec
		    var shiftIdentifier = shiftId.replace('#shift', '').replace('sec', '');
		    var iconId = shiftId.replace('sec', 'icon'); // e.g., #shiftGicon
		    // Check if within range
		    if (isWithinRange(shift.start, shift.end)) {
		        $(shiftId).addClass('shiftA');
		        $(iconId).addClass('blink-icon');
		    } else {
		        $(shiftId).addClass('shiftB');
		        $(iconId).addClass('blink-iconss');
		    }
		}
	}
	function changeFromDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	function view(sec) {
	    $('.loader-modal').show();
	    $("body").addClass("overlay");
		if(sec == 'G'){
			$("#shiftGsec").addClass("activepage");
			$("#shiftAsec").removeClass("activepage");
			$("#shiftBsec").removeClass("activepage");
			$("#shiftCsec").removeClass("activepage");
		}else if(sec == 'A'){
			$("#shiftGsec").removeClass("activepage");
			$("#shiftAsec").addClass("activepage");
			$("#shiftBsec").removeClass("activepage");
			$("#shiftCsec").removeClass("activepage");			
		}else if(sec == 'B'){
			$("#shiftGsec").removeClass("activepage");
			$("#shiftAsec").removeClass("activepage");
			$("#shiftBsec").addClass("activepage");
			$("#shiftCsec").removeClass("activepage");			
		}else if(sec == 'C'){
			$("#shiftGsec").removeClass("activepage");
			$("#shiftAsec").removeClass("activepage");
			$("#shiftBsec").removeClass("activepage");
			$("#shiftCsec").addClass("activepage");
		}
		agGrid.simpleHttpRequest({
			url : "employee-shift-list-view?sec=" + sec
		}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.details;
			$("#shiftGTotal").text(jsonData.counts.countShiftG);
			$("#shiftATotal").text(jsonData.counts.countShiftA);
			$("#shiftBTotal").text(jsonData.counts.countShiftB);
			$("#shiftCTotal").text(jsonData.counts.countShiftC);
			$("#shiftGGroup").text(jsonData.counts.groupG);
			$("#shiftAGroup").text(jsonData.counts.group1);
			$("#shiftBGroup").text(jsonData.counts.group2);
			$("#shiftCGroup").text(jsonData.counts.group3);
			if (allData == "" || allData == null || allData == 'null') {
				len = 0;
				var rowData = [];
				gridOptions.api.setRowData(rowData);
				$('#totalReq').find('span').html(len);
			} else {
				len = allData.length;
				gridOptions.api.setRowData(allData);
				$('#totalReq').find('span').html(len);
			}

			$(".loader").hide();
		    $("body").removeClass("overlay");

		});
	}
	var columnDefs = [{
		headerName : 'Employee Id',
		width : 120,
		field : "empId",
		pinned : 'left',
		cellClass: function(params) {
		    if (params.data.status === 'Present') {

		    } else if (params.data.status === 'Absent') {

		    }

	}, {

	}, {

		}
	}, {
		headerName : ' Shift',

		width : 85,
		cellStyle : {
			textAlign : 'center'
		}
	},{
		headerName : 'Designation',
		field : "designation",
		width : 130,
	},{
		headerName : 'Attendance',
		field : "status",
		width : 130,
		cellStyle : {
			textAlign : 'center'
		},
		cellRenderer: function(params) {
	        // Create a span element to hold the status text
	        var span = document.createElement('span');
	        span.innerHTML = params.value;
	        
	        // Apply color based on the status
	        if (params.value === 'Present') {
	            span.style.color = 'blue';
	        } else if (params.value === 'Absent') {
	            span.style.color = 'red';
	        }

	        return span;
	    }
	}, {
		headerName : 'Date',
		field : "date",
		width : 90,
		cellStyle : {

		}
	}, {
		headerName : 'Punch-In',

		width : 115,
	}, {

		field : "punchOut",
		width : 115,
	},{

		field : "employmentBy",
		width : 145,

	}, {

		field : "department",
		width : 125,
	}, ];

	var gridOptions = {
		columnDefs : columnDefs,
		rowSelection : 'single',
		groupSelectsChildren : true,
		suppressRowClickSelection : true,
		suppressAggFuncInHeader : true,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 190
		},
	};
	function ShowAgGrid(sec) {
		$('#atten').val('all')
		$("#sec").val(sec);
		view(sec);
	}

	function onQuickFilterChanged() {
		gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
	     len = gridOptions.api.getDisplayedRowCount();
			$('#totalReq').find('span').html(len);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";
		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	function changeDateFormatCurrent(inputDate) { 
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	function filterAttendance(){
		var group= $('#atten').val();
		if (group === 'all') {
			gridOptions.api.setFilterModel(null); // Clear all filters
	    } else {
	        var filterModel = gridOptions.api.getFilterModel();
	        filterModel['status'] = {
	            type: 'equals',
	            filter: group
	        };
	        gridOptions.api.setFilterModel(filterModel);
	        
	    }
		gridOptions.api.onFilterChanged();
	     len = gridOptions.api.getDisplayedRowCount();
			$('#totalReq').find('span').html(len);
	}
	function changeDateFormat(date) {
	    var dateParts = date.split("-");
	    return dateParts[2] + "-" + dateParts[1] + "-" + dateParts[0];
	}

</script>
