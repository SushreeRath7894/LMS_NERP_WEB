<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"></meta>
    <title>ORI Group Dispatch Checklist</title>
    <style>
        .text-center
        {
            text-align: center;
        }
        .main-tbl
        {
            width: 750px;
            margin: 0 auto;
        }
        td{
            padding: 3px;
        }
        .heading-txt
        {
            font-size: 24px;
            text-transform: uppercase;
        }
        .tbl-heading
        {
            font-size: 18px;
            font-weight: bold;
        }
        .tbl-text
        {
            padding: 5px;
            text-align: left;
            font-size: 14px;
        }
        .bottom-text
        {
            padding-top:0px;
            text-align: left;
            font-size: 18px;
            font-weight: bold;
        }
        .heading-txtu
        {
            font-size: 24px;
            text-decoration: underline;
        }
         @page {
			margin-top: 0px;
			margin-bottom: 0px;
			margin-left: 10px;
			margin-right: 10px;
		}
    </style>
</head>
<body>
<div class="main-tbl">
	<div class="text-center"><img th:src="${logo}" alt="Avatar"/> </div>
    <div class="text-center heading-txt"><span th:text="${orgName}"></span></div>
    <div class="text-center heading-txt">Receipts, Storage and Dispatch of Finished Goods</div>
    <div class="text-center heading-txtu">Truck Inspection Check List (Dispatch)</div><br></br>
    <div class="text-center">
        <table border="1" cellpadding="0" cellspacing="0" width="100%">
            <tr>
                <td colspan="5" align="left" height="60">
                    <div style="float:right; width: 300px; text-align:center;"><strong>Destination : </strong><span th:text="${destination}"> </span></div>
                    <div><strong>  Vehicle Number : </strong><span th:text="${vehicleNo}"> </span></div>
                    <div><strong>  Date of Dispatch : </strong><span th:text="${dispatchDate}"> </span></div>
                </td>
            </tr>
            <tr>
                <td class="tbl-heading" rowspan="2"  style="width:7%;" >S.No.</td>
                <td class="tbl-heading" rowspan="2">Description</td>
                <td class="tbl-heading" colspan="2">Observation</td>
                <td class="tbl-heading" rowspan="2">Remarks</td>
            </tr>
            <tr>
                <td class="tbl-heading">Yes</td>
                <td class="tbl-heading">No</td>
            </tr>
            <tbody th:if="${not #lists.isEmpty(checklist)}">
				<tr align="center" th:each="items: ${checklist}">
					<td th:text="${items.srNo}"></td>
					<td class="tbl-text" th:text="${items.description}"></td>
					<td th:if="${items.observation == 'Yes'}">Yes</td>
					<td th:if="${items.observation == 'Yes'}"></td>
					 <td th:if="${items.observation == 'No'}"></td>
               		 <td th:if="${items.observation == 'No'}">No</td>
               		 <td th:if="${items.observation == '' or items.observation == null}"></td>
               		  <td th:if="${items.observation == '' or items.observation == null}"></td>
					
					<td class="tbl-text"  th:text="${items.remarks}"></td>
			<!-- 		<td th:text="${items.ph}"></td>
					<td th:text="${items.dfr}"></td>
					<td th:text="${items.bd}"></td> -->
				</tr>
			</tbody>

            <tr>
                <td class="tbl-text" colspan="5" height="120" valign="middle">
                    <div class="bottom-text">
                        <div style="float: right; width:200px;"><span th:text="${driverName}"></span><br></br>Driver Signature</div>
                        <div class="d-flex justify-c87">
                        <span th:text="${createdBy}"></span><br></br>
                            Signature<br></br>
                            (Store Officer)
                        </div>
                    </div>
                </td>

            </tr>
        </table>
<div class="bottom-text">
    Ref . No- OBPL/STORE/001/A/01<br></br>
    Issu No - 01<br></br>
    Date of issue- <!-- 01/07/2024 --><span th:text="${dispatchDate}"></span>
</div>

    </div>
</div>
</body>
</html>
