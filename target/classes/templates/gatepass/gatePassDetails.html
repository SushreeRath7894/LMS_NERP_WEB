	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

							options = ''

			 $("#venderList").html(options); 
		}

	  var pending = parseFloat($("#pendingQuantity").val());
	  var tempVal = $("#" + fieldId).val().replace(/[^0-9 ]/g, '');

	  if (tempVal <= pending && tempVal > 0) {
	    $("#" + fieldId).val(tempVal);
	  } else {
	    if (tempVal == 0) {
	      $("#" + fieldId).val(null);
	    } else {
	      $("#messageParagraph").text("Please add less than or same Receiving Quantity as Pending Quantity");
	      $("#msgOkModal").removeClass("btn3");
	      $("#msgOkModal").addClass("btn1");
	      $("#msgModal").modal('show');
	      $("#" + fieldId).val(null);
	    }
	  }
	}

function dataURLtoBlob(dataURL) {
    var parts = dataURL.split(",");
    var contentType = parts[0].match(/:(.*?);/)[1];
    var base64Data = atob(parts[1]);
    var arrayBuffer = new ArrayBuffer(base64Data.length);
    var uint8Array = new Uint8Array(arrayBuffer);
    for (var i = 0; i < base64Data.length; i++) {
      uint8Array[i] = base64Data.charCodeAt(i);
    }
    return new Blob([arrayBuffer], { type: contentType });
  }
  
function createFileList(...files) {
    const dataTransfer = new DataTransfer();
    files.forEach((file) => {
      dataTransfer.items.add(file);
    });
    return dataTransfer.files;
  }

//Function to fetch purchase order IDs via AJAX
function fetchPurchaseOrderIds() {
    $.ajax({
        url: 'gate-pass-get-purchaseId',
        type: 'GET',
        success: function(data) {
            $('#poNo').find('option:not(:first)').remove();
            if (Array.isArray(data)) {
                data.forEach(function(item) {
                    if (item.key) {  
                        $('#poNo').append(`<option value="${item.key}">${item.key}</option>`);
                    }
                });
                if ($('#poNo option').length <= 1) {
                    console.warn('No valid purchase order IDs returned');
                    alert('No purchase order IDs available.');
                }
            } else {
                console.error('Invalid response format:', data);
                alert('Failed to load purchase order IDs. Invalid response format.');
            }
        },
        error: function(xhr, status, error) {
            console.error('Error fetching purchase order IDs:', error);
            alert('Failed to load purchase order IDs. Please try again.');
        }
    });
}
