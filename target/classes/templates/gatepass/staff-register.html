	function rowSelect() {
		var selectedRows = gridOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});

		
		var selectedNodes = gridOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		 var empId= selectedData.map(node => node.empId);
		 var empName= selectedData.map(node => node.empName);
		 var date= selectedData.map(node => node.date);
		 var punchInTime= selectedData.map(node => node.punchInTime);
		 var punchOutTime= selectedData.map(node => node.punchOutTime);
		 var shift= selectedData.map(node => node.shift);
		 var employedBy= selectedData.map(node => node.employedBy);
		 

		 if(rowCount == 0){
			 $("#empId").text("");
				$("#empName").val("");
				$("#date").val("");
				$("#shift").val("");
				$("#punchIn").val("");
				$("#punchOut").val("");
				$("#empBy").val("");
			}else if(rowCount == 1){
				$("#empId").text(empId);
				$("#empName").val(empName);
				$("#date").val(date);
				$("#shift").val(shift);
				$("#punchIn").val(punchInTime);
				$("#punchOut").val(punchOutTime);
				$("#empBy").val(employedBy);
			}
		 
			
		
	}

	function viewAttandanceList(newDate) {
		$('.loader').show();

		agGrid.simpleHttpRequest(
				{
					url : "staff-register-view?dept=" + 'all' + "&fromdate="
							+ newDate + "&todate=" + newDate
				}).then(function(data) {
			var jsonData = JSON.parse(data.body);
			var allData = jsonData.viewStaffRegData;
			var len;
			if (allData == "" || allData == null || allData == "null") {
				len = 0;
				allData = [];
			} else {
				len = allData.length;
			}

			$('#totalAttancanceCount').html(len);
			gridOptions.api.setRowData(allData);
			
			
			if (allData && allData.length > 0) {
				//let rowId = data[0].getPassEntryId;
				gridOptions.api.getRowNode(0).setSelected(true);
				//disableField();
			}
			$('.loader').hide();
		});
	}
	function downloadDetails() {
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			dataset.push(rowNode.data);
		});
		gridOptions.api.exportDataAsCsv(dataset);

	}

	function filter() {
		var fromdatex = $("#filterFromDate").val();
		var fd = fromdatex.split("-");
		var todatex = $("#filterToDate").val();
		var td = todatex.split("-");

		if (fromdatex != '' && todatex != '') {
			if (fd[2] == td[2]) {
				if (fd[1] == td[1]) {
					if (fd[0] <= td[0]) {
						filterData();
					} else {
						setFromToDate();
					}
				} else if (fd[1] < td[1]) {
					filterData();
				} else {
					setFromToDate();
				}
			} else if (fd[2] < td[2]) {
				filterData();
			} else {
				setFromToDate();
			}
		}
	}
	function setFromToDate() {
		$("#messageParagraph").text(
				"Please choose to date greater than or equal to from date ");
		$("#msgOkModal").removeClass("btn3");
		$("#msgOkModal").addClass("btn1");
		$("#msgModal").modal('show');
		var date = (new Date()).toISOString().split('T')[0];
		var newToDate = changeDateFormat(date);
		var newFromDate = changeDateFormat(date);
		$("#filterFromDate").val(newToDate);
		$("#filterToDate").val(newToDate);

		$("#fromDateCalender").val(newDate);
		$("#toDateCalendar").val(newDate);
	}

	function filterData() {
		var len;
		var secx = $("#sec").val();

		var fromDate = $("#filterFromDate").val();
		var toDate = $("#filterToDate").val();

		$('.loader').show();

			if (allData == "" || allData == null || allData == "null") {

			}
			$('#totalAttancanceCount').html(len);

			if (allData && allData.length > 0) {
				//let rowId = data[0].getPassEntryId;
				gridOptions.api.getDisplayedRowAtIndex(0).setSelected(true);
				//disableField();
			}else{
				 $("#empId").text("");

					$("#date").val("");
					$("#shift").val("");
					$("#punchIn").val("");
					$("#punchOut").val("");
					$("#empBy").val("");
			}
			$('.loader').hide();

		});

	}

	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

	$(document).ready(function() {
		var scannedBarcode = '';
		var interval;
		$(document).on('keydown', function(event) {
			// Clear the interval if it's set
			if (interval)
				clearInterval(interval);
			// If Enter key is pressed
			if (event.key == 'Enter') {
				// Call handleBarcode function if barcode is not empty
				if (scannedBarcode)
					handleBarcode(scannedBarcode);
				// Reset scannedBarcode
				scannedBarcode = '';
				return;
			}

			// If the pressed key is not Shift key
			if (event.key != 'Shift')
				scannedBarcode += event.key;
			// Set an interval to clear scannedBarcode after 20 milliseconds
			interval = setInterval(function() {
				scannedBarcode = '';
			}, 300);
		});
	});

	function handleBarcode(scannedBarcode) {
		hideUpdateAttandanceModal()
		var parsedData;
		var str = scannedBarcode;
		var formattedStr;
		if (scannedBarcode.includes('@')) {
			// Replace all occurrences of '@' with '"'
			str = str.replace(/@/g, '"');
			// Do something with formattedStr, for example:
		} else {
			// If '@' is not found, just use the original string
			let str = scannedBarcode;
			// Do something with formattedStr, for example:
		}
		try {
			parsedData = JSON.parse(str);
		} catch (error) {
			console.error('Error parsing JSON:', error);
			return;
		}
		var currentDate = new Date();
		// Format current date to MySQL date format (YYYY-MM-DD)
		var mysqlDate = currentDate.getFullYear() + '-'
				+ ('0' + (currentDate.getMonth() + 1)).slice(-2) + '-'
				+ ('0' + currentDate.getDate()).slice(-2);
		var mysqlDatetime = currentDate.getFullYear() + '-'
				+ ('0' + (currentDate.getMonth() + 1)).slice(-2) + '-'
				+ ('0' + currentDate.getDate()).slice(-2) + ' '
				+ ('0' + currentDate.getHours()).slice(-2) + ':'
				+ ('0' + currentDate.getMinutes()).slice(-2) + ':'
				+ ('0' + currentDate.getSeconds()).slice(-2);
		var employeeData = {
			employeeID : parsedData.EmployeeId,
			department : parsedData.Department,
			mysqlDate : mysqlDate,
			mysqlDatetime : mysqlDatetime
		};
		$
				.ajax({
					url : 'staff-register-update-attendance',
					data : JSON.stringify(employeeData),
					method : 'POST',
					contentType : 'application/json',
					success : function(response) {
						//console.log("open modal")
						if (response != null && response.code === "200") {
							message = JSON.parse(response.message);
							$("#punchedStatus").text(message.message);
							$("#updateAttandanceModal").modal('hide');
							var toDayDate = (new Date()).toISOString().split(
									'T')[0];
							var newDate = changeDateFormat(toDayDate)
							viewAttandanceList(newDate);
						} else if (response.code == "sessionOut") {
							$("#messageParagraphSessionOut").text(
									response.message);
							$("#msgOkModalSessionOut").removeClass("btn3");
							$("#msgOkModalSessionOut").addClass("btn1");
							$("#msgModalSessionOut").modal('show');
						} else if (response != null && response.code === "999") {
							message = "We're having trouble completing your request. Please refresh and try again.";
							$("#punchedStatus").text(message.message);
						} else {
							$("#punchedStatus").text("Punch in failed");
						}
						$('#updateAttandanceModal').modal('show');
						setTimeout(hideUpdateAttandanceModal, 900);

					},
					error : function(xhr, status, error) {
						$("#punchedStatus").text("Punch in failed");
					}
				});
	}
	function hideUpdateAttandanceModal() {
		$("#updateAttandanceModal").modal('hide');
	}
	function hideUpdateAttandanceModal(isRefreshNeeded) {
		$("#updateAttandanceModal").modal('hide');
	}
	function showUpdateAttandanceModal() {

	}
	
	function reset() {
		let data = $("#quickFilter").val();
		if(data != null && data != ""){

			onQuickFilterChanged();
		}
		
		
	}

	function cancelBar() {
		/* var id = document.getElementById("closeKey");
		id.style.display = "block"; */

	function onFilterDropdownChange() {
		var selectedShift = document.getElementById('shiftFilter').value;

		// Set filter model to filter by 'employeeBy' column
		gridOptions.api.setFilterModel({
			shift : {
				type : 'equals',
				filter : selectedShift
			}
		});
		var displayedRowCount = gridOptions.api.getDisplayedRowCount();
		console.log("displayedRowCount>>>>>", displayedRowCount);
		if(displayedRowCount>0){
			gridOptions.api.getDisplayedRowAtIndex(0).setSelected(true);
		}else{
			 $("#empId").text("");
				$("#empName").val("");
				$("#date").val("");
				$("#shift").val("");
				$("#punchIn").val("");
				$("#punchOut").val("");
				$("#empBy").val("");
		}
		
		// Apply the filter
		gridOptions.api.onFilterChanged();
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalAttancanceCount').html(totalRowCount);
		
	}
</script>
