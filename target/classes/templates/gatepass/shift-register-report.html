function changeDateFormat(inputDate){  // expects Y-m-d
    var splitDate = inputDate.split('-');
    if(splitDate.count == 0){
        return null;
    }
    var year = splitDate[0];
    var month = splitDate[1];
    var day = splitDate[2]; 
    return day + '-' + month + '-' + year;
}

 function masterSaveData() {
		if (validFormData()) {
			var datas = [];
			var rowCount = activityOptions.api.getDisplayedRowCount();
			if(rowCount > 0){
				$('.loader').show();
				$("body").addClass("overlay");
				activityOptions.api.forEachNode(function(rowNode, index) {
				var item = rowNode.data;
				delete item.manPowerName;
				item.desc = $("#desc").val();
				item.registerId = $("#pcroId").val();
				item.registerId = $("#pcrobox").text();
				item.pdate = $("#pdate").val();
				item.shift = $("#shift").val();
				item.manpowerNo = $("#manpowerNo").val();
				datas.push(item);
			});
				
			saveReportData(datas);
			}else{
				$("#messageParagraph").text(
				"Add Category Details");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}
		} 

	}


function saveReportData(datas) {
	
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "report-gate-data-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
			$("body").removeClass("overlay");
			if (response.code == "success") {
				/* $("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show'); */
				
				view();
				cancel();
				closeNav();
				toastr.success(response.message);
			} else {
				$('.loader').hide();
				$("body").removeClass("overlay");
			}
		},
		error : function(data) {
			$('.loader').hide();
			$("body").removeClass("overlay");
		}
	}) 

}

				}

			},
		});
		}
	}
