<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/vms/tender-management.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script type="text/javascript" src="../javaScript/vms/tender.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
	defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/27.2.0/ag-grid-community.min.noStyle.js"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/27.2.0/styles/ag-theme-alpine.min.css">



</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="d-flex flex-column flex-lg-row">

								<!--Left Sec Start-->
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div class="d-flex justify-content-between p-2 border-bottom">

											<div class="col-md-8 col-12">
												<form class="d-flex search-sec flxwrap gap-2">
													<input class="form-control search_input_bar"
														placeholder="Search.." type="text" name="search"
														oninput="onQuickFilterChanged()" id="quickFilter"
														autocomplete="off">
													<button class="btn go-btn" onclick="onQuickFilterChanged()"
														id="SearchBtn" type="button">Go</button>
													<button class="btn go-btn w-auto" type="button"
														onclick="resetBtn()">Reset</button>
												</form>
											</div>

											<div class="col-md-2 text-end">
												<button alt="Maximize" class="btn btn-primary max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>
											</div>

										</div>

										<div
											class="leftSideParentContainer border rounded p-2 m-2 mb-0">
											<div class="row" id="buttonClass">
												<div class="btn-group col-md-3">
													<button class="btn btn-primary child headerBtnActive"
														id="Critical" value="1" onclick="filter('0')">New</button>
												</div>
												<div class="btn-group col-md-3">
													<button class="btn btn-primary child" id="Medium" value="3"
														onclick="filter('1')">Applied</button>
												</div>
												<div class="btn-group col-md-3">
													<button class="btn btn-primary child" id="High" value="2"
														onclick="filter('2')">Awarded</button>
												</div>
												<div class="btn-group col-md-3">
													<button class="btn btn-primary child" id="Low" value="4"
														onclick="filter('3')">Cancelled</button>
												</div>
											</div>
										</div>

										<div class="card m-2 p-2">
											<div class="d-flex justify-content-between header-nav"
												id="tdiv">
												<div class="btn-hs">
													<!-- <div class="font-design" id="totalReq1">
                            Tenders<span></span>
                          </div> -->
												</div>
												<div class="buttonsec btn-hs" id="ttbtn"></div>
												<div class="buttonsec btn-hs" id="ttbtn">
													<!-- <button class="new-btn" id="applyBtn" onclick="apply()"
                            style="width: 88px !important;">Apply</button> -->

												</div>
											</div>
											<div id="contractNegotation" class="ag-theme-alpine"
												style="height: 600px; width: 100%;"></div>

											<input type="hidden" id="userId"
												th:value="${session.USER_ID}" /> <input type="hidden"
												id="docUniqueId" />
										</div>
									</div>
								</div>

								<div id="snackbar" class="snackbar"></div>

								<!--Right Sec Start-->
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box" id="rightSideDiv">

										<div
											class="d-flex justify-content-between align-items-center p-2 border-bottom">
											<!-- Right Inner Tab Start -->
											<ul class="nav nav-pills newtab tablistUl navbarSticky"
												role="tablist">
												<li class="nav-item wd-11"><a class="nav-link active"
													data-bs-toggle="pill" id="manageTab" href="#manageControl">Tender
														Submission</a></li>
											</ul>
											<button alt="Maximize" class="btn btn-primary max-btn"
												id="collapseButtonL1" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>
										</div>

										<!-- Tab panes -->
										<div class="tab-content flex-fill">

											<div id="manageControl"
												class="tab-pane fade show active h-100 operational-tabs">
												<div class="d-flex flex-column h-100">
													<div class="requisition-tbl">
														<div class="operationBtnSticky">
															<div
																class="d-flex justify-content-between align-items-center parent_btn-div m-2 p-2 rounded">
																<div class="contract-info">
																	Tendor Id:&nbsp;&nbsp;<span id="headertendorid"></span>
																</div>
																<button class="btn btn-primary edit-btn"
																	onclick="sendMessageButton()" type="button"
																	id="tenderSave-btn">Save</button>
															</div>
														</div>
													</div>

													<div class="card p-2 m-2 mt-0">
														<div class="tender_submission-dialog">
															<div class="tender_submission-content">
																<div class="review-header">
																	<h6 class="tender_submission-title"
																		id="reviewModalLabel">Tender Submission</h6>
																</div>
																<div class="tender_submission-body mb-scroll">
																	<div class="row">
																		<!-- Vendor Tabs Section Start -->
																		<div class="col-12"></div>
																		<!-- Chat Box Section Start -->
																		<div class="col-12">
																			<div id="tenderSubmission" class="rounded">
																				<div class="row">
																					<div class="col-lg-9 form-group">
																						<label for="technicalProposalDesc">Technical
																							proposal</label>
																						<textarea class="ckeditor"
																							id="technicalProposalDesc"></textarea>
																					</div>
																					<div class="col-lg-3 form-group">
																						<label for="technicalProposalDoc">Technical
																							proposal Document</label> <input type="file"
																							id="technicalProposalDoc"
																							class="form-control-file">
																					</div>
																					<div class="col-lg-9 form-group">
																						<label for="financialProposalDesc">Financial
																							proposal</label>
																						<textarea class="ckeditor"
																							id="financialProposalDesc"></textarea>
																					</div>
																					<div class="col-lg-3 form-group">
																						<label for="financialProposalDoc">Financial
																							proposal Document</label> <input type="file"
																							id="financialProposalDoc"
																							class="form-control-file">
																					</div>

																					<div class="col-lg-12 form-group">
																						<h6>Criteria Details</h6>
																						<table id="criteriaTable"
																							class="table table-bordered"
																							style="background-color: white;">
																							<thead>
																								<tr>
																									<th>Sl.No.</th>
																									<th class="tr-width">Criteria Name</th>
																									<th class="tr-width">Criteria Description</th>
																									<th class="btn-width">Acceptance</th>
																									<th class="doc-width">Document</th>
																								</tr>
																							</thead>
																							<tbody>
																								<!-- Dynamic rows will be added here -->
																							</tbody>
																						</table>
																						<div class="col-lg-9 form-group">
																							<label for="technicalProposalDesc">Tender
																								application fee</label>
																						</div>
																						<div class="col-lg-4 form-group">
																							<div class="d-flex gap-2 border">
																								<input type="text" id="tenderApplicationFee"
																									class="form-control border"> <select
																									style="width: 15%;">
																									<option>₹</option>
																									<option>£</option>
																									<option>$</option>
																								</select>
																							</div>
																						</div>
																					</div>


																				</div>
																			</div>
																		</div>


																		<!-- Input Section -->

																		<!-- <div class="col-12 mt-3">
                                      <div class="input-group">
                                        <button class="btn btn-danger" id="closeButton"
                                          type="button" onclick="closeBtn()">Close</button>
                                        <button class="btn btn-primary" id="sendMessageButton"
                                          type="button" onclick="sendMessageButton()">Send</button>
                                      </div>
                                    </div> -->
																	</div>
																</div>
																<div
																	class="no-tender-found-container tender-not_found_0"
																	style="display: none">
																	<img class="icon" src="../assets/images/no_tender_found.png"
																		alt="No Tender Found Icon">
																	<div class="message">No Tender Found</div>
																	<div class="subtext">Please check back later for
																		available tenders.</div>
																</div>
															</div>
														</div>

														<div class="tender-content" style="display: none">
															<div class="tender-header"></div>
															<div class="tender-body mb-scroll applied-tender-body">
																<h6 class="tender-title" id="reviewModalLabel">Applied
																	Tender Details</h6>

																<div class="row">

																	<div class="col-md-3">
																		<div class="form-group">
																			<label for="templateName">Template Name <span
																				class="required-asterisk">*</span></label> <input
																				type="text" class="form-control" id="templateName"
																				placeholder="Enter Template Name" autocomplete="off"
																				required
																				oninput="clearValidationMessage('templateNameError')">
																			<span id="templateNameError" class="text-danger"></span>
																		</div>
																	</div>
																	<div class="col-md-3">
																		<div class="form-group">
																			<label>Template Effective Date <span
																				class="required-asterisk">*</span></label> <input
																				type="datetime-local" class="form-control"
																				id="effectiveDate" placeholder="Enter date"
																				name="effectiveDate"
																				oninput="clearValidationMessage('effectiveDateError')">
																			<span id="effectiveDateError" class="text-danger"></span>
																		</div>
																	</div>
																	<div class="col-md-3">
																		<div class="form-group">
																			<label>Template Created Date</label> <input
																				type="datetime-local" class="form-control" id="date"
																				placeholder="Enter date" name="date"
																				readonly="readonly">
																		</div>
																	</div>
																	<div class="col-md-3">
																		<div class="form-group">
																			<label for="status">Status</label> <select
																				class="form-control" id="status" name="status">
																				<option value="1">Active</option>
																				<option value="0">Inactive</option>
																			</select>
																		</div>
																	</div>

																	<div class="col-lg-12">
																		<div class="form-group">
																			<label>Description <span
																				class="required-asterisk">*</span></label>
																			<textarea class="ckeditor" id="tenderEditor"></textarea>
																		</div>
																	</div>
																</div>
															</div>

															<div class="no-tender-found-container tender-not_found_1"
																style="display: none">
																<img class="icon" src="../assets/images/no_tender_found.png"
																	alt="No  Tender Found Icon">
																<div class="message">No Tender Found</div>
																<div class="subtext">Please check back later for
																	available tenders.</div>
															</div>

														</div>
													</div>
												</div>
											</div>

										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
