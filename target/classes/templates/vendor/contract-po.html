<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/vms/tender-management.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script type="text/javascript"
	src="../javaScript/contract/contract-po.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
	defer></script>


</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
              <div class="d-flex flex-column flex-lg-row">

								<!--Left Sec Start-->
                <div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
                    <div class="d-flex justify-content-between p-2 border-bottom">
											<div class="col-md-8 col-12">
												<form class="d-flex gap-2 search-sec flxwrap">
                          <input class="form-control search_input_bar" placeholder="Search.." type="text" name="search" id="quickFilter" autocomplete="off">
                          <button class="btn go-btn" onclick="onQuickFilterChanged()" id="SearchBtn" type="button">Go</button>
                          <button class="btn go-btn w-auto" type="button" onclick="resetBtn()">Reset</button>
												</form>
											</div>

											<div class="col-md-2 text-end">
                        <button alt="Maximize" class="btn btn-primary max-btn" id="collapseButtonR1" onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                          <i class="fa-solid fa-maximize" id="expandIconR1"></i>
                          <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                        </button>
											</div>
										</div>

                    <div class="card m-2 p-2">
                      <div class="buttonsec btn-hs ">
                        <!-- <button class="new-btn" id="vendorsResponseLogs" onclick="viewLogs()" style="width: 88px !important;">Logs</button> -->
                        <button class="new-btn" id="changeReq" onclick="changeReq()" style="width: 88px !important;" th:if="${session.IS_VENDOR == 'rol030'}">Change Req</button>
                        <button class="new-btn" id="approve" onclick="approve()" style="width: 88px !important;" th:if="${session.IS_VENDOR == 'rol030'}">Approve</button>
                      </div>

                      <div class="leftSideParentContainer">
                        <div id="contractPoGrid" class="ag-theme-alpine" style="height: 600px; width: 100%;"></div>
                      </div>

                      <input type="hidden" id="userId" th:value="${session.USER_ID}" />
                      <input type="hidden" id="docUniqueId" />
                    </div>

									</div>
								</div>

                <div id="snackbar" class="snackbar"></div>
								<!--Right Sec Start-->
                <div class="box-sec" id="collapseWidthL1">
									<div class="out-box" id="rightSideDiv">
                    <div class="d-flex flex-column gap-2 h-100">
                      <div class="d-flex justify-content-between align-items-center p-2 border-bottom">
                        <!-- Right Inner Tab Start -->
                        <ul class="nav nav-pills newtab tablistUl navbarSticky" role="tablist">
                          <li class="nav-item wd-11"><a class="nav-link active" data-bs-toggle="pill" id="manageTab" href="#manageControl">Contract p/o</a></li>
                        </ul>
                        <button alt="Maximize" class="btn btn-primary max-btn" id="collapseButtonL1" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                          <i class="fa-solid fa-maximize" id="expandIconL1"></i>
                          <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                        </button>
                      </div>
                      <!-- Tab panes -->
                      <div class="tab-content flex-fill">

                        <div id="manageControl" class="tab-pane fade show h-100 active operational-tabs">
                          <div class="d-flex flex-column h-100">
                            <div class="requisition-tbl">
                              <div class="operationBtnSticky mx-2">
                                <table class="table table-bordered mb-0" width="100%">
                                  <tr valign="middle" class="operation-row">
                                    <td>
                                      <div class="d-flex justify-content-between align-items-center">
                                        <div class="contract-info">
                                          Contract Id:&nbsp;&nbsp;<span id="headercontractid"></span>
                                        </div>
                                        <div class="features-btn d-flex justify-content-between align-items-center">
                                          <button class="btn btn-primary edit-btn" onclick="saveVendorResponse()" type="button" id="vendorResponse-btn" style="display:none">Save</button>
                                        </div>
                                      </div>
                                    </td>
                                  </tr>
                                </table>
                              </div>
                            </div>

                            <div class="card p-2 m-2">
                              <div class="logs-content">
                                <div class="logs-header">
                                  <h6 class="logs-title" id="exampleModalLabel">Vendors Contract Log</h6>
                                  <input type="hidden" id="tenderId">
                                </div>
                                <div class="logs-body mb-scroll" style="background-color: #f7f7f7;">
                                  <div class="container-fluid" id="vendorResponse">
                                    <div class="row">
                                      <div class="col-md-12">
                                        <div id="content" class="content content-full-width">
                                          <div class="profile-content">
                                            <div class="tab-content p-0">
                                              <div class="tab-pane fade active show" id="profile-post">
                                                <ul class="timeline">
                                                </ul>
                                              </div>
                                            </div>
                                          </div>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <!-- <div class="modal-footer">
                                  <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">Close</button>
                                </div> -->
                              </div>
                              <div class="review-content" style="display:none">
                                <div class="review-header">
                                  <h6 class="review-title" id="remarkModalLabel"></h6>
                                </div>
                                <div class="review-body">
                                  <textarea rows="3" cols="5" placeholder="Enter Remarks" id="vendorRemarks"></textarea>
                                </div>
                                <!-- <div class="review-footer">
                                  <button type="button" class="btn btn-secondary"
                                    data-dismiss="modal" onclick="closeremarkModal();">Close</button>
                                  <button type="button" class="btn btn-primary"
                                    onclick="saveVendorResponse();">Save</button>
                                </div> -->
                              </div>
                            </div>
                          </div>
                        </div>

                      </div>
                    </div>
									</div>
								</div>
							</div>
						</div>

					</div>

				</div>
			</div>

		</div>
	</div>
</body>
</html>
