<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}" lang="en">
<head>
<meta charset="UTF-8">
<title>NERP</title>
<script src="/javaScript/hotel-management/billing.js"></script>
<!-- <script src="/javaScript/hotel-management/billing.js"></script> -->
<!-- <script src="/javaScript/his/main-billing.js"></script> -->




<style type="text/css">
.header-tab {
	padding: 0px 14px;
}

.custom-tab-group .nav-pills .nav-link {
	border-radius: 0px;
	font-weight: 500;
	border: 1px solid #BF05FF;
	transition: background-color 0.3s ease;
	color: #BF05FF;
}

.custom-tab-group .nav-pills .nav-link:hover {
	background: transparent;
}

.custom-tab-group .nav-pills .nav-link.active {
	background-color: #BF05FF !important;
	color: white !important;
}

.custom-tab-group .nav-item {
	min-width: 150px;
}

.gap-1 {
	gap: .25rem !important;
	justify-content: end;
	margin-top:10px;
}
</style>
</head>
<body>
	<section>
		<div layout:fragment="content" class="maincontent">
			<div class="container-fluid">
				<div class="d-flex">
					<div class="maincontentsec">
						<!--Tabbination 1 Start-->
						<div id="parent-tab" class="tab-pane" role="tabpanel">
							<div class="d-flex flex-column flex-lg-row">
								<div class="box-sec" id="collapseWidthR1">
									<div class="out-box">
										<div
											class="d-flex justify-content-between align-items-center p-2 border-bottom">
											<!--Right Inner Tab Start-->
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link active"
														data-bs-toggle="pill" data-bs-target="#allGuest"
														aria-selected="true" role="tab" tabindex="-1"
														onclick="handleTabClick(this)">All Guest</button>
												</li>

												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link"
														data-bs-toggle="pill" data-bs-target="#corporate"
														aria-selected="true" role="tab" tabindex="-1"
														onclick="handleTabClick(this)">Corporate</button>
												</li>
												
												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link"
														data-bs-toggle="pill" data-bs-target="#corporateGuest"
														aria-selected="true" role="tab" tabindex="-1"
														onclick="handleTabClick(this)">Corporate Guest</button>
												</li>
												
												<li class="nav-item" role="presentation">
													<button type="button" class="nav-link"
														data-bs-toggle="pill" data-bs-target="#otherGuest"
														aria-selected="true" role="tab" tabindex="-1"
														onclick="handleTabClick(this)">Other Guest</button>
												</li>
											</ul>
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" aria-label="Expand"
												data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
										<div class="d-flex justify-content-between border-bottom p-2">
											<div class="col-md-8 col-12">
												<div class="d-flex gap-2 search-sec">
													<input class="form-control" type="text"
														placeholder="Search" id="quickFilter1" autocomplete="off">
													<button class="btn go-btn" type="button" id="goBtn">Go</button>
													<button class="btn resetBtn" type="button" id="resetBtn">Reset</button>
												</div>
											</div>
										</div>
										
										<div class="card m-2 p-2">
											<div id="appraisalGrid" class="ag-theme-alpine"
												style="width: 100%; height: 100vh; margin-top: 7px"></div>
										</div>
									</div>
								</div>
								<div class="box-sec" id="collapseWidthL1">
									<div class="out-box">
										<div
											class="d-flex justify-content-between align-items-center p-2 border-bottom">

											<ul class="nav nav-pills newtab" role="tablist" id="tabMenu">
												<!-- <li class="nav-item" role="presentation"
													id="information-tab"><a class="nav-link active"
													data-bs-toggle="pill" href="#information"
													aria-selected="false">Information</a></li> -->
												<!-- <li class="nav-item" role="presentation" id="bills-tab"><a
													class="nav-link active" data-bs-toggle="pill" href="#billing"
													aria-selected="false">Billing</a></li> -->
												<li class="nav-item" role="presentation" id="balsheet-tab"><a
													class="nav-link active" data-bs-toggle="pill"
													href="#balanceSheet" aria-selected="false">Balance
														Sheet</a></li>
												<li class="nav-item pay-tab wd-12" id="paymentDetailsLi"><a
													class="nav-link text-nowrap" data-bs-toggle="pill"
													href="#paymentDetail">Payment</a></li>
												<li class="nav-item wd-12" id="finalSettlementLi"><a
													class="nav-link text-nowrap" data-bs-toggle="pill"
													href="#finalSettlement">Settlement</a></li>
											</ul>
											<!--Right Inner Tab Start-->
											<button class="btn btn-primary max-btn" id="collapseButtonL1"
												type="button" onclick="triggerExpansionL(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												aria-label="Expand" data-bs-original-title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
											</button>
										</div>
											<!--Services tab starts from here  -->
										<div class="tab-content flex-fill">
											<div class="tab-pane fade h-100 show active" id="balanceSheet"
													role="tabpanel">
													<div th:replace="his/cust-bill-balance-sheet :: cust-bill-balance-sheet"></div>
												</div>
												<div id="paymentDetail" class="tab-pane p-2 h-100">
													<div th:replace="his/main-billing :: main-billing"></div>
												</div>
											<div id="finalSettlement" class="tab-pane p-2 h-100">
													<div th:replace="his/final-settlement :: final-settlement"></div>
												</div>
												</div>
											<!--Services tab ends here  -->
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
