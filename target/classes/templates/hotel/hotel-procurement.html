function getselfdata() {
	var search = $("#sessionName").val().trim();
	var sid = $("#sessionId").val().trim();
	var types = "Inventory";
	if (search) {
		$('.loader').show();
		$.ajax({
					type : "POST",
					url : "invoice-details-get-vendor-list?type=" + types,
					dataType : 'json',
					contentType : 'application/json',
					data : search,
					success : function(response) {
						console.log("aa",response)
						if (response.message == "success") {
							if (response.body.length != 0) {
								for (var i = 0; i < response.body.length; i++) {
 									if(sid===response.body[i].vendorId){
 										selectAutocompleteValue1(response.body[i].vendorId, response.body[i].vendorName, response.body[i].custGSTNo, response.body[i].taxType, response.body[i].vndrTds)
 									}
								}
							} 
							$('.loader').hide();
						}
					},
					error : function(data) {
						console.log(data);
						$('.loader').hide();
					}
				})
	}

	function amountFormatter(value) {
		if (value !== null && value !== undefined) {
			var parts = value.toString().split('.');
			var integerPart = parts[0];
			var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
			var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
			return formattedIntegerPart + decimalPart;
		} else {
			return '';
		}
	}

	    var day = splitDate[2];

	}

function saveTableData() {
	var editProduct = $("#editProduct").val();
	var item = {};
	var data = 1;
	var pId = $("#poId").val();
	var validation = true;


		if ($('#itemName').val() == null || $('#itemName').val() == "") {

			return validation = false;
		}
		if ($('#quantity').val() == null || $('#quantity').val() == "") {
			
			toastr.error("Item Quantity Required.");
			return validation = false;
		}

			toastr.error("Unit Price Required.");
			return validation = false;
		}
		if ($('#gstRate').val() == null || $('#gstRate').val() == "") {
			
			toastr.error("GST Rate Required.");
			return validation = false;

		}

		}

				if (!editProduct) {

					item.slNo = data;

			});

	var totalLine;
	function calculateLineTotal() {
		var price = $("#unitPrice").val();
		var quantity = $("#quantity").val();
		var discount = $("#discount").val();
		var discountAmount = $("#discountAmount").val();
		var frightAmt = $("#freightAmount").val();
		if(frightAmt == null || frightAmt == "null" || frightAmt == ""){
			frightAmt = 0;
		}
		if (discountAmount == '1') {
			if (price && quantity) {
				var mul = (price * quantity);

				if (discount > mul) {

					$("#discount").val("0");
					totalLine = mul - discount + parseFloat(frightAmt);
					$("#lineTotal").val((mul).toFixed(2));
				} else {
					totalLine = mul - discount + parseFloat(frightAmt);
					$("#lineTotal").val((totalLine).toFixed(2));
				}
			} else {
				var mul = 0;
				$("#lineTotal").val((mul).toFixed(2));
			}
		} else {
			if (price && quantity) {
				var mul = (price * quantity);
				if (discount > mul) {
					$("#discount").val("0");
					totalLine1 = (mul / 100) * discount;
					totalLine = mul - totalLine1 + parseFloat(frightAmt);
					$("#lineTotal").val((mul).toFixed(2));
				} else {
					totalLine1 = (mul / 100) * discount;
					totalLine = mul - totalLine1 + parseFloat(frightAmt);
					$("#lineTotal").val((totalLine).toFixed(2));
				}
			} else {
				var mul = 0;
				$("#lineTotal").val((mul).toFixed(2));
			}
		}
	}

  function qaRequest(){

		selectedRows.forEach(function(selectedRow, index) {
			if (index > 0) {
				selectedRowsString += ',';
			}
			selectedRowsString += selectedRow.invoiceId;
		});
		var invoiceId = selectedRowsString;
	      agGrid.simpleHttpRequest({
					url : 'manage-invoice-edit-new?id=' + invoiceId
				}).then(function(data) {
			for (element of data)
			{
				var obj = {};
				obj.invoice_id = element.invoiceId;
				obj.purchase_order = element.poId;
				obj.vechile_no = element.vehicleNo;
				obj.driver_name = element.driverName;
				obj.driver_mobile = element.driverMobile;
				obj.sku_id = element.sku;
				obj.hsn_no = element.hsnCode;
				obj.item_name = element.itemName;
				obj.quantity = element.receivedQuantity;
				obj.unit = element.unitName;
				obj.vendor_name = element.vendorId;
				obj.challan_no = element.invoiceNo;
				//console.log(obj);
				datas.push(obj);
			}
			submitReq(datas);
	
		});
  }

	function toDataUrl(url, callback) {
	    var xhr = new XMLHttpRequest();
	    xhr.onload = function() {
	        var reader = new FileReader();
	        reader.onloadend = function() {
	            callback(reader.result);
	        }
	        reader.readAsDataURL(xhr.response);
	    };
	    xhr.open('GET', url);
	    xhr.responseType = 'blob';
	    xhr.send();
	}

	var pages;
	function createPagination(pages, page) {
		pno = page;
		if($("#totalPageno").val()==''){
			var pages=20;
		}else{
			var pages=$("#totalPageno").val();
			$("#currentPageno").val(page);
		}
		
	  var str = '<ul>';
	  var active;
	  var pageCutLow = page - 1;
	  var pageCutHigh = page + 1;
	  // Show the Previous button only if you are on a page other than the first
	  if (page > 1) {
	    str += '<li class="page-item previous no"><a onclick="createPagination(pages, '+(page-1)+')">Previous</a></li>';
	  }
	  // Show all the pagination elements if there are less than 6 pages total
	  if (pages < 6) {
	    for (let p = 1; p <= pages; p++) {
	      active = page == p ? "active" : "no";
	      str += '<li class="'+active+'"><a onclick="createPagination(pages, '+p+')">'+ p +'</a></li>';
	    }
	  }
	  // Use "..." to collapse pages outside of a certain range
	  else {
	    // Show the very first page followed by a "..." at the beginning of the
	    // pagination section (after the Previous button)
	    if (page > 2) {
	      str += '<li class="no page-item"><a onclick="createPagination(pages, 1)">1</a></li>';
	      if (page > 3) {
	          str += '<li class="out-of-range"><a onclick="createPagination(pages,'+(page-2)+')">...</a></li>';
	      }
	    }
	    // Determine how many pages to show after the current page index
	    if (page === 1) {
	      pageCutHigh += 2;
	    } else if (page === 2) {
	      pageCutHigh += 1;
	    }
	    // Determine how many pages to show before the current page index
	    if (page === pages) {
	      pageCutLow -= 2;
	    } else if (page === pages-1) {
	      pageCutLow -= 1;
	    }
	    // Output the indexes for pages that fall inside the range of pageCutLow
	    // and pageCutHigh
	    for (let p = pageCutLow; p <= pageCutHigh; p++) {
	      if (p === 0) {
	        p += 1;
	      }
	      if (p > pages) {
	        continue
	      }
	  
	      active = page == p ? "active" : "no";
	      str += '<li class="page-item '+active+'"><a onclick="createPagination(pages, '+p+')">'+ p +'</a></li>';
	      
	    }
	    // Show the very last page preceded by a "..." at the end of the pagination
	    // section (before the Next button)
	    if (page < pages-1) {
	      if (page < pages-2) {
	        str += '<li class="out-of-range"><a onclick="createPagination(pages,'+(page+2)+')">...</a></li>';
	      }
	      str += '<li class="page-item no"><a onclick="createPagination(pages, pages)">'+pages+'</a></li>';
	    }
	  }
	  // Show the Next button only if you are on a page other than the last
	  if (page < pages) {
	    str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
		  changePagination(page);
	  }else if(page <= pages){
		  //str += '<li class="page-item next no"><a onclick="createPagination(pages, '+(page+1)+')">Next</a></li>';
		  changePagination(page);
	  }
	  str += '</ul>';
	  // Return the pagination string to be outputted in the pug templates
	  document.getElementById('pagination').innerHTML = str;
	  return str;

	}

	//validateTcsTds
		var validateTcsTds = function(e) {
		  // Get the current value of the input field
		  var t='';
		  var id=e.id;
		  var tempVal;
		  var tid;
		  if(id=='tcsValue'||id==undefined){
			  tempVal = $("#tcsType").val();
			  t=$("#tcsValue").val();
			  tid="tcsValue";
		  }else{
			  tempVal = $("#tdsType").val();
			  t=$("#tdsValue").val();
			  tid="tdsValue";
		  }
		  // Remove any non-numeric characters except decimal point
		  t = t.replace(/[^\d.]/g, '');

		  // Split the string into parts before and after the decimal point
		  var parts = t.split('.');

		  // Ensure the first part (before the decimal point) is a valid number
		  parts[0] = parts[0].replace(/\D/g, '');

		  // If there are more than one decimal points, keep only the first one
		  if (parts.length > 2) {
		    parts = [parts.shift(), parts.join('')];
		  }

		  // If there's a second part (after the decimal point), limit it to two digits
		  if (parts[1]) {
		    parts[1] = parts[1].substring(0, 2);
		  }
		  if(tempVal=='1'){
			  // If the first part exceeds 9 digits, truncate it
			  if (parts[0].length >= 10) {
			    parts[0] = parts[0].substring(0,9);
			  } 
		  }else{
			  // If the first part exceeds 3 digits, truncate it
			  if (parts=='100') {
			      parts[0] = parts[0];
			  }else if (parseFloat(parts)<100.00) { 
				  parts[0] = parts[0].substring(0,2);
			  }else{
				  parts[0] ='0'; 
				  if (parts[1]) {
					    parts[1] = parts[1].substring(0, 0);
				   }
				  $("#" + tid).val('0')
			  }   
		  }
		  // Trim leading zeros from the first part
		  parts[0] = parts[0].replace(/^0+/, '');
		  
		  // If the first part is empty, set it to '0'
		  if (parts[0] === '') {
		    parts[0] = '0';
		  }
		 
		  // Reconstruct the value with at most two decimal places
		   if(id=='undefined'){
			   e.value = tempVal;
		   }else{
			   e.value = parts.join('.'); 
		   }
		  // Call the price calculation function after sanitizing the input
		  //priceCalculation();
		  tcsTdsCalculation();
		}
	 
	 
	// tcs tds calculation
		function tcsTdsCalculation() {

			var tcsValue = $("#tcsValue").val();
			var tdsValue = $("#tdsValue").val();
			var subTotal = $("#subTotal").val();
			var grandTotal2 = $("#grandTotal").val();
			var adjustment = $("#adjustment").val();

			if (subTotal == "" || subTotal == null || subTotal == "null") {
				subTotal = 0;
				$("#subTotal").val(subTotal);
			}
			var qSGST = $("#qSGST").val();
			if (qSGST == "" || qSGST == null || qSGST == "null") {
				qSGST = 0;
				$("#qSGST").val(qSGST);
			}
			var qCGST = $("#qCGST").val();
			if (qCGST == "" || qCGST == null || qCGST == "null") {
				qCGST = 0;
				$("#qCGST").val(qCGST);
			}
			var qIGST = $("#qIGST").val();
			if (qIGST == "" || qIGST == null || qIGST == "null") {
				qIGST = 0;
				$("#qIGST").val(qIGST);
			}

			var tcsAmount = $("#tcsAmount").val();
			if (tcsAmount == "" || tcsAmount == null || tcsAmount == "null") {
				tcsAmount = 0;
				$("#tcsAmount").val(tcsAmount);
			}
			var tdsAmount = $("#tdsAmount").val();
			if (tdsAmount == "" || tdsAmount == null || tdsAmount == "null") {
				tdsAmount = 0;
				$("#tdsAmount").val(tdsAmount);
			}
			var grandTotal = $("#grandTotal").val();
			if (grandTotal == "" || grandTotal == null || grandTotal == "null") {
				grandTotal = 0;
				$("#grandTotal").val(grandTotal);
			}
			
			var totVal = parseFloat(subTotal) + parseFloat(qSGST)
					+ parseFloat(qCGST) + parseFloat(qIGST);
			
			if (tcsValue && tdsValue) {
				if($("#tcsType").val()=='0'){
					var tcs = (parseFloat(totVal) * parseFloat(tcsValue)) / 100;
					$("#tcsAmount").val(tcs.toFixed(2));
				}else{
					var tcs = $("#tcsValue").val();
					$("#tcsAmount").val(tcs);
				}
				if($("#tdsType").val()==0){
					var tds = (parseFloat(subTotal) * parseFloat(tdsValue)) / 100;
					$("#tdsAmount").val(tds.toFixed(2));
				}else{
					var tds = $("#tdsValue").val();
					$("#tdsAmount").val(tds);
				}
				var add = parseFloat(totVal) - parseFloat(tcs) - parseFloat(tds);
				$("#grandTotal").val((add).toFixed(2));
			} else {
				var add = 0;
				$("#grandTotal").val((totVal).toFixed(2));
			}
		}

    if (value !== null && value !== undefined) {
        var parts = value.toString().split('.');
        var integerPart = parts[0];
        var decimalPart = parts.length > 1 ? '.' + parts[1] : '';
        var formattedIntegerPart = new Intl.NumberFormat('en-IN').format(integerPart);
        return formattedIntegerPart + decimalPart;
    } else {
        return '';
    }
}

function safeBase64Encode(text) {
    if (!text || text === "null") {
        return "";
    }
    
    return btoa(String.fromCharCode(...new TextEncoder().encode(text)));
}

function safeBase64Decode(base64) {
    if (!base64 || base64 === "null") {
        return ""; 
    }
    
    return new TextDecoder().decode(Uint8Array.from(atob(base64), c => c.charCodeAt(0)));
}

																<div class="col-md-4" id="quantityDiv">
																	<div class="form-group">
																		<label>Quantity<span class="mandatory">*</span></label>
																		<input type="text" id="quantity" class="form-control"
																			onkeyup="calculateLineTotal();"
																			oninput="restrictedInput('quantity');">
																	</div>
																</div>
																<div class="col-md-4" id="unitPriceDiv">
																	<div class="form-group">
																		<label>Unit Price<span class="mandatory">*</span></label><input
																			type="text" id="unitPrice" class="form-control"
																			onkeyup="calculateLineTotal();"
																			oninput="restrictedInput('unitPrice');">
																	</div>
																</div>
																<div class="col-md-4" id="freightAmountDiv">
																	<div class="form-group">
																		<label>Freight Amount</label> <input type="text"
																			id="freightAmount" class="form-control"
																			onkeyup="calculateLineTotal();"
																			oninput="restrictedInput('freightAmount');">
																	</div>
																</div>

																<div class="col-md-4" id="discountDiv">
																	<div class="form-group">
																		<label>Discount</label>
																		<div class="d-flex">
																			<div>
																				<input type="text" id="discount"
																					class="form-control"
																					onkeyup="calculateLineTotal();"
																					oninput="restrictedInput('discount');">
																			</div>
																			<div class="select" style="width: 60px;">
																				<select id="discountAmount" class="form-control"
																					onchange="calculateLineTotal();">
																					<option value="0" selected>%</option>
																					<option value="1">₹</option>
																				</select>
																			</div>

																		</div>
																	</div>
																</div>

																<div class="col-md-4" id="gstRateDiv">
																	<div class="form-group">
																		<label>GST Rate (%)<span class="mandatory">*</span></label><input
																			type="text" id="gstRate" class="form-control"
																			oninput="restrictedInput('gstRate');">
																	</div>
																</div>

																<div class="col-md-4" id="lineTotalDiv">
																	<div class="form-group">
																		<label>Line Total<span class="mandatory">*</span></label>
																		<input type="text" id="lineTotal" class="form-control"
																			oninput="restrictedInput('lineTotal');">
																	</div>
																</div>

																<div class="col-md-4" id="challanNo">
																	<div class="form-group">
																		<label>Challan No</label><input type="text"
																			id="challan_no" class="form-control"
																			onblur="removeValid(event)" readonly>
																	</div>
																</div>

																<div class="col-md-4" id="challanDt">
																	<div class="form-group calendar_box">
																		<label>Challan Date</label> <input type="text"
																			id="challan_dt" class="form-control"
																			onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('challan_dt','${session.DATEFORMAT_JS}')|"
																			readonly>
																		<!-- <i class="ti-calendar picker_calendar"
																			id="toDateCalendarDelivery"></i> -->
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>SAP ID</label><input type="text" id="sapno"
																			class="form-control" onblur="removeValid(event)">
																	</div>
																</div>
																<div class="col-md-8" id="descriptionDiv">
																	<div class="form-group">
																		<label>Description</label>
																		<textarea id="description" class="mt-2"> </textarea>

																	</div>
																</div>
															</div>



														</div>
													</div>

												</div>
											</div>
										</div>
										<div id="vendordetails" class="tab-pane fade h-100 p-2"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<!-- <td width="50%">GRN ID: <strong
																	class="invoiceheadClass"></strong></td> -->
																<td width="50%" style="vertical-align: middle;"><span
																	class="head-user-name vendorNameClass"></span></td>
																<td>
																	<div class="d-flex justify-content-end">
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="nextTab('itemDetailsLiId')">Prev</button>
																		</div>
																		<div class="mr-0">
																			<button class="btn btn-primary edit-btn"
																				id="saveMstrBtn" type="button" onclick="save()">Save</button>
																		</div>
																	</div>


																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<!-- <div class="row">
														<div class="col-md-12">
															<h5 class="sub-header-new">Documents</h5>
														</div>
													</div> -->

													<div class="row">
														<div class="col-md-12">
															<div class="d-flex justify-content-between">
																<div>
																	<h5 class="sub-header-new">Document Details :</h5>
																</div>
																<div class="row">
																	<div class="col-md-12 cnt-sp-end">
																		<div class="d-flex gap-1 task-btn-sec">

																			<button id="docAddBtn"
																				class="border-0 btn-transition btn btn-outline-primary"
																				title="Add Doc" onClick="uploadDocOnClick()"
																				data-bs-toggle="tooltip">
																				<i class="fa fa-plus-square" aria-hidden="true"></i>

																			</button>
																			<button id="docDeleteBtn"
																				class="border-0 btn-transition btn btn-outline-primary"
																				title="Remove Doc" disabled
																				onclick="deleteDocDetailsOnclick()"
																				data-bs-toggle="tooltip">
																				<i class="fa fa-trash"></i>
																			</button>

																		</div>
																	</div>
																</div>
															</div>
															<div class="controls" hidden>
																<input type="file" class="document" id="uploadDoc_0"
																	accept=".jpeg, .jpg, .png, .pdf" name="userImage"
																	onchange="saveMultiFile(event)" />
															</div>

															<div class="row mt-2">
																<div id="myDocumentGrid"
																	style="width: 100%; height: 200px;"
																	class="ag-theme-alpine"></div>
															</div>
														</div>
													</div>

													<div class="row mt-2">
														<div class="col-md-12">
															<h5 class="sub-header-new">Terms & Conditions</h5>
														</div>
														<div class="form-group col-lg-12">
															<!-- <label style="margin-bottom: 10px;">Terms &
														Conditions</label> -->
															<textarea id="terms" class="form-control"
																style="height: 129px;"> </textarea>

														</div>

													</div>
												</div>

											</div>


										</div>
										<!-- end of Tab Content -->
									</div>
									<!-- Tab End -->
								</div>
								<!-- Right Section End -->
							</div>
						</div>
						<!--Tabbination 1 End-->
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
