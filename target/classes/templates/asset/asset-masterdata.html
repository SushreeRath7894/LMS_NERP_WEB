	function getData() {

		var type = "asset"

		$.ajax({
			type : "GET",
			url : "dropdown-master-getAsset?type=" + type,
			success : function(response) {
				if (response.code == "success") {

					var datas = JSON.parse(response.body);
                    var assetData = datas.assetData
					gridOption1.api.setRowData(assetData);
                    
                    var assetCategory = datas.assetCategory
				    gridOptions2.api.setRowData(assetCategory);
                    
                    var dummyAsset = datas.dummyAsset
					gridOptions3.api.setRowData(dummyAsset);
                    
                    var assetOwnership = datas.assetOwnership
					gridOption4.api.setRowData(assetOwnership)
					
					var assetSubCategory=datas.assetSubCategory
					gridOption5.api.setRowData(assetSubCategory)
					
					var assetSpCategory = datas.assetSparePartCategory
					gridOption6.api.setRowData(assetSpCategory)
					
					var assetSpSubCategory = datas.assetSparePartSubCategory
					gridOption7.api.setRowData(assetSpSubCategory)
				}
			},
			error : function(e) {
			}
		});
	}
