<script>

		$(function () {

			
			var gridDiv = document.querySelector('#myGrid');
		    new agGrid.Grid(gridDiv, gridOptions);
		    
		    const currentMonth = ("0" + (new Date().getMonth() + 1)).slice(-2);
			$("#monthDropdown").val(currentMonth);
			// var assetId = $('#assetId').val();
			 $.ajax({
				    url: "portable-report-get-filter-data?month=" + currentMonth,
				    type: 'GET',
				    dataType: 'json',
				    success: function(response) {
				        var monthNames = [
				            "January", "February", "March", "April", "May", "June",
				            "July", "August", "September", "October", "November", "December"
				        ];

				        var data = JSON.parse(response.body)[0]; // Remove the outer array
				        electrician=data[0].electrician;
				        
				        data.forEach((item, index) => {
				            item.slNo = index + 1; 
				            item.monthName = monthNames[item.month - 1];   
				        });

				        gridOptions.api.setRowData(data);
				    },
				    error: function(error) {
				        console.log("Error fetching data:", error);
				    }
				});

			  
			$("#myGrid").show();
			$("#delete").attr("disabled", true);
			$("#approve").attr("disabled", true);
			$("#return").attr("disabled", true);
			$("#reject").attr("disabled", true);

  
		});
 
		$(function () {
			$('.collapse').on('show.bs.collapse', function () {
				$(this).siblings('.panel-heading').addClass('active');
			});

		})
		//search bar

		function onQuickFilterChanged() {
			gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);

			var length = gridOptions.api.getDisplayedRowCount();
			$("#totalReq").find('span').html(length);

		}

		function cancelBar() {
			var id = document.getElementById("closeKey");
			id.style.display = "block";
			if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
				id.style.display = "none";
			}
		} 
		
		// column Defs
		// Column definitions with static headers
var columnDefs = [
  
        	 {
                 headerName: 'SL No',
                 field: "slNo",
                 width: 100,
                 cellStyle: { textAlign: 'center' }
             },{
                                headerName: 'Asset Name',
                                field: "assetName",
                                width: 350
                            },
                            {
                                headerName: 'Status After Check',
                                field: "completeStatus",
                                width:300,
                                cellStyle: { textAlign: 'center' }
                            },
                             
                              {
                                headerName: 'Remark',
                                field: "remark",
                                width:300,
                                cellStyle: { textAlign: 'center' }
                            }, {
                                headerName: 'Date',
                                field: "date",
                                width: 300,
                                cellStyle: { textAlign: 'center' }
                            }
              
        
];

 

// Grid options
var gridOptions = {
    columnDefs: columnDefs,
    rowData: [], // Initialize with empty array or set later
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true
    },
    domLayout: 'autoHeight'  // Adjust grid height automatically based on content
};
  
var electrician="";
function getSelectedMonth() {
    const monthDropdown = document.getElementById("monthDropdown");
    const selectedMonth = monthDropdown.value;

    $.ajax({
        url: "portable-report-get-filter-data?month=" + selectedMonth,
        type: 'GET',
        dataType: 'json',
        success: function(response) {
            if (response.body === "[]" || response.body === "") {
                gridOptions.api.setRowData([]);  
                console.log("No data available for the grid.");
            } else {
                 
                var data = JSON.parse(response.body)[0];
                

                 
                data.forEach((item, index) => {
                    item.slNo = index + 1;  
                });

                console.log("Data For The Grid=====>", data);
                gridOptions.api.setRowData(data); // Set the grid data
            }
        },
        error: function(error) {
            console.log("Error fetching data:", error);
        }
    });
}

async function downloadDetails() {

	const allRowData = [];
	gridOptions.api.forEachNode(node => allRowData.push(node.data));
	const date =allRowData[0].date
	console.log("Date======>",date)
    // Create a new workbook
    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet('Data');
    
    // Add image
    const imageId = workbook.addImage({
        buffer: await fetch(imageUrl).then(res => res.arrayBuffer()),
        extension: 'png',
    });

    worksheet.addImage(imageId, {
        tl: { col: 0, row: 0 }, // Top-left position (A1)
        ext: { width: 300, height: 100 }, // Adjust size as necessary
    });

   // Add a blank row after the image to avoid overlap
   for (let i = 0; i < 5; i++) {
        worksheet.addRow([]);
    }

	worksheet.addRow(['ORIFOOD AND BEVERAGE PRIVATE LIMITED']);
	worksheet.addRow(['PORTABLE TOOL MONTHLY']);
	worksheet.addRow([ '', '','', 'DATE:',date]);
	worksheet.addRow([]);

	const headers = gridOptions.columnDefs.map(col => col.headerName);
	worksheet.addRow(headers);
	
	// Add data rows
	allRowData.forEach(data => {
	    const row = gridOptions.columnDefs.map(col => data[col.field]);
	    worksheet.addRow(row);
	})

	worksheet.addRow([]);
	worksheet.addRow([]);
	
	worksheet.addRow(['SIGN OF', '', '','', 'SIGN OF']);
	worksheet.addRow(['ELECTRICIAN', '', '','', 'INCHARGE']);
	worksheet.addRow([electrician, '', '','', '']);
    // Write to file
    workbook.xlsx.writeBuffer().then(buffer => {
        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'portable_tool_report.xlsx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
  
}
