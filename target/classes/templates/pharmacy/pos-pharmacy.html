	function getData() {
	   $.ajax({
	      type: "GET",
	      url: "pos-sale-getData",
	      success: function (response) {
	         console.log(response);
	         if (response.message == "Success") {
	            var data = JSON.parse(response.body);
	            console.log("Success response", data);
	            // Clear existing items
	            $("#categoryData").empty();
	            $("#subCategoryData").empty();
	            $("#variantData").empty();
	            // Define arrays for category, subcategory, and variant data
	            let categoryDatas = [];
	            let subcategoryDatas = [];
	            let variantDatas = [];
	            // Populate the arrays with data
	            for (var i = 0; i < data.length; i++) {
	               // Category
	               if (data[i].categoryId) {
	                  let categoryAllData = `
		                            <input type="hidden" id="category-${data[i].categoryId}">
		                            <div class="food-name" onclick="selectData(${i}, '${data[i].categoryId}', null, null)">${data[i].categoryName}</div>
		                        `;
	                  categoryDatas.push(categoryAllData);
	               }
	               // Subcategory
	               if (data[i].subCategoryId) {
	                  let subcategoryAllData = `
		                            <input type="hidden" id="subcategory-${data[i].subCategoryId}">
		                            <div class="food-name" onclick="selectData(${i}, null, '${data[i].subCategoryId}', null)">${data[i].subCategoryName}</div>
		                        `;
	                  subcategoryDatas.push(subcategoryAllData);
	               }
	               // Variant
	               if (data[i].variantId) {
	                  let variantAllData = `
		                            <input type="hidden" id="variant-${data[i].variantId}">
		                            <div class="food-name" onclick="selectData(${i}, null, null, '${data[i].variantId}')">${data[i].variantName}</div>
		                        `;
	                  variantDatas.push(variantAllData);
	               }
	            }
	            // Append the arrays to their respective containers
	            $("#categoryData").append(categoryDatas);
	            $("#subCategoryData").append(subcategoryDatas);
	            $("#variantData").append(variantDatas);
	         } else {
	            console.log("Data fetch unsuccessful");
	         }
	      },
	      error: function (status, error) {
	         console.error("AJAX error:", status, error);
	      }
	   });
	}
	
	
	let selectedIds = [null, null, null]; // Initialize array to store selected IDs
	function selectData(index, categoryId, subCategoryId, variantId) {
	   // Update selected IDs array only if new values are provided
	   selectedIds[0] = categoryId !== null ? categoryId : selectedIds[0];
	   selectedIds[1] = subCategoryId !== null ? subCategoryId : selectedIds[1];
	   selectedIds[2] = variantId !== null ? variantId : selectedIds[2];

	   $.ajax({
	      type: "GET",
	      url: "pos-sale-getItem?cId=" + selectedIds[0] + "&sId=" + selectedIds[1] + "&vId=" + selectedIds[2],
	      success: function (response) {
	         console.log(response);
	         if (response.message == "Success") {
	            var itemList = JSON.parse(response.body);
	            console.log("Success response itemList", itemList);
	            var container = $("#itemData");
	            container.empty(); // Clear existing items
	            let itemDatas = [];
	            for (var i = 0; i < itemList.length; i++) {
	               let itemAllData = `
			                        <input type="hidden" id="${itemList[i].itemId}">
			                        <input type="hidden" id="${itemList[i].price}">
			                        <input type="hidden" id="${itemList[i].categoryId}">
			                        <input type="hidden" id="${itemList[i].subCategoryId}">
			                        <input type="hidden" id="${itemList[i].variantId}">
			                        <div class="food-name" onclick="selectItem('${itemList[i].itemId}','${itemList[i].price}',
			                        		'${itemList[i].itemName}', '${itemList[i].categoryId}', '${itemList[i].subCategoryId}', 
			                        		'${itemList[i].variantId}')">${itemList[i].itemName}</div>
			                    `;
	               itemDatas.push(itemAllData);
	            }
	            container.append(itemDatas);
	         } else {
	            console.log("Data fetch unsuccessful");
	         }
	      },
	      error: function (status, error) {
	         console.error("AJAX error:", status, error);
	      }
	   });
	}

	function pushToList(newItem) {
	   console.log("pushToList function called");
	   var found = false;
	   $.each(window.dataArray, function (index, item) {
	      if (item.id === newItem.id) {
	         // If item with the same id exists, increment its count
	         item.count += newItem.count;
	         item.price = item.count * newItem.price; // Update item price based on count and unit price
	         found = true;
	         return false; // Exit the loop
	      }
	   });
	   if (!found) {
	      // Add the new item without modifying its quantity and price
	      window.dataArray.push(newItem);
	   }
	}

  function toggleFields() {
        // Get all the divs by their IDs
        const checkField = document.getElementById("checkField");
        const onlineField = document.getElementById("onlineField");
        const upiField = document.getElementById("upiField");
        const cashField = document.getElementById("cashField");

        // Get selected radio button
        const selectedPaymentType = document.querySelector('input[name="flexRadioDefault"]:checked').id;

        // Hide all divs initially
        checkField.style.display = "none";
        onlineField.style.display = "none";
        upiField.style.display = "none";
        cashField.style.display = "none"; // Hide cashField initially

        // Show the respective div based on the selected radio button
        if (selectedPaymentType === "flexRadioDefault1") {
            cashField.style.display = "block"; // Show cashField for Cash
        } else if (selectedPaymentType === "flexRadioDefault2") {
            checkField.style.display = "block"; // Show checkField for Cheque
        } else if (selectedPaymentType === "flexRadioDefault3") {
            onlineField.style.display = "block"; // Show onlineField for Online
        } else if (selectedPaymentType === "flexRadioDefault4") {
            upiField.style.display = "block"; // Show upiField for UPI
        }
    }

	// Function to handle quantity multiplier buttons
    function itemMultiple(multiplier) {
    const selectedItemName = getSelectedItemName();  
    console.log("selectedItemName= ", selectedItemName);

    if (selectedItemName && selectedItems[selectedItemName]) {
        selectedItems[selectedItemName].quantity *= multiplier;

        const basePrice = getItemBasePrice(selectedItemName);
        selectedItems[selectedItemName].amount = basePrice * selectedItems[selectedItemName].quantity;

        updateItemTable();
    }
}

	    return itemPrices[itemName] || 0; // Default to 0 if not found
	}

	// Event listener for category click (for filtering items by category)
	$(document).on('click', '.category', function () {
	    const category = $(this).data('category');
	    const items = itemsByCategory[category];

	    // Clear existing items in the item box
	    $('#itemData').empty();

	    // Loop through items and append them to the itemData div
	    items.forEach(item => {
	        $('#itemData').append(`<div class="food-name item" data-item="${item}">${item}</div>`);
	    });
	});

	// Event listener for item click
	$(document).on('click', '.item', function () {
	    const itemName = $(this).data('item');
	    const itemPrice = getItemBasePrice(itemName);

	    console.log("itemName= ", itemName);
	    console.log("itemPrice= ", itemPrice);

	    // Store the last selected item
	    lastSelectedItemName = itemName;

	    // Check if item already exists in the selectedItems
	    if (selectedItems[itemName]) {
	        // Increment the quantity
	        selectedItems[itemName].quantity += 1;
	        selectedItems[itemName].amount = selectedItems[itemName].quantity * itemPrice;
	    } else {
	        // Add new item with quantity 1 and the corresponding amount
	        selectedItems[itemName] = {
	            quantity: 1,
	            amount: itemPrice
	        };
	    }

	    // Update the table with selected items
	    updateItemTable();
	});




function updateItemTable() {
    // Clear existing rows except the header
    $('#itemAddDiv').find("tr:gt(0)").remove();

    let totalAmount = 0;

    // Arrays to store item details
    const itemNames = [];
    const quantities = [];
    const amounts = [];

    // Loop through selectedItems and add them to the table
    for (const itemName in selectedItems) {
        const item = selectedItems[itemName];
        totalAmount += item.amount;

        // Store item details in arrays
        itemNames.push(itemName);
        quantities.push(item.quantity);
        amounts.push(item.amount.toFixed(2));

        $('#itemAddDiv').append(`
            <tr>
                <td>${itemName}</td>
                <td>${item.quantity}</td>
                <td>${item.amount.toFixed(2)}</td>
                <td><button class="delete-item btn btn-danger" data-item="${itemName}">Del</button></td>
            </tr>
        `);
    }

    // Calculate CGST and SGST (2.5% each)
    const cgst = totalAmount * 0.025;
    const sgst = totalAmount * 0.025;

    // Calculate Grand Total
    const grandTotal = totalAmount + cgst + sgst;

    // Update total amount and tax fields in the DOM
    $('#itemAddDiv').append(`
        <tr>
            <td colspan="2" style="background: #dcdcdc; text-align: right;">Total</td>
            <td style="background: #dcdcdc;">${totalAmount.toFixed(2)}</td>
        </tr>
    `);

    $('#itemAddDiv').append(`
        <tr>
            <td colspan="2" style="background: #dcdcdc; text-align: right;">CGST (2.5%)</td>
            <td style="background: #dcdcdc;">${cgst.toFixed(2)}</td>
        </tr>
    `);

    $('#itemAddDiv').append(`
        <tr>
            <td colspan="2" style="background: #dcdcdc; text-align: right;">SGST (2.5%)</td>
            <td style="background: #dcdcdc;">${sgst.toFixed(2)}</td>
        </tr>
    `);

    $('#itemAddDiv').append(`
        <tr>
            <td colspan="2" style="background: #dcdcdc; text-align: right;">Grand Total</td>
            <td style="background: #dcdcdc;">${grandTotal.toFixed(2)}</td>
        </tr>
    `);

    // Store the values in hidden inputs for later use in saveData
    $("#itemNames").val(JSON.stringify(itemNames));
    $("#quantities").val(JSON.stringify(quantities));
    $("#amounts").val(JSON.stringify(amounts));
    $("#totalAmount").val(totalAmount.toFixed(2));
    $("#cgst").val(cgst.toFixed(2));
    $("#sgst").val(sgst.toFixed(2));
    $("#grandTotal").val(grandTotal.toFixed(2));

    // Attach delete event handler to the dynamically generated buttons
    $('.delete-item').on('click', function () {
        const itemName = $(this).data('item');
        deleteItem(itemName);
    });
}


	
	
function deleteItem(itemName) {
    if (selectedItems[itemName]) {
        selectedItems[itemName].quantity -= 1;
        if (selectedItems[itemName].quantity <= 0) {
            delete selectedItems[itemName];
        } else {
            const itemPrice = getItemBasePrice(itemName);
            selectedItems[itemName].amount = selectedItems[itemName].quantity * itemPrice;
        }
        updateItemTable();
    }
}

        if ($("#flexRadioDefault1").is(":checked")) { // Cash
            datas.paymentMethod = "Cash";
            datas.cashRemark = $("#cashRemark").val();
        } 
        else if ($("#flexRadioDefault2").is(":checked")) { // Cheque
            datas.paymentMethod = "Cheque";
            datas.chequeNumber = $("#checkId").val();
            datas.bankName = $("#bankName").val();
            datas.branchName = $("#branchName").val();
            datas.accountNumber = $("#accountNumber").val();
            datas.remark = $("#remark").val();
        } 
        else if ($("#flexRadioDefault3").is(":checked")) { // Online
            datas.paymentMethod = "Online";
            datas.transactionNumber = $("#transactionId").val();
            datas.receiverBankName = $("#receiverbankName").val();
            datas.receiverBranchName = $("#receiverBranchName").val();
            datas.receiverIfsc = $("#receiverIfsc").val();
            datas.receiverAccountNumber = $("#receiverAccountNumber").val();
            datas.onlineRemark = $("#onlineRemark").val();
        } 
        else if ($("#flexRadioDefault4").is(":checked")) { // UPI
            datas.paymentMethod = "UPI";
            datas.upiId = $("#upiId").val();
            datas.receiverUpiId = $("#receiverUpiId").val();
            datas.upiTransactionId = $("#upiTransactionId").val();
            datas.upiRemark = $("#upiRemark").val();
        }
    	
   	    var userid = $("#sessionId").val();
   	    var orgName = $("#sessionOrg").val();
   	    var orgDiv = $("#sessionOrgDiv").val();
    	datas.userid=userid;
    	datas.orgName=orgName;
    	datas.orgDiv=orgDiv;
    	 
    	console.log("DATASS------------------",datas);
    	savePharmacyData(datas);


     		
    }
    function savePharmacyData(datas) {
       		$('.loader').show();
       		$("body").addClass("overlay");
    		$.ajax({
    			type : "POST",
    			url : "pos-pharmacy-add",
    			contentType : "application/json",
    			data : JSON.stringify(datas),
    			success : function(response) {
    		if (response.code == "Success") {
    			$('.loader').hide();
    			$("body").removeClass("overlay");
    			$("#messageParagraph").text("Data Saved Successfully");
    			$("#msgOkModal").removeClass("btn3");
    			$("#msgOkModal").addClass("btn1");
    			$("#msgModal").modal('show');
    			$("#modalCall").modal('hide');
    			location.reload();
    		}

    	},
    	error : function(datas) {
    		console.log(datas)
    	}
    })

    }
 function cancel() {
	 $("#pharmacyGridModal").modal('hide');
 }

 function reportDownload(id) {
 	window.open("/pharmacy/pharmacy-pdf-downloads?id="+window.btoa(id), '_blank');  
 }

</script>
