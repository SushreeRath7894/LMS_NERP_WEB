function saveFile(event, rowId) {
    var uFile = event.target.files[0];
    var fileName = event.currentTarget.value;
    var lastIndex = fileName.lastIndexOf("\\");
    if (lastIndex >= 0) {
        fileName = fileName.substring(lastIndex + 1);
    }
    var extension = fileName.split(".");
    var iURL = URL.createObjectURL(uFile);

    var LightImg;
    if (extension[1].toLowerCase() == "jpg" || extension[1].toLowerCase() == "png" || extension[1].toLowerCase() == "jpeg") {
        LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_blank'><i class='fa fa-picture-o' style='color: blue'></i></a></div>";
    } else if (extension[1].toLowerCase() == "pdf") {
        LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_blank'><i class='fa fa-file-pdf-o' style='color: red'></i></a></div>";
    } else {
        LightImg = "<div class='uploadicon position-l'></div>";
    }

    $("#uploadedWarrDiv_" + rowId).html(LightImg);

    var fileData = new FormData();
    fileData.append('file', uFile);
    fileData.append('path', 'none');
    
    
    var details = {};
    var data = [];
    var reader = new FileReader();
	reader.readAsDataURL(uFile);
	var iURL = URL.createObjectURL(uFile);
	reader.onload = function() {
		data = reader.result.split(",");
		details.documentFileBase=data[1];
		details.fileName=fileName;
	};
	
	
	
	getImgUrl(fileName, rowId, details);
	
    
}

/**
 * @author Silpa
 */
 function getImgUrl(fileName, rowId, details){
	 $(".loader").show();
	 setTimeout(function() {
	 $.ajax({
			type : "POST",
			url : "media-decontamination-record-image-upload",
			contentType : "application/json",
			data : JSON.stringify(details),
			success : function(response) {
				
				$(".loader").hide();
				// Now update the AG Grid row data
			    var gridOptions = activityOptions // Reference to your AG Grid options

			    // Find the row node by ID
			    var rowNode = gridOptions.api.getRowNode(rowId);
			    if (rowNode) {
			        // Update the row data
			        rowNode.setDataValue('fileUpload', response);  // Set the file URL
			    }
			    
				
			},error : function(datas) {
				$(".loader").hide();
			}
	 });
	 }, 3000);
}

//function for download
function downloadDetails() { 
	var dataset = [];
	gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
		dataset.push(rowNode.data);
	});
    gridOptions.api.exportDataAsCsv(dataset);
}

      
	function approveFun(){
		$('#approveRequestModel').modal('show');
	}
	function cancelApproveRequest() {
		 $('#approveRequestModel').modal('hide');
		} 
	function approveRequestOnclick() {
		
		var selectedRows = gridOptions.api.getSelectedRows();
		 var id=selectedRows[0].mediaId;
		 console.log("vvv",id);
		$.ajax({
			type : "GET",
			url : "media-decontamination-record-approve?id=" + id,
			async : false,
			success : function(response) {

				if (true) {
					$('#approveRequestModel').modal('hide');
					$("#messageParagraph").text("Approved Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');


					agGrid.simpleHttpRequest({
						url : "media-decontamination-record-view"
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						console.log("lllllllll",jsonData);
						var allData=jsonData.viewMedia;
						if(allData!=null){
							var len = allData.length;
							$('#totalRmPM').find('span').html(len);
							gridOptions.api.setRowData(allData);
						}else{
							$('#totalRmPM').find('span').html('0');
							gridOptions.api.setRowData('');
						}
						
					});
					$('#reqDltBtn').attr("disabled", true);
					$('#assignBtn').attr("disabled", true);
					$('#newBtn').attr("disabled", false);
					
					
				}

			},
		});
	}
	
	function deleteFun(){
		var selectedRows = gridOptions.api.getSelectedRows();
				 var id=selectedRows[0].mediaId;
				$.ajax({
					type : "GET",
					url : "media-decontamination-record-delete?id=" + id,
					async : false,
					success : function(response) {
                          console.log(response);
						if (response.code == "200") {
							
							$("#messageParagraph").text(
							"Data Deleted Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							
							agGrid.simpleHttpRequest({
								url : "media-decontamination-record-view"
							}).then(function(data) {
								var jsonData = JSON.parse(data.body);
								console.log("lllllllll",jsonData);
								var allData=jsonData.viewMedia;
								if(allData!=null){
									var len = allData.length;
									$('#totalRmPM').find('span').html(len);
									gridOptions.api.setRowData(allData);
								}else{
									$('#totalRmPM').find('span').html('0');
									gridOptions.api.setRowData('');
								}
								
							});
						
							$('#reqDltBtn').attr("disabled", true);
							$('#assignBtn').attr("disabled", true);
							$('#newBtn').attr("disabled", false);
							
							
						}

					},
					error : function(data) {
					}
				});
	}
