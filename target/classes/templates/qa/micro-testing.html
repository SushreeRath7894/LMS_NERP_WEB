	/* //quotation item  table add */

	function saveTableData() {
		var editProduct = $("#editProduct").val();
		var item = {};
		var data = 1;
		var validation = true;
		
		 if (!validationUpdated("Select Date", 'date'))
			 validation = false;  
		
	if (validation) {
		item.slNo = data;
			itemOptions.api.forEachNode(function(rowNode, index) {
				if (!editProduct) {
					data = data + 1;
					item.slNo = data;
				}
				else{
					item.slNo = editProduct;
				}
				
			});
		
			item.date = $('#date').val();
			item.lightOn = $('#lightOn').val();
			item.lightOff = $('#lightOff').val();
			item.workingHrs = $('#workingHrs').val();
			item.workingHrsTotal = $('#workingHrsTotal').val();
			item.sign = $('#sign').val();
	
			var quot = [];

			if (editProduct) {
				var rowNode = itemOptions.api.getRowNode(editProduct);
				rowNode.setData(item);
			} else {
				itemOptions.api.forEachNode(function(rowNode, index) {
					quot.push(rowNode.data);
				});
				quot.push(item)
				itemOptions.api.setRowData(quot);
		
			}
			closeNav();
			$("#date").val('');
			$("#lightOn").val('');
			$("#lightOff").val('');
			$("#workingHrs").val('');
			$("#workingHrsTotal").val('');
			$("#sign").val('');
			
			$("#editProduct").val(null);
		}

	}

	function save() {
		if (validProductData() && validFormData()) {
			var datas = [];
			
			setTimeout(function() {

						obj.refNo = $("#refNo").val();
						obj.issueNo = $("#issueNo").val();
						obj.dateOfIssue = $("#dateOfIssue").val();
						obj.month = $("#month").val();
						obj.year = $("#year").val();
						console.log('Object',obj)
						datas.push(obj);
					});
					saveMt(datas);
				}else{
					$("#messageParagraph").text(
					"Please Add Items Details");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			}, 1000)
		
		}
	}

function calculateWorkingHours() {
    const lightOn = document.getElementById('lightOn').value;
    const lightOff = document.getElementById('lightOff').value;

    // Validate if lightOn is null or an empty string
    if (!lightOn) {
        console.log("11111111111111111");
        // Show an alert or modal
        $("#alert").modal('show');
        document.getElementById("textId").innerHTML = "Time Of UV Light Switched On is required";
        // Clear the lightOff field
        $("#lightOff").val('');
        return; // Exit the function early
    }
    
    if (lightOn && lightOff) {
        const startTime = new Date(`1970-01-01T${lightOn}`);
        const endTime = new Date(`1970-01-01T${lightOff}`);
        
        let diffMs = endTime - startTime;
        if (diffMs < 0) {
            diffMs += 24 * 60 * 60 * 1000; // Handle time past midnight
        }

        const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
        const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        
        console.log("@@@@@@@@@@@@@@@@", diffHrs);
        console.log("------------------", diffMins);
        
        document.getElementById('workingHrs').value = `${diffHrs} hours ${diffMins} minutes`;
    }
}
