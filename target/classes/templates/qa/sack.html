function findAvgLength() {
	  var inputs = document.getElementsByClassName('lenAvgCol');
	  var length = parseFloat(document.getElementById('length').value);
	  var minValue = Number.MAX_VALUE;
	  var maxValue = Number.MIN_VALUE;
	  var sum = 0;
	  var count = 0;

	  for (var i = 0; i < inputs.length; i++) {
	    var value = parseFloat(inputs[i].value);
	    sum = sum+value;
	    count = count+1;
	  }
	  var averageValue = count > 0 ? sum / 12 : 0;
	  if(isNaN(averageValue)){
		  averageValue = "0";
	  }
	  
	  if(averageValue<0){
		  averageValue = "0";
	  }
	  
	  $("#length").val(parseFloat(averageValue).toFixed(4));
	}

function changeDateFormat(inputDate) { // expects Y-m-d
	var splitDate = inputDate.split('-');
	if (splitDate.count == 0) {
		return null;
	}
	var year = splitDate[0];
	var month = splitDate[1];
	var day = splitDate[2];

	return day + '-' + month + '-' + year;
}

function savePlanDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "sack-details-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
			var itemName = $("#itemname option:selected").text();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				agGrid.simpleHttpRequest({
					url : 'sack-details-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body[0]);
					var allData=jsonData.view;
					console.log(allData)
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					gridOptions.api.setRowData(allData);
				});
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Test Parameter For "+itemName+" Already Exist.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				$("#itemid").val('');
				$("#itemname").val('');
				$("#description").val('');
				activityOptions.api.setRowData();
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}
