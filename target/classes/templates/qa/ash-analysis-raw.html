	// delete  

	function deleteOnclick() {
		
		var selectedRows = gridOptions.api.getSelectedRows();
		var id = selectedRows[0].ashAnalysisRawId;
		if (id) {
		
				$.ajax({
					type : "POST",
					url : "ash-analysis-rawdata-delete?id="+ id,
					success : function(response) {
					 if (response.message == "Success") {
						cancel();
						$("#messageParagraph").text("Report Deleted Sucessfully");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$('#delete').modal('hide');
					} else {
						$("#messageParagraph").text("Something went to wrong!");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
					}
				},
				error : function(data) {
					console.log(data)
				}
			})
		} else {
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
		}

	}

	// delete selected record from ag grid
	function deleteDetailsOnclick() {
		
		var grid = $("#deleteChildGrid").val();
		$('.modal').hide();
		
		if(grid == "details"){
			var selectedRows = activityOptions.api.getSelectedRows();
			activityOptions.api.applyTransaction({
				remove : selectedRows
			});
		}else if(grid == "sample"){
			var selectedRows1 = activityOptions1.api.getSelectedRows();
			activityOptions1.api.applyTransaction({
				remove : selectedRows1
			});
		}else if (grid == "composite"){
			var selectedRows2 = activityOptions2.api.getSelectedRows();
			activityOptions2.api.applyTransaction({
				remove : selectedRows2
			});
		}
		
		//$('#newchild').show();
		//$('#deletechild').hide;
		cancelModalProductBtn();
		$("#deleteChildGrid").val("");
		
	}

	 function changeDateFormat(inputDate) { // expects Y-m-d
			var splitDate = inputDate.split('-');
			if (splitDate.count == 0) {
				return null;
			}
			var year = splitDate[0];
			var month = splitDate[1];
			var day = splitDate[2];

			return day + '-' + month + '-' + year;
		}
	 
	
	 


 function calculation(sec){
	 var tareCrucible = '0';
	 var netWt = '0';
	 var wtAshing = '0';
	 if(sec == '1'){
		 tareCrucible = $("#tWtCrubical1").val();
		 netWt = $("#netWeightG1").val();
		 wtAshing = $("#wtafterAsh1").val();
	 }else if(sec == '2'){
		 tareCrucible = $("#tWtCrubical2").val();
		 netWt = $("#netWeightG2").val();
		 wtAshing = $("#wtafterAsh2").val();
	 }else if(sec == '3'){
		 tareCrucible = $("#tWtCrubical3").val();
		 netWt = $("#netWeightG3").val();
		 wtAshing = $("#wtafterAsh3").val();
	 }else if(sec == '4'){
		 tareCrucible = $("#tWtCrubical4").val();
		 netWt = $("#netWeightG4").val();
		 wtAshing = $("#wtafterAsh4").val();
	 }else if(sec == '5'){
		 tareCrucible = $("#tWtCrubical5").val();
		 netWt = $("#netWeightG5").val();
		 wtAshing = $("#wtafterAsh5").val();
	 }else if(sec == '6'){
		 tareCrucible = $("#tWtCrubical6").val();
		 netWt = $("#netWeightG6").val();
		 wtAshing = $("#wtafterAsh6").val();
	 }
	 
	 if(tareCrucible == "" || tareCrucible == null){
		 tareCrucible = '0';
	 }if(netWt == "" || netWt == null){
		 netWt = '0';
	 }if(wtAshing == "" || wtAshing == null){
		 wtAshing = '0';
	 }
	 
	 var res = ((parseFloat(wtAshing) - parseFloat(tareCrucible))/parseFloat(netWt))*100;
	 
	 if (isNaN(res) || !isFinite(res) || res == '') {
		res = '0';
	} else {
		res = res;
	}
	 if(sec == '1'){
		 $("#ashAs1").val(res);
	 }else if(sec == '2'){
		 $("#ashAs2").val(res);
	 }else if(sec == '3'){
		 $("#ashAs3").val(res);
	 }else if(sec == '4'){
		 $("#ashAs4").val(res);
	 }else if(sec == '5'){
		 $("#ashAs5").val(res);
	 }else if(sec == '6'){
		 $("#ashAs6").val(res);
	 }
 }
