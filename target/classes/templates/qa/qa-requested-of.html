	function onRowSelection() {

		var selectedNodes = gridOptions.api.getSelectedNodes();

		console.log("testStatus",testStatus);
		var rowCount = 0;
		selectedNodes.forEach(function(i) {
			rowCount = rowCount + 1;
		});

		if (rowCount > 0) {
			
			if( testStatus == "Pending"){
				$('#assign').attr('disabled', true);
				$("#messageParagraph").text("Test Result Is Not Set.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}else{
				if(st=="Approved"){
					$('#assign').attr('disabled', true);
					$("#messageParagraph").text("Result Already Approved.");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}else{

				}
			}
		} else {
			$('#assign').attr('disabled', true);
		}

	function downloadDetails() { 
		  var dataset = [];

	function dloadQr(){
		var x = '/document/userQrCode/';
		let url = x + qrId;
		let fileName = qrId; 
		qrDownload(url,fileName);
	}
	
	function qrDownload(url, fileName){
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.responseType = "blob";
    xhr.onload = function(){
        var urlCreator = window.URL || window.webkitURL;
        var imageUrl = urlCreator.createObjectURL(this.response);
        var tag = document.createElement('a');
        tag.href = imageUrl;
        tag.download = fileName;
        document.body.appendChild(tag);
        tag.click();
        document.body.removeChild(tag);
    }
    xhr.send();
}
