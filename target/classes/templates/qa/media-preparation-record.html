function masterSaveData(){
	activityOptions.api.stopEditing();
		$(".formValidation").remove();
		var valid= true;
		var datas = [];
		var i=-1;
		var rowCount = activityOptions.api.getDisplayedRowCount();
		
		if(rowCount > 0){
			
			
			activityOptions.api.forEachNode(function(rowNode, index) {
				var item = rowNode.data;
				
				
				if (item.mediaDate == null || item.mediaDate == "") {
					valid = validationUpdated("Date Required", "mediaDate");
				 }			
				     item.mediaId = $("#mediaPreparationId").html();
				     item.mediaDate = $("#mediaDate").val();
				     item.remarks = $("#remarks").val();
				     item.docName = $("#imageName_0").html();
				     console.log("rowNode2====",item);
				
		        if(valid){
		        	datas.push(item);
		         }
			});

	
		
		if (valid) {
			saveDetails(datas);
			}
		} else {
			$("#messageParagraph").text(
			"Please Add Atleast One Details");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
		}
		console.log("data1-----",datas);
	
}
function saveDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "media-preparation-record-details-save",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
		//	var itemName = $("#itemname option:selected").text();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				agGrid.simpleHttpRequest({
					url : 'media-preparation-record-details-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body[0]);
					var allData=jsonData.view;
					console.log(allData)
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					gridOptions.api.setRowData(allData);
				});
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Test Parameter For "+itemName+" Already Exist.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
				$("#itemid").val('');
				$("#itemname").val('');
				$("#description").val('');
				activityOptions.api.setRowData();
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

	function editMedia(mediaId,sts,pId) {
		if(sts == "1"){
		    $("#save").hide();
		}else{
			$("#save").show();
		}
		
		 agGrid.simpleHttpRequest(
				{
					url : 'media-preparation-record-edit?id='+ mediaId
				}).then(function(data) {
					console.log("allDATA",data);
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.TEMP;			
					$("#myGrid").hide();
					switchPage();
					activityOptions.api.setRowData();
					activityOptions.api.setRowData(allData);
					
					  $("#mediaPreparationId").html(mediaId);
					  $("#mediaId").val(mediaId);
				      $("#mediaDate").val(allData[0].mediaDate);
				      $("#remarks").val(allData[0].remarks);
				     
				      
				  	var fileName=allData[0].docName;
					if (fileName != null) {
						var ext = allData[0].docName.split(".");
						$("#imageName_0").html(fileName);
 
			           if (ext[1] == "jpg" || ext[1] == "png") {
							var LightImg = '<div class ="uploadicon position-l"><a class="example-image-link" target="_balnk"><i class="fa fa-picture-o" style="color: blue" onclick=viewImage("'
								+ fileName + '")></i></a> </div>';
						}else if (ext[1] == "pdf") {
							var LightImg = '<div class ="uploadicon position-l"><a class="example-image-link" target="_balnk"><i class="fa fa-file-pdf-o" style="color: red" onclick=viewImage("'
								+ fileName + '")></i></a> </div>';
						} else {
							var LightImg = "<div class='uploadicon position-l'> </div>";
						}  

						$("#uploadedBillDiv_0").html(LightImg);
					}
				});

	}

	 function changeDateFormat(inputDate) { // expects Y-m-d
			var splitDate = inputDate.split('-');
			if (splitDate.count == 0) {
				return null;
			}
			var year = splitDate[0];
			var month = splitDate[1];
			var day = splitDate[2];

			return day + '-' + month + '-' + year;
		}

 /* save document file */
	function saveFile() {

		var uFile = $(uploadDoc_0)[0].files[0];
		var fileName = event.currentTarget.value;
		var lastIndex = fileName.lastIndexOf("\\");
		if (lastIndex >= 0) {
			fileName = fileName.substring(lastIndex + 1);
		}
		var extension = fileName.split(".");
		var iURL = URL.createObjectURL(uFile);
		$("#uploadedBillDiv_0").html("");

		if (extension[1] == "jpg" || extension[1] == "png"|| extension[1] == "jpeg") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-picture-o' style='color: blue'></i></a></div>";
		}else if (extension[1] == "pdf") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-file-pdf-o' style='color: red'></i></a></div>";
		} else {
			var LightImg = "<div class='uploadicon position-l'> </div>";
		}
		$("#uploadedBillDiv_0").html(LightImg);
		$("#imageName_0").html(fileName);
		var fileData = new FormData();
		fileData.append('file', uFile);
		fileData.append('path', 'none');

		$.ajax({
			type : "POST",
			url : "media-preparation-record-upload-file",
			enctype : "multipart/form-data",
			contentType : false,
			data : fileData,
			processData : false,
			cache : false,
			success : function(response) {

			},
			error : function(e) {

			}
		});
	}
