<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
  <style type="text/css">
    body {
      font-family: sans-serif;
    }

    table {
      width: 100.1%;
      border-collapse: collapse;
      margin-left: -1px;
      margin-right: -1px;
      background: #fff;
    }

    .left-logo img {
      height: 60px;
    }

    .annexure {
      font-size: 20px;
      text-align: center;
      font-weight: 600;
    }

    .orifood {
      font-size: 20px;
      text-align: center;
      font-weight: 600;
      text-transform: uppercase;
    }

    .heading {
      font-weight: 700;
      font-size: 25px;
      text-decoration: underline;
      text-align: center;
    }

    .header-box {
      border: 2px solid #000;
      padding: 5px;
      width: 160px;
    }

    .ref-no {
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 4px;
      text-align: left;
    }

    tbody td {
      padding: 5px;
      height: 29px;
    }

    tbody th {
      padding: 5px;
      height: 29px;
    }

    .td-gap {
      padding: 30px 0px;
    }

    .btm-box {
      height: 100px;
      padding: 5px 0px;
      vertical-align: bottom;
      font-weight: 700;
    }

    .text-center {
      text-align: center;
    }

    .top-tble-text {
      font-weight: 600;
    }

    .d-flex {
      display: flex;
    }

    .mt-10 {
      margin-top: 10px
    }

    .frequency {
      font-size: 18px;
      text-transform: uppercase;
      font-weight: 600;
      font-family: serif;
    }

    @page {
      size: landscape;
    }
  </style>
 </head>
  <body>
    <div class="execution">
      <table>
        <tr>
          <td>
            <table>
              <tr>
                <td width="20%" style="vertical-align: bottom;" class="left-logo">
                  <img th:src="${logo}" alt="OriFood Logo" width="180" />
                  <div class="frequency">Frequency :Daily</div>
                </td>
                <td width="60%">
                  <div class="annexure">Annexure-08</div>
                  <div class="orifood">Orifood &#38; Beverage pvt. ltd.</div>
                  <div class="heading">pH METER CALIBRATION RECORD</div>
                </td>
                <td width="20%" align="right" style="vertical-align: top;">
                  <div class="header-box">
                    <div class="ref-no">Ref No.: <span th:text="${pdfPh.refNo}"></span>
                    </div>
                    <div class="ref-no">Issue No.: <span th:text="${pdfPh.issueNo}"></span>
                    </div>
                    <div class="ref-no">Issued Date.: <span th:text="${pdfPh.issuedDate}"></span>
                    </div>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td valign="top">
            <table cellpadding="0" cellspacing="0" border="1">
              <thead>
                <tr>
                  <th width="10%">Date</th>
                  <th width="15%">Equipment ID</th>
                  <th width="15%">Standard Value</th>
                  <th width="15%">Actual Value</th>
                  <th width="15%">Error</th>
                  <th width="15%">Temperature(Deg C)</th>
                  <th width="15%">Signature</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="items: ${pdfPhDetails}">
                  <td th:text="${items.date}" th:attr="style='text-align: left;'"></td>
                  <td th:text="${items.equipmentId}" th:attr="style='text-align: left;'"></td>
                  <td th:text="${items.standardValue}" th:attr="style='text-align: left;'"></td>
                  <td th:text="${items.actualValue}" th:attr="style='text-align: left;'"></td>
                  <td th:text="${items.error}" th:attr="style='text-align: left;'"></td>
                  <td th:text="${items.temp}" th:attr="style='text-align: left;'"></td>
                  <td th:text="${items.signature}" th:attr="style='text-align: left;'"></td>
                </tr>
                
              </tbody>
            </table>
          </td>
        </tr>
        <tr>
          <td>
            <table cellpadding="0" cellspacing="0">
              <td class="top-tble-text">Tolerance:+/- 0.05 against all the standards.</td>
            </table>
          </td>
        </tr>
        <tr>
          <td>
            <table cellpadding="0" cellspacing="0" border="1">
              <td class="top-tble-text">Remarks:<span th:text="${pdfPh.remarks}"></span></td>
            </table>
          </td>
        </tr>
        <tr>
          <td>
            <table>
              <tr>
                <td class="btm-box" width="70%"></td>
                <td class="btm-box text-center">
                  <div class="text-center">Verified by <span th:text="${pdfPh.verifiedBy}"></span>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
