function saveLabTest(datas){
	console.log("datas>>>>>>",datas);
	var labId = $("#labTestId").val();
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "micro-lab-add-day",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			//cancel()
			$('.loader').hide();
			if(response.code = "success"){
				if(labId == "" || labId == null){
					var jsonData = JSON.parse(response.body);
					var allData=jsonData.labId;
					console.log("allData<<<....",allData);
					editTest(allData[0].labId);
				}else{
					editTest(labId);
				}
				$("#messageParagraph").text("Data Added Succesfully.");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}else{
				$('.loader').hide();
				$("#messageParagraph").text("Something Went Wrong !!");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			}
			
			
		},
		error : function(data) {
			$('.loader').hide();
		}
	});
}


function editTest(testid){
	$(".loader").show();
	 $("#labTestId").val(testid);
	 $("#trReqId").text(testid);
	// $("#crqsbox").html(pcroid);
	 $("#totalReq").hide();
	 $("#searchRowDiv").hide();
	 $("#ttbtn").hide();
	
			agGrid.simpleHttpRequest(
					{
						url : 'micro-lab-edit?id='+ testid
					}).then(function(data) {
						$(".loader").hide();
						var jsonData = JSON.parse(data.body);
						var allData=jsonData.edit;
						console.log("allData>>>>>>",allData);
						$("#myGrid").hide();
						$("#demo").show();
						
						$("#day1Date").val(allData[0].day1[0].dayDate);
						$("#day2Date").val(allData[0].day2[0].dayDate);
						$("#day3Date").val(allData[0].day3[0].dayDate);
						$("#day4Date").val(allData[0].day4[0].dayDate);
						$("#day5Date").val(allData[0].day5[0].dayDate);
						activityOptions.api.setRowData(allData[0].day1);
						activityOptions2.api.setRowData(allData[0].day2);
						activityOptions3.api.setRowData(allData[0].day3);
						activityOptions4.api.setRowData(allData[0].day4);
						activityOptions5.api.setRowData(allData[0].day5);

						$("#version").val(allData[0].version);
						
						
					});

function mergeData(data1, data2) {
    return data1.map((item1, index) => {
        var matchingItem = data2[index];
        return { ...item1, ...matchingItem };
    });
}
