		}

		$('#delete').attr("disabled", true);
		$('#add').attr('disabled', false);
	}

function newPlan() {
	var date1 = (new Date()).toISOString().split('T')[0];
	var newDate = changeDateFormat(date1);
	$("#date").val(newDate);

		activityOptions1.api.setRowData(); 
		activityOptions2.api.setRowData(); 
		activityOptions3.api.setRowData(); 
		activityOptions4.api.setRowData();
		$('.loader').show();
		agGrid.simpleHttpRequest({
			url : 'wbcr-aggrid-view'
		}).then(function(data) {
			$('.loader').hide();
		   var jsonData = JSON.parse(data.body);
			var allData_domex=jsonData.domex;
			var allData_wheel=jsonData.wheel;
			var allData_sfxl=jsonData.sfxl;
			var allData_other=jsonData.other;
			
			activityOptions1.api.setRowData(allData_domex); 
			activityOptions2.api.setRowData(allData_wheel); 
			activityOptions3.api.setRowData(allData_sfxl); 
			activityOptions4.api.setRowData(allData_other); 
		});
		
		
    
}
function changeDateFormat(inputDate) { // expects Y-m-d
	var splitDate = inputDate.split('-');
	if (splitDate.count == 0) {
		return null;
	}
	var year = splitDate[0];
	var month = splitDate[1];
	var day = splitDate[2];

	return day + '-' + month + '-' + year;
}

function savePlanDetails(item) {
	$(".loader").show();
	setTimeout(function() {
		$.ajax({
			type : "POST",
			url : "wbcr-add",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(item),
			success : function(response) {
				$(".loader").hide();
				cancel();
				 
				 $("#messageParagraph").text(response.message);
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				
				 
				 /* $("#demo").hide();
				 $("#myGrid").show(); */
				 
				 //view();
				 
				
			},
			error : function(data) {
				$('.loader').hide();
			}
		});
	}, 1000)
	
}


function editData(id,sts) {
	$(".loader").show();
	//console.log(sts)
			agGrid.simpleHttpRequest(
					{
						url : 'wbcr-edit?id='+ id
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						
						var allData_domex=jsonData.domex;
						var allData_wheel=jsonData.wheel;
						var allData_sfxl=jsonData.sfxl;
						var allData_other=jsonData.other;
						
						
						
						if(data.code == "success"){
							$('#searchRowDiv').hide();
							$('#delete').hide();
							$('#aprove').hide();
							$("#add").hide();
							$("#myGrid").hide();
							$("#save").show();
						    $("#Cancel").show();
							$("#addData").show();
							$("#totalCandidate").hide();
							$("#dwnld").hide();
							
							if(sts == 'Approved'){
								$("#save").hide();
							}else{
								$("#save").show();
							} 
							
							$("#wbcrId").text(id);
							$("#date").val(allData_domex[0].date);
							
							
							
							
							activityOptions1.api.setRowData(allData_domex); 
							activityOptions2.api.setRowData(allData_wheel); 
							activityOptions3.api.setRowData(allData_sfxl); 
							activityOptions4.api.setRowData(allData_other); 
							$(".loader").hide();
						}else{
							$(".loader").hide();
							$("#messageParagraph").text("Something went to wrong!");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							
						}
						
					}); 
	
}
