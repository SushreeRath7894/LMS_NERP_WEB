		var validation = true;

		if (obj.date == null || obj.date == "") {
			validation = validationUpdated("Date Required", "date");
		}
		if (obj.nEDTA == null || obj.nEDTA == "") {
			validation = validationUpdated("Normality EDTA Required", "nEDTA");
		}
		if (obj.nh2So4 == null || obj.nh2So4 == "") {
			validation = validationUpdated("Normality Of H₂SO₄/Alc.NaOH Required", "nh2So4");
		}
		
		if (validation) {
			console.log(obj)
			$('.loader').show();
			$.ajax({
				type : "POST",
				url : "pca-analysis-record-details-save",
				contentType : "application/json",
				data : JSON.stringify(obj),

					if (response.message == "Success") {
						$('.loader').hide();
						$("#messageParagraph").text(

						$("#msgOkModal").removeClass("btn3");

						$("#myGrid").show();
						$("#cancel").hide();

						$("#form").hide();
						$("#new").hide();

						$("#msgModal").modal('show');
						$('.loader').hide();
					}
				},
				error : function(data) {
				}
			})
		}
	}

	function onSelectionChanged() {
		var selectedNodes = gridOptions.api.getSelectedNodes();

			$('#approve').attr('disabled', true);

	// delete  

	function deleteOnclick() {
		
		var selectedRows = gridOptions.api.getSelectedRows();
		var id = selectedRows[0].pcaAnalysisId;
		if (id) {
		
				$.ajax({
					type : "POST",
					url : "pca-analysis-record-delete?id="+ id,
					success : function(response) {
					 if (response.message == "Success") {
						cancel();
						$("#messageParagraph").text("Report Deleted Sucessfully");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$('#delete').modal('hide');
					} else {
						$("#messageParagraph").text("Something went to wrong!");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
					}
				},
				error : function(data) {
					console.log(data)
				}
			})
		} else {
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
		}

	}

		}else if (grid == "composite"){

			});
		}
		
		//$('#newchild').show();

	}

	 function changeDateFormat(inputDate) { // expects Y-m-d
			var splitDate = inputDate.split('-');
			if (splitDate.count == 0) {
				return null;
			}
			var year = splitDate[0];
			var month = splitDate[1];
			var day = splitDate[2];

			return day + '-' + month + '-' + year;
		}

										<p style="font-size: 16px; color: black; font-weight: 500;">Select
											The Product</p>
									</div>
									<div class="col-md-12" style="margin-bottom: 55px;">
										<div class="form-group">
											<div class="select">
												<select id="product">
													<option value="">Select</option>
													<option th:each="c:${brandList}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									<div class="modal-footer justify-content-center"
										style="margin-top: -10px;">
										<button type="button" class="cancel-btn"
											data-bs-dismiss="modal">Cancel</button>
										<button type="button" class="approve-btn" onclick="newPage()"
											data-bs-dismiss="modal">Select</button>
									</div>
								</div>
							</div>
						</div>


						<!-- delete modal start -->
						<div id="delete" class="modal fade show" aria-modal="true">
							<div class="modal-dialog modal-confirm">
								<div class="modal-content">
									<div class="modal-header flex-column"></div>
									<div class="modal-body">
										<p>Do you really want to delete these records? This
											process cannot be undone.</p>
									</div>
									<div class="modal-footer justify-content-center"
										style="margin-top: 0px;">

										<button type="button" class="cancel-btn"
											data-bs-dismiss="modal" onclick="cancelModalBtn();">Cancel</button>
										<button type="button" class="delete-btn"
											onclick="deleteOnclick()">Delete</button>
									</div>
								</div>
							</div>
						</div>
						<div id="approveModal" class="modal fade show" aria-modal="true">
							<div class="modal-dialog modal-confirm">
								<div class="modal-content">
									<div class="modal-header flex-column"></div>
									<div class="modal-body">
										<p>Do you Want To Approve Data?</p>
									</div>
									<div class="modal-footer justify-content-center"
										style="margin-top: 0px;">

										<button type="button" class="cancel-btn"
											data-bs-dismiss="modal">No</button>
										<button type="button" class="approve-btn"
											data-bs-dismiss="modal" onclick="changeStatusFun()">yes</button>
									</div>
								</div>
							</div>
						</div>

						<!-- delete product modal start -->
						<div id="deleteDetails" class="modal fade show" aria-modal="true">
							<div class="modal-dialog modal-confirm">
								<div class="modal-content">
									<div class="modal-header flex-column"></div>
									<div class="modal-body">
										<p>Do you really want to delete these records? This
											process cannot be undone.</p>
										<input type="hidden" class="form-control" id="deleteChildGrid">
									</div>
									<div class="modal-footer justify-content-center"
										style="margin-top: -10px;">

										<button type="button" class="cancel-btn"
											data-bs-dismiss="modal" onclick="cancelModalBtn();">Cancel</button>
										<button type="button" class="delete-btn"
											onclick="deleteDetailsOnclick()">Delete</button>
									</div>
								</div>
							</div>
						</div>




						<!-- alert modal start -->
						<div id="alert" class="modal fade show" aria-modal="true">
							<div class="modal-dialog modal-confirm">
								<div class="modal-content">
									<div class="modal-header flex-column">
										<button type="button" class="close" data-bs-dismiss="modal"
											aria-hidden="true" onclick="cancelModalBtn()">
											<i class="ti-close modal-close"></i>
										</button>
									</div>
									<div class="modal-body">
										<p id="textId"></p>
									</div>
									<div class="modal-footer justify-content-center"
										style="margin-top: 0px;">

										<button type="button" class="btn1" data-bs-dismiss="modal">SELECT</button>
										<button type="button" class="btn3" onclick="deleteOnclick()">Delete</button>
									</div>
								</div>
							</div>
						</div>
						
						<div id="productTypeModal" class="modal fade show" aria-modal="true" data-bs-backdrop="static" data-bs-keyboard="false">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p style="font-size: 16px;color:black;font-weight: 500;">Select Product Type</p>
								</div>
								<div class="col-md-12" style="margin-bottom: 55px;">
									<div class="form-group">
										<div class="select">
											<select id="productType" onChange="productType()">
												<option value="">Select</option>
												<option value="finamul">Finamul</option>
												<option value="femto">Femto</option>
												<!-- <option th:each="c:${brandList}" th:value='${c.key}'
													th:text="${c.name}"></option> -->
											</select><div id="productTypeError" style="font-size: 12px; color: red;"></div><span class="focus"></span>
										</div>
									</div>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">
									<button type="button" class="cancel-btn"
										onclick="cancelModal()">Cancel</button>
									<button type="button" class="approve-btn" onclick="newPlan()"
										>Select</button>
								</div>
							</div>
						</div>
					</div>
					</div>
				</div>
			</div>
		</div>
</body>
</html>
