var id = "";

function onSelectionChanged() {
	var selectedNodes = gridOptions.api.getSelectedNodes();
	 var selectedData = selectedNodes.map(node => node.data);
	 id= selectedData.map(node => node.crqsId);
	 apstatus=selectedData.map(node => node.apstatus);
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});
	if (rowCount > 0) {
		$('#inspectBtn').attr("disabled", false);
		if(apstatus==1){
			$('#reqDltBtn').attr("disabled", true);
			$('#assignBtn').attr("disabled", true);
			$('#newBtn').attr('disabled', false);
		}else{
		$('#newBtn').attr('disabled', true);
		$('#reqDltBtn').attr("disabled", false);
		$('#assignBtn').attr("disabled", false);
		}
	}else {
		$('#inspectBtn').attr("disabled", true);
		$('#reqDltBtn').attr("disabled", true);
		$('#assignBtn').attr("disabled", true);
		$('#newBtn').attr('disabled', false);
	}
}

// master save

function masterSaveData() {
    $(".formValidation").remove();
    activityOptions.api.stopEditing();

    var valid= true;
	var datas = [];
	var i=-1;
	var rowCount = activityOptions.api.getDisplayedRowCount();
	if(rowCount > 0){
	activityOptions.api.forEachNode(function(rowNode, index) {
		i=i+1;
		
		var item = rowNode.data;
		item.pcroCheckListId = $("#pcroId").val();
		item.packingDate = $('#packingDate').val();
		item.shift = $('#shift').val();
		item.product = $('#product').val();
		item.lineNo = $('#lineNumber').val();
		item.batchNo = $('#batchNo').val();
		item.sachet = $('#Sachet').val();
		item.bib_csp = $('#bib_csp').val();
		item.netWeight = $("#netWeight").val();
		item.lsl = $('#lsl').val();
		item.usl = $('#usl').val();
		item.slNo = i+1;
		item.issueNo = $("#issueNo").val();
		item.issueDate = $("#issueDate").val();
		item.refNo = $("#refNo").val();
		
		
		if (item.packingDate == null || item.packingDate == "") {
			valid = validationUpdated("PackingDate  is Required", "packingDate");
		 }
		if (item.shift == null || item.shift == "") {
			valid = validationUpdated("shift Details is Required", "shift");
		 }
		if (item.product == null || item.product == "") {
			valid = validationUpdated("Products Name is Required", "product");
		 }
		if (item.lineNo == null || item.lineNo == "") {
			valid = validationUpdated("Line  No. is Required", "lineNumber");
		 }
		if (item.batchNo == null || item.batchNo == "") {
			valid = validationUpdated("Batch No. is Required", "batchNo");
		 }
		if (item.Sachet == null || item.Sachet == "") {
			valid = validationUpdated("Sachet is Required", "Sachet");
		 }
		if (item.bib_csp == null || item.bib_csp == "") {
			valid = validationUpdated("Bib & Csp  is Required", "bib_csp");
		 }
		if (item.lsl == null || item.lsl == "") {
			valid = validationUpdated("lsl is Required", "lsl");
		 }
		if (item.usl == null || item.usl == "") {
			valid = validationUpdated("Usl is Required", "usl");
		 }
		
		
		 if(valid){
	        	datas.push(item);
	         }
		
		
	});
	if (valid) {
		
		console.log("Datas--->",datas)
		
		savePlanDetails(datas);
		
		}
	 else {
		$("#messageParagraph").text(
		"Please Fill Up The Input Fields First!");
		$("#msgOkModal").removeClass("btn3");
		$("#msgOkModal").addClass("btn1");
		$("#msgModal").modal('show');
	}

}

function savePlanDetails(datas) {
	$(".loader").show();
	$.ajax({
		type : "POST",
		url : "pcro-check-list-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$(".loader").hide();
			 $("#totalReq").show();
			 $("#searchRowDiv").show();
			 $("#ttbtn").show();
			 
			 $("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
			 
			 agGrid.simpleHttpRequest({
					url : 'pcro-check-list-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body[0]);
					var allData=jsonData.view;
					console.log(allData)
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					gridOptions.api.setRowData(allData);
				});
			 
			 $("#demo").hide();
			 $("#myGrid").show();
			 
			 inputnull();
			
		},
		error : function(data) {
			$('.loader').hide();
		}
	});

}


function editPcro(pcroid) {
	$(".loader").show();
	 $("#pcroId").val(pcroid);
	 $("#crqsbox").html(pcroid);
	 $("#totalReq").hide();

	 $("#ttbtn").hide();
	 var slnoData; 
	  agGrid.simpleHttpRequest({
			url : 'pcro-check-list-slno'
		}).then(function(data) {
			var jsonData = JSON.parse(data.body[0]);
			slnoData =jsonData.Slno;
			console.log(jsonData)
			activityOptions.api.setRowData(slnoData);
			
			agGrid.simpleHttpRequest(
					{
						url : 'pcro-check-list-edit?id='+ pcroid

						console.log("allData",allData)
						//var combinedData = slnoData.concat(allData);
						var combinedData = mergeData(slnoData, allData);
						console.log("combinedData",combinedData)
						
						$("#myGrid").hide();
						$("#demo").show();
						activityOptions.api.setRowData(combinedData);
						var rowCount = activityOptions.api.getDisplayedRowCount();
						
						$("#packingDate").val(allData[0].packingdate);
						$("#shift").val(allData[0].shift);
						$("#product").val(allData[0].product);
						$("#lineNumber").val(allData[0].lineno);

						$("#Sachet").val(allData[0].sachet);
						$("#bib_csp").val(allData[0].bib);
						$("#netWeight").val(allData[0].netWeight);
						$("#lsl").val(allData[0].lsl);
						$("#usl").val(allData[0].usl);
						$("#issueNo").val(allData[0].issueNo);

						$("#refNo").val(allData[0].RefNo);
						
						$(".loader").hide();
						
						
					});
			
		}); 
	
}

function mergeData(data1, data2) {
    return data1.map((item1, index) => {
        var matchingItem = data2[index];
        return { ...item1, ...matchingItem };
    });
}

				gridOptions.api.setRowData(allData);
			}); 
			 $('#msgModal2').modal('hide');
			 $("#reqDltBtn").attr('disabled', true);
			 $("#newBtn").attr('disabled',false);
		} else {
			$("#messageParagraph").text("Something went to wrong!");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
		}
	},
	error : function(data) {
		console.log(data)
	}
})

}

function downloadDetails() { 
	var dataset = [];
	gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
		dataset.push(rowNode.data);
	});
    gridOptions.api.exportDataAsCsv(dataset);
}
