<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="my-tasks">
<head>
<style>
.fc-h-event .fc-event-main {
	color: #18191b !important;
}
.out-box .go-btn {
     height: auto!important;
}

</style>
<script>
let calendar = '';
$(document).ready(()=>{
	var gridDiv = document.querySelector('#myGrid');
	new agGrid.Grid(gridDiv, gridOptions);
	gridOptions.api.setRowData([]);
	getAllTaskDetails();
	toggleList();
	let dataset = []
	var calendarEl = document.getElementById('calendar');
	calendar = new FullCalendar.Calendar(calendarEl, {
	    height: '100%',
	    expandRows: true,
	    slotMinTime: '06:00',
	    slotMaxTime: '22:00',
	    headerToolbar: {
	        left: 'prev,next today',
	        center: 'title',
	        right: 'multiMonthYear,dayGridMonth,timeGridWeek,timeGridDay,listWeek,nextTwoDays'
	    },
	    initialView: 'dayGridMonth',
	    editable: true,
	    selectable: true,
	    nowIndicator: true,
	    dayMaxEvents: 0,
	    eventTimeFormat: {
	        hour: 'numeric', // Hour in numeric format
	        minute: '2-digit', // Minute in 2-digit format
	        meridiem: 'short' // Disable default meridiem formatting
	    },
	    eventContent: function(arg) {
	       /*  let time = arg.timeText; // The default time text
	        if (time) {
	            time = time.replace(/(am|pm)$/i, ' $1').toUpperCase(); // Add space before AM/PM
	        } */
	        return {
	            html: `${arg.event.title}`
	        }; // Customize event content
	    },
	    navLinks: true,
	    customButtons: {
	        nextTwoDays: {
	            text: 'Next 2 Days',
	            click: function() {
	                var today = new Date();
	                calendar.changeView('customTwoDay', today);
	            }
	        }
	    },
	    views: {
	        customTwoDay: {
	            type: 'timeGrid',
	            duration: {
	                days: 2
	            },
	            buttonText: '2 day',
	            slotDuration: '01:00:00'
	        }
	    },
	    events: dataset,
	    dateClick: function(info) {
	        cancelModal();
	        $('#allDay').prop('checked', false);
	        $("#eventEndTime").attr("disabled", false);
	        $("#eventStartTime").attr("disabled", false);

	        let currentTime = new Date();
	        currentTime.setMinutes(currentTime.getMinutes() + 1);

	        let startHours = String(currentTime.getHours()).padStart(2, '0');
	        let startMinutes = String(currentTime.getMinutes()).padStart(2, '0');
	        let endHours = String(currentTime.getHours() + 1).padStart(2, '0');


	        let currentDate = new Date();
	        let clickedDate = new Date(info.dateStr);


	        if (clickedDate < currentDate.setHours(0, 0, 0, 0)) {
	            getValidationModal('Cannot add meetings to past dates.')
	            return;
	        }


	        // Open modal for new event
	        openEventModal('', '', info.dateStr, startHours + ":" + startMinutes, false, '');
	    },
	    eventClick: function(info) {
	        
	    },
	    datesSet: function(info) {
	        
	    },
	    eventDrop: function(info) {

	        let eventStart = info.event.start;
	        let currentDateTime = new Date();

	        if (eventStart < currentDateTime) {
	            getValidationModal('Cannot set event to a past time.');
	            info.revert();
	        } else {
	            // Proceed with the update if the new time is valid
	            updateEventLocally(info.event);
	        }
	    },
	    eventResize: function(info) {
	        let eventEnd = info.event.end;
	        let currentDateTime = new Date();

	        if (eventEnd < currentDateTime) {
	            getValidationModal('Cannot extend event to a past time.');
	            info.revert(); // Revert to the original size
	        } else {
	            updateEventLocally(info.event);
	        }
	    },
	});

	calendar.render();
})
function toggleCal() {
	$("#showMeetingList").hide();
	$("#showCalendar").show();
	$("#calendar-container").hide();
	$("#myGrid").show();
} 

function toggleList() {
	$("#showMeetingList").show();
	$("#showCalendar").hide();
	$("#calendar-container").show();
	$("#myGrid").hide();
}
function getAllTaskDetails() {

    agGrid.simpleHttpRequest({
        url: "all-tasks-view"
    }).then(function(data) {
        var jsonData = JSON.parse(data.body);
        var allData = jsonData.viewAllTasks;
        if(allData && allData.length > 0) {
        	allData = allData.sort((a, b) => new Date(b.createdDate) - new Date(a.createdDate));
        	setCalendarEvents(allData);
            gridOptions.api.setRowData(allData);
            var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0);
            if (firstRowNode) {
                firstRowNode.setSelected(true);
            }
        } else {
        	gridOptions.api.setRowData([]);
        }
    });
}
function setCalendarEvents(events) {
    if (calendar) {
        calendar.removeAllEvents(); 
        calendar.addEventSource(events); 
    } else {
        console.error('Calendar is not initialized.');
    }
}
var columnDefs = [{
    headerCheckboxSelection: false,
    headerCheckboxSelectionFilteredOnly: false,
    checkboxSelection: true,
    width: 10,
    sortable: false,
    filter: false,
    resizable: true,
    pinned: 'left',

	},
	{
	    headerName: 'Task ID',
	    field: "taskId",
	    pinned: 'left',
	    cellRenderer : function(params) {
			return '<strong>'
					+ params.data.taskId + '</strong>';
		},
		flex: 1
	}, {
	    headerName: 'Task Description',
	    field: "taskDesc",
	    flex: 2
	
	}, {
	    headerName: 'Assigned Date',
	    field: "assignDate",
	    width: 120,
	    flex: 1
	}, {
	    headerName: 'Status',
	    field: "status",
	    flex: 1
	}, {
	    headerName: 'Type',
	    field: "type",
	    flex: 1,
	    cellRenderer : params => {
	    	if (params.data.type == 'VISITORS') {
				return '<strong style="color: var(--mainColor)">' + params.data.type + '</strong>';
	    	} else if (params.data.type == 'MEETING - MOM') {
	    		return '<strong style="color: orange">' + params.data.type + '</strong>';
	    	} else {
	    		return '<strong style="color: blue">' + params.data.type + '</strong>';
	    	}
		},
	    width: 120,
	}
];

var gridOptions = {
	columnDefs: columnDefs,
	rowSelection: 'single',
	//groupSelectsChildren: true,
	suppressRowClickSelection: true,
	suppressAggFuncInHeader: true,
	pagination: true,
	paginationPageSize: 15,
	defaultColDef: {
	    sortable: true,
	    filter: true,
	    resizable: true,
	    width: 90,
	},
};
function onQuickFilterChanged() {
	gridOptions.api.setQuickFilter(document.getElementById('quickFilter').value);
	var firstRowNode = gridOptions.api.getDisplayedRowAtIndex(0);
    if (firstRowNode) {
        firstRowNode.setSelected(true);
    }
}
function reset() {
	$("#quickFilter").val('');
	gridOptions.api.setQuickFilter('');
}
</script>
</head>
