	function onQuickFilterChanged() {
	    // Get the input value
	    var quickFilterInput = document.getElementById('quickFilter').value;
	    
	    // Set the quick filter value
	    gridOptions.api.setQuickFilter(quickFilterInput);
	    
	    // Show the cancel icon if there's any input
	    var closeKey = document.getElementById('closeKey');
	    closeKey.style.display = quickFilterInput ? 'block' : 'none';

	    // Get the count of displayed rows after filtering
	    var displayedRowCount = gridOptions.api.getDisplayedRowCount();
	    
	    // Update the UI element with the count
	    document.getElementById('totalReq').innerText = "Maintenance List (" + displayedRowCount + ")";
	}

	function clearQuickFilter() {
	    // Clear the quick filter input
	    document.getElementById('quickFilter').value = '';
	    
	    // Hide the cancel icon
	    document.getElementById('closeKey').style.display = 'none';
	    
	    // Clear the ag-Grid quick filter
	    gridOptions.api.setQuickFilter('');
	    
	    // Refresh the grid to ensure all data is displayed
	    gridOptions.api.onFilterChanged();

	    // Get total row count after clearing the filter
	    var totalRowCount = gridOptions.api.getModel().getRowCount();
	    
	    // Update the UI element with the total row count
	    document.getElementById('totalReq').innerText = "Maintenance List (" + totalRowCount + ")";
	}

	function cancelBar() {
	    // Only toggle the visibility of the cancel button based on input
	    var quickFilterValue = document.getElementById('quickFilter').value;
	    var closeKey = document.getElementById('closeKey');
	    
	    if (!quickFilterValue) {
	        closeKey.style.display = 'none';
	    }
	}

	$('.loader').show();

				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");

				$("#description").val('');
				activityOptions.api.setRowData();
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

    if (valid) {

        });
      } else {

//function for download
function downloadDetails() { 
    var dataset = [];
    gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
        dataset.push(rowNode.data);
    });
    console.log("Dataset:", dataset);
    dataset.forEach(function(item) {
        console.log("Status:", item.status);
    });

    // Create a new dataset with the modified status field
    var transformedDataset = dataset.map(function(item) {
        return {
            ...item, // Spread operator to copy other fields
            status: item.status === 1 ? "alloted" : "not alloted"
        };
    });

    // Export the transformed dataset as CSV
    gridOptions.api.exportDataAsCsv({
        fileName: 'asset-maintenance.csv',
        processCellCallback: function(params) {
            if (params.column.getColId() === 'status') {

							</div>

							<!-- Modal body -->
							<div class="row" style="height: 320px;">
								<div class="ag-theme-alpine" id="ticketGrid" style="width: 100%; height: 300px;">

							</div>
							</div>

							<!-- Modal footer -->
							<div class="modal-footer">
								
									<button class="btn3" id="closeTicketBtn" onclick="closeTicketFun()">CLOSE TICKET</button>
									<button class="btn4" data-dismiss="modal"
										onclick="cancelModalBtn()">CANCEL</button>
								
							</div>
						</div>
					</div>
				</div>
<!--  -->
				<div class="modal fade" id="myModal">
					<div class="modal-dialog modal-lg" style="margin-top: 130px;">
						<div class="modal-content">

							<!-- Modal Header -->
							<div class="modal-header">
								<h4 class="modal-title md-color">Emergency Raise</h4>
								<!-- <button type="button" class="close cp" data-dismiss="modal"
									onclick="cancelModalBtn()">&times;</button> -->
							</div>

							<!-- Modal body -->
							<div class="modal-body modal-cat"
								style="height: 320px; overflow-y: scroll;" id="chooseAsset">

								<!-- form radio buttons example -->
								<div class="col-md-12 d-flex">
									<div class="col-md-4">
										<div class="form-group">
											<label> Asset Type </label>
											<div class="select">
												<select id="assettype" onchange="getEmergencyList()">
													<option value="">Select</option>
													<option value="fixed">Fixed</option>
													<option value="unfixed">Unfixed</option>
													<option th:each="c:${itemnameList}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-group">
											<label> Asset Category </label>
											<div class="select">
												<select id="assetcat" onchange="getsubcategory()">
													<option value="">Select</option>
													<option th:each="c:${catLists}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-group">
											<label> Asset Sub Category </label>
											<div class="select">
												<select id="assetsubcat" onchange="getEmergencyList()">
													<option value="">Select</option>
													<option th:each="c:${itemnameList}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
								</div>

								<br>


								<div class="ag-theme-alpine" id="assetGrid"
									style="width: 100%; height: 180px;"></div>

							</div>
							<div class="modal-body modal-cat"
								style="height: 320px; overflow-y: scroll;" id="chooseReason">
								<div class="col-md-12">
									<div class="form-group">
										<label> Reason </label>
										<textarea class="form-control" id="dreason"
											onblur="removeValid(event)" rows=7></textarea>
									</div>
								</div>
							</div>

							<!-- Modal footer -->
							<div class="modal-footer">

								<button class="btn1" id="next" onclick="next()">NEXT</button>
								<button class="btn4" id="cancelModalBtn" data-dismiss="modal"
									onclick="cancelModalBtn()">CANCEL</button>
								<button class="btn4" id="backModalBtn" onclick="backModalBtn()">BACK</button>

							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
