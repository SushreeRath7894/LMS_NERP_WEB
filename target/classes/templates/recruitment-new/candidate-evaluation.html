<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<script src="../javaScript/recruitment/candidate-evaluation.js"></script>
<link rel="stylesheet" href="../css/recruitment/recruitmentV2.css">
<style type="text/css">
.actions-round {
	position: absolute;
	margin-top: -27px;
	right: 24px;
}

.inv-round-btn {
	cursor: pointer;
}
.fs-11{font-size: 11px;font-weight: 500;}
.fw-500{font-weight: 500 !important;}
.inv-round-btn .dropdown .btn.btn-secondary {
	background: #bf05ff;
	color: #fff;
	border: none;
	border-radius: 5px;
	font-size: 14px;
	width: 25px;
	height: 25px;
	line-height: 23px;
	text-align: center;
	display: flex;
	justify-content: center;
	align-items: center;
}

.interview-profile-img {
	width: 150px;
	height: 150px;
	object-fit: cover;
	border: 3px solid #BF05FF;
}

.interview-card {
	padding: 15px !important;
}

.interview-heading {
	color: #BF05FF;
}

.interview-rating input[type="radio"] {
	display: none;
}

.interview-rating label {
	display: inline-block;
	background-color: #f8f9fa;
	border: 1px solid #BF05FF;
	color: #BF05FF;
	border-radius: 50%;
	width: 25px;
	height: 25px;
	text-align: center;
	line-height: 22px;
	font-size: 13px;
	margin-right: 5px;
	font-weight: 400;
	cursor: pointer;
}

.interview-comments {
	border: 2px solid #BF05FF;
}

.inv-sec-header {
	color: #000;
}

.form-switch .form-check-label {
	font-weight: 500;
	font-size: 13px;
}

/* Basic Styling */

/* Header Styles */
.fw-bold {
	font-weight: 600;
}

/* Text Styling */
.text-dark {
	color: #333;
}

.text-muted {
	color: #6c757d;
}

.text-primary {
	color: #3498db;
}

/* Action Buttons */
.btn-outline-primary, .btn-outline-danger {
	border-radius: 25px;
	font-weight: 600;
}

.btn-outline-primary {
	border: 1px solid #3498db;
	color: #3498db;
}

.btn-outline-primary:hover {
	background-color: #3498db;
	color: white;
}

.btn-outline-danger {
	border: 1px solid #e74c3c;
	color: #e74c3c;
}

.btn-outline-danger:hover {
	background-color: #e74c3c;
	color: white;
}

@media ( max-width : 767px) {
	.row {
		display: block;
	}
}
@media ( max-width : 485px) {
.interview-rating label {
    width: 22px;
    height: 22px;
    line-height: 20px;
    font-size: 12px;
    margin-right: 0px;
}
.skills-container .text-end{
	text-align: left !important;
}
}
.rating-low {
	color: red !important;
	border: 1px solid #ff0000 !important;
}

.rating-medium {
	color: orange !important;
	border: 1px solid #ffa500 !important;
}

.rating-high {
	color: #03bd03 !important;
	border: 1px solid #63c303 !important;
}

.interview-rating input[type="radio"]:checked+label {
	background-color: #BF05FF;
	color: #fff !important;
	border: 1px solid #bf05ff !important;
}

/* Interview Progress Timeline Css */
.interview-timeline {
	margin-right: 5px;
	width: 100%;
	/* margin: 12px; */
	background: #fff;
	border: 1px solid #ddd;
}

.round {
	border-bottom: 1px solid #eee;
	padding: 10px 15px;
}

.round:last-child {
	border-bottom: none;
}

.round-header {
	display: flex;
	align-items: center;
	margin-bottom: 10px;
}

.status-badge {
	font-size: 12px;
	font-weight: bold;
	/* text-transform: uppercase; */
	padding: 5px 10px;
	/* border-radius: 15px; */
	color: #fff;
	margin-right: 15px;
	font-weight: 400;
}

.status-badge.selected {
	background: #ffffff;
	color: #bf05ff;
	border: 1px solid #bf05ff;
	font-weight: 700;
}

.status-badge.rejected {
	background: #dc3545; /* Red */
}

.round-info h3 {
	margin: 0;
	font-size: 14px;
	color: #333;
}

.round-info p {
	margin: 0;
	font-size: 12px;
	color: #777;
}

.round-toggle-btn {
	background: #bf05ff;
	color: #fff;
	border: none;
	border-radius: 5px;
	font-size: 14px;
	width: 25px;
	height: 25px;
	line-height: 23px;
	text-align: center;
	cursor: pointer;
}

.feedback-list {
	background: #f9f9f9;
	border-radius: 5px;
	padding: 10px;
}

.feedback {
	background: #fff;
	border: 1px solid #ddd;
	border-radius: 5px;
	padding: 10px;
	margin-bottom: 10px;
	position: relative;
}

.feedback-header h4 {
	margin: 0;
	font-size: 14px;
	color: #303030; /* Website's primary color */
}

.feedback-header p {
	margin: 0;
	font-size: 12px;
	color: #606060;
}

.feedback-header .toggle-btn {
	position: absolute;
	top: 10px;
	right: 10px;
	background: #bf05ff;
	color: #fff;
	border: none;
	border-radius: 5px;
	font-size: 14px;
	width: 25px;
	height: 25px;
	line-height: 23px;
	text-align: center;
	cursor: pointer;
}

.feedback-details {
	display: none;
	margin-top: 10px;
}

.feedback-item {
	margin-bottom: 10px;
}

.feedback-item span {
	display: block;
	font-size: 10px;
	color: #7800a1;
	font-weight: 700;
}

.feedback-item span {
	display: block;
	font-size: 10px;
	color: #7800a1;
	font-weight: 700;
}

.interviewer-names-container {
	display: flex;
	flex-wrap: wrap;
	gap: 8px;
}

.interviewer-box {
	background-color: #be00ff00;
	padding: 2px 6px;
	border-radius: 5px;
	border: 1px solid #bf05ff;
	font-weight: bold;
	color: #bf05ff;
	text-align: center;
	white-space: nowrap;
	word-wrap: break-word;
}

.interviewer-names-container span {
	display: block;
	font-size: 10px;
	color: #7800a1;
	font-weight: 700;
}

.interview-details p {
	font-size: 11px;
	font-weight: 500;
}

.round-date {
	color: #bf05ff;
	font-weight: 500;
}

.feedback hr {
	position: relative;
	top: -8px;
	left: 0px;
	width: 100%;
}

.job-position-details {
	margin-top: -13px;
}

.job-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	border-bottom: 1px solid #e0e0e0;
	padding-bottom: 10px;
	margin-bottom: 15px;
}

.job-header h2 {
	font-size: 13px;
	color: #303030;
	margin: 0;
}

.job-header .experience {
	font-size: 11px;
	color: #bf05ff;
	background: #f0f0f0;
	padding: 5px 10px;
	border-radius: 12px;
	font-weight: 500;
}

.job-info p {
	font-size: 13px;
	color: #555555;
	margin: 5px 0;
	font-weight: 500;
}

.job-info strong {
	color: #333333;
}

.skills-table i {
	color: #bf05ff;
}

.invStatusMsg {
	/* font-weight: 700; */
	padding: 4px;
	/* font-weight: 700; */
	margin-bottom: -3px;
}

.btn-completed {
	background-color: #bf05ff;
	color: white;
	cursor: not-allowed;
	border-color: #bf05ff;
}

.close-feedback {
	width: 25px;
	position: absolute;
	right: 11px;
	height: 25px;
	border: 1px solid #ccc;
	padding: 7px;
	top: 7px;
}

.complete-btn {
	border: 0;
}

.alert-success {
	display: flow;
}

.main-clr {
	color: #bf05ff;
}
/* Custom styles for feedback cards and collapsible sections */
.feedback-card-header {
	background-color: #ffffff;
	color: #bf05ff;
	font-weight: 500;
	cursor: pointer;
	padding: 12px;
	border: none;
	border-radius: 5px;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.feedback-card-header h5 {
	margin: 0;
	font-size: 14px;
}

.feedback-card-body {
	padding-left: 9px;
	padding-right: 4px;
	background-color: #ffffff;
	border-radius: 5px;
	/* margin-top: -15px; */
}

.feedback-card {
	margin-bottom: 10px;
	/* border: 1px solid #ddd; */
	border-radius: 0px;
}

.feedback-card:hover {
	box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
}

.feedback-info {
	font-size: 13px;
	color: #555;
	margin-bottom: 10px;
	font-weight: 400;
}

.feedback-recommendation {
	background-color: #f1f1f1;
	padding: 10px;
	border-radius: 5px;
	font-size: 1rem;
}

.sub-header-new {
	padding: 4px 0px;
}
.sub-header-new .year-exp{
font-size: 11px;
font-weight: 500 !important;
}

.form-switch .form-check-input:checked {
	background-color: #bf05ff !important;
	border-color: #bf05ff !important;
}
.round-toggle-btn {
    background: #fff;
    color: #bf05ff;
    border: solid 1px #bf05ff !important;
    border-radius: 5px;
    font-size: 14px;
    width: 25px;
    height: 25px;
    line-height: 23px;
    text-align: center;
    cursor: pointer;
}
</style>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<!-- Tabbination 1 Start -->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!-- Left Section Start -->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">
										<div class="col-md-8 col-12">
											<form class="d-flex search-sec">
												<input class="form-control me-2" type="text" placeholder="Search"
														id="quickFilter" autocomplete="off">
													<button class="btn go-btn" type="button" id="goBtn">Go</button>
													&nbsp;
														<button class="btn go-btn w-auto" type="button" id="resetBtn">Reset</button>
											</form>
										</div>

										<div class="col-md-2 d-flex justify-content-end">
											<button alt="Maximize" class="btn btn-primary max-btn"
												id="collapseButtonR1" onclick="triggerExpansionR(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
									</div>
									<div class="card p-2 m-2">
											<div id="myGridResumes" 
												class="ag-theme-alpine"></div>
									</div>
								</div>
							</div>
							<!-- Right Section Start -->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div
										class="d-flex flex-row-reverse justify-content-between align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>

										<!-- Right Inner Tab Start -->
										<div class="d-flex gap-2">
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item wd-11" role="presentation"><a
													class="nav-link active" data-bs-toggle="pill"
													href="#candidateDetailsTab" aria-selected="true" role="tab">Candidate
														</a></li>
												<li class="nav-item wd-11" role="presentation"><a
													class="nav-link" data-bs-toggle="pill"
													href="#interviewDetailsTab" aria-selected="false"
													role="tab">Interview Info</a></li>
												<li class="nav-item wd-11" role="presentation"><a
													class="nav-link" data-bs-toggle="pill"
													href="#candidateFeedbackTab" aria-selected="false"
													role="tab">Feedbacks</a></li>
											</ul>
										</div>
									</div>

									<!-- Tab panes -->
									<div class="tab-content flex-fill h-25">
										<!-- Candidate Details Tab -->
										<div id="candidateDetailsTab"
											class="tab-pane fade active show p-2 h-100" role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="50%"><strong id="vendorIdHead"></strong></td>
																<td>
																	<div class="d-flex justify-content-end">
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="nextBtnFunction('interviewDetailsTab')">Next</button>
																		</div>
																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<div id="demo">
														<div class="col-md-12">
															<div class="innercontent">
																<div class="row">
																	<div class="container mt-2 d-none"
																		id="candidate-details">
																		<input type="hidden" id="jobId">
																		<input type="hidden" id="candidateId">
																		<!-- Profile Section -->
																		<div class="row g-3 align-items-center">
																			<div class="col-md-3">
																				<div class="border rounded p-2 text-center bg-light"
																					style="height: 100%;">
																					<img src="..src/index-img" alt="Profile Image"
																						class="img-fluid profile-img" id="profileImg">
																				</div>
																			</div>
																			<div class="col-md-9">
																				<div class="align-items-center g-3">
																					<div class="col-auto">
																						<h5 id="candidateName" class="sub-header-new"></h5>
																					</div>
																					<!-- <div class="col-auto">
																					<h3 class="text-muted">|</h3>
																				</div> -->
																					<div class="col-auto">
																						<h5 id="candidateEducation" class="sub-header-new"></h5>
																					</div>
																				</div>
																				<div class="row">
																					<div class="col-auto">
																						<h5 class="sub-header-new">
																							Experience: <span id="expYrs"
																								class="year-exp"></span>
																						</h5>
																					</div>
																				</div>
																				<div class="row mt-3">
																					<div class="col-auto">
																						<button type="button" onclick="showFormat()"
																							class="approve-btn w-100">View Resume</button>
																					</div>
																				</div>
																			</div>
																		</div>
																		<!-- Additional Sections -->
																		<!-- Key Skills Section -->
																		<div class="row mt-2">
																			<div class="col-md-12">
																				<div class="form-group">
																					<div id="myGridSkill"
																						class="ag-theme-alpine border rounded"
																						style="width: 100%; height: 150px;"></div>
																				</div>
																			</div>
																		</div>

																	<div class="row mt-2">
																		<div class="col-md-12">
																			<div class="form-group">
																				<label class="">Communication
																					Address:</label>
																				<div class="bg-light border rounded p-2">
																					<span id="commAddress"></span>
																				</div>
																			</div>
																		</div>
																	</div>

																	<div class="row mt-2">
																		<div class="col-md-6">
																			<div class="form-group">
																				<label class="">Candidate Email Id:</label>
																				<div class="bg-light border rounded p-2">
																					<span id="candidateEmailSpan"></span>
																				</div>
																			</div>
																		</div>
																		<div class="col-md-6">
																			<div class="form-group">
																				<label class="">Mobile No:</label>
																				<div class="bg-light border rounded p-2">
																					<span id="candidateMobile"></span>
																				</div>
																			</div>
																		</div>
																	</div>
																</div>
																<div class="col-md-12 d-none" id="no-cand-msg">
																	<div
																		class="d-flex justify-content-center align-items-center"
																		style="height: 250px;">
																		<p class="text-muted no-candidate-fnd-msg"></p>
																	</div>
																</div>
															</div>
														</div>
													</div>
												</div>
												</div>
											</div>
										</div>

										<!-- Candidate Feedback Tab -->
										<div id="interviewDetailsTab" class="tab-pane fade p-2 h-100"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="50%"><strong></strong></td>
																<td>
																	<div class="d-flex justify-content-end">
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="nextBtnFunction('candidateDetailsTab')">Prev</button>
																		</div>
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="nextBtnFunction('candidateFeedbackTab')">Next</button>
																		</div>

																		<!-- <div class="mr-2">
																		<button class="btn btn-primary edit-btn d-none" type="button"
																			id="saveCandidateFeedback" onclick="saveCandidateFeedback();">Save
																			Feedback</button>
																	</div> -->
																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<div id="demo">
														<div class="col-md-12">
															<div class="innercontent">
																<div class="row">
																	<section class="d-none" id="scheduled-interviwers-details"></section>
																	<div class="col-md-12 " id="no-inv-msg">
																		<div
																			class="d-flex justify-content-center align-items-center"
																			style="height: 250px;">
																			<p class="text-muted no-interview-fnd-msg">No Interview Details Found</p>
																		</div>
																	</div>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>

										<!-- Candidate Feedback Tab -->
										<div id="candidateFeedbackTab" class="tab-pane fade p-2 h-100"
											role="tabpanel">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tbody>
															<tr valign="middle">
																<td width="50%"><strong></strong></td>
																<td>
																	<div class="d-flex justify-content-end">
																		<div class="mr-2">
																			<button class="btn btn-primary edit-btn"
																				type="button" onclick="nextBtnFunction('interviewDetailsTab')">Prev</button>
																		</div>
																	</div>
																</td>
															</tr>
														</tbody>
													</table>
												</div>
												<div class="card p-2">
													<div id="demo">
														<div class="col-md-12">
															<div class="innercontent">
																<div class="row">
																	<!-- Feedback Card 1 -->
																	<div class="d-none" id="feedbacks-container">
																		<!-- Feedback cards will be injected here dynamically -->
																	</div>

																	<div class="col-md-12 " id="no-feedback-msg">
																		<div
																			class="d-flex justify-content-center align-items-center"
																			style="height: 250px;">
																			<p class="text-muted no-feedback-fnd-msg">No Feedbacks Found</p>
																		</div>
																	</div>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
									<!-- Right Inner Tab End -->
								</div>
							</div>
							<!-- Right Section End -->
						</div>
					</div>
					<!-- Tabbination 1 End -->
				</div>
			</div>
		</div>
		<!-- <script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->
	</div>
</body>
</html>
