

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style>
.hvrbox .hvrbox-layer_top {
	opacity: 0;
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	width: 25%;
	height: 100%;
	background: rgba(0, 0, 0, 0.3);
	color: #fff;
	padding: 15px;
}

.btn1 {
	border: none;
	border-radius: 4px;
	font-size: 12px!important;
	background-color: #5784c4;
	color: #fff !important;
	margin-left: 5px;
	margin-bottom: 8px;
	width: 150px;
	height: 33px;
	line-height: 12px;
	float: right;
	text-transform: uppercase;
	cursor: pointer;
}

.taskInfo {
	padding-left: 10px;
	color: #0c63e4;
}

.rating {
	float: left;
}

.rating:not(:checked )>input {
	position: absolute;
	top: -9999px;
	clip: rect(0, 0, 0, 0);
}

.rating:not(:checked )>label {
	float: right;
	width: 1em;
	padding: 0 .1em;
	overflow: hidden;
	white-space: nowrap;
	cursor: pointer;
	font-size: 200%;
	line-height: 1.2;
	color: rgba(0, 0, 0, 0.6);
	/*  text-shadow:1px 1px #bbb, 2px 2px #666, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked )>label:before {
	content: '★ ';
}

.rating>input:checked ~ label {
	color: #ea0;
	/*  text-shadow:1px 1px #c60, 2px 2px #940, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked )>label:hover, .rating:not(:checked )>label:hover 
	 ~ label {
	color: black;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>input:checked+label:hover, .rating>input:checked+label:hover ~
	label, .rating>input:checked ~ label:hover, .rating>input:checked ~
	label:hover ~ label, .rating>label:hover ~ input:checked ~ label {
	color: #ea0;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>label:active {
	position: relative;
	top: 2px;
	left: 2px;
}

.btn-outline-primary {
	color: #007bff;
	background-color: rgb(240 243 241/ 90%);
	background-image: none;
	border-color: #007bff;
	cursor: pointer;
}

.picker_calendar5 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 742px;
}

.picker_calendar6 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 1132px;
}

.btnbill {
	position: absolute;
	right: 70px;
	margin-top: -50px;
	z-index: 999;
}

.btn-primarynew {
	color: #fff !important;
	background-color: #0d6efd;
	border-color: #0d6efd;
}

.formValidation1 {
	font-size: 10px;
	font-weight: 100;
	color: #ff9e99;
	background-color: transparent;
	position: relative;
	top: -1px;
	padding: 3px 0;
}
</style>
<script>


$(function() {
	var budgetSettingId=$('#userId').val();
	//alert(profileId)

	$.ajax({
				type : "GET",
				url : "budget-setting-edit?id=" + budgetSettingId,
				async : false,
				success : function(response) {
					console.log("response------"+ JSON.stringify(response));
					//alert(response.message)
					if (response.code == "Success") {
						//alert("sdfhgsj");

						
						$("#demo").show();

						$(".container").hide();

						var budgetSetId=$("#budgetSetId").text(response.body[0].budgetSetId);
						$("#currentYear").val(response.body[0].currentYear);
						$("#lastYear").val(response.body[0].lastYear);
						$("#secondlastYear").val(response.body[0].secondlastYear);
						
					
						
						
					}

				}
			})
});




function updateProfile() {

		var obj = {};
		
		obj.budgetSetId = $('#userId').val();
		obj.currentYear = $('#currentYear').val();
		obj.lastYear = $('#lastYear').val();
		obj.secondlastYear = $('#secondlastYear').val();
		
		
		
	

	console.log("object on update-----------" + JSON.stringify(obj));
	//return false;


	var validation = true;


	if (validation) {
		$.ajax({
			type : "POST",
			url : "budget-setting-update",
			contentType : "application/json",
			data : JSON.stringify(obj),
			success : function(response) {
				if (response.code == "Success") {
					console.log(response);

					location.reload();

				}
			},
			error : function(data) {

				//console.log(data);
			}
		})
	}

}



</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">



					  <!-- <div class="collapse" >  -->
						<div class="innercontent" id="demo">
							<div class="innerstickybg">
								<div class="d-flex justify-content-between" id="main">
									<div>
										<span class="taskInfo">MANAGE BUDGET</span>
									</div>
									<div class="col-md-3 padding-0" align="right">
										
										<button class="btn1" id="save" onclick="updateProfile()">UPDATE</button>
										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
									</div>
								</div>
							</div>
							<div class="innercontent">

								<!-- <div class="row"> -->
								<div class="row mb-3">
         
         						<div class="col-md-6">
									<div class="form-group">
										<label>Current Financial Year</label> <select id="currentYear"
											class="form-control">
											<option value="">--Select--</option>
											<option th:each="c,iter:${fiscalYearList}"
												th:value="${c.key}" th:text="${c.name}"></option>
										</select>
									</div>
								</div>
								
									</div>
									
							<div class="row mb-3">
								<div class="col-md-6">
									<div class="form-group">
										<label>Last Financial Year</label> <select id="lastYear"
											class="form-control">
											<option value="">--Select--</option>
											<option th:each="c,iter:${fiscalYearList}"
												th:value="${c.key}" th:text="${c.name}"></option>
										</select>
									</div>
								</div>
							</div>	
								
								<div class="row mb-3">
								<div class="col-md-6">
									<div class="form-group">
										<label>SecondLast Financial Year</label> <select id="secondlastYear"
											class="form-control">
											<option value="">--Select--</option>
											<option th:each="c,iter:${fiscalYearList}"
												th:value="${c.key}" th:text="${c.name}"></option>
										</select>
									</div>
								</div>
								
								


								</div>
							</div>
						</div>
						
						    </div>
						</div>
					</div>
				</div>
			
		
	
</body>
</html>
