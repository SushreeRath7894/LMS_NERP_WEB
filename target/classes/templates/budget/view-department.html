
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style>
.accordion-item {

    margin-top: 15px!important;
   
}
.hvrbox .hvrbox-layer_top {
	opacity: 0;
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	width: 25%;
	height: 100%;
	background: rgba(0, 0, 0, 0.3);
	color: #fff;
	padding: 15px;
}

.btn1 {
	width: 102px
}

.btn2 {
	border: none;
	background: rgb(87, 132, 196);
	background: linear-gradient(0deg, rgb(42 22 57) 0%, rgb(88, 0, 152) 100%);
	border-radius: 4px;
	font-size: 12px;
	background-color: #264c82;
	color: #fff;
	margin-left: 5px;
	text-transform: uppercase;
	margin-bottom: 8px;
	width: 138px;
	height: 33px;
	line-height: 12px;
	float: right;
	box-shadow: inset 2px 2px 2px 0px rgba(255, 255, 255, .5), 7px 7px 20px
		0px rgba(0, 0, 0, .1), 4px 4px 5px 0px rgba(0, 0, 0, .1);
	text-transform: uppercase;
	cursor: pointer;
	white-space: normal;
	font-weight: 700;
}

.btn3 {
	border: none;
	border-radius: 7px;
	font-size: 14px;
	background-color: #ff4b4b;
	color: #fff !important;
	margin-left: 5px;
	margin-bottom: 8px;
	width: 70px;
	height: 33px;
	line-height: 12px;
	float: right;
	text-transform: uppercase;
	cursor: pointer;
	white-space: normal;
	font-weight: bold;
}

.taskInfo {
	padding-left: 10px;
	color: #0c63e4;
}

.rating {
	float: left;
}

.rating:not(:checked )>input {
	position: absolute;
	top: -9999px;
	clip: rect(0, 0, 0, 0);
}

.rating:not(:checked )>label {
	float: right;
	width: 1em;
	padding: 0 .1em;
	overflow: hidden;
	white-space: nowrap;
	cursor: pointer;
	font-size: 200%;
	line-height: 1.2;
	color: rgba(0, 0, 0, 0.6);
	/*  text-shadow:1px 1px #bbb, 2px 2px #666, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked )>label:before {
	content: '★ ';
}

.rating>input:checked ~ label {
	color: #ea0;
	/*  text-shadow:1px 1px #c60, 2px 2px #940, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating:not(:checked )>label:hover, .rating:not(:checked )>label:hover 
	 ~ label {
	color: black;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>input:checked+label:hover, .rating>input:checked+label:hover ~
	label, .rating>input:checked ~ label:hover, .rating>input:checked ~
	label:hover ~ label, .rating>label:hover ~ input:checked ~ label {
	color: #ea0;
	/*  text-shadow:1px 1px goldenrod, 2px 2px #B57340, .1em .1em .2em rgba(0,0,0,.5); */
}

.rating>label:active {
	position: relative;
	top: 2px;
	left: 2px;
}

.btn-outline-primary {
	color: #007bff;
	background-color: rgb(240 243 241/ 90%);
	background-image: none;
	border-color: #007bff;
	cursor: pointer;
}

.picker_calendar5 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 742px;
}

.picker_calendar6 {
	cursor: pointer;
	position: absolute;
	bottom: 361px;
	left: 1132px;
}

.btnbill {
	position: absolute;
	right: 70px;
	margin-top: -50px;
	z-index: 999;
}

.btn-primarynew {
	color: #fff !important;
	background-color: #0d6efd;
	border-color: #0d6efd;
}

.formValidation1 {
	font-size: 10px;
	font-weight: 100;
	color: #ff9e99;
	background-color: transparent;
	position: relative;
	top: -1px;
	padding: 3px 0;
}

.ag-header-cell-text {
	color: white !important;
}

.ag-header-viewport {
	background: linear-gradient(0deg, rgba(87, 132, 196, 1) 0%,
		rgba(12, 25, 180, 1) 100%);
}
</style>
<script>
	/* $(function() {

		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);

		agGrid.simpleHttpRequest({
			url : "manage-department-throughAjax"
		}).then(function(data) {
			var len = data.length;
			$('#totalReq').find('span').html(len);

			gridOptions.api.setRowData(data);

		});
		$("#myGrid").show();
		$("#delete").attr("disabled", true);
	}); */
	
$(function() {
		
		//$('#add').attr("disabled", true);

		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		
		

	
			agGrid.simpleHttpRequest({
				url : 'manage-department-through-json'
			}).then(function(data) {
				var jsonData = JSON.parse(data.body[0]);
				var allData=jsonData.dept;
				//console.log(allData)
				if(allData == "" || allData == null || allData == "null"){
					$('#totalReq').find('span').html('0');
					gridOptions.api.setRowData();
				}else{
					var len = allData.length;
					$('#totalReq').find('span').html(len);
					gridOptions.api.setRowData(allData);
				}
				
			});
			
	});

	$(function() {
		$('.collapse').on('show.bs.collapse', function() {
			$(this).siblings('.panel-heading').addClass('active');
		});

	})
	//search bar

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}

	$('input,textarea').focus(
			function() {
				$(this).data('placeholder', $(this).attr('placeholder')).attr(
						'placeholder', '');
			}).blur(function() {
		$(this).attr('placeholder', $(this).data('placeholder'));
	});

	var count = 0;
	function allCheck() {
		count++;

		if (count == 1) {
			$('.checkCls').prop("checked", true);
		} else {
			count = 0;
			$('.checkCls').prop("checked", false);
		}
	}

	var txtLen = 0;
	function textCount(event) {

		var id = event.target.id;
		var pId = $('#' + id).next().attr("id");
		$('#' + pId + ' span').empty();
		txtLen = $('#' + id).val().length;
		$('#' + pId + ' span').append(txtLen);
	}
	// column Defs
	const columnDefs = [
			{
				headerCheckboxSelection : false,
				checkboxSelection : true,
				width : 8,
				sortable : false,
				filter : false,
				resizable : true

			},
			{
				headerName : 'Department Id',
				field : "dept_id",
				width : 250,
				cellRenderer : function(params) {
					return '<a onclick=editPage("' + params.data.dept_id
							+ ',' + '0' + '") href="javascript:void(0)">'
							+ params.data.dept_id + '</a>';
				}
			},
			{
				headerName : 'Department Name',
				field : "deptName",
				width : 250,
				cellRenderer : function(params) {
					return '<div style="color:black;font-weight: bold;">'
							+ params.data.deptName + '</div>';
				}
			},
			{
				headerName : "Department Mobile No",
				field : "deptMobile",
				width : 250,
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					return '<div style="color:black;font-weight: bold;">'
							+ params.data.deptMobile + '</div>';
				}
			},
			{
				headerName : "Department Email",
				field : "deptEmail",
				width : 250,
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					return '<div style="color:black;font-weight: bold;">'
							+ params.data.deptEmail + '</div>';
				}
			},
			{
				headerName : "Department HOD Name",
				field : "departmentHODName",
				width : 250,
				cellStyle : {
					textAlign : 'center'
				},
				
				cellRenderer : function(params) {
					if (params.data.departmentHODName !=null) {
						return '<div style="color:black;font-weight: bold;">' + params.data.departmentHODName + '</div>';
					} else {
						return '<div style="color:black;font-weight: bold;">' + "N/A" + '</div>';
					}
				},

			},
			{
				headerName : "Decription",
				field : "description",
				width : 250,
				cellStyle : {
					textAlign : 'center'
				},
				cellRenderer : function(params) {
					return '<div style="color:black;font-weight: bold;">'
							+ params.data.description + '</div>';
				},

			} 
			
			];

	const gridOptions = {
		columnDefs : columnDefs,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 320,
			height : 10
		},
		rowSelection : 'multiple',
		suppressRowClickSelection : true,
		onSelectionChanged : rowSelect,
		getRowNodeId : function(data) {
			return data.dept_id;
		}
	};

	

	var deleteId = "";
	function rowSelect() {
		//alert('hello select');
		var selectedRows = gridOptions.api.getSelectedRows();
		deleteId = "";

		for (var i = 0; i < selectedRows.length; i++) {
			deleteId = deleteId + '"' + selectedRows[i].dept_id + '",';
			// deleteId = deleteId  + selectedRows[i].departmentId + ',';
		}
		deleteId = deleteId.substring(0, deleteId.length - 1);
		console.log(deleteId)
		var rowCount = 0;

		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});

		if (rowCount > 0) {
			$('#delete').attr("disabled", false);

		} else {
			$('#delete').attr("disabled", true);
		}
	}
	// for new button
	function showAddHideView() {
		//	alert('hello');
		$("#add").hide();
		$("#copy").hide();
		$("#delete").hide();
		$("#myGrid").hide();
		$("#searchRowDiv").hide();
		$("#totalReq").hide();
		$("#statusDiv").hide();
		$("#idDiv").hide();
		$("#collapseFour").hide();
		$("#headingFour").hide();
		$("#myGridActivity").hide();
		$("#addBtn").hide();
		$("#demo").show();
		
		
		$("#confirmPasswordDiv").show();
		$("#passwordDiv").show();

	}
	// for cancel button
	function cancelBtn() {
		$("#add").show();
		$("#copy").show();
		$("#delete").show();
		$("#totalReq").show();
		$("#myGrid").show();
		$("#searchRowDiv").show();
		$("#demo").hide();

		$('#departmentId').val("");
		$('#departmentName').val("");
		$('#deptMobile').val("");
		$('#deptEmail').val("");
		$('#departmentHODName').val("");
		$('#description').val("");
		$("#addBtn").show();

		/*agGrid.simpleHttpRequest({
			url : "manage-department-throughAjax"
		}).then(function(data) {
			gridOptions.api.setRowData(data);
		});*/
	}

	$(document).ready(function() {
		$("#date").datetimepicker({
			format : "d-m-Y",
			closeOnDateSelect : true,
			minDate : new Date(),
			timepicker : false,
		});
		$("#departmentId").val("");

	});

	// Edit & stage change 
	function editPage(id) {
		//alert(id);
		var editId = id.split(",");

		var dept_id = editId[0];

		var modal = editId[1];
		//alert('departmentId------'+departmentId);
		$("#demo").show();
		$("#add").hide();
		$("#copy").hide();
		$("#delete").hide();
		$("#myGrid").hide();
		$("#searchRowDiv").hide();
		$("#totalReq").hide();
		$("#statusDiv").hide();
		$("#idDiv").hide();
		$("#collapseFour").hide();
		$("#headingFour").hide();
		$("#myGridActivity").hide();

		$.ajax({
			type : "GET",
			url : "manage-department-edit?departmentId=" + dept_id,
			async : false,
			success : function(response) {
				console.log("response------" + JSON.stringify(response));
				if (response.message == "Success") {

					$("#add").hide();
					$("#copy").hide();
					$("#delete").hide();
					$("#myGrid").hide();
					$("#searchRowDiv").hide();
					$("#totalReq").hide();
					$("#statusDiv").hide();
					$("#idDiv").hide();
					$("#collapseFour").hide();
					$("#headingFour").hide();
					$("#myGridActivity").hide();

					$("#demo").show();

					$(".container").hide();

					$("#confirmPasswordDiv").hide();
					$("#passwordDiv").hide();

					$("#dept_id").val(response.body[0].departmentId);
					$("#departmentName").val(response.body[0].departmentName);
					$("#deptMobile").val(response.body[0].deptMobile);
					$("#deptEmail").val(response.body[0].deptEmail);
					$("#departmentHODName").val(
							response.body[0].departmentHODName);
					//$("#password").val(response.body[0].password);
					$("#description").val(response.body[0].description);
					
					
					

				}

			}
		})
	}

	// addDepartmentInfo

	function addDepartmentInfo() {
		var obj = {};
		obj.departmentId = $('#dept_id').val();
		obj.departmentName = $('#departmentName').val();
		obj.deptMobile = $('#deptMobile').val();
		obj.deptEmail = $('#deptEmail').val();
		obj.departmentHODName = $('#departmentHODName').val();
		obj.description = $('#description').val();
		obj.password = $('#password').val();
		//obj.confirmPassword = $('#confirmPassword').val();
		//	console.log("object on add-----------" + JSON.stringify(obj));

		
		console.log('dataset-----------------------' + JSON.stringify(obj));
		//return false;

		/* FORM VALIDATION ENDS*/

	
			$.ajax({
				type : "POST",
				url : "manage-department-add-dtls",
				contentType : "application/json",
				data : JSON.stringify(obj),
				success : function(response) {
					if (response.message == "Success") {
						console.log(response);
						swal("Department added successfully!", " ", "success");

						cancelBtn();
						agGrid.simpleHttpRequest({
							url : 'manage-department-through-json'
						}).then(function(data) {
							var jsonData = JSON.parse(data.body[0]);
							var allData=jsonData.dept;
							console.log(allData)
							var len = allData.length;
							$('#totalReq').find('span').html(len);
							gridOptions.api.setRowData(allData);
						});

					}
				},
				error : function(data) {

					//console.log(data);
				}
			})
			
		$('#departmentId').text('');
		$('#departmentName').val('');
		$('#deptMobile').val('');
		$('#deptEmail').val('');
		$('#departmentHODName').val('');
		$('#description').val('');
		$('#password').val('');
		//obj.confirmPassword = $('#confirmPassword').val();
		}

	

	function deleteDepartment() {
		console.log("delete ids--------------" + deleteId);

		$.ajax({
			type : "GET",
			url : "manage-department-delete?departmentId=" + deleteId,
			success : function(response) {
				if (response.message == "Success") {
					swal("Department deleted successfully!", " ", "success");
					cancelBtn();
					agGrid.simpleHttpRequest({
						url : "manage-department-through-json"
					}).then(function(data) {
						gridOptions.api.setRowData(data);
					});

				}
			}

		});

		$('#delete').attr("disabled", true);
	}
</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">

					<div class="d-flex justify-content-between">
						<div class="col-md-2  btn-hs">
							<div class="font-design" id="totalReq">
								DEPARTMENT LIST(<span></span>)
							</div>
						</div>
						<div class="col-md-4  btn-hs" id="searchRowDiv">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search"
									class="searchboxinput" onkeyup="cancelBar()"
									oninput="onQuickFilterChanged()" id="quickFilter">
								<div class="searchicon">
									<a href="javascript:void(0)"><span
										style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
										id="closeKey"
										onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';"
										class="close_i"><i class="ti-close srchicon"></i></span></a><a
										href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
								</div>
							</div>

						</div>
						<div class="col-md-6 buttonsec btn-hs">
							<input type="button" class="btn3" onclick="deleteDepartment()"
								id="delete" value="DELETE" data-toggle="modal"> <input
								type="button" class="btn2" id="addBtn"
								onclick="showAddHideView()" value="Add Department" readonly>
						</div>
					</div>

					<input type="hidden" id="totalPageno"> <input type="hidden"	id="currentPageno">
					<input type="hidden" id="dept_id">
					<div id="myGrid" style="width: 100%; height: 350px;"
						class="ag-theme-alpine"></div>
					<div id="pagination" style="cursor: pointer;"></div>

					<div class="collapse" id="demo">
						<div class="innercontent">
							<div class="innerstickybg">
								<div class="d-flex justify-content-between" id="main">
									<div class="col-md-3" id="idDiv">
										Department ID: <span id="departmentId"></span>
									</div>
									<div>
										<span class="taskInfo">Department Information</span>
									</div>


									<div class="col-md-3 padding-0" align="right">
										<button class="btn1" id="cancel" onclick="cancelBtn()">BACK</button>
										<button class="btn4" id="cancel" onclick="cancelBtn()">CANCEL</button>
										<button class="btn1" id="save" onclick="addDepartmentInfo()">SAVE</button>

									</div>
								</div>
							</div>
							<div class="innercontent">

								<!-- <div class="row"> -->
								<div class="row">


									<div class="col-md-4">
										<div class="form-group">
											<label>Department Name</label> <input type="text"
												class="form-control" id="departmentName"
												placeholder="Department Name" onblur="showDisplay()">
											<span id="errmsg_fname"></span>
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Department Mobile No.</label> <input type="text"
												class="form-control" id="deptMobile"
												placeholder="Department Mobile No." maxLength="10"
												onkeyup="mobVal1();checkNumeric('deptMobile');"
												onblur="mobileDuplicateCheck();"> <span id="error9"
												class="formValidation1"></span> <span id="errmsg_mobile"></span>
										</div>
									</div>




									<div class="col-md-4">
										<div class="form-group">
											<label>Department Email Id</label> <input type="text"
												class="form-control" id="deptEmail"
												placeholder="Department Email Id" onkeyup="pmailVal();">
											<span id="error3" class="formValidation1"></span> <span
												id="errmsg_email"></span>

										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label>Department HOD Name</label> <input type="text"
												class="form-control" id="departmentHODName"
												placeholder="Department HOD Name"> <span
												id="errmsg_fname"></span>
										</div>
									</div>
									<div class="col-md-4" id="passwordDiv">
										<div class="form-group">
											<label>Password</label> <input type="text"
												class="form-control" id="password"> <span
												id="errmsg_fname"></span>
										</div>
									</div>  
									<div class="col-md-4">
										<div class="form-group" id="confirmPasswordDiv">
											<label>Confirm Password</label> <input type="text"
												class="form-control" id="confirmPassword">
												<span id="errmsg_fname"></span>
										</div>
									</div>

								</div>
							</div>
						</div>


						<!-- 	main div start here -->
						<div id="main">

							<!-- 	collapse for Contact InformationStart here -->
							<div class="accordion-item">
								<h2 class="accordion-header" id="headingOne">
									<button class="accordion-button" type="button"
										data-bs-toggle="collapse" data-bs-target="#collapseOne"
										aria-expanded="false" aria-controls="collapseOne">
										Description Information</button>
								</h2>
								<div id="collapseOne" class="accordion-collapse collapse show"
									aria-labelledby="headingOne" data-bs-parent="#accordionExample">
									<div class="accordion-body">
										<div class="row">
											<div class="col-md-8">
												<div class="modal-inrheading">Description</div>
												<div class="position-text">
													<textarea rows="4" cols="100" id="description"
														onkeyup="textCount(event)"></textarea>
													<div id="charNumSN" class="txtcounter" align="right">
														<span>0</span> characters
													</div>
												</div>
											</div>

										</div>

									</div>
								</div>
							</div>


						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
