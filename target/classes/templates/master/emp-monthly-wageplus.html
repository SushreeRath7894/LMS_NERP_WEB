		function getCurrentDateMonthYear() {
			//alert("hyy")
			var curdate = new Date();
			var date = curdate.getDate();
			//alert(date)
			var mnth = curdate.getMonth();
			$("#attndyear").val(curdate.getFullYear())
			var sday = $("#startDayForAtten").val();
			//alert("day===="+$("#startDayForAtten").val())
			if (parseInt(sday) > 1) {
				if (parseInt(date) > parseInt(sday)) {
					var month = (curdate.getMonth() + 1);
					var year = curdate.getFullYear();
				} else {
					var month = curdate.getMonth();
					if (month == 0) {
						var year = curdate.getFullYear() - 1;
						month = 12;
					} else {
						var month = curdate.getMonth();
						var year = curdate.getFullYear();
					}
				}
			} else {
				var month = (curdate.getMonth() + 1);
				var year = curdate.getFullYear();
			}
			var nextmonth = month + 1;
			if (parseInt(sday) > 1) {
				$("#attndmonth").val(month + 1);
			} else {
				$("#attndmonth").val(month);
			}
			var fromdate = sday + "-" + String(month).padStart(2, '0') + "-" + year;
			//alert(fromdate)
			const lastDayOfMonth = new Date(year, month, 0).getDate();
			if (sday > 1) {
				if (month == "12") {
					var todate = (parseInt(sday) - 1) + "-"
							+ String(1).padStart(2, '0') + "-" + (year + 1);
				} else {
					var todate = (parseInt(sday) - 1) + "-"
							+ String(nextmonth).padStart(2, '0') + "-" + year;
				}
			} else {
				var todate = lastDayOfMonth + "-" + String(month).padStart(2, '0')
						+ "-" + year;
			}
	
			$("#fromDate").val(fromdate);
			$("#fromDateCalendar").val(fromdate);
			$("#endDate").val(todate);
			$("#endDateCalendar").val(todate);
		}

//select employee
function getEmployeeList() {
		var search = $("#employeeName").val();
		if (search) {
			$.ajax({
						type : "POST",
						url : "employee-monthly-wageplus-get-employee-list",
						dataType : 'json',
						contentType : 'application/json',
						data : search,
						success : function(response) {
							if (response.message == "success") {
								if (response.body.length != 0) {
									$("#empid").val("");
									$("#employeeName").css("background", "#FFF");
									var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;">';
									for (var i = 0; i < response.body.length; i++) {
							content += '<li class="autocompletedata cp" onClick="selectAutocompleteValueItem1(\''
												+ response.body[i].key
												+ '\',\''
												+ window.btoa(response.body[i].name)
												+ '\')">'
												+ response.body[i].key
												+ " - "
												+ response.body[i].name
												+ '</li>';
									}
									content += '</ul>';
									$("#suggesstion-box_").show();
									$("#suggesstion-box_").html(content);

								} else {
									$("#employeeName").css("background", "#FFF");
									var content = '<ul id="autocomplete-list1">';
									content += '<font-weight:100; font-size:14px; color:#ccc;     background-color: #0909e4;"li onClick="selectAutocompleteValueItem()">'
											+ "No Data Found" + '</li>';
									content += '</ul>';
									$("#suggesstion-box_").show();
									$("#suggesstion-box_").html(content);
								}
							}
						},
						error : function(data) {
							console.log(data);
						}
					})
		}else{
			$("#empid").val("");
			$("#employeeName").val("");
			$("#suggesstion-box_").hide();
		}
	}
	function selectAutocompleteValueItem1(empid, employeeName) {
		if (empid) {
			  $("#error1").hide();
			$("#employeeName").val(window.atob(employeeName));
			$("#empid").val(empid);
			$("#empidob").val(empid);
			$("#employeeName").attr('data-procat', empid);
			$("#suggesstion-box_").hide();
		} else {
			$("#empid").val("");
			$("#empidob").val("");
			$("#employeeName").val("");
			$("#employeeName").attr('data-procat', "");
			$("#suggesstion-box_").hide();

		}
	}
