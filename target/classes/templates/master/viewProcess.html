		function indianNumber(amount) {
		    if (amount == null) {
		        return '';
		    }
		    amount = amount.toString();
		    
		    let [integerPart, decimalPart] = amount.split('.');
		    let reversedInteger = integerPart.split('').reverse().join('');
		    let formattedReversedInteger = reversedInteger.replace(/(\d{3})(?=\d)/g, '$1,').replace(/(\d{2})(?=\d{3},)/g, '$1,');
		    let formattedInteger = formattedReversedInteger.split('').reverse().join('');
		    return decimalPart ? `${formattedInteger}.${decimalPart}` : formattedInteger;
		}

		    } else {

		    }
		}
		function checkNumeric(id) {
		    var textField = document.getElementById(id);
		    var value = textField.value.replace(/[^0-9 ]/g, '');
		    if(value.slice(-1) == ' '){
		     	$("#" + id).empty();
		     	value = '';
		     } 
		   $("#" + id).val(value);
		}
		function updateSumOfColumns(event, col=null) {
		    var newVal = event.target.value;
		    var val = newVal.replace(/[^0-9 ]/g, '');
		    var selectedNode = gridOptions.api.getSelectedNodes()[0];
		   
		    if (selectedNode) { 
		        if (col === 'incTax' || col === 'advance' || col === 'otherpenamnt' || col === 'other' || 
		        		col === 'reward' || col === 'bonus' || col === 'arear' || col === 'otherAllow' || 
		        		col === 'adminCharge' || col === 'edliCharge') {
		        	
		            selectedNode.setDataValue(col, parseFloat(val) || 0);
		            
		        }
		    }
		    updateData();
		    countFilteredRows();
		    var empId = selectedNode.data.empId;
		    var textField = document.getElementById(col + empId);
		    if (textField) {
		        textField.focus();
		        textField.selectionStart = textField.selectionEnd = textField.value.length; 
		    }
		    event.preventDefault();
		}
		function updateData(){
			gridOptions.api.forEachNode(function(node) {
                var rowData = node.data;
               
                var totalEarning = parseFloat(rowData.totalEarningNew || 0);
                var otherAllow = parseFloat(rowData.otherAllow || 0);
                var arear = parseFloat(rowData.arear || 0);
                var bonus = parseFloat(rowData.bonus || 0);
                var reward = parseFloat(rowData.reward || 0);
                
                var earning = totalEarning + otherAllow + arear + bonus + reward ;
                
                var totalDeduction = parseFloat(rowData.totalDeductionNew || 0);
                var other = parseFloat(rowData.other || 0);
                var otherpenamnt = parseFloat(rowData.otherpenamnt || 0);
                var advance = parseFloat(rowData.advance || 0);
                var incTax = parseFloat(rowData.incTax || 0);
                var deduct = totalDeduction + incTax + other + otherpenamnt + advance ;
                
              //  var netPay = parseFloat(rowData.netPayNew || 0);
                
                var gross = earning - deduct;
                
                node.setDataValue('totalEarning', earning);
                node.setDataValue('totalDeduction', deduct);
                node.setDataValue('netPay', gross);
				
            //    console.log("dataaaa----",node.data);
                node.setData(node.data);
            });
		}

		//downloadProcessCSV
		function downloadProcessCSV() {
			var rowCount = 0;
			gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			    if (rowNode.data.empId) {
			        rowCount++;
			    }
			});
			if (rowCount > 0) {
			    var name = "Salary Process-" + $("#attndmonth option:selected").text();
			    var allColumns = gridOptions.columnApi.getAllColumns();

			    allColumns.forEach(col => {
			        if (col.getColDef().headerName) {
			            col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
			        }
			    });

			    var visibleColumns = allColumns.filter(col => {
			        const headerName = col.getColDef().headerName;
			        const isColumnVisible = !col.getColDef().hide;
			        return headerName !== undefined && headerName !== null && isColumnVisible;
			    });

			    var visibleColumnIds = visibleColumns.map(col => col.getColId());

			    const params = {
			        skipHeader: false,
			        columnGroups: false,
			        skipFooters: false,
			        skipGroups: false,
			        skipPinnedTop: false,
			        skipPinnedBottom: false,
			        allColumns: true,
			        onlySelected: false,
			        suppressQuotes: false,
			        fileName: name + '.csv',
			        sheetName: 'Sheet1',
			        customHeader: null,
			        customFooter: null,
			        columnKeys: visibleColumnIds
			    };
			    gridOptions.api.exportDataAsCsv(params);
			} else {
			    $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
			    $("#msgOkModal").removeClass("btn3");
			    $("#msgOkModal").addClass("btn1");
			    $("#msgModal").modal('show');
			}
		}
		//getCurrentFY
		function getCurrentFY() {
			var financial_year = "";
			var today = new Date();
			if ((today.getMonth() + 1) <= 3) {
				financial_year = (today.getFullYear() - 1) + "-"
						+ today.getFullYear()
			} else {
				financial_year = today.getFullYear() + "-"
						+ (today.getFullYear() + 1)
			}
			$("#financialYr").val(financial_year)
		}
		//view All Process Data
		function viewAllProcessData() {
			var rowStatus=[];
			var stafftype = $("#stafftype").val();
			var fromDate = $("#fromDate").val();
			var toDate = $("#endDate").val();
			var employedBy = $("#employedBy").val();
			$('.loader').show();
			agGrid.simpleHttpRequest(
					{
						url : "view-process-view-details?fromDate=" + fromDate
								+ "&toDate=" + toDate + "&employedBy=" + employedBy + "&stafftype=" + stafftype
					}).then(function(data) {
					$('.loader').hide();
				var len = data.length;
				$('#totalReq').find('span').html(len);
				gridOptions.api.setRowData(data);
				var count=0;
				for (var i = 0; i < data.length; i++) {
				    var approveStatus = data[i].approveStatus;
				    if(approveStatus === '3'){
				    	count +=1;
				    }
				}
				if(data.length==count){
			    	$('#saveDraft').hide();
			    	$('#approve').hide();
			    }else{
			    	$('#saveDraft').show();
			    	$('#approve').show();
			    }
				$('.loader').hide();
				countFilteredRows();
			    gridOptions.api.forEachNode(function(node) {
					var rowData = node.data;
					var changeAble =  parseFloat(rowData.incTax || 0) + parseFloat(rowData.advance || 0) + parseFloat(rowData.other || 0);
					var totalDeduction = parseFloat(rowData.totalDeduction - changeAble || 0);
					var totalEarning = parseFloat(rowData.totalEarning - parseFloat(rowData.arear || 0) || 0);
					var netPay = parseFloat(totalEarning - totalDeduction || 0);
                    node.setDataValue('totalDeductionNew', totalDeduction);
					node.setDataValue('netPayNew', netPay);
					node.setDataValue('totalEarningNew', totalEarning);
                    node.setData(node.data);
          	 }); 
			});
	
		}
		//get Approver Status
		function getApproverStatus() {
			var fromDate = $("#fromDate").val();
			var userId = $("#sessionId").val();
			if (fromDate) {
				$.ajax({
					type : 'GET',
					url : 'view-process-getApproverStatus?fromDate=' + fromDate
							+ "&userId=" + userId,
					contentType : false,
					success : function(response) {
						if (response.message == "success") {
							$("#isApprove").val(response.body.key);
						}
					},
					error : function(e) {
						alert("error");
					}
				});
			}
		}
	</script>

</head>
