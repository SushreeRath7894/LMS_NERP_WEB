
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style type="text/css">
.date-class {
	font-weight: 500;
}

.autocompletedata {
	padding-left: 6px;
	cursor: pointer;
}

.reply-modal-doc {
	background-color: #f2f2f6;
	padding: 15px;
}

.loader-modal {
	border: 10px solid #f3f3f3;
	border-radius: 50%;
	border-top: 10px solid #3498db;
	width: 40px;
	height: 40px;
	-webkit-animation: spin 2s linear infinite; /* Safari */
	animation: spin 2s linear infinite;
	position: absolute;
	top: 50%;
	left: 50%;
	z-index: 9999;
	margin-top: -30px;
	margin-left: -30px;
}

.loader-modal-autosearch {
	border: 7px solid #f3f3f3;
	border-radius: 50%;
	border-top: 7px solid #3498db;
	width: 30px;
	height: 30px;
	-webkit-animation: spin 2s linear infinite;
	animation: spin 2s linear infinite;
	position: absolute;
	top: 50%;
	left: 50%;
	z-index: 9999;
	margin-top: -30px;
	margin-left: -30px;
}

.autocomplete {
	position: relative;
	display: inline-block;
	width: 100%;
}

.sugg-cls ul {
	height: 150px;
	overflow-x: scroll;
	position: relative;
}

.left-design {
	text-align: left;
}

ul#autocomplete-list1 {
	position: relative;
	z-index: 999;
}

ul#autocomplete-list1 li {
	position: relative;
	color: #fff;
	padding-left: 6px;
	background-color: #1f57a8;
	border-bottom: solid 1px #6189c2;
	padding-top: 5px;
	padding-bottom: 5px;
}
</style>
<script>
$(document).ready(function () {
	   var gridDiv = document.querySelector('#myGrid');
	   new agGrid.Grid(gridDiv, gridOptions);
	   
	   $('#deleteBtn').attr("disabled", true);

	   var data = []
	   gridOptions.api.setRowData(data);
	   viewData();
	 
	   CKEDITOR.replace('noticeContent', {
	      height: 180,
	      removePlugins: 'wsc',
	      scayt_autoStartup: true,
	      scayt_maxSuggestions: 3,
	      autoParagraph: false,
	   });
		$('#docTbl').on('click', '.rmv1', function() {
			openDeleteConfirm();
			var value = $(this).parent("div").attr("id");

			$("#dltValue").val(value);
		});
	   
		var dateFormat = localStorage.getItem("dateFormat");
		$("#dateCalendar").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			timepicker : false,
		}).on("change", function() {
			$('#publishDate').val($(this).val());
		})

		$('#publishDate').blur(function() {
			$("#dateCalendar").val($(this).val());
		})
 
		
	})

	/* -------------------search bar for mygrid------------------------ */

	function onQuickFilterChanged() {
	   gridOptions.api
	      .setQuickFilter(document.getElementById('quickFilter').value);
	   var totalRowCount = gridOptions.api.getModel().getRowCount();
	   $('#totalReq').find('span').html(totalRowCount);
	}


function cancelBar() {
	var id = document.getElementById("closeKey");
	id.style.display = "block";

	if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
		id.style.display = "none";
	}
}


	var columnDefs = [{
	   headerCheckboxSelection: false,
	   headerCheckboxSelectionFilteredOnly: true,
	   checkboxSelection: true,
	   width: 10,
	   sortable: false,
	   filter: false,
	   resizable: true,
	   pinned: 'left',
	},{
		   headerName: 'Notice ID',
		   field: "noticeId",
		   width: 180,
		   pinned: 'left',
		   cellRenderer : function(params) {
				if(params.data.type==="SUBMIT"){
					return params.data.noticeId;
				}else{
					 return '<a id="noticeId" onclick=openDiv("' +
			         params.data.noticeId +
			         '") href="javascript:void(0)"><i class="bi bi-pencil-square"></i>  ' +
			         params.data.noticeId + '</a>';
				}
				
			}
		  
		},{
	   headerName: 'To',
	   field: "publishedTo",
	   width: 80,
	  
	},{
		headerName : 'Notice Content',
		field : "noticeContent",
		width: 150,
		cellStyle : {
			textAlign : 'center'
		},cellRenderer : function(params) {
				let encodedLogData = encodeURIComponent(JSON.stringify(params.data));

				 return '<a id="id" onclick="openOverViewModal(decodeURIComponent(\'' + encodedLogData.replace(/'/g, "\\'") + '\'))" href="javascript:void(0)">'
			        + '<i class="bi bi-eye-fill" style="font-size: 10px;"> View </i>'
			        + '</a>';
		}

	},{
	   headerName: 'Notice Subject',
	   field: "noticeSubject",
	},{
		   headerName: 'Preview',
		   field: "noticeAttachment",
		   width: 160,
		   cellStyle: {
			      textAlign: 'center'
			   },
		   cellRenderer: function (params) {
			   if(params.data.noticeId){
				   var s = "";
				      s = ' <a href="#" class="grn-btn" onclick="previewAsPDF(\'' + params.data.noticeId + '\')"><i class="fas fa-file-pdf"></i> Preview </a>';
				      return s;
				}else{
					 return '';
				}
		   }, 
		}, {
	    headerName: 'Published Date',
		field: "publishDate",
	},{
	   headerName: 'Published By',
	   field: "publishedBy",
	},{
	    headerName: 'Created On',
		field: "publishedOn",
	},{
        headerName: 'Status',
		field: "type",
	}];

	const gridOptions = {
	   columnDefs: columnDefs,
	   defaultColDef: {
	      sortable: true,
	      filter: true,
	      resizable: true,
	      width: 190,
	      height: 10
	   },
	   rowSelection: 'single',
	   suppressRowClickSelection: true,
	   pagination : true,
	   paginationPageSize: 15,
	   onSelectionChanged: onSelectionChanged,
	};
	
	function cancelModalBtnOverview(){
		$('#contentModal').modal('hide');
	}

	function openOverViewModal(data) {
		$("#noticeSpanId").text('');
		 $("#contentSpan").html('');
		 
		$('#contentModal').modal('show');
		
	    let allData = JSON.parse(decodeURIComponent(data));
	    
	    $("#noticeSpanId").text(allData.noticeId || 'N/A');
	    if (allData.noticeContent) {
	        $("#contentSpan").html(allData.noticeContent || 'N/A');
	    } else {
	        $("#contentSpan").html('<div style="color:#D2042D">No Content To Show</div>');
	    } 
	}
	
	function previewAsPDF(noticeId){
		   var organization = $("#sessionOrganization").val();
		   var orgDivision = $("#sessionOrgDivision").val();
		   var logo = $("#sessionLogo").val();
		   var userId = $("#sessionId").val();
		   
		   window.open("/master/manage-notice-pdf-download?noticeId=" +
				      window.btoa(noticeId) + "&organization=" +
				      window.btoa(organization) + "&orgDivision=" +
				      window.btoa(orgDivision) + "&userId=" +  window.btoa(userId) + "&logo=" + window.btoa(logo), '_blank');	  

	}
	
	function closeDiv() {
		   $(".formValidation").remove();
		   $("#noticeMaster").hide();
		   $("#headerDiv").show();
		   $('#empSection').show();
		   
		   $('#addPageEmpName').hide();
		   viewData();
		}
	
	function openDiv(noticeId) {

		$(".formValidation").remove();
		   $("#noticeMaster").show();
		   $("#headerDiv").hide();
		   $("#noticeIdSpan").html(noticeId);
		   $("#noticeId").val(noticeId);

		   $(".loader").show();
		   $.ajax({
		      type: "GET",
		      url: "manage-notice-edit-fetch?id=" + noticeId,
		      success: function (response) {
		         if (response.code == "success") {
		        	 $(".loader").hide();
		            var allData = JSON.parse(response.body)
		            selectedData = allData[0];

		            CKEDITOR.instances['noticeContent'].setData(selectedData.noticeContent);
		            $("#noticeSubject").val(selectedData.noticeSubject);
		            $("#noticeReason").val(selectedData.reason);
		            $("#noticeType").val(selectedData.noticeType);
		            $("#publishDate").val(selectedData.publishDate);
		            $("#publishBy").val(selectedData.publishedBy);
		            $("#publishByName").val(selectedData.publishedByName);
		         }
		         $(".loader").hide();
		      }
		   });
		}

	function onSelectionChanged() {

		   var selectedRows = gridOptions.api.getSelectedRows();
		   var rowCount = selectedRows.length; // Get the number of selected rows

		   if (rowCount > 0) {
		      var status = selectedRows[0].type;
		      $('#newNotice').attr("disabled", true); // Disable new notice when rows are selected

		      if (status === "DRAFT") {
		         $('#deleteBtn').attr("disabled", false); // Enable delete button if status is DRAFT
		      } else {
		         $('#deleteBtn').attr("disabled", true); // Disable delete button for other statuses
		      }
		   } else {
		      // When no rows are selected (deselect scenario)
		      $('#newNotice').attr("disabled", false); // Enable new notice
		      $('#deleteBtn').attr("disabled", true);  // Disable delete button
		   }
		}


	function viewData() {
	   $(".loader").show();
	   agGrid.simpleHttpRequest({
	      url: "manage-notice-view-all"
	   }).then(function (data) {
		   $(".loader").hide();
		   
		   if(data.body[0] != null){
	      var allData = JSON.parse(data.body);
	         var len = allData.length;
	         $('#totalReq').find('span').html(len);
	         gridOptions.api.setRowData(allData);
	      } else {
	    	  $(".loader").hide();
	         $('#totalReq').find('span').html("0");
	         gridOptions.api.setRowData([]);
	      }

	      $(".loader").hide();
	   });

	   $('#editNotice').attr("disabled", true);
	   $('#sendMail').attr("disabled", true);
	}

	function getCurrentDate() {
		   let today = new Date();
		   let year = today.getFullYear();
		   let month = String(today.getMonth() + 1).padStart(2, '0'); 
		   let day = String(today.getDate()).padStart(2, '0');

		   return day + '-' + month + '-' + year;
		}
	
	 function generateNotice(){
		$('.loader-modal-autosearch').hide();
		$(".formValidation").remove();
		
		var currDate = getCurrentDate();
		$("#publishDate").val(currDate);
	    $("#noticeSubject").val('');
	    $("#noticeReason").val('');
	    CKEDITOR.instances.noticeContent.setData("");
	    
		$("#noticeMaster").show();
		$("#headerDiv").hide();
		 
		$("#noticeIdSpan").html('');
		$("#noticeId").val('');
		$("#publishBy").val($("#sessionId").val());
		$("#publishByName").val($("#sessionName").val());
		
	 }
	

	function saveAsDraft(type) {
		
	   var obj = {};
	   var allValid = true;

	   var noticeContent = CKEDITOR.instances.noticeContent.getData();
       
	   obj.noticeId = $("#noticeId").val();
	   obj.publishTo = $("#publishTo").html();
	   obj.publishDate = $("#publishDate").val();
	   obj.noticeSubject = $("#noticeSubject").val();
	   obj.noticeDescription = noticeContent;
	   obj.publishBy = $("#publishBy").val();
	   obj.noticeType = type;
	   
	   if (!validationUpdated("Subject Required", 'noticeSubject'))
	      allValid = false;
	   
	   if (noticeContent == null || noticeContent == "") {
		   allValid = validationUpdated("Content Required","commentckdreason");
	   }
	  
	   
	   if (allValid) {
	      saveNotice(obj,type);
	   }
	}

	function saveNotice(data,type) {
	$('.loader-modal').show();
	   $.ajax({
	      type: "POST",
	      url: "manage-notice-master-save",
	      dataType: "json",
	      contentType: "application/json",
	      data: JSON.stringify(data),
	      success: function (response) {
	    	  console.log(response)
	         if (response.code == "success") {
	        	 $('.loader-modal').hide();
	        	 if(type == 'SUBMIT' ){
		        	 $("#messageParagraph").text("Notice Published Successfully");
	        	 }else{
		        	 $("#messageParagraph").text(response.message);	        		 
	        	 }
                 $("#msgOkModal").removeClass("btn3");
                 $("#msgOkModal").addClass("btn1");
                 $("#msgModal").modal('show');
	            $("#noticeMaster").hide();
	            $("#headerDiv").show();
	            $('.loader-modal').hide();
	            $('#addPageEmpName').hide();
	            viewData();
	         } 
	      },
	      error: function (data) {
	         console.log(data)
	      }
	   })
	}

	
	
	function deleteNotice(){
		 var selectedNodes = gridOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		 var noticeId = selectedData[0].noticeId;
		 
		 $.ajax({
		      type: "GET",
		      url: "manage-notice-delete-notice?id=" + noticeId,
		      success: function (response) {
		         if (response.code == "success") {
		        	 
		        	 $(".loader").hide();
		        	 $("#messageParagraph").text(response.message);
		 			 $("#msgOkModal").removeClass("btn3");
		 			 $("#msgOkModal").addClass("btn1");
		 			 $("#msgModal").modal('show');
		        	 $('#newNotice').attr("disabled", false);
		        	 $('#deleteBtn').attr("disabled", true);
		        	 viewData();
		         }else{
		        	 $(".loader").hide();
		        	 $("#messageParagraph").text("Something Went Wrong.");
		 			 $("#msgOkModal").removeClass("btn3");
		 			 $("#msgOkModal").addClass("btn1");
		 			 $("#msgModal").modal('show');
		        	 $('#newNotice').attr("disabled", false);
		        	 $('#deleteBtn').attr("disabled", true);
		        	 viewData();
		         }
		        
		      }
		   });
	}
</script>
</head>

<body>
	<div layout:fragment="content">
		<div class="content-wrap">
			<div class="container-fluid">
				<div class="maincontent">
					<div class="row">

						<div class="maincontentsec">
							<div class="content_padding">
								<div id="headerDiv">
									<div class="d-flex justify-content-between mb-2">
										<div class="btn-hs">
											<div class="font-design" id="totalReq">
												Notice Lists(<span></span>)
											</div>
										</div>
										<input type="hidden" id="sessionId" th:value="${userId}" />
										<input type="hidden" id="sessionName" th:value="${userName}" />
										 <input
											type="hidden" id="sessionOrganization"
											th:value="${organization}" /> <input type="hidden"
											id="sessionOrgDivision" th:value="${orgDivision}" /> <input
											type="hidden" id="baseURL" th:value="${baseURL}" /> <input
											type="hidden" id="sessionLogo" th:value="${logo}" />
										<div id="searchRowDiv">
											<div class="input-style">
												<input type="text" placeholder="Search.." name="search"
													class="searchboxinput" onkeyup="cancelBar()"
													oninput="onQuickFilterChanged()" id="quickFilter"
													autocomplete="off">
												<div class="searchicon">
													<a href="javascript:void(0)"><span
														style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
														id="closeKey"
														onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalReq').find('span').html(gridOptions.api.getModel().getRowCount());"
														class="close_i"><i class="ti-close srchicon"></i></span></a><a
														href="javascript:void(0)"><i
														class="ti-search srchicon"></i></a>
												</div>

											</div>
										</div>
										<div class="buttonsec btn-hs" id="btndiv">

											<button class="approve-btn" id="newNotice"
												onclick="generateNotice()">New</button>
											<button class="delete-btn" id="deleteBtn"
												onclick="deleteNotice()">Delete</button>
										</div>
									</div>
									<div class="row">
										<div id="myGrid" style="width: 100%; height: 550px;"
											class="ag-theme-alpine"></div>

									</div>
								</div>
								<div class="collapse" id="noticeMaster">
									<div class="innerstickybg">
										<div class="row">

											<input type="hidden" id="noticeId">
											<div class="col-md-6 date-class">
												Notice ID: <span id="noticeIdSpan"></span>
											</div>
											<div class="btn-hs col-md-6" align="right">
												<button class="cancel-btn" onclick="closeDiv()">CANCEL</button>
												<button id="save" class="new-btn" onclick="saveAsDraft('DRAFT')">DRAFT</button>
												<button id="save" class="save-btn" onclick="saveAsDraft('SUBMIT')">PUBLISH</button>
											</div>
										</div>
									</div>
									<div class="form-group mt-2 date-class">
										Publish To : <span id="publishTo">ALL</span>
									</div>
									
									<div class="row mt-2">
									<div class="col-md-3 mt-2">
														<div class="form-group calendar_box">
															<label>Publish Date</label> <input type="text"
																id="publishDate" class="form-control"
																onblur="removeValid(event)"
																th:attr="onkeyup=|formatDate('publishDate','${session.DATEFORMAT_JS}')|"
																readonly> <i class="ti-calendar picker_calendar"
																id="dateCalendar"></i>
														</div>
													</div>
								

										<div class="col-md-12 mt-2">
											<div class="form-group">
												<label>Subject</label>
												<textarea id="noticeSubject" class="form-control"
													style="height: 50px;" onblur="removeValid(event)"></textarea>
											</div>
										</div>

										<div class="col-lg-12">
											<div class="form-group1 mt-2">
												<label>Notice Content: </label>
												<textarea id="noticeContent" class="form-control"
													onblur="removeValid(event)"></textarea>
											</div>
											<input type="hidden" id="commentckdreason" onblur="removeValid(event)">
										</div>

										<div class="col-md-6">
														<div class="form-group">
															<label>Publish By ID</label> <input type="text"
																class="form-control transparenttxtbox" id="publishBy"
																readonly>
														</div>
													</div>
													<div class="col-md-6">
														<div class="form-group">
															<label>Publish By Name</label> <input type="text"
																class="form-control transparenttxtbox" id="publishByName"
																readonly>
														</div>
													</div>


								<!-- 	<div class="col-lg-6 mt-4" >
										Publish By ID: <span id=publishBy></span>
									</div>
									
									<div class="col-lg-6 mt-4">
										Publish By Name: <span id="publishByName"></span>
									</div> -->
									</div>
								</div>
								
								
							</div>


						<div class="modal fade show" id="contentModal">
						    <div class="modal-dialog modal-lg" style="margin-top: 130px;">
						        <div class="modal-content">
						            <!-- Modal Header -->
						            <div class="modal-header">
						                <h4 class="modal-title md-color">
						                    <b>Notice Content : <span id="noticeSpanId"></span></b>
						                </h4>
						            </div>
						
						            <!-- Modal Body -->
						            <div class="modal-body-overview modal-cat">
						                <div>
						                        <p><span id="contentSpan"></span></p>
						                </div>
						            </div>
						
						            <!-- Modal Footer -->
						            <div class="modal-footer">
						                <button class="delete-btn" data-dismiss="modal" onclick="cancelModalBtnOverview()">CLOSE</button>
						            </div>
						        </div>
						    </div>
						</div>
						</div>
					</div>
				</div>
			</div>
		</div>


	</div>
</html>
