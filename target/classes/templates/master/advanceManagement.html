function viewAdvance() {
	$("#addAdvance").show()
    var advanceEmployeeId = $("#selectedAdvanceId").val();
    var userid = $("#sessionId").val();
    var userrole = $("#sessionRole").val();
    var roleid = "";
    for (var i = 6; i <= userrole.length; i = i + 6) {
        roleid = roleid + '"' + userrole.slice(i - 6, i) + '",';
    }
    roleid = roleid.substring(0, roleid.length - 1);
    agGrid.simpleHttpRequest({
        url: "advance-disburshment-details-view?userid=" + userid + "&roleid=" + roleid + "&selftype=" + type,
    }).then(function(data) {
        var len = data.length;
        if (len > 0) {
        	gridOptions.api.setRowData(data);
            if (advanceEmployeeId && advanceEmployeeId != "") {
                gridOptions.api.forEachNode(function(node) {
                    if (node.data && node.data.advanceId === advanceEmployeeId) {
                        node.setSelected(true);
                        return;
                    }
                });
            } else {
                gridOptions.api.forEachNode((node, index) => {
                    if (index === 0) {
                        node.setSelected(true);
                    }
                });
            }

        } else {
            var data = [];
            gridOptions.api.setRowData(data);
            rowSelectId();
        }
    })
}

function indianNumberFormatterWithDecimal(params) {
    if (params.value === null || params.value === undefined || isNaN(params.value)) return "0.00";

    const value = parseFloat(params.value).toFixed(2);
    const parts = value.split(".");
    const integerPart = parts[0];
    const decimalPart = parts[1];

    if (integerPart.length <= 3) {
        return integerPart + "." + decimalPart;
    }

    const lastThree = integerPart.substring(integerPart.length - 3);
    const otherNumbers = integerPart.substring(0, integerPart.length - 3);
    const formattedValue =
        (otherNumbers ? otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," : "") + lastThree;

    return formattedValue + "." + decimalPart; 
}

function getEmployeeList() {
    var search = $("#empNameList").val();
    if (search) {
        $.ajax({
            type: "POST",
            url: "advance-disburshment-get-employee-list",
            dataType: 'json',
            contentType: 'application/json',
            data: search,
            success: function(response) {
                $("#suggesstion-box_").empty();
                if (response.message == "success" && response.body.length > 0) {
                    $("#empNameList").css("background", "#FFF");
                    var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;">';
                    response.body.forEach(function(item) {
                        content += `<li class="autocompletedata cp" 
                                        onClick="selectAutocompleteValueItem1('${item.key}', '${window.btoa(item.name)}')">
                                        ${item.key} - ${item.name}
                                    </li>`;
                    });
                    content += '</ul>';
                    $("#suggesstion-box_").show().html(content);
                } else {
                    $("#suggesstion-box_").show().html('<ul><li>No Data Found</li></ul>');
                }
            },
            error: function(data) {
                console.error("Error fetching employee list:", data);
            }
        });
    } else {
        $("#empID").val("");
        $("#empNameList").val("");
        $("#suggesstion-box_").hide();
    }
}

function selectAutocompleteValueItem1(empid, empName) {
    if (empid) {
        $("#empNameList").val(window.atob(empName));
        $("#empID").val(empid);
        $("#empNameList").attr('data-procat', empid);
        $("#suggesstion-box_").hide();
    } else {
        $("#empID").val("");
        $("#empNameList").val("");
        $("#empNameList").attr('data-procat', "");
        $("#suggesstion-box_").hide();

    }
}

function changeDateFormat(inputDate) { 
    var splitDate = inputDate.split('-');
    if (splitDate.count == 0) {
        return null;
    }
    var year = splitDate[0];
    var month = splitDate[1];
    var day = splitDate[2];

    return day + '-' + month + '-' + year;
}

function editAdvanceDetails(advanceId, empId, sts) {

    disableAllFields();
    var sempid = empId;

    if (advanceId) {
        $('.loader').show();
        $.ajax({
            type: "GET",
            url: "advance-disburshment-details-edit?id=" + advanceId,
            async: false,
            success: function(response) {
                if (response.code == "success") {
                    $("#empNameList").val(response.body.empName);
                    $("#empID").val(response.body.empID);
                    $("#advanceId").val(response.body.advanceId);
                    $("#ternure").val(response.body.ternure);
                    $("#intrestRate").val(response.body.intrestRate);
                    $("#loanamt").val(response.body.loanamt);
                    $("#advApplyDate").val(response.body.advanceApplyDate);
                    $("#advApplyDateCalendar").val(response.body.advanceApplyDate);
                    $("#reason").val(response.body.reason.replace(/-#/g, "'").replace(/-\$/g, '"'));

                    if (response.body.monthMain != null && response.body.yearMain != null) {
                        $("#yearMain").val(response.body.yearMain);
                        $("#monthMain").val(response.body.monthMain);
                    }
                }
            }
        });
        $('.loader').hide();
    }
}

function disableEmiDateValidation() {
    let advanceApplyDate = $("#advApplyDate").val();
    let selectedYear = $("#yearMain").val();
    let emiDetailsYear = $("#emiYear1").val();

    let currentEmiMonth = advanceApplyDate.split('-')[1];

    if (selectedYear == emiDetailsYear) {
        $("#monthList1 option").each(function() {
            let monthValue = parseInt($(this).val());
            if (monthValue < currentEmiMonth) {
                $(this).prop("disabled", true); 
            } else {
                $(this).prop("disabled", false);
            }
        });
    }

}

function disablePastMonths() {
    let currentAdvanceYear = new Date().getFullYear();
    let currentAdvanceMonth = new Date().getMonth() + 1;

            }

}

var empid = "";
var empname = "";
function approveAdvance() {
    var selectedRows = gridOptions.api.getSelectedRows();
    var advanceId = selectedRows[0].advanceId;
    var userrole = $("#sessionRole").val();
    var roleid = "";
    for (var i = 6; i <= userrole.length; i = i + 6) {
        roleid = roleid + '"' + userrole.slice(i - 6, i) + '",';
    }
    roleid = roleid.substring(0, roleid.length - 1);
    empid = $("#sessionId").val();

    $.ajax({
        type: "GET",
        url: "advance-disburshment-details-approve?approveId=" + advId + "&name=" + empid + "&roleid=" + roleid,
        async: false,
        success: function(response) {

            if (response.message == "Success") {
                toastr.success('Advance approved successfully');
                
                agGrid.simpleHttpRequest({
                    url: "advance-disburshment-details-view?userid=" + empid + "&roleid=" + roleid + "&selftype=" + type,
                }).then(function(data) {
                    gridOptions.api.setRowData(data);

                    gridOptions.api.forEachNode(function(node) {
                        if (node.data.advanceId === advanceId) {
                            node.setSelected(true);
                        }
                    });
                    var len = data.length;
                    $('#totalReq').find('span').html(len);
                    nextTab('advanceCreation-tab');
                });

            } else {
                toastr.error('You are already approved!');
            }

        },
        error: function(data) {}
    });
}

function finalApprove() {
    var selectedRows = gridOptions.api.getSelectedRows();
    var advanceId = selectedRows[0].advanceId;
    var empID = selectedRows[0].empID;

    var obj = {};
    obj.advanceId = advanceId;
    obj.empID = empID;
    obj.ternure = $("#tenureMonth").val();
    obj.intrestRate = $("#rateOfInterest").val();
    obj.loanamt = $("#advanceAmount").val();
    obj.emi = $("#emiAmount").val();
    obj.totalInterest = $("#totalInterest").val();
    obj.year = $("#emiYear1").val();
    obj.month = $("#monthList1").val();

    $.ajax({
        type: "POST",
        url: "advance-disburshment-process-approve",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(obj),
        success: function(response) {
            if (response.message === "Success") {
                toastr.success('Approved successfully');

                var userid = $("#sessionId").val();
                var userrole = $("#sessionRole").val();
                var roleid = "";
                for (var i = 6; i <= userrole.length; i = i + 6) {
                    roleid = roleid + '"' + userrole.slice(i - 6, i) + '",';
                }
                roleid = roleid.substring(0, roleid.length - 1);
                agGrid.simpleHttpRequest({
                    url: "advance-disburshment-details-view?userid=" + userid + "&roleid=" + roleid + "&selftype=" + type,
                }).then(function(data) {
                    gridOptions.api.setRowData(data);

                    gridOptions.api.forEachNode(function(node) {
                        if (node.data.advanceId === advanceId) {
                            node.setSelected(true);
                        }
                    });
                    var len = data.length;
                    $('#totalReq').find('span').html(len);
                });

                agGrid.simpleHttpRequest({
                    url: "advance-disburshment-process-view?advanceId=" + advanceId,
                }).then(function(data) {
                    console.log("datatata", data);
                    $("#tenureMonth").val(data[0].ternure);

                    $("#rateOfInterest").val(data[0].intrestRate ? data[0].intrestRate : 0);
                    $("#advanceAmount").val(data[0].loanamt);
                    $("#emiAmount").val(data[0].emi);
                    $("#totalInterest").val(data[0].totalInterest);
                    $("#processStatus").val(data[0].processStatus === '0' ? "Pending" : "Confirmed");
                });
            } else {
                toastr.error('Already approved');

                agGrid.simpleHttpRequest({
                    url: "advance-disburshment-process-view?advanceId=" + advanceId,
                }).then(function(data) {
                    console.log("datatata", data);
                    $("#tenureMonth").val(data[0].ternure);

                    $("#rateOfInterest").val(data[0].intrestRate ? data[0].intrestRate : 0);
                    $("#advanceAmount").val(data[0].loanamt);
                    $("#emiAmount").val(data[0].emi);
                    $("#totalInterest").val(data[0].totalInterest);
                    $("#processStatus").val(data[0].processStatus === '0' ? "Pending" : "Confirmed");
                });
            }
        },
        error: function(response) {
            console.log(response);
        },
    });
}

function addDetails() {
    obj = {};
    obj.advanceId = $("#advanceId").val();
    obj.reqPolicyId = $("#reqPolicyId").val();
    var adRole = $("#adRole").val();
    obj.empID = $("#empID").val();

    obj.ternure = $("#ternure").val();
    obj.intrestRate = $("#intrestRate").val();
    obj.loanamt = $("#loanamt").val();
    obj.reason = $("#reason").val().replace(/'/g, "-#").replace(/"/g, "-$");

    obj.advanceApplyDate = $("#advApplyDate").val();

    obj.yearMain = $("#yearMain").val();
    obj.monthMain = $("#monthMain").val();

    var validation = true;
    if (obj.empID == null || obj.empID == "") {
        toastr.error('Please select employee name.');
        return;
    }

    if (obj.ternure == null || obj.ternure == "") {
        toastr.error('Tenure required');
        return;
    }
    if (obj.loanamt == null || obj.loanamt == "") {
        toastr.error('Loan amount required');
        return;
    }
    if (obj.reason == null || obj.reason == "") {
        toastr.error('Reason required');
        return;
    }

    if (validation) {
        $('.loader').show();
        $('body').addClass('overlay');
        $.ajax({
            type: "POST",
            url: "advance-disburshment-details-save",
            contentType: "application/json",
            data: JSON.stringify(obj),
            success: function(response) {
                if (response.code == "success") {
                    toastr.success(response.message);
                    viewAdvance();
                    $('.loader').hide();
                    $('body').removeClass('overlay');
                } else {
                    toastr.error('Something went to wrong');
                    $('.loader').hide();
                    $('body').removeClass('overlay');
                }
            },
            error: function(data) {
                console.log(data)
                $('.loader').hide();
                $('body').removeClass('overlay');
            }
        })
    }
}

function checkFieldValue(id) {
    var inputValue = $('#' + id).val();
    var convertedValue = inputValue.replace(/-/g, '');
    const regex = /^\d+(\.\d{0,2})?$/;
    if (!regex.test(convertedValue)) {
        $('#' + id).val(convertedValue.slice(0, -1));
    }
    $('#' + id).val(convertedValue);
}

function checkTenure(id) {
    var inputValue = $('#' + id).val();
    var numericValue = parseInt(inputValue, 10);

    if (numericValue > 24) {
        toastr.error('Maximum tenure value exceeding. less than or equal to 24 months.');
        $('#' + id).val(24); 
    }
}

function validateNumericInput(fieldId, min, max) {
    let value = $("#" + fieldId).val();
    let regex = /^[0-9]+$/;

    if (value != "") {
        if (!regex.test(value)) {
            toastr.error('Only numbers are allowed.');
            $("#" + fieldId).val(value.replace(/[^0-9]/g, ""));
        }
    }
}


function enterKeyToGo(event) {
    if (event.key === "Enter" || event.keyCode === 13) {
        onQuickFilterChanged()
    }
}

function checkAmount(fieldId) {
    var tempVal = $("#" + fieldId).val().replace(/[^0-9 ]/g, '');
    var val = parseInt(tempVal);
    if (val >= 100) {
        $("#" + fieldId).val(val);

    } else {
        toastr.error('Please add more than Rs.100 in amount field');
        $("#" + fieldId).val(null);

    }
}

function space(str) {
    return str === null || str.match(/^ *$/) !== null;
    toastr.error("empty or has blank spaces");
    $("#" + fieldId).val(null);
}

function checkAlphabet(fieldId) {
    var tempVal = $("#" + fieldId).val().replace(/[^a-zA-Z. ]/g, '');
    $("#" + fieldId).val(tempVal);
}

function check(fieldId) {
    var tempVal = $("#" + fieldId).val().replace(/[^0-9 ]/g, '');
    $("#" + fieldId).val(tempVal);
}
</script>
