	function onSelectionChangedState() {

			var status = selectedRows[0].status;

			$('#newItem').attr("disabled", false);
		}
	}

	                    }

	 function populateYearDropdown(selectElement, currentYear, numberOfYears) {
         for (var i = numberOfYears - 1; i > 0; i--) {
             var futureYearOption = document.createElement("option");
             futureYearOption.text = currentYear + i;
             futureYearOption.value = currentYear + i;
             selectElement.add(futureYearOption);
         }
         for (var i = 0; i <= numberOfYears; i++) {
             var pastYearOption = document.createElement("option");
             pastYearOption.text = currentYear - i;
             pastYearOption.value = currentYear - i;
             selectElement.add(pastYearOption);
         }
     }

	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];
		return day + '-' + month + '-' + year;
	}

	function checkNumeric(id) {
	    var textField = document.getElementById(id);
	    var value = textField.value;

	    // Allow only digits and dots, remove any other characters
	    value = value.replace(/[^0-9.]/g, '');

	    // Split the value by dot to handle the rule of only one dot and four numeric characters
	    var parts = value.split('.');

	    if (parts.length > 2) {
	        // More than one dot found, remove the extra dots
	        value = parts[0] + '.' + parts[1].slice(0, 4);
	    } else if (parts.length === 2) {
	        // If there is a dot, allow only up to four digits before and after the dot
	        parts[0] = parts[0].slice(0, 4); // Limit the number of digits before the dot
	        parts[1] = parts[1].slice(0, 4); // Limit the number of digits after the dot
	        value = parts.join('.');
	    } else {
	        // No dot found, allow only up to four digits
	        value = value.slice(0, 4);
	    }

	    $("#" + id).val(value);
	}
	
	function downloadELDetails() {
		var rowCount = 0;
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
		    if (rowNode.data.empId) {
		        rowCount++;
		    }
		});
		if (rowCount > 0) {
		 	  var name = "Employee Off Days Details- " + $("#year1").val();// Name of the CSV file
		    var allColumns = gridOptions.columnApi.getAllColumns();

		    allColumns.forEach(col => {
		        if (col.getColDef().headerName) {
		            col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
		        }
		    });

		    var visibleColumns = allColumns.filter(col => {
		        const headerName = col.getColDef().headerName;
		        const isColumnVisible = !col.getColDef().hide;
		        return headerName !== undefined && headerName !== null && isColumnVisible;
		    });

		    var visibleColumnIds = visibleColumns.map(col => col.getColId());

		    const params = {
		        skipHeader: false,
		        columnGroups: false,
		        skipFooters: false,
		        skipGroups: false,
		        skipPinnedTop: false,
		        skipPinnedBottom: false,
		        allColumns: true,
		        onlySelected: false,
		        suppressQuotes: false,
		        fileName: name + '.csv',
		        sheetName: 'Sheet1',
		        customHeader: null,
		        customFooter: null,
		        columnKeys: visibleColumnIds
		    };
		    gridOptions.api.exportDataAsCsv(params);
		} else {
		    $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
		    $("#msgOkModal").removeClass("btn3");
		    $("#msgOkModal").addClass("btn1");
		    $("#msgModal").modal('show');
		}
 	}
