function utf8ToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str); // Encode to UTF-8 bytes
    const base64String = btoa(String.fromCharCode(...utf8Bytes)); // Convert to Latin1, then to base64
    return base64String;
}
function base64ToUtf8(base64Str) {
    const binaryString = atob(base64Str);
    const utf8Bytes = Uint8Array.from(binaryString, char => char.charCodeAt(0));
    const decodedString = new TextDecoder().decode(utf8Bytes);
    return decodedString;
}

	function getCurrentDate() {
	   let today = new Date();
	   let year = today.getFullYear();
	   let month = String(today.getMonth() + 1).padStart(2, '0'); 
	   let day = String(today.getDate()).padStart(2, '0');

	   return day + '-' + month + '-' + year;
	}

	/* 
	Email Validation functions
	 */
	
 function validateEmailsCC(data) {
	    var emails = data.split(',');
	    var validEmails = [];
	    var invalidEmails = [];
	    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

	    for (var i = 0; i < emails.length; i++) {
	        var email = emails[i].trim();
	        if (emailPattern.test(email)) {
	            validEmails.push(email);
	        } else if (email !== "") {
	            invalidEmails.push(email);
	        }
	    }

	    if (invalidEmails.length > 0) {
	       $("#empCc").val('');
	       $("#messageParagraph").text("Invalid email(s): " + invalidEmails.join(", "));
           $("#msgOkModal").removeClass("btn3");
           $("#msgOkModal").addClass("btn1");
           $("#msgModal").modal('show');
           return false;
	    }else{
	    	return true;
	    }
	}
 
 function validateEmailsTO(data) {
	    var emails = data.split(',');
	    var validEmails = [];
	    var invalidEmails = [];
	    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

	    for (var i = 0; i < emails.length; i++) {
	        var email = emails[i].trim();
	        if (emailPattern.test(email)) {
	            validEmails.push(email);
	        } else if (email !== "") {
	            invalidEmails.push(email);
	        }
	    }

	    if (invalidEmails.length > 0) {
	       $("#messageParagraph").text("Invalid email(s): " + invalidEmails.join(", "));
	       $("#empMails").val('');
           $("#msgOkModal").removeClass("btn3");
           $("#msgOkModal").addClass("btn1");
           $("#msgModal").modal('show');
           return false;
	    }else{
	    	return true;
	    }
	}

						/* $('.loader').hide(); */
						
	});

	// Initialize Lightbox
	lightbox.option({
	    'resizeDuration': 200,
	    'wrapAround': true
	});
	
	function sendNoticeOffline(){
		 var selectedNodes = gridOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		 var noticeId = selectedData[0].noticeId;
		 
		 $.ajax({
		      type: "GET",
		      url: "manage-letter-offline-notice?id=" + noticeId,
		      success: function (response) {
		         if (response.code == "success") {
		        	 $(".loader").hide();
		        	 $("#messageParagraph").text("Status Updated Successfully.");
		 			 $("#msgOkModal").removeClass("btn3");
		 			 $("#msgOkModal").addClass("btn1");
		 			 $("#msgModal").modal('show');
		        	 $('#sendOffline-btn').attr("disabled", true);
		        	 $('#newNotice').attr("disabled", false);
		        	 $('#deleteBtn').attr("disabled", true);
		        	 viewData();
		        	// location.reload();
		         }else{
		        	 $(".loader").hide();
		        	 $("#messageParagraph").text("Something Went Wrong.");
		 			 $("#msgOkModal").removeClass("btn3");
		 			 $("#msgOkModal").addClass("btn1");
		 			 $("#msgModal").modal('show');
		        	 $('#sendOffline-btn').attr("disabled", true);
		        	 $('#newNotice').attr("disabled", false);
		        	 $('#deleteBtn').attr("disabled", true);
		        	 viewData();
		         }
		        
		      }
		   });
	}
	
	
	function deleteNotice(){
		 var selectedNodes = gridOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		 var noticeId = selectedData[0].noticeId;
		 
		 $.ajax({
		      type: "GET",
		      url: "manage-letter-delete-letter?id=" + noticeId,
		      success: function (response) {
		         if (response.code == "success") {
		        	 $(".loader").hide();
		        	 $("#messageParagraph").text(response.message);
		 			 $("#msgOkModal").removeClass("btn3");
		 			 $("#msgOkModal").addClass("btn1");
		 			 $("#msgModal").modal('show');
		        	 $('#sendOffline-btn').attr("disabled", true);
		        	 $('#newNotice').attr("disabled", false);
		        	 $('#deleteBtn').attr("disabled", true);
		        	 viewData();
		         }else{
		        	 $(".loader").hide();
		        	 $("#messageParagraph").text("Something Went Wrong.");
		 			 $("#msgOkModal").removeClass("btn3");
		 			 $("#msgOkModal").addClass("btn1");
		 			 $("#msgModal").modal('show');
		        	 $('#sendOffline-btn').attr("disabled", true);
		        	 $('#newNotice').attr("disabled", false);
		        	 $('#deleteBtn').attr("disabled", true);
		        	 viewData();
		         }
		        
		      }
		   });
	}
</script>
