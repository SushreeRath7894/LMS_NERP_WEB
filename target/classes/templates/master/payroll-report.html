function setCurrFinYear(){
	var curDate = new Date();
    var curYear = curDate.getFullYear();
    var financialYearStart = curYear;
    var financialYearEnd = curYear + 1;

    // Check if the current month is April or later
    if (curDate.getMonth() < 3) {
        financialYearStart -= 1; // If the current month is before April, start year is last year
        financialYearEnd -= 1; // If the current month is before April, end year is this year
    }

    // Set the financial year value dynamically
    var financialYear = financialYearStart + '-' + financialYearEnd;
    $("#attndyear").val(financialYear);

    // Set the default month and year values
    getCurrentDateMonthYear();
}

function generateFinancialYearMonths(financialYear, selectedYear, selectedMonth) {
    const financialYearMonths = [];
    let startMonthIndex, endMonthIndex;

    // Set the start and end months for the financial year
    if (selectedYear === financialYear.startYear) {
        startMonthIndex = financialYear.startMonth;
    } else {
        startMonthIndex = 4; // April
    }

    if (selectedYear === financialYear.endYear) {
        endMonthIndex = 3 + selectedMonth; // Limit months up to the selected month
    } else {
        endMonthIndex = 3; // March
    }

    // If "All" is selected
    if (selectedMonth === 0) {
        if (selectedYear === new Date().getFullYear()) {
            // If it's the current financial year, display months up to the current month
            startMonthIndex = 4; // April
            endMonthIndex = new Date().getMonth() + 1; // Update end month to current month
        } else if (selectedYear === financialYear.endYear) {
            // If it's the end year of the financial year, display all months up to March
            startMonthIndex = 4; // April
            endMonthIndex = 3; // March
        } else {
            // For previous financial years, display all months from April to March
            startMonthIndex = 4; // April
            endMonthIndex = 15; // March of the next year
        }
    } else {
        // If a specific month is selected, only display that month
        startMonthIndex = selectedMonth;
        endMonthIndex = selectedMonth;
    }

    // Generate months from start to end index
    for (let i = startMonthIndex; i <= endMonthIndex; i++) {
        let monthIndex = i > 12 ? i - 12 : i; // Handle rollover to the next year
        if (monthIndex === 0) {
            monthIndex = 12; // Change January (0) to December (12)
        }
        financialYearMonths.push({
            name: monthNames[monthIndex - 1],
            days: new Date(selectedYear, monthIndex, 0).getDate(),
            monthIndex: monthIndex
        });
    }

    return financialYearMonths;
}

function generateYearMonths(selectedYear, selectedMonth) {
    const calendarYearMonths = [];
    let startMonthIndex, endMonthIndex;

    // If "All" is selected
    if (selectedMonth === 0) {
    	if (selectedYear === new Date().getFullYear()) {
            // If it's the current financial year, display months up to the current month
            startMonthIndex = 1; // April
            endMonthIndex = new Date().getMonth() + 1; // Update end month to current month
        }else {

            startMonthIndex = 1; // January
            endMonthIndex = 12;
        } // December
    } else {
        // If a specific month is selected, only display that month
        startMonthIndex = selectedMonth;
        endMonthIndex = selectedMonth;
    }

    // Generate months from start to end index
    for (let i = startMonthIndex; i <= endMonthIndex; i++) {
        calendarYearMonths.push({
            name: monthNames[i - 1],
            days: new Date(selectedYear, i, 0).getDate(),
            monthIndex: i
        });
    }

    return calendarYearMonths;
}


function formatDate(date) {
    // Format date as DD-MM-YYYY
    var day = date.getDate();
    var month = date.getMonth() + 1; // Months are zero-indexed
    var year = date.getFullYear();

    return (day < 10 ? '0' : '') + day + '-' + (month < 10 ? '0' : '') + month + '-' + year;
}

function getFinancialYear(selectedYear) {
    // Calculate financial year based on the selected year
    var startYear = selectedYear;
    var endYear = startYear + 1;
    var financialYear = startYear + "-" + endYear;
    return { startYear: startYear, endYear: endYear, financialYear: financialYear };
}

	function downloadApproveCSV() {
		var rowCount = 0;
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
		    if (rowNode.data.empId) {
		        rowCount++;
		    }
		});
		if (rowCount > 0) {
		    var name = "Salary Process-" + $("#attndmonth option:selected").text();
		    var allColumns = gridOptions.columnApi.getAllColumns();

		    allColumns.forEach(col => {
		        if (col.getColDef().headerName) {
		            col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
		        }
		    });

		    var visibleColumns = allColumns.filter(col => {
		        const headerName = col.getColDef().headerName;
		        const isColumnVisible = !col.getColDef().hide;
		        return headerName !== undefined && headerName !== null && isColumnVisible;
		    });

		    var visibleColumnIds = visibleColumns.map(col => col.getColId());

		    const params = {
		        skipHeader: false,
		        columnGroups: false,
		        skipFooters: false,
		        skipGroups: false,
		        skipPinnedTop: false,
		        skipPinnedBottom: false,
		        allColumns: true,
		        onlySelected: false,
		        suppressQuotes: false,
		        fileName: name + '.csv',
		        sheetName: 'Sheet1',
		        customHeader: null,
		        customFooter: null,
		        columnKeys: visibleColumnIds
		    };
		    gridOptions.api.exportDataAsCsv(params);
		} else {
		    $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
		    $("#msgOkModal").removeClass("btn3");
		    $("#msgOkModal").addClass("btn1");
		    $("#msgModal").modal('show');
		}
	}
