<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="../css/hrms/attendance.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
	<script type="text/javascript" src="../javaScript/hrms/attendance.js"></script>
	<style>
		.font-design {
			text-transform: initial;
			font-weight: 600;
		}
		/*.picker_calendar{right: 8%;}*/
		.wd-30{width: 30%;}
		.wd-70{width: 70%;}
	</style>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">

					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Starts here-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex flex-column h-100">
										<div class="d-flex justify-content-between bdr-line p-2 w-100">
											<input type="hidden" id="sessionId" th:value="${session.USER_ID}">
											<div class="d-flex justify-content-end w-100">
												<button class="btn btn-primary max-btn"
													id="collapseButtonR1" onclick="triggerExpansionR(1)"
													data-bs-toggle="tooltip" data-bs-placement="top"
													title="Expand">
													<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
														class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
												</button>
											</div>
										</div>

										<div class="d-flex w-100 p-2">
											<div class="d-flex gap-2 w-100 justify-content-end p-2 border rounded">
												<button class="btn btn-primary go-btn"
													onclick="getAllEmployeeAttendance()" id="goBtn"
													type="button">Go</button>
												<button class="btn go-btn w-auto" type="button"
													id="resetBtn" onclick="reset()">Reset</button>
											</div>
										</div>
										<div class="card p-2 m-2 mt-0">
											<div class="col">
												<div class="row row-cols-1 g-3">
													<div class="col">
														<div class="row row-cols-1 g-3">
															<div class="col-auto align-content-center">
																<div class="font-design">Search by:</div>
															</div>
															<div class="col">
																<div class="row row-cols g-4">
																	<div class="col-md-6">
																		<div class="d-flex align-items-center">
																			<label class="wd-30">From Date:</label>
																			<div class="position-relative wd-70">
																				<input type="text" id="fromDate" class="form-control"
																					onblur="removeValid(event)"
																					th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|"
																					readonly> <i
																					class="ti-calendar picker_calendar" id="dateCalendar"></i>
																			</div>
																		</div>

																	</div>
																	<div class="col-md-6">
																		<div class="d-flex align-items-center">
																			<label class="wd-30">To Date:</label>
																			<div class="position-relative wd-70">
																				<input type="text" id="toDate" class="form-control"
																			onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('toDate','${session.DATEFORMAT_JS}')|"
																			readonly> <i
																			class="ti-calendar picker_calendar"
																			id="dateCalendar1"></i>
																			</div>
																		</div>

																	</div>
																</div>

															</div>
														</div>
													</div>
													<div class="col">
														<div class="row row-cols-1 g-3">
															<div class="col-auto align-content-center">
																<div class="font-design">Search for an employee:</div>
															</div>
															<div class="col">
																<div class="col-md-12">
																	<div class="form-group">
																		<select id="empName" class="searchable-select">
																			<option value="">Select</option>
																			<option th:each="c,iter:${emplist}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>
															</div>


														</div>
													</div>
												</div>
											</div>

										</div>
									</div>
								</div>
							</div>
							<div id="snackbar" class="snackbar"></div>
							<!--Left Sec Ends here-->
							<!--Right Sec starts here-->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div class="d-flex justify-content-between align-items-center bdr-line p-2">
										<div class="d-flex gap-2">
											<ul class="nav nav-pills newtab" role="tablist" id="tabMenu">
												<li class="nav-item" role="presentation" id="leaveDetails-tab"><a
														class="nav-link active" data-bs-toggle="pill"
														href="#attendanceTabPane" aria-selected="true">Attendance</a>
												</li>
											</ul>
										</div>
										<button class="btn btn-primary max-btn" id="collapseButtonL1" type="button"
											onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>
									</div>
									<div class="tab-content flex-fill " id="tabContent">
										<div class="tab-pane fade show active h-100 p-2" id="attendanceTabPane" role="tabpanel">
											<div class="d-flex flex-column gap-2 h-100">
												<div class="d-flex border rounded p-2">
													<div class="d-flex gap-2 w-100 justify-content-end">
                            <button class="btn go-btn" id="punchInBtn" onclick="punchInOutUser('PI')">Punch In</button>
                            <button class="btn go-btn" id="punchOutBtn" onclick="punchInOutUser('PO')">Punch Out</button>
                            <button class="btn go-btn" id="download" onclick="downloadExcelFromGrid()"><i class="fa-solid fa-download"></i></button>
														<!--<div class="excelButton">
															<button class="btn go-btn" id="punchInBtn" onclick="punchInOutUser('PI')">
															    Punch In
															</button>
															<button class="btn go-btn" id="punchOutBtn" onclick="punchInOutUser('PO')">
															    Punch Out
															</button>
														</div>
														<div class="excelButton">
															<button class="btn go-btn" id="download" onclick="downloadExcelFromGrid()">
															    <i class="fa-solid fa-download"></i>
															</button>
														</div>-->
													</div>


												</div>
												<div class="card p-2">
													<div id="myGridAttendance"
														style="width: 100%; height: 100vh;"
														class="ag-theme-alpine"></div>

													<div id="assignAttendanceForm" style="display: none">
														<table class="table table-bordered mb-0" width="100%">
															<tbody>
																<tr valign="middle">
																	<td width="80%"></td>
																	<td>
																		<div class="d-flex justify-content-end"
																			id="buttonsDiv">
																			<div class="mr-2">
																				<button class="btn btn-primary edit-btn"
																					type="button" id="saveAssign"
																					onclick="saveAttendanceData()">Save</button>
																			</div>
																			<div class="mr-0">
																				<button class="btn btn-primary edit-btn"
																					type="button" id="cancelAssign"
																					onclick="cancelAssign()">Cancel</button>
																			</div>
																		</div>
																	</td>
																</tr>
															</tbody>
														</table>
														<form id="">
															<div class="row">
															<input type="hidden" id="rowIndexGrid">
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Employee ID</label><input type="text"
																			id="empId" class="form-control" readonly>
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Employee Name</label><input type="text"
																			id="empName1" class="form-control" readonly>
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Date</label><input type="text"
																			id="date" class="form-control" readonly>
																	</div>
																</div>
																<div class="col-md-4" style="display:none">
																	<div class="form-group">
																		<label>Shift</label><input type="text"
																			id="shift" class="form-control" readonly>
																	</div>
																</div>
																<div class="col-md-6" id="entryT">
																	<div class="form-group calendar_box">
																		<label>Punch In Time<span class="mandatory">*</span></label>
																		<input type="text" id="time" class="form-control"
																			onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('time','${session.DATEFORMAT_JS}')|"
																			readonly> <i class="ti-time picker_calendar" style="margin-top: 30px;"
																			id="toDateCalendarTime"></i>
																	</div>
																</div>
																<div class="col-md-6" id="entryT">
																	<div class="form-group calendar_box">
																		<label>Punch Out Time<span class="mandatory">*</span></label>
																		<input type="text" id="punchOutTime" class="form-control"
																			onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('outTime','${session.DATEFORMAT_JS}')|"
																			readonly> <i class="ti-time picker_calendar" style="margin-top: 30px;"
																			id="punchOutCalendarTime"></i>
																	</div>
																</div>
																
															</div>
														</form>

													</div>
												</div>

											</div>

										</div>
									</div>
								</div>
							</div>
							<!--Right Sec ends here-->
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	</div>
	</div>
</body>
</html>
