function getCurrentDateMonthYear() {
    var curDate = new Date();
    var selectedYear = $("#attndyear").val();
    var selectedMonth = $("#attndmonth").val();
    var startDay = $("#startDayForAtten").val();
    
    if (!selectedYear) {
        selectedYear = curDate.getFullYear();
    }
    selectedYear = selectedYear.split("-")[0];

    var fromDate, toDate;

    if (selectedMonth === "0") {
        fromDate = "01-04-" + selectedYear;
        toDate = "31-03-" + (parseInt(selectedYear) + 1);
    } else {
        var month = parseInt(selectedMonth);
        if (startDay > 1 && curDate.getDate() > startDay) {
            month = curDate.getMonth() + 1;
        }
        fromDate = startDay + "-" + String(month).padStart(2, '0') + "-" + selectedYear;
        toDate = startDay + "-" + String(month + 1).padStart(2, '0') + "-" + selectedYear;
    }
    $("#fromDate").val(fromDate);
    $("#fromDateCalendar").val(fromDate);
    $("#endDate").val(toDate);
    $("#endDateCalendar").val(toDate);
}

function createMonthColsAdv() {
	var selectedFinancialYear = $("#attndyear").val(); // Example selected year
	// Split the financial year to get the start and end years
	var [startYear, endYear] = selectedFinancialYear.split('-').map(Number);
	// Define the months in order
	var months = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];
	// Generate the column definitions dynamically
	var monthColumns = months.map((month, index) => {
		// Calculate the correct year for each month
		var year = index <= 9 ? startYear : endYear; // Apr to Dec use startYear, Jan to Mar use endYear
		return {
			headerName: `${month}-${year.toString().slice(-2)}`, // Format "mon-yr"
			field: `${month.toLowerCase()}_adv`, // Assumes fields like 'apr_adv', 'may_adv', etc.
			width: 85,
		};
	});
	return monthColumns;
}
function createMonthColsRec() {
    var monthColumns = [];
    var selectedFinancialYear = $("#attndyear").val(); // Example selected year
    var curDate = new Date();
    var curMonth = curDate.getMonth(); // Get current month (0 = Jan, 11 = Dec)
    var curYear = curDate.getFullYear();
    var selectedMonth=$("#attndmonth").val();
    var selectedMonth1=$("#attndmonth").text();
    // Extract the start year and end year from the selected financial year
    var [startYear, endYear] = selectedFinancialYear.split('-').map(Number);

    // Define the months in order finance
    var months = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];
    // Define the months in order regular
    var months1 = [ "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    // Determine if the selected financial year is the current financial year
    var isCurrentFinancialYear = (curYear === startYear && curMonth >= 3) || (curYear === endYear && curMonth < 3);


    if (selectedMonth > 0) {
        // If a specific month is selected, return only that month's column
        var monthIndex = selectedMonth - 1; // Adjust for zero-based index
        var monthName = months1[monthIndex];
        var year = (selectedMonth >= 4 && selectedMonth <= 12) ? startYear : endYear; // Apr to Dec use startYear, Jan to Mar use endYear

        monthColumns = [
            {
                headerName: `${monthName}-${year.toString().slice(-2)}`, // Format "mon-yr"
                field: `${monthName.toLowerCase()}_rec`, // Assumes fields like 'apr_rec', 'may_rec', etc.
                width: 85,
            }
        ];
    } else if (isCurrentFinancialYear) {
    	monthColumns = [];
        // If the selected financial year is the current year, limit columns to the current month
        var monthLimit;
        if (curMonth >= 3) {
            // Current month is April or later
            monthLimit = curMonth - 3; // Adjust to match index of the months array (Apr = 0)
        } else {
            // Current month is Jan, Feb, or Mar
            monthLimit = 9 + curMonth; // Adjust to include Jan, Feb, Mar in the next financial year
        }

        // Generate columns up to the current month
        monthColumns = months.slice(0, monthLimit + 1).map((month, index) => {
            var year = index <= 9 ? startYear : endYear; // Apr to Dec use startYear, Jan to Mar use endYear
            return {
                headerName: `${month}-${year.toString().slice(-2)}`, // Format "mon-yr"
                field: `${month.toLowerCase()}_rec`, // Assumes fields like 'apr_rec', 'may_rec', etc.
                width: 85,
            };
        });
    }else {
    	monthColumns = [];
        // If the selected financial year is a past year, generate columns for all 12 months
        monthColumns = months.map((month, index) => {
            var year = index >= 9 ? startYear : endYear; // Apr to Dec use startYear, Jan to Mar use endYear
            return {
                headerName: `${month}-${year.toString().slice(-2)}`, // Format "mon-yr"
                field: `${month.toLowerCase()}_rec`, // Assumes fields like 'apr_rec', 'may_rec', etc.
                width: 85,
            };
        });
    }

    return monthColumns;
}

function changeMonthYear() {
    var selectedYear = parseInt($("#attndyear").val());
    var month = parseInt($("#attndmonth").val());
    var sday = parseInt($("#startDayForAtten").val());

    if (month === 0) { // If "All" is selected
        // Set start date to April 1st of the selected financial year
        var fromDate = new Date(selectedYear, 3 - 1, 1); // Set to April 1st

        // Adjust the "To" date to March 31st of the next year
        var toDate = new Date(selectedYear + 1, 3 - 1, 31); // Set to March 31st of the next year
        $("#fromDate").val(formatDate(fromDate));
        $("#fromDateCalendar").val(formatDate(fromDate));
        $("#endDate").val(formatDate(toDate));
        $("#endDateCalendar").val(formatDate(toDate));
        getCurrentDateMonthYear();
    } else {
        var fromDate, toDate;

        if (month >= 4) {
            fromDate = new Date(selectedYear, month - 1, 1);
            toDate = new Date(selectedYear, month, 0); 
        }else if (month <= 3) {
            fromDate = new Date(selectedYear+1, month - 1, 1);
            toDate = new Date(selectedYear+1, month, 0);
        }

        $("#fromDate").val(formatDate(fromDate));
        $("#fromDateCalendar").val(formatDate(fromDate));
        $("#endDate").val(formatDate(toDate));
        $("#endDateCalendar").val(formatDate(toDate));
       
    }
    updateGridColumns(selectedYear, month);
    ShowGridforSalary();
    
}
function formatDate(date) {
    // Format date as DD-MM-YYYY
    var day = date.getDate();
    var month = date.getMonth() + 1; // Months are zero-indexed
    var year = date.getFullYear();

    return (day < 10 ? '0' : '') + day + '-' + (month < 10 ? '0' : '') + month + '-' + year;
}

	function downloadApproveCSV() {
	    var rowCount = 0;
	    gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
	        if (rowNode.data.empId) {
	            rowCount++;
	        }
	    });

	    if (rowCount > 0) {
	        var name = "Advance Report-" + $("#attndmonth option:selected").text();
	        var allColumns = gridOptions.columnApi.getAllColumns();

	        // Capitalize all headers for CSV
	        allColumns.forEach(col => {
	            if (col.getColDef().headerName) {
	                col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
	            }
	        });

	        // Filter visible columns
	        var visibleColumns = allColumns.filter(col => {
	            const headerName = col.getColDef().headerName;
	            const isColumnVisible = !col.getColDef().hide;
	            return headerName !== undefined && headerName !== null && isColumnVisible;
	        });

	        // Map visible column IDs for export
	        var visibleColumnIds = visibleColumns.map(col => col.getColId());

	        // CSV Export Parameters
	        const params = {
	            skipHeader: false,          // Include header row
	            columnGroups: true,         // Export column groups (parent-child headers)
	            skipFooters: false,         
	            skipGroups: false,          
	            skipPinnedTop: false,       
	            skipPinnedBottom: false,    
	            allColumns: false,          // Export only visible columns
	            onlySelected: false,        
	            suppressQuotes: false,      
	            fileName: name + '.csv',    // File name for CSV
	            sheetName: 'Sheet1',        
	            customHeader: null,         
	            customFooter: null,         
	            columnKeys: visibleColumnIds // Use only the visible column keys
	        };

	        // Perform export
	        gridOptions.api.exportDataAsCsv(params);
	    } else {
	        // Display message if no data available
	        $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
	        $("#msgOkModal").removeClass("btn3");
	        $("#msgOkModal").addClass("btn1");
	        $("#msgModal").modal('show');
	    }
	}

		function DateCellEditor() {}

		DateCellEditor.prototype.init = function(params) {
		    this.params = params;
		    this.eInput = document.createElement('input');
		    this.eInput.type = 'date';

		    // Set the value to the ISO format (yyyy-mm-dd) if there's an existing value
		    this.eInput.value = params.value ? this.toIsoFormat(params.value) : '';
		    
		    // Set the width of the input to 100%
		    this.eInput.style.width = '100%';
		    
		    // Stop editing when the user presses 'Enter'
		    this.eInput.addEventListener('keydown', function(event) {
		        if (event.key === 'Enter') {
		            event.stopPropagation();
		        }
		    });

		    // Stop editing when the date is selected from the calendar
		    this.eInput.addEventListener('change', () => {
		        this.params.stopEditing();  // Stop editing on date selection
		    });
		};

		DateCellEditor.prototype.getGui = function() {
		    return this.eInput;
		};

		DateCellEditor.prototype.afterGuiAttached = function() {
		    this.eInput.focus();
		    this.eInput.select();
		};

		DateCellEditor.prototype.getValue = function() {
		    // Return the value formatted as dd-mm-yyyy
		    return this.formatDate(this.eInput.value);
		};

		DateCellEditor.prototype.destroy = function() {};

		DateCellEditor.prototype.isPopup = function() {
		    return false;
		};

		// Helper function to format the date as dd-mm-yyyy
		DateCellEditor.prototype.formatDate = function(isoDateStr) {
		    if (!isoDateStr) return '';

		    const date = new Date(isoDateStr);
		    const day = String(date.getDate()).padStart(2, '0');
		    const month = String(date.getMonth() + 1).padStart(2, '0'); // Months are zero-indexed
		    const year = date.getFullYear();

		    return `${day}-${month}-${year}`;
		};

		// Helper function to convert dd-mm-yyyy to ISO format (yyyy-mm-dd)
		DateCellEditor.prototype.toIsoFormat = function(dateStr) {
		    if (!dateStr) return '';

		    const [day, month, year] = dateStr.split('-');
		    return `${year}-${month}-${day}`;

	    onCellValueChanged: onDateChanged
	}, {
	    headerName: "Due Month",
	    field: "dueDate",
	    cellStyle: { textAlign: 'center' }
	}, {
	    headerName: "Emi Amount",
	    field: "emi",
	    cellStyle: { textAlign: 'center' }
	}, {
		headerName: "Loan Amount",
	    field: "loanAmt",
	    cellStyle: { textAlign: 'center' }
	}, {
		headerName: "Tenure",
	    field: "tenure",
	    cellStyle: { textAlign: 'center' },
	    hide: true,
	}
];

var emiGridOptions2 = {
columnDefs: emiGridDefs2,
defaultColDef: {
    sortable: true,
    filter: true,
    resizable: true,
    width: 145
},
onCellEditingStopped: function(event) {
    var lastRowIndex = emiGridOptions2.api.getDisplayedRowCount() - 1;
    var lastColumnField = emiGridDefs2[emiGridDefs2.length - 1].field; // Get the last column field
    if (event.rowIndex === lastRowIndex && event.column.getColId() === lastColumnField) {
        
        // Ensure the new row is created before setting focus
        setTimeout(function() {
            var newRowIndex = emiGridOptions2.api.getDisplayedRowCount() - 1;
            emiGridOptions2.api.startEditingCell({
                rowIndex: newRowIndex,
                colKey: emiGridDefs2[0].field // first column field (speedFM)
            });
        }, 100);
    }
},
};

		function onDateChanged(event) {

		        const dueDate = calculateDueMonth(event.newValue);
		        event.data.dueDate = dueDate;
		        emiGridOptions2.api.refreshCells({ columns: ['dueDate'], rowNodes: [event.node] });

		}


		function calculateDueMonth(dateStr) {

		    const [day, month, year] = dateStr.split('-').map(Number);
		    const date = new Date(year, month - 1, day);

		    if (isNaN(date.getTime())) {
		        return "Invalid Date";
		    }

		    const monthName = date.toLocaleString('default', { month: 'long' });
		    const yearStr = date.getFullYear();

		    return `${monthName} ${yearStr}`;
		}

	function preClose(){
		var selectedRows = emiGridOptions1.api.getSelectedRows();
		var empId = selectedRows[0].empID;
		var id="";
		var total = 0;
		var months="";
		for (var i = 0; i < selectedRows.length; i++) {
			id = id +  selectedRows[i].advanceId+ ',';
			total = total + selectedRows[i].emi;
			months = months +  selectedRows[i].date+ ',';
		}
		id = id.substring(0, id.length - 1);
		months = months.substring(0, months.length - 1);
		processData(id, months)
	}
	function processData(idsssssssssssss, dates) {
	    console.log("dataset==", JSON.stringify(dataset));
	    const ids = idsssssssssssss.split(',');
	    const dateArray = dates.split(',');
	    const selectedDates = new Set(dateArray);
	    const result = {};
	    dataset.forEach(item => {
	        const { emi, date, dueDate, advanceId ,loanAmt ,tenure } = item;
	        if (ids.includes(advanceId) && selectedDates.has(date)) {
	            if (!result[advanceId]) {
	                result[advanceId] = { advanceId, emi: 0, date: '', dueDate: '', loanAmt: '', tenure: '' };
	            }
	            result[advanceId].emi += emi;
	            if (dueDate > result[advanceId].date) {
	                result[advanceId].date = date;
	                result[advanceId].dueDate = dueDate;
	                result[advanceId].loanAmt = loanAmt;
	                result[advanceId].tenure = tenure;
	            }
	        }
	    });
	    const response = Object.values(result);
	    console.log("response====", response);
	    emiGridOptions2.api.setRowData(response);
	    $("#precloseGrid").show();
	}

	function updateEmiDetails(){
		var selectedRows = emiGridOptions1.api.getSelectedRows();
	    var displayRowCount = emiGridOptions2.api.getDisplayedRowCount();

	    var empId= $("#empIdNo").val();
	    var data = []; 
	    var advanceIds = "";
	    var dates = "";
	    for (var i = 0; i < selectedRows.length; i++) {
	    	dates = dates  + chnageFormat(selectedRows[i].date) + ',';
	    }
	    dates =  dates.substring(0, dates.length - 1) ;
		console.log("dates",dates)
		
	    for (var i = 0; i < displayRowCount; i++) {
	        var rowData = emiGridOptions2.api.getDisplayedRowAtIndex(i).data;
	        advanceIds = advanceIds +  rowData.advanceId + ',';
			var item={};
	        item.advanceId = rowData.advanceId;
	        item.empID = empId;
	        item.loanamt=rowData.loanAmt;
	        item.emi = rowData.emi;
	        item.ternure = rowData.tenure;
	        item.month = chnageFormat(rowData.date); 
	        data.push(item);
	    }
	    advanceIds =  advanceIds.substring(0, advanceIds.length - 1) ;

		console.log("advanceIds",advanceIds)
	    var obj1 = {};
	    obj1.advanceIdList=advanceIds;
	    obj1.dateList=dates;
	    data.push(obj1);
	    addNewEmi(data)
	}
	function addNewEmi(obj){

	    console.log("addNewEmi Data:", JSON.stringify(obj));
	    
	    var empId= $("#empIdNo").val();
		$.ajax({
			type : "POST",
			url : "view-advance-report-add",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(obj),
			success : function(response) {
				if (response.message == "Success") {
					$("#messageParagraph").text("Added Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}else{
					$("#messageParagraph").text("Already Approved");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
				viewAllEmiDetails(empId);
			},
			error : function(response) {
				console.log(response)
			}
		});
	}
	
	function chnageFormat(dateStr){
		const [day, month, year] = dateStr.split('-');
	    return `${year}-${month}-${day}`;
	}

	function downloadEMIDetails() {

	    var empId= $("#empIdNo").val();
		var rowCount = 0;
		emiGridOptions1.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
		    if (rowNode.data.date) {
		        rowCount++;
		    }
		});
		if (rowCount > 0) {
		    var name = "ADVANCE EMI Report for employee-" +  $("#emiId").val();
		    var allColumns = emiGridOptions1.columnApi.getAllColumns();

		    allColumns.forEach(col => {
		        if (col.getColDef().headerName) {
		            col.getColDef().headerName = col.getColDef().headerName.toUpperCase();
		        }
		    });

		    var visibleColumns = allColumns.filter(col => {
		        const headerName = col.getColDef().headerName;
		        const isColumnVisible = !col.getColDef().hide;
		        return headerName !== undefined && headerName !== null && isColumnVisible;
		    });

		    var visibleColumnIds = visibleColumns.map(col => col.getColId());

		    const params = {
		        skipHeader: false,
		        columnGroups: false,
		        skipFooters: false,
		        skipGroups: false,
		        skipPinnedTop: false,
		        skipPinnedBottom: false,
		        allColumns: true,
		        onlySelected: false,
		        suppressQuotes: false,
		        fileName: name + '.csv',
		        sheetName: 'Sheet1',
		        customHeader: null,
		        customFooter: null,
		        columnKeys: visibleColumnIds
		    };
		    emiGridOptions1.api.exportDataAsCsv(params);
		} else {
		    $("#messageParagraph").text("NO DATA AVAILABLE FOR DOWNLOAD!");
		    $("#msgOkModal").removeClass("btn3");
		    $("#msgOkModal").addClass("btn1");
		    $("#msgModal").modal('show');
		}
	}
</script>
