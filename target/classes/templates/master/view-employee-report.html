	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}

		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	function changeFromDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}

		var year = splitDate[0];
		var month = splitDate[1];
		var day = "01";

		return day + '-' + month + '-' + year;
	}

	function downloadDetailsAttendance() {

		gridOptionsAttend.api.forEachNodeAfterFilterAndSort(function(rowNode,

	function getSubDept() {
		var shiftDeptId = $("#dept").val();
		if (shiftDeptId) {
			$
					.ajax({
						type : "GET",
						url : "view-employee-report-getSubDepartmentByDept?shiftDeptId="
								+ shiftDeptId,
						dataType : 'json',
						contentType : 'application/json',
						data : shiftDeptId,
						success : function(response) {
							if (response.message == "success") {
								console.log(response);
								$("#subDept").empty();
								$("#subDept").append(
										"<option value=''>Select</option>");

								for (var i = 0; i < response.body.length; i++) {
									var option = $("<option></option>");
									$(option).val(response.body[i].key);
									$(option).html(response.body[i].name);
									$("#subDept").append(option);
								}
							}
						},
						error : function(data) {
							console.log(data);
							$("#subDept").empty();
							$("#subDept").append(
									"<option value=''>Select</option>");

						}
					})
		} else {
			$("#subDept").empty();
			$("#subDept").append("<option value=''>Select</option>");
		}

	}

						if(allData){
							var len = allData.length;
							$('#totalReq').find('span').html(len);
							gridOptionsAttend.api.setRowData(allData);
							$('.loader').hide();
						}else{
							$('#totalReq').find('span').html('0');
							gridOptionsAttend.api.setRowData('');
							$('.loader').hide();
						}
					});
			} else if (activeStatus == "4") {
				agGrid.simpleHttpRequest({
					url : 'view-employee-report-resginDepartmentWise?dept='
						+ deptname
						+ "&subDept="
						+ subDeptname
						+ "&fromDate="
						+ fdate + "&toDate=" + tdate,

					var jsonData = JSON.parse(data.body);
					var allData = jsonData.viewData;
					console.log("resgin>>>>>>>>>>>>> ", allData)
					if(allData){
						var len = allData.length;
						$('#totalReq').find('span').html(len);
						gridOptionsReg.api.setRowData(allData);
						$('.loader').hide();
					}else{
						$('#totalReq').find('span').html('0');
						gridOptionsReg.api.setRowData('');
						$('.loader').hide();
					}
				});
			} else if (activeStatus == "5") {
					$('.loader').show();
					agGrid.simpleHttpRequest(
					{
						url : "view-employee-report-leaveDepartmentWise?dept="
						+ deptname
						+ "&subDept="
						+ subDeptname
						+ "&fromDate="
						+ fdate + "&toDate=" + tdate,
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						var allData = jsonData.viewData;
						console.log("view>>>>>>>>>>>>>", allData)
						if(allData){
							var len = allData.length;
							$('#totalReq').find('span').html(len);
							gridOptionsLeaveManage.api.setRowData(allData);
							$('.loader').hide();
						}else{
							$('#totalReq').find('span').html('0');
							gridOptionsLeaveManage.api.setRowData('');
							$('.loader').hide();
						}
					});
			}else {

			}

		}
	}

	function noPunchOutDetailsModal(noPunchOut) {
		$('#noPunchInBtn').hide();
		$('#noPunchOutBtn').show();

	}

	/* -------------------search bar for mygrid------------------------ */

	function onQuickFilterChanged() {

		var activeStatus = $("#activeStatus").val();

		if (activeStatus == "2") {
			gridOptionsAttend.api.setQuickFilter(document
					.getElementById('quickFilter2').value);
		}else if (activeStatus == "4") {
			gridOptionsReg.api.setQuickFilter(document
					.getElementById('quickFilter4').value);
		} else if (activeStatus == "5") {
			gridOptionsLeaveManage.api.setQuickFilter(document
					.getElementById('quickFilter5').value);
		} else {
			
		}
	}
	function cancelBar2() {
		var id = document.getElementById("closeKey2");
		id.style.display = "block";
		if ($('#quickFilter2').val() == null || $('#quickFilter2').val() == "") {
			id.style.display = "none";
		}
	}
	function cancelBar4() {
		var id = document.getElementById("closeKey4");
		id.style.display = "block";
		if ($('#quickFilter4').val() == null || $('#quickFilter4').val() == "") {
			id.style.display = "none";
		}
	}
	function cancelBar5() {
		var id = document.getElementById("closeKey5");
		id.style.display = "block";
		if ($('#quickFilter5').val() == null || $('#quickFilter5').val() == "") {
			id.style.display = "none";
		}
	}
	function dateChange() {

		var fromdate = $('#fromDate').val();
		var fd = fromdate.split("-");
		var todate = $('#toDate').val();
		var td = todate.split("-");
		if (fromdate != '' && todate != '') {
			if (fd[2] == td[2]) {
				if (fd[1] == td[1]) {
					if (fd[0] <= td[0]) {
						viewDateChange();
					} else {
						setFromToDate();
					}
				} else if (fd[1] < td[1]) {
					viewDateChange();
				} else {
					setFromToDate();
				}
			}else if (fd[2]<td[2]) {
				viewDateChange();
			} else {
				setFromToDate();
			}
		} else {

		}
		var activeStatus = $("#activeStatus").val();

		if (activeStatus == "2") {
			viewAttendance();
		} else if (activeStatus == "4") {
			viewResignationDetails();
		} else if (activeStatus == "5") {
			viewLeaveDetails();
		} else {

		}
	}
function viewDateChange(){
	var deptname = $("#dept").val();
	var subDeptname = $("#subDept").val();
	var fdate = $("#fromDate").val();
	var tdate = $("#toDate").val();

	if (deptname == "" || deptname == null) {
		var activeStatus = $("#activeStatus").val();
		if (activeStatus == "1") {
			viewEmployeeReports();
		} else if (activeStatus == "2") {
			viewAttendance();
		} else if (activeStatus == "4") {
			viewResignationDetails();
		} else if (activeStatus == "5") {
			viewLeaveDetails();
		} else {

		}

	} else {
		if (subDeptname == "" || subDeptname == null) {
			changeDept();
		} else {
			changeSubDept();
		}
	}
}
</script>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex ">
				<div class="maincontentsec">
					<input type="hidden" id="activeStatus">
					<div class="row mt-2">
						<div class="btn-group col-md-4">
							<button class="btn btn-primary" id="attendanceDetails"
								onclick="viewAttendance()">Attendance Report</button>
						</div>
						<div class="btn-group col-md-4">
							<button class="btn btn-primary " id="empResign"
								onclick="viewResignationDetails()">Employee Resignation</button>
						</div>

						<div class="btn-group col-md-4">
							<button class="btn btn-primary " id="otherreportsbtn"
								onclick="viewLeaveDetails();">Leave Details</button>
						</div>
					</div>
					
					<div class="row mt-4">
						<div class="col-md-3">
							<div class="form-group">
								<label>Department Name</label>
								<div class="select">
									<select id="dept" class="form-control"
										onchange="getSubDept(); changeDept();">
										<option value="">--Select--</option>
										<option th:each="c,iter:${department}" th:value="${c.key}"
											th:text="${c.name}"></option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-3">
							<div class="form-group">
								<label>Sub Department Name</label>
								<div class="select">
									<select id="subDept" class="form-control"
										onchange="changeSubDept()">
										<option value="">--Select--</option>
									</select>
								</div>
							</div>
						</div>

						<div class="col-md-3">
							<label>From Date</label>
							<div class="form-group calendar_box">
								<input type="text" id="fromDate" value=""
									onchange="dateChange()" class="form-control"
									placeholder="from date.."
									th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|"
									readonly> <i class="ti-calendar picker_calendar"
									id="fromDateCalender" onchange="dateChange()"
									style="top: 14px; right: 0px;"></i>
							</div>
						</div>
						<div class="col-md-3">
							<label>To Date</label>
							<div class="form-group calendar_box">
								<input type="text" id="toDate" value="" onchange="dateChange()"
									class="form-control" placeholder="to date.."
									th:attr="onkeyup=|formatDate('toDate','${session.DATEFORMAT_JS}')|"
									readonly> <i class="ti-calendar picker_calendar"
									id="toDateCalendar" onchange="dateChange()"
									style="top: 14px; right: 0px;"></i>
							</div>
						</div>
						
					</div>
					
					<div class="d-flex justify-content-between mt-4" id="newId">
						<input type="hidden" id="rowId" />
						<div class="col-md-2 btn-hs" id="totalReq">
							Employee Report(<span></span>)
						</div>
						<div class="col-md-3  btn-hs" id="searchDiv2">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search"
									class="searchboxinput" onkeyup="cancelBar2()"
									oninput="onQuickFilterChanged()" id="quickFilter2"
									autocomplete="off">
								<div class="searchicon">
									<a href="javascript: void(0)"><span
										style="display: none; border-right: 1px solid #ccc; padding-right: 10px;"
										id="closeKey2"
										onclick="gridOptionsAttend.api.setQuickFilter(null);$('#quickFilter2').val('');document.getElementById('closeKey2').style.display='none';"
										class="close_i"><i class="ti-close srchicon"></i></span></a><a
										href="javascript: void(0)"><i class="ti-search srchicon"></i></a>
								</div>
							</div>
						</div>
						<div class="col-md-3  btn-hs" id="searchDiv4">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search"
									class="searchboxinput" onkeyup="cancelBar4()"
									oninput="onQuickFilterChanged()" id="quickFilter4"
									autocomplete="off">
								<div class="searchicon">
									<a href="javascript: void(0)"><span
										style="display: none; border-right: 1px solid #ccc; padding-right: 10px;"
										id="closeKey4"
										onclick="gridOptionsReg.api.setQuickFilter(null);$('#quickFilter4').val('');document.getElementById('closeKey4').style.display='none';"
										class="close_i"><i class="ti-close srchicon"></i></span></a><a
										href="javascript: void(0)"><i class="ti-search srchicon"></i></a>
								</div>
							</div>
						</div>
						<div class="col-md-3  btn-hs" id="searchDiv5">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search"
									class="searchboxinput" onkeyup="cancelBar5()"
									oninput="onQuickFilterChanged()" id="quickFilter5"
									autocomplete="off">
								<div class="searchicon">
									<a href="javascript: void(0)"><span
										style="display: none; border-right: 1px solid #ccc; padding-right: 10px;"
										id="closeKey4"
										onclick="gridOptionsLeaveManage.api.setQuickFilter(null);$('#quickFilter5').val('');document.getElementById('closeKey5').style.display='none';"
										class="close_i"><i class="ti-close srchicon"></i></span></a><a
										href="javascript: void(0)"><i class="ti-search srchicon"></i></a>
								</div>
							</div>
						</div>

						<div class="row">
							<div class="col-md-12 btn-hs" align="right">
								<button class="download-btn" id="downloadAtten"
									onclick="downloadDetailsAttendance()">Download</button>
								<button class="new-btn" id="noPunchOut"
									onclick="noPunchOutDetailsModal('noPunchOut')">No
									PunchOut</button>
								<button class="new-btn" id="noPunchIn"
									onclick="noPunchInDetailsModal('noPunchIn')">No
									PunchIn</button>
							</div>
							<div class="col-md-12 btn-hs" align="right">
								<button class="download-btn" id="downloadReg"
									onclick="downloadDetailsReg()">Download</button>
							</div>
							<div class="col-md-12 btn-hs" align="right">
								<button class="download-btn" id="downloadLeave"
									onclick="downloadDetailsLeave()">Download</button>
							</div>
						</div>
					</div>
					<input type="hidden" id="sessionId" th:value="${userId}">
					
					<div class="row">
						<div id="myGridAttendance" style="width: 100%; height: 500px;"
							class="ag-theme-alpine"></div>
					</div>
					<div class="row">

					</div>
					<div class="row">

							class="ag-theme-alpine"></div>
					</div>

					<!-- ------------------Comment modal------------------------- -->

					<div id="commentModal" class="modal fade">
						<div class="modal-dialog">
							<!-- Modal content-->
							<div class="modal-content">
								<div class="modal-header">
									<h4 class="modal-title">Attendance Report</h4>
									<button type="button" class="close" data-bs-dismiss="modal"
										aria-label="Close">
										<i class="ti-close"></i>
									</button>

								</div>
								<div class="modal-body">
									<!-- text input -->
									<div class="row">
										<div class="col-md-12">
											<label>Report Date</label>
											<div class="form-group calendar_box">
												<input type="text" id="date" value="" class="form-control"

													readonly> <i class="ti-calendar picker_calendar"

								<div class="modal-footer justify-content-left">

										onclick="noPunchInDetails('noPunchIn')">Submit</button>

										aria-hidden="true" id="noPunchOutBtn"
										onclick="noPunchOutDetails('noPunchOut')">Submit</button>
								</div>
							</div>
						</div>
					</div>
					
				</div>
			</div>
		</div>
	</div>
</body>
