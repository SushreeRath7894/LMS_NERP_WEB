    display: inline-block;
    width: 10px;
    height: 10px;
    background-color: #00FF00;
    border-radius: 50%;
    margin-left: 10px; /* Adjust space between text and icon as needed */

@keyframes blink {

	function updateShiftButtonColors() {
	    var now = new Date();
	    var currentMinutes = now.getHours() * 60 + now.getMinutes();

	    // Define shifts with priority (higher index means higher priority)
	    var shifts = [
	        {
	            id: '#shiftCsec',
	            start: 22 * 60 + 1, // 10:01 PM
	            end: 6 * 60         // 06:00 AM
	        },
	        {
	            id: '#shiftBsec',
	            start: 14 * 60 + 1, // 02:01 PM
	            end: 22 * 60        // 10:00 PM
	        },
	        {
	            id: '#shiftGsec',
	            start: 9 * 60,      // 09:00 AM
	            end: 18 * 60        // 06:00 PM
	        },
	        {
	            id: '#shiftAsec',
	            start: 6 * 60,      // 06:00 AM
	            end: 14 * 60        // 02:00 PM
	        }
	    ];

	    function isWithinRange(start, end) {
	        if (start < end) {
	            return currentMinutes >= start && currentMinutes <= end;
	        } else {
	            return currentMinutes >= start || currentMinutes <= end;
	        }
	    }

	    // Remove all active classes first
	    $('#shiftGsec').removeClass('shiftA shiftB');
		$('#shiftAsec').removeClass('shiftA shiftB');
		$('#shiftBsec').removeClass('shiftA shiftB');
		$('#shiftCsec').removeClass('shiftA shiftB');
		$('#shiftGicon').removeClass('blink-icon blink-iconss');
		$('#shiftAicon').removeClass('blink-icon blink-iconss');
		$('#shiftBicon').removeClass('blink-icon blink-iconss');
		$('#shiftCicon').removeClass('blink-icon blink-iconss');
		
		// Iterate over shifts based on priority
		for (var i = 0; i < shifts.length; i++) {
		    var shift = shifts[i];
		    var shiftId = shift.id; // e.g., #shiftGsec
		    var shiftIdentifier = shiftId.replace('#shift', '').replace('sec', '');
		    var iconId = shiftId.replace('sec', 'icon'); // e.g., #shiftGicon
		    // Check if within range
		    if (isWithinRange(shift.start, shift.end)) {
		        $(shiftId).addClass('shiftA');
		        $(iconId).addClass('blink-icon');
		    } else {
		        $(shiftId).addClass('shiftB');
		        $(iconId).addClass('blink-iconss');
		    }
		}
	}

	function changeFromDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}

		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

	    $('.loader-modal').show();

			$("#shiftGsec").addClass("activepage");
			$("#shiftAsec").removeClass("activepage");
			$("#shiftBsec").removeClass("activepage");
			$("#shiftCsec").removeClass("activepage");
		}else if(sec == 'A'){
			$("#shiftGsec").removeClass("activepage");
			$("#shiftAsec").addClass("activepage");
			$("#shiftBsec").removeClass("activepage");

			$("#shiftAsec").removeClass("activepage");
			$("#shiftBsec").addClass("activepage");
			$("#shiftCsec").removeClass("activepage");
			
		}else if(sec == 'C'){

			$("#shiftAsec").removeClass("activepage");
			$("#shiftBsec").removeClass("activepage");
			$("#shiftCsec").addClass("activepage");

			$("#shiftATotal").text(jsonData.counts.countShiftA);
			$("#shiftBTotal").text(jsonData.counts.countShiftB);
			$("#shiftCTotal").text(jsonData.counts.countShiftC);

			$("#shiftBGroup").text(jsonData.counts.group2);
			$("#shiftCGroup").text(jsonData.counts.group3);

			}

	function approveShift(){
		var id="";
		 var selectedRows = activityOptions.api.getSelectedRows();
			var rowCount = 0;
	
			selectedRows.forEach(function(i) {
				rowCount = rowCount + 1;
			});
			
		if(rowCount>0){
			var selectedRows = activityOptions.api.getSelectedRows();
			for (var i = 0; i < selectedRows.length; i++) {

				id = id + '"' + selectedRows[i].empId + '",';
		
			}
		id = id.substring(0, id.length - 1);
		}
		
		if(id){
		var finalId = "(" + id + ")";
		}
		
		approveAll(finalId);
	}
	
	
	function approveAll(slNo){
		var fromDate= $("#fromDate").val();
		var toDate= $("#toDate").val();
		$(".loader").show();
		if(slNo){
			$.ajax({
				type : "GET",
				url : "employee-shift-scheduling-approve?slNo=" + slNo + "&fromDate=" +fromDate + "&toDate=" +toDate,
				async : false,
				success : function(response) {
					if (response.code == "success") {
						$(".loader").hide();
						
						if(flag == "APPROVE"){
							$("#messageParagraph").text(
							"Shift Approved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');	
						}else{
							$("#messageParagraph").text(
							"Shift Deleted Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
						}
						$("#shiftType").val('all');
						viewAll("all");
						$('#approveBtn').attr('disabled', true);
						$('#deleteBtn').attr('disabled', true);
					}else{
						$(".loader").hide();
						$("#messageParagraph").text(
						"Something Went Wrong. Try After some time.");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$("#shiftType").val('all');
						viewAll("all");
						$('#approveBtn').attr('disabled', true);
						$('#deleteBtn').attr('disabled', true);
					}

				},
				error : function(data) {
				}
			});
		}
