<script>
let type = '';
$(document).ready(function() {
	
	const urlParams = new URLSearchParams(window.location.search);
	type = urlParams.get('id');
	
	if(type == null || type == 'null') {
		type = '';
	}
	
	$("#detailsBinDiv").hide();
	
    var gridDiv = document.querySelector('#myGrid');
    new agGrid.Grid(gridDiv, gridOptions);

    var rowData = [];
    gridOptions.api.setRowData(rowData);
    pno = 1;
    view();

    var dateFormat = localStorage.getItem("dateFormat");
    $("#manufactureDateCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
    }).on("change", function() {
        $('#manufactureDate').val($(this).val());
    })

    $('#manufactureDate').blur(function() {
        $("#manufactureDateCalendar").val($(this).val());
    })

    $("#bestBeforeCalendar").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
    }).on("change", function() {
        $('#bestBeforeDate').val($(this).val());
    })

    $('#bestBeforeDate').blur(function() {
        $("#bestBeforeCalendar").val($(this).val());
    })
    
    $("#dispatch").attr("disabled",true);

    $("#toDateCalendarTime").datetimepicker({
        format: 'H:i',
        closeOnDateSelect: false,
        timepicker: true,
        datepicker: false,
        step: 15
    }).on("change", function() {
        $('#manufactureTime').val($(this).val());
    })

    $('#manufactureTime').blur(function() {
        $("#toDateCalendarTime").val($(this).val());
    })
    $("#addData").hide();

});
var pno;

function view() {

    var pages;
    var pageno = pno;
    $(".loader").show();
    agGrid.simpleHttpRequest({
        url: "goods-dispatch-through-ajax?pageno=" + pageno + "&type=" + type
    }).then(function(data) {
        $(".loader").hide();
        var jsonData = JSON.parse(data.body);
        var allData = jsonData.BlockData;

        gridOptions.api.setRowData(allData);

        if (allData && allData.length > 0) {
            let rowId = allData[0].blockId;
            gridOptions.api.getRowNode(rowId).setSelected(true);

        }

    });
}

var colmnDefs = [{
        headerCheckboxSelection: true,
        headerCheckboxSelectionFilteredOnly: true,
        checkboxSelection: true,
        width: 10,
        sortable: false,
        filter: false,
        resizable: true
    },
    {
        headerName: "Block Id",
        field: "blockId",
        width: 150,
    },
    {

        headerName: 'Warehouse',
        field: "warehouseName",
        width: 150,
    },
    {

        headerName: 'Category',
        field: "categoryName",
        width: 130,

    },
    {
        headerName: 'Item Name',
        field: "ItemName",
        width: 200,
    },
    {

        headerName: 'Quantity',
        field: "quantity",
        width: 50,
        type: 'rightAligned',
    },
    {

        headerName: 'Unit',
        field: "unitName",
        width: 100,

    },
    {
        headerName: 'Bin',
        field: "binIdBlocking",
        width: 350,
    },
    {
        headerName: 'Dispatch Status',
        field: "dispatchStatus",
        width: 150,
        cellStyle: {
            textAlign: 'center'
        },
        cellRenderer: function(params) {
            if (params.data.dispatchStatus == "Dispatched") {
                return '<div style="color:#0642f5">' +
                    params.data.dispatchStatus + '</div>';
            } else if (params.data.dispatchStatus == "In Progress") {
                return '<div style="color:#ffa500">' +
                    params.data.dispatchStatus + '</div>';
            } else {
                return '<div style="color:#a9a9a9">' +
                    params.data.dispatchStatus + '</div>';
            }
        }
    }
];

var gridOptions = {
    columnDefs: colmnDefs,
    rowSelection: 'single',
    onSelectionChanged: onRowSelection,
    groupSelectsChildren: true,
    suppressRowClickSelection: true,
    suppressAggFuncInHeader: true,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 130,
        height: 10
    },
    getRowNodeId: function(data) {
        return data.blockId;
    }

};

function onRowSelection() {
    var stackStatus = '';
    var selectedNodes = gridOptions.api.getSelectedNodes();

    var selectedData = selectedNodes.map(node => node.data);
    var blockId = selectedData.map(node => node.blockId);
    var categoryName = window.btoa(selectedData.map(node => node.categoryName));
    var ItemName = window.btoa(selectedData.map(node => node.ItemName));
    var quantity = selectedData.map(node => node.quantity);
    var unitName = window.btoa(selectedData.map(node => node.unitName));
    var warehouseid = selectedData.map(node => node.warehouseid);
    var warehouseName = window.btoa(selectedData.map(node => node.warehouseName));

    var rowCount = 0;
    selectedNodes.forEach(function(selectedNodes, index) {

        rowCount = rowCount + 1;
    });

}

function onRowSelection() {
    
    var stackStatus = '';
    var selectedNodes = gridOptions.api.getSelectedNodes();

    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	var blockId = selectedData.map(node => node.blockId);
        var categoryName = selectedData.map(node => node.categoryName);
        var categoryId = selectedData.map(node => node.categoryId);
        var itemName = selectedData.map(node => node.ItemName);
        var quantity = selectedData.map(node => node.quantity);
        var unitName = selectedData.map(node => node.unitName);
        var warehouseid = selectedData.map(node => node.warehouseid);
        var warehouseName = selectedData.map(node => node.warehouseName);
        var rackId = selectedData.map(node => node.rackId);
        var rackName = selectedData.map(node => node.rackName);
        
        $("#warehouseId").val(warehouseid);
        $("#blockId").val(blockId);
        $("#warehouseName").val(warehouseName);
        $("#categoryId").val(categoryId);
        $("#categoryName").val(categoryName);
        $("#itemId").val(selectedData.map(node => node.itemId));
        $("#itemName").val(itemName);
        $("#quantity").val(quantity);
        $("#unit").val(unitName);
        
        $("#dispatch").attr("disabled",false);
        
        removeDetailsBin();
        getBinList(warehouseid,blockId);
    } else {
    	$("#blockId").val('');
    	$("#warehouseId").val('');
        $("#warehouseName").val('');
        $("#categoryId").val('');
        $("#categoryName").val('');
        $("#itemId").val('');
        $("#itemName").val('');
        $("#quantity").val('');
        $("#unit").val('');
        
        $("#dispatch").attr("disabled",true);
    }

}

function removeDetailsBin() {
	$("#detailsDiv").empty();
    
    $("#detailsBinDiv").hide();
    $("#dispatchDiv").show();
    
    $("#blockQty").val("");
    $("#batchNo").val("");
    $("#serialNo").val("");
    $("#manufacturedDate").val("");
    $("#expiredDate").val("");
}

function getBinList(wh_id,block_id) {
	
	$('.loader').show();
	$("body").addClass("overlay");
	
	$("#main").empty();
	
	agGrid.simpleHttpRequest({
	    url: "goods-dispatch-getBlockingDataforDispatch?warehouse="+wh_id+"&block="+block_id
	}).then(data => {
		
		if(data.body) {
			let d = JSON.parse(data?.body);
			
			if(d.length > 0) {
				let b = '';
				
				d.forEach(a => {
					
					b = b + '<h5 class="sub-header-new">'+a.zone_name+'</h5>';
					
					a?.bin_details?.forEach(c => {
						b = b + '<div class="menu-container"><div class="btn btn-primary edit-btn pd--10 bin-for-all" id="'+c.bin_id+'" data-name="'+c.bin_name+'" data-qty="'+c.bin_qty+'" data-zone="'+c.zone_id+'">'+c.bin_name+'('+c.bin_qty+')'+'</div>'
							  +	'<ul class="menu-list"><li><div onclick=viewStockData("'+c.bin_qty+'","'+c.m_date+'","'+c.e_date+'","'+c.batch_no+'","'+c.sl_no_from+'","'+c.sl_no_to+'")><i title="Details" class="fa fa-info-circle"></i></div></li></ul></div>';
					})
				})
				$("#main").append(b);
				
				$(".bin-for-all").click(function() {
					$(this).toggleClass('bin-all-active');
				});
			}
		}
		
		$('.loader').hide();
		$("body").removeClass("overlay");
		
	});
}

function viewStockData(qty,m_date,e_date,batchNo,sl_no_from,sl_no_to) {
	$("#detailsBinDiv").show();
    $("#dispatchDiv").hide();
	
	$("#blockQty").val(qty)
	
	if(batchNo == null || batchNo == '' || batchNo == undefined || batchNo == 'null')
		batchNo = 'N/A'
		
	if(m_date == null || m_date == '' || m_date == undefined || m_date == 'null')
		m_date = 'N/A';
	else
		m_date = formatDate(m_date);
	
	if(e_date == null || e_date == '' || e_date == undefined || e_date == 'null')
		e_date = 'N/A'
	else
		e_date = formatDate(e_date);
	
	$("#batchNo").val(batchNo)
	$("#serialNo").val(sl_no_from+" - "+sl_no_to)
	$("#manufacturedDate").val(m_date)
	$("#expiredDate").val(e_date)
}

function formatDate(dt) {
	let d = dt.split("-");
	
	return d[2] + "-" + d[1] + "-" + d[0];
}

function dispatch() {
	let binCount = $(".bin-all-active").length;
	
	if(binCount == 0) {
		toastr.error("Please select atleast one bin to stacking")
		return;
	}
	
	let datas = [];
	$(".bin-all-active").each(function(){
		let a = {};
		
		a.key = $("#warehouseId").val();
		a.name = $("#blockId").val();
		a.code = $(this).attr('id');
		
		datas.push(a)
	});
	
	$('.loader').show();
	$("body").addClass("overlay");
	
	$.ajax({
        type : "POST",
        url : "goods-dispatch-submit-dispatchdetails",
        contentType: "application/json",
	    data: JSON.stringify(datas),
        success : function(response) {
            if (response.code == "success") {
				toastr.success("Dispatched successfullt")
                view();
            } else {
                $('.loader').hide();
                $("body").removeClass("overlay");
                toastr.error(response.message)
            }

        },
        error : function(data) {
        	$('.loader').hide();
        	$("body").removeClass("overlay");
        	toastr.error("Something went wrong")
        }
    });
}
</script>
