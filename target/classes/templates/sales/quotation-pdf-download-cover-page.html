<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<title>PDF</title>
<style type="text/css">
body {
	margin: 0;
	font-family: sans-serif;
}

.left-logo img {
	height: 110px;
}

.regd-text span {
	font-size: 11px;
	font-weight: 600;
	color: #cc0052;
}

.regd-text {
	font-size: 11px;
	font-weight: 600;
	color: #365f91;
	margin-left: 30px;
}

.orifood {
	font-size: 20px;
	text-align: center;
	font-weight: 600;
	text-transform: uppercase;
}

.top-red-header {
	background: #990033;
	font-size: 14px;
	color: #fff;
	padding: 6px;
	text-align: center;
}

.ref-text {
	font-size: 14px;
	color: #000;
}

.text-right {
	text-align: right;
}

.text-left {
	text-align: left;
}

.bdr-btm {
	border-bottom: 1px solid #000;
}

.ref-text span {
	margin-right: 20px;
}

.Work-text {
	font-size: 14px
}

.Work-text span {
	font-size: 14px;
	font-weight: 600;
	color: #cc0052;
}

.bdr-btm b {
	margin-right: 20px;
}

tbody td {
	padding: 5px;
	height: 29px;
	font-size: 12px;
}

tbody th {
	padding: 5px;
	height: 29px;
	font-size: 12px;
}

.project-tbl table td {
	padding: 5px;
	height: 29px;
	font-size: 12px;
	text-align: center;
}

.project-tbl table td:nth-child(2) {
	text-align: left;
}

.td-gap {
	padding: 30px 0px;
}

.text-center {
	text-align: center;
}

.d-flex {
	display: flex;
}

.mt-10 {
	margin-top: 10px
}

.mb-20 {
	margin-bottom: 20px
}

.yellow-header {
	background: #ffed3c
}

.term {
	font-size: 14px;
	font-weight: 600;
	border-bottom: 2px solid #000;
	display: table;
}

.condition {
	font-size: 14px;
	margin-bottom: 50px;
}

.condition ul {
	padding-left: 15px;
}

.mb-60 {
	margin-bottom: 60px;
}

.mb-30 {
	margin-bottom: 30px;
}

.logo-section {
	width: 100%;
	text-align: center;
}

.logo-section img {
	height: 250px;
}

.empower-text {
	font-size: 20px;
	text-align: center;
	color: #1960a2;
	font-weight: 600;
	margin-bottom: 20px;
}

.proposal-box {
	border: 2px solid #1960a2;
	border-radius: 20px;
	padding: 10px;
	height: 220px;
	width: auto;
	margin: 0 10%;
}

.proposal-heading {
	font-size: 18px;
	color: #000;
	font-weight: 600;
	text-decoration: underline;
	text-align: center;
	margin-bottom: 15px;
}

.ref-txt {
	font-size: 14px;
	line-height: 22px;
	/* display: flex; */
}

.ft-wt {
	font-weight: 600;
}

.wd-155 {
	width: 170px;
	float: left;
}

.ref-txt b {
	font-size: 14px;
	font-weight: 600;
}

.company-Name {
	color: #1960a2;
	font-size: 20px;
	text-align: center;
	margin-top: 20px;
}

.btm-img img {
	width: 100%
}

.ht-850 {
	min-height: 850px
}

.ht-800 {
	min-height: 800px
}

@media print {
	.top-red-header {
		background: #990033;
		color: #fff;
		-webkit-print-color-adjust: exact !important;
		print-color-adjust: exact !important;
	}
	.yellow-header {
		background: #ffed3c;
		-webkit-print-color-adjust: exact !important;
		print-color-adjust: exact !important;
	}
}

@page coverPage {
	size: A4 portrait;
	margin: 33% 6%;
	@top-left {
		content : element(coverHeader);
	}

	@bottom-right {
		content: element(coverFooter);
	}

}
.cover-page {
	page: coverPage;
}

header.cover {
	position: running(coverHeader);
}

footer.cover {
	position: running(coverFooter);
	text-align: right;
}

</style>
</head>
<body>
	<div class="cover-page">
		<header class="cover">
			<img src="classpath:static/assets/img/akanksha-top-img.png" />
		</header>
		<div class="content">
			<div class="logo-section">
				<img src="classpath:static/assets/img/akanksha-logo.png" />
			</div>
			<div class="empower-text">"Empowering Your Aspiration"</div>
			<div class="proposal-box">
				<div class="text-center">
					<div class="proposal-heading" th:text="${quotDetails?.quotation_subject}">
						
					</div>
				</div>
				<div class="ref-txt">
					<div class="ft-wt wd-155">Our reference</div>
					: <span th:text="${quotDetails?.quotation_id}"></span>
				</div>
				<div class="ref-txt">
					<div class="ft-wt wd-155">Date</div>
					: <span th:text="${quotDetails?.quotation_date}"></span>
				</div>
				<div class="ref-txt">
					<div class="ft-wt wd-155">Client</div>
					: <span th:text="${customerDetails?.customer_name}"></span>
				</div>
				<div class="ref-txt">
					<div class="wd-155">End Customer</div>
					: <span th:text="${customerDetails?.end_customer_name}"></span>
				</div>
				<div class="ref-txt">
					<div class="wd-155">Project</div>
					: <span th:text="${projectName}"></span>
				</div>
			</div>
			<div class="company-Name">Akanksha Power and Infrastructure
				Ltd.</div>
			<div class="regd-text text-center">
				<span>Email :</span>info@apil.co.in <span>Web :</span>www.apil.co.in
			</div>
		</div>
		<footer class="cover">
			<img src="classpath:static/assets/img/akanksha-btm-img.png" />
		</footer>
	</div>

</body>
</html>
