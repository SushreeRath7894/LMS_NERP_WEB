			$('.loader').hide();

			$("#placeName").val('');
			$("#fromDate").val('');
			$("#toDate").val('');
			$("#purpose").val('');

			  var emptydata = [];
			 activityOptions.api.setRowData(emptydata);

			$('.loader').hide();

//Function to disable the dropdown if it contains only one option
function disableDropdownIfSingleOption() {
    var empNameDropdown = document.getElementById("empName");
    var totalOptions = empNameDropdown.options.length;

    // If there's only 1 option besides the 'Select', disable the dropdown
    if (totalOptions === 2) { // 1 option + 'Select'
        empNameDropdown.disabled = true;
    } else {
        empNameDropdown.disabled = false; // Ensure it stays enabled if more options are present
    }
}
