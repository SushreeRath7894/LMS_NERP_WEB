function getEmployeeList(id,emp=null) {
	$.ajax({
		type : "GET",
		url : "view-ccr-details-employee-list?id="+id,
		success : function(response) {
			console.log(response);
			if (response.message == "Success") {
				console.log("qualify DD---",response.body);
				$("#guidedBy").empty();
				$("#guidedBy")
						.append("<option value=''>Select</option>");
				for (var i = 0; i < response.body.length; i++) {
					var option = $("<option></option>");
					$(option).val(response.body[i].key);
					$(option).html(response.body[i].name);
					$("#guidedBy").append(option);
				}
				if(emp!=null){
					$('#guidedBy').val(emp);
				}
			}
		},
		error : function(data) {
			console.log(data);
			$("#guidedBy").empty();
			$("#guidedBy").append("<option value=''>Select</option>");
		}
	})
}

	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];
		return day + '-' + month + '-' + year;
	}

	function viewPreview(id){
		$("#grid").hide();
		$("#previewPage").show();
		var dataFromDB = [
		    {
		        name: "Singh Osahan",
		        date: "Tue, 20 Mar 2020",
		        text: "Contrary to popular belief, Lorem Ipsum is not simply random text...",
		        likes: "856M",
		        dislikes: "158K"
		    },
		    // Add more data items as needed
		];

		// Reference to the container where tables will be appended
		var tableContainer = document.getElementById("tableContainer");

		// Loop through the data and create a table for each item
		dataFromDB.forEach(function(item) {
		    // Create a new table element
		    var table = document.createElement("table");
		    table.className = "previewTab";

		    // Create table body
		    var tbody = document.createElement("tbody");

		    // Create table rows
		    var headerRow = createTableRow(createTableData(item.name, 2), "reviews-members-header");
		    var bodyRow = createTableRow(createTableData(item.text, 2), "reviews-members-body");
		    var footerRow = createTableRow(
		        createTableData(
		            "<a class='total-like' href='#'><i class='icofont-thumbs-up'></i> " + item.likes + "</a> " +
		            "<a class='total-like' href='#'><i class='icofont-thumbs-down'></i> " + item.dislikes + "</a>",
		            2
		        ),
		        "reviews-members-footer"
		    );

		    // Append rows to table body
		    tbody.appendChild(headerRow);
		    tbody.appendChild(bodyRow);
		    tbody.appendChild(footerRow);

		    // Append table body to table
		    table.appendChild(tbody);

		    // Append table to container
		    tableContainer.appendChild(table);
		});
	}
	function createTableRow(data, className) {
	    var row = document.createElement("tr");
	    var cell = document.createElement("td");
	    cell.colSpan = data.length;
	    cell.appendChild(data);
	    row.appendChild(cell);
	    if (className) {
	        row.className = className;
	    }
	    return row;
	}

	// Function to create an array of table data elements
	function createTableData(content, colspan) {
	    var cell = document.createElement("td");
	    cell.colSpan = colspan || 1;
	    cell.innerHTML = content;
	    return cell;
	}
	function closePreview(){
		$("#grid").show();
		$("#previewPage").hide();
		
	}
</script>
