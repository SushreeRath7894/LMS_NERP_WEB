function deleteOnclick() {
	  var selectedRows = gridOptions.api.getSelectedRows();
	  if (selectedRows.length === 0) {
	    toastr.warning('Please select a row to delete.');
	    return;
	  }

	  var selectedRowsString = selectedRows.map(row => row.travelingReqId).join(',');

	  if (selectedRowsString) {
	    var item = { travelingReqId: selectedRowsString };

	    $.ajax({
	      type: "POST",
	      url: "travel-requisition-delete-th-ajax",
	      dataType: "json",
	      contentType: "application/json",
	      data: JSON.stringify(item),
	      success: function (response) {
	        if (response.message == "Success") {
	          gridOptions.api.applyTransaction({ remove: selectedRows });
	          gridOptions.api.deselectAll();
	          viewAllData(); 
	          toastr.success('Travel Deleted Successfully');

	          if (type == 'self-service') {
	            setTimeout(() => {
	              $("#cancelTravel").hide();
	              $("#addDtls").show();
	            }, 100);
	          }
	        } else {
	          toastr.error('Failed to delete travel request');
	        }
	      },
	      error: function (data) {
	        console.log(data);
	        toastr.error('An error occurred while deleting');
	      }
	    });
	  }
	}

		$("#empName").val(window.atob(empName));
		$("#empId").val(empid);
		$("#designation").val(window.atob(designation));
		$("#empName").attr('data-procat', empid);
		$("#suggesstion-box_").hide();
	} else {
		$("#empId").val("");
		$("#empName").val("");
		$("#designation").val("");
		$("#empName").attr('data-procat', "");
		$("#suggesstion-box_").hide();

	}
}

function dateChange(fromDate,toDate) {

	let fromdate = $('#'+ fromDate).val();
	let todate = $('#' + toDate).val();
	
//toastr.error("Please choose less than or equal to your available leave ");
	if (fromdate !== '' && todate !== '') {
		let fromDateNmber = fromdate.split("-").map(Number);
		let toDateNumber = todate.split("-").map(Number);

		let fromDateObj = new Date(fromDateNmber[2], fromDateNmber[1] - 1, fromDateNmber[0]);
		let toDateObj = new Date(toDateNumber[2], toDateNumber[1] - 1, toDateNumber[0]);

	    if (fromDateObj > toDateObj) {
	    	
	    	toastr.error("Please Choose To Date Greater Than Or Equal To From Date.");
	    	$('#' + fromDate).val("");
	    	$('#' + toDate).val("");
	    }
	    
	}

}

function setCalenderDate(fieldName,calenderId){
	console.log("Okkkk");
	console.log(fieldName,calenderId);
	let date = $('#'+fieldName).val();
	console.log("date",date);
	$("#"+calenderId).val(null);
	/* setTimeout(function() { */
	if(date!=null && date!=""){
		console.log("Inside If");
		$('#' + calenderId).val(date);
	}else{
		console.log("Inside Else");
		let dateJS = (new Date()).toISOString().split('T')[0];
		let currDate = changeDateFormat(dateJS);
		$("#"+calenderId).val(currDate);
	}
	/* }, 1000); */
}

function changeDateFormat(inputDate){  // expects Y-m-d
    var splitDate = inputDate.split('-');
    if(splitDate.count == 0){
        return null;
    }
    var year = splitDate[0];
    var month = splitDate[1];
    var day = splitDate[2]; 

    return day + '-' + month + '-' + year;
}
function cancelTravel(){
	if (window.location.href.indexOf("self-service") !== -1) {
		$('#approveReqBtn,#rejectReqBtn,#cancelTravel').hide();
		$("#addDtls").show();
    }else{
	$("#addDtls, #editDtls, #deleteDtls,#approveReqBtn,#rejectReqBtn").show();
	$("#cancelTravel").hide();
    }
	
	viewAllData();

	
}

																</div>
															</div>
														</div>
														<div class="row mt-2">
															<input type="hidden" id="claimEditId" />
															<!-- <input type="hidden" id="claimStatus" value="4" /> -->

															<div class="col-md-6">
																<div class="form-group">
																	<label>Service Name<span class="mandatory">*</span></label>
																	<div class="select">
																		<select class="form-control"
																			onblur="removeValid(event)" id="claimServiceName">
																			<option value="">Select</option>
																			<option th:each="c,iter:${getServiceList}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>
															</div>
															<div class="col-md-6">
																<div class="form-group calendar_box">
																	<label>From Date<span class="mandatory">*</span></label>
																	<input type="text" id="fromDateClaim"
																		class="form-control" onblur="removeValid(event)"
																		th:attr="onkeyup=|formatDate('fromDateService','${session.DATEFORMAT_JS}')|"
																		readonly> <i
																		class="ti-calendar picker_calendar"
																		id="fromDateCalendarClaim" onClick="setCalenderDate('fromDateClaim','fromDateCalendarClaim')"></i>
																</div>
															</div>

															<div class="col-md-6">
																<div class="form-group calendar_box">
																	<label>To Date<span class="mandatory">*</span></label>
																	<input type="text" id="toDateClaim"
																		class="form-control" onblur="removeValid(event)"
																		th:attr="onkeyup=|formatDate('toDateService','${session.DATEFORMAT_JS}')|"
																		readonly> <i
																		class="ti-calendar picker_calendar"
																		id="toDateCalendarClaim" onClick="setCalenderDate('toDateClaim','toDateCalendarClaim')"></i>
																</div>
															</div>

															<div class="col-md-6">
																<div class="form-group">
																	<label>Amount<span class="mandatory">*</span></label> <input
																		type="text" class="form-control" id="claimAmount"
																		onkeydown="checkAmount(event)"
																		onblur="removeValid(event)">
																</div>
															</div>

															<div class="col-md-6" id="upload">
																<label style="margin-bottom: 10px;">Add Bill</label>

																<div class="control-group position-r">
																	<label class="custom-file-upload" for="uploadDoc_0"
																		style="margin-top: 18px;"> <i class="ti-plus"></i>
																	</label>
																	<div class="controls">
																		<input type="file" class="document" id="uploadDoc_0"
																			accept=".jpeg, .jpg, .png, .pdf" name="userImage"
																			onchange="saveFile(event)">
																	</div>
																</div>
																<input type="hidden" id="uploadHidden_0"
																	class="uploadHidCls">
																<div class="d-flex align-items-center">
																	<!-- Preview of the uploaded file -->
																	<div id="uploadedBillDiv_0" align="center"
																		class="uploadedBillCls upload-ico-mrg"></div>

																	<!-- Filename of the uploaded file -->
																	<div id="imageName_0" class="imageName mrg-0"></div>

																	<!-- Placeholder for delete button -->
																	<div id="dltImage_0" class="dltImage"></div>
																</div>
															</div>

															<div class="col-md-6">
																<div class="form-group">
																	<label>Description</label>
																	<textarea class="form-control" id="claimDescription"
																		onblur="removeValid(event)"></textarea>

																</div>
															</div>
														</div>
													</div>

												</div>
											</div>

										</div>


									</div>

									<!--Right Inner Tab End-->
								</div>
							</div>
							<!--Right Sec End-->
						</div>
					</div>
					<!--Tabbination 1 End-->

				</div>
			</div>
		</div>
	</div>
</body>
</html>
