						    }

function getEmployeeList() {
	var search = null;
	if(type) {
		search = $("#sessionName").val();
	} else {
		search = $("#empName").val();
	}
	if (search) {
		$.ajax({
			type: "POST",
			url: "travel-requisition-get-employee-list",
			dataType: 'json',
			contentType: 'application/json',
			data: search,
			success: function (response) {
				if (response.message == "success") {
					if (response.body.length != 0) {
						//$("#empid").val("");
						if(type == 'self-service') {
							selectAutocompleteValueItem1(response.body[0].key,window.btoa(response.body[0].name),window.btoa(response.body[0].code))
						} else {
						$("#empNameList").css("background", "#FFF");
						var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;max-height: 200px;">';
						for (var i = 0; i < response.body.length; i++) {
							content += '<li class="autocompletedata cp" onClick="selectAutocompleteValueItem1(\''
								+ response.body[i].key
								+ '\',\''
								+ window.btoa(response.body[i].name)
								+ '\',\''
								+ window.btoa(response.body[i].code)
								+ '\')">'
								+ response.body[i].key
								+ " - "
								+ response.body[i].name
								+ '</li>';
						}
						content += '</ul>';
						$("#suggesstion-box_").show();
						$("#suggesstion-box_").html(content);
						}

					} else {
						$("#empNameList").css("background", "#FFF");
						var content = '<ul id="autocomplete-list1">';
						content += '<font-weight:100; font-size:14px; color:#ccc; background-color: #0909e4;"li onClick="selectAutocompleteValueItem()">'
							+ "No Data Found" + '</li>';
						content += '</ul>';
						$("#suggesstion-box_").show();
						$("#suggesstion-box_").html(content);
					}
				}
			},
			error: function (data) {
				console.log(data);
			}
		})
	} else {
		$("#empId").val("");
		$("#empName").val("");
		$("#designation").val("");
		$("#suggesstion-box_").hide();
	}
}

function selectAutocompleteValueItem1(empid, empName, designation) {
	if (empid) {
		//$("#error1").hide();
		$("#empName").val(window.atob(empName));
		$("#empId").val(empid);
		$("#designation").val(window.atob(designation));
		$("#empName").attr('data-procat', empid);
		$("#suggesstion-box_").hide();
	} else {
		$("#empId").val("");
		$("#empName").val("");
		$("#designation").val("");
		$("#empName").attr('data-procat', "");
		$("#suggesstion-box_").hide();

	}
}

function configureDatePicker(type) {
    var dateFormat = "d-m-Y"; // Ensure correct date format

    $("#expenseDate1").datetimepicker("destroy").datetimepicker({
        format: dateFormat,
        closeOnDateSelect: true,
        timepicker: false,
        minDate: type === "0" ? false : new Date(), // Adhoc: allow past dates, Planned: disable past dates
        maxDate: type === "0" ? new Date() : false // Adhoc: disable future dates, Planned: allow future dates
    });

    // Optional: Auto-set the current date
    $("#expenseDate1").val("").datetimepicker("reset");
}

function vieRemDetails(){
	var userid = $("#sessionId").val();
	var userrole = $("#sessionRole").val();

	for (var i = 6; i <= userrole.length; i = i + 6) {
		roleid = roleid + '"' + userrole.slice(i - 6, i)
				+ '",';
	}
	roleid = roleid.substring(0, roleid.length - 1);
	agGrid.simpleHttpRequest(
			{
				url : "reimbursement-view-through-ajax?userid="
						+ userid
						+ "&roleid="
						+ roleid+"&selftype="+type,
			}).then(function(data) {
		gridOptions.api.setRowData(data);
		
		if (data && data.length > 0) {
			gridOptions.api.getDisplayedRowAtIndex(0).setSelected(true);
			
		} else {
			if(type) {
				$("#empName").attr("disabled",true);
				getEmployeeList()
			} else {
				$("#empName").removeAttr("disabled");
			}
		}
	});
}
function cancelRem(){
	vieRemDetails();

}
