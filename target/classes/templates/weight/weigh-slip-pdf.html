.detailsec {

}

	padding: 0px;
	color: #333;
	text-align: left;
}

.newsec {
	display: block;
	float: left;
	width: 100%;
	margin-top: 15px;
}

	width: 100%;
	margin: 0 auto;
	margin-left: 15px;
	margin-right: 15px;
	margin-top: 0px;

	border-style: solid;

}

<body>
	<div class="container-fluid">
		<div class="row">
			<div class="maincontentsec">
				<div class="mainsec">
					<div class="bansec">
						<div class="leftsec">
							<img src="classpath:static/assets/images/oriclean_org_logo.png" />
						</div>
						<div class="rightsec">
							<h1 class="hdtxt" th:text="${slip[0].organization}"></h1>
							<p class="newtxt" th:text="${slip[0].orgAddress}"></p>
							<p class="newtxt" th:text="${slip[0].orgEmail}"></p>
							<p class="newtxt" th:text="${slip[0].orgPhone}"></p>
						</div>
					</div>
					<div class="clear"></div>

					<div
						style="height: 10px; margin: 0px 10px; border-top: 1px solid grey; margin-top: 10px; position: relative;">
					</div>

					<div class="secbody">

						<table class="formtable">
							<tr align="center">
								<td><div class="titletext1">WB Capacity 60 MT</div></td>

							</tr>
							<tr align="center">
								<td>
									<div class="titletext1">WEIGHING SLIP</div>
								</td>
							</tr>

						</table>

						<div class="clear"></div>

						<table class="formtable">
							<tr>
								<td width="50%">
									<table>
										<tr>
											<td class="fontStyle">Slip No:</td>
											<td th:text="${slip[0].slipNo}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Truck No:</td>
											<td th:text="${slip[0].truckNo}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Product:</td>
											<td th:text="${slip[0].product}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Challan No:</td>
											<td th:text="${slip[0].challanNo}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Transporter Name:</td>
											<td th:text="${slip[0].transName}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Vehicle Type:</td>
											<td th:text="${slip[0].vehicleType}"></td>
										</tr>

									</table>
								</td>

								<td width="50%">
									<table>
										<tr>
											<td class="fontStyle">Date:</td>
											<td th:text="${slip[0].date}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Gross Weight:</td>
											<td th:text="${slip[0].grossWt}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Tare Weight:</td>
											<td th:text="${slip[0].tarewWt}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Net Weight:</td>
											<td th:text="${slip[0].netWt}"></td>
										</tr>
										<tr>
											<td class="fontStyle">Weigh Charge(INR):</td>
											<td th:text="${slip[0].weighCharge}"></td>
										</tr>
									</table>

								</td>
							</tr>


						</table>

						<div class="clear"></div>
						<table class="formtable" style="margin-left:5px;">
							<tr>
								<td width="50%" class="fontStyle">Verified By:</td>
								<td width="50%"><strong>Operator Sign: </strong> <span th:text="${slip[0].operatorSign}"></span></td>
							</tr>
						</table>
						<div class="clear"></div>
						
						<table class="formtable" style="margin-left:5px; margin-top:5px;">
							<tr>
								<td width="10%" class="fontStyle">Remarks:</td>
								<td width="90%">
								<span th:text="${slip[0].remarkIn}"></span><br></br>
								<span th:text="${slip[0].remarkOut}"></span>
								<!-- <span th:text="${slip[0].remark}"></span> -->
								</td>
							</tr>
						</table>


					</div>
				</div>
			</div>
		</div>
	</div>

</body>
