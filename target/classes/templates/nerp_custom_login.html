<!DOCTYPE html>
<html lang="en">
<head>
<title>NERP</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/css/lib/font-awesome.min.css">
<link rel="stylesheet" href="../assets/css/extend/themify-icons.css">
<link rel="stylesheet" href="../assets/css/extend/login.css">
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script
	src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


 <style type="text/css">
.login-form-2 .ForgetPwd {
    color: #fff;
    font-weight: 600;
    text-decoration: none;
}

.login-form-1 .ForgetPwd {
    color: #ccc;
    font-weight: 600;
    text-decoration: none;
}

/* Style for loader */
.loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.8); /* Adjust transparency as needed */
    z-index: 9999; /* Ensure it's above other elements */
    display: none; /* Initially hide loader */
}

.loader-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.loader-content {
    display: inline-block;
    width: 50px;
    height: 50px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #6A2BBF;
    border-radius: 50%;
    animation: spin 2s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
<script>
    $(document).ready(function() {
        $('#newloader').show();
        document.getElementById('signin').click();
        setTimeout(function() {
            $('#newloader').hide();
        }, 80000); 
    });
</script>
</head>
<body>


 <!-- Loader -->
    <div class="loader" id="newloader">
        <div class="loader-container">
            <div class="loader-content"></div>
        </div>
    </div>

	<!-- <h2>Weekly Coding Challenge #1: Sign in/up Form</h2> -->
	<div class="container" id="container" style="display: none;">

		<div class="form-container sign-in-container">
			<form th:action="@{/login}" method="post">
				<div>
<!-- 					<img src="assets/images/login_img/logo.png" class="logo"> -->
			<img src="assets/images/login_img/logo.png" class="logo">
			
				</div>
				<div class="input-box">
					<input type="text" style="display:none"
								name="username" id="username" class="form-control"
								placeholder="User Id /Mobile No ..." th:value="${username}">
				</div>
				<div class="input-box">
				     <input type="text" style="display:none"
								name="redirectUrl" id="redirectUrl" class="form-control"
								placeholder="" th:value="${redirectUrl}">
				</div>
				<div class="input-box">
				<input type="password" style="display:none"
								name="password" id="password" class="form-control"
								placeholder="Password" th:value="${password}">
				</div>
				
				
<!-- 				<a href="/forgot-password" class="ForgetPwd" >Forgot password?</a>
 -->				
				<!-- <div class="form-group" align="center">
								<a href="/forgot-password" class="ForgetPwd">Forgot Password?</a>
							</div>
				 -->
				<div class="row">
								
							</div>
				<button type="submit" id="signin" style="display:none">Loading...</button>
				<button disabled>Loading...</button>
			</form>
		</div>
		<div class="overlay-container">
			<div class="overlay">
				<div class="overlay-panel overlay-right">
					<div class="textcontent">
					Accelerate your operational efficiency,<br> and growth not just  BUDGET…!
				</div>
				</div>
			</div>
		</div>
	</div>


</body>

</html>
