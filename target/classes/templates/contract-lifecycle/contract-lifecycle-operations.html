<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/vms/tender-management.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script type="text/javascript"
	src="../javaScript/contract/contract-lifecycle-operation.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
	defer></script>


</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="row">

								<!--Left Sec Start-->
								<div class="col-md-6 pd-r tab-transition position-relative">
									<div class="out-box">
										<div class="row d-flex  mb-20">

											<div class="col-md-10">
												<form class="d-flex search-sec flxwrap">
													<input class="form-control me-2 search_input_bar"
														placeholder="Search.." type="text" name="search"
														id="quickFilter" autocomplete="off">
													<button class="btn btn-primary go-btn"
														onclick="onQuickFilterChanged(event)" id="SearchBtn"
														type="button">Go</button>
													<button class="btn go-btn w-auto mx-2" type="button"
														onclick="resetBtn()">Reset</button>
												</form>
											</div>

											<div class="col-md-2 d-flex justify-content-end">
												<div class="btn btn-primary max-btn">
													<i class="fas fa-arrows-alt"></i>
												</div>
											</div>

										</div>


										<div class="leftSideParentContainer">
											<div id="complianceRiskGrid" class="ag-theme-alpine"
												style="height: 400px; width: 100%;"></div>
										</div>

										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
										<input type="hidden" id="docUniqueId" />
									</div>

								</div>

								<!--Right Sec Start-->
								<div class="col-md-6 pd-l tab-transition">
									<div class="out-box" id="rightSideDiv">
										<div class="btn btn-primary max-btn">
											<i class="fas fa-arrows-alt"></i>
										</div>

										<!-- Right Inner Tab Start -->
										<ul class="nav nav-pills newtab mb-20 tablistUl navbarSticky"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" href="#manageControl" role="tab">
													Contract Lifecycle Operations </a></li>
											<!-- <li class="nav-item wd-11"><a class="nav-link"
												data-bs-toggle="pill" href="#chatDetails" role="tab">
													Chat Details </a></li> -->
										</ul>

										<!-- Tab panes -->
										<div class="tab-content">
											<div id="snackbar" class="snackbar"></div>

											<!-- Contract Negotiation Tab -->
											<div id="manageControl" class="tab-pane fade show active"
												role="tabpanel">
												<div class="requisition-tbl">
													<div class="mb-2 operationBtnSticky">
														<table class="table table-bordered mb-0" width="100%">
															<tr valign="middle" class="operation-row">
																<td>
																	<div
																		class="d-flex justify-content-between align-items-center">
																		<div class="contract-info">
																			Contract Id:&nbsp;&nbsp;<span id="headercontractid"></span>
																		</div>
																		<div
																			class="features-btn d-flex justify-content-between align-items-center">
																			<div class="mr-2">
																				<button class="btn btn-primary edit-btn"
																					onclick="saveContract()" id="confirmStatusChange" type="button">
																					Save</button>
																			</div>
																			<div class="buttonsec btn-hs" id="ttbtn">
																				<!-- <button class="new-btn" id="contractClosure"
																					onclick="updateStatus('closureStatus', 'Completed')"
																					style="width: 95px !important;">Contract
																					Closure</button> -->

																				<button class="btn btn-primary edit-btn"
																					id="contractClosure"
																					onclick="updateStatus('closureStatus', 'Completed')"
																					type="button" style="width: 95px !important;">Contract
																					Closure</button>

																				<!-- <button class="new-btn" id="contractRenewal"
																					onclick="updateStatus('renewalStatus', 'Renewed')"
																					style="width: 95px !important;">Contract
																					Renewal</button> -->

																				<button class="btn btn-primary edit-btn"
																					id="contractRenewal"
																					onclick="updateStatus('renewalStatus', 'Renewed')"
																					type="button" style="width: 95px !important;">Contract
																					Renewal</button>

																				<!-- <button class="new-btn" id="contractTermination"
																					onclick="updateStatus('terminationStatus', 'Terminated')"
																					style="width: 95px !important;">Contract
																					Termination</button>
																					 -->
																				<button class="btn btn-primary edit-btn"
																					id="contractTermination"
																					onclick="updateStatus('terminationStatus', 'Terminated')"
																					type="button" style="width: 95px !important;">Contract
																					Termination</button>


																			</div>
																		</div>
																	</div>
																</td>
															</tr>
														</table>
													</div>
												</div>

												<div class="reviewchange-content">
													<div class="reviewchange-header">
														<h5 class="reviewchange-title" id="statusChangeModalLabel">Confirm
															Status Change</h5>
													</div>
													<div class="reviewchange-body">
														<p class="reviewchange-para">
															Are you sure you want to change the status to <span
																id="newStatusLabel"></span>?
														</p>

														<!-- Remark Section -->
														<div id="remarkSection" style="display: none;">
															<label for="remarkText">Remark:</label>
															<textarea id="remarkText" class="form-control" rows="3"></textarea>
														</div>

														<!-- Date and Frequency Section -->
														<div id="renewalSection" style="display: none;">
															<label for="renewalDate">Renewal Date:</label> <input
																type="date" id="renewalDate" class="form-control">

															<label for="renewalFrequency">Renewal Frequency:</label>
															<input type="text" id="renewalFrequency"
																class="form-control" placeholder="e.g., Annually">
														</div>
													</div>
													<!-- <div class="reviewchange-footer">
														<button type="button" class="btn btn-secondary"
															data-bs-dismiss="modal">Cancel</button>
														<button type="button" class="btn btn-primary"
															id="confirmStatusChange">Confirm</button>
													</div> -->
												</div>
											</div>

											<!-- Chat Details Tab -->
										</div>
									</div>
								</div>
							</div>
						</div>

					</div>

				</div>
			</div>

		</div>
	</div>
</body>
</html>
