<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/vms/tender-management.css" />
<link rel="stylesheet" href="../assets/css/vms/contract-repo.css" />
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script type="text/javascript"
	src="../javaScript/contract/contract-repository.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
	defer></script>


</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="tab-content">

						<!--Tabbination 1 Start-->
						<div id="opd" class="tab-pane active">
							<div class="row">

								<!--Left Sec Start-->
								<div class="col-md-6 pd-r tab-transition position-relative">
									<div class="out-box">
										<div class="row d-flex  mb-20">

											<div class="col-md-10">
												<form class="d-flex search-sec flxwrap">
													<input class="form-control me-2 search_input_bar"
														placeholder="Search.." type="text" name="search"
														oninput="onQuickFilterChanged()" id="quickFilter"
														autocomplete="off">
													<button class="btn btn-primary go-btn"
														onclick="onQuickFilterChanged()" id="SearchBtn"
														type="button">Go</button>
												</form>
											</div>

											<div class="col-md-2 d-flex justify-content-end">
												<div class="btn btn-primary max-btn">
													<i class="fas fa-arrows-alt"></i>
												</div>
											</div>

										</div>


										<div class="leftSideParentContainer">
											<div id="header">
												<div id="breadcrumb"></div>

												<button id="backButton">
													<svg xmlns="http://www.w3.org/2000/svg" width="16"
														height="16" fill="currentColor"
														class="bi bi-arrow-90deg-left" viewBox="0 0 16 16">
								<path fill-rule="evenodd"
															d="M1.146 4.854a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H12.5A2.5 2.5 0 0 1 15 6.5v8a.5.5 0 0 1-1 0v-8A1.5 1.5 0 0 0 12.5 5H2.707l3.147 3.146a.5.5 0 1 1-.708.708z" />
							</svg>
												</button>
											</div>
											<div id="folderView"></div>
										</div>

										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
										<input type="hidden" id="docUniqueId" />
									</div>

								</div>

								<!--Right Sec Start-->
								<div class="col-md-6 pd-l tab-transition">
									<div class="out-box" id="rightSideDiv">
										<div class="btn btn-primary max-btn">
											<i class="fas fa-arrows-alt"></i>
										</div>

										<!-- Right Inner Tab Start -->
										<ul class="nav nav-pills newtab mb-20 tablistUl navbarSticky"
											role="tablist">
											<li class="nav-item wd-11"><a class="nav-link active"
												data-bs-toggle="pill" id="manageTab" href="#manageControl">Repository</a></li>

										</ul>

										<!-- Tab panes -->
										<div class="tab-content">
											<div id="snackbar" class="snackbar"></div>
											<div id="manageControl"
												class="tab-pane fade show active operational-tabs">
												<div class="requisition-tbl">
													<div class="mb-2 operationBtnSticky">
														<table class="table table-bordered mb-0" width="100%">
															<tr valign="middle" class="operation-row">
																<td>
																	<div
																		class="d-flex justify-content-end align-items-center">
																		
																		<div
																			
																			class="features-btn d-flex justify-content-end align-items-center">
																			<!-- <div class="mr-2">
																				<button class="btn btn-primary edit-btn" onclick="saveTenderData()" type="button" id="tenderSave-btn">Add</button>
																			</div> -->
																			<div class="mr-2">
																				<button class="btn btn-primary edit-btn" onclick="addFolder()" type="button" id="tenderSave-btn">Save</button>
																			</div>


																		</div>
																	</div>
																</td>
															</tr>
														</table>
													</div>
												</div>

												<div class="logs-content">
													<div class="logs-header">
														<div class="row">
																<div class="col-md-4">
																	<div class="form-group">
																		<label for="templateName">Folder Name <span
																			class="required-asterisk">*</span></label> <input type="text"
																			class="form-control" id="FolderName"
																			placeholder="Enter Folder Name" autocomplete="off"
																			required
																			oninput="clearValidationMessage()">

																		<span id="templateNameError" class="text-danger"></span>

																	</div>
																</div>
																</div>

													</div>
												</div>


											</div>

										</div>
									</div>
								</div>
							</div>
						</div>

					</div>

				</div>
			</div>

		</div>
	</div>
</body>
</html>
