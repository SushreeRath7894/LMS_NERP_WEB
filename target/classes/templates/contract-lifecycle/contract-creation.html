<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>


<link rel="stylesheet" href="../assets/css/vms/tender-management.css" />

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<script type="text/javascript"
	src="../javaScript/contract/contract-creation.js"></script>

<script
	src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/ckeditor.js" defer></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"
	defer></script>


</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">

					<!--Tabbination 1 Start-->
					<div id="opd" class="tab-pane active">
						<div class="d-flex flex-column flex-lg-row">

							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">

										<div class="col-md-8 col-12">
											<form class="d-flex search-sec">
												<input class="form-control me-2 search_input_bar"
													placeholder="Search.." type="text" name="search"
													id="quickFilter" autocomplete="off">
												<button class="btn btn-primary go-btn"
													onclick="onQuickFilterChanged()" id="SearchBtn"
													type="button">Go</button>
												<button class="btn go-btn w-auto mx-2" type="button"
													onclick="resetBtn()">Reset</button>
											</form>
										</div>

										<div class="col-md-2 d-flex justify-content-end">
											<button alt="Maximize" class="btn btn-primary max-btn"
												id="collapseButtonR1" onclick="triggerExpansionR(1)"
												data-bs-toggle="tooltip" data-bs-placement="top"
												title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>

									</div>


									<div class="card p-2 m-2">

										<div class="requisition-tbl table-responsive">
											<div id="templateDetailsMainGrid" class="ag-theme-alpine"
												style="height: 400px; width: 100%;"></div>
										</div>

										<input type="hidden" id="userId" th:value="${session.USER_ID}" />
										<input type="hidden" id="docUniqueId" />
									</div>
								</div>

							</div>

							<!--Right Sec Start-->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div
										class="d-flex flex-row-reverse justify-content-between align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>

										<!-- Right Inner Tab Start -->
										<div class="d-flex gap-2">
											<ul class="nav nav-pills newtab" role="tablist">
												<li class="nav-item wd-11"><a class="nav-link active"
													data-bs-toggle="pill" id="manageTab" href="#manageControl">Create
														Contract</a></li>
												<li class="nav-item wd-11"><a class="nav-link"
													data-bs-toggle="pill" id="voucherclassTab"
													href="#voucherclass">Contract Section</a></li>
												<!-- <li class="nav-item wd-11"><a class="nav-link"
												data-bs-toggle="pill" id="TDSTab" href="#TDS"></a></li> -->
											</ul>
										</div>
									</div>

									<!-- Tab panes -->
									<div class="tab-content flex-fill h-25">
										<div id="snackbar" class="snackbar"></div>
										<div id="manageControl"
											class="tab-pane fade show active operational-tabs p-2 h-100">
											<div class="requisition-tbl d-flex flex-column h-100">
												<div class="mb-2 operationBtnSticky">
													<table class="table table-bordered mb-0" width="100%">
														<tr valign="middle" class="operation-row">
															<td width="40%"><strong>Contract Id:</strong><span
																id="headercontractid"></span></td>
															<td>
																<div class="d-flex justify-content-end flxwrap">
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn" type="button"
																			id="add-btn" onclick="addCntract()">Add</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn"
																			onclick="saveContractData()" type="button"
																			id="tenderSave-btn">Save</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn" style="display:none;"
																			onclick="cancelContractBtn()" type="button"
																			id="cancel-contract-btn">Cancel</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn" type="button"
																			id="publishTender" onclick="publishContract()">Publish
																			Contract</button>
																	</div>
																	<div class="mr-2">
																		<button class="btn btn-primary edit-btn" type="button"
																			id="next-btn-1"
																			onclick="nextBtnFunction('voucherclass')">Next</button>
																	</div>
																</div>
															</td>
														</tr>
													</table>
												</div>
												<div class="card p-2">
													<div class="tender-content">
														<div class="tender-header"></div>
														<div class="contract-content">
															<div class="review-header"></div>
															<div class="contract-body mb-scroll">
																<h5 class="sub-header-new" id="reviewModalLabel"
																	style="margin-bottom: 25px;">Add Contract Data</h5>

																<div class="row">
																	<div class="col-md-4">
																		<div class="form-group">
																			<label for="templateName">Template Name <span
																				class="required-asterisk">*</span></label> <input
																				type="text" class="form-control" id="templateName"
																				placeholder="Enter Template Name" autocomplete="off"
																				required
																				oninput="clearValidationMessage('templateNameError')">

																			<span id="templateNameError" class="text-danger"></span>

																		</div>
																	</div>



																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Template Effective Date <span
																				class="required-asterisk">*</span></label> <input
																				type="datetime-local" class="form-control"
																				id="effectiveDate" placeholder="Enter date"
																				name="effectiveDate"
																				oninput="clearValidationMessage('effectiveDateError')">
																			<span id="effectiveDateError" class="text-danger"></span>

																		</div>
																	</div>
																	<div class="col-md-4">
																		<div class="form-group">
																			<label>Template Created Date</label> <input
																				type="datetime-local" class="form-control" id="date"
																				placeholder="Enter date" name="date">
																		</div>
																	</div>
																	<!-- <div class="col-lg-2">
												<label>SELECT TENDER</label>
												<div class="select">
													<select id="tenderId" class="month-dropdown"
														style="height: unset;" onchange="getVendorList(this.val);">
														<option value="">-SELECT-</option>
														<option th:each="c,iter:${tenderList}" th:value="${c.key}"
															th:text="${c.name}"></option>
													</select>
												</div>
											</div> -->
																	<div class="col-md-4">
																		<label for="tenderId">Select Tender <span
																			class="required-asterisk">*</span></label>
																		<div class="select">
																			<select id="tenderId" class="month-dropdown"
																				style="height: unset;"
																				onchange="clearValidationMessage('tenderIdError'); getVendorList('');">
																				<option value="">-SELECT-</option>
																				<option th:each="c,iter:${tenderList}"
																					th:value="${c.key}" th:text="${c.name}"></option>
																			</select>
																		</div>
																		<span id="tenderIdError" class="text-danger"></span>
																	</div>



																	<!-- 	<div class="col-lg-2">
												<label>SELECT Vendor</label>
												<div class="form-group">
													<div class="select">
														<select id="vendorId">
															<option th:value="NULL">Select Vendor</option>
															<option th:each="c,iter:${vendorList}"
																th:value="${c.key}" th:text="${c.name}"></option>

														</select>
													</div>
												</div>
											</div> -->
																	<div class="col-md-4">
																		<label for="vendorId">Select Vendor <span
																			class="required-asterisk">*</span></label>
																		<div class="form-group">
																			<div class="select">
																				<select id="vendorId"
																					onchange="clearValidationMessage('vendorIdError');">
																					<option th:value="NULL">Select Vendor</option>
																					<option th:each="c,iter:${vendorList}"
																						th:value="${c.key}" th:text="${c.name}"></option>
																				</select>
																			</div>
																		</div>
																		<span id="vendorIdError" class="text-danger"></span>
																	</div>


																	<div class="col-md-4">
																		<div class="form-group">
																			<label for="status">Status</label> <select
																				class="form-control" id="status" name="status">
																				<option value="1">Active</option>
																				<option value="0">Inactive</option>
																			</select>
																		</div>
																	</div>

																	<!-- <div class="col-lg-12">
												<div class="form-group">
													<label>Description</label>
													<textarea class="ckeditor" id="tenderEditor"></textarea>
												</div>
											</div> -->

																	<div class="col-lg-12">
																		<div class="form-group">
																			<label>Description <span
																				class="required-asterisk">*</span></label>
																			<textarea class="ckeditor" id="tenderEditor"></textarea>
																			<span id="tenderEditorError" class="text-danger"></span>
																		</div>
																	</div>

																</div>
																<!-- Dynamic content will be injected here -->
																<div class="col-lg-12">
																	<input type="hidden" id="contractId">
																	<button id="addMuliSection"
																		class="btn btn-success mb-2 mt-2">+ Add
																		Template Section</button>
																	<div id="sectionContainer"></div>
																	<div id="sectionEditView" class="sections-wrapper"></div>
																</div>
															</div>

															<!-- <div class="modal-footer">
														<button class="btn btn-secondary btn-clr" id="saveData"
															onclick="saveContractData()">Save</button>
														<button type="button" class="btn btn-secondary"
															data-bs-dismiss="modal">Close</button>
													</div> -->
														</div>
													</div>

												</div>
											</div>
										</div>

										<di id="voucherclass" class="tab-pane fade p-2 h-100">
										<div class="requisition-tbl d-flex flex-column h-100">
											<div class="mb-2 operationBtnSticky">
												<table class="table table-bordered mb-0" width="100%">
													<tr valign="middle" class="operation-row">
														<td>
															<div class="d-flex justify-content-end flxwrap">
																<!-- <div class="mr-2">
																			<button
																				class="btn btn-primary operation-btn operation-btn-active"
																				type="button" id="add-btn" onclick="addTender()">Add</button>
																		</div> -->
																<div class="mr-2">
																	<button class="btn btn-primary edit-btn" type="button"
																		id="next-btn-1"
																		onclick="nextBtnFunction('manageControl')">Previous</button>
																</div>
																<div class="mr-2">
																	<button class="btn btn-primary edit-btn hidden"
																		id="addCriteria" onclick="addCriteria()">Add
																		Content</button>
																	<input type="hidden" class="form-control"
																		id="editTktId">
																</div>

																<div class="mr-2">
																	<button class="btn btn-primary edit-btn hidden"
																		id="addSection" onclick="addSection()">Add
																		Content</button>
																</div>

																<div class="mr-2">
																	<button class="btn btn-primary edit-btn hidden"
																		id="previewSection"
																		onclick="openReviewModal('previewPdf')">Preview
																		Section</button>
																</div>

																<div class="mr-2">
																	<button class="btn btn-primary edit-btn hidden"
																		id="downloadPdf" onclick="downloadPdf('downloadPdf')">Pdf</button>
																</div>

																<div class="mr-2">

																	<button class="btn btn-primary edit-btn hidden"
																		id="saveStatus" onclick="saveStatus()">Save</button>
																</div>

																<div class="mr-2">
																	<button class="new-btn hidden" id="cancelTender"
																		onclick="cancelTender()">Cancel</button>
																</div>

															</div>
														</td>
													</tr>
												</table>
											</div>
											<div class="card p-2">
												<div class="template-section-container">

													<div id="templateDetailsGrid"
														class="ag-theme-alpine hidden mb-2"
														style="height: 0; width: 100%;"></div>
													<div id="templateSectionGrid"
														class="ag-theme-alpine hidden"
														style="height: 0; width: 100%;"></div>



													<div class="templateSection-content mt-3"
														style="display: none">
														<div class="templateSection-header">
															<div class="template-header-section">
																<h5 class="sub-header-new" id="exampleModalLabel">Template
																	Sections</h5>
																<input type="hidden" id="tenderId">
															</div>
															<div class="template-icon-btn">
																<i class="fa-solid fa-floppy-disk save-section"
																	onclick="saveSections()"></i> <i
																	class="bi bi-x-circle-fill cancel-section-btn"
																	onclick="cancelTemplateSection()"></i>

															</div>
															<!-- <button type="button" class="btn-close"
															data-bs-dismiss="modal" aria-label="Close"></button> -->
														</div>
														<div class="templateSection-body mb-scroll">
															<table class="table table-bordered"
																id="dynamicSectionTable">
																<thead>
																	<tr>
																		<th>Sl No</th>
																		<th>Section Name</th>
																	</tr>
																</thead>
																<tbody>
																	<!-- Dynamic rows will be injected here -->
																</tbody>
															</table>
														</div>
														<!-- 	<div class="templateSection-footer">
														<button type="button" class="btn btn-secondary"
															data-bs-dismiss="modal">Close</button>
														<button type="button" class="btn btn-primary"
															onclick="saveSections()">Save</button>
													</div> -->
													</div>


													<div class="modal fade" id="reviewModal" tabindex="-1"
														aria-labelledby="reviewModalLabel" aria-hidden="true">
														<div class="modal-dialog modal-xxl">
															<div class="modal-content">
																<div class="modal-header">
																	<h5 class="modal-title" id="reviewModalLabel">Review
																		Contract Data</h5>
																	<button type="button" class="btn-close"
																		data-bs-dismiss="modal" aria-label="Close"></button>

																</div>
																<div class="review-header">
																	<img
																		src="https://www.financialexpress.com/wp-content/uploads/2022/05/OMC.png"
																		alt="Company Logo" class="company-logo">
																	<h2 class="company-name">OMC</h2>
																</div>
																<div class="modal-body mb-scroll"></div>
																<div class="modal-footer">
																	<button type="button" class="btn btn-secondary"
																		data-bs-dismiss="modal">Close</button>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>


								</div>
							</div>
						</div>


					</div>

				</div>

			</div>
		</div>

	</div>
	</div>
</body>
</html>
