<style>
.billing-card {
	border-radius: 10px;
	box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
	margin-bottom: 20px;
}

.billing-table {
	margin-bottom: 0;
}

.billing-table th {
	font-weight: 600;

}

.category-header {
	cursor: pointer;
	transition: background-color 0.2s;
}

.category-header:hover {
	background-color: #f1f1f1;
}

.expand-btn {
	background: none;
	border: none;
	font-size: 1.2rem;
	cursor: pointer;
	transition: transform 0.3s;
}

.expanded .expand-btn {
	transform: rotate(45deg);
}

.child-row {
	background-color: #f9f9f9;
}

.child-row td {
	padding-left: 40px !important;
}

.total-row {
	font-weight: bold;
	background-color: #e9ecef;
}

#bill2-table th {
	font-weight: bold !important;
}

@media ( max-width : 768px) {
	.billing-table td:nth-child(2), .billing-table th:nth-child(2) {
		display: none;
	}
	.child-row td {
		padding-left: 20px !important;

<script>
$(document).ready(function() {
    var gridDiv = document.querySelector('#myGrid');
    new agGrid.Grid(gridDiv, gridOptions);
    gridOptions.api.setRowData([]);

    getItemListAjax();
    getPayModeListAjax();

    $("#quickFilter").on("keydown", function(event) {
        if (event.key === "Enter" || event.which === 13) {
            event.preventDefault();
            onQuickFilterChanged();
        }
    });

    $(".br-s-btn-tx").hide();
    $("#demo").hide();
    $("#cancel").hide();
    $("#save").hide();
});


var columnDefs = [{
        headerCheckboxSelection: false,
        headerCheckboxSelectionFilteredOnly: false,
        checkboxSelection: true,
        width: 8,
        sortable: false,
        filter: false,
        resizable: true,
        pinned: 'left',
    },
    {
        headerName: "Booking ID",
        field: "bookingId",
    },
    {
        headerName: "Patient ID",
        field: "patientId",
    },
    {
        headerName: "Patient Name",
        field: "patientName"
    },
    {
        headerName: "Age",
        field: "age"
    },
    {
        headerName: "Mobile",
        field: "mobNo"
    }, {
        headerName: "Payment Status",
        field: "pay_status",
        flex: 1,
        hide: true,
        cellRenderer: function(params) {
            if (params.data.pay_status == "Fully Paid") {
                return '<a style="color:blue !important;font-weight: bold;">Fully Paid</a>';
            } else if (params.data.pay_status == "Not Paid") {
                return '<a  style="color:red !important;font-weight: bold;">Not Paid</a>';
            } else if (params.data.pay_status == "Partial Paid") {
                return '<a style="color:black !important;font-weight: bold;">Partial Paid</a>';
            }
        }
    }
];

// Define grid options
var gridOptions = {
    columnDefs: columnDefs,
    rowSelection: 'single',
    suppressRowClickSelection: true,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        flex: 1
    },
    pagination: true,
    paginationPageSize: 15,
    onSelectionChanged: rowSelect
};

let patientId = "";
function rowSelect(event) {
    var selectedRows = event.api.getSelectedRows(); // safer access
    var selectedData = selectedRows.map(node => node.data);
    var rowCount = selectedData.length;

    if (selectedRows.length > 0) {
        patientId = selectedRows[0].patientId;
        $("#customerHeadNameBS").text(selectedRows[0]?.patientName);
        editOpdDetails(patientId);
        getBalanceSheet(selectedRows[0].bookingId);
        getPaymenDetails(selectedRows[0].bookingId);
        getOrderList(selectedRows[0].bookingId);
        closeOrderDetails()
    } else {
        $("#patientName").val('');
        $("#age").val('');
        $("#gender").val('');
        $("#mobNo").val('');
        $("#email").val('');
        $("#address").val('');
        $("#wordNo").val('');
        $("#bedNo").val('');
        $("#roomNo").val('');
        $("#consuDoctor").val('');
        $("#department").val('');
        $("#admitDate").val('');
        $("#customerHeadNameBS").text('');
        gridOptionsBS.api.setRowData([]);
    }
}

let globalCategoryList = [];
function getItemListAjax() {

    agGrid.simpleHttpRequest({
        url: 'opd-billing-get-category-list'
    }).then(function(data) {
    	if(data.code === 'success') {
    		globalCategoryList = data.body;
    	} else {
    		globalCategoryList = []
    	}
    	getAllPatientsDetails();
    })
}

let globalPayModeList = [];
function getPayModeListAjax() {

    agGrid.simpleHttpRequest({
        url: 'his-billing-pharmacy-get-paymode-list'
    }).then(function(data) {
    	if(data.code === 'success') {
    		globalPayModeList = data.body;
    	} else {
    		globalPayModeList = []
    	}
    	paymentDetails();
    })
}

function getAllPatientsDetails() {
    var fromdate = 1234;
    var todate = 1234;

    agGrid.simpleHttpRequest({
        url: "opd-billing-manage-view?fromdate=" + fromdate + "&todate=" + todate
    }).then(function(response) {
        if (response.message === "Success") {

            const responseBody = JSON.parse(response.body);
            const patientData = responseBody.OPDRecords;

            if (patientData && patientData.length > 0) {
            	gridOptions.api.setRowData(patientData);
            	gridOptions.api.forEachNode(function(node) {
                    if (node.rowIndex === 0) {
                        node.setSelected(true);
                    }
                });
            	addBill()
            } else {
            	$("#customerHeadNameBS").text('');
            	gridOptionsBS.api.setRowData([]);
            }

        } else {
            console.error("Failed to fetch data");
            $("#customerHeadNameBS").text('');
            gridOptionsBS.api.setRowData([]);
        }
    });
}

function onQuickFilterChanged() {
    gridOptions.api
        .setQuickFilter(document.getElementById('quickFilter').value);
    setTimeout(() => {
        if (gridOptions.api) {
            gridOptions.api.getDisplayedRowAtIndex(0)?.setSelected(true);
        }
    }, 300);
}


function editOpdDetails(patientId) {
    $.ajax({
        type: "GET",
        url: "opd-billing-details-edit?Id=" + patientId,
        async: false,
        success: function(response) {
            if (response.code === "success") {
                const opdDetails = JSON.parse(response.body).opdDetails;

                if (opdDetails == null) {
                    $("#patientName").val('');
                    $("#age").val('');
                    $("#gender").val('');
                    $("#mobNo").val('');
                    $("#email").val('');
                    $("#address").val('');
                    $("#wordNo").val('');
                    $("#bedNo").val('');
                    $("#roomNo").val('');
                    $("#consuDoctor").val('');
                    $("#department").val('');
                    $("#admitDate").val('');

                } else {
                    $("#patientName").val(opdDetails[0].patientName);
                    $("#age").val(opdDetails[0].age);
                    $("#gender").val(opdDetails[0].gender);
                    $("#mobNo").val(opdDetails[0].mobNo);
                    $("#email").val(opdDetails[0].email);
                    $("#address").val(opdDetails[0].address);
                    $("#wordNo").val(opdDetails[0].wordNo);
                    $("#bedNo").val(opdDetails[0].bedNo);
                    $("#roomNo").val(opdDetails[0].roomNo);
                    $("#consuDoctor").val(opdDetails[0].consuDoctor);
                    $("#department").val(opdDetails[0].department);
                    $("#admitDate").val(opdDetails[0].admitDate);

                }


            }

        },
        error: function(error) {
            console.error("Error fetching patient details:", error);
        }
    });
}

function nextTab(id) {
    const tabElement = document.querySelector('#' + id + ' a');
    const tab = new bootstrap.Tab(tabElement);
    tab.show();
}

let newBill2Id = 0;
function addBill() {

    let dataset = []
    $("#bill2-table tbody tr.bill2-parent-class").each(function(index) {
        let a = {
            category_id: $(this).find('.category').val(),
            sku_desc: $(this).find('.sku_desc').val(),
            quantity: $(this).find('.quantity').val(),
            amount: $(this).find('.amount').val(),
            bill_date: $(this).find('.bill_date').val(),
        };
        dataset.push(a);
    });

    for (let i = 0; i < dataset.length; i++) {
        const item = dataset[i];

        if (!item.category_id) {
            toastr.error("Category Required");
            return;
        }
        if (!item.sku_desc) {
            toastr.error("Description Required");
            return;
        }
        if (!item.quantity) {
            toastr.error("Quantity Required");
            return;
        }
        if (!item.amount) {
            toastr.error("Amount Required");
            return;
        }
        if (!item.bill_date) {
            toastr.error("Bill Date Required");
            return;
        }
    }
    
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
    const year = today.getFullYear();

    const formattedDate = `${day}-${month}-${year}`;

    const rows = document.querySelectorAll('#bill2-tbody tr');
    let c = 0;
    rows.forEach((row, index) => {
        //const inputs = row.querySelectorAll('input, select, textarea');
        //const classInp = row.querySelectorAll('.quantity,.discount');
        //inputs.forEach(el => el.disabled = true);
        //classInp?.forEach(el => el.disabled = false);
        c++;
    });

    let dropdownOptions = `<option></option>`;
    let dropdownOptions1 = `<option></option>`;
    globalCategoryList.forEach(kra => {
        dropdownOptions += `<option value="${kra.key}">${kra.name}</option>`;
    });

    const newRow = $(`
			<tr class="bill2-parent-class" data-bill2-id="${newBill2Id}">
				<td style="text-align: center" class="slno-td">${c+1}</td>
				<td>
					<select class="form-control category kra-select2" onchange=getSkuDetails(${newBill2Id})>
						${dropdownOptions}
					</select>
				</td>
				<td>
					<select class="form-control sku_desc" onchange=setValue(${newBill2Id})>
					</select>
				</td>
				<td>
					<input type="text" class="form-control quantity" onkeyup=calculateLineTotal(${newBill2Id})>
					<input type="hidden" class="unitid"><input type="hidden" class="prodid"><input type="hidden" class="gstRate">
				</td>
				<td>
					<input type="text" class="form-control amount" readonly>
				</td>
				<td>
					<input type="text" class="form-control bill_date" value="${formattedDate}" readonly>
				</td>
				<td>
					<button class="btn go-btn remove-kra mr-2" onclick=removeBill2Row(${newBill2Id})>
						<i class="fas fa-trash"></i>
					</button>
				</td>
			</tr>
		`);


    $('#bill2-table tbody').append(newRow);

    newRow.find('.category').select2({
        placeholder: "Category",
        allowClear: true,
        width: '100%'
    });
    newRow.find('.sku_desc').select2({
        placeholder: "Description",
        allowClear: true,
        width: '100%'
    });

    newBill2Id = newBill2Id + 1;
}

function removeBill2Row(i){
	  let c = 0;
	  $("#bill2-table tbody tr").each(function(index) {
		  c++;
	  })
	  if(c === 1) {
		  toastr.error("Action Failed: Single Row Deletion Is Restricted");
		  return;
	  } else {
		  document.querySelectorAll('tr[data-bill2-id="'+i+'"]')?.forEach(tr => tr.remove());
		  $("#bill2-table tbody tr").each(function(index) {
			  $(this).find('.slno-td').text(index+1);
		  })
	  }
	  
}

function getSkuDetails(i) {
	
	const amountEl = document.querySelector('tr[data-bill2-id="' + i + '"] .amount');
	if (amountEl) amountEl.value = '0.00';
	
	const quantityEl = document.querySelector('tr[data-bill2-id="' + i + '"] .quantity');
	if (quantityEl) quantityEl.value = '';
	
	const unitEl = document.querySelector('tr[data-bill2-id="' + i + '"] .unitid');
	if (unitEl) unitEl.value = ''
	
	const prodEl = document.querySelector('tr[data-bill2-id="' + i + '"] .prodid');
	if (prodEl) prodEl.value = ''
	
	const gstRateEl = document.querySelector('tr[data-bill2-id="' + i + '"] .gstRate');
	if (gstRateEl) gstRateEl.value = ''
	
	let selectedData = document.querySelector('tr[data-bill2-id="'+i+'"] select.category');
	let selectElement = document.querySelector('tr[data-bill2-id="'+i+'"] select.sku_desc');
	let category_id = selectedData?.value;
	
	selectElement.innerHTML = '<option></option>';
	
	agGrid.simpleHttpRequest({
        url: "opd-billing-get-sku-list?cat_id=" + category_id
    }).then(function(resp) {
        if (resp.code === "success") {
        	let options = resp.body;
        	if(selectElement && options && options?.length > 0) {
        		options.forEach(opt => {
        		    const newOption = document.createElement('option');
        		    newOption.value = opt.skuId;
        		    newOption.text = opt.skuName;
        		    newOption.setAttribute('data-prod', opt.productId);
        		    newOption.setAttribute('data-unit', opt.unitId);
        		    newOption.setAttribute('data-unitname', opt.unitName);
        		    newOption.setAttribute('data-gst', opt.gstRate);
        		    newOption.setAttribute('data-price', opt.price);

        		    selectElement.appendChild(newOption);
        		});
        	}
        }
    })
}

let selectedIndex = '';
function setValue(i) {
	selectedIndex = i;
	
	let selectedData = document.querySelector('tr[data-bill2-id="'+i+'"] select.sku_desc');
	let sku_id = selectedData?.value;
	
	const amountEl = document.querySelector('tr[data-bill2-id="' + i + '"] .amount');
	const quantityEl = document.querySelector('tr[data-bill2-id="' + i + '"] .quantity');
	const unitEl = document.querySelector('tr[data-bill2-id="' + i + '"] .unitid');
	const prodEl = document.querySelector('tr[data-bill2-id="' + i + '"] .prodid');
	const gstRateEl = document.querySelector('tr[data-bill2-id="' + i + '"] .gstRate');
	
	if(!sku_id) {
		if (amountEl) amountEl.value = '0.00';
		if (quantityEl) quantityEl.value = '';
		if (unitEl) unitEl.value = '';
		if (prodEl) prodEl.value = '';
		if (gstRateEl) gstRateEl.value = '';
		return;
	}
	
	let selectedOption = selectedData?.options[selectedData.selectedIndex];
	let prod_id = selectedOption?.getAttribute('data-prod');
	let unit_id = selectedOption?.getAttribute('data-unit');
	let unit_name = selectedOption?.getAttribute('data-unitname');
	let gstRate = selectedOption?.getAttribute('data-gst');
	let price = selectedOption?.getAttribute('data-price');
	
	if (amountEl) amountEl.value = price;
	if (unitEl) unitEl.value = unit_id;
	if (prodEl) prodEl.value = prod_id;
	if (gstRateEl) gstRateEl.value = gstRate;
}


function cancelBill() {
    $("#demo").hide();
    $("#cancel").hide();
    $("#save").hide();
    $("#billing-table").removeClass('d-none');
    $("#add").show();
    $("#saveBill").show();
}

function saveBillTotal() {
    let grandTotal = 0;
    const dataset = [];

    const $rows = $("#bill2-table tbody tr.bill2-parent-class");

    $rows.each(function () {
        const $row = $(this);
        const qty = parseFloat($row.find('.quantity').val()) || 0;
        const price = parseFloat($row.find('.amount').val()) || 0;
        const gstRate = parseFloat($row.find('.gstRate').val()) || 0;

        const totalPrice = qty * price;
        const halfGst = (gstRate / 2) / 100 * totalPrice;
        const lineTotal = totalPrice + 2 * halfGst;

        grandTotal += lineTotal;

        dataset.push({
            slno: $row.find('.slno-td').text(),
            category_id: $row.find('.category').val(),
            sku_id: $row.find('.sku_desc').val(),
            prod_id: $row.find('.prodid').val(),
            unit_id: $row.find('.unitid').val(),
            gst_rate: gstRate,
            price: price,
            qty: qty,
            bill_date: $row.find('.bill_date').val(),
            total_price: totalPrice,
            cgst: halfGst,
            sgst: halfGst,
            igst: 0,
            line_total: lineTotal
        });
    });

    // Validation
    for (const item of dataset) {
        if (!item.category_id) return showError("Category Required");
        if (!item.sku_id) return showError("Description Required");
        if (!item.qty) return showError("Quantity Required");
        if (!item.price) return showError("Amount Required");
        if (!item.bill_date) return showError("Bill Date Required");
    }

    const selectedRows = gridOptions.api.getSelectedRows();
    const custId = selectedRows?.[0]?.patientId || '';
    const bookId = selectedRows?.[0]?.bookingId || '';

    const payload = {
        itemList: dataset,
        custId,
        bookId,
        grandTotal
    };

    //console.log("Grand Total:", grandTotal);
    //console.log("Payload:", payload);

    showLoader();

    $.ajax({
        type: "POST",
        url: "opd-billing-save",
        contentType: "application/json",
        data: JSON.stringify(payload),
        success: (resp) => {
            hideLoader();
            if (resp.code === 'success') {
                toastr.success("Bill Added Successfully");
                //getAllPatientsDetails();
                getBalanceSheet(payload?.bookId);
                nextTab('balsheet-tab')
            } else {
                toastr.error(resp.message);
            }
        },
        error: (err) => {
            console.error(err);
            toastr.error('Something Went Wrong');
            hideLoader();
        }
    });
}

function backToPrevPage() {
	nextTab('bills-tab')
}

function billingPrevious() {
	nextTab('balsheet-tab');
}

function toNextPage() {
	nextTab('paymentDetailsLi');
}
</script>

																		<label>Gender <span class="mandatory">*</span></label>
																		<select id="gender" class="form-select" disabled>
																			<option value="">Select</option>
																			<option th:each="c,iter:${genderList}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>
																<div class="col-md-3">
																	<div class="form-group">
																		<label>Mobile No</label> <input type="text"
																			class="form-control" id="mobNo" disabled>
																	</div>
																</div>
																<div class="col-lg-4 mt-2">
																	<div class="form-group">
																		<label>Email Id</label> <input type="text" id="email"
																			class="form-control" disabled>
																	</div>
																</div>
																<div class="col-md-4 mt-2">
																	<div class="form-group">
																		<label>Ward No</label> <input type="text"
																			class="form-control" id="wordNo" disabled>
																	</div>
																</div>

																<div class="col-md-4 mt-2">
																	<div class="form-group">
																		<label>Bed No</label> <input type="text"
																			class="form-control" id="bedNo" disabled>
																	</div>
																</div>
																<div class="col-md-4 mt-2" style="display: none;">
																	<div class="form-group">
																		<label>Room No</label> <input type="text"
																			class="form-control" id="roomNo" disabled>
																	</div>
																</div>
																<div class="col-md-4 mt-2">
																	<div class="form-group">
																		<label>Consultant Doctor</label> <input type="text"
																			class="form-control" id="consuDoctor" disabled>
																	</div>
																</div>
																<div class="col-md-4 mt-2">
																	<div class="form-group">
																		<label>Department</label> <input type="text"
																			class="form-control" id="department" disabled>
																	</div>
																</div>
																<div class="col-md-4 mt-2">
																	<div class="form-group">
																		<label>Admit Date</label> <input type="text"
																			class="form-control" id="admitDate" disabled>
																	</div>
																</div>
																<div class="col-md-12 mt-2">
																	<div class="form-group">
																		<label>Address</label>
																		<textarea name="Address" class="form-control"
																			id="address" style="height: 80px;" disabled></textarea>
																	</div>
																</div>
															</div>
														</div>
													</div>
												</div>

												<div class="tab-pane  h-100 p-2" id="billing"
													role="tabpanel">
													<div class="requisition-tbl d-flex flex-column h-100">
														<div class="mb-2 table-responsive">
															<table class="table table-bordered mb-0" width="100%">
																<tbody>
																	<tr valign="middle">
																		<td width="50%"></td>
																		<td>
																			<div class="d-flex justify-content-end flxwrap">
																				<button class="btn btn-primary edit-btn"
																					type="button" onclick="nextTab('information-tab')">Prev</button>
																				<button class="btn btn-primary edit-btn br-s-btn-nt"
																					title="Save" id="saveBill"
																					onclick="saveBillTotal()">Save</button>
																				<button class="btn btn-primary edit-btn"
																					type="button" onclick="nextTab('balsheet-tab')">Next</button>
																			</div>

																		</td>
																	</tr>
																</tbody>
															</table>
														</div>

														<div class="card p-2">
															<div class="col-md-12">
																<div
																	class="d-flex gap-1 task-btn-sec justify-content-end mb-1">
																	<button
																		class="border-0 btn-transition btn btn-outline-primary br-m-btn-nt"
																		title="Add" id="add" onclick="addBill()">
																		<i class="fa fa-plus-square" aria-hidden="true"></i>
																	</button>
																</div>
															</div>
															<div class="">
																<div class="row">
																	<table class="table table-bordered" id="bill2-table">
																		<thead>
																			<tr>
																				<th style="width: 5%;" class="bill2-tbl-th">Sl</th>
																				<th style="width: 20%;" class="bill2-tbl-th">Category</th>
																				<th style="width: 30%;" class="bill2-tbl-th">Description</th>
																				<th style="width: 10%;" class="bill2-tbl-th">Quantity</th>
																				<th style="width: 10%;" class="bill2-tbl-th">Amount</th>
																				<th style="width: 20%;" class="bill2-tbl-th">Bill Date</th>
																				<th style="width: 5%;" class="med-tbl-th">Action</th>
																			</tr>
																		</thead>
																		<tbody id="bill2-tbody">

																		</tbody>

																	</table>
																</div>
															</div>
														</div>
													</div>
												</div>
												<div class="tab-pane  h-100 p-2" id="balanceSheet"
													role="tabpanel">
													<div th:replace="his/cust-bill-balance-sheet :: cust-bill-balance-sheet"></div>
												</div>
												<div id="paymentDetail" class="tab-pane p-2 h-100">
													<div th:replace="his/main-billing :: main-billing"></div>
												</div>
												<div id="finalSettlement" class="tab-pane p-2 h-100">
													<div th:replace="his/final-settlement :: final-settlement"></div>
												</div>
											</div>
										</div>
									</div>
									<!--Tab Content End-->
								</div>
							</div>
							<!--Right Sec End-->
						</div>
					</div>
					<!--Sec End-->
				</div>
			</div>
		</div>
	</div>
</body>
</html>
