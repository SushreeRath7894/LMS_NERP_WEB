<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tiny-slider/2.9.4/tiny-slider.css">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .queue-container {
      width: 100%;
      max-width: 95vw;
      margin: 3rem auto;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      overflow: hidden;
      position: relative;
    }

    .header-list {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--mainColor);
      color: white;
      display: flex;
      justify-content: space-around;
      font-weight: bold;
      font-size: calc((26/16)*1rem);
    }

    .header-item {
      display: flex;
      width: 100%;
      justify-content: flex-start;
      padding: 12px;
    }

    .body-list ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .body-list {
      height: 66vh;
      overflow: hidden;
      position: relative;
    }

    .body-item {
      display: flex;
      justify-content: flex-start;
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: calc((24/16)*1rem);
    }
  </style>

</head>
<body>
<div layout:fragment="content" class="maincontent">
  <section class="container-fluid">
    <div class="my-3">
      <h5 class="px-5 mb-3">Queue Management</h5>
      <div class="queue-container">
        <ul class="header-list">
          <li class="header-item">
            <div class="row row-cols-7 g-3 w-100">
              <div class="col text-center"><span>OPD ID</span></div>
              <div class="col text-center"><span>Patient ID</span></div>
              <div class="col text-center"><span>Room No.</span></div>
              <div class="col text-center"><span>Name</span></div>
              <div class="col text-center"><span>Time</span></div>
              <div class="col text-center"><span>Doctor</span></div>
              <div class="col text-center"><span>Re-Scheduled</span></div>
            </div>
          </li>
        </ul>
        <div class="body-list">
          <ul id="queue-body">

          </ul>
        </div>

      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-slider/2.9.2/min/tiny-slider.js"></script>

    <!-- Static script -->

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const queueBody = document.getElementById("queue-body");
        const apiUrl = "https://faux-api.com/api/v1/getqueuedata_08284431172835216";
        let pageSize;
        let currentIndex = 0;
        let data = [];
        let sliderInstance;

        async function fetchData() {
          try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            const jsonResponse = await response.json();
            console.log("Raw API Response:", jsonResponse);

            if (!jsonResponse.result || !Array.isArray(jsonResponse.result)) {
              throw new Error("Invalid data format: Expected an array in 'result'");
            }

            data = jsonResponse.result;
            pageSize = data.length;
            // console.log("data length", data.length)
            renderQueue();
            setTimeout(initSlider, 500);
          } catch (error) {
            console.error("Error fetching data:", error);
          }
        }

        function renderQueue() {
          queueBody.innerHTML = "";
          let pageData = [];

          // Ensure looping by appending extra rows if needed
          if (data.length <= pageSize) {
            pageData = [...data, ...data.slice(0, pageSize)]; // Duplicate rows to force loop effect
          } else {
            if (currentIndex + pageSize <= data.length) {
              pageData = data.slice(currentIndex, currentIndex + pageSize);
            } else {
              pageData = [...data.slice(currentIndex, data.length), ...data.slice(0, (currentIndex + pageSize) % data.length)];
            }
          }

          pageData.forEach(row => {
            const li = document.createElement("li");
            li.className = "body-item";
            li.innerHTML = `
        <div class="row row-cols-7 g-3 w-100">
          <div class="col text-center"><span>${row.opd_id || 'N/A'}</span></div>
          <div class="col text-center"><span>${row.paitent_id || 'N/A'}</span></div>
          <div class="col text-center"><span>${row.room_no || 'N/A'}</span></div>
          <div class="col text-center"><span>${row.patient_name || 'N/A'}</span></div>
          <div class="col text-center"><span>${row.visit_time || 'N/A'}</span></div>
          <div class="col text-center"><span>${row.doctor_name || 'N/A'}</span></div>
          <div class="col text-center"><span>${row.rescheduled || 'N/A'}</span></div>
        </div>`;
            queueBody.appendChild(li);
          });

          currentIndex = (currentIndex + pageSize) % data.length;
        }

        function initSlider() {
          if (sliderInstance) {
            sliderInstance.destroy();
          }

          sliderInstance = tns({
            container: "#queue-body",
            items: 10, // Show 10 rows at a time
            slideBy: "page", // Scroll entire page at once
            autoplay: true,
            autoplayTimeout: 3000,
            autoplayButtonOutput: false,
            controls: false,
            nav: false,
            axis: "vertical",
            speed: 500,
            loop: true, // Ensure it loops properly
          });
        }

        fetchData();
      });

    </script>
