function indianNumberFormatterWithDecimal(params) {

	if (params.value === null || params.value === undefined || isNaN(params.value)) return '0.00';
		
    const value = parseFloat(params.value).toFixed(2); // Ensure two decimal places
    const parts = value.split("."); // Split integer and decimal part
    const integerPart = parts[0]; // Integer part
    const decimalPart = parts[1]; // Decimal part (always two digits)

    // Handle numbers below 1000 separately
    if (integerPart.length <= 3) {
        return integerPart + "." + decimalPart;
    }

    // Format for numbers >= 1000
    const lastThree = integerPart.substring(integerPart.length - 3);
    const otherNumbers = integerPart.substring(0, integerPart.length - 3);
    const formattedValue =
        (otherNumbers ? otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," : "") + lastThree;

    return formattedValue + "." + decimalPart; // Append decimal part
}

        	$("#amount").attr('readonly',true);
        	allData = allData.sort((a,b) => new Date(a.expDate) - new Date(b.expDate));
            batchOptions.api.setRowData(allData);
            
            let batch = $("#batch").val();
            if(batch) {
            	batchOptions.api.forEachNode(a=> {
            		if(a?.data?.batch === batch) {

            		}
            	})
            }

        }

function saveBatch() {
	let item = $("#item").val();
	let batch = $("#batch").val();
	let amount = $("#amount").val() ? $("#amount").val() : '0.00';
	let quantity = $("#quantity").val();
	
	if(!item) {
		toastr.error("Medicine Required");
		return;
	}
	
	const totalRowCount = batchOptions.api.getModel().getRowCount();
	if(totalRowCount > 0) {
		if((!amount || amount === '0.00') && totalRowCount > 1) {
			toastr.error("Please Select A Batch");
			batchOptions.api.deselectAll()
			return;
		}
	} else {
		toastr.error('Batch Not Found');
		return;
	}
	
	if(totalRowCount === 1) {
		var firstRowNode = batchOptions.api.getDisplayedRowAtIndex(0);
        if (firstRowNode) {
            firstRowNode.setSelected(true);
        }
	}
	
	if(!quantity) {
		toastr.error("Quantity Required");
		return;
	}
	
	let saveType = $("#saveTypeId").val();
	
	let selectedRows = batchOptions.api.getSelectedRows();
	let avlQty = selectedRows[0]?.qty;
	
	if(quantity > avlQty) {
		toastr.error("Entered Quantity Exceeds Available Stock. Please Adjust The Quantity.");
		return;
	}
	
	let slNo = 0;
	activityOptions.api.forEachNode(a=>{
		slNo = slNo + 1;
	})
	
	if (saveType === 'E') {
		let selectedRowsActivity = activityOptions.api.getSelectedRows();
		let slNo = selectedRowsActivity[0].rowNo;
		const rowNode = activityOptions.api.getRowNode(slNo); 
	    if (rowNode) {
	      rowNode.setDataValue('batch', selectedRows ? selectedRows[0].batch : batch); 
	      rowNode.setDataValue('dose', $("#quantity").val()); 
	      rowNode.setDataValue('amount', selectedRows ? parseFloat(selectedRows[0].amount) : 0.00); 
	      rowNode.setDataValue('allocid', selectedRows ? selectedRows[0]?.allocid : ''); 
	      rowNode.setDataValue('storeid', selectedRows ? selectedRows[0]?.storeid : ''); 
	      rowNode.setDataValue('binid', selectedRows ? selectedRows[0]?.binid : ''); 
	    }
	} else {
		const obj = {
				med_id : item,
				med_name : $("#item option:selected").text(),
				dose : $("#quantity").val(),
				amount : selectedRows ? parseFloat(selectedRows[0].amount) : 0.00,
				prod_id : $("#item option:selected").attr('data-prod'),
				prod_name : '',
				test_m_id : '',
				batch : selectedRows[0] ? selectedRows[0]?.batch : '',
				allocid : selectedRows ? selectedRows[0]?.allocid : '',
				storeid : selectedRows ? selectedRows[0]?.storeid : '',
				binid : selectedRows ? selectedRows[0]?.binid : '',
				rowNo : slNo + 1,
				unitid : $("#unitId").val()
		}
		
		activityOptions.api.applyTransaction({
			add: [obj]
		});
		
	}
    
    cancelMedFun();
}

	    	return;
	    }

	})

function openBatchDetails(i) {

	document.querySelectorAll('tr.child-tr-cls')?.forEach(tr => tr.remove());
	
	let selectedRows = gridOptions.api.getSelectedRows();
	let phase = '';
	if(selectedRows && selectedRows.length > 0) {
		phase = selectedRows[0]?.phase;
	}
	
	let selectedData = document.querySelector('tr[data-kra-id="'+i+'"] select');
	let sku_id = selectedData?.value;
	
	if(!sku_id) {
		toastr.error('Please select medicine');
		return;

	let selectedOption = selectedData?.options[selectedData.selectedIndex];
	let prod_id = selectedOption?.getAttribute('data-prod');
	let unit_id = selectedOption?.getAttribute('data-unit');
	let unit_name = selectedOption?.getAttribute('data-unitname');

	const batchEl = document.querySelector('tr[data-kra-id="' + i + '"] .batch');
	if (batchEl) batchEl.value = '';

	if (priceEl) priceEl.value = '';
	
	const storeidEl = document.querySelector('tr[data-kra-id="' + i + '"] .storeid');
	if (storeidEl) storeidEl.value = '';
	
	if(!phase) {
		const quantityEl = document.querySelector('tr[data-kra-id="' + i + '"] .quantity');
		if (quantityEl) quantityEl.value = '';
		
		const discountEl = document.querySelector('tr[data-kra-id="' + i + '"] .discount');
		if (discountEl) discountEl.value = '';
	}
	
	const stockqtyEl = document.querySelector('tr[data-kra-id="' + i + '"] .stockqty');
	if (stockqtyEl) stockqtyEl.value = '';
	
	
	
	const binidEl = document.querySelector('tr[data-kra-id="' + i + '"] .binid');
	if (binidEl) binidEl.value = '';
	
	const allocidEl = document.querySelector('tr[data-kra-id="' + i + '"] .allocid');

	const sgstEl = document.querySelector('tr[data-kra-id="' + i + '"] .sgst');
	if (sgstEl) sgstEl.value = '0.00';
	
	const totalAmountEl = document.querySelector('tr[data-kra-id="' + i + '"] .totalAmount');
	if (totalAmountEl) totalAmountEl.value = '0.00';
	
	let dataset = []
	let total = '0';
	$("#med-table tbody tr.med-parent-class").each(function(index) {
		let t = $(this).find('input.totalAmount').val();
		t = t ? parseFloat(t) : 0;
		total = parseFloat(total) + t;
		
		let a = {
				med_id: $(this).find('.kra-name').val(),
				dose: $(this).find('.quantity').val(),
				batch: $(this).find('.batch').val(),
				expDate: $(this).find('.expDate').val(),
		}
		dataset.push(a);
	});
	$("#grantTotalAmount").text(total?.toFixed(2))
	
	let rowData = '<tbody><tr><td colspan="8" style="text-align:center">No Batch Found</td></tr></tbody>';
	let childtable = '<table width="100%" class="table-bordered"><thead><tr><th>Batch</th><th>Stock</th><th>Amount</th><th>Expired On</th><th>Store</th>'+
	'<th>Zone</th><th>Rack</th><th>Bin</th></tr></thead>'+rowData+'</table>';
	
	const targetRow = document.querySelector('tr[data-kra-id="'+i+'"]');
    
	let newRowData = '';
	
    if(sku_id) {
        agGrid.simpleHttpRequest({
	        url: 'his-billing-pharmacy-get-batch?id='+sku_id
	    }).then(function(data) {
	        var jsonData = JSON.parse(data?.body);
	        var allData = jsonData;
	        if (allData && allData.length > 0) {
	        	allData?.forEach((a,index)=>{
	        		if(a?.batch) {
	        			let filteredDataset = []
	        			let prevQty = 0;
	        			if(dataset && dataset.length > 0) {
	        				filteredDataset = dataset.filter(f => f?.med_id === sku_id && f?.batch === a?.batch && f?.expDate === a?.expDate)[0];
	        				if(filteredDataset) {
	        					prevQty = parseFloat(filteredDataset?.dose);
	        				}
	        			}

function getAmount(i,index){
	
	let batchid = $("#batchid_"+index).text();
	let qty = $("#qty_"+index).text();
	let price = $("#amount_"+index).text();
	let expDate = $("#expDate_"+index).text();
	let storeid = $("#storeid_"+index).val();
	let binid = $("#binid_"+index).val();
	let allocid = $("#allocid_"+index).val();
	
	const batchEl = document.querySelector('tr[data-kra-id="' + i + '"] .batch');
	if (batchEl) batchEl.value = batchid;
	
	const expDateEl = document.querySelector('tr[data-kra-id="' + i + '"] .expDate');
	if (expDateEl) expDateEl.value = expDate;
	
	const priceEl = document.querySelector('tr[data-kra-id="' + i + '"] .price');
	if (priceEl) priceEl.value = price;
	
	const storeidEl = document.querySelector('tr[data-kra-id="' + i + '"] .storeid');
	if (storeidEl) storeidEl.value = storeid;
	
	const binidEl = document.querySelector('tr[data-kra-id="' + i + '"] .binid');
	if (binidEl) binidEl.value = binid;
	
	const allocidEl = document.querySelector('tr[data-kra-id="' + i + '"] .allocid');
	if (allocidEl) allocidEl.value = allocid;
	
	const stockqtyEl = document.querySelector('tr[data-kra-id="' + i + '"] .stockqty');
	if (stockqtyEl) stockqtyEl.value = qty;
	
	let quantity = 0;
	let discount = 0;
	let gstRate = 0;
	const quantityEl = document.querySelector('tr[data-kra-id="' + i + '"] .quantity');
	const cgstEl = document.querySelector('tr[data-kra-id="' + i + '"] .cgst');
	const sgstEl = document.querySelector('tr[data-kra-id="' + i + '"] .sgst');
	const totalAmountEl = document.querySelector('tr[data-kra-id="' + i + '"] .totalAmount');
	const gstRateEl = document.querySelector('tr[data-kra-id="' + i + '"] .gstRate');
	
	if(gstRateEl) {
		gstRate = gstRateEl.value ? parseInt(gstRateEl.value) : 0;
	}
	
	if(quantityEl) {
		quantity = quantityEl.value ? quantityEl.value : '0';
		if(parseFloat(quantity) > parseFloat(qty)) {
			toastr.error('Quantity can\'t be greater than stock');
			return;
		}
		
		const discountEl = document.querySelector('tr[data-kra-id="' + i + '"] .discount');
		if(discountEl) discount = discountEl.value ? discountEl.value : '0';
		
		let lineTotal = parseFloat(quantity) * parseFloat(price);
		
		lineTotal = lineTotal - (lineTotal * discount/100);
		
		let gst = (lineTotal * (gstRate/200));
		
		lineTotal = lineTotal + gst * 2;
		
		if (cgstEl) cgstEl.value = gst?.toFixed(2);
		
		if (sgstEl) sgstEl.value = gst?.toFixed(2);
		
		if (totalAmountEl) totalAmountEl.value = lineTotal ? lineTotal?.toFixed(2) : '0.00';
	} else {
		
		if (cgstEl) cgstEl.value = '0.00';
		
		if (sgstEl) sgstEl.value = '0.00';
		
		if (totalAmountEl) totalAmountEl.value = '0.00';
	}
	
	let total = '0';
	$("#med-table tbody tr.med-parent-class").each(function(index) {
		let t = $(this).find('input.totalAmount').val();
		t = t ? parseFloat(t) : 0;
		total = parseFloat(total) + t;
	});
	$("#grantTotalAmount").text(total?.toFixed(2))
	
	document.querySelectorAll('#child-tr-'+i)?.forEach(tr => tr.remove());
	
}

function calculateLineTotal(i) {
	let quantity = 0;
	let discount = 0;
	let price = 0;
	let gstRate = 0;
	let qty = 0;
	const quantityEl = document.querySelector('tr[data-kra-id="' + i + '"] .quantity');
	const priceEl = document.querySelector('tr[data-kra-id="' + i + '"] .price');
	const cgstEl = document.querySelector('tr[data-kra-id="' + i + '"] .cgst');
	const sgstEl = document.querySelector('tr[data-kra-id="' + i + '"] .sgst');
	const totalAmountEl = document.querySelector('tr[data-kra-id="' + i + '"] .totalAmount');
	const gstRateEl = document.querySelector('tr[data-kra-id="' + i + '"] .gstRate');
	const stockqtyEl = document.querySelector('tr[data-kra-id="' + i + '"] .stockqty');
	
	if(priceEl) price = priceEl.value ? priceEl.value : '0';
	else price = 0;
	
	if(gstRateEl) gstRate = gstRateEl.value ? parseInt(gstRateEl.value) : 0;
	else gstRate = 0;
	
	if(stockqtyEl) qty = stockqtyEl.value ? parseInt(stockqtyEl.value) : 0;
	else qty = 0;
	
	if(quantityEl) {
		quantity = quantityEl.value ? quantityEl.value : '0';
		
		if(parseFloat(quantity) > parseFloat(qty)) {
			toastr.error('Quantity can\'t be greater than stock');
			quantityEl.value = '';
			quantity = '0';
			
			if (cgstEl) cgstEl.value = '0.00';
			
			if (sgstEl) sgstEl.value = '0.00';
			
			if (totalAmountEl) totalAmountEl.value = '0.00';
			
			let total = '0';
			$("#med-table tbody tr.med-parent-class").each(function(index) {
				let t = $(this).find('input.totalAmount').val();
				t = t ? parseFloat(t) : 0;
				total = parseFloat(total) + t;
			});
			$("#grantTotalAmount").text(total?.toFixed(2))
			
			return;
		}
		
		const discountEl = document.querySelector('tr[data-kra-id="' + i + '"] .discount');
		if(discountEl) discount = discountEl.value ? discountEl.value : '0';
		
		let lineTotal = parseFloat(quantity) * parseFloat(price);
		
		lineTotal = lineTotal - (lineTotal * discount/100);
		
		let gst = (lineTotal * (gstRate/200));
		
		lineTotal = lineTotal + gst * 2;
		
		if (cgstEl) cgstEl.value = gst?.toFixed(2);
		
		if (sgstEl) sgstEl.value = gst?.toFixed(2);
		
		if (totalAmountEl) totalAmountEl.value = lineTotal ? lineTotal?.toFixed(2) : '0.00';
	} else {
		
		if (cgstEl) cgstEl.value = '0.00';
		
		if (sgstEl) sgstEl.value = '0.00';
		
		if (totalAmountEl) totalAmountEl.value = '0.00';
	}
	
	let total = '0';
	$("#med-table tbody tr.med-parent-class").each(function(index) {
		let t = $(this).find('input.totalAmount').val();
		t = t ? parseFloat(t) : 0;
		total = parseFloat(total) + t;
	});
	$("#grantTotalAmount").text(total?.toFixed(2))
}

function removeRow(i){
	document.querySelectorAll('#child-tr-'+i)?.forEach(tr => tr.remove());
	document.querySelectorAll('tr[data-kra-id="'+i+'"]')?.forEach(tr => tr.remove());
	
	let total = '0';
	let c = 0;
	$("#med-table tbody tr.med-parent-class").each(function(index) {
		$(this).find('.slno-td').text(c+1);
		let t = $(this).find('input.totalAmount').val();
		t = t ? parseFloat(t) : 0;
		total = parseFloat(total) + t;
		c++;
	});
	$("#grantTotalAmount").text(parseFloat(total)?.toFixed(2))
	
	if(selectedIndex && c > 0) {
		openBatchDetails(selectedIndex);
	}
}

function allowOnlyNumbers(input) {
    let value = input.value;
    value = value.replace(/[^0-9.]/g, '');

    const parts = value.split('.');
    if (parts.length > 2) {
        value = parts[0] + '.' + parts.slice(1).join('').replace(/\./g, '');
    }

    input.value = value;
}


function getCustomerList() {
    var search = $("#extPat").val();
    if (search) {

            type: "POST",
            url: "billing-pharmacy-get-customer-list",

            contentType: 'application/json',
            data: search,
            success: function(response) {
                if (response.code == "success") {
                    if (response.body.length != 0) {
                        $("#search").css("background", "#FFF");
                        var content = '<ul id="autocomplete-list1" >';
                        for (var i = 0; i < response.body.length; i++) {

                                response.body[i].key +
                                '\',\'' +
                                response.body[i].name +
                                '\')">' +
                                response.body[i].name +
                                '</li>';
                        }
                        content += '</ul>';
                        $("#suggesstion-box1_").show();

                    } else {
                        $("#search").css("background", "#FFF");
                        var content = '<ul id="autocomplete-list1">';
                        content += '<li style="margin-left:-30px; font-weight:100; font-size:14px; color:#fff; background-color: var(--mainColor);" onClick=selectAutocompleteValue1("","")>' +
                            "No Data Found" + '</li>';
                        content += '</ul>';
                        $("#suggesstion-box1_").show();
                        $("#suggesstion-box1_").html(content);
                    }
                } else {
                	$("#search").css("background", "#FFF");
                    var content = '<ul id="autocomplete-list1">';
                    content += '<li style="margin-left:-30px; font-weight:100; font-size:14px; color:#fff; background-color: var(--mainColor);" onClick=selectAutocompleteValue1("","")>' +
                        "No Data Found" + '</li>';
                    content += '</ul>';
                    $("#suggesstion-box1_").show();
                    $("#suggesstion-box1_").html(content);
                }
            },

                console.log(data);
            }

        $("#suggesstion-box1_").hide();
    }
}

function selectAutocompleteValue1(custId, custName) {
	$("#fullName,#mobNo,#age,#gender,#country,#states,#dist,#city,#address,#zipCode").val('');

        $("#search").attr('data-procat', "");
        $("#suggesstion-box1_").hide();
    }
}

                                  <th style="width: 5%;" class="d-none">IGST</th>
                                  <th style="width: 10%;" class="med-tbl-th">Amount</th>
                                  <th style="width: 5%;" class="med-tbl-th">Action</th>
                                </tr>
                              </thead>
                              <tbody id="med-tbody">

                              </tbody>

                            </table>
                          </div>
												</div>
												<div class="row">
                          <div class="table-responsive mb-2">
                            <table class="table table-bordered mb-0">
                              <tbody><tr>
                                <td><strong>Total</strong></td>
                                <td id="grantTotalAmount" align="right">0.00</td>
                              </tr>
                              </tbody>
                            </table>
                          </div>
												</div>

												<div id="activity" style="min-height: 360px; display:none"
													class="ag-theme-alpine d-none"></div>

												<div class="d-none" id="demo">
													<div class="row">
														<div class="col-lg-4">
															<div class="form-group">
																<label>Medicine <span class="mandatory">*</span></label> <select id="item"
																	class="form-select" onchange="setUnit()">
																	<option value="">Select</option>
																	<option th:each="c,iter:${itemList}"
																		th:attr="data-prod=${c.id},data-unit=${c.code},data-unitname=${c.data}"
																		th:value="${c.key}" th:text="${c.name}"></option>
																</select>
															</div>
														</div>

														<div class="col-lg-4">
															<div class="form-group">
																<label>Unit</label> <input type="text" id="unit"
																	class="form-control" readonly> <input
																	type="hidden" id="unitId"> <input type="hidden"
																	id="prodId">
															</div>
														</div>
														
														<div class="col-lg-4">
															<div class="form-group">
																<label>Quantity <span class="mandatory">*</span></label> <input type="text" id="quantity"
																	class="form-control">
															</div>
														</div>
														
														<div class="col-lg-6">
															<div class="form-group">
																<label>Batch</label> <input type="text" id="batch"
																	class="form-control" onkeyup="selectBatch()">
															</div>
														</div>

														<div class="col-lg-6">
															<div class="form-group">
																<label>Amount</label> <input type="text" id="amount"
																	class="form-control" readonly>
															</div>
														</div>
														
													</div>
													<div class="row mt-2">
														<input type="hidden" id="saveTypeId">
														<div id="batchDetails" style="height: 25vh;"
															class="ag-theme-alpine"></div>
													</div>
												</div>
											</div>
										</div>
									</div>
									<div id="paymentDetail" class="tab-pane fade p-2 h-100">
										<div th:replace="his/his-billing-2 :: his-billing-2"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
