<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/javaScript/his/his-ipd-billing.js"></script>
</head>
<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">

					<!--Sec Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">

							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between p-2 gap-3 bdr-line">

										<div class="col-md-8 col-12">
											<div class="d-flex search-sec">
												<input class="form-control me-2" type="text"
													placeholder="Search" id="quickFilter" autocomplete="off"
													onkeydown="handleEnter(event)">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												&nbsp;
												<button class="btn go-btn w-auto" type="button"
													onclick="resetBtn()">Reset</button>
											</div>
										</div>

										<div class="col-md-2 d-flex justify-content-end">
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
									</div>
									<div class="card p-2 m-2">
										<div class="maincontentsec">
											<div id="myGrid" style="width: 100%; height: 550px;"
												class="ag-theme-alpine"></div>
										</div>
									</div>
								</div>
							</div>

							<!--Left Sec End-->
							<!--Right Sec Start-->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div
										class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">

										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>
										<div class="d-flex gap-2">
											<ul class="nav nav-pills newtab" role="tablist" id="tabMenu">
												<li class="nav-item" role="presentation"
													id="information-tab"><a class="nav-link active"
													data-bs-toggle="pill" href="#information"
													aria-selected="false">Information</a></li>
												<!-- <li class="nav-item" role="presentation" id="notes-tab"><a
													class="nav-link" data-bs-toggle="pill" href="#notes"
													aria-selected="false">Notes</a></li>
												<li class="nav-item" role="presentation" id="invest-tab"><a
													class="nav-link" data-bs-toggle="pill" href="#invest"
													aria-selected="false" onclick="investigationTab()">Investigation</a></li>

												<li class="nav-item" role="presentation" id="advice-tab"><a
													class="nav-link" data-bs-toggle="pill" href="#advice"
													aria-selected="false">Advice</a></li> -->


											</ul>

										</div>
									</div>

									<!--Tab Content Start-->
									<div class="tab-content flex-fill h-25" id="tabContent">
										<div class="requisition-tbl d-flex flex-column h-100">

											<div class="tab-content crd card m-2 mt-0">
												<!--Personal-->
												<div class="tab-pane show active h-100 p-2" id="information"
													role="tabpanel">
													<div class="requisition-tbl d-flex flex-column h-100">
														<div class="mb-2 table-responsive">
															<table class="table table-bordered mb-0" width="100%">
																<tbody>
																	<tr valign="middle">
																		<td width="50%"><div>
																				<strong id="patientNameHead"></strong>
																			</div></td>
																		<td>
																	<!-- 		<div class="d-flex justify-content-end flxwrap">
																				<button class="btn btn-primary  edit-btn "
																					type="button" onclick="addQuot()" id="addBtnId">Add</button>
																				<button class="btn btn-primary edit-btn "
																					type="button" id="editQuotation"
																					onclick="enableFields()">Edit</button>
																				<button class="btn btn-primary edit-btn "
																					type="button" id="deleteQuot"
																					onclick="deleteQuotation()">Delete</button>
																				<button class="btn btn-primary edit-btn"
																					type="button" onclick="nextTab('notes-tab')">Next</button>
																			</div> -->

																		</td>
																	</tr>
																</tbody>
															</table>
														</div>
														<div class="card p-2">
															<div class="row">
																<div class="col-md-4"><!-- 
																	<input type="hidden" id="patientHiddenId"> <input
																		type="hidden" id="dischargeId"> -->
																	<div class="form-group">
																		<label>Patient Name</label> <input type="text"
																			class="form-control" id="patientName">
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>Age</label> <input type="text"
																			class="form-control" id="age">
																	</div>
																</div>

																		<div class="col-lg-4">
																<div class="form-group">
																	<label>Gender <span class="mandatory">*</span></label>
																	<select id="gender" class="form-select">
																		<option value="">Select</option>
																		<option th:each="c,iter:${genderList}"
																			th:value="${c.key}" th:text="${c.name}"></option>
																	</select>
																</div>
															</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Mobile No</label> <input type="text"
																			class="form-control" id="mobNo">
																	</div>
																</div>
																<div class="col-lg-4">
																<div class="form-group">
																	<label>Email Id</label> <input type="text" id="email"
																		class="form-control">
																</div>
															</div>
																	<div class="col-md-12">
																	<div class="form-group">
																		<label>Address</label>
																		<textarea name="Address" class="form-control"
																			id="address" style="height: 80px;"></textarea>
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Word No</label> <input type="text"
																			class="form-control" id="wordNo">
																	</div>
																</div>
														
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Bed No</label> <input type="text"
																			class="form-control" id="bedNo">
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Room No</label> <input type="text"
																			class="form-control" id="roomNo">
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Consultant Doctor</label> <input type="text"
																			class="form-control" id="consuDoctor">
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Department</label> <input type="text"
																			class="form-control" id="department">
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group">
																		<label>Admit Date</label> <input type="text"
																			class="form-control" id="admitDate">
																	</div>
																</div>


														
															</div>
														</div>
													</div>
												</div>
												
												</div>


											</div>
										</div>
										<!--Tab Content End-->

									</div>
								</div>
								<!--Right Sec End-->
							</div>
						</div>
						<!--Sec End-->

					</div>

				</div>
			</div>
		</div>
		</div>
</body>
</html>
