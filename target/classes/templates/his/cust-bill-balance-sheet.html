<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="cust-bill-balance-sheet">
<head>
<style>
.pinned-total-label {
	font-weight: bold;
}

.text-right, .right-align-header {
	text-align: right !important;
}

.bg-header {
	background-color: #f5f2e7;
}
</style>
<script>
$(document).ready(()=>{
	var gridDiv = document.querySelector('#myGridBS');
    new agGrid.Grid(gridDiv, gridOptionsBS);
    
    gridOptionsBS.api.setRowData([]);
    
})

var columnDefsBS = [
	{
	    headerCheckboxSelection: false,
	    headerCheckboxSelectionFilteredOnly: true,
	    checkboxSelection: true,
	    width: 10,
	    sortable: false,
	    filter: false,
	    resizable: true,
	    hide: true
	},
	{
	    headerName: "Date",
	    field: "bill_date",
	    flex: 1,
	},
	{
		headerName: "Id",
		field: "oth_book_id",
		flex: 2
	},
	{
	    headerName: "Description",
	    field: "sku_desc",
	    flex: 2,
	    cellClass: params => {
	    	return (params.node.rowPinned === 'bottom') ? 'pinned-total-label' : '';
	    }
	},
	{
	    headerName: "Charges",
	    field: "charge_amount",
	    flex: 1,
	    type: 'rightAligned',
	    headerClass: 'right-align-header',
	    valueFormatter: indianNumberFormatterWithDecimal,
	    cellClass: params => {
	    	return (params.node.rowPinned === 'bottom') ? 'pinned-total-label text-right' : 'text-right';
	    }
	},
	{
	    headerName: "Payment",
	    field: "pay_amount",
	    flex: 1,
	    type: 'rightAligned',
	    headerClass: 'right-align-header',
	    valueFormatter: indianNumberFormatterWithDecimal,
	    cellClass: params => {
	    	return (params.node.rowPinned === 'bottom') ? 'pinned-total-label text-right' : 'text-right';
	    }
	}
];

var gridOptionsBS = {
	columnDefs: columnDefsBS,
	rowSelection: 'single',
	suppressRowClickSelection: true,
	defaultColDef: {
	    sortable: true,
	    filter: true,
	    resizable: true,
	},
	//pagination: true,
	//paginationPageSize: 15,
	onSelectionChanged: rowSelectBS
};

function rowSelectBS() {
	
}

function getBalanceSheet(book_id) {
	agGrid.simpleHttpRequest({
        url: "opd-billing-get-balance-sheet?book_id=" + book_id
    }).then(function(resp) {
    	if(resp?.body && resp?.body?.length > 0) {
    		let dataset = JSON.parse(resp?.body);
    		if(dataset && dataset.length > 0) {
    			dataset = dataset.sort((a,b) => new Date(a.full_dt) - new Date(b.full_dt));
    			gridOptionsBS.api.setRowData(dataset);
    			
    		    const totalCharges = dataset.reduce((sum, row) => sum + (row.charge_amount || 0), 0);
    		    const totalPayment = dataset.reduce((sum, row) => sum + (row.pay_amount || 0), 0);
    		    
    		    const due = totalCharges - totalPayment;
    		    const dueCharges = due > 0 ? 0 : due;
    		    const duePayment = due > 0 ? due : 0;

    		    gridOptionsBS.api.setPinnedBottomRowData([{
    		    	sku_desc: 'Total',
    		        charge_amount: totalCharges,
    		        pay_amount: totalPayment
    		    },{
    		    	sku_desc: 'Due',
    		        charge_amount: dueCharges,
    		        pay_amount: duePayment
    		    }]);
    		} else {
    			gridOptionsBS.api.setRowData([]);
    		}
    	} else {
    		gridOptionsBS.api.setRowData([]);
    	}
    })
}
</script>
</head>
<body>
	<div class="requisition-tbl d-flex flex-column gap-2 h-100">
		<div
			class="d-flex w-100 justify-content-between align-items-center p-2 border rounded bg-header">
			<div class="project-name flex-1">
				<span class="head-user-name" id="customerHeadNameBS"></span>
			</div>
			<div class="d-flex justify-content-end gap-2 flex-1">
				<!-- 	<button class="btn m-0 edit-btn" type="button" id="prev1"
					onclick="backToPrevPage()">Prev</button> -->
				<div class="mr-2">
					<button class="btn btn-primary edit-btn" type="button" id="prev1"
						onclick="backToPrevPage()">
						<i class="fas fa-arrow-left"></i> Prev
					</button>
				</div>
				<!-- <button class="btn m-0 edit-btn" type="button" id="nextPay"
					onclick="toNextPage()">Next</button> -->

				<div class="mr-2" id="nextPay">
					<button class="btn btn-primary edit-btn" type="button"
						onclick="toNextPage()"> Next
						<i class="fas fa-arrow-right"></i> 
					</button>
				</div>
			</div>
		</div>
		<div
			class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
			<div id="myGridBS" style="height: 70vh;width:100%;" class="ag-theme-alpine"></div>
		</div>
	</div>
</body>
</html>
