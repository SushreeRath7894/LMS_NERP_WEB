<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>

	<script>
		function agGridOnLoad() {

			agGrid.simpleHttpRequest({
				url: 'manage-ward-view'
			}).then(function (data) {
				if (!data1) {
					data.push(data1);
				}
				gridOptions.api.setRowData(data);
			});

		}
		function openNav() {

			$("#add").hide();
			$("#ward").hide();
			$("#dltBtn").css("opacity", 0);
			//$("#newBtn").css("opacity", 0);


			$('#wardName').val("");
			$('#wardId').val("");
			$('#wardStatus').val("");
			$('#description').val("");
			$('#floor').val("");
			$('#department').val("");
			

			document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto; top:110px;";
			document.getElementById("main_content").style.width = "75%";
		}
		function closeNav() {

			$(".formValidation").remove();
			$("#add").show();
			document.getElementById("mySidenav").style.width = "0";
			document.getElementById("main_content").style.width = "100%";
		}

	</script>

	<script type="text/javascript">
		$(document)
			.ready(
				function () {
					//ALL AG-GRID Table Load strats
					var gridDiv = document.querySelector('#myGrid');
					new agGrid.Grid(gridDiv, gridOptions);
					//ALL AG-GRID Table Load
					agGrid.simpleHttpRequest({
						url: 'manage-ward-view'
					}).then(function (data) {
						var len = data.length;
						$('#totalReq').find('span').html(len);
						if (!data1) {
							data.push(data1);
						}
						gridOptions.api.setRowData(data);
					});
					function cancelBar() {
						var id = document.getElementById("closeKey");
						id.style.display = "block";

						if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
							id.style.display = "none";
						}
					}
				});
		/*if the user clicks anywhere outside the select box,
		 then close all select boxes:*/
		document.addEventListener("click", closeAllSelect);
	</script>



	<script type="text/javascript">
		var data1 = {};
		function saveWard() {



			data1.wardId = $("#wardId").val();
			data1.wardName = $("#wardName").val();
			data1.floor = $("#floor").val();
			data1.department = $("#department").val();
			data1.wardStatus = $("#wardStatus").val();
			data1.description = $("#description").val();

			console.log("data", data1);

			//validation starts

			var validation = true;

			$(".formValidation").remove();

			if (data1.wardName == null || data1.wardName == "") {
				valid = validationUpdated("Ward Name is Required", "wardName");
				return false;
			}

			if (data1.floor == null || data1.floor == "") {
				validation = validationUpdated("Floor name required Required",
					"floor");
				return false;
			}
			if (data1.department == null || data1.department == "") {
				validation = validationUpdated("Department name required Required",
					"department");
				return false;
			}
			if (data1.wardStatus == null || data1.wardStatus == "") {
				validation = validationUpdated("Ward status Required", "wardStatus");
				return false;
			}
			if (data1.description == null || data1.description == "") {
				validation = validationUpdated("Ward description Required", "description");
				return false;
			}
			closeNav();
			//validation ends here

			//add ward starts from here

			if (validation) {

				$.ajax({
					type: "POST",
					url: "manage-ward-add",
					dataType: "json",
					contentType: "application/json",
					data: JSON.stringify(data1),
					success: function (response) {
						if (response.message == "Success") {
							Swal("Ward saved successfully");
							agGrid.simpleHttpRequest({
								url: 'manage-ward-view'
							}).then(function (data) {
								gridOptions.api.setRowData(data);
							});
						}
					},
					error: function (response) {
						console.log(response);
					}
				})
			}
		}



		//add wards end here


		/* ------------------- search bar for mygrid------------------------ */

		function onQuickFilterChanged() {
			gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
			var displayedRowCount = gridOptions.api.getDisplayedRowCount();
			var len = displayedRowCount;
			$('#totalReq').find('span').html(len);
		}

		function cancelBar() {
			var id = document.getElementById("closeKey");
			id.style.display = "block";


			if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
				id.style.display = "none";

			}

		}



		var columnDefs = [
			{
				headerName: "Wrad Id",
				field: "wardId",
				width: 210,
				cellRenderer: function (params) {
					return '<input type="checkbox" id="checkbox_' + params.data.wardId + '"/>'
						+ '<a id="" onclick=ediWard("' + params.data.wardId
						+ '") href="javascript:void(0)">'
						+ params.data.wardId + '</a>';
				}
				//hide : true
			},
			{
				headerName: "Ward Name",
				field: "wardName",
				width: 210
			}, {
				headerName: "Floor",
				field: "floor",
				width: 210,
				type: "centerAligned"

			},
			{
				headerName: "Department",
				field: "department",
				width: 210,
				type: "centerAligned"

			},{
				headerName: "Description",
				field: "description",
				width: 210,
				type: "centerAligned"
			}, {
				headerName: "Status",
				field: "wardStatus",
				width: 210,
				cellRenderer: function (params) {
					if (params.data.wardStatus == "Active") {
						return '<div style="color:green">' + params.data.wardStatus + '</div>';
					} else {
						return '<div>' + params.data.wardStatus + '</div>';
					}
				}
			}];

		var gridOptions = {
			columnDefs: columnDefs,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 200,
				height: 10
			},
			rowSelection: 'single',
			rowMultiSelectWithClick: true,
			onSelectionChanged: onSelectionChangeWard

		};

		//modify wards starts from here

		function onSelectionChangeWard() {


			//closeNav();
			agGridOnLoad();
			openNav();
			$("#ward").show();
			$("#dltBtn").css("opacity", 1);



			var selectedNodes = gridOptions.api.getSelectedNodes();
			var selectedData = selectedNodes.map(node => node.data);

			$('#wardId').val(selectedData.map(node => node.wardId));
			$('#wardName').val(selectedData.map(node => node.wardName));
			$('#description').val(selectedData.map(node => node.description));

			$('#floor').val(selectedData.map(node => node.floorId));
			$('#department').val(selectedData.map(node => node.departmentId));

			if (selectedData.map(node => node.wardStatus) == "Active") {
				$('#wardStatus').val("1");
			} else {
				$('#wardStatus').val("0");
			}

		}



		//delete ward starts here

		function deleteWard() {
			closeNav();
			var id = $('#wardId').val();

			$.ajax({
				type: "GET",
				url: "manage-ward-delete?id=" + id,
				dataType: "json",
				contentType: "application/json",
				success: function (response) {
					if (response.message == "Success") {
						swal("ward deleted successfully")
						agGrid.simpleHttpRequest({
							url: 'manage-ward-view'
						}).then(function (data) {
							gridOptions.api.setRowData(data);
						});
					}
				},
				error: function (response) {
					console.log(response);
				}
			})
		}

	</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">
						<div id="main_content">
							<div class="panel-body">
								<div class="d-flex justify-content-between">
									<div class="btn-hs">
										<div class="font-design" id="totalReq">
											Ward List (<span></span>)
										</div>
									</div>
									<div id="searchRowDiv">
										<div class="input-style">
											<input type="text" placeholder="Search.." name="search"
												class="searchboxinput" onkeyup="cancelBar()"
												oninput="onQuickFilterChanged()" id="quickFilter" autocomplete="off">
											<div class="searchicon">
												<a href="javascript:void(0)"><span
														style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
														id="closeKey"
														onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';"
														class="close_i"><i class="ti-close srchicon"></i></span></a><a
													href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
											</div>
										</div>
									</div>
									<div class="buttonsec btn-hs" id="btndiv">

										<button id="add" class="new-btn" onclick="openNav()">New</button>

									</div>
								</div>

								<div id="myGrid" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>

							</div>
						</div>
					</div>
				</div>
				<div id="mySidenav" class="sidenav">
					<div class="slidebox">
						<div class="d-flex justify-content-between">
							<div class="edit">Ward Category Details</div>
							<div class="arrow">
								<a href="javascript:void(0)" class="closebtn" onclick="closeNav()"><i
										class="ti-arrow-right"></i></a>
							</div>
						</div>
						<div class="chartbtnsec1">
							<div align="right">
								<button class="btn3" id="dltBtn" onclick="deleteWard()">DELETE</button>
								<button class="btn4" onclick="closeNav()">CANCEL</button>
								<button class="btn1" onclick="saveWard()">SAVE</button>
							</div>
						</div>

						<div class="col-md-12" id="ward">
							<div class="form-group">
								<label>Ward Id</label> <input type="text" class="form-control transparenttxtbox"
									placeholder="ward Id" id="wardId" disabled="true"> <input type="hidden" id="wardId">
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Name</label> <input type="text" class="form-control transparenttxtbox"
									placeholder="Name" id="wardName">
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group">
								<label>FLOOR</label>
								<div class="select">
									<select id="floor">
										<option value="">Select</option>
										<option th:each="c,iter:${floorList}" th:value="${c.key}" th:text="${c.name}">
										</option>
									</select>
								</div>
							</div>
						</div>
						
						<div class="col-lg-12">
							<div class="form-group">
								<label>Department</label>
								<div class="select">
									<select id="department">
										<option value="">Select</option>
										<option th:each="c,iter:${departmentList}" th:value="${c.key}" th:text="${c.name}">
										</option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Status</label>
								<div class="select">
									<select id="wardStatus" class="form-control">
										<option value="">Select</option>
										<option value="1">Active</option>
										<option value="0">Inactive</option>
									</select>
								</div>
							</div>
						</div>

						<div class="col-md-12">
							<label for="description">Description</label>
							<textarea id="description" name="description" class="form-control" rows="4"
								placeholder="Enter description here..."></textarea>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</body>

</html>
