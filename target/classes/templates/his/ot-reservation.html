<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>
	<style></style>
	<script type="text/javascript">


		function agGridOnLoad() {

			agGrid.simpleHttpRequest({
				url: 'ot-reservation-view'
			}).then(function (data) {
				if (!data1) {
					data.push(data1);
				}
				gridOptions.api.setRowData(data);
			});

		}

		$(document).ready(function () {

			$('#dltBtn').attr('disabled', true);

			// AG-GRID Table Load 
			var gridDiv = document.querySelector('#myGrid');
			new agGrid.Grid(gridDiv, gridOptions);
			//gridOptions.api.setRowData([]);

			// View
			agGrid.simpleHttpRequest({
				url: "ot-reservation-view"
			}).then(function (data) {
				var len = data.length;
				$('#totalMstr').find('span').html(len);
				gridOptions.api.setRowData(data);
			});
			function cancelBar() {
				var id = document.getElementById("closeKey");
				id.style.display = "block";

				if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
					id.style.display = "none";
				}
			}
		});

		/* ------------------- search bar for mygrid------------------------ */

		function onQuickFilterChanged() {
			gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
			var displayedRowCount = gridOptions.api.getDisplayedRowCount();
			var len = displayedRowCount;
			$('#totalMstr').find('span').html(len);
		}

		function cancelBar() {
			var id = document.getElementById("closeKey");
			id.style.display = "block";


			if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
				id.style.display = "none";

			}

		}


		var columnDefs = [

			{
				headerName: "OT Reserve Id",
				field: "otReserveId",
				width: 150,
				cellRenderer: function (params) {
					return '<input type="checkbox" id="checkbox_' + params.data.otReserveId + '"/>'
						+ '<a id="" onclick=editOT("' + params.data.otReserveId
						+ '") href="javascript:void(0)">'
						+ params.data.otReserveId + '</a>';
				}
				//hide : true
			}, {
				headerName: "IPD ID",
				field: "ipdId",
				width: 120,
			}, {
				headerName: "Patient Id",
				field: "patientId",
				width: 120,
			}, {
				headerName: "Date Of Open",
				field: "dateOfOpe",
				width: 120,
			},
			{
				headerName: "Duration",
				field: "duration",
				width: 120,
			},{
				headerName: "Group",
				field: "group",
				width: 100,
			}, {
				headerName: "Sub Group",
				field: "subGroup",
				width: 100,
			}, {
				headerName: "O.T Table",
				field: "otTable",
				width: 100,
			},
			{
				headerName: "Procedure",
				field: "procedure",
				width: 100,
			},{
				headerName: "Department",
				field: "department",
				width: 120,
			},{
				headerName: "Doctor",
				field: "doctor",
				width: 120,
			},
			{
				headerName: "Instruction",
				field: "instruction",
				width: 100,
			}];

		var gridOptions = {
			columnDefs: columnDefs,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 195,
				height: 10
			},
			//rowSelection: 'single',
			//onSelectionChanged: onSelectionChangedBed


			rowSelection: 'single',
			rowMultiSelectWithClick: true,
			onSelectionChanged: onSelectionChangedBed

		};






		function onSelectionChangedBed() {
			$('#dltBtn').attr('disabled', false);

		}

		function openNav() {
			$("#add").hide();
			$("#bed").hide();

			document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto; top:110px;";
			document.getElementById("main_content").style.width = "75%";
		}

		function closeNav() {

			$("#add").show();
			document.getElementById("mySidenav").style.width = "0";
			document.getElementById("main_content").style.width = "100%";


			$("#bedId").val("");
			$("#bedName").val("");
			$("#propertyFloorType").val("");
			$("#ward").val("");
			$("#bedCharge").val("");
			$("#bedDescription").val("");
			$("#status").val("");
			$("#bedAvailability").val("");
		}

		
		// save

		function saveNav() {
			var obj = {};
			obj.otReserveId = $("#otReserveId").val();
			obj.ipdId = $("#ipdId").val();
			obj.patientId = $("#patientId").val();
			obj.pName = $("#pName").val();
			obj.dateOfOpe = $("#dateOfOpe").val();
			obj.duration = $("#duration").val();
			obj.group = $("#group").val();
			obj.subGroup = $("#subGroup").val();
			
			obj.surgery = $("#surgery").val();
			obj.otTable = $("#otTable").val();
			obj.procedure = $("#procedure").val();
			obj.department = $("#department").val();
			obj.doctor = $("#doctor").val();
			obj.instruction = $("#instruction").val();
			
			console.log("Sava Data", obj);

			var validation = true;



			if (validation) {
				$.ajax({
					type: "POST",
					url: "ot-reservation-add",
					contentType: "application/json",
					data: JSON.stringify(obj),
					success: function (response) {
						if (response.message == "success") {

							$("#messageParagraph").text("Data Saved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							$("#activityone").show();
							$("#add").show();
							$("#myGrid").show();
							$("#cancel").hide();
							$("#save").hide();
							$("#form").hide();
							$("#new").hide();

							agGrid.simpleHttpRequest({
								url: "ot-reservation-view"
							}).then(function (data) {
								gridOptions.api.setRowData(data);
							});

							closeNav();
							$("#otReserveId").val("");
							$("#ipdId").val("");
							$("#patientId").val("");
							$("#pName").val("");
							$("#dateOfOpe").val("");
							$("#duration").val("");
							$("#group").val("");
							$("#subGroup").val("");
							
							$("#surgery").val("");
							$("#otTable").val("");
							$("#procedure").val("");
							$("#department").val("");
							$("#doctor").val("");
							$("#instruction").val("");

						}
					},

					error: function (data) {
					}
				})
			}

		}




		function editOT(id) {

			$("#bed").show();
			$("#add").hide();

			$("#add").hide();
			$("#dltBtn").show();
			agGridOnLoad();

			if ($("#adRole").val() != "") {
				$.ajax({
					type: "GET",
					url: "ot-reservation-edit?id=" + id,
					async: false,
					success: function (response) {
						console.log(response)
						if (response.message == "Success") {
							console.log(response.body)

							openNav();
							$("#myGrid1").show();

							console.log("edit" + response.body);


							$("#otReserveId").val(response.body.otReserveId);
							$("#ipdId").val(response.body.ipdId);
							$("#patientId").val(response.body.patientId);

							$("#pName").val(response.body.pName);
							$("#dateOfOpe").val(response.body.dateOfOpe);


							$("#duration").val(response.body.duration);
							$("#group").val(response.body.group);

							$("#subGroup").val(response.body.subGroup);
							$("#surgery").val(response.body.surgery);
							$("#otTable").val(response.body.otTable);
							$("#procedure").val(response.body.procedure);
							$("#department").val(response.body.department);
							$("#doctor").val(response.body.doctor);
							$("#instruction").val(response.body.instruction);
						}
					},
					error: function (error) {
					}
				});
			}
		}

		//delete bed starts here

		function deleteBed() {

			var id = $('#bedId').val();
			closeNav();
			agGridOnLoad();

			//alert(id)
			$.ajax({
				type: "GET",
				url: "ot-reservation-delete?id=" + id,

				dataType: "json",
				contentType: "application/json",
				success: function (response) {
					if (response.message == "Success") {
						swal("Bed deleted successfully")
						agGrid.simpleHttpRequest({
							url: 'ot-reservation-view'
						}).then(function (data) {
							gridOptions.api.setRowData(data);
						});
					}
				},
				error: function (response) {
					console.log(response);
				}
			})
		}
		
		function getDoctorsList(id) {
			//alert(id)
			var department = $('#department').val();
			//alert(id)
			if (department) {
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$.ajax({
					type: "GET",
					url: "manage-patient-doctorList?id=" + department,
					success: function (response) {
						if (response.message == "success") {
							$("#doctor").empty();
							var option = $("<option></option>");
							$(option).val(null);
							$(option).html("Select");
							$("#doctor").append(option);
							for (var i = 0; i < response.body.length; i++) {
								var option = $("<option></option>");
								$(option).val(response.body[i].key);
								$(option).html(response.body[i].name);
								$("#doctor").append(option);
							}
							if (id == '0') {

							} else {
								$("#doctor").val(id);
							}
						}
					},
					error: function (e) {
					}
				});
			} else {
				$("#doctor").empty();
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$("#doctor").append(option);
				$("#doctor").empty();
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
			}
		}
		
		function getPatientList() {
			var search = $("#pName").val();
			if (search.length < 1) {
				$("#suggesstion-box20_").hide();
			}
			if (search) {
				$.ajax({
					type: "POST",
					url: "ot-reserve-patientList",
					dataType: 'json',
					contentType: 'application/json',
					data: search,
					success: function (response) {
						if (response.message == "success") {
							if (response.body.length != 0) {
								$("#search").css("background", "#FFF");
								var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;">';

								for (var i = 0; i < response.body.length; i++) {
									content += '<li class="autocompletedata cp ps-List" onClick="selectAutocompleteValue20(\''
										+ response.body[i].patientId
										+ '\',\''
										+ response.body[i].pName
										+ '\')">'
										+ response.body[i].pName
										+ '</li>';
								}

								content += '</ul>';
								$("#suggesstion-box20_").show();
								$("#suggesstion-box20_").html(content);

							} else {
								$("#search").css("background", "#FFF");
								var content = '<ul id="autocomplete-list2">';
								content += '<li onClick="selectAutocompleteValue()">'
									+ "No Data Found" + '</li>';
								content += '</ul>';
								$("#suggesstion-box20_").show();
								$("#suggesstion-box20_").html(content);
							}
						}
					},
					error: function (data) {
						console.log("Error:", data);
					}
				});
			}
		}

		function selectAutocompleteValue20(patientId, pName, mobNo, email) {

			if (patientId) {
				$("#patientId").val(patientId);
				var index = pName.indexOf(' / ');
				var trimmedData = pName.substring(0, index);

				$("#pName").val(trimmedData);
				$("#search").val(pName);
				$("#search").attr('data-procat', patientId);
				$("#suggesstion-box20_").hide();
			} else {
				$("#patientId").val("");
				$("#pName").val("");
				$("#search").val("");
				$("#search").attr('data-procat', "");
				$("#suggesstion-box20_").hide();

			}
		}

	</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">
						<div id="main_content">
							<div class="panel-body">
								<div class="d-flex justify-content-between">
									<div class="btn-hs">
										<div class="font-design" id="totalMstr">
											OT Reservation List (<span></span>)
										</div>
									</div>

									<div class="col-md-4" style="margin-bottom: 10px;">
										<div id="searchRowDiv">
											<div class="input-style">
												<input type="text" placeholder="Search.." name="search"
													class="searchboxinput" onkeyup="cancelBar()"
													oninput="onQuickFilterChanged()" id="quickFilter"
													autocomplete="off">
												<div class="searchicon">
													<a href="javascript:void(0)">
														<span
															style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
															id="closeKey"
															onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';"
															class="close_i">
															<i class="ti-close srchicon"></i>
														</span>
													</a>
													<a href="javascript:void(0)">
														<i class="ti-search srchicon"></i>
													</a>
												</div>
											</div>
										</div>
									</div>



									<div class="buttonsec btn-hs" id="btndiv">
										<button id="add" class="new-btn" onclick="openNav()">New</button>

									</div>
								</div>

								<div id="myGrid" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>

							</div>
						</div>
					</div>
				</div>
				<div id="mySidenav" class="sidenav">
					<div class="slidebox">
						<div class="d-flex justify-content-between">
							<div class="edit">Reservation Details</div>
							<div class="arrow">
								<a href="javascript:void(0)" class="closebtn" onclick="closeNav()"><i
										class="ti-arrow-right"></i></a>
							</div>
						</div>
						<div class="row">
							<div class="col-md-12 buttonsec btn-hs">
								<button class="btn4" onclick="closeNav()">CANCEL</button>
								<button class="save-btn" id="saveBtn" onclick="saveNav()">SAVE</button>
								<button class="btn3" id="dltBtn" onclick="deleteOT()">DELETE</button>

							</div>
						</div>
						<!--<input type="hidden" id="bedId">-->
						<div class="row">
						<div class="col-md-12" id="autoSearch" style="margin-bottom: 20px; width: 60%;">
							<div class="form-group">
								<label for="pName">IPD Id/ Patient Id /<span
										style="color: red;">*</span></label><br>
								<div class="autocomplete"
									style="width: 100%; margin-top: 0px; border: 1px solid #ccc; border-radius: 5px; padding: 5px;">
									<div class="form-group" style="margin-bottom: 0;">
										<input type="text" id="pName" placeholder="IPD Id/ Patient Id /"
											class="form-control" onkeyup='getPatientList();'>
										<input type="hidden" id="patientId">
									</div>
								</div>
								<div id="suggesstion-box20_" class="sugg-cls"></div>
							</div>
						</div>

							<div class="col-md-6">
								<div class="form-group">
									<label>Date Of Operation</label>
									<input type="date" id="dateOfOpe" placeholder="Date of Operation"
										class="form-control datepicker"
										style="border: 1px solid #ccc; padding: 8px; border-radius: 4px;">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label>Duration</label> <input type="text" id="duration" placeholder="Duration"
										class="form-control">
								</div>
							</div>
							
							<div class="col-md-6">
								<div class="form-group">
									<label>Group</label> <input type="text" id="group" placeholder="Group"
										class="form-control">
								</div>
							</div>
							
							<div class="col-md-6">
								<div class="form-group">
									<label>Sub Group</label> <input type="text" id="subGroup" placeholder="Sub Group"
										class="form-control">
								</div>
							</div>
								
							<div class="col-md-6">
								<div class="form-group">
									<label>Surgery</label> <input type="text" id="surgery" placeholder="Surgery"
										class="form-control">
								</div>
							</div>
							
							<div class="col-md-6">
								<div class="form-group">
									<label>O.T Table</label> <input type="text" id="otTable" placeholder="O.T Table"
										class="form-control">
								</div>
							</div>
							
							<div class="col-md-6">
								<label for="address">Procedure</label>
								<textarea id="procedure" name="Procedure" class="form-control" 
									placeholder="Procedure"></textarea>
							</div>
							
                                <div class="col-md-6">
									<div class="form-group">
										<label>Department</label>
										<div class="select">
											<select id="department" onchange="getDoctorsList('0')">
												<option value="">Select Department</option>
												<option th:each="c,iter:${departmentList}" th:value="${c.key}"
													th:text="${c.name}">
												</option>
											</select>
										</div>
									</div>
								</div>

								<div class="col-md-6">
									<div class="form-group">
										<label>Doctor</label>
										<div class="select">
											<select id="doctor"onblur="removeValid(event)">
												<option th:value="NULL">Select Doctor</option>
												<option th:each="c,iter:${getDoctorsList}" th:value="${c.key}"
													th:text="${c.name}"></option>
											</select> <span class="focus"></span>
										</div>
									</div>
								</div>
						
						<div class="col-md-6">
								<div class="form-group">
									<label>Instruction</label> <input type="text" id="instruction" placeholder="Instruction"
										class="form-control">
								</div>
							</div>
							</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</body>

</html>
