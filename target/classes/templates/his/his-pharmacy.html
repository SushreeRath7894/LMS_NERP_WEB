<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">

<link rel="stylesheet" href="../css/his-css/his-pharmacy.css">
<script type="text/javascript" src="../javaScript/his/his-pharmacy.js"></script>
<style>
.btn-position {
	position: absolute;
	right: 20px;
	bottom: 135px;
}
</style>

</head>
<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid requisition mt-3 mb-3">
			<div class="row">
				<div class="col-md-12">
					<!-- Nav pills -->
					<ul class="nav nav-pills mb-20" role="tablist">
						<li class="nav-item wd-33"><a class="nav-link active tab-ht"
							data-bs-toggle="pill" href="#reception">Patholab</a></li>
					</ul>
				</div>
			</div>

			<!-- Tab panes -->
			<div class="tab-content">

				<!--Tabbination 1 Start-->
				<div id="ipd" class="tab-pane active mt-5">
					<div class="row">

						<!--Left Sec Start-->
						<div class="col-md-6 pd-r tab-width-css">
							<div class="out-box">
								<div class="row">
									<div class="col-md-12">
										<!-- Nav pills -->
										<ul class="nav nav-pills mb-20" role="tablist">
											<li class="nav-item wd-11"><a
												class="nav-link active tab-ht" data-bs-toggle="pill"
												href="#reception">Order Booking List</a></li>
										</ul>
									</div>
								</div>


								<div class="row d-flex  mb-20">
									<div class="col-md-10">
										<form class="d-flex search-sec flxwrap">
											<input class="form-control me-2" type="text"
												placeholder="Search">
											<button class="btn btn-primary go-btn" type="button">Go</button>
										</form>
									</div>

									<div class="col-md-2 d-flex justify-content-end">
										<div class="btn btn-primary max-btn">
											<!-- <i class="fas fa-arrow-up"></i>-->
											<i class="fas fa-arrows-alt"></i>
										</div>
									</div>

								</div>
								<div class="requisition-tbl table-responsive">
									<div id="myGrid" style="height: 500px;" class="ag-theme-alpine"></div>

								</div>
							</div>
						</div>

						<!--Left Sec End-->

						<!--Right Sec Start-->
						<div class="col-md-6 pd-l">
							<div class="out-box">

								<div class="btn btn-primary max-btn">
									<!-- <i class="fas fa-arrow-up"></i>-->
									<i class="fas fa-arrows-alt"></i>
								</div>



								<!--Right Inner Tab Start-->
								<ul class="nav nav-pills newtab mb-20" role="tablist">


									<li class="nav-item wd-11"><a class="nav-link active"
										data-bs-toggle="pill" href="#treatment"
										onclick="getActId();">TreatMent Details</a></li>

									<li class="nav-item wd-11"><a class="nav-link text-nowrap"
										data-bs-toggle="pill" href="#billingTab"
										onclick="activityTabs('billingTab');">Billing</a></li>
								</ul>




								<!-- Tab panes -->
								<div class="tab-content"
									style="height: 500px; overflow-y: scroll;">
									
									<div class="mb-2">
										<table class="table table-bordered mb-0" width="100%">
											<tr valign="middle">
											
												<td width="50%"><strong><span id="pName"></span></strong></td>
												<td width="10%"><span id="gender"></span></td>
												<td width="10%"><span id="age"></span></td>
												<td>
													<div class="d-flex justify-content-end">
														<div class="mr-2">
															<button class="btn btn-primary add-btn" type="button"
																id="addBtn">Add</button>
														</div>
														<div class="mr-0" id="dltBtn">
															<button class="btn btn-primary add-btn" type="button">Delete</button>
														</div>

														<div class="mr-0">
															<button class="btn btn-primary edit-btn" type="button"
																id="saveBtn" onclick="saveVital();">Save</button>

															<button class="btn btn-primary edit-btn" type="button"
																id="cancelVital" onclick="CancelVital();">Cancel</button>
														</div>

														<div class="mr-2" id="editBtn">
															<button class="btn btn-primary edit-btn" type="button">Edit</button>
														</div>

													</div>

												</td>
											</tr>
										</table>
									</div>
									
									
									<!--Treatment starts from here  -->
									<div id="treatment" class="tab-pane active">

										<div id="treatmentGrid" class="ag-theme-alpine"
											style="height: 300px; width: 100%;"></div>
										<div class="collapse" id="addTreatment">
											<div
												style="display: flex; justify-content: space-between; align-items: center;">
												<h6 style="color: #bf05ff; margin: 0;">Treatment
													Details</h6>
												<p style="color: red; font-weight: bold; margin: 0;">
													Note: All fields marked with <span>*</span> are mandatory.
												</p>
											</div>

											<div class="btn-hs" id="buttonGroup">

												<button id="save" onclick="saveTratment()" class="btn1">Save</button>
												<button id="cancel" onclick="cancel()" class="download-btn">Cancel</button>
											</div>


											<div class="col-md-12">
												<div class="row">
													<input type="hidden" id="treatmentIds">
													<div class="col-lg-6">
													<input type = "hidden"  id ="pName">
													<input type = "hidden"  id ="pID">
														<div class="form-group" oninput="validateFields()">
															<label>Medicine Name<span class="mandatory">*</span></label>
															<input type="text" id="medicinename" placeholder=""
																class="form-control">
														</div>
													</div>

													<div class="col-lg-6">
														<div class="form-group" oninput="validateFields()">
															<label>Dosage <span class="mandatory">*</span></label> <input
																type="text" id="dosage" placeholder=""
																class="form-control">
														</div>
													</div>



													<div class="col-lg-6">
														<div class="form-group" oninput="validateFields()">
															<label>Frequency <span class="mandatory">*</span></label>
															<input type="text" id="frequency" placeholder=""
																class="form-control">
														</div>
													</div>

													<div class="col-lg-6">
														<div class="form-group">
															<label>Duration</label> <input type="text" id="duration"
																placeholder="" class="form-control">
														</div>
													</div>
													<div class="col-lg-6">
														<div class="form-group">
															<label>Instructions</label> <input type="text"
																id="instruction" placeholder="" class="form-control">
														</div>
													</div>

													<div class="col-md-6">
														<div class="form-group">
															<label>Type</label>
															<div class="select">
																<select id="treatmentTypes" class="form-control">
																	<option value="">Select</option>
																	<option value="0">Good</option>
																	<option value="1">Normal</option>
																	<option value="2">Serious</option>
																</select>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>

									</div>
									<!--Treatment  ends here  -->
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	</div>
</body>
</html>
