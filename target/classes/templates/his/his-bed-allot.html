<style>
.ward-sec {
	position: relative;
	flex-direction: column;
	align-items: flex-start;
	width: 14%;
	cursor: pointer;
	margin-top: 6px;
}

@media screen and (width < 768px) {
  .ward-sec { width: 20%; }
}

.white-box {
	font-family: Arial, sans-serif;
	font-weight: 25px;
	background-color: #fff;
	font-size: 11px;
	color: #000;
	text-align: center;
	transition: transform 0.4s ease-in-out;
	align-items: center;
	cursor: pointer;
	border: 1px solid #ccc;
	line-height: 12px;
	padding: 5px;
}

.white-box:hover {
	background-color: #fff;
	transform: scale(1.08);
	zoom: 100%;
}

.ward-sec .card-body {
	padding: 4px !important;
}

.pl-clr {
	color: #BF05FF;
	font-size: 15px;
}

.grey-clr {
	color: #e4e4e4;
	font-size: 15px;
}

.main-sec {
	background-color: #fff;
	border: solid 1px #ccc;
	padding: 10px;
}

.d-bed {
    pointer-events: none;
    opacity: 0.5;
}

.box-selected {
	border: 2px solid #bf05ff;
}
@media screen and (min-device-width: 575px) and (max-device-width: 768px) { 
	.ward-sec {
	width: 20%;
}    
}
@media screen and  (max-device-width: 574px) { 
	.ward-sec {
	width: 50%;
}    
}
</style>
