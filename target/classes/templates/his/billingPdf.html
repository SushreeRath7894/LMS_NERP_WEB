<!DOCTYPE html>
<html>
<head>
  <title>Medical Invoice</title>
<meta charset="UTF-8" content="width=device-width, initial-scale=1"></meta>

<style>
@page {
  size: A4 portrait;
  padding: 0;
  margin: 5mm;
}
table { width: 100%; font-family: sans-serif; border-collapse: collapse; }
table, th, td { border: 1px solid; }
table.borderless { border: 0; }

.m-0 { margin: 0; }
.align-middle { vertical-align: middle; }
.align-top { vertical-align: top; }
.text-center { text-align: center; }
.text-end { text-align: right; }
tbody.text-start th, tbody.text-start td, .text-start { text-align: left; }
.text-nowrap { text-wrap: nowrap; }
.border-0, .border-0 th, .border-0 td { border: 0; }
.border-0 .border-right { border-right: 1px solid; }
.border-left-0 { border-left: 0; }
.border-right-0 { border-right: 0; }
.border-top, .border-top th, .border-top td { border-top: 1px solid; }
.ps-1 { padding-left: 10px; }
.pt-1 { padding-top: 10px; }
.mt-2 { margin-top: 20px; }

img { 
width: 40mm; 
}


.fs-14p { font-size: 14px; }
.fw-bold { font-weight: 700; }

tbody td:first-child, tfoot td:first-child { border-left: 0; }
tbody td:last-child, tfoot td:last-child { border-right: 0; }
.h-pdf, .h-pdf td { height: 35px; }
.h-pdf-md { height: 55px; }
.h-pdf-ms { height: 5px; }
tr.px-1 td { padding: 0 5px; }
.fs-12p { font-size: 12px; }
.sri-clr{
 	background: #B1543F;
}
.footer-img{
	background: #B1543F;
}
</style>
</head>
<body>

<table class="borderless">

  <thead class="border-0">
  <tr>
    <th class="align-middle text-center" rowspan="8">
			<img src='classpath:static/assets/images/sriLogo.png' alt="OriFood Logo"/></th>
			<th colspan="3" class="text-end"><h1>RECEIPT</h1></th>
    
  </tr>
  <tr><th class="text-end" colspan="3"><h3>SRI SRI University Medical College</h3></th></tr>
  <tr><th class="text-end" colspan="3">123 Health Lane</th></tr>
  <tr><td class="text-end" colspan="3">Cuttack, Odisha, 754001</td></tr>
  <tr><td class="text-end" colspan="3">Phone: (0671) 234-5678</td></tr>
  <tr><td class="text-end" colspan="3">Website: www.srisriuniversity.edu.in</td></tr>
  <tr><td class="text-end" colspan="3">India</td></tr>
  <tr><td class="h-pdf" colspan="4"></td></tr>

  <tr><th colspan="4">Bill To:</th></tr>
  <tr><th colspan="2">Patient Name: <span th:text="${pdfMt.pName}"></span></th>
  <th class="text-end" colspan="2">Bill No: <span th:text="${pdfMt.billNo}"></span></th>
  </tr>
  <tr>
	  <td colspan="2"><span th:text="${pdfMt.address}"></span></td>
	  <td class="text-end" colspan="2">Bill Date: <span th:text="${pdfMt.billDate}"></span></td>
  </tr>
  <tr>
	  <td colspan="2">Date: <span th:text="${pdfMt.date}"></span></td>
  </tr>
  
  <tr>
  	<td class="h-pdf" colspan="4"></td>
  </tr>
  </thead>

  <tbody class="border-0 text-end h-pdf">
	  <tr class="h-pdf-md sri-clr">
		  <th class="text-start">DESCRIPTION</th>
		  <th>QUANTITY</th>
		  <th>UNIT PRICE (Rs.)</th>
		  <th>AMOUNT (Rs.)</th>
	  </tr>
  
  <tr th:each="items: ${pdfMtDetails}">
            <td th:text="${items.itemName}" th:attr="style='text-align: left;'"></td>
            <td th:text="${items.qty}"></td>
            <td th:text="${items.unitPrice}"></td>
            <td th:text="${items.amount}"></td>
             
        </tr>
        
       <tr class="sri-clr">
            <td></td>
            <td></td>
            <td>Total Amount :</td>
            <td th:text="${pdfMt.total}"></td>
             
        </tr>
        
        
         
            
          
  
  </tbody>
  
</table>

</body>
</html>
