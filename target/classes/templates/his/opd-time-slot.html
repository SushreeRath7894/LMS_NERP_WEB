<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"

<head>

    }
    .side-nav-wrapper label { font-size: 14px; }
    .side-nav-wrapper { width: 100%; }
    .side-nav-wrapper .calendar_box { width: 100%; }
  </style>

  <script type="text/javascript">

      let c = new Date();
      let c1 = c.getDate();
      if (c1 < 10) c1 = '0' + c1;
      let c2 = c.getMonth() + 1;
      if (c2 < 10) c2 = '0' + c2;
      let c3 = c.getFullYear();
      let currentDate = `${c1}.${c2}.${c3}`;
      // console.log(`${c1}.${c2}.${c3} today's date`);

      /* Date Picker for OPD Timeslot page :: Start */
      let dateOptions =  { format: 'd.m.Y', closeOnDateSelect: true, timepicker: false, minDate: false, value: currentDate }
      let startDate = $('#startSlot');
      let endDate = $('#endSlot');
      startDate.datetimepicker(dateOptions);
      $("#fromDateCalender").click(() => {

      $("#toDateCalender").click(() => {

      /* Date Picker for OPD Timeslot page :: End */

      searchData();

      /* Functionality when user clicks on SAVE button */
 /*      $("#saveTimeSlotData").click(() => {
        $("#saveTimeSlotData").prop('disabled', true);
        let data = new Map();
        let slotDate = $("#slotDate").val().split(".").reverse().join("-");
        let slotStartTime = `${slotDate} ${$("#slotStartTime").val()}:00`;

        setTimeout(() => {

      });
 */
    });

    function searchData() {
      let start = $("#startSlot");
      let end = $("#endSlot");
      let partStart = start.val().split('.');
      let partEnd = end.val().split('.');
      let fromDate = [partStart[2], partStart[1], partStart[0]].join('-');
      // console.log(fromDate, "fromDate");
      let toDate = [partEnd[2], partEnd[1], partEnd[0]].join('-');
      // console.log(toDate, "toDate");
      agGrid.simpleHttpRequest({
        url: "view-opd-time-lists?fromDate=" + fromDate + "&toDate=" + toDate,
      }).then(data => {
        let da = []
        gridOptions.api.setRowData(da);
        let jsonData = JSON.parse(data.body);
        let allData = jsonData["OPDTimes"];
        console.log(`Data between ${fromDate} and ${toDate}... \n`, allData);

        $('#totalReq').find('span').html(allData?.length?allData.length:'0');
        gridOptions.api.setRowData(convertDatesDashes(allData));
        initSideNavDateTime(allData);
      });
    }

    function reset() {
      let c = new Date();
      let c1 = c.getDate();
      if (c1 < 10) c1 = '0' + c1;
      let c2 = c.getMonth() + 1;
      if (c2 < 10) c2 = '0' + c2;
      let c3 = c.getFullYear();
      let currentDate = `${c1}.${c2}.${c3}`;
      $("#startSlot").val(currentDate);
      $("#endSlot").val(currentDate);
      searchData();
    }
    
    function convertDatesDashes(all) {
      // console.log(updatedData, `updatedData`);
      return all?.map(i => {
        const parts = i.slotDate.split('-');
        const formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
        return {...i, slotDate: formattedDate}; // Return a new object with slotDate updated
      });
    }
    
    function initSideNavDateTime(refData) {
      // console.log("Doctor's View of OPD Time Slots... \n from initSideNavDateTime \n", refData);

      let refDates = [];
      refData?.forEach((d) => refDates.push(d["slotDate"]));
      refDates = [...new Set(refDates)]; // Remove duplicates
      refDates = refDates.map((dateString) => { // Convert dates to dd-mm-yyyy format
        const parts = dateString.split('-');
        return `${parts[2]}-${parts[1]}-${parts[0]}`; // Rearrange the date parts to dd-mm-yyyy format
      });
      // console.log(`disabledDates == ${refDates}`); // add this param to dateOptions to disable already selected dates.

      let dateOptions =  { format: 'd.m.Y', closeOnDateSelect: true, timepicker: false, minDate:'-1970/01/01'}
      let slotDate = $("#slotDate");
      let endTime = $("#slotEndTime");
      let startTime = $("#slotStartTime");

      /* Date Picker for OPD Timeslot Side Nav :: Start */
      slotDate.datetimepicker(dateOptions);
      $("#slotDatePicker").click(() => slotDate.datetimepicker("show"));
      /* Date Picker for OPD Timeslot Side Nav :: End */

      /* Time Picker for OPD Timeslot SideNav :: Start */
      slotDate.on('change', () => {
        let thisDay = new Date();
        let dd = thisDay.getDate();
        let mm = thisDay.getMonth() + 1;
        let pickedDate = slotDate.val();
        dd = dd < 10 ? '0' + dd : dd;
        mm = mm < 10 ? '0' + mm : mm;
        let targetDate = `${dd}.${mm}.${thisDay.getFullYear()}`;

        // console.log(`targetDate => ${targetDate} \n pickedDate => ${pickedDate}`); console.log(pickedDate === targetDate);

        function afterStartLogic() {
          let selectedTime = parseInt(startTime.val().split(':')[0]);
          let nextHour = selectedTime + 1 + ':00';
          this.setOptions({ minTime: startTime.val()?nextHour:false })
        }

        function beforeEndLogic() {
          this.setOptions({ maxTime: endTime.val()?endTime.val():false })
        }

        let sameDay = {format: 'H:i', datepicker: false, minTime: '0', onShow: beforeEndLogic };
        let otherDay = {format: 'H:i', datepicker: false, minTime: false, onShow: beforeEndLogic };

        startTime.datetimepicker(pickedDate === targetDate ? sameDay : otherDay);
        endTime.datetimepicker({ format: 'H:i', datepicker: false, onShow: afterStartLogic });
        startTime.val("");
        endTime.val("");
        $("#slotStartTimePicker").click(() => startTime.datetimepicker("show").datetimepicker("reset"));
        $("#slotEndTimePicker").click(() => endTime.datetimepicker("show").datetimepicker("reset"));
      });
      /* Time Picker for OPD Timeslot SideNav :: End */
    }

    /* ------------------- search bar for myGrid------------------------ */
    function cancelBar() {
      let id = document.getElementById("closeKey");
      id.classList.remove('d-none');
      let quickFilter = $('#quickFilter');
      if (quickFilter.val() == null || quickFilter.val() === '') {
        id.classList.toggle('d-none');
      }
    }
    /* ------------------- search bar for myGrid------------------------ */

    function onQuickFilterChanged() {
      gridOptions.api
           .setQuickFilter(document.getElementById('quickFilter').value);
      var displayedRowCount = gridOptions.api.getDisplayedRowCount();
      var len = displayedRowCount;
      $('#totalReq').find('span').html(len);
    }


    var columnDefs = [
      {
        headerName: "DOCTOR OPD ID",
        field: "docOpdId",
        flex: 1
      },{
        headerName: "Booking Date",
        field: "slotDate",
        flex: 1
      }, {
        headerName: "Start Time",
        field: "startSlot",
        flex: 1
      }, {
        headerName: "End Time",
        field: "endSlot",
        flex: 1
      }, {
        headerName: "Time Slots",
        field: "slotInterval",
        flex: 1
      }];

    var gridOptions = {
      columnDefs: columnDefs,
      defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 120,
        height: 10,
        cellStyle: {textAlign: "center"}
      }
    };

    function openSideNav() {
      document.getElementById("addNewTimeSlot").disabled = true;
      document.getElementById("mySidenav").style.cssText = "width: 30%; position: absolute; right: 0; overflow: hidden; height:auto; top:117px; border: 1px solid #ccc";
      document.getElementById("myGrid").style.width = "70%";
    }

    function closeSideNav() {
      document.getElementById("addNewTimeSlot").disabled = false;
      document.getElementById("mySidenav").style.cssText = "width: 0; height: 0;";
      document.getElementById("myGrid").style.width = "100%";
      $("#slotDate").val('');
      $("#slotStartTime").val('');
      $("#slotEndTime").val('');
      $('#radio15').prop('checked', true);
    }
    
    
 // save

	function saveNav() {
		var obj = {};
		obj.docOpdId = $("#docOpdId").val();
		obj.slotDate = $("#slotDate").val().split(".").reverse().join("-");
		obj.slotStartTime = `${obj.slotDate} ${$("#slotStartTime").val()}:00`;
		obj.slotEndTime = `${obj.slotDate} ${$("#slotEndTime").val()}:00`;
        
		//obj.slotStartTime = $("#slotStartTime").val();
		//obj.slotEndTime = $("#slotEndTime").val();
		obj.slotIntervals = $('input[type="radio"][name=intervals]:checked').val();
		
		var validation = true;



		if (validation) {
			$.ajax({
				type: "POST",
				url: "opd-time-slot-add",
				contentType: "application/json",
				data: JSON.stringify(obj),
				success: function (response) {
					if (response.message == "success") {

						$("#messageParagraph").text("Data Saved Successfully");
						closeSideNav();
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						
						$("#myGrid").show();
						searchData();
						

						$("#docOpdId").val("");
						$("#slotDate").val("");
						$("#slotStartTime").val("");
						$("#slotEndTime").val("");
						$("#slotIntervals").val("");
						

					}
				},

				error: function (data) {
				}
			})
		}

	}

  </script>

  <title layout:title-pattern=='$LAYOUT_TITLE'>OPD Time Slot</title>

<body>
<div layout:fragment="content" class="maincontent">
  <div class="container-fluid">
    <div class="row">
      <div class="maincontentsec">

            <div class="panel-body">

                <div class="d-flex calendar-section">
                  <div class="d-flex">
                    <label class="form-label" for="startSlot">Starting Slot:</label>
                    <div class="form-group calendar_box">
                      <input type="text" id="startSlot" value="" class="form-control" placeholder="from date..." readonly>
                      <i class="ti-calendar picker_calendar" id="fromDateCalender"></i>
                    </div>
                  </div>

                  <div class="d-flex">
                    <label class="form-label" for="endSlot">Ending Slot:</label>
                    <div class="form-group calendar_box">
                      <input type="text" id="endSlot" value="" class="form-control" placeholder="to date..." readonly>
                      <i class="ti-calendar picker_calendar" id="toDateCalender"></i>
                    </div>
                  </div>
                </div>
                <div id="searchRowDiv">
                  <div class="input-style">
                    <label for="quickFilter" class="visually-hidden"></label>
                    <input type="text" placeholder="Search..." name="search" class="searchboxinput" onkeyup="cancelBar()" oninput="onQuickFilterChanged()" id="quickFilter" autocomplete="off">
                    <div class="searchicon">
                      <a href="javascript:void(0)">
                        <span class="d-none close_i" id="closeKey"
                              onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').classList.toggle('d-none');">
                          <i class="ti-close srchicon"></i>
                        </span>
                      </a>
                      <a href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
                    </div>
                  </div>
                </div>
                <div class="buttonsec btn-hs" id="btndiv">
                  <button id="addNewTimeSlot" class="new-btn" onclick="openSideNav()">New</button>
                  <button id="searchButton" class="btn1" onclick="searchData()">Search</button>
                  <button id="resetButton" class="btn3" onclick="reset()">Reset</button>
                </div>
              </div>

              <!-- ag-grid starts here -->
              <div id="myGrid" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>
              <!-- ag-grid ends here -->

              <!-- side-nav starts here -->
              <div id="mySidenav" class="sidenav" style="position: absolute;">
                <div class="slidebox" style="padding-right: 20px;">
                  <div class="row">
                    <div class="chartbtnsec">
                      <div align="right">
                        <button class="btn4" onclick="closeSideNav()">CANCEL</button>
                        <button class="btn1" id="saveBtn" onclick="saveNav()">SAVE</button>
                      </div>
                    </div>

                    <div class="col-12">
                      <div class="side-nav-wrapper">
                        <label class="form-label" for="slotDate">Date Available:</label>
                        <div class="form-group calendar_box">
                          <input type="text" id="slotDate" value="" class="form-control" placeholder="Pick OPD Availability Date..." readonly>
                          <i class="ti-calendar picker_calendar" id="slotDatePicker"></i>
                        </div>
                      </div>
                      <div id="suggestion-box1_" class="sugg-cls"></div>
                    </div>

                    <div class="col-6">
                      <div class="side-nav-wrapper">
                        <label class="form-label" for="slotStartTime">Slot Start Time:</label>
                        <div class="form-group calendar_box">
                          <input type="text" id="slotStartTime" value="" class="form-control" placeholder="From time..." readonly>
                          <i class="ti-calendar picker_calendar" id="slotStartTimePicker"></i>
                        </div>
                      </div>
                      <div id="suggestion-box21_" class="sugg-cls"></div>
                    </div>

                    <div class="col-6">
                      <div class="side-nav-wrapper">
                        <label class="form-label" for="slotEndTime">Slot End Time:</label>
                        <div class="form-group calendar_box">
                          <input type="text" id="slotEndTime" value="" class="form-control" placeholder="To time..." readonly>
                          <i class="ti-calendar picker_calendar" id="slotEndTimePicker"></i>
                        </div>
                      </div>
                      <div id="suggestion-box22_" class="sugg-cls"></div>
                    </div>

                    <div class="col-12">
                      <div class="form-group">
                        <label class="form-label">Time Interval (in minutes): </label>
                      </div>
                      <div class="btn-group" role="group" id="interval-group">
                        <input type="radio" class="btn-check" name="intervals" id="radio30" value="30" autocomplete="off">
                        <label class="btn btn-outline-primary" for="radio30">30</label>

                        <input type="radio" class="btn-check" name="intervals" id="radio15" value="15" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="radio15">15</label>

                        <input type="radio" class="btn-check" name="intervals" id="radio10" value="10" autocomplete="off">
                        <label class="btn btn-outline-primary" for="radio10">10</label>
