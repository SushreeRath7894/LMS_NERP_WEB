<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>
	<style></style>
	<script type="text/javascript">


		function agGridOnLoad() {

			agGrid.simpleHttpRequest({
				url: 'bed-mstr-view'
			}).then(function (data) {
				if (!data1) {
					data.push(data1);
				}
				gridOptions.api.setRowData(data);
			});

		}

		$(document).ready(function () {

			$('#dltBtn').attr('disabled', true);

			// AG-GRID Table Load 
			var gridDiv = document.querySelector('#myGrid');
			new agGrid.Grid(gridDiv, gridOptions);
			//gridOptions.api.setRowData([]);

			// View
			agGrid.simpleHttpRequest({
				url: "bed-mstr-view"
			}).then(function (data) {
				var len = data.length;
				$('#totalMstr').find('span').html(len);
				gridOptions.api.setRowData(data);
			});
			function cancelBar() {
				var id = document.getElementById("closeKey");
				id.style.display = "block";

				if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
					id.style.display = "none";
				}
			}
		});

		/* ------------------- search bar for mygrid------------------------ */

		function onQuickFilterChanged() {
			gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
			var displayedRowCount = gridOptions.api.getDisplayedRowCount();
			var len = displayedRowCount;
			$('#totalMstr').find('span').html(len);
		}

		function cancelBar() {
			var id = document.getElementById("closeKey");
			id.style.display = "block";


			if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
				id.style.display = "none";

			}

		}


		var columnDefs = [

			{
				headerName: "Bed Id",
				field: "bedId",
				width: 210,
				flex: 1,
				cellRenderer: function (params) {
					return '<input type="checkbox" id="checkbox_' + params.data.bedId + '"/>'
						+ '<a id="" onclick=editBed("' + params.data.bedId
						+ '") href="javascript:void(0)">'
						+ params.data.bedId + '</a>';
				}
				//hide : true
			}, {
				headerName: "Bed Category",
				field: "bedName",
				width: 200,
				flex: 1,
			}, {
				headerName: "Property Floor Type",
				field: "propertyFloorType",
				width: 230,
				flex: 1,
			}, {
				headerName: "Ward",
				field: "ward",
				width: 200,
				flex: 1,
			},
			{
				headerName: "Bed Availability",
				field: "bedAvailability",
				width: 200,
				flex: 1,
			},{
				headerName: "Bed Charge",
				field: "bedCharge",
				width: 200,
				flex: 1,
			}, {
				headerName: "Bed Description",
				field: "bedDescription",
				width: 200,
				flex: 1,
			}, {
				headerName: "Status",
				field: "status",
				width: 200,
				flex: 1,
			}];

		var gridOptions = {
			columnDefs: columnDefs,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 195,
				height: 10
			},
			//rowSelection: 'single',
			//onSelectionChanged: onSelectionChangedBed


			rowSelection: 'single',
			rowMultiSelectWithClick: true,
			onSelectionChanged: onSelectionChangedBed

		};






		function onSelectionChangedBed() {
			$('#dltBtn').attr('disabled', false);

		}

		function openNav() {
			$("#add").hide();
			$("#bed").hide();

			document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto; top:110px;";
			document.getElementById("main_content").style.width = "75%";
		}

		function closeNav() {

			$("#add").show();
			document.getElementById("mySidenav").style.width = "0";
			document.getElementById("main_content").style.width = "100%";


			$("#bedId").val("");
			$("#bedName").val("");
			$("#propertyFloorType").val("");
			$("#ward").val("");
			$("#bedCharge").val("");
			$("#bedDescription").val("");
			$("#status").val("");
			$("#bedAvailability").val("");
		}

		//wardList

		function getWardList(id) {

			var fname = $('#propertyFloorType').val();
			//alert(fname)
			if (fname) {
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$.ajax({
					type: "GET",
					url: "bed-mstr-ward-list?wid=" + fname,
					success: function (response) {
						if (response.message == "success") {
							$("#ward").empty();
							var option = $("<option></option>");
							$(option).val(null);
							$(option).html("Select");
							$("#ward").append(option);
							for (var i = 0; i < response.body.length; i++) {
								var option = $("<option></option>");
								$(option).val(response.body[i].key);
								$(option).html(response.body[i].name);
								$("#ward").append(option);
							}

							if (id == "0") {

							} else {
								$("#ward").val(id);
							}
						}

					},
					error: function (e) {
					}
				});
			} else {
				$("#ward").empty();
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$("#ward").append(option);
			}
		}


		// save

		function saveNav() {
			var obj = {};
			obj.bedId = $("#bedId").val();
			obj.bedName = $("#bedName").val();
			obj.propertyFloorType = $("#propertyFloorType").val();
			obj.ward = $("#ward").val();
			obj.bedCharge = $("#bedCharge").val();
			obj.bedDescription = $("#bedDescription").val();
			obj.status = $("#status").val();
			obj.bedAvailability = $("#bedAvailability").val();
			
			console.log("Sava Data", obj);

			var validation = true;



			if (validation) {
				$.ajax({
					type: "POST",
					url: "bed-mstr-add",
					contentType: "application/json",
					data: JSON.stringify(obj),
					success: function (response) {
						if (response.message == "success") {

							$("#messageParagraph").text("Data Saved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							$("#activityone").show();
							$("#add").show();
							$("#myGrid").show();
							$("#cancel").hide();
							$("#save").hide();
							$("#form").hide();
							$("#new").hide();

							agGrid.simpleHttpRequest({
								url: "bed-mstr-view"
							}).then(function (data) {
								gridOptions.api.setRowData(data);
							});

							closeNav();
							$("#bedId").val("");
							$("#bedName").val("");
							$("#propertyFloorType").val("");
							$("#ward").val("");
							$("#bedCharge").val("");
							$("#bedDescription").val("");
							$("#status").val("");
							$("#bedAvailability").val("");

						}
					},

					error: function (data) {
					}
				})
			}

		}




		function editBed(id) {

			$("#bed").show();
			$("#add").hide();

			$("#add").hide();
			$("#dltBtn").show();
			agGridOnLoad();

			if ($("#adRole").val() != "") {
				$.ajax({
					type: "GET",
					url: "bed-mstr-edit?id=" + id,
					async: false,
					success: function (response) {
						console.log(response)
						if (response.message == "Success") {
							console.log(response.body)

							openNav();
							$("#myGrid1").show();

							console.log("edit" + response.body);


							$("#bedId").val(response.body.bedId);
							$("#bedName").val(response.body.bedName);
							$("#propertyFloorType").val(response.body.propertyFloorType);

							$("#bedCharge").val(response.body.bedCharge);
							$("#bedDescription").val(response.body.bedDescription);
							if (response.body.status === "Active") {
								$('#status').val("1");
							} else {
								$('#status').val("0");
							}
							
							if (response.body.bedAvailability === "Available") {
								$('#bedAvailability').val("1");
							} else {
								$('#bedAvailability').val("0");
							}



							var propertyFloorType = response.body.propertyFloorType;

							getWardList(response.body.ward);


							$("#ward").val(response.body.ward);
							$("#wardId").val(response.body.wardId);

							var wardId = response.body.wardId

							var fname = $('#propertyFloorType').val();

						}
					},
					error: function (error) {
					}
				});
			}
		}

		//delete bed starts here

		function deleteBed() {

			var id = $('#bedId').val();
			closeNav();
			agGridOnLoad();

			//alert(id)
			$.ajax({
				type: "GET",
				url: "bed-mstr-delete?id=" + id,

				dataType: "json",
				contentType: "application/json",
				success: function (response) {
					if (response.message == "Success") {
						swal("Bed deleted successfully")
						agGrid.simpleHttpRequest({
							url: 'bed-mstr-view'
						}).then(function (data) {
							gridOptions.api.setRowData(data);
						});
					}
				},
				error: function (response) {
					console.log(response);
				}
			})
		}


	</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">
						<div id="main_content">
							<div class="panel-body">
								<div class="d-flex justify-content-between">
									<div class="btn-hs">
										<div class="font-design" id="totalMstr">
											Bed List (<span></span>)
										</div>
									</div>

									<div class="col-md-4" style="margin-bottom: 10px;">
										<div id="searchRowDiv">
											<div class="input-style">
												<input type="text" placeholder="Search.." name="search"
													class="searchboxinput" onkeyup="cancelBar()"
													oninput="onQuickFilterChanged()" id="quickFilter"
													autocomplete="off">
												<div class="searchicon">
													<a href="javascript:void(0)">
														<span
															style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
															id="closeKey"
															onclick="gridOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';"
															class="close_i">
															<i class="ti-close srchicon"></i>
														</span>
													</a>
													<a href="javascript:void(0)">
														<i class="ti-search srchicon"></i>
													</a>
												</div>
											</div>
										</div>
									</div>



									<div class="buttonsec btn-hs" id="btndiv">
										<button id="add" class="new-btn" onclick="openNav()">New</button>

									</div>
								</div>

								<div id="myGrid" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>

							</div>
						</div>
					</div>
				</div>
				<div id="mySidenav" class="sidenav">
					<div class="slidebox">
						<div class="d-flex justify-content-between">
							<div class="edit">Master Details</div>
							<div class="arrow">
								<a href="javascript:void(0)" class="closebtn" onclick="closeNav()"><i
										class="ti-arrow-right"></i></a>
							</div>
						</div>
						<div class="row">
							<div class="col-md-12 buttonsec btn-hs">
								<button class="btn4" onclick="closeNav()">CANCEL</button>
								<button class="save-btn" id="saveBtn" onclick="saveNav()">SAVE</button>
								<button class="btn3" id="dltBtn" onclick="deleteBed()">DELETE</button>

							</div>
						</div>
						<!--<input type="hidden" id="bedId">-->

						<div class="col-md-12" id="bed">
							<div class="form-group">
								<label>Bed Id</label> <input type="text" class="form-control transparenttxtbox"
									placeholder="Bed Id" id="bedId" disabled="true"> <input type="hidden" id="bedId">
							</div>
						</div>

						<div class="col-md-12">
							<div class="form-group">
								<label>Bed Category</label>
								<div class="select">
									<select id="bedName" onblur="removeValid(event)">
										<option th:value="NULL">Select</option>
										<option th:each="c,iter:${bedList}" th:value="${c.key}" th:text="${c.name}">
										</option>
									</select>
								</div>
							</div>
						</div>

						<div class="col-md-12">
							<div class="form-group">
								<label>Property Floor Type</label>
								<div class="select">
									<select id="propertyFloorType" onchange="getWardList('0')"
										onblur="removeValid(event)">
										<option th:value="NULL">Select</option>
										<option th:each="c,iter:${floorList}" th:value="${c.key}" th:text="${c.name}">
										</option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Ward</label>
								<div class="select">
									<select id="ward" onblur="removeValid(event)">
										<option th:value="NULL">Select</option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Bed Availability</label>
								<div class="select">
									<select id="bedAvailability" class="form-control">
										<option value="">Select</option>
										<option value="1">Available</option>
										<option value="0">Occupied</option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Bed Charge</label> <input type="text" class="form-control" id="bedCharge"
									onblur="removeValid(event)" autocomplete="off">
							</div>
						</div>
						
						

						<div class="col-md-12">
							<div class="form-group">
								<label>Status</label>
								<div class="select">
									<select id="status" class="form-control">
										<option value="">Select</option>
										<option value="1">Active</option>
										<option value="0">Inactive</option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Bed Description</label>
								<textarea class="form-control" id="bedDescription" onblur="removeValid(event)"
									autocomplete="off"></textarea>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</body>

</html>
