<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
  <link rel="stylesheet" href="/css/his-css/his-ambulance.css">
  <script type="text/javascript" src="/javaScript/his/his-ambulance.js"></script>
  <script type="text/javascript"
          src="../javaScript/his/his-payment-details.js"></script>
  <style>
    .right-align {
      text-align: right !important;
    }
    .pd-5{padding: 5px;}
  .dtl-radiobtn  label > input[type=radio] {
    vertical-align: middle;
    margin-top: -2px;
}
    .fnt-align{ font-size: calc((12 / 16) * 1rem);}
@media only screen and (max-width: 1399px){
	.fnt-align{ font-size: calc((10 / 16) * 1rem);}
}
@media only screen and (max-width: 575px){
.ht-70{height: 70px;}
}
  </style>
</head>
<body>
<div layout:fragment="content" class="maincontent">
  <div class="container-fluid requisition">

    <!-- Tab panes -->
    <div class="tab-content">

      <!--Tabbination 1 Start-->
      <div id="ambulance" class="tab-pane active">
        <div class="d-flex flex-column flex-lg-row">

          <!--Left Sec Start-->
          <div class="box-sec" id="collapseWidthR1">
            <div class="out-box">
              <div class="d-flex flex-column h-100">
                <div class="d-flex justify-content-between p-2 border-bottom">
                  <div class="col-md-8 col-12">
                    <div class="d-flex gap-2 search-sec">
                      <input class="form-control" type="text" placeholder="Search">
                      <button class="btn go-btn" type="button">Go</button>
                      <button class="btn go-btn" type="reset">Reset</button>
                    </div>
                  </div>
                  <div class="col-md-2 text-end">
                    <button class="btn max-btn" id="collapseButtonR1" onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                      <i class="fa-solid fa-maximize" id="expandIconR1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                    </button>
                  </div>
                </div>

                <div class="card p-2 m-2">
                  <div id="myGrid" style="height: 100vh;" class="ag-theme-alpine"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="box-sec" id="collapseWidthL1">
            <div class="out-box">
              <div class="d-flex flex-column h-100">
                <div class="d-flex justify-content-between p-2 border-bottom">
                  <!--Right Inner Tab Start-->
                  <ul class="nav nav-pills newtab patDetail-tab" role="tablist">
                    <li class="nav-item wd-11" id="tab1Li"><a class="nav-link active" data-bs-toggle="pill" href="#bookingAmbulance" onclick="activityTabs('bookingAmbulance');">Patient Details</a></li>
                    <li class="nav-item wd-12 ambDetail-tab" id="tab2Li"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#ambulanceDetail" onclick="activityTabs('ambulanceDetail');">Ambulance Details</a></li>
                    <li class="nav-item wd-12 pay-tab" id="tab3Li"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#paymentDetail" onclick="activityTabs('paymentDetail');">Payment Details</a></li>
                  </ul>
                  <button class="btn btn-primary max-btn" id="collapseButtonL1" type="button" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" title="Expand">
                    <i class="fa-solid fa-maximize" id="expandIconL1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
                  </button>
                </div>
                <input type="hidden" id="userRolesAmb"
                       th:value="${session.USER_ROLES}">

                <!-- Tab panes -->
                <div class="tab-content flex-fill p-2">
                  <div id="bookingAmbulance" class="tab-pane fade show active h-100">
                    <div class="requisition-tbl d-flex flex-column gap-2 h-100">

                      <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                        <div class="project-name flex-1"><span class="head-user-name" id="pName"></span></div>
                        <div class="d-flex justify-content-end w-100 gap-2 flex-wrap flex-1">
                          <button id="newBtn" class="btn m-0 edit-btn" onclick="newPlan()" type="button">Add</button>
                          <button id="next" class="btn m-0 edit-btn" onclick="next()" type="button">Next</button>
                        </div>
                      </div>

                      <div class="card p-2">
                        <div class="d-flex justify-content-end mb-2">
                          <div class="mandatory-txt">Note: All fields marked with <span>*</span> are mandatory.</div>
                        </div>
                        <div class="row mb-2" id='patDiv'>
                          <div class="col-lg-4">
                            <!--<label><input type="checkbox" id="existingPatientCheckbox">Existing Patient</label>-->
                            <div class="form-check">
                              <input class="nerp-check-input form-check-input" type="checkbox" value="" id="existingPatientCheckbox">
                              <label class="form-check-label" for="existingPatientCheckbox">Existing Patient</label>
                            </div>
                          </div>
                          <div class="col-lg-8" id="extPatDiv" style="display: none;">
                            <label for="extPat">Select a patient:</label>
                            <select id="extPat" class="searchable-select" onchange="getPatientDetailsById(this.value)">
                            <option value="">Select</option>
                            <option th:each="a : ${patList}" th:value="${a.key}" th:text="${a.name}"></option>
                          </select>
                          </div>
                        </div>
                        <div class="row mb-2">
                          <input type="hidden" id="bookingid"> <input type="hidden" id="patientId">
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Patient Name</label> <span class="mandatory">*</span><input
                                 type="text" class="form-control" id="patientName"
                                 onblur="removeValid(event)">
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Age</label> <span class="mandatory">*</span> <input
                                 type="text" class="form-control" id="age"
                                 onblur="removeValid(event)">

                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Mobile Number</label> <span class="mandatory">*</span>
                              <input type="text" class="form-control" id="mobNo"
                                     maxLength="10"
                                     onkeyup="mobVal1();checkNumeric('mobNo');"
                                     onblur="removeValid(event)"> <span id="error9"
                                                                        class="formValidation1"></span>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group calendar_box">
                              <label>Date</label> <span class="mandatory">*</span> <input
                                 type="text" id="isdate" class="form-control"
                                 onblur="removeValid(event)"
                                 th:attr="onkeyup=|formatDate('date','${session.DATEFORMAT_JS}')|"
                                 readonly> <i
                                 class="ti-calendar picker_calendar" id="DateCalendar"
                                 onchange="Insurancefilter();"></i>
                            </div>
                          </div>

                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Time</label> <span class="mandatory">*</span><input
                                 type="text" id="occSdate" value="06:00"
                                 class="form-control" onblur="removeValid(event)"
                                 readonly>

                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Alternate Mobile No</label> <input type="text"
                                                                        class="form-control" id="mobNo2" maxLength="10"
                                                                        onkeyup="mobVal3();checkNumeric('mobNo2');"
                                                                        onblur="removeValid(event)"> <span id="error2"
                                                                                                           class="formValidation1"></span>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Gender</label> <span class="mandatory">*</span> <select
                                 id="gender" class="form-select">
                              <option value="">Select</option>
                              <option th:each="c,iter:${genderList}"
                                      th:value="${c.key}" th:text="${c.name}"></option>
                            </select>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">

                              <label>Country</label> <span class="mandatory">*</span>
                              <select class="form-select fromtxt countryclss"
                                      id="countryid_" onblur="removeValid(event)"
                                      onchange="getStateList('');">
                                <option value="">Select</option>
                                <option th:each="c,iter:${counntryList}"
                                        th:if="${c.key} == 'cntry001'" th:value="${c.key}"
                                        th:text="${c.name}"></option>
                              </select>
                            </div>
                          </div>

                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>State</label> <span class="mandatory">*</span> <select
                                 class="form-select fromtxt stateclss" id="stateid_"
                                 onchange="getDistrictDetails('')"
                                 onblur="removeValid(event)">
                              <option value="">Select</option>
                              <option th:each="c,iter:${stateList}"
                                      th:value="${c.key}" th:text="${c.name}"></option>
                            </select>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>District</label> <span class="mandatory">*</span>
                              <select id="dist" onchange="getCityDetails('')"
                                      onblur="removeValid(event)" class="form-select">
                                <option th:value="NULL">Select</option>
                                <option th:each="c,iter:${districtList}"
                                        th:value="${c.key}" th:text="${c.name}"></option>
                              </select><span class="focus"></span>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>City</label> <span class="mandatory">*</span> <select
                                 class="form-select fromtxt cityclsss" id="cityid_"
                                 onblur="removeValid(event)">
                              <option value="">Select</option>
                              <option th:each="c,iter:${cityList}"
                                      th:value="${c.key}" th:text="${c.name}"></option>
                            </select>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Pin Code</label> <span class="mandatory">*</span>
                              <input type="text" class="form-control" id="pincode"
                                     maxLength="6"
                                     onkeyup="mobVal2();checkNumeric('pincode');"
                                     onblur="removeValid(event)"> <span id="error1"
                                                                        class="formValidation1"></span>
                            </div>
                          </div>


                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Address</label> <span class="mandatory">*</span>
                              <textarea class="form-control" id="add"
                                        onblur="removeValid(event)" autocomplete="off"></textarea>
                            </div>
                          </div>

                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Reason For Ambulance</label>
                              <textarea class="form-control" id="reasonambulance"
                                        onblur="removeValid(event)" autocomplete="off"></textarea>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Ambulance Type</label> <select id="typeAmb"
                                                                    onblur="removeValid(event)" class="form-select">
                              <option th:value="NULL">Select</option>
                              <option th:each="c,iter:${ambulanceTypeList}"
                                      th:value="${c.key}" th:text="${c.name}"></option>
                            </select> <span class="focus"></span>
                            </div>
                          </div>
                          <div class="col-lg-4">
                            <div class="form-group">
                              <label>Requirements</label> <select id="reqAmb"
                                                                  onblur="removeValid(event)" class="form-select">
                              <option th:value="NULL">Select</option>
                              <option th:each="c,iter:${ambulanceRequirementList}"
                                      th:value="${c.key}" th:text="${c.name}"></option>
                            </select> <span class="focus"></span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div id="ambulanceDetail" class="tab-pane fade h-100" style="display: none;">
                    <div class="requisition-tbl d-flex flex-column gap-2 h-100">

                      <div class="d-flex w-100 flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center gap-2 p-2 border rounded">
                        <div class="project-name flex-1"><span class="head-user-name" id="pName1"></span></div>
                        <div class="d-flex justify-content-end w-100 gap-2 flex-wrap flex-1">
                          <button id="prev" class="btn m-0 edit-btn" onclick="prev()" type="button">Prev</button>
                          <button id="next1" class="btn m-0 edit-btn" onclick="next1();" type="button">Next</button>
                          <button id="save" onclick="masterSaveData()" class="btn m-0 edit-btn" type="button">Save</button>
                          <div id="accRejSecDiv">
                            <div class="d-flex gap-2">
                              <button id="acceptAmb" onclick="changeStatus(1)" class="btn m-0 edit-btn" type="button">Accept</button>
                              <button id="rejectAmb" onclick="changeStatus(2)" class="btn m-0 edit-btn" type="button">Reject</button>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="card p-2">
                        <div class="mb-1" id="ambulanceDetails">
                          <h6 class="details-box m-0 p-0">AMBULANCE DETAILS</h6>
                          <table class="table table-borderless mb-0" width="100%">
                            <tr valign="middle">
                              <td width="50%">
                                <div class="border pd-5 ht-70">
                                  <strong>Booking Id:</strong> <strong id="ambBookingId"></strong>
                                </div>
                              </td>
                              <td width="50%">
                                <div class="border pd-5 ht-70">
                                  <strong>Ambulance Number:</strong><strong id="ambulanceNumber"></strong>
                                </div>
                              </td>
                            </tr>
                            <tr valign="middle">
                              <td width="50%">
                                <div class="border pd-5 ht-70">
                                  <strong>Driver Name:</strong> <strong id="driverName"></strong>
                                </div>
                              </td>
                              <td width="50%">
                                <div class="border pd-5 ht-70">
                                  <strong>Driver Contact:</strong> <strong id="driverContact"></strong>
                                </div>
                              </td>
                            </tr>

                            <tr valign="middle">
                              <!-- <td width="50%">
                                <div style="border: 1px solid #ddd; padding: 5px;">
                                  <strong>Service Type:</strong> <strong id="serviceType"></strong>
                                </div>
                              </td> -->
                              <td width="50%">
                                <div class="ht-70" style="border: 1px solid #ddd; padding: 5px;">
                                  <strong>Booking Date:</strong> <strong id="bookingDate"></strong>
                                </div>
                              </td>
                            </tr>
                          </table>
                        </div>
                        <div id="activity" style="height: 100vh;" class="ag-theme-alpine"></div>
                      </div>
                    </div>


                  </div>

                  <div id="paymentDetail" class="tab-pane fade h-100" style="display: none;">
                    <div th:replace="his/his-billing :: his-billing"></div>
                  </div>
                </div>
              </div>


            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>

</html>
