<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"

<head>

  <style>
    .nav-pills .nav-link.active, .nav-pills .show>.nav-link { background-color: var(--primary); }
    .nav-link { color: var(--primary); }
    input[name=meds] { float: right; margin-inline: 0.5em;}
    .chartbtnsec { display: flex; margin-right: unset; flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 1em;}
    .nav-link:active, .nav-link:focus, .nav-link:hover { background-color: rgba(33,150,243,.4); color: #000; }
    .nav-pills .nav-link { border: 1px solid; color: var(--primary); }
    nav .nav { gap: 1vw;}
    .tab-content { margin-top: 1em;}
    .searchRowDiv { display: flex; justify-content: center; margin-bottom: 10px; }
    .content_padding { padding: 0 10px; }
    #closeKeyMeds, #closeKeyTests  { border-right: 1px solid #ccc; padding-right: 5px; }

    .calendar_box { position: relative; top: -7px; width: 50%; }
    .calendar_box input { padding-left: 5px; }
    .picker_calendar { top: 10px; right: 10px; }
    .calendar-section .form-label { font-size: 0.8em; font-weight: 600; padding-inline: 5px; color: #929292; }

    .side-nav-wrapper label { font-size: 14px; }
    .side-nav-wrapper { width: 100%; }
    .side-nav-wrapper .calendar_box { width: 100%; }
  </style>

  <script type="text/javascript">

    $(document).ready(function () {

      // Initialize the #gridMeds ag-grid
      var gridMeds = document.querySelector('#gridMeds');
      new agGrid.Grid(gridMeds, gridOptionMeds);

      var gridTests = document.querySelector('#gridTests');
      new agGrid.Grid(gridTests, gridOptionTests);

      let c = new Date();
      let c1 = c.getDate();
      if (c1 < 10) c1 = '0' + c1;
      let c2 = c.getMonth() + 1;
      if (c2 < 10) c2 = '0' + c2;
      let c3 = c.getFullYear();
      let currentDate = `${c1}.${c2}.${c3}`;
      // console.log(`${c1}.${c2}.${c3} today's date`);

      /* Date Picker for OPD Meds Tab page :: Start */
      let dateOptions =  { format: 'd.m.Y', closeOnDateSelect: true, timepicker: false, minDate: false, value: currentDate }
      let startMDate = $('#startMeds');
      let endMDate = $('#endMeds');
      startMDate.datetimepicker(dateOptions);
      $("#fromDateCalenderMeds").click(() => startMDate.datetimepicker('show'));
      endMDate.datetimepicker(dateOptions);
      $("#toDateCalenderMeds").click(() => endMDate.datetimepicker('show'));

      let startTDate = $('#startTests');
      let endTDate = $('#endTests');
      startTDate.datetimepicker(dateOptions);
      $("#fromDateCalenderTests").click(() => startTDate.datetimepicker('show'));
      endTDate.datetimepicker(dateOptions);
      $("#toDateCalenderTests").click(() => endTDate.datetimepicker('show'));
      /* Date Picker for OPD Meds Tab page :: End */

      searchDataMeds();
      searchDataTests();

        $("#saveTimeSlotData").prop('disabled', true);

        console.table([...data]);

      });*/

    });

    function searchDataMeds() {
      let start = $("#startMeds");
      let end = $("#endMeds");
      let partStart = start.val().split('.');
      let partEnd = end.val().split('.');
      let fromDate = [partStart[2], partStart[1], partStart[0]].join('-');
      // console.log(fromDate, "fromDate");
      let toDate = [partEnd[2], partEnd[1], partEnd[0]].join('-');
      // console.log(toDate, "toDate");
      agGrid.simpleHttpRequest({
        url: "view-emergency-treatment-lists?fromDate=" + fromDate + "&toDate=" + toDate,
      }).then(data => {
        let da = []
        gridOptionMeds.api.setRowData(da);
        let jsonData = JSON.parse(data.body);
        let allData = jsonData["OPDTreatment"];
        // console.log(`Data between ${fromDate} and ${toDate}... \n`, allData);

        $('#opd-meds').find('span').html(allData?.length?allData.length:'0');
        gridOptionMeds.api.setRowData((allData));
      });
    }

    function searchDataTests() {
      let start = $("#startMeds");
      let end = $("#endMeds");
      let partStart = start.val().split('.');
      let partEnd = end.val().split('.');
      let fromDate = [partStart[2], partStart[1], partStart[0]].join('-');
      // console.log(fromDate, "fromDate");
      let toDate = [partEnd[2], partEnd[1], partEnd[0]].join('-');
      // console.log(toDate, "toDate");
      agGrid.simpleHttpRequest({
        url: "view-emergency-test-lists?fromDate=" + fromDate + "&toDate=" + toDate,
      }).then(data => {
        let da = []
        gridOptionTests.api.setRowData(da);
        let jsonData = JSON.parse(data.body);
        let allData = jsonData["OPDTest"];
        console.log(`Data between ${fromDate} and ${toDate}... \n`, allData);

        $('#opd-tests').find('span').html(allData?.length?allData.length:'0');
        gridOptionTests.api.setRowData((allData));
      });
    }

    function resetMeds() {
      let c = new Date();
      let c1 = c.getDate();
      if (c1 < 10) c1 = '0' + c1;
      let c2 = c.getMonth() + 1;
      if (c2 < 10) c2 = '0' + c2;
      let c3 = c.getFullYear();
      let currentDate = `${c1}.${c2}.${c3}`;
      $("#startMeds").val(currentDate);
      $("#endMeds").val(currentDate);
      searchDataMeds();
    }

    function resetTests() {
      let c = new Date();
      let c1 = c.getDate();
      if (c1 < 10) c1 = '0' + c1;
      let c2 = c.getMonth() + 1;
      if (c2 < 10) c2 = '0' + c2;
      let c3 = c.getFullYear();
      let currentDate = `${c1}.${c2}.${c3}`;
      $("#startTests").val(currentDate);
      $("#endTests").val(currentDate);
      searchDataTests();
    }

    


    /* ------------------- search bar for myGrid------------------------ */
    function cancelBarMeds() {
      let id = document.getElementById("closeKeyMeds");
      id.classList.remove('d-none');
      let quickFilter = $('#quickFilterMeds');
      if (quickFilter.val() == null || quickFilter.val() === '') {
        id.classList.toggle('d-none');
      }
    }
    function cancelBarTests() {
      let id = document.getElementById("closeKeyTests");
      id.classList.remove('d-none');
      let quickFilter = $('#quickFilterTests');
      if (quickFilter.val() == null || quickFilter.val() === '') {
        id.classList.toggle('d-none');
      }
    }
    /* ------------------- search bar for myGrid------------------------ */

    function onQuickFilterMedsChanged() {
      gridOptionMeds.api.setQuickFilter(document.getElementById('quickFilterMeds').value);
      var displayedRowCount = gridOptionMeds.api.getDisplayedRowCount();
      var len = displayedRowCount;
      $('#opd-meds').find('span').html(len);
    }

    function onQuickFilterTestsChanged() {
      gridOptionTests.api.setQuickFilter(document.getElementById('quickFilterTests').value);
      var displayedRowCount = gridOptionTests.api.getDisplayedRowCount();
      var len = displayedRowCount;
      $('#opd-meds').find('span').html(len);
    }


    var columnDefMeds = [
      {
        headerName: "Medicine Name",
        field: "medName",
        flex: 1,
      },{
        headerName: "Medicine Type",
        field: "medType",
      }, {
        headerName: "Dosage",
        field: "dosage",
      }, {
        headerName: "Morning",
        field: "morning",
      }, {
        headerName: "Afternoon",
        field: "afternoon",
      },
      {   headerName: "Night",
          field: "night",
       },

            field: "duration",
       },
       { headerName: "Start Date",
           field: "startDate",
        }, 
        { headerName: "End Date",
          field: "endDate",
       },
       { headerName: "Status",

        }];
    
    var columnDefTests = [
      {
          headerName: "Test Group",

    var gridOptionMeds = {
      columnDefs: columnDefMeds,
      defaultColDef: {

        filter: true,

        flex: 1,
        height: 10,
        cellStyle: {textAlign: "center"}

    function openSideNavMeds() {
      document.getElementById("addMedicine").disabled = true;
      document.getElementById("sideNavMeds").style.cssText = "width: 30%; position: absolute; right: 0; overflow: hidden; height:auto; top:175px; border: 1px solid #ccc";
      document.getElementById("gridMeds").style.width = "70%";
    }

    function closeSideNavMeds() {
      document.getElementById("addMedicine").disabled = false;
      document.getElementById("sideNavMeds").style.cssText = "width: 0; height: 0;";
      document.getElementById("gridMeds").style.width = "100%";
    }

    function openSideNavTests() {
      document.getElementById("addNewTests").disabled = true;

      document.getElementById("gridTests").style.width = "70%";
    }

    function closeSideNavTests() {
      document.getElementById("addNewTests").disabled = false;
      document.getElementById("sideNavTests").style.cssText = "width: 0; height: 0;";
      document.getElementById("gridTests").style.width = "100%";

 // save medicine

	function saveMedData() {
		var obj = {};
		var id1 =  $("#emerId").html();
		
	    obj.id = id1;		
		obj.medId = $("#medId").val();
		
		var checkedVal1 = '';
		var checkedVal2 = '';
		var checkedVal3 = '';

		var morningCheck = $("input[name='morningCheck']:checked").val();
		if (morningCheck != "0" && morningCheck != undefined) {
		    checkedVal1 = morningCheck;
		} else {
		    checkedVal1 = "0";
		}

		var noonCheck = $("input[name='noonCheck']:checked").val();
		if (noonCheck != "0" && noonCheck != undefined) {
		    checkedVal2 = noonCheck;
		} else {
		    checkedVal2 = "0";
		}

		var nightCheck = $("input[name='nightCheck']:checked").val();
		if (nightCheck != "0" && nightCheck != undefined) {
		    checkedVal3 = nightCheck;
		} else {
		    checkedVal3 = "0";
		}

		obj.morningCheck=checkedVal1;
		obj.noonCheck=checkedVal2;
		obj.nightCheck=checkedVal3;
		obj.duration = $("#duration").val();
		obj.remarks = $("#remarks").val();
		obj.dosage = $("#dosage").val();
		obj.medType = $("#medType").val();
		
		var validation = true;



		if (validation) {
			$.ajax({
				type: "POST",
				url: "his-emergency-treatment-add",
				contentType: "application/json",
				data: JSON.stringify(obj),
				success: function (response) {
					if (response.message == "success") {

						$("#messageParagraph").text("Data Saved Successfully");
						closeSideNavMeds();
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						
						$("#myGrid").show();
						searchDataMeds();
						

						$("#medName").val("");
						$("#morningCheck").val("");
						$("#noonCheck").val("");
						$("#slotEndTime").val("");
						$("#nightCheck").val("");
						$("#duration").val("");
						$("#remarks").val("");
						$("#dosage").val("");
						$("#medType").val("");

					}
				},

				error: function (data) {
				}
			})
		}

	}
 
 

	 // save Test

		function saveTestsData() {
			var obj = {};
			var id1 =  $("#emerId").html();
			
		    obj.id = id1;		
			obj.testGroup = $("#testId").val();
			obj.testType = $("#testType").val();
			obj.remarksTests = $("#remarksTests").val();
			
			var validation = true;



			if (validation) {
				$.ajax({
					type: "POST",
					url: "his-emergency-treatment-test-add",

					success: function (response) {
						if (response.message == "success") {

							$("#messageParagraph").text("Data Saved Successfully");
							closeSideNavTests();
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							
							$("#myGrid").show();
							searchDataTests();
							

							$("#medName").val("");
							
							$("#testGroup").val("");
							$("#remarksTests").val("");
							

						}
					},

					error: function (data) {
					}
				})
			}

		}
 
	/* Medicine AutoSearch */

	function getMedicineList() { 
		var search = $("#medName").val();
		if (search) {

			$.ajax({
						type : "POST",
						url : "his-opd-treatment-medicine-list",
						dataType : 'json',
						contentType : 'application/json',
						data : search,
						success : function(response) {
							if (response.message == "success") {
								if (response.body.length != 0) {
									$("#search").css("background", "#FFF");
									var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;">';
									for (var i = 0; i < response.body.length; i++) {
										content += '<li class="autocompletedata cp" onClick="selectAutocompleteValue1(\''
												+ response.body[i].medId
												+ '\',\''
												+ response.body[i].medName
												+ '\',\''
												+ response.body[i].medType
												+ '\')">'
												+ response.body[i].medName
												+ '</li>';
									}
									content += '</ul>';
									//console.log("content " + content)
									$("#suggesstion-box1_").show();
									$("#suggesstion-box1_").html(content);

								} else {
									$("#search").css("background", "#FFF");
									var content = '<ul id="autocomplete-list3">';
									content += '<li onClick="selectAutocompleteValue()">'
											+ "No Data Found" + '</li>';
									content += '</ul>';
									$("#suggesstion-box1_").show();
									$("#suggesstion-box1_").html(content);
								}
							}
						},
						error : function(data) {
							//console.log(data);
						}
					})
		}

	}

	function selectAutocompleteValue1(medId, medName,medType) {

		if (medId) {
			$("#medId").val(medId);
			$("#medName").val(medName);
			$("#medType").val(medType);
			$("#search").val(medName);
			$("#search").attr('data-procat', medId);
			$("#suggesstion-box1_").hide();
		} else {
			$("#medId").val("");
			$("#medName").val("");	
			$("#medType").val("");	
			$("#search").val("");
			$("#search").attr('data-procat', "");
			$("#suggesstion-box1_").hide();

		}
	}

	function selectAutocompleteValue2(testId, testName,testType) {

		if (testId) {
			$("#testId").val(testId);
			$("#testName").val(testName);
			$("#testType").val(testType);

		} else {

			$("#testType").val("");	
			$("#search").val("");

		}
	}
	
	function getTypeName(id) {
		var cname = $('#testType').val();
		if (cname) {
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$.ajax({
				type: "GET",
				url: "his-opd-typeList?id=" + cname,
				success: function (response) {
					if (response.message == "success") {
						$("#testType").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#testType").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#testType").append(option);
						}
						if (id == "0") {

						} else {
							$("#testType").val(id);
						}
					}
				},
				error: function (e) {
				}
			});
		} else {
			$("#testType").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
			$("#testType").append(option);
			$("#testType").empty();
			var option = $("<option></option>");
			$(option).val(null);
			$(option).html("Select");
		}
	}

<body>
<div layout:fragment="content" class="maincontent">
  <div class="container-fluid">
    <div class="row">
      <div class="maincontentsec">
        <div class="content_padding">
          <div id="main_content">
            <div class="panel-body">
            <div type="hidden" th:text="${emerId1}" id="emerId"></div>
              <nav>
                <div class="nav nav-pills flex-column flex-sm-row" id="nav-tab" role="tablist">
                  <button class="flex-sm-fill text-sm-center nav-link active" id="add-medicine-tab" data-bs-toggle="tab" data-bs-target="#add-medicine" type="button" role="tab">Medicine</button>
                  <button class="flex-sm-fill text-sm-center nav-link" id="add-tests-tab" data-bs-toggle="tab" data-bs-target="#add-tests" type="button" role="tab">Tests</button>
                </div>
              </nav>

                    <div class="font-design" id="opd-meds">

                    </div>
                    <div class="d-flex calendar-section">
                      <div class="d-flex">
                        <label class="form-label" for="startMeds">Starting Slot:</label>
                        <div class="form-group calendar_box">
                          <input type="text" id="startMeds" value="" class="form-control" placeholder="from date..." readonly>
                          <i class="ti-calendar picker_calendar" id="fromDateCalenderMeds"></i>
                        </div>
                      </div>

                      <div class="d-flex">
                        <label class="form-label" for="endMeds">Ending Slot:</label>
                        <div class="form-group calendar_box">
                          <input type="text" id="endMeds" value="" class="form-control" placeholder="to date..." readonly>
                          <i class="ti-calendar picker_calendar" id="toDateCalenderMeds"></i>
                        </div>
                      </div>
                    </div>
                    <div class="searchRowDiv">
                      <div class="input-style">
                        <label for="quickFilterMeds" class="visually-hidden"></label>
                        <input type="text" placeholder="Search..." name="search" class="searchboxinput" onkeyup="cancelBarMeds()" oninput="onQuickFilterMedsChanged()" id="quickFilterMeds" autocomplete="off">
                        <div class="searchicon">
                          <a href="javascript:void(0)">
                        <span class="d-none close_i" id="closeKeyMeds"
                              onclick="gridOptionMeds.api.setQuickFilter(null);$('#quickFilterMeds').val('');document.getElementById('closeKeyMeds').classList.toggle('d-none');">

                        </div>
                      </div>
                    </div>
                    <div class="buttonsec btn-hs" id="btndivMeds">
                      <button id="addMedicine" class="new-btn" onclick="openSideNavMeds()">New</button>
                      <button id="searchButtonMeds" class="btn1" onclick="searchDataMeds()">Search</button>
                      <button id="resetButtonMeds" class="btn3" onclick="resetMeds()">Reset</button>
                    </div>
                  </div>

                  <!-- ag-grid starts here -->
                  <div id="gridMeds" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>
                  
                  <!-- ag-grid ends here -->

                  <!-- side-nav starts here -->
                  <div id="sideNavMeds" class="sidenav">
                    <div class="slidebox">
                      <div class="row">
                        <div class="chartbtnsec">
                          <div><!--<h3>Add Medicines</h3>--></div>
                          <div>
                            <button class="btn4" onclick="closeSideNavMeds()">CANCEL</button>
                            <button class="btn1" id="saveMed" onclick="saveMedData()">SAVE</button>
                          </div>
                        </div>

                        <div class="col-lg-12 mb-2">
                          <div class="form-group">
										<div class="autocomplete" style="width: 100%;">
											<label>Medicine</label> <input type="text" id="medName"
												placeholder="Search Here.." class="form-control"
												onkeyup='getMedicineList()'><input type="hidden"
												id="medId">
										</div>
										<div id="suggesstion-box1_" class="sugg-cls"></div>

									</div>
                        </div>
                        
                        

                        <div class="col-lg-12 mb-2">
                         <!--  <div class="form-group">
                            <label class="form-label" id="medType">Type :</label>
                          </div>
                           -->
										<div class="form-group">
											<label>Type</label><input type="text"
												id="medType" placeholder=""
												class="form-control" autocomplete="off" readonly>
										</div>
                          
                          
                          <div class="d-flex justify-content-between">
                            <div class="form-group">
                              <label class="form-label" for="morningCheck">Morning</label>
                              <input type="checkbox" id="morningCheck" value="1" name="morningCheck">
                            </div>
													
                            <div class="form-group">
                              <label class="form-label" for="noonCheck">Afternoon</label>
                              <input type="checkbox" id="noonCheck" value="1" name="noonCheck">
                            </div>
                            <div class="form-group">
                              <label class="form-label" for="nightCheck">Night</label>
                              <input type="checkbox" id="nightCheck" value="1" name="nightCheck">
                            </div>
                          </div>
                        </div>

                        <div class="col-lg-12 mb-2">
                          <div class="side-nav-wrapper">
                            <label class="form-label" for="duration">Duration (In Days):</label>
                            <input type="text" name="" id="duration" class="form-control">
                          </div>
                        </div>
                        
                      

						<div class="col-lg-12 mb-2">
							<div class="side-nav-wrapper">
								<label>Dosage</label>
								<div class="select">
							<select id="dosage" class="form-control">
							<option value="">Select</option>
						    <option value="0.5">0.5</option>
						    <option value="1">1</option>
						    <option value="2">2</option>
						    <option value="3">3</option>
						    <option value="4">4</option>
						    <option value="5">5</option>
						    <option value="6">6</option>
							</select>
								</div>
								</div>
						</div>

					<div class="col-lg-12">
                          <div class="side-nav-wrapper">
                            <label class="form-label" for="remarks">Remarks:</label>
                            <textarea type="text" name="" id="remarks" class="form-control"></textarea>
                          </div>
                        </div>

                      </div>
                    </div>
                  </div>
                  <!-- side-nav ends here -->
                </div>
                <div class="tab-pane fade" id="add-tests" role="tabpanel" aria-labelledby="nav-profile-tab">

                  <div class="d-flex justify-content-between">
                    <div class="font-design" id="opd-tests">
                      Emergency Tests List (<span></span>)
                    </div>
                    <div class="d-flex calendar-section">
                      <div class="d-flex">
                        <label class="form-label" for="startTests">Starting Slot:</label>
                        <div class="form-group calendar_box">
                          <input type="text" id="startTests" value="" class="form-control" placeholder="from date..." readonly>
                          <i class="ti-calendar picker_calendar" id="fromDateCalenderTests"></i>
                        </div>
                      </div>

                      <div class="d-flex">
                        <label class="form-label" for="endTests">Ending Slot:</label>
                        <div class="form-group calendar_box">
                          <input type="text" id="endTests" value="" class="form-control" placeholder="to date..." readonly>
                          <i class="ti-calendar picker_calendar" id="toDateCalenderTests"></i>
                        </div>
                      </div>
                    </div>
                    <div class="searchRowDiv">
                      <div class="input-style">
                        <label for="quickFilterTests" class="visually-hidden"></label>
                        <input type="text" placeholder="Search..." name="search" class="searchboxinput" onkeyup="cancelBarTests()" oninput="onQuickFilterTestsChanged()" id="quickFilterTests" autocomplete="off">
                        <div class="searchicon">
                          <a href="javascript:void(0)">
                        <span class="d-none close_i" id="closeKeyTests"
                              onclick="gridOptionTests.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKeyTests').classList.toggle('d-none');">
                          <i class="ti-close srchicon"></i>
                        </span>
                          </a>
                          <a href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
                        </div>
                      </div>
                    </div>
                    <div class="buttonsec btn-hs" id="btndiv">
                      <button id="addNewTests" class="new-btn" onclick="openSideNavTests()">New</button>
                      <button id="searchTestsButton" class="btn1" onclick="searchDataTests()">Search</button>
                      <button id="resetTestsButton" class="btn3" onclick="resetTests()">Reset</button>
                    </div>
                  </div>

                  <!-- ag-grid starts here -->
                  <div id="gridTests" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>
                  <!-- ag-grid ends here -->

                  <!-- side-nav starts here -->
                  <div id="sideNavTests" class="sidenav">
                    <div class="slidebox">
                      <div class="row">
                        <div class="chartbtnsec">
                          <div><!--<h3>Add Medicines</h3>--></div>
                          <div>
                            <button class="btn4" onclick="closeSideNavTests()">CANCEL</button>
                            <button class="btn1" id="saveTestsData" onclick="saveTestsData()">SAVE</button>
                            
                          </div>
                        </div>

                        <div class="col-lg-12 mb-2">
                          <div class="form-group">
										<div class="autocomplete" style="width: 100%;">
											<label>Test Group</label> <input type="text" id="testName"
												placeholder="Search Here.." class="form-control"
												onkeyup='getTestList()'><input type="hidden"
												id="testId" >
										</div>
                                 <div id="suggesstion-box2_" class="sugg-cls" onchange="getTypeName('0')"></div>
									</div>
                        </div>
                        
                        <div class="col-lg-12 mb-2">
								<div class="form-group">
									<label>Type Name</label>
									<div class="select">
										<select id="testType" onblur="removeValid(event)">
											<option th:value="NULL">Select Type</option>
											<option th:each="c,iter:${typeList}" th:value="${c.key}"
												th:text="${c.name}"></option>
										</select> <span class="focus"></span>
									</div>
								</div>
							</div>
                        
                        <div class="col-lg-12">
                          <div class="side-nav-wrapper">
                            <label class="form-label" for="remarksTests">Remarks:</label>
                            <textarea type="text" name="" id="remarksTests" class="form-control"></textarea>
                          </div>
                  
                        </div>

                      </div>
                    </div>
                  </div>

                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
