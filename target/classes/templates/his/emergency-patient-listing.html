<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style type="text/css">
      body{font-family: "Helvetica Neue",Helvetica,Arial,sans-serif;}
      table {
        overflow-y: auto;
        border:#ccc;
      }

      table td,
      th {
        padding: 3px 5px;
        height: 46px;
        white-space: nowrap;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
      }
      .table {
        overflow-y: auto;
        height:78vh;
      }
      .table thead th {
        position: sticky;
        top: 0px;
      }
      .header-logo{
        display: flex;    
        background: #f5f5f5;
        padding: 10px;
        border: 1px solid #6a27c0;
      }
      .header-logo img {
        height: 100px;
        margin-right: 20px;
      }
      .date{
        font-size: 22px;
        color: #999;
      }
      .designation {
        font-size: 22px;
        color: #999;
      }
       .table{box-shadow: 3px 5px 8px #dedcdc;}
      .doctor-name {
        font-size: 36px;
        font-weight: bold;
        text-transform: uppercase;
        color: #6a27c0;
      }
      .bg-sky{background: #dabeff; font-size:24px; font-weight: bold;}
      .mb-20{margin-bottom: 20px}

        /* width */
        ::-webkit-scrollbar {
          width:5px;
        }

        /* Track */
        ::-webkit-scrollbar-track {
          background: #f1f1f1;
        }

        /* Handle */
        ::-webkit-scrollbar-thumb {
          background: #888;
        }

        /* Handle on hover */
        ::-webkit-scrollbar-thumb:hover {
          background: #555;
        }
    </style>
    
    <script>
    
    $(document).ready(function(){
    	var userId = $("#userId").val();
    	var today = new Date();
    	var formattedDate = formatDate(today);
    	$("#oppointDate").text(formattedDate);
    	$.ajax({
    		type : "GET",
    		url : "emergency-listing-getPatientList?userId=" + userId,
    		async : false,
    		success : function(response) {
    			
    			if (response.code == "Success") {
    				var trCount = '';
    				var countItm=response.body.length;
    				$("#itemTableDetails").empty();
    				console.log("count response mail----------"+countItm);
    				$("#department").text(response.body[0].department)
    				$("#lName").text(response.body[0].lName)
    				for (var i = 0; i < response.body.length; i++) {
    					var itemRow='<tr>'
    						+'<td id="orderIdCell" style="text-align:center">'+response.body[i].patientId+'</td>'	
    						+'<td style="text-align:center">'+response.body[i].avlSlot+'</td>'	
    						+'<td style="text-align:center">'+response.body[i].fName+'</td>'	
    						+'</tr>';
    						trCount = itemRow;
    						$("#itemTableDetails").append(trCount);

    					}    				
    			}

    		},
    		error : function(response) {
    		}
    	});
    });
    
    
    
	function formatDate(date) {
	    // Get day, month, and year
	    var day = date.getDate();
	    var month = date.getMonth() + 1; // Month is zero-based
	    var year = date.getFullYear();

	    // Add leading zeros if necessary
	    if (day < 10) {
	        day = '0' + day;
	    }
	    if (month < 10) {
	        month = '0' + month;
	    }

	    // Concatenate and return the formatted date
	    return day + '/' + month + '/' + year;
	}
    </script>
  </head>
  <body>
  <div layout:fragment="content" class="maincontent">
  <div class="container-fluid">
  <div class="row">
  <div class="maincontentsec">
    <div class="header-logo mb-20">
      <img src="../assets/images/login_img/logo.png">
      <div>
        <div class="doctor-name"><span id="userNames" th:text="${session.USER_NAME}"></span></div>
        <input type="hidden" id="userId" th:value="${session.USER_ID}" />
        <div class="designation"><span id="department"></span></div>
        <div><span id="oppointDate" class="date"></span></div>
      </div>
    </div>
    <div class="table">
    <table border="1" width="100%" cellspacing="0" cellpadding="0">
        <thead>
      <tr>
        <th width="33%" class="bg-sky">Emergency</th>
        <th width="33%" class="bg-sky">Patient Name</th>
        <th width="33%" class="bg-sky">Slot</th>
      </tr>
      </thead>
<tbody id="itemTableDetails">
</tbody>
      
    </table>
    </div>
</div>
</div>
</div>
</div>
</body>
</html>
