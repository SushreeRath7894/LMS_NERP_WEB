			$("input[name=ReminderYesOrNo]:radio").click(function () {
				if ($('input[name=ReminderYesOrNo]:checked').val() == "Yes") {

				} else if ($('input[name=ReminderYesOrNo]:checked').val() == "No") {

			});


			var dateFormat = localStorage.getItem("dateFormat");
			$("#startDateCalendar").datetimepicker({
				format: dateFormat,
				closeOnDateSelect: true,
				timepicker: false,
			}).on("change", function () {
				$('#startDate').val($(this).val());
			})

			$('#startDate').blur(function () {
				$("#startDateCalendar").val($(this).val());
			})

			$("#endDateCalendar").datetimepicker({

			})

				timepicker: true,
				datepicker: false,

		function rowSelect() {
			var selectedRows = gridOptions.api.getSelectedRows();
			deleteId = "";
			var vndId = "";

			if (selectedRows && selectedRows.length > 0) {
				for (var i = 0; i < selectedRows.length; i++) {
					deleteId = deleteId + '"' + selectedRows[i].vendorId + '",';
					vndId = selectedRows[i].vendorId;
				}

				var rowCount = 0;
				nextTab('vendorInfLiId');
				editPage(vndId, '0');

				selectedRows.forEach(function (selectedRow, index) {
					rowCount = rowCount + 1;
				});

					$('#delete').attr("disabled", false);

					$("#mstrAddBtn").show();
					$("#cancelMainBtn").hide();

					disableField();
				} else {
					$('#delete').attr("disabled", true);
					$("#editVendorBtn").hide();
					$("#deleteVendorBtn").hide();
					$("#mstrAddBtn").hide();
					$("#cancelMainBtn").show();
					$("#mstrSaveBtn").show();

			} else {

		function pancardVal() {
			var pancard = $('#pan').val();

			var pancardid = /([A-Z]){5}([0-9]){4}([A-Z]){1}$/;
			var format = /[ `!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~]/;

			if (pancard != '' && pancard.toUpperCase() === pancard
				&& !format.test(pancard)) {
				if (pancardid.test(pancard)) {
					$("#error4").hide();
					pancardValid = true;
					return true;
				} else {

					$("#error4").show();
					$("#error4").html("Please enter a valid pan card no.");
					//  $('#panno').val("");
					pancardValid = false;
					return false;
				}

			} else {
				$('#pan').val("");
				pancardValid = false;
				return false;

			}

		}

		function zipCodeVald() {

			var zip = $('#zipCode').val();

			// Regular expression for Indian PIN code
			const zipPattern = /^[1-9][0-9]{5}$/;

			if (zip && (/^\d+$/.test(zip))) {
				// Test the pincode against the regular expression
				if (zipPattern.test(zip)) {
					$("#errorZip").hide();
					$('#zipCode').val(zip);
					return true;
				} else {
					$("#errorZip").show();
					$("#errorZip").html("Please enter a valid Zip.");
					$('#zipCode').val(zip);
					return false;
				}
			} else {
				$('#zipCode').val('');
				return false;

			}

		}

		function generateUUID() {
			return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
				const r = Math.random() * 16 | 0;
				const v = c === 'x' ? r : (r & 0x3 | 0x8);
				return v.toString(16);
			});
		}

		function deleteSubChildData(type) {
			let dataset = [];
			let id = null;
			let gridOptions = null;
			let detailsWithDelFlag = null;
			let detailsGData = null;
			let classVal = null;

			let vendorId = $("#vendorId").val();


			const typeMap = {
				'BRANCH': {
					grid: gridOptionsBrDtls,
					details: brDetailsWithDelFlag1,
					dtlsG: brDetailsGlobal,
					dClass: 'br-dis',
					addBtnId: 'bdAddBtn'
				},
				'DELIVERYLOC': {
					grid: gridOptionsDlDtls,
					details: dlDetailsWithDelFlag1,
					dtlsG: dlDetailsGlobal,
					dClass: 'br-dis-dl',
					addBtnId: 'dldAddBtn'
				},
				'POC': {
					grid: gridOptionsPocDtls,
					details: pocDetailsWithDelFlag1,
					dtlsG: pocDetailsGlobal,
					dClass: 'br-dis-poc',
					addBtnId: 'pocdAddBtn'
				},
				'BANK': {
					grid: gridOptionsBDtls,
					details: bDetailsWithDelFlag1,
					dtlsG: bDetailsGlobal,
					dClass: 'br-dis-b',
					addBtnId: 'adAddBtn'
				},
				'PRODUCT': {
					grid: gridOptionsPDtls,
					details: null,
					dtlsG: pDetailsGlobal,
					dClass: 'br-dis-p',
					addBtnId: 'psdAddBtn'
				}
			};

			Swal.fire({
				title: 'Are you sure?',
				text: 'Do you want to delete this?',
				icon: 'warning',
				showCancelButton: true,
				confirmButtonText: 'Yes, delete it!',
				cancelButtonText: 'No, keep it',
				confirmButtonColor: 'var(--mainColor)',
			}).then((result) => {
				if (result?.value) {

					const selectedType = typeMap[type];
					if (selectedType) {
						gridOptions = selectedType.grid;
						detailsWithDelFlag = selectedType.details;
						detailsGData = selectedType.dtlsG;
						classVal = selectedType.dClass;
						addBtnId = selectedType.addBtnId;
					} else {
						console.error("Invalid type");
						return;
					}

					gridOptions.api.forEachNode((node) => {
						dataset.push(node.data);
						
					});
				
					if (type == 'PRODUCT') {
						 dataset = dataset.map(item => {
						    return {
						        ...item,
						        price: item.price == null ? 0.00 : item.price // Replace null price with 0.00
						    };
						});
						
					} 
					
					let selectedData = gridOptions.api.getSelectedRows();
					id = selectedData[0]?.id;

					if (vendorId != null && vendorId != '') {

						let validation = true;
						let mappedId = detailsGData.map(m => m.id);

						if (mappedId.includes(id)) {
							if (id) {
								const index = dataset.findIndex(obj => obj.id?.toString() === id?.toString());
								if (index !== -1) {
									dataset[index].delFlag = 1;
								}

								if (detailsWithDelFlag) {
									dataset = dataset.concat(detailsWithDelFlag);
								}
								
								
							}

							let obj = {};
							obj.key = vendorId;
							obj.name = JSON.stringify(dataset);
							obj.code = type;

							if (validation) {
								
							 $.ajax({
									type: "POST",
									url: "manage-vendor-delete-child-data",
									contentType: "application/json",
									data: JSON.stringify(obj),
									success: function (resp) {
										if (resp.code == "success") {
											let data = JSON.parse(resp.body);
											if(data){
												data = data.filter(f => f.delFlag !== 1 && f.delFlag !== "1");
											}
											gridOptions.api.setRowData(data);
											$("." + classVal).attr("disabled", true);
											$("#" + addBtnId).attr("disabled", false);
											toastr.success(resp.message);
										}
									},
									error: function (data) {
										console.log(data)
									}
								}); 
							}
						} else {
							let d = dataset.filter(f => f.id !== id);
							$("." + classVal).attr("disabled", true);
							$("#" + addBtnId).attr("disabled", false);
							gridOptions.api.setRowData(d);
						}
					} else {
						let d = dataset.filter(f => f.id !== id);
						$("." + classVal).attr("disabled", true);
						$("#" + addBtnId).attr("disabled", false);
						gridOptions.api.setRowData(d);
					}
				}
			})
		}

		function getSubCategory(type = null, subcat = null, product = null, sku = null) {

			var id = $("#category").val();
			$.ajax({
				type: "GET",
				url: "manage-vendor-get-subcategory?id=" + id,
				success: function (response) {
					if (response.message == "success") {
						$("#subcategory").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#subcategory").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#subcategory").append(option);
						}
						if (type == 'U') {
							$("#subcategory").val(subcat);
							getProduct('U', product, sku);
						}
					}
				},
				error: function (e) {
					$("#subcategory").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#subcategory").append(option);
				}
			});
		}

		function getProduct(type = null, product = null, sku = null) {
			var id = $("#subcategory").val();
			$.ajax({
				type: "GET",
				url: "manage-vendor-get-product?id=" + id,
				success: function (response) {
					if (response.message == "success") {
						$("#product").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#product").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].key);
							$(option).html(response.body[i].name);
							$("#product").append(option);
						}
						if (type == 'U') {
							$("#product").val(product).trigger('change');
							getSKU('U', sku);
						}
					}
				},
				error: function (e) {
					$("#product").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#product").append(option);
				}
			});
		}

		function getSKU(type = null, sku = null) {
			var id = $("#product").val();
			$.ajax({
				type: "GET",
				url: "manage-vendor-get-sku?id=" + id,
				success: function (response) {
					if (response.message == "success") {
						$("#sku").empty();
						var option = $("<option></option>");
						$(option).val(null);
						$(option).html("Select");
						$("#sku").append(option);
						for (var i = 0; i < response.body.length; i++) {
							var option = $("<option></option>");
							$(option).val(response.body[i].sku);
							$(option).html(response.body[i].manufacture + " (" + response.body[i].sku + ")");
							$("#sku").append(option);
						}
						if (type == 'U') {
							$("#sku").val(sku).trigger('change');
						}
					}
				},
				error: function (e) {
					$("#sku").empty();
					var option = $("<option></option>");
					$(option).val(null);
					$(option).html("Select");
					$("#sku").append(option);
				}
			});
		}
		
		function cancelMain(){
			let selectedRows = gridOptions.api.getSelectedRows();
			
			let rowCount = 0;
		    selectedRows.forEach(function(selectedRow, index) {

		    	const selectedRowIndex = selectedNodes[0].rowIndex;
		    	gridOptions.api.getDisplayedRowAtIndex(selectedRowIndex).setSelected(true);
		    	rowSelect();
		    }

		}
