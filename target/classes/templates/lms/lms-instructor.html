<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="EduMaster Instructors - Meet our expert instructors and explore their courses.">
    <title>EduMaster | Instructors</title>

    <style>
           .social-icons {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background-color: #e9ecef;
            border-radius: 50%;
            color: var(--gray-color);
            transition: all ease-in-out 0.3s;
        }

        .social-icons a:hover {
            background-color: var(--primary-color);
            color: var(--light-color);
        }

 .instructors-section {
            padding: 5rem 0;
            background-color: var(--light-gray);
        }

        .instructor-card {
            background-color: var(--light-color);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,.05);
            padding: 1.5rem;
            text-align: center;
            transition: transform ease-in-out 0.3s;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .instructor-card:hover {
            transform: translateY(-5px);
        }

:root {
.instructor-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: unset;
            margin: 0 auto;
            border: 3px solid var(--primary-color);
        }
}
        

        .instructor-name {
            font-size: 1.25rem;
            color: var(--dark-color);
            margin: 0 0 0.5rem;
            min-height: 1.5rem; 
        }

        .instructor-role {
            font-size: 0.9rem;
            color: var(--gray-color);
            margin: 0 0 0.5rem;
            min-height: 1.2rem;
        }

        .instructor-courses {
            font-size: 0.9rem;
            color: #6c757d;
            margin: 0 0 0.5rem;
            min-height: 1.2rem;
        }
        
        
   .section-header {
    margin-bottom: 3rem;
    text-align: center;
}
       
    </style>
    
     
</head>
<body>
     <div th:replace="lms/lms-navbar :: lms-nav"></div>

    <!-- Instructors Section -->
    <section class="instructors-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Our Instructors</h2>
                <p class="section-subtitle">Meet the experts guiding your learning journey.</p>
            </div>
            <div class="row g-3" id="instructorContainer">
               
            </div>
        </div>
    </section>

    <div th:replace="lms/lms-footer :: lms-footer"></div>

 <script>
        $(document).ready(function () {
            getAllInstructorList();
        });

        function getAllInstructorList() {
            $.ajax({
                url: "academic/get-all-instructor-list",
                method: "GET",
                success: function (data) {
                    console.log("Raw response:", data);

                    // Fix for nested JSON string
                    const parsed = typeof data.body[0] === "string"
                        ? JSON.parse(data.body[0])
                        : data.body;

                    const instructors = parsed.instructorList;

                    const html = instructors.map(instructor => {
                        const imageUrl = instructor.image
                            ? `${instructor.image}`
                            : "https://placehold.co/150x150";

                        return `
                        <div class="col-md-3 col-sm-6">
                            <div class="instructor-card">
                                <img src="${imageUrl}" alt="${instructor.firstName}" class="instructor-img">
                                <h5 class="instructor-name">${instructor.firstName}</h5>
                                <p class="instructor-role">Instructor</p>
                                <p class="instructor-courses">${instructor.totalCourses} Courses</p>
                                <div class="rating">
                                    <i class="fas fa-star"></i><i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i><i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i> 5.0
                                </div>
                                <div class="social-icons">
                                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                                    <a href="#"><i class="fab fa-twitter"></i></a>
                                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                                    <a href="#"><i class="fab fa-github"></i></a>
                                </div>
                                <a href="#" class="btn btn-primary mt-2">View Profile</a>
                            </div>
                        </div>`;
                    }).join("");

                    $("#instructorContainer").html(html);
                },
                error: function (err) {
                    console.error("Error fetching instructor list:", err);
                }
            });
        }


    </script>
</body>
</html>
