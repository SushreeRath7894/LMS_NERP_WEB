<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Template Builder</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@4.0.0/index.min.css"
	rel="stylesheet">
<link
	href="https://www.transparenttextures.com/patterns/black-paper.css"
	rel="stylesheet">
<link
	href="https://www.transparenttextures.com/patterns/cream-paper.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/qrcode@1.5.0/build/qrcode.min.js"></script>


<style>
#certificate-preview {
	height: calc(100% - 3rem);
	background: rgb(255 255 255);
	border: none;
	overflow: hidden;
	overflow-x: auto;
}

.draggable {
	position: absolute;
	cursor: move;
	user-select: none;
}

.resizable {
	resize: both;
	overflow: hidden;
}



#template-list {
	max-height: 200px;
	overflow-y: auto;
}

/* Border styles */
.border-none {
	border: none !important;
}

.border-solid {
	border-style: solid;
}

.border-double {
	border-style: double;
}

.border-dashed {
	border-style: dashed;
}

.border-ornate {
	border: 15px solid transparent;
	padding: 15px;
	border-image:
		url('https://www.transparenttextures.com/patterns/black-paper.png') 30
		round;
}

/* Signature canvas */
.signature-canvas {
	background-color: white;
	border: 1px dashed #ccc;
	cursor: crosshair;
}

/* Modern certificate styling */
.certificate-paper {
	background-color: #f9f4e6;
	background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 0%,
		rgba(255, 255, 255, 0) 100%);
	box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
	position: relative;
	overflow: hidden;
}

.certificate-paper::before {
	content: "";
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	background-image:
		url('https://www.transparenttextures.com/patterns/cream-paper.png');
	opacity: 0.3;
	pointer-events: none;
}

#preview-modal-body {
	padding: 20px;
	background-color: #f8f9fa;
}

.element-handle {
	position: absolute;
	top: 0;
	right: 0;
	background: #dc3545;
	color: white;
	width: 20px;
	height: 20px;
	display: flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	z-index: 10;
	font-size: 14px;
	border-radius: 2px;
}

.form-label {
	font-weight: bold;
	display: block;
	margin-bottom: 0.5rem;
}

.custom-upload-container {
	border: 2px dashed #cbd5e1;
	padding: 2rem;
	text-align: center;
	border-radius: 10px;
	background-color: #fff;
	transition: border-color 0.3s ease;
	position: relative;
	cursor: pointer;
}

.custom-upload-container:hover {
	border-color: #4f46e5;
}

.custom-file-upload {
	display: inline-flex;
	flex-direction: column;
	align-items: center;
	gap: 0.5rem;
	cursor: pointer;
	color: #4f46e5;
	font-weight: 500;
	font-size: 1rem;
	transition: color 0.3s ease;
	position: absolute;
	top: 13px;
	left: 42%;
	border: none !important;
}

.custom-file-upload:hover {
	color: #4338ca;
}

.upload-image-icon {
	font-size: 2.5rem;
}

#bg-image {
	display: none;
}

.upload-preview {
	margin-top: 1rem;
	max-width: 100%;
	max-height: 250px;
	border-radius: 8px;
	display: none;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.left-pannel,.property-panel{
	max-height: calc(100vh - 4.6rem);
	overflow-y: auto;
}

input[type=checkbox] {
    width: 1em;
    margin-right: 0;
    position: relative;
    top:0;
    float: left;
}

input[type=checkbox]:before {
    content: unset;
}
</style>
<script>
        document.addEventListener('DOMContentLoaded', function() {
        	
        	$("#course-select").select2({
        		placeholder: "Select Course",
        		allowClear: true
        	});
            // DOM Elements
            const previewContainer = document.getElementById('certificate-preview');
            const propertyPanel = document.getElementById('property-panel');
            const templateNameInput = document.getElementById('template-name');
            const courseSelect = document.getElementById('course-select');
            const bgColorInput = document.getElementById('bg-color');
            const bgImageInput = document.getElementById('bg-image');
            const paperEffectCheckbox = document.getElementById('paper-effect');
            const borderStyleSelect = document.getElementById('border-style');
            const borderColorInput = document.getElementById('border-color');
            const borderWidthInput = document.getElementById('border-width');
            const saveTemplateBtn = document.getElementById('save-template');
            const exportPdfBtn = document.getElementById('export-pdf');
            const previewCertBtn = document.getElementById('preview-cert');
           /*  const clearCanvasBtn = document.getElementById('clear-canvas'); */
            const clearAllElementsBtn = document.getElementById('clear-all-elements');
            const templateList = document.getElementById('template-list');
            const addElementBtns = document.querySelectorAll('.add-element');

            // State
            let currentTemplate = {
                id: null,
                name: '',
                courseId: null,
                backgroundColor: '#ffffff',
                backgroundImage: null,
                borderStyle: 'none',
                borderColor: '#333333',
                borderWidth: 5,
                paperEffect: true,
                elements: []
            };

            let selectedElement = null;
            let elements = [];
            let isDragging = false;
            let dragStartX, dragStartY, elemStartX, elemStartY;

            // Initialize
            setupPreviewContainer();
            applyBackground();

            // Event Listeners
            addElementBtns.forEach(btn => {
                btn.addEventListener('click', () => addElement(btn.dataset.type));
            });

            saveTemplateBtn.addEventListener('click', saveTemplate);
            exportPdfBtn.addEventListener('click', exportAsPdf);
            previewCertBtn.addEventListener('click', previewCertificate);
            /* clearCanvasBtn.addEventListener('click', clearSignatureCanvas); */
            clearAllElementsBtn.addEventListener('click', clearAllElements);
            bgColorInput.addEventListener('input', (e) => {
                currentTemplate.backgroundColor = e.target.value;
                applyBackground();
            });
            bgImageInput.addEventListener('change', handleBackgroundImage);
            paperEffectCheckbox.addEventListener('change', (e) => {
                currentTemplate.paperEffect = e.target.checked;
                applyBackground();
            });
            borderStyleSelect.addEventListener('change', (e) => {
                currentTemplate.borderStyle = e.target.value;
                applyBackground();
            });
            borderColorInput.addEventListener('input', (e) => {
                currentTemplate.borderColor = e.target.value;
                applyBackground();
            });
            borderWidthInput.addEventListener('input', (e) => {
                currentTemplate.borderWidth = parseInt(e.target.value);
                applyBackground();
            });
            templateNameInput.addEventListener('input', (e) => {
                currentTemplate.name = e.target.value;
            });
            courseSelect.addEventListener('change', (e) => {
                currentTemplate.courseId = e.target.value;
            });

            templateList.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    loadSampleTemplate(btn.textContent);
                });
            });

            // Functions
            function setupPreviewContainer() {
                previewContainer.style.width = `${currentTemplate.width}px`;
                previewContainer.style.height = `${currentTemplate.height}px`;
                previewContainer.style.backgroundColor = currentTemplate.backgroundColor;
            }

            function applyBackground() {
                previewContainer.className = 'card';
                if (currentTemplate.backgroundImage) {
                    previewContainer.style.background = `url(${currentTemplate.backgroundImage}) center/contain no-repeat, ${currentTemplate.backgroundColor}`;
                } else {
                    previewContainer.style.background = currentTemplate.backgroundColor;
                }

                previewContainer.style.border = 'none';
                previewContainer.classList.remove('border-none', 'border-solid', 'border-double', 'border-dashed', 'border-ornate');

                if (currentTemplate.borderStyle === 'none') {
                    previewContainer.classList.add('border-none');
                } else if (currentTemplate.borderStyle === 'ornate') {
                    previewContainer.classList.add('border-ornate');
                } else {
                    previewContainer.classList.add(`border-${currentTemplate.borderStyle}`);
                    previewContainer.style.border = `${currentTemplate.borderWidth}px ${currentTemplate.borderStyle} ${currentTemplate.borderColor}`;
                }

                if (currentTemplate.paperEffect) {
                    previewContainer.classList.add('certificate-paper');
                } else {
                    previewContainer.classList.remove('certificate-paper');
                }
            }

            function handleBackgroundImage(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    currentTemplate.backgroundImage = event.target.result;
                    applyBackground();
                };
                reader.readAsDataURL(file);
            }

            function addElement(type) {
                const elementId = 'elem' + Date.now();
                const defaultProperties = {
                    id: elementId,
                    type: type,
                    x: 50,
                    y: 50,
                    width: type === 'text' ? 200 : 150,
                    height: type === 'text' ? 30 : 100
                };

                switch (type) {
                    case 'text':
                        defaultProperties.content = 'New Text';
                        defaultProperties.fontSize = 16;
                        defaultProperties.color = '#000000';
                        defaultProperties.textAlign = 'left';
                        break;
                    case 'image':
                        defaultProperties.src = '';
                        break;
                    case 'rectangle':
                        defaultProperties.backgroundColor = '#ffffff';
                        defaultProperties.borderColor = '#999999';
                        defaultProperties.borderWidth = 1;
                        break;
                    case 'signature':
                        defaultProperties.content = 'Signature';
                        defaultProperties.fontSize = 14;
                        defaultProperties.fontStyle = 'italic';
                        break;
                    case 'signature-canvas':
                        defaultProperties.content = '';
                        defaultProperties.backgroundColor = '#ffffff';
                        defaultProperties.borderColor = '#cccccc';
                        defaultProperties.borderWidth = 1;
                        defaultProperties.borderStyle = 'dashed';
                        break;
                    case 'date':
                        defaultProperties.content = 'Date: {{currentDate}}';
                        defaultProperties.fontSize = 14;
                        break;
                    case 'qr':
                        defaultProperties.content = '{{certificateUrl}}';
                        defaultProperties.size = 100;
                        break;
                }

                createElement(defaultProperties, true);
            }

            function createElement(properties, isNew = true) {
                const element = document.createElement('div');
                element.className = 'draggable resizable';
                element.id = properties.id;
                element.style.left = `${properties.x}px`;
                element.style.top = `${properties.y}px`;
                element.style.width = `${properties.width}px`;
                element.style.height = `${properties.height}px`;
                element.dataset.type = properties.type;

                const deleteHandle = document.createElement('div');
                deleteHandle.className = 'element-handle';
                deleteHandle.innerHTML = '×';
                deleteHandle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('Delete this element?')) {
                        previewContainer.removeChild(element);
                        elements = elements.filter(el => el.id !== properties.id);
                        if (selectedElement && selectedElement.element === element) {
                            propertyPanel.innerHTML = '<div class="alert alert-info">Select an element to edit its properties</div>';
                            selectedElement = null;
                        }
                    }
                });
                element.appendChild(deleteHandle);

                element.addEventListener('mousedown', startDrag);
                element.addEventListener('click', (e) => {
                    if (e.target === deleteHandle) return;
                    e.stopPropagation();
                    selectElement(element, properties);
                });

                switch (properties.type) {
                    case 'text':
                    case 'date':
                    case 'signature':
                        element.textContent = properties.content;
                        element.style.fontSize = `${properties.fontSize}px`;
                        element.style.color = properties.color;
                        element.style.textAlign = properties.textAlign || 'left';
                        if (properties.fontWeight) element.style.fontWeight = properties.fontWeight;
                        if (properties.fontStyle) element.style.fontStyle = properties.fontStyle;
                        break;
                    case 'image':
                        if (properties.src) {
                            const img = document.createElement('img');
                            img.src = properties.src;
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'contain';
                            element.appendChild(img);
                        } else {
                            element.style.backgroundColor = '#eeeeee';
                            element.style.display = 'flex';
                            element.style.justifyContent = 'center';
                            element.style.alignItems = 'center';
                            element.textContent = 'Image';
                        }
                        break;
                    case 'rectangle':
                        element.style.backgroundColor = properties.backgroundColor;
                        element.style.border = `${properties.borderWidth || 1}px solid ${properties.borderColor || '#999999'}`;
                        break;
                    case 'signature-canvas':
                        element.style.backgroundColor = properties.backgroundColor;
                        element.style.border = `${properties.borderWidth || 1}px ${properties.borderStyle || 'dashed'} ${properties.borderColor || '#cccccc'}`;

                        const canvas = document.createElement('canvas');
                        canvas.width = properties.width;
                        canvas.height = properties.height;
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        element.appendChild(canvas);

                        const signaturePad = new SignaturePad(canvas, {
                            backgroundColor: properties.backgroundColor,
                            penColor: '#000000'
                        });

                        function resizeCanvas() {
                            const ratio = Math.max(window.devicePixelRatio || 1, 1);
                            canvas.width = canvas.offsetWidth * ratio;
                            canvas.height = canvas.offsetHeight * ratio;
                            canvas.getContext('2d').scale(ratio, ratio);
                            signaturePad.clear();
                        }

                        window.addEventListener('resize', resizeCanvas);
                        resizeCanvas();

                        properties.signaturePad = signaturePad;
                        break;
                    case 'qr':
                        element.style.backgroundColor = '#ffffff';
                        element.style.display = 'flex';
                        element.style.justifyContent = 'center';
                        element.style.alignItems = 'center';
                        if (properties.content && properties.content !== '{{certificateUrl}}') {
                            const qrDiv = document.createElement('div');
                            qrDiv.style.width = '100%';
                            qrDiv.style.height = '100%';
                            element.appendChild(qrDiv);
                            QRCode.toCanvas(qrDiv, properties.content, {
                                width: properties.size,
                                height: properties.size
                            }, (error) => {
                                if (error) {
                                    element.textContent = 'QR Code Error';
                                    console.error(error);
                                }
                            });
                        } else {
                            element.textContent = 'QR Code Placeholder';
                        }
                        break;
                }

                previewContainer.appendChild(element);

                if (isNew) {
                    elements.push(properties);
                    selectElement(element, properties);
                }
            }

            function startDrag(e) {
                if (e.target.classList.contains('element-handle')) return;

                e.preventDefault();
                isDragging = true;

                const element = e.currentTarget;
                const elementData = elements.find(el => el.id === element.id);
                if (!elementData) return;

                dragStartX = e.clientX;
                dragStartY = e.clientY;
                elemStartX = elementData.x;
                elemStartY = elementData.y;

                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);
            }

            function dragMove(e) {
                if (!isDragging) return;

                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;

                const element = document.elementFromPoint(e.clientX, e.clientY);
                if (!element || !element.classList.contains('draggable')) return;

                const elementData = elements.find(el => el.id === element.id);
                if (!elementData) return;

                elementData.x = elemStartX + dx;
                elementData.y = elemStartY + dy;

                element.style.left = `${elementData.x}px`;
                element.style.top = `${elementData.y}px`;
            }

            function dragEnd() {
                isDragging = false;
                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('mouseup', dragEnd);
            }

            function selectElement(element, properties) {
                if (selectedElement) {
                    selectedElement.element.style.outline = 'none';
                }

                selectedElement = { element, properties };
                element.style.outline = '2px dashed #007bff';

                renderPropertyPanel(properties);
            }

            function renderPropertyPanel(properties) {
                propertyPanel.innerHTML = '';

                const heading = document.createElement('h6');
                heading.textContent = `${properties.type.charAt(0).toUpperCase() + properties.type.slice(1)} Properties`;
                propertyPanel.appendChild(heading);

                addPropertyInput('X Position', 'x', properties.x, 'number');
                addPropertyInput('Y Position', 'y', properties.y, 'number');
                addPropertyInput('Width', 'width', properties.width, 'number');
                addPropertyInput('Height', 'height', properties.height, 'number');

                switch (properties.type) {
                    case 'text':
                    case 'date':
                    case 'signature':
                        addPropertyInput('Text Content', 'content', properties.content, 'text');
                        addPropertyInput('Font Size', 'fontSize', properties.fontSize, 'number');
                        addPropertyInput('Color', 'color', properties.color, 'color');
                        addPropertySelect('Text Align', 'textAlign', properties.textAlign || 'left', ['left', 'center', 'right']);
                        if (properties.type === 'text') {
                            addPropertySelect('Font Weight', 'fontWeight', properties.fontWeight || 'normal', ['normal', 'bold']);
                        }
                        if (properties.type === 'signature') {
                            addPropertySelect('Font Style', 'fontStyle', properties.fontStyle || 'normal', ['normal', 'italic']);
                        }
                        break;
                    case 'image':
                        const fileInput = document.createElement('input');
                        fileInput.type = 'file';
                        fileInput.className = 'form-control mb-2';
                        fileInput.accept = 'image/*';
                        fileInput.addEventListener('change', (e) => {
                            const file = e.target.files[0];
                            if (!file) return;

                            const reader = new FileReader();
                            reader.onload = (event) => {
                                properties.src = event.target.result;
                                const img = selectedElement.element.querySelector('img');
                                if (img) {
                                    img.src = properties.src;
                                } else {
                                    selectedElement.element.innerHTML = '';
                                    const newImg = document.createElement('img');
                                    newImg.src = properties.src;
                                    newImg.style.width = '100%';
                                    newImg.style.height = '100%';
                                    newImg.style.objectFit = 'contain';
                                    selectedElement.element.appendChild(newImg);
                                    const deleteHandle = document.createElement('div');
                                    deleteHandle.className = 'element-handle';
                                    deleteHandle.innerHTML = '×';
                                    deleteHandle.addEventListener('click', (e) => {
                                        e.stopPropagation();
                                        if (confirm('Delete this element?')) {
                                            previewContainer.removeChild(selectedElement.element);
                                            elements = elements.filter(el => el.id !== properties.id);
                                            if (selectedElement && selectedElement.element === element) {
                                                propertyPanel.innerHTML = '<div class="alert alert-info">Select an element to edit its properties</div>';
                                                selectedElement = null;
                                            }
                                        }
                                    });
                                    selectedElement.element.appendChild(deleteHandle);
                                }
                            };
                            reader.readAsDataURL(file);
                        });

                        const fileGroup = document.createElement('div');
                        fileGroup.className = 'mb-3';
                        fileGroup.innerHTML = '<label class="form-label">Image</label>';
                        fileGroup.appendChild(fileInput);
                        propertyPanel.appendChild(fileGroup);
                        break;
                    case 'rectangle':
                        addPropertyInput('Background Color', 'backgroundColor', properties.backgroundColor, 'color');
                        addPropertyInput('Border Color', 'borderColor', properties.borderColor, 'color');
                        addPropertyInput('Border Width', 'borderWidth', properties.borderWidth, 'number');
                        break;
                    case 'signature-canvas':
                        addPropertyInput('Background Color', 'backgroundColor', properties.backgroundColor, 'color');
                        addPropertyInput('Border Color', 'borderColor', properties.borderColor, 'color');
                        addPropertyInput('Border Width', 'borderWidth', properties.borderWidth, 'number');
                        addPropertySelect('Border Style', 'borderStyle', properties.borderStyle || 'dashed', ['solid', 'dashed', 'dotted']);
                        break;
                    case 'qr':
                        addPropertyInput('QR Content', 'content', properties.content, 'text');
                        addPropertyInput('Size', 'size', properties.size || 100, 'number');
                        break;
                }
            }

            function addPropertyInput(label, property, value, type = 'text') {
                const group = document.createElement('div');
                group.className = 'mb-3';

                const labelEl = document.createElement('label');
                labelEl.className = 'form-label';
                labelEl.textContent = label;

                const input = document.createElement('input');
                input.type = type;
                input.className = 'form-control';
                input.value = value;

                input.addEventListener('change', (e) => {
                    if (!selectedElement) return;
                    selectedElement.properties[property] = type === 'number' ? parseInt(e.target.value) : e.target.value;
                    updateElement(selectedElement.element, selectedElement.properties);
                });

                group.appendChild(labelEl);
                group.appendChild(input);
                propertyPanel.appendChild(group);
            }

            function addPropertySelect(label, property, value, options) {
                const group = document.createElement('div');
                group.className = 'mb-3';

                const labelEl = document.createElement('label');
                labelEl.className = 'form-label';
                labelEl.textContent = label;

                const select = document.createElement('select');
                select.className = 'form-select';

                options.forEach(option => {
                    const optionEl = document.createElement('option');
                    optionEl.value = option;
                    optionEl.textContent = option.charAt(0).toUpperCase() + option.slice(1);
                    if (option === value) optionEl.selected = true;
                    select.appendChild(optionEl);
                });

                select.addEventListener('change', (e) => {
                    if (!selectedElement) return;
                    selectedElement.properties[property] = e.target.value;
                    updateElement(selectedElement.element, selectedElement.properties);
                });

                group.appendChild(labelEl);
                group.appendChild(select);
                propertyPanel.appendChild(group);
            }

            function updateElement(element, properties) {
                element.style.left = `${properties.x}px`;
                element.style.top = `${properties.y}px`;
                element.style.width = `${properties.width}px`;
                element.style.height = `${properties.height}px`;

                element.innerHTML = '';
                const deleteHandle = document.createElement('div');
                deleteHandle.className = 'element-handle';
                deleteHandle.innerHTML = '×';
                deleteHandle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('Delete this element?')) {
                        previewContainer.removeChild(element);
                        elements = elements.filter(el => el.id !== properties.id);
                        if (selectedElement && selectedElement.element === element) {
                            propertyPanel.innerHTML = '<div class="alert alert-info">Select an element to edit its properties</div>';
                            selectedElement = null;
                        }
                    }
                });
                element.appendChild(deleteHandle);

                switch (properties.type) {
                    case 'text':
                    case 'date':
                    case 'signature':
                        element.textContent = properties.content;
                        element.style.fontSize = `${properties.fontSize}px`;
                        element.style.color = properties.color;
                        element.style.textAlign = properties.textAlign || 'left';
                        if (properties.fontWeight) element.style.fontWeight = properties.fontWeight;
                        if (properties.fontStyle) element.style.fontStyle = properties.fontStyle;
                        element.appendChild(deleteHandle);
                        break;
                    case 'image':
                        if (properties.src) {
                            const img = document.createElement('img');
                            img.src = properties.src;
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'contain';
                            element.appendChild(img);
                        } else {
                            element.style.backgroundColor = '#eeeeee';
                            element.style.display = 'flex';
                            element.style.justifyContent = 'center';
                            element.style.alignItems = 'center';
                            element.textContent = 'Image';
                        }
                        element.appendChild(deleteHandle);
                        break;
                    case 'rectangle':
                        element.style.backgroundColor = properties.backgroundColor;
                        element.style.border = `${properties.borderWidth || 1}px solid ${properties.borderColor || '#999999'}`;
                        element.appendChild(deleteHandle);
                        break;
                    case 'signature-canvas':
                        element.style.backgroundColor = properties.backgroundColor;
                        element.style.border = `${properties.borderWidth || 1}px ${properties.borderStyle || 'dashed'} ${properties.borderColor || '#cccccc'}`;
                        const canvas = document.createElement('canvas');
                        canvas.width = properties.width;
                        canvas.height = properties.height;
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        element.appendChild(canvas);
                        properties.signaturePad = new SignaturePad(canvas, {
                            backgroundColor: properties.backgroundColor,
                            penColor: '#000000'
                        });
                        element.appendChild(deleteHandle);
                        break;
                    case 'qr':
                        element.style.backgroundColor = '#ffffff';
                        element.style.display = 'flex';
                        element.style.justifyContent = 'center';
                        element.style.alignItems = 'center';
                        if (properties.content && properties.content !== '{{certificateUrl}}') {
                            const qrDiv = document.createElement('div');
                            qrDiv.style.width = '100%';
                            qrDiv.style.height = '100%';
                            element.appendChild(qrDiv);
                            QRCode.toCanvas(qrDiv, properties.content, {
                                width: properties.size,
                                height: properties.size
                            }, (error) => {
                                if (error) {
                                    element.textContent = 'QR Code Error';
                                    console.error(error);
                                }
                            });
                        } else {
                            element.textContent = 'QR Code Placeholder';
                        }
                        element.appendChild(deleteHandle);
                        break;
                }
            }

            function clearAllElements() {
                Swal.fire({
                    title: 'Are you sure?',
                    text: "This will delete all elements.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Yes, delete all',
                    cancelButtonText: 'No, keep them'
                }).then((result) => {
                    	 previewContainer.innerHTML = '';
                         elements = [];
                         selectedElement = null;
                         propertyPanel.innerHTML = '<div class="alert alert-info">Select an element to edit its properties</div>';
                         currentTemplate.elements = [];
                        Swal.fire('Deleted!', 'All elements have been removed.', 'success');
                });
            }

            
            

            function saveTemplate() {
                if (!currentTemplate.name) {
                    alert('Please enter a template name');
                    return;
                }

                if (!currentTemplate.courseId) {
                    alert('Please select a course');
                    return;
                }

                currentTemplate.elements = elements;

                elements.forEach(element => {
                    if (element.type === 'signature-canvas' && element.signaturePad && !element.signaturePad.isEmpty()) {
                        element.signatureData = element.signaturePad.toDataURL();
                    }
                });

                let courseId = $("#course-select").val();
                currentTemplate.id = courseId;
                console.log('Saving template:', currentTemplate);
                alert('Template saved successfully (check console for data)');
            }

            function exportAsPdf() {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: currentTemplate.width > currentTemplate.height ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [currentTemplate.width, currentTemplate.height]
                });

                const handles = document.querySelectorAll('.element-handle');
                handles.forEach(handle => handle.style.display = 'none');

                html2canvas(previewContainer).then(canvas => {
                    handles.forEach(handle => handle.style.display = '');
                    const imgData = canvas.toDataURL('image/png');
                    pdf.addImage(imgData, 'PNG', 0, 0, currentTemplate.width, currentTemplate.height);
                    pdf.save(`${currentTemplate.name || 'certificate'}.pdf`);
                });
            }

            function previewCertificate() {
                const previewContainer = document.createElement('div');
                previewContainer.style.width = `${currentTemplate.width}px`;
                previewContainer.style.height = `${currentTemplate.height}px`;
                previewContainer.style.backgroundColor = currentTemplate.backgroundColor;

                if (currentTemplate.backgroundImage) {
                	previewContainer.style.background = `url(${currentTemplate.backgroundImage}) center/contain no-repeat, ${currentTemplate.backgroundColor}`;

                } else {
                    previewContainer.style.background = currentTemplate.backgroundColor;
                }

                previewContainer.style.border = 'none';
                previewContainer.classList.remove('border-none', 'border-solid', 'border-double', 'border-dashed', 'border-ornate');

                if (currentTemplate.borderStyle === 'none') {
                    previewContainer.classList.add('border-none');
                } else if (currentTemplate.borderStyle === 'ornate') {
                    previewContainer.classList.add('border-ornate');
                } else {
                    previewContainer.classList.add(`border-${currentTemplate.borderStyle}`);
                    previewContainer.style.border = `${currentTemplate.borderWidth}px ${currentTemplate.borderStyle} ${currentTemplate.borderColor}`;
                }

                if (currentTemplate.paperEffect) {
                    previewContainer.classList.add('certificate-paper');
                } else {
                    previewContainer.classList.remove('certificate-paper');
                }

                const sampleData = {
                    studentName: 'John Doe',
                    courseName: 'Java Developer Certification',
                    completionDate: new Date().toLocaleDateString(),
                    certificateUrl: 'https://example.com/certificate/123'
                };

                currentTemplate.elements.forEach(element => {
                    const elem = document.createElement('div');
                    elem.className = 'preview-element';
                    elem.style.position = 'absolute';
                    elem.style.left = `${element.x}px`;
                    elem.style.top = `${element.y}px`;
                    elem.style.width = `${element.width}px`;
                    elem.style.height = `${element.height}px`;

                    switch (element.type) {
                        case 'text':
                        case 'date':
                        case 'signature':
                            let content = element.content;
                            content = content.replace('{{studentName}}', sampleData.studentName);
                            content = content.replace('{{courseName}}', sampleData.courseName);
                            content = content.replace('{{currentDate}}', sampleData.completionDate);
                            content = content.replace('{{completionDate}}', sampleData.completionDate);
                            content = content.replace('{{certificateUrl}}', sampleData.certificateUrl);

                            elem.textContent = content;
                            elem.style.fontSize = `${element.fontSize}px`;
                            elem.style.color = element.color;
                            elem.style.textAlign = element.textAlign || 'left';
                            if (element.fontWeight) elem.style.fontWeight = element.fontWeight;
                            if (element.fontStyle) elem.style.fontStyle = element.fontStyle;
                            break;
                        case 'image':
                            if (element.src) {
                                const img = document.createElement('img');
                                img.src = element.src;
                                img.style.width = '100%';
                                img.style.height = '100%';
                                img.style.objectFit = 'contain';
                                elem.appendChild(img);
                            }
                            break;
                        case 'rectangle':
                            elem.style.backgroundColor = element.backgroundColor;
                            elem.style.border = `${element.borderWidth || 1}px solid ${element.borderColor || '#999999'}`;
                            break;
                        case 'signature-canvas':
                            if (element.signatureData) {
                                const img = document.createElement('img');
                                img.src = element.signatureData;
                                img.style.width = '100%';
                                img.style.height = '100%';
                                img.style.objectFit = 'contain';
                                elem.appendChild(img);
                            } else {
                                elem.style.backgroundColor = element.backgroundColor;
                                elem.style.border = `${element.borderWidth || 1}px ${element.borderStyle || 'dashed'} ${element.borderColor || '#cccccc'}`;
                                elem.style.display = 'flex';
                                elem.style.justifyContent = 'center';
                                elem.style.alignItems = 'center';
                                elem.textContent = 'Signature';
                            }
                            break;
                        case 'qr':
                            elem.style.backgroundColor = '#ffffff';
                            elem.style.display = 'flex';
                            elem.style.justifyContent = 'center';
                            elem.style.alignItems = 'center';
                            const qrContent = element.content.replace('{{certificateUrl}}', sampleData.certificateUrl);
                            if (qrContent) {
                                const qrDiv = document.createElement('div');
                                qrDiv.style.width = '100%';
                                qrDiv.style.height = '100%';
                                elem.appendChild(qrDiv);
                                QRCode.toCanvas(qrDiv, qrContent, {
                                    width: element.size,
                                    height: element.size
                                }, (error) => {
                                    if (error) {
                                        elem.textContent = 'QR Code Error';
                                        console.error(error);
                                    }
                                });
                            } else {
                                elem.textContent = 'QR Code Placeholder';
                            }
                            break;
                    }

                    previewContainer.appendChild(elem);
                });

                const modalBody = document.getElementById('preview-modal-body');
                modalBody.innerHTML = '';
                modalBody.appendChild(previewContainer);

                const modal = new bootstrap.Modal(document.getElementById('previewModal'));
                modal.show();
            }

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid mt-3">

								<label class="form-label">Template Name</label> <input

							</div>

								<label class="form-label">Background Image</label>

								<div class="custom-upload-container">

									<label for="bg-image" class="custom-file-upload"> <i
										class="bi bi-cloud-arrow-up-fill upload-image-icon"></i>

									<!-- Hidden input -->

										onchange="previewImage(event)">

								<!-- Image Preview -->

							<div class="form-check mb-3">

							</div>

									id="border-style" class="form-select">
