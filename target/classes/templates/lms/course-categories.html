<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Course Categories</title>
<!-- Custom CSS -->
<style type="text/css">
.course-cat {
	margin-top: auto;
	font-size: 14px !important;
}
.category-icon { align-content: center; }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const img = document.querySelector('img[src$="icons8-user.png"]');
      if (img) {
        img.onmouseover = img.onmouseout =
            e => e.target.src = `/assets/icons8-user.${e.type === 'mouseover' ? 'gif' : 'png'}`;
      } else {
        console.error('Image element not found for hover effect');
      }
      getAllCategoryCourses();
    });
    
    function getAllCategoryCourses() {
    	  $.ajax({
    	    type: "GET",
    	    url: "academic-course-view",
    	    success: function (response) {
    	      if (response.message === "Success") {
    	        const parsed = JSON.parse(response.body[0]);
    	        const courseData = parsed.courseData;

    	        const categoryMap = {};
    	        courseData.forEach(course => {
    	          const category = course.parentCategory;
    	          if (!categoryMap[category]) {
    	            categoryMap[category] = 0;
    	          }
    	          categoryMap[category]++;
    	        });

    	        const categoryIcons = {
    	          "Finance": "fas fa-coins category-icon",
    	          "Music": "fas fa-music category-icon",
    	          "Marketing": "fas fa-bullhorn category-icon",
    	          "Design": "fas fa-pencil-ruler category-icon",
    	          "Productivity": "fas fa-tasks category-icon",
    	          "IT & Software": "fas fa-laptop-code category-icon",
    	          "Business": "fas fa-briefcase category-icon",
    	          "Development": "fas fa-code category-icon",
    	          "Default": "fas fa-book category-icon"
    	        };
    	        
    	        const categoryDescriptions = {
  	        		  "Finance": "Master the art of budgeting, investment, and financial planning.",
  	        		  "Music": "Discover your musical talent and enhance your skills with expert-led lessons.",
  	        		  "Marketing": "Learn strategies to market effectively in the digital and traditional spaces.",
  	        		  "Design": "Explore your creativity with courses on graphic, UI/UX, and product design.",
  	        		  "Productivity": "Boost your efficiency and time management skills.",
  	        		  "IT & Software": "Get hands-on with programming, cloud, and software tools.",
  	        		  "Business": "Understand business strategies, entrepreneurship, and operations.",
  	        		  "Development": "Sharpen your coding skills in web, app, and software development.",
  	        		  "Default": "Explore a variety of courses to expand your knowledge and skills."
  	        		};


    	        $('#categoryContainer').empty();

    	        Object.keys(categoryMap).forEach(category => {
    	          const count = categoryMap[category];
    	          const iconClass = categoryIcons[category] || categoryIcons["Default"];
    	          const description = categoryDescriptions[category] || categoryDescriptions["Default"];

    	          const slide = `
    	          
    	        	  <div class="col-md-6 col-lg-4 col-xl-3">
	    	              <div class="category-card h-100 vstack">
	    	                <i class="${iconClass}"></i>
	    	                <h3>${category}</h3>
	    	                <p class="mb-2">${description}</p>
	    	                <a href="/all-courses" class="btn btn-primary course-cat">Explore Courses (${count} Courses)</a>
	    	              </div>
    	            </div>`;
    	          $('#categoryContainer').append(slide);
    	        });

    	      }
    	    },
    	    error: function (e) {
    	      console.error("Failed to fetch course categories", e);
    	    }
    	  });
    	}
  </script>
</head>
<body>
	<!-- Top Bar -->
	<div th:replace="lms/lms-navbar :: lms-nav"></div>


	<!-- Categories Section -->
<section class="categories-section py-5 bg-about">
			<div class="section-header text-center mb-0">
				<span class="section-subtitle">Explore Categories</span>
				<h2 class="section-title text-white">Course Categories</h2>
				<p class="section-description text-white">Discover our wide range of course
					categories taught by industry experts to help you achieve your
					learning goals.</p>
			</div>
</section>


	<section class="categories-section py-5 bg-light" id="categories">
		<div class="container">
			
			<div class="row g-4" id="categoryContainer">
				<!-- Category 4 -->
				<!-- Category 6 -->

			</div>
		</div>
	</section>

	<div th:replace="lms/lms-footer :: lms-footer"></div>


</body>
</html>
