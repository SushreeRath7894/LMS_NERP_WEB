<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="UTF-8">
<style>
#myGrid {
	height: 500px; /* or any suitable height */
	width: 100%;
}
.w-400{
width:400px;}
.search-sec .go-btn {
    width: 60px;
    height: 37px;
}
</style>

<script type="text/javascript">
	$(document).ready(function() {
		$("#dltBtn").prop("disabled", true);
		var gridDivm = document.querySelector('#myGrid');
		new agGrid.Grid(gridDivm, publicBatchesGrid);
		getpublicBatchesData();
	});

	var columnDefsCourse = [ {
		headerCheckboxSelection : true,
		headerCheckboxSelectionFilteredOnly : true,
		checkboxSelection : true,
		width : 10,
		sortable : false,
		filter : false,
		resizable : true,
		pinned : 'left',
	},{
		headerName : "Course Name",
		field : "courseName",
 	}, {
		headerName : "Title",
		field : "course",
 	},{
		headerName : "Required Time",
		field : "duration",
	}, {
		headerName : "Schedule",
		field : "schedule",
	}, {
		headerName : "Time",
		field : "time",
 	}, {
		headerName : "Status",
		field : "status"
	},
	{
		headerName : "Training Id",
		field : "trainingId",
		hide :true
	}
	];
	var publicBatchesGrid = {
		columnDefs : columnDefsCourse,
		rowSelection : 'multiple',
		suppressRowClickSelection : false,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 185,
			height : 10
		},
		pagination : true,
		paginationPageSize : 15,
		onGridSizeChanged: function(params) {
			params.api.sizeColumnsToFit();
		},
		onSelectionChanged : onSelectionChanged,
	};
	function onSelectionChanged() {
		let selectedRows = publicBatchesGrid.api.getSelectedRows();
		 var rowCount = selectedRows.length; // Use .length for count
		 if (rowCount > 0) {
	   
 	        $("#dltBtn").prop("disabled", false);
	    } else {
 	        $("#dltBtn").prop("disabled", true);
	    }
	 }
	function getpublicBatchesData(){
	    $.ajax({
	        type:'GET',
	        url:'public-batches-get-public-batches',
	        success:function(response){
	            if(response.message =='Success'){
	                
	                const raw = JSON.parse(response.body[0]).onlineBootcampData;
                    console.log("Raw Data----->",raw);
	                const rowData = raw.map(item => ({
	                    course: item.title,
	                    duration: item.duration + " • " + item.totalDays + " total",
	                    createdInfo: `Created by ${item.createdBy} on ${item.createdOn}`,
	                    schedule: item.startDate + " – " + item.endDate,
	                    time: item.time,
	                    status: (new Date(item.startDate) <= new Date()) 
	                        ? "Ongoing now" : "Upcoming",
	                    register: "Register",
	                    trainingId:item.trainingId,
	                    courseName:item.courseName
	                }));

	                publicBatchesGrid.api.setRowData(rowData);
	            }
	        }
	    })
	}
	function deleteSelected() {
	    let selectedRows = publicBatchesGrid.api.getSelectedRows();
	  

	    let deleteList = selectedRows.map(row => ({
	        trainingId: row.trainingId,
	        name: row.course
	    }));

	    Swal.fire({
			title: 'Are you sure?',
			text: 'Do You Want To Delete This?',
			icon: 'warning',
			showCancelButton: true,
			confirmButtonText: 'Yes, delete it!',
			cancelButtonText: 'No, keep it',
			confirmButtonColor: 'var(--mainColor)',
		}).then((result) => {
			if (result?.value) {
	        	console.log(deleteList)
	            $.ajax({
	                type: 'POST',
	                url: 'public-batches-delete',
	                contentType: "application/json",
	                data: JSON.stringify({ deleteList: deleteList }),
	                success: function(resp) {

	                 toastr.success(resp.message || "Deleted SuccessFully!");
	                 getpublicBatchesData();
	                }
	            });

	    }
	    });
	}
	function enterToSearch(event) {
		 if (event.key === 'Enter') {
		     onQuickFilterChanged();
		 }
		}
	
	function onQuickFilterChanged() {
		 const filterValue = document.getElementById('quickFilter').value;
		 if (filterValue) {
			 publicBatchesGrid.api.setQuickFilter(filterValue);  
 		     setTimeout(() => {  
		         const firstRow = publicBatchesGrid.api.getDisplayedRowAtIndex(0);
		         if (firstRow) {
		             firstRow.setSelected(true);
		         }
		     }, 100);
		 }
		}
		function reset() {
		 $("#quickFilter").val('');  
		 publicBatchesGrid.api.setQuickFilter('');  
 		 setTimeout(() => {
		     const firstRow = publicBatchesGrid.api.getDisplayedRowAtIndex(0);
		     if (firstRow) {
		         firstRow.setSelected(true);
		     }
		 }, 100);
		}

</script>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="d-flex justify-content-between align-items-center mb-3">

 						<!-- <div class="d-flex gap-2 align-items-center">

							<input class="form-control" type="text"
								onkeydown="enterToSearch(event)" placeholder="Search"
								id="quickFilter" autocomplete="off" style="width: 250px;">

							<button class="btn go-btn" type="button"
								onclick="onQuickFilterChanged()">Go</button>
							<button class="btn go-btn" type="button" onclick="reset()">Reset</button>
						</div> -->
						
						
					<!-- 	<div class="d-flex justify-content-between bdr-line p-2">
										<div class="col-md-8 col-12">
											<div class="d-flex gap-2 search-sec position-relative">
												<input class="form-control" type="text"
													onkeydown="enterToSearch(event)" placeholder="Search"
													id="quickFilter" autocomplete="off">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												<button class="btn go-btn" type="button" onclick="reset()">Reset</button>
											</div>
										</div>
										
									</div> -->
									
										
										
											<div class="d-flex gap-2 search-sec position-relative">
												<input class="form-control w-400" type="text"
													onkeydown="enterToSearch(event)" placeholder="Search"
													id="quickFilter" autocomplete="off">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												<button class="btn go-btn" type="button" onclick="reset()">Reset</button>
											</div>
										
									
								
 						<button class="btn btn-primary edit-btn" type="button"
							id="dltBtn" onclick="deleteSelected()">Delete Selected</button>

					</div>
					<div id="myGrid" class="ag-theme-alpine"></div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
