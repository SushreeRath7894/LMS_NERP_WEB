function masterSaveCourse() {
    var valid = true;

    // Create FormData object
    var formData = new FormData();

    // Append individual form fields for announcement
    formData.append('announcementId', $("#announcementId").val());
    formData.append('subject', $("#subject").val());
    formData.append('description', $("#description").val());
    formData.append('startDate', $("#startDate").val());
    formData.append('endDate', $("#endDate").val());

    // Validation
    if (!formData.get('subject')?.trim()) {
        toastr.error("Subject Required");
        return;
    }
    if (!formData.get('description')?.trim()) {
        toastr.error("Description Required");
        return;
    }
    if (!formData.get('startDate')?.trim()) {
        toastr.error("Start Date Required");
        return;
    }
    if (!formData.get('endDate')?.trim()) {
        toastr.error("End Date Required");
        return;
    }

    // Employee Grid data
    var selectedEmployeeRows = gridOptionsEmployee.api.getSelectedRows();
     var selectedEmployee = selectedEmployeeRows.map(row => row.employeeId);
    if (selectedEmployee.length > 0) {
        formData.append('employeeList', JSON.stringify(selectedEmployee));
    } else {
        toastr.warning("Please select at least one employee.");
        return;
    }

    // Student Grid data
    var selectedStudentRows = gridOptionsStudent.api.getSelectedRows();
    var selectedStudent = selectedStudentRows.map(row => row.studentId);
    if (selectedStudent.length > 0) {
        formData.append('studentList', JSON.stringify(selectedStudent));
    } else {
        toastr.warning("Please select at least one student.");
        return;
    }

    // Additional fields for student assignment (optional if required)
    formData.append('assignStudId', $("#assignStudId").val());
    formData.append('studentId', $("#studentId").val()); // optional field

    console.log("FormData Entries:");
    for (var pair of formData.entries()) {
        console.log(pair[0]+ ': ' + pair[1]);
    }

    if (valid) {
        saveAnnouncement(formData);
    }
}




function saveAnnouncement(formData) {
    $.ajax({
        url: 'announcement-add', 
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false, 
        success: function(response) {
            toastr.success('Announcement saved successfully');
            getAnnouncementDetails();
        },
       
        error: function(xhr, status, error) {
            toastr.error('Error saving course');
        }
    });
}



function getAnnouncementDetails() {

	agGrid.simpleHttpRequest({
		url: "announcement-view"
	}).then(function(response) {
		if (response.message === "Success") {

			const responseBody = JSON.parse(response.body);
			const announceData = responseBody.announceData;

			window.gridApi.setRowData(announceData);

			if (announceData && announceData.length > 0) {
				window.gridApi.forEachNode(function(node) {
					if (node.rowIndex === 0) {
						node.setSelected(true);
					}
				});
			}

		} else {
			console.error("Failed to fetch data");
		}
	});
}


function editAnnouncement(announcementId) {
    $.ajax({
        type: "GET",
        url: "announcement-edit?Id=" + announcementId,
        async: false,
        success: function(response) {
            if (response.code === "success") {
                const announcementDetails = JSON.parse(response.body).announcementDetails;
                console.log("DATA=============", announcementDetails);

                if (announcementDetails && announcementDetails.length > 0) {
                    const data = announcementDetails[0];

                    // Populate form fields
                    $("#announcementId").val(data.announcementId || "");
                    $("#subject").val(data.subject || "");
                    $("#description").val(data.description || "");
                    $("#startDate").val(data.startDate || "");
                    $("#endDate").val(data.endDate || "");

                    // Employee List from server
                    const employeeList = data.employeeList || [];
                    // Student List from server
                    const studentList = data.studentList || [];

                    // Set selected rows in Employee Grid
                    gridOptionsEmployee.api.forEachNode(function(node) {
                        if (employeeList.includes(node.data.employeeId)) {
                            node.setSelected(true);
                        }
                    });

                    // Set selected rows in Student Grid
                    gridOptionsStudent.api.forEachNode(function(node) {
                        if (studentList.includes(node.data.studentId)) {
                            node.setSelected(true);
                        }
                    });

                }
            }
        },
        error: function(error) {
            console.error("Error fetching announcement details:", error);
        }
    });
}



function addApplication(){
	if (window.gridApi) {
		window.gridApi.deselectAll();
}
	
	if (gridOptionsEmployee.api) {
		gridOptionsEmployee.api.deselectAll();
}
	if (gridOptionsStudent.api) {

}
	$("#announcementId").val('');
	$("#subject").val('');
	$("#description").val('');
	$("#startDate").val('');
	$("#endDate").val('');
}



function getAllEmployeeDetails(employeeList) {
    console.log("Employee List:", employeeList);

    const flatEmployeeList = (employeeList || []).flat().filter(emp => emp && emp.employeeId);
    const selectedEmployeeIds = flatEmployeeList.map(emp => emp.employeeId);

    agGrid.simpleHttpRequest({
        url: "announcement-employee-view"
    }).then(function(response) {
        if (response.message === "Success") {
            const responseBody = JSON.parse(response.body);
            const employeeData = responseBody.employeeData;

            gridOptionsEmployee.api.setRowData(employeeData);
            setTimeout(() => {
                gridOptionsEmployee.api.forEachNode((node) => {
                    if (selectedEmployeeIds.includes(node.data.employeeId)) {
                        node.setSelected(true);
                    }
                });
            }, 0);

        } else {
            console.error("Failed to fetch data");
        }
    });
}
function getAllStudentDetails(studentList) {
    console.log("Student List:", studentList);

   const flatStudentList = (studentList || []).flat().filter(emp => emp && emp.studentId);
   const selectedStudentIds = flatStudentList.map(emp => emp.studentId);

    agGrid.simpleHttpRequest({
        url: "announcement-student-view"
    }).then(function(response) {
        if (response.message === "Success") {
            const responseBody = JSON.parse(response.body);
            const studentData = responseBody.studentData;

            gridOptionsStudent.api.setRowData(studentData);
            setTimeout(() => {
            	gridOptionsStudent.api.forEachNode((node) => {
                    if (selectedStudentIds.includes(node.data.studentId)) {
                        node.setSelected(true);
                    }
                });
            }, 0);

        } else {
            console.error("Failed to fetch data");
        }
    });
}
