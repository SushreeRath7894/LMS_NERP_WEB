<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>My Wishlist</title>

  <!-- Custom CSS -->
  <style>
   .wishlist-icon {
    border: 2px solid red !important;
}

    .btn {
      font-weight: 500;
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(78, 115, 223, 0.3);
    }


   
    /* Wishlist Section */
    .wishlist-section {
      padding: 5rem 0;
      background-color: var(--light-gray);
    }

    .wishlist-card {
      background-color: var(--light-color);
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .wishlist-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }

    .wishlist-card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .wishlist-card-body {
      padding: 1.5rem;
    }

    .wishlist-card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--dark-color);
      margin-bottom: 0.5rem;
    }

    .wishlist-card-instructor {
      font-size: 0.875rem;
      color: var(--gray-color);
      margin-bottom: 0.5rem;
    }

    .wishlist-card-price {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    .wishlist-card-rating {
      font-size: 0.875rem;
      color: #f4c150;
      margin-bottom: 1rem;
    }

    .wishlist-card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .empty-wishlist {
      text-align: center;
      padding: 3rem;
      border-radius: 10px;
    }

    .empty-wishlist i {
      font-size: 3rem;
      color: #000000;
      margin-bottom: 1rem;
    }

    .empty-wishlist h4 {
      font-size: 1.5rem;
      color: var(--dark-color);
      margin-bottom: 1rem;
    }

    .empty-wishlist p {
      color: var(--gray-color);
      margin-bottom: 1.5rem;
    }

#wishlist-items-container {
    max-height: 300px;
    overflow-y: auto;
    padding-right: 8px;
    scroll-behavior: smooth;
}
#wishlist-items-container::-webkit-scrollbar {
    width: 8px;
}

#wishlist-items-container::-webkit-scrollbar-track {
    background: #f1f1f1; /* Light background for track */
    border-radius: 4px;
}

#wishlist-items-container::-webkit-scrollbar-thumb {
    background-color: #ccc; /* Light thumb color */
    border-radius: 4px;
}

#wishlist-items-container::-webkit-scrollbar-thumb:hover {
    background-color: #bbb; /* Slightly darker on hover */
}

  </style>
</head>
<body>
  <div th:replace="lms/lms-navbar :: lms-nav"></div>

  <!-- Wishlist Section -->
<section class="py-5 bg-about">
<div class="section-header mb-0 text-center">
  <div class="container">
				<span class="section-subtitle">Your Favorites</span>
				<h2 class="section-title text-white">My Wishlist</h2>
				<p class="section-description text-white">Explore the courses you've saved
					for later. Add them to your cart or remove them as needed.</p>
			</div>
      </div>
</section>

	<section class="wishlist-section py-5 bg-light">
		<div class="container">
		
			<div class="wishlist-wrapper py-5">
				<div class="wishlist-content">
					<div class="row g-4" id="wishlistItems"></div>

					<div class="empty-wishlist d-none text-center" id="emptyWishlist">
						<i class="fas fa-heart-broken fa-3x  mb-3"></i>
						<h2>Your Wishlist is Empty</h2>
						<p class="text-muted">Looks like you haven't added any courses
							yet. Explore our courses and save your favorites!</p>
						<a href="/all-courses" class="btn btn-primary mt-2">Explore
							Courses</a>
					</div>
				</div>
			</div>
		</div>
	</section>
	<!-- Footer -->
    <div th:replace="lms/lms-footer :: lms-footer"></div>
    <!-- <script src="../javaScript/lms/wishlist.js"></script> -->
</body>
</html>
