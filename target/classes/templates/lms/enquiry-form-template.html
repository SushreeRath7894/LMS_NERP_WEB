	function saveEnquiryData(){
				
				let allData = [];
				gridOptionsEducation.api.forEachNode(function(node) {
				    allData.push(node.data);
				});
				
				
				let examData = [];
				gridOptionsExamAppread.api.forEachNode(function(node) {
					examData.push(node.data);
				});
				
		    var formData = {
		    	id:$("#enquiryId").text(),
		        name: $('#EnquireyName').val().trim(),
		        fatherName: $('#fathername').val().trim(),
		        fatherTelNumber: $('#fatherTelNumber').val().trim(),
		        fatherProfession: $('#fatherProfession').val().trim(),
		        motherName: $('#motherName').val().trim(),
		        motherTelNumber: $('#motherTelNumber').val().trim(),
		        motherProfession: $('#motherProfession').val().trim(), // same ID, consider changing it!
		        address: $('#address').val().trim(),
		        candidateTelNumber: $('#candidateTelNumber').val().trim(),
		        isWhatsappNumber: $('#isWhatsappNumber').is(':checked'),
		        emailId: $('#emailId').val().trim(),
		        dobDate: $('#dobDate').val().trim(),
		        category: $('#candidateCategory').val(),
		        guidanceRequiredFor: $('#guidanceSelect').val(),
		        otherExamName: $('#otherExamName').val().trim(),
		        subjectTaken: $('#subjectTaken').val(),
		        otherSubjectName: $('#otherSubjectName').val().trim(),
		        educationList : allData,
		        examList : examData,
		        source:$('#enquirySource').val(),
		        LeadType : "Enquiry"
		    };

		    const otherValue = $('#otherExamName').val().trim(); 
		    let guidance = formData.guidanceRequiredFor;
		    if ((Array.isArray(guidance) && guidance.includes("other")) || guidance === "other") {
		        if (otherValue === "") {
		            toastr.error("Please enter Other Exam Name");
		            return;
		        }
		        formData.otherExamName = otherValue; 
		    } else {
		        formData.otherExamName = ""; 
		    }
		    
		    
		    
		    const otherSubject = $('#otherSubjectName').val().trim(); 
		    let subject = formData.subjectTaken;
		    if ((Array.isArray(subject) && subject.includes("other")) || subject === "other") {
		        if (otherValue === "") {
		            toastr.error("Please enter Other Subject Name");
		            return;
		        }
		        formData.otherSubjectName = otherValue; 
		    } else {
		        formData.otherSubjectName = ""; 
		    }
		    var isValid = true;
		    
		    console.log("formData -->", formData);
		    
		    if (formData.name === "") {
		        toastr.error("Please Enter Name");
		        return;
		    }
		    if (formData.fatherName === "") {
		        toastr.error("Please Enter Father's Name");
		        return;
		    }
		    if (formData.fatherTelNumber === "") {
		        toastr.error("Please Enter Father's Telephone Number");
		        return;
		    }
		   
		    if (formData.motherName === "") {
		        toastr.error("Please Enter Mother's Name");
		        return;
		    }
		    if (formData.motherTelNumber === "") {
		        toastr.error("Please Enter Mother's Telephone Number");
		        return;
		    }
		   
		    if (formData.address === "") {
		        toastr.error("Please Enter Address");
		        return;
		    }
		    if (formData.candidateTelNumber === "") {
		        toastr.error("Please Enter Candidate's Telephone Number");
		        return;
		    }
		    if (formData.emailId === "") {
		        toastr.error("Please Enter Email ID");
		        return;
		    }
		    if (formData.dobDate === "") {
		        toastr.error("Please Enter Date of Birth");
		        return;
		    }
		    if (formData.category === "") {
		        toastr.error("Please Enter Category");
		        return;
		    }
		    if (formData.guidanceRequiredFor === "") {
		        toastr.error("Please Enter Guidance Required For");
		        return;
		    }
		    if (formData.subjectTaken === "") {
		        toastr.error("Please Enter Subject Taken");
		        return;
		    }

		    if(formData.educationList.length == 0){
		    	toastr.error("Please Enter Education Details");
		    	 return;
		    }
		    
		    
		    console.log("formData -->", formData);

		    if (!isValid) {
		        return; 
		    }

		    $.ajax({
		        url: 'enquiry-save', 
		        type: 'POST',
		        contentType: 'application/json',
		        data: JSON.stringify(formData),
		        success: function(response) {
		        	if(response.code =="Success"){
		        		toastr.success(response.message);
		        		getEnquiryData();
		        	}
		        },
		        error: function(xhr, status, error) {
		            alert("Error saving data: " + error);
		        }
		    });
	}

	function getEnquiryDataById(id){
		gridOptionsEducation.api.setRowData([]);
		gridOptionsExamAppread.api.setRowData([]);
		
		$.ajax({
	        url: 'enquiry-details-edit?id=' + id, 
	        type: 'GET',
	        contentType: 'application/json',
	        success: function(response) {
	        	if(response.code =="Success"){
	        		console.log("success-->" , response);
	        		let allData = JSON.parse(response.body);
	        		let enquiryDAta = allData[0].enquiryData;
	        		
	        		$('#EnquireyName').val(enquiryDAta[0].name);
	 		 		$('#fathername').val(enquiryDAta[0].fathername);
	 		      	$('#fatherTelNumber').val(enquiryDAta[0].FatherMobile);
	 		       	$('#fatherProfession').val(enquiryDAta[0].FatherProfession);
	 				$('#motherName').val(enquiryDAta[0].mothername);
	 		      	$('#motherTelNumber').val(enquiryDAta[0].MotherMobile);
	 		      	$("#motherProfession").val(enquiryDAta[0].MotherProfession)
	 				$('#address').val(enquiryDAta[0].address),
	 		        $('#candidateTelNumber').val(enquiryDAta[0].mobilenumber);
	 		      	if (enquiryDAta[0].WhatsappNUmberCheck === "true") {
	 		      	    $('#isWhatsappNumber').prop('checked', true);
	 		      	} else {
	 		      	    $('#isWhatsappNumber').prop('checked', false);
	 		      	}
	 				$('#emailId').val(enquiryDAta[0].email);
	 				$('#dobDate').val(enquiryDAta[0].dob);
	  				$('#candidateCategory').val(enquiryDAta[0].Category).trigger('change');
	  				$('#enquirySource').val(enquiryDAta[0].source).trigger('change');
	  				let guidanceArray = JSON.parse(enquiryDAta[0].Guidance); 
	  				let subjectArray = JSON.parse(enquiryDAta[0].Subject);    
	  				
	  				$("#guidanceSelect").val(guidanceArray).trigger("chosen:updated")
	  				$('#subjectTaken').val(subjectArray).trigger("chosen:updated")
	  				let educationDetails = JSON.parse(enquiryDAta[0].EducationDetails);
	  				let ExamList = JSON.parse(enquiryDAta[0].ExamList);
	  			    gridOptionsEducation.api.applyTransaction({ add: educationDetails });
	  			  	gridOptionsExamAppread.api.applyTransaction({ add: ExamList });
	        	}
	        },
	        error: function(xhr, status, error) {
	            alert("Error saving data: " + error);
	        }
	    });
		
		
	}

	function validateFatherTelNumber(id) {
	    var tel = document.getElementById(id).value.trim();

	    if (tel === '') {
	        toastr.error("Telephone number is required.");
	    } else if (!/^\d+$/.test(tel)) {
	    	toastr.error("Only digits are allowed.");
	    } else if (tel.length !== 10) {
	    	toastr.error("Telephone number must be exactly 10 digits.");
	    	$("#" + id).val(tel.slice(0,10));
	    } 
	}
	
	function validateEmail(id) {
	    const email = $('#' + id).val().trim();
	    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

	    if (email === '') {
	    	toastr.error('Email is required');
	        return false;
	    } else if (!regex.test(email)) {
	    	toastr.error('Invalid email format');
	        return false;

	  let examRowId = 1;
	  let examNode = null;
	  function addExamDetails() {
			const exam = $('#exam').val().trim();
			const year = $('#year').val().trim();
			const result = $('#result').val().trim();

			if (!exam || !year || !result) {
				toastr.error('Please fill in all fields.');
				return;
			}

			const newData = {
				id : 'edu_' + examRowId++,
				exam : exam,
				year : year,
				result : result
			};


			 if (examNode) {
				 examNode.setData(newData);
				 examNode = null; 
				  } else {
					  gridOptionsExamAppread.api.applyTransaction({ add: [newData] });
				  }
			$('#exam, #year, #result').val('');
			cancelExam();
		}
	  
	  
	  function editExamBtn(){
		  
		  const selectedNodes = gridOptionsExamAppread.api.getSelectedNodes();
		  examNode = selectedNodes[0];
			  const data = examNode.data;
			  $('#exam').val(data.exam);
			  $('#year').val(data.year);
			  $('#result').val(data.result);
			  $("#examFieldContainer").removeClass("d-none");
				$("#examGridContainer").addClass("d-none");
				$("#addExamBtn").addClass("d-none");
				$("#deleteBtnexam").addClass("d-none");
				$("#editBtnexam").addClass("d-none");
				gridOptionsExamAppread.api.deselectAll();
		  
	  }
	  
	  
	  function deleteExamBtn() {
		  const selectedNodes = gridOptionsExamAppread.api.getSelectedNodes();
		  gridOptionsExamAppread.api.applyTransaction({ remove: selectedNodes.map(node => node.data) });
		  $('#exam, #year, #result').val('');
		}

	  
	  function SearchUserInput(event) {
			if (event.key === "Enter" || event.keyCode === 13) {
				event.preventDefault();
				onQuickFilterChanged();
			}
		}

		function getMostClosestRow() {
			let searchValue = document.getElementById('quickFilter').value;
			gridOptions.api.setQuickFilter(searchValue);

			let rowCount = gridOptions.api.getModel().getRowCount();

			gridOptions.api.forEachNodeAfterFilter((node, index) => {
				if (index === 0) {
					node.setSelected(true);
					gridOptions.api.ensureIndexVisible(node.rowIndex);
				}
			});
		}

		function resetBtn() {
			$("#quickFilter").val('');
			gridOptions.api.setQuickFilter('');
			gridOptions.api.refreshCells({ force: true });
			onQuickFilterChanged();
			setTimeout(() => {
				gridOptions.api.forEachNode((node, index) => {
					if (index === 0) {
						node.setSelected(true);
						gridOptions.api.ensureIndexVisible(node.rowIndex);
					}
				});
			}, 50);
		}
		
		function onQuickFilterChanged() {
			gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
