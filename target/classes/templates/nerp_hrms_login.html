<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #e5e7ea;
        }

        /* Left panel */
        .left-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 10rem;
            background: linear-gradient(135deg, #0b3a73 0%, #8e63e6 60%, #7a5de0 100%);
            color: white;
        }

        .brand-content {
            width: 100%;
            max-width: 560px;
            text-align: left;
        }

        .brand-logo{
            width: 160px;
            height: 80px;
            margin-bottom: 28px;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .brand-divider {
            border-color: rgba(255, 255, 255, 0.25);
            margin: 1.5rem 0;
        }

        .brand-subtitle {
            font-size: 1rem;
            opacity: 0.95;
            line-height: 1.6;
        }

        /* Right panel (form) */
        .right-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem;
        }

        .login-container {
            width: 100%;
            max-width: 760px;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #76787b;
            border-radius: 4px;
            font-size: 1rem;
            background: transparent;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #374151;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-label {
            color: #374151;
            font-size: 0.9rem;
        }

        .login-button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-transform: none;
			margin-top: 10px;
        }

        .login-button:hover {
            background: #5a67d8;
        }

        .login-button:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }

        .divider {
            margin: 1.5rem 0;
        }

        .help-text {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: space-between;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .help-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .help-link:hover {
            text-decoration: underline;
        }

        .alert {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                grid-template-columns: 1fr;
            }

            .left-section {
                padding: 3rem 5rem;
                min-height: calc(100vh - 64px);
            }

            .right-section {
                padding: 2rem 4rem;
                min-height: auto;
            }
        }

        @media (max-width: 480px) {
            .left-section {
                padding: 2rem;
            }

            .right-section {
                padding: 1.5rem;
            }

            .brand-title {
                font-size: 1.6rem;
            }

            .login-title {
                font-size: 1.5rem;
            }

            .form-input {
                padding: 0.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="left-section">
        <div class="brand-content">
            <img src="../assets/images/digital-logo-footer.png" alt="Ducis Logo" class="brand-logo">
            <h1 class="brand-title">Helping Businesses Stay Relevant, Consistent, and Growing</h1>
            <hr class="brand-divider">
            <p class="brand-subtitle">Digital transformation and superior IT services are the backbone of businesses today</p>
        </div>
    </div>

    <div class="right-section">
        <div class="login-container">
            <h2 class="login-title mb-3">Log in</h2>

            <form method="post" th:action="@{/login}">
                <div id="error-message" class="alert" style="display: none;"></div>

                <div class="form-group">
                    <label class="form-label" for="username">Email</label>
                    <input type="email" id="username" name="username" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5S21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12S9.24 7 12 7S17 9.24 17 12S14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12S10.34 15 12 15S15 13.66 15 12S13.66 9 12 9Z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="remember" class="checkbox">
                    <label for="remember" class="checkbox-label">Keep me logged in</label>
                </div>

                <button type="submit" class="login-button">Log in now</button>
            </form>

            <hr class="divider">

            <div class="help-text">
                <a href="/signup" class="help-link">Create new account</a>
                <a href="/forgot-password" class="help-link">Forgot password</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11.83 9L15 12.16V12C15 10.34 13.66 9 12 9H11.83ZM7.53 9.8L9.08 11.35C9.03 11.56 9 11.77 9 12C9 13.66 10.34 15 12 15C12.22 15 12.44 14.97 12.65 14.92L14.2 16.47C13.53 16.8 12.79 17 12 17C9.24 17 7 14.76 7 12C7 11.21 7.2 10.47 7.53 9.8ZM2 4.27L4.28 6.55L4.73 7C3.08 8.3 1.78 10 1 12C2.73 16.39 7 19.5 12 19.5C13.55 19.5 15.03 19.2 16.38 18.66L16.81 19.09L19.73 22L21 20.73L3.27 3L2 4.27ZM12 7C14.76 7 17 9.24 17 12C17 12.64 16.87 13.26 16.64 13.82L19.57 16.75C21.07 15.5 22.27 13.86 23 12C21.27 7.61 17 4.5 12 4.5C10.6 4.5 9.26 4.75 8.03 5.2L10.17 7.34C10.74 7.13 11.35 7 12 7Z"/>
                    </svg>
                `;
            } else {
                passwordField.type = 'password';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5S21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12S9.24 7 12 7S17 9.24 17 12S14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12S10.34 15 12 15S15 13.66 15 12S13.66 9 12 9Z"/>
                    </svg>
                `;
            }
        }

        // Add input focus animations
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function () {
                this.parentElement.style.transform = 'translateY(-2px)';
            });

            input.addEventListener('blur', function () {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>

</html>
