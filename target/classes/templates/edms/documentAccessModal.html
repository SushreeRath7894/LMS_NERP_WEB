<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="documentAccessModal">

<head>
	<script>
 
	</script>
	<title>Nerp</title>
</head>
<!--Document Access Modal Start-->
<div class="modal fade" id="accessControlModal">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<!-- Modal Header -->
			<div class="modal-header">
				<h4 class="modal-title">Access Control</h4>
				<button type="button" class="close" data-dismiss="modal" style="width: 24px;"
					onclick="cancelAccessControlModal();">&times;</button>
			</div>

			<!-- Modal body -->
			<div class="modal-body">
				<div class="form-group button-group">
					<button class="button button1" style="padding: 2px 71px!important;"
						onclick="userDocAccesss('0');">User Id</button>
					<h6>or</h6>
					<button class="button button2" onclick="userDocAccesss('1');">User Group</button>
					<input type="hidden" id="documentId">
					<input type="hidden" id="documentAccessType">
					 <input type="hidden" id="accessId"> 
				</div>
				
				<div style="margin-top: 7px;margin-left: 2px;">
					<input type="hidden" id="selectedUser" readonly style="padding: 0px!important;width: 100%;background-color: #f2f2f2;border: 1px;">
					<textarea id="selectedUserName" readonly ></textarea>
<!--					<input type="text" id="selectedUserGroup" readonly style="padding: 0px!important;width: 44%;background-color: #f2f2f2;border: 1px;margin-left: 36px;">
-->				</div>
				<div class="new expiration-section">
					<form>
						<div class="form-group1">
							<input type="checkbox" id="read">
							<label for="read">Read</label>
						</div>
						<div class="form-group1">
							<input type="checkbox" id="write">
							<label for="write">Write</label>
						</div>
						<div class="form-group1">
							<input type="checkbox" id="deletee">
							<label for="deletee">Delete</label>
						</div>
					</form>
				</div>
				<div class="expiration-section">
					<label class="switch">
						<input type="checkbox" checked>
						<span class="slider round"></span>
					</label>
					<h6 style="margin-left: 20px;margin-right: 50px;">Expiration</h6>
					<input type="date" class="form-control" id="expirationDate">
				</div>
				<div class="form-group">
		         <label>Remarks</label>
				 <textarea class="form-control" id="remarks"></textarea>
				</div>
					
																
												
			</div>

			<!-- Modal footer -->
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" onclick="giveAccess();">Save</button>
				<button type="button" class="btn btn-danger" data-dismiss="modal"
					onclick="cancelAccessControlModal();">Cancel</button>
			</div>

		</div>
	</div>
</div>
</script>
</html>
