<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">

<head>


<script src="../javaScript/edms/workSpaceNew.js"></script>
<link rel="stylesheet" href="../assets/css/edms/workspace.css" />
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
<!-- <link rel="stylesheet"
	href="../css/production-plan/rmpm-requisition.css"> -->
<script type="text/javascript">
/* $(document).ready(function() {triggerExpansionR(1);}); */
</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<!--Tabination 1 Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">
							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between bdr-line p-2">
										<div class="col-md-8">
											<form class="d-flex search-sec position-relative">
												<input class="form-control me-2" id="seacrhInput"
													type="text" placeholder="Search" autoComplete="off">
												<button class="btn btn-primary go-btn"
													onClick="searchFolder()" type="button">Go</button>
												<button class="btn go-btn w-auto mx-2" type="button"
													onclick="resetBtn()">Reset</button>
											</form>
										</div>
										<div class="col-md-2 d-flex justify-content-end">
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>

									</div>
									<div class="card m-2">
										<div class="requisition-tbl table-responsive">
											<div id="header">
												<div class="row">
													<div id="breadcrumb"></div>
												</div>
												<div class="row">
													<div class="col-md-3">
														<button id="backButton">
															<svg xmlns="http://www.w3.org/2000/svg" width="16"
																height="16" fill="currentColor"
																class="bi bi-arrow-90deg-left" viewBox="0 0 16 16">
																<path fill-rule="evenodd"
																	d="M1.146 4.854a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H12.5A2.5 2.5 0 0 1 15 6.5v8a.5.5 0 0 1-1 0v-8A1.5 1.5 0 0 0 12.5 5H2.707l3.147 3.146a.5.5 0 1 1-.708.708z" />
															</svg>
														</button>
														<!-- <button class="approve-btn" id="new" onclick="addFolder();">NEW</button> -->
													</div>
													<div class="col-md-6">
														<div class="form-group"></div>
													</div>
												</div>
											</div>

											<div class="font-design" id="totalReq">

												<!-- (<span></span>) -->
											</div>

											<!-- Header Row -->
											<div class="folderHeader">
												<div class="headerItemOne">Folder Name</div>
												<div class="headerItemTwo">Date & Time</div>
												<div class="headerItemThree">Created By</div>
												<div class="headerItemFour">Details</div>
											</div>
											<div id="folderView"></div>

											<i class="bi bi-grid-3x2-gap-fill gridView iconActive"
												onclick="getGridView()"></i> <i
												class="bi bi-card-list listView " onclick="getListView()"></i>
										</div>
									</div>

								</div>

							</div>

							<div id="snackbar" class="snackbar"></div>

							<!--Left Sec End-->

							<!-- Right Section Start -->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">

									<!-- Left aligned max-btn -->
									<div
										class="d-flex flex-row-reverse justify-content-between align-items-center p-2 bdr-line">
										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" data-bs-placement="top"
											title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>

										<!-- Right aligned buttons -->
										<div class="d-flex gap-1">
											<ul class="nav nav-pills newtab" role="tablist" id="tabMenu">
												<li class="nav-item"><a class="nav-link active"
													data-bs-toggle="pill" id="workSpaceCreation"
													href="#createWorkspace" onclick="createWorkspace()">Create
														Workspace</a></li>
												<li class="nav-item accessLink"><a class="nav-link"
													data-bs-toggle="pill" id="Read" href="#readAccess"
													onclick="readAccess()">Read Access</a></li>
												<li class="nav-item accessLink"><a class="nav-link"
													data-bs-toggle="pill" id="Write" href="#writeAccess"
													onclick="writeAccess()">Write Access</a></li>
												<li class="nav-item accessLink"><a class="nav-link"
													data-bs-toggle="pill" id="Delete" href="#deleteAccess"
													onclick="deleteAccess()">Delete Access</a></li>
											</ul>
											<div class="row" id="commonAggrid" style="display: none;">
												<h3>Access Control</h3>
												<div id="activity" style="width: 100%; height: 150px;"
													class="ag-theme-alpine"></div>
											</div>
										</div>
									</div>
									<!-- Tab Start -->
									<!-- Start of Tab Content -->
									<div class="tab-content" id="tabContent">
										<!-- Create Workspace -->
										<div id="createWorkspace" class="tab-pane active p-2">

											<div class="requisition-tbl ">

												<div class="mb-2">
													<table class="table table-bordered mb-0" width="100%">
														<tr valign="middle">
															<td width="50%"><strong>
																	<div class="col-md-12 requisition_ids_text">
																		Workspace Id: <span id="workspaceid"></span>
																	</div>
															</strong></td>
															<!-- <td width="10%">Male</td>
																<td width="10%">45</td> -->
															<td>
																<div class="d-flex justify-content-end">
																	<div class="mr-1">
																		<button
																			class="btn btn-primary edit-btn"
																			type="button" id="add-btn"
																			onclick="newFolderDetailsAdd()">Add</button>
																	</div>
																	<div class="mr-1">
																		<!-- <button
																				class="btn btn-primary edit-btn operation-btn"
																				type="button" id="ticket-editBtn"
																				onclick="editItems()">Edit</button> -->
																		<input type="hidden" class="form-control"
																			id="editTktId">

																	</div>
																	<div class="mr-2" id="parent-cancel-btn" style="display:none">
																		<button class="btn btn-primary edit-btn"
																			onclick="cancelWorkSpaceBtn()" type="button">Cancel</button>
																	</div>

																	<div class="mr-2" id="parentSaveBtn">
																		<button class="btn btn-primary edit-btn"
																			onclick="saveWorkSpace()" type="button">Save</button>
																	</div>
																	<div class="mr-0">
																		<button class="btn btn-primary edit-btn operation-btn"
																			type="button" id="next-btn-parent"
																			style="display: none"
																			onclick="nextBtnFunction('readAccess')">Next</button>
																	</div>

																</div>

															</td>
														</tr>
													</table>
												</div>
												<div class="card p-2">
													<form>
														<div class="content-header">
															<!-- Modal Header -->
															<div class="form-modal-header">
																<h5 class="modal-title mb-4">Create Workspace</h5>

															</div>
															<div class="form-input-body">
																<div class="row" id="workSpaceDetails">
																	<input type="hidden" id="workspaceId"> <input
																		type="hidden" id="parentFolderPath"> <input
																		type="hidden" id="parentId">
																	<div class="col-md-6 mb-4">
																		<div class="form-group">
																			<label> Parent Folder </label> <input type="text"
																				class="form-control" id="parentFolderName" disabled>
																		</div>
																	</div>
																	<div class="col-md-6 mb-4">
																		<div class="form-group" id="newFolderInputDiv">
																			<label> New Folder Name </label> <input type="text"
																				class="form-control" id="newFolderName"> <span
																				id="validationMessage"
																				style="color: red; font-size: 12px; font-weight: 600;"></span>
																		</div>
																	</div>
																	<div class="col-md-6 mb-4">
																		<div class="form-group">
																			<label> Type </label>
																			<div class="select">
																				<select id="accessType" onblur="removeValid(event);"
																					onchange="handleAccessTypeChange()">
																					<option value="">Select</option>
																					<option th:each="c,iter:${accessType}"
																						th:value="${c.key}" th:text="${c.name}"></option>
																				</select>
																			</div>
																		</div>
																	</div>
																	<div class="col-md-6 mb-4">
																		<div class="form-group">
																			<label> Owner</label> <input type="text"
																				class="form-control" id="owner"
																				th:value="${userName}" readonly /> <input
																				type="hidden" class="form-control" id="ownerId"
																				th:value="${userId}" /> <input type="hidden"
																				class="form-control" id="orgName"
																				th:value="${orgName}" /> <input type="hidden"
																				class="form-control" id="orgDivision"
																				th:value="${orgDivision}" />
																		</div>
																	</div>
																	<div class="col-md-12 mb-4">
																		<div class="form-group">
																			<label> Default Tags(Put comma separated
																				tags) </label> <input type="text" class="form-control"
																				id="defaultTags">
																		</div>
																	</div>

																	<div class="col-md-12">
																		<div class="form-group">
																			<label> Description </label>
																			<textarea class="form-control" id="description"
																				onblur="removeValid(event)"></textarea>
																		</div>
																	</div>
																</div>
															</div>


														</div>
													</form>
												</div>




											</div>
										</div>

										<!-- Read Access -->
										<div id="readAccess" class="tab-pane fade p-2">

											<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tr valign="middle">
														<td width="50%"><strong>
																<div class="col-md-12 requisition_ids_text">
																	Workspace Id: <span class="accessControlId"></span>
																</div>
														</strong></td>
														<!-- <td width="10%">Male</td>
																<td width="10%">45</td> -->
														<td>
															<div class="d-flex justify-content-end">
																<div class="mr-2">
																	<button class="btn btn-primary edit-btn operation-btn"
																		type="button" id="save-btn"
																		onclick="previousButton('createWorkspace')">Previous</button>
																</div>

																<div class="mr-2">
																	<button class="btn btn-primary edit-btn operation-btn"
																		type="button" id="save-btn"
																		onclick="nextBtnFunction('writeAccess')">Next</button>
																</div>

															</div>

														</td>
													</tr>
												</table>
											</div>
											<div class="card p-2">
												<div id="readAccessControl"></div>
											</div>
										</div>

										<!-- Write Access -->
										<div id="writeAccess" class="tab-pane fade p-2">
											<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tr valign="middle">
														<td width="50%"><strong>
																<div class="col-md-12 requisition_ids_text">
																	Workspace Id: <span class="accessControlId"></span>
																</div>
														</strong></td>
														<!-- <td width="10%">Male</td>
																<td width="10%">45</td> -->
														<td>
															<div class="d-flex justify-content-end">
																<div class="mr-2">
																	<button class="btn btn-primary edit-btn operation-btn"
																		type="button" id="save-btn"
																		onclick="previousButton('readAccess')">Previous</button>
																</div>

																<div class="mr-2">
																	<button class="btn btn-primary edit-btn operation-btn"
																		type="button" id="save-btn"
																		onclick="nextBtnFunction('deleteAccess')">Next</button>
																</div>

															</div>

														</td>
													</tr>
												</table>
											</div>
											<div class="card p-2">
												<div id="writeAccessControler"></div>
											</div>
										</div>

										<!-- Delete Access -->
										<div id="deleteAccess" class="tab-pane fade p-2">
											<div class="mb-2">
												<table class="table table-bordered mb-0" width="100%">
													<tr valign="middle">
														<td width="50%"><strong>
																<div class="col-md-12 requisition_ids_text">
																	Workspace Id: <span class="accessControlId"></span>
																</div>
														</strong></td>
														<!-- <td width="10%">Male</td>
																<td width="10%">45</td> -->
														<td>
															<div class="d-flex justify-content-end">
																<div class="mr-2">
																	<button class="btn btn-primary edit-btn operation-btn"
																		type="button" id="save-btn"
																		onclick="previousButton('writeAccess')">Previous</button>
																</div>

																<div class="mr-2" id="childFinalSave">
																	<button class="btn btn-primary edit-btn"
																		onclick="saveWorkSpace()" type="button">Save</button>
																</div>

															</div>

														</td>
													</tr>
												</table>
											</div>
											<div class="card p-2">
												<div id="deleteAccessControler"></div>
											</div>

										</div>
									</div>
									<!-- end of Tab Content -->
								</div>
								<!-- Tab End -->
							</div>
							<!-- Right Section End -->
						</div>
						<!--Tabbination 1 End-->

					</div>

				</div>
			</div>

		</div>
	</div>
</body>

</html>
