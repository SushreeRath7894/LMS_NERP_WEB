<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="userGroupModal">

<head>
	<script>
		$(document).ready(function () {
			var rowData = [];
			var gridDiv = document.querySelector('#userGroupGrid');
			new agGrid.Grid(gridDiv, gridOptionUsersGroups);
			gridOptionUsersGroups.api.setRowData(rowData);
		});
		var columnDefs1 = [ 
			{
				headerCheckboxSelection: false,
				headerCheckboxSelectionFilteredOnly: true,
				checkboxSelection: true,
				width: 10,
				sortable: false,
				filter: false,
				resizable: true

			},
			{
				headerName: "Group ID",
				field: "groupId",
				width: 250,
				cellRenderer: function (params) {
					console.log(params)
					return '<a id="docId" onclick=editGroup("'
						+ params.data.groupId + '") href="javascript:void(0)">'
						+ params.data.groupId + '</a>';

				},
			}, {
				headerName: "Group Name",
				field: "groupName",
				width: 250,
			}, {
				headerName: "Description",
				field: "groupDescription",
				width: 250,
			}, {
				headerName: "Created By",
				field: "createdBy",
				width: 250,
			}, {
				headerName: 'Created Date',
				field: "createdDate",
				width: 250,
			}, {
				headerName: "Status",
				field: "status",
				width: 200,

			},];
		var gridOptionUsersGroups = {
			columnDefs: columnDefs1,
			rowSelection: 'single',
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 120
			},
			suppressRowClickSelection: true,
			onSelectionChanged : onSelectionChangedUserGroup,
		};

		$(document).ready(function () {
			agGrid.simpleHttpRequest({
				url: 'manage-control-get-usergroup-listing'
			}).then(function (data) {
				var resp = JSON.parse(data.body[0]);
				var len = resp.userGroupList.length;
				gridOptionUsersGroups.api.setRowData(resp.userGroupList);
			});
		});

		function onSelectionChangedUserGroup() {
			var selectedNodes = gridOptionUsersGroups.api.getSelectedNodes();
			var selectedData = selectedNodes.map(node => node.data);
			var groupid = selectedData[0].groupId;
			var users = JSON.stringify(selectedData[0].users);
			console.log(users);
		}
	</script>
	<title>Nerp</title>
</head>
<!--Group Users Data-->
<div class="modal fade" id="userGroupModal">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<!-- Modal Header -->
			<div class="modal-header">
				<h4 class="modal-title">User Groups</h4>
				<button type="button" class="close" data-dismiss="modal" style="width: 24px;"
					onclick="closeUserGroupModal();">&times;</button>
			</div>

			<!-- Modal body -->
			<div class="modal-body">
				<div id="userGroupGrid" style="width: 100%; height: 300px;" class="ag-theme-alpine"></div>
			</div>

			<!-- Modal footer -->
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" onclick="pickUserGroup();">Select Group</button>
				<button type="button" class="btn btn-danger" data-dismiss="modal"
					onclick="closeUserGroupModal();">Cancel</button>
			</div>

		</div>
	</div>
</div>
</script>

</html>
