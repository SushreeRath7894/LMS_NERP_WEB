<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="userModal">

<head>
	<script>
		$(document).ready(function () {
			var gridDiv = document.querySelector('#userGrid');
			new agGrid.Grid(gridDiv, gridOptionUsers);
			var rowData = [];
			gridOptionUsers.api.setRowData(rowData);
		});
		var columnDefs = [
			{
				headerCheckboxSelection: false,
				headerCheckboxSelectionFilteredOnly: true,
				checkboxSelection: true,
				width: 10, 
				sortable: false,
				filter: false,
				resizable: true

			},
			{
				headerName: "Employee ID",
				field: "employeeId",
				width: 150,
			},{
				headerName: "Name",
				field: "empName",
				width: 250,
			}, {
				headerName: "Login Id",
				field: "employeeId",
				width: 200,
			}, {
				headerName: "Department",
				field: "department",
				width: 250,
			}, {
				headerName: 'Designation',
				field: "designation",
				width: 250,
			}];
		var gridOptionUsers = {
			columnDefs: columnDefs,
			rowSelection: 'multiple',
			onRowSelected: onRowSelected,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 120
			},
			suppressRowClickSelection: true,
		};

		$(document).ready(function () {
			agGrid.simpleHttpRequest({
				url: 'manage-control-get-user-listing'
			}).then(function (data) {
				var resp = JSON.parse(data.body[0]);
				var len = resp.EmployeeList.length;
				gridOptionUsers.api.setRowData(resp.EmployeeList);
			});
		});

	</script>
	<title>Nerp</title>
</head>
<!--Individuals Users Data Modal-->
<div class="modal fade" id="usersModal">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<!-- Modal Header -->
			<div class="modal-header">
				<h4 class="modal-title">User</h4>
				<button type="button" class="close" data-dismiss="modal" style="width: 24px;"
					onclick="closeUserModal();">&times;</button>
			</div>

			<!-- Modal body -->
			<div class="modal-body">
				<div id="userGrid" style="width: 100%; height: 300px;" class="ag-theme-alpine"></div>

			</div>

			<!-- Modal footer -->
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" onclick="pickUser();">Select User</button>
				<button type="button" class="btn btn-danger" data-dismiss="modal"
					onclick="closeUserModal();">Cancel</button>
			</div>

		</div>
	</div>
</div>
</script>

</html>
