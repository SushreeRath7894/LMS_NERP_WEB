	function changeDateFormat(inputDate) {
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}
	var date1 = (new Date()).toISOString().split('T')[0];
	var newDate = changeDateFormat(date1);
	$("#date").val(newDate);

//master save data
function masterSaveData() {
	gridOptions1.api.stopEditing();
	gridOptions2.api.stopEditing();
	$(".formValidation").remove();
	var valid= true;
	var datas = [];
	var item = {};
	
	
	item.completionId = $("#completionId").val();
	item.date = $("#date").val();
	item.dept = $("#dept").val();
	item.nonRoutineArea = $("#nonRoutineArea").val();
	item.type = $("#type").val();
	item.duration = $("#duration").val();
	item.description = $("#description").val();
	item.activityArea = $("#activityArea").val();
	item.time = $("#time").val();
	item.uploadBy = $("#assetemployee").val();
	
	
	
	
	if (item.date == null || item.date == "") {
		valid = validationUpdated("Date is Required", "date");
	 }
	if (item.time == null || item.time == "") {
		valid = validationUpdated("Time is Required", "time");
	 }
	if (item.dept == null || item.dept == "") {
		valid = validationUpdated("Department is Required", "dept");
	 }
	if (item.type == null || item.type == "") {
		valid = validationUpdated("Type of Nonroutine Activity is Required", "type");
	 }
	if (item.duration == null || item.duration == "") {
		valid = validationUpdated("Duration of Nonroutine Activity is Required", "duration");
	 }
	if (item.uploadBy == null || item.uploadBy == "") {
		valid = validationUpdated("Uploaded By is Required", "assetemployee");
	 }
	
	 var dataOfGrid1 = [];
	 gridOptions1.api.forEachNode(function(rowNode, index) {
		 if(rowNode.data.remark1==null || typeof rowNode.data.remark1 === 'undefined' || rowNode.data.remark1=='null'){
			 rowNode.data.remark1 ='';
			}
		 dataOfGrid1.push(rowNode.data);
		  });
	 var dataOfGrid2 = [];
	 gridOptions2.api.forEachNode(function(rowNode, index) {
		 if(rowNode.data.remark2==null || typeof rowNode.data.remark2 === 'undefined' || rowNode.data.remark2=='null'){
			 rowNode.data.remark2 ='';
			}
		 dataOfGrid2.push(rowNode.data);
		  });
	 item.grid1List = dataOfGrid1;
	 item.grid2List = dataOfGrid2;
	if (valid) {
		datas.push(item);
		console.log("111111111111",datas);
		savePlanDetails(datas);
		}
}

function savePlanDetails(datas) {
	$('.loader').show();
	$.ajax({
		type : "POST",
		url : "nonroutine-activity-add",
		dataType : "json",
		contentType : "application/json",
		data : JSON.stringify(datas),
		success : function(response) {
			$('.loader').hide();
			if (response.code == "success") {
				cancel()
				$("#messageParagraph").text(response.message);
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('.loader').hide();
				agGrid.simpleHttpRequest({
					url : 'nonroutine-activity-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.logbook;
					var len = allData.length;
					$('#totalAsset').find('span').html(len);
					gridOptions.api.setRowData(allData);
					onSelectionChanged()
				});
				
			} else {
				$('.loader').hide();
				$("#messageParagraph").text("Something Went Wrong");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				
			}
		},
		error : function(data) {
			$('.loader').hide();
		}
	})

}

// function for delete qc  
function deleteOnclick() {
	
		if (id) {
			$('.loader').show();
				$.ajax({
		type : "POST",
		url : "nonroutine-activity-delete?id="+ id,
		success : function(response) {
		 if (response.code == "success") {
			 cancel();
				$("#messageParagraph").text("Data Deleted Successfully");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('#delete').modal('hide');
				agGrid.simpleHttpRequest({
					url : 'nonroutine-activity-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.logbook;
					var len = allData.length;
					$('#totalAsset').find('span').html(len);
					gridOptions.api.setRowData(allData);
					onSelectionChanged()
				});
				$('.loader').hide();
			} else {
				$("#messageParagraph").text("Something went to wrong!");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('.loader').hide();
			}
		},
		error : function(data) {
		}
	})
		} else {
			$('.loader').hide();
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
		}

}

					<!-- delete modal start -->
					<div id="delete" class="modal fade show" aria-modal="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p>Do you really want to delete this Data? This process
										cannot be undone.</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">

									<button type="button" class="cancel-btn"
										data-bs-dismiss="modal" onclick="cancelModalBtnDlt();">Cancel</button>
									<button type="button" class="delete-btn"
										onclick="deleteOnclick()">Delete</button>
								</div>
							</div>
						</div>
					</div>


					<!-- approve modal start -->
					<div id="approveModal" class="modal fade show" aria-modal="true">
						<div class="modal-dialog modal-confirm">
							<div class="modal-content">
								<div class="modal-header flex-column"></div>
								<div class="modal-body">
									<p>Do you want to approve this Data? Once done you will
										not be able to make further changes.</p>
								</div>
								<div class="modal-footer justify-content-center"
									style="margin-top: 0px;">

									<button type="button" class="cancel-btn"
										data-bs-dismiss="modal" onclick="cancelModalBtnApr();">Cancel</button>
									<button type="button" class="new-btn"
										onclick="approveOnclick()">Approve</button>
								</div>
							</div>
						</div>
					</div>

					<!-- delete product modal start -->
					 <div class="modal fade" id="newModal" tabindex="-1" role="dialog"
					aria-labelledby="exampleModalCenterTitle" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
					<div class="modal-dialog modal-dialog-centered modal-xl" role="document">
						<div class="modal-content">
							<div class="modal-header">
								<div class="innerstickybg">
									<div class="row">
										<div class="col-md-6">
											Initiation/Completion Id: <span id="logbookbox"></span>
										</div>
									</div>
								</div>

							</div>
							<div class="modal-body">
							
								<div class="row">
									<input type="hidden" id="completionId">

									<div class="col-md-4">
										<div class="form-group calendar_box">
											<label>Date of Non-Routine Activity:</label> <input type="text"
												id="date" autocomplete="off" class="form-control"
												onblur="removeValid(event)"
												th:attr="onkeyup=|formatDate('fromDate','${session.DATEFORMAT_JS}')|"
												readonly> <i class="ti-calendar picker_calendar"
												id="fromDateCalendar"></i>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-group calendar_box">
											<label>Time of Non-Routine Activity:</label> <input type="text" id="time"
												class="form-control" onblur="removeValid(event)"
												th:attr="onkeyup=|formatDate('time','${session.DATEFORMAT_JS}')|"
												readonly> <i
												class="ti-calendar picker_calendar"
												id="toDateCalendarTime"></i>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-group">
											<label> Department </label>
											<div class="select">
												<select id="dept">
													<option value="">Select</option>
													<option th:each="c:${deptList}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
									<div class="col-md-4">
										<div class="form-group">
											<label>Area of Non-Routine Activity:</label> <input type="text"
												class="form-control " id="nonRoutineArea"
												onblur="removeValid(event)">
										</div>
									</div>
									<div class="col-md-4">
									<div class="form-group">
										<label>Type of Non-Routine Activity:</label> <input type="text"
											class="form-control " id="type"
											onblur="removeValid(event)">
									</div>
									</div>
									
									
									<div class="col-md-4">
									<div class="form-group">
										<label>Duration of Non routine Activity:</label> <input type="text"
											class="form-control " id="duration"
											onblur="removeValid(event)">
									</div>
									</div>
									<div class="col-md-12">
									<div class="form-group">
										<label>Description of the Work Performed (Non Routine Activity) :-</label> 
										<textarea type="text"
												class="form-control transparenttxtbox" id="description"
												onblur="removeValid(event)"></textarea>
									</div>
									</div>
									<div class="col-md-12">
									<div class="form-group">
										<label>Specify the area where the activity is conducted along with the equipment/Product/material stored.</label> 
										<textarea type="text"
												class="form-control transparenttxtbox" id="activityArea"
												onblur="removeValid(event)"></textarea>
									</div>
									</div>
									
									<div class="row mt-4">
									<div class="ag-theme-alpine" id="Grid1"
											style="width: 100%; height: 300px;"></div>
											</div>
									<div class="row mt-4">
									<div class="ag-theme-alpine" id="Grid2"
											style="width: 100%; height: 300px;"></div>
											</div>
											
											<div class="col-md-5" >
										<div class="form-group" id="emplist">
											<label> Uploaded By </label>
											<div class="select">
												<select id="assetemployee">
													<option value="">Select</option>
													<option th:each="c:${empLists}" th:value='${c.key}'
														th:text="${c.name}"></option>
												</select> <span class="focus"></span>
											</div>
										</div>
									</div>
											
									
								</div>
							</div>
							
							<div class="modal-footer">
								<button class="cancel-btn" id="cancelBtn" onclick="cancel()">Cancel</button>
											<button class="approve-btn" id="save"
												onclick="masterSaveData()">Save</button>
							</div>
						</div>
					</div>
				</div>
					
				</div>
			</div>
		</div>
	</div>
</body>
</html>
