				validation = validationUpdated("Agency Required", "agencyId");
			}

			}  
		} 
		else if($("#auditTypeId").val()=='2')//Internal Editor
		{
			data1.agencyId = $("#auditorName").val();
			data1.auditorName = $("#auditorName option:selected").text(); 
			if (data1.agencyId == null || data1.agencyId== "") {
				validation = validationUpdated("Auditor Name Required", "auditorName");
			}  
		} 
		data1.specialization = $("#specialization").val();
		data1.startDate = $("#startDate").val();
		data1.experience = $("#experience").val(); 
		data1.mobileno = $("#mobileno").val();
		data1.email = $("#email").val();
		data1.address = $("#address").val();
		data1.uploadedBillDiv = $("#imageName_0").html();

		 if (data1.auditTypeId == null || data1.auditTypeId== "") {
				validation = validationUpdated("Audit Type Required", "auditTypeId");
			} 
		 if (data1.specialization == null || data1.specialization== "") {
				validation = validationUpdated("Specialization Required", "specialization");
			} 
		 if (data1.experience == null || data1.experience== "") {
				validation = validationUpdated("Experience Required", "experience");
			}
		 if (data1.startDate == null || data1.startDate== "") {
				validation = validationUpdated("Start Date Required", "startDate");
			} 
		console.log('JSON.stringify(data1)',JSON.stringify(data1));
		
		mailVal(); 
		mobVal1();
		if (validation  && mailValid  && mobValid1) {
		$(".formValidation").remove();
		$.ajax({
				type : "POST",
				url : "inspection-master-savedata",
				dataType : "json",
				contentType : "application/json",
				data : JSON.stringify(data1),
				success : function(response) {
					if (response.message == "Success") {
						hideModal();
						console.log(response);  
						$("#messageParagraph").text(
						"Data saved successfully");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						
						viewData();
					}
				},

					console.log(response);
				}
			})
		}

	function showhideAgency(divId,divAuditorTextField,divAuditorDropDown, val) {//divagency
		console.log("value",val);
		if(val=='0'){//Default Select value Selected
			document.getElementById(divId).style.display = 'none'; 
			document.getElementById(divAuditorTextField).style.display = 'none'; 
			document.getElementById(divAuditorDropDown).style.display = 'none'; 
		}
		else if(val=='1'){//External Selected
			document.getElementById(divId).style.display = 'block'; 
			document.getElementById(divAuditorTextField).style.display = 'block'; 
			document.getElementById(divAuditorDropDown).style.display = 'none'; 
		}
		else if(val=='2'){//Internal Selected
			document.getElementById(divId).style.display = 'none'; 
			document.getElementById(divAuditorTextField).style.display = 'none'; 
			document.getElementById(divAuditorDropDown).style.display = 'block'; 
		}
	} 
	//Email validation
	var mailValid;

	function mailVal() {
	    var mail = $('#email').val();
	    var mid =  /^[_a-z0-9-]+(\.[_a-z0-9-]+)*@[a-z0-9-]+(\.[a-z0-9-]+)*(\.[a-z]{2,4})$/;
	    if (mail != '') { 
             if (mid.test(mail)) {
	             $("#error3").hide();
	             mailValid = true;
	             return true;
	         } else {
	             $("#error3").show();
	             $("#error3").html("Please enter a valid email id.");
	             mailValid = false;
	             return false;
	         }
	    } else {
	        $("#error3").html("Email Required");
	        mailValid = false;
	        return false;
	    }
	}
	 //Mobile Number validation
	var mobValid1;

	function mobVal1() {
	    var mob = $('#mobileno').val();
	    var phoneno = /^\d{10}$/;
	    if (mob != '') {
	        if (phoneno.test(mob)) {
	        	
	            $("#error9").hide();
	           
	            mobValid1 = true;
	            return true;
	        } else {
	        	
	            $("#error9").html(
	                "please enter  10 digit mobile number  ex:7089451278");
	        	 $("#error9").show();
	            mobValid1 = false;
	            return false;
	        }
	    } else {
	        $("#error9").html(" Mobile No. Required");
	        mobValid1 = false;
	        return false;
	    }
	}
	function checkNumeric(fieldId) {
	 var tempVal = $("#" + fieldId).val().replace(/[^0-9 ]/g, '');
	    const input = document.getElementById(fieldId);
	    const position = input.selectionStart;	
	    if(tempVal.slice(-1) == ' '){
	     	$("#" + fieldId).empty();
	     	tempVal = '';
	     } 
	   $("#" + fieldId).val(tempVal);
	}

	function deleteAuditCategoryModalOpen(deleteforselected){

			$("#deleteAuditMasterBtn").hide();

		else if(deleteforselected=='3') {

			$("#deleteAuditCategoryBtn").show();

	//editAuditorId
	function editInspectionId(id) { 	 		
		$.ajax({
			type : "GET",
			url : "inspection-master-edit?Id=" + id,
			success : function(response) {
				if (response.message == "Success") {
					openNav(); 
					console.log("edit" + response.body);
					$("#hid_auditorId").val(response.body.inspectionorId);
					$("#auditTypeId").val(response.body.auditTypeId);
					
					if(response.body.auditTypeId=='1'){//for external auditor
					    $("#divAuditorDropDown").hide();
						$("#divagency").show();
						$("#agencyId").val(response.body.agencyId);
						$("#divAuditorTextField").show();
						$("#agency_auditorName").val(response.body.auditorName);
					}else if(response.body.auditTypeId=='2'){//for internal auditor 
						$("#divAuditorDropDown").show();
						$("#auditorName").val(response.body.agencyId);
						$("#divagency").hide();
						$("#divAuditorTextField").hide();
					}
				    $("#specialization").val(response.body.specialization);
					$("#startDate").val(response.body.startDate);
					$("#experience").val(response.body.experience);
					$("#mobileno").val(response.body.mobileno);
					$("#email").val(response.body.email);
					$("#address").val(response.body.address);
					//$("#imageName_0").html(response.body.uploadedBillDiv);
					
					var fileName=response.body.uploadedBillDiv;
					if (fileName != null) {
						var ext = response.body.uploadedBillDiv.split(".");
						$("#imageName_0").html(fileName);
 
			           if (ext[1] == "jpg" || ext[1] == "png") {
							var LightImg = '<div class ="uploadicon position-l"><a class="example-image-link" target="_balnk"><i class="fa fa-picture-o" style="color: blue" onclick=openImage("'
								+ fileName + '")></i></a> </div>';
						}else if (ext[1] == "pdf") {
							var LightImg = '<div class ="uploadicon position-l"><a class="example-image-link" target="_balnk"><i class="fa fa-file-pdf-o" style="color: red" onclick=openImage("'
								+ fileName + '")></i></a> </div>';
						} else {
							var LightImg = "<div class='uploadicon position-l'> </div>";
						}  

						$("#uploadedBillDiv_0").html(LightImg);
					}
				}
			}, 
			error : function(data) {
				console.log(data) 
				$("#agencyId").val();
				$("#agency_auditorName").val();
				$("#auditorName").val();
				$("#specialization").val();
				$("#startDate").val();
				$("#experience").val();
				$("#mobileno").val();
				$("#email").val();
				$("#address").val();
				$("#imageName_0").val();
			}
		}); 
	}

									</div>
								</div>	
								<div class="col-lg-6"  id="divAuditorDropDown"  style="display: none;">
									<div class="form-group">
										<label>Inspection</label> 
										<div class="select"> 
											<select class="" id="auditorName">
											<option value="">Select</option>
											<option th:each="c,iter:${auditorList}" th:value="${c.key}"
															th:text="${c.name}"></option>
											</select>
										</div>
									</div>
								</div>								
								<div class="col-lg-6">
									<div class="form-group">
										<div class="autocomplete" style="width: 100%;">
											<label>Specialization</label> 
											<div class="select">
												<select class="" id="specialization" onblur="removeValid(event);" >
												<option value="">Select</option>
												<!--<option value="General">General</option>
												<option value="Project">Project</option>
												<option value="Engineering">Engineering</option> -->
												<option th:each="c,iter:${auditorSpecialisationList}" th:value="${c.key}"
															th:text="${c.name}"></option>
												</select>
											</div>
										</div>
										<div id="suggesstion-box1" class="sugg-cls"></div>
									</div>
								</div>
 								<div class="col-lg-6">
									<div class="form-group calendar_box">
										<label>Start Date</label>
											<input type="text"
										id="startDate" placeholder="Start Date" class="form-control"
										onblur="removeValid(event)" 
										th:attr="onkeyup=|formatDate('startDate','${session.DATEFORMAT_JS}')|" readonly>
										<i class="ti-calendar picker_calendar" id="startDateCalendar"></i>
									</div>
								</div>								
								<div class="col-lg-6">
									<div class="form-group calendar_box">
										<label> Experience(In No. of Years.)</label>  
										<input type="text" id="experience" class="form-control"  maxLength="2" onkeyup="checkNumeric('experience');">
									</div>
								</div>								
								<div class="col-lg-6">
									<div class="form-group">
										<label>Mobile No.</label>
										<input type="text" id="mobileno" class="form-control"  maxLength="10" onkeyup="mobVal1();checkNumeric('mobileno');"
											onblur="removeValid(event)" ><span id="error9" class="formValidation1"></span>
									</div>
								</div>								
								<div class="col-lg-6">
									<div class="form-group">
										<label>Email</label>
											<input type="text" id="email" class="form-control" onkeyup="mailVal();" ><span id="error3" class="formValidation1"></span>
									</div>
								</div>
									<div class="col-lg-6">
									<div class="form-group">
										<label>Address</label>
										<textarea class="adresscls" id="address" placeholder="Enter Address Details" onblur="removeValid(event)"></textarea>
									</div>
								</div>								
								<div class="col-lg-6">
									<div class="form-group">
										<label>Attachment</label>  
										<div class="controls">
											<label class="custom-file-upload" for="uploadDoc_0"
												id="attachment"><i class="ti-plus"></i> 
											</label>
											<input type="file" class="document" id="uploadDoc_0"
												accept=".jpeg, .jpg, .png, .pdf" name="userImage"
												onchange="saveMultiFileDoc(event)" />
										</div>
										<div id="uploadedBillDiv_0" align="center" class="uploadedBillCls" style="margin-top: 10px;"></div>
										<div id="imageName_0" class="imageName" style="margin-top: 10px;"></div>
									</div>
								</div> 
							</div>
						</div>
						<!-- Modal footer --> 
						<div class="modal-footer">
							<div align="right">
								<button class="cancel-btn" onclick="hideModal()">CANCEL</button>
								<button class="btn1" id="saveId" onclick="saveTableData()">SAVE</button>
							</div>
						</div>
					</div>
				</div>
			</div>
			<!-- End Open Modal on click to New Button-->
			
			<!-- Open AuditCategory Modal on click to New Button-->
			<div class="modal fade" id="myAuditCategoryModalSelected">
				<div class="modal-dialog modal-lg" style="margin-top: 130px;">
					<div class="modal-content">
						<!-- Modal body -->
						<div class="modal-body modal-category">
							<input type="hidden" id="hidaudit_category_id">
							<div class="row"> 
								<div class="col-lg-6">
									<div class="form-group ">
										<label> Inspect Type</label> 
										<div class="select">
											<select class="" id="auditor_type">
											<option value="">Select</option>
											<option value="2">Internal</option> 
											<option value="1">External</option> 
											</select>
										</div>
									</div>
								</div>  								
								<div class="col-lg-6">
									<div class="form-group">
										<label>Inspect Category Name</label>
										<input type="text" id="audit_category_name" placeholder="Inspect Category Name" class="form-control">
									</div>
								</div>
								
								<div class="col-lg-6">
									<div class="form-group">
										<label>Inspect Status</label> 
										<div class="select">
											<select class="" id="audit_category_status">
											<option value="">Select</option>
											<option value="0">Active</option>
											<option value="1">Inactive</option> 
											</select>
										</div>
									</div>
								</div>
							</div>  
						</div>
						<!-- Modal footer --> 
						<div class="modal-footer">
							<div align="right">
								<button class="cancel-btn" onclick="hideAuditCategoryModal()">CANCEL</button>
								<button class="btn1" id="saveId" onclick="saveAuditCategoryTableData()">SAVE</button>
							</div>
						</div>
					</div>
				</div>
			</div>
			<!-- End Open AuditCategory Modal on click to New Button-->
			
			<!-- delete modal start -->
			<div class="modal fade"  id="deleteAuditCategoryModal">
				<div class="modal-dialog modal-confirm" >
					<div class="modal-content">
						<div class="modal-header flex-column"> 
						</div>
						<div class="modal-body">
							<p>Do you really want to delete these records? This process cannot be undone.</p>
						</div>
						<div class="modal-footer justify-content-center">
							<button type="button" class="btn1" data-dismiss="modal" aria-hidden="true" onclick="closeAuditCategoryModal()">Cancel</button>
							<button type="button" class="btn3" id="deleteAuditMasterBtn" onclick="deleteAuditMasterRecord()">Delete</button>
							<button type="button" class="btn3" id="deleteAuditMasterExternalBtn" onclick="deleteAuditMasterExtRecord()">Delete</button>
							<button type="button" class="btn3" id="deleteAuditCategoryBtn"	onclick="deleteAuditCategoryRecord()">Delete</button>
						</div>
					</div>
				</div>
			</div> 
		    <!-- //for excel file upload -->
		</div>		
	</div>
</body>
</html>
