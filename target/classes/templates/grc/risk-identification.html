	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

<script>

	function validProductData() {
		var item = null;
		productOptions.api.forEachNode(function(rowNode, index) {
			item = item + rowNode.data;
		});
		if (item) {
			return true;
		} else {
			$("#messageParagraph").text("Please Add Item Details");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
			return false;
		}
	}
	function saveData() {
		 if (validFormData()) {
			var datas = [];
		
			setTimeout(function() {

				productOptions.api.forEachNode(function(rowNode, indrx) {

					var item = rowNode.data;
					item.projectId = $("#projectId").val();
					item.projectName = $("#projectId").find('option:selected').text();
					item.identificationApplyDate = $("#identificationApplyDate").val();
					item.identificationId = $("#identificationHeadId").html();
					item.desc = $("#desc").val();
					datas.push(item);

				});
				saveAllIdentification(datas);

			}, 1000)

		}
	}
	
	
	function saveAllIdentification(datas) {
		$('.loader').show();
		$("body").addClass("overlay");
						$.ajax({
							type : "POST",
							url : "risk-identification-add",
							contentType : "application/json",
							data : JSON.stringify(datas),
							success : function(response) {
						if (response.message == "Success") {
							$('.loader').hide();
							$("body").removeClass("overlay");
							$("#messageParagraph").text("Data Saved Successfully");
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
							gridOptions.api.setRowData();
							agGrid.simpleHttpRequest({
								url : "risk-identification-view-project-Details"
							}).then(function(data) {
								var jsonData = JSON.parse(data.body);
								var allData = jsonData.identificationDatails;
								var len = allData.length;
								$('#totalReq').find('span').html(len);
								gridOptions.api.setRowData(allData);
							}); 
							cancel();
						}

					},
					error : function(datas) {
						console.log(datas)
					}
				})

	}

	function validFormData() {
		var allValid = true;

		/* if (!validationUpdated("Desc Required",'desc'))
			allValid = false; */
		if (!validationUpdated("Project  Required",'projectId'))
			allValid = false;
		if (!validationUpdated("Apply Date Required",'identificationApplyDate'))
	        allValid = false;
		return allValid;
	}

	

	function downloadDetails() {
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {

		});
		gridOptions.api.exportDataAsCsv(dataset);
	}

											</div>
										</div>

										<div class="col-md-6">

												</div>

									</div>

										<div id="mySidenav" class="sidenav">

												</div>

												<div class="col-lg-6">
													<div class="form-group">
															<label>Category </label> <input type="text" id="category"

													</div>
												</div>
												<div class="col-lg-6">
													<div class="form-group">
														<label>Source</label> <input type="text" id="source"
															onblur="removeValid(event)" class="form-control">
													</div>
												</div>
												<div class="col-lg-6">
													<div class="form-group">
														<label>Remarks</label><input type="text" id="remark"

												</div>
												<div class="col-lg-6">
													<div class="form-group">
														<label>Identified By</label>

												</div>
								
											</div>
										</div>
									</div>
								</div>

																</div>
																<table id="graphTable" class="newtbl">
																</table>
															</div>

														</div>
													</div>
												</div>
											</div>
										</div>

									</div>

								</div>
							</div>

										<button type="button" class="cancel-btn" data-dismiss="modal"

										<button type="button" class="btn3" onclick="deleteOnclick()">Delete</button>
									</div>
								</div>
							</div>
						</div>

					
						<div id="approvePQtn" class="modal fade show" aria-modal="true">
							<div class="modal-dialog modal-confirm">
								<div class="modal-content">
									<div class="modal-header flex-column"></div>
									<div class="modal-body">
										<p>Do you want to approve identification</p>
									</div>
