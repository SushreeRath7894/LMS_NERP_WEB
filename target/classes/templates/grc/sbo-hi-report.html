// Number cell editor with validation that restricts negative values and limits input to two digits
function NumericCellEditor() {}

NumericCellEditor.prototype.init = function (params) {
    this.eInput = document.createElement('input');
    this.eInput.type = 'number';
    this.eInput.min = '0';
    this.eInput.value = params.value || '';
    this.eInput.classList.add('custom-numeric-cell'); // Optional: To match ag-grid styling

    // Restrict input to non-negative numbers with up to two digits
    this.eInput.addEventListener('keypress', function (event) {
        // Prevent input if the character is not a digit or a decimal point
        if (!/[0-9]/.test(event.key)) {
            event.preventDefault();
        }

        // Prevent entering more than two digits
        if (this.value.length >= 2) {
            event.preventDefault();
        }
    });

    // Additional validation on paste: Prevent negative values or values with more than two digits
    this.eInput.addEventListener('input', function () {
        // If a negative number or a number with more than two digits is pasted, correct it
        if (this.value < 0 || this.value.length > 2) {
            this.value = this.value.slice(0, 2); // Limit to two digits
        }
    });
};

NumericCellEditor.prototype.getGui = function () {
    return this.eInput;
};

NumericCellEditor.prototype.afterGuiAttached = function () {
    this.eInput.focus();
    this.eInput.select();
};

NumericCellEditor.prototype.getValue = function () {
    // Return the numeric value ensuring it is non-negative and up to two digits
    return this.eInput.value ? Math.max(0, parseInt(this.eInput.value, 10)) : null;
};

NumericCellEditor.prototype.destroy = function () {
    // Cleanup logic if needed
};

NumericCellEditor.prototype.isPopup = function () {
    return false;
};



function getCurrentDateMonthYear() {
    var curDate = new Date();
    var selectedYear = $("#attndyear").val();
    var selectedMonth = $("#attndmonth").val();
    var startDay = $("#startDayForAtten").val();
    
    if (!selectedYear) {
        selectedYear = curDate.getFullYear();
    }
    selectedYear = selectedYear.split("-")[0];

    var fromDate, toDate;

    if (selectedMonth === "0") {
        fromDate = "01-04-" + selectedYear;
        toDate = "31-03-" + (parseInt(selectedYear) + 1);
    } else {
        var month = parseInt(selectedMonth);
        if (startDay > 1 && curDate.getDate() > startDay) {
            month = curDate.getMonth() + 1;
        }
        fromDate = startDay + "-" + String(month).padStart(2, '0') + "-" + selectedYear;
        toDate = startDay + "-" + String(month + 1).padStart(2, '0') + "-" + selectedYear;
    }
    $("#fromDate").val(fromDate);
    $("#fromDateCalendar").val(fromDate);
    $("#endDate").val(toDate);
    $("#endDateCalendar").val(toDate);
}

function generateYearMonths(selectedYear, selectedMonth) {
    var calendarYearMonths = [];
    let startMonthIndex, endMonthIndex;

    // If "All" is selected
    if (selectedMonth === 0) {
    	if (selectedYear === new Date().getFullYear()) {
            // If it's the current financial year, display months up to the current month
            startMonthIndex = 1; // April
            endMonthIndex = new Date().getMonth() + 1; // Update end month to current month
        }else {

            startMonthIndex = 1; // January
            endMonthIndex = 12;
        } // December
    } else {
        // If a specific month is selected, only display that month
        startMonthIndex = selectedMonth;
        endMonthIndex = selectedMonth;
    }

    // Generate months from start to end index
    for (let i = startMonthIndex; i <= endMonthIndex; i++) {
        calendarYearMonths.push({
            name: monthNames[i - 1],
            days: new Date(selectedYear, i, 0).getDate(),
            monthIndex: i
        });
    }

    return calendarYearMonths;
}


function formatDate(date) {
    // Format date as DD-MM-YYYY
    var day = date.getDate();
    var month = date.getMonth() + 1; // Months are zero-indexed
    var year = date.getFullYear();

    return (day < 10 ? '0' : '') + day + '-' + (month < 10 ? '0' : '') + month + '-' + year;
}

function getFinancialYear(selectedYear) {
    // Calculate financial year based on the selected year
    var startYear = selectedYear;
    var endYear = startYear + 1;
    var financialYear = startYear + "-" + endYear;
    return { startYear: startYear, endYear: endYear, financialYear: financialYear };
}

	//master save data
	function submitProgress() {
		activityOptions.api.stopEditing();
		$(".formValidation").remove();
		var valid= true;
		var datas = [];
		var rowCount = activityOptions.api.getDisplayedRowCount();
		if(rowCount > 0){
		activityOptions.api.forEachNode(function(rowNode, index) {
			var item = rowNode.data;
			item.reportId=$('#reportId').val();
			item.year=$('#sboYear').val();
			item.month=$('#sboMonth').val();
			
			if (item.year == null || item.year == "") {
				valid = validationUpdated("Year is Required", "sboYear");
			 }
			if (item.month == null || item.month == "") {
				valid = validationUpdated("Month is Required", "sboMonth");
			 }
			
			if(item.sbo==null || typeof item.sbo === 'undefined'){
				item.sbo ='';
			}
			if(item.hi==null || typeof item.hi === 'undefined'){
				item.hi ='';
			}
	        if(valid){;
	        	datas.push(item);
	         }
		});
		if (valid) {
			console.log("SAVE DATA::::",datas);
			savePlanDetailsForProgress(datas);
			
			}
		} else {
			$("#messageParagraph").text(
			"Please Add Atleast One Plan Details");
			$("#msgOkModal").removeClass("btn3");
			$("#msgOkModal").addClass("btn1");
			$("#msgModal").modal('show');
		}
	}
	function savePlanDetailsForProgress(datas) {
		$('.loader').show();
		$.ajax({
			type : "POST",
			url : "sbo-hi-report-monthly-add",
			dataType : "json",
			contentType : "application/json",
			data : JSON.stringify(datas),
			success : function(response) {
				$('.loader').hide();
				console.log("response::::",response);
				if (response.code == "success") {
					cancelModalBtn();
					$("#messageParagraph").text(response.message);
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					ShowGridforMonthly();
					
				} else {
					$('.loader').hide();
					$("#messageParagraph").text("Duplicate Data Found");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					
					$("#itemid").val('');
					$("#itemname").val('');
					$("#description").val('');
				}
			},
			error : function(data) {
				$('.loader').hide();
			}
		})

	}
	
	function editMonthlyReport(id){
		$("#myModalForMonthly").modal('show');
		activityOptions.api.setRowData("");
		agGrid.simpleHttpRequest(
				{
					url : 'sbo-hi-report-monthly-edit?id='+ id
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.sbo;
					console.log(jsonData)
					if(allData!=null){
						activityOptions.api.setRowData(allData);
						$('#sboYear').val(allData[0].year);
						$('#sboMonth').val(allData[0].month);
						$('#reportId').val(allData[0].reportId);
						$("#sboIdBox").html('SBO/HI :'+allData[0].reportId);
					}else{
						$('#sboYear').val("");
						$('#sboMonth').val("");
					}

					$('#loaderOverlay').fadeOut();
				      $('#modalBody').css('pointer-events', 'auto');
				});
	}
	
	function showAnalysis(id){
		var categories = [];
        var hiData = [];
        var sboData = [];
        var titletext="HI and SBO Trend Analysis";
		agGrid.simpleHttpRequest(
				{
					url : 'sbo-hi-report-monthly-edit?id='+ id
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var data=jsonData.sbo;
					console.log(jsonData)
					if(data!=null){
						titletext=titletext+" For "+data[0].monthName+" "+data[0].year;
						 $.each(data, function(index, item) {
				             categories.push(item.empName);  // Employee names as categories
				             hiData.push(parseInt(item.hi)); // HI values
				             sboData.push(parseInt(item.sbo)); // SBO values
				         }); 
						 
						 Highcharts.chart('container', {
				             chart: {
				                 type: 'column'
				             },
				             title: {
				                 text: titletext
				             },
				             xAxis: {
				                 categories: categories,
				                 labels: {
				                     rotation: -45
				                 },
				                 title: {
				                     text: 'Employee Names'
				                 }
				             },
				             yAxis: {
				                 min: 0,
				                 title: {
				                     text: 'Values'
				                 }
				             },
				             tooltip: {
				                 shared: true,
				                 headerFormat: '<span style="font-size:10px">{point.key}</span><table>',
				                 pointFormat: '<tr><td style="color:{series.color};padding:0">{series.name}: </td>' +
				                              '<td style="padding:0"><b>{point.y}</b></td></tr>',
				                 footerFormat: '</table>',
				                 useHTML: true
				             },
				             plotOptions: {
				                 column: {
				                     pointPadding: 0.2,
				                     borderWidth: 0,
				                     dataLabels: {
				                         enabled: true,
				                         style: {
				                             fontWeight: 'bold',
				                             color: 'black'
				                         }
				                     }
				                 }
				             },
				             series: [{
				                 name: 'HI',
				                 data: hiData,
				                 color: '#1f77b4' // Blue color for HI
				             }, {
				                 name: 'SBO',
				                 data: sboData,
				                 color: '#ff7f0e' // Orange color for SBO
				             }]
				         });
					}else{
						
					}
				});
		
		 

         
		$("#sboAnalysisModal").modal('show');
	}
