	function changeDateFormat(inputDate) {
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

function saveFile(event, uploadIndex, params) {
    var fileInput = event.target;
    var uFile = fileInput.files[0];
    var fileName = fileInput.value;

    var lastIndex = fileName.lastIndexOf("\\");
    if (lastIndex >= 0) {
        fileName = fileName.substring(lastIndex + 1);
    }

    var reader = new FileReader();
    reader.onload = function(e) {
        var base64Data = e.target.result;

        var iURL = URL.createObjectURL(uFile);
        $('#uploadedAuditDoc_' + uploadIndex).html('<img src="' + iURL + '" width="100">');
        $('#auditImageName_' + uploadIndex).text(fileName);

        var rowData = params.data;
    	console.log("PARAM",params);
        var item = {};

        Object.keys(rowData).forEach(function(key) {
            item[key] = rowData[key];
        });
       /*  var checkbox = document.getElementById("status"+params.rowIndex);
        if (checkbox.checked) {
        	item.status =1;
        }else{
        	item.status =0;
        }  */
        console.log("params.result>>>>", params.data.result);
        //item.result = $('#resultDropdown' + params.rowIndex).val();
        item.result = params.data.result;
        item['base64Image'] = base64Data;
        item['fileName'] = fileName;
        item['tempURL'] = iURL;
        
        

        updateGridRow(params.data.slno, item);
    };

    reader.readAsDataURL(uFile);

    function updateGridRow(field, updatedItem) {
        activityOptions.api.forEachNode(function(rowNode) {
            if (rowNode.data.slno === updatedItem.slno) {
                rowNode.setData(updatedItem);
                activityOptions.api.refreshCells({ rowNodes: [rowNode], force: true });
                return;
            }
        });
    }
}

	function viewScheduledAuditDetails(scheduledId, auditInstId) {
	    $.ajax({
	        type: "GET",
	        async: false,
	        url: `inspection-record-progressDetails?scheduledId=${scheduledId}&auditInstId=${auditInstId}`,
	        success: function(response) {
	            console.log(response);
	                $('#scheduledDetailsModal').modal('show');
	                var data = JSON.parse(response.body);
	                var allData = data.scheduledDetails	;
	                console.log("alldata-->", allData)
	                if (allData[0].taskType == "Non Quantitative") {
					    toggleColumnVisibility('taskUom', false);
				        toggleColumnVisibility('minRange', false);
				        toggleColumnVisibility('maxRange', false);
					} else {
					    toggleColumnVisibility('maxRange', true);
				        toggleColumnVisibility('minRange', true);
				        toggleColumnVisibility('taskUom', true);
					}
	                if(allData[0].instanceAdminSts=="PENDING"){
	                	$('#SubmitBtn').show();
	                }else{
	                	$('#SubmitBtn').hide();
	                }
	                activityOptions.api.setRowData(allData);
	            	

	        },
	        error: function(e) {
	            console.error("An error occurred:", e);
	        }
	    });
	}

 function getUploadedFileData(uploadIndex) {
	    var uploadedImageElement = $(`#uploadedAuditDoc_${uploadIndex}`);
	    if (uploadedImageElement.length > 0) {
	        var imgSrc = uploadedImageElement.find('img').attr('src');
	        if (imgSrc && imgSrc.startsWith('data:image')) {
	            var base64Data = imgSrc.split(',')[1];  
	            return base64Data;
	        }
	    }
	    return null;
	}
