<script type="text/javascript">

	$(document).ready(function() {
		$('#reqSchdlBtn').attr('disabled', true);
		$('#unSchdlBtn').attr('disabled', true);
		
		var dateFormat = localStorage.getItem("dateFormat");
		var today = new Date();
		   $("#DateCalendarAssign").datetimepicker({
			format : dateFormat,
			closeOnDateSelect : true,
			minDate:today,
			timepicker : false,
		  }).on("change", function() {
			$('#asdate').val($(this).val());
		  })

		$('#asdate').blur(function() {
			$("#DateCalendarAssign").val($(this).val());
		})
		
		  let auditType = ""; 
          $('#scheduleButton').click(function() {
               
              schedulePlan();
          });
		var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);

		var gridDiv = document.querySelector('#activity');
		new agGrid.Grid(gridDiv, activityOptions);
		$('.loader').show();
		gridOptions.api.setRowData(""); 
		agGrid.simpleHttpRequest({
		    url: 'inspection-schedule-view'
		}).then(function(data) {
		    var jsonData = JSON.parse(data.body);  
		    var allData = jsonData.auditPlan;  
		    var len = allData.length;  
		    $('#totalPlan').find('span').html(len);  
		    gridOptions.api.setRowData(allData);  
		});
		$('.loader').hide();
		activityOptions.api.setRowData();
		 
		  
 	$('.collapse').on('show.bs.collapse', function() {
			$(this).siblings('.panel-heading').addClass('active');
		});

		$('.collapse').on('hide.bs.collapse', function() {
			$(this).siblings('.panel-heading').removeClass('active');
		});
		$("#newBtn").click(function() {

		})
		
		  $('input[name="options"]').on('change', function() {
			    var selectedValue = $('input[name="options"]:checked').val();
			    if(selectedValue=="Employee"){
			    	$("#emplist").show();
			    	$("#loclist").hide();
			    	$("#assetlocation").val("");
			    	$("#assigndate").show();
			    }else if(selectedValue=="Location"){
			    	$("#emplist").hide();
			    	$("#loclist").show();
			    	$("#assetemployee").val("");
			    	s$("#assigndate").show();
			    }
			  });

  
	});
	
	
	
	/* -------------------search bar for mygrid----------------------- */

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		var totalRowCount = gridOptions.api.getModel().getRowCount();
		$('#totalPlan').find('span').html(totalRowCount);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}
	}
	var columnDefs = [
	    {
	        headerCheckboxSelection: false,
	        headerCheckboxSelectionFilteredOnly: false,
	        checkboxSelection: true,
	        width: 10,
	        sortable: false,
	        filter: false,
	        resizable: true,
	        pinned: 'left'
	    },
	    {
	        headerName: 'Plan ID',
	        field: "planId",
	        pinned: 'left',
	        width: 120,  
	    },
	    {
	        headerName: 'Inspection Category',
	        field: "auditCategory",
	        pinned: 'left'
	    },
	    {
	        headerName: 'Plan Type',
	        field: 'auditType',
	        width: 140, 
	        cellStyle: {
	            textAlign: 'center'
	        },
	        valueFormatter: function(params) {
	            const auditTypes = {
	                "2": "Internal",
	                "1": "External"
	            };
	            return auditTypes[params.value] || params.value;
	        }
	    },
	    {
	        headerName: 'Plan Location',
	        field: "auditLocation",
	        width:200
	    },
	    {
	        headerName: 'Frequency',
	        field: "frequency",
	        width: 150,
	        cellStyle: {
	            textAlign: 'center'
	        },
	    },
	    {
	        headerName: 'Status',
	        field: "scheduleStatus",
	        width: 130,
	        cellStyle: {
	            textAlign: 'center'
	        },
	        cellRenderer: function(params) {
	            var status = params.value === 1 ? 'Scheduled' : 'Unscheduled';
	            var style = params.value === 1 
	                ? 'color: #0642f5; padding: 5px; text-align: center;  #000000; font-size: 14px;' 
	                : 'color: #a9a9a9; padding: 5px; text-align: center;  0px 0px 0px #000000; font-size: 14px;';
	            return '<span style="' + style + '">' + status + '</span>';
	        }
	    },
	    {
	        headerName: 'Assign To',
	        field: "assignTo",
	        width: 170 
	    }, 
	    {
	        headerName: 'Assign Date',
	        field: "assignDate",
	        width: 150,
	        cellStyle: {
	            textAlign: 'center'
	        },
	    }, 
	    {
	        headerName: 'Remark',
	        field: "remark",
	        hide: true,
	        width: 150  
	    },
	    {
	        headerName: 'Start Date',
	        field: "startDate",
	        width: 150 ,
	        hide: true,
	        cellStyle: {
	            textAlign: 'center'
	        },
	    },
	    {
	        headerName: 'End Date',
	        field: "endDate",
	        width: 150,
	        hide: true,
	        cellStyle: {
	            textAlign: 'center'
	        },
	    }
	];

var gridOptions = {
	columnDefs : columnDefs,
	rowSelection : 'single',
	groupSelectsChildren : true,
	suppressRowClickSelection : true,
	suppressAggFuncInHeader : true,
	defaultColDef : {
		sortable : true,
		filter : true,
		resizable : true,
		width : 240
	},
	onSelectionChanged : onSelectionChanged,
};
//function for row select parents
var id = "";
var apstatus = "";
var auditType= "";
var auditCategory="";
var auditLocation="";
var auditFrequency="";
var auditSchedule="";

function onSelectionChanged() {
	var selectedNodes = gridOptions.api.getSelectedNodes();
	 var selectedData = selectedNodes.map(node => node.data);
	 id= selectedData.map(node => node.planId);
	 auditType=selectedData.map(node => node.auditType);
	 apstatus=selectedData.map(node => node.approvests);
	 auditCategory=selectedData.map(node => node.auditCategory);
	 auditLocation=selectedData.map(node => node.auditLocation);
	 auditFrequency=selectedData.map(node => node.frequency);
	 auditSchedule=selectedData.map(node => node.scheduleStatus);
	 
	var selectedRows = gridOptions.api.getSelectedRows();
	var rowCount = 0;
	selectedRows.forEach(function(i) {
		rowCount = rowCount + 1;
	});

	if (rowCount > 0) {
	    if (auditSchedule == "1") {
	        $('#reqSchdlBtn').prop("disabled", true);
	        $('#unSchdlBtn').prop("disabled", false);
	    } else {
	        $('#reqSchdlBtn').prop("disabled", false);
	        $('#unSchdlBtn').prop("disabled", true);
	    }
	} else {
	    $('#reqSchdlBtn').prop("disabled", true);
	    $('#unSchdlBtn').prop("disabled", true);
	}

}
// for activity table
 
 
var activityOptions = {
	columnDefs : activityDefs,
	rowSelection : 'single',
	groupSelectsChildren : true,
	suppressRowClickSelection : true,
	suppressAggFuncInHeader : true,
	defaultColDef : {
		sortable : true,
		filter : true,
		resizable : true,
		width : 240
	},
	onSelectionChanged : onSelectionChangeChild,

};
 
function deleteOnclick() {
	
		if (id) {
			$('.loader').show();
				$.ajax({
		type : "POST",
		url : "audit-plan-delete?id="+ id,
		success : function(response) {
		 if (response.code == "success") {
			 cancel();
				$("#messageParagraph").text("Plan deleted Successfully");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('#delete').modal('hide');
				agGrid.simpleHttpRequest({
					url : 'inspection-schedule-view'
				}).then(function(data) {
					var jsonData = JSON.parse(data.body);
					var allData=jsonData.auditPlan;
					var len = allData.length;
					$('#totalPlan').find('span').html(len);
					gridOptions.api.setRowData(allData);
					onSelectionChanged()
				});
				$('.loader').hide();
			} else {
				$("#messageParagraph").text("Something went to wrong!");
				$("#msgOkModal").removeClass("btn3");
				$("#msgOkModal").addClass("btn1");
				$("#msgModal").modal('show');
				$('.loader').hide();
			}
		},
		error : function(data) {
		}
	})
		} else {
			$('.loader').hide();
			$("#alert").modal('show');
			document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
		}

}

 

	// delete selected record from child ag grid
	function deleteDetailsOnclick() {
		$('.modal').hide();
		var selectedRows = activityOptions.api.getSelectedRows();
		activityOptions.api.applyTransaction({
			remove : selectedRows
		});
		cancelModalProductBtn();
	}
	 

	 
	
 
 
 

 
 
  
	
	function schedulePlan() {
		
		$("#agencyAuditorName").val("");
		$("#agencyId").val("");
		$("#auditorName").val("");
		$("#asdate").val("");
        var auditTypeStr = Array.isArray(auditType) ? auditType[0] : auditType;
        $('#assignmodal').modal('show');
        $('#divAuditorDropDown').show();
        $(".formValidation").remove();

    }
	
	function closeOnclick(){
		 $('#assignmodal').modal('hide');
	}
 
	
	function assignOnclick() {
	    var valid = true;
	    var auditTypeStr = Array.isArray(auditType) ? auditType[0] : auditType;
	    var auditCategoryStr = Array.isArray(auditCategory) ? auditCategory[0] : auditCategory;
	    var auditLocationStr = Array.isArray(auditLocation) ? auditLocation[0] : auditLocation;
	    var auditFrequencyStr = Array.isArray(auditFrequency) ? auditFrequency[0] : auditFrequency;
	    var auditPlanStr = Array.isArray(id) ? id[0] : id;
	    var item = {};
	    var item = {};

	        item.auditScheduleId = $("#planid").val();
	        item.auditorId = $("#auditorName").val();
	        item.agencyAuditorName = $("#auditorName option:selected").text();
	        item.assigndate = $("#asdate").val();

	        if (item.assigndate == null || item.assigndate == "") {
	            valid = validationUpdated("Date is Required", "asdate");
	        }
	        if (item.auditorId == null || item.auditorId == "") {
	            valid = validationUpdated("Name is Required", "auditorName");
	        }

	    item.auditType = auditTypeStr;
	    item.auditCategory = auditCategoryStr;
	    item.auditLocation = auditLocationStr;
	    item.auditFrequency = auditFrequencyStr;
	    item.planId = auditPlanStr;

	    

	    if (valid) {
	        $.ajax({
	            type: "POST",
	            url: "inspection-schedule-add",
	            data: JSON.stringify(item),
	            contentType: "application/json",
	            success: function(response) {
	                if (response.code == "success") {
	                    $('#assignmodal').modal('hide');
	    				$("#messageParagraph").text("Inspection Plan Successfully Scheduled");
	    				$("#msgOkModal").removeClass("btn3");
	    				$("#msgOkModal").addClass("btn1");
	    				$("#msgModal").modal('show');
	    				$('#approveModal').modal('hide');
	                    var type = "approved";  
	            		agGrid.simpleHttpRequest({
	            		    url: 'inspection-schedule-view'
	            		}).then(function(data) {
	            		    var jsonData = JSON.parse(data.body);  
	            		    var allData = jsonData.auditPlan;  
	            		    var len = allData.length;  
	            		    $('#totalPlan').find('span').html(len);  
	            		    gridOptions.api.setRowData(allData);  
	            		    $("#reqSchdlBtn").attr('disabled', true);
	            		});
	            		
	            		 $(".formValidation").remove();
	                } else {
	                    $("#messageParagraph").text("Something went to wrong!");
	                    $("#msgOkModal").removeClass("btn3");
	                    $("#msgOkModal").addClass("btn1");
	                    $("#msgModal").modal('show');
	                }
	            },
	            error: function(data) {
	                 
	            }
	        });
	    }
	}

	function unSchedule() {
		$('#approveModal').modal('show');
	}
	
 
		function unScheduleOnclick() {
			if (id) {
				$('.loader').show();
					$.ajax({
			type : "POST",
			url : "inspection-schedule-unschedule?id="+ id[0],
			success : function(response) {

			 if (response.code == "success") {
				 $('.loader').hide();
					$("#messageParagraph").text("Plan Unscheduled Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
					$('#approveModal').modal('hide');
					 var type = "approved";  
	            		agGrid.simpleHttpRequest({
	            		    url: 'inspection-schedule-view' 
	            		}).then(function(data) {
	            		    var jsonData = JSON.parse(data.body);  
	            		    var allData = jsonData.auditPlan;  
	            		    var len = allData.length;  
	            		    $('#totalPlan').find('span').html(len);  
	            		    gridOptions.api.setRowData(allData);  
	            		});
					
					$("#unSchdlBtn").attr('disabled',true);
				} else {
					$('.loader').hide();
					$("#messageParagraph").text("Something went to wrong!");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');
				}
			},
			error : function(data) {

			}
		})
			} else {
				$('.loader').hide();
				$("#alert").modal('show');
				document.getElementById("textId").innerHTML = "Please Select Atleast one Record !";
			}

	}
		
		function goToScheduledAudit() {
			sessionStorage.setItem('activity', 'ACT0419');
			window.location.href = "/grc/inspection-record";
			
		} 
	
</script>

</head>

        <div class="modal-dialog modal-dialog-centered" role="document">

                <div class="modal-body">

                     <div class="col-lg-6"  id="divAuditorTextField"  style="display: none;">

        </div>
    </div>

					<!-- Unschedule modal start -->
					<div id="approveModal" class="modal fade show" aria-modal="true">

							<div class="modal-content">
								<div class="modal-header flex-column"></div>
