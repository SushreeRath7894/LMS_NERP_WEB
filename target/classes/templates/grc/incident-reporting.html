<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
   xmlns:th="http://www.thymeleaf.org"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout/master}">
   <head>
      <title>Welcome</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style></style>
      <script type="text/javascript">
         $(document).ready(function() {
        	 
        	 $('#delete').attr('disabled', true);
         
         var gridDiv = document.querySelector('#myGrid');
         new agGrid.Grid(gridDiv, gridOptions);
     
         
         // View
 		
 		agGrid.simpleHttpRequest({
 			url : "incident-reporting-view"
 		}).then(function(data) {
 			var len = data.length;
 			$('#totalReq').find('span').html(len);
 			gridOptions.api.setRowData(data);
 		});
         
         });
         
         
         //  Ag Grid 
         
         var columnDefs = [ {
        	 headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : true,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true
			},
			{
         	headerName : "Incident No.",
         	field : "incidentNo",
         	width : 150,
         	cellRenderer : function(params) {
				return '<a id="" onclick=editId("' + params.data.incidentNo
						+ '") href="javascript:void(0)">'
						+ params.data.incidentNo + '</a>';
			}
         
         }, {
         	headerName : "Date",
         	field : "date",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Type",
         	field : "type",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Description",
         	field : "description",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Reported By",
         	field : "reportedBy",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Project Id",
         	field : "projectId",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Severity",
         	field : "severity",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Action Taken",
         	field : "actionTaken",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Location",
         	field : "location",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Latitude",
         	field : "latitude",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         }, {
         	headerName : "Longitude",
         	field : "longitude",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         },  {
         	headerName : "Status",
         	field : "status",
         	cellStyle : {
         		textAlign : 'left'
         	},
         
         } ];
         
         var gridOptions = {
         	columnDefs : columnDefs,
         	defaultColDef : {
         		sortable : true,
         		filter : true,
         		resizable : true,
         		width : 260,
         		height : 10
         	},
         	//rowSelection : 'multiple',
         	rowSelection : 'single',
         	suppressRowClickSelection : true,
         	onSelectionChanged : deleteModal,
         };
         function deleteModal(){
        	 $('#delete').attr('disabled', false);

         }
         
         // Function for ag grid    
         function openNav() {
         	$("#date").val('');
         	$("#type").val('');
         	$("#description").val('');
         	$("#reportedBy").val('');
         	$("#projectId").val('');
         	$("#severity").val('');
			$("#actionTaken").val('');
         	$("#location").val('');
         	$("#latitude").val('');
         	$("#longitude").val('');
         	$("#status").val('');
         
         	document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto; top:20px;";
         
         	document.getElementById("main_content").style.width = "75%";
         	$("#delete").hide();
         	$("#add").hide();
         }
         
         function closeNav() {
         	document.getElementById("mySidenav").style.width = "0";
         	document.getElementById("main_content").style.width = "100%";
         	$("#date").val('');
         	$("#type").val('');
         	$("#description").val('');
         	$("#reportedBy").val('');
         	$("#projectId").val('');
         	$("#severity").val('');
			$("#actionTaken").val('');
         	$("#location").val('');
         	$("#latitude").val('');
         	$("#longitude").val('');
         	$("#status").val('');
         	
         	$("#delete").show();
         	$("#add").show();
         }
         
         
          
         
         // save
         function saveNav() {
         	var obj = {};
         	obj.incidentNo = $("#incidentNo").val();
         obj.date = $("#date").val();
         obj.type = $("#type").val();
         obj.description = $("#description").val();
         obj.reportedBy = $("#reportedBy").val();
         obj.projectId = $("#projectId").val();
         obj.severity = $("#severity").val();
         obj.actionTaken = $("#actionTaken").val();
         obj.location = $("#location").val();
         obj.latitude = $("#latitude").val();
         obj.longitude= $("#longitude").val();
         obj.status = $("#status").val();
         	
         
         	console.log(obj);
         	
         	var validation = true;
         	 
         /* if (obj.incidentType == null || obj.incidentType == "") {
         validation = validationUpdated("Incident Type Required", "incidentType");
         }
         if (obj.incidentDesc == null || obj.incidentDesc == "") {
         validation = validationUpdated("Incident Description Required", "incidentDesc");
         }
         if (obj.status == null || obj.status == "") {
         validation = validationUpdated("Status Required", "status");
         }   */
          
         if (validation) {
 			$.ajax({
 				type : "POST",
 				url : "incident-reporting-add",
 				contentType : "application/json",
 				data : JSON.stringify(obj),
 				success : function(response) {
 					if (response.message == "success") {

  						$("#messageParagraph").text("Data Saved Successfully");
 						$("#msgOkModal").removeClass("btn3");
 						$("#msgOkModal").addClass("btn1");
 						$("#msgModal").modal('show');
 						$("#activityone").show();
 						$("#add").show();
 						$("#myGrid").show();
 						$("#cancel").hide();
 						$("#save").hide();
 						$("#form").hide();
 						$("#new").hide();

 						agGrid.simpleHttpRequest({
 							url : "incident-reporting-view"
 						}).then(function(data) {
 							gridOptions.api.setRowData(data);
 						});

 						closeNav();
  
 					}
 				},
 			
 				error : function(data) {
 				}
 			})
 		}
                 
     }
         
         // edit
         
     	function editId(id) {

     		console.log("idddddddddd = " +id);
			$("#add").hide();
			//$("#myGrid").show();
			$("#delete").hide();
			$("#add").hide();
			//$("#download").hide();

			$.ajax({
				type : "GET",
				url : "incident-reporting-edit?Id=" + id,
				success : function(response) {
					if (response.message == "Success") {
						openNav();
						console.log("edit" + response.body);
						$("#incidentNo").val(response.body.incidentNo);
						$("#date").val(response.body.date);
						$("#type").val(response.body.type);
						$("#description").val(response.body.description);
						$("#reportedBy").val(response.body.reportedBy);
						$("#projectId").val(response.body.projectId);
						$("#severity").val(response.body.severity);
						$("#actionTaken").val(response.body.actionTaken);
						$("#location").val(response.body.location);
						$("#latitude").val(response.body.latitude);
						$("#longitude").val(response.body.longitude);
						$("#status").val(response.body.status);

					}
				},

				error : function(data) {
					console.log(data)

					$("#incidentNo").val();
					$("#date").val();
					$("#type").val();
					$("#description").val();
					$("#reportedBy").val();
					$("#projectId").val();
					$("#severity").val();
					$("#actionTaken").val();
					$("#location").val();
					$("#latitude").val();
					$("#longitude").val();
					$("#status").val();

				}
			});
		}
      	
     	//Delete 
		function deleteFun() {
			var selectedRows = gridOptions.api.getSelectedRows();
			var id = selectedRows[0].incidentNo;
			$('#delete').attr('disabled', true);
			console.log("id",id);
			$.ajax({
				type : "GET",
				url : "incident-reporting-delete?id=" + id,
				success : function(response) {
					if (response.message == "Success") {

						agGrid.simpleHttpRequest({
							url : "incident-reporting-view"
						}).then(function(data) {
							gridOptions.api.setRowData(data);
						});
						//location.reload();

						closeModal();
						closeNav();
						
					}
				},
				error : function(data) {
					console.log(data);
				}
			})
		}
     	
		function deleteModalfun(){
			$("#deleteModal").modal('show');
		}
		function closeModal(){
			$("#deleteModal").modal('hide');
		}
          	
 
      </script>
   </head>
   <body>
      <div layout:fragment="content" class="maincontent">
         <div class="container-fluid">
            <div class="row">
               <div class="maincontentsec">
                  <div class="content_padding">
                     <div id="main_content">
                        <div class="panel-body">
                           <div class="d-flex justify-content-between">
                              <div class="btn-hs">
                                 <div class="font-design" id="totalReq">
                                    Master (<span></span>)
                                 </div>
                              </div>
                              <div class="buttonsec btn-hs" id="btndiv">
                                 <button id="download" class="download-btn" onclick="goalCSV()">Download</button>
                                 <button id="add" class="new-btn" onclick="openNav()">New</button>
                                 <button class="delete-btn" id="delete" onclick="deleteModalfun()">DELETE</button>
                              </div>
                           </div>
                           <div class="row">
                              <div id="myGrid" style="width: 100%; height: 400px;"
                                 class="ag-theme-alpine"></div>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
               <div id="mySidenav" class="sidenav">
                  <div class="slidebox">
                     <div class="d-flex justify-content-between">
                        <div class="edit">Reporting Details</div>
                        <div class="arrow">
                           <a href="javascript:void(0)" class="closebtn"
                              onclick="closeNav()"><i class="ti-arrow-right"></i></a>
                        </div>
                     </div>
                     <div class="row">
                        <div class="col-md-12 buttonsec btn-hs">
                           <button class="cancel-btn" onclick="closeNav()">CANCEL</button>
                           <button class="save-btn" onclick="saveNav()">SAVE</button>
                        </div>
                     </div>
                     <input type="hidden" id="incidentNo">
                     <div class="col-md-12">
                        <div class="form-group">
                           <label>Date</label> <input type="date"
                              class="form-control" id="date"
                              onblur="removeValid(event)" autocomplete="off" >
                        </div>
                     </div>
						<div class="col-md-12">
							<div class="form-group">
								<label> Type</label>
								<div class="select">
									<select id="type" onchange="getDescription()"
										onblur="removeValid(event)">
										<option th:value="NULL">Select Type</option>
										<option th:each="c,iter:${typeList}" th:value="${c.key}"
											th:text="${c.name}"></option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-12">
                        <div class="form-group">
                           <label> Description</label> <input type="text"
                              class="form-control" id="description" onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label> Reported By</label> <input type="text"
                              class="form-control" id="reportedBy" onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label> Project Id</label> <input type="text"
                              class="form-control" id="projectId" onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Severity</label>
								<div class="select">
									<select id="severity" onblur="removeValid(event)">
										<option value="">Select Severity</option>
										<option value="critical">Critical</option>
										<option value="high">High</option>
										<option value="medium">Medium</option>
										<option value="average">Average</option>
										<option value="low">Low</option>
									</select>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Action Taken</label>
								<textarea class="form-control" id="actionTaken" 
									onblur="removeValid(event)" autocomplete="off"></textarea>
							</div>
						</div>
						<div class="col-md-12">
                        <div class="form-group">
                           <label> Location</label> <input type="text"
                              class="form-control" id="location" onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label> Latitude</label> <input type="text"
                              class="form-control" id="latitude" onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label> Longitude</label> <input type="text"
                              class="form-control" id="longitude" onblur="removeValid(event)"
                              autocomplete="off">
                        </div>
                     </div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Status</label> <select class="form-control" id="status"
									onchange="removeValid(event)">
									<option value="open">Open</option>
									<option value="closed">Closed</option>
									<option value="processing">Processing</option>
								</select>
							</div>
						</div>

					</div>
               </div>
            </div>
            <!-- delete modal start -->
					<div class="modal fade"  id="deleteModal">
							<div class="modal-dialog modal-confirm" >
								<div class="modal-content">
									<div class="modal-header flex-column">
										
									</div>
									<div class="modal-body">
										<p>Do you really want to delete these records? This
											process cannot be undone.</p>
									</div>
									<div class="modal-footer justify-content-center">
										<button type="button" class="btn1" data-dismiss="modal"
											aria-hidden="true" onclick="closeModal()">Cancel</button>
										<button type="button" class="btn3" id="deleteModalBtn"
											onclick="deleteFun()">Delete</button>
									</div>
								</div>
							</div>
						</div>
         </div>
      </div>
   </body>
</html>
