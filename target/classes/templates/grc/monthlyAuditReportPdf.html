<!DOCTYPE html>
<html>
<head>
<title>Monthly Permit Audit Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
<style>
@page {
	size: A4 portrait;
	padding: 0;
	margin: 0;
}

table {
	width: 100%;
	font-family: sans-serif;
	border-collapse: collapse;
	border-spacing: 0;
	-fs-table-paginate: paginate;
}

/* .border, table, th, td, table.border, table.border th, table.border td {
	border: 1px solid;
	padding: 5px;
}
 */
table {
	page-break-inside: avoid;
}

table.borderless, .border table.border-0, .border table.border-0 th,
	.border table.border-0 td {
	border: 0;
}

.table-fixed {
	table-layout: fixed;
}

.m-0 {
	margin: 0;
}

.p-0 {
	padding: 0;
}

.align-middle {
	vertical-align: middle;
}

.text-center {
	text-align: center;
}

.text-start {
	text-align: left;
}

.text-end {
	text-align: right;
}

.text-nowrap {
	text-wrap: nowrap;
}

.align-top {
	vertical-align: top;
}

.align-bottom {
	vertical-align: bottom;
}

.border-0, .border-0 th, .border-0 td {
	border: 0;
}

.bordered .border-left-0 {
	border-left: 0;
}

.bordered .border-right-0 {
	border-right: 0;
}

.border-0 .border-top, .border-top, .border-top th, .border-top td {
	border-top: 1px solid;
}

.border-0 .border-left, .border-left, .border-left th, .border-left td,
	th.border-left {
	border-left: 1px solid;
}

.border-0 .border-right, .border-right, .border-right th, .border-right td,
	th.border-right {
	border-right: 1px solid;
}

.border-0 .border-bottom, .border-bottom, .border-bottom th,
	.border-bottom td {
	border-bottom: 1px solid;
}

.ps-1 {
	padding-left: 10px;
}

.ps-0_5 {
	padding-left: 5px;
}

.pt-1 {
	padding-top: 10px;
}

.p-0_5 {
	padding: 2.5px;
}

.p-1 {
	padding: 10px;
}

.p-2 {
	padding: 20px;
}

.px-3 {
	padding-left: 15px;
	padding-right: 15px;
}

.m-1 {
	margin: 5px;
}

.mt-2 {
	margin-top: 20px;
}

img {
	width: 250px;
}

.fs-22p {
	font-size: 22px;
}

.fs-18p {
	font-size: 18px;
}

.fs-16p {
	font-size: 16px;
}

.fs-14p, td.fs-14p {
	font-size: 14px;
}

.fs-12p {
	font-size: 12px;
}

.fs-10p {
	font-size: 10px;
}

.fs-9p {
	font-size: 9px;
}

.fw-normal {
	font-weight: normal;
}

.fw-bold {
	font-weight: 700;
}

.fw-bolder {
	font-weight: 900;
}

.h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th {
	height: 60px;
}

.h-pdf, .h-pdf td, .h-pdf th {
	height: 24px;
}

.h-pdf-next, .h-pdf-next td, .h-pdf-next th {
	height: 10px;
}

td.h-row {
	height: 20px;
}

td.h-row-smaller {
	height: 10px;
}

td.h-row-xs {
	height: 5px;
}

.bg-dark {
	background-color: #000000;
}

.bg-lightgrey {
	background-color: #d3d3d3;
}

.text-white {
	color: #ffffff;
}

.rounded-1 {
	border-radius: 5px;
}

.font-serif {
	font-family: serif;
}

.font-vivian {
	font-family: 'Vivian', sans-serif;
}

[class^="ti-"], [class*=" ti-"] {
	font-family: 'themify';
	speak: none;
	font-style: normal;
	font-variant: normal;
	text-transform: none;
	line-height: 1;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	font-weight: 900;
}

.ti-check:before {
	content: "\e64c";
}

.ti-close:before {
	content: "\e646";
}

.fs-title {
	font-size: 16px;
	font-weight: bold;
}

.tx-right {
	font-size: 12px;
	font-weight: normal;
	text-align: right;
}

.p-tp {
	padding-top: 30px;
}

p {
	font-size: 12px;
	padding: 0 !important;
	line-height: 22px;
	margin: 0;
}

.top-pd {
	margin-top: 20px;
}
.bordered-tbl {
  border-collapse: collapse;
}

.bordered-tbl td {
  border: 1px solid #000000;
}
.bordered-tbl th {
  border: 1px solid #000000;
}

</style>
</head>
<body>

	<table class="borderless">
		<thead class="border-0 text-center">
			<tr>
				<td colspan="2">
					<h1 class="fs-22p" style="text-transform: uppercase"
						th:text="${allData[0].orgDiv}"></h1>
					<h2 class="fs-18p">Monthly Audit Report (Monthly Basis)</h2>
				</td>
			</tr>

		</thead>

	<tbody>
	<tr>
	<td>
		<table class="fs-12p text-center bordered-tbl">
		<tbody>
			<tr class="bord">
				<th width="10%">Month</th>
				<th>Permit Details</th>
				<th width="15%">Gaps</th>
				<th width="15%">Remarks</th>
				<th width="15%">Date of Audit</th>
				<th width="15%">Audited By</th>
			</tr>
			<tr th:each="item, iterStat : ${allData}">
				<!-- Show the month name with rowspan only for the first occurrence -->
				<td valign="middle" th:if="${iterStat.index == 0}"
					th:rowspan="${#lists.size(allData)}" th:text="${item.monthName}"></td>

				<!-- Display other columns -->
				<td class="text-start ps-0_5" th:text="${item.taskName}"></td>
				<td th:text="${item.result}"></td>
				<td th:text="${item.remark}"></td>
				<td th:text="${item.date}"></td>
				<td th:text="${item.reviewName}"></td>
			</tr>
			</tbody>
		</table>
	</td>
	</tr>

	</tbody>
	</table>
</body>
</html>
