	function incrementData(data) {
	    // Assuming 'data' follows the format 'INSP/YYYY-YY/XXXXX'
	    const parts = data.split('/');
	    const lastPart = parseInt(parts[2], 10); // Extract the numeric part
	    const incrementedPart = (lastPart + 1).toString().padStart(5, '0'); // Increment and pad to 5 digits
	    parts[2] = incrementedPart;
	    return parts.join('/');
	}

	function deleteOnclick() {
		$('.loader').show();

			$.ajax({

				 if (response.message == "Success") {
					
					 $('#deleteModall').modal('hide');

						$('#delete1').attr("disabled", true);
						$('#add1').attr("disabled", false);
						viewData();
						closeId();
						$('.loader').hide();
					} else {
						
					}
				},
				error : function(data) {
					console.log(data)
					$('.loader').hide();
				}
			})
		}
	
	function deleteOnclick1() {
