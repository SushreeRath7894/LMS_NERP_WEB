function addControlDetails() {
	obj = {};
	obj.projectId = $("#projectId").val();
	obj.riskId = $("#riskId").val();
	obj.impactMitigationId = $("#impactMitigationId").val();
	obj.riskIdentificationId = $("#riskIdentificationId").val();
	obj.dueDate = $("#dueDate").val();
	obj.actionTaken = $("#actionTaken").val();
	obj.reqNo = $("#reqNo").val();
	obj.remark = $("#remark").val();
	obj.status = $("#status").val();
	
	var validation = true;

    if (obj.dueDate == null || obj.dueDate == "") {
		validation = validationUpdated("Due Date Required", "dueDate");
	}
	if (obj.actionTaken == null || obj.actionTaken == "") {
		validation = validationUpdated("Action Required", "actionTaken");
	}
	if (obj.reqNo == null || obj.reqNo == "") {
		validation = validationUpdated("Req.No Required", "reqNo");
	}
	if (obj.remark == null || obj.remark == "") {
		validation = validationUpdated("Remark Required", "remark");
	}

	if (validation) {
		console.log(obj)
		$('.loader').show();
		$.ajax({
			type : "POST",
			url : "risk-control-details-save",
			contentType : "application/json",
			data : JSON.stringify(obj),
			success : function(response) {
				if (response.message == "Success") {
					
					$('.loader').hide();
					$("#messageParagraph").text(
					"Data Saved Successfully");
					$("#msgOkModal").removeClass("btn3");
					$("#msgOkModal").addClass("btn1");
					$("#msgModal").modal('show');					
					$("#addModel1").modal('hide');
					
					agGrid.simpleHttpRequest({
						url : "risk-control-view-throtugh-ajax"
					}).then(function(data) {
						var jsonData = JSON.parse(data.body);
						var allData = jsonData.controlData;
						var len = allData.length;
						$('#totalReq').find('span').html(len);
						gridOptions.api.setRowData(allData);
						//$('.loader').hide();
					}); 
				}
			},
			error : function(data) {
			}
		})
	}
}

function getRequisitionList() {
	var rid = '';
	var id = 0;
	var option = $("<option></option>");
	$(option).val(null);
	$(option).html("Select");
	$.ajax({
		type : "GET",
		url : "risk-control-get-RequisitionList?id=" + id,
		success : function(response) {
			if (response.message == "success") {
				$("#reqNo").empty();
				var option = $("<option></option>");
				$(option).val(null);
				$(option).html("Select");
				$("#reqNo").append(option);
				for (var i = 0; i < response.body.length; i++) {
					var option = $("<option></option>");
					$(option).val(response.body[i].key);
					$(option).html(response.body[i].name);
					$("#reqNo").append(option);
				}
				if (rid != "" || rid != null || rid != "null") {
					$("#reqNo").val(rid);
				}
			}
		},
		error : function(e) {
		}
	});
}
