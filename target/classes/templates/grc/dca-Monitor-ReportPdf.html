<!DOCTYPE html>
<html>
<head>
  <title>DCA Monitor Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"></meta>
  <style>
    @page {
      size: A4 landscape; /* Change to landscape */
      padding: 0;
      margin: 0;
    }
    table { width: 100%; font-family: sans-serif; border-collapse: collapse; border-spacing: 0; -fs-table-paginate: paginate; }
    .border, table, th, td, table.border, table.border th, table.border td { border: 1px solid; }
    table { page-break-inside: avoid; }

    table.borderless, .border table.border-0, .border table.border-0 th, .border table.border-0 td { border: 0; }
    .table-fixed { table-layout: fixed; }

    .m-0 { margin: 0; }
    .p-0 { padding: 0; }
    .align-middle { vertical-align: middle; }
    .text-center { text-align: center; }
    .text-start { text-align: left !important; }
    .text-end { text-align: right !important; }
    .text-nowrap { text-wrap: nowrap; }
    .align-top { vertical-align: top; }
    .align-bottom { vertical-align: bottom; }

    .border-0, .border-0 th, .border-0 td { border: 0; }
    .bordered .border-left-0 { border-left: 0; }
    .bordered .border-right-0 { border-right: 0; }
    .border-0 .border-top, .border-top, .border-top th, .border-top td { border-top: 1px solid; }
    .border-0 .border-left, .border-left, .border-left th, .border-left td, th.border-left { border-left: 1px solid; }
    .border-0 .border-right, .border-right, .border-right th, .border-right td, th.border-right { border-right: 1px solid; }
    .border-0 .border-bottom, .border-bottom, .border-bottom th, .border-bottom td { border-bottom: 1px solid; }
    .ps-1 { padding-left: 10px; }
    .ps-0_5 { padding-left: 5px; }
    .pt-1 { padding-top: 10px; }
    .p-0_5 { padding: 2.5px; }
    .p-1 { padding: 10px; }
    .p-2 { padding: 20px; }
    .px-3 { padding-left: 15px; padding-right: 15px; }

    .m-1 { margin: 5px; }
    .mt-2 { margin-top: 20px; }

    .fs-24p { font-size: 24px; }
    .fs-18p { font-size: 18px; }
    .fs-16p { font-size: 16px; }
    .fs-14p, td.fs-14p { font-size: 14px; }
    .fs-12p { font-size: 12px; }
    .fs-10p { font-size: 10px; }
    .fs-9p { font-size: 9px; }
    .fw-normal { font-weight: normal; }
    .fw-bold { font-weight: 700; }
    .fw-bolder { font-weight: 900; }

    .h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th { height: 80px }
    .h-pdf, .h-pdf td, .h-pdf th { height: 24px; font-size:10px;text-align:center; }
    .h-pdf .font-w500{font-weight: 500;}
    .h-pdf-next, .h-pdf-next td, .h-pdf-next th { height: 18px;font-size:10px }
    td.h-row { height: 20px; }
    td.h-row-smaller { height: 10px; }
    td.h-row-xs { height: 5px; }
    .bg-dark { background-color: #000000; }
    .bg-lightgrey { background-color: #d3d3d3; }

    .text-white { color: #ffffff; }
    .rounded-1 { border-radius: 5px; }
    .font-serif { font-family: serif; }
    .font-vivian { font-family: 'Vivian', sans-serif; }
    [class^="ti-"], [class*=" ti-"] { font-family: 'themify'; speak: none; font-style: normal; font-variant: normal; text-transform: none; line-height: 1; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-weight: 900; }
    .ti-check:before { content: "\e64c"; }
    .ti-close:before { content: "\e646"; }

    .position-absolute { position: absolute; }
    .w--5 { width: 6.6%; }
    .left-2 { left: 2%; }
    .fnt-w700{font-weight: 700;}
    .img-ht{
     position: absolute;
    left: 10px;
    top: 5px;
    height: 50px;
    }
  </style>
</head>
<body>

<table class="borderless font-calibri">
  <thead class="h-pdf">
    <tr>
      <th colspan="17" class="text-center">
        <h1 class="m-0 fs-24p"><span th:text="${orgDivision}"></span></h1>
      </th>
    </tr>
</thead>
<tbody class="h-pdf">
  <tr>
    <td colspan="14" class="text-center fnt-w700">DEEP COMPLIANCE AUDIT SCHEDULE ASSIGNMENT AND COMPLIANCE STATUS MONITORING- <span th:text="${monitorYear}"></span></td>
    <td colspan="3" class="text-center fnt-w700">Prepared on:<span th:text="${dateString}"></span></td>
  </tr>
  <tr>
    <th>Name</th>
    <th>Designation</th>
    <th>January</th>
    <th>February</th>
    <th>March</th>
    <th>April</th>
    <th>May</th>
    <th>June</th>
    <th>July</th>
    <th>August</th>
    <th>September</th>
    <th>October</th>
    <th>November</th>
    <th>December</th>
    <th>Total Deep compliance alloted </th>
    <th>Deep Compliance covered</th>
    <th>% Compliance status</th>
  </tr>

        <tr th:each="data, iterStat : ${grid1Data}">
            <td th:text="${data.empId}"></td>
            <td class="text-start" th:text="${data.designation}"></td>
            <td th:text="${data.month1}"></td>
            <td th:text="${data.month2}"></td>
            <td th:text="${data.month3}"></td>
            <td th:text="${data.month4}"></td>
            <td th:text="${data.month5}"></td>
            <td th:text="${data.month6}"></td>
            <td th:text="${data.month7}"></td>
            <td th:text="${data.month8}"></td>
            <td th:text="${data.month9}"></td>
            <td th:text="${data.month10}"></td>
            <td th:text="${data.month11}"></td>
            <td th:text="${data.month12}"></td>
            <td th:text="${data.totaldeepcompliance}"></td>
            <td th:text="${data.deepcompliance}"></td>
            <td th:text="${data.compliancestatus}"></td>
        </tr>
 

    <tr>
      <td colspan="14" class="text-end" style="padding: 0px 1vw;"><b>Total</b></td>
     <td colspan="1" class="text-center" style="padding: 0vw 4vw;"><b><span th:text="${totalDeepComplianceAllocated}"></span></b></td>
      <td colspan="1" class="text-center" style="padding: 0vw 4vw;"><b><span th:text="${totalDeepCompliance}"></span></b></td>
       <td colspan="1" class="text-center" style="padding: 0vw 4vw;"><b></b><span th:text=" (${totalDeepCompliance} / ${totalDeepComplianceAllocated} ) * 100 "></span>%</td>
    </tr>
  </tbody>
</table>

</body>
</html>
