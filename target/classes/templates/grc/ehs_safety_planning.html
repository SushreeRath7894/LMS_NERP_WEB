	function getOwnerList(){
		var search = $("#owner").val();
		console.log("searchhh in getAssignedToAutoSearch"+search)
		if (search == "") {
			$("#suggesstion-box1").hide();
		}
		if (search) {
			$.ajax({
						type : "GET",
						url : "safety-planning-autosearch-owner?searchValue="
								+ search,
						success : function(response) {
							if (response.message == "success") {
								console.log(response);
								if (response.body.length != 0) {
									$("#search").css("background", "#FFF");
									var content = '<ul id="autocomplete-list" style="color:#ccc;">';
									for (var i = 0; i < response.body.length; i++) {
										
										content += '<li class="autocompletedata cp" onclick="selectAutocompleteValue1(\''
												+ response.body[i].key
												+ '\',\''
												+ response.body[i].name
												+ '\')">'
												+ response.body[i].name
												+ '</li>';
									}
									content += '</ul>';
									$("#suggesstion-box1").show();
									$("#suggesstion-box1").html(content);

								} else {
									$("#search").css("background", "#FFF");
									var content = '<div id="autocomplete-list">';
									content += '<div onClick="selectAutocompleteValue1()">'
											+ "No Data Found" + '</div>';
									content += '</div>';
									$("#suggesstion-box1").show();
									$("#suggesstion-box1").html(content);

								}
							}
						},

	function selectAutocompleteValue1(key,name) {
		if (key) {

			$("#owner").val(name);
			$("#search").val(key);
			$("#search").attr('data-procat', key);

			$("#search").attr('data-procat', "");
			$("#suggesstion-box1").hide();

												onkeyup='getOwnerList()'><input type="hidden" id="ownerId">
										</div>
										<div id="suggesstion-box1" class="sugg-cls"></div>
										</div>
									</div>
									
									<div class="col-lg-6">
										<div class="form-group">
											<label>Action Plan</label>
												<input type="text" id="actionPlan" class="form-control"
												onblur="removeValid(event)" >
										</div>
									</div>
									
										<div class="col-lg-6">
										<div class="form-group calendar_box">
										<label> Due date</label> <input type="text"
											id="dueDate" class="form-control"
											onblur="removeValid(event)" 
											th:attr="onkeyup=|formatDate('dueDate','${session.DATEFORMAT_JS}')|" readonly>
										<i class="ti-calendar picker_calendar" id="dueDateCalendar"></i>
									</div>
									</div>
									
									<div class="col-lg-6">
										<div class="form-group">
											<label>Status</label>
												<div class="select">
												<select class="" id="status" onblur="removeValid(event);" >
												<option value="NULL">Select</option>
												<option value="Open">Open</option>
												<option value="Processing">Processing</option>
												<option value="Closed">Closed</option>
													<!--  <option th:each="c,iter:${projectList}"
															th:value="${c.key}" th:text="${c.name}"></option> -->
												</select>
												</div>
										</div>
									</div>
									
									<div class="col-lg-6">
										<div class="form-group">
											<label>Remark</label>
												<input type="text" id="remark" class="form-control"
												onblur="removeValid(event)" >
										</div>
									</div>
							</div>
							</div>
							<!-- Modal footer -->

							<div class="modal-footer">
								<div align="right">
											<button class="cancel-btn" onclick="hideModal()">CANCEL</button>
											<button class="btn1" id="saveId" onclick="saveTableData()">SAVE</button>
										</div>
							</div>
						</div>
					</div>
				</div>
						
						<!-- //for excel file upload -->
						<div class="modal fade"  id="deleteModal">
							<div class="modal-dialog modal-confirm" >
								<div class="modal-content">
									<div class="modal-header flex-column">
									</div>
									<div class="modal-body">
										<p>Do you really want to delete these records? This
											process cannot be undone.</p>
									</div>
									<div class="modal-footer justify-content-center">
										<button type="button" class="btn1" data-dismiss="modal"
											aria-hidden="true" onclick="closeModal()">Cancel</button>
										<button type="button" class="btn3" id="deleteModalBtn"
											onclick="deleteFun()">Delete</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				
			</div>
</body>

</html>
