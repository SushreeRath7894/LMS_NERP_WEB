<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
   xmlns:th="http://www.thymeleaf.org"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout/master}">
   <head>
      <title>Welcome</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style></style>
      <script type="text/javascript">
         $(document).ready(function() {
        	 
        	 $('#delete').attr('disabled', true);
         
         var gridDiv = document.querySelector('#myGrid');
         new agGrid.Grid(gridDiv, gridOptions);
         //gridOptions.api.setRowData(data);
     
         
         // View AgGrid
 		
     	agGrid.simpleHttpRequest({
 			url : "incident-casual-analysis-view"
 		}).then(function(data) {
 			gridOptions.api.setRowData(data);
 		});
         
         });
         
     
         
         
         
         var columnDefs = [ {
        	 headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : true,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true
			},
			 {
	         	headerName : "Assign No.",
	         	field : "assignNo",
	         	width : 150,
	         	cellRenderer : function(params) {
	         return '<a id="" onclick=editId("' + params.data.assignNo
	         + '") href="javascript:void(0)">'
	         + params.data.assignNo + '</a>';
	         }
	         
	         }, {
	         	headerName : "Assign To",
	         	field : "assignTo",
	         	cellStyle : {
	         		textAlign : 'left'
	         	},
	         
	         },  {
	         	headerName : "Task",
	         	field : "task",
	         	cellStyle : {
	         		textAlign : 'left'
	         	},
	         
	         }, {
	         	headerName : "Due Date",
	         	field : "dueDate",
	         	cellStyle : {
	         		textAlign : 'left'
	         	},
	         
	         }, {
	         	headerName : "Remarks",
	         	field : "remarks",
	         	cellStyle : {
	         		textAlign : 'left'
	         	},
	         	
	         }, {
	          	headerName : " Casual Analysis ",
	         	field : "casualAnalysis",
	         	cellStyle : {
	         		textAlign : 'left'
	         	},
	         
	         }, {
	          	headerName : "Status",
	         	field : "status",
	         	cellStyle : {
	         		textAlign : 'left'
	         	},
	         
	         },{
	          	headerName : "Close Date",
	         	field : "closeDate",
	         	cellStyle : {
	         		textAlign : 'left'
	         	},
	         	
	         } ];
         
         var gridOptions = {
         	columnDefs : columnDefs,
         	defaultColDef : {
         		sortable : true,
         		filter : true,
         		resizable : true,
         		width : 260,
         		height : 10
         	},
         	//rowSelection : 'multiple',
         	rowSelection : 'single',
         	suppressRowClickSelection : true,
         	//onSelectionChanged : deleteModal,
         };
       
           // Function for ag grid    
         function openNav() {
         	$("#assignTo").val('');
         	$("#task").val('');
         	$("#dueDate").val('');
         	$("#remarks").val('');
         	$("#casualAnalysis").val();
         	$("#status").val();
         	$("#closeDate").val();
         	
         	document.getElementById("mySidenav").style.cssText = "width: 25%; position: absolute; right:-10px; overflow: hidden; height:auto; top:100px;";
         
         	document.getElementById("demo").style.width = "75%";
         	$("#delete").hide();
         	$("#add").hide();
         }
         
         function closeNav() {
         	document.getElementById("mySidenav").style.width = "0";
         	document.getElementById("demo").style.width = "100%";
         	$("#assignTo").val('');
         	$("#task").val('');
         	$("#dueDate").val('');
         	$("#remarks").val('');
         	$("#casualAnalysis").val('');
         	$("#status").val('');
         	$("#closeDate").val('');
         	
         	$("#delete").show();
         	$("#add").show();
         }
        
         
   
         
         // save
         function saveNav() {
         	var obj = {};
         	obj.assignNo = $("#assignNo").val(); 	
         obj.assignTo = $("#assignTo").val();
         obj.task = $("#task").val();
         obj.dueDate = $("#dueDate").val();
         obj.remarks = $("#remarks").val();    
         obj.casualAnalysis = $("#casualAnalysis").val();
         obj.status = $("#status").val();
         obj.closeDate = $("#closeDate").val();    
         	
         
         	console.log(obj);
         	
         	var validation = true;
         	 
         
         
         if (validation) {
         $.ajax({
         type : "POST",
         url : "incident-casual-analysis-add",
         contentType : "application/json",
         data : JSON.stringify(obj),
         success : function(response) {
         if (response.message == "success") {
         
         $("#messageParagraph").text("Data Saved Successfully");
         $("#msgOkModal").removeClass("btn3");
         $("#msgOkModal").addClass("btn1");
         $("#msgModal").modal('show');
         $("#activityone").show();
         $("#add").show();
         $("#myGrid").show();
         $("#cancel").hide();
         $("#save").hide();
         $("#form").hide();
         $("#new").hide();
         
     	agGrid.simpleHttpRequest({
 			url : "incident-casual-analysis-view"
 		}).then(function(data) {
 			gridOptions.api.setRowData(data);
 		});
         
         
         closeNav();
         
         }
         },
         
         error : function(data) {
         }
         })
         }
                 
         }
         
  
         
   // edit
         
         function editId(id) {
         
         console.log("idddddddddd = " + id);
         $("#add").hide();
         //$("#myGrid").show();
         $("#delete").hide();
         $("#add").hide();
         //$("#download").hide();
         
         $
         	.ajax({
         		type : "GET",
         		url : "incident-casual-analysis-edit?Id="
         				+ id,
         		success : function(response) {
         			if (response.message == "Success") {
         				openNav();
         				console.log("edit" + JSON.stringify(response));        						
         				$("#assignNo").val(response.body.assignNo);
         				$("#assignTo").val(response.body.assignTo);
         			    $("#task").val(response.body.task);        						
         				$("#dueDate").val(response.body.dueDate);       								
         				$("#remarks").val(response.body.remarks);
         				$("#casualAnalysis").val(response.body.casualAnalysis);
         				  $("#status").val(response.body.status);
         				  $("#closeDate").val(response.body.closeDate);
         						
         			}
         		},
         
         		error : function(data) {
         			console.log(data)
         
         			$("#assignNo").val();
         			$("#assignTo").val();
         			$("#task").val();
         			$("#dueDate").val();
         			$("#remarks").val();
         			$("#casualAnalysis").val();
                 	$("#status").val();
                 	$("#closeDate").val();
         
         		}
         	});
         } 
      	
 
      </script>
   </head>
   <body>
      <div layout:fragment="content" class="maincontent">
         <div class="container-fluid">
            <div class="row">
               <div class="maincontentsec">
                  <div class="content_padding">
                     <div id="main_content">
                       
                        
                        <div class="panel-body" id="demo">
                           <div class="d-flex justify-content-between">
                              <div class="btn-hs">
                                 <div class="font-design" id="totalReq">
                                    Casual Analysis (<span></span>)
                                 </div> 
                              </div>
                              <div class="buttonsec btn-hs" id="btndiv">
                                 <button id="download" class="download-btn" onclick="goalCSV()">Download</button>
                                 <button id="add" class="new-btn" onclick="openNav()" disabled="disabled">New</button>
                                
                              </div>
                           </div>
                           <div class="row">
                              <div id="myGrid" style="width: 100%; height: 300px;"
                                 class="ag-theme-alpine"></div>
                           </div>
                        </div>
                        
                     </div>
                  </div>
               </div>
               <div id="mySidenav" class="sidenav">
                  <div class="slidebox">
                     <div class="d-flex justify-content-between">
                        <div class="edit">Casual Analysis Details</div>
                        <div class="arrow">
                           <a href="javascript:void(0)" class="closebtn"
                              onclick="closeNav()"><i class="ti-arrow-right"></i></a>
                        </div>
                     </div>
                     <div class="row">
                        <div class="col-md-12 buttonsec btn-hs">
                           <button class="cancel-btn" onclick="closeNav()">CANCEL</button>
                           <button class="save-btn" onclick="saveNav()">SAVE</button>
                        </div>
                     </div>
                  
                     <input type="hidden" id="assignNo">
                     

						<div class="col-md-12">
							<div class="form-group">
								<label> Assign To</label> <input type="text"
									class="form-control" id="assignTo" readonly>
							</div>
						</div>
						<div class="col-md-12">
                        <div class="form-group">
                           <label> Task</label> <input type="text"
                              class="form-control" id=task onblur="removeValid(event)"
                              autocomplete="off" readonly>
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label>Due Date</label> <input type="date"
                              class="form-control" id="dueDate"
                              onblur="removeValid(event)" autocomplete="off" readonly>
                        </div>
                     </div>
                     <div class="col-md-12">
                        <div class="form-group">
                           <label>Remarks</label> <input type="text"
                              class="form-control" id="remarks" onblur="removeValid(event)"
                              autocomplete="off" readonly>
                        </div>
                     </div>
						<div class="col-md-12">
							<div class="form-group">
								<label> Casual Analysis </label>
								<textarea class="form-control" id="casualAnalysis"
									onblur="removeValid(event)" autocomplete="off"></textarea>
							</div>
						</div>
						<div class="col-md-12">
							<div class="form-group">
								<label>Status</label> <select class="form-control" id="status"
									onchange="removeValid(event)">
									<option value="open">Open</option>
									<option value="closed">Closed</option>
									<option value="processing">Processing</option>
								</select>
							</div>
						</div>
                      <div class="col-md-12">
                        <div class="form-group">
                           <label>Close Date</label> <input type="date"
                              class="form-control" id="closeDate"
                              onblur="removeValid(event)" autocomplete="off" >
                        </div>
                     </div>	
                  </div>
               </div>
            </div>
            <!-- delete modal start -->
					         </div>
      </div>
   </body>
</html>
