	function onSelectionChangedItem() {
		var selectedRows = productOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});
		var selectedNodes = productOptions.api.getSelectedNodes();
		 var selectedData = selectedNodes.map(node => node.data);
		// var approveStatus= selectedData.map(node => node.approveStatus);
		if (rowCount > 0) {
			$('#rfq').attr('disabled', false);
			$('#addProduct').attr('disabled', true);
			$('#dltProduct').attr('disabled', false);
		} else {
			$('#rfq').attr('disabled', true);
			$('#addProduct').attr('disabled', false);
			$('#dltProduct').attr('disabled', true);
		}

	}
	function switchPage() {
		 $("#searchRowDiv").hide();
	 productOptions.api.setRowData();
						//$('.loader').show();
						agGrid.simpleHttpRequest({
							url : "risk-identification-riskdetails-view-through-ajax"

							var allData = jsonData.identificationData;

		var newDate = changeDateFormat(date);
		$("#identificationApplyDate").val(newDate);
		$("#save1").show();

	    $("#reqPrior").val('');
	 // $("#identificationApplyDate").val('');
	    $("#searchRowDiv").hide();
	    $('#dltProduct').attr('disabled', true);
	   
	}
	function changeDateFormat(inputDate) { // expects Y-m-d
		var splitDate = inputDate.split('-');
		if (splitDate.count == 0) {
			return null;
		}
		var year = splitDate[0];
		var month = splitDate[1];
		var day = splitDate[2];

		return day + '-' + month + '-' + year;
	}

	function downloadDetails() {
		var dataset = [];
		gridOptions.api.forEachNodeAfterFilterAndSort(function(rowNode, index) {
			dataset.push(rowNode.data);
		});
		gridOptions.api.exportDataAsCsv(dataset);
