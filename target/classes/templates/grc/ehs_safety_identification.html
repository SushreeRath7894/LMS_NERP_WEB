	function onSelectionChanged() {
		var selectedRows = gridOptions.api.getSelectedRows();

		//alert(pId);
		viewdets(pId);

	    });
		if (rowCount1 > 0) {

		} else {

		var rowCount=0;

	function addId() {
		document.getElementById("mySidenav1").style.cssText = "width: 350px; position: absolute; right:-20px; overflow: hidden; height:auto; top:75px;";
		document.getElementById("upperOne").style.width = "73%";
		}

		$("#add").show();
		$("#delete").show();
	}
	function newCategoryAssign(){
		var datas = [];
			var select = gridOptions1.api.getSelectedRows();			
			select.forEach(function(select, indrx) {		
				var obj={};
					obj.safetyId = select.safetyId;
					obj.categoryId = select.categoryId;
					obj.categoryCode = select.categoryCode;
					obj.projectId =pId;
					datas.push(obj);
				}); 
			console.log("--==>>>   "+JSON.stringify(datas));
			saveData(datas);		
	}
	function saveData(datas){
		 $.ajax({
				type : "POST",
				url : "safety-identification-add-data",
				contentType : "application/json",
				data : JSON.stringify(datas),
				success : function(response) {
					if (response.message == "Success") {
						
						console.log(response);
						$("#messageParagraph").text("Data Saved Successfully");
						$("#msgOkModal").removeClass("btn3");
						$("#msgOkModal").addClass("btn1");
						$("#msgModal").modal('show');
						$("#msgModal").modal('show');
						$("#feebackLogs").show();
						viewData();
						viewdets(pId);
					}
				},
				error : function(datas) {
					console.log(datas)
				}
			}) 
	}
	function deleteModalfun(){
		$("#deleteModal").modal('show');
	}
	function closeModal(){
		$('#delete').attr('disabled', true);
		$("#deleteModal").modal('hide');
	}
	function deleteFun(){
		console.log("delete ids--------------"+deleteId);

		$.ajax({
			type : "GET",
			url : "safety-identification-delete?id=" + deleteId,
			success : function(response) {
				if (response.code == "Success") {
					closeModal();
					viewData();

					viewdets(pId);
				}
			}
		});

		$('#delete').attr("disabled", true);
	}
