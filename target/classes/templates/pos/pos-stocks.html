#loader:before {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	margin: auto;
	border: 5px solid;
	width: 120px;
	height: 120px;
	border-radius: 50%;
	border-color: #a278f7 #5120B5 transparent transparent;
	-webkit-animation: rotation 2.5s linear infinite;
	animation: rotation 2.5s linear infinite;
}

#loader:after {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	margin: auto;
	border: 5px solid;
	border-color: transparent transparent #f179a4 #d32d68;
	width: 145px;
	height: 145px;
	border-radius: 50%;
	-webkit-animation: rotationBack 1.5s linear infinite;
	animation: rotationBack 1.5s linear infinite;
	transform-origin: center center;
}

{
transform
:

360deg
)

			for (i = res; i > 1; i--) {

			}

			$("#catDesc").text(textDesc);
		}
	}

	function saveMultiFile(event) {
		var AssignItemQty = event.currentTarget.value;
		var currentFldId = event.currentTarget.getAttribute('id');
		var l = currentFldId.split("_");
		var counter = l[1];
		var currentFldId = "#" + currentFldId;

		var uFile = $(currentFldId)[0].files[0];
		var fileName = event.currentTarget.value;
		var lastIndex = fileName.lastIndexOf("\\");
		if (lastIndex >= 0) {
			fileName = fileName.substring(lastIndex + 1);
		}
		var extension = fileName.split(".");

		var iURL = URL.createObjectURL(uFile);
		$("#uploadedBillDiv_" + counter).html("");
		if (extension[1] != null && extension[1] != "") {
			$("#uploadHidden_" + counter).val('');
		}
		if (extension[1] == "jpg" || extension[1] == "png"
				|| extension[1] == "jpeg") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-picture-o'></i></a></div>";
		} else if (extension[1] == "pdf") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-file-pdf-o'></i> </a></div>";
		} else if (extension[1] == "xls" || extension[1] == "xlsx") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-file-excel-o'></i></a></div>";
		} else if (extension[1] == "doc" || extension[1] == "dox"
				|| extension[1] == "docx") {
			var LightImg = "<div class='uploadicon position-l'><a class='example-image-link' href='" + iURL + "' title='" + fileName + "' target='_balnk'><i class='fa fa-file-word-o'></i></a></div>";
		} else {
			var LightImg = "<div class='uploadicon position-l '> </div>";
		}
		var dltImg = "<i class='ti-close position-l rmv1'></i>";
		$("#uploadedBillDiv_" + counter).html(LightImg);
		$("#imageName_" + counter).html(fileName);
		$("#dltImage_" + counter).html(dltImg);

		$("#dltImage_" + counter).addClass("custom-file-delete");
		$("#clickImg_" + counter).removeClass("ti-plus");
		$("#clickImg_" + counter).addClass("ti-pencil");

	}

	function saveReplaceNote() {
		//duplicate check starts
		var orderIdCheck = $("#invoiceId").val();
		var productCheck = $("#itemId").val();
		var flag= true;
		$.ajax({
			type : "GET",
			url : "manage-dealer-order-duplicate-replace?orderId=" + orderIdCheck + "&productId=" +productCheck,
			async : false,
			success : function(response) {
				if (response.message == "Success") {
					if(orderIdCheck == response.body[0].orderId && productCheck == response.body[0].productId){
						flag=false;
					}
				}
			}
		})
		
		if(flag == false){
			$('#myModal1').modal('hide');
			swal("Already Replaced<br> Plaese Select Another Product!");
			return flag;
		}
		//duplicate check ends
		var returnNote = {};
		var replace = [];
		var uploadList = [];
		$("#doctbodyData > tr").each(function() {

			var uFile = $(this).find(".document")[0].files[0];
			var fileName = $(this).find(".document").val();
			var data = [];
			var x = [];
			if (fileName != '' && fileName != 'undefined' && fileName != null) {
				var lastIndex = fileName.lastIndexOf("\\");
				if (lastIndex >= 0) {
					fileName = fileName.substring(lastIndex + 1);
				}
				var reader = new FileReader();
				reader.readAsDataURL(uFile);

				reader.onload = function() {
					data = reader.result.split(",");
					x.push(data[1]);
				};
			} else {
				if ($("#invoiceId").val()) {
					fileName = $(this).find(".uploadHidCls").val();
				} else {
					x = [];
				}

			}
			uploadData = {};
			uploadData['invoiceId'] = $("#invoiceId").val();
			uploadData['documnentName'] = $(this).find(".docNoclss").val();
			uploadData['documentFile'] = x;
			uploadData['fileName'] = fileName;
			uploadData['imageNameEdit'] = $(this).find(".uploadHidCls").val();
			uploadList.push(uploadData);

			//console.log(uploadData)

		});
		setTimeout(function() {
			returnNote.custOrderId = $("#invoiceId").val();
			returnNote.itemId = $("#itemId").val();
			//returnNote.rtnSize = $("#rtnSize").val();
			returnNote.receivingQuantity = $("#rtnQty").val();
			returnNote.custDesc = $("#rtndesc").val();
			returnNote.documentList = uploadList;
			
			replace.push(returnNote);
			
			//console.log(replace);

			generateReplaceNote(replace);

		}, 1000)
		

	}

		$.ajax({

			dataType : "json",

				} else {

				}
			},
			error : function(data) {

				$("#myModal1").modal('hide');
				
			}
		})

	}

	function RejectedApproval() {
		
		var selectedRows = gridOptions.api.getSelectedRows();
		var selectedRowsString = '';
		selectedRows.forEach(function(selectedRow, index) {
			if (index > 0) {
				selectedRowsString += ',';
			}
			selectedRowsString += selectedRow.custOrderId;
		});
		
		
		var custOrderId = selectedRowsString;
		var payReject = $("#payReject").val();
		var rejectedBy = $('#userId').val();
		//var rejectedBy = $("#rejectedBy").val();
		var rejectedRamarkBy = $("#rejectedRamarkBy").val();
		
	$.ajax({
		type : "GET",
		url : "dealer-payment-rejected-status?payReject=" + payReject + "&custOrderId=" + custOrderId+ "&rejectedBy=" + rejectedBy+ "&rejectedRamarkBy=" + rejectedRamarkBy,
		async : false,
		success : function(response) {
			if (response.message == "Success") {
				$('#RejectPopup').modal('hide');
				$('#MyPopup').modal('hide');
				$('#AprovalPopup').modal('hide');
				$('#reqAppvBtn').attr("disabled", true);
				$('#createPackageDtls').attr("disabled", true);
				swal("Reject approved succesfully!", " ", "success");
				
				agGrid.simpleHttpRequest({
					url : 'pos-stocks-view'
				}).then(function(data) {
					var len = data.length;
					$('#totalReq').find('span').html(len);

					gridOptions.api.setRowData(data);
				});
			}

		},
		error : function(data) {
		}
	});
