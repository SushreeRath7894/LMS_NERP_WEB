	function rowSelectItem() {
		//alert('hi')

		var selectedRows = itemOptions.api.getSelectedRows();
		var rowCount = 0;
		selectedRows.forEach(function(selectedRow, index) {
			rowCount = rowCount + 1;
		});
		if (rowCount > 0) {
			//alert(JSON.stringify(selectedRows))
			$('#delete1').attr("disabled", false);
			$('#newItem').attr("disabled", true);
			$('#replace').attr("disabled", false);

			$("#totalQty").val(selectedRows[0].quantity);
			$("#returnedQty").val(selectedRows[0].productId);
			$("#productSize").val(selectedRows[0].productDimension);
			var userRoleCheck = $('#userType').val();
			if (selectedRows[0].replaceBtnStatus) {
				if (userRoleCheck == "Dealer") {
					$('#replaceDismiss').show();
					$('#replace').show();
					$('#replaceAssign').hide();

				}
			} else {
				if (userRoleCheck == "SuperAdmin") {
					$('#replaceAssign').show();
					$('#replace').hide();
					$('#replaceDismiss').hide();
				}
			}
		} else {
			$('#newItem').attr("disabled", false);
			$('#delete1').attr("disabled", true);
			$('#cancelOrderBtn').attr("disabled", true);
			$('#replace').attr("disabled", true);
			$('#addNew').attr("disabled", false);
			$('#replaceDismiss').hide();
			$('#replaceAssign').hide();
		}
	}

	function outForDelivery() {
		var datas = [];
		var obj = {};
		var validation = true;
		obj.customerId = $("#customerId").val();
		obj.orderShipmentId = $("#custShippingId").val();
		obj.orderPackageId = $("#custPackagingId").val();
		obj.custOrderId = $("#custOrdId").val();
		obj.deliveryPersonName = $("#deliveryPersonName").val();
		obj.dispatchDate = $("#dispatchDate").val();
		obj.dispatchTime = $("#dispatchTime").val();
		obj.deliveryPersonContact = $("#deliveryPersonContact").val();
		obj.deliveryPersonEmail = $("#deliveryPersonEmail").val();
		obj.deliveryPersonVehicle = $("#deliveryPersonVehicle").val();

		if (obj.deliveryPersonName == null || obj.deliveryPersonName == '') {
			swal("Delivery person name should not be blank");
			validation = false;
			return false;
		}
		if (obj.deliveryPersonContact == null
				|| obj.deliveryPersonContact == '') {
			swal("Delivery person contact number should not be blank");
			validation = false;
			return false;
		}
		if (obj.deliveryPersonEmail == null || obj.deliveryPersonEmail == '') {
			swal("Delivery person email should not be blank");
			validation = false;
			return false;
		}

		if (obj.dispatchDate == null || obj.dispatchDate == '') {
			swal("Delivery date should not be blank");
			validation = false;
			return false;
		}
		if (obj.dispatchTime == null || obj.dispatchTime == '') {
			swal("Delivery time should not be blank");
			validation = false;
			return false;
		}

		datas.push(obj);
		console.log('---->' + JSON.stringify(datas));
		if (validation) {
			$.ajax({
				type : "POST",
				url : "store-delivery-add",
				contentType : "application/json",
				data : JSON.stringify(datas),
				success : function(response) {
					if (response.message == "Success") {
						Cancel();
						swal("Your item is out for delivery"," ","success");
					}
				},
				error : function(datas) {
					console.log(datas)
					$('.loader').hide();
					$("body").removeClass("overlay");
				}
			})
		}/* else{
					swal('Somthing went wrong');
				} */

	}

			data : JSON.stringify(datas),
			success : function(response) {
				if (response.message == "Success") {
					$("#deliveryModal").modal('hide');
					Cancel();
					swal("Your item has been delivered","","success");
					sessionStorage.setItem('activity', 'ACT0351');
					window.location.href = "/shoukeen/order-delivered"
				}
			},
			error : function(datas) {
				console.log(datas)
				$('.loader').hide();
				$("body").removeClass("overlay");
			}
		})
	}
	
	
</script>
