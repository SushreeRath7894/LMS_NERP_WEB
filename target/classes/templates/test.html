<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<script>
        const rowData = [
          { orgHierarchy: ['CEO'], jobTitle: 'Chief Executive Officer' },
          { orgHierarchy: ['CEO', 'CTO'], jobTitle: 'Chief Technology Officer' },
          { orgHierarchy: ['CEO', 'CTO', 'Dev Manager'], jobTitle: 'Development Manager' },
          { orgHierarchy: ['CEO', 'CTO', 'Dev Manager', 'Developer 1'], jobTitle: 'Software Engineer' },
          { orgHierarchy: ['CEO', 'CFO'], jobTitle: 'Chief Financial Officer' },
          { orgHierarchy: ['CEO', 'CFO', 'Accountant'], jobTitle: 'Accountant' }
        ];
        const gridOptions = {
          columnDefs: [
            { field: 'jobTitle', headerName: 'Job Title' }
          ],
          rowData: rowData,
          treeData: true, 
          animateRows: true,
          groupDefaultExpanded: -1,
          getDataPath: (data) => data.orgHierarchy, 
        };

        $(document).ready(()=>{
            const gridDiv = document.querySelector('#myGrid');
            console.log(gridDiv)
            new agGrid.Grid(gridDiv, gridOptions);
        })

    </script>
</head>
<body>
	<div layout:fragment="content" class="maincontent">
		<div id="myGrid" class="ag-theme-alpine" style="height: 500px"></div>
		<script src="https://unpkg.com/ag-grid-community/dist/ag-grid-community.min.js"></script>
<script src="https://unpkg.com/ag-grid-enterprise/dist/ag-grid-enterprise.min.js"></script>

	</div>
	
	
</body>
</html>
