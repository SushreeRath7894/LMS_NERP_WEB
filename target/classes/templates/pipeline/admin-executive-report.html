<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<meta charset="ISO-8859-1">

<link href="../css/ncrm/admin/executive-report.css" rel="stylesheet">
<script src="../javaScript/crm/admin/executive-report.js"></script>
<script src="../javaScript/crm/common.js"></script>

<style>
.modal-lg{
    max-width: 706px!important;
}	
.leadFont{
	font-weight:bold!important;
}
.crltxt{
	color:#919090;
	font-weight:bold!important;
}
.form-group label {
    font-size: 16px!important;
}	
	
select {
    width: 100%;
    height: 29px;
    margin: 0;
    padding: 0;
    font-family: 'Montserrat',sans-serif;
    color: #333;
    cursor: pointer;
    line-height: 30px;
    font-size: 14px!important;
}	
.select::after {
    content: '\e64b';
    font-family: 'themify';
    position: absolute;
    top: 6px;
    right: 12px!important;
    bottom: 0;
    padding: 0;
    pointer-events: none;
    height: 30px!important;
    -webkit-transition: .25s all ease;
    -o-transition: .25s all ease;
    transition: .25s all ease;
}
.sltext{
	border: solid 1px #ccc!important;
    padding: 4px!important;	
}

</style>


</head>
<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<div class="loader-backdrop">
		             <div class="spinner-border custom-color " id="customLoad"></div> </div>
					
					
					<div class="d-flex flex-wrap justify-content-between flex-wrap">
						<div class="col-md-2 btn-hs">
							<div class="font-design" id="totalLead">
								ALL LEADS (<span></span>)
							</div>
						</div>
						
						<div class="col-md-4 btn-hs" id="searchRowDiv">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search" class="searchboxinput" onkeyup="cancelBar()"
									oninput="onQuickFilterChanged()" id="quickFilter">
								<div class="searchicon">
									<a href="javascript:void(0)">
										<span style="display: none; border-right: 1px solid #ccc; padding-right: 5px;" id="closeKey"
											onclick="resetQuickFilter()" class="close_i">
											<i class="ti-close srchicon"></i>
										</span>
									</a>
									<a href="javascript:void(0)">
										<i class="ti-search srchicon"></i>
									</a>
								</div>
							</div>
						</div>

						
						
						<div class="col-md-3 marg-tp">
	                      <div class="form-group exe">
	                        
	                      	  <div class="select dropd">
								<select id="executive" onchange="getLeadDetails(this.value)">
										<option value="">Select Executive</option>
											<option th:each="c,iter:${executive}"
												th:value="${c.key}" th:text="${c.name}" ></option>
														
								</select>
							</div>
	                      </div>
	                    </div>
	                    
						<div class="buttonsec btn-hs d-flex justify-content-center">
			
								<button class="btn2" id="leadTransfer" onclick="leadTransferModal()" style="background: #6A2BBF!important;" disabled><strong>Transfer Lead</strong></button>
								<!--<button class="btn3" id="deleteLead" onclick="deleteLeadInfo()"><strong>DELETE</strong></button>-->
                                <button class="btn1" id="leadTransferDetails" onclick="showConversation()" style="margin-top: 5px;width: 90px!important;">Transferred History</button>


						</div>
					</div>
					
					<input type="hidden" id="userMail" th:value="${session.USER_EMAIL}" />
					<div  id="lead-grid-contain">
						<div class="main-body p-0">
							<div class="inner-wrapper">
								<div id="myGridLead" style="width: 100%; height: 400px;" class="ag-theme-alpine"></div>

							</div>
						</div>
					</div>
					
						<!-- Lead Transfer History Modal -->
						<div class="modal transfer-history-modal" id="transferHistoryModal" tabindex="-1" role="dialog" aria-labelledby="transferHistoryModalLabel" aria-hidden="true">
						  <div class="modal-dialog modal-lg" role="document">
						    <div class="modal-content">
						      <div class="modal-header">
						        <h5 class="modal-title" id="transferHistoryModalLabel">Lead Transfer History</h5>
						        <button type="button" class="close" data-dismiss="modal" aria-label="Close" onclick="closeTransferModal();">
						          <span aria-hidden="true">&times;</span>
						        </button>
						      </div>
						      
						      <div class="modal-body" id="transferDetails" style="min-height: 400px;overflow-y: scroll;">
						  
						        <!-- Add more transfer items as needed -->
						      </div>
						      <div class="modal-footer">
						        <button type="button" class="btn btn-secondary" data-dismiss="modal" onclick="closeTransferModal();">Close</button>
						      </div>
						    </div>
						  </div>
						</div>

					
					<!-- Modal View -->
					<div id="myModalAddEmail" class="modal fade" role="dialog">
						<div class="modal-dialog modal-lg">
							<!-- Modal content-->
							<div class="modal-content">
								<div class="modal-header">
									<h4 class="modal-title">Lead Transfer</h4>
										<button type="button" class="close" data-dismiss="modal"
										aria-label="Close" onclick="closeLeadTransferModal()">
										<i class="ti-close"></i>
									</button>
			
								</div>
							
								<div class="modal-body">
									<div class="row">
										
									<div class="col-md-7">
									<div class="d-flex">
										<input id="leadId" hidden/>
										<div class="col-md-04"><span class="crltxt">Current Lead </span></div>
										<div class="col-md-04"> &nbsp;:&nbsp; </div>
										<div class="col-md-04 leadFont" id="leadName"> </div>
									</div>
									</div>
										
										
										<div class="col-md-5">
										<div class="form-group row">
											<label class="col-md-6 text-left" style="padding-left:0px!important;"><span class="text-right"><strong>Transfer Type</strong></span></label>
											<div class="select col-md-6 sltext">
												<select id="transferType" onchange="transferType();" style="border-bottom:none!important;">
													<option value="">--Select--</option>
													<option value="Temporary">Temporary</option>
													<option value="Permanent">Permanent</option>
													
												</select>
											</div>
										</div>
									</div>

									<!-- text input -->
								
									</div>
									
									
									
									<div class="row" style="display: none; margin-top:13px ;" id="newExecutive">
									<div class="row justify-content-between col-md-7">
										<div class="col-md-12"><span class="crltxt">Change Lead Executive : </span> </div>
										
									</div>
									
									<div class="col-md-5">
										<div class="select dropd sltext">
											<select id="executive-transfer" onchange="getNewLead(this.value, this.options[this.selectedIndex].text, this)">
												<option value=""> Select Executive </option>
												<option th:each="c,iter:${executive}"
													th:value="${c.key}" th:text="${c.name}" th:data-code="${c.code}"></option>
																
											</select>
											
										</div>
										<div class="lead-trans col-md-12" ><span id="errorMsg"></span></div>
									</div>
									
									</div>
									
									<div class="row" id="leadOwnerDiv" style="display: none; margin-top: 15px;">
										<div class="col-md-7"><span class="crltxt">Current Executive </span>
										<div class="leadFont" id="prevLeadOwner"></div></div>
										<!--<div class="col-md-4"> -> </div> -->
										<div class="col-md-5" style="padding-left: 0px!important;"><span class="crltxt">Updated Executive </span>
										<div class="leadFont" id="newLeadOwner"></div>
									</div>
									
									<div class="row" style="display: none; margin-top: 15px;" id="fromToDiv">
									<!--<div class="col-md-7"><span class="crltxt">Start Date</span>
									<div class="col-md-4 form-group">
										<div class="form-group">
											<input type="text" id="fromDate" onchange="dateValidation()" placeholder="Start Date"
												class="form-control">
												
										
										</div>
									</div></div>
									
                                   <div class="col-md-5"><span class="crltxt">End Date</span>
									<div class="col-md-4 form-group">
										<div class="form-group calendar_box">
											<input type="text" id="toDate" onchange="dateValidation()" placeholder="End Date"
												class="form-control">
											
										</div>
									</div>
									</div>-->
									
									<div class="col-md-4 reminderBtn">
										<label>Start Date</label>
										<input type="date" id="fromDate" class="form-control"
											onchange="dateValid()">
									</div>

									<div class="col-md-4 reminderBtn">
										<label>End Date</label>
										<input type="date" id="toDate" class="form-control"
											onchange="dateValid()">
									</div>
									
									</div>
										
									 <div class="modal-footer" style="margin-top: 10px!important;">
									   <button type="button" class="btn btn-secondary" id="closeMail" onclick="closeLeadTransferModal()">Close</button>
									   <button type="button" class="btn btn-primary"  onclick="leadTransfer()">Transfer</button>
									   
									  
									 </div>
										
									</div>
								</div>
							</div>
						</div>
					
					
				</div>
			</div>
		</div>
	</div>

</body>
</html>
