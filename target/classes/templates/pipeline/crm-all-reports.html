<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/master}">

<head>
	<title>Welcome To NERP</title>
	<meta charset="utf-8">
	</meta>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	</meta>

	<!-- Inside your HTML template -->
	<script th:inline="javascript">
		/*<![CDATA[*/

		// Function to initialize the checkboxes
		function initializeCheckboxes(statusList) {
			var statusCheckboxContainer = $('#statusCheckboxContainer');
			statusCheckboxContainer.empty(); // Clear previous checkboxes

			// Dynamically create checkboxes for each status
			$.each(statusList, function (index, status) {
				var checkbox = $('<label class="form-check">').append(
					$('<input class="form-check-input status-child" id="status_' + index + '" type="checkbox">').attr('value', status.key)
				).append(
					$('<span class="form-check-label">').text(status.name)
				);
				statusCheckboxContainer.append(checkbox);
			});
		}

		// Function to initialize the checkboxes for leads by source
		function initializeSourceCheckboxes(leadList) {
			var sourceCheckboxContainer = $('#sourceCheckboxContainer');
			sourceCheckboxContainer.empty(); // Clear previous checkboxes

			// Dynamically create checkboxes for each lead source
			$.each(leadList, function (index, lead) {
				var checkbox = $('<label class="form-check">').append(
					$('<input class="form-check-input source-child" type="checkbox">').attr('value', lead.key)
				).append(
					$('<span class="form-check-label">').text(lead.name) // Set the display name as checkbox label
				);
				sourceCheckboxContainer.append(checkbox);
			});
		}

		// Function to initialize the checkboxes for Industries by source
		function initializeIndustriesCheckboxes(industries) {
			var industriesCheckboxContainer = $('#industriesCheckboxContainer');
			industriesCheckboxContainer.empty(); // Clear previous checkboxes

			// Dynamically create checkboxes for each Industry
			$.each(industries, function (index, industries) {
				var checkbox = $('<label class="form-check">').append(
					$('<input class="form-check-input industries-child" type="checkbox">').attr('value', industries.key)
				).append(
					$('<span class="form-check-label">').text(industries.name) // Set the display name as checkbox label
				);
				industriesCheckboxContainer.append(checkbox);
			});
		}

		// Function to initialize the checkboxes for Meeting Accounts by source
		function initializeMeetAccount(accounts) {
			var meetingsAccount = $('#meetingsAccount');
			meetingsAccount.empty(); // Clear previous checkboxes

			// Dynamically create checkboxes for each Accounts
			$.each(accounts, function (index, accounts) {
				var checkbox = $('<label class="form-check">').append(
					$('<input class="form-check-input accounts-child" type="checkbox">').attr('value', accounts.key)
				).append(
					$('<span class="form-check-label">').text(accounts.name)
				);
				meetingsAccount.append(checkbox);
			});
		}

		// Function to initialize the checkboxes for Deals Stages by source
		function initializeDealsStages(dealsSatges) {
			var dealsStages = $('#dealsStages');
			dealsStages.empty(); // Clear previous checkboxes
			// Dynamically create checkboxes for each Accounts
			$.each(dealsSatges, function (index, dealsSatges) {
				var checkbox = $('<label class="form-check">').append(
					$('<input class="form-check-input dealsStages-child" type="checkbox">').attr('value', dealsSatges.key)
				).append(
					$('<span class="form-check-label">').text(dealsSatges.name)
				);
				dealsStages.append(checkbox);
			});
		}

		// Function to initialize the checkboxes for Calls Accounts by source
		function initializeCallAccount(callaccounts) {
			var callsAccount = $('#callsAccount');
			callsAccount.empty(); // Clear previous checkboxes

			// Dynamically create checkboxes for each Accounts
			$.each(callaccounts, function (index, callaccounts) {
				var checkbox = $('<label class="form-check">').append(
					$('<input class="form-check-input callaccounts-child" type="checkbox">').attr('value', callaccounts.key)
				).append(
					$('<span class="form-check-label">').text(callaccounts.name)
				);
				callsAccount.append(checkbox);
			});
		}


		$(document).ready(function () {
			var statusList = /*[[${statusList}]]*/[]; // Fetch statusList from Thymeleaf
			initializeCheckboxes(statusList);
			var leadList = /*[[${leadList}]]*/[]; // Fetch SourceList from Thymeleaf
			initializeSourceCheckboxes(leadList);
			var industries = /*[[${accountNameList}]]*/[]; // Fetch IndustriesList from Thymeleaf
			initializeIndustriesCheckboxes(industries);
			var accounts = /*[[${accountNameList}]]*/[]; // Fetch AccountsList from Thymeleaf
			initializeMeetAccount(accounts);
			var dealsSatges = /*[[${stageList}]]*/[]; // Fetch Deals Stages from Thymeleaf
			initializeDealsStages(dealsSatges);
			var callaccounts = /*[[${accountNameList}]]*/[]; // Fetch AccountsList from Thymeleaf
			initializeCallAccount(callaccounts);
		});

		/*]]>*/
	</script>

</head>

														<div class="child-checkboxes callsAcc-child-checkbox"
															style="margin-left: 24px;height: 100px;overflow: scroll;">
															<div id="callsAccount"></div>
														</div>

														<label class="form-check">
															<input class="form-check-input" type="checkbox"
																onchange="callStatusChildCheckboxes(this)">
															<span class="form-check-label">
																Calls By Status
															</span>
														</label>
														<div class="child-checkboxes callstatus-child-checkbox"
															style="margin-left: 24px;height: 100px;overflow: scroll;">
															<div id="meetingsStatus">
																<label class="form-check"><input
																		class="form-check-input callStatus-child"
																		type="checkbox" value="Scheduled"><span
																		class="form-check-label">Scheduled</span>
																</label>
																<label class="form-check"><input
																		class="form-check-input callStatus-child"
																		type="checkbox" value="Deferred"><span
																		class="form-check-label">Deferred</span>
																</label>
																<label class="form-check"><input
																		class="form-check-input callStatus-child"
																		type="checkbox" value="Completed"><span
																		class="form-check-label">Completed</span>
																</label>
															</div>
														</div>

														<label class="form-check">
															<input class="form-check-input" type="checkbox"
																onchange="callsDurationChildCheckboxes(this)">
															<span class="form-check-label">
																Calls By Durations
															</span>
														</label>
														<div class="child-checkboxes callDuration-child-checkbox"
															style="margin-left: 24px;height: 100px;overflow: scroll;">
															<div id="callssDurations">
																<label class="form-check"><input
																		class="form-check-input callDuration-child"
																		type="checkbox" value="below30"><span
																		class="form-check-label">Below 30 Min.</span>
																</label>
																<label class="form-check"><input
																		class="form-check-input callDuration-child"
																		type="checkbox" value="upto30"><span
																		class="form-check-label">Upto 30 Min.</span>
																</label>
															</div>
														</div>


													</div>
												</div>
											</article>
										</div>
									</aside>
									<!--Filter Section End-->
								</div>
							</div>
						</div>

						<label class="btn btn-outline-primary" for="calls">
							<span class="tabsSpan fn-dsg">Calls Reports</span>
						</label>

						<!--Calls Tabs Ends-->

						<!--Deals Tabs Start -->
						<input name="nav" type="radio" class="nav deals-radio" id="deals"
							onclick="handleTabClick(this.id,'deals')" />
						<div class="page deals-page">
							<div class="page-contents">
								<div class="row">
									<aside class="col-sm-9">
										<div id="myGridDeals" style="width: 100%; height: 400px;"
											class="ag-theme-alpine"></div>
									</aside>

									<!--Filter Section Start-->
									<aside class="col-sm-3">
										<div class="card">
											<article class="card-group-item">
												<header class="card-header d-flex justify-content-between">
													<h6 class="title lead-titles">Filters</h6>
													<button class="btn btn-primary filter-btn" onclick="filterDeals();"
														title="Filter Report" style="margin-left: 48px;">
														Filter</button>
													<button class="btn btn-danger reset-btn" id="deals"
														onclick="resetFilters(this.id);" title="Reset Filter">
														Reset</button>
													<button class="btn btn-primary filter-btn" id="deals"
														onclick="downloadReport(this.id);" title="Download Report"
														style="background-color: #3dc400!important;"><i
															class="fa fa-download" aria-hidden="true"></i></button>
												</header>
												<div class="filter-content">
													<div class="card-body">
														<form>
															<div class="d-flex mb-2">
																<label for="fromdate" class="w-50"><span>From</span>
																	<input class="hsp-filt-date form-control"
																		type="date" id="fromdateDeals" name="from-date"
																		onchange="dateValidation(this.id);">
																</label>
																<label for="todate" class="w-50"><span>To</span>
																	<input class="hsp-filt-date form-control"
																		type="date" id="todateDeals" name="to-date"
																		onchange="dateValidation(this.id);">
																</label>
															</div>

														</form>
													</div>
												</div>
											</article>

											<article class="card-group-item">
												<header class="card-header">
													<h6 class="title lead-titles">Choose Range</h6>
												</header>
												<div class="filter-content">
													<div class="card-body">

														<label class="form-check"
															style="padding-left: 0!important;margin-top: -10px;">
															<span class="form-check-label">Deals By
																Amount</span>
														</label>

														<div class="wrapper" style="margin-top: 12px;">
															<div class="price-input d-flex align-items-center">
																<div class="field">
																	<span>Min</span>
																	<input type="number" class="input-min" value="0">
																</div>
																<div class="separator">-</div>
																<div class="field">
																	<span>Max</span>
																	<input type="number" class="input-max"
																		value="1000000000">
																</div>
															</div>
															<div class="slider mt-3">
																<div class="progress"></div>
															</div>
															<div class="range-input mt-3">
																<input type="range" class="range-min" min="0"
																	max="1000000000" value="0" step="1000000">
																<input type="range" class="range-max" min="0"
																	max="1000000000" value="1000000000" step="1000000">
															</div>
														</div>

													</div>
												</div>
											</article>
											<article class="card-group-item">
												<header class="card-header">
													<h6 class="title lead-titles">Choose type</h6>
												</header>
												<div class="filter-content">
													<div class="card-body">
														<label class="form-check">
															<input class="form-check-input" type="checkbox" value=""
																onchange="dealsStagesChildCheckboxes(this)">
															<span class="form-check-label">
																Deals By Stage
															</span>
														</label>
														<div class="child-checkboxes dealsStages-child-checkbox"
															style="margin-left: 24px;height: 100px;overflow: scroll;">
															<div id="dealsStages"></div>
														</div>

														<label class="form-check">
															<input class="form-check-input" type="checkbox"
																id="thisMonthDeals" value="thisMonthDeals">
															<span class="form-check-label">
																Deals Closing this Month
															</span>
														</label>
													</div>
												</div>
											</article>
										</div>
									</aside>
									<!--Filter Section End-->
								</div>
							</div>
						</div>
						<label class="btn btn-outline-primary" for="deals">
							<span class="fn-dsg">Deals Reports</span>
						</label>
					</div>
					<!--Deals Tabs Ends -->

					<!--Reports Tabs end-->
				</div>
			</div>
		</div>
	</div>
</body>

</html>
