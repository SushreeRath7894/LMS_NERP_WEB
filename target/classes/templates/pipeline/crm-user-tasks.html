	<link href="../css/ncrm/admin/admin-task-assign.css" rel="stylesheet">
	<script src="../javaScript/crm/admin/crm-user-tasks.js"></script>
	<script src="../javaScript/crm/notification.js"></script>
</head>

<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

						</symbol>
						<symbol id="info-fill" fill="currentColor" viewBox="0 0 16 16">
							<path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" />
						</symbol>
						<symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
							<path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
						</symbol>
					</svg>

					<div class="email-alert collapse">
						<div class="alert alert-success col-md-12 d-flex justify-content-center" id="alert"
							role="alert">
							<svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Success:">
								<use xlink:href="#check-circle-fill" />
							</svg>
							<div>
								Mail Sent Successfully
							</div>
						</div>
					</div>


					<!-- Mail Alert Ends-->
					<div class="loader-backdrop">
						<div class="spinner-border custom-color " id="customLoad"></div>
					</div>
					<input style="display: none;" id="userId" th:value="${userId}" />

					<div class="d-flex justify-content-between flex-wrap">
						<!--<div class="col-md-2 btn-hs">
						<div class="font-design" id="totalTask">
							ALL TASKS (<span></span>)

						</div>

						<div class="col-md-2 btn-hs">
							<div class="font-design" id="totalTask">
								ALL TASKS (<span></span>)
							</div>
						</div>

						<div class="col-md-4 btn-hs" id="searchRowDiv">
							<div class="input-style">
								<input type="text" placeholder="Search.." name="search" class="searchboxinput"
									onkeyup="cancelBar()" oninput="onQuickFilterChanged()" id="quickFilter">
								<div class="searchicon">
									<a href="javascript:void(0)">
										<span style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey" onclick="resetQuickFilter()" class="close_i">
											<i class="ti-close srchicon"></i>
										</span>
									</a>
									<a href="javascript:void(0)">
										<i class="ti-search srchicon"></i>
									</a>
								</div>
							</div>
						</div>



						<!--<div class="col-md-2 marg-tp">
	                      <div class="form-group exe">
	                        
	                        <div class="select dropd">
								<select id="executive" onchange="getLeadDetails(this.value)">
										<option value="">--Select Executive--</option>
											<option th:each="c,iter:${executive}"
												th:value="${c.key}" th:text="${c.name}" th:selected="${iter.index == 0}"></option>
														
								</select>
							</div>
	                      </div>
	                    </div>-->

						<div class="buttonsec btn-hs d-flex">

							<!--<button class="btn2" id="taskAssign" onclick="openTaskNav()" style="background: #6A2BBF!important;"><strong>Add Task</strong></button>-->
							<!--<button class="btn3" id="deleteLead" onclick="deleteLeadInfo()"><strong>DELETE</strong></button>-->



						</div>
					</div>

					<div class="crm-container">
						<div id="task-grid-contain">
							<div class="main-body p-0">
								<div class="inner-wrapper">
									<div id="myGridTask" style="width: 100%; height: 400px;" class="ag-theme-alpine">
									</div>

								</div>
							</div>
						</div>

						<!-- The Modal -->
						<div class="modal" id="myModal">
							<div class="modal-dialog">
								<div class="modal-content">

									<!-- Customized Modal Header -->
									<div class="modal-header">
										<h4 class="modal-title">Reject Task</h4>
										<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
									</div>

									<!-- Customized Modal body -->
									<div class="modal-body">
										<p><strong>You are about to reject the assigned task. Please provide a brief
												reason for the rejection:</strong></p>
										<textarea id="rejectionReason" class="form-control" rows="4"
											placeholder="Enter your rejection reason"></textarea>
										<div id="errorMsg" style="color: red;font-weight: 600; font-size: 11px;"></div>
									</div>

									<!-- Customized Modal footer -->
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary"
											data-bs-dismiss="modal">Cancel</button>
										<button type="button" class="btn btn-danger"
											onclick="confirmRejectTask()">Reject Task</button>
									</div>

								</div>
							</div>
						</div>


						<!-- Side Nav for Task-->
						<div id="crm-task-sidenav" class="hide-crm-task-sidenav">
							<div class="slidebox">
								<div class="row">
									<div class="col-md-10">
										<input style="display: none;" id="taskId" />
										<div class="edit" id="heading">Assign Task</div>
									</div>
									<div class="col-md-2">
										<div class="arrow">
											<a href="javascript:void(0)" class="closebtn" onclick="crmTaskCloseNav()"><i
													class="ti-arrow-right"></i></a>
										</div>
									</div>

									<div class="chartbtnsec2">
										<div align="right">

											<button class="btn1 deflx-btn" id="assignedLead" onclick="createTaskLead()">CREATE
												LEAD</button>
											<button class="btn1 deflx-btn" id="saveBtn"
												onclick="saveStatus()">SAVE</button>
											<!--<button class="btn3" id="rejectTsk" onclick="rejectTask()">Reject TASK</button> -->
											<button class="btn3 deflx-btn" onclick="crmTaskCloseNav()">CANCEL</button>

										</div>
									</div>

									<div class="col-md-12">
										<div class="form-group">

											<label>Title</label> <input type="text" class="form-control" id="title"
												placeholder="Title">

										</div>
									</div>

									<div class="col-md-6">
										<div class="form-group">

											<label>Lead First Name</label> <input type="text" class="form-control"
												id="leadFirstName" placeholder="First Name">

										</div>
									</div>

									<div class="col-md-6">
										<div class="form-group">

											<label>Lead Last Name</label> <input type="text" class="form-control"
												id="leadLastName" placeholder="Last Name">

										</div>
									</div>

									<div class="col-md-6">
										<div class="form-group">

											<label>Lead Mobile No.</label> <input type="text" class="form-control"
												id="leadMobile" placeholder="Mobile No.">

										</div>
									</div>

									<div class="col-md-6">
										<label>Executive Name</label>
										<div class="select"><select id="executive" class="form-control">
												<option value="">--Select Executive--</option>
												<option th:each="c:${executive}" th:value="${c.key}" th:text="${c.name}"
													th:data-code="${c.code}"></option>

											</select></div>
									</div>


									<div class="col-md-6">
										<label>Priority</label>
										<div class="select"><select id="priority" class="form-control">
												<option value="">Select Priority</option>
												<option value="1">High</option>
												<option value="2">Medium</option>
												<option value="3">Low</option>
											</select></div>
									</div>


									<div class="col-md-6">
										<label>Status</label>
										<div class="select"><select id="status" class="form-control"
												onchange="getOptions(this);">
												<option value="">Select Status</option>
												<option th:each="c:${status}" th:value="${c.key}" th:text="${c.name}">
												</option>
											</select></div>
									</div>

									<div class="col-md-12">
										<div class="form-group">
											<label>Description</label>
											<textarea id="commentck" onkeyup="textCount(event)"></textarea>
											<div class='formValidation desc-task-error' style="display: none;"></div>
										</div>
									</div>





								</div>

							</div>
						</div>




					</div>


				</div>
			</div>
		</div>
	</div>



</body>

</html>
