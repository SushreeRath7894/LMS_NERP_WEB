<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="pvariant">
<head>
<script>
	var columnDefspVariant = [{
	        headerName: "Order",
	        field: "variantOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Variant Name",
	        field: "variantName",
	        flex: 2,
	    }, 
	    {
	        headerName: "Sub-Category Name",
	        field: "subCategoryName",
	        flex: 2,
	    }, 
	    {
	        headerName: "Category Name",
	        field: "categoryName",
	        flex: 1,
	    },
	    {
	        headerName: "Status",
	        field: "variantStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.variantStatus == "Active") {
	                return '<div style="color:green">' + params.data.variantStatus + '</div>';
	            } else {
	                return '<div>' + params.data.variantStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptionspVariant = {
		    columnDefs: columnDefspVariant,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionpVariant,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.variantId;
			}
		};
	$(document).ready(() => {
		getpVariantData();
	})

	function onSelectionpVariant() {

	    var selectedNodes = gridOptionspVariant.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);

	    if(selectedNodes.length > 0) {
	    	$('#pvariantOrder').val(selectedData.map(node => node.variantOrder));
		    $('#pcategoryIdV').val(selectedData.map(node => node.categoryId));
		    // $('#subCategoryIdV').val(selectedData.map(node => node.subCategoryId));
		    $('#pvariantName').val(selectedData.map(node => node.variantName));
		    $('#pvariantId').val(selectedData.map(node => node.variantId));
		    $('#pvariantStatus').val(selectedData.map(node => node.variantStatus));
		    getpSubCatData(selectedData.map(node => node.subCategoryId));
		    if (selectedData.map(node => node.variantStatus) == "Active") {
		        $('#pvariantStatus').val("1");
		    } else if(selectedData.map(node => node.variantStatus) == "") {
		    	$('#pvariantStatus').val("1");
		    } else {
		        $('#pvariantStatus').val("0");
		    }
		    $("#resetpVariantBtn").attr("disabled",true);
		    $("#deletepVariantBtn").attr("disabled",false);
	    } else {
	    	enableFieldspVariant()
	    }
	    
	}
	function enableFieldspVariant() {
		$('#pvariantOrder,#pcategoryIdV,#psubCategoryIdV,#pvariantName,#pvariantStatus').attr('disabled',false);
	}
	function openAddSectionpVariant() {
		enableFieldspVariant();
		$('#pvariantId,#pvariantOrder,#pvariantName').val('');
		$("#psubCategoryIdV").empty();
		$("#psubCategoryIdV").append('<option value="ABC">Select</option>');
		$('#pcategoryIdV').val('ABC');
		$('#psubCategoryIdV').val('ABC');
		$('#pvariantStatus').val('1');
		$("#resetpVariantBtn").attr("disabled",false);
		$("#deletepVariantBtn").attr("disabled",true);
		gridOptionspVariant.api.deselectAll();
	}
	function resetpVariant() {
		if(!$("#pvariantId").val()) {
			$('#pvariantId,#pvariantOrder,#pvariantName').val('');
			$('#pcategoryIdV').val('ABC');
			$('#psubCategoryIdV').val('ABC');
			$('#pvariantStatus').val('1');
		}
	}

	function savepVariant() {
		
		/* if($("#variantOrder").val() == null || $("#variantOrder").val() == '') {
			toastr.error("Variant order required");
			return;
		} */
		if($("#pcategoryIdV").val() == null || $("#pcategoryIdV").val() == '' || $("#pcategoryIdV").val() == 'ABC') {
			toastr.error("Category required");
			return;
		}
		if($("#psubCategoryIdV").val() == null || $("#psubCategoryIdV").val() == '' || $("#psubCategoryIdV").val() == 'ABC') {
			toastr.error("Sub-Category required");
			return;
		}
		if($("#pvariantName").val() == null || $("#pvariantName").val() == '') {
			toastr.error("Variant name required");
			return;
		}
		if($("#pvariantStatus").val() == null || $("#pvariantStatus").val() == '') {
			toastr.error("Variant status required");
			return;
		}

	    var data19 = {};
	    
	    data19.variantId = $("#pvariantId").val();
	    data19.categoryId = $("#pcategoryIdV").val();
	    data19.subCategoryId = $("#psubCategoryIdV").val();
	    data19.variantOrder = $("#pvariantOrder").val();
	    data19.variantName = $("#pvariantName").val();
	    data19.variantStatus = $("#pvariantStatus").val();
	    data19.type = "pvariant";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getpVariantData();
	            	resetpVariant();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deletepVariant() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#pvariantId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-data?id=" + id + "&type=pvariant" ,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getpVariantData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	function getpSubCatData(subcat="ABC") {
		var id = $('#pcategoryIdV').val();
		$("#psubCategoryIdV").empty();
		$("#psubCategoryIdV").append('<option value="ABC">Select</option>');
		$.ajax({
	        type: "GET",
	        url: "/configuration/getProjectSubCatData?id="+id ,
	        dataType: "json",
	        contentType: "application/json",
	        success: function(response) {
	            if (response.code == "success") {
	            	let data = response.body;
	            	if(data && data.length > 0) {
	            		for(let i = 0; i < data.length; i++) {
	            			$("#psubCategoryIdV").append('<option value="'+data[i].key+'">'+data[i].name+'</option>'); 
	            		}
	            		$("#psubCategoryIdV").val(subcat);
	            	}
	            }
	        },
	        error: function(response) {
	            console.log(response);
	        }
	    })
	}
	
	function getpVariantData() {
		agGrid.simpleHttpRequest({
            url: '/configuration/view-master-data?type=pvariant'
        }).then(function(data) {
        	let dataSet = [];
        	$('#pvariantOrder,#pvariantName,#pvariantStatus,#pcategoryIdV,#psubCategoryIdV').attr('disabled',true);
	        if (data.length > 0) {
	        	gridOptionspVariant.api.setRowData(data);
	        	gridOptionspVariant.api.getRowNode(data[0].variantId).setSelected(true);
	        } else {
	        	gridOptionspVariant.api.setRowData(dataSet);
	        	$("#deletepVariantBtn").attr("disabled",true);
	        	$('#pvariantId,#pvariantOrder,#pvariantName').val('');
				$('#pcategoryIdV').val('ABC');
				$('#psubCategoryIdV').val('ABC');
				$('#pvariantStatus').val('1');
	        }
        });
		$('#pvariantOrder,#pcategoryIdV,#psubCategoryIdV,#pvariantName,#pvariantStatus').attr('disabled',true);
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridpVariant');
	    new agGrid.Grid(gridDiv, gridOptionspVariant);
	})
</script>
</head>
<body>
	<h6>Project Variant List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionpVariant()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldspVariant()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletepVariantBtn" class="btn  edit-btn"
								onclick="deletepVariant()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridpVariant" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Project Variant</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="savepVariant()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetpVariantBtn" class="btn  edit-btn" onclick="resetpVariant()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="pvariantOrder">
			</div>
		</div>
		
		<div class="col-md-3">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="pvariantName"> <input
					type="hidden" id="pvariantId">
			</div>
		</div>
		
		<div class="col-md-3">
			<div class="form-group">
				<label>Category <span class="mandatory">*</span></label>
				<div class="select">
					<select id="pcategoryIdV" class="form-control" onchange="getpSubCatData('ABC')">
						<option value="ABC">Select</option>
						<option th:each="a : ${pcategoryList}" th:value="${a.key}" th:text="${a.name}"></option>
					</select>
				</div>
			</div>
		</div>
		
		<div class="col-md-3">
			<div class="form-group">
				<label>Sub-Category <span class="mandatory">*</span></label>
				<div class="select">
					<select id="psubCategoryIdV" class="form-control">
						<option value="ABC">Select</option>
					</select>
				</div>
			</div>
		</div>

		<div class="col-md-3">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="pvariantStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
