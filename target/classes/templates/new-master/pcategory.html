<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="pcategory">
<head>
<meta charset="UTF-8">
<script>
	var columnDefspCategory = [{
	        headerName: "Order",
	        field: "categoryOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Category Name",
	        field: "categoryName",
	        flex: 5,
	    }, {
	        headerName: "Status",
	        field: "categoryStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.categoryStatus == "Active") {
	                return '<div style="color:green">' + params.data.categoryStatus + '</div>';
	            } else {
	                return '<div>' + params.data.categoryStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptionspCategory = {
		    columnDefs: columnDefspCategory,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionpCategory,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.categoryId;
			}
		};
	$(document).ready(() => {
		getpCategoryData();
	})

	function onSelectionpCategory() {

	    var selectedNodes = gridOptionspCategory.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    
	    if(selectedData && selectedData.length > 0) {
	    	$('#pcategoryOrder').val(selectedData.map(node => node.categoryOrder));
		    $('#pcategoryName').val(selectedData.map(node => node.categoryName));
		    $('#pcategoryId').val(selectedData.map(node => node.categoryId));
		    $('#pcategoryStatus').val(selectedData.map(node => node.categoryStatus));
		    
		    if (selectedData.map(node => node.categoryStatus) == "Active") {
		        $('#pcategoryStatus').val("1");
		    } else if(selectedData.map(node => node.categoryStatus) == "") {
		    	$('#pcategoryStatus').val("1");
		    } else {
		        $('#categoryStatus').val("0");
		    }
		    $("#resetpCategoryBtn").attr("disabled",true);
		    $("#deletepCatBtn").attr("disabled",false);
	    }
	    
	}
	function enableFieldspCat() {
		$('#pcategoryOrder,#pcategoryName,#pcategoryStatus').attr('disabled',false);
	}
	function openAddSectionpCat() {
		enableFieldspCat();
		$('#pcategoryId,#pcategoryOrder,#pcategoryName').val('');
		$('#pcategoryStatus').val('1');
		$("#resetpCategoryBtn").attr("disabled",false);
		$("#deletepCatBtn").attr("disabled",true);
		gridOptionspCategory.api.deselectAll();
	}
	function resetpCategory() {
		if(!$("#pcategoryId").val()) {
			$('#pcategoryId,#pcategoryOrder,#pcategoryName').val('');
			$('#pcategoryStatus').val('1');
		}
	}

	function savepCategory() {
		
		/* if($("#categoryOrder").val() == null || $("#categoryOrder").val() == '') {
			toastr.error("Category order required");
			return;
		} */
		if($("#pcategoryName").val() == null || $("#pcategoryName").val() == '') {
			toastr.error("Category name required");
			return;
		}
		if($("#pcategoryStatus").val() == null || $("#pcategoryStatus").val() == '') {
			toastr.error("Category status required");
			return;
		}

	    var data19 = {};

	    data19.categoryId = $("#pcategoryId").val();
	    data19.categoryOrder = $("#pcategoryOrder").val();
	    data19.categoryName = $("#pcategoryName").val();
	    data19.categoryStatus = $("#pcategoryStatus").val();
	    data19.type = "pcategory";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getpCategoryData();
	            	resetpCategory();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deletepCategory() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#pcategoryId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-data?id=" + id + "&type=pcategory" ,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getpCategoryData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	function getpCategoryData() {
		agGrid.simpleHttpRequest({
            url: '/configuration/view-master-data?type=pcategory'
        }).then(function(data) {
        	let dataSet = [];
	        if (data.length > 0) {
	        	gridOptionspCategory.api.setRowData(data);
	        	gridOptionspCategory.api.getRowNode(data[0].categoryId).setSelected(true);
	        } else {
	        	gridOptionspCategory.api.setRowData(dataSet);
	        	$("#deletepCatBtn").attr("disabled",true);
	        }
        });
		$('#pcategoryOrder,#pcategoryName,#pcategoryStatus').attr('disabled',true);
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridpCategory');
	    new agGrid.Grid(gridDiv, gridOptionspCategory);
	})
</script>
</head>
<body>
	<h6>Project Category List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionpCat()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldspCat()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletepCatBtn" class="btn  edit-btn"
								onclick="deletepCategory()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridpCategory" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Project Category</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="savepCategory()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetpCategoryBtn" class="btn  edit-btn" onclick="resetpCategory()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="pcategoryOrder">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="pcategoryName"> <input
					type="hidden" id="pcategoryId">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="pcategoryStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
