<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="holidayList">
<head>
<meta charset="UTF-8">
<style>
.wh-img {
	height: 50px;
	width: 50px;
	cursor: pointer;
}
.pd-10-0 {
	padding: 10px 0px;
	display: flex;
	align-items: center;
}
.remove-url {
	font-size: 30px;
    padding-left: 10px;
    cursor: pointer;
}
.disabled-rmv-btn {
    pointer-events: none;
    opacity: 0.5;
}
</style>
<script>
	var columnDefsHL = [{
		headerName : "Holiday Id",
		field : "holidayId",
		width : 130,
		pinned: 'left',
		hide:true
	
	},{
		headerName : "Holiday Name",
		field : "holidayName" ,
		width : 200,
		pinned: 'left',
	}, {
		headerName : "From date",
		field : "fromDate",
		width : 170,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		headerName : "To Date",
		field : "toDate",
		width : 140,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		headerName : "Total Days",
		field : "totalDay",
		width : 130,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		headerName : "Year",
		field : "year",
		width : 130,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		
		headerName : "Created By",
		field : "approvedBy",
		width : 150,
		cellStyle : {
			textAlign : 'center'
		},
		hide: true,
	}
	];
	var gridOptionsHL = {
		    columnDefs: columnDefsHL,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionHL,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.holidayId;
			}
		};
	$(document).ready(() => {
		getHolidayData();
	})
	
	function getHolidayData() {
		agGrid.simpleHttpRequest({
	        url: '/configuration/get-holiday-list'
	    }).then(function(data) {
	    	let s = JSON.parse(data?.body[0]);
	        let dataSet = [];
	        if (s && s.length > 0) {
	            gridOptionsHL.api.setRowData(s);
	            gridOptionsHL.api.getRowNode(s[0].holidayId).setSelected(true);
	        } else {
	            gridOptionsHL.api.setRowData(dataSet);
	            $('#holidayId,#holidayName,#year,#fromDate,#toDate,#totalLeave').val('');
	            $("#deleteHLBtn").attr("disabled",true);
	        }
	    });
		$('#holidayName,#year,#fromDate,#toDate,#totalLeave').attr('disabled',true);
		$("#remove-btn").addClass("disabled-rmv-btn");
	}

	function onSelectionHL() {

	    var selectedNodes = gridOptionsHL.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    
	    if(selectedData && selectedData.length > 0) {
	    	 $('#holidayId').val(selectedData.map(node => node.holidayId));
		    $('#holidayName').val(selectedData.map(node => node.holidayName));
		    $('#year').val(selectedData.map(node => node.year));
		   // $('#fromDate').val(selectedData.map(node => node.fromDate));
		   // $('#toDate').val(selectedData.map(node => node.toDate));
		    $('#totalLeave').val(selectedData.map(node => node.totalDay));
		    
		    
		    
		    let fromDate = selectedData.map(node => node.fromDate)[0];
		    var parts = fromDate.split("-"); // [dd, mm, yyyy]
		    var formattedDate = parts[2] + "-" + parts[1] + "-" + parts[0]; // yyyy-mm-dd

		    $('#fromDate').val(formattedDate);
		    
		    
		    let toDate = selectedData.map(node => node.toDate)[0];
		    var parts = toDate.split("-"); // [dd, mm, yyyy]
		    var formattedDate1 = parts[2] + "-" + parts[1] + "-" + parts[0]; // yyyy-mm-dd

		    $('#toDate').val(formattedDate1);
		    
		    
		    
		    
		    $("#resetHLBtn").attr("disabled",true);
		    $("#deleteHLBtn").attr("disabled",false);
	    }

	}
	function enableFieldsHL() {
		$('#holidayName,#year,#fromDate,#toDate,#totalLeave').attr('disabled',false);
		$("#remove-btn").removeClass("disabled-rmv-btn");
	}
	function openAddSectionHL() {
		enableFieldsHL();
		$('#holidayId,#holidayName,#year,#fromDate,#toDate,#totalLeave').val('');
		
		$("#resetHLBtn").attr("disabled",false);
		$("#deleteHLBtn").attr("disabled",true);
		gridOptionsHL.api.deselectAll();
		//$("#viewIngSectionId").hide();
		
	}
	function resetHL() {
		if(!$("#holidayId").val()) {
			$('#holidayId,#holidayName,#year,#fromDate,#toDate,#totalLeave').val('');
			
			
		}
	}

	function saveHoliday() {
		
		if($("#holidayName").val() == null || $("#holidayName").val() == '') {
			toastr.error('Holiday name required')
			return;
		}
		if($("#fromDate").val() == null || $("#fromDate").val() == '') {
			toastr.error('FromDate required')
			return;
		}
		if($("#toDate").val() == null || $("#toDate").val() == '') {
			toastr.error('ToDate required')
			return;
		}
		
	    var data19 = {};

	    data19.holidayId = $("#holidayId").val();
	    data19.holidayName = $("#holidayName").val();
		data19.year = $("#year").val();
		data19.fromDate = $("#fromDate").val();
		data19.toDate = $("#toDate").val();
		data19.totalLeave = $("#totalLeave").val();
	    data19.type = "HLtype";
	    
	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message)
	            	getHolidayData();
	            } else {
	            	toastr.error(response.message)
	            }
	        },
	        error: function(response) {
	            console.log(response);
	            toastr.error("Something went wrong")
	        }
	    })
	}
	
	function deleteHoliday() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {
	        	var id = $('#holidayId').val();

	    	    $.ajax({
	    	        type: "GET",
	    	        url: "/configuration/delete-master-data?id=" + id + "&type=HL",
	    	        dataType: "json",
	    	        contentType: "application/json",
	    	        success: function(response) {
	    	            if (response.code == "success") {
	    	            	getHolidayData();
	    	            	
	    	            	toastr.success('Data deleted successfully')
	    	            } else {
	    	            	toastr.error('Something went wrong')
	    	            }
	    	        },
	    	        error: function(response) {
	    	            console.log(response);
	    	            toastr.error('Something went wrong')
	    	        }
	    	    })
	        }
	    });
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridHL');
	    new agGrid.Grid(gridDiv, gridOptionsHL);
	    
	    var selectYear = document.getElementById("year");
		var currentYear = new Date().getFullYear();
		var numberOfYears = 5;
		populateYearDropdown(selectYear, currentYear, numberOfYears);
	})
 function dateChange() {
    var fromdate = $('#fromDate').val();
    var todate = $('#toDate').val();
   
    if (fromdate !== '' && todate !== '') {
        var fromDateObj = new Date(fromdate);
        var toDateObj = new Date(todate);

        console.log(fromDateObj, "fromDateObj");
        console.log(toDateObj, "toDateObj");

        if (fromDateObj <= toDateObj) {
            var diffDays = Math.ceil((toDateObj - fromDateObj) / (1000 * 60 * 60 * 24)) + 1;
            console.log(diffDays, "leave");
            $("#totalLeave").val(diffDays);
        } else {
            setFromToDate();
        }
    }
}

	function setFromToDate() {
		toastr.error("Please choose to date greater than or equal to from date ");
		$("#fromDate").val("");
		$("#toDate").val("");
		$("#totalLeave").val("");
	} 
	function populateYearDropdown(selectElement, currentYear, numberOfYears) {
        for (var i = numberOfYears - 1; i > 0; i--) {
            var futureYearOption = document.createElement("option");
            futureYearOption.text = currentYear + i;
            futureYearOption.value = currentYear + i;
            selectElement.add(futureYearOption);
        }
        for (var i = 0; i <= numberOfYears; i++) {
            var pastYearOption = document.createElement("option");
            pastYearOption.text = currentYear - i;
            pastYearOption.value = currentYear - i;
            selectElement.add(pastYearOption);
        }
    }
</script>
</head>
<body>
	<h6>Holiday List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionHL()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsHL()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteHLBtn" class="btn  edit-btn"
								onclick="deleteHoliday()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridHL" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Holiday</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn" onclick="saveHoliday()"
								type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetHLBtn" class="btn  edit-btn" onclick="resetHL()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Holiday Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="holidayName"> <input type="hidden"
					id="holidayId">
			</div>
		</div>
		<div class="col-md-4">
			<div class="form-group">
				<label>Year <span class="mandatory">*</span></label>
				<div class="select">
					<select id="year" onblur="removeValid(event);">
						<option value=''>--SELECT--</option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-4">
			<div class="form-group calendar_box">
				<label>From Date</label> <span class="mandatory">*</span></label> <input type="date"
					class="form-control transparenttxtbox" placeholder="from date"
					id="fromDate">
			</div>
		</div>
		<div class="col-md-4">
			<div class="form-group calendar_box">
				<label>To Date</label> <span class="mandatory">*</span></label> <input type="date"
					class="form-control transparenttxtbox" placeholder="to date"
					id="toDate" onchange="dateChange();">
			</div>
		</div>
		<div class="col-md-4">
			<div class="form-group">
				<label>Total Days</label> <input type="text" class="form-control"
					id="totalLeave" autocomplete="off" onblur="removeValid(event)"
					readonly />
			</div>
		</div>
	</div>
</body>
</html>
