<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="bedType">
<head>
<meta charset="UTF-8">
</head>
	
<script>

const rowDataBtype = [
    { categoryOrder: 1, categoryName: "Alice Johnson", categoryStatus: "Active", bedDesc:"Good Quality" },
    { categoryOrder: 2, categoryName: "Bob Smith", categoryStatus: "Inactive", bedDesc:"Good Quality" },
    { categoryOrder: 3, categoryName: "Charlie Davis", categoryStatus: "Active", bedDesc:"Good Quality" },
    { categoryOrder: 4, categoryName: "Diana Prince", categoryStatus: "Active", bedDesc:"Good Quality" },
    { categoryOrder: 5, categoryName: "Ethan Brown", categoryStatus: "Inactive", bedDesc:"Good Quality" },
    { categoryOrder: 6, categoryName: "Fiona Clark", categoryStatus: "Active" , bedDesc:"Good Quality"},
    { categoryOrder: 7, categoryName: "George Wilson", categoryStatus: "Inactive", bedDesc:"Good Quality" },
    { categoryOrder: 8, categoryName: "Hannah Lee", categoryStatus: "Active", bedDesc:"Good Quality" },
    { categoryOrder: 9, categoryName: "Ian Thomas", categoryStatus: "Inactive", bedDesc:"Good Quality" },
    { categoryOrder: 10, categoryName: "Jenna White", categoryStatus: "Active", bedDesc:"Good Quality" }
];

var columnDefsBtype = [
/* {
    headerName: "Order",
    field: "categoryOrder",
    flex: 1,
    hide: true
}, */
{
    headerName: "Name",
    field: "categoryName",
    flex: 3,
},{
    headerName: "Desc",
    field: "categoryOrder",
    flex: 5,
}, {
    headerName: "Status",
    field: "categoryStatus",
    flex: 1,
    cellRenderer: function(params) {
        if (params.data.categoryStatus == "Active") {
            return '<div style="color:green">' + params.data.categoryStatus + '</div>';
        } else {
            return '<div>' + params.data.categoryStatus + '</div>';
        }
    }
}
];

var gridOptionsBType = {
	    columnDefs: columnDefsBtype,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    onSelectionChanged: onSelectionBType,
	    onRowClicked: (event) => {
	        const selectedNode = event.node;
	        if (!selectedNode.isSelected()) {
	            selectedNode.setSelected(true);
	        }
	    },
	    getRowNodeId : function(data) {
			return data.categoryId;
		}
	};
	
$(document).ready(() => {
    var gridDiv = document.querySelector('#myGridBType');
    new agGrid.Grid(gridDiv, gridOptionsBType);
    /* gridOptionsBType.api.setRowData(rowDataBtype); */

    getbTypeData();
})


function enableFieldsbType() {
	$('#btypeOrder,#btypeName,#btypeStatus,#bedDesc').attr('disabled',false);
}
	function openAddSectionbType() {
		$('#btypeOrder,#btypeName,#btypeStatus,#bedDesc').attr('disabled',false);
		$('#btypeId,#btypeOrder,#btypeName,#bedDesc').val('');
		$('#btypeStatus').val('1');
		$("#resetpTypeBtn").attr("disabled",false);
		$("#deletepTypeBtn").attr("disabled",true);
		gridOptionsBType.api.deselectAll();
	}
	function resetpType() {
		if(!$("#btypeId").val()) {
			$('#btypeId,#btypeOrder,#btypeName,#bedDesc').val('');
			$('#btypeStatus').val('1');
		}
	}

function savebType() {
		if($("#btypeName").val() == null || $("#btypeName").val() == '') {
			toastr.error("Type Name required");
			return;
		}
		if($("#btypeStatus").val() == null || $("#btypeStatus").val() == '') {
			toastr.error("Type status required");
			return;
		}
		if($("#bedDesc").val() == null || $("#bedDesc").val() == '') {
			toastr.error("Bed Description is required");
			return;
		}

	    var bedTypeData = {};

	    bedTypeData.categoryId = $("#btypeId").val();
	    bedTypeData.categoryOrder = $("#btypeOrder").val();
	    bedTypeData.categoryName = $("#btypeName").val();
	    bedTypeData.categoryStatus = $("#btypeStatus").val();
	    bedTypeData.categoryDesc = $("#bedDesc").val();
	    bedTypeData.type = "btype";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(bedTypeData),
	        success: function(response) {
	            if (response.code == "success") {
	            	console.log("Bed Type Data For Save ----->",response.body)
	            	toastr.success(response.message);
	            	getbTypeData();
	            	resetpType();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	
function getbTypeData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-master-data?type=btype' 
    }).then(function(data) {
    	
    	console.log("Bed Type Data ---->>>",data); 
    	let dataSet = [];
        if (data.length > 0) {
        	gridOptionsBType.api.setRowData(data);
        	gridOptionsBType.api.getRowNode(data[0].categoryId).setSelected(true);
        } else {
        	$("#btypeName,#btypeStatus,#bedDesc").attr("disabled",false);
        	$('#btypeId,#btypeOrder,#btypeName,#bedDesc').val('');
			$('#btypeStatus').val('1');
			gridOptionsBType.api.setRowData(dataSet);
        	$("#deletepTypeBtn").attr("disabled",true);
        }
    });
	$('#btypeOrder,#btypeName,#btypeStatus,#bedDesc').attr('disabled',true);
}

function onSelectionBType() {

    var selectedNodes = gridOptionsBType.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#btypeOrder').val(selectedData.map(node => node.categoryOrder));
	    $('#btypeName').val(selectedData.map(node => node.categoryName));
	    $('#btypeId').val(selectedData.map(node => node.categoryId));
	    $('#btypeStatus').val(selectedData.map(node => node.categoryStatus));
	    $('#bedDesc').val(selectedData.map(node => node.categoryOrder));
	    
	    if (selectedData.map(node => node.categoryStatus) == "Active") {
	        $('#btypeStatus').val("1");
	    } else if(selectedData.map(node => node.categoryStatus) == "") {
	    	$('#btypeStatus').val("1");
	    } else {
	        $('#btypeStatus').val("0");
	    }
	    $("#resetbTypeBtn").attr("disabled",true);
	    $("#deletebTypeBtn").attr("disabled",false);
    }
    
}

function deletebType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {

		    var id = $('#btypeId').val();
	
		    $.ajax({
		        type: "GET",
		        url: "/configuration/delete-master-data?id=" + id + "&type=btype" ,
		        dataType: "json",
		        contentType: "application/json",
		        success: function(response) {
		            if (response.code == "success") {
		            	toastr.success("Data deleted successfully")
		            	getbTypeData();
		            }
		        },
		        error: function(response) {
		            console.log(response);
		        }
		    })
        }
    });
}
</script>

<body>

	<h6>Bed Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionbType()" type="button">
								<i class="fas fa-plus-circle"></i> Add
								</button>
								
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsbType()">
								<i class="fas fa-edit"></i> Edit
								</button>
						</div>
						<div class="mr-0">
							<button id="deletepTypeBtn" class="btn  edit-btn"
								onclick="deletebType()" type="button">
								<i class="fa fa-trash" aria-hidden="true"></i> Delete
								</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridBType" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Bed Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn" onclick="savebType()"
								type="button">
								<i class="fas fa-save"></i> Save
								</button>
						</div>
						<div class="mr-0">
							<button id="resetpTypeBtn" class="btn  edit-btn"
								onclick="resetpType()" type="button">
								<i class="fas fa-rotate-left"></i> Reset
								</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="btypeOrder">
			</div>
		</div>
		
		<div class="row">
		<div class="col">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="btypeName"> <input type="hidden"
					id="btypeId">
			</div>
		</div>
		<div class="col">
			<div class="form-group">
				<label>Bed Desc <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Bed Description" id="bedDesc">
			</div>
		</div>
		<div class="col">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="btypeStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
		</div>

		
	</div>
</body>
</html>
