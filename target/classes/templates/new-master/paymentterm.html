<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="paymentterm">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsPaymentterm = [

    {
        headerName: "Payment Term Type",
        field: "paymentTermId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "paymentTermName",
        flex: 2,
        width: 80
    }, {
        headerName: "Description",
        field: "paymentTermDesc",
        width: 175,
        flex: 3,
    }, {
        headerName: "Status",
        field: "paymentTermStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.paymentTermStatus == "Active") {
                return '<div style="color:green">' + params.data.paymentTermStatus + '</div>';
            } else {
                return '<div>' + params.data.paymentTermStatus + '</div>';
            }
        }
    }
];

var gridOptionsPaymentterm = {
	    columnDefs: columnDefsPaymentterm,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    onSelectionChanged: onSelectionChangedPayterm,
	    onRowClicked: (event) => {
	        const selectedNode = event.node;
	        if (!selectedNode.isSelected()) {
	            selectedNode.setSelected(true);
	        }
	    },
	    getRowNodeId : function(data) {
			return data.paymentTermId;
		}

	};
	
$(document).ready(() => {

	getPayTermData();
})

function getPayTermData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-procurement-view-payment-term-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsPaymentterm.api.setRowData(data);
        	gridOptionsPaymentterm.api.getRowNode(data[0].paymentTermId).setSelected(true);
        } else {
        	gridOptionsPaymentterm.api.setRowData(dataSet);
        	$("#deletePayTermBtn").attr("disabled",true);
        }

    });
    
    $('#paymentTermName,#paymentTermDesc,#paymentTermStatus').attr('disabled',true);
}
	
function onSelectionChangedPayterm() {

    var selectedNodes = gridOptionsPaymentterm.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#paymentTermName').val(selectedData.map(node => node.paymentTermName));
        $('#paymentTermDesc').val(selectedData.map(node => node.paymentTermDesc));
        $('#paymentTermId').val(selectedData.map(node => node.paymentTermId));

        if (selectedData.map(node => node.paymentTermStatus) == "Active") {
            $('#paymentTermStatus').val("1");
        } else if(selectedData.map(node => node.paymentTermStatus) == "") {
        	$('#paymentTermStatus').val("1");
        }else {
            $('#paymentTermStatus').val("0");
        }
        $("#resetPayTermBtn").attr("disabled",true);
        $("#deletePayTermBtn").attr("disabled",false);
    }

    
}

function enableFieldsPayterm() {
	$('#paymentTermName,#paymentTermDesc,#paymentTermStatus').attr('disabled',false);
}
function openAddSectionPayterm() {
	enableFieldsPayterm();
	$('#paymentTermId,#paymentTermName,#paymentTermDesc').val('');
	$('#paymentTermStatus').val('1');
	$("#resetPayTermBtn").attr("disabled",false);
	$("#deletePayTermBtn").attr("disabled",true);
	gridOptionsPaymentterm.api.deselectAll();
}
function resetPayterm() {
	if(!$("#paymentTermId").val()) {
		$('#paymentTermId,#paymentTermName,#paymentTermDesc').val('');
		$('#paymentTermStatus').val('1');
	}
}

function savePaymentTermType() {
	
	if($("#paymentTermName").val() == null || $("#paymentTermName").val() == '') {
		toastr.error('Payment term name required');
		return;
	}
	if($("#paymentTermStatus").val() == null || $("#paymentTermStatus").val() == '') {
		toastr.error('Payment term status required');
		return;
	}

	var data7 = {};

    data7.paymentTermId = $("#paymentTermId").val();
    data7.paymentTermName = $("#paymentTermName").val();
    data7.paymentTermDesc = $("#paymentTermDesc").val();
    data7.paymentTermStatus = $("#paymentTermStatus").val();

    $.ajax({
        type: "POST",
        url: "/configuration/view-procurement-add-payment-term-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data7),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#paymentTermId").val() == null || $("#paymentTermId").val() == "" || $("#paymentTermId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getPayTermData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deletePayTermType() {
   
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {

            var id = $('#paymentTermId').val();

            $.ajax({
                type: "GET",
                url: "/configuration/view-procurement-payment-term-type-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getPayTermData();
                    	toastr.success('Data deleted successfully')
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    });
	
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid10');
    new agGrid.Grid(gridDiv, gridOptionsPaymentterm);
})

</script>
</head>
<body>
	<h6>Payment Term List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionPayterm()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsPayterm()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletePayTermBtn" class="btn  edit-btn"
								onclick="deletePayTermType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid10" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Payment Term</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="savePaymentTermType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetPayTermBtn" class="btn  edit-btn" onclick="resetPayterm()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="paymentTermName"> <input type="hidden"
					id="paymentTermId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Description</label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="paymentTermDesc">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="paymentTermStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
