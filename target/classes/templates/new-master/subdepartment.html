<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="subdepartment">
<head>
<meta charset="UTF-8">
<script>
var columnDefsSubDepartment = [{
	    headerName: "Sub-Department Name",
	    field: "subDpartId",
	    flex: 3,
	},
	{
	    headerName: "Department Name",
	    field: "subDepartmentName",
	    flex: 2,
	}, {
	    headerName: "Status",
	    field: "subDepartmentStatus",
	    flex: 1,
	    cellRenderer: function(params) {
	        if (params.data.subDepartmentStatus == "Active") {
	            return '<div style="color:green">' + params.data.subDepartmentStatus + '</div>';
	        } else {
	            return '<div>' + params.data.subDepartmentStatus + '</div>';
	        }
	    }
	}
];

var gridOptionsSubDepartment = {
	columnDefs: columnDefsSubDepartment,
	defaultColDef: {
	    sortable: true,
	    filter: true,
	    resizable: true,
	    width: 195,
	    height: 10
	},
	rowSelection: 'single',
	rowMultiSelectWithClick: true,
	onSelectionChanged: onSelectionSubDepartment,
	onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
	getRowNodeId: function(data) {
	    return data.subDepartmentId;
	}
};

$(document).ready(() => {
	getSubDeptData();
})

function getSubDeptData() {
	agGrid.simpleHttpRequest({
	    url: '/configuration/referenceHr-view-subdepartment'
	}).then(function(data) {
	    let dataSet = [];
	    if (data.length > 0) {
	        gridOptionsSubDepartment.api.setRowData(data);
	        gridOptionsSubDepartment.api.getRowNode(data[0].subDepartmentId).setSelected(true);
	    } else {
	        gridOptionsSubDepartment.api.setRowData(dataSet);
	        $("#deleteSubDeptBtn").attr("disabled", true);
	    }
	});
	$('#subdeptId,#subdepartmentName,#subdepartmentStatus').attr('disabled', true);
}

function onSelectionSubDepartment() {

	var selectedNodes = gridOptionsSubDepartment.api.getSelectedNodes();
	var selectedData = selectedNodes.map(node => node.data);
	
	if (selectedData.length > 0) {
	    $('#subdepartmentName').val(selectedData.map(node => node.subDpartId));
	
	    $('#subdeptId').val(selectedData.map(node => node.subdepartmentDept));
	
	    $('#subDepartmentId').val(selectedData.map(node => node.subDepartmentId));
	
	    $('#subdepartmentStatus').val(selectedData.map(node => node.subDepartmentStatus));
	    if (selectedData.map(node => node.subDepartmentStatus) == "Active") {
	        $('#subdepartmentStatus').val("1");
	    } else if (selectedData.map(node => node.subDepartmentStatus) == "") {
	        $('#subdepartmentStatus').val("1");
	    } else {
	        $('#subdepartmentStatus').val("0");
	    }
	    $("#resetSubDeptBtn").attr("disabled", true);
	    $("#deleteSubDeptBtn").attr("disabled", false);
	}

}

function enableFieldsSubDept() {
	$('#subdeptId,#subdepartmentName,#subdepartmentStatus').attr('disabled', false);
}

function openAddSectionSubDept() {
	enableFieldsSubDept();
	$('#subDepartmentId,#subdeptId,#subdepartmentName').val('');
	$('#subdepartmentStatus').val('1');
	$("#resetSubDeptBtn").attr("disabled", false);
	$("#deleteSubDeptBtn").attr("disabled", true);
	gridOptionsSubDepartment.api.deselectAll();
}

function resetSubDept() {
	if (!$("#subDepartmentId").val()) {
	    $('#subDepartmentId,#subdeptId,#subdepartmentName').val('');
	    $('#subdepartmentStatus').val('1');
	}
}

function saveSubDept() {
	if ($("#subdepartmentName").val() == null || $("#subdepartmentName").val() == '') {
	    toastr.error('Sub-Department name required');
	    return;
	}
	if ($("#subdeptId").val() == null || $("#subdeptId").val() == '') {
	    toastr.error('Department required');
	    return;
	}
	if ($("#subdepartmentStatus").val() == null || $("#subdepartmentStatus").val() == '') {
	    toastr.error('Sub-Department status required');
	    return;
	}
	
	var data20 = {};
	
	data20.subDepartmentId = $("#subDepartmentId").val();
	data20.subdepartmentDept = $("#subdeptId").val();
	data20.subDepartmentName = $("#subdepartmentName").val();
	data20.subDepartmentStatus = $("#subdepartmentStatus").val();
	
	$.ajax({
	    type: "POST",
	    url: "/configuration/referenceHr-add-subdepartment-master",
	    dataType: "json",
	    contentType: "application/json",
	    data: JSON.stringify(data20),
	    success: function(response) {
	        if (response.message == "Success") {
	            if ($("#subDepartmentId").val() == null || $("#subDepartmentId").val() == "" || $("#departmentId").val() == undefined) {
	                toastr.success('Data saved successfully')
	            } else {
	                toastr.success('Data updated successfully')
	            }
	            getSubDeptData();
	        }
	    },
	    error: function(response) {
	        console.log(response);
	    }
	})
}

function deleteSubDept() {

	Swal.fire({
	    title: 'Are you sure?',
	    text: 'Do you want to delete this?',
	    icon: 'warning',
	    showCancelButton: true,
	    confirmButtonText: 'Yes, delete it!',
	    cancelButtonText: 'No, keep it',
	    confirmButtonColor: 'var(--mainColor)',
	}).then((result) => {
	    if (result?.value) {
	        var id = $('#subDepartmentId').val();
	
	        $.ajax({
	            type: "GET",
	            url: "/configuration/referenceHr-subdepartment-delete?id=" + id,
	            dataType: "json",
	            contentType: "application/json",
	            success: function(response) {
	                if (response.message == "Success") {
	                    getSubDeptData();
	                    toastr.success("Data deleted successfully")
	                }
	            },
	            error: function(response) {
	                console.log(response);
	            }
	        })
	    }
	});


}

$(document).ready(() => {
	var gridDiv = document.querySelector('#myGrid3');
	new agGrid.Grid(gridDiv, gridOptionsSubDepartment);
})
</script>
</head>
<body>
	<h6>Sub-Department List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionSubDept()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsSubDept()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteSubDeptBtn" class="btn  edit-btn"
								onclick="deleteSubDept()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid3" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Sub-Department</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveSubDept()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetSubDeptBtn" class="btn  edit-btn" onclick="resetSubDept()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Sub-Department Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="subdepartmentName"><input type="hidden" id="subDepartmentId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label> Department <span class="mandatory">*</span></label>
				<div class="select">
					<select id="subdeptId">
						<option value="">--Select--</option>
						<option th:each="c,iter:${department}" th:value="${c.key}"
							th:text="${c.name}"></option>
					</select>
				</div>
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="subdepartmentStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
