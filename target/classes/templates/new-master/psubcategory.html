<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="psubcategory">
<head>
<script>
	var columnDefspSubCategory = [{
	        headerName: "Order",
	        field: "subCategoryOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Sub-Category Name",
	        field: "subCategoryName",
	        flex: 3,
	    }, 
	    {
	        headerName: "Category Name",
	        field: "categoryName",
	        flex: 2,
	    },
	    {
	        headerName: "Status",
	        field: "subCategoryStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.subCategoryStatus == "Active") {
	                return '<div style="color:green">' + params.data.subCategoryStatus + '</div>';
	            } else {
	                return '<div>' + params.data.subCategoryStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptionspSubCategory = {
		    columnDefs: columnDefspSubCategory,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionpSubCategory,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.subCategoryId;
			}
		};
	$(document).ready(() => {
		getpSubCategoryListData();
	})

	function onSelectionpSubCategory() {

	    var selectedNodes = gridOptionspSubCategory.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);

	    if(selectedNodes.length > 0) {
	    	$('#psubCategoryOrder').val(selectedData.map(node => node.subCategoryOrder));
		    $('#pcategoryIdS').val(selectedData.map(node => node.categoryId));
		    $('#psubCategoryName').val(selectedData.map(node => node.subCategoryName));
		    $('#psubCategoryId').val(selectedData.map(node => node.subCategoryId));
		    $('#psubCategoryStatus').val(selectedData.map(node => node.subCategoryStatus));
		    
		    if (selectedData.map(node => node.subCategoryStatus) == "Active") {
		        $('#psubCategoryStatus').val("1");
		    } else if(selectedData.map(node => node.subCategoryStatus) == "") {
		    	$('#psubCategoryStatus').val("1");
		    } else {
		        $('#psubCategoryStatus').val("0");
		    }
		    $("#resetpSubCatBtn").attr("disabled",true);
		    $("#deletepSubCatBtn").attr("disabled",false);
	    }
	    
	}
	function enableFieldspSub() {
		$('#psubCategoryOrder,#pcategoryIdS,#psubCategoryName,#psubCategoryStatus').attr('disabled',false);
	}
	function openAddSectionpSub() {
		enableFieldspSub();
		$('#psubCategoryId,#psubCategoryOrder,#psubCategoryName').val('');
		$('#pcategoryIdS').val('ABC');
		$('#psubCategoryStatus').val('1');
		$("#resetpSubCatBtn").attr("disabled",false);
		$("#deletepSubCatBtn").attr("disabled",true);
		gridOptionspSubCategory.api.deselectAll();
	}
	function resetpSubCat() {
		if(!$("#psubCategoryId").val()) {
			$('#psubCategoryId,#psubCategoryOrder,#psubCategoryName').val('');
			$('#pcategoryIdS').val('ABC');
			$('#psubCategoryStatus').val('1');
		}
	}

	function savepSubCategory() {
		
		/* if($("#subCategoryOrder").val() == null || $("#subCategoryOrder").val() == '') {
			toastr.error("Sub-Category order required");
			return;
		} */
		if($("#psubCategoryName").val() == null || $("#psubCategoryName").val() == '') {
			toastr.error("Sub-Category name required");
			return;
		}
		if($("#pcategoryIdS").val() == null || $("#pcategoryIdS").val() == '' || $("#pcategoryIdS").val() == 'ABC') {
			toastr.error("Category required");
			return;
		}
		if($("#psubCategoryStatus").val() == null || $("#psubCategoryStatus").val() == '') {
			toastr.error("Sub-Category status required");
			return;
		}

	    var data19 = {};

	    data19.subCategoryId = $("#psubCategoryId").val();
	    data19.categoryId = $("#pcategoryIdS").val();
	    data19.subCategoryOrder = $("#psubCategoryOrder").val();
	    data19.subCategoryName = $("#psubCategoryName").val();
	    data19.subCategoryStatus = $("#psubCategoryStatus").val();
	    data19.type = "psubcategory";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getpSubCategoryListData();
	            	resetpSubCat();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deletepSubCategory() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#psubCategoryId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-data?id=" + id + "&type=psubcategory" ,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getpSubCategoryListData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	function getpSubCategoryListData() {
		agGrid.simpleHttpRequest({
            url: '/configuration/view-master-data?type=psubcategory'
        }).then(function(data) {
        	let dataSet = [];
	        if (data.length > 0) {
	        	gridOptionspSubCategory.api.setRowData(data);
	        	gridOptionspSubCategory.api.getRowNode(data[0].subCategoryId).setSelected(true);
	        } else {
	        	gridOptionspSubCategory.api.setRowData(dataSet);
	        	$("#deletepSubCatBtn").attr("disabled",true);
	        }
        });
		$('#psubCategoryOrder,#pcategoryIdS,#psubCategoryName,#psubCategoryStatus').attr('disabled',true);
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridpSubCategory');
	    new agGrid.Grid(gridDiv, gridOptionspSubCategory);
	})
</script>
</head>
<body>
	<h6>Project Sub-Category List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionpSub()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldspSub()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletepSubCatBtn" class="btn  edit-btn"
								onclick="deletepSubCategory()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridpSubCategory" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Project Sub-Category</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="savepSubCategory()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetpSubCatBtn" class="btn  edit-btn" onclick="resetpSubCat()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-3" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="psubCategoryOrder">
			</div>
		</div>
		
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="psubCategoryName"> <input
					type="hidden" id="psubCategoryId">
			</div>
		</div>
		
		<div class="col-md-4">
			<div class="form-group">
				<label>Category <span class="mandatory">*</span></label>
				<div class="select">
					<select id="pcategoryIdS" class="form-control">
						<!-- <option value="ABC">Select</option>
						<option th:each="a : ${categoryList}" th:value="${a.key}" th:text="${a.name}"></option> -->
						
						<option value="">Select</option>
						<option th:each="c,iter:${categoryList}"
						th:value="${c.key}" th:text="${c.name}"></option>
					</select>
				</div>
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="psubCategoryStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
