<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="brandtyp">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript">
var columnDefsBrandtyp = [

    {
        headerName: "Brand Type",
        field: "brandId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Order",
        field: "brandOrder",
        flex: 1,
        hide: true
    }, {
        headerName: "Code",
        field: "brandCode",
        width: 70,
        flex: 1,
    },

    {
        headerName: "Brand Name",
        field: "brandName",
        width: 120,
        flex: 4,
    }, {
        headerName: "Status",
        field: "brandStatus",
        width: 80,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.brandStatus == "Active") {
                return '<div style="color:green">' + params.data.brandStatus + '</div>';
            } else {
                return '<div>' + params.data.brandStatus + '</div>';
            }
        }
    }
];

var gridOptionsBrandtyp = {
    columnDefs: columnDefsBrandtyp,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedBrand,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId : function(data) {
		return data.brandId;
	}

};

$(document).ready(() => {
	getBrandTypeData();
})

function getBrandTypeData() {
	agGrid.simpleHttpRequest({
        url: '/master/view-procurement-view-brand-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsBrandtyp.api.setRowData(data);
        	gridOptionsBrandtyp.api.getRowNode(data[0].brandId).setSelected(true);
        } else {
        	gridOptionsBrandtyp.api.setRowData(dataSet);
        	$("#deletBrandTypeBtn").attr("disabled",true);
        }
    });
    
    $('#brandOrder,#brandCode,#brandName,#brandStatus').attr('disabled',true);
}

function onSelectionChangedBrand() {

    var selectedNodes = gridOptionsBrandtyp.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#brandOrder').val(selectedData.map(node => node.brandOrder));
        $('#brandCode').val(selectedData.map(node => node.brandCode));
        $('#brandName').val(selectedData.map(node => node.brandName));
        $('#brandId').val(selectedData.map(node => node.brandId));


        if (selectedData.map(node => node.brandStatus) == "Active") {
            $('#brandStatus').val("1");
        } else if(selectedData.map(node => node.brandStatus) == ""){
        	$('#brandStatus').val("1");
        } else {
            $('#brandStatus').val("0");
        }
        $("#resetBrandBtn").attr("disabled",true);
        $("#deletBrandTypeBtn").attr("disabled",false);
    }
    
}

function enableFieldsBrand() {
	$('#brandOrder,#brandCode,#brandName,#brandStatus').attr('disabled',false);
}
function openAddSectionBrand() {
	enableFieldsBrand();
	$('#brandId,#brandOrder,#brandCode,#brandName').val('');
	$('#brandStatus').val('1');
	$("#resetBrandBtn").attr("disabled",false);
	$("#deletBrandTypeBtn").attr("disabled",true);
	gridOptionsBrandtyp.api.deselectAll();
}
function resetBrand() {
	if(!$("#brandId").val()) {
		$('#brandId,#brandOrder,#brandCode,#brandName').val('');
		$('#brandStatus').val('1');
	}
}

function saveBrandType() {
	
	/* if($("#brandOrder").val() == null || $("#brandOrder").val() == '') {
		toastr.error('Brand order required');
		return;
	} */
	if($("#brandCode").val() == null || $("#brandCode").val() == '') {
		toastr.error('Brand code required');
		return;
	}
	if($("#brandName").val() == null || $("#brandName").val() == '') {
		toastr.error('Brand name required');
		return;
	}
	if($("#brandStatus").val() == null || $("#brandStatus").val() == '') {
		toastr.error('Brand status required');
		return;
	}

	var data2 = {};

    data2.brandId = $("#brandId").val();
    data2.brandName = $("#brandName").val();
    data2.brandOrder = $("#brandOrder").val();
    data2.brandCode = $("#brandCode").val();
    data2.brandStatus = $("#brandStatus").val();

    $.ajax({
        type: "POST",
        url: "/master/view-procurement-add-brand-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data2),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#brandId").val() == null || $("#brandId").val() == "" || $("#brandId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getBrandTypeData();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}
function deleteBrandType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {
        	var id = $('#brandId').val();

            $.ajax({
                type: "GET",
                url: "/master/view-procurement-brand-type-delete?id=" + id,
                dataType: "json",
                contentType: "application/json",
                success: function(response) {
                    if (response.message == "Success") {
                    	getBrandTypeData();
                    }
                },
                error: function(response) {
                    console.log(response);
                }
            })
        }
    });
}
$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid14');
    new agGrid.Grid(gridDiv, gridOptionsBrandtyp);
})
</script>
</head>
<body>
	<h6>Brand Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionBrand()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsBrand()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletBrandTypeBtn" class="btn  edit-btn"
								onclick="deleteBrandType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid14" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Brand Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveBrandType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetBrandBtn" class="btn  edit-btn" onclick="resetBrand()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-3" style="display:none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Order"
					id="brandOrder"> <input type="hidden" id="brandId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Code <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Code"
					id="brandCode">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="brandName">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
				 <select id="brandStatus" class="form-control">
					<option value="">Select</option>
					<option value="1">Active</option>
					<option value="0">Inactive</option>
				</select></div>
			</div>
		</div>
	</div>
</body>
</html>
