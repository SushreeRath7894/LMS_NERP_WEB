<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="insuranceProvider">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
$(document).ready(() => {
    var gridDiv = document.querySelector('#myGridInsrncProvider');
    new agGrid.Grid(gridDiv, gridOptionsInsrncPrvdrtyp);
    getInsurncProvdrType();
    getinsurance('');
});

var columnDefsInsurancePrvdrtyp = [
    {
        headerName: "Insurance Provider Type",
        field: "insurancePrvdrId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Insurance Provider Name",
        field: "insurancePrName",
        flex: 2,
        width: 80
    },
    {
        headerName: "Insurance Name",
        field: "insurancePrvdrName",
        width: 175,
        flex: 3,
    },
    ,
    {
        headerName: "Insurance Id",
        field: "insurancePrvdrCreatedBy",
        width: 175,
        flex: 3,
        hide:true
    },
    {
        headerName: "Amount",
        field: "insuranceAmount",
        width: 175,
        flex: 3,
    },
    {
        headerName: "From Date",
        field: "insurancefrmdt",
        width: 175,
        flex: 3,
        cellClass: 'my-center-cell-class' 
    },
    {
        headerName: "To Date",
        field: "insurancetodt",
        width: 175,
        flex: 3,
        cellClass: 'my-center-cell-class' 
    }
];

var gridOptionsInsrncPrvdrtyp = {
	    columnDefs: columnDefsInsurancePrvdrtyp,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    onSelectionChanged: onSelectionChangedInsurancePrvdr,
	    onRowClicked: (event) => {
	        const selectedNode = event.node;
	        if (!selectedNode.isSelected()) {
	            selectedNode.setSelected(true);
	        }
	    },
	    getRowNodeId : function(data) {
			return data.insurancePrvdrId;
		}

	};
	
function onSelectionChangedInsurancePrvdr() {
    var selectedNodes = gridOptionsInsrncPrvdrtyp.api.getSelectedNodes();
    if (!selectedNodes.length) return; // If no row is selected, exit

    var selectedData = selectedNodes[0].data; // Get the first selected row
    // Set form values
   getinsurance(selectedData.insurancePrvdrId);
    
    $('#insurancePrvdrName').val(selectedData.insurancePrName);
    $('#insurncId').val(selectedData.insurancePrvdrCreatedBy);
    $('#insurancePrvdrId').val(selectedData.insurancePrvdrId);
    $('#insuranceAmount').val(selectedData.insuranceAmount);
    $('#insurancefrmdt').val(selectedData.insurancefrmdt);
    $('#insurancetodt').val(selectedData.insurancetodt);

    // Enable/disable buttons based on selection
    $("#resetInsurncProvdrBtn").attr("disabled", true);
    $("#deleteInsurncProvdrBtn").attr("disabled", false);
}
	
function enableFieldsInsurncProvdr() {
	$('#insurancePrvdrName,#insurncId,#insuranceAmount,#insurancefrmdt,#insurancetodt').attr('disabled',false);
}

function openAddSectionInsurncProvdr(){
	enableFieldsInsurncProvdr();
	$('#insurancePrvdrId,#insurancePrvdrName,#insurncId,#insuranceAmount,#insurancefrmdt,#insurancetodt').val('');
	//$('#insuranceStatus').val('1');
	$("#resetInsurncProvdrBtn").attr("disabled",false);
	$("#deleteInsurncProvdrBtn").attr("disabled",true);
	gridOptionsInsrncPrvdrtyp.api.deselectAll();
	
}

function resetInsurncProvdrtyp() {
	if(!$("#insurancePrvdrId").val()) {
		$('#insurancePrvdrId,#insurancePrvdrName,#insurncId,#insuranceAmount,#insurancefrmdt,#insurancetodt').val('');
		//$('#insuranceStatus').val('1');
	}
}

function getInsurncProvdrType() {
	agGrid.simpleHttpRequest({
        url: '/master/view-insuranceProvdr-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsInsrncPrvdrtyp.api.setRowData(data);
        	gridOptionsInsrncPrvdrtyp.api.getRowNode(data[0].insurancePrvdrId).setSelected(true);
        } else {
        	gridOptionsInsrncPrvdrtyp.api.setRowData(dataSet);
        	$("#deleteInsurncProvdrBtn").attr("disabled",true);
        }
    });
    
    $('#insurancePrvdrId,#insurancePrvdrName,#insurncId,#insuranceAmount,#insurancefrmdt,#insurancetodt').attr('disabled',true);
}

function saveInsurncProvdrType() {
	
	if($("#insurancePrvdrName").val() == null || $("#insurancePrvdrName").val() == '') {
		toastr.error('Insurance Provider name required')
		return;
	}
	if($("#insurncId").val() == null || $("#insurncId").val() == '') {
		toastr.error('Insurance Name type required')
		return;
	}
	/* if($("#insurancePrvdrId").val() == null || $("#insurancePrvdrId").val() == '') {
		toastr.error('Insurance Provider required')
		return;
	} */ 
	if($("#insuranceAmount").val() == null || $("#insuranceAmount").val() == '') {
		toastr.error('Insurance Amount required')
		return;
	}
	if($("#insurancefrmdt").val() == null || $("#insurancefrmdt").val() == '') {
		toastr.error('Insurance From Date required')
		return;
	}
	if($("#insurancetodt").val() == null || $("#insurancetodt").val() == '') {
		toastr.error('Insurance To Date required')
		return;
	}

    var data19 = {};

    data19.insurancePrvdrId = $("#insurancePrvdrId").val();
    data19.insurancePrvdrName = $("#insurancePrvdrName").val();
    data19.insurancePrName = $("#insurncId").val();
    data19.insuranceAmount = $("#insuranceAmount").val();
    data19.insurancefrmdt = $("#insurancefrmdt").val();
    data19.insurancetodt = $("#insurancetodt").val();
    
    $.ajax({
        type: "POST",
        url: "/master/add-insuranceProvider-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data19),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#insurancePrvdrId").val() == null || $("#insurancePrvdrId").val() == "" || $("#insurancePrvdrId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	//toastr.success(response.message)
            	getInsurncProvdrType();
            	resetInsurncProvdrtyp();
            } else {
            	toastr.error(response.message)
            }
        },
        error: function(response) {
            console.log(response);
            toastr.error("Something went wrong")
        }
    })
}

function getinsurance(id = '') {
    var $dropdown = $("#insurncId");

    // If ID is provided, set the value directly and return (No AJAX call)
    if (id) {
        $dropdown.val(id);
        return;
    }

    // If no ID is provided, fetch data via AJAX
    $.ajax({
        type: "GET",
        url: "master/add-insurance-Name",
        success: function(response) {
            if (response.message === "Success") {
                $dropdown.empty(); // Clear existing options

                // Add default "Select" option
                $dropdown.append($("<option></option>").val('').text("Select"));

                // Populate dropdown with fetched options
                response.body.forEach(function(item) {
                    $dropdown.append($("<option></option>").val(item.key).text(item.name));
                });

                // If ID was passed after AJAX call, select it
                if (id) {
                    $dropdown.val(id);
                }
            }
        },
        error: function(e) {
            $dropdown.empty().append($("<option></option>").val('').text("Select"));
        }
    });
}



function deleteInsurncProvdrType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {
    
		    var id = $('#insurancePrvdrId').val();
		
		    $.ajax({
		        type: "GET",
		        url: "/master/insurancePrvdr-type-delete?id=" + id,
		        dataType: "json",
		        contentType: "application/json",
		        success: function(response) {
		            if (response.message == "Success") {
		            	getInsurncProvdrType();
		            	toastr.success('Data deleted successfully')
		            }
		        },
		        error: function(response) {
		            console.log(response);
		        }
		    })
	    
        }
	    
       });
}
</script>
</head>
<body>
<h6>Insurance Provider</h6>
<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionInsurncProvdr()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsInsurncProvdr()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteInsurncProvdrBtn" class="btn  edit-btn"
								onclick="deleteInsurncProvdrType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridInsrncProvider" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	
	<h6>Add Insurance Provider</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveInsurncProvdrType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetInsurncProvdrBtn" class="btn  edit-btn" onclick="resetInsurncProvdrtyp()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">

		<div class="col-md-4">
			<div class="form-group">
				<label>Insurance Provider Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name" 
					id="insurancePrvdrName"> <input type="hidden" id="insurancePrvdrId">
			</div>
		</div>
		<div class="col-md-4">
			<div class="form-group">
				<label>Insurance Name <span class="mandatory">*</span></label>
				<div class="select">
					<select id=insurncId class="form-control">
						<option value="">Select</option>
						<!-- <option th:each="a: ${insurance}" th:value="${a.key}" th:text="${a.name}"></option> -->
					</select>
				</div>
			</div>
		</div> 
		<div class="col-md-4">
			<div class="form-group">
				<label>Amount <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="amount"
					id="insuranceAmount">
			</div>
		</div>
		
		<div class="col-md-4">
			<div class="form-group">
				<label>From Date <span class="mandatory">*</span></label> <input type="date"
					class="form-control transparenttxtbox" placeholder="from date"
					id="insurancefrmdt">
			</div>
		</div>
		<div class="col-md-4">
			<div class="form-group">
				<label>To Date <span class="mandatory">*</span></label> <input type="date"
					class="form-control transparenttxtbox" placeholder="to date"
					id="insurancetodt">
			</div>
		</div>

	</div>
</body>
</html>
