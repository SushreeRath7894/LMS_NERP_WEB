<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="warehouse">
<head>
<meta charset="UTF-8">
<style>
.wh-img {
	height: 50px;
	width: 50px;
	cursor: pointer;
}
.pd-10-0 {
	padding: 10px 0px;
	display: flex;
	align-items: center;
}
.remove-url {
	font-size: 30px;
    padding-left: 10px;
    cursor: pointer;
}
.disabled-rmv-btn {
    pointer-events: none;
    opacity: 0.5;
}
</style>
<script>
	var columnDefsW = [{
	        headerName: "Name",
	        field: "wName",
	        flex: 1,
	    },
	    {
	        headerName: "Type",
	        field: "wTypeName",
	        flex: 1,
	    }, 
	    {
	        headerName: "Department",
	        field: "wDeptName",
	        flex: 1,
	    }, 
	    {
	        headerName: "Address",
	        field: "fullAddress",
	        flex: 3,
	    }, 
	    {
	        headerName: "Status",
	        field: "wStatusName",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.wStatusName == "Active") {
	                return '<div style="color:green">' + params.data.wStatusName + '</div>';
	            } else {
	                return '<div>' + params.data.wStatusName + '</div>';
	            }
	        }
	    }
	];
	var gridOptionsW = {
		    columnDefs: columnDefsW,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionW,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.wId;
			}
		};
	$(document).ready(() => {
		getWarehouseData();
	})
	
	function getWarehouseData() {
		agGrid.simpleHttpRequest({
	        url: '/configuration/get-warehouse-list'
	    }).then(function(data) {
	    	let s = JSON.parse(data?.body[0]);
	        let dataSet = [];
	        if (s.length > 0) {
	            gridOptionsW.api.setRowData(s);
	            gridOptionsW.api.getRowNode(s[0].wId).setSelected(true);
	        } else {
	            gridOptionsW.api.setRowData(dataSet);
	            $("#deleteWBtn").attr("disabled",true);
	        }
	    });
		$('#wName,#wTypeId,#wCountryId,#wCity,#wStateId,#wAddress,#wVirtual,#wStatus,#fileUpload,#wDeptId').attr('disabled',true);
		$("#remove-btn").addClass("disabled-rmv-btn");
	}

	function onSelectionW() {

	    var selectedNodes = gridOptionsW.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    
	    if(selectedData && selectedData.length > 0) {
	    	$('#wName').val(selectedData.map(node => node.wName));
		    $('#wTypeId').val(selectedData.map(node => node.wTypeId));
		    $('#wId').val(selectedData.map(node => node.wId));
		    $('#wCountryId').val(selectedData.map(node => node.wCountryId));
		    $('#wDeptId').val(selectedData.map(node => node.wDeptId));
		    $('#wCity').val(selectedData.map(node => node.wCity));
		    $('#wAddress').val(selectedData.map(node => node.wAddress));
		    $('#wVirtual').val(selectedData.map(node => node.wVirtual));
		    $('#wStatus').val(selectedData.map(node => node.wStatus));
		    $('#wImg').val(selectedData.map(node => node.wImg));
		    
		    if(selectedData.map(node => node.wImgUrl) != null && selectedData.map(node => node.wImgUrl) != '') {
		    	let u = "openInNextTab('"+selectedData.map(node => node.wImgUrl)+"')";
		    	$("#wImgUrl").attr('src',selectedData.map(node => node.wImgUrl));
		    	$("#wImgUrl").attr('onclick',u);
		    	$("#viewIngSectionId").show();
		    } else {
		    	$('#fileUpload').val('');
		    	$("#wImgUrl").attr('src','');
				$("#wImgUrl").removeAttr('onclick');
				$("#viewIngSectionId").hide();
				base64StringGlobal = '';
		    }
		    
		    getStateDataOnEdit(selectedData.map(node => node.wStateId));
		    $("#resetWBtn").attr("disabled",true);
		    $("#deleteWBtn").attr("disabled",false);
	    }

	}
	function enableFieldsW() {
		$('#wName,#wTypeId,#wCountryId,#wCity,#wStateId,#wAddress,#wVirtual,#wStatus,#fileUpload,#wDeptId').attr('disabled',false);
		$("#remove-btn").removeClass("disabled-rmv-btn");
	}
	function openAddSectionW() {
		enableFieldsW();
		$('#wId,#wName,#wTypeId,#wCountryId,#wCity,#wStateId,#wAddress,#wVirtual,#wImg,#wDeptId').val('');
		$('#wStatus').val('1');
		$('#fileUpload').val('');
		$("#wImgUrl").attr('src','');
		$("#wImgUrl").removeAttr('onclick');
		$("#resetWBtn").attr("disabled",false);
		$("#deleteWBtn").attr("disabled",true);
		gridOptionsW.api.deselectAll();
		$("#viewIngSectionId").hide();
		base64StringGlobal = '';
	}
	function resetW() {
		if(!$("#wId").val()) {
			$('#wId,#wName,#wTypeId,#wCountryId,#wCity,#wStateId,#wAddress,#wVirtual,#wImg,#wDeptId').val('');
			$("#wImgUrl").attr('src','');
			$("#wImgUrl").removeAttr('onclick');
			$('#wStatus').val('1');
			$('#fileUpload').val('');
			$("#viewIngSectionId").hide();
			base64StringGlobal = '';
		}
	}

	function saveWarehouse() {
		
		if($("#wName").val() == null || $("#wName").val() == '') {
			toastr.error('Warehouse name required')
			return;
		}
		if($("#wTypeId").val() == null || $("#wTypeId").val() == '') {
			toastr.error('Warehouse type required')
			return;
		}
		if($("#wCountryId").val() == null || $("#wCountryId").val() == '') {
			toastr.error('Country required')
			return;
		}
		if($("#wStateId").val() == null || $("#wStateId").val() == '') {
			toastr.error('State required')
			return;
		}
		if($("#wCity").val() == null || $("#wCity").val() == '') {
			toastr.error('City required')
			return;
		}
		if($("#wAddress").val() == null || $("#wAddress").val() == '') {
			toastr.error('Street required')
			return;
		}
		if($("#wVirtual").val() == null || $("#wVirtual").val() == '') {
			toastr.error('Virtual status required')
			return;
		}
		if($("#wStatus").val() == null || $("#wStatus").val() == '') {
			toastr.error('Warehouse status required')
			return;
		}

	    var data19 = {};

	    data19.wId = $("#wId").val();
	    data19.wName = $("#wName").val();
	    data19.wTypeId = $("#wTypeId").val();
	    data19.wCountryId = $("#wCountryId").val();
	    data19.wStateId = $("#wStateId").val();
	    data19.wCity = $("#wCity").val();
	    data19.wAddress = $("#wAddress").val();
	    data19.wVirtual = $("#wVirtual").val();
	    data19.wStatus = $("#wStatus").val();
	    data19.wImg = $("#wImg").val();
	    data19.wDeptId = $("#wDeptId").val();
	    data19.fileupload = base64StringGlobal;

	    $.ajax({
	        type: "POST",
	        url: "/configuration/save-warehouse",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message)
	            	getWarehouseData();
	            } else {
	            	toastr.error(response.message)
	            }
	        },
	        error: function(response) {
	            console.log(response);
	            toastr.error("Something went wrong")
	        }
	    })
	}
	
	function deleteWarehouse() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {
	        	var id = $('#wId').val();

	    	    $.ajax({
	    	        type: "GET",
	    	        url: "/configuration/delete-master-data?id=" + id + "&type=WH",
	    	        dataType: "json",
	    	        contentType: "application/json",
	    	        success: function(response) {
	    	            if (response.code == "success") {
	    	            	getWarehouseData();
	    	            	toastr.success('Data deleted successfully')
	    	            } else {
	    	            	toastr.error('Something went wrong')
	    	            }
	    	        },
	    	        error: function(response) {
	    	            console.log(response);
	    	            toastr.error('Something went wrong')
	    	        }
	    	    })
	        }
	    });
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridW');
	    new agGrid.Grid(gridDiv, gridOptionsW);
	    
	    $("#viewIngSectionId").hide();
	})
	
	function getStateDataOnEdit(stateId='') {
	    var country = $("#wCountryId").val();
	    if (country) {
	        $.ajax({
	            type: "GET",
	            url: "/configuration/get-state-list?id=" + country,
	            success: function(response) {
	                if (response.message == "success") {
	                    $("#wStateId").empty();
	                    var option = $("<option></option>");
	                    $(option).val('');
	                    $(option).html("Select");
	                    $("#wStateId").append(option);
	                    for (var i = 0; i < response.body.length; i++) {
	                        var option = $("<option></option>");
	                        $(option).val(response.body[i].key);
	                        $(option).html(response.body[i].name);
	                        $("#wStateId").append(option);
	                    }
	                    $("#wStateId").val(stateId);
	                }
	            },
	            error: function(e) {
	            	$("#wStateId").empty();
	    	        var option = $("<option></option>");
	    	        $(option).val('');
	    	        $(option).html("Select");
	    	        $("#wStateId").append(option);
	            }
	        });
	    } else {
	        $("#wStateId").empty();
	        var option = $("<option></option>");
	        $(option).val('');
	        $(option).html("Select");
	        $("#wStateId").append(option);
	    }
	}
	function openInNextTab(url) {
		if(isBase64Image(url)) {
			if (url) {
		    	const newTab = window.open();
		        newTab.document.write(`<img src="${url}">`);
		    }
		} else {
			window.open(url);
		}
	}
	function isBase64Image(str) {
	    const base64Regex = /^data:image\/(png|jpeg|jpg|gif|webp|bmp);base64,[A-Za-z0-9+/=]+$/;
	    return base64Regex.test(str);
	}
	let base64StringGlobal = '';
	function uploadImage(event){
		const file = event.target.files[0]; 
	      if (file) {
	          const reader = new FileReader();
	          
	          reader.onload = function(e) {
	              const base64String = e.target.result; 
	              base64StringGlobal = base64String;
	              
	              const img = document.getElementById("wImgUrl");
	              img.src = base64String;
	              let u = "openInNextTab('"+base64String+"')";
			      $("#wImgUrl").attr('onclick',u);
	              $("#viewIngSectionId").show();	
	          };
	          
	          reader.readAsDataURL(file);
	      }
	}
	function removeUrl() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to remove this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, remove it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {
				let imgUrl = $("#wImg").val();
				if(imgUrl) {
					var id = $('#wId').val();

		    	    $.ajax({
		    	        type: "GET",
		    	        url: "/configuration/delete-master-data?id=" + id + "&type=WHIMG&imgurl=" + imgUrl,
		    	        dataType: "json",
		    	        contentType: "application/json",
		    	        success: function(response) {
		    	            if (response.code == "success") {
		    	            	toastr.success('Image removed successfully')
		    	            	$("#wImgUrl").attr('src','');
		    					$("#wImgUrl").removeAttr('onclick');
		    					$('#fileUpload').val('');
		    					$('#wImg').val('');
		    					$("#viewIngSectionId").hide();
		    					base64StringGlobal = '';
		    	            } else {
		    	            	toastr.error('Something went wrong')
		    	            }
		    	        },
		    	        error: function(response) {
		    	            console.log(response);
		    	            toastr.error('Something went wrong')
		    	        }
		    	    })
				} else {
					$("#wImgUrl").attr('src','');
					$("#wImgUrl").removeAttr('onclick');
					$('#fileUpload').val('');
					$('#wImg').val('');
					$("#viewIngSectionId").hide();
					base64StringGlobal = '';
				}
	        }
	    })
	}
</script>
</head>
<body>
	<h6>Warehouse List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionW()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsW()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteWBtn" class="btn  edit-btn"
								onclick="deleteWarehouse()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridW" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Warehouse</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveWarehouse()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetWBtn" class="btn  edit-btn" onclick="resetW()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-3">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="wName"> <input
					type="hidden" id="wId">
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Type <span class="mandatory">*</span></label>
				<div class="select">
					<select id=wTypeId class="form-control">
						<option value="">Select</option>
						<option th:each="a: ${locationTypeList}" th:value="${a.key}" th:text="${a.name}"></option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Department</label>
				<div class="select">
					<select id=wDeptId class="form-control">
						<option value="">Select</option>
						<option th:each="a: ${department}" th:value="${a.key}" th:text="${a.name}"></option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Country <span class="mandatory">*</span></label>
				<div class="select">
					<select id=wCountryId class="form-control" onchange="getStateDataOnEdit('')">
						<option value="">Select</option>
						<option th:each="a: ${countryList}" th:value="${a.key}" th:text="${a.name}"></option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>State <span class="mandatory">*</span></label>
				<div class="select">
					<select id=wStateId class="form-control">
						<option value="">Select</option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>City <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="City" id="wCity">
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Street <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Street" id="wAddress">
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Virtual <span class="mandatory">*</span></label>
				<div class="select">
					<select id="wVirtual" class="form-control">
						<option value="">Select</option>
						<option value="1">Yes</option>
						<option value="0">No</option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="wStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-3">
			<div class="form-group">
				<label>Document</label>
				<input type="file" id="fileUpload" class="form-control" style="display: block" accept="image/*" onchange="uploadImage(event)">
			</div>
		</div>
		<div class="col-md-3" id="viewIngSectionId">
			<input type="hidden" id="wImg">
			<div class="pd-10-0"><img class="wh-img" id="wImgUrl"><span id="remove-btn" class="mandatory remove-url" onclick="removeUrl()">x</span></div>
		</div>
	</div>
</body>
</html>
