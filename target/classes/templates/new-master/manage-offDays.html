<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="manageOffDays">
<head>
<meta charset="UTF-8">
<script>
$(document).ready(function() {
	getOffDaysData();

	 
})



	var columnDefOffDays = [{
		headerName : "Employee Id",
		field : "empId",
		width : 130,
		pinned : 'left',
	
	}, {
		headerName : "offId",
		field : "offId",
		width : 220,
		cellStyle : {
			textAlign : 'center'
		},
		hide : true,
	}, {
		headerName : "Employee Name",
		field : "employeeName",
		width : 220,
		pinned : 'left',
	}, {
		headerName : "Department",
		field : "dept",
		width : 200,
	}, {
		headerName : "Desgnation",
		field : "desg",
		width : 200,
		cellStyle : {
			textAlign : 'left'
		},
	}, {
		headerName : "OFF Days",
		field : "offDays",
		width : 150,
		cellStyle : {
			textAlign : 'center'
		},
	}, {
		headerName : "Effective Date",
		field : "date",
		width : 150,
		cellStyle : {
			textAlign : 'center'
		}
	}, {
		headerName : "Status",
		field : "status",
		width : 150,
		cellStyle : {
			textAlign : 'center'
		},
		hide: true,
	}, {
		headerName : "Approved By",
		field : "approvedBy",
		width : 190,
		cellStyle : {
			textAlign : 'center'
		},
		hide: true,
	}
	];
	var gridOptionsOffDays = {
		    columnDefs: columnDefOffDays,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionOffDays,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.offId;
			}
		};
	

	function onSelectionOffDays() {

	    var selectedNodes = gridOptionsOffDays.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    console.log("selectedData======",selectedData);
	    if(selectedData && selectedData.length > 0) {
	    	$('#employeeName').val(selectedData.map(node => node.employeeName));
		    $('#empId').val(selectedData.map(node => node.empId));
		    $('#offDays').val(selectedData.map(node => node.offDays));
		    $('#offId').val(selectedData.map(node => node.offId));
		   
		    let date = selectedData.map(node => node.date)[0];
		    var parts = date.split("-"); // [dd, mm, yyyy]
		    var formattedDate = parts[2] + "-" + parts[1] + "-" + parts[0]; // yyyy-mm-dd

		    $('#date').val(formattedDate);
		    
		    
		    $("#resetOffDaysBtn").attr("disabled",true);
		    $("#deleteOffDaysBtn").attr("disabled",false);
	    }/* else{
	    	gridOptionsOffDays.api.setRowData([]);
	    } */
	    
	}
	function enableFieldsOffDays() {
		$('#empId,#employeeName,#offDays,#date').attr('disabled',false);
		$("#remove-btn").removeClass("disabled-rmv-btn");
	}
	function openAddSectionOffDays() {
		enableFieldsOffDays();
		$('#offId,#empId,#employeeName,#offDays,#date').val('');
		$("#resetOffDaysBtn").attr("disabled",false);
		$("#deleteOffDaysBtn").attr("disabled",true);
		gridOptionsOffDays.api.deselectAll();
	}
	

	function saveOffDays() {
		
		if($("#employeeName").val() == null || $("#employeeName").val() == '') {
			toastr.error("Employee name required");
			return;
		}
		if($("#offDays").val() == null || $("#offDays").val() == '') {
			toastr.error("Off days required");
			return;
		}
		if($("#date").val() == null || $("#date").val() == '') {
			toastr.error("Date required");
			return;
		}

	    var data19 = {};

	    data19.offId = $("#offId").val();
	    data19.empId = $("#empId").val();
	    data19.employeeName = $("#employeeName").val();
	    data19.offDays = $("#offDays").val();
	    data19.date = $("#date").val();
	    

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-OffDays-Data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getOffDaysData();
	            	
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deleteOffDays() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#offId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-OffDays-data?id=" + id,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getOffDaysData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	
	
	function getOffDaysData() {
	
		agGrid.simpleHttpRequest({
	        url: '/configuration/view-master-offDays-Data'
	    }).then(function(data) {
	    	let s = JSON.parse(data?.body[0]);
	        let dataSet = [];
	        if (s && s.length > 0) {
	        	gridOptionsOffDays.api.setRowData(s);
	        	gridOptionsOffDays.api.getRowNode(s[0].offId).setSelected(true);
	        } else {
	        	gridOptionsOffDays.api.setRowData(dataSet);
	            $("#deleteOffDaysBtn").attr("disabled",true);
	        }
	       
	    });
		$('#empId,#employeeName,#offDays,#date').attr('disabled',true);
		//$("#remove-btn").addClass("disabled-rmv-btn");
	}
	
	
	
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridOffDays');
	    new agGrid.Grid(gridDiv, gridOptionsOffDays);
	})
	
//
function getEmployeeList() {
		var search = $("#employeeName").val();
		if (search) {
			$
					.ajax({
						type : "POST",
						url : "/configuration/manage-offDays-employeeList",
						dataType : 'json',
						contentType : 'application/json',
						data : search,
						success : function(response) {
							if (response.message == "success") {
								if (response.body.length != 0) {
									$("#empId").val("");
									$("#employeeName")
											.css("background", "#FFF");
									var content = '<ul id="autocomplete-list1" style="margin-left:-40px; font-weight:100; font-size:14px; color:#ccc;">';
									for (var i = 0; i < response.body.length; i++) {
										content += '<li class="autocompletedata cp" onClick="selectAutocompleteValueItem1(\''
												+ response.body[i].key
												+ '\',\''
												+ window
														.btoa(response.body[i].name)
												+ '\')">'
												+ response.body[i].key
												+ " - "
												+ response.body[i].name
												+ '</li>';
									}
									content += '</ul>';
									$("#suggesstion-box_").show();
									$("#suggesstion-box_").html(content);
								} else {
									$("#employeeName")
											.css("background", "#FFF");
									var content = '<ul id="autocomplete-list1">';
									content += '<font-weight:100; font-size:14px;color:#ccc;background-color: #0909e4;"li onClick="selectAutocompleteValueItem()">'
											+ "No Data Found" + '</li>';
									content += '</ul>';
									$("#suggesstion-box_").show();
									$("#suggesstion-box_").html(content);
								}
							}
						},
						error : function(data) {
							console.log(data);
						}
					})
		} else {
			$("#empId").val("");
			$("#employeeName").val("");
			$("#suggesstion-box_").hide();
		}
	}

	function selectAutocompleteValueItem1(empId, employeeName) {
		if (empId) {
			$("#error1").hide();
			$("#employeeName").val(window.atob(employeeName));
			$("#empId").val(empId);
			$("#employeeName").attr('data-procat', empId);
			$("#suggesstion-box_").hide();
		} else {
			$("#empId").val("");
			$("#employeeName").val("");
			$("#employeeName").attr('data-procat', "");
			$("#suggesstion-box_").hide();
		}
	}
	
	function enableFieldsInsurncProvdr() {
		$('#insurancePrvdrName,#insurncId,#insuranceAmount,#insurancefrmdt,#insurancetodt').attr('disabled',false);
	}

	function openAddSectionInsurncProvdr(){
		enableFieldsInsurncProvdr();
		$('#insurancePrvdrId,#insurancePrvdrName,#insurncId,#insuranceAmount,#insurancefrmdt,#insurancetodt').val('');
		//$('#insuranceStatus').val('1');
		$("#resetInsurncProvdrBtn").attr("disabled",false);
		$("#deleteInsurncProvdrBtn").attr("disabled",true);
		gridOptionsInsrncPrvdrtyp.api.deselectAll();
		
	}
</script>
</head>
<body>
	<h6>Employee List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionOffDays()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsOffDays()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteOffDaysBtn" class="btn  edit-btn"
								onclick="deleteOffDays()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridOffDays" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>

	</div>
	<h6>Add Off Days</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn" onclick="saveOffDays()"
								type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetOffDaysBtn" class="btn  edit-btn"
								onclick="resetOffDays()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">

		<input type="hidden" id="sessionId" th:value="${userId}" /> <input
			type="hidden" id="sessionName" th:value="${userName}" /> <input
			type="hidden" id="adRole" th:value="${adRole}" /> <input
			type="hidden" id="mrRole" th:value="${mrRole}" /> <input
			type="hidden" id="empRole" th:value="${empRole}" /> <input
			type="hidden" id="sessionRole" th:value="${userRole}" />
		<div class="col-md-6">

			<div class="form-group">
				<div class="autocomplete" style="width: 100%">
					<label>Employee Name</label> <input type="text"
						class="form-control" id="employeeName" autocomplete="off"
						onkeyup='getEmployeeList()' onblur="removeValid(event)"
						placeholder="Enter Employee Id/Name" /> <span id="error1"
						class="formValidation-other"></span><input type="hidden"
						id="offId">
				</div>
				<div id="suggesstion-box_" class="sugg-cls"></div>
			</div>
		</div>
		<div class="col-md-6">
			<div class="form-group">
				<label>Employee ID</label> <input type="text" class="form-control"
					id="empId" disabled>
			</div>
		</div>
		<div class="col-md-6">
			<div class="form-group">
				<label>OFF Days</label>
				<div class="select">
					<select class="form-control" id="offDays">
						<option value="">Select</option>
						<option value="Monday">Monday</option>
						<option value="Tuesday">Tuesday</option>
						<option value="Wednesday">Wednesday</option>
						<option value="Thursday">Thursday</option>
						<option value="Friday">Friday</option>
						<option value="Saturday">Saturday</option>
						<option value="Sunday">Sunday</option>
					</select>
				</div>
			</div>
		</div>
		<div class="col-md-6">
			<div class="form-group">
				<label>Effective Date <span class="mandatory">*</span></label> <input
					type="date" class="form-control transparenttxtbox"
					placeholder="from date" id="date">
			</div>
		</div>
	</div>

	</div>
</body>
</html>
