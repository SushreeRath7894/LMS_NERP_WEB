<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="variant">
<head>
<script>
	var columnDefsVariant = [{
	        headerName: "Order",
	        field: "variantOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Variant Name",
	        field: "variantName",
	        flex: 2,
	    }, 
	    {
	        headerName: "Sub-Category Name",
	        field: "subCategoryName",
	        flex: 2,
	    }, 
	    {
	        headerName: "Category Name",
	        field: "categoryName",
	        flex: 1,
	    },
	    {
	        headerName: "Status",
	        field: "variantStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.variantStatus == "Active") {
	                return '<div style="color:green">' + params.data.variantStatus + '</div>';
	            } else {
	                return '<div>' + params.data.variantStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptionsVariant = {
		    columnDefs: columnDefsVariant,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionVariant,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.variantId;
			}
		};
	$(document).ready(() => {
		getVariantData();
	})

	function onSelectionVariant() {

	    var selectedNodes = gridOptionsVariant.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);

	    if(selectedNodes.length > 0) {
	    	$('#variantOrder').val(selectedData.map(node => node.variantOrder));
		    $('#categoryIdV').val(selectedData.map(node => node.categoryId));
		    // $('#subCategoryIdV').val(selectedData.map(node => node.subCategoryId));
		    $('#variantName').val(selectedData.map(node => node.variantName));
		    $('#variantId').val(selectedData.map(node => node.variantId));
		    $('#variantStatus').val(selectedData.map(node => node.variantStatus));
		    getSubCatData(selectedData.map(node => node.subCategoryId));
		    if (selectedData.map(node => node.variantStatus) == "Active") {
		        $('#variantStatus').val("1");
		    } else if(selectedData.map(node => node.variantStatus) == "") {
		    	$('#variantStatus').val("1");
		    } else {
		        $('#variantStatus').val("0");
		    }
		    $("#resetVariantBtn").attr("disabled",true);
		    $("#deleteVariantBtn").attr("disabled",false);
	    }
	    
	}
	function enableFieldsVariant() {
		$('#variantOrder,#categoryIdV,#subCategoryIdV,#variantName,#variantStatus').attr('disabled',false);
	}
	function openAddSectionVariant() {
		enableFieldsVariant();
		$('#variantId,#variantOrder,#variantName').val('');
		$("#subCategoryIdV").empty();
		$("#subCategoryIdV").append('<option value="ABC">Select</option>');
		$('#categoryIdV').val('ABC');
		$('#subCategoryIdV').val('ABC');
		$('#variantStatus').val('1');
		$("#resetVariantBtn").attr("disabled",false);
		$("#deleteVariantBtn").attr("disabled",true);
		gridOptionsVariant.api.deselectAll();
	}
	function resetVariant() {
		if(!$("#variantId").val()) {
			$('#variantId,#variantOrder,#variantName').val('');
			$('#categoryIdV').val('ABC');
			$('#subCategoryIdV').val('ABC');
			$('#variantStatus').val('1');
		}
	}

	function saveVariant() {
		
		/* if($("#variantOrder").val() == null || $("#variantOrder").val() == '') {
			toastr.error("Variant order required");
			return;
		} */
		if($("#categoryIdV").val() == null || $("#categoryIdV").val() == '' || $("#categoryIdV").val() == 'ABC') {
			toastr.error("Category required");
			return;
		}
		if($("#subCategoryIdV").val() == null || $("#subCategoryIdV").val() == '' || $("#subCategoryIdV").val() == 'ABC') {
			toastr.error("Sub-Category required");
			return;
		}
		if($("#variantName").val() == null || $("#variantName").val() == '') {
			toastr.error("Variant name required");
			return;
		}
		if($("#variantStatus").val() == null || $("#variantStatus").val() == '') {
			toastr.error("Variant status required");
			return;
		}

	    var data19 = {};
	    
	    data19.variantId = $("#variantId").val();
	    data19.categoryId = $("#categoryIdV").val();
	    data19.subCategoryId = $("#subCategoryIdV").val();
	    data19.variantOrder = $("#variantOrder").val();
	    data19.variantName = $("#variantName").val();
	    data19.variantStatus = $("#variantStatus").val();
	    data19.type = "variant";

	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message);
	            	getVariantData();
	            	resetVariant();
	            } else {
	            	toastr.error(response.message);
	            }
	        },
	        error: function(response) {
	        	toastr.error("Something went wrong");
	            console.log(response);
	        }
	    })
	}
	
	function deleteVariant() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {

			    var id = $('#variantId').val();
		
			    $.ajax({
			        type: "GET",
			        url: "/configuration/delete-master-data?id=" + id + "&type=variant" ,
			        dataType: "json",
			        contentType: "application/json",
			        success: function(response) {
			            if (response.code == "success") {
			            	toastr.success("Data deleted successfully")
			            	getVariantData();
			            }
			        },
			        error: function(response) {
			            console.log(response);
			        }
			    })
	        }
	    });
	}
	
	function getSubCatData(subcat="ABC") {
		var id = $('#categoryIdV').val();
		$("#subCategoryIdV").empty();
		$("#subCategoryIdV").append('<option value="ABC">Select</option>');
		$.ajax({
	        type: "GET",
	        url: "/configuration/getSubCatData?id="+id ,
	        dataType: "json",
	        contentType: "application/json",
	        success: function(response) {
	            if (response.code == "success") {
	            	let data = response.body;
	            	if(data && data.length > 0) {
	            		for(let i = 0; i < data.length; i++) {
	            			$("#subCategoryIdV").append('<option value="'+data[i].key+'">'+data[i].name+'</option>'); 
	            		}
	            		$("#subCategoryIdV").val(subcat);
	            	}
	            }
	        },
	        error: function(response) {
	            console.log(response);
	        }
	    })
	}
	
	function getVariantData() {
		agGrid.simpleHttpRequest({
            url: '/configuration/view-master-data?type=variant'
        }).then(function(data) {
        	let dataSet = [];
        	$('#variantOrder,#variantName,#variantStatus,#categoryIdV,#subCategoryIdV').attr('disabled',true);
	        if (data.length > 0) {
	        	gridOptionsVariant.api.setRowData(data);
	        	gridOptionsVariant.api.getRowNode(data[0].variantId).setSelected(true);
	        } else {
	        	gridOptionsVariant.api.setRowData(dataSet);
	        	$("#deleteVariantBtn").attr("disabled",true);
	        }
        });
		$('#variantOrder,#categoryIdV,#subCategoryIdV,#variantName,#variantStatus').attr('disabled',true);
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridVariant');
	    new agGrid.Grid(gridDiv, gridOptionsVariant);
	})
</script>
</head>
<body>
	<h6>Variant List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionVariant()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsVariant()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteVariantBtn" class="btn  edit-btn"
								onclick="deleteVariant()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridVariant" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Variant</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveVariant()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetVariantBtn" class="btn  edit-btn" onclick="resetVariant()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="variantOrder">
			</div>
		</div>
		
		<div class="col-md-3">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="variantName"> <input
					type="hidden" id="variantId">
			</div>
		</div>
		
		<div class="col-md-3">
			<div class="form-group">
				<label>Category <span class="mandatory">*</span></label>
				<div class="select">
					<select id="categoryIdV" class="form-control" onchange="getSubCatData('ABC')">
						<option value="ABC">Select</option>
						<option th:each="a : ${categoryList}" th:value="${a.key}" th:text="${a.name}"></option>
					</select>
				</div>
			</div>
		</div>
		
		<div class="col-md-3">
			<div class="form-group">
				<label>Sub-Category <span class="mandatory">*</span></label>
				<div class="select">
					<select id="subCategoryIdV" class="form-control">
						<option value="ABC">Select</option>
					</select>
				</div>
			</div>
		</div>

		<div class="col-md-3">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="variantStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
