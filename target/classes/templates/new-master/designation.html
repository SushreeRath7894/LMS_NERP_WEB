<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="designation">
<head>
<meta charset="UTF-8">
<script>
	var columnDefs = [{
	        headerName: "Order",
	        field: "designationOrder",
	        flex: 1,
	        hide: true
	    },
	    {
	        headerName: "Designation Name",
	        field: "designationName",
	        flex: 5,
	    }, {
	        headerName: "Status",
	        field: "designationStatus",
	        flex: 1,
	        cellRenderer: function(params) {
	            if (params.data.designationStatus == "Active") {
	                return '<div style="color:green">' + params.data.designationStatus + '</div>';
	            } else {
	                return '<div>' + params.data.designationStatus + '</div>';
	            }
	        }
	    }
	];
	var gridOptions = {
		    columnDefs: columnDefs,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionDesignation,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.designationId;
			}
		};
	$(document).ready(() => {
		getDesignationData();
	})
	
	function getDesignationData() {
		agGrid.simpleHttpRequest({
	        url: '/configuration/referenceHr-view-designation'
	    }).then(function(data) {
	        let dataSet = [];
	        if (data.length > 0) {
	            gridOptions.api.setRowData(data);
	            gridOptions.api.getRowNode(data[0].designationId).setSelected(true);
	        } else {
	            gridOptions.api.setRowData(dataSet);
	            $("#deleteDesBtn").attr("disabled",true);
	        }
	    });
		$('#designationOrder,#designationName,#designationStatus').attr('disabled',true);
	}

	function onSelectionDesignation() {

	    var selectedNodes = gridOptions.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    
	    if(selectedData && selectedData.length > 0) {
	    	$('#designationOrder').val(selectedData.map(node => node.designationOrder));
		    $('#designationName').val(selectedData.map(node => node.designationName));
		    $('#designationId').val(selectedData.map(node => node.designationId));
		    $('#designationStatus').val(selectedData.map(node => node.designationStatus));
		    
		    if (selectedData.map(node => node.designationStatus) == "Active") {
		        $('#designationStatus').val("1");
		    } else if(selectedData.map(node => node.designationStatus) == "") {
		    	$('#designationStatus').val("1");
		    } else {
		        $('#designationStatus').val("0");
		    }
		    
		    $("#resetDesignationBtn").attr("disabled",true);
		    $("#deleteDesBtn").attr("disabled",false);
	    }

	}
	function enableFields() {
		$('#designationOrder,#designationName,#designationStatus').attr('disabled',false);
	}
	function openAddSection() {
		enableFields();
		$('#designationId,#designationOrder,#designationName').val('');
		$('#designationStatus').val('1');
		$("#resetDesignationBtn").attr("disabled",false);
		$("#deleteDesBtn").attr("disabled",true);
		gridOptions.api.deselectAll();
	}
	function resetDesignation() {
		if(!$("#designationId").val()) {
			$('#designationId,#designationOrder,#designationName').val('');
			$('#designationStatus').val('1');
		}
	}

	function saveDesignation() {
		
		/* if($("#designationOrder").val() == null || $("#designationOrder").val() == '') {
			toastr.error('Designation order required')
			return;
		} */
		if($("#designationName").val() == null || $("#designationName").val() == '') {
			toastr.error('Designation name required')
			return;
		}
		if($("#designationStatus").val() == null || $("#designationStatus").val() == '') {
			toastr.error('Designation status required')
			return;
		}

	    var data19 = {};

	    data19.designationId = $("#designationId").val();
	    data19.designationOrder = $("#designationOrder").val();
	    data19.designationName = $("#designationName").val();
	    data19.designationStatus = $("#designationStatus").val();

	    $.ajax({
	        type: "POST",
	        url: "/configuration/referenceHr-add-designationmaster",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.message == "Success") {
	            	if($("#designationId").val() == null || $("#designationId").val() == "" || $("#designationId").val() == undefined) {
	            		toastr.success('Data saved successfully')
	            	} else {
	            		toastr.success('Data updated successfully')
	            	}
	            	
	            	getDesignationData();
	            }
	        },
	        error: function(response) {
	            console.log(response);
	        }
	    })
	}
	
	function deleteDesignation() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {
	        	var id = $('#designationId').val();

	    	    $.ajax({
	    	        type: "GET",
	    	        url: "/configuration/referenceHr-designation-delete?id=" + id,
	    	        dataType: "json",
	    	        contentType: "application/json",
	    	        success: function(response) {
	    	            if (response.message == "Success") {
	    	            	getDesignationData();
	    	            	toastr.success('Data deleted successfully')
	    	            }
	    	        },
	    	        error: function(response) {
	    	            console.log(response);
	    	        }
	    	    })
	        }
	    });
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGrid');
	    new agGrid.Grid(gridDiv, gridOptions);
	})
</script>
</head>
<body>
	<h6>Designation List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSection()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFields()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteDesBtn" class="btn  edit-btn"
								onclick="deleteDesignation()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Desgination</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveDesignation()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetDesignationBtn" class="btn  edit-btn" onclick="resetDesignation()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Order" id="designationOrder"> <input
					type="hidden" id="designationOrder">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="designationName"> <input
					type="hidden" id="designationId">
			</div>
		</div>

		<div class="col-md-6">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="designationStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
