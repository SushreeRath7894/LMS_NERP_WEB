<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="measurementtype">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsMeasurementtype = [

    {
        headerName: "Measurement Type",
        field: "measurementId",
        flex:1,
        hide: true
    },

    {
        headerName: "Order",
        field: "measurementOrder",
        flex:1,
        width: 80,
        hide: true
    }, {
        headerName: "Code",
        field: "measurementCode",
        width: 80,
        flex:2,
    },

    {
        headerName: "Measuement Name",
        field: "measurementName",
        width: 175,
        flex:3,
    }, {
        headerName: "Status",
        field: "measurementStatus",
        width: 90,
        flex:1,
        cellRenderer: function(params) {
            if (params.data.measurementStatus == "Active") {
                return '<div style="color:green">' + params.data.measurementStatus + '</div>';
            } else {
                return '<div>' + params.data.measurementStatus + '</div>';
            }
        }
    }
];

var gridOptionsMeasurementtype = {
	    columnDefs: columnDefsMeasurementtype,
	    defaultColDef: {
	        sortable: true,
	        filter: true,
	        resizable: true,
	        width: 195,
	        height: 10
	    },
	    rowSelection: 'single',
	    rowMultiSelectWithClick: true,
	    onSelectionChanged: onSelectionChangedMeasure,
	    onRowClicked: (event) => {
	        const selectedNode = event.node;
	        if (!selectedNode.isSelected()) {
	            selectedNode.setSelected(true);
	        }
	    },
	    getRowNodeId : function(data) {
			return data.measurementId;
		}

	};
	
$(document).ready(() => {
	getMeasureTypeData();
})

function getMeasureTypeData() {
	agGrid.simpleHttpRequest({
        url: '/configuration/view-procurement-view-measurement-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsMeasurementtype.api.setRowData(data);
        	gridOptionsMeasurementtype.api.getRowNode(data[0].measurementId).setSelected(true);
        } else {
        	gridOptionsMeasurementtype.api.setRowData(dataSet);
        	$("#deleteMeasureTypeBtn").attr("disabled",true);
        }

    });
    
    $('#measurementOrder,#measurementCode,#measurementName,#measurementStatus').attr('disabled',true);
}
	
function onSelectionChangedMeasure() {

    var selectedNodes = gridOptionsMeasurementtype.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#measurementOrder').val(selectedData.map(node => node.measurementOrder));
        $('#measurementCode').val(selectedData.map(node => node.measurementCode));
        $('#measurementName').val(selectedData.map(node => node.measurementName));
        $('#measurementId').val(selectedData.map(node => node.measurementId));

        if (selectedData.map(node => node.measurementStatus) == "Active") {
            $('#measurementStatus').val("1");
        } else if(selectedData.map(node => node.measurementStatus) == "") {
    		$('#measurementStatus').val("1");
    	}else {
            $('#measurementStatus').val("0");
        }
        $("#resetMeasureTypeBtn").attr("disabled",true);
        $("#deleteMeasureTypeBtn").attr("disabled",false);
    }
    
}

function enableFieldsMeasurement() {
	$('#measurementOrder,#measurementCode,#measurementName,#measurementStatus').attr('disabled',false);
}
function openAddSectionMeasurement() {
	enableFieldsMeasurement();
	$('#measurementId,#measurementOrder,#measurementCode,#measurementName').val('');
	$('#measurementStatus').val('1');
	$("#resetMeasureTypeBtn").attr("disabled",false);
	$("#deleteMeasureTypeBtn").attr("disabled",true);
	gridOptionsMeasurementtype.api.deselectAll();
}
function resetMeasurement() {
	if(!$("#measurementId").val()) {
		$('#measurementId,#measurementOrder,#measurementCode,#measurementName').val('');
		$('#measurementStatus').val('1');
	}
}

function saveMeasurementType() {
	
	/* if($("#measurementOrder").val() == null || $("#measurementOrder").val() == '') {
		toastr.error('Measurement type order required');
		return;
	} */
	if($("#measurementCode").val() == null || $("#measurementCode").val() == '') {
		toastr.error('Measurement type code required');
		return;
	}
	if($("#measurementName").val() == null || $("#measurementName").val() == '') {
		toastr.error('Measurement type name required');
		return;
	}
	if($("#measurementStatus").val() == null || $("#measurementStatus").val() == '') {
		toastr.error('Measurement type status required');
		return;
	}

	var data3 = {};

    data3.measurementId = $("#measurementId").val();
    data3.measurementName = $("#measurementName").val();
    data3.measurementOrder = $("#measurementOrder").val();
    data3.measurementCode = $("#measurementCode").val();
    data3.measurementStatus = $("#measurementStatus").val();

    $.ajax({
        type: "POST",
        url: "/configuration/view-procurement-add-measurement-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data3),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#measurementId").val() == null || $("#measurementId").val() == "" || $("#measurementId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getMeasureTypeData()
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteMeasureType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {
    
		    var id = $('#measurementId').val();
		
		    $.ajax({
		        type: "GET",
		        url: "/configuration/view-procurement-measurement-type-delete?id=" + id,
		        dataType: "json",
		        contentType: "application/json",
		        success: function(response) {
		            if (response.message == "Success") {
		            	getMeasureTypeData()
		            	toastr.success('Data deleted successfully')
		            }
		        },
		        error: function(response) {
		            console.log(response);
		        }
		    })
    
        }
    });
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid6');
    new agGrid.Grid(gridDiv, gridOptionsMeasurementtype);
})
</script>
</head>
<body>
	<h6>Measurement Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionMeasurement()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsMeasurement()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteMeasureTypeBtn" class="btn  edit-btn"
								onclick="deleteMeasureType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid6" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Measurement Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveMeasurementType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetMeasureTypeBtn" class="btn  edit-btn"
								onclick="resetMeasurement()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-3" style="display: none">
			<div class="form-group">
				<label>Order <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Order"
					id="measurementOrder"> <input type="hidden"
					id="measurementId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Code <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Code"
					id="measurementCode">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Measurement Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="measurementName">
			</div>
		</div>


		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
					<select id="measurementStatus" class="form-control">
						<option value="">Select</option>
						<option value="1">Active</option>
						<option value="0">Inactive</option>
					</select>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
