<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="paymentMode">
<head>
<meta charset="UTF-8">
<style>
.wh-img {
	height: 50px;
	width: 50px;
	cursor: pointer;
}
.pd-10-0 {
	padding: 10px 0px;
	display: flex;
	align-items: center;
}
.remove-url {
	font-size: 30px;
    padding-left: 10px;
    cursor: pointer;
}
.disabled-rmv-btn {
    pointer-events: none;
    opacity: 0.5;
}
</style>
<script>
	var columnDefsPM = [{
		headerName : "Payment Mode Id",
		field : "modeId",
		width : 130,
		pinned: 'left',
		hide : true,
	
	},{
		headerName : "Payment Mode",
		field : "pModeName",
		width : 140,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		headerName : "Description",
		field : "pDesc",
		width : 130,
		cellStyle : {
			textAlign : 'center'
		},
	},{
		
		headerName : "Created By",
		field : "approvedBy",
		width : 150,
		cellStyle : {
			textAlign : 'center'
		},
		hide: true,
	}
	];
	var gridOptionsPM = {
		    columnDefs: columnDefsPM,
		    defaultColDef: {
		        sortable: true,
		        filter: true,
		        resizable: true,
		        width: 195,
		        height: 10
		    },
		    rowSelection: 'single',
		    rowMultiSelectWithClick: true,
		    onSelectionChanged: onSelectionPM,
		    onRowClicked: (event) => {
		        const selectedNode = event.node;
		        if (!selectedNode.isSelected()) {
		            selectedNode.setSelected(true);
		        }
		    },
		    getRowNodeId : function(data) {
				return data.modeId;
			}
		};
	$(document).ready(() => {
		getPaymentModeData();
	})
	
	function getPaymentModeData() {
		agGrid.simpleHttpRequest({
	        url: '/configuration/get-paymentMode-list'
	    }).then(function(data) {
	    	let s = JSON.parse(data?.body[0]);
	        let dataSet = [];
	        if (s && s.length > 0) {
	            gridOptionsPM.api.setRowData(s);
	            gridOptionsPM.api.getRowNode(s[0].modeId).setSelected(true);
	        } else {
	            gridOptionsPM.api.setRowData(dataSet);
	            $('#pModeName,#pDesc').val('');
	            $("#deletePMBtn").attr("disabled",true);
	        }
	    });
		$('#pModeName,#pDesc').attr('disabled',true);
		$("#remove-btn").addClass("disabled-rmv-btn");
	}

	function onSelectionPM() {

	    var selectedNodes = gridOptionsPM.api.getSelectedNodes();
	    var selectedData = selectedNodes.map(node => node.data);
	    
	    if(selectedData && selectedData.length > 0) {
	    	
		    $('#modeId').val(selectedData.map(node => node.modeId));
		    $('#pModeName').val(selectedData.map(node => node.pModeName));
		    $('#pDesc').val(selectedData.map(node => node.pDesc));
		    
		    $("#resetPMBtn").attr("disabled",true);
		    $("#deletePMBtn").attr("disabled",false);
	    }

	}
	function enableFieldsPM() {
		$('#pModeName,#pDesc').attr('disabled',false);
		$("#remove-btn").removeClass("disabled-rmv-btn");
	}
	function openAddSectionPM() {
		enableFieldsPM();
		$('#modeId,#pModeName,#pDesc').val('');
		
		$("#resetPMBtn").attr("disabled",false);
		$("#deletePMBtn").attr("disabled",true);
		gridOptionsPM.api.deselectAll();
		//$("#viewIngSectionId").hide();
		
	}
	function resetPM() {
		if(!$("#modeId").val()) {
			$('#modeId,#pModeName,#pDesc').val('');
			
			
		}
	}

	function savePaymentMode() {
		
		if($("#pModeName").val() == null || $("#pModeName").val() == '') {
			toastr.error('Payment mode name required')
			return;
		}
		if($("#pDesc").val() == null || $("#pDesc").val() == '') {
			toastr.error('Description required')
			return;
		}
		
		
	    var data19 = {};

	    data19.modeId = $("#modeId").val();
	    data19.pModeName = $("#pModeName").val();
		data19.pDesc = $("#pDesc").val();
	    data19.type = "PModeType";
	    
	    $.ajax({
	        type: "POST",
	        url: "/configuration/add-master-data",
	        dataType: "json",
	        contentType: "application/json",
	        data: JSON.stringify(data19),
	        success: function(response) {
	            if (response.code == "success") {
	            	toastr.success(response.message)
	            	getPaymentModeData();
	            } else {
	            	toastr.error(response.message)
	            }
	        },
	        error: function(response) {
	            console.log(response);
	            toastr.error("Something went wrong")
	        }
	    })
	}
	
	function deletePaymentMode() {
		
		Swal.fire({
	        title: 'Are you sure?',
	        text: 'Do you want to delete this?',
	        icon: 'warning',
	        showCancelButton: true,
	        confirmButtonText: 'Yes, delete it!',
	        cancelButtonText: 'No, keep it',
	        confirmButtonColor: 'var(--mainColor)',
	    }).then((result) => {
	        if (result?.value) {
	        	var id = $('#modeId').val();

	    	    $.ajax({
	    	        type: "GET",
	    	        url: "/configuration/delete-master-data?id=" + id + "&type=PMode",
	    	        dataType: "json",
	    	        contentType: "application/json",
	    	        success: function(response) {
	    	            if (response.code == "success") {
	    	            	getPaymentModeData();
	    	            	
	    	            	toastr.success('Data deleted successfully')
	    	            } else {
	    	            	toastr.error('Something went wrong')
	    	            }
	    	        },
	    	        error: function(response) {
	    	            console.log(response);
	    	            toastr.error('Something went wrong')
	    	        }
	    	    })
	        }
	    });
	}
	
	$(document).ready(() => {
	    var gridDiv = document.querySelector('#myGridPM');
	    new agGrid.Grid(gridDiv, gridOptionsPM);
	    
	    
	})
 
</script>
</head>
<body>
	<h6>Payment Mode List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionPM()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsPM()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deletePMBtn" class="btn  edit-btn"
								onclick="deletePaymentMode()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGridPM" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Payment Mode</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn" onclick="savePaymentMode()"
								type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetPMBtn" class="btn  edit-btn" onclick="resetPM()"
								type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-6">
			<div class="form-group">
				<label>Payment Mode <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="pModeName"> <input type="hidden"
					id="modeId">
			</div>
		</div>
		<div class="col-md-6">
			<div class="form-group">
				<label>Description <span class="mandatory">*</span></label> <input
					type="text" class="form-control transparenttxtbox"
					placeholder="Name" id="pDesc"> 
			</div>
		</div>
		
		
	</div>
</body>
</html>
