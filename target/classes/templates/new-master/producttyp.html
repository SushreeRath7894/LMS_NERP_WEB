<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="producttyp">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var columnDefsProducttyp = [
    {
        headerName: "Product Type",
        field: "productId",
        flex: 1,
        hide: true
    },
    {
        headerName: "Name",
        field: "productName",
        flex: 2,
        width: 80
    },
    {
        headerName: "Description",
        field: "productDesc",
        width: 175,
        flex: 3,
    },
    {
        headerName: "Status",
        field: "productStatus",
        width: 90,
        flex: 1,
        cellRenderer: function(params) {
            if (params.data.productStatus == "Active") {
                return '<div style="color:green">' + params.data.productStatus + '</div>';
            } else {
                return '<div>' + params.data.productStatus + '</div>';
            }
        }
    }
];

var gridOptionsProducttyp = {
    columnDefs: columnDefsProducttyp,
    defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        width: 195,
        height: 10
    },
    rowSelection: 'single',
    rowMultiSelectWithClick: true,
    onSelectionChanged: onSelectionChangedProduct,
    onRowClicked: (event) => {
        const selectedNode = event.node;
        if (!selectedNode.isSelected()) {
            selectedNode.setSelected(true);
        }
    },
    getRowNodeId : function(data) {
		return data.productId;
	}

};

$(document).ready(() => {
	getProductType();
    
})

function getProductType() {
	agGrid.simpleHttpRequest({
        url: '/master/view-procurement-view-product-type'
    }).then(function(data) {
        let dataSet = [];
        if (data.length > 0) {
        	gridOptionsProducttyp.api.setRowData(data);
        	gridOptionsProducttyp.api.getRowNode(data[0].productId).setSelected(true);
        } else {
        	gridOptionsProducttyp.api.setRowData(dataSet);
        	$("#deleteProductTypeBtn").attr("disabled",true);
        }
    });
    
    $('#productName,#productDesc,#productStatus').attr('disabled',true);
}

function onSelectionChangedProduct() {
    
    var selectedNodes = gridOptionsProducttyp.api.getSelectedNodes();
    var selectedData = selectedNodes.map(node => node.data);
    
    if(selectedData && selectedData.length > 0) {
    	$('#productDesc').val(selectedData.map(node => node.productDesc));
        $('#productName').val(selectedData.map(node => node.productName));
        $('#productId').val(selectedData.map(node => node.productId));


        if (selectedData.map(node => node.productStatus) == "Active") {
            $('#productStatus').val("1");
        }else if(selectedData.map(node => node.productStatus) == ""){
        	$('#productStatus').val("1");
        }else {
            $('#productStatus').val("0");
        }
        $("#resetProdTypeBtn").attr("disabled",true);
        $("#deleteProductTypeBtn").attr("disabled",false);
    }

}

function enableFieldsProducttyp() {
	$('#productDesc,#productName,#productStatus').attr('disabled',false);
}
function openAddSectionProducttyp() {
	enableFieldsProducttyp();
	$('#productId,#productDesc,#productName').val('');
	$('#productStatus').val('1');
	$("#resetProdTypeBtn").attr("disabled",false);
	$("#deleteProductTypeBtn").attr("disabled",true);
	gridOptionsProducttyp.api.deselectAll();
}
function resetProducttyp() {
	if(!$("#productId").val()) {
		$('#productId,#productDesc,#productName').val('');
		$('#productStatus').val('1');
	}
}

function saveProductType() {
	
	if($("#productName").val() == null || $("#productName").val() == '') {
		toastr.error('Product type name required');
		return;
	}
	if($("#productStatus").val() == null || $("#productStatus").val() == '') {
		toastr.error('Product type status required');
		return;
	}
	
	var data3 = {};
	data3.productId = $("#productId").val();
    data3.productName = $("#productName").val();
    data3.productDesc = $("#productDesc").val();
    data3.productStatus = $("#productStatus").val();

    $.ajax({
        type: "POST",
        url: "/master/view-procurement-add-product-type",
        dataType: "json",
        contentType: "application/json",
        data: JSON.stringify(data3),
        success: function(response) {
            if (response.message == "Success") {
            	if ($("#productId").val() == null || $("#productId").val() == "" || $("#productId").val() == undefined) {
                    toastr.success('Data saved successfully')
                } else {
                    toastr.success('Data updated successfully')
                }
            	getProductType();
            }
        },
        error: function(response) {
            console.log(response);
        }
    })
}

function deleteProductType() {
	
	Swal.fire({
        title: 'Are you sure?',
        text: 'Do you want to delete this?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete it!',
        cancelButtonText: 'No, keep it',
        confirmButtonColor: 'var(--mainColor)',
    }).then((result) => {
        if (result?.value) {
    
		    var id = $('#productId').val();
		
		    $.ajax({
		        type: "GET",
		        url: "/master/view-procurement-product-type-delete?id=" + id,
		        dataType: "json",
		        contentType: "application/json",
		        success: function(response) {
		            if (response.message == "Success") {
		            	getProductType();
		            	toastr.success('Data deleted successfully')
		            }
		        },
		        error: function(response) {
		            console.log(response);
		        }
		    })
	    
        }
	    
       });
}

$(document).ready(() => {
    var gridDiv = document.querySelector('#myGrid15');
    new agGrid.Grid(gridDiv, gridOptionsProducttyp);
})
</script>
</head>
<body>
	<h6>Product Type List</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><strong id="pName"></strong></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="openAddSectionProducttyp()" type="button">Add</button>
						</div>
						<div class="mr-2">
							<button id="next" class="btn  edit-btn" type="button"
								onclick="enableFieldsProducttyp()">Edit</button>
						</div>
						<div class="mr-0">
							<button id="deleteProductTypeBtn" class="btn  edit-btn"
								onclick="deleteProductType()" type="button">Delete</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="box_reference" style="margin-bottom: 10px !important;">
		<div id="myGrid15" style="width: 100%; height: 190px;"
			class="ag-theme-alpine"></div>
	</div>
	<h6>Add Product Type</h6>
	<div class="mb-2">
		<table class="table  mb-0" width="100%">
			<tr valign="middle">
				<td width="50%"><div style="color: red; font-weight: bold;">
						Note: All fields marked with <span>*</span> are mandatory.
					</div></td>
				<td>
					<div class="d-flex justify-content-end">
						<div class="mr-2">
							<button id="newBtn" class="btn  edit-btn"
								onclick="saveProductType()" type="button">Save</button>
						</div>
						<div class="mr-0">
							<button id="resetProdTypeBtn" class="btn  edit-btn"
								onclick="resetProducttyp()" type="button">Reset</button>
						</div>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-md-4">
			<div class="form-group">
				<label>Name <span class="mandatory">*</span></label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Name"
					id="productName"> <input type="hidden" id="productId">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Description</label> <input type="text"
					class="form-control transparenttxtbox" placeholder="Desc"
					id="productDesc">
			</div>
		</div>

		<div class="col-md-4">
			<div class="form-group">
				<label>Status <span class="mandatory">*</span></label>
				<div class="select">
				 <select id="productStatus"
					class="form-control">
					<option value="">Select</option>
					<option value="1">Active</option>
					<option value="0">Inactive</option>
				</select></div>
			</div>
		</div>
	</div>
</body>
</html>
