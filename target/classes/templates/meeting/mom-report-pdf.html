<!DOCTYPE html>
<html>
<head>
<title></title>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
<style>
@page {
	size: A4 portrait;
	padding: 0;
	margin: 4mm;
	border: 1px solid;
}

table {
	width: 100%;
	font-family: sans-serif;
	border-collapse: collapse;
	border-spacing: 0;
	-fs-table-paginate: paginate;
}

.border, table, th, td, table.border, table.border th, table.border td {
	border: 1px solid;
}

table {
	/*page-break-inside: avoid;*/
	font-size: 13px;
	font-weght: normal;
}

table.borderless, .border table.border-0, .border table.border-0 th,
	.border table.border-0 td {
	border: 0;
}

.table-fixed {
	table-layout: fixed;
}

.m-0 {
	margin: 0;
}

.p-0 {
	padding: 0;
}

.align-middle {
	vertical-align: middle;
}

.text-center {
	text-align: center;
}

.text-start {
	text-align: left;
}

.text-end {
	text-align: right;
}

.text-nowrap {
	text-wrap: nowrap;
}

.align-top {
	vertical-align: top;
}

.align-bottom {
	vertical-align: bottom;
}

.border-0, .border-0 th, .border-0 td {
	border: 0;
}

.bordered .border-left-0 {
	border-left: 0;
}

.bordered .border-right-0 {
	border-right: 0;
}

.border-0 .border-top, .border-top, .border-top th, .border-top td {
	border-top: 1px solid;
}

.border-0 .border-left, .border-left, .border-left th, .border-left td,
	th.border-left {
	border-left: 1px solid;
}

.border-0 .border-right, .border-right, .border-right th, .border-right td,
	th.border-right {
	border-right: 1px solid;
}

.border-0 .border-bottom, .border-bottom, .border-bottom th,
	.border-bottom td {
	border-bottom: 1px solid;
}

.ps-1 {
	padding-left: 10px;
}

.ps-0_5 {
	padding-left: 5px;
}

.pt-1 {
	padding-top: 10px;
}

.p-0_5 {
	padding: 2.5px;
}

.p-1 {
	padding: 10px;
}

.p-2 {
	padding: 20px;
}

.px-3 {
	padding-left: 15px;
	padding-right: 15px;
}

.m-1 {
	margin: 5px;
}

.mt-2 {
	margin-top: 20px;
}

/*img { width: 250px; }*/
.fs-24p {
	font-size: 24px;
}

.fs-18p {
	font-size: 18px;
}

.fs-16p {
	font-size: 16px;
}

.fs-14p, td.fs-14p {
	font-size: 14px;
}

.fs-12p {
	font-size: 12px;
}

.fs-10p {
	font-size: 10px;
}

.fs-9p {
	font-size: 9px;
}

.fw-normal {
	font-weight: normal;
}

.fw-bold {
	font-weight: 700;
}

.fw-bolder {
	font-weight: 900;
}

/*tbody td:first-child, tfoot td:first-child { border-left: 0; }*/
/*tbody td:last-child, tfoot td:last-child { border-right: 0; }*/
.h-pdf-xl, .h-pdf-xl td, .h-pdf-xl th {
	height: 80px;
}

.h-pdf, .h-pdf td, .h-pdf th {
	height: 13mm;
}

.h-pdf-next, .h-pdf-next td, .h-pdf-next th {
	height: 10px;
}

td.h-row {
	height: 20px;
}

td.h-row-smaller {
	height: 10px;
}

td.h-row-xs {
	height: 5px;
}

.bg-dark {
	background-color: #000000;
}

.bg-lightgrey {
	background-color: #FFF;
}

.text-white {
	color: #ffffff;
}

.rounded-1 {
	border-radius: 5px;
}

.font-serif {
	font-family: serif;
}

.font-vivian {
	font-family: 'Vivian', sans-serif;
}

/*.font-calibri { font-family: 'Calibri', sans-serif; }*/
[class^="ti-"], [class*=" ti-"] {
	font-family: 'themify';
	speak: none;
	font-style: normal;
	font-variant: normal;
	text-transform: none;
	line-height: 1;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	font-weight: 900;
}

.ti-check:before {
	content: "\e64c";
}

.ti-close:before {
	content: "\e646";
}

.position-absolute {
	position: absolute;
}

.w--5 {
	width: 6.6%;
}

.left-2 {
	left: 2%;
}

.p-12p {
	padding: 12px;
}

.container-mom {
	max-width: 800px;
	margin: 20px auto;
	padding: 20px;
	background: #fff;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h1 {
	text-align: center;
	color: #333;
}

.section-mom {
	margin-bottom: 20px;
}

.section-header-mom {
	background-color: #FFF;
	color: #000;
	padding: 7px;
	font-weight: bold;
	text-transform: uppercase;
	border: 1px solid #000;
	width: 741px;
}

.table-mom-report {
	width: 100%;
	border-collapse: collapse;
	margin-top: 0px;
}

table th, table td {
	border: 0;
	padding: 10px;
	text-align: left;
	border: .5px solid #000;
}

table th {
	font-weight: bold;
}

.conclusion-mom {
	background-color: #FFF;
	border: 1px solid #2196f3;
	padding: 10px;
	margin-top: 10px;
}

.attendance-list ul {
	list-style-type: disc;
}

.border-bottom-0 {
	border-bottom: 0;
}

.border-1 {
	border: 1px solid #000;
	width: 741px;
}

@media ( max-width : 768px) {
	.attendance-list {
		flex-direction: column;
	}
}
</style>
</head>
<body>
	<table class="borderless">
		<tr class="border-0">

			<td>
				<div style="position: absolute; left: 10px; top: 40px;">
					<!-- <img src="classpath:static/assets/images/oriFood.png" width="100"
						alt="orifood-logo" /> -->
						<img th:src="${orgLogoUrl}" width="200"
						alt="orifood-logo" />
				</div>
				<h1 class="m-0 fs-24p text-center" th:text="${orgNamee}"></h1>
				<h3 class="fs-16p text-center" th:text="${orgAddress}"></h3>
				<h4 class="text-center">
					<strong>Minutes of Meeting (MOM) Report For the Meeting Held on: <span th:text="${formattedDate}"></span></strong>
				</h4>
				
			</td>
		</tr>


	</table>

	<div>
		<!-- Meeting Details -->
		<div class="section-mom">
			<div class="section-header-mom border-bottom-0">Meeting Details</div>
			<table class="table-mom-report">
				<tr>
					
					<th>Meeting Title</th>
					<td th:text="${meetingDetails.meetingName}" colspan="3"></td>
				</tr>
				<tr>
					<th>Meeting Host</th>
					<td th:text="${meetingDetails.meetingHost}" colspan="3"></td>
					<!-- <th>Meeting Chair</th>
					<td th:text="${meetingDetails.meetingHost}"></td> -->
				</tr>
				<tr>
					<!-- <th>Meeting Date and Time</th>
					<td
						th:text="${meetingDetails.meetingDate} +' || '+ ${meetingDetails.meetingTime}"></td> -->
						<th>Meeting Date</th>
					<td th:text="${formattedDate}"></td>
					<th>Meeting Location</th>
					<td
						th:text="${#strings.isEmpty(meetingDetails.meetingLocation) ? meetingDetails.meetingMode : meetingDetails.meetingLocation}"></td>
				</tr>

				
			</table>
		</div>

		<!-- Attendance -->
		<div class="section-mom">
			<div class="section-header-mom border-bottom-0">Meeting
				Attendees</div>
			<div class="attendance-list d-flex justify-content-between border-1">
				<ul>
					<li th:each="attendee : ${participants}" th:text="${attendee}"></li>
				</ul>
			</div>
		</div>

		<!-- Agenda -->
		<div class="section-mom">
			<div class="section-header-mom border-bottom-0">Brief
				Description / Agenda</div>
			<div class="attendance-list d-flex justify-content-between border-1">
				<ul th:each="agenda : ${meetingAgenda}" th:text="${agenda}">

				</ul>
			</div>
		</div>

		<!-- Discussion Summary -->
		<!-- <div class="section-mom">
			<div class="section-header-mom border-bottom-0">Discussion
				Points</div>
			<table class="table-mom-report">
				<thead>
					<tr>
						<th width="30">No</th>
						<th>Items Discussed</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item, iterStat : ${discussionSummary}">
						<td th:text="${iterStat.index + 1}"></td>
						<td th:text="${item}"></td>
					</tr>
				</tbody>
			</table>
		</div> -->

		<!-- Responsibilities Assigned -->
		<div class="section-mom">
			<div class="section-header-mom border-bottom-0">Issues Assigned</div>
			<table class="table-mom-report">
				<thead>
					<tr>
						<th>No</th>
						<th>Issues</th>
						<th>Action Plan</th>
						<th>Raised By</th>
						<th>Assigned To</th>
						<th>Deadline</th>
						<th>Priority</th>
					</tr>
				</thead>
				 <tbody>
		            <!-- Check if responsibilities is null or empty -->
		            <tr th:if="${responsibilities == null || responsibilities == 'null' || responsibilities.isEmpty()}">
		                <td colspan="7" class="text-center">No issues assigned for today</td>
		            </tr>
		            <!-- Iterate and display responsibilities -->
		            <tr th:each="resp, iterStat : ${responsibilities}" th:unless="${responsibilities == null || responsibilities == 'null' || responsibilities.isEmpty()}">
		                <td th:text="${iterStat.index + 1}"></td>
		                <td th:text="${resp.responsibility}"></td>
		                <td th:text="${resp.curAction}"></td>
		                <td th:text="${resp.attendName}"></td>
		                <td th:text="${resp.assignedTo}"></td>
		                <td th:text="${resp.deadline}"></td>
		                <td th:text="${resp.priority}"></td>
		            </tr>
		        </tbody>
			</table>
		</div>
		<!--Summary Of The Meeting-->
		<!-- <div class="section-mom">
			<div class="section-header-mom border-bottom-0">Summary</div>
			<div class="attendance-list d-flex justify-content-between border-1">
				<ul th:text="${meetingSummary}">

				</ul>
			</div>
		</div> -->
		
		<div class="section-mom" th:if="${meetingSummary != null and meetingSummary != ''}">
		    <div class="section-header-mom border-bottom-0">Summary</div>
		    <div class="attendance-list d-flex justify-content-between border-1">
		        <ul th:text="${meetingSummary}">
		        </ul>
		    </div>
		</div>
		
	</div>
</body>

</html>
