<!DOCTYPE html>
<html>
<head>
<title>Attendance Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
  <style type="text/css">
  @page {
	size: A4 landscape;
	padding: 0;
	margin: 0;
}
    table {
      border-collapse: collapse;
      width: 100%;
      font-family: Arial, sans-serif;
      font-size: 10px;
    }
    
    th, td {
      border: 1px solid black;
      padding: 2px;
      text-align: center;
      height: 20px;
    }
    
    .employee-name {
      text-align: left;
      font-weight: bold;
      width: 150px;
    }
    
    .late-marks {
      width: 50px;
    }
    
    .date-header {
      background-color: #f0f0f0;
    }
    
    .weekend {
      background-color: #ffffaa;
    }
    
    .present {
      background-color: #ffffff;
    }
    
    .absent {
      background-color: #ffaaaa;
    }
    
    .half-day {
      background-color: #ffddaa;
    }
    
    .work-from-home {
      background-color: #aaffaa;
    }
    
    .time-entry {
      color: #000088;
    }
    
    .late-time {
      color: #ff0000;
    }
  </style>
</head>
<body>
 <div style="text-align: center;">
        <img th:src="@{${logo}}" alt="Logo" style="height: 60px;"/>
        <h2 th:text="${orgName}">Organization Name</h2>
    </div>
  <table style="table-layout: fixed;">
  <thead>
    <!-- Group columns into weeks -->
    <tr>
      <th width="8%">Name</th>
      <th th:each="day : ${daysInMonth}" th:text="${day}"></th>
      <th width="6%" >Late Reason</th>
    </tr>
   
  </thead>
  <tbody>
   
    <th:block th:each="emp : ${employees}">
    <!-- Row 1: Name and status -->
    <tr>
      <td style="font-weight: bold;" th:text="${emp.empName}"></td>
      <td th:each="day : ${daysInMonth}" th:text="${emp.statuses[day - 1]}">
      </td>
      <td rowspan="4"></td>
    </tr>

    <!-- Row 2: In Time -->
    <tr>
      <td>In Time</td>
      <td th:each="day : ${daysInMonth}" th:text="${emp.punchIns[day - 1]}">
      </td>
         </tr>

    <!-- Row 3: Out Time -->
    <tr>
      <td>Out Time</td>
      <td th:each="day : ${daysInMonth}" th:text="${emp.punchOuts[day - 1]}">
      </td>
         </tr>

    <!-- Row 4: Late By -->
    <tr>
      <td>Late By</td>
      <td  th:each="day : ${daysInMonth}" th:text="${emp.lateBy[day - 1]}">
      </td>
        </tr>
  </th:block>
  </tbody>
</table>
  </body>
</html>
