<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">
<head>
<style>
.appointment-btn {
	border: 1px solid rgb(191, 5, 255);
	background: transparent;
	color: rgb(191, 5, 255);
	padding: 6px 20px;
	font-size: 14px;
	transition: 0.3s ease;
	cursor: pointer;
}

.appointment-btn:hover, .appointment-btn.active {
	background-color: rgb(191, 5, 255);
	color: #fff;
}

/* .card {
	border: 1px solid #ddd;
	border-radius: 12px;
	padding: 20px;
	background-color: #fff;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
} */
.card-title {
	font-size: 1.25rem;
	margin-bottom: 15px;
}

.list-group-item {
	border: none;
	padding: 8px 0;
}

.colour-element {
	color: rgb(191, 5, 255);
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script
	src="/javaScript/patient/patientSelfService/patient-appointment.js"></script>
</head>
<body>

	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="d-flex">
				<div class="maincontentsec">
					<input type="hidden" id="userId" th:value="${session.USER_ID}" />
					<!--Sec Start-->
					<div id="tab1" class="tab-pane" role="tabpanel">
						<div class="d-flex flex-column flex-lg-row">

							<!--Left Sec Start-->
							<div class="box-sec" id="collapseWidthR1">
								<div class="out-box">
									<div class="d-flex justify-content-between p-2 gap-3 bdr-line">

										<div class="col-md-8 col-12">
											<div class="d-flex search-sec" id="quotSearchDiv">
												<input class="form-control me-2" type="text"
													placeholder="Search" id="quickFilter" autocomplete="off"
													onkeydown="handleEnter(event)">
												<button class="btn go-btn" type="button"
													onclick="onQuickFilterChanged()">Go</button>
												&nbsp;
												<button class="btn go-btn w-auto" type="button"
													onclick="resetBtn()">Reset</button>
											</div>
										</div>

										<div class="col-md-2 d-flex justify-content-end">
											<button class="btn btn-primary max-btn" id="collapseButtonR1"
												onclick="triggerExpansionR(1)" data-bs-toggle="tooltip"
												data-bs-placement="top" title="Expand">
												<i class="fa-solid fa-maximize" id="expandIconR1"></i> <i
													class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
											</button>
										</div>
									</div>
									<div class="card p-2 m-2">
										<div
											class="appointment-filter-btns d-flex gap-2 justify-content-center">
											<button class="appointment-btn active"
												onclick="filterAppointments('All',this)">All</button>
											<button class="appointment-btn"
												onclick="filterAppointments('OPD',this)">OPD</button>
											<!-- <button class="appointment-btn"
												onclick="filterAppointments('IPD',this)">IPD</button> -->
											<button class="appointment-btn"
												onclick="filterAppointments('Radiology',this)">
												Radiology</button>
											<button class="appointment-btn"
												onclick="filterAppointments('Pathology',this)">
												Pathology</button>
											<button class="appointment-btn"
												onclick="filterAppointments('Ambulance',this)">
												Ambulance</button>
										</div>


										<div class="maincontentsec mt-2">
											<div id="patientAppointmentGrid"
												style="width: 100%; height: 570px;" class="ag-theme-alpine"></div>
										</div>
									</div>
								</div>
							</div>

							<!--Left Sec End-->


							<!--Right Sec Start-->
							<div class="box-sec" id="collapseWidthL1">
								<div class="out-box">
									<div
										class="d-flex justify-content-between flex-row-reverse align-items-center p-2 bdr-line">

										<button class="btn btn-primary max-btn" id="collapseButtonL1"
											type="button" onclick="triggerExpansionL(1)"
											data-bs-toggle="tooltip" title="Expand">
											<i class="fa-solid fa-maximize" id="expandIconL1"></i> <i
												class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
										</button>
										<div class="d-flex gap-2">
											<ul class="nav nav-pills newtab" role="tablist" id="tabMenu">
												<li class="nav-item" role="presentation"
													id="information-tab"><a class="nav-link active"
													data-bs-toggle="pill" href="#information"
													aria-selected="false">Information</a></li>
												<!--<li class="nav-item" role="presentation" id="notes-tab"><a
                                                class="nav-link" data-bs-toggle="pill" href="#notes"
                                                aria-selected="false">Notes</a></li>
                                        <li class="nav-item" role="presentation" id="invest-tab"><a
                                                class="nav-link" data-bs-toggle="pill" href="#invest"
                                                aria-selected="false" onclick="investigationTab()">Investigation</a></li>

                                        <li class="nav-item" role="presentation" id="advice-tab"><a
                                                class="nav-link" data-bs-toggle="pill" href="#advice"
                                                aria-selected="false">Advice</a></li>-->


											</ul>

										</div>
									</div>

									<!--Tab Content Start-->
									<div class="tab-content flex-fill h-25" id="tabContent">
										<div class="requisition-tbl d-flex flex-column h-100">

											<div class="tab-content crd card m-2 mt-0">
												<!--Personal-->
												<div class="tab-pane show active h-100 p-2" id="information"
													role="tabpanel">
													<div class="requisition-tbl d-flex flex-column h-100">
														<div class="mb-2 table-responsive">
															<table class="table table-bordered mb-0" width="100%">
																<tbody>
																	<tr valign="middle">
																		<td width="50%">
																			<div>
																				<strong id="appointmentId"></strong>
																			</div>
																		</td>
																		<td>
																			<div class="d-flex justify-content-end flxwrap">
																				<button class="btn btn-primary  edit-btn "
																					type="button" onclick="clearAllFieds()"
																					id="addBtnId">Add</button>
																				<button class="btn btn-primary  edit-btn d-none"
																					type="button" onclick="cancel()" id="cancelBtn">Cancel</button>
																				<button class="btn btn-primary edit-btn d-none"
																					type="button" id="editAppointment"
																					onclick="rescheduleAppointment()">
																					Reschedule</button>
																				<!-- <button class="btn btn-primary max-btn mr-2 d-none"
                                                                         id="downloadPDFBtn"
                                                                         onclick="dischargePdfDownload()"
                                                                         data-bs-toggle="tooltip" data-bs-placement="top"
                                                                         title="" data-bs-original-title="Download PDF">
                                                                     <i class="fa-solid fa-download"
                                                                        id="downloadDischargePDFIcon"></i>
                                                                 </button>-->
																				<button class="btn btn-primary edit-btn d-none"
																					type="button" id="deleteAppointment"
																					onclick="deleteAppointment()">Delete</button>
																				<button class="btn btn-primary edit-btn d-none"
																					type="button" id="saveAppointmentBtn"
																					onclick="saveAppointment()">Save</button>
																			</div>

																		</td>
																	</tr>
																</tbody>
															</table>
														</div>
														<div class="card p-2">
															<div class="row d-none" id="addAppointmentDiv">
																<div
																	class="align-items-xl-center d-flex flex-column flex-lg-row justify-content-between lh-lg">
																	<h6 class="m-0">Appointment Details</h6>
																	<div class="mandatory-txt text-end">
																		Note: All fields marked with <span>*</span> are
																		mandatory.
																	</div>
																</div>
																<div class="col-md-4">
																	<label for="appointmentTypeSelect" class="form-group">Select
																		Appointment Type:</label><input type="hidden"
																		id="appointmentId"> <select
																		id="appointmentTypeSelect" class="form-select"
																		onchange="toggleFields(this.value)">
																		<option value="" disabled>Select Appointment
																			Type</option>
																		<option value="OPD">OPD</option>
																		<option value="Pathology">Pathology</option>
																		<option value="Radiology">Radiology</option>
																		<option value="Ambulance">Ambulance</option>
																	</select>
																</div>
																<div class="col-md-4 opd-sec">
																	<div class="form-group">
																		<label>Department <span class="mandatory">*</span></label>
																		<select id="departmentType" class="form-select"
																			onchange="getDoctorsList('0')"
																			onblur="removeValid(event)">
																			<option th:value="null">Select</option>
																			<!-- <option th:each="c,iter:${getDoctorsList}"
                                                                            th:value="${c.key}" th:text="${c.name}"></option> -->
																		</select> <span class="focus"></span>
																	</div>
																</div>
																<div class="col-md-4 opd-sec">
																	<div class="form-group">
																		<label>Doctor <span class="mandatory">*</span></label>
																		<select id="doctor" class="form-select"
																			onchange="getDocFee()" onblur="removeValid(event)">
																			<option th:value="null">Select</option>
																		</select> <span class="focus"></span>
																	</div>
																</div>
																<div class="col-md-4 opd-sec">
																	<div class="form-group">
																		<label>Doctor's Fee</label> <input type="text"
																			id="docFee" value="0.00" class="form-control"
																			readonly>
																	</div>
																</div>
																<div class="col-md-4">
																	<div class="form-group calendar_box">
																		<label>Appointment Date</label><span class="mandatory">*</span>
																		<input type="text" id="dateOfAppointment"
																			class="form-control" onblur="removeValid(event)"
																			th:attr="onkeyup=|formatDate('dateOfAppointment','${session.DATEFORMAT_JS}')|">
																		<i class="ti-calendar picker_calendar"
																			id="apointmentClaendar"></i>
																	</div>
																</div>

																<div class="col-md-4">
																	<div class="form-group">
																		<label>Time of Appointment</label><span
																			class="mandatory">*</span> <input type="time"
																			class="form-control" id="timeOfAppointment">
																	</div>
																</div>
																<div class="col-md-4 amb-sec">
																	<div class="form-group">
																		<label>Ambulance Type</label> <span class="mandatory">*</span>
																		<div class="select">
																			<select id="typeAmb" onblur="removeValid(event)">
																				<option th:value="null" disabled selected>Select</option>
																				<option th:each="c,iter:${ambulanceTypeList}"
																					th:value="${c.key}" th:text="${c.name}"></option>
																			</select> <span class="focus"></span>
																		</div>
																	</div>
																</div>
																<div class="col-md-4 amb-sec">
																	<div class="form-group">
																		<label>Requirements</label>
																		<div class="select">
																			<select id="reqAmb" onblur="removeValid(event)">
																				<option th:value="null" disabled selected>Select</option>
																				<option th:each="c,iter:${ambulanceRequirementList}"
																					th:value="${c.key}" th:text="${c.name}"></option>
																			</select> <span class="focus"></span>
																		</div>
																	</div>
																</div>
																<div class="col-md-6 opd-sec">
																	<div class="form-group">
																		<label>Description</label> <input type="textarea"
																			class="form-control" id="appointmentDescription">
																	</div>
																</div>
																<!--<div class="col-md-4 d-none" id="driverDiv">
                                                                <div class="form-group">
                                                                    <label>Driver Name</label> <input type="text"
                                                                                                      class="form-control"
                                                                                                      id="driverName">
                                                                </div>
                                                            </div>-->


																<div class="col-md-4 d-none" id="attendantDiv">
																	<div class="form-group" id="attendantDiv">
																		<label>Attendant Name</label> <input type="text"
																			class="form-control" id="attendantName">
																	</div>
																</div>
																<div class="col-md-3 rad-sec">
																	<div class="form-group">
																		<label>Full Name <span class="mandatory">*</span></label>
																		<input type="text" id="fullName" class="form-control">
																	</div>
																</div>
																<div class="col-md-3 rad-sec">
																	<div class="form-group">
																		<label>Age <span class="mandatory">*</span></label> <input
																			type="text" id="age" class="form-control"
																			maxlength="3">
																	</div>
																</div>
																<div class="col-md-3 rad-sec">
																	<div class="form-group">
																		<label>Mobile No</label> <span class="mandatory">*</span>
																		<input type="text" class="form-control" id="mobNo"
																			maxLength="10"
																			onkeyup="mobVal1();checkNumeric('mobNo');"
																			onblur="removeValid(event)"> <span
																			id="error9" class="formValidation1"></span>
																	</div>
																</div>
																<div class="col-md-3 rad-sec">
																	<div class="form-group">
																		<label>Gender <span class="mandatory">*</span></label>
																		<select id="gender" class="form-select">
																			<option value="" disabled>Select</option>
																			<option th:each="c,iter:${genderList}"
																				th:value="${c.key}" th:text="${c.name}"></option>
																		</select>
																	</div>
																</div>
																<div class="d-flex flex-column gap-2 h-100 mt-3"
																	id="testDetailsSection">
																	<div class="col cnt-sp-bw flex-grow-0">
																		<h5 class="sub-header-new m-0 p-0">Test Details</h5>
																		<div class="d-flex gap-2 task-btn-sec">
																			<button
																				class="border-0 btn-transition btn btn-outline-primary br-m-btn-tst tst"
																				title="Add" data-bs-toggle="tooltip"
																				onclick="addTest()">
																				<i class="fa fa-plus-square" aria-hidden="true"></i>
																			</button>
																			<!-- <button class="border-0 btn-transition btn btn-outline-primary br-dis-tst br-m-btn-tst tst" title="Edit" data-bs-toggle="tooltip" onclick="editTestDetails()" disabled>
              <i class="fa fa-pencil-square" aria-hidden="true"></i>
            </button> -->
																			<button
																				class="border-0 btn-transition btn btn-outline-primary br-dis-tst br-m-btn-tst tst"
																				title="Delete" data-bs-toggle="tooltip" disabled
																				onclick="deleteTest()">
																				<i class="fa fa-trash"></i>
																			</button>
																			<button class="btn btn-primary edit-btn br-s-btn-tst"
																				title="Save" data-bs-toggle="tooltip"
																				onclick="saveTest()">Save</button>
																			<button class="btn btn-primary edit-btn br-s-btn-tst"
																				title="Cancel" data-bs-toggle="tooltip"
																				onclick="cancelTest()">Cancel</button>
																		</div>
																	</div>
																	<div class="grid-container br-m-btn-tst">
																		<div id="testGridGrid"
																			class="ag-theme-alpine grid-size"></div>
																	</div>
																	<div class="row br-s-btn-tst mb-5">
																		<input type="hidden" id="tstSlNo"> <input
																			type="hidden" id="testIds"> <input
																			type="hidden" id="testItemId">
																		<div class="col-lg-6">
																			<div class="form-group">
																				<label>Test Name:</label><span class="mandatory">*</span>
																				<div class="select">
																					<select class="searchable-select" id="testName"
																						onchange="setTestCategory()">
																						<option value="">Select</option>
																					</select>
																				</div>
																			</div>
																		</div>


																		<div class="col-lg-6">
																			<div class="form-group">
																				<label>Test Category</label> <input type="text"
																					id="testCategory" placeholder=""
																					class="form-control" readonly> <input
																					type="hidden" id="testCategoryId">
																			</div>
																		</div>
																	</div>
																</div>
																<div id="activity"
																	style="height: 100vh; margin-top: 3px;"
																	class="ag-theme-alpine d-none"></div>

															</div>
															<div id="ambulanceDetails" class="fs--13"></div>
															<div id="opdDetails" class="fs--13"></div>
															<div id="radiologyDetails" class="fs--13"></div>
															<div id="pathologyDetails" class="fs--13"></div>
														</div>
													</div>
												</div>
												<!--Personal End-->
											</div>
										</div>
										<!--Tab Content End-->
									</div>
								</div>
								<!--Right Sec End-->
							</div>
						</div>
						<!--Sec End-->
					</div>
				</div>
			</div>
		</div>
</body>
</html>
