<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}" lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/patient/patientSelfService/dashboard.css">
  <link rel="stylesheet" href="/assets/css/patient/patientSelfService/myCare.css">
  <script src="/javaScript/patient/patientSelfService/myCare.js"></script>

  <link href="https://unpkg.com/slim-select@latest/dist/slimselect.css" rel="stylesheet"/>
  <script src="https://unpkg.com/slim-select@latest/dist/slimselect.min.js"></script>

</head>
<body>
<div layout:fragment="content" class="maincontent">
  <div class="container-fluid tabMyCare">
    <div class="d-flex flex-column flex-lg-row">
      <div class="box-sec" id="collapseWidthR1">
        <div class="out-box">
          <div class="d-flex flex-column h-100">
            <div class="d-flex justify-content-between p-2 border-bottom">
              <div class="col-md-8 col-12">
                <div class="d-flex gap-2 search-sec">
                  <input class="form-control" type="text" placeholder="Search...">
                  <button class="btn go-btn" type="button">Go</button>
                  <button class="btn go-btn" type="reset">Reset</button>
                </div>
              </div>
              <div class="col-md-2 text-end">
                <button class="btn max-btn" id="collapseButtonR1" onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                  <i class="fa-solid fa-maximize" id="expandIconR1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                </button>
              </div>
            </div>
            <div class="card p-2 m-2">
              <div class="vtsack gap-2 h-100">
                <h5>Profile</h5>
                <hr class="my-2 p-0 start-0 top-0 w-100">
                <div class="row row-cols-3 g-2">
                  <div class="col">
                    <label for="myCare--patient-id" class="form-label">Patient ID</label>
                    <input type="text" class="form-control" id="myCare--patient-id" placeholder="Patient ID" value="P0001">
                  </div>
                  <div class="col">
                    <label for="myCare--gender" class="form-label">Gender</label>
                    <input type="text" class="form-control" id="myCare--gender" placeholder="Gender" value="Male">
                  </div>
                  <div class="col">
                    <label for="myCare--age" class="form-label">Age</label>
                    <input type="text" class="form-control" id="myCare--age" placeholder="Age" value="37">
                  </div>
                  <div class="col">
                    <label for="myCare--firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="myCare--firstName" placeholder="First Name" value="John">
                  </div>
                  <div class="col">
                    <label for="myCare--middleName" class="form-label">Middle Name</label>
                    <input type="text" class="form-control" id="myCare--middleName" placeholder="Middle Name" value="Spencer">
                  </div>
                  <div class="col">
                    <label for="myCare--lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="myCare--lastName" placeholder="Last Name" value="Doe">
                  </div>
                  <div class="col">
                    <label for="myCare--ethinicity" class="form-label">Ethinicity</label>
                    <input type="text" class="form-control" id="myCare--ethinicity" placeholder="Ethinicity" value="General">
                  </div>
                  <div class="col">
                    <label for="myCare--country" class="form-label">Country</label>
                    <input type="text" class="form-control" id="myCare--country" placeholder="Country" value="India">
                  </div>
                  <div class="col">
                    <label for="myCare--state" class="form-label">State</label>
                    <input type="text" class="form-control" id="myCare--state" placeholder="State" value="Odisha">
                  </div>
                  <div class="col">
                    <label for="myCare--pinZip" class="form-label">Pin/Zip</label>
                    <input type="text" class="form-control" id="myCare--pinZip" placeholder="Pin/Zip" value="751015">
                  </div>
                  <div class="col">
                    <label for="myCare--contactNo" class="form-label">Contact No</label>
                    <input type="text" class="form-control" id="myCare--contactNo" placeholder="Contact No" value="1234567890">
                  </div>
                  <div class="col">
                    <label for="myCare--alternateNo" class="form-label">Alternate No</label>
                    <input type="text" class="form-control" id="myCare--alternateNo" placeholder="Alternate No" value="1234567890">
                  </div>
                  <div class="col-12">
                    <label for="myCare--address" class="form-label">Address</label>
                    <textarea rows="3" class="form-control" id="myCare--address" placeholder="Address" value="Lorem Ipsum..."></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="box-sec" id="collapseWidthL1">
        <div class="out-box">
          <div class="d-flex flex-column h-100">
            <div class="d-flex justify-content-between p-2 border-bottom">
              <!--Right Inner Tab Start-->
              <ul class="nav nav-pills newtab myCareTabs" role="tablist">
                <li class="nav-item" id="liVitals"><a class="nav-link text-nowrap active" data-bs-toggle="pill" href="#tabVitals" onclick="activityTabs('tabVitals');">Vitals</a></li>
                <li class="nav-item" id="liAssessment"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#tabAssessment" onclick="activityTabs('tabAssessment');">Assessment</a></li>
                <li class="nav-item" id="liHRA"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#tabHRA" onclick="activityTabs('tabHRA');">HRA</a></li>
                <li class="nav-item" id="liActivities"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#tabActivities" onclick="activityTabs('tabActivities');">Activities</a></li>
                <li class="nav-item" id="liEHR"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#tabEHR" onclick="activityTabs('tabEHR');">EHR</a></li>
              </ul>
              <button class="btn max-btn" id="collapseButtonL1" type="button" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" title="Expand">
                <i class="fa-solid fa-maximize" id="expandIconL1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
              </button>
            </div>
            <div class="tab-content flex-fill p-2">
              <div id="tabVitals" class="tab-pane fade show active h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName0"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toNext()" type="button">Next</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div class="vstack gap-2 h-100">
                      <div class="row row-cols-2 g-2">
                        <div class="col">
                          <label for="vitals--fromDate" class="form-label">From Date</label>
                          <div class="position-relative">
                            <input type="text" class="form-control" id="vitals--fromDate" placeholder="DD-MMM-YYYY">
                            <i class="ti-calendar picker_calendar" id="vitals--fromDate-picker"></i>
                          </div>
                        </div>
                        <div class="col">
                          <label for="vitals--toDate" class="form-label">To Date</label>
                          <div class="position-relative">
                            <input type="text" class="form-control" id="vitals--toDate" placeholder="DD-MMM-YYYY">
                            <i class="ti-calendar picker_calendar" id="vitals--toDate-picker"></i>
                          </div>
                        </div>
                      </div>
                      <div class="grid-container">
                        <div id="gridVitals" class="ag-theme-alpine grid-size"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div id="tabAssessment" class="tab-pane fade show h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName1"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toPrev()" type="button">Previous</button>
                      <button class="btn m-0 edit-btn" onclick="toNext()" type="button">Next</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div class="vstack gap-2 h-100">
                      <div class="row row-cols-2 g-2">
                        <div class="col">
                          <label for="assessment--fromDate" class="form-label">From Date</label>
                          <div class="position-relative">
                            <input type="text" class="form-control" id="assessment--fromDate" placeholder="DD-MMM-YYYY">
                            <i class="ti-calendar picker_calendar" id="assessment--fromDate-picker"></i>
                          </div>
                        </div>
                        <div class="col">
                          <label for="assessment--toDate" class="form-label">To Date</label>
                          <div class="position-relative">
                            <input type="text" class="form-control" id="assessment--toDate" placeholder="DD-MMM-YYYY">
                            <i class="ti-calendar picker_calendar" id="assessment--toDate-picker"></i>
                          </div>
                        </div>
                      </div>
                      <div class="grid-container">
                        <div id="gridAssessment" class="ag-theme-alpine grid-size"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div id="tabHRA" class="tab-pane fade show h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName2"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toPrev()" type="button">Previous</button>
                      <button class="btn m-0 edit-btn" onclick="toNext()" type="button">Next</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div class="ag-theme-alpine" id="gridPhysicalActivity" style="height: 100vh;"></div>
                  </div>
                </div>
              </div>
              <div id="tabActivities" class="tab-pane fade show h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName3"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toPrev()" type="button">Previous</button>
                      <button class="btn m-0 edit-btn" onclick="toNext()" type="button">Next</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div class="d-flex flex-column gap-2 h-100">
                      <h5>Step Counts</h5>
                      <div class="grid-container">
                        <div id="gridActivities1" class="ag-theme-alpine grid-size"></div>
                      </div>
                      <h5>Inactive Alerts</h5>
                      <div class="grid-container">
                        <div id="gridActivities2" class="ag-theme-alpine grid-size"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div id="tabEHR" class="tab-pane fade show h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName4"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toPrev()" type="button">Previous</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div class="d-flex flex-column gap-2 h-100">
                      <div class="border rounded p-2 hstack justify-content-between">
                        <h5>Current Packages</h5>
                        <div class="d-flex gap-2 flex-wrap">
                          <button class="btn go-btn invisible">&nbsp;</button>
                        </div>
                      </div>
                      <div class="grid-container">
                        <div id="gridEHR1" class="ag-theme-alpine grid-size"></div>
                      </div>
                      <div class="border rounded p-2 hstack justify-content-between">
                        <h5>Renewal Summary</h5>
                        <div class="d-flex gap-2 flex-wrap">
                          <button class="btn go-btn">Pay</button>
                        </div>
                      </div>
                      <div class="grid-container">
                        <div id="gridEHR2" class="ag-theme-alpine grid-size"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
