<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/master}" lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/patient/patientSelfService/dashboard.css">
  <link rel="stylesheet" href="/assets/css/patient/patientSelfService/package.css">
  <script src="/javaScript/patient/patientSelfService/package.js"></script>

  <link href="https://unpkg.com/slim-select@latest/dist/slimselect.css" rel="stylesheet"/>
  <script src="https://unpkg.com/slim-select@latest/dist/slimselect.min.js"></script>

</head>
<body>
<div layout:fragment="content" class="maincontent">
  <div class="container-fluid tabPackage">
    <div class="d-flex flex-column flex-lg-row">
      <div class="box-sec" id="collapseWidthR1">
        <div class="out-box">
          <div class="d-flex flex-column h-100">
            <div class="d-flex justify-content-between p-2 border-bottom">
              <div class="col-md-8 col-12">
                <div class="d-flex gap-2 search-sec">
                  <input class="form-control" type="text" placeholder="Search...">
                  <button class="btn go-btn" type="button">Go</button>
                  <button class="btn go-btn" type="reset">Reset</button>
                </div>
              </div>
              <div class="col-md-2 text-end">
                <button class="btn max-btn" id="collapseButtonR1" onclick="triggerExpansionR(1)" data-bs-toggle="tooltip" data-bs-placement="top" title="Expand">
                  <i class="fa-solid fa-maximize" id="expandIconR1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconR1"></i>
                </button>
              </div>
            </div>
            <div class="card p-2 m-2">
              <div id="gridPackage" style="height: 100vh;" class="ag-theme-alpine"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="box-sec" id="collapseWidthL1">
        <div class="out-box">
          <div class="d-flex flex-column h-100">
            <div class="d-flex justify-content-between p-2 border-bottom">
              <!--Right Inner Tab Start-->
              <ul class="nav nav-pills newtab packageTabs" role="tablist">
                <li class="nav-item" id="liPackage"><a class="nav-link text-nowrap active" data-bs-toggle="pill" href="#tabPackage" onclick="activityTabs('tabPackage');">Package</a></li>
                <li class="nav-item" id="liSchedule"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#tabSchedule" onclick="activityTabs('tabSchedule');">Schedule</a></li>
                <li class="nav-item" id="liAssets"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#tabAssets" onclick="activityTabs('tabAssets');">Assets</a></li>
                <li class="nav-item" id="liRenewal"><a class="nav-link text-nowrap" data-bs-toggle="pill" href="#tabRenewal" onclick="activityTabs('tabRenewal');">Renewal</a></li>
              </ul>
              <button class="btn max-btn" id="collapseButtonL1" type="button" onclick="triggerExpansionL(1)" data-bs-toggle="tooltip" title="Expand">
                <i class="fa-solid fa-maximize" id="expandIconL1"></i> <i class="fa-solid fa-minimize d-none" id="shrinkIconL1"></i>
              </button>
            </div>
            <div class="tab-content flex-fill p-2">
              <div id="tabPackage" class="tab-pane fade show active h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName0"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toNext()" type="button">Next</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div class="row row-cols-2 g-2">
                      <div class="col">
                        <label for="package--program-id" class="form-label">Program ID</label>
                        <input type="text" class="form-control" id="package--program-id" placeholder="Program ID" value="CTR0001">
                      </div>
                      <div class="col">
                        <label for="package--care-program-name" class="form-label">Care Program Name</label>
                        <input type="text" class="form-control" id="package--care-program-name" placeholder="Care Program Name" value="Health Check-ups">
                      </div>
                      <div class="col">
                        <label for="package--machine" class="form-label">Machine</label>
                        <input type="text" class="form-control" id="package--machine" placeholder="Machine" value="Cardio Ring">
                      </div>
                      <div class="col">
                        <label for="package--activities" class="form-label">Activities</label>
                        <select class="package-select" aria-label="Location Dropdown" id="package--activities" multiple>
                          <option value="1">One</option>
                          <option value="2">Two</option>
                          <option value="3" selected>Heart Rate</option>
                          <option value="4" selected>Blood Pressure</option>
                          <option value="5" selected>Body Temperature</option>
                          <option value="6" selected>Blood Glucose</option>
                        </select>
                      </div>
                      <div class="col">
                        <label for="package--country" class="form-label">Country</label>
                        <select class="package-select" aria-label="Location Dropdown" id="package--country">
                          <option value="1">One</option>
                          <option value="2">Two</option>
                          <option value="3" selected>India</option>
                        </select>
                      </div>
                      <div class="col">
                        <label for="package--state" class="form-label">State</label>
                        <select class="package-select" aria-label="Location Dropdown" id="package--state">
                          <option value="1">One</option>
                          <option value="2">Two</option>
                          <option value="3" selected>Odisha</option>
                        </select>
                      </div>
                      <div class="col">
                        <label for="package--location" class="form-label">Location</label>
                        <select class="package-select" aria-label="Location Dropdown" id="package--location">
                          <option value="1">One</option>
                          <option value="2">Two</option>
                          <option value="3" selected>Bhubaneswar</option>
                        </select>
                      </div>
                      <div class="col">
                        <label for="package--pin" class="form-label">Pin/Zip</label>
                        <input type="text" class="form-control" id="package--pin" placeholder="Pin/Zip" value="751015">
                      </div>
                      <div class="col">
                        <label for="package--status" class="form-label">Status</label>
                        <input type="text" class="form-control" id="package--status" placeholder="Status" value="Active">
                      </div>
                      <div class="col">
                        <label for="package--since" class="form-label">Since</label>
                        <input type="text" class="form-control" id="package--since" placeholder="Since" value="March, 2025">
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div id="tabSchedule" class="tab-pane fade show h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName1"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toPrev()" type="button">Previous</button>
                      <button class="btn m-0 edit-btn" onclick="toNext()" type="button">Next</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div id="gridSchedule" style="height: 100vh;" class="ag-theme-alpine"></div>
                  </div>
                </div>
              </div>
              <div id="tabAssets" class="tab-pane fade show h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName2"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toPrev()" type="button">Previous</button>
                      <button class="btn m-0 edit-btn" onclick="toNext()" type="button">Next</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div id="gridAssets" style="height: 100vh;" class="ag-theme-alpine"></div>
                  </div>
                </div>
              </div>
              <div id="tabRenewal" class="tab-pane fade show h-100">
                <div class="d-flex flex-column gap-2 h-100">
                  <div class="d-flex w-100 justify-content-between align-items-center p-2 border rounded">
                    <div class="project-name flex-1"><span class="head-user-name" id="pName3"></span></div>
                    <div class="d-flex justify-content-end gap-2 flex-wrap flex-1">
                      <button class="btn m-0 edit-btn" onclick="toPrev()" type="button">Previous</button>
                    </div>
                  </div>
                  <div class="card p-2">
                    <div class="d-flex flex-column gap-2 h-100">
                      <div class="border rounded p-2 hstack justify-content-between">
                        <h5>Current Packages</h5>
                        <div class="d-flex gap-2 flex-wrap">
                          <button class="btn go-btn invisible">&nbsp;</button>
                        </div>
                      </div>
                      <div class="grid-container">
                        <div id="gridRenewal1" class="ag-theme-alpine grid-size"></div>
                      </div>
                      <div class="border rounded p-2 hstack justify-content-between">
                        <h5>Renewal Summary</h5>
                        <div class="d-flex gap-2 flex-wrap">
                          <button class="btn go-btn">Pay</button>
                        </div>
                      </div>
                      <div class="grid-container">
                        <div id="gridRenewal2" class="ag-theme-alpine grid-size"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
