}

margin-top:7px !important;} */
.snackbar {
	visibility: hidden;
	min-width: 150px;
	margin-left: -125px;
	background-color: #BF05FF;
	color: #fff;
	text-align: center;
	border-radius: 4px;
	padding: 16px;
	position: fixed;
	z-index: 1000;
	left: 50%;
	bottom: 30px;
	font-size: 14px;
	opacity: 0;
	transition: opacity 0.5s, bottom 0.5s;
}

.snackbar.show {
	visibility: visible;
	opacity: 1;
	bottom: 50px;
}
</style>
<script>
	$(document).ready(function() {
        setTabAsDefault();

        var gridDiv = document.querySelector('#myGrid');
		new agGrid.Grid(gridDiv, gridOptions);
		
 
	    // Retrieve data from the hidden input
	    const hiddenInput = document.getElementById("executiveData");
	   
	    const rowData = hiddenInput ? JSON.parse(hiddenInput.value) : [];
	    console.log("Executive List=====>",rowData);
	    
	    // Set data to the grid
	    gridOptions.api.setRowData(rowData);
		
		

	});
	
	/* -------------------search bar for mygrid1------------------------ */

	function onQuickFilterChanged() {
		gridOptions.api
				.setQuickFilter(document.getElementById('quickFilter').value);
		  var displayedRowCount = gridOptions.api.getDisplayedRowCount();
		  
		    var len = displayedRowCount;
			$('#totalReq').find('span').html(len);
	}

	function cancelBar() {
		var id = document.getElementById("closeKey");
		id.style.display = "block";

		if ($('#quickFilter').val() == null || $('#quickFilter').val() == "") {
			id.style.display = "none";
		}

	    var len = gridOptions.api.getDisplayedRowCount();
		$('#totalReq').find('span').html(len);
	}


	/* ------------ag grid for leave apply(parent table)----------------------- */

	const columnDefs = 
	[
			{
				headerCheckboxSelection : false,
				headerCheckboxSelectionFilteredOnly : true,
				checkboxSelection : true,
				width : 10,
				sortable : false,
				filter : false,
				resizable : true,
				pinned: 'left'
			},
			{
				headerName : 'Executive Id',
				field : "key",
				width : 120,
				pinned: 'left',
				 
			} ,
			{
				headerName : 'Executive Name',
				field : "name",
				width : 120,
				pinned: 'left',
				 
			} ]; 

	const gridOptions = {
		columnDefs : columnDefs,
		defaultColDef : {
			sortable : true,
			filter : true,
			resizable : true,
			width : 150,
			height : 10
		},
		rowSelection : 'single',
		pagination : true,
		paginationPageSize: 15, 
		onFirstDataRendered: function(params) {
			params.api.selectIndex(0, true, true);
		},
		onSelectionChanged : rowSelectExecutive,
		suppressRowClickSelection : true,
		getRowNodeId : function(data) {
			return data.key;
		}

	};
 
	function rowSelectExecutive() {
		setTabAsDefault();
		var selectedRows = gridOptions.api.getSelectedRows();
		var selectedRow=selectedRows[0];
		var executiveId=selectedRow.key;
		leadDetailsByExecutive(executiveId);
		 
	}
 
	function setTabAsDefault() {
		document.querySelectorAll('.nav-link').forEach((link) => {
			link.classList.remove('active');
			link.setAttribute('aria-selected', 'false');
		});
		const executiveTab = document.querySelector('#executiveReport-tab a.nav-link');
		if (executiveTab) {
			executiveTab.classList.add('active');
			executiveTab.setAttribute('aria-selected', 'true');
		} else {
			console.error('Executive Tab element not found.');
			return;
		}
		document.querySelectorAll('.tab-pane').forEach((tab) => {
			tab.classList.remove('show', 'active');
		});
		const executiveTabContent = document.querySelector('#executiveReport');
		if (executiveTabContent) {
			executiveTabContent.classList.add('show', 'active');
		} else {
			console.error('Executive tab content pane not found.');
		}
	}
	function showSnackbar(message) {
		  const snackbar = document.getElementById("snackbar");
		  snackbar.textContent = message;
		  snackbar.className = "snackbar show";
		  setTimeout(() => {
		    snackbar.className = snackbar.className.replace("show", "");
		  }, 3000);  
		}
	function disableAllFields() {
	    const idsToDisable = [
	        "empNameList", "empID", "leaveApplyDate", "leaveType", 
	        "fromDate", "toDate", "totalLeave", "reason", 
	        "uploadWarDoc_0","saveLeave"
	    ];
	    idsToDisable.forEach(id => {
	        const element = document.getElementById(id);
	        if (element) {
	            element.disabled = true;
	        }
	    });
	    const calendarIcons = document.querySelectorAll(".picker_calendar");
	    calendarIcons.forEach(icon => {
	        icon.style.pointerEvents = "none";
	        icon.style.opacity = "0.5";  
	    });
	}
	function enableAllFields() {
	    const idsToEnable = [
	        "empNameList", "empID", "leaveApplyDate", "leaveType", 
	        "fromDate", "toDate", "totalLeave", "reason", 
	        "uploadWarDoc_0","saveLeave"
	    ];
	    idsToEnable.forEach(id => {
	        const element = document.getElementById(id);
	        if (element) {
	            element.disabled = false;
	        }
	    });
	    const calendarIcons = document.querySelectorAll(".picker_calendar");
	    calendarIcons.forEach(icon => {
	        icon.style.pointerEvents = "auto";
	        icon.style.opacity = "1";  
	    });
	}
function addNewTask(){
	$(".formValidation").remove();
	$("#toggleSection").removeClass("d-none");
	$("#closeTask").removeClass("d-none");
	$("#saveTask").removeClass("d-none");
	$("#addTask").addClass("d-none");
	$("#title").val("")
	$("#customerId").val("")
	$("#priority").val("")
	$("#leadFirstName").val("")
	$("#leadLastName").val("")
	$("#leadMobile").val("")
	$("#commentck").val("")
	$("#executive").val("");
	$("#myGridTask").hide();
}
function closeTask(){
    $(".formValidation").remove();
	$("#title").val("")
	$("#customerId").val("")
	$("#priority").val("")
	$("#leadFirstName").val("")
	$("#leadLastName").val("")
	$("#leadMobile").val("")
	$("#commentck").val("")
	$("#executive").val("")
	$("#toggleSection").addClass("d-none");
	$("#closeTask").addClass("d-none");
	$("#saveTask").addClass("d-none");
	$("#addTask").removeClass("d-none");
	$("#myGridTask").show();
}

function adminApprove(id) {
	var selectedNodes = leadgridOptions.api.getSelectedNodes();
	var selectedData = selectedNodes.map(node => node.data);
	var leadId = selectedData.map(node => node.leadId);
	$.ajax({
		type: "GET",
		url: "admin-approval?lead=" + leadId + "&rejectStatus=" + id,
		success: function(response) {
			if (response.code == "Success") {
				//getCrmNotifications();
				if (response.body == null) {
					showSnackbar("Rejected Successfully");
					 
				} else {
					console.log("Data For Convert To Next Step=====>",JSON.parse(response.body)[0]);
					convertLeadToNextStep(JSON.parse(response.body)[0]);
					showSnackbar("Approved Successfully");
					//let leadId = $("#leadId").val();
					$.ajax({
						type: "GET",
						url: "view-crm-leads-view-detail?id=" + leadId,
						success: function(response) {
							if (response.code == "Success") {
								$('#leadStatus').text(response.body[0].leadStatus);
							}
						}
					});
				}
				//var pages;
			    var pageno = 1;
			    var selectedRows = gridOptions.api.getSelectedRows();
				var selectedRow=selectedRows[0];
				var executiveId=selectedRow.key;
				agGrid.simpleHttpRequest({
					url: "view-crm-leads-view-Data?pageno=" + pageno + "&userId=" + executiveId,
				}).then(function(data) {
					if (data.code == "Success") {
						var resp = JSON.parse(data.body);
						var len = resp.length;
						$('#totalLead').find('span').html(len);
						leadgridOptions.api.setRowData(resp);

					} else {
						leadgridOptions.api.setRowData([])
					}

					$('.loader').hide();
				});
			}
		}
	});
}

function convertLeadToNextStep(data) {
	var obj = {};
	//var dealcheck = $("input:checkbox[name=dealcheck]:checked").val();
	obj.leadOwnerId = data.leadOwner
	obj.leadId = data.leadId
	obj.firstName = data.firstName
	obj.lastName = data.lastName
	obj.accountName = data.company
	obj.email = data.email
	obj.phone = data.phone
	obj.fax = data.projectId
	obj.website = data.website
	obj.title = data.title
	obj.mobile = data.mobile
	obj.skypeId = data.skypeId
	obj.secondaryEmail = data.secondaryEmail
	obj.twitter = data.twitter
	obj.description = data.description
	obj.referenceContact = data.referenceContact
	/*obj.dealcheck = dealcheck;
	 obj.dealAmount = $('#dealAmountCheck').val();
	obj.dealName = $('#dealNameCheck').val();
	obj.dealClosingDate = $('#dealClosingDateCheck').val();
	obj.dealStage = $('#dealStageCheck').val();
	obj.dealCampaignSource = $('#dealCampaignSource').val();
	obj.dealContactRole = $('#dealContactRole').val();
	obj.probability = $('#probability').val(); */

	console.log('converted data response--------------' + JSON.stringify(obj));

	var validation = true;

	$.ajax({
		type: "POST",
		url: "view-crm-leads-detail-converted",
		contentType: "application/json",
		data: JSON.stringify(obj),
		success: function(response) {
			if (response.message == "Success") {
                
				sessionStorage.setItem("contact_Id", response.body[0].contactId)
				sessionStorage.setItem("account_Id", response.body[0].contactId)

			}
		},
		error: function(data) {

			console.log(data);
		}
	})

}
</script>
</head>
