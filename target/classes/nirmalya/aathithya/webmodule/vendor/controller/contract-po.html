<script type="text/javascript">

		let headerTabs = "";
		$(document).ready(function () {

			$("#vendorsResponseLogs").attr("disabled", true);
			$("#approve").attr("disabled", true);
			$("#changeReq").attr("disabled", true);

			notificationUpdate();

			var gridDiv = document.querySelector('#contractPoGrid');
			new agGrid.Grid(gridDiv, allTenderGridOptions);

			allTenderGridOptions.api.setRowData([]);

			agGrid.simpleHttpRequest({
				url: 'contract-po-view-contract'
			}).then(function (response) {
				if (response.code === "Success") {
					const parsedResponse = JSON.parse(response.body);
					allTenderGridOptions.api.setRowData(parsedResponse);
				} else {
					allTenderGridOptions.api.setRowData([]);
				}
			});

			// Add an event listener to handle row selection
			allTenderGridOptions.api.addEventListener(
				'selectionChanged', onSelectionChanged);
		});

		var tenderGridDefs = [{
			headerName: "Contracts",

			children: [{
				headerCheckboxSelection: false,
				headerCheckboxSelectionFilteredOnly: true,
				checkboxSelection: true,
				sortable: false,
				filter: false,
				resizable: true,
				width: 20
			},

			{
				headerName: "Contract Id",
				field: "templateId",
				width: 200,
				cellRenderer: function (params) {
					return `<a onclick="tenderDetails(${params.rowIndex})" href="javascript:void(0)">
                    ${params.data.templateId}
                </a>`;
				}
			}, {
				headerName: "Vendors",
				field: "vendorId",
				width: 200,
				cellRenderer: function (params) {
					return `<a href="javascript:void(0)">
                    ${params.data.vendorId}
                </a>`;
				}
			}, {
				headerName: ' Tender Id',
				field: "tenderId"
			}, {
				headerName: "Contract Name",
				field: "contractname",
				width: 330
			}, {
				headerName: "Description",
				field: "contractDescript",
				width: 300
			}, {
				headerName: "Vendor Status",
				field: "vendorContractStatus",
				width: 200,
				//hide: true,
				cellRenderer: function (params) {
					const status = params.value;

					if (status === "Approved") {
						return `
			                <span title="Awarded" style="color: green; text-decoration: none; font-weight: 700;">
			                    <i class="fa fa-check-circle" aria-hidden="true" style="padding-right: 4px;"></i>Approved
			                </span>
			            `;
					} else if (status === "Change Request") {
						return `<a title="Change Requested" style="color: #ff7c05; text-decoration: none;">
			                <i class="fa fa-exclamation-circle" aria-hidden="true" style="padding-right: 4px;"></i>Change Request
			            </a>`;
					} else {
						return `<a title="Not Responded" style="color: #808080; text-decoration: none;">
			                <i class="fa fa-ellipsis-h" aria-hidden="true" style="padding-right: 4px;"></i>Not Responded
			            </a>`;
					}
				}
			}, {
				headerName: "CONTRACT CreatedBy",
				field: "createdBy",
				width: 200
			}, {
				headerName: "CONTRACT CreatedOn",
				field: "createdOn",
				width: 200
			}, {
				headerName: "Published Pdf",
				field: "publishPdf",
				width: 180,
				cellStyle: {
					textAlign: 'center'
				},
				cellRenderer: function (params) {
					const pdfUrl = params.value;
					if (pdfUrl && pdfUrl !== "null") {
						return `
                    <a href="${pdfUrl}" target="_blank" title="Open PDF">
                        <img src="../assets/images/pdf_demo.png" alt="PDF" style="width: 15px; height: 18px;"/>
                    </a>
                `;
					} else {
						return '';
					}
				}
			}]
		}];

		var allTenderGridOptions = {
			columnDefs: tenderGridDefs,
			rowSelection: 'single',
			groupSelectsChildren: true,
			suppressRowClickSelection: true,
			suppressAggFuncInHeader: true,
			pagination: true,
			paginationPageSize: 10,
			defaultColDef: {
				sortable: true,
				filter: true,
				resizable: true,
				width: 153
			},
			onGridReady: function (params) {
				window.gridApi = params.api;
			}
		};



		function tenderDetails(rowIndex) {
			gridApi.selectIndex(rowIndex, false, false);
		}

		var selectedId = "";
		function onSelectionChanged() {
		    var selectedRows = allTenderGridOptions.api.getSelectedRows();

		    if (selectedRows.length > 0) {
		        var status = selectedRows[0].vendorContractStatus;

		        if (status === 'Approved') {
		            $("#changeReq").attr("disabled", true);
		            $("#approve").attr("disabled", true);
		            $("#vendorsResponseLogs").attr("disabled", false);
		        } else {
		            $("#changeReq").attr("disabled", false);
		            $("#approve").attr("disabled", false);
		            $("#vendorsResponseLogs").attr("disabled", false);
		        }
		    } else {
		        $("#changeReq").attr("disabled", true);
		        $("#approve").attr("disabled", true);

		// Function to parse the date in 'dd-MM-yyyy hh:mm:ss a' format
		function parseDate(dateString) {
			const [datePart, timePart, period] = dateString.split(' ');
			const [day, month, year] = datePart.split('-').map(Number);
			let [hours, minutes, seconds] = timePart.split(':').map(Number);

			// Adjust hours for AM/PM
			if (period === 'PM' && hours < 12) {
				hours += 12; // Convert to 24-hour format
			} else if (period === 'AM' && hours === 12) {
				hours = 0; // Midnight case
			}

			// Return a new Date object
			return new Date(year, month - 1, day, hours, minutes, seconds);
		}

					contentType: "application/json",
					data: JSON.stringify({datas: datas}),
					success: function (response) {
						if (response.code == "Success") {
							viewLogs();
						} else {
							$("#messageParagraph").text(response.message);
							$("#msgOkModal").removeClass("btn3");
							$("#msgOkModal").addClass("btn1");
							$("#msgModal").modal('show');
						}
					},
					error: function (error) {
						console.error(error);
					}
				});
			}
		}
		
		function closeremarkModal(){
			$("#remarksModal").modal('hide');
		}
	</script>
</head>

<body>
	<div layout:fragment="content" class="maincontent">
		<div class="container-fluid">
			<div class="row">
				<div class="maincontentsec">
					<div class="content_padding">
						<input type="hidden" id="adminRoleId"
							th:value="${session.IS_ADMIN}" /> <input type="hidden"
							id="vendorRoleId" th:value="${session.IS_VENDOR}" />
						<div class="d-flex justify-content-between header-nav" id="tdiv">
							<div class="btn-hs">
								<div class="font-design" id="totalReq1">
									Contracts<span></span>
								</div>
							</div>
							<div id="searchRowDiv">
								<div class="input-style">
									<input type="text" placeholder="Search.." name="search"
										class="searchboxinput" onkeyup="cancelBar()"
										oninput="onQuickFilterChanged()" id="quickFilter"
										autocomplete="off">
									<div class="searchicon">
										<a href="javascript:void(0)"><span
											style="display: none; border-right: 1px solid #ccc; padding-right: 5px;"
											id="closeKey"
											onclick="templateSectionMainOptions.api.setQuickFilter(null);$('#quickFilter').val('');document.getElementById('closeKey').style.display='none';$('#totalReq').find('span').html(templateSectionMainOptions.api.getModel().getRowCount());"
											class="close_i"><i class="ti-close srchicon"></i></span></a><a
											href="javascript:void(0)"><i class="ti-search srchicon"></i></a>
									</div>
								</div>
							</div>
							<h2 class="buttonsec btn-hs hidden" id="ttbtn">Contract
								Finalization</h2>
							<div class="buttonsec btn-hs ">
								<button class="new-btn" id="vendorsResponseLogs"
									onclick="viewLogs()" style="width: 88px !important;">Logs</button>
								<button class="new-btn" id="changeReq" onclick="changeReq()"
									style="width: 88px !important;"
									th:if="${session.IS_VENDOR == 'rol030'}">Change Req</button>
								<button class="new-btn" id="approve" onclick="approve()"
									style="width: 88px !important;"
									th:if="${session.IS_VENDOR == 'rol030'}">Approve</button>



							</div>
						</div>

						<div id="contractPoGrid" class="ag-theme-alpine"
							style="height: 600px; width: 100%;"></div>

						<!-- Modal -->
						<div class="modal fade" id="remarksModal" tabindex="-1"
							role="dialog" aria-labelledby="remarkModalLabel"
							aria-hidden="true">
							<div class="modal-dialog" role="document">
								<div class="modal-content">
									<div class="modal-header">
										<h5 class="modal-title" id="remarkModalLabel"></h5>
										<button type="button" class="close" data-dismiss="modal"
											aria-label="Close">
											<span aria-hidden="true" onclick="closeremarkModal();">&times;</span>
										</button>
									</div>
									<div class="modal-body">
										<textarea rows="3" cols="5" placeholder="Enter Remarks"
											id="vendorRemarks"></textarea>
									</div>
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary"
											data-dismiss="modal" onclick="closeremarkModal();">Close</button>
										<button type="button" class="btn btn-primary"
											onclick="saveVendorResponse();">Save</button>
									</div>

								</div>
							</div>
						</div>


						<!-- Section Modal -->
						<div class="modal fade" id="vendorTimeline" tabindex="-1"
							aria-labelledby="exampleModalLabel" aria-hidden="true">
							<div class="modal-dialog modal-xxl">
								<div class="modal-content">
									<div class="modal-header">
										<h5 class="modal-title" id="exampleModalLabel">Vendors
											Contract Log</h5>
										<input type="hidden" id="tenderId">
										<button type="button" class="btn-close"
											data-bs-dismiss="modal" aria-label="Close"></button>
									</div>
									<div class="modal-body mb-scroll"
										style="background-color: #f7f7f7;">

										<div class="container-fluid" id="vendorResponse">
											<div class="row">
												<div class="col-md-12">
													<div id="content" class="content content-full-width">
														<div class="profile-content">
															<div class="tab-content p-0">
																<div class="tab-pane fade active show" id="profile-post">
																	<ul class="timeline">
																	</ul>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>

									</div>
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary"
											data-bs-dismiss="modal">Close</button>
									</div>
								</div>
							</div>
						</div>

					</div>

				</div>
			</div>
		</div>
	</div>
	</div>
</body>

</html>
